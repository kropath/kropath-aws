---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kropathconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: KropathConfig
    listKind: KropathConfigList
    plural: kropathconfigs
    singular: kropathconfig
    shortNames:
      - kpc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # S3 field mutual-exclusivity: a field must not appear in both
            # mandatory.s3 and defaults.s3 simultaneously (ADR-015 §3.2).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3) &&
                  has(self.spec.mandatory.s3.encryptionAlgorithm) &&
                  self.spec.mandatory.s3.encryptionAlgorithm != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3) &&
                  has(self.spec.defaults.s3.encryptionAlgorithm) &&
                  self.spec.defaults.s3.encryptionAlgorithm != "")
              message: >-
                spec.mandatory.s3.encryptionAlgorithm and
                spec.defaults.s3.encryptionAlgorithm cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3) &&
                  has(self.spec.mandatory.s3.kmsKeyArn) &&
                  self.spec.mandatory.s3.kmsKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3) &&
                  has(self.spec.defaults.s3.kmsKeyArn) &&
                  self.spec.defaults.s3.kmsKeyArn != "")
              message: >-
                spec.mandatory.s3.kmsKeyArn and
                spec.defaults.s3.kmsKeyArn cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3) &&
                  has(self.spec.mandatory.s3.blockPublicAccess) &&
                  self.spec.mandatory.s3.blockPublicAccess == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3) &&
                  has(self.spec.defaults.s3.blockPublicAccess) &&
                  self.spec.defaults.s3.blockPublicAccess == true)
              message: >-
                spec.mandatory.s3.blockPublicAccess and
                spec.defaults.s3.blockPublicAccess cannot both be true.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3) &&
                  has(self.spec.mandatory.s3.versioning) &&
                  self.spec.mandatory.s3.versioning != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3) &&
                  has(self.spec.defaults.s3.versioning) &&
                  self.spec.defaults.s3.versioning != "")
              message: >-
                spec.mandatory.s3.versioning and
                spec.defaults.s3.versioning cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3) &&
                  has(self.spec.mandatory.s3.loggingEnabled) &&
                  self.spec.mandatory.s3.loggingEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3) &&
                  has(self.spec.defaults.s3.loggingEnabled) &&
                  self.spec.defaults.s3.loggingEnabled == true)
              message: >-
                spec.mandatory.s3.loggingEnabled and
                spec.defaults.s3.loggingEnabled cannot both be true.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3) &&
                  has(self.spec.mandatory.s3.logDeliveryBucket) &&
                  self.spec.mandatory.s3.logDeliveryBucket != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3) &&
                  has(self.spec.defaults.s3.logDeliveryBucket) &&
                  self.spec.defaults.s3.logDeliveryBucket != "")
              message: >-
                spec.mandatory.s3.logDeliveryBucket and
                spec.defaults.s3.logDeliveryBucket cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3) &&
                  has(self.spec.mandatory.s3.enforceHttpsOnly) &&
                  self.spec.mandatory.s3.enforceHttpsOnly == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3) &&
                  has(self.spec.defaults.s3.enforceHttpsOnly) &&
                  self.spec.defaults.s3.enforceHttpsOnly == true)
              message: >-
                spec.mandatory.s3.enforceHttpsOnly and
                spec.defaults.s3.enforceHttpsOnly cannot both be true.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3) &&
                  has(self.spec.mandatory.s3.objectLockMode) &&
                  self.spec.mandatory.s3.objectLockMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3) &&
                  has(self.spec.defaults.s3.objectLockMode) &&
                  self.spec.defaults.s3.objectLockMode != "")
              message: >-
                spec.mandatory.s3.objectLockMode and
                spec.defaults.s3.objectLockMode cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3) &&
                  has(self.spec.mandatory.s3.objectLockRetentionDays) &&
                  self.spec.mandatory.s3.objectLockRetentionDays != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3) &&
                  has(self.spec.defaults.s3.objectLockRetentionDays) &&
                  self.spec.defaults.s3.objectLockRetentionDays != 0)
              message: >-
                spec.mandatory.s3.objectLockRetentionDays and
                spec.defaults.s3.objectLockRetentionDays cannot both be set.
                Set the field in exactly one tier.
            # KMS field mutual-exclusivity: a field must not appear in both
            # mandatory.kms and defaults.kms simultaneously (ADR-015 §3.2).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kms) &&
                  has(self.spec.mandatory.kms.enableKeyRotation) &&
                  self.spec.mandatory.kms.enableKeyRotation == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.kms) &&
                  has(self.spec.defaults.kms.enableKeyRotation) &&
                  self.spec.defaults.kms.enableKeyRotation == true)
              message: >-
                spec.mandatory.kms.enableKeyRotation and
                spec.defaults.kms.enableKeyRotation cannot both be true.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kms) &&
                  has(self.spec.mandatory.kms.allowedKeySpecs) &&
                  size(self.spec.mandatory.kms.allowedKeySpecs) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.kms) &&
                  has(self.spec.defaults.kms.allowedKeySpecs) &&
                  size(self.spec.defaults.kms.allowedKeySpecs) > 0)
              message: >-
                spec.mandatory.kms.allowedKeySpecs and
                spec.defaults.kms.allowedKeySpecs cannot both be set.
                Set the field in exactly one tier.
            # IAM field mutual-exclusivity: a field must not appear in both
            # mandatory.iam and defaults.iam simultaneously (ADR-015 §3.2).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.iam) &&
                  has(self.spec.mandatory.iam.permissionsBoundaryArn) &&
                  self.spec.mandatory.iam.permissionsBoundaryArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.iam) &&
                  has(self.spec.defaults.iam.permissionsBoundaryArn) &&
                  self.spec.defaults.iam.permissionsBoundaryArn != "")
              message: >-
                spec.mandatory.iam.permissionsBoundaryArn and
                spec.defaults.iam.permissionsBoundaryArn cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.iam) &&
                  has(self.spec.mandatory.iam.blockIamUserAccessKeys) &&
                  self.spec.mandatory.iam.blockIamUserAccessKeys == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.iam) &&
                  has(self.spec.defaults.iam.blockIamUserAccessKeys) &&
                  self.spec.defaults.iam.blockIamUserAccessKeys == true)
              message: >-
                spec.mandatory.iam.blockIamUserAccessKeys and
                spec.defaults.iam.blockIamUserAccessKeys cannot both be true.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.iam) &&
                  has(self.spec.mandatory.iam.maxSessionDurationSeconds) &&
                  self.spec.mandatory.iam.maxSessionDurationSeconds != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.iam) &&
                  has(self.spec.defaults.iam.maxSessionDurationSeconds) &&
                  self.spec.defaults.iam.maxSessionDurationSeconds != 0)
              message: >-
                spec.mandatory.iam.maxSessionDurationSeconds and
                spec.defaults.iam.maxSessionDurationSeconds cannot both be non-zero.
                Set the field in exactly one tier.
            # SQS field mutual-exclusivity: a field must not appear in both
            # mandatory.sqs and defaults.sqs simultaneously (ADR-015 §3.2).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sqs) &&
                  has(self.spec.mandatory.sqs.encryptionType) &&
                  self.spec.mandatory.sqs.encryptionType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.sqs) &&
                  has(self.spec.defaults.sqs.encryptionType) &&
                  self.spec.defaults.sqs.encryptionType != "")
              message: >-
                spec.mandatory.sqs.encryptionType and
                spec.defaults.sqs.encryptionType cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sqs) &&
                  has(self.spec.mandatory.sqs.kmsMasterKeyId) &&
                  self.spec.mandatory.sqs.kmsMasterKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.sqs) &&
                  has(self.spec.defaults.sqs.kmsMasterKeyId) &&
                  self.spec.defaults.sqs.kmsMasterKeyId != "")
              message: >-
                spec.mandatory.sqs.kmsMasterKeyId and
                spec.defaults.sqs.kmsMasterKeyId cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sqs) &&
                  has(self.spec.mandatory.sqs.visibilityTimeout) &&
                  self.spec.mandatory.sqs.visibilityTimeout != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.sqs) &&
                  has(self.spec.defaults.sqs.visibilityTimeout) &&
                  self.spec.defaults.sqs.visibilityTimeout != 0)
              message: >-
                spec.mandatory.sqs.visibilityTimeout and
                spec.defaults.sqs.visibilityTimeout cannot both be non-zero.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sqs) &&
                  has(self.spec.mandatory.sqs.messageRetentionPeriod) &&
                  self.spec.mandatory.sqs.messageRetentionPeriod != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.sqs) &&
                  has(self.spec.defaults.sqs.messageRetentionPeriod) &&
                  self.spec.defaults.sqs.messageRetentionPeriod != 0)
              message: >-
                spec.mandatory.sqs.messageRetentionPeriod and
                spec.defaults.sqs.messageRetentionPeriod cannot both be non-zero.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sqs) &&
                  has(self.spec.mandatory.sqs.delaySeconds) &&
                  self.spec.mandatory.sqs.delaySeconds != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.sqs) &&
                  has(self.spec.defaults.sqs.delaySeconds) &&
                  self.spec.defaults.sqs.delaySeconds != 0)
              message: >-
                spec.mandatory.sqs.delaySeconds and
                spec.defaults.sqs.delaySeconds cannot both be non-zero.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sqs) &&
                  has(self.spec.mandatory.sqs.maximumMessageSize) &&
                  self.spec.mandatory.sqs.maximumMessageSize != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.sqs) &&
                  has(self.spec.defaults.sqs.maximumMessageSize) &&
                  self.spec.defaults.sqs.maximumMessageSize != 0)
              message: >-
                spec.mandatory.sqs.maximumMessageSize and
                spec.defaults.sqs.maximumMessageSize cannot both be non-zero.
                Set the field in exactly one tier.
            # SecretsManager field mutual-exclusivity: kmsKeyID must not appear in both
            # mandatory.secretsManager and defaults.secretsManager simultaneously (ADR-015 §3.2).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.secretsManager) &&
                  has(self.spec.mandatory.secretsManager.kmsKeyID) &&
                  self.spec.mandatory.secretsManager.kmsKeyID != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.secretsManager) &&
                  has(self.spec.defaults.secretsManager.kmsKeyID) &&
                  self.spec.defaults.secretsManager.kmsKeyID != "")
              message: >-
                spec.mandatory.secretsManager.kmsKeyID and
                spec.defaults.secretsManager.kmsKeyID cannot both be set.
                Set the field in exactly one tier.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory governance fields. Values here override defaults and instance
                    spec values. Zero-value means no mandatory constraint is enforced.
                  properties:
                    tags:
                      type: object
                      default: {}
                      description: Cloud resource tags applied to all resources.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to child resource metadata.labels (kropath.run/ prefix)
                        and to cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to child resource metadata.annotations
                        (kropath.run/ prefix).
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Naming template for cloud resource names. Uses {namespace}, {name},
                        {kind} placeholders. Empty string = no org-wide mandatory template.
                    iam:
                      type: object
                      default: {}
                      description: >-
                        IAM-family governance fields applied across all IAM resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          default: ""
                          description: >-
                            ARN of the IAM permissions boundary policy to attach to all IAM roles
                            and users. Empty string = no mandatory boundary enforced.
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                          description: >-
                            When true, blocks creation of IAM user access keys regardless of
                            instance spec. false (zero value) = not enforced.
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Maximum IAM role session duration in seconds. Clamps instance values
                            above this limit. 0 (zero value) = no mandatory cap enforced.
                    kms:
                      type: object
                      default: {}
                      description: >-
                        KMS-family governance fields applied across all KMS resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        enableKeyRotation:
                          type: boolean
                          default: false
                          description: >-
                            When true, org-wide rotation enforcement is enabled. false = not enforced.
                        allowedKeySpecs:
                          type: array
                          default: []
                          description: >-
                            Org-wide allowlist of permitted KMS key specs. Empty list = no restriction.
                          items:
                            type: string
                    s3:
                      type: object
                      default: {}
                      description: >-
                        S3-family governance fields applied across all S3 resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        encryptionAlgorithm:
                          type: string
                          default: ""
                          description: >-
                            S3 encryption algorithm. Empty string = no mandatory enforcement.
                        kmsKeyArn:
                          type: string
                          default: ""
                          description: >-
                            KMS key ARN for S3 encryption. Empty string = no mandatory enforcement.
                        blockPublicAccess:
                          type: boolean
                          default: false
                          description: >-
                            When true, blocks public access regardless of instance spec.
                        versioning:
                          type: string
                          default: ""
                          description: >-
                            S3 versioning state. Empty string = no mandatory enforcement.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: >-
                            When true, enables server access logging regardless of instance spec.
                        logDeliveryBucket:
                          type: string
                          default: ""
                          description: >-
                            Target bucket for server access logs. Empty string = no enforcement.
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                          description: >-
                            When true, requires TLS for bucket access regardless of instance spec.
                        objectLockMode:
                          type: string
                          default: ""
                          description: >-
                            S3 object lock mode. Empty string = no mandatory enforcement.
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            S3 object lock retention period in days. 0 = no mandatory enforcement.
                    sqs:
                      type: object
                      default: {}
                      description: >-
                        SQS-family governance fields applied across all SQS resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        encryptionType:
                          type: string
                          default: ""
                          description: >-
                            Org-wide SQS encryption type enforcement. Empty string = no mandatory enforcement.
                            One of: "sqs-managed", "kms", "none".
                        kmsMasterKeyId:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory KMS key for all SQS queues. Empty string = no mandatory enforcement.
                        visibilityTimeout:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Org-wide hard ceiling for visibility timeout in seconds. 0 = no mandatory cap.
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 1209600
                          description: >-
                            Org-wide hard ceiling for message retention period in seconds. 0 = no mandatory cap.
                        delaySeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 900
                          description: >-
                            Org-wide hard ceiling for message delivery delay in seconds. 0 = no mandatory cap.
                        maximumMessageSize:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 262144
                          description: >-
                            Org-wide hard ceiling for maximum message size in bytes. 0 = no mandatory cap.
                    secretsManager:
                      type: object
                      default: {}
                      description: >-
                        SecretsManager-family governance fields applied across all Secrets Manager
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). Only kmsKeyID is governed at this level; operational
                        fields (replicaRegions, forceOverwriteReplicaSecret, namingTemplate) are
                        not governed at the KropathConfig level.
                      properties:
                        kmsKeyID:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory KMS key ID, ARN, or alias for all Secrets Manager
                            secrets. Empty string = no mandatory encryption key enforced.
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default governance fields. Applied when no higher-priority source sets the field.
                    Zero-value means no default is provided at this level.
                  properties:
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template when no mandatory template is set.
                    iam:
                      type: object
                      default: {}
                      description: >-
                        Default IAM-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          default: ""
                          description: >-
                            Default permissions boundary ARN. Used when no mandatory source
                            sets this field. Empty string = no default boundary.
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                          description: >-
                            Default block for IAM user access key creation. Used when no
                            mandatory source sets this field.
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Default maximum IAM role session duration in seconds. 0 = no default.
                    kms:
                      type: object
                      default: {}
                      description: >-
                        Default KMS-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        enableKeyRotation:
                          type: boolean
                          default: false
                          description: Default KMS rotation enforcement toggle.
                        allowedKeySpecs:
                          type: array
                          default: []
                          description: Default KMS key spec allowlist.
                          items:
                            type: string
                    s3:
                      type: object
                      default: {}
                      description: >-
                        Default S3-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        encryptionAlgorithm:
                          type: string
                          default: ""
                          description: Default S3 encryption algorithm.
                        kmsKeyArn:
                          type: string
                          default: ""
                          description: Default KMS key ARN for S3 encryption.
                        blockPublicAccess:
                          type: boolean
                          default: false
                          description: Default block-public-access setting.
                        versioning:
                          type: string
                          default: ""
                          description: Default S3 versioning state.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: Default server access logging setting.
                        logDeliveryBucket:
                          type: string
                          default: ""
                          description: Default server access log target bucket.
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                          description: Default HTTPS-only enforcement setting.
                        objectLockMode:
                          type: string
                          default: ""
                          description: Default object lock mode.
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: Default object lock retention days.
                    sqs:
                      type: object
                      default: {}
                      description: >-
                        Default SQS-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        encryptionType:
                          type: string
                          default: ""
                          description: >-
                            Default SQS encryption type. Empty string = no org-wide default.
                        kmsMasterKeyId:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key for SQS encryption. Empty string = no org-wide default.
                        visibilityTimeout:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Default visibility timeout in seconds. 0 = no org-wide default.
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 1209600
                          description: >-
                            Default message retention period in seconds. 0 = no org-wide default.
                        delaySeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 900
                          description: >-
                            Default message delivery delay in seconds. 0 = no org-wide default.
                        maximumMessageSize:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 262144
                          description: >-
                            Default maximum message size in bytes. 0 = no org-wide default.
                    secretsManager:
                      type: object
                      default: {}
                      description: >-
                        Default SecretsManager-family governance fields. Cascade levels 8-9 in
                        the ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        kmsKeyID:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key ID, ARN, or alias for Secrets Manager secrets.
                            Empty string = no org-wide default encryption key.
                aws:
                  type: object
                  default: {}
                  description: >-
                    AWS provider identity fields. Controller copies these into
                    effectiveConfig.aws.* on every namespaced ResourceConfig CR (ADR-015 §5.4).
                  properties:
                    accountId:
                      type: string
                      default: ""
                      description: AWS account ID (12-digit string).
                    region:
                      type: string
                      default: ""
                      description: AWS region identifier (e.g. us-east-1).
