                  has(self.spec.defaults) && has(self.spec.defaults.elb) &&
                  self.spec.defaults.elb.internalOnly == true)
              message: >-
                spec.mandatory.elb.internalOnly and
                spec.defaults.elb.internalOnly cannot both be true.
                Set the field in exactly one tier.
            # RDS field mutual-exclusivity: a field must not appear in both
            # mandatory.rds and defaults.rds simultaneously (ADR-015 §3.2).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.storageEncrypted) &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.storageEncrypted))
              message: >-
                spec.mandatory.rds.storageEncrypted and
                spec.defaults.rds.storageEncrypted cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.deletionProtection) &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.deletionProtection))
              message: >-
                spec.mandatory.rds.deletionProtection and
                spec.defaults.rds.deletionProtection cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.multiAZ) &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.multiAZ))
              message: >-
                spec.mandatory.rds.multiAZ and
                spec.defaults.rds.multiAZ cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.publiclyAccessible) &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.publiclyAccessible))
              message: >-
                spec.mandatory.rds.publiclyAccessible and
                spec.defaults.rds.publiclyAccessible cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.autoMinorVersionUpgrade) &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.autoMinorVersionUpgrade))
              message: >-
                spec.mandatory.rds.autoMinorVersionUpgrade and
                spec.defaults.rds.autoMinorVersionUpgrade cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.copyTagsToSnapshot) &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.copyTagsToSnapshot))
              message: >-
                spec.mandatory.rds.copyTagsToSnapshot and
                spec.defaults.rds.copyTagsToSnapshot cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.performanceInsightsEnabled) &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.performanceInsightsEnabled))
              message: >-
                spec.mandatory.rds.performanceInsightsEnabled and
                spec.defaults.rds.performanceInsightsEnabled cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.enableIAMDatabaseAuthentication) &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.enableIAMDatabaseAuthentication))
              message: >-
                spec.mandatory.rds.enableIAMDatabaseAuthentication and
                spec.defaults.rds.enableIAMDatabaseAuthentication cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.manageMasterUserPassword) &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.manageMasterUserPassword))
              message: >-
                spec.mandatory.rds.manageMasterUserPassword and
                spec.defaults.rds.manageMasterUserPassword cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.kmsKeyID) &&
                  self.spec.mandatory.rds.kmsKeyID != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.kmsKeyID) &&
                  self.spec.defaults.rds.kmsKeyID != "")
              message: >-
                spec.mandatory.rds.kmsKeyID and
                spec.defaults.rds.kmsKeyID cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.storageType) &&
                  self.spec.mandatory.rds.storageType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.storageType) &&
                  self.spec.defaults.rds.storageType != "")
              message: >-
                spec.mandatory.rds.storageType and
                spec.defaults.rds.storageType cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.namingTemplate) &&
                  self.spec.mandatory.rds.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.namingTemplate) &&
                  self.spec.defaults.rds.namingTemplate != "")
              message: >-
                spec.mandatory.rds.namingTemplate and
                spec.defaults.rds.namingTemplate cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rds) &&
                  has(self.spec.mandatory.rds.backupRetentionPeriod) &&
                  self.spec.mandatory.rds.backupRetentionPeriod != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.rds) &&
                  has(self.spec.defaults.rds.backupRetentionPeriod) &&
                  self.spec.defaults.rds.backupRetentionPeriod != 0)
              message: >-
                spec.mandatory.rds.backupRetentionPeriod and
                spec.defaults.rds.backupRetentionPeriod cannot both be non-zero.
                Set the field in exactly one tier.
            # Lambda field mutual-exclusivity: a field must not appear in both
            # mandatory.lambda and defaults.lambda simultaneously (ADR-015 §3.2).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.lambda) &&
                  has(self.spec.mandatory.lambda.runtime) &&
                  self.spec.mandatory.lambda.runtime != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.lambda) &&
                  has(self.spec.defaults.lambda.runtime) &&
                  self.spec.defaults.lambda.runtime != "")
              message: >-
                spec.mandatory.lambda.runtime and
                spec.defaults.lambda.runtime cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.lambda) &&
                  has(self.spec.mandatory.lambda.memorySize) &&
                  self.spec.mandatory.lambda.memorySize > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.lambda) &&
                  has(self.spec.defaults.lambda.memorySize) &&
                  self.spec.defaults.lambda.memorySize > 0)
              message: >-
                spec.mandatory.lambda.memorySize and
                spec.defaults.lambda.memorySize cannot both be non-zero.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.lambda) &&
                  has(self.spec.mandatory.lambda.timeout) &&
                  self.spec.mandatory.lambda.timeout > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.lambda) &&
                  has(self.spec.defaults.lambda.timeout) &&
                  self.spec.defaults.lambda.timeout > 0)
              message: >-
                spec.mandatory.lambda.timeout and
                spec.defaults.lambda.timeout cannot both be non-zero.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.lambda) &&
                  has(self.spec.mandatory.lambda.tracingMode) &&
                  self.spec.mandatory.lambda.tracingMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.lambda) &&
                  has(self.spec.defaults.lambda.tracingMode) &&
                  self.spec.defaults.lambda.tracingMode != "")
              message: >-
                spec.mandatory.lambda.tracingMode and
                spec.defaults.lambda.tracingMode cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.lambda) &&
                  has(self.spec.mandatory.lambda.kmsKeyArn) &&
                  self.spec.mandatory.lambda.kmsKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.lambda) &&
                  has(self.spec.defaults.lambda.kmsKeyArn) &&
                  self.spec.defaults.lambda.kmsKeyArn != "")
              message: >-
                spec.mandatory.lambda.kmsKeyArn and
                spec.defaults.lambda.kmsKeyArn cannot both be set.
                Set the field in exactly one tier.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory governance fields. Values here override defaults and instance
                    spec values. Zero-value means no mandatory constraint is enforced.
                  properties:
                    tags:
                      type: object
                      default: {}
                      description: Cloud resource tags applied to all resources.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to child resource metadata.labels (kropath.run/ prefix)
                        and to cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to child resource metadata.annotations
                        (kropath.run/ prefix).
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Naming template for cloud resource names. Uses {namespace}, {name},
                        {kind} placeholders. Empty string = no org-wide mandatory template.
                    iam:
                      type: object
                      default: {}
                      description: >-
                        IAM-family governance fields applied across all IAM resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          default: ""
                          description: >-
                            ARN of the IAM permissions boundary policy to attach to all IAM roles
                            and users. Empty string = no mandatory boundary enforced.
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                          description: >-
                            When true, blocks creation of IAM user access keys regardless of
                            instance spec. false (zero value) = not enforced.
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Maximum IAM role session duration in seconds. Clamps instance values
                            above this limit. 0 (zero value) = no mandatory cap enforced.
                    kms:
                      type: object
                      default: {}
                      description: >-
                        KMS-family governance fields applied across all KMS resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        enableKeyRotation:
                          type: boolean
                          default: false
                          description: >-
                            When true, org-wide rotation enforcement is enabled. false = not enforced.
                        allowedKeySpecs:
                          type: array
                          default: []
                          description: >-
                            Org-wide allowlist of permitted KMS key specs. Empty list = no restriction.
                          items:
                            type: string
                    s3:
                      type: object
                      default: {}
                      description: >-
                        S3-family governance fields applied across all S3 resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        encryptionAlgorithm:
                          type: string
                          default: ""
                          description: >-
                            S3 encryption algorithm. Empty string = no mandatory enforcement.
                        kmsKeyArn:
                          type: string
                          default: ""
                          description: >-
                            KMS key ARN for S3 encryption. Empty string = no mandatory enforcement.
                        blockPublicAccess:
                          type: boolean
                          default: false
                          description: >-
                            When true, blocks public access regardless of instance spec.
                        versioning:
                          type: string
                          default: ""
                          description: >-
                            S3 versioning state. Empty string = no mandatory enforcement.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: >-
                            When true, enables server access logging regardless of instance spec.
                        logDeliveryBucket:
                          type: string
                          default: ""
                          description: >-
                            Target bucket for server access logs. Empty string = no enforcement.
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                          description: >-
                            When true, requires TLS for bucket access regardless of instance spec.
                        objectLockMode:
                          type: string
                          default: ""
                          description: >-
                            S3 object lock mode. Empty string = no mandatory enforcement.
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            S3 object lock retention period in days. 0 = no mandatory enforcement.
                    sqs:
                      type: object
                      default: {}
                      description: >-
                        SQS-family governance fields applied across all SQS resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        encryptionType:
                          type: string
                          default: ""
                          description: >-
                            Org-wide SQS encryption type enforcement. Empty string = no mandatory enforcement.
                            One of: "sqs-managed", "kms", "none".
                        kmsMasterKeyId:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory KMS key for all SQS queues. Empty string = no mandatory enforcement.
                        visibilityTimeout:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Org-wide hard ceiling for visibility timeout in seconds. 0 = no mandatory cap.
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 1209600
                          description: >-
                            Org-wide hard ceiling for message retention period in seconds. 0 = no mandatory cap.
                        delaySeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 900
                          description: >-
                            Org-wide hard ceiling for message delivery delay in seconds. 0 = no mandatory cap.
                        maximumMessageSize:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 262144
                          description: >-
                            Org-wide hard ceiling for maximum message size in bytes. 0 = no mandatory cap.
                    secretsManager:
                      type: object
                      default: {}
                      description: >-
                        SecretsManager-family governance fields applied across all Secrets Manager
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). Only kmsKeyID is governed at this level; operational
                        fields (replicaRegions, forceOverwriteReplicaSecret, namingTemplate) are
                        not governed at the KropathConfig level.
                      properties:
                        kmsKeyID:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory KMS key ID, ARN, or alias for all Secrets Manager
                            secrets. Empty string = no mandatory encryption key enforced.
                    sns:
                      type: object
                      default: {}
                      description: >-
                        SNS-family governance fields applied at the org-wide mandatory tier.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                        Only kmsMasterKeyId, signatureVersion, and tracingConfig are governed
                        at the KropathConfig level; topic-specific fields are not.
                      properties:
                        kmsMasterKeyId:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory KMS key ID or ARN for SNS topic SSE.
                            Empty string = no mandatory encryption key enforced.
                        signatureVersion:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory SNS message signature version ("1" or "2").
                            Empty string = not enforced.
                        tracingConfig:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory SNS X-Ray active tracing mode ("Active" or "PassThrough").
                            Empty string = not enforced.
                    dynamodb:
                      type: object
                      default: {}
                      description: >-
                        DynamoDB-family governance fields at the org-wide mandatory tier.
                        Cascade levels 1-2 (ADR-015 §5.3). namingTemplate, syncedLabels,
                        syncedAnnotations are DynamoDBConfig-only fields.
                      properties:
                        encryptionEnabled:
                          type: boolean
                          description: >-
                            Org-wide mandatory SSE enforcement. Omit (nil) = not enforced;
                            false = explicitly disabled. No default — nil detection required.
                        kmsMasterKeyId:
                          type: string
                          default: ""
                          description: Org-wide mandatory KMS key ARN/ID. Empty = not enforced.
                        deletionProtectionEnabled:
                          type: boolean
                          description: Org-wide mandatory deletion-protection. Omit (nil) = not enforced.
                        pointInTimeRecoveryEnabled:
                          type: boolean
                          description: Org-wide mandatory PITR enforcement. Omit (nil) = not enforced.
                        billingMode:
                          type: string
                          default: ""
                          enum: ["", "PROVISIONED", "PAY_PER_REQUEST"]
                          description: Org-wide mandatory billing mode. Empty = not enforced.
                        tableClass:
                          type: string
                          default: ""
                          enum: ["", "STANDARD", "STANDARD_INFREQUENT_ACCESS"]
                          description: Org-wide mandatory table class. Empty = not enforced.
                        contributorInsights:
                          type: string
                          default: ""
                          enum: ["", "ENABLE", "DISABLE"]
                          description: Org-wide mandatory Contributor Insights action. Empty = not enforced.
                    eventbridge:
                      type: object
                      default: {}
                      description: >-
                        EventBridge-family governance fields applied across all EventBridge resource
                        types. Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                        namingTemplate, syncedLabels, and syncedAnnotations are EventBridgeConfig-only.
                      properties:
                        archiveRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Org-wide mandatory minimum archive retention in days. 0 = not enforced.
                            When non-zero, no EventBridge archive may use a shorter retention period.
                    cloudwatchlogs:
                      type: object
                      default: {}
                      description: >-
                        CloudWatch Logs-family governance fields applied across all CloudWatch Logs
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). namingTemplate, syncedLabels, and syncedAnnotations are
                        CloudWatchLogsConfig-only.
                      properties:
                        kmsKeyId:
                          type: string
                          default: ""
                          description: >-
                            Org-wide encryption enforcement. Full KMS key ARN (no AWS-managed
                            service key alias for CloudWatch Logs). Empty string = not enforced.
                        retentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Org-wide mandatory retention period in days. 0 = not enforced;
                            first-non-zero-wins in cascade. Must be one of the CloudWatch Logs
                            allowed retention values when non-zero.
                    cloudfront:
                      type: object
                      default: {}
                      description: >-
                        CloudFront-family mandatory governance fields applied across all CloudFront
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). Only 4 fields are promoted to KropathConfig blanket
                        governance: viewerProtocolPolicy, minimumProtocolVersion, webACLRequired,
                        loggingEnabled. The remaining CloudFront-specific fields (httpVersion,
                        sslSupportMethod, loggingBucket, priceClass, geoRestrictionType,
                        oacSigningBehavior, namingTemplate) live only in CloudFrontConfig profiles.
                      properties:
                        viewerProtocolPolicy:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory viewer protocol policy enforcement.
                            Empty string = not enforced; "https-only" | "redirect-to-https".
                        minimumProtocolVersion:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory minimum TLS version for HTTPS connections.
                            Empty string = not enforced; e.g. "TLSv1.2_2021".
                        webACLRequired:
                          type: boolean
                          default: false
                          description: >-
                            Enforces WAF association on all CloudFront distributions org-wide
                            when true. false (zero value) = not enforced.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Enforces access logging on all CloudFront distributions org-wide
                            when true. false (zero value) = not enforced.
                    elb:
                      type: object
                      default: {}
                      description: >-
                        ELB-family mandatory governance fields. Cascade levels 1-2 in the
                        ten-level priority chain (ADR-015 §5.3). Only the three cross-type ELB
                        boolean fields live here; fields specific to ELBConfig
                        (accessLogsS3Bucket, crossZoneEnabled, idleTimeoutSeconds, sslPolicy,
                        namingTemplate, syncedLabels, syncedAnnotations) are not in KropathConfig.
                      properties:
                        deletionProtection:
                          type: boolean
                          default: false
                          description: >-
                            Enforces deletion protection on all ELBs org-wide when true.
                            false (zero value) = not enforced.
                        accessLogsEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Enforces access logging for all ELBs org-wide when true.
                            false (zero value) = not enforced.
                        internalOnly:
                          type: boolean
                          default: false
                          description: >-
                            Forces all ELBs to use internal scheme org-wide when true.
                            false (zero value) = not enforced (both schemes allowed).
                    rds:
                      type: object
                      default: {}
                      description: >-
                        RDS-family mandatory governance fields. Cascade levels 1-2 in the
                        nine-level priority chain (ADR-015 §5.3). Cluster-only fields
                        (serverlessV2ScalingMinCapacity, serverlessV2ScalingMaxCapacity,
                        backtrackWindow) are not in KropathConfig — use RDSConfig for those.
                        namingTemplate, syncedLabels, and syncedAnnotations are RDSConfig-only.
                      properties:
                        storageEncrypted:
                          type: boolean
                          description: >-
                            Force encryption at rest on all RDS instances/clusters org-wide.
                            Omit (nil) = not enforced; false = explicitly disabled.
                            No default — nil (*bool) detection required.
                        kmsKeyID:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory KMS key ARN for RDS encryption. Empty = not enforced.
                        deletionProtection:
                          type: boolean
                          description: >-
                            Force deletion protection on all RDS instances/clusters org-wide.
                            Omit (nil) = not enforced.
                        backupRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Org-wide mandatory backup retention floor in days. 0 = not enforced.
                            Minimum-floor semantics: max(mandatory, instance) applied in RGD CEL.
                        multiAZ:
                          type: boolean
                          description: >-
                            Force Multi-AZ deployment on all RDS instances org-wide.
                            Omit (nil) = not enforced.
                        publiclyAccessible:
                          type: boolean
                          description: >-
                            Control public endpoint exposure org-wide. Omit (nil) = not enforced;
                            false (explicit pointer) = forced private-only across all instances.
                        storageType:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory storage type (e.g. "gp3", "io1"). Empty = not enforced.
                        autoMinorVersionUpgrade:
                          type: boolean
                          description: >-
                            Force auto minor version upgrades org-wide. Omit (nil) = not enforced.
                        copyTagsToSnapshot:
                          type: boolean
                          description: >-
                            Force tag copying to snapshots org-wide. Omit (nil) = not enforced.
                        performanceInsightsEnabled:
                          type: boolean
                          description: >-
                            Force Performance Insights on org-wide. Omit (nil) = not enforced.
                        enableIAMDatabaseAuthentication:
                          type: boolean
                          description: >-
                            Force IAM database authentication org-wide. Omit (nil) = not enforced.
                        manageMasterUserPassword:
                          type: boolean
                          description: >-
                            Force Secrets Manager password management org-wide. Omit (nil) = not enforced.
                        namingTemplate:
                          type: string
                          default: ""
                          description: >-
                            Org-wide RDS naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                        tags:
                          type: object
                          default: {}
                          description: Mandatory cloud resource tags applied to all RDS resources.
                          additionalProperties:
                            type: string
                    lambda:
                      type: object
                      default: {}
                      description: >-
                        Lambda-family mandatory governance fields applied across all Lambda
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). namingTemplate, syncedLabels, and syncedAnnotations are
                        LambdaConfig-only.
                      properties:
                        runtime:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory Lambda runtime enforcement (e.g. "python3.12").
                            Empty string = not enforced; instances cannot override when set.
                        memorySize:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Org-wide hard memory ceiling in MB. 0 = not enforced;
                            positive value = maximum memorySize for all functions in scope.
                        timeout:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Org-wide hard execution timeout ceiling in seconds. 0 = not enforced;
                            positive value = maximum timeout for all functions in scope.
                        tracingMode:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory AWS X-Ray tracing mode enforcement.
                            Empty string = not enforced; "PassThrough" | "Active".
                        kmsKeyArn:
                          type: string
                          default: ""
                          description: >-
                            Org-wide mandatory KMS key ARN for Lambda environment variable encryption.
                            Empty string = not enforced; instances cannot use a different key when set.

                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default governance fields. Applied when no higher-priority source sets the field.
                    Zero-value means no default is provided at this level.
                  properties:
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template when no mandatory template is set.
                    iam:
                      type: object
                      default: {}
                      description: >-
                        Default IAM-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          default: ""
                          description: >-
                            Default permissions boundary ARN. Used when no mandatory source
                            sets this field. Empty string = no default boundary.
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                          description: >-
                            Default block for IAM user access key creation. Used when no
                            mandatory source sets this field.
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Default maximum IAM role session duration in seconds. 0 = no default.
                    kms:
                      type: object
                      default: {}
                      description: >-
                        Default KMS-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        enableKeyRotation:
                          type: boolean
                          default: false
                          description: Default KMS rotation enforcement toggle.
                        allowedKeySpecs:
                          type: array
                          default: []
                          description: Default KMS key spec allowlist.
                          items:
                            type: string
                    s3:
                      type: object
                      default: {}
                      description: >-
                        Default S3-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        encryptionAlgorithm:
                          type: string
                          default: ""
                          description: Default S3 encryption algorithm.
                        kmsKeyArn:
                          type: string
                          default: ""
                          description: Default KMS key ARN for S3 encryption.
                        blockPublicAccess:
                          type: boolean
                          default: false
                          description: Default block-public-access setting.
                        versioning:
                          type: string
                          default: ""
                          description: Default S3 versioning state.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: Default server access logging setting.
                        logDeliveryBucket:
                          type: string
                          default: ""
                          description: Default server access log target bucket.
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                          description: Default HTTPS-only enforcement setting.
                        objectLockMode:
                          type: string
                          default: ""
                          description: Default object lock mode.
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: Default object lock retention days.
                    sqs:
                      type: object
                      default: {}
                      description: >-
                        Default SQS-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        encryptionType:
                          type: string
                          default: ""
                          description: >-
                            Default SQS encryption type. Empty string = no org-wide default.
                        kmsMasterKeyId:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key for SQS encryption. Empty string = no org-wide default.
                        visibilityTimeout:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Default visibility timeout in seconds. 0 = no org-wide default.
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 1209600
                          description: >-
                            Default message retention period in seconds. 0 = no org-wide default.
                        delaySeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 900
                          description: >-
                            Default message delivery delay in seconds. 0 = no org-wide default.
                        maximumMessageSize:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 262144
                          description: >-
                            Default maximum message size in bytes. 0 = no org-wide default.
                    secretsManager:
                      type: object
                      default: {}
                      description: >-
                        Default SecretsManager-family governance fields. Cascade levels 8-9 in
                        the ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        kmsKeyID:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key ID, ARN, or alias for Secrets Manager secrets.
                            Empty string = no org-wide default encryption key.
                    sns:
                      type: object
                      default: {}
                      description: >-
                        Default SNS-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        kmsMasterKeyId:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key ID or ARN for SNS topic SSE.
                            Empty string = no org-wide default encryption key.
                        signatureVersion:
                          type: string
                          default: ""
                          description: >-
                            Default SNS message signature version ("1" or "2").
                            Empty string = no org-wide default.
                        tracingConfig:
                          type: string
                          default: ""
                          description: >-
                            Default SNS X-Ray active tracing mode ("Active" or "PassThrough").
                            Empty string = no org-wide default.
                    dynamodb:
                      type: object
                      default: {}
                      description: >-
                        Default DynamoDB-family governance fields. Cascade levels 8-9 (ADR-015 §5.3).
                        Applied only when no higher-priority source sets the field.
                      properties:
                        encryptionEnabled:
                          type: boolean
                          description: >-
                            Default SSE setting. Omit (nil) = no default; false = disabled by default.
                        kmsMasterKeyId:
                          type: string
                          default: ""
                          description: Default KMS key ARN/ID. Empty = no default.
                        deletionProtectionEnabled:
                          type: boolean
                          description: Default deletion-protection. Omit (nil) = no default.
                        pointInTimeRecoveryEnabled:
                          type: boolean
                          description: Default PITR. Omit (nil) = no default.
                        billingMode:
                          type: string
                          default: ""
                          enum: ["", "PROVISIONED", "PAY_PER_REQUEST"]
                          description: Default billing mode. Empty = no default.
                        tableClass:
                          type: string
                          default: ""
                          enum: ["", "STANDARD", "STANDARD_INFREQUENT_ACCESS"]
                          description: Default table class. Empty = no default.
                        contributorInsights:
                          type: string
                          default: ""
                          enum: ["", "ENABLE", "DISABLE"]
                          description: Default Contributor Insights action. Empty = no default.
                    eventbridge:
                      type: object
                      default: {}
                      description: >-
                        Default EventBridge-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        archiveRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Default archive retention in days. 0 = indefinite retention (no default
                            enforced). Applied when no mandatory source sets this field.
                    elb:
                      type: object
                      default: {}
                      description: >-
                        Default ELB-family governance fields. Cascade levels 8-9 (ADR-015 §5.3).
                        Only the three cross-type ELB boolean fields are governed here; fields
                        specific to ELBConfig (accessLogsS3Bucket, crossZoneEnabled, etc.) are
                        not in KropathConfig. Applied only when no higher-priority source sets
                        the field.
                      properties:
                        deletionProtection:
                          type: boolean
                          default: false
                          description: >-
                            Default deletion-protection preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        accessLogsEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default access-logging preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        internalOnly:
                          type: boolean
                          default: false
                          description: >-
                            Default scheme preference. false = both internal and internet-facing
                            are allowed. Applied when no mandatory source sets this field.
                    cloudwatchlogs:
                      type: object
                      default: {}
                      description: >-
                        Default CloudWatch Logs-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        kmsKeyId:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key ARN for log group encryption. Empty string = no
                            encryption default. Applied when no mandatory source sets this field.
                        retentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Default retention period in days. 0 = no default retention enforced.
                            Applied when no mandatory source sets this field.
                    cloudfront:
                      type: object
                      default: {}
                      description: >-
                        Default CloudFront-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        viewerProtocolPolicy:
                          type: string
                          default: ""
                          description: >-
                            Default viewer protocol policy. Empty string = no default enforcement.
                            Applied when no mandatory source sets this field.
                        minimumProtocolVersion:
                          type: string
                          default: ""
                          description: >-
                            Default minimum TLS version. Empty string = no default enforcement.
                            Applied when no mandatory source sets this field.
                        webACLRequired:
                          type: boolean
                          default: false
                          description: >-
                            Default WAF requirement preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default access-logging preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                    rds:
                      type: object
                      default: {}
                      description: >-
                        Default RDS-family governance fields. Cascade levels 8-9 (ADR-015 §5.3).
                        Applied only when no higher-priority source sets the field.
                        Cluster-only fields are not in KropathConfig — use RDSConfig for those.
                      properties:
                        storageEncrypted:
                          type: boolean
                          description: >-
                            Default encryption-at-rest setting. Omit (nil) = no default;
                            false = disabled by default. No default — nil detection required.
                        kmsKeyID:
                          type: string
                          default: ""
                          description: Default KMS key ARN for RDS encryption. Empty = no default.
                        deletionProtection:
                          type: boolean
                          description: Default deletion-protection setting. Omit (nil) = no default.
                        backupRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Default backup retention in days. 0 = no automated backups by default.
                        multiAZ:
                          type: boolean
                          description: Default Multi-AZ setting. Omit (nil) = no default.
                        publiclyAccessible:
                          type: boolean
                          description: Default public-accessibility setting. Omit (nil) = no default.
                        storageType:
                          type: string
                          default: ""
                          description: Default storage type. Empty = no default.
                        autoMinorVersionUpgrade:
                          type: boolean
                          description: Default auto-minor-version-upgrade setting. Omit (nil) = no default.
                        copyTagsToSnapshot:
                          type: boolean
                          description: Default copy-tags-to-snapshot setting. Omit (nil) = no default.
                        performanceInsightsEnabled:
                          type: boolean
                          description: Default Performance Insights setting. Omit (nil) = no default.
                        enableIAMDatabaseAuthentication:
                          type: boolean
                          description: Default IAM database authentication. Omit (nil) = no default.
                        manageMasterUserPassword:
                          type: boolean
                          description: Default Secrets Manager password management. Omit (nil) = no default.
                        namingTemplate:
                          type: string
                          default: ""
                          description: Default RDS naming template. Empty = no default.
                        tags:
                          type: object
                          default: {}
                          description: Default cloud resource tags for RDS resources.
                          additionalProperties:
                            type: string
                    lambda:
                      type: object
                      default: {}
                      description: >-
                        Lambda-family default governance fields. Applied when no higher-priority
                        source sets the field. Cascade levels 8-9 (ADR-015 §5.3).
                      properties:
                        runtime:
                          type: string
                          default: ""
                          description: Default Lambda runtime. Empty = no default runtime enforced.
                        memorySize:
                          type: integer
                          format: int64
                          default: 0
                          description: Default memory in MB. 0 = no default enforced.
                        timeout:
                          type: integer
                          format: int64
                          default: 0
                          description: Default execution timeout in seconds. 0 = no default enforced.
                        tracingMode:
                          type: string
                          default: ""
                          description: Default AWS X-Ray tracing mode. Empty = no default enforced.
                        kmsKeyArn:
                          type: string
                          default: ""
                          description: Default KMS key ARN for environment variable encryption. Empty = no default enforced.

                aws:
                  type: object
                  default: {}
                  description: >-
                    AWS provider identity fields. Controller copies these into
                    effectiveConfig.aws.* on every namespaced ResourceConfig CR (ADR-015 §5.4).
                  properties:
                    accountId:
                      type: string
                      default: ""
                      description: AWS account ID (12-digit string).
                    region:
                      type: string
                      default: ""
                      description: AWS region identifier (e.g. us-east-1).
