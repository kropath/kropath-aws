                  has(self.spec.defaults.sagemaker.instanceType) &&
                  self.spec.defaults.sagemaker.instanceType != "")
              message: >-
                spec.mandatory.sagemaker.instanceType and
                spec.defaults.sagemaker.instanceType cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sagemaker) &&
                  has(self.spec.mandatory.sagemaker.kmsKeyId) &&
                  self.spec.mandatory.sagemaker.kmsKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.sagemaker) &&
                  has(self.spec.defaults.sagemaker.kmsKeyId) &&
                  self.spec.defaults.sagemaker.kmsKeyId != "")
              message: >-
                spec.mandatory.sagemaker.kmsKeyId and
                spec.defaults.sagemaker.kmsKeyId cannot both be set.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sagemaker) &&
                  has(self.spec.mandatory.sagemaker.enableNetworkIsolation) &&
                  self.spec.mandatory.sagemaker.enableNetworkIsolation == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.sagemaker) &&
                  has(self.spec.defaults.sagemaker.enableNetworkIsolation) &&
                  self.spec.defaults.sagemaker.enableNetworkIsolation == true)
              message: >-
                spec.mandatory.sagemaker.enableNetworkIsolation and
                spec.defaults.sagemaker.enableNetworkIsolation cannot both be true.
                Set the field in exactly one tier.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sagemaker) &&
                  has(self.spec.mandatory.sagemaker.enableInterContainerTrafficEncryption) &&
                  self.spec.mandatory.sagemaker.enableInterContainerTrafficEncryption == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.sagemaker) &&
                  has(self.spec.defaults.sagemaker.enableInterContainerTrafficEncryption) &&
                  self.spec.defaults.sagemaker.enableInterContainerTrafficEncryption == true)
              message: >-
                spec.mandatory.sagemaker.enableInterContainerTrafficEncryption and
                spec.defaults.sagemaker.enableInterContainerTrafficEncryption cannot both be true.
                Set the field in exactly one tier.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory governance fields. Values here override defaults and instance
                    spec values. Zero-value means no mandatory constraint is enforced.
                  properties:
                    tags:
                      type: object
                      default: {}
                      description: Cloud resource tags applied to all resources.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to child resource metadata.labels (kropath.run/ prefix)
                        and to cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to child resource metadata.annotations
                        (kropath.run/ prefix).
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Naming template for cloud resource names. Uses {namespace}, {name},
                        {kind} placeholders. Empty string = no org-wide mandatory template.
                    iam:
                      type: object
                      default: {}
                      description: >-
                        IAM-family governance fields applied across all IAM resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          description: >-
                            ARN of the IAM permissions boundary policy to attach to all IAM roles
                            and users. Empty string = no mandatory boundary enforced.
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                          description: >-
                            When true, blocks creation of IAM user access keys regardless of
                            instance spec. false (zero value) = not enforced.
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Maximum IAM role session duration in seconds. Clamps instance values
                            above this limit. 0 (zero value) = no mandatory cap enforced.
                    kms:
                      type: object
                      default: {}
                      description: >-
                        KMS-family governance fields applied across all KMS resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        enableKeyRotation:
                          type: boolean
                          default: false
                          description: >-
                            When true, org-wide rotation enforcement is enabled. false = not enforced.
                        allowedKeySpecs:
                          type: array
                          description: >-
                            Org-wide allowlist of permitted KMS key specs. Empty list = no restriction.
                          items:
                            type: string
                    s3:
                      type: object
                      default: {}
                      description: >-
                        S3-family governance fields applied across all S3 resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        encryptionAlgorithm:
                          type: string
                          description: >-
                            S3 encryption algorithm. Empty string = no mandatory enforcement.
                        kmsKeyArn:
                          type: string
                          description: >-
                            KMS key ARN for S3 encryption. Empty string = no mandatory enforcement.
                        blockPublicAccess:
                          type: boolean
                          default: false
                          description: >-
                            When true, blocks public access regardless of instance spec.
                        versioning:
                          type: string
                          description: >-
                            S3 versioning state. Empty string = no mandatory enforcement.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: >-
                            When true, enables server access logging regardless of instance spec.
                        logDeliveryBucket:
                          type: string
                          description: >-
                            Target bucket for server access logs. Empty string = no enforcement.
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                          description: >-
                            When true, requires TLS for bucket access regardless of instance spec.
                        objectLockMode:
                          type: string
                          description: >-
                            S3 object lock mode. Empty string = no mandatory enforcement.
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            S3 object lock retention period in days. 0 = no mandatory enforcement.
                    sqs:
                      type: object
                      default: {}
                      description: >-
                        SQS-family governance fields applied across all SQS resource types.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                      properties:
                        encryptionType:
                          type: string
                          description: >-
                            Org-wide SQS encryption type enforcement. Empty string = no mandatory enforcement.
                            One of: "sqs-managed", "kms", "none".
                        kmsMasterKeyId:
                          type: string
                          description: >-
                            Org-wide mandatory KMS key for all SQS queues. Empty string = no mandatory enforcement.
                        visibilityTimeout:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Org-wide hard ceiling for visibility timeout in seconds. 0 = no mandatory cap.
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 1209600
                          description: >-
                            Org-wide hard ceiling for message retention period in seconds. 0 = no mandatory cap.
                        delaySeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 900
                          description: >-
                            Org-wide hard ceiling for message delivery delay in seconds. 0 = no mandatory cap.
                        maximumMessageSize:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 262144
                          description: >-
                            Org-wide hard ceiling for maximum message size in bytes. 0 = no mandatory cap.
                    secretsManager:
                      type: object
                      default: {}
                      description: >-
                        SecretsManager-family governance fields applied across all Secrets Manager
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). Only kmsKeyID is governed at this level; operational
                        fields (replicaRegions, forceOverwriteReplicaSecret, namingTemplate) are
                        not governed at the KropathConfig level.
                      properties:
                        kmsKeyID:
                          type: string
                          description: >-
                            Org-wide mandatory KMS key ID, ARN, or alias for all Secrets Manager
                            secrets. Empty string = no mandatory encryption key enforced.
                    sns:
                      type: object
                      default: {}
                      description: >-
                        SNS-family governance fields applied at the org-wide mandatory tier.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                        Only kmsMasterKeyId, signatureVersion, and tracingConfig are governed
                        at the KropathConfig level; topic-specific fields are not.
                      properties:
                        kmsMasterKeyId:
                          type: string
                          description: >-
                            Org-wide mandatory KMS key ID or ARN for SNS topic SSE.
                            Empty string = no mandatory encryption key enforced.
                        signatureVersion:
                          type: string
                          description: >-
                            Org-wide mandatory SNS message signature version ("1" or "2").
                            Empty string = not enforced.
                        tracingConfig:
                          type: string
                          description: >-
                            Org-wide mandatory SNS X-Ray active tracing mode ("Active" or "PassThrough").
                            Empty string = not enforced.
                    dynamodb:
                      type: object
                      default: {}
                      description: >-
                        DynamoDB-family governance fields at the org-wide mandatory tier.
                        Cascade levels 1-2 (ADR-015 §5.3). namingTemplate, syncedLabels,
                        syncedAnnotations are DynamoDBConfig-only fields.
                      properties:
                        encryptionEnabled:
                          type: boolean
                          description: >-
                            Org-wide mandatory SSE enforcement. Omit (nil) = not enforced;
                            false = explicitly disabled. No default — nil detection required.
                        kmsMasterKeyId:
                          type: string
                          description: Org-wide mandatory KMS key ARN/ID. Empty = not enforced.
                        deletionProtectionEnabled:
                          type: boolean
                          description: Org-wide mandatory deletion-protection. Omit (nil) = not enforced.
                        pointInTimeRecoveryEnabled:
                          type: boolean
                          description: Org-wide mandatory PITR enforcement. Omit (nil) = not enforced.
                        billingMode:
                          type: string
                          enum: ["", "PROVISIONED", "PAY_PER_REQUEST"]
                          description: Org-wide mandatory billing mode. Empty = not enforced.
                        tableClass:
                          type: string
                          enum: ["", "STANDARD", "STANDARD_INFREQUENT_ACCESS"]
                          description: Org-wide mandatory table class. Empty = not enforced.
                        contributorInsights:
                          type: string
                          enum: ["", "ENABLE", "DISABLE"]
                          description: Org-wide mandatory Contributor Insights action. Empty = not enforced.
                    eventbridge:
                      type: object
                      default: {}
                      description: >-
                        EventBridge-family governance fields applied across all EventBridge resource
                        types. Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                        namingTemplate, syncedLabels, and syncedAnnotations are EventBridgeConfig-only.
                      properties:
                        archiveRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Org-wide mandatory minimum archive retention in days. 0 = not enforced.
                            When non-zero, no EventBridge archive may use a shorter retention period.
                    cloudwatchlogs:
                      type: object
                      default: {}
                      description: >-
                        CloudWatch Logs-family governance fields applied across all CloudWatch Logs
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). namingTemplate, syncedLabels, and syncedAnnotations are
                        CloudWatchLogsConfig-only.
                      properties:
                        kmsKeyId:
                          type: string
                          description: >-
                            Org-wide encryption enforcement. Full KMS key ARN (no AWS-managed
                            service key alias for CloudWatch Logs). Empty string = not enforced.
                        retentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Org-wide mandatory retention period in days. 0 = not enforced;
                            first-non-zero-wins in cascade. Must be one of the CloudWatch Logs
                            allowed retention values when non-zero.
                    cloudtrail:
                      type: object
                      default: {}
                      description: >-
                        CloudTrail-family governance fields applied across all CloudTrail resource
                        types. Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                        namingTemplate, syncedLabels, and syncedAnnotations are
                        CloudTrailConfig-only.
                      properties:
                        isMultiRegionTrail:
                          type: boolean
                          description: >-
                            Org-wide enforcement of multi-region trail setting. false = not enforced;
                            true = all trails must be multi-region. First-true-wins in cascade.
                        enableLogFileValidation:
                          type: boolean
                          description: >-
                            Org-wide enforcement of log file integrity validation. false = not
                            enforced; true = all trails must enable validation. First-true-wins
                            in cascade.
                        retentionPeriod:
                          type: integer
                          format: int64
                          minimum: 0
                          description: >-
                            Org-wide minimum event data store retention in days. 0 = not enforced;
                            first-non-zero-wins in cascade.
                    cloudwatch:
                      type: object
                      default: {}
                      description: >-
                        CloudWatch-family governance fields applied across all CloudWatch
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). namingTemplate, syncedLabels, and syncedAnnotations are
                        CloudWatchConfig-only.
                      properties:
                        actionsEnabled:
                          type: boolean
                          nullable: true
                          description: >-
                            Org-wide enforcement of CloudWatch alarm actions. null = not enforced;
                            true/false = enforced value applied to all alarm instances.
                        treatMissingData:
                          type: string
                          description: >-
                            Org-wide enforcement of how missing data is treated in alarms.
                            Empty string = not enforced. Valid values: breaching, notBreaching,
                            ignore, missing.
                        outputFormat:
                          type: string
                          description: >-
                            Org-wide enforcement of CloudWatch metric stream output format.
                            Empty string = not enforced. Valid values: json, opentelemetry1.0,
                            opentelemetry0.7.
                        tags:
                          type: object
                          default: {}
                          description: >-
                            Org-wide CloudWatch resource tags. Merged additively with
                            CloudWatchConfig tags; this (stronger) level wins on key conflict.
                          additionalProperties:
                            type: string
                    cloudfront:
                      type: object
                      default: {}
                      description: >-
                        CloudFront-family mandatory governance fields applied across all CloudFront
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). Only 4 fields are promoted to KropathConfig blanket
                        governance: viewerProtocolPolicy, minimumProtocolVersion, webACLRequired,
                        loggingEnabled. The remaining CloudFront-specific fields (httpVersion,
                        sslSupportMethod, loggingBucket, priceClass, geoRestrictionType,
                        oacSigningBehavior, namingTemplate) live only in CloudFrontConfig profiles.
                      properties:
                        viewerProtocolPolicy:
                          type: string
                          description: >-
                            Org-wide mandatory viewer protocol policy enforcement.
                            Empty string = not enforced; "https-only" | "redirect-to-https".
                        minimumProtocolVersion:
                          type: string
                          description: >-
                            Org-wide mandatory minimum TLS version for HTTPS connections.
                            Empty string = not enforced; e.g. "TLSv1.2_2021".
                        webACLRequired:
                          type: boolean
                          default: false
                          description: >-
                            Enforces WAF association on all CloudFront distributions org-wide
                            when true. false (zero value) = not enforced.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Enforces access logging on all CloudFront distributions org-wide
                            when true. false (zero value) = not enforced.
                    elb:
                      type: object
                      default: {}
                      description: >-
                        ELB-family mandatory governance fields. Cascade levels 1-2 in the
                        ten-level priority chain (ADR-015 §5.3). Only the three cross-type ELB
                        boolean fields live here; fields specific to ELBConfig
                        (accessLogsS3Bucket, crossZoneEnabled, idleTimeoutSeconds, sslPolicy,
                        namingTemplate, syncedLabels, syncedAnnotations) are not in KropathConfig.
                      properties:
                        deletionProtection:
                          type: boolean
                          default: false
                          description: >-
                            Enforces deletion protection on all ELBs org-wide when true.
                            false (zero value) = not enforced.
                        accessLogsEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Enforces access logging for all ELBs org-wide when true.
                            false (zero value) = not enforced.
                        internalOnly:
                          type: boolean
                          default: false
                          description: >-
                            Forces all ELBs to use internal scheme org-wide when true.
                            false (zero value) = not enforced (both schemes allowed).
                    rds:
                      type: object
                      default: {}
                      description: >-
                        RDS-family mandatory governance fields. Cascade levels 1-2 in the
                        nine-level priority chain (ADR-015 §5.3). Cluster-only fields
                        (serverlessV2ScalingMinCapacity, serverlessV2ScalingMaxCapacity,
                        backtrackWindow) are not in KropathConfig — use RDSConfig for those.
                        namingTemplate, syncedLabels, and syncedAnnotations are RDSConfig-only.
                      properties:
                        storageEncrypted:
                          type: boolean
                          description: >-
                            Force encryption at rest on all RDS instances/clusters org-wide.
                            Omit (nil) = not enforced; false = explicitly disabled.
                            No default — nil (*bool) detection required.
                        kmsKeyID:
                          type: string
                          description: >-
                            Org-wide mandatory KMS key ARN for RDS encryption. Empty = not enforced.
                        deletionProtection:
                          type: boolean
                          description: >-
                            Force deletion protection on all RDS instances/clusters org-wide.
                            Omit (nil) = not enforced.
                        backupRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Org-wide mandatory backup retention floor in days. 0 = not enforced.
                            Minimum-floor semantics: max(mandatory, instance) applied in RGD CEL.
                        multiAZ:
                          type: boolean
                          description: >-
                            Force Multi-AZ deployment on all RDS instances org-wide.
                            Omit (nil) = not enforced.
                        publiclyAccessible:
                          type: boolean
                          description: >-
                            Control public endpoint exposure org-wide. Omit (nil) = not enforced;
                            false (explicit pointer) = forced private-only across all instances.
                        storageType:
                          type: string
                          description: >-
                            Org-wide mandatory storage type (e.g. "gp3", "io1"). Empty = not enforced.
                        autoMinorVersionUpgrade:
                          type: boolean
                          description: >-
                            Force auto minor version upgrades org-wide. Omit (nil) = not enforced.
                        copyTagsToSnapshot:
                          type: boolean
                          description: >-
                            Force tag copying to snapshots org-wide. Omit (nil) = not enforced.
                        performanceInsightsEnabled:
                          type: boolean
                          description: >-
                            Force Performance Insights on org-wide. Omit (nil) = not enforced.
                        enableIAMDatabaseAuthentication:
                          type: boolean
                          description: >-
                            Force IAM database authentication org-wide. Omit (nil) = not enforced.
                        manageMasterUserPassword:
                          type: boolean
                          description: >-
                            Force Secrets Manager password management org-wide. Omit (nil) = not enforced.
                        namingTemplate:
                          type: string
                          description: >-
                            Org-wide RDS naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                        tags:
                          type: object
                          default: {}
                          description: Mandatory cloud resource tags applied to all RDS resources.
                          additionalProperties:
                            type: string
                    autoscaling:
                      type: object
                      default: {}
                      description: >-
                        Auto Scaling-family mandatory governance fields. Cascade levels 1-2 in the
                        nine-level priority chain (ADR-015 §5.3). Only the two cross-type boolean
                        fields are governed here; all other Auto Scaling fields (healthCheckType,
                        healthCheckGracePeriod, maxInstanceLifetime, namingTemplate,
                        syncedLabels, syncedAnnotations) are AutoScalingConfig-only.
                      properties:
                        newInstancesProtectedFromScaleIn:
                          type: boolean
                          default: false
                          description: >-
                            Force instance scale-in protection on all Auto Scaling groups org-wide.
                            false (zero value) = not enforced.
                        capacityRebalance:
                          type: boolean
                          default: false
                          description: >-
                            Force Spot capacity rebalancing on all Auto Scaling groups org-wide.
                            false (zero value) = not enforced.
                    lambda:
                      type: object
                      default: {}
                      description: >-
                        Lambda-family mandatory governance fields applied across all Lambda
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). namingTemplate, syncedLabels, and syncedAnnotations are
                        LambdaConfig-only.
                      properties:
                        runtime:
                          type: string
                          description: >-
                            Org-wide mandatory Lambda runtime enforcement (e.g. "python3.12").
                            Empty string = not enforced; instances cannot override when set.
                        memorySize:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Org-wide hard memory ceiling in MB. 0 = not enforced;
                            positive value = maximum memorySize for all functions in scope.
                        timeout:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Org-wide hard execution timeout ceiling in seconds. 0 = not enforced;
                            positive value = maximum timeout for all functions in scope.
                        tracingMode:
                          type: string
                          description: >-
                            Org-wide mandatory AWS X-Ray tracing mode enforcement.
                            Empty string = not enforced; "PassThrough" | "Active".
                        kmsKeyArn:
                          type: string
                          description: >-
                            Org-wide mandatory KMS key ARN for Lambda environment variable encryption.
                            Empty string = not enforced; instances cannot use a different key when set.
                    ec2:
                      type: object
                      default: {}
                      description: >-
                        EC2-family mandatory governance fields. Cascade levels 1-2 in the
                        ten-level priority chain (ADR-015 §5.3). Only the three cross-type EC2
                        boolean fields live here; fields specific to EC2Config
                        (flowLogTrafficType, flowLogMaxAggregationInterval, restrictPublicIpOnLaunch,
                        ebsDefaultKmsKeyId, publicIpRestricted, allowSourceDestCheckDisable,
                        namingTemplate, syncedLabels, syncedAnnotations) are not in KropathConfig.
                      properties:
                        flowLogsRequired:
                          type: boolean
                          default: false
                          description: >-
                            When true, requires VPC Flow Logs on all EC2 resources org-wide.
                            false (zero value) = not enforced.
                        imdsv2Required:
                          type: boolean
                          default: false
                          description: >-
                            When true, enforces IMDSv2-only (token-required) on all EC2 instances
                            org-wide. false (zero value) = not enforced.
                        ebsEncryptionRequired:
                          type: boolean
                          default: false
                          description: >-
                            When true, enforces EBS volume encryption on all EC2 instances org-wide.
                            false (zero value) = not enforced.
                    ecs:
                      type: object
                      default: {}
                      description: >-
                        ECS-family mandatory governance fields. Cascade levels 1-2 in the
                        ten-level priority chain (ADR-015 §5.3). Only the two cross-type fields
                        are governed here; all other ECS fields (defaultPlatformVersion,
                        defaultNetworkMode, defaultTaskCPU, defaultTaskMemory, namingTemplate,
                        syncedLabels, syncedAnnotations) are ECSConfig-only.
                      properties:
                        containerInsights:
                          type: boolean
                          default: false
                          description: >-
                            Force Container Insights enabled on all ECS clusters org-wide.
                            false (zero value) = not enforced.
                        defaultLaunchType:
                          type: string
                          description: >-
                            Org-wide mandatory ECS launch type enforcement (EC2 | FARGATE).
                            Empty string = not enforced; instances cannot override when set.
                    apigatewayv2:
                      type: object
                      default: {}
                      description: >-
                        API Gateway V2-family mandatory governance fields. Cascade levels 1-2
                        in the ten-level priority chain (ADR-015 §5.3). Only the three
                        cross-type fields are governed here; all other ApiGatewayV2 fields
                        are ApiGatewayV2Config-only.
                      properties:
                        corsEnabled:
                          type: boolean
                          default: false
                          description: >-
                            When true, all HTTP APIs must define a corsConfiguration org-wide.
                            false (zero value) = not enforced.
                        disableExecuteApiEndpoint:
                          type: boolean
                          default: false
                          description: >-
                            When true, all APIs must disable the default execute-api endpoint org-wide.
                            false (zero value) = not enforced.
                        minimumTlsVersion:
                          type: string
                          description: >-
                            Org-wide mandatory minimum TLS version for all custom domain names.
                            Empty string = not enforced. Valid values: TLS_1_0, TLS_1_2.
                    elasticache:
                      type: object
                      default: {}
                      description: >-
                        ElastiCache-family mandatory governance fields applied across all ElastiCache
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). Only 2 fields are promoted to KropathConfig blanket
                        governance: atRestEncryptionEnabled, transitEncryptionEnabled.
                        All other ElastiCache-specific fields live only in ElastiCacheConfig profiles.
                      properties:
                        atRestEncryptionEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Forces encryption at rest on all ElastiCache caches org-wide when true.
                            false (zero value) = not enforced. IMMUTABLE on ReplicationGroup after creation.
                        transitEncryptionEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Forces TLS in-transit on all ElastiCache caches org-wide when true.
                            false (zero value) = not enforced.
                    ecr:
                      type: object
                      default: {}
                      description: >-
                        ECR-family mandatory governance fields. Cascade levels 1-2 in the
                        ten-level priority chain (ADR-015 §5.3). Only the three cross-type fields
                        are governed here; all other ECR fields (kmsKeyID, namingTemplate,
                        syncedLabels, syncedAnnotations) are ECRConfig-only.
                      properties:
                        imageTagMutability:
                          type: string
                          description: >-
                            Org-wide mandatory image tag mutability enforcement (IMMUTABLE | MUTABLE).
                            Empty string = not enforced; instances cannot override when set.
                        encryptionType:
                          type: string
                          description: >-
                            Org-wide mandatory repository encryption type (AES256 | KMS).
                            Empty string = not enforced; instances cannot override when set.
                        lifecyclePolicy:
                          type: string
                          description: >-
                            Org-wide mandatory lifecycle policy JSON template.
                            Empty string = not enforced; instances cannot override when set.
                    stepfunctions:
                      type: object
                      default: {}
                      description: >-
                        Mandatory Step Functions-family governance fields. Cascade levels 1-2
                        (ADR-015 §5.3). Only loggingLevel is governed at KropathConfig level;
                        tracingEnabled and includeExecutionData are StepFunctionsConfig-only.
                      properties:
                        loggingLevel:
                          type: string
                          description: >-
                            Org-wide mandatory execution logging level.
                            "" = not enforced; instances cannot override when set.
                            Valid values: "" | "ALL" | "ERROR" | "FATAL" | "OFF".
                        tags:
                          type: object
                          default: {}
                          description: Org-wide mandatory Step Functions cloud resource tags.
                          additionalProperties:
                            type: string
                    memorydb:
                      type: object
                      default: {}
                      description: >-
                        MemoryDB-family mandatory governance fields applied across all MemoryDB
                        resource types. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). 3 fields are promoted to KropathConfig blanket governance:
                        tlsEnabled, allowedNodeTypes, snapshotRetentionLimit.
                        All other MemoryDB-specific fields live only in MemoryDBConfig profiles.
                      properties:
                        tlsEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Forces TLS in-transit on all MemoryDB clusters org-wide when true.
                            false (zero value) = not enforced. IMMUTABLE on MemoryDB Cluster after creation.
                        allowedNodeTypes:
                          type: array
                          description: >-
                            Org-wide node type restriction. [] = no restriction;
                            non-empty = explicit allowlist applied to all MemoryDB clusters.
                          items:
                            type: string
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Org-wide minimum snapshot retention floor in days.
                            0 = not enforced; >0 enforces minimum retention across all clusters.
                    msk:
                      type: object
                      default: {}
                      description: >-
                        Mandatory MSK-family governance fields. Cascade levels 1-2
                        (ADR-015 §5.3). Five fields are governed at KropathConfig level;
                        instanceType and namingTemplate are MSKConfig-only.
                      properties:
                        kafkaVersion:
                          type: string
                          description: >-
                            Org-wide mandatory Kafka version (e.g. "3.7.0").
                            "" = not enforced; instances cannot override when set.
                        enhancedMonitoring:
                          type: string
                          description: >-
                            Org-wide mandatory CloudWatch monitoring level.
                            "" = not enforced. Valid: "" | "DEFAULT" | "PER_BROKER" |
                            "PER_TOPIC_PER_BROKER" | "PER_TOPIC_PER_PARTITION".
                        encryptionInTransitClientBroker:
                          type: string
                          description: >-
                            Org-wide mandatory client-broker encryption mode.
                            "" = not enforced. Valid: "" | "TLS" | "TLS_PLAINTEXT" | "PLAINTEXT".
                        encryptionInTransitInCluster:
                          type: string
                          description: >-
                            Org-wide mandatory inter-broker encryption (three-state string).
                            "" = not enforced (semantically distinct from "false").
                            Valid: "" | "true" | "false".
                        encryptionAtRestKmsKeyId:
                          type: string
                          description: >-
                            Org-wide mandatory KMS key ARN for EBS encryption at rest.
                            "" = not enforced.
                        tags:
                          type: object
                          default: {}
                          description: Org-wide mandatory MSK cloud resource tags.
                          additionalProperties:
                            type: string
                    certificateManager:
                      type: object
                      default: {}
                      description: >-
                        Certificate Manager family governance fields applied at the org-wide
                        mandatory tier. Cascade levels 1-2 in the ten-level priority chain
                        (ADR-015 §5.3). Only keyAlgorithm and certificateTransparencyLogging
                        are governed at the KropathConfig level; usageMode and
                        keyStorageSecurityStandard are per-CA choices and belong in ACMConfig
                        or the instance spec (family design §8).
                      properties:
                        keyAlgorithm:
                          type: string
                          description: >-
                            Org-wide mandatory key algorithm for all ACM certificates and private
                            CAs. Empty string = not enforced. Valid: RSA_2048 | EC_prime256v1 |
                            EC_secp384r1.
                        certificateTransparencyLogging:
                          type: string
                          description: >-
                            Org-wide mandatory CT logging preference. Empty string = not enforced.
                            Valid: ENABLED | DISABLED. Only meaningful for public certificates.
                    documentdb:
                      type: object
                      default: {}
                      description: >-
                        Mandatory DocumentDB-family governance fields. Cascade levels 1-2
                        (ADR-015 §5.3). Four fields are governed at KropathConfig level;
                        remaining DocumentDBConfig fields are per-type choices.
                      properties:
                        storageEncrypted:
                          type: boolean
                          default: false
                          description: >-
                            Org-wide mandatory encryption-at-rest enforcement for DocumentDB clusters.
                            false = not enforced; true = all DocumentDB clusters must use storage encryption.
                        deletionProtection:
                          type: boolean
                          default: false
                          description: >-
                            Org-wide mandatory deletion-protection enforcement for DocumentDB clusters.
                            false = not enforced; true = all DocumentDB clusters must have deletion protection enabled.
                        allowedInstanceClasses:
                          type: array
                          description: >-
                            Org-wide mandatory DocumentDB instance class allowlist. [] = no restriction.
                            When non-empty, controller rejects instances whose dbInstanceClass is not in this list.
                          items:
                            type: string
                        backupRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Org-wide mandatory minimum backup retention in days.
                            0 = not enforced; >0 enforces minimum retention across all DocumentDB clusters.
                    opensearch:
                      type: object
                      default: {}
                      description: >-
                        Mandatory OpenSearch-family governance fields. Cascade levels 1-2
                        (ADR-015 §5.3). Four fields are governed at KropathConfig level;
                        remaining OpenSearchConfig fields are per-profile choices.
                      properties:
                        encryptionAtRestEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Org-wide mandatory encryption-at-rest enforcement for OpenSearch domains.
                            false = not enforced; true = all OpenSearch domains must use storage encryption.
                            IMMUTABLE on domain after creation.
                        nodeToNodeEncryptionEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Org-wide mandatory node-to-node encryption enforcement for OpenSearch domains.
                            false = not enforced; true = all domains must encrypt inter-node traffic.
                            IMMUTABLE on domain after creation.
                        enforceHTTPS:
                          type: boolean
                          default: false
                          description: >-
                            Org-wide mandatory HTTPS-only access enforcement for OpenSearch domains.
                            false = not enforced; true = all domains must require HTTPS.
                        tlsSecurityPolicy:
                          type: string
                          description: >-
                            Org-wide mandatory minimum TLS security policy for OpenSearch domains.
                            Empty string = not enforced.
                            Valid: Policy-Min-TLS-1-0-2019-10 | Policy-Min-TLS-1-2-2019-07 |
                            Policy-Min-TLS-1-2-PFS-2023-10.
                    dsql:
                      type: object
                      default: {}
                      description: >-
                        Mandatory Aurora DSQL governance fields. Cascade levels 1-2
                        (ADR-015 §5.3). deletionProtectionEnabled is the only field governed
                        at KropathConfig level for DSQL.
                      properties:
                        deletionProtectionEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Org-wide mandatory deletion-protection enforcement for Aurora DSQL clusters.
                            false = not enforced; true = all DSQL clusters must have deletion protection enabled.
                    route53:
                      type: object
                      default: {}
                      description: >-
                        Mandatory Route53 governance fields. Cascade levels 1-2
                        (ADR-015 §5.3). These four fields are the only Route53 governance
                        enforced at the KropathConfig level.
                      properties:
                        defaultTTL:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Org-wide mandatory default TTL in seconds for DNS records.
                            0 = not enforced. Does not apply to alias records.
                        healthCheckRequestInterval:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Org-wide mandatory health check polling interval in seconds.
                            0 = not enforced. Valid non-zero values: 10 (fast) or 30 (standard).
                        healthCheckFailureThreshold:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 10
                          description: >-
                            Org-wide mandatory consecutive-failure count before marking a health
                            check unhealthy. 0 = not enforced. Valid non-zero range: 1–10.
                        resolverEndpointType:
                          type: string
                          description: >-
                            Org-wide mandatory IP address family constraint for Resolver endpoints.
                            Empty = not enforced. Valid values: IPV4, IPV6, DUALSTACK.
                    ssm:
                      type: object
                      default: {}
                      description: >-
                        SSM-family governance fields applied at the org-wide mandatory tier.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                        Only parameterType, parameterTier, keyID, and allowedDocumentTypes are
                        governed at the KropathConfig level; documentType, operatingSystem,
                        patch-specific fields, and namingTemplate belong in SSMConfig profiles.
                      properties:
                        parameterType:
                          type: string
                          description: >-
                            Org-wide mandatory parameter type enforcement (String | StringList |
                            SecureString). Empty string = not enforced; instances cannot override
                            when set. Note: type is immutable after parameter creation.
                        parameterTier:
                          type: string
                          description: >-
                            Org-wide mandatory parameter tier enforcement (Standard | Advanced |
                            Intelligent-Tiering). Empty string = not enforced. Advancing to Advanced
                            is irreversible without deletion and recreation.
                        keyID:
                          type: string
                          description: >-
                            Org-wide mandatory KMS key ARN, ID, or alias for SecureString
                            encryption. Empty string = not enforced.
                        allowedDocumentTypes:
                          type: array
                          description: >-
                            Org-wide restriction on allowed SSM document types. [] = no restriction;
                            non-empty = allowlist applied to all SSM documents org-wide.
                          items:
                            type: string
                    cognito:
                      type: object
                      default: {}
                      description: >-
                        Cognito-family governance fields applied at the org-wide mandatory tier.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                        Only mfaConfiguration, deletionProtection, advancedSecurityMode, and
                        passwordPolicy are governed at the KropathConfig level; namingTemplate,
                        syncedLabels, and syncedAnnotations belong in CognitoConfig profiles.
                      properties:
                        mfaConfiguration:
                          type: string
                          description: >-
                            Org-wide mandatory MFA level enforcement ("OFF", "OPTIONAL", "ON").
                            Empty string = not enforced; instances cannot override when set.
                        deletionProtection:
                          type: string
                          description: >-
                            Org-wide mandatory deletion protection state ("ACTIVE", "INACTIVE").
                            Empty string = not enforced.
                        advancedSecurityMode:
                          type: string
                          description: >-
                            Org-wide mandatory advanced security mode ("OFF", "AUDIT", "ENFORCED").
                            Empty string = not enforced.
                        passwordPolicy:
                          type: object
                          default: {}
                          description: Cognito password policy governance sub-fields.
                          properties:
                            minimumLength:
                              type: integer
                              format: int64
                              default: 0
                              description: Minimum password length. 0 = not enforced; valid range 6-99.
                            requireLowercase:
                              type: boolean
                              description: Require at least one lowercase letter. Omit = not enforced.
                            requireNumbers:
                              type: boolean
                              description: Require at least one digit. Omit = not enforced.
                            requireSymbols:
                              type: boolean
                              description: Require at least one symbol. Omit = not enforced.
                            requireUppercase:
                              type: boolean
                              description: Require at least one uppercase letter. Omit = not enforced.
                            temporaryPasswordValidityDays:
                              type: integer
                              format: int64
                              default: 0
                              description: Temporary password expiry in days. 0 = not enforced; valid range 1-365.
                    keyspaces:
                      type: object
                      default: {}
                      description: >-
                        Keyspaces-family governance fields applied at the org-wide mandatory tier.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                        Only replicationStrategy, throughputMode, encryptionType,
                        pointInTimeRecovery, and ttlEnabled are governed at the KropathConfig level;
                        namingTemplate, syncedLabels, and syncedAnnotations belong in
                        KeyspacesConfig profiles.
                      properties:
                        replicationStrategy:
                          type: string
                          description: >-
                            Org-wide mandatory replication strategy enforcement
                            ("SINGLE_REGION" or "MULTI_REGION").
                            Empty string = not enforced; instances cannot override when set.
                        throughputMode:
                          type: string
                          description: >-
                            Org-wide mandatory throughput mode enforcement
                            ("PAY_PER_REQUEST" or "PROVISIONED").
                            Empty string = not enforced.
                        encryptionType:
                          type: string
                          description: >-
                            Org-wide mandatory encryption type enforcement
                            ("AWS_OWNED_KMS_KEY" or "CUSTOMER_MANAGED_KMS_KEY").
                            Empty string = not enforced.
                        pointInTimeRecovery:
                          type: boolean
                          default: false
                          description: >-
                            Enforce point-in-time recovery on all Keyspaces tables org-wide.
                            false = not enforced.
                        ttlEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Enforce TTL enabled on all Keyspaces tables org-wide.
                            false = not enforced.
                    bedrock:
                      type: object
                      default: {}
                      description: >-
                        Bedrock-family governance fields applied at the org-wide mandatory tier.
                        Cascade levels 1-2 in the ten-level priority chain (ADR-015 §5.3).
                        Only guardrailIdentifier, guardrailVersion, and allowedModels are governed
                        at the KropathConfig level; foundationModel, maxIterations, maxTokens,
                        timeoutSeconds, and idleSessionTTLInSeconds belong in BedrockConfig profiles.
                      properties:
                        guardrailIdentifier:
                          type: string
                          description: >-
                            Org-wide mandatory Bedrock guardrail identifier. Empty string = not enforced;
                            non-empty forces all Bedrock agents and harnesses to use this guardrail.
                            Must be paired with guardrailVersion.
                        guardrailVersion:
                          type: string
                          description: >-
                            Org-wide mandatory Bedrock guardrail version. Empty string = not enforced.
                            Paired with guardrailIdentifier; must be set together.
                        allowedModels:
                          type: array
                          description: >-
                            Org-wide model restriction. [] = no restriction; non-empty = allowlist
                            of AWS Bedrock model IDs applied across all Bedrock resources.
                          items:
                            type: string
                        tags:
                          type: object
                          default: {}
                          additionalProperties:
                            type: string
                          description: Cloud resource tags merged into all Bedrock resources org-wide (mandatory tier).
                    sagemaker:
                      type: object
                      description: >-
                        Org-wide mandatory SageMaker governance fields. Highest-priority source in the
                        ADR-010 cascade for SageMaker resources. Zero-value = not enforced.
                      properties:
                        instanceType:
                          type: string
                          description: Forces this SageMaker instance type org-wide. Empty = not enforced.
                        kmsKeyId:
                          type: string
                          description: Forces this KMS key for SageMaker storage encryption org-wide. Empty = not enforced.
                        enableNetworkIsolation:
                          type: boolean
                          description: Forces network isolation on all SageMaker resources org-wide. false = not enforced.
                        enableInterContainerTrafficEncryption:
                          type: boolean
                          description: Forces inter-container traffic encryption org-wide. false = not enforced.

                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default governance fields. Applied when no higher-priority source sets the field.
                    Zero-value means no default is provided at this level.
                  properties:
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template when no mandatory template is set.
                    iam:
                      type: object
                      default: {}
                      description: >-
                        Default IAM-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          description: >-
                            Default permissions boundary ARN. Used when no mandatory source
                            sets this field. Empty string = no default boundary.
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                          description: >-
                            Default block for IAM user access key creation. Used when no
                            mandatory source sets this field.
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Default maximum IAM role session duration in seconds. 0 = no default.
                    kms:
                      type: object
                      default: {}
                      description: >-
                        Default KMS-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        enableKeyRotation:
                          type: boolean
                          default: false
                          description: Default KMS rotation enforcement toggle.
                        allowedKeySpecs:
                          type: array
                          description: Default KMS key spec allowlist.
                          items:
                            type: string
                    s3:
                      type: object
                      default: {}
                      description: >-
                        Default S3-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        encryptionAlgorithm:
                          type: string
                          description: Default S3 encryption algorithm.
                        kmsKeyArn:
                          type: string
                          description: Default KMS key ARN for S3 encryption.
                        blockPublicAccess:
                          type: boolean
                          default: false
                          description: Default block-public-access setting.
                        versioning:
                          type: string
                          description: Default S3 versioning state.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: Default server access logging setting.
                        logDeliveryBucket:
                          type: string
                          description: Default server access log target bucket.
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                          description: Default HTTPS-only enforcement setting.
                        objectLockMode:
                          type: string
                          description: Default object lock mode.
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: Default object lock retention days.
                    sqs:
                      type: object
                      default: {}
                      description: >-
                        Default SQS-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        encryptionType:
                          type: string
                          description: >-
                            Default SQS encryption type. Empty string = no org-wide default.
                        kmsMasterKeyId:
                          type: string
                          description: >-
                            Default KMS key for SQS encryption. Empty string = no org-wide default.
                        visibilityTimeout:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 43200
                          description: >-
                            Default visibility timeout in seconds. 0 = no org-wide default.
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 1209600
                          description: >-
                            Default message retention period in seconds. 0 = no org-wide default.
                        delaySeconds:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 900
                          description: >-
                            Default message delivery delay in seconds. 0 = no org-wide default.
                        maximumMessageSize:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 262144
                          description: >-
                            Default maximum message size in bytes. 0 = no org-wide default.
                    secretsManager:
                      type: object
                      default: {}
                      description: >-
                        Default SecretsManager-family governance fields. Cascade levels 8-9 in
                        the ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        kmsKeyID:
                          type: string
                          description: >-
                            Default KMS key ID, ARN, or alias for Secrets Manager secrets.
                            Empty string = no org-wide default encryption key.
                    sns:
                      type: object
                      default: {}
                      description: >-
                        Default SNS-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        kmsMasterKeyId:
                          type: string
                          description: >-
                            Default KMS key ID or ARN for SNS topic SSE.
                            Empty string = no org-wide default encryption key.
                        signatureVersion:
                          type: string
                          description: >-
                            Default SNS message signature version ("1" or "2").
                            Empty string = no org-wide default.
                        tracingConfig:
                          type: string
                          description: >-
                            Default SNS X-Ray active tracing mode ("Active" or "PassThrough").
                            Empty string = no org-wide default.
                    dynamodb:
                      type: object
                      default: {}
                      description: >-
                        Default DynamoDB-family governance fields. Cascade levels 8-9 (ADR-015 §5.3).
                        Applied only when no higher-priority source sets the field.
                      properties:
                        encryptionEnabled:
                          type: boolean
                          description: >-
                            Default SSE setting. Omit (nil) = no default; false = disabled by default.
                        kmsMasterKeyId:
                          type: string
                          description: Default KMS key ARN/ID. Empty = no default.
                        deletionProtectionEnabled:
                          type: boolean
                          description: Default deletion-protection. Omit (nil) = no default.
                        pointInTimeRecoveryEnabled:
                          type: boolean
                          description: Default PITR. Omit (nil) = no default.
                        billingMode:
                          type: string
                          enum: ["", "PROVISIONED", "PAY_PER_REQUEST"]
                          description: Default billing mode. Empty = no default.
                        tableClass:
                          type: string
                          enum: ["", "STANDARD", "STANDARD_INFREQUENT_ACCESS"]
                          description: Default table class. Empty = no default.
                        contributorInsights:
                          type: string
                          enum: ["", "ENABLE", "DISABLE"]
                          description: Default Contributor Insights action. Empty = no default.
                    eventbridge:
                      type: object
                      default: {}
                      description: >-
                        Default EventBridge-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        archiveRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Default archive retention in days. 0 = indefinite retention (no default
                            enforced). Applied when no mandatory source sets this field.
                    elb:
                      type: object
                      default: {}
                      description: >-
                        Default ELB-family governance fields. Cascade levels 8-9 (ADR-015 §5.3).
                        Only the three cross-type ELB boolean fields are governed here; fields
                        specific to ELBConfig (accessLogsS3Bucket, crossZoneEnabled, etc.) are
                        not in KropathConfig. Applied only when no higher-priority source sets
                        the field.
                      properties:
                        deletionProtection:
                          type: boolean
                          default: false
                          description: >-
                            Default deletion-protection preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        accessLogsEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default access-logging preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        internalOnly:
                          type: boolean
                          default: false
                          description: >-
                            Default scheme preference. false = both internal and internet-facing
                            are allowed. Applied when no mandatory source sets this field.
                    cloudwatchlogs:
                      type: object
                      default: {}
                      description: >-
                        Default CloudWatch Logs-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        kmsKeyId:
                          type: string
                          description: >-
                            Default KMS key ARN for log group encryption. Empty string = no
                            encryption default. Applied when no mandatory source sets this field.
                        retentionDays:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Default retention period in days. 0 = no default retention enforced.
                            Applied when no mandatory source sets this field.
                    cloudtrail:
                      type: object
                      default: {}
                      description: >-
                        Default CloudTrail-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        isMultiRegionTrail:
                          type: boolean
                          description: >-
                            Default multi-region trail setting. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        enableLogFileValidation:
                          type: boolean
                          description: >-
                            Default log file integrity validation setting. false = no default
                            enforcement. Applied when no mandatory source sets this field.
                        retentionPeriod:
                          type: integer
                          format: int64
                          minimum: 0
                          description: >-
                            Default event data store retention period in days. 0 = no default.
                            Applied when no mandatory source sets this field.
                    cloudwatch:
                      type: object
                      default: {}
                      description: >-
                        Default CloudWatch-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        actionsEnabled:
                          type: boolean
                          nullable: true
                          description: >-
                            Default CloudWatch alarm actions enabled setting. null = no default.
                            Applied when no mandatory source sets this field.
                        treatMissingData:
                          type: string
                          description: >-
                            Default treatment of missing data in alarms. Empty string = no default.
                            Applied when no mandatory source sets this field.
                        outputFormat:
                          type: string
                          description: >-
                            Default CloudWatch metric stream output format. Empty string = no
                            default. Applied when no mandatory source sets this field.
                        tags:
                          type: object
                          default: {}
                          description: >-
                            Default CloudWatch resource tags. Merged additively; mandatory
                            sources win on key conflict.
                          additionalProperties:
                            type: string
                    cloudfront:
                      type: object
                      default: {}
                      description: >-
                        Default CloudFront-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        viewerProtocolPolicy:
                          type: string
                          description: >-
                            Default viewer protocol policy. Empty string = no default enforcement.
                            Applied when no mandatory source sets this field.
                        minimumProtocolVersion:
                          type: string
                          description: >-
                            Default minimum TLS version. Empty string = no default enforcement.
                            Applied when no mandatory source sets this field.
                        webACLRequired:
                          type: boolean
                          default: false
                          description: >-
                            Default WAF requirement preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        loggingEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default access-logging preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                    rds:
                      type: object
                      default: {}
                      description: >-
                        Default RDS-family governance fields. Cascade levels 8-9 (ADR-015 §5.3).
                        Applied only when no higher-priority source sets the field.
                        Cluster-only fields are not in KropathConfig — use RDSConfig for those.
                      properties:
                        storageEncrypted:
                          type: boolean
                          description: >-
                            Default encryption-at-rest setting. Omit (nil) = no default;
                            false = disabled by default. No default — nil detection required.
                        kmsKeyID:
                          type: string
                          description: Default KMS key ARN for RDS encryption. Empty = no default.
                        deletionProtection:
                          type: boolean
                          description: Default deletion-protection setting. Omit (nil) = no default.
                        backupRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Default backup retention in days. 0 = no automated backups by default.
                        multiAZ:
                          type: boolean
                          description: Default Multi-AZ setting. Omit (nil) = no default.
                        publiclyAccessible:
                          type: boolean
                          description: Default public-accessibility setting. Omit (nil) = no default.
                        storageType:
                          type: string
                          description: Default storage type. Empty = no default.
                        autoMinorVersionUpgrade:
                          type: boolean
                          description: Default auto-minor-version-upgrade setting. Omit (nil) = no default.
                        copyTagsToSnapshot:
                          type: boolean
                          description: Default copy-tags-to-snapshot setting. Omit (nil) = no default.
                        performanceInsightsEnabled:
                          type: boolean
                          description: Default Performance Insights setting. Omit (nil) = no default.
                        enableIAMDatabaseAuthentication:
                          type: boolean
                          description: Default IAM database authentication. Omit (nil) = no default.
                        manageMasterUserPassword:
                          type: boolean
                          description: Default Secrets Manager password management. Omit (nil) = no default.
                        namingTemplate:
                          type: string
                          description: Default RDS naming template. Empty = no default.
                        tags:
                          type: object
                          default: {}
                          description: Default cloud resource tags for RDS resources.
                          additionalProperties:
                            type: string
                    autoscaling:
                      type: object
                      default: {}
                      description: >-
                        Default Auto Scaling-family governance fields. Cascade levels 8-9 (ADR-015 §5.3).
                        Applied only when no higher-priority source sets the field.
                      properties:
                        newInstancesProtectedFromScaleIn:
                          type: boolean
                          default: false
                          description: >-
                            Default scale-in protection setting. false = no default.
                        capacityRebalance:
                          type: boolean
                          default: false
                          description: >-
                            Default Spot capacity rebalancing setting. false = no default.
                    lambda:
                      type: object
                      default: {}
                      description: >-
                        Lambda-family default governance fields. Applied when no higher-priority
                        source sets the field. Cascade levels 8-9 (ADR-015 §5.3).
                      properties:
                        runtime:
                          type: string
                          description: Default Lambda runtime. Empty = no default runtime enforced.
                        memorySize:
                          type: integer
                          format: int64
                          default: 0
                          description: Default memory in MB. 0 = no default enforced.
                        timeout:
                          type: integer
                          format: int64
                          default: 0
                          description: Default execution timeout in seconds. 0 = no default enforced.
                        tracingMode:
                          type: string
                          description: Default AWS X-Ray tracing mode. Empty = no default enforced.
                        kmsKeyArn:
                          type: string
                          description: Default KMS key ARN for environment variable encryption. Empty = no default enforced.
                    ec2:
                      type: object
                      default: {}
                      description: >-
                        Default EC2-family governance fields. Cascade levels 8-9 (ADR-015 §5.3).
                        Only the three cross-type EC2 boolean fields are governed here.
                        Applied only when no higher-priority source sets the field.
                      properties:
                        flowLogsRequired:
                          type: boolean
                          default: false
                          description: >-
                            Default VPC Flow Logs enforcement. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        imdsv2Required:
                          type: boolean
                          default: false
                          description: >-
                            Default IMDSv2-only enforcement. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        ebsEncryptionRequired:
                          type: boolean
                          default: false
                          description: >-
                            Default EBS encryption enforcement. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                    ecs:
                      type: object
                      default: {}
                      description: >-
                        ECS-family default governance fields. Applied when no higher-priority
                        source sets the field. Cascade levels 8-9 (ADR-015 §5.3).
                        Only the two cross-type fields are governed here.
                      properties:
                        containerInsights:
                          type: boolean
                          default: false
                          description: >-
                            Default Container Insights enforcement. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        defaultLaunchType:
                          type: string
                          description: >-
                            Default ECS launch type (EC2 | FARGATE). Empty = no default enforced.
                            Applied when no mandatory or ECSConfig source sets this field.
                    apigatewayv2:
                      type: object
                      default: {}
                      description: >-
                        API Gateway V2-family default governance fields. Applied when no
                        higher-priority source sets the field. Cascade levels 8-9 (ADR-015 §5.3).
                        Only the three cross-type fields are governed here.
                      properties:
                        corsEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default CORS enforcement toggle. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        disableExecuteApiEndpoint:
                          type: boolean
                          default: false
                          description: >-
                            Default execute-api endpoint disable toggle. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        minimumTlsVersion:
                          type: string
                          description: >-
                            Default minimum TLS version for custom domain names. Empty = no default.
                            Applied when no mandatory or ApiGatewayV2Config source sets this field.
                    elasticache:
                      type: object
                      default: {}
                      description: >-
                        Default ElastiCache-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        atRestEncryptionEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default encryption-at-rest preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        transitEncryptionEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default TLS in-transit preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                    ecr:
                      type: object
                      default: {}
                      description: >-
                        ECR-family default governance fields. Applied when no higher-priority
                        source sets the field. Cascade levels 8-9 (ADR-015 §5.3).
                        Only the three cross-type fields are governed here.
                      properties:
                        imageTagMutability:
                          type: string
                          description: >-
                            Default image tag mutability (IMMUTABLE | MUTABLE). Empty = no default.
                            Applied when no mandatory or ECRConfig source sets this field.
                        encryptionType:
                          type: string
                          description: >-
                            Default repository encryption type (AES256 | KMS). Empty = no default.
                            Applied when no mandatory or ECRConfig source sets this field.
                        lifecyclePolicy:
                          type: string
                          description: >-
                            Default lifecycle policy JSON template. Empty = no default.
                            Applied when no mandatory or ECRConfig source sets this field.
                    stepfunctions:
                      type: object
                      default: {}
                      description: >-
                        Default Step Functions-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                        Only loggingLevel is governed at KropathConfig level.
                      properties:
                        loggingLevel:
                          type: string
                          description: >-
                            Default execution logging level. "" = no org-wide default.
                            Valid values: "" | "ALL" | "ERROR" | "FATAL" | "OFF".
                            Applied when no mandatory or StepFunctionsConfig source sets this field.
                        tags:
                          type: object
                          default: {}
                          description: Default Step Functions cloud resource tags.
                          additionalProperties:
                            type: string
                    memorydb:
                      type: object
                      default: {}
                      description: >-
                        MemoryDB-family default governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field.
                      properties:
                        tlsEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default TLS in-transit preference. false = no default enforcement.
                            Applied when no mandatory source sets this field.
                        allowedNodeTypes:
                          type: array
                          description: >-
                            Default node type allowlist. [] = no restriction.
                            Applied when no mandatory source sets allowedNodeTypes.
                          items:
                            type: string
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Default snapshot retention floor in days. 0 = no default enforcement.
                            Applied when no mandatory source sets snapshotRetentionLimit.
                    msk:
                      type: object
                      default: {}
                      description: >-
                        Default MSK-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                        Only the five KropathConfig-scoped fields apply here.
                      properties:
                        kafkaVersion:
                          type: string
                          description: >-
                            Default Kafka version. "" = no org-wide default.
                            Applied when no mandatory or MSKConfig source sets this field.
                        enhancedMonitoring:
                          type: string
                          description: >-
                            Default CloudWatch monitoring level. "" = no org-wide default.
                            Valid: "" | "DEFAULT" | "PER_BROKER" |
                            "PER_TOPIC_PER_BROKER" | "PER_TOPIC_PER_PARTITION".
                        encryptionInTransitClientBroker:
                          type: string
                          description: >-
                            Default client-broker encryption mode. "" = no org-wide default.
                        encryptionInTransitInCluster:
                          type: string
                          description: >-
                            Default inter-broker encryption (three-state string).
                            "" = no org-wide default. Valid: "" | "true" | "false".
                        encryptionAtRestKmsKeyId:
                          type: string
                          description: >-
                            Default KMS key ARN for EBS encryption. "" = no org-wide default.
                        tags:
                          type: object
                          default: {}
                          description: Default MSK cloud resource tags.
                          additionalProperties:
                            type: string
                    certificateManager:
                      type: object
                      default: {}
                      description: >-
                        Certificate Manager family governance fields applied at the org-wide
                        defaults tier. Cascade levels 8-9 in the ten-level priority chain
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        keyAlgorithm:
                          type: string
                          description: >-
                            Default key algorithm for all ACM certificates and private CAs.
                            Empty string = no org-wide default. Valid: RSA_2048 | EC_prime256v1 |
                            EC_secp384r1.
                        certificateTransparencyLogging:
                          type: string
                          description: >-
                            Default CT logging preference. Empty string = no org-wide default.
                            Valid: ENABLED | DISABLED.
                    documentdb:
                      type: object
                      default: {}
                      description: >-
                        Default DocumentDB-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                        Only the four KropathConfig-scoped fields apply here.
                      properties:
                        storageEncrypted:
                          type: boolean
                          default: false
                          description: >-
                            Default encryption-at-rest for DocumentDB clusters. false = no org-wide default.
                            Applied when no mandatory source sets storageEncrypted.
                        deletionProtection:
                          type: boolean
                          default: false
                          description: >-
                            Default deletion-protection for DocumentDB clusters. false = no org-wide default.
                            Applied when no mandatory source sets deletionProtection.
                        allowedInstanceClasses:
                          type: array
                          description: >-
                            Default DocumentDB instance class allowlist. [] = no org-wide default.
                            Applied when no mandatory source sets allowedInstanceClasses.
                          items:
                            type: string
                        backupRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Default backup retention in days. 0 = no org-wide default.
                            Applied when no mandatory source sets backupRetentionPeriod.
                    opensearch:
                      type: object
                      default: {}
                      description: >-
                        Default OpenSearch-family governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                        Only the four KropathConfig-scoped fields apply here.
                      properties:
                        encryptionAtRestEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default encryption-at-rest for OpenSearch domains. false = no org-wide default.
                            Applied when no mandatory source sets encryptionAtRestEnabled.
                        nodeToNodeEncryptionEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default node-to-node encryption for OpenSearch domains. false = no org-wide default.
                            Applied when no mandatory source sets nodeToNodeEncryptionEnabled.
                        enforceHTTPS:
                          type: boolean
                          default: false
                          description: >-
                            Default HTTPS enforcement for OpenSearch domains. false = no org-wide default.
                            Applied when no mandatory source sets enforceHTTPS.
                        tlsSecurityPolicy:
                          type: string
                          description: >-
                            Default minimum TLS security policy for OpenSearch domains. Empty string = no org-wide default.
                            Applied when no mandatory source sets tlsSecurityPolicy.
                    dsql:
                      type: object
                      default: {}
                      description: >-
                        Default Aurora DSQL governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        deletionProtectionEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Default deletion-protection setting for Aurora DSQL clusters. false = no org-wide default.
                            Applied when no mandatory source sets deletionProtectionEnabled.
                    route53:
                      type: object
                      default: {}
                      description: >-
                        Default Route53 governance fields. Cascade levels 8-9
                        (ADR-015 §5.3). Applied only when no higher-priority source sets the field.
                      properties:
                        defaultTTL:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          description: >-
                            Org-wide default TTL in seconds for DNS records. 0 = no org-wide default.
                            Applied when no mandatory source sets defaultTTL.
                        healthCheckRequestInterval:
                          type: integer
                          format: int64
                          default: 0
                          description: >-
                            Default health check polling interval in seconds. 0 = no org-wide default.
                            Valid non-zero values: 10 or 30.
                        healthCheckFailureThreshold:
                          type: integer
                          format: int64
                          default: 0
                          minimum: 0
                          maximum: 10
                          description: >-
                            Default consecutive-failure threshold. 0 = no org-wide default.
                            Valid non-zero range: 1–10.
                        resolverEndpointType:
                          type: string
                          description: >-
                            Default IP address family for Resolver endpoints. Empty = no org-wide default.
                            Valid values: IPV4, IPV6, DUALSTACK.
                    ssm:
                      type: object
                      default: {}
                      description: >-
                        Default SSM-family governance fields. Cascade levels 8-9 in the
                        ten-level priority chain (ADR-015 §5.3). Applied only when no
                        higher-priority source sets the field. Only parameterType, parameterTier,
                        keyID, and allowedDocumentTypes apply at this level.
                      properties:
                        parameterType:
                          type: string
                          description: >-
                            Default parameter type (String | StringList | SecureString).
                            Empty string = no org-wide default.
                            Applied when no mandatory source sets parameterType.
                        parameterTier:
                          type: string
                          description: >-
                            Default parameter tier (Standard | Advanced | Intelligent-Tiering).
                            Empty string = no org-wide default.
                            Applied when no mandatory source sets parameterTier.
                        keyID:
                          type: string
                          description: >-
                            Default KMS key ARN, ID, or alias for SecureString encryption.
                            Empty string = no org-wide default.
                            Applied when no mandatory source sets keyID.
                        allowedDocumentTypes:
                          type: array
                          description: >-
                            Default allowed SSM document type allowlist. [] = no org-wide default.
                            Applied when no mandatory source sets allowedDocumentTypes.
                          items:
                            type: string
                    cognito:
                      type: object
                      default: {}
                      description: >-
                        Cognito-family governance fields applied at the org-wide defaults tier.
                        Cascade levels 8-9 in the ten-level priority chain (ADR-015 §5.3).
                        Weakest defaults source; CognitoConfig defaults (levels 6-7) override these.
                      properties:
                        mfaConfiguration:
                          type: string
                          description: >-
                            Org-wide default MFA level ("OFF", "OPTIONAL", "ON").
                            Empty string = no default; instances can override.
                        deletionProtection:
                          type: string
                          description: >-
                            Org-wide default deletion protection state ("ACTIVE", "INACTIVE").
                            Empty string = no default.
                        advancedSecurityMode:
                          type: string
                          description: >-
                            Org-wide default advanced security mode ("OFF", "AUDIT", "ENFORCED").
                            Empty string = no default.
                        passwordPolicy:
                          type: object
                          default: {}
                          description: Default Cognito password policy sub-fields.
                          properties:
                            minimumLength:
                              type: integer
                              format: int64
                              default: 0
                              description: Default minimum password length. 0 = no default; valid range 6-99.
                            requireLowercase:
                              type: boolean
                              description: Default require lowercase. Omit = no default.
                            requireNumbers:
                              type: boolean
                              description: Default require digits. Omit = no default.
                            requireSymbols:
                              type: boolean
                              description: Default require symbols. Omit = no default.
                            requireUppercase:
                              type: boolean
                              description: Default require uppercase. Omit = no default.
                            temporaryPasswordValidityDays:
                              type: integer
                              format: int64
                              default: 0
                              description: Default temporary password expiry in days. 0 = no default; valid range 1-365.
                    keyspaces:
                      type: object
                      default: {}
                      description: >-
                        Keyspaces-family governance fields applied at the org-wide defaults tier.
                        Cascade levels 8-9 in the ten-level priority chain (ADR-015 §5.3).
                        Weakest defaults source; KeyspacesConfig defaults (levels 6-7) override these.
                      properties:
                        replicationStrategy:
                          type: string
                          description: >-
                            Org-wide default replication strategy ("SINGLE_REGION" or "MULTI_REGION").
                            Empty string = no default; instances can override.
                        throughputMode:
                          type: string
                          description: >-
                            Org-wide default throughput mode ("PAY_PER_REQUEST" or "PROVISIONED").
                            Empty string = no default.
                        encryptionType:
                          type: string
                          description: >-
                            Org-wide default encryption type
                            ("AWS_OWNED_KMS_KEY" or "CUSTOMER_MANAGED_KMS_KEY").
                            Empty string = no default.
                        pointInTimeRecovery:
                          type: boolean
                          default: false
                          description: >-
                            Org-wide default point-in-time recovery setting for Keyspaces tables.
                            false = no default.
                        ttlEnabled:
                          type: boolean
                          default: false
                          description: >-
                            Org-wide default TTL enabled setting for Keyspaces tables.
                            false = no default.
                    bedrock:
                      type: object
                      default: {}
                      description: >-
                        Bedrock-family governance fields applied at the org-wide defaults tier.
                        Cascade levels 8-9 in the ten-level priority chain (ADR-015 §5.3).
                        Weakest defaults source; BedrockConfig defaults (levels 6-7) override these.
                        Applied only when no higher-priority source sets the field.
                      properties:
                        guardrailIdentifier:
                          type: string
                          description: >-
                            Org-wide default Bedrock guardrail identifier. Empty string = no default.
                            Applied when no mandatory source sets this field.
                        guardrailVersion:
                          type: string
                          description: >-
                            Org-wide default Bedrock guardrail version. Empty string = no default.
                            Applied when no mandatory source sets this field.
                        allowedModels:
                          type: array
                          description: >-
                            Org-wide default model allowlist. [] = no restriction; non-empty = default
                            allowlist applied when no mandatory source sets this field.
                          items:
                            type: string
                        tags:
                          type: object
                          default: {}
                          additionalProperties:
                            type: string
                          description: Cloud resource tags merged into all Bedrock resources org-wide (defaults tier).
                    sagemaker:
                      type: object
                      description: >-
                        Org-wide default SageMaker governance fields. Applied when no higher-priority source
                        sets the field. Zero-value = no default at this level.
                      properties:
                        instanceType:
                          type: string
                          description: Org-wide default SageMaker instance type. Empty = no default.
                        kmsKeyId:
                          type: string
                          description: Org-wide default KMS key for SageMaker storage encryption. Empty = no default.
                        enableNetworkIsolation:
                          type: boolean
                          description: Org-wide default network isolation setting. false = no default (zero-value sentinel).
                        enableInterContainerTrafficEncryption:
                          type: boolean
                          description: Org-wide default inter-container traffic encryption. false = no default (zero-value sentinel).

                aws:
                  type: object
                  default: {}
                  description: >-
                    AWS provider identity fields. Controller copies these into
                    effectiveConfig.aws.* on every namespaced ResourceConfig CR (ADR-015 §5.4).
                  properties:
                    accountId:
                      type: string
                      default: ""
                      description: AWS account ID (12-digit string).
                    region:
                      type: string
                      default: ""
                      description: AWS region identifier (e.g. us-east-1).
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
