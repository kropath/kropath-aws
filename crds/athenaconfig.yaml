---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: athenaconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: AthenaConfig
    listKind: AthenaConfigList
    plural: athenaconfigs
    singular: athenaconfig
    shortNames:
      - athenacfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enforceWorkGroupConfiguration) &&
                  self.spec.mandatory.enforceWorkGroupConfiguration == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enforceWorkGroupConfiguration) &&
                  self.spec.defaults.enforceWorkGroupConfiguration == true)
              message: >-
                enforceWorkGroupConfiguration cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.publishCloudWatchMetricsEnabled) &&
                  self.spec.mandatory.publishCloudWatchMetricsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.publishCloudWatchMetricsEnabled) &&
                  self.spec.defaults.publishCloudWatchMetricsEnabled == true)
              message: >-
                publishCloudWatchMetricsEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableMinimumEncryptionConfiguration) &&
                  self.spec.mandatory.enableMinimumEncryptionConfiguration == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableMinimumEncryptionConfiguration) &&
                  self.spec.defaults.enableMinimumEncryptionConfiguration == true)
              message: >-
                enableMinimumEncryptionConfiguration cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.requesterPaysEnabled) &&
                  self.spec.mandatory.requesterPaysEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.requesterPaysEnabled) &&
                  self.spec.defaults.requesterPaysEnabled == true)
              message: >-
                requesterPaysEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.resultEncryptionOption) &&
                  self.spec.mandatory.resultEncryptionOption != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.resultEncryptionOption) &&
                  self.spec.defaults.resultEncryptionOption != "")
              message: >-
                resultEncryptionOption cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.resultOutputLocation) &&
                  self.spec.mandatory.resultOutputLocation != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.resultOutputLocation) &&
                  self.spec.defaults.resultOutputLocation != "")
              message: >-
                resultOutputLocation cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.bytesScannedCutoffPerQuery) &&
                  self.spec.mandatory.bytesScannedCutoffPerQuery > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.bytesScannedCutoffPerQuery) &&
                  self.spec.defaults.bytesScannedCutoffPerQuery > 0)
              message: >-
                bytesScannedCutoffPerQuery cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engineVersion) &&
                  self.spec.mandatory.engineVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engineVersion) &&
                  self.spec.defaults.engineVersion != "")
              message: >-
                engineVersion cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Athena governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    enforceWorkGroupConfiguration:
                      type: boolean
                      default: false
                      description: When true, workgroup configuration enforcement is required. false = not enforced.
                    publishCloudWatchMetricsEnabled:
                      type: boolean
                      default: false
                      description: When true, CloudWatch metrics publishing is required. false = not enforced.
                    bytesScannedCutoffPerQuery:
                      type: integer
                      format: int64
                      default: 0
                      description: 0 = not enforced; >0 forces maximum bytes scanned per query.
                    enableMinimumEncryptionConfiguration:
                      type: boolean
                      default: false
                      description: When true, minimum encryption configuration is required. false = not enforced.
                    requesterPaysEnabled:
                      type: boolean
                      default: false
                      description: When true, requester-pays is required. false = not enforced.
                    resultEncryptionOption:
                      type: string
                      default: ""
                      description: Empty string = not enforced; SSE_S3/SSE_KMS/CSE_KMS forces result encryption.
                    resultOutputLocation:
                      type: string
                      default: ""
                      description: Empty string = not enforced; non-empty forces result output S3 location.
                    engineVersion:
                      type: string
                      default: ""
                      description: Empty string = not enforced; non-empty forces Athena engine version.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Empty string = no mandatory naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Athena governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    enforceWorkGroupConfiguration:
                      type: boolean
                      default: false
                      description: Default workgroup configuration enforcement toggle.
                    publishCloudWatchMetricsEnabled:
                      type: boolean
                      default: false
                      description: Default CloudWatch metrics publishing toggle.
                    bytesScannedCutoffPerQuery:
                      type: integer
                      format: int64
                      default: 0
                      description: Default maximum bytes scanned per query. 0 = no limit.
                    enableMinimumEncryptionConfiguration:
                      type: boolean
                      default: false
                      description: Default minimum encryption configuration toggle.
                    requesterPaysEnabled:
                      type: boolean
                      default: false
                      description: Default requester-pays toggle.
                    resultEncryptionOption:
                      type: string
                      default: ""
                      description: Default result encryption option. Empty string = no default.
                    resultOutputLocation:
                      type: string
                      default: ""
                      description: Default result output S3 location. Empty string = no default.
                    engineVersion:
                      type: string
                      default: ""
                      description: Default Athena engine version. Empty string = Athena selects latest.
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: Default naming template. "{namespace}-{name}" matches the kropath naming convention.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        enforceWorkGroupConfiguration:
                          type: boolean
                        publishCloudWatchMetricsEnabled:
                          type: boolean
                        bytesScannedCutoffPerQuery:
                          type: integer
                          format: int64
                        enableMinimumEncryptionConfiguration:
                          type: boolean
                        requesterPaysEnabled:
                          type: boolean
                        resultEncryptionOption:
                          type: string
                        resultOutputLocation:
                          type: string
                        engineVersion:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        enforceWorkGroupConfiguration:
                          type: boolean
                        publishCloudWatchMetricsEnabled:
                          type: boolean
                        bytesScannedCutoffPerQuery:
                          type: integer
                          format: int64
                        enableMinimumEncryptionConfiguration:
                          type: boolean
                        requesterPaysEnabled:
                          type: boolean
                        resultEncryptionOption:
                          type: string
                        resultOutputLocation:
                          type: string
                        engineVersion:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
