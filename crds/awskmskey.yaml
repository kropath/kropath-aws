---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awskmskeys.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSKMSKey
    listKind: AWSKMSKeyList
    plural: awskmskeys
    singular: awskmskey
    shortNames:
      - awskmskey
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ResourceName
          type: string
          jsonPath: .status.resourceName
        - name: NamingStatus
          type: string
          jsonPath: .status.namingStatus
        - name: PredictedArn
          type: string
          jsonPath: .status.predictedArn
        - name: KeyID
          type: string
          jsonPath: .status.keyID
      schema:
        openAPIV3Schema:
          type: object
          # Immutability and mutual-exclusivity rules (ADR-015 §9.4, spec aws-kms-02)
          x-kubernetes-validations:
            - rule: >-
                self.spec.keySpec == '' || !has(oldSelf.spec) || oldSelf.spec.keySpec == '' ||
                self.spec.keySpec == oldSelf.spec.keySpec
              message: "keySpec is immutable after creation"
            - rule: >-
                self.spec.keyUsage == '' || !has(oldSelf.spec) || oldSelf.spec.keyUsage == '' ||
                self.spec.keyUsage == oldSelf.spec.keyUsage
              message: "keyUsage is immutable after creation"
            - rule: >-
                !(self.spec.policy != '' && self.spec.keyPolicyRef != '')
              message: "policy and keyPolicyRef are mutually exclusive"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                configRef:
                  type: string
                  default: general-policy
                  description: Name of the AWSKMSConfig profile to use.
                nameOverride:
                  type: string
                  default: ""
                  description: Overrides cloud resource name; bypasses naming template when non-empty.
                deletionPolicy:
                  type: string
                  default: retain
                  enum:
                    - retain
                    - delete
                  description: ACK deletion policy for the managed key and alias.
                tags:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                  description: Cloud tags applied directly to the key (merged with governance tiers).
                syncedLabels:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                  description: Labels synced to K8s metadata AND cloud tags (kropath.run/ prefix in K8s only).
                syncedAnnotations:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                  description: Annotations synced to K8s metadata AND cloud tags (kropath.run/ prefix in K8s only).
                description:
                  type: string
                  default: ""
                  description: Human-readable description of the key's purpose.
                keySpec:
                  type: string
                  default: ""
                  description: >-
                    Key material type. Immutable after creation. Falls through to AWSKMSConfig cascade.
                    Valid values: SYMMETRIC_DEFAULT, RSA_2048, RSA_3072, RSA_4096,
                    ECC_NIST_P256, ECC_NIST_P384, ECC_NIST_P521, ECC_SECG_P256K1,
                    HMAC_224, HMAC_256, HMAC_384, HMAC_512.
                keyUsage:
                  type: string
                  default: ""
                  description: >-
                    Cryptographic operations the key supports. Immutable after creation.
                    Falls through to AWSKMSConfig cascade.
                    Valid values: ENCRYPT_DECRYPT, SIGN_VERIFY, GENERATE_VERIFY_MAC, KEY_AGREEMENT.
                enableKeyRotation:
                  type: boolean
                  description: >-
                    Enable automatic annual key rotation (symmetric keys only). false is the
                    zero-value sentinel — explicit false is indistinguishable from unset and
                    falls through to the AWSKMSConfig cascade.
                policy:
                  type: string
                  default: ""
                  description: >-
                    Full KMS key policy document (JSON string). Mutually exclusive with keyPolicyRef.
                keyPolicyRef:
                  type: string
                  default: ""
                  description: >-
                    Name of an AWSPolicyDocument CR in the same namespace. Mutually exclusive with policy.
                createAlias:
                  type: boolean
                  default: true
                  description: When true, composes an ACK Alias CR alongside the key.
                aliasName:
                  type: string
                  default: ""
                  description: >-
                    Alias name suffix (prepended with "alias/"). When empty, derived from effectiveName.
            status:
              type: object
              properties:
                resourceName:
                  type: string
                  description: Resolved effective name after naming template substitution.
                namingStatus:
                  type: string
                  description: '"valid" or "invalid-unresolved-tokens".'
                predictedArn:
                  type: string
                  description: >-
                    Key ARN populated post-creation from ACK Key status. Equivalent to keyArn.
                    KMS key ARNs use the AWS-assigned UUID, not effectiveName.
                keyID:
                  type: string
                  description: AWS-assigned key UUID; populated after key creation.
                keyArn:
                  type: string
                  description: Full key ARN; populated after key creation.
                aliasArn:
                  type: string
                  description: Alias ARN; predictable pre-creation when createAlias=true.
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
