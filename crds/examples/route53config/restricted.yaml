# Restricted Route53Config CR. Enforces DNS governance fields via mandatory tier.
# Use for regulated environments where TTL, health check intervals, failure thresholds,
# and resolver endpoint type must be non-negotiable org-wide.
---
apiVersion: aws.kropath.run/v1alpha1
kind: Route53Config
metadata:
  name: restricted
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: restricted
spec:
  mandatory:
    defaultTTL: 60
    healthCheckRequestInterval: 10
    healthCheckFailureThreshold: 2
    resolverEndpointType: "DUALSTACK"
    tags:
      compliance: restricted
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    defaultTTL: 0
    healthCheckRequestInterval: 0
    healthCheckFailureThreshold: 0
    resolverEndpointType: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
