# Hardened IAMConfig profile for security-critical environments.
# - Mandatory permissions boundary enforced on all IAM roles/users
# - IAM user access keys blocked (service accounts and IRSA only)
# - Maximum session duration capped at 1 hour
# Apply to kro-system (global) or target namespace for per-profile enforcement.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: strict
  namespace: kro-system
spec:
  mandatory:
    permissionsBoundaryArn: "arn:aws:iam::ACCOUNT_ID:policy/OrgPermissionsBoundary"
    blockIamUserAccessKeys: true
    maxSessionDurationSeconds: 3600
    namingTemplate: ""
    tags:
      compliance-tier: strict
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
