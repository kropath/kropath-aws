# Hardened OpenSearchConfig CR. Enforces all security posture fields via mandatory tier.
# Use for regulated workloads (PCI-DSS, HIPAA, SOC 2) where encryption, HTTPS, and
# fine-grained access control must be non-negotiable across all OpenSearch domains.
---
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: strict
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: strict
spec:
  mandatory:
    encryptionAtRestEnabled: true
    nodeToNodeEncryptionEnabled: true
    enforceHTTPS: true
    tlsSecurityPolicy: "Policy-Min-TLS-1-2-PFS-2023-10"
    advancedSecurityEnabled: true
    engineVersion: ""
    autoTuneDesiredState: ""
    standbyReplicas: ""
    namingTemplate: ""
    tags:
      compliance: pci-dss
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: "OpenSearch_2.9"
    autoTuneDesiredState: "ENABLED"
    standbyReplicas: "ENABLED"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
