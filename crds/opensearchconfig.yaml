---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: opensearchconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: OpenSearchConfig
    listKind: OpenSearchConfigList
    plural: opensearchconfigs
    singular: opensearchconfig
    shortNames:
      - oscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          # 8 mutual-exclusion rules — one per scalar governance field.
          # Boolean fields test for both == true (false = not enforced, safe zero value).
          # String fields test for both != "" ("" = not enforced).
          # Map fields (tags, syncedLabels, syncedAnnotations) merge additively — no rule needed.
          # namingTemplate is excluded from mutual-exclusion: per spec aws-os-01, only the 8
          # domain-specific governance fields carry mutual-exclusion validation rules.
          # has() guards prevent spurious rejections when a field is absent from one tier.
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionAtRestEnabled) &&
                  self.spec.mandatory.encryptionAtRestEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionAtRestEnabled) &&
                  self.spec.defaults.encryptionAtRestEnabled == true)
              message: >-
                encryptionAtRestEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.nodeToNodeEncryptionEnabled) &&
                  self.spec.mandatory.nodeToNodeEncryptionEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.nodeToNodeEncryptionEnabled) &&
                  self.spec.defaults.nodeToNodeEncryptionEnabled == true)
              message: >-
                nodeToNodeEncryptionEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enforceHTTPS) &&
                  self.spec.mandatory.enforceHTTPS == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enforceHTTPS) &&
                  self.spec.defaults.enforceHTTPS == true)
              message: >-
                enforceHTTPS must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tlsSecurityPolicy) &&
                  self.spec.mandatory.tlsSecurityPolicy != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.tlsSecurityPolicy) &&
                  self.spec.defaults.tlsSecurityPolicy != "")
              message: >-
                tlsSecurityPolicy must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.advancedSecurityEnabled) &&
                  self.spec.mandatory.advancedSecurityEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.advancedSecurityEnabled) &&
                  self.spec.defaults.advancedSecurityEnabled == true)
              message: >-
                advancedSecurityEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engineVersion) &&
                  self.spec.mandatory.engineVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engineVersion) &&
                  self.spec.defaults.engineVersion != "")
              message: >-
                engineVersion must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.autoTuneDesiredState) &&
                  self.spec.mandatory.autoTuneDesiredState != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.autoTuneDesiredState) &&
                  self.spec.defaults.autoTuneDesiredState != "")
              message: >-
                autoTuneDesiredState must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.standbyReplicas) &&
                  self.spec.mandatory.standbyReplicas != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.standbyReplicas) &&
                  self.spec.defaults.standbyReplicas != "")
              message: >-
                standbyReplicas must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory OpenSearch governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced. Platform teams set these to codify compliance postures.
                  properties:
                    encryptionAtRestEnabled:
                      type: boolean
                      description: >-
                        Forces encryption at rest on all OpenSearch domains in scope.
                        false (zero value) = not enforced. IMMUTABLE on OpenSearch domain after creation.
                    nodeToNodeEncryptionEnabled:
                      type: boolean
                      description: >-
                        Forces node-to-node TLS encryption on all OpenSearch domains in scope.
                        false (zero value) = not enforced. IMMUTABLE on domain after creation.
                    enforceHTTPS:
                      type: boolean
                      description: >-
                        Forces HTTPS-only access on all OpenSearch domains in scope.
                        false (zero value) = not enforced.
                    tlsSecurityPolicy:
                      type: string
                      description: >-
                        Forces minimum TLS security policy on all domains in scope.
                        Empty string = not enforced.
                        Valid values: Policy-Min-TLS-1-0-2019-10 | Policy-Min-TLS-1-2-2019-07 |
                        Policy-Min-TLS-1-2-PFS-2023-10.
                    advancedSecurityEnabled:
                      type: boolean
                      description: >-
                        Forces fine-grained access control on all OpenSearch domains in scope.
                        false (zero value) = not enforced. IMMUTABLE on domain after creation.
                    engineVersion:
                      type: string
                      description: >-
                        Forces engine version on all OpenSearch domains in scope.
                        Empty string = not enforced. Example: OpenSearch_2.9 | Elasticsearch_7.10.
                    autoTuneDesiredState:
                      type: string
                      description: >-
                        Forces Auto-Tune state on all OpenSearch domains in scope.
                        Empty string = not enforced. Valid values: ENABLED | DISABLED.
                    standbyReplicas:
                      type: string
                      description: >-
                        Forces standby replica configuration for OpenSearch Serverless collections
                        in scope. Empty string = not enforced. Valid values: ENABLED | DISABLED.
                    namingTemplate:
                      type: string
                      description: >-
                        Forces naming pattern. spec.nameOverride is the only escape hatch.
                        Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        OpenSearch-specific mandatory cloud tags merged into all resource cloud tags.
                        Instance cannot remove mandatory tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both K8s metadata.labels (aws.kropath.run/ prefix)
                        and cloud tags (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to K8s metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default OpenSearch governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this level.
                  properties:
                    encryptionAtRestEnabled:
                      type: boolean
                      description: >-
                        Default encryption at rest setting. Applies when instance spec field is nil.
                        Baseline: true (secure by default).
                    nodeToNodeEncryptionEnabled:
                      type: boolean
                      description: >-
                        Default node-to-node encryption setting. Applies when instance spec field is nil.
                        Baseline: true (secure by default).
                    enforceHTTPS:
                      type: boolean
                      description: >-
                        Default HTTPS-only enforcement. Applies when instance spec field is nil.
                        Baseline: true (secure by default).
                    tlsSecurityPolicy:
                      type: string
                      description: >-
                        Default minimum TLS security policy. Applies when instance spec field is empty.
                        Baseline: "Policy-Min-TLS-1-2-2019-07".
                    advancedSecurityEnabled:
                      type: boolean
                      description: >-
                        Default fine-grained access control. Applies when instance spec field is nil.
                        Baseline: false (opt-in feature).
                    engineVersion:
                      type: string
                      description: >-
                        Default engine version. Applies when instance spec.engineVersion is empty.
                        Instance can override. Baseline: "OpenSearch_2.9".
                    autoTuneDesiredState:
                      type: string
                      description: >-
                        Default Auto-Tune state. Applies when instance spec.autoTuneDesiredState is empty.
                        Baseline: "ENABLED".
                    standbyReplicas:
                      type: string
                      description: >-
                        Default standby replica configuration for serverless collections.
                        Baseline: "ENABLED".
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Applies when instance spec.nameOverride is empty.
                        Baseline: "{namespace}-{name}".
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Baseline cloud tags. Overridable per-instance.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Baseline synced labels. Overridable per-instance.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Baseline synced annotations. Overridable per-instance.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup (ADR-010).
                    Controller pre-merges KropathConfig + OpenSearchConfig tiers.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        encryptionAtRestEnabled:
                          type: boolean
                        nodeToNodeEncryptionEnabled:
                          type: boolean
                        enforceHTTPS:
                          type: boolean
                        tlsSecurityPolicy:
                          type: string
                        advancedSecurityEnabled:
                          type: boolean
                        engineVersion:
                          type: string
                        autoTuneDesiredState:
                          type: string
                        standbyReplicas:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        encryptionAtRestEnabled:
                          type: boolean
                        nodeToNodeEncryptionEnabled:
                          type: boolean
                        enforceHTTPS:
                          type: boolean
                        tlsSecurityPolicy:
                          type: string
                        advancedSecurityEnabled:
                          type: boolean
                        engineVersion:
                          type: string
                        autoTuneDesiredState:
                          type: string
                        standbyReplicas:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
