---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: route53configs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: Route53Config
    listKind: Route53ConfigList
    plural: route53configs
    singular: route53config
    shortNames:
      - r53cfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # Mutual-exclusivity: each governance field must not be set (non-zero/non-empty)
            # in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultTTL) &&
                  self.spec.mandatory.defaultTTL != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultTTL) &&
                  self.spec.defaults.defaultTTL != 0)
              message: "defaultTTL cannot be set in both mandatory and defaults simultaneously."
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.healthCheckRequestInterval) &&
                  self.spec.mandatory.healthCheckRequestInterval != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.healthCheckRequestInterval) &&
                  self.spec.defaults.healthCheckRequestInterval != 0)
              message: "healthCheckRequestInterval cannot be set in both mandatory and defaults simultaneously."
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.healthCheckFailureThreshold) &&
                  self.spec.mandatory.healthCheckFailureThreshold != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.healthCheckFailureThreshold) &&
                  self.spec.defaults.healthCheckFailureThreshold != 0)
              message: "healthCheckFailureThreshold cannot be set in both mandatory and defaults simultaneously."
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.resolverEndpointType) &&
                  self.spec.mandatory.resolverEndpointType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.resolverEndpointType) &&
                  self.spec.defaults.resolverEndpointType != "")
              message: "resolverEndpointType cannot be set in both mandatory and defaults simultaneously."
            # healthCheckRequestInterval valid values: 0 (not enforced), 10, or 30 only.
            - rule: >-
                !has(self.spec.mandatory) || !has(self.spec.mandatory.healthCheckRequestInterval) ||
                self.spec.mandatory.healthCheckRequestInterval == 0 ||
                self.spec.mandatory.healthCheckRequestInterval == 10 ||
                self.spec.mandatory.healthCheckRequestInterval == 30
              message: "mandatory.healthCheckRequestInterval must be 0 (not enforced), 10, or 30."
            - rule: >-
                !has(self.spec.defaults) || !has(self.spec.defaults.healthCheckRequestInterval) ||
                self.spec.defaults.healthCheckRequestInterval == 0 ||
                self.spec.defaults.healthCheckRequestInterval == 10 ||
                self.spec.defaults.healthCheckRequestInterval == 30
              message: "defaults.healthCheckRequestInterval must be 0 (not enforced), 10, or 30."
            # healthCheckFailureThreshold valid range: 0 (not enforced) or 1–10.
            - rule: >-
                !has(self.spec.mandatory) || !has(self.spec.mandatory.healthCheckFailureThreshold) ||
                (self.spec.mandatory.healthCheckFailureThreshold >= 0 &&
                 self.spec.mandatory.healthCheckFailureThreshold <= 10)
              message: "mandatory.healthCheckFailureThreshold must be 0 (not enforced) or 1–10."
            - rule: >-
                !has(self.spec.defaults) || !has(self.spec.defaults.healthCheckFailureThreshold) ||
                (self.spec.defaults.healthCheckFailureThreshold >= 0 &&
                 self.spec.defaults.healthCheckFailureThreshold <= 10)
              message: "defaults.healthCheckFailureThreshold must be 0 (not enforced) or 1–10."
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Route53 governance fields. Zero-value (0 for integers, "" for
                    strings) means the field is not enforced at this tier. Non-zero/non-empty
                    values override the instance spec and cannot be overridden by defaults.
                  properties:
                    defaultTTL:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        0 = not enforced. >0 = all record sets org-wide use this TTL (seconds).
                        Does not apply to alias records. Instance cannot override when set.
                    healthCheckRequestInterval:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        0 = not enforced. 10 = fast interval (higher cost). 30 = standard interval.
                        Instance cannot override when set.
                    healthCheckFailureThreshold:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        0 = not enforced. 1–10 = all health checks use this failure threshold.
                        Instance cannot override when set.
                    resolverEndpointType:
                      type: string
                      description: >-
                        Empty string = not enforced. IPV4 | IPV6 | DUALSTACK = all resolver
                        endpoints use this IP type. Instance cannot override when set.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Mandatory cloud tags merged into all Route53 resources.
                        Instance cannot remove mandatory tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Mandatory labels synced to K8s metadata.labels (prefixed aws.kropath.run/)
                        and cloud tags. Instance cannot remove mandatory synced labels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Mandatory annotations synced to K8s metadata.annotations.
                        Instance cannot remove mandatory synced annotations.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Route53 governance fields. Applied when the instance spec is empty
                    at that field. Zero-value (0 for integers, "" for strings) means no default
                    is provided at this tier.
                  properties:
                    defaultTTL:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default TTL for record sets in seconds. 0 = no profile default (use
                        Route53 built-in fallback of 300).
                    healthCheckRequestInterval:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default health check request interval. 0 = no profile default. 10 or 30.
                    healthCheckFailureThreshold:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default health check failure threshold (1–10). 0 = no profile default.
                    resolverEndpointType:
                      type: string
                      description: >-
                        Default resolver endpoint IP type. Empty string = no default; use
                        instance value (Route53 defaults to IPV4). IPV4 | IPV6 | DUALSTACK.
                    tags:
                      type: object
                      default: {}
                      description: Baseline cloud tags applied when instance does not override.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Baseline synced labels applied when instance does not override.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Baseline synced annotations applied when instance does not override.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. All Route53
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        defaultTTL:
                          type: integer
                          format: int64
                        healthCheckRequestInterval:
                          type: integer
                          format: int64
                        healthCheckFailureThreshold:
                          type: integer
                          format: int64
                        resolverEndpointType:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        defaultTTL:
                          type: integer
                          format: int64
                        healthCheckRequestInterval:
                          type: integer
                          format: int64
                        healthCheckFailureThreshold:
                          type: integer
                          format: int64
                        resolverEndpointType:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
