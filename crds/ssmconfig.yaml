---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ssmconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: SSMConfig
    listKind: SSMConfigList
    plural: ssmconfigs
    singular: ssmconfig
    shortNames:
      - ssmcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory.type) && self.spec.mandatory.type != ''
                  && has(self.spec.defaults.type) && self.spec.defaults.type != '')
              message: "type cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.tier) && self.spec.mandatory.tier != ''
                  && has(self.spec.defaults.tier) && self.spec.defaults.tier != '')
              message: "tier cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.keyID) && self.spec.mandatory.keyID != ''
                  && has(self.spec.defaults.keyID) && self.spec.defaults.keyID != '')
              message: "keyID cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.documentType) && self.spec.mandatory.documentType != ''
                  && has(self.spec.defaults.documentType) && self.spec.defaults.documentType != '')
              message: "documentType cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.allowedDocumentTypes) && size(self.spec.mandatory.allowedDocumentTypes) > 0
                  && has(self.spec.defaults.allowedDocumentTypes) && size(self.spec.defaults.allowedDocumentTypes) > 0)
              message: "allowedDocumentTypes cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.operatingSystem) && self.spec.mandatory.operatingSystem != ''
                  && has(self.spec.defaults.operatingSystem) && self.spec.defaults.operatingSystem != '')
              message: "operatingSystem cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.approvedPatchesComplianceLevel) && self.spec.mandatory.approvedPatchesComplianceLevel != ''
                  && has(self.spec.defaults.approvedPatchesComplianceLevel) && self.spec.defaults.approvedPatchesComplianceLevel != '')
              message: "approvedPatchesComplianceLevel cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.rejectedPatchesAction) && self.spec.mandatory.rejectedPatchesAction != ''
                  && has(self.spec.defaults.rejectedPatchesAction) && self.spec.defaults.rejectedPatchesAction != '')
              message: "rejectedPatchesAction cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.approvedPatchesEnableNonSecurity)
                  && has(self.spec.defaults.approvedPatchesEnableNonSecurity))
              message: "approvedPatchesEnableNonSecurity cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory SSM governance fields. Zero-value means the field is
                    not enforced at this tier.
                  properties:
                    type:
                      type: string
                      description: >-
                        Empty string = not enforced. Non-empty forces all parameters to a
                        specific type (String | StringList | SecureString). Note: type is
                        immutable after parameter creation.
                    tier:
                      type: string
                      description: >-
                        Empty string = not enforced. Non-empty forces parameter tier
                        (Standard | Advanced | Intelligent-Tiering). Advancing to Advanced
                        is irreversible without deletion and recreation.
                    keyID:
                      type: string
                      description: >-
                        Empty string = not enforced. Non-empty forces a specific KMS key ARN,
                        ID, or alias for SecureString encryption.
                    documentType:
                      type: string
                      description: >-
                        Empty string = not enforced. Non-empty forces all documents to a
                        specific type (Command | Automation | Policy | Session | etc.).
                    allowedDocumentTypes:
                      type: array
                      description: >-
                        Empty list = no restriction. Non-empty = allowlist restricting which
                        document types can be created. Controller validates documentType is
                        a member of this list when both are set.
                      items:
                        type: string
                    operatingSystem:
                      type: string
                      description: >-
                        Empty string = not enforced. Non-empty forces a specific OS for all
                        patch baselines (WINDOWS | AMAZON_LINUX | AMAZON_LINUX_2 |
                        AMAZON_LINUX_2022 | AMAZON_LINUX_2023 | UBUNTU | REDHAT_ENTERPRISE_LINUX |
                        SUSE | CENTOS | ORACLE_LINUX | DEBIAN | MACOS | RASPBIAN | ROCKY_LINUX |
                        ALMA_LINUX).
                    approvedPatchesComplianceLevel:
                      type: string
                      description: >-
                        Empty string = not enforced. Non-empty forces a compliance level for
                        all patch baselines (CRITICAL | HIGH | MEDIUM | LOW | INFORMATIONAL |
                        UNSPECIFIED).
                    rejectedPatchesAction:
                      type: string
                      description: >-
                        Empty string = not enforced. Non-empty forces the rejected patches
                        action for all patch baselines (ALLOW_AS_DEPENDENCY | BLOCK).
                    approvedPatchesEnableNonSecurity:
                      type: boolean
                      nullable: true
                      description: >-
                        nil/absent = not enforced; true = forces non-security update inclusion
                        on all patch baselines; false = forces non-security updates excluded.
                        Use nil (omit the field) as the "not enforced" sentinel — not false.
                    namingTemplate:
                      type: string
                      description: >-
                        Empty string = no mandatory naming template. Non-empty forces naming
                        pattern; spec.nameOverride is the only escape hatch.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Merged into all SSM resource cloud tags. Instance cannot remove
                        mandatory tags.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Merged into all SSM resource K8s labels and cloud tags (ADR-015 §6.1).
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Merged into all SSM resource K8s annotations (ADR-015 §6).
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default SSM governance fields. Zero-value means no default is
                    provided at this tier.
                  properties:
                    type:
                      type: string
                      description: >-
                        Default parameter type. Applies when instance spec.type is empty.
                        Note: type is immutable after parameter creation.
                    tier:
                      type: string
                      description: >-
                        Default tier. Empty string = AWS determines based on account default.
                        Applies when instance spec.tier is empty.
                    keyID:
                      type: string
                      description: >-
                        Default KMS key. Empty string = AWS default KMS key.
                        Applies when instance spec.keyID is empty.
                    documentType:
                      type: string
                      description: >-
                        Default document type. Empty string = AWS defaults to Command.
                        Applies when instance spec.documentType is empty.
                    allowedDocumentTypes:
                      type: array
                      description: >-
                        Default allowlist for document types. Empty = no restriction.
                        Applies when no higher-priority source sets allowedDocumentTypes.
                      items:
                        type: string
                    operatingSystem:
                      type: string
                      description: >-
                        Default OS for patch baselines. Empty string = AWS defaults to WINDOWS.
                        Applies when instance spec.operatingSystem is empty.
                    approvedPatchesComplianceLevel:
                      type: string
                      description: >-
                        Default patch compliance level. Empty string = no default.
                        Applies when instance does not specify a compliance level.
                    rejectedPatchesAction:
                      type: string
                      description: >-
                        Default rejected patches action. Empty string = no default.
                        Applies when instance does not specify an action.
                    approvedPatchesEnableNonSecurity:
                      type: boolean
                      nullable: true
                      description: >-
                        nil/absent = not set; true = includes non-security updates by default;
                        false = excludes non-security updates by default.
                        Use nil (omit the field) when no default should be applied.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Applies when instance spec.nameOverride is
                        empty.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Baseline cloud tags; overridable per-instance.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Baseline synced labels; overridable per-instance.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Baseline synced annotations; overridable per-instance.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef resources entry.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        type:
                          type: string
                        tier:
                          type: string
                        keyID:
                          type: string
                        documentType:
                          type: string
                        allowedDocumentTypes:
                          type: array
                          items:
                            type: string
                        operatingSystem:
                          type: string
                        approvedPatchesComplianceLevel:
                          type: string
                        rejectedPatchesAction:
                          type: string
                        approvedPatchesEnableNonSecurity:
                          type: boolean
                          nullable: true
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                          description: >-
                            Merged: KropathConfig.mandatory.tags +
                            SSMConfig.mandatory.tags
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        type:
                          type: string
                        tier:
                          type: string
                        keyID:
                          type: string
                        documentType:
                          type: string
                        allowedDocumentTypes:
                          type: array
                          items:
                            type: string
                        operatingSystem:
                          type: string
                        approvedPatchesComplianceLevel:
                          type: string
                        rejectedPatchesAction:
                          type: string
                        approvedPatchesEnableNonSecurity:
                          type: boolean
                          nullable: true
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                          description: >-
                            Merged: KropathConfig.defaults.tags +
                            SSMConfig.defaults.tags
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
