---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sqsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: SQSConfig
    listKind: SQSConfigList
    plural: sqsconfigs
    singular: sqsconfig
    shortNames:
      - sqscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionType) &&
                  self.spec.mandatory.encryptionType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionType) &&
                  self.spec.defaults.encryptionType != "")
              message: >-
                encryptionType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsMasterKeyId) &&
                  self.spec.mandatory.kmsMasterKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsMasterKeyId) &&
                  self.spec.defaults.kmsMasterKeyId != "")
              message: >-
                kmsMasterKeyId cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.visibilityTimeout) &&
                  self.spec.mandatory.visibilityTimeout > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.visibilityTimeout) &&
                  self.spec.defaults.visibilityTimeout > 0)
              message: >-
                visibilityTimeout cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.messageRetentionPeriod) &&
                  self.spec.mandatory.messageRetentionPeriod > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.messageRetentionPeriod) &&
                  self.spec.defaults.messageRetentionPeriod > 0)
              message: >-
                messageRetentionPeriod cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.delaySeconds) &&
                  self.spec.mandatory.delaySeconds > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.delaySeconds) &&
                  self.spec.defaults.delaySeconds > 0)
              message: >-
                delaySeconds cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maximumMessageSize) &&
                  self.spec.mandatory.maximumMessageSize > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maximumMessageSize) &&
                  self.spec.defaults.maximumMessageSize > 0)
              message: >-
                maximumMessageSize cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory SQS governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced.
                  properties:
                    encryptionType:
                      type: string
                      default: ""
                      description: >-
                        Required encryption type for all SQS queues in this profile.
                        Empty string = not enforced. One of: "sqs-managed", "kms", "none".
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: >-
                        Required KMS key ID, ARN, or alias for SSE-KMS queues.
                        Empty string = not enforced.
                    visibilityTimeout:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      maximum: 43200
                      description: >-
                        Hard ceiling for queue visibility timeout in seconds (0-43200).
                        0 = not enforced.
                    messageRetentionPeriod:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      maximum: 1209600
                      description: >-
                        Hard ceiling for message retention period in seconds (60-1209600).
                        0 = not enforced.
                    delaySeconds:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      maximum: 900
                      description: >-
                        Hard ceiling for message delivery delay in seconds (0-900).
                        0 = not enforced.
                    maximumMessageSize:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      maximum: 262144
                      description: >-
                        Hard ceiling for maximum message size in bytes (1024-262144).
                        0 = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Naming template for SQS queue names. Empty string = no mandatory template.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        SQS-specific mandatory cloud tags applied to all queues under this profile.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default SQS governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this level.
                  properties:
                    encryptionType:
                      type: string
                      default: ""
                      description: >-
                        Default encryption type for SQS queues. Empty string = not set at this tier.
                        One of: "sqs-managed", "kms", "none".
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: >-
                        Default KMS key ID, ARN, or alias for SSE-KMS queues.
                        Empty string = use AWS-managed key.
                    visibilityTimeout:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      maximum: 43200
                      description: >-
                        Default visibility timeout in seconds. 0 = not set at this tier.
                    messageRetentionPeriod:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      maximum: 1209600
                      description: >-
                        Default message retention period in seconds. 0 = not set at this tier.
                    delaySeconds:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      maximum: 900
                      description: >-
                        Default message delivery delay in seconds. Baseline: 0.
                    maximumMessageSize:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      maximum: 262144
                      description: >-
                        Default maximum message size in bytes. 0 = not set at this tier.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Default naming template for SQS queue names.
                        Empty string = not set at this tier.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        encryptionType:
                          type: string
                        kmsMasterKeyId:
                          type: string
                        visibilityTimeout:
                          type: integer
                          format: int64
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                        delaySeconds:
                          type: integer
                          format: int64
                        maximumMessageSize:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        encryptionType:
                          type: string
                        kmsMasterKeyId:
                          type: string
                        visibilityTimeout:
                          type: integer
                          format: int64
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                        delaySeconds:
                          type: integer
                          format: int64
                        maximumMessageSize:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
