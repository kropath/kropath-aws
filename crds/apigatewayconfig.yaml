---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apigatewayconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: APIGatewayConfig
    listKind: APIGatewayConfigList
    plural: apigatewayconfigs
    singular: apigatewayconfig
    shortNames:
      - apigwcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.endpointType) &&
                  self.spec.mandatory.endpointType != '' &&
                  has(self.spec.defaults) && has(self.spec.defaults.endpointType) &&
                  self.spec.defaults.endpointType != '')
              message: >-
                endpointType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.apiKeySource) &&
                  self.spec.mandatory.apiKeySource != '' &&
                  has(self.spec.defaults) && has(self.spec.defaults.apiKeySource) &&
                  self.spec.defaults.apiKeySource != '')
              message: >-
                apiKeySource cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.minimumTlsVersion) &&
                  self.spec.mandatory.minimumTlsVersion != '' &&
                  has(self.spec.defaults) && has(self.spec.defaults.minimumTlsVersion) &&
                  self.spec.defaults.minimumTlsVersion != '')
              message: >-
                minimumTlsVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.disableExecuteApiEndpoint) &&
                  self.spec.mandatory.disableExecuteApiEndpoint == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.disableExecuteApiEndpoint) &&
                  self.spec.defaults.disableExecuteApiEndpoint == true)
              message: >-
                disableExecuteApiEndpoint cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != '' &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != '')
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory API Gateway governance fields. Zero-value means the field is
                    not enforced at this tier.
                  properties:
                    endpointType:
                      type: string
                      description: >-
                        Enforced endpoint type for all REST APIs.
                        Empty string = not enforced. Valid values: REGIONAL, EDGE, PRIVATE.
                    apiKeySource:
                      type: string
                      description: >-
                        Enforced API key source for all REST APIs.
                        Empty string = not enforced. Valid values: HEADER, AUTHORIZER.
                    minimumTlsVersion:
                      type: string
                      description: >-
                        Enforced minimum TLS version (maps to securityPolicy on RestAPI).
                        Empty string = not enforced. Valid values: TLS_1_2.
                    disableExecuteApiEndpoint:
                      type: boolean
                      description: >-
                        When true, all REST APIs must disable the default execute-api endpoint.
                        false = not enforced.
                    namingTemplate:
                      type: string
                      description: >-
                        Mandatory naming template for cloud resource names.
                        Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default API Gateway governance fields. Zero-value means no default is
                    provided at this tier.
                  properties:
                    endpointType:
                      type: string
                      description: >-
                        Default endpoint type. Empty string = no default.
                        Valid values: REGIONAL, EDGE, PRIVATE.
                    apiKeySource:
                      type: string
                      description: >-
                        Default API key source. Empty string = no default.
                        Valid values: HEADER, AUTHORIZER.
                    minimumTlsVersion:
                      type: string
                      description: >-
                        Default minimum TLS version. Empty string = use API Gateway default (TLS 1.0).
                    disableExecuteApiEndpoint:
                      type: boolean
                      description: Default execute-api endpoint disable toggle.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template for cloud resource names.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        endpointType:
                          type: string
                        apiKeySource:
                          type: string
                        minimumTlsVersion:
                          type: string
                        disableExecuteApiEndpoint:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        endpointType:
                          type: string
                        apiKeySource:
                          type: string
                        minimumTlsVersion:
                          type: string
                        disableExecuteApiEndpoint:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
