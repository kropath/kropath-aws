---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backupconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: BackupConfig
    listKind: BackupConfigList
    plural: backupconfigs
    singular: backupconfig
    shortNames:
      - backupcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionKeyARN) &&
                  self.spec.mandatory.encryptionKeyARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionKeyARN) &&
                  self.spec.defaults.encryptionKeyARN != "")
              message: "encryptionKeyARN cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.vaultLockMinRetentionDays) &&
                  self.spec.mandatory.vaultLockMinRetentionDays > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.vaultLockMinRetentionDays) &&
                  self.spec.defaults.vaultLockMinRetentionDays > 0)
              message: "vaultLockMinRetentionDays cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.vaultLockMaxRetentionDays) &&
                  self.spec.mandatory.vaultLockMaxRetentionDays > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.vaultLockMaxRetentionDays) &&
                  self.spec.defaults.vaultLockMaxRetentionDays > 0)
              message: "vaultLockMaxRetentionDays cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableContinuousBackup) &&
                  self.spec.mandatory.enableContinuousBackup == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableContinuousBackup) &&
                  self.spec.defaults.enableContinuousBackup == true)
              message: "enableContinuousBackup cannot be set to true in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultLifecycleDeleteAfterDays) &&
                  self.spec.mandatory.defaultLifecycleDeleteAfterDays > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultLifecycleDeleteAfterDays) &&
                  self.spec.defaults.defaultLifecycleDeleteAfterDays > 0)
              message: "defaultLifecycleDeleteAfterDays cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultLifecycleMoveToColdStorageAfterDays) &&
                  self.spec.mandatory.defaultLifecycleMoveToColdStorageAfterDays > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultLifecycleMoveToColdStorageAfterDays) &&
                  self.spec.defaults.defaultLifecycleMoveToColdStorageAfterDays > 0)
              message: "defaultLifecycleMoveToColdStorageAfterDays cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableMalwareScan) &&
                  self.spec.mandatory.enableMalwareScan == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableMalwareScan) &&
                  self.spec.defaults.enableMalwareScan == true)
              message: "enableMalwareScan cannot be set to true in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.scannerRoleARN) &&
                  self.spec.mandatory.scannerRoleARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.scannerRoleARN) &&
                  self.spec.defaults.scannerRoleARN != "")
              message: "scannerRoleARN cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.iamRoleARN) &&
                  self.spec.mandatory.iamRoleARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.iamRoleARN) &&
                  self.spec.defaults.iamRoleARN != "")
              message: "iamRoleARN cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Backup governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    encryptionKeyARN:
                      type: string
                      description: Empty string = not enforced. Non-empty forces KMS key for all vaults.
                    vaultLockMinRetentionDays:
                      type: integer
                      description: 0 = not enforced. Non-zero forces Vault Lock minimum retention.
                    vaultLockMaxRetentionDays:
                      type: integer
                      description: 0 = not enforced. Non-zero forces Vault Lock maximum retention.
                    enableContinuousBackup:
                      type: boolean
                      description: false = not enforced. true = PITR required on all rules.
                    defaultLifecycleDeleteAfterDays:
                      type: integer
                      description: 0 = not enforced. Non-zero forces minimum retention.
                    defaultLifecycleMoveToColdStorageAfterDays:
                      type: integer
                      description: 0 = not enforced. Non-zero forces cold storage transition.
                    enableMalwareScan:
                      type: boolean
                      description: false = not enforced. true = malware scanning required on all plans.
                    scannerRoleARN:
                      type: string
                      description: Empty string = not enforced. Non-empty forces specific scanner role.
                    iamRoleARN:
                      type: string
                      description: Empty string = not enforced. Non-empty forces specific backup role.
                    namingTemplate:
                      type: string
                      description: Empty string = no mandatory naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Backup governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    encryptionKeyARN:
                      type: string
                      description: Empty string = AWS-managed key. Non-empty provides default KMS key.
                    vaultLockMinRetentionDays:
                      type: integer
                      description: 0 = Vault Lock not configured. Non-zero provides default minimum retention.
                    vaultLockMaxRetentionDays:
                      type: integer
                      description: 0 = Vault Lock not configured. Non-zero provides default maximum retention.
                    enableContinuousBackup:
                      type: boolean
                      description: Default PITR toggle.
                    defaultLifecycleDeleteAfterDays:
                      type: integer
                      description: 0 = no default retention. Non-zero provides default retention days.
                    defaultLifecycleMoveToColdStorageAfterDays:
                      type: integer
                      description: 0 = no cold storage transition. Non-zero provides default cold storage days.
                    enableMalwareScan:
                      type: boolean
                      description: Default malware scanning toggle.
                    scannerRoleARN:
                      type: string
                      description: Empty string = must be specified when scanning is enabled.
                    iamRoleARN:
                      type: string
                      description: Empty string = must be specified per-instance.
                    namingTemplate:
                      type: string
                      description: Default naming template. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        encryptionKeyARN:
                          type: string
                        vaultLockMinRetentionDays:
                          type: integer
                        vaultLockMaxRetentionDays:
                          type: integer
                        enableContinuousBackup:
                          type: boolean
                        defaultLifecycleDeleteAfterDays:
                          type: integer
                        defaultLifecycleMoveToColdStorageAfterDays:
                          type: integer
                        enableMalwareScan:
                          type: boolean
                        scannerRoleARN:
                          type: string
                        iamRoleARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        encryptionKeyARN:
                          type: string
                        vaultLockMinRetentionDays:
                          type: integer
                        vaultLockMaxRetentionDays:
                          type: integer
                        enableContinuousBackup:
                          type: boolean
                        defaultLifecycleDeleteAfterDays:
                          type: integer
                        defaultLifecycleMoveToColdStorageAfterDays:
                          type: integer
                        enableMalwareScan:
                          type: boolean
                        scannerRoleARN:
                          type: string
                        iamRoleARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
