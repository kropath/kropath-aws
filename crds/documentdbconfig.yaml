---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: documentdbconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: DocumentDBConfig
    listKind: DocumentDBConfigList
    plural: documentdbconfigs
    singular: documentdbconfig
    shortNames:
      - docdbcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          # 11 mutual-exclusion rules — one per scalar governance field.
          # Boolean sentinel (false = not enforced): both must be true to trigger.
          # String sentinel ("" = not enforced): both must be non-empty.
          # Integer sentinel (0 = not enforced): both must be non-zero.
          # Array sentinel ([] = not enforced): both must have size > 0.
          # Map fields (tags, syncedLabels, syncedAnnotations) use additive merge
          # and are explicitly excluded from mutual-exclusion validation.
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.storageEncrypted) &&
                  self.spec.mandatory.storageEncrypted == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.storageEncrypted) &&
                  self.spec.defaults.storageEncrypted == true)
              message: >-
                storageEncrypted cannot be set to true in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.deletionProtection) &&
                  self.spec.mandatory.deletionProtection == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.deletionProtection) &&
                  self.spec.defaults.deletionProtection == true)
              message: >-
                deletionProtection cannot be set to true in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyArn) &&
                  self.spec.mandatory.kmsKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyArn) &&
                  self.spec.defaults.kmsKeyArn != "")
              message: >-
                kmsKeyArn cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.performanceInsightsEnabled) &&
                  self.spec.mandatory.performanceInsightsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.performanceInsightsEnabled) &&
                  self.spec.defaults.performanceInsightsEnabled == true)
              message: >-
                performanceInsightsEnabled cannot be set to true in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.dbInstanceClass) &&
                  self.spec.mandatory.dbInstanceClass != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.dbInstanceClass) &&
                  self.spec.defaults.dbInstanceClass != "")
              message: >-
                dbInstanceClass cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engineVersion) &&
                  self.spec.mandatory.engineVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engineVersion) &&
                  self.spec.defaults.engineVersion != "")
              message: >-
                engineVersion cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedInstanceClasses) &&
                  size(self.spec.mandatory.allowedInstanceClasses) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedInstanceClasses) &&
                  size(self.spec.defaults.allowedInstanceClasses) > 0)
              message: >-
                allowedInstanceClasses cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.storageType) &&
                  self.spec.mandatory.storageType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.storageType) &&
                  self.spec.defaults.storageType != "")
              message: >-
                storageType cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.backupRetentionPeriod) &&
                  self.spec.mandatory.backupRetentionPeriod != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.backupRetentionPeriod) &&
                  self.spec.defaults.backupRetentionPeriod != 0)
              message: >-
                backupRetentionPeriod cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableCloudwatchLogsExports) &&
                  size(self.spec.mandatory.enableCloudwatchLogsExports) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableCloudwatchLogsExports) &&
                  size(self.spec.defaults.enableCloudwatchLogsExports) > 0)
              message: >-
                enableCloudwatchLogsExports cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults simultaneously.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory DocumentDB governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced at this tier.
                  properties:
                    storageEncrypted:
                      type: boolean
                      description: >-
                        When true, forces encryption at rest on all DocumentDB clusters.
                        false = not enforced at this tier. Note: encryption is immutable after
                        cluster creation — a change requires cluster recreation.
                    deletionProtection:
                      type: boolean
                      description: >-
                        When true, forces deletion protection on all DocumentDB clusters.
                        false = not enforced at this tier.
                    kmsKeyArn:
                      type: string
                      description: >-
                        Mandatory KMS key ARN for customer-managed encryption.
                        Empty string = not enforced. Non-empty = org-wide CMK forced on all clusters.
                        Maps to ACK DBCluster.spec.kmsKeyID.
                    performanceInsightsEnabled:
                      type: boolean
                      description: >-
                        When true, forces Performance Insights on all DocumentDB instances.
                        false = not enforced at this tier.
                    dbInstanceClass:
                      type: string
                      description: >-
                        Mandatory instance class for all DocumentDB instances.
                        Empty string = not enforced. Non-empty = forced instance class (e.g. "db.r6g.large").
                    engineVersion:
                      type: string
                      description: >-
                        Mandatory DocumentDB engine version (e.g. "5.0.0").
                        Empty string = not enforced. Non-empty = forced engine version.
                    allowedInstanceClasses:
                      type: array
                      description: >-
                        Allowlist of permitted instance classes. Empty = no restriction.
                        Non-empty: kropath-controller validates dbInstanceClass is a member;
                        a mismatch sets status.conditions[Valid]=False with
                        reason InvalidInstanceClassNotInAllowedList.
                      items:
                        type: string
                    storageType:
                      type: string
                      description: >-
                        Mandatory storage type for all DocumentDB clusters.
                        Empty string = not enforced. Valid values: "standard", "iopt1".
                        Note: iopt1 is irreversible — clusters cannot revert to standard.
                    backupRetentionPeriod:
                      type: integer
                      minimum: 0
                      maximum: 35
                      description: >-
                        Mandatory minimum backup retention days (1–35). 0 = not enforced.
                        When non-zero, applies minimum-floor semantics: max(mandatory, instance).
                        Instance may retain longer but cannot go below this floor.
                    enableCloudwatchLogsExports:
                      type: array
                      description: >-
                        Mandatory CloudWatch Logs export types. Empty = not enforced.
                        Valid values: "audit", "profiler". Non-empty forces these log types
                        on all clusters; instances cannot remove mandatory log types.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      description: >-
                        Mandatory naming template for DocumentDB resource names.
                        Empty string = not enforced. Non-empty overrides all profile and instance defaults.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        DocumentDB-specific mandatory cloud tags applied to all resources under this profile.
                        Merged additively with KropathConfig.mandatory.tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default DocumentDB governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this level.
                  properties:
                    storageEncrypted:
                      type: boolean
                      description: >-
                        Default encryption-at-rest setting. true = encrypted by default (secure default);
                        instance can override. Note: encryption is immutable after cluster creation.
                    deletionProtection:
                      type: boolean
                      description: >-
                        Default deletion protection. false = off by default; instance can override.
                    kmsKeyArn:
                      type: string
                      description: >-
                        Default KMS key ARN. Empty string = AWS-owned key (default encryption).
                        Non-empty = default CMK; instance can override. Maps to ACK DBCluster.spec.kmsKeyID.
                    performanceInsightsEnabled:
                      type: boolean
                      description: >-
                        Default Performance Insights setting. false = PI off by default; instance can override.
                    dbInstanceClass:
                      type: string
                      description: >-
                        Default instance class. Empty = workload-dependent default; instance can override.
                    engineVersion:
                      type: string
                      description: >-
                        Default engine version. Empty = latest version; instance can override.
                    allowedInstanceClasses:
                      type: array
                      description: >-
                        Default allowlist of permitted instance classes. Empty = no restriction.
                        Instance can override with a subset.
                      items:
                        type: string
                    storageType:
                      type: string
                      description: >-
                        Default storage type. Empty = "standard" (AWS default); instance can override.
                        Valid values: "standard", "iopt1".
                    backupRetentionPeriod:
                      type: integer
                      minimum: 0
                      maximum: 35
                      description: >-
                        Default backup retention days (1–35). 0 = no explicit default.
                        7 = sensible default (7-day retention); instance can override.
                    enableCloudwatchLogsExports:
                      type: array
                      description: >-
                        Default CloudWatch Logs export types. Empty = no default.
                        ["audit"] = sensible default (audit logging). Instance can extend.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. "{namespace}-{name}" = standard naming pattern.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        DocumentDB-specific baseline cloud tags. Overridable per-instance.
                        Merged additively with KropathConfig.defaults.tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                    Not written when status.conditions[Valid].status=False.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        storageEncrypted:
                          type: boolean
                        deletionProtection:
                          type: boolean
                        kmsKeyArn:
                          type: string
                        performanceInsightsEnabled:
                          type: boolean
                        dbInstanceClass:
                          type: string
                        engineVersion:
                          type: string
                        allowedInstanceClasses:
                          type: array
                          items:
                            type: string
                        storageType:
                          type: string
                        backupRetentionPeriod:
                          type: integer
                        enableCloudwatchLogsExports:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        storageEncrypted:
                          type: boolean
                        deletionProtection:
                          type: boolean
                        kmsKeyArn:
                          type: string
                        performanceInsightsEnabled:
                          type: boolean
                        dbInstanceClass:
                          type: string
                        engineVersion:
                          type: string
                        allowedInstanceClasses:
                          type: array
                          items:
                            type: string
                        storageType:
                          type: string
                        backupRetentionPeriod:
                          type: integer
                        enableCloudwatchLogsExports:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
