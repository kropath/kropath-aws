---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudtrailconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: CloudTrailConfig
    listKind: CloudTrailConfigList
    plural: cloudtrailconfigs
    singular: cloudtrailconfig
    shortNames:
      - ctcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.isMultiRegionTrail) &&
                  self.spec.mandatory.isMultiRegionTrail == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.isMultiRegionTrail) &&
                  self.spec.defaults.isMultiRegionTrail == true)
              message: >-
                isMultiRegionTrail cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableLogFileValidation) &&
                  self.spec.mandatory.enableLogFileValidation == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableLogFileValidation) &&
                  self.spec.defaults.enableLogFileValidation == true)
              message: >-
                enableLogFileValidation cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.includeGlobalServiceEvents) &&
                  self.spec.mandatory.includeGlobalServiceEvents == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.includeGlobalServiceEvents) &&
                  self.spec.defaults.includeGlobalServiceEvents == true)
              message: >-
                includeGlobalServiceEvents cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.isOrganizationTrail) &&
                  self.spec.mandatory.isOrganizationTrail == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.isOrganizationTrail) &&
                  self.spec.defaults.isOrganizationTrail == true)
              message: >-
                isOrganizationTrail cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3BucketName) &&
                  self.spec.mandatory.s3BucketName != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3BucketName) &&
                  self.spec.defaults.s3BucketName != "")
              message: >-
                s3BucketName cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.s3KeyPrefix) &&
                  self.spec.mandatory.s3KeyPrefix != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.s3KeyPrefix) &&
                  self.spec.defaults.s3KeyPrefix != "")
              message: >-
                s3KeyPrefix cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyID) &&
                  self.spec.mandatory.kmsKeyID != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyID) &&
                  self.spec.defaults.kmsKeyID != "")
              message: >-
                kmsKeyID cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.multiRegionEnabled) &&
                  self.spec.mandatory.multiRegionEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.multiRegionEnabled) &&
                  self.spec.defaults.multiRegionEnabled == true)
              message: >-
                multiRegionEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.organizationEnabled) &&
                  self.spec.mandatory.organizationEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.organizationEnabled) &&
                  self.spec.defaults.organizationEnabled == true)
              message: >-
                organizationEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.retentionPeriod) &&
                  self.spec.mandatory.retentionPeriod > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.retentionPeriod) &&
                  self.spec.defaults.retentionPeriod > 0)
              message: >-
                retentionPeriod cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.terminationProtectionEnabled) &&
                  self.spec.mandatory.terminationProtectionEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.terminationProtectionEnabled) &&
                  self.spec.defaults.terminationProtectionEnabled == true)
              message: >-
                terminationProtectionEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory CloudTrail governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    isMultiRegionTrail:
                      type: boolean
                      default: false
                      description: When true, multi-region trail is enforced. false = not enforced.
                    enableLogFileValidation:
                      type: boolean
                      default: false
                      description: When true, log file validation is enforced. false = not enforced.
                    includeGlobalServiceEvents:
                      type: boolean
                      default: false
                      description: When true, global service events inclusion is enforced. false = not enforced.
                    isOrganizationTrail:
                      type: boolean
                      default: false
                      description: When true, organization trail is enforced. false = not enforced.
                    s3BucketName:
                      type: string
                      default: ""
                      description: S3 bucket name for trail logs. Empty string = not enforced.
                    s3KeyPrefix:
                      type: string
                      default: ""
                      description: S3 key prefix for trail logs. Empty string = not enforced.
                    kmsKeyID:
                      type: string
                      default: ""
                      description: KMS key ID for trail encryption. Empty string = not enforced.
                    multiRegionEnabled:
                      type: boolean
                      default: false
                      description: When true, multi-region EventDataStore is enforced. false = not enforced.
                    organizationEnabled:
                      type: boolean
                      default: false
                      description: When true, organization EventDataStore is enforced. false = not enforced.
                    retentionPeriod:
                      type: integer
                      default: 0
                      description: EventDataStore retention period in days. 0 = not enforced.
                    terminationProtectionEnabled:
                      type: boolean
                      default: false
                      description: When true, termination protection is enforced. false = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: Naming template for CloudTrail resources. Empty string = no mandatory template.
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default CloudTrail governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    isMultiRegionTrail:
                      type: boolean
                      default: false
                      description: Default multi-region trail setting. false = single-region.
                    enableLogFileValidation:
                      type: boolean
                      default: true
                      description: Default log file validation. true = validation enabled.
                    includeGlobalServiceEvents:
                      type: boolean
                      default: true
                      description: Default global service events inclusion. true = include global events.
                    isOrganizationTrail:
                      type: boolean
                      default: false
                      description: Default organization trail setting. false = single account.
                    s3BucketName:
                      type: string
                      default: ""
                      description: Default S3 bucket name. Empty string = no default.
                    s3KeyPrefix:
                      type: string
                      default: ""
                      description: Default S3 key prefix. Empty string = no default.
                    kmsKeyID:
                      type: string
                      default: ""
                      description: Default KMS key ID. Empty string = no default.
                    multiRegionEnabled:
                      type: boolean
                      default: false
                      description: Default multi-region EventDataStore. false = single-region.
                    organizationEnabled:
                      type: boolean
                      default: false
                      description: Default organization EventDataStore. false = single account.
                    retentionPeriod:
                      type: integer
                      default: 2557
                      description: Default EventDataStore retention period (~7 years).
                    terminationProtectionEnabled:
                      type: boolean
                      default: true
                      description: Default termination protection. true = protection enabled.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: Default naming template for CloudTrail resources.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        isMultiRegionTrail:
                          type: boolean
                        enableLogFileValidation:
                          type: boolean
                        includeGlobalServiceEvents:
                          type: boolean
                        isOrganizationTrail:
                          type: boolean
                        s3BucketName:
                          type: string
                        s3KeyPrefix:
                          type: string
                        kmsKeyID:
                          type: string
                        multiRegionEnabled:
                          type: boolean
                        organizationEnabled:
                          type: boolean
                        retentionPeriod:
                          type: integer
                        terminationProtectionEnabled:
                          type: boolean
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                        namingTemplate:
                          type: string
                    defaults:
                      type: object
                      properties:
                        isMultiRegionTrail:
                          type: boolean
                        enableLogFileValidation:
                          type: boolean
                        includeGlobalServiceEvents:
                          type: boolean
                        isOrganizationTrail:
                          type: boolean
                        s3BucketName:
                          type: string
                        s3KeyPrefix:
                          type: string
                        kmsKeyID:
                          type: string
                        multiRegionEnabled:
                          type: boolean
                        organizationEnabled:
                          type: boolean
                        retentionPeriod:
                          type: integer
                        terminationProtectionEnabled:
                          type: boolean
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                        namingTemplate:
                          type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
