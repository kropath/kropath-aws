---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mwaaconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: MWAAConfig
    listKind: MWAAConfigList
    plural: mwaaconfigs
    singular: mwaaconfig
    shortNames:
      - mwaacfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.airflowVersion) &&
                  self.spec.mandatory.airflowVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.airflowVersion) &&
                  self.spec.defaults.airflowVersion != "")
              message: >-
                airflowVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.environmentClass) &&
                  self.spec.mandatory.environmentClass != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.environmentClass) &&
                  self.spec.defaults.environmentClass != "")
              message: >-
                environmentClass cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.webserverAccessMode) &&
                  self.spec.mandatory.webserverAccessMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.webserverAccessMode) &&
                  self.spec.defaults.webserverAccessMode != "")
              message: >-
                webserverAccessMode cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.endpointManagement) &&
                  self.spec.mandatory.endpointManagement != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.endpointManagement) &&
                  self.spec.defaults.endpointManagement != "")
              message: >-
                endpointManagement cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyARN) &&
                  self.spec.mandatory.kmsKeyARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyARN) &&
                  self.spec.defaults.kmsKeyARN != "")
              message: >-
                kmsKeyARN cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.dagProcessingLogsEnabled) &&
                  has(self.spec.defaults) && has(self.spec.defaults.dagProcessingLogsEnabled))
              message: >-
                dagProcessingLogsEnabled cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.dagProcessingLogsLevel) &&
                  self.spec.mandatory.dagProcessingLogsLevel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.dagProcessingLogsLevel) &&
                  self.spec.defaults.dagProcessingLogsLevel != "")
              message: >-
                dagProcessingLogsLevel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.schedulerLogsEnabled) &&
                  has(self.spec.defaults) && has(self.spec.defaults.schedulerLogsEnabled))
              message: >-
                schedulerLogsEnabled cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.schedulerLogsLevel) &&
                  self.spec.mandatory.schedulerLogsLevel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.schedulerLogsLevel) &&
                  self.spec.defaults.schedulerLogsLevel != "")
              message: >-
                schedulerLogsLevel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.taskLogsEnabled) &&
                  has(self.spec.defaults) && has(self.spec.defaults.taskLogsEnabled))
              message: >-
                taskLogsEnabled cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.taskLogsLevel) &&
                  self.spec.mandatory.taskLogsLevel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.taskLogsLevel) &&
                  self.spec.defaults.taskLogsLevel != "")
              message: >-
                taskLogsLevel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.webserverLogsEnabled) &&
                  has(self.spec.defaults) && has(self.spec.defaults.webserverLogsEnabled))
              message: >-
                webserverLogsEnabled cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.webserverLogsLevel) &&
                  self.spec.mandatory.webserverLogsLevel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.webserverLogsLevel) &&
                  self.spec.defaults.webserverLogsLevel != "")
              message: >-
                webserverLogsLevel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.workerLogsEnabled) &&
                  has(self.spec.defaults) && has(self.spec.defaults.workerLogsEnabled))
              message: >-
                workerLogsEnabled cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.workerLogsLevel) &&
                  self.spec.mandatory.workerLogsLevel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.workerLogsLevel) &&
                  self.spec.defaults.workerLogsLevel != "")
              message: >-
                workerLogsLevel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxWorkers) &&
                  self.spec.mandatory.maxWorkers != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxWorkers) &&
                  self.spec.defaults.maxWorkers != 0)
              message: >-
                maxWorkers cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.minWorkers) &&
                  self.spec.mandatory.minWorkers != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.minWorkers) &&
                  self.spec.defaults.minWorkers != 0)
              message: >-
                minWorkers cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxWebservers) &&
                  self.spec.mandatory.maxWebservers != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxWebservers) &&
                  self.spec.defaults.maxWebservers != 0)
              message: >-
                maxWebservers cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.minWebservers) &&
                  self.spec.mandatory.minWebservers != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.minWebservers) &&
                  self.spec.defaults.minWebservers != 0)
              message: >-
                minWebservers cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.schedulers) &&
                  self.spec.mandatory.schedulers != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.schedulers) &&
                  self.spec.defaults.schedulers != 0)
              message: >-
                schedulers cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.weeklyMaintenanceWindowStart) &&
                  self.spec.mandatory.weeklyMaintenanceWindowStart != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.weeklyMaintenanceWindowStart) &&
                  self.spec.defaults.weeklyMaintenanceWindowStart != "")
              message: >-
                weeklyMaintenanceWindowStart cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory MWAA governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value (empty
                    string / 0 / absent boolean) means the field is not enforced.
                  properties:
                    airflowVersion:
                      type: string
                      description: >-
                        Required Airflow version for all MWAA environments in scope.
                        Empty string = not enforced. Example: "2.10.3".
                    environmentClass:
                      type: string
                      description: >-
                        Required environment class. Empty string = not enforced.
                        Example: "mw1.small", "mw1.medium", "mw1.large".
                    webserverAccessMode:
                      type: string
                      description: >-
                        Required web server access mode. Empty string = not enforced.
                        One of: "PRIVATE_ONLY", "PUBLIC_ONLY".
                    endpointManagement:
                      type: string
                      description: >-
                        Required VPC endpoint management model. Empty string = not enforced.
                        One of: "SERVICE", "CUSTOMER". Immutable after environment creation.
                    kmsKeyARN:
                      type: string
                      description: >-
                        Required KMS key ARN for data encryption. Empty string = not enforced
                        (AWS-managed key). Immutable after environment creation.
                    dagProcessingLogsEnabled:
                      type: boolean
                      description: >-
                        When set, forces DAG processing CloudWatch logging state.
                        Absent (nil) = not enforced.
                    dagProcessingLogsLevel:
                      type: string
                      description: >-
                        Required DAG processing log level. Empty string = not enforced.
                        One of: "CRITICAL", "ERROR", "WARNING", "INFO", "DEBUG".
                    schedulerLogsEnabled:
                      type: boolean
                      description: >-
                        When set, forces scheduler CloudWatch logging state.
                        Absent (nil) = not enforced.
                    schedulerLogsLevel:
                      type: string
                      description: >-
                        Required scheduler log level. Empty string = not enforced.
                        One of: "CRITICAL", "ERROR", "WARNING", "INFO", "DEBUG".
                    taskLogsEnabled:
                      type: boolean
                      description: >-
                        When set, forces task CloudWatch logging state.
                        Absent (nil) = not enforced.
                    taskLogsLevel:
                      type: string
                      description: >-
                        Required task log level. Empty string = not enforced.
                        One of: "CRITICAL", "ERROR", "WARNING", "INFO", "DEBUG".
                    webserverLogsEnabled:
                      type: boolean
                      description: >-
                        When set, forces web server CloudWatch logging state.
                        Absent (nil) = not enforced.
                    webserverLogsLevel:
                      type: string
                      description: >-
                        Required web server log level. Empty string = not enforced.
                        One of: "CRITICAL", "ERROR", "WARNING", "INFO", "DEBUG".
                    workerLogsEnabled:
                      type: boolean
                      description: >-
                        When set, forces worker CloudWatch logging state.
                        Absent (nil) = not enforced.
                    workerLogsLevel:
                      type: string
                      description: >-
                        Required worker log level. Empty string = not enforced.
                        One of: "CRITICAL", "ERROR", "WARNING", "INFO", "DEBUG".
                    maxWorkers:
                      type: integer
                      format: int64
                      description: >-
                        Required maximum worker count. 0 = not enforced.
                    minWorkers:
                      type: integer
                      format: int64
                      description: >-
                        Required minimum worker count. 0 = not enforced.
                    maxWebservers:
                      type: integer
                      format: int64
                      description: >-
                        Required maximum web server count. 0 = not enforced.
                    minWebservers:
                      type: integer
                      format: int64
                      description: >-
                        Required minimum web server count. 0 = not enforced.
                    schedulers:
                      type: integer
                      format: int64
                      description: >-
                        Required scheduler count. 0 = not enforced.
                    weeklyMaintenanceWindowStart:
                      type: string
                      description: >-
                        Required maintenance window start (RFC 5545 weekly recurrence, e.g.
                        "MON:01:00"). Empty string = not enforced.
                    airflowConfigurationOptions:
                      type: object
                      default: {}
                      description: >-
                        Mandatory Airflow configuration key-value pairs. Applied over instance
                        keys (OD-4 per-key merge: mandatory keys win over instance keys).
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      description: >-
                        Mandatory naming template for MWAA environment names.
                        Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        MWAA-specific mandatory cloud tags applied to all environments under
                        this profile. Merged with KropathConfig mandatory tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default MWAA governance fields. Applied when no higher-priority source
                    provides a value. Zero-value (empty string / 0 / absent boolean) means
                    no default from this level.
                  properties:
                    airflowVersion:
                      type: string
                      description: >-
                        Default Airflow version. Empty string = no default at this tier.
                        Example: "2.10.3".
                    environmentClass:
                      type: string
                      description: >-
                        Default environment class. Empty string = no default at this tier.
                        Secure default: "mw1.small".
                    webserverAccessMode:
                      type: string
                      description: >-
                        Default web server access mode. Empty string = no default at this tier.
                        Secure default: "PRIVATE_ONLY".
                    endpointManagement:
                      type: string
                      description: >-
                        Default VPC endpoint management model. Empty string = no default.
                        Suggested default: "SERVICE".
                    kmsKeyARN:
                      type: string
                      description: >-
                        Default KMS key ARN. Empty string = use AWS-managed key.
                    dagProcessingLogsEnabled:
                      type: boolean
                      description: >-
                        Default DAG processing logging state. Absent (nil) = no default.
                        Suggested default: true.
                    dagProcessingLogsLevel:
                      type: string
                      description: >-
                        Default DAG processing log level. Empty string = no default.
                        Suggested default: "INFO".
                    schedulerLogsEnabled:
                      type: boolean
                      description: >-
                        Default scheduler logging state. Absent (nil) = no default.
                        Suggested default: true.
                    schedulerLogsLevel:
                      type: string
                      description: >-
                        Default scheduler log level. Empty string = no default.
                        Suggested default: "INFO".
                    taskLogsEnabled:
                      type: boolean
                      description: >-
                        Default task logging state. Absent (nil) = no default.
                        Suggested default: true.
                    taskLogsLevel:
                      type: string
                      description: >-
                        Default task log level. Empty string = no default.
                        Suggested default: "INFO".
                    webserverLogsEnabled:
                      type: boolean
                      description: >-
                        Default web server logging state. Absent (nil) = no default.
                        Suggested default: true.
                    webserverLogsLevel:
                      type: string
                      description: >-
                        Default web server log level. Empty string = no default.
                        Suggested default: "INFO".
                    workerLogsEnabled:
                      type: boolean
                      description: >-
                        Default worker logging state. Absent (nil) = no default.
                        Suggested default: true.
                    workerLogsLevel:
                      type: string
                      description: >-
                        Default worker log level. Empty string = no default.
                        Suggested default: "INFO".
                    maxWorkers:
                      type: integer
                      format: int64
                      description: >-
                        Default maximum worker count. 0 = no default at this tier.
                    minWorkers:
                      type: integer
                      format: int64
                      description: >-
                        Default minimum worker count. 0 = no default at this tier.
                    maxWebservers:
                      type: integer
                      format: int64
                      description: >-
                        Default maximum web server count. 0 = no default at this tier.
                    minWebservers:
                      type: integer
                      format: int64
                      description: >-
                        Default minimum web server count. 0 = no default at this tier.
                    schedulers:
                      type: integer
                      format: int64
                      description: >-
                        Default scheduler count. 0 = no default at this tier.
                    weeklyMaintenanceWindowStart:
                      type: string
                      description: >-
                        Default maintenance window start. Empty string = MWAA chooses.
                    airflowConfigurationOptions:
                      type: object
                      default: {}
                      description: >-
                        Default Airflow configuration key-value pairs. Instance keys override
                        defaults per-key (OD-4).
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template for MWAA environment names.
                        Suggested default: "mwaa-{namespace}-{name}".
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        airflowVersion:
                          type: string
                        environmentClass:
                          type: string
                        webserverAccessMode:
                          type: string
                        endpointManagement:
                          type: string
                        kmsKeyARN:
                          type: string
                        dagProcessingLogsEnabled:
                          type: boolean
                        dagProcessingLogsLevel:
                          type: string
                        schedulerLogsEnabled:
                          type: boolean
                        schedulerLogsLevel:
                          type: string
                        taskLogsEnabled:
                          type: boolean
                        taskLogsLevel:
                          type: string
                        webserverLogsEnabled:
                          type: boolean
                        webserverLogsLevel:
                          type: string
                        workerLogsEnabled:
                          type: boolean
                        workerLogsLevel:
                          type: string
                        maxWorkers:
                          type: integer
                          format: int64
                        minWorkers:
                          type: integer
                          format: int64
                        maxWebservers:
                          type: integer
                          format: int64
                        minWebservers:
                          type: integer
                          format: int64
                        schedulers:
                          type: integer
                          format: int64
                        weeklyMaintenanceWindowStart:
                          type: string
                        airflowConfigurationOptions:
                          type: object
                          additionalProperties:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        airflowVersion:
                          type: string
                        environmentClass:
                          type: string
                        webserverAccessMode:
                          type: string
                        endpointManagement:
                          type: string
                        kmsKeyARN:
                          type: string
                        dagProcessingLogsEnabled:
                          type: boolean
                        dagProcessingLogsLevel:
                          type: string
                        schedulerLogsEnabled:
                          type: boolean
                        schedulerLogsLevel:
                          type: string
                        taskLogsEnabled:
                          type: boolean
                        taskLogsLevel:
                          type: string
                        webserverLogsEnabled:
                          type: boolean
                        webserverLogsLevel:
                          type: string
                        workerLogsEnabled:
                          type: boolean
                        workerLogsLevel:
                          type: string
                        maxWorkers:
                          type: integer
                          format: int64
                        minWorkers:
                          type: integer
                          format: int64
                        maxWebservers:
                          type: integer
                          format: int64
                        minWebservers:
                          type: integer
                          format: int64
                        schedulers:
                          type: integer
                          format: int64
                        weeklyMaintenanceWindowStart:
                          type: string
                        airflowConfigurationOptions:
                          type: object
                          additionalProperties:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
