---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mwaaconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: MWAAConfig
    listKind: MWAAConfigList
    plural: mwaaconfigs
    singular: mwaaconfig
    shortNames:
      - awsmwaacfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  default: {}
                  properties:
                    airflowVersion:
                      type: string
                      default: ""
                    environmentClass:
                      type: string
                      default: ""
                    webserverAccessMode:
                      type: string
                      default: ""
                    endpointManagement:
                      type: string
                      default: ""
                    kmsKeyARN:
                      type: string
                      default: ""
                    dagProcessingLogsEnabled:
                      type: boolean
                    dagProcessingLogsLevel:
                      type: string
                      default: ""
                    schedulerLogsEnabled:
                      type: boolean
                    schedulerLogsLevel:
                      type: string
                      default: ""
                    taskLogsEnabled:
                      type: boolean
                    taskLogsLevel:
                      type: string
                      default: ""
                    webserverLogsEnabled:
                      type: boolean
                    webserverLogsLevel:
                      type: string
                      default: ""
                    workerLogsEnabled:
                      type: boolean
                    workerLogsLevel:
                      type: string
                      default: ""
                    maxWorkers:
                      type: integer
                      format: int64
                      default: 0
                    minWorkers:
                      type: integer
                      format: int64
                      default: 0
                    maxWebservers:
                      type: integer
                      format: int64
                      default: 0
                    minWebservers:
                      type: integer
                      format: int64
                      default: 0
                    schedulers:
                      type: integer
                      format: int64
                      default: 0
                    weeklyMaintenanceWindowStart:
                      type: string
                      default: ""
                    airflowConfigurationOptions:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  properties:
                    airflowVersion:
                      type: string
                      default: ""
                    environmentClass:
                      type: string
                      default: ""
                    webserverAccessMode:
                      type: string
                      default: ""
                    endpointManagement:
                      type: string
                      default: ""
                    kmsKeyARN:
                      type: string
                      default: ""
                    dagProcessingLogsEnabled:
                      type: boolean
                    dagProcessingLogsLevel:
                      type: string
                      default: ""
                    schedulerLogsEnabled:
                      type: boolean
                    schedulerLogsLevel:
                      type: string
                      default: ""
                    taskLogsEnabled:
                      type: boolean
                    taskLogsLevel:
                      type: string
                      default: ""
                    webserverLogsEnabled:
                      type: boolean
                    webserverLogsLevel:
                      type: string
                      default: ""
                    workerLogsEnabled:
                      type: boolean
                    workerLogsLevel:
                      type: string
                      default: ""
                    maxWorkers:
                      type: integer
                      format: int64
                      default: 0
                    minWorkers:
                      type: integer
                      format: int64
                      default: 0
                    maxWebservers:
                      type: integer
                      format: int64
                      default: 0
                    minWebservers:
                      type: integer
                      format: int64
                      default: 0
                    schedulers:
                      type: integer
                      format: int64
                      default: 0
                    weeklyMaintenanceWindowStart:
                      type: string
                      default: ""
                    airflowConfigurationOptions:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
