---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: recyclebinconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: RecycleBinConfig
    listKind: RecycleBinConfigList
    plural: recyclebinconfigs
    singular: recyclebinconfig
    shortNames:
      - rbcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              # x-kubernetes-validations at spec level — rules use self.mandatory.* (not self.spec.mandatory.*)
              # per Design Reviewer pattern established in PR #308.
              x-kubernetes-validations:
                # Dual-tier mutual exclusion: scalar fields cannot be set in both mandatory and defaults
                - rule: >-
                    !(has(self.mandatory) && has(self.mandatory.retentionPeriodValue) &&
                      self.mandatory.retentionPeriodValue != 0 &&
                      has(self.defaults) && has(self.defaults.retentionPeriodValue) &&
                      self.defaults.retentionPeriodValue != 0)
                  message: "retentionPeriodValue cannot be set in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory) && has(self.mandatory.retentionPeriodUnit) &&
                      self.mandatory.retentionPeriodUnit != "" &&
                      has(self.defaults) && has(self.defaults.retentionPeriodUnit) &&
                      self.defaults.retentionPeriodUnit != "")
                  message: "retentionPeriodUnit cannot be set in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory) && has(self.mandatory.lockRule) &&
                      self.mandatory.lockRule == true &&
                      has(self.defaults) && has(self.defaults.lockRule) &&
                      self.defaults.lockRule == true)
                  message: "lockRule cannot be set to true in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory) && has(self.mandatory.unlockDelayValue) &&
                      self.mandatory.unlockDelayValue != 0 &&
                      has(self.defaults) && has(self.defaults.unlockDelayValue) &&
                      self.defaults.unlockDelayValue != 0)
                  message: "unlockDelayValue cannot be set in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory) && has(self.mandatory.unlockDelayUnit) &&
                      self.mandatory.unlockDelayUnit != "" &&
                      has(self.defaults) && has(self.defaults.unlockDelayUnit) &&
                      self.defaults.unlockDelayUnit != "")
                  message: "unlockDelayUnit cannot be set in both mandatory and defaults"
                # Range validation: AWS Recycle Bin accepts retentionPeriodValue 1–3650 days
                - rule: >-
                    !has(self.mandatory) || !has(self.mandatory.retentionPeriodValue) ||
                    self.mandatory.retentionPeriodValue == 0 ||
                    (self.mandatory.retentionPeriodValue >= 1 &&
                     self.mandatory.retentionPeriodValue <= 3650)
                  message: >-
                    mandatory.retentionPeriodValue must be 0 (not enforced) or between 1 and 3650
                - rule: >-
                    !has(self.defaults) || !has(self.defaults.retentionPeriodValue) ||
                    self.defaults.retentionPeriodValue == 0 ||
                    (self.defaults.retentionPeriodValue >= 1 &&
                     self.defaults.retentionPeriodValue <= 3650)
                  message: >-
                    defaults.retentionPeriodValue must be 0 (not enforced) or between 1 and 3650
                # Range validation: AWS Recycle Bin accepts unlockDelayValue 7–3650 days
                - rule: >-
                    !has(self.mandatory) || !has(self.mandatory.unlockDelayValue) ||
                    self.mandatory.unlockDelayValue == 0 ||
                    (self.mandatory.unlockDelayValue >= 7 &&
                     self.mandatory.unlockDelayValue <= 3650)
                  message: >-
                    mandatory.unlockDelayValue must be 0 (not enforced) or between 7 and 3650
                - rule: >-
                    !has(self.defaults) || !has(self.defaults.unlockDelayValue) ||
                    self.defaults.unlockDelayValue == 0 ||
                    (self.defaults.unlockDelayValue >= 7 &&
                     self.defaults.unlockDelayValue <= 3650)
                  message: >-
                    defaults.unlockDelayValue must be 0 (not enforced) or between 7 and 3650
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory RecycleBinConfig governance fields. Non-zero or non-empty values enforce
                    constraints regardless of instance spec or defaults. Zero-value (integer 0, empty
                    string, boolean false) means the field is not enforced at this tier.
                  properties:
                    retentionPeriodValue:
                      type: integer
                      description: >-
                        Required minimum retention period in days. 0 = not enforced; non-zero forces
                        minimum retention. AWS Recycle Bin accepts values 1–3650.
                    retentionPeriodUnit:
                      type: string
                      description: >-
                        Required time unit for retention period (e.g., "DAYS"). Empty string = not enforced.
                    lockRule:
                      type: boolean
                      description: >-
                        When true, all Recycle Bin rules under this profile must be locked.
                        false = not enforced (boolean zero-value sentinel).
                    unlockDelayValue:
                      type: integer
                      description: >-
                        Required minimum unlock delay in days. 0 = not enforced; non-zero forces minimum
                        unlock delay. AWS Recycle Bin accepts values 7–3650.
                    unlockDelayUnit:
                      type: string
                      description: >-
                        Required time unit for unlock delay (e.g., "DAYS"). Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Mandatory cloud tags applied to all Recycle Bin rules under this profile.
                        Merged additively with KropathConfig.mandatory.tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and cloud
                        resource tags (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default RecycleBinConfig governance fields. Applied when no higher-priority source
                    provides a value. Zero-value or empty string means no default is provided at this tier.
                  properties:
                    retentionPeriodValue:
                      type: integer
                      description: >-
                        Default retention period in days. 0 = not set at this tier. AWS accepts 1–3650.
                        7 days is the recommended baseline default.
                    retentionPeriodUnit:
                      type: string
                      description: >-
                        Default time unit for retention period (e.g., "DAYS"). Empty string = not set.
                    lockRule:
                      type: boolean
                      description: >-
                        Default locking behavior. true = enable locking on rules that do not override.
                        false = no locking by default.
                    unlockDelayValue:
                      type: integer
                      description: >-
                        Default unlock delay in days. 0 = not set at this tier. AWS accepts 7–3650.
                        30 days is the recommended baseline default when locking is used.
                    unlockDelayUnit:
                      type: string
                      description: >-
                        Default time unit for unlock delay (e.g., "DAYS"). Empty string = not set.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud tags merged additively with KropathConfig.defaults.tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: >-
                    Conditions represent the latest available observations of the object's state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RecycleBinRule RGDs
                    read exclusively from this field via a single externalRef lookup (ADR-010).
                  properties:
                    mandatory:
                      type: object
                      properties:
                        retentionPeriodValue:
                          type: integer
                        retentionPeriodUnit:
                          type: string
                        lockRule:
                          type: boolean
                        unlockDelayValue:
                          type: integer
                        unlockDelayUnit:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        retentionPeriodValue:
                          type: integer
                        retentionPeriodUnit:
                          type: string
                        lockRule:
                          type: boolean
                        unlockDelayValue:
                          type: integer
                        unlockDelayUnit:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
