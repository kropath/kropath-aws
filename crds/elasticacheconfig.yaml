---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: elasticacheconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: ElastiCacheConfig
    listKind: ElastiCacheConfigList
    plural: elasticacheconfigs
    singular: elasticacheconfig
    shortNames:
      - eccfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          # 8 mutual-exclusion rules — one per scalar governance field.
          # Boolean fields test for both == true (false = not enforced, safe zero value).
          # Integer field (snapshotRetentionLimit) tests for both > 0 (0 = not enforced).
          # String fields test for both != "" ("" = not enforced).
          # Map fields (tags, syncedLabels, syncedAnnotations) merge additively — no rule needed.
          # has() guards prevent spurious rejections when a field is absent from one tier.
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.atRestEncryptionEnabled) &&
                  self.spec.mandatory.atRestEncryptionEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.atRestEncryptionEnabled) &&
                  self.spec.defaults.atRestEncryptionEnabled == true)
              message: >-
                atRestEncryptionEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.transitEncryptionEnabled) &&
                  self.spec.mandatory.transitEncryptionEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.transitEncryptionEnabled) &&
                  self.spec.defaults.transitEncryptionEnabled == true)
              message: >-
                transitEncryptionEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.automaticFailoverEnabled) &&
                  self.spec.mandatory.automaticFailoverEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.automaticFailoverEnabled) &&
                  self.spec.defaults.automaticFailoverEnabled == true)
              message: >-
                automaticFailoverEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.multiAZEnabled) &&
                  self.spec.mandatory.multiAZEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.multiAZEnabled) &&
                  self.spec.defaults.multiAZEnabled == true)
              message: >-
                multiAZEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.snapshotRetentionLimit) &&
                  self.spec.mandatory.snapshotRetentionLimit > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.snapshotRetentionLimit) &&
                  self.spec.defaults.snapshotRetentionLimit > 0)
              message: >-
                snapshotRetentionLimit must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engine) &&
                  self.spec.mandatory.engine != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engine) &&
                  self.spec.defaults.engine != "")
              message: >-
                engine must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.blockNoPasswordUsers) &&
                  self.spec.mandatory.blockNoPasswordUsers == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.blockNoPasswordUsers) &&
                  self.spec.defaults.blockNoPasswordUsers == true)
              message: >-
                blockNoPasswordUsers must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory ElastiCache governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced. Platform teams set these to codify compliance postures.
                  properties:
                    atRestEncryptionEnabled:
                      type: boolean
                      description: >-
                        Forces encryption at rest on all caches in scope.
                        false (zero value) = not enforced. IMMUTABLE on ReplicationGroup after creation.
                    transitEncryptionEnabled:
                      type: boolean
                      description: >-
                        Forces TLS in-transit on all caches in scope.
                        false (zero value) = not enforced.
                    automaticFailoverEnabled:
                      type: boolean
                      description: >-
                        Forces automatic failover on all replication groups in scope.
                        false (zero value) = not enforced. Implies multiAZEnabled: true (RGD-enforced).
                    multiAZEnabled:
                      type: boolean
                      description: >-
                        Forces Multi-AZ on all replication groups in scope.
                        false (zero value) = not enforced.
                    engine:
                      type: string
                      description: >-
                        Forces engine choice on all caches in scope. Empty string = not enforced.
                        Valid values: valkey | redis | memcached.
                    blockNoPasswordUsers:
                      type: boolean
                      description: >-
                        When true, ElastiCacheUser instances with spec.noPasswordRequired: true are
                        rejected (OD-4). false (zero value) = not enforced.
                    snapshotRetentionLimit:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Hard minimum retention floor in days. RGD CEL clamps instance
                        snapshotRetentionLimit so it cannot go below this value.
                        0 = not enforced.
                    namingTemplate:
                      type: string
                      description: >-
                        Forces naming pattern. spec.nameOverride is the only escape hatch.
                        Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        ElastiCache-specific mandatory cloud tags merged into all resource cloud tags.
                        Instance cannot remove mandatory tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both K8s metadata.labels (aws.kropath.run/ prefix)
                        and cloud tags (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to K8s metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default ElastiCache governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this level.
                  properties:
                    atRestEncryptionEnabled:
                      type: boolean
                      description: >-
                        Default encryption at rest setting. Applies when instance spec field is nil.
                        Baseline: true (secure by default).
                    transitEncryptionEnabled:
                      type: boolean
                      description: >-
                        Default TLS in-transit setting. Applies when instance spec field is nil.
                        Baseline: true (secure by default).
                    automaticFailoverEnabled:
                      type: boolean
                      description: >-
                        Default automatic failover setting. Applies when instance spec field is nil.
                        Baseline: true (HA by default).
                    multiAZEnabled:
                      type: boolean
                      description: >-
                        Default Multi-AZ setting. Applies when instance spec field is nil.
                        Baseline: true (HA by default).
                    engine:
                      type: string
                      description: >-
                        Default engine. Applies when instance spec.engine is empty.
                        Instance can override. Baseline: "valkey".
                    blockNoPasswordUsers:
                      type: boolean
                      description: >-
                        Default no-password-user blocking. Applies when instance omits noPasswordRequired.
                        Overridable when not mandatory. Baseline: false.
                    snapshotRetentionLimit:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Baseline retention period in days when instance does not specify.
                        Baseline: 1 day.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Applies when instance spec.nameOverride is empty.
                        Baseline: "{namespace}-{name}".
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Baseline cloud tags. Overridable per-instance.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Baseline synced labels. Overridable per-instance.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Baseline synced annotations. Overridable per-instance.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup (ADR-010).
                    Controller pre-merges KropathConfig + ElastiCacheConfig tiers.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        atRestEncryptionEnabled:
                          type: boolean
                        transitEncryptionEnabled:
                          type: boolean
                        automaticFailoverEnabled:
                          type: boolean
                        multiAZEnabled:
                          type: boolean
                        engine:
                          type: string
                        blockNoPasswordUsers:
                          type: boolean
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        atRestEncryptionEnabled:
                          type: boolean
                        transitEncryptionEnabled:
                          type: boolean
                        automaticFailoverEnabled:
                          type: boolean
                        multiAZEnabled:
                          type: boolean
                        engine:
                          type: string
                        blockNoPasswordUsers:
                          type: boolean
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
