---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ecsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: ECSConfig
    listKind: ECSConfigList
    plural: ecsconfigs
    singular: ecsconfig
    shortNames:
      - ecscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.containerInsights) &&
                  self.spec.mandatory.containerInsights &&
                  has(self.spec.defaults) && has(self.spec.defaults.containerInsights) &&
                  self.spec.defaults.containerInsights)
              message: "containerInsights cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultLaunchType) &&
                  self.spec.mandatory.defaultLaunchType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultLaunchType) &&
                  self.spec.defaults.defaultLaunchType != "")
              message: "defaultLaunchType cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultPlatformVersion) &&
                  self.spec.mandatory.defaultPlatformVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultPlatformVersion) &&
                  self.spec.defaults.defaultPlatformVersion != "")
              message: "defaultPlatformVersion cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultNetworkMode) &&
                  self.spec.mandatory.defaultNetworkMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultNetworkMode) &&
                  self.spec.defaults.defaultNetworkMode != "")
              message: "defaultNetworkMode cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultTaskCPU) &&
                  self.spec.mandatory.defaultTaskCPU != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultTaskCPU) &&
                  self.spec.defaults.defaultTaskCPU != "")
              message: "defaultTaskCPU cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultTaskMemory) &&
                  self.spec.mandatory.defaultTaskMemory != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultTaskMemory) &&
                  self.spec.defaults.defaultTaskMemory != "")
              message: "defaultTaskMemory cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: "namingTemplate cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory ECS governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    containerInsights:
                      type: boolean
                      description: >-
                        false = not enforced. Forces Container Insights enabled on all clusters.
                    defaultLaunchType:
                      type: string
                      description: >-
                        Empty string = not enforced. EC2 | FARGATE | EXTERNAL.
                    defaultPlatformVersion:
                      type: string
                      description: >-
                        Empty string = not enforced. Fargate platform version (e.g. "LATEST", "1.4.0").
                    defaultNetworkMode:
                      type: string
                      description: >-
                        Empty string = not enforced. none | bridge | awsvpc | host.
                    defaultTaskCPU:
                      type: string
                      description: >-
                        Empty string = not enforced. Fargate task-level CPU units (e.g. "256").
                    defaultTaskMemory:
                      type: string
                      description: >-
                        Empty string = not enforced. Fargate task-level memory in MiB (e.g. "512").
                    namingTemplate:
                      type: string
                      description: >-
                        Empty string = no mandatory naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        ECS-specific mandatory cloud tags.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Mandatory synced labels (ADR-015 §6.1): applied to both K8s labels and cloud tags.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Mandatory synced annotations.
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default ECS governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    containerInsights:
                      type: boolean
                      description: >-
                        Default Container Insights state.
                    defaultLaunchType:
                      type: string
                      description: >-
                        Empty string = use service/cluster default launch type.
                    defaultPlatformVersion:
                      type: string
                      description: >-
                        Default Fargate platform version. "LATEST" recommended.
                    defaultNetworkMode:
                      type: string
                      description: >-
                        Default network mode. "awsvpc" is the modern default.
                    defaultTaskCPU:
                      type: string
                      description: >-
                        Empty string = not set; instance must specify for Fargate tasks.
                    defaultTaskMemory:
                      type: string
                      description: >-
                        Empty string = not set; instance must specify for Fargate tasks.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. "{namespace}-{name}" baseline.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Default ECS-specific cloud tags.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Default synced labels.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Default synced annotations.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        containerInsights:
                          type: boolean
                        defaultLaunchType:
                          type: string
                        defaultPlatformVersion:
                          type: string
                        defaultNetworkMode:
                          type: string
                        defaultTaskCPU:
                          type: string
                        defaultTaskMemory:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        containerInsights:
                          type: boolean
                        defaultLaunchType:
                          type: string
                        defaultPlatformVersion:
                          type: string
                        defaultNetworkMode:
                          type: string
                        defaultTaskCPU:
                          type: string
                        defaultTaskMemory:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
