---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretsmanagerconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: SecretsManagerConfig
    listKind: SecretsManagerConfigList
    plural: secretsmanagerconfigs
    singular: secretsmanagerconfig
    shortNames:
      - smcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(self.spec.mandatory.kmsKeyID != '' &&
                  self.spec.defaults.kmsKeyID != '')
              message: "kmsKeyID cannot be set in both mandatory and defaults"
            - rule: >-
                !(size(self.spec.mandatory.replicaRegions) > 0 &&
                  size(self.spec.defaults.replicaRegions) > 0)
              message: "replicaRegions cannot be set in both mandatory and defaults"
            - rule: >-
                !(self.spec.mandatory.forceOverwriteReplicaSecret == true &&
                  self.spec.defaults.forceOverwriteReplicaSecret == true)
              message: "forceOverwriteReplicaSecret cannot be set to true in both mandatory and defaults"
            - rule: >-
                !(self.spec.mandatory.namingTemplate != '' &&
                  self.spec.defaults.namingTemplate != '')
              message: "namingTemplate cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Secrets Manager governance fields. Zero-value means the field is
                    not enforced at this tier.
                  properties:
                    kmsKeyID:
                      type: string
                      default: ""
                      description: >-
                        Empty string = not enforced. Non-empty forces a specific KMS key ARN,
                        ID, or alias for all secrets in this profile.
                    replicaRegions:
                      type: array
                      default: []
                      description: >-
                        Empty list = no replication mandate. Non-empty forces cross-region
                        replication to specific regions. Priority replacement semantics.
                      items:
                        type: object
                        properties:
                          region:
                            type: string
                            description: AWS region code for the replica (e.g. us-west-2).
                          kmsKeyID:
                            type: string
                            description: >-
                              KMS key to use in the replica region. Defaults to
                              aws/secretsmanager if omitted.
                    forceOverwriteReplicaSecret:
                      type: boolean
                      default: false
                      description: >-
                        false = not enforced. true = forces overwrite behaviour for replica
                        secrets in destination regions.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Empty string = no mandatory naming template. Non-empty forces naming
                        pattern; spec.nameOverride is the only escape hatch.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Merged into all secret cloud tags. Instance cannot remove mandatory
                        tags.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Merged into all secret K8s labels and cloud tags (ADR-015 §6.1).
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Merged into all secret K8s annotations (ADR-015 §6).
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Secrets Manager governance fields. Zero-value means no default is
                    provided at this tier.
                  properties:
                    kmsKeyID:
                      type: string
                      default: ""
                      description: >-
                        Default KMS key. Empty string = use AWS default (aws/secretsmanager).
                    replicaRegions:
                      type: array
                      default: []
                      description: >-
                        Default replication targets. Empty list = no replication by default.
                        Priority replacement semantics.
                      items:
                        type: object
                        properties:
                          region:
                            type: string
                            description: AWS region code for the replica.
                          kmsKeyID:
                            type: string
                            description: >-
                              KMS key in the replica region. Defaults to
                              aws/secretsmanager if omitted.
                    forceOverwriteReplicaSecret:
                      type: boolean
                      default: false
                      description: Default overwrite behaviour when instance does not set it.
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: >-
                        Default naming template. Applies when instance spec.nameOverride is
                        empty. Default {namespace}-{name}.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Baseline cloud tags; overridable per-instance.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Baseline synced labels; overridable per-instance.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Baseline synced annotations; overridable per-instance.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef resources entry.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        kmsKeyID:
                          type: string
                        replicaRegions:
                          type: array
                          items:
                            type: object
                            properties:
                              region:
                                type: string
                              kmsKeyID:
                                type: string
                        forceOverwriteReplicaSecret:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                          description: >-
                            Merged: KropathConfig.mandatory.tags +
                            SecretsManagerConfig.mandatory.tags
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        kmsKeyID:
                          type: string
                        replicaRegions:
                          type: array
                          items:
                            type: object
                            properties:
                              region:
                                type: string
                              kmsKeyID:
                                type: string
                        forceOverwriteReplicaSecret:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                          description: >-
                            Merged: KropathConfig.defaults.tags +
                            SecretsManagerConfig.defaults.tags
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
