---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkfirewallconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: NetworkFirewallConfig
    listKind: NetworkFirewallConfigList
    plural: networkfirewallconfigs
    singular: networkfirewallconfig
    shortNames:
      - nfwcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # AC-3: deleteProtection — boolean sentinel is false (not enforced). Dual-true rejected.
            # has() guards prevent "no such key" CEL errors when the field is absent.
            - rule: >-
                !((has(self.spec.mandatory.deleteProtection) && self.spec.mandatory.deleteProtection == true) &&
                  (has(self.spec.defaults.deleteProtection) && self.spec.defaults.deleteProtection == true))
              message: "deleteProtection cannot be set to true in both mandatory and defaults"
            # AC-4: firewallPolicyChangeProtection
            - rule: >-
                !((has(self.spec.mandatory.firewallPolicyChangeProtection) && self.spec.mandatory.firewallPolicyChangeProtection == true) &&
                  (has(self.spec.defaults.firewallPolicyChangeProtection) && self.spec.defaults.firewallPolicyChangeProtection == true))
              message: "firewallPolicyChangeProtection cannot be set to true in both mandatory and defaults"
            # AC-5: subnetChangeProtection
            - rule: >-
                !((has(self.spec.mandatory.subnetChangeProtection) && self.spec.mandatory.subnetChangeProtection == true) &&
                  (has(self.spec.defaults.subnetChangeProtection) && self.spec.defaults.subnetChangeProtection == true))
              message: "subnetChangeProtection cannot be set to true in both mandatory and defaults"
            # AC-2: encryptionType — string sentinel is "" (not enforced). Non-empty in both rejected.
            # has() guards prevent "no such key" CEL errors when the field is absent.
            - rule: >-
                !((has(self.spec.mandatory.encryptionType) && self.spec.mandatory.encryptionType != '') &&
                  (has(self.spec.defaults.encryptionType) && self.spec.defaults.encryptionType != ''))
              message: "encryptionType cannot be set in both mandatory and defaults"
            # AC-6: statefulRuleOrder
            - rule: >-
                !((has(self.spec.mandatory.statefulRuleOrder) && self.spec.mandatory.statefulRuleOrder != '') &&
                  (has(self.spec.defaults.statefulRuleOrder) && self.spec.defaults.statefulRuleOrder != ''))
              message: "statefulRuleOrder cannot be set in both mandatory and defaults"
            # AC-7: statefulDefaultActions — array sentinel is [] (not enforced). Non-empty in both rejected.
            # statefulDefaultActions has default: [] so has() guard is not needed.
            - rule: >-
                !(size(self.spec.mandatory.statefulDefaultActions) > 0 &&
                  size(self.spec.defaults.statefulDefaultActions) > 0)
              message: "statefulDefaultActions cannot be set in both mandatory and defaults"
            # AC-8: streamExceptionPolicy
            - rule: >-
                !((has(self.spec.mandatory.streamExceptionPolicy) && self.spec.mandatory.streamExceptionPolicy != '') &&
                  (has(self.spec.defaults.streamExceptionPolicy) && self.spec.defaults.streamExceptionPolicy != ''))
              message: "streamExceptionPolicy cannot be set in both mandatory and defaults"
            # AC-9: loggingDestination.alertLogDestination — checked via type sub-field
            - rule: >-
                !(has(self.spec.mandatory.loggingDestination) &&
                  has(self.spec.mandatory.loggingDestination.alertLogDestination) &&
                  has(self.spec.mandatory.loggingDestination.alertLogDestination.type) &&
                  self.spec.mandatory.loggingDestination.alertLogDestination.type != '' &&
                  has(self.spec.defaults.loggingDestination) &&
                  has(self.spec.defaults.loggingDestination.alertLogDestination) &&
                  has(self.spec.defaults.loggingDestination.alertLogDestination.type) &&
                  self.spec.defaults.loggingDestination.alertLogDestination.type != '')
              message: "loggingDestination.alertLogDestination cannot be set in both mandatory and defaults"
            # AC-10: loggingDestination.flowLogDestination
            - rule: >-
                !(has(self.spec.mandatory.loggingDestination) &&
                  has(self.spec.mandatory.loggingDestination.flowLogDestination) &&
                  has(self.spec.mandatory.loggingDestination.flowLogDestination.type) &&
                  self.spec.mandatory.loggingDestination.flowLogDestination.type != '' &&
                  has(self.spec.defaults.loggingDestination) &&
                  has(self.spec.defaults.loggingDestination.flowLogDestination) &&
                  has(self.spec.defaults.loggingDestination.flowLogDestination.type) &&
                  self.spec.defaults.loggingDestination.flowLogDestination.type != '')
              message: "loggingDestination.flowLogDestination cannot be set in both mandatory and defaults"
            # AC-11: loggingDestination.tlsLogDestination
            - rule: >-
                !(has(self.spec.mandatory.loggingDestination) &&
                  has(self.spec.mandatory.loggingDestination.tlsLogDestination) &&
                  has(self.spec.mandatory.loggingDestination.tlsLogDestination.type) &&
                  self.spec.mandatory.loggingDestination.tlsLogDestination.type != '' &&
                  has(self.spec.defaults.loggingDestination) &&
                  has(self.spec.defaults.loggingDestination.tlsLogDestination) &&
                  has(self.spec.defaults.loggingDestination.tlsLogDestination.type) &&
                  self.spec.defaults.loggingDestination.tlsLogDestination.type != '')
              message: "loggingDestination.tlsLogDestination cannot be set in both mandatory and defaults"
            # AC-12: namingTemplate
            # has() guards prevent "no such key" CEL errors when the field is absent.
            - rule: >-
                !((has(self.spec.mandatory.namingTemplate) && self.spec.mandatory.namingTemplate != '') &&
                  (has(self.spec.defaults.namingTemplate) && self.spec.defaults.namingTemplate != ''))
              message: "namingTemplate cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Network Firewall governance fields. Zero-value means the field is
                    not enforced at this tier. Platform teams use this tier to force org-wide
                    security postures that instances cannot override.
                  properties:
                    deleteProtection:
                      type: boolean
                      description: >-
                        false = not enforced. true = forces deletion protection on all firewalls;
                        instances cannot override. Sentinel: false (pointer semantics).
                    firewallPolicyChangeProtection:
                      type: boolean
                      description: >-
                        false = not enforced. true = forces policy change protection;
                        instances cannot override.
                    subnetChangeProtection:
                      type: boolean
                      description: >-
                        false = not enforced. true = forces subnet change protection;
                        instances cannot override.
                    encryptionType:
                      type: string
                      description: >-
                        Empty string = not enforced. CUSTOMER_KMS forces CMK encryption;
                        instances cannot override.
                    statefulRuleOrder:
                      type: string
                      description: >-
                        Empty string = not enforced. STRICT_ORDER forces strict rule evaluation;
                        instances cannot override.
                    statefulDefaultActions:
                      type: array
                      default: []
                      description: >-
                        Empty list = not enforced. Forces default stateful actions;
                        instances cannot override.
                      items:
                        type: string
                    streamExceptionPolicy:
                      type: string
                      description: >-
                        Empty string = not enforced. DROP or CONTINUE forces stream exception
                        policy; instances cannot override.
                    loggingDestination:
                      type: object
                      default: {}
                      description: >-
                        Logging destination governance. Each sub-field (alertLogDestination,
                        flowLogDestination, tlsLogDestination) is independent. Empty object = not
                        enforced. A non-empty type field forces that log type's destination.
                      properties:
                        alertLogDestination:
                          type: object
                          default: {}
                          description: >-
                            Alert log destination enforcement. Empty object = not enforced.
                          properties:
                            type:
                              type: string
                              description: >-
                                Log destination type: S3 | CloudWatchLogs | KinesisDataFirehose.
                                Empty = not enforced.
                            destination:
                              type: object
                              default: {}
                              description: Destination-specific parameters (e.g. bucketName, logGroup).
                              additionalProperties:
                                type: string
                        flowLogDestination:
                          type: object
                          default: {}
                          description: >-
                            Flow log destination enforcement. Empty object = not enforced.
                          properties:
                            type:
                              type: string
                              description: >-
                                Log destination type: S3 | CloudWatchLogs | KinesisDataFirehose.
                                Empty = not enforced.
                            destination:
                              type: object
                              default: {}
                              description: Destination-specific parameters.
                              additionalProperties:
                                type: string
                        tlsLogDestination:
                          type: object
                          default: {}
                          description: >-
                            TLS log destination enforcement. Empty object = not enforced.
                          properties:
                            type:
                              type: string
                              description: >-
                                Log destination type: S3 | CloudWatchLogs | KinesisDataFirehose.
                                Empty = not enforced.
                            destination:
                              type: object
                              default: {}
                              description: Destination-specific parameters.
                              additionalProperties:
                                type: string
                    namingTemplate:
                      type: string
                      description: >-
                        Empty string = not enforced. When set, overrides instance spec.nameOverride
                        and is the only escape hatch.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        NF-specific mandatory governance tags. Additive with defaults tier and
                        KropathConfig.mandatory.tags via map union semantics (ADR-015 §6).
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: labels synced to K8s metadata on child ACK CRs
                        (prefixed aws.kropath.run/). Additive with defaults tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to K8s metadata on child ACK CRs
                        (prefixed aws.kropath.run/). Additive with defaults tier.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Network Firewall governance fields. These apply when an instance
                    spec field is empty. The general-policy profile supplies NF security
                    best-practice defaults.
                  properties:
                    deleteProtection:
                      type: boolean
                      description: >-
                        Baseline deletion protection (true = on). Can be overridden per-instance.
                    firewallPolicyChangeProtection:
                      type: boolean
                      description: Baseline policy change protection. Can be overridden per-instance.
                    subnetChangeProtection:
                      type: boolean
                      description: Baseline subnet change protection. Can be overridden per-instance.
                    encryptionType:
                      type: string
                      description: >-
                        Baseline encryption type (AWS_OWNED_KMS_KEY). Can be overridden per-instance.
                    statefulRuleOrder:
                      type: string
                      description: >-
                        Baseline rule evaluation order (STRICT_ORDER). Can be overridden per-instance.
                    statefulDefaultActions:
                      type: array
                      default: []
                      description: >-
                        Baseline default stateful actions ([aws:drop_strict]).
                        Can be overridden per-instance.
                      items:
                        type: string
                    streamExceptionPolicy:
                      type: string
                      description: >-
                        Baseline stream exception policy (DROP). Can be overridden per-instance.
                    loggingDestination:
                      type: object
                      default: {}
                      description: >-
                        Default logging destinations per log type. Empty object = no default set.
                      properties:
                        alertLogDestination:
                          type: object
                          default: {}
                          description: Default alert log destination. Empty object = not set.
                          properties:
                            type:
                              type: string
                              description: >-
                                Log destination type: S3 | CloudWatchLogs | KinesisDataFirehose.
                            destination:
                              type: object
                              default: {}
                              description: Destination-specific parameters.
                              additionalProperties:
                                type: string
                        flowLogDestination:
                          type: object
                          default: {}
                          description: Default flow log destination. Empty object = not set.
                          properties:
                            type:
                              type: string
                              description: >-
                                Log destination type: S3 | CloudWatchLogs | KinesisDataFirehose.
                            destination:
                              type: object
                              default: {}
                              description: Destination-specific parameters.
                              additionalProperties:
                                type: string
                        tlsLogDestination:
                          type: object
                          default: {}
                          description: Default TLS log destination. Empty object = not set.
                          properties:
                            type:
                              type: string
                              description: >-
                                Log destination type: S3 | CloudWatchLogs | KinesisDataFirehose.
                            destination:
                              type: object
                              default: {}
                              description: Destination-specific parameters.
                              additionalProperties:
                                type: string
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming pattern. Empty string = no default (profile CR supplies
                        the business default "{namespace}-{name}").
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Default governance tags. Additive with mandatory tier via map union.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default synced labels. Additive with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default synced annotations. Additive with mandatory tier.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup (ADR-010,
                    Theme 28 / KRO-221).
                  properties:
                    mandatory:
                      type: object
                      properties:
                        deleteProtection:
                          type: boolean
                        firewallPolicyChangeProtection:
                          type: boolean
                        subnetChangeProtection:
                          type: boolean
                        encryptionType:
                          type: string
                        statefulRuleOrder:
                          type: string
                        statefulDefaultActions:
                          type: array
                          items:
                            type: string
                        streamExceptionPolicy:
                          type: string
                        loggingDestination:
                          type: object
                          properties:
                            alertLogDestination:
                              type: object
                              properties:
                                type:
                                  type: string
                                destination:
                                  type: object
                                  additionalProperties:
                                    type: string
                            flowLogDestination:
                              type: object
                              properties:
                                type:
                                  type: string
                                destination:
                                  type: object
                                  additionalProperties:
                                    type: string
                            tlsLogDestination:
                              type: object
                              properties:
                                type:
                                  type: string
                                destination:
                                  type: object
                                  additionalProperties:
                                    type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        deleteProtection:
                          type: boolean
                        firewallPolicyChangeProtection:
                          type: boolean
                        subnetChangeProtection:
                          type: boolean
                        encryptionType:
                          type: string
                        statefulRuleOrder:
                          type: string
                        statefulDefaultActions:
                          type: array
                          items:
                            type: string
                        streamExceptionPolicy:
                          type: string
                        loggingDestination:
                          type: object
                          properties:
                            alertLogDestination:
                              type: object
                              properties:
                                type:
                                  type: string
                                destination:
                                  type: object
                                  additionalProperties:
                                    type: string
                            flowLogDestination:
                              type: object
                              properties:
                                type:
                                  type: string
                                destination:
                                  type: object
                                  additionalProperties:
                                    type: string
                            tlsLogDestination:
                              type: object
                              properties:
                                type:
                                  type: string
                                destination:
                                  type: object
                                  additionalProperties:
                                    type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
