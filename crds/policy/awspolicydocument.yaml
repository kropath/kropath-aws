---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awspolicydocuments.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSPolicyDocument
    listKind: AWSPolicyDocumentList
    plural: awspolicydocuments
    singular: awspolicydocument
    shortNames:
      - awspd
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].status"
        - name: Statements
          type: integer
          jsonPath: ".status.statementCount"
        - name: Sources
          type: integer
          jsonPath: ".status.sourceCount"
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.documentJSON) && self.spec.documentJSON != "" &&
                  ((has(self.spec.statements) && self.spec.statements.size() > 0) ||
                   (has(self.spec.sources) && self.spec.sources.size() > 0)))
              message: >-
                spec.documentJSON is mutually exclusive with spec.statements and spec.sources.
                Use either the structured form or the raw JSON escape hatch, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                sources:
                  type: array
                  default: []
                  description: >-
                    Names of other AWSPolicyDocument CRs in the same namespace whose Statement
                    arrays are merged into this document. Merged before own statements are added.
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        description: Name of another AWSPolicyDocument CR in the same namespace.
                statements:
                  type: array
                  default: []
                  description: >-
                    Structured IAM policy statements. Mutually exclusive with spec.documentJSON.
                  items:
                    type: object
                    required:
                      - effect
                      - actions
                    x-kubernetes-validations:
                      - rule: "self.effect == 'Allow' || self.effect == 'Deny'"
                        message: "spec.statements[].effect must be 'Allow' or 'Deny'."
                    properties:
                      sid:
                        type: string
                        default: ""
                        description: >-
                          Optional statement ID. Non-empty Sids must be unique across the merged document.
                      effect:
                        type: string
                        description: "Allow or Deny. Required."
                        enum:
                          - Allow
                          - Deny
                      principals:
                        type: array
                        default: []
                        description: >-
                          Required for resource-based policies. Omit for identity-based policies.
                        items:
                          type: object
                          required:
                            - type
                          x-kubernetes-validations:
                            - rule: >-
                                !((has(self.arn) && self.arn != "") && has(self.ref))
                              message: >-
                                principals[].arn and principals[].ref are mutually exclusive.
                                Specify either a literal ARN or a CR ref, not both.
                          properties:
                            type:
                              type: string
                              description: "Principal type: AWS, Service, or Federated."
                              enum:
                                - AWS
                                - Service
                                - Federated
                            arn:
                              type: string
                              default: ""
                              description: >-
                                Literal ARN. Mutually exclusive with ref.
                            ref:
                              type: object
                              description: >-
                                Reference to a kropath CR. Controller resolves to ARN via
                                status.predictedArn. Mutually exclusive with arn.
                              required:
                                - kind
                                - name
                              properties:
                                kind:
                                  type: string
                                  description: "kropath CR kind (e.g., AWSIAMRole, AWSS3Bucket)."
                                name:
                                  type: string
                                  description: "CR name in the same namespace."
                                field:
                                  type: string
                                  default: predictedArn
                                  description: >-
                                    Which status field to read. Defaults to 'predictedArn'.
                                    Use 'arn' for resources with auto-generated ARNs.
                      actions:
                        type: array
                        description: "AWS action strings. Required."
                        minItems: 1
                        items:
                          type: string
                          minLength: 1
                      resources:
                        type: array
                        default: []
                        description: "Required for identity-based policies."
                        items:
                          type: object
                          x-kubernetes-validations:
                            - rule: >-
                                !((has(self.arn) && self.arn != "") && has(self.ref))
                              message: >-
                                resources[].arn and resources[].ref are mutually exclusive.
                                Specify either a literal ARN or a CR ref, not both.
                          properties:
                            arn:
                              type: string
                              default: ""
                              description: >-
                                Literal ARN. Mutually exclusive with ref.
                            ref:
                              type: object
                              description: >-
                                Reference to a kropath CR. Controller resolves to ARN via
                                status.predictedArn. Mutually exclusive with arn.
                              required:
                                - kind
                                - name
                              properties:
                                kind:
                                  type: string
                                  description: "kropath CR kind (e.g., AWSS3Bucket, AWSIAMRole)."
                                name:
                                  type: string
                                  description: "CR name in the same namespace."
                                field:
                                  type: string
                                  default: predictedArn
                                  description: >-
                                    Which status field to read. Defaults to 'predictedArn'.
                      conditions:
                        type: array
                        default: []
                        description: "Optional IAM condition blocks."
                        items:
                          type: object
                          required:
                            - operator
                            - key
                            - values
                          properties:
                            operator:
                              type: string
                              description: >-
                                IAM condition operator (e.g., StringEquals, ArnLike).
                            key:
                              type: string
                              description: "IAM condition key (e.g., aws:SourceVpc)."
                            values:
                              type: array
                              minItems: 1
                              items:
                                type: string
                documentJSON:
                  type: string
                  default: ""
                  description: >-
                    Raw JSON escape hatch for complex policies that do not fit the structured model.
                    Mutually exclusive with spec.statements and spec.sources.
                    No ref resolution or merge is performed on this field.
            status:
              type: object
              properties:
                resolvedDocumentJSON:
                  type: string
                  description: >-
                    The fully resolved and serialized IAM policy document JSON.
                    Populated by the controller after ref resolution and source merge.
                statementCount:
                  type: integer
                  description: "Total number of statements in the resolved document."
                sourceCount:
                  type: integer
                  description: "Number of source documents merged into this document."
                observedGeneration:
                  type: integer
                  format: int64
                  description: "The generation observed by the controller."
                conditions:
                  type: array
                  description: "Standard Kubernetes conditions."
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: "Condition type: Ready, SidConflict, or SourceNotReady."
                      status:
                        type: string
                        description: "True, False, or Unknown."
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
