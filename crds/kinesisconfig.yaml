---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kinesisconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: KinesisConfig
    listKind: KinesisConfigList
    plural: kinesisconfigs
    singular: kinesisconfig
    shortNames:
      - kncfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.streamMode) &&
                  self.spec.mandatory.streamMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.streamMode) &&
                  self.spec.defaults.streamMode != "")
              message: >-
                streamMode cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.shardCount) &&
                  self.spec.mandatory.shardCount != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.shardCount) &&
                  self.spec.defaults.shardCount != 0)
              message: >-
                shardCount cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Kinesis governance fields. Zero-value means the field is
                    not enforced at this tier.
                  properties:
                    streamMode:
                      type: string
                      description: >-
                        Empty string = not enforced; "on_demand" | "provisioned".
                    shardCount:
                      type: integer
                      description: >-
                        0 = not enforced; positive integer = enforced shard count
                        (applies only when streamMode is "provisioned").
                    namingTemplate:
                      type: string
                      description: Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Kinesis-specific mandatory cloud tags. Additive with defaults
                        tier; merged with KropathConfig.mandatory.tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: labels synced to both K8s and cloud tags.
                        Additive with defaults tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Annotations synced to cloud. Additive with defaults tier.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Kinesis governance fields. Zero-value means no default is
                    provided at this tier.
                  properties:
                    streamMode:
                      type: string
                      description: >-
                        Default capacity mode. Empty string = no default (profile CR
                        supplies the business default "on_demand").
                    shardCount:
                      type: integer
                      description: >-
                        0 = use RGD built-in (1 shard); positive integer = default
                        shard count for provisioned streams.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming pattern. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud tags. Additive with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default synced labels. Additive with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default synced annotations. Additive with mandatory tier.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        streamMode:
                          type: string
                        shardCount:
                          type: integer
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        streamMode:
                          type: string
                        shardCount:
                          type: integer
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
