---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: s3advancedconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: S3AdvancedConfig
    listKind: S3AdvancedConfigList
    plural: s3advancedconfigs
    singular: s3advancedconfig
    shortNames:
      - s3advcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tableBucketEncryption) &&
                  (self.spec.mandatory.tableBucketEncryption.sseAlgorithm != "" ||
                   self.spec.mandatory.tableBucketEncryption.kmsKeyARN != "") &&
                  has(self.spec.defaults) && has(self.spec.defaults.tableBucketEncryption) &&
                  (self.spec.defaults.tableBucketEncryption.sseAlgorithm != "" ||
                   self.spec.defaults.tableBucketEncryption.kmsKeyARN != ""))
              message: >-
                tableBucketEncryption cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.accessPointPublicAccessBlock) &&
                  (self.spec.mandatory.accessPointPublicAccessBlock.blockPublicACLs == true ||
                   self.spec.mandatory.accessPointPublicAccessBlock.blockPublicPolicy == true ||
                   self.spec.mandatory.accessPointPublicAccessBlock.ignorePublicACLs == true ||
                   self.spec.mandatory.accessPointPublicAccessBlock.restrictPublicBuckets == true) &&
                  has(self.spec.defaults) && has(self.spec.defaults.accessPointPublicAccessBlock) &&
                  (self.spec.defaults.accessPointPublicAccessBlock.blockPublicACLs == true ||
                   self.spec.defaults.accessPointPublicAccessBlock.blockPublicPolicy == true ||
                   self.spec.defaults.accessPointPublicAccessBlock.ignorePublicACLs == true ||
                   self.spec.defaults.accessPointPublicAccessBlock.restrictPublicBuckets == true))
              message: >-
                accessPointPublicAccessBlock cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.accessPointVpcOnly) &&
                  self.spec.mandatory.accessPointVpcOnly == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.accessPointVpcOnly) &&
                  self.spec.defaults.accessPointVpcOnly == true)
              message: >-
                accessPointVpcOnly cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory S3 Advanced governance fields. Non-zero values enforce
                    governance constraints regardless of instance spec or defaults.
                    Zero-value (empty string / false) means the field is not enforced.
                  properties:
                    tableBucketEncryption:
                      type: object
                      default: {}
                      description: >-
                        Mandatory encryption settings for S3 Tables table buckets.
                        Empty values mean not enforced.
                      properties:
                        sseAlgorithm:
                          type: string
                          default: ""
                          description: >-
                            Required SSE algorithm for table buckets (e.g. "aws:kms", "AES256").
                            Empty string = not enforced.
                        kmsKeyARN:
                          type: string
                          default: ""
                          description: >-
                            Required KMS key ARN for SSE-KMS table bucket encryption.
                            Empty string = not enforced.
                    vectorBucketEncryption:
                      type: object
                      default: {}
                      description: >-
                        Mandatory encryption settings for S3 Vectors vector buckets.
                      properties:
                        sseType:
                          type: string
                          default: ""
                          description: >-
                            Required SSE type for vector buckets (e.g. "aws:kms").
                            Empty string = not enforced.
                        kmsKeyARN:
                          type: string
                          default: ""
                          description: >-
                            Required KMS key ARN for vector bucket encryption.
                            Empty string = not enforced.
                    vectorIndexEncryption:
                      type: object
                      default: {}
                      description: >-
                        Mandatory encryption settings for S3 Vectors indexes.
                      properties:
                        sseType:
                          type: string
                          default: ""
                          description: >-
                            Required SSE type for vector indexes (e.g. "aws:kms").
                            Empty string = not enforced.
                        kmsKeyARN:
                          type: string
                          default: ""
                          description: >-
                            Required KMS key ARN for vector index encryption.
                            Empty string = not enforced.
                    filesEncryption:
                      type: object
                      default: {}
                      description: >-
                        Mandatory encryption settings for S3 Files file systems.
                      properties:
                        kmsKeyID:
                          type: string
                          default: ""
                          description: >-
                            Required KMS key ID for S3 Files encryption.
                            Empty string = not enforced.
                    accessPointPublicAccessBlock:
                      type: object
                      default: {}
                      description: >-
                        Mandatory public access block settings for S3 Control access points.
                        false = not enforced.
                      properties:
                        blockPublicACLs:
                          type: boolean
                          default: false
                          description: >-
                            When true, public ACLs on access points are mandatory blocked.
                        blockPublicPolicy:
                          type: boolean
                          default: false
                          description: >-
                            When true, public bucket policies on access points are mandatory blocked.
                        ignorePublicACLs:
                          type: boolean
                          default: false
                          description: >-
                            When true, public ACLs on access points are mandatory ignored.
                        restrictPublicBuckets:
                          type: boolean
                          default: false
                          description: >-
                            When true, public bucket access is mandatory restricted.
                    accessPointVpcOnly:
                      type: boolean
                      default: false
                      description: >-
                        When true, all S3 Control access points must be VPC-only.
                        false = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Mandatory cloud resource tags applied to all S3 Advanced resources
                        under this profile. Additive-merged with defaults and instance tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Mandatory labels synced to both metadata.labels (kropath.run/ prefix)
                        and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Mandatory annotations synced to child resource metadata.
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Mandatory naming template for cloud resource names.
                        Empty string = no mandatory template.
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default S3 Advanced governance fields. Applied when the instance spec
                    does not explicitly set a field. Overridden by mandatory values.
                  properties:
                    tableBucketEncryption:
                      type: object
                      default: {}
                      description: >-
                        Default encryption settings for S3 Tables table buckets.
                      properties:
                        sseAlgorithm:
                          type: string
                          default: ""
                          description: >-
                            Default SSE algorithm for table buckets.
                            Empty string = no default enforced.
                        kmsKeyARN:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key ARN for SSE-KMS table bucket encryption.
                            Empty string = no default enforced.
                    vectorBucketEncryption:
                      type: object
                      default: {}
                      description: >-
                        Default encryption settings for S3 Vectors vector buckets.
                      properties:
                        sseType:
                          type: string
                          default: ""
                          description: >-
                            Default SSE type for vector buckets.
                            Empty string = no default enforced.
                        kmsKeyARN:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key ARN for vector bucket encryption.
                            Empty string = no default enforced.
                    vectorIndexEncryption:
                      type: object
                      default: {}
                      description: >-
                        Default encryption settings for S3 Vectors indexes.
                      properties:
                        sseType:
                          type: string
                          default: ""
                          description: >-
                            Default SSE type for vector indexes.
                            Empty string = no default enforced.
                        kmsKeyARN:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key ARN for vector index encryption.
                            Empty string = no default enforced.
                    filesEncryption:
                      type: object
                      default: {}
                      description: >-
                        Default encryption settings for S3 Files file systems.
                      properties:
                        kmsKeyID:
                          type: string
                          default: ""
                          description: >-
                            Default KMS key ID for S3 Files encryption.
                            Empty string = no default enforced.
                    accessPointPublicAccessBlock:
                      type: object
                      default: {}
                      description: >-
                        Default public access block settings for S3 Control access points.
                      properties:
                        blockPublicACLs:
                          type: boolean
                          default: false
                          description: Default block public ACLs on access points.
                        blockPublicPolicy:
                          type: boolean
                          default: false
                          description: Default block public bucket policies on access points.
                        ignorePublicACLs:
                          type: boolean
                          default: false
                          description: Default ignore public ACLs on access points.
                        restrictPublicBuckets:
                          type: boolean
                          default: false
                          description: Default restrict public bucket access.
                    accessPointVpcOnly:
                      type: boolean
                      default: false
                      description: >-
                        Default VPC-only enforcement for S3 Control access points.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Default cloud resource tags. Additive-merged with mandatory tags;
                        mandatory values win on key conflicts.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to metadata.labels and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Default annotations synced to child resource metadata.
                      additionalProperties:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Default naming template for cloud resource names.
                        Supports {namespace}, {name}, {account_id}, {region} tokens.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        tableBucketEncryption:
                          type: object
                          properties:
                            sseAlgorithm:
                              type: string
                            kmsKeyARN:
                              type: string
                        vectorBucketEncryption:
                          type: object
                          properties:
                            sseType:
                              type: string
                            kmsKeyARN:
                              type: string
                        vectorIndexEncryption:
                          type: object
                          properties:
                            sseType:
                              type: string
                            kmsKeyARN:
                              type: string
                        filesEncryption:
                          type: object
                          properties:
                            kmsKeyID:
                              type: string
                        accessPointPublicAccessBlock:
                          type: object
                          properties:
                            blockPublicACLs:
                              type: boolean
                            blockPublicPolicy:
                              type: boolean
                            ignorePublicACLs:
                              type: boolean
                            restrictPublicBuckets:
                              type: boolean
                        accessPointVpcOnly:
                          type: boolean
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                        namingTemplate:
                          type: string
                    defaults:
                      type: object
                      properties:
                        tableBucketEncryption:
                          type: object
                          properties:
                            sseAlgorithm:
                              type: string
                            kmsKeyARN:
                              type: string
                        vectorBucketEncryption:
                          type: object
                          properties:
                            sseType:
                              type: string
                            kmsKeyARN:
                              type: string
                        vectorIndexEncryption:
                          type: object
                          properties:
                            sseType:
                              type: string
                            kmsKeyARN:
                              type: string
                        filesEncryption:
                          type: object
                          properties:
                            kmsKeyID:
                              type: string
                        accessPointPublicAccessBlock:
                          type: object
                          properties:
                            blockPublicACLs:
                              type: boolean
                            blockPublicPolicy:
                              type: boolean
                            ignorePublicACLs:
                              type: boolean
                            restrictPublicBuckets:
                              type: boolean
                        accessPointVpcOnly:
                          type: boolean
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                        namingTemplate:
                          type: string
                    aws:
                      type: object
                      description: AWS account metadata used by RGDs.
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
