---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipesconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: PipesConfig
    listKind: PipesConfigList
    plural: pipesconfigs
    singular: pipesconfig
    shortNames:
      - pipescfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.desiredState) &&
                  self.spec.mandatory.desiredState != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.desiredState) &&
                  self.spec.defaults.desiredState != "")
              message: >-
                desiredState must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Pipes governance fields. Zero-value means the field is
                    not enforced at this tier.
                  properties:
                    desiredState:
                      type: string
                      description: >-
                        Empty string = not enforced. running | stopped when enforced.
                    namingTemplate:
                      type: string
                      description: Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: Pipes-specific mandatory cloud tags. Additive with defaults tier.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: labels synced to both K8s and cloud tags. Additive
                        with defaults tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Annotations synced to cloud. Additive with defaults tier.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Pipes governance fields. Zero-value means no default is
                    provided at this tier.
                  properties:
                    desiredState:
                      type: string
                      description: >-
                        Default desired pipe state. Empty string = fall through to RGD
                        built-in (running).
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming pattern. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud tags. Additive with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default synced labels. Additive with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default synced annotations. Additive with mandatory tier.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        desiredState:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        desiredState:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
