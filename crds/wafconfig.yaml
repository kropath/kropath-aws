---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wafconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: WAFConfig
    listKind: WAFConfigList
    plural: wafconfigs
    singular: wafconfig
    shortNames:
      - wafcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Scope
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.scope"
        - name: DefaultAction
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.defaultAction"
        - name: Synced
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # Scalar fields may not be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.scope) &&
                  self.spec.mandatory.scope != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.scope) &&
                  self.spec.defaults.scope != "")
              message: >-
                scope must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultAction) &&
                  self.spec.mandatory.defaultAction != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultAction) &&
                  self.spec.defaults.defaultAction != "")
              message: >-
                defaultAction must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.cloudWatchMetricsEnabled) &&
                  self.spec.mandatory.cloudWatchMetricsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.cloudWatchMetricsEnabled) &&
                  self.spec.defaults.cloudWatchMetricsEnabled == true)
              message: >-
                cloudWatchMetricsEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sampledRequestsEnabled) &&
                  self.spec.mandatory.sampledRequestsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.sampledRequestsEnabled) &&
                  self.spec.defaults.sampledRequestsEnabled == true)
              message: >-
                sampledRequestsEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory WAF governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value = not enforced.
                  properties:
                    scope:
                      type: string
                      default: ""
                      description: >-
                        Forces WAF resource scope for all resources under this profile.
                        Empty = not enforced. Allowed values: "CLOUDFRONT" | "REGIONAL".
                    defaultAction:
                      type: string
                      default: ""
                      description: >-
                        Forces default action for all web ACLs. Empty = not enforced.
                        Allowed values: "allow" | "block".
                    cloudWatchMetricsEnabled:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces CloudWatch metrics enabled for all WAF resources.
                        false = not enforced.
                    sampledRequestsEnabled:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces sampled requests enabled for all WAF resources.
                        false = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Naming template for cloud resource names ({namespace}, {name}).
                        Empty = not enforced; instance spec.nameOverride is the only escape hatch.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        WAF-specific mandatory cloud tags. Merged additively with KropathConfig
                        mandatory tags and instance spec tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags on every child WAF resource (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix)
                        on every child WAF resource.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default WAF governance fields. Applied when no higher-priority source
                    provides a value. Zero-value = no default from this level.
                  properties:
                    scope:
                      type: string
                      default: ""
                      description: >-
                        Default WAF scope. Applied when no mandatory source or instance spec
                        sets this field. Empty = no default from this level.
                        Allowed values: "CLOUDFRONT" | "REGIONAL".
                    defaultAction:
                      type: string
                      default: ""
                      description: >-
                        Default action for web ACLs. Applied when no mandatory source or instance
                        spec.defaultAction is set. Empty = no default from this level.
                        Allowed values: "allow" | "block".
                    cloudWatchMetricsEnabled:
                      type: boolean
                      default: false
                      description: >-
                        Default CloudWatch metrics setting. Applied when no mandatory source sets
                        this field.
                    sampledRequestsEnabled:
                      type: boolean
                      default: false
                      description: >-
                        Default sampled requests setting. Applied when no mandatory source sets
                        this field.
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: >-
                        Default naming template. Uses {namespace}, {name} placeholders.
                        Default: {namespace}-{name}.
                    tags:
                      type: object
                      default: {}
                      description: Default WAF cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child WAF resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child WAF resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of last effectiveConfig write by the controller.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      description: Merged mandatory governance fields.
                      properties:
                        scope:
                          type: string
                        defaultAction:
                          type: string
                        cloudWatchMetricsEnabled:
                          type: boolean
                        sampledRequestsEnabled:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      description: Merged defaults governance fields.
                      properties:
                        scope:
                          type: string
                        defaultAction:
                          type: string
                        cloudWatchMetricsEnabled:
                          type: boolean
                        sampledRequestsEnabled:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      description: Provider identity copied from KropathConfig.aws.
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
