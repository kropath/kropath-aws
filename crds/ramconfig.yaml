---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ramconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: RAMConfig
    listKind: RAMConfigList
    plural: ramconfigs
    singular: ramconfig
    shortNames:
      - awsramcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowExternalPrincipals) &&
                  self.spec.mandatory.allowExternalPrincipals != null &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowExternalPrincipals) &&
                  self.spec.defaults.allowExternalPrincipals != null)
              message: "allowExternalPrincipals cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedResourceTypes) &&
                  size(self.spec.mandatory.allowedResourceTypes) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedResourceTypes) &&
                  size(self.spec.defaults.allowedResourceTypes) > 0)
              message: "allowedResourceTypes cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: "namingTemplate cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory RAM governance fields. Zero-value / nil means the field
                    is not enforced at this tier.
                  properties:
                    allowExternalPrincipals:
                      type: boolean
                      nullable: true
                      description: >-
                        Controls whether external principals may be added to RAM resource shares.
                        nil = not enforced. Cannot be set together with defaults.allowExternalPrincipals.
                    allowedResourceTypes:
                      type: array
                      default: []
                      items:
                        type: string
                      description: >-
                        Allowed shareable resource types (e.g. ["ec2:Subnet", "ec2:TransitGateway"]).
                        Empty = not enforced. Cannot be set together with defaults.allowedResourceTypes.
                    namingTemplate:
                      type: string
                      description: >-
                        Resource share naming template (e.g. "{namespace}-{name}").
                        Empty = not enforced. Cannot be set together with defaults.namingTemplate.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default RAM governance fields. Zero-value / nil means no default
                    is provided at this tier.
                  properties:
                    allowExternalPrincipals:
                      type: boolean
                      nullable: true
                      description: >-
                        Default external principals setting for RAM resource shares.
                        nil = no default. Cannot be set together with mandatory.allowExternalPrincipals.
                    allowedResourceTypes:
                      type: array
                      default: []
                      items:
                        type: string
                      description: >-
                        Default allowed shareable resource types.
                        Empty = no default. Cannot be set together with mandatory.allowedResourceTypes.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template (e.g. "{namespace}-{name}").
                        Empty = no default. Cannot be set together with mandatory.namingTemplate.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged RAM governance config written by kropath-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        allowExternalPrincipals:
                          type: boolean
                          nullable: true
                        allowedResourceTypes:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        allowExternalPrincipals:
                          type: boolean
                          nullable: true
                        allowedResourceTypes:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
