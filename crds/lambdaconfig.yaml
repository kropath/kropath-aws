---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lambdaconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: LambdaConfig
    listKind: LambdaConfigList
    plural: lambdaconfigs
    singular: lambdaconfig
    shortNames:
      - lambdacfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.runtime) &&
                  self.spec.mandatory.runtime != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.runtime) &&
                  self.spec.defaults.runtime != "")
              message: >-
                runtime must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.memorySize) &&
                  self.spec.mandatory.memorySize > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.memorySize) &&
                  self.spec.defaults.memorySize > 0)
              message: >-
                memorySize must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.timeout) &&
                  self.spec.mandatory.timeout > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.timeout) &&
                  self.spec.defaults.timeout > 0)
              message: >-
                timeout must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tracingMode) &&
                  self.spec.mandatory.tracingMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.tracingMode) &&
                  self.spec.defaults.tracingMode != "")
              message: >-
                tracingMode must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyArn) &&
                  self.spec.mandatory.kmsKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyArn) &&
                  self.spec.defaults.kmsKeyArn != "")
              message: >-
                kmsKeyArn must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Lambda governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    runtime:
                      type: string
                      description: >-
                        Empty string = not enforced. e.g. python3.12, nodejs20.x.
                    memorySize:
                      type: integer
                      description: >-
                        0 = not enforced. Hard ceiling in MB (128–10240).
                    timeout:
                      type: integer
                      description: >-
                        0 = not enforced. Hard ceiling in seconds (1–900).
                    tracingMode:
                      type: string
                      description: >-
                        Empty string = not enforced. PassThrough | Active.
                    kmsKeyArn:
                      type: string
                      description: >-
                        Empty string = not enforced. KMS key ARN for environment variable encryption.
                    namingTemplate:
                      type: string
                      description: >-
                        Empty string = no mandatory naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Lambda-specific mandatory cloud tags.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Mandatory synced labels (ADR-015 §6.1): applied to both K8s labels and cloud tags.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Mandatory synced annotations.
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Lambda governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    runtime:
                      type: string
                      description: >-
                        Empty string = no default runtime.
                    memorySize:
                      type: integer
                      description: >-
                        Default memory in MB. 128 MB baseline.
                    timeout:
                      type: integer
                      description: >-
                        Default timeout in seconds. 3-second baseline.
                    tracingMode:
                      type: string
                      description: >-
                        Default tracing mode. PassThrough baseline.
                    kmsKeyArn:
                      type: string
                      description: >-
                        Empty string = no default KMS key.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Default Lambda-specific cloud tags.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Default synced labels.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Default synced annotations.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        runtime:
                          type: string
                        memorySize:
                          type: integer
                        timeout:
                          type: integer
                        tracingMode:
                          type: string
                        kmsKeyArn:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        runtime:
                          type: string
                        memorySize:
                          type: integer
                        timeout:
                          type: integer
                        tracingMode:
                          type: string
                        kmsKeyArn:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
