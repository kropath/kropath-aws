---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awss3configs.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSS3Config
    listKind: AWSS3ConfigList
    plural: awss3configs
    singular: awss3config
    shortNames:
      - awss3cfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionAlgorithm) &&
                  self.spec.mandatory.encryptionAlgorithm != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionAlgorithm) &&
                  self.spec.defaults.encryptionAlgorithm != "")
              message: >-
                encryptionAlgorithm must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyArn) &&
                  self.spec.mandatory.kmsKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyArn) &&
                  self.spec.defaults.kmsKeyArn != "")
              message: >-
                kmsKeyArn must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.blockPublicAccess) &&
                  self.spec.mandatory.blockPublicAccess == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.blockPublicAccess) &&
                  self.spec.defaults.blockPublicAccess == true)
              message: >-
                blockPublicAccess must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.versioning) &&
                  self.spec.mandatory.versioning != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.versioning) &&
                  self.spec.defaults.versioning != "")
              message: >-
                versioning must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.loggingEnabled) &&
                  self.spec.mandatory.loggingEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.loggingEnabled) &&
                  self.spec.defaults.loggingEnabled == true)
              message: >-
                loggingEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.logDeliveryBucket) &&
                  self.spec.mandatory.logDeliveryBucket != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.logDeliveryBucket) &&
                  self.spec.defaults.logDeliveryBucket != "")
              message: >-
                logDeliveryBucket must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enforceHttpsOnly) &&
                  self.spec.mandatory.enforceHttpsOnly == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enforceHttpsOnly) &&
                  self.spec.defaults.enforceHttpsOnly == true)
              message: >-
                enforceHttpsOnly must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.objectLockMode) &&
                  self.spec.mandatory.objectLockMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.objectLockMode) &&
                  self.spec.defaults.objectLockMode != "")
              message: >-
                objectLockMode must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.objectLockRetentionDays) &&
                  self.spec.mandatory.objectLockRetentionDays != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.objectLockRetentionDays) &&
                  self.spec.defaults.objectLockRetentionDays != 0)
              message: >-
                objectLockRetentionDays must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory S3 governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults.
                  properties:
                    encryptionAlgorithm:
                      type: string
                      default: ""
                    kmsKeyArn:
                      type: string
                      default: ""
                    blockPublicAccess:
                      type: boolean
                      default: false
                    versioning:
                      type: string
                      default: ""
                    loggingEnabled:
                      type: boolean
                      default: false
                    logDeliveryBucket:
                      type: string
                      default: ""
                    enforceHttpsOnly:
                      type: boolean
                      default: false
                    objectLockMode:
                      type: string
                      default: ""
                    objectLockRetentionDays:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                    namingTemplate:
                      type: string
                      default: ""
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default S3 governance fields. Applied when no higher-priority source
                    provides a value.
                  properties:
                    encryptionAlgorithm:
                      type: string
                      default: "aws:kms"
                    kmsKeyArn:
                      type: string
                      default: ""
                    blockPublicAccess:
                      type: boolean
                      default: true
                    versioning:
                      type: string
                      default: ""
                    loggingEnabled:
                      type: boolean
                      default: false
                    logDeliveryBucket:
                      type: string
                      default: ""
                    enforceHttpsOnly:
                      type: boolean
                      default: false
                    objectLockMode:
                      type: string
                      default: ""
                    objectLockRetentionDays:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}-{account_id}"
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        encryptionAlgorithm:
                          type: string
                        kmsKeyArn:
                          type: string
                        blockPublicAccess:
                          type: boolean
                        versioning:
                          type: string
                        loggingEnabled:
                          type: boolean
                        logDeliveryBucket:
                          type: string
                        enforceHttpsOnly:
                          type: boolean
                        objectLockMode:
                          type: string
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        encryptionAlgorithm:
                          type: string
                        kmsKeyArn:
                          type: string
                        blockPublicAccess:
                          type: boolean
                        versioning:
                          type: string
                        loggingEnabled:
                          type: boolean
                        logDeliveryBucket:
                          type: string
                        enforceHttpsOnly:
                          type: boolean
                        objectLockMode:
                          type: string
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
