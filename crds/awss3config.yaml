---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awss3configs.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSS3Config
    listKind: AWSS3ConfigList
    plural: awss3configs
    singular: awss3config
    shortNames:
      - awss3cfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionAlgorithm) &&
                  self.spec.mandatory.encryptionAlgorithm != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionAlgorithm) &&
                  self.spec.defaults.encryptionAlgorithm != "")
              message: encryptionAlgorithm cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyArn) &&
                  self.spec.mandatory.kmsKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyArn) &&
                  self.spec.defaults.kmsKeyArn != "")
              message: kmsKeyArn cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.blockPublicAccess) &&
                  self.spec.mandatory.blockPublicAccess == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.blockPublicAccess) &&
                  self.spec.defaults.blockPublicAccess == true)
              message: blockPublicAccess cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.versioning) &&
                  self.spec.mandatory.versioning != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.versioning) &&
                  self.spec.defaults.versioning != "")
              message: versioning cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.loggingEnabled) &&
                  self.spec.mandatory.loggingEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.loggingEnabled) &&
                  self.spec.defaults.loggingEnabled == true)
              message: loggingEnabled cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.logDeliveryBucket) &&
                  self.spec.mandatory.logDeliveryBucket != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.logDeliveryBucket) &&
                  self.spec.defaults.logDeliveryBucket != "")
              message: logDeliveryBucket cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enforceHttpsOnly) &&
                  self.spec.mandatory.enforceHttpsOnly == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enforceHttpsOnly) &&
                  self.spec.defaults.enforceHttpsOnly == true)
              message: enforceHttpsOnly cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.objectLockMode) &&
                  self.spec.mandatory.objectLockMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.objectLockMode) &&
                  self.spec.defaults.objectLockMode != "")
              message: objectLockMode cannot be set in both mandatory and defaults.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.objectLockRetentionDays) &&
                  self.spec.mandatory.objectLockRetentionDays != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.objectLockRetentionDays) &&
                  self.spec.defaults.objectLockRetentionDays != 0)
              message: objectLockRetentionDays cannot be set in both mandatory and defaults.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory S3 governance fields. Non-zero values enforce compliance
                    regardless of instance spec. Zero-value means not enforced.
                  properties:
                    encryptionAlgorithm:
                      type: string
                      default: ""
                      description: >-
                        Required bucket encryption algorithm. Empty string = not enforced.
                    kmsKeyArn:
                      type: string
                      default: ""
                      description: >-
                        Required KMS key ARN for S3 encryption. Empty string = no mandatory key.
                    blockPublicAccess:
                      type: boolean
                      default: false
                      description: >-
                        When true, buckets must block public access. false = not enforced.
                    versioning:
                      type: string
                      default: ""
                      description: >-
                        Required versioning state. Empty string = not enforced.
                    loggingEnabled:
                      type: boolean
                      default: false
                      description: >-
                        When true, bucket access logging must be enabled. false = not enforced.
                    logDeliveryBucket:
                      type: string
                      default: ""
                      description: >-
                        Required log delivery bucket. Empty string = no mandatory target.
                    enforceHttpsOnly:
                      type: boolean
                      default: false
                      description: >-
                        When true, HTTPS-only access is required. false = not enforced.
                    objectLockMode:
                      type: string
                      default: ""
                      description: >-
                        Required object lock mode. Empty string = not enforced.
                    objectLockRetentionDays:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Required object lock retention period in days. 0 = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Mandatory naming template for cloud resource names.
                    tags:
                      type: object
                      default: {}
                      description: Mandatory cloud tags for S3 resources.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to child metadata.labels with the kropath.run/ prefix.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to child metadata.annotations with the kropath.run/
                        prefix.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default S3 governance fields. Applied when higher-priority sources do not
                    set a value.
                  properties:
                    encryptionAlgorithm:
                      type: string
                      default: "aws:kms"
                      description: Default encryption algorithm.
                    kmsKeyArn:
                      type: string
                      default: ""
                      description: Default KMS key ARN.
                    blockPublicAccess:
                      type: boolean
                      default: true
                      description: Default public access block setting.
                    versioning:
                      type: string
                      default: ""
                      description: Default versioning state.
                    loggingEnabled:
                      type: boolean
                      default: false
                      description: Default logging setting.
                    logDeliveryBucket:
                      type: string
                      default: ""
                      description: Default log delivery bucket.
                    enforceHttpsOnly:
                      type: boolean
                      default: false
                      description: Default HTTPS-only setting.
                    objectLockMode:
                      type: string
                      default: ""
                      description: Default object lock mode.
                    objectLockRetentionDays:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: Default object lock retention period in days.
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}-{account_id}"
                      description: Default naming template for S3 buckets.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default synced labels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default synced annotations.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance configuration written by kropath-controller.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        encryptionAlgorithm:
                          type: string
                        kmsKeyArn:
                          type: string
                        blockPublicAccess:
                          type: boolean
                        versioning:
                          type: string
                        loggingEnabled:
                          type: boolean
                        logDeliveryBucket:
                          type: string
                        enforceHttpsOnly:
                          type: boolean
                        objectLockMode:
                          type: string
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        encryptionAlgorithm:
                          type: string
                        kmsKeyArn:
                          type: string
                        blockPublicAccess:
                          type: boolean
                        versioning:
                          type: string
                        loggingEnabled:
                          type: boolean
                        logDeliveryBucket:
                          type: string
                        enforceHttpsOnly:
                          type: boolean
                        objectLockMode:
                          type: string
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
