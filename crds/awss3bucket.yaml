---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awss3buckets.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSS3Bucket
    listKind: AWSS3BucketList
    plural: awss3buckets
    singular: awss3bucket
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Resource
          type: string
          jsonPath: ".status.resourceName"
        - name: Arn
          type: string
          jsonPath: ".status.predictedArn"
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              description: Desired state for an S3 bucket.
              properties:
                configRef:
                  type: string
                  default: general-policy
                  description: ResourceConfig profile name.
                nameOverride:
                  type: string
                  default: ""
                  description: Optional escape hatch that bypasses the naming template.
                deletionPolicy:
                  type: string
                  default: retain
                  enum:
                    - retain
                    - delete
                  description: ACK deletion policy annotation value.
                region:
                  type: string
                  default: ""
                  description: AWS region for bucket creation; us-east-1 omits locationConstraint.
                tags:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                syncedLabels:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                syncedAnnotations:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                encryption:
                  type: object
                  default: {}
                  properties:
                    algorithm:
                      type: string
                      default: ""
                    kmsKeyArn:
                      type: string
                      default: ""
                    bucketKeyEnabled:
                      type: boolean
                      default: true
                blockPublicAccess:
                  type: boolean
                  default: true
                versioning:
                  type: string
                  default: ""
                enforceHttpsOnly:
                  type: boolean
                  default: false
                objectOwnership:
                  type: string
                  default: BucketOwnerEnforced
            status:
              type: object
              properties:
                resourceName:
                  type: string
                namingStatus:
                  type: string
                predictedArn:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
