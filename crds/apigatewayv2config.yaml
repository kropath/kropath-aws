---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apigatewayv2configs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: ApiGatewayV2Config
    listKind: ApiGatewayV2ConfigList
    plural: apigatewayv2configs
    singular: apigatewayv2config
    shortNames:
      - apigwv2cfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.corsEnabled) &&
                  self.spec.mandatory.corsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.corsEnabled) &&
                  self.spec.defaults.corsEnabled == true)
              message: >-
                corsEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.disableExecuteApiEndpoint) &&
                  self.spec.mandatory.disableExecuteApiEndpoint == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.disableExecuteApiEndpoint) &&
                  self.spec.defaults.disableExecuteApiEndpoint == true)
              message: >-
                disableExecuteApiEndpoint must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultThrottlingBurstLimit) &&
                  self.spec.mandatory.defaultThrottlingBurstLimit != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultThrottlingBurstLimit) &&
                  self.spec.defaults.defaultThrottlingBurstLimit != 0)
              message: >-
                defaultThrottlingBurstLimit must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultThrottlingRateLimit) &&
                  self.spec.mandatory.defaultThrottlingRateLimit != 0.0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultThrottlingRateLimit) &&
                  self.spec.defaults.defaultThrottlingRateLimit != 0.0)
              message: >-
                defaultThrottlingRateLimit must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.minimumTlsVersion) &&
                  self.spec.mandatory.minimumTlsVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.minimumTlsVersion) &&
                  self.spec.defaults.minimumTlsVersion != "")
              message: >-
                minimumTlsVersion must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.accessLogDestinationArn) &&
                  self.spec.mandatory.accessLogDestinationArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.accessLogDestinationArn) &&
                  self.spec.defaults.accessLogDestinationArn != "")
              message: >-
                accessLogDestinationArn must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.accessLogFormat) &&
                  self.spec.mandatory.accessLogFormat != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.accessLogFormat) &&
                  self.spec.defaults.accessLogFormat != "")
              message: >-
                accessLogFormat must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory API Gateway V2 governance fields. Zero-value means the field is
                    not enforced at this tier.
                  properties:
                    corsEnabled:
                      type: boolean
                      description: >-
                        When true, all HTTP APIs must define a corsConfiguration. false = not enforced.
                        Does not apply to WebSocket APIs.
                    disableExecuteApiEndpoint:
                      type: boolean
                      description: >-
                        When true, all APIs must disable the default execute-api endpoint.
                        false = not enforced.
                    defaultThrottlingBurstLimit:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Enforced burst throttle limit on all stages. 0 = not enforced (sentinel).
                    defaultThrottlingRateLimit:
                      type: number
                      format: double
                      minimum: 0
                      description: >-
                        Enforced rate throttle limit on all stages. 0.0 = not enforced (sentinel).
                    minimumTlsVersion:
                      type: string
                      description: >-
                        Enforced minimum TLS version on all custom domain names.
                        Empty string = not enforced. Valid values: TLS_1_0, TLS_1_2.
                    accessLogDestinationArn:
                      type: string
                      description: >-
                        Mandatory access log destination ARN (CloudWatch Logs or Kinesis Firehose).
                        Empty string = not enforced.
                    accessLogFormat:
                      type: string
                      description: >-
                        Mandatory access log format string.
                        Empty string = not enforced.
                    namingTemplate:
                      type: string
                      description: >-
                        Mandatory naming template for cloud resource names.
                        Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default API Gateway V2 governance fields. Zero-value means no default is
                    provided at this tier.
                  properties:
                    corsEnabled:
                      type: boolean
                      description: Default CORS enforcement toggle.
                    disableExecuteApiEndpoint:
                      type: boolean
                      description: Default execute-api endpoint disable toggle.
                    defaultThrottlingBurstLimit:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default burst throttle limit. 0 = use account default.
                    defaultThrottlingRateLimit:
                      type: number
                      format: double
                      minimum: 0
                      description: >-
                        Default rate throttle limit. 0.0 = use account default.
                    minimumTlsVersion:
                      type: string
                      description: >-
                        Default minimum TLS version. Empty string = no default.
                    accessLogDestinationArn:
                      type: string
                      description: >-
                        Default access log destination ARN. Empty string = no default destination.
                    accessLogFormat:
                      type: string
                      description: >-
                        Default access log format string. Empty string = no default format.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template for cloud resource names.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        corsEnabled:
                          type: boolean
                        disableExecuteApiEndpoint:
                          type: boolean
                        defaultThrottlingBurstLimit:
                          type: integer
                          format: int64
                        defaultThrottlingRateLimit:
                          type: number
                          format: double
                        minimumTlsVersion:
                          type: string
                        accessLogDestinationArn:
                          type: string
                        accessLogFormat:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        corsEnabled:
                          type: boolean
                        disableExecuteApiEndpoint:
                          type: boolean
                        defaultThrottlingBurstLimit:
                          type: integer
                          format: int64
                        defaultThrottlingRateLimit:
                          type: number
                          format: double
                        minimumTlsVersion:
                          type: string
                        accessLogDestinationArn:
                          type: string
                        accessLogFormat:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
