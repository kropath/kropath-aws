---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudwatchlogsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: CloudWatchLogsConfig
    listKind: CloudWatchLogsConfigList
    plural: cloudwatchlogsconfigs
    singular: cloudwatchlogsconfig
    shortNames:
      - cwlcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyId) &&
                  self.spec.mandatory.kmsKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyId) &&
                  self.spec.defaults.kmsKeyId != "")
              message: >-
                kmsKeyId cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.retentionDays) &&
                  self.spec.mandatory.retentionDays != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.retentionDays) &&
                  self.spec.defaults.retentionDays != 0)
              message: >-
                retentionDays cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
            - rule: >-
                !has(self.spec.mandatory) || !has(self.spec.mandatory.retentionDays) ||
                self.spec.mandatory.retentionDays == 0 ||
                self.spec.mandatory.retentionDays in [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180,
                  365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
              message: >-
                mandatory.retentionDays must be 0 (not enforced) or one of the CloudWatch Logs allowed retention values
            - rule: >-
                !has(self.spec.defaults) || !has(self.spec.defaults.retentionDays) ||
                self.spec.defaults.retentionDays == 0 ||
                self.spec.defaults.retentionDays in [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180,
                  365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
              message: >-
                defaults.retentionDays must be 0 (not enforced) or one of the CloudWatch Logs allowed retention values
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory CloudWatch Logs governance fields. Non-zero values enforce
                    governance constraints regardless of instance spec or defaults.
                    Zero-value means the field is not enforced.
                  properties:
                    kmsKeyId:
                      type: string
                      default: ""
                      description: >-
                        Required KMS key ARN for log group encryption. Must be a full KMS key
                        ARN (no aliases — CloudWatch Logs has no AWS-managed service key alias).
                        Empty string = not enforced.
                    retentionDays:
                      type: integer
                      default: 0
                      description: >-
                        Required retention period in days. 0 = not enforced.
                        Must be 0 or one of the CloudWatch Logs allowed values:
                        1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731,
                        1096, 1827, 2192, 2557, 2922, 3288, 3653.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Required naming template for log group names. Empty string = not enforced.
                        Token vocabulary: {name}, {namespace}, {account_id}, {region}, {configRef}, {tag.<key>}.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        CloudWatch Logs-specific mandatory cloud tags applied to all log groups
                        under this profile. Uses additive merge semantics with KropathConfig tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default CloudWatch Logs governance fields. Applied when no higher-priority
                    source provides a value. Zero-value means no default from this level.
                  properties:
                    kmsKeyId:
                      type: string
                      default: ""
                      description: >-
                        Default KMS key ARN for log group encryption. Empty string = no
                        encryption by default at RGD level. Full ARN required if set.
                    retentionDays:
                      type: integer
                      default: 0
                      description: >-
                        Default retention period in days. 0 = not set at this tier.
                        Must be 0 or one of the CloudWatch Logs allowed values.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Default naming template for log group names.
                        Empty string = not set at this tier.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        kmsKeyId:
                          type: string
                        retentionDays:
                          type: integer
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        kmsKeyId:
                          type: string
                        retentionDays:
                          type: integer
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
