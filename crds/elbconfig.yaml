---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awselbconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: AWSELBConfig
    listKind: AWSELBConfigList
    plural: awselbconfigs
    singular: awselbconfig
    shortNames:
      - elbcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.deletionProtection) &&
                  self.spec.mandatory.deletionProtection == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.deletionProtection) &&
                  self.spec.defaults.deletionProtection == true)
              message: >-
                deletionProtection must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.accessLogsEnabled) &&
                  self.spec.mandatory.accessLogsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.accessLogsEnabled) &&
                  self.spec.defaults.accessLogsEnabled == true)
              message: >-
                accessLogsEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.accessLogsS3Bucket) &&
                  self.spec.mandatory.accessLogsS3Bucket != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.accessLogsS3Bucket) &&
                  self.spec.defaults.accessLogsS3Bucket != "")
              message: >-
                accessLogsS3Bucket must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.crossZoneEnabled) &&
                  self.spec.mandatory.crossZoneEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.crossZoneEnabled) &&
                  self.spec.defaults.crossZoneEnabled == true)
              message: >-
                crossZoneEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.internalOnly) &&
                  self.spec.mandatory.internalOnly == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.internalOnly) &&
                  self.spec.defaults.internalOnly == true)
              message: >-
                internalOnly must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.idleTimeoutSeconds) &&
                  self.spec.mandatory.idleTimeoutSeconds != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.idleTimeoutSeconds) &&
                  self.spec.defaults.idleTimeoutSeconds != 0)
              message: >-
                idleTimeoutSeconds must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sslPolicy) &&
                  self.spec.mandatory.sslPolicy != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.sslPolicy) &&
                  self.spec.defaults.sslPolicy != "")
              message: >-
                sslPolicy must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory ELB governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    deletionProtection:
                      type: boolean
                      default: false
                      description: When true, deletion protection is enforced on all load balancers. false = not enforced.
                    accessLogsEnabled:
                      type: boolean
                      default: false
                      description: When true, access logging is enforced. false = not enforced.
                    accessLogsS3Bucket:
                      type: string
                      default: ""
                      description: Mandatory S3 bucket for access log delivery. Empty string = not enforced.
                    crossZoneEnabled:
                      type: boolean
                      default: false
                      description: When true, cross-zone load balancing is enforced. false = not enforced.
                    internalOnly:
                      type: boolean
                      default: false
                      description: When true, spec.scheme is forced to "internal". false = both schemes allowed.
                    idleTimeoutSeconds:
                      type: integer
                      default: 0
                      description: Mandatory idle timeout for ALBs. 0 = not enforced (sentinel). Range 1-4000.
                    sslPolicy:
                      type: string
                      default: ""
                      description: Mandatory TLS security policy for HTTPS/TLS listeners. Empty string = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Mandatory naming template for cloud resource names. Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: Mandatory cloud tags merged onto every ELB resource.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Labels synced to both Kubernetes metadata and cloud tags (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Annotations synced to Kubernetes metadata.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default ELB governance fields. Applied when the resource instance spec
                    does not set a value at this tier.
                  properties:
                    deletionProtection:
                      type: boolean
                      default: false
                      description: Default deletion protection toggle. Instance can override.
                    accessLogsEnabled:
                      type: boolean
                      default: false
                      description: Default access logging toggle. Instance can override.
                    accessLogsS3Bucket:
                      type: string
                      default: ""
                      description: Default S3 bucket for access log delivery. Empty string = no default.
                    crossZoneEnabled:
                      type: boolean
                      default: false
                      description: Default cross-zone load balancing toggle. Instance can override.
                    internalOnly:
                      type: boolean
                      default: false
                      description: Default internal-only scheme toggle. Instance can override.
                    idleTimeoutSeconds:
                      type: integer
                      default: 0
                      description: Default idle timeout for ALBs. 0 = no default. Range 1-4000.
                    sslPolicy:
                      type: string
                      default: ""
                      description: Default TLS security policy. Empty string = use AWS default.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template for cloud resource names. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud tags merged onto every ELB resource.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to both Kubernetes metadata and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to Kubernetes metadata.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        deletionProtection:
                          type: boolean
                        accessLogsEnabled:
                          type: boolean
                        accessLogsS3Bucket:
                          type: string
                        crossZoneEnabled:
                          type: boolean
                        internalOnly:
                          type: boolean
                        idleTimeoutSeconds:
                          type: integer
                        sslPolicy:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        deletionProtection:
                          type: boolean
                        accessLogsEnabled:
                          type: boolean
                        accessLogsS3Bucket:
                          type: string
                        crossZoneEnabled:
                          type: boolean
                        internalOnly:
                          type: boolean
                        idleTimeoutSeconds:
                          type: integer
                        sslPolicy:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
