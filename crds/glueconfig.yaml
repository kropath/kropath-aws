---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: glueconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: GlueConfig
    listKind: GlueConfigList
    plural: glueconfigs
    singular: glueconfig
    shortNames:
      - awsgluecfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # String fields: zero-value "" = not enforced.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.glueVersion) &&
                  self.spec.mandatory.glueVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.glueVersion) &&
                  self.spec.defaults.glueVersion != "")
              message: >-
                glueVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.workerType) &&
                  self.spec.mandatory.workerType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.workerType) &&
                  self.spec.defaults.workerType != "")
              message: >-
                workerType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.executionClass) &&
                  self.spec.mandatory.executionClass != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.executionClass) &&
                  self.spec.defaults.executionClass != "")
              message: >-
                executionClass cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.securityConfiguration) &&
                  self.spec.mandatory.securityConfiguration != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.securityConfiguration) &&
                  self.spec.defaults.securityConfiguration != "")
              message: >-
                securityConfiguration cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
            # Integer fields: zero (0) = not enforced (integer sentinel pattern).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.numberOfWorkers) &&
                  self.spec.mandatory.numberOfWorkers > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.numberOfWorkers) &&
                  self.spec.defaults.numberOfWorkers > 0)
              message: >-
                numberOfWorkers cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.timeout) &&
                  self.spec.mandatory.timeout > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.timeout) &&
                  self.spec.defaults.timeout > 0)
              message: >-
                timeout cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxRetries) &&
                  self.spec.mandatory.maxRetries > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxRetries) &&
                  self.spec.defaults.maxRetries > 0)
              message: >-
                maxRetries cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxConcurrentRuns) &&
                  self.spec.mandatory.maxConcurrentRuns > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxConcurrentRuns) &&
                  self.spec.defaults.maxConcurrentRuns > 0)
              message: >-
                maxConcurrentRuns cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.notifyDelayAfter) &&
                  self.spec.mandatory.notifyDelayAfter > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.notifyDelayAfter) &&
                  self.spec.defaults.notifyDelayAfter > 0)
              message: >-
                notifyDelayAfter cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    glueVersion:
                      type: string
                    workerType:
                      type: string
                    numberOfWorkers:
                      type: integer
                      format: int64
                    executionClass:
                      type: string
                    timeout:
                      type: integer
                      format: int64
                    maxRetries:
                      type: integer
                      format: int64
                    maxConcurrentRuns:
                      type: integer
                      format: int64
                    securityConfiguration:
                      type: string
                    notifyDelayAfter:
                      type: integer
                      format: int64
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    glueVersion:
                      type: string
                    workerType:
                      type: string
                    numberOfWorkers:
                      type: integer
                      format: int64
                    executionClass:
                      type: string
                    timeout:
                      type: integer
                      format: int64
                    maxRetries:
                      type: integer
                      format: int64
                    maxConcurrentRuns:
                      type: integer
                      format: int64
                    securityConfiguration:
                      type: string
                    notifyDelayAfter:
                      type: integer
                      format: int64
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
