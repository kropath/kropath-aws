---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: glueconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: GlueConfig
    listKind: GlueConfigList
    plural: glueconfigs
    singular: glueconfig
    shortNames:
      - gluecfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.glueVersion) &&
                  self.spec.mandatory.glueVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.glueVersion) &&
                  self.spec.defaults.glueVersion != "")
              message: >-
                glueVersion must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.workerType) &&
                  self.spec.mandatory.workerType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.workerType) &&
                  self.spec.defaults.workerType != "")
              message: >-
                workerType must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.numberOfWorkers) &&
                  self.spec.mandatory.numberOfWorkers > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.numberOfWorkers) &&
                  self.spec.defaults.numberOfWorkers > 0)
              message: >-
                numberOfWorkers must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.executionClass) &&
                  self.spec.mandatory.executionClass != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.executionClass) &&
                  self.spec.defaults.executionClass != "")
              message: >-
                executionClass must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.timeout) &&
                  self.spec.mandatory.timeout > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.timeout) &&
                  self.spec.defaults.timeout > 0)
              message: >-
                timeout must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxRetries) &&
                  self.spec.mandatory.maxRetries > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxRetries) &&
                  self.spec.defaults.maxRetries > 0)
              message: >-
                maxRetries must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxConcurrentRuns) &&
                  self.spec.mandatory.maxConcurrentRuns > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxConcurrentRuns) &&
                  self.spec.defaults.maxConcurrentRuns > 0)
              message: >-
                maxConcurrentRuns must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.securityConfiguration) &&
                  self.spec.mandatory.securityConfiguration != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.securityConfiguration) &&
                  self.spec.defaults.securityConfiguration != "")
              message: >-
                securityConfiguration must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.notifyDelayAfter) &&
                  self.spec.mandatory.notifyDelayAfter > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.notifyDelayAfter) &&
                  self.spec.defaults.notifyDelayAfter > 0)
              message: >-
                notifyDelayAfter must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Glue governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    glueVersion:
                      type: string
                      description: >-
                        Empty string = not enforced. e.g. "4.0", "3.0".
                    workerType:
                      type: string
                      description: >-
                        Empty string = not enforced. G.1X | G.2X | G.4X | G.8X | G.025X | Z.2X.
                    numberOfWorkers:
                      type: integer
                      description: >-
                        0 = not enforced. Worker count.
                    executionClass:
                      type: string
                      description: >-
                        Empty string = not enforced. STANDARD | FLEX.
                    timeout:
                      type: integer
                      description: >-
                        0 = not enforced. Job timeout in minutes.
                    maxRetries:
                      type: integer
                      description: >-
                        0 = not enforced. Maximum automatic retries on job failure.
                    maxConcurrentRuns:
                      type: integer
                      description: >-
                        0 = not enforced. Maximum number of simultaneously running job runs.
                    securityConfiguration:
                      type: string
                      description: >-
                        Empty string = not enforced. Glue SecurityConfiguration name.
                    notifyDelayAfter:
                      type: integer
                      description: >-
                        0 = not enforced. Minutes before CloudWatch notification for delayed runs.
                    namingTemplate:
                      type: string
                      description: >-
                        Empty string = no mandatory naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Glue-specific mandatory cloud tags.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Mandatory synced labels (ADR-015 §6.1): applied to both K8s labels and cloud tags.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Mandatory synced annotations.
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Glue governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    glueVersion:
                      type: string
                      description: >-
                        Default Glue runtime version. Empty string = no default.
                    workerType:
                      type: string
                      description: >-
                        Default worker type. Empty string = no default.
                    numberOfWorkers:
                      type: integer
                      description: >-
                        Default worker count. 0 = no default.
                    executionClass:
                      type: string
                      description: >-
                        Default execution class. Empty string = Glue default (STANDARD).
                    timeout:
                      type: integer
                      description: >-
                        Default job timeout in minutes. 0 = Glue service default (2880 min / 48 hours).
                    maxRetries:
                      type: integer
                      description: >-
                        Default retry count. 0 = no retries.
                    maxConcurrentRuns:
                      type: integer
                      description: >-
                        Default concurrency limit. 0 = no default.
                    securityConfiguration:
                      type: string
                      description: >-
                        Default security configuration name. Empty string = no security configuration.
                    notifyDelayAfter:
                      type: integer
                      description: >-
                        Default notification delay in minutes. 0 = no notification.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Default Glue-specific cloud tags.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Default synced labels.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: >-
                        Default synced annotations.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        glueVersion:
                          type: string
                        workerType:
                          type: string
                        numberOfWorkers:
                          type: integer
                        executionClass:
                          type: string
                        timeout:
                          type: integer
                        maxRetries:
                          type: integer
                        maxConcurrentRuns:
                          type: integer
                        securityConfiguration:
                          type: string
                        notifyDelayAfter:
                          type: integer
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        glueVersion:
                          type: string
                        workerType:
                          type: string
                        numberOfWorkers:
                          type: integer
                        executionClass:
                          type: string
                        timeout:
                          type: integer
                        maxRetries:
                          type: integer
                        maxConcurrentRuns:
                          type: integer
                        securityConfiguration:
                          type: string
                        notifyDelayAfter:
                          type: integer
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
