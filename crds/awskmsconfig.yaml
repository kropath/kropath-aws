---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awskmsconfigs.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSKMSConfig
    listKind: AWSKMSConfigList
    plural: awskmsconfigs
    singular: awskmsconfig
    shortNames:
      - awskmscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.keySpec) &&
                  self.spec.mandatory.keySpec != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.keySpec) &&
                  self.spec.defaults.keySpec != "")
              message: >-
                keySpec cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.keyUsage) &&
                  self.spec.mandatory.keyUsage != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.keyUsage) &&
                  self.spec.defaults.keyUsage != "")
              message: >-
                keyUsage cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedKeySpecs) &&
                  size(self.spec.mandatory.allowedKeySpecs) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedKeySpecs) &&
                  size(self.spec.defaults.allowedKeySpecs) > 0)
              message: >-
                allowedKeySpecs cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableKeyRotation) &&
                  self.spec.mandatory.enableKeyRotation == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableKeyRotation) &&
                  self.spec.defaults.enableKeyRotation == true)
              message: >-
                enableKeyRotation cannot be set to true in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory KMS governance fields. Zero-values mean the field is not enforced.
                  properties:
                    enableKeyRotation:
                      type: boolean
                      default: false
                      description: >-
                        When true, rotation is mandatory. false = not enforced.
                    keySpec:
                      type: string
                      default: ""
                      description: >-
                        Required key spec. Empty string = not enforced.
                    keyUsage:
                      type: string
                      default: ""
                      description: >-
                        Required key usage. Empty string = not enforced.
                    allowedKeySpecs:
                      type: array
                      default: []
                      description: >-
                        Allowed key specs. Empty list = no restriction.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Naming template override. Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: Mandatory cloud tags for KMS resources.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Synced labels mirrored to metadata.labels and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Synced annotations mirrored to metadata.annotations.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default KMS governance fields. Applied when higher-priority sources do not
                    provide a value.
                  properties:
                    enableKeyRotation:
                      type: boolean
                      default: true
                      description: >-
                        Default rotation posture. Baseline: enabled.
                    keySpec:
                      type: string
                      default: ""
                      description: Default key spec. Empty string = no default.
                    keyUsage:
                      type: string
                      default: ""
                      description: Default key usage. Empty string = no default.
                    allowedKeySpecs:
                      type: array
                      default: []
                      description: Default allowed key spec allowlist. Empty list = no restriction.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: Default naming template for cloud resources.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud tags for KMS resources.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default synced labels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default synced annotations.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Standard status conditions.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                effectiveConfig:
                  type: object
                  description: Pre-merged governance config written by kropath-controller.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        enableKeyRotation:
                          type: boolean
                        keySpec:
                          type: string
                        keyUsage:
                          type: string
                        allowedKeySpecs:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        enableKeyRotation:
                          type: boolean
                        keySpec:
                          type: string
                        keyUsage:
                          type: string
                        allowedKeySpecs:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
