---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awskmsconfigs.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSKMSConfig
    listKind: AWSKMSConfigList
    plural: awskmsconfigs
    singular: awskmsconfig
    shortNames:
      - awskmscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableKeyRotation) &&
                  self.spec.mandatory.enableKeyRotation == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableKeyRotation) &&
                  self.spec.defaults.enableKeyRotation == true)
              message: >-
                enableKeyRotation cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.keySpec) &&
                  self.spec.mandatory.keySpec != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.keySpec) &&
                  self.spec.defaults.keySpec != "")
              message: >-
                keySpec cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.keyUsage) &&
                  self.spec.mandatory.keyUsage != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.keyUsage) &&
                  self.spec.defaults.keyUsage != "")
              message: >-
                keyUsage cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedKeySpecs) &&
                  size(self.spec.mandatory.allowedKeySpecs) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedKeySpecs) &&
                  size(self.spec.defaults.allowedKeySpecs) > 0)
              message: >-
                allowedKeySpecs cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory KMS governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    enableKeyRotation:
                      type: boolean
                      default: false
                      description: When true, rotation is enforced. false = not enforced.
                    keySpec:
                      type: string
                      default: ""
                      description: Empty string = not enforced.
                    keyUsage:
                      type: string
                      default: ""
                      description: Empty string = not enforced.
                    allowedKeySpecs:
                      type: array
                      default: []
                      description: Empty list = no restriction.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: Empty string = no mandatory naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default KMS governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    enableKeyRotation:
                      type: boolean
                      default: false
                      description: Default rotation enforcement toggle.
                    keySpec:
                      type: string
                      default: ""
                      description: Default key spec. Empty string = no default.
                    keyUsage:
                      type: string
                      default: ""
                      description: Default key usage. Empty string = no default.
                    allowedKeySpecs:
                      type: array
                      default: []
                      description: Default key spec allowlist. Empty list = no restriction.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        enableKeyRotation:
                          type: boolean
                        keySpec:
                          type: string
                        keyUsage:
                          type: string
                        allowedKeySpecs:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        enableKeyRotation:
                          type: boolean
                        keySpec:
                          type: string
                        keyUsage:
                          type: string
                        allowedKeySpecs:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
