---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awskmsconfigs.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSKMSConfig
    listKind: AWSKMSConfigList
    plural: awskmsconfigs
    singular: awskmsconfig
    shortNames:
      - awskmscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Rotation
          type: boolean
          jsonPath: ".status.effectiveConfig.mandatory.enableKeyRotation"
        - name: KeySpec
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.keySpec"
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableKeyRotation) &&
                  self.spec.mandatory.enableKeyRotation == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableKeyRotation) &&
                  self.spec.defaults.enableKeyRotation == true)
              message: "enableKeyRotation cannot be set to true in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.keySpec) &&
                  self.spec.mandatory.keySpec != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.keySpec) &&
                  self.spec.defaults.keySpec != "")
              message: "keySpec cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.keyUsage) &&
                  self.spec.mandatory.keyUsage != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.keyUsage) &&
                  self.spec.defaults.keyUsage != "")
              message: "keyUsage cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedKeySpecs) &&
                  size(self.spec.mandatory.allowedKeySpecs) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedKeySpecs) &&
                  size(self.spec.defaults.allowedKeySpecs) > 0)
              message: "allowedKeySpecs cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory KMS governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced.
                  properties:
                    enableKeyRotation:
                      type: boolean
                      default: false
                      description: >-
                        When true, key rotation is mandatory. false = not enforced.
                    keySpec:
                      type: string
                      default: ""
                      description: >-
                        Required AWS KMS key spec. Empty string = not enforced.
                    keyUsage:
                      type: string
                      default: ""
                      description: >-
                        Required AWS KMS key usage. Empty string = not enforced.
                    allowedKeySpecs:
                      type: array
                      default: []
                      description: >-
                        Required allowlist of AWS KMS key specs. Empty list = no restriction.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Naming template for cloud resource names. Empty string = no mandatory template.
                    tags:
                      type: object
                      default: {}
                      description: Cloud resource tags applied to all resources under this profile.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (kropath.run/ prefix) and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default KMS governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this level.
                  properties:
                    enableKeyRotation:
                      type: boolean
                      default: false
                      description: Default key rotation toggle. false = no default.
                    keySpec:
                      type: string
                      default: ""
                      description: Default AWS KMS key spec. Empty string = no default.
                    keyUsage:
                      type: string
                      default: ""
                      description: Default AWS KMS key usage. Empty string = no default.
                    allowedKeySpecs:
                      type: array
                      default: []
                      description: Default allowlist of AWS KMS key specs.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template when no mandatory template is set.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of last effectiveConfig write by the controller.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      description: Merged mandatory governance fields.
                      properties:
                        enableKeyRotation:
                          type: boolean
                        keySpec:
                          type: string
                        keyUsage:
                          type: string
                        allowedKeySpecs:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      description: Merged defaults governance fields.
                      properties:
                        enableKeyRotation:
                          type: boolean
                        keySpec:
                          type: string
                        keyUsage:
                          type: string
                        allowedKeySpecs:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
