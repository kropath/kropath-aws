---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: emrconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: EMRConfig
    listKind: EMRConfigList
    plural: emrconfigs
    singular: emrconfig
    shortNames:
      - emrcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ReleaseLabel
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.releaseLabel"
        - name: Architecture
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.architecture"
        - name: Synced
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # Scalar fields may not be set in both mandatory and defaults simultaneously.
            # Zero-value sentinels: "" for strings, 0 for integers.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.releaseLabel) &&
                  self.spec.mandatory.releaseLabel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.releaseLabel) &&
                  self.spec.defaults.releaseLabel != "")
              message: >-
                releaseLabel must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.architecture) &&
                  self.spec.mandatory.architecture != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.architecture) &&
                  self.spec.defaults.architecture != "")
              message: >-
                architecture must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.autoStopIdleTimeoutMinutes) &&
                  self.spec.mandatory.autoStopIdleTimeoutMinutes != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.autoStopIdleTimeoutMinutes) &&
                  self.spec.defaults.autoStopIdleTimeoutMinutes != 0)
              message: >-
                autoStopIdleTimeoutMinutes must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maximumCapacityCPU) &&
                  self.spec.mandatory.maximumCapacityCPU != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.maximumCapacityCPU) &&
                  self.spec.defaults.maximumCapacityCPU != "")
              message: >-
                maximumCapacityCPU must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maximumCapacityMemory) &&
                  self.spec.mandatory.maximumCapacityMemory != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.maximumCapacityMemory) &&
                  self.spec.defaults.maximumCapacityMemory != "")
              message: >-
                maximumCapacityMemory must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.diskEncryptionKeyARN) &&
                  self.spec.mandatory.diskEncryptionKeyARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.diskEncryptionKeyARN) &&
                  self.spec.defaults.diskEncryptionKeyARN != "")
              message: >-
                diskEncryptionKeyARN must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory EMR governance fields. Non-zero values enforce governance
                    constraints on all EMR resources in scope. Zero-value = not enforced.
                  properties:
                    releaseLabel:
                      type: string
                      description: >-
                        Forces EMR release version for all EMR resources. Empty = not enforced;
                        e.g. "emr-7.1.0".
                    architecture:
                      type: string
                      description: >-
                        Forces CPU architecture for all EMR resources. Empty = not enforced.
                        Valid values: X86_64 | ARM64.
                    autoStopIdleTimeoutMinutes:
                      type: integer
                      description: >-
                        Forces idle timeout before auto-stop (EMR Serverless). 0 = not enforced
                        (zero-value sentinel). Positive integer = minutes.
                    maximumCapacityCPU:
                      type: string
                      description: >-
                        Forces maximum total vCPU capacity for EMR Serverless applications.
                        Empty = not enforced; e.g. "400".
                    maximumCapacityMemory:
                      type: string
                      description: >-
                        Forces maximum total memory for EMR Serverless applications.
                        Empty = not enforced; e.g. "3000g".
                    diskEncryptionKeyARN:
                      type: string
                      description: >-
                        Forces KMS key ARN for EMR Serverless disk encryption.
                        Empty = not enforced.
                    namingTemplate:
                      type: string
                      description: >-
                        Forces naming pattern for EMR resource names. Empty = not enforced;
                        instance spec.nameOverride is the only escape hatch when set.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        EMR-specific mandatory cloud tags. Merged with KropathConfig.mandatory.tags
                        and instance spec.tags (additive merge; mandatory wins on key conflict).
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: labels synced to both K8s metadata.labels and cloud tags.
                        Additive with defaults tier and KropathConfig syncedLabels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6: annotations synced to K8s metadata.annotations and cloud
                        resource annotations. Additive with defaults tier.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default EMR governance fields. Applied when no higher-priority source
                    provides a value. Zero-value = no default from this level.
                  properties:
                    releaseLabel:
                      type: string
                      description: >-
                        Default EMR release version. Empty = no default; e.g. "emr-7.1.0".
                    architecture:
                      type: string
                      description: >-
                        Default CPU architecture. Empty = no default (AWS defaults to X86_64).
                        Valid values: X86_64 | ARM64.
                    autoStopIdleTimeoutMinutes:
                      type: integer
                      description: >-
                        Default idle timeout before auto-stop (EMR Serverless). 0 = no default
                        (zero-value sentinel).
                    maximumCapacityCPU:
                      type: string
                      description: >-
                        Default maximum total vCPU capacity for EMR Serverless applications.
                        Empty = no default; e.g. "400".
                    maximumCapacityMemory:
                      type: string
                      description: >-
                        Default maximum total memory for EMR Serverless applications.
                        Empty = no default; e.g. "3000g".
                    diskEncryptionKeyARN:
                      type: string
                      description: >-
                        Default KMS key ARN for EMR Serverless disk encryption.
                        Empty = no default.
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: >-
                        Default naming pattern for EMR resource names.
                        Tokens: {name}, {namespace}, {account_id}, {region}, {configRef}, {tag.<key>}.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        EMR-specific baseline cloud tags. Merged with KropathConfig.defaults.tags
                        and instance spec.tags (additive merge; instance can override).
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: baseline labels synced to K8s and cloud tags.
                        Additive with mandatory tier and KropathConfig syncedLabels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6: baseline annotations synced to K8s and cloud.
                        Additive with mandatory tier.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of last effectiveConfig write by the controller.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. Merges
                    KropathConfig.mandatory.emr (levels 1–2) and EMRConfig.mandatory (levels 3–4)
                    for mandatory tier; EMRConfig.defaults (levels 6–7) and
                    KropathConfig.defaults.emr (levels 8–9) for defaults tier. RGDs read
                    exclusively from this field via a single externalRef lookup (ADR-010).
                  properties:
                    mandatory:
                      type: object
                      description: Merged mandatory governance fields (levels 1–4 of cascade).
                      properties:
                        releaseLabel:
                          type: string
                        architecture:
                          type: string
                        autoStopIdleTimeoutMinutes:
                          type: integer
                        maximumCapacityCPU:
                          type: string
                        maximumCapacityMemory:
                          type: string
                        diskEncryptionKeyARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      description: Merged defaults governance fields (levels 6–9 of cascade).
                      properties:
                        releaseLabel:
                          type: string
                        architecture:
                          type: string
                        autoStopIdleTimeoutMinutes:
                          type: integer
                        maximumCapacityCPU:
                          type: string
                        maximumCapacityMemory:
                          type: string
                        diskEncryptionKeyARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      description: Provider identity copied from KropathConfig.
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
