---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: emrconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: EMRConfig
    listKind: EMRConfigList
    plural: emrconfigs
    singular: emrconfig
    shortNames:
      - emrcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ReleaseLabel
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.releaseLabel"
        - name: Architecture
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.architecture"
        - name: Synced
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # Scalar fields may not be set in both mandatory and defaults simultaneously.
            # Zero-value sentinels: "" for strings, 0 for integers.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.releaseLabel) &&
                  self.spec.mandatory.releaseLabel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.releaseLabel) &&
                  self.spec.defaults.releaseLabel != "")
              message: >-
                releaseLabel must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.architecture) &&
                  self.spec.mandatory.architecture != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.architecture) &&
                  self.spec.defaults.architecture != "")
              message: >-
                architecture must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.autoStopIdleTimeoutMinutes) &&
                  self.spec.mandatory.autoStopIdleTimeoutMinutes != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.autoStopIdleTimeoutMinutes) &&
                  self.spec.defaults.autoStopIdleTimeoutMinutes != 0)
              message: >-
                autoStopIdleTimeoutMinutes must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maximumCapacityCPU) &&
                  self.spec.mandatory.maximumCapacityCPU != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.maximumCapacityCPU) &&
                  self.spec.defaults.maximumCapacityCPU != "")
              message: >-
                maximumCapacityCPU must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maximumCapacityMemory) &&
                  self.spec.mandatory.maximumCapacityMemory != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.maximumCapacityMemory) &&
                  self.spec.defaults.maximumCapacityMemory != "")
              message: >-
                maximumCapacityMemory must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.diskEncryptionKeyARN) &&
                  self.spec.mandatory.diskEncryptionKeyARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.diskEncryptionKeyARN) &&
                  self.spec.defaults.diskEncryptionKeyARN != "")
              message: >-
                diskEncryptionKeyARN must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory EMR governance fields. Non-zero values enforce governance
                    constraints on all EMR resources in scope. Zero-value = not enforced.
                  properties:
                    releaseLabel:
                      type: string
                      description: >-
                        Forces EMR release version for all EMR resources. Empty = not enforced;
                        e.g. "emr-7.1.0".
                    architecture:
                      type: string
                      description: >-
                        Forces CPU architecture. Empty = not enforced.
                        Valid values: X86_64 | ARM64.
                    autoStopIdleTimeoutMinutes:
                      type: integer
                      description: >-
                        Forces idle timeout (minutes) for EMR Serverless auto-stop. 0 = not enforced.
                    maximumCapacityCPU:
                      type: string
                      description: >-
                        Forces maximum total vCPU for EMR Serverless (e.g. "200"). Empty = not enforced.
                    maximumCapacityMemory:
                      type: string
                      description: >-
                        Forces maximum total memory for EMR Serverless (e.g. "1500g"). Empty = not enforced.
                    diskEncryptionKeyARN:
                      type: string
                      description: >-
                        Forces KMS key ARN for EMR Serverless disk encryption. Empty = not enforced.
                    namingTemplate:
                      type: string
                      description: >-
                        Forces naming template for all EMR resources. Empty = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        EMR-specific mandatory cloud tags. Merged with KropathConfig.mandatory.tags
                        and instance spec.tags (additive merge; mandatory wins on key conflict).
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: labels synced to both K8s metadata.labels and cloud tags.
                        Additive with defaults tier and KropathConfig syncedLabels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6: annotations synced to K8s metadata.annotations and cloud
                        resource annotations. Additive with defaults tier.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default EMR governance fields. Values are used when not overridden by mandatory
                    settings or instance-level configuration. Zero-value = no default applied.
                  properties:
                    releaseLabel:
                      type: string
                      description: >-
                        Default EMR release version. Empty = no default; e.g. "emr-7.1.0".
                    architecture:
                      type: string
                      description: >-
                        Default CPU architecture. Empty = no default.
                        Valid values: X86_64 | ARM64.
                    autoStopIdleTimeoutMinutes:
                      type: integer
                      description: >-
                        Default idle timeout (minutes) for EMR Serverless auto-stop. 0 = no default.
                    maximumCapacityCPU:
                      type: string
                      description: >-
                        Default maximum total vCPU for EMR Serverless (e.g. "400"). Empty = no default.
                    maximumCapacityMemory:
                      type: string
                      description: >-
                        Default maximum total memory for EMR Serverless (e.g. "3000g"). Empty = no default.
                    diskEncryptionKeyARN:
                      type: string
                      description: >-
                        Default KMS key ARN for EMR Serverless disk encryption. Empty = no default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template for all EMR resources.
                        Recommended default: "{namespace}-{name}".
                    tags:
                      type: object
                      default: {}
                      description: >-
                        EMR-specific baseline cloud tags. Merged with KropathConfig.defaults.tags
                        and instance spec.tags (additive merge; instance can override).
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: baseline labels synced to K8s and cloud tags.
                        Additive with mandatory tier and KropathConfig syncedLabels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6: baseline annotations synced to K8s and cloud.
                        Additive with mandatory tier.
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
