---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudfrontconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: CloudFrontConfig
    listKind: CloudFrontConfigList
    plural: cloudfrontconfigs
    singular: cloudfrontconfig
    shortNames:
      - cfcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.viewerProtocolPolicy) &&
                  self.spec.mandatory.viewerProtocolPolicy != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.viewerProtocolPolicy) &&
                  self.spec.defaults.viewerProtocolPolicy != "")
              message: >-
                viewerProtocolPolicy must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.minimumProtocolVersion) &&
                  self.spec.mandatory.minimumProtocolVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.minimumProtocolVersion) &&
                  self.spec.defaults.minimumProtocolVersion != "")
              message: >-
                minimumProtocolVersion must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.httpVersion) &&
                  self.spec.mandatory.httpVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.httpVersion) &&
                  self.spec.defaults.httpVersion != "")
              message: >-
                httpVersion must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.sslSupportMethod) &&
                  self.spec.mandatory.sslSupportMethod != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.sslSupportMethod) &&
                  self.spec.defaults.sslSupportMethod != "")
              message: >-
                sslSupportMethod must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.loggingEnabled) &&
                  self.spec.mandatory.loggingEnabled &&
                  has(self.spec.defaults) && has(self.spec.defaults.loggingEnabled) &&
                  self.spec.defaults.loggingEnabled)
              message: >-
                loggingEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.loggingBucket) &&
                  self.spec.mandatory.loggingBucket != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.loggingBucket) &&
                  self.spec.defaults.loggingBucket != "")
              message: >-
                loggingBucket must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.priceClass) &&
                  self.spec.mandatory.priceClass != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.priceClass) &&
                  self.spec.defaults.priceClass != "")
              message: >-
                priceClass must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.webACLRequired) &&
                  self.spec.mandatory.webACLRequired &&
                  has(self.spec.defaults) && has(self.spec.defaults.webACLRequired) &&
                  self.spec.defaults.webACLRequired)
              message: >-
                webACLRequired must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.geoRestrictionType) &&
                  self.spec.mandatory.geoRestrictionType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.geoRestrictionType) &&
                  self.spec.defaults.geoRestrictionType != "")
              message: >-
                geoRestrictionType must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.oacSigningBehavior) &&
                  self.spec.mandatory.oacSigningBehavior != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.oacSigningBehavior) &&
                  self.spec.defaults.oacSigningBehavior != "")
              message: >-
                oacSigningBehavior must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory CloudFront governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means the
                    field is not enforced at this tier.
                  properties:
                    viewerProtocolPolicy:
                      type: string
                      default: ""
                      description: >-
                        Required viewer protocol policy for all distributions. Empty string = not
                        enforced. Valid values: "https-only", "redirect-to-https".
                    minimumProtocolVersion:
                      type: string
                      default: ""
                      description: >-
                        Required minimum TLS version for HTTPS connections. Empty string = not
                        enforced. Example: "TLSv1.2_2021".
                    httpVersion:
                      type: string
                      default: ""
                      description: >-
                        Required HTTP version support for all distributions. Empty string = not
                        enforced. Valid values: "http2", "http2and3", "http3".
                    sslSupportMethod:
                      type: string
                      default: ""
                      description: >-
                        Required SSL support method for viewer certificate. Empty string = not
                        enforced. Valid values: "sni-only", "vip".
                    loggingEnabled:
                      type: boolean
                      default: false
                      description: >-
                        false = not enforced; true = all distributions must have access logging
                        enabled. Pair with loggingBucket when true.
                    loggingBucket:
                      type: string
                      default: ""
                      description: >-
                        Required S3 bucket domain for access log delivery. Empty string = not
                        enforced. Typically paired with loggingEnabled: true.
                    priceClass:
                      type: string
                      default: ""
                      description: >-
                        Required CloudFront price class (edge tier). Empty string = not enforced.
                        Valid values: "PriceClass_100", "PriceClass_200", "PriceClass_All".
                    webACLRequired:
                      type: boolean
                      default: false
                      description: >-
                        false = not enforced; true = spec.webACLID must be non-empty on every
                        distribution under this profile.
                    geoRestrictionType:
                      type: string
                      default: ""
                      description: >-
                        Required geographic restriction type. Empty string = not enforced.
                        Valid values: "whitelist", "blacklist", "none".
                    oacSigningBehavior:
                      type: string
                      default: ""
                      description: >-
                        Required OAC signing behavior for all OAC resources. Empty string = not
                        enforced. Valid values: "always", "never", "no-override".
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Required naming template for cloud resource names. Empty string = not
                        enforced. Token vocabulary: {name}, {namespace}, {account_id}, {region},
                        {configRef}, {tag.<key>}.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        CloudFront-specific mandatory cloud tags applied to all resources under
                        this profile. Uses additive merge semantics with KropathConfig tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and cloud
                        resource tags (ADR-015 §6.1). Additive with defaults tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                        Additive with defaults tier.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default CloudFront governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this tier.
                  properties:
                    viewerProtocolPolicy:
                      type: string
                      default: ""
                      description: >-
                        Default viewer protocol policy. Empty string = no default at this tier.
                        Valid values: "https-only", "redirect-to-https".
                    minimumProtocolVersion:
                      type: string
                      default: ""
                      description: >-
                        Default minimum TLS version. Empty string = no default at this tier.
                    httpVersion:
                      type: string
                      default: ""
                      description: >-
                        Default HTTP version. Empty string = no default at this tier.
                        Valid values: "http2", "http2and3", "http3".
                    sslSupportMethod:
                      type: string
                      default: ""
                      description: >-
                        Default SSL support method. Empty string = no default at this tier.
                        Valid values: "sni-only", "vip".
                    loggingEnabled:
                      type: boolean
                      default: false
                      description: >-
                        Default access logging behaviour. false = logging disabled by default;
                        instance can override.
                    loggingBucket:
                      type: string
                      default: ""
                      description: >-
                        Default S3 bucket domain for access log delivery. Empty string = no
                        default bucket.
                    priceClass:
                      type: string
                      default: ""
                      description: >-
                        Default CloudFront price class. Empty string = no default at this tier.
                        Valid values: "PriceClass_100", "PriceClass_200", "PriceClass_All".
                    webACLRequired:
                      type: boolean
                      default: false
                      description: >-
                        Default WAF requirement. false = WAF not required by default; instance
                        can override.
                    geoRestrictionType:
                      type: string
                      default: ""
                      description: >-
                        Default geographic restriction type. Empty string = no default at this
                        tier. Valid values: "whitelist", "blacklist", "none".
                    oacSigningBehavior:
                      type: string
                      default: ""
                      description: >-
                        Default OAC signing behavior. Empty string = no default at this tier.
                        Valid values: "always", "never", "no-override".
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Default naming template for cloud resource names. Empty string = no
                        default template.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags. Additive with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default synced labels. Additive with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default synced annotations. Additive with mandatory tier.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        viewerProtocolPolicy:
                          type: string
                        minimumProtocolVersion:
                          type: string
                        httpVersion:
                          type: string
                        sslSupportMethod:
                          type: string
                        loggingEnabled:
                          type: boolean
                        loggingBucket:
                          type: string
                        priceClass:
                          type: string
                        webACLRequired:
                          type: boolean
                        geoRestrictionType:
                          type: string
                        oacSigningBehavior:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        viewerProtocolPolicy:
                          type: string
                        minimumProtocolVersion:
                          type: string
                        httpVersion:
                          type: string
                        sslSupportMethod:
                          type: string
                        loggingEnabled:
                          type: boolean
                        loggingBucket:
                          type: string
                        priceClass:
                          type: string
                        webACLRequired:
                          type: boolean
                        geoRestrictionType:
                          type: string
                        oacSigningBehavior:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
