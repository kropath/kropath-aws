---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cognitoconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: CognitoConfig
    listKind: CognitoConfigList
    plural: cognitoconfigs
    singular: cognitoconfig
    shortNames:
      - cogcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              # x-kubernetes-validations at spec level so rules reference self.mandatory.*
              # not self.spec.mandatory.* — consistent with ADR-015 §4.2 mutual-exclusion pattern.
              x-kubernetes-validations:
                # String fields — empty string means "not set"
                - rule: >-
                    !(has(self.mandatory.mfaConfiguration) && self.mandatory.mfaConfiguration != ''
                      && has(self.defaults.mfaConfiguration) && self.defaults.mfaConfiguration != '')
                  message: "mfaConfiguration cannot be set in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory.deletionProtection) && self.mandatory.deletionProtection != ''
                      && has(self.defaults.deletionProtection) && self.defaults.deletionProtection != '')
                  message: "deletionProtection cannot be set in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory.advancedSecurityMode) && self.mandatory.advancedSecurityMode != ''
                      && has(self.defaults.advancedSecurityMode) && self.defaults.advancedSecurityMode != '')
                  message: "advancedSecurityMode cannot be set in both mandatory and defaults"
                # Integer fields — 0 means "not set"
                - rule: >-
                    !(has(self.mandatory.passwordPolicy) && has(self.mandatory.passwordPolicy.minimumLength)
                      && self.mandatory.passwordPolicy.minimumLength > 0
                      && has(self.defaults.passwordPolicy) && has(self.defaults.passwordPolicy.minimumLength)
                      && self.defaults.passwordPolicy.minimumLength > 0)
                  message: "passwordPolicy.minimumLength cannot be set in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory.passwordPolicy) && has(self.mandatory.passwordPolicy.temporaryPasswordValidityDays)
                      && self.mandatory.passwordPolicy.temporaryPasswordValidityDays > 0
                      && has(self.defaults.passwordPolicy) && has(self.defaults.passwordPolicy.temporaryPasswordValidityDays)
                      && self.defaults.passwordPolicy.temporaryPasswordValidityDays > 0)
                  message: "passwordPolicy.temporaryPasswordValidityDays cannot be set in both mandatory and defaults"
                # Boolean sub-fields — pointer semantics; has() distinguishes "field present" from "field absent"
                # regardless of value — any presence in both tiers is rejected (G-6)
                - rule: >-
                    !(has(self.mandatory.passwordPolicy) && has(self.mandatory.passwordPolicy.requireLowercase)
                      && has(self.defaults.passwordPolicy) && has(self.defaults.passwordPolicy.requireLowercase))
                  message: "passwordPolicy.requireLowercase cannot be set in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory.passwordPolicy) && has(self.mandatory.passwordPolicy.requireNumbers)
                      && has(self.defaults.passwordPolicy) && has(self.defaults.passwordPolicy.requireNumbers))
                  message: "passwordPolicy.requireNumbers cannot be set in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory.passwordPolicy) && has(self.mandatory.passwordPolicy.requireSymbols)
                      && has(self.defaults.passwordPolicy) && has(self.defaults.passwordPolicy.requireSymbols))
                  message: "passwordPolicy.requireSymbols cannot be set in both mandatory and defaults"
                - rule: >-
                    !(has(self.mandatory.passwordPolicy) && has(self.mandatory.passwordPolicy.requireUppercase)
                      && has(self.defaults.passwordPolicy) && has(self.defaults.passwordPolicy.requireUppercase))
                  message: "passwordPolicy.requireUppercase cannot be set in both mandatory and defaults"
                # Naming template
                - rule: >-
                    !(has(self.mandatory.namingTemplate) && self.mandatory.namingTemplate != ''
                      && has(self.defaults.namingTemplate) && self.defaults.namingTemplate != '')
                  message: "namingTemplate cannot be set in both mandatory and defaults"
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory CognitoConfig governance fields. Zero-value means the field is
                    not enforced at this tier. Fields set here override instance spec and defaults.
                  properties:
                    mfaConfiguration:
                      type: string
                      description: >-
                        Forces MFA level for all pools in this profile. Empty string = not enforced.
                        Valid values: "OFF" | "OPTIONAL" | "ON".
                    deletionProtection:
                      type: string
                      description: >-
                        Forces deletion protection. Empty string = not enforced.
                        Valid values: "ACTIVE" | "INACTIVE".
                    advancedSecurityMode:
                      type: string
                      description: >-
                        Forces advanced security mode. Empty string = not enforced.
                        Valid values: "OFF" | "AUDIT" | "ENFORCED".
                    passwordPolicy:
                      type: object
                      description: >-
                        Mandatory password policy sub-fields. Each sub-field resolves independently
                        through the cascade (OD-1 resolved: Option B).
                      properties:
                        minimumLength:
                          type: integer
                          description: >-
                            Enforces minimum password length. 0 = not enforced. Valid range: 6–99.
                        requireLowercase:
                          type: boolean
                          description: >-
                            Enforces lowercase requirement. Pointer semantics: has() detects presence;
                            absence means not enforced at this tier.
                        requireNumbers:
                          type: boolean
                          description: >-
                            Enforces number requirement. Pointer semantics: presence detected via has().
                        requireSymbols:
                          type: boolean
                          description: >-
                            Enforces symbol requirement. Pointer semantics: presence detected via has().
                        requireUppercase:
                          type: boolean
                          description: >-
                            Enforces uppercase requirement. Pointer semantics: presence detected via has().
                        temporaryPasswordValidityDays:
                          type: integer
                          description: >-
                            Enforces temporary password expiry in days. 0 = not enforced.
                            Valid range: 1–365.
                    namingTemplate:
                      type: string
                      description: >-
                        Enforced naming pattern for user pools. Empty string = not enforced.
                        Tokens: {name}, {namespace}, {account_id}, {region}, {configRef}, {tag.<key>}.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Cognito-specific mandatory cloud tags. Additive map merge with instance
                        and defaults tiers.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: labels synced to both K8s metadata and cloud tags.
                        Additive map merge with defaults tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to cloud. Additive map merge with defaults tier.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default CognitoConfig governance fields. Applied when the instance spec field
                    is empty. Zero-value means no default is provided at this tier.
                  properties:
                    mfaConfiguration:
                      type: string
                      description: >-
                        Default MFA level. Applied when instance does not specify MFA configuration.
                        Valid values: "OFF" | "OPTIONAL" | "ON".
                    deletionProtection:
                      type: string
                      description: >-
                        Default deletion protection state.
                        Valid values: "ACTIVE" | "INACTIVE".
                    advancedSecurityMode:
                      type: string
                      description: >-
                        Default advanced security mode. Empty string = no advanced security by default.
                        Valid values: "OFF" | "AUDIT" | "ENFORCED".
                    passwordPolicy:
                      type: object
                      description: >-
                        Default password policy sub-fields. Each sub-field resolves independently.
                      properties:
                        minimumLength:
                          type: integer
                          description: >-
                            Default minimum password length. 0 = no default. Valid range: 6–99.
                        requireLowercase:
                          type: boolean
                          description: >-
                            Default lowercase requirement. Pointer semantics: presence detected via has().
                        requireNumbers:
                          type: boolean
                          description: >-
                            Default number requirement. Pointer semantics: presence detected via has().
                        requireSymbols:
                          type: boolean
                          description: >-
                            Default symbol requirement. Pointer semantics: presence detected via has().
                        requireUppercase:
                          type: boolean
                          description: >-
                            Default uppercase requirement. Pointer semantics: presence detected via has().
                        temporaryPasswordValidityDays:
                          type: integer
                          description: >-
                            Default temporary password validity in days. 0 = no default.
                            Valid range: 1–365.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming pattern for user pools. Empty string = no default.
                        Tokens: {name}, {namespace}, {account_id}, {region}, {configRef}, {tag.<key>}.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Cognito-specific default cloud tags. Additive map merge with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default synced labels. Additive map merge with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Default synced annotations. Additive map merge with mandatory tier.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: >-
                    Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. CognitoUserPool
                    RGDs read exclusively from this field via a single externalRef lookup (ADR-010).
                  properties:
                    mandatory:
                      type: object
                      properties:
                        mfaConfiguration:
                          type: string
                        deletionProtection:
                          type: string
                        advancedSecurityMode:
                          type: string
                        passwordPolicy:
                          type: object
                          properties:
                            minimumLength:
                              type: integer
                            requireLowercase:
                              type: boolean
                            requireNumbers:
                              type: boolean
                            requireSymbols:
                              type: boolean
                            requireUppercase:
                              type: boolean
                            temporaryPasswordValidityDays:
                              type: integer
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        mfaConfiguration:
                          type: string
                        deletionProtection:
                          type: string
                        advancedSecurityMode:
                          type: string
                        passwordPolicy:
                          type: object
                          properties:
                            minimumLength:
                              type: integer
                            requireLowercase:
                              type: boolean
                            requireNumbers:
                              type: boolean
                            requireSymbols:
                              type: boolean
                            requireUppercase:
                              type: boolean
                            temporaryPasswordValidityDays:
                              type: integer
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
