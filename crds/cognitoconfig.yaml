---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cognitoconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: CognitoConfig
    listKind: CognitoConfigList
    plural: cognitoconfigs
    singular: cognitoconfig
    shortNames:
      - awscognitocfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory.mfaConfiguration) &&
                  self.spec.mandatory.mfaConfiguration != '' &&
                  has(self.spec.defaults.mfaConfiguration) &&
                  self.spec.defaults.mfaConfiguration != '')
              message: "mfaConfiguration cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.deletionProtection) &&
                  self.spec.mandatory.deletionProtection != '' &&
                  has(self.spec.defaults.deletionProtection) &&
                  self.spec.defaults.deletionProtection != '')
              message: "deletionProtection cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.advancedSecurityMode) &&
                  self.spec.mandatory.advancedSecurityMode != '' &&
                  has(self.spec.defaults.advancedSecurityMode) &&
                  self.spec.defaults.advancedSecurityMode != '')
              message: "advancedSecurityMode cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != '' &&
                  has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != '')
              message: "namingTemplate cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.passwordPolicy) &&
                  self.spec.mandatory.passwordPolicy.minimumLength > 0 &&
                  has(self.spec.defaults.passwordPolicy) &&
                  self.spec.defaults.passwordPolicy.minimumLength > 0)
              message: "passwordPolicy.minimumLength cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.passwordPolicy) &&
                  has(self.spec.mandatory.passwordPolicy.requireLowercase) &&
                  has(self.spec.defaults.passwordPolicy) &&
                  has(self.spec.defaults.passwordPolicy.requireLowercase))
              message: "passwordPolicy.requireLowercase cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.passwordPolicy) &&
                  has(self.spec.mandatory.passwordPolicy.requireNumbers) &&
                  has(self.spec.defaults.passwordPolicy) &&
                  has(self.spec.defaults.passwordPolicy.requireNumbers))
              message: "passwordPolicy.requireNumbers cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.passwordPolicy) &&
                  has(self.spec.mandatory.passwordPolicy.requireSymbols) &&
                  has(self.spec.defaults.passwordPolicy) &&
                  has(self.spec.defaults.passwordPolicy.requireSymbols))
              message: "passwordPolicy.requireSymbols cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.passwordPolicy) &&
                  has(self.spec.mandatory.passwordPolicy.requireUppercase) &&
                  has(self.spec.defaults.passwordPolicy) &&
                  has(self.spec.defaults.passwordPolicy.requireUppercase))
              message: "passwordPolicy.requireUppercase cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.passwordPolicy) &&
                  self.spec.mandatory.passwordPolicy.temporaryPasswordValidityDays > 0 &&
                  has(self.spec.defaults.passwordPolicy) &&
                  self.spec.defaults.passwordPolicy.temporaryPasswordValidityDays > 0)
              message: "passwordPolicy.temporaryPasswordValidityDays cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Cognito governance fields. Zero-value / nil means the field
                    is not enforced at this tier.
                  properties:
                    mfaConfiguration:
                      type: string
                      default: ""
                      description: MFA level enforcement ("OFF", "OPTIONAL", "ON"). Empty = not enforced.
                      enum:
                        - ""
                        - "OFF"
                        - "OPTIONAL"
                        - "ON"
                    deletionProtection:
                      type: string
                      default: ""
                      description: Deletion protection state ("ACTIVE", "INACTIVE"). Empty = not enforced.
                      enum:
                        - ""
                        - "ACTIVE"
                        - "INACTIVE"
                    advancedSecurityMode:
                      type: string
                      default: ""
                      description: Advanced security mode ("OFF", "AUDIT", "ENFORCED"). Empty = not enforced.
                      enum:
                        - ""
                        - "OFF"
                        - "AUDIT"
                        - "ENFORCED"
                    passwordPolicy:
                      type: object
                      default: {}
                      description: Cognito password policy sub-fields. Each field cascades independently.
                      properties:
                        minimumLength:
                          type: integer
                          format: int64
                          default: 0
                          description: Minimum password length. 0 = not enforced; valid range 6-99.
                        requireLowercase:
                          type: boolean
                          description: Require at least one lowercase letter. Omit (nil) = not enforced.
                        requireNumbers:
                          type: boolean
                          description: Require at least one digit. Omit (nil) = not enforced.
                        requireSymbols:
                          type: boolean
                          description: Require at least one symbol. Omit (nil) = not enforced.
                        requireUppercase:
                          type: boolean
                          description: Require at least one uppercase letter. Omit (nil) = not enforced.
                        temporaryPasswordValidityDays:
                          type: integer
                          format: int64
                          default: 0
                          description: Temporary password expiry in days. 0 = not enforced; valid range 1-365.
                    namingTemplate:
                      type: string
                      default: ""
                      description: User pool naming template (e.g. "{namespace}-{name}"). Empty = no mandatory template.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Kubernetes labels to propagate to created user pool resources.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Kubernetes annotations to propagate to created user pool resources.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Cloud resource tags for mandatory tier.
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Cognito governance fields. Zero-value / nil means the field
                    is not suggested at this tier.
                  properties:
                    mfaConfiguration:
                      type: string
                      default: ""
                      description: MFA level suggestion ("OFF", "OPTIONAL", "ON"). Empty = no suggestion.
                      enum:
                        - ""
                        - "OFF"
                        - "OPTIONAL"
                        - "ON"
                    deletionProtection:
                      type: string
                      default: ""
                      description: Deletion protection suggestion ("ACTIVE", "INACTIVE"). Empty = no suggestion.
                      enum:
                        - ""
                        - "ACTIVE"
                        - "INACTIVE"
                    advancedSecurityMode:
                      type: string
                      default: ""
                      description: Advanced security mode suggestion ("OFF", "AUDIT", "ENFORCED"). Empty = no suggestion.
                      enum:
                        - ""
                        - "OFF"
                        - "AUDIT"
                        - "ENFORCED"
                    passwordPolicy:
                      type: object
                      default: {}
                      description: Cognito password policy defaults sub-fields.
                      properties:
                        minimumLength:
                          type: integer
                          format: int64
                          default: 0
                          description: Minimum password length suggestion. 0 = no suggestion.
                        requireLowercase:
                          type: boolean
                          description: Require lowercase suggestion. Omit (nil) = no suggestion.
                        requireNumbers:
                          type: boolean
                          description: Require digits suggestion. Omit (nil) = no suggestion.
                        requireSymbols:
                          type: boolean
                          description: Require symbols suggestion. Omit (nil) = no suggestion.
                        requireUppercase:
                          type: boolean
                          description: Require uppercase suggestion. Omit (nil) = no suggestion.
                        temporaryPasswordValidityDays:
                          type: integer
                          format: int64
                          default: 0
                          description: Temporary password expiry suggestion in days. 0 = no suggestion.
                    namingTemplate:
                      type: string
                      default: ""
                      description: User pool naming template suggestion. Empty = no suggestion.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Kubernetes labels suggestion for user pool resources.
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Kubernetes annotations suggestion for user pool resources.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                      description: Cloud resource tags for defaults tier.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
