---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: eksconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: EKSConfig
    listKind: EKSConfigList
    plural: eksconfigs
    singular: eksconfig
    shortNames:
      - ekscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: AuthMode
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.authenticationMode"
        - name: SupportType
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.supportType"
        - name: Synced
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # Scalar fields may not be set in both mandatory and defaults simultaneously.
            # Zero-value sentinels: "" for strings, false for booleans, [] for arrays.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.version) &&
                  self.spec.mandatory.version != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.version) &&
                  self.spec.defaults.version != "")
              message: >-
                version must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.authenticationMode) &&
                  self.spec.mandatory.authenticationMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.authenticationMode) &&
                  self.spec.defaults.authenticationMode != "")
              message: >-
                authenticationMode must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionKeyArn) &&
                  self.spec.mandatory.encryptionKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionKeyArn) &&
                  self.spec.defaults.encryptionKeyArn != "")
              message: >-
                encryptionKeyArn must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.loggingTypes) &&
                  self.spec.mandatory.loggingTypes.size() > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.loggingTypes) &&
                  self.spec.defaults.loggingTypes.size() > 0)
              message: >-
                loggingTypes must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.endpointPublicAccess) &&
                  self.spec.mandatory.endpointPublicAccess == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.endpointPublicAccess) &&
                  self.spec.defaults.endpointPublicAccess == true)
              message: >-
                endpointPublicAccess must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.endpointPrivateAccess) &&
                  self.spec.mandatory.endpointPrivateAccess == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.endpointPrivateAccess) &&
                  self.spec.defaults.endpointPrivateAccess == true)
              message: >-
                endpointPrivateAccess must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.supportType) &&
                  self.spec.mandatory.supportType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.supportType) &&
                  self.spec.defaults.supportType != "")
              message: >-
                supportType must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory EKS governance fields. Non-zero values enforce governance
                    constraints on all EKS resources in scope. Zero-value = not enforced.
                  properties:
                    version:
                      type: string
                      default: ""
                      description: >-
                        Forces Kubernetes version for all EKS clusters. Empty = not enforced;
                        e.g. "1.31".
                    authenticationMode:
                      type: string
                      default: ""
                      description: >-
                        Forces authentication mode. Empty = not enforced.
                        Valid values: API | API_AND_CONFIG_MAP | CONFIG_MAP.
                    encryptionKeyArn:
                      type: string
                      default: ""
                      description: >-
                        Forces KMS key ARN for EKS secrets encryption. Empty = not enforced.
                    loggingTypes:
                      type: array
                      default: []
                      description: >-
                        Forces control plane log types. Empty list = not enforced.
                        Valid items: api, audit, authenticator, controllerManager, scheduler.
                      items:
                        type: string
                    endpointPublicAccess:
                      type: boolean
                      default: false
                      description: >-
                        When true, enforces public endpoint access for all clusters.
                        false = not enforced (zero-value sentinel — does not mean enforce disabled).
                    endpointPrivateAccess:
                      type: boolean
                      default: false
                      description: >-
                        When true, enforces private endpoint access for all clusters.
                        false = not enforced (zero-value sentinel — does not mean enforce disabled).
                    supportType:
                      type: string
                      default: ""
                      description: >-
                        Forces EKS support policy. Empty = not enforced.
                        Valid values: EXTENDED | STANDARD.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Forces naming pattern for EKS resource names. Empty = not enforced;
                        instance spec.nameOverride is the only escape hatch when set.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        EKS-specific mandatory cloud tags. Merged with KropathConfig.mandatory.tags
                        and instance spec.tags (additive merge; mandatory wins on key conflict).
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: labels synced to both K8s metadata.labels and cloud tags.
                        Additive with defaults tier and KropathConfig syncedLabels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6: annotations synced to K8s metadata.annotations and cloud
                        resource annotations. Additive with defaults tier.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default EKS governance fields. Applied when no higher-priority source
                    provides a value. Zero-value = no default from this level.
                  properties:
                    version:
                      type: string
                      default: ""
                      description: >-
                        Default Kubernetes version. Empty = use latest EKS-supported version.
                    authenticationMode:
                      type: string
                      default: ""
                      description: >-
                        Default authentication mode. Empty = no default.
                        Valid values: API | API_AND_CONFIG_MAP | CONFIG_MAP.
                    encryptionKeyArn:
                      type: string
                      default: ""
                      description: >-
                        Default KMS key ARN for EKS secrets encryption. Empty = no default.
                    loggingTypes:
                      type: array
                      default: []
                      description: >-
                        Default control plane log types. Empty list = no default logging.
                        Valid items: api, audit, authenticator, controllerManager, scheduler.
                      items:
                        type: string
                    endpointPublicAccess:
                      type: boolean
                      default: false
                      description: >-
                        Default public endpoint access setting. false = no default (zero-value).
                    endpointPrivateAccess:
                      type: boolean
                      default: false
                      description: >-
                        Default private endpoint access setting. false = no default (zero-value).
                    supportType:
                      type: string
                      default: ""
                      description: >-
                        Default EKS support policy. Empty = no default.
                        Valid values: EXTENDED | STANDARD.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Default naming pattern for EKS resource names. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        EKS-specific baseline cloud tags. Merged with KropathConfig.defaults.tags
                        and instance spec.tags (additive merge; instance can override).
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: baseline labels synced to K8s and cloud tags.
                        Additive with mandatory tier and KropathConfig syncedLabels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6: baseline annotations synced to K8s and cloud.
                        Additive with mandatory tier.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of last effectiveConfig write by the controller.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. Merges
                    KropathConfig (levels 1–2 mandatory, 8–9 defaults) with EKSConfig
                    (levels 3–4 mandatory, 6–7 defaults). RGDs read exclusively from this
                    field via a single externalRef lookup (ADR-010).
                  properties:
                    mandatory:
                      type: object
                      description: Merged mandatory governance fields (levels 1–4 of cascade).
                      properties:
                        version:
                          type: string
                        authenticationMode:
                          type: string
                        encryptionKeyArn:
                          type: string
                        loggingTypes:
                          type: array
                          items:
                            type: string
                        endpointPublicAccess:
                          type: boolean
                        endpointPrivateAccess:
                          type: boolean
                        supportType:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      description: Merged defaults governance fields (levels 6–9 of cascade).
                      properties:
                        version:
                          type: string
                        authenticationMode:
                          type: string
                        encryptionKeyArn:
                          type: string
                        loggingTypes:
                          type: array
                          items:
                            type: string
                        endpointPublicAccess:
                          type: boolean
                        endpointPrivateAccess:
                          type: boolean
                        supportType:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      description: Provider identity copied from KropathConfig.aws.
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
