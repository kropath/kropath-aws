---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bedrockconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: BedrockConfig
    listKind: BedrockConfigList
    plural: bedrockconfigs
    singular: bedrockconfig
    shortNames:
      - bdrcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.foundationModel) &&
                  self.spec.mandatory.foundationModel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.foundationModel) &&
                  self.spec.defaults.foundationModel != "")
              message: >-
                foundationModel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.guardrailIdentifier) &&
                  self.spec.mandatory.guardrailIdentifier != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.guardrailIdentifier) &&
                  self.spec.defaults.guardrailIdentifier != "")
              message: >-
                guardrailIdentifier cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.guardrailVersion) &&
                  self.spec.mandatory.guardrailVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.guardrailVersion) &&
                  self.spec.defaults.guardrailVersion != "")
              message: >-
                guardrailVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedModels) &&
                  size(self.spec.mandatory.allowedModels) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedModels) &&
                  size(self.spec.defaults.allowedModels) > 0)
              message: >-
                allowedModels cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxIterations) &&
                  self.spec.mandatory.maxIterations > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxIterations) &&
                  self.spec.defaults.maxIterations > 0)
              message: >-
                maxIterations cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxTokens) &&
                  self.spec.mandatory.maxTokens > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxTokens) &&
                  self.spec.defaults.maxTokens > 0)
              message: >-
                maxTokens cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.timeoutSeconds) &&
                  self.spec.mandatory.timeoutSeconds > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.timeoutSeconds) &&
                  self.spec.defaults.timeoutSeconds > 0)
              message: >-
                timeoutSeconds cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.idleSessionTTLInSeconds) &&
                  self.spec.mandatory.idleSessionTTLInSeconds > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.idleSessionTTLInSeconds) &&
                  self.spec.defaults.idleSessionTTLInSeconds > 0)
              message: >-
                idleSessionTTLInSeconds cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Bedrock governance fields. Non-zero/non-empty values enforce
                    governance constraints regardless of instance spec or defaults.
                    Zero-value/empty means the field is not enforced.
                  properties:
                    foundationModel:
                      type: string
                      default: ""
                      description: >-
                        Required foundation model ID. Forces a specific model on all Bedrock
                        resources under this profile; instance cannot choose a different model.
                        Empty string = not enforced.
                    guardrailIdentifier:
                      type: string
                      default: ""
                      description: >-
                        Required Bedrock guardrail identifier. Forces a specific guardrail on
                        all Bedrock agents and harnesses. Must be paired with guardrailVersion.
                        Empty string = not enforced.
                    guardrailVersion:
                      type: string
                      default: ""
                      description: >-
                        Required Bedrock guardrail version. Paired with guardrailIdentifier.
                        Empty string = not enforced.
                    allowedModels:
                      type: array
                      default: []
                      description: >-
                        Org-wide model restriction. [] = no restriction; non-empty = allowlist
                        of AWS Bedrock model IDs (e.g. anthropic.claude-3-5-sonnet-20241022-v2:0).
                        Instance foundationModel must be in this list when non-empty.
                      items:
                        type: string
                    maxIterations:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Hard cap on harness loop iterations. 0 = not enforced;
                        non-zero = maximum iterations any harness may execute.
                    maxTokens:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Hard cap on harness output tokens. 0 = not enforced;
                        non-zero = maximum tokens any harness may consume per run.
                    timeoutSeconds:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Hard execution time limit in seconds. 0 = not enforced;
                        non-zero = maximum wall-clock time for harness or agent execution.
                    idleSessionTTLInSeconds:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Enforced session idle timeout for Bedrock agents in seconds.
                        0 = not enforced; non-zero = maximum idle session duration.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Required naming template for Bedrock resource names.
                        Empty string = not enforced.
                        Token vocabulary: {name}, {namespace}, {account_id}, {region}, {configRef}, {tag.<key>}.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Bedrock-specific mandatory cloud tags applied to all Bedrock resources
                        under this profile. Uses additive merge semantics with KropathConfig tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Bedrock governance fields. Applied when no higher-priority
                    source provides a value. Zero-value/empty means no default from this level.
                  properties:
                    foundationModel:
                      type: string
                      default: ""
                      description: >-
                        Default foundation model ID. Applied when instance spec.foundationModel
                        is empty. Empty string = no default model.
                    guardrailIdentifier:
                      type: string
                      default: ""
                      description: >-
                        Default Bedrock guardrail identifier. Applied when instance does not
                        specify a guardrail. Must be paired with guardrailVersion when set.
                        Empty string = no default guardrail.
                    guardrailVersion:
                      type: string
                      default: ""
                      description: >-
                        Default Bedrock guardrail version. Paired with guardrailIdentifier.
                        Empty string = no default guardrail version.
                    allowedModels:
                      type: array
                      default: []
                      description: >-
                        Baseline model allowlist. [] = no restriction; non-empty = default
                        allowlist applied when no mandatory source sets this field.
                      items:
                        type: string
                    maxIterations:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Default harness loop iteration limit. 0 = no default limit.
                        Applied when no mandatory source sets this field.
                    maxTokens:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Default token budget per harness run. 0 = no default limit.
                        Applied when no mandatory source sets this field.
                    timeoutSeconds:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Default execution timeout in seconds. 0 = no default timeout.
                        Applied when no mandatory source sets this field.
                    idleSessionTTLInSeconds:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Default session idle timeout for Bedrock agents in seconds.
                        0 = no default (service default applies).
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Default naming template for Bedrock resource names.
                        Empty string = use the controller default ({namespace}-{name}).
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Default Bedrock cloud tags. Applied as baseline when no higher-priority
                        source provides tags. Uses additive merge semantics.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to both metadata.labels and cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Default annotations synced to metadata.annotations.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                effectiveConfig:
                  type: object
                  description: >-
                    Written by kropath-controller. Pre-merges KropathConfig bedrock section +
                    global BedrockConfig + local BedrockConfig into a single resolved config
                    object. All Bedrock RGDs read this via one externalRef entry (ADR-010).
                  properties:
                    mandatory:
                      type: object
                      properties:
                        foundationModel:
                          type: string
                        guardrailIdentifier:
                          type: string
                        guardrailVersion:
                          type: string
                        allowedModels:
                          type: array
                          items:
                            type: string
                        maxIterations:
                          type: integer
                          format: int64
                        maxTokens:
                          type: integer
                          format: int64
                        timeoutSeconds:
                          type: integer
                          format: int64
                        idleSessionTTLInSeconds:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        foundationModel:
                          type: string
                        guardrailIdentifier:
                          type: string
                        guardrailVersion:
                          type: string
                        allowedModels:
                          type: array
                          items:
                            type: string
                        maxIterations:
                          type: integer
                          format: int64
                        maxTokens:
                          type: integer
                          format: int64
                        timeoutSeconds:
                          type: integer
                          format: int64
                        idleSessionTTLInSeconds:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
                conditions:
                  type: array
                  description: Controller-set status conditions for this BedrockConfig.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
