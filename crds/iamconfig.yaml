---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: iamconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: IAMConfig
    listKind: IAMConfigList
    plural: iamconfigs
    singular: iamconfig
    shortNames:
      - iamcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Boundary
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.permissionsBoundaryArn"
        - name: BlockKeys
          type: boolean
          jsonPath: ".status.effectiveConfig.mandatory.blockIamUserAccessKeys"
        - name: Synced
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # Scalar fields may not be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.permissionsBoundaryArn) &&
                  self.spec.mandatory.permissionsBoundaryArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.permissionsBoundaryArn) &&
                  self.spec.defaults.permissionsBoundaryArn != "")
              message: >-
                permissionsBoundaryArn must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.blockIamUserAccessKeys) &&
                  self.spec.mandatory.blockIamUserAccessKeys == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.blockIamUserAccessKeys) &&
                  self.spec.defaults.blockIamUserAccessKeys == true)
              message: >-
                blockIamUserAccessKeys must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxSessionDurationSeconds) &&
                  self.spec.mandatory.maxSessionDurationSeconds > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxSessionDurationSeconds) &&
                  self.spec.defaults.maxSessionDurationSeconds > 0)
              message: >-
                maxSessionDurationSeconds must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory IAM governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value = not enforced.
                  properties:
                    permissionsBoundaryArn:
                      type: string
                      default: ""
                      description: >-
                        ARN of the IAM permissions boundary policy. When set, all IAM roles and
                        users in this profile must attach this boundary. Empty = not enforced.
                    blockIamUserAccessKeys:
                      type: boolean
                      default: false
                      description: >-
                        When true, IAM user access key creation is blocked regardless of instance
                        spec. false = not enforced.
                    maxSessionDurationSeconds:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      maximum: 43200
                      description: >-
                        Maximum IAM role session duration (seconds). Instance values above this
                        are clamped. 0 = no mandatory cap.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Naming template for cloud resource names ({namespace}, {name}, {kind}).
                        Empty = not enforced; instance spec may override.
                    tags:
                      type: object
                      default: {}
                      description: Cloud resource tags applied to all resources under this profile.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (kropath.run/ prefix) and cloud
                        resource tags on every child resource.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (kropath.run/ prefix) on
                        every child resource.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default IAM governance fields. Applied when no higher-priority source
                    provides a value. Zero-value = no default from this level.
                  properties:
                    permissionsBoundaryArn:
                      type: string
                      default: ""
                      description: >-
                        Default permissions boundary ARN. Used when no mandatory source sets this
                        field. Instance spec may still override.
                    blockIamUserAccessKeys:
                      type: boolean
                      default: false
                      description: >-
                        Default block for IAM user access key creation. Used when no mandatory
                        source sets this field.
                    maxSessionDurationSeconds:
                      type: integer
                      format: int64
                      default: 3600
                      minimum: 0
                      maximum: 43200
                      description: >-
                        Default maximum IAM role session duration (seconds). 3600 (1 hour) baseline.
                        0 = no default cap.
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: >-
                        Default naming template. Uses {namespace}, {name}, {kind} placeholders.
                        Default: {namespace}-{name}.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of last effectiveConfig write by the controller.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      description: Merged mandatory governance fields (levels 1–4 of cascade).
                      properties:
                        permissionsBoundaryArn:
                          type: string
                        blockIamUserAccessKeys:
                          type: boolean
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        addSsmPolicy:
                          type: boolean
                        addEcsExecutionPolicy:
                          type: boolean
                        addLambdaBasicPolicy:
                          type: boolean
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      description: Merged defaults governance fields (levels 6–9 of cascade).
                      properties:
                        permissionsBoundaryArn:
                          type: string
                        blockIamUserAccessKeys:
                          type: boolean
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        addSsmPolicy:
                          type: boolean
                        addEcsExecutionPolicy:
                          type: boolean
                        addLambdaBasicPolicy:
                          type: boolean
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      description: Provider identity copied from globalAWSKropathConfig.aws.
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
