---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: acmconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: ACMConfig
    listKind: ACMConfigList
    plural: acmconfigs
    singular: acmconfig
    shortNames:
      - acmcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.keyAlgorithm) &&
                  self.spec.mandatory.keyAlgorithm != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.keyAlgorithm) &&
                  self.spec.defaults.keyAlgorithm != "")
              message: "keyAlgorithm cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.certificateTransparencyLogging) &&
                  self.spec.mandatory.certificateTransparencyLogging != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.certificateTransparencyLogging) &&
                  self.spec.defaults.certificateTransparencyLogging != "")
              message: "certificateTransparencyLogging cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.usageMode) &&
                  self.spec.mandatory.usageMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.usageMode) &&
                  self.spec.defaults.usageMode != "")
              message: "usageMode cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.keyStorageSecurityStandard) &&
                  self.spec.mandatory.keyStorageSecurityStandard != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.keyStorageSecurityStandard) &&
                  self.spec.defaults.keyStorageSecurityStandard != "")
              message: "keyStorageSecurityStandard cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory ACM governance fields. Zero-value means the field is not
                    enforced at this tier. Non-empty scalar fields override the instance spec.
                  properties:
                    keyAlgorithm:
                      type: string
                      description: >-
                        Empty string = not enforced. Valid: RSA_2048 | EC_prime256v1 | EC_secp384r1.
                    certificateTransparencyLogging:
                      type: string
                      description: >-
                        Empty string = not enforced. Valid: ENABLED | DISABLED.
                    usageMode:
                      type: string
                      description: >-
                        Empty string = not enforced. Valid: GENERAL_PURPOSE | SHORT_LIVED_CERTIFICATE.
                        Applies to private CAs only.
                    keyStorageSecurityStandard:
                      type: string
                      description: >-
                        Empty string = not enforced. Valid: FIPS_140_2_LEVEL_2_OR_HIGHER |
                        FIPS_140_2_LEVEL_3_OR_HIGHER. Applies to private CAs only.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Mandatory cloud tags merged into all Certificate Manager resources.
                        Instance cannot remove mandatory tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Mandatory labels synced to K8s metadata.labels (prefixed aws.kropath.run/)
                        and cloud tags. Instance cannot remove mandatory synced labels.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Mandatory annotations synced to K8s metadata.annotations.
                        Instance cannot remove mandatory synced annotations.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default ACM governance fields. Applied when the instance spec is empty at
                    that field. Zero-value means no default is provided at this tier.
                  properties:
                    keyAlgorithm:
                      type: string
                      description: >-
                        Default key algorithm. Valid: RSA_2048 | EC_prime256v1 | EC_secp384r1.
                    certificateTransparencyLogging:
                      type: string
                      description: >-
                        Default CT logging preference. Valid: ENABLED | DISABLED.
                        Only meaningful for public certificates.
                    usageMode:
                      type: string
                      description: >-
                        Default usage mode for private CAs. Valid: GENERAL_PURPOSE |
                        SHORT_LIVED_CERTIFICATE.
                    keyStorageSecurityStandard:
                      type: string
                      description: >-
                        Default FIPS key storage security standard for private CAs.
                        Valid: FIPS_140_2_LEVEL_2_OR_HIGHER | FIPS_140_2_LEVEL_3_OR_HIGHER.
                    tags:
                      type: object
                      default: {}
                      description: Baseline cloud tags applied when instance does not override.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Baseline synced labels applied when instance does not override.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Baseline synced annotations applied when instance does not override.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. All Certificate
                    Manager RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        keyAlgorithm:
                          type: string
                        certificateTransparencyLogging:
                          type: string
                        usageMode:
                          type: string
                        keyStorageSecurityStandard:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        keyAlgorithm:
                          type: string
                        certificateTransparencyLogging:
                          type: string
                        usageMode:
                          type: string
                        keyStorageSecurityStandard:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
