---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autoscalingconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: AutoScalingConfig
    listKind: AutoScalingConfigList
    plural: autoscalingconfigs
    singular: autoscalingconfig
    shortNames:
      - ascfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.newInstancesProtectedFromScaleIn) &&
                  self.spec.mandatory.newInstancesProtectedFromScaleIn == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.newInstancesProtectedFromScaleIn) &&
                  self.spec.defaults.newInstancesProtectedFromScaleIn == true)
              message: >-
                newInstancesProtectedFromScaleIn must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.capacityRebalance) &&
                  self.spec.mandatory.capacityRebalance == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.capacityRebalance) &&
                  self.spec.defaults.capacityRebalance == true)
              message: >-
                capacityRebalance must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.healthCheckType) &&
                  self.spec.mandatory.healthCheckType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.healthCheckType) &&
                  self.spec.defaults.healthCheckType != "")
              message: >-
                healthCheckType must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.healthCheckGracePeriod) &&
                  self.spec.mandatory.healthCheckGracePeriod != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.healthCheckGracePeriod) &&
                  self.spec.defaults.healthCheckGracePeriod != 0)
              message: >-
                healthCheckGracePeriod must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxInstanceLifetime) &&
                  self.spec.mandatory.maxInstanceLifetime != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxInstanceLifetime) &&
                  self.spec.defaults.maxInstanceLifetime != 0)
              message: >-
                maxInstanceLifetime must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Auto Scaling governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced.
                  properties:
                    newInstancesProtectedFromScaleIn:
                      type: boolean
                      description: >-
                        When true, all ASGs in scope must protect new instances from scale-in
                        termination. false = not enforced.
                    capacityRebalance:
                      type: boolean
                      description: >-
                        When true, all ASGs with Spot capacity must enable proactive Spot
                        rebalancing. false = not enforced.
                    healthCheckType:
                      type: string
                      description: >-
                        Required health check type for all ASGs (e.g. "EC2", "ELB", "EC2,ELB").
                        Empty string = not enforced.
                    healthCheckGracePeriod:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Required health check grace period in seconds. 0 = not enforced.
                    maxInstanceLifetime:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Required maximum instance lifetime in seconds. 0 = not enforced (disabled).
                        When enabled, must be >= 86400 (1 day).
                    namingTemplate:
                      type: string
                      description: >-
                        Naming template for cloud resource names. Empty string = no mandatory template.
                    tags:
                      type: object
                      default: {}
                      description: Cloud resource tags applied to all ASGs under this profile.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and cloud tags
                        (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Auto Scaling governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this level.
                  properties:
                    newInstancesProtectedFromScaleIn:
                      type: boolean
                      description: >-
                        Default scale-in protection. false = disabled by default.
                    capacityRebalance:
                      type: boolean
                      description: >-
                        Default Spot capacity rebalancing. false = disabled by default.
                    healthCheckType:
                      type: string
                      description: >-
                        Default health check type. Profile baseline defined in general-policy CR.
                    healthCheckGracePeriod:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default health check grace period in seconds. Profile baseline defined in general-policy CR.
                    maxInstanceLifetime:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default maximum instance lifetime in seconds. 0 = disabled by default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template for cloud resource names. Profile baseline defined in general-policy CR.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        newInstancesProtectedFromScaleIn:
                          type: boolean
                        capacityRebalance:
                          type: boolean
                        healthCheckType:
                          type: string
                        healthCheckGracePeriod:
                          type: integer
                          format: int64
                        maxInstanceLifetime:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        newInstancesProtectedFromScaleIn:
                          type: boolean
                        capacityRebalance:
                          type: boolean
                        healthCheckType:
                          type: string
                        healthCheckGracePeriod:
                          type: integer
                          format: int64
                        maxInstanceLifetime:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
