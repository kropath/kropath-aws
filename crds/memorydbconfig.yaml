---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: memorydbconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: MemoryDBConfig
    listKind: MemoryDBConfigList
    plural: memorydbconfigs
    singular: memorydbconfig
    shortNames:
      - mdbcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          # 9 mutual-exclusion rules — one per scalar governance field.
          # Boolean fields test for both == true (false = not enforced, safe zero value).
          # Integer fields test for both > 0 (0 = not enforced).
          # String fields test for both != "" ("" = not enforced).
          # Array fields test for size() > 0 ([] = no restriction).
          # Map fields (tags, syncedLabels, syncedAnnotations) merge additively — no rule needed.
          # has() guards prevent spurious rejections when a field is absent from one tier.
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tlsEnabled) &&
                  self.spec.mandatory.tlsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.tlsEnabled) &&
                  self.spec.defaults.tlsEnabled == true)
              message: >-
                tlsEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyArn) &&
                  self.spec.mandatory.kmsKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyArn) &&
                  self.spec.defaults.kmsKeyArn != "")
              message: >-
                kmsKeyArn cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.nodeType) &&
                  self.spec.mandatory.nodeType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.nodeType) &&
                  self.spec.defaults.nodeType != "")
              message: >-
                nodeType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engineVersion) &&
                  self.spec.mandatory.engineVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engineVersion) &&
                  self.spec.defaults.engineVersion != "")
              message: >-
                engineVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedNodeTypes) &&
                  size(self.spec.mandatory.allowedNodeTypes) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedNodeTypes) &&
                  size(self.spec.defaults.allowedNodeTypes) > 0)
              message: >-
                allowedNodeTypes cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.numReplicasPerShard) &&
                  self.spec.mandatory.numReplicasPerShard > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.numReplicasPerShard) &&
                  self.spec.defaults.numReplicasPerShard > 0)
              message: >-
                numReplicasPerShard cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.snapshotRetentionLimit) &&
                  self.spec.mandatory.snapshotRetentionLimit > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.snapshotRetentionLimit) &&
                  self.spec.defaults.snapshotRetentionLimit > 0)
              message: >-
                snapshotRetentionLimit cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.autoMinorVersionUpgrade) &&
                  self.spec.mandatory.autoMinorVersionUpgrade == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.autoMinorVersionUpgrade) &&
                  self.spec.defaults.autoMinorVersionUpgrade == true)
              message: >-
                autoMinorVersionUpgrade cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory MemoryDB governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced. Platform teams set these to codify compliance postures.
                  properties:
                    tlsEnabled:
                      type: boolean
                      description: >-
                        Forces TLS in-transit on all MemoryDB clusters in scope.
                        false (zero value) = not enforced; true = TLS required.
                        IMMUTABLE on MemoryDB Cluster after creation.
                    kmsKeyArn:
                      type: string
                      description: >-
                        Forces a specific KMS key ARN for at-rest encryption on all clusters.
                        Empty string = not enforced; non-empty forces specific KMS key.
                    nodeType:
                      type: string
                      description: >-
                        Forces a specific node type on all clusters. Empty string = not enforced;
                        non-empty forces the exact node type (e.g. db.r7g.large).
                    engineVersion:
                      type: string
                      description: >-
                        Forces a specific MemoryDB engine version on all clusters.
                        Empty string = not enforced; non-empty forces the exact version.
                    allowedNodeTypes:
                      type: array
                      default: []
                      description: >-
                        Restricts cluster node types to an allowlist. [] = no restriction;
                        non-empty = explicit allowlist. Instance nodeType must be in this list.
                        Cross-field validation with nodeType is performed by kropath-controller.
                      items:
                        type: string
                    numReplicasPerShard:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Forces minimum replica count per shard. 0 = not enforced;
                        >0 forces minimum replicas (instance cannot go below this value).
                    snapshotRetentionLimit:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Forces minimum snapshot retention in days. 0 = not enforced;
                        >0 forces minimum retention (instance cannot go below this value).
                    autoMinorVersionUpgrade:
                      type: boolean
                      description: >-
                        Forces automatic minor version upgrade on all clusters.
                        false (zero value) = not enforced; true = auto-upgrade required.
                    namingTemplate:
                      type: string
                      description: >-
                        Forces naming pattern. spec.nameOverride is the only escape hatch.
                        Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        MemoryDB-specific mandatory cloud tags merged into all resource cloud tags.
                        Instance cannot remove mandatory tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both K8s metadata.labels (aws.kropath.run/ prefix)
                        and cloud tags (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to K8s metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default MemoryDB governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this level.
                  properties:
                    tlsEnabled:
                      type: boolean
                      description: >-
                        Default TLS in-transit setting. Applies when instance spec field is nil.
                        Baseline: true (secure by default).
                    kmsKeyArn:
                      type: string
                      description: >-
                        Default KMS key ARN. Applies when instance spec.kmsKeyArn is empty.
                        Empty = use AWS-owned key (no default enforcement).
                    nodeType:
                      type: string
                      description: >-
                        Default node type. Applies when instance spec.nodeType is empty.
                        Empty = no default (workload-dependent).
                    engineVersion:
                      type: string
                      description: >-
                        Default MemoryDB engine version. Applies when instance spec.engineVersion is empty.
                        Empty = use latest available version.
                    allowedNodeTypes:
                      type: array
                      default: []
                      description: >-
                        Baseline node type allowlist. Applies when no mandatory allowedNodeTypes is set.
                        [] = no restriction; non-empty = baseline allowlist.
                      items:
                        type: string
                    numReplicasPerShard:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default replica count per shard. Applies when instance spec field is nil.
                        Baseline: 1 replica for HA.
                    snapshotRetentionLimit:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default snapshot retention in days. Applies when instance spec field is nil.
                        Baseline: 7 days retention.
                    autoMinorVersionUpgrade:
                      type: boolean
                      description: >-
                        Default auto minor version upgrade. Applies when instance spec field is nil.
                        Baseline: true (auto-upgrade enabled).
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Applies when instance spec.nameOverride is empty.
                        Baseline: "{namespace}-{name}".
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Baseline cloud tags. Overridable per-instance.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Baseline synced labels. Overridable per-instance.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Baseline synced annotations. Overridable per-instance.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup (ADR-010).
                    Controller pre-merges KropathConfig + MemoryDBConfig tiers.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        tlsEnabled:
                          type: boolean
                        kmsKeyArn:
                          type: string
                        nodeType:
                          type: string
                        engineVersion:
                          type: string
                        allowedNodeTypes:
                          type: array
                          items:
                            type: string
                        numReplicasPerShard:
                          type: integer
                          format: int64
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                        autoMinorVersionUpgrade:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        tlsEnabled:
                          type: boolean
                        kmsKeyArn:
                          type: string
                        nodeType:
                          type: string
                        engineVersion:
                          type: string
                        allowedNodeTypes:
                          type: array
                          items:
                            type: string
                        numReplicasPerShard:
                          type: integer
                          format: int64
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                        autoMinorVersionUpgrade:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
