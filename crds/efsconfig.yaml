---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: efsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: EFSConfig
    listKind: EFSConfigList
    plural: efsconfigs
    singular: efsconfig
    shortNames:
      - efscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          # 9 mutual-exclusion rules — one per scalar governance field.
          # Boolean fields (encrypted, backupEnabled) test for both true.
          # String fields test for both non-empty.
          # Map fields (tags, syncedLabels, syncedAnnotations) are merged across tiers;
          # no mutual-exclusion rule is required for them.
          # EFS has no cloud-side resource name field — no namingTemplate field is included.
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encrypted) &&
                  self.spec.mandatory.encrypted == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.encrypted) &&
                  self.spec.defaults.encrypted == true)
              message: >-
                encrypted must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyId) &&
                  self.spec.mandatory.kmsKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyId) &&
                  self.spec.defaults.kmsKeyId != "")
              message: >-
                kmsKeyId must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.performanceMode) &&
                  self.spec.mandatory.performanceMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.performanceMode) &&
                  self.spec.defaults.performanceMode != "")
              message: >-
                performanceMode must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.throughputMode) &&
                  self.spec.mandatory.throughputMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.throughputMode) &&
                  self.spec.defaults.throughputMode != "")
              message: >-
                throughputMode must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.backupEnabled) &&
                  self.spec.mandatory.backupEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.backupEnabled) &&
                  self.spec.defaults.backupEnabled == true)
              message: >-
                backupEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.transitionToIA) &&
                  self.spec.mandatory.transitionToIA != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.transitionToIA) &&
                  self.spec.defaults.transitionToIA != "")
              message: >-
                transitionToIA must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.transitionToArchive) &&
                  self.spec.mandatory.transitionToArchive != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.transitionToArchive) &&
                  self.spec.defaults.transitionToArchive != "")
              message: >-
                transitionToArchive must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.transitionToPrimaryStorage) &&
                  self.spec.mandatory.transitionToPrimaryStorage != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.transitionToPrimaryStorage) &&
                  self.spec.defaults.transitionToPrimaryStorage != "")
              message: >-
                transitionToPrimaryStorage must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.replicationOverwriteProtection) &&
                  self.spec.mandatory.replicationOverwriteProtection != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.replicationOverwriteProtection) &&
                  self.spec.defaults.replicationOverwriteProtection != "")
              message: >-
                replicationOverwriteProtection must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory EFS governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced at this tier.
                  properties:
                    encrypted:
                      type: boolean
                      description: >-
                        When true, all EFS file systems are forced encrypted at rest.
                        false = not enforced at this tier. Note: encryption is immutable
                        after file system creation — a change requires resource recreation.
                    kmsKeyId:
                      type: string
                      description: >-
                        Mandatory KMS key ID or ARN for customer-managed encryption.
                        Empty string = not enforced. Non-empty = org-wide CMK forced on
                        all file systems.
                    performanceMode:
                      type: string
                      description: >-
                        Mandatory performance mode for all file systems.
                        Empty string = not enforced. One of: "generalPurpose", "maxIO".
                        Note: performanceMode is immutable after creation.
                    throughputMode:
                      type: string
                      description: >-
                        Mandatory throughput mode for all file systems.
                        Empty string = not enforced.
                        One of: "bursting", "elastic", "provisioned".
                    backupEnabled:
                      type: boolean
                      description: >-
                        When true, automatic AWS Backup is enforced on all file systems.
                        false = not enforced at this tier.
                    transitionToIA:
                      type: string
                      description: >-
                        Mandatory lifecycle transition policy to Infrequent Access storage class.
                        Empty string = not enforced.
                        One of: "AFTER_7_DAYS", "AFTER_14_DAYS", "AFTER_30_DAYS",
                        "AFTER_60_DAYS", "AFTER_90_DAYS", "AFTER_180_DAYS", "AFTER_270_DAYS",
                        "AFTER_365_DAYS".
                    transitionToArchive:
                      type: string
                      description: >-
                        Mandatory lifecycle transition policy to Archive storage class.
                        Empty string = not enforced.
                        One of: "AFTER_90_DAYS", "AFTER_180_DAYS", "AFTER_270_DAYS",
                        "AFTER_365_DAYS".
                    transitionToPrimaryStorage:
                      type: string
                      description: >-
                        Mandatory lifecycle policy for back-transition from IA/Archive
                        to primary storage. Empty string = not enforced.
                        Currently only "AFTER_1_ACCESS" is supported.
                    replicationOverwriteProtection:
                      type: string
                      description: >-
                        Mandatory replication overwrite protection for all file systems.
                        Empty string = not enforced.
                        One of: "ENABLED", "DISABLED".
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Mandatory tags applied to all EFS resources. Merged with instance
                        and defaults tags; mandatory keys take precedence.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Mandatory Kubernetes labels synced to managed resources.
                        Prefixed aws.kropath.run/ and applied to both K8s labels and
                        cloud tags (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Mandatory Kubernetes annotations synced to managed resources.
                        Prefixed aws.kropath.run/ and applied to K8s annotations.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default EFS governance fields. Non-zero values provide baseline
                    governance that instances may override unless mandatory tier takes
                    precedence. Zero-value means no default is provided at this tier.
                  properties:
                    encrypted:
                      type: boolean
                      description: >-
                        Default encryption at rest. true = encrypted by default; instance
                        may opt out if mandatory.encrypted is not set. false = no default.
                    kmsKeyId:
                      type: string
                      description: >-
                        Default KMS key ID or ARN. Empty string = AWS-managed key unless
                        instance specifies a CMK.
                    performanceMode:
                      type: string
                      description: >-
                        Default performance mode. "generalPurpose" = standard baseline;
                        instance may choose "maxIO". Empty string = no default.
                    throughputMode:
                      type: string
                      description: >-
                        Default throughput mode. "elastic" = recommended baseline.
                        Empty string = no default.
                    backupEnabled:
                      type: boolean
                      description: >-
                        Default automatic AWS Backup. true = backed up by default; instance
                        may opt out if mandatory.backupEnabled is not set. false = no default.
                    transitionToIA:
                      type: string
                      description: >-
                        Default IA transition policy. Empty string = no IA transition by default.
                    transitionToArchive:
                      type: string
                      description: >-
                        Default Archive transition policy. Empty string = no Archive
                        transition by default.
                    transitionToPrimaryStorage:
                      type: string
                      description: >-
                        Default back-transition from IA/Archive policy. Empty string = no
                        back-transition by default.
                    replicationOverwriteProtection:
                      type: string
                      description: >-
                        Default replication overwrite protection. "ENABLED" = protected
                        by default. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Default tags applied to all EFS resources. Merged with mandatory
                        and instance tags; mandatory keys take precedence.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default Kubernetes labels synced to managed resources.
                        Prefixed aws.kropath.run/ and applied to both K8s labels and
                        cloud tags (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Default Kubernetes annotations synced to managed resources.
                        Prefixed aws.kropath.run/ and applied to K8s annotations.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller (ADR-010).
                    RGDs read exclusively from this field via a single externalRef lookup.
                    Includes all three sub-objects: mandatory, defaults, aws.
                  properties:
                    mandatory:
                      type: object
                      description: Merged mandatory governance fields.
                      properties:
                        encrypted:
                          type: boolean
                        kmsKeyId:
                          type: string
                        performanceMode:
                          type: string
                        throughputMode:
                          type: string
                        backupEnabled:
                          type: boolean
                        transitionToIA:
                          type: string
                        transitionToArchive:
                          type: string
                        transitionToPrimaryStorage:
                          type: string
                        replicationOverwriteProtection:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      description: Merged defaults governance fields.
                      properties:
                        encrypted:
                          type: boolean
                        kmsKeyId:
                          type: string
                        performanceMode:
                          type: string
                        throughputMode:
                          type: string
                        backupEnabled:
                          type: boolean
                        transitionToIA:
                          type: string
                        transitionToArchive:
                          type: string
                        transitionToPrimaryStorage:
                          type: string
                        replicationOverwriteProtection:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      description: AWS account metadata written by kropath-controller.
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
