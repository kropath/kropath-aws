---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awsiampolicies.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSIAMPolicy
    listKind: AWSIAMPolicyList
    plural: awsiampolicies
    singular: awsiampolicy
    shortNames:
      - awspolicy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Path
          type: string
          jsonPath: ".spec.path"
        - name: Arn
          type: string
          jsonPath: ".status.arn"
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                (self.spec.documentJSON != "" && self.spec.documentRef == "") ||
                (self.spec.documentJSON == "" && self.spec.documentRef != "")
              message: >-
                documentJSON and documentRef are mutually exclusive, and exactly one
                must be set.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                configRef:
                  type: string
                  default: general-policy
                description:
                  type: string
                  default: ""
                path:
                  type: string
                  default: "/"
                  description: IAM path prefix for the managed policy.
                nameOverride:
                  type: string
                  default: ""
                deletionPolicy:
                  type: string
                  default: retain
                  enum:
                    - retain
                    - delete
                documentJSON:
                  type: string
                  default: ""
                  description: Raw IAM policy document JSON.
                documentRef:
                  type: string
                  default: ""
                  description: Local AWSPolicyDocument CR name.
                tags:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                syncedLabels:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                syncedAnnotations:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                resourceName:
                  type: string
                namingStatus:
                  type: string
                predictedArn:
                  type: string
                arn:
                  type: string
                policyId:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
