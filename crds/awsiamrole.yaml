---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awsiamroles.kropath.run
spec:
  group: kropath.run
  names:
    kind: AWSIAMRole
    listKind: AWSIAMRoleList
    plural: awsiamroles
    singular: awsiamrole
    shortNames:
      - awsiamrole
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: ".spec.type"
        - name: ResourceName
          type: string
          jsonPath: ".status.resourceName"
        - name: PredictedArn
          type: string
          jsonPath: ".status.predictedArn"
        - name: Naming
          type: string
          jsonPath: ".status.namingStatus"
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              required:
                - type
              properties:
                configRef:
                  type: string
                  default: "general-policy"
                type:
                  type: string
                  enum:
                    - ec2
                    - ecs-task
                    - lambda
                    - eks-irsa
                    - eks-pod-identity
                    - aws-service
                    - generic
                description:
                  type: string
                  default: ""
                nameOverride:
                  type: string
                  default: ""
                deletionPolicy:
                  type: string
                  default: "retain"
                  enum:
                    - retain
                    - delete
                tags:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                syncedLabels:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                syncedAnnotations:
                  type: object
                  default: {}
                  additionalProperties:
                    type: string
                policies:
                  type: array
                  default: []
                  items:
                    type: object
                    properties:
                      arn:
                        type: string
                        default: ""
                      ref:
                        type: string
                        default: ""
                      inline:
                        type: object
                        default: {}
                        properties:
                          name:
                            type: string
                            default: ""
                          documentJSON:
                            type: string
                            default: ""
                          documentRef:
                            type: string
                            default: ""
                inlinePolicies:
                  type: array
                  default: []
                  items:
                    type: object
                    required:
                      - name
                      - documentRef
                    properties:
                      name:
                        type: string
                        default: ""
                      documentRef:
                        type: string
                        default: ""
                trustPolicyRef:
                  type: string
                  default: ""
                permissionsBoundaryArn:
                  type: string
                  default: ""
                oidcProviderArn:
                  type: string
                  default: ""
                serviceAccountNamespace:
                  type: string
                  default: ""
                serviceAccountName:
                  type: string
                  default: ""
                clusterName:
                  type: string
                  default: ""
                servicePrincipal:
                  type: string
                  default: ""
                trustPolicyJSON:
                  type: string
                  default: ""
                addSsmPolicy:
                  type: boolean
                  default: true
                addEcsExecutionPolicy:
                  type: boolean
                  default: true
                addLambdaBasicPolicy:
                  type: boolean
                  default: true
                createInstanceProfile:
                  type: boolean
                  default: true
                maxSessionDuration:
                  type: integer
                  format: int64
                  default: 0
                  minimum: 0
                  maximum: 43200
            status:
              type: object
              properties:
                resourceName:
                  type: string
                namingStatus:
                  type: string
                predictedArn:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
