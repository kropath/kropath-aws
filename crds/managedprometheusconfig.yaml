---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: managedprometheusconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: ManagedPrometheusConfig
    listKind: ManagedPrometheusConfigList
    plural: managedprometheusconfigs
    singular: managedprometheusconfig
    shortNames:
      - ampcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.alias) &&
                  self.spec.mandatory.alias != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.alias) &&
                  self.spec.defaults.alias != "")
              message: >-
                alias cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.logGroupARN) &&
                  self.spec.mandatory.logGroupARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.logGroupARN) &&
                  self.spec.defaults.logGroupARN != "")
              message: >-
                logGroupARN cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Managed Prometheus governance fields. Non-zero values enforce
                    governance constraints regardless of instance spec or defaults.
                    Zero-value means the field is not enforced.
                  properties:
                    alias:
                      type: string
                      default: ""
                      description: >-
                        Required workspace alias. Empty string = not enforced.
                        Leading/trailing whitespace is trimmed by AWS.
                    logGroupARN:
                      type: string
                      default: ""
                      description: >-
                        Required CloudWatch log group ARN for vended logs from all workspaces
                        under this profile. Empty string = not enforced. Must be a full ARN
                        matching the pattern: arn:aws[a-z0-9-]*:logs:[a-z0-9-]+:\d{12}:log-group:[A-Za-z0-9\.\-\_\#/]{1,512}\:\*
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Required naming template for RuleGroupsNamespace resources only.
                        Empty string = not enforced (RuleGroupsNamespace only — other
                        AMP resource kinds have naming exemptions).
                        Token vocabulary: {name}, {namespace}, {account_id}, {region},
                        {configRef}, {tag.<key>}.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Managed Prometheus-specific mandatory cloud tags applied to Workspace
                        and RuleGroupsNamespace resources under this profile.
                        Uses additive merge semantics with KropathConfig tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Managed Prometheus governance fields. Applied when no higher-priority
                    source provides a value. Zero-value means no default from this level.
                  properties:
                    alias:
                      type: string
                      default: ""
                      description: >-
                        Default workspace alias. Empty string = no alias default.
                    logGroupARN:
                      type: string
                      default: ""
                      description: >-
                        Default CloudWatch log group ARN for vended logs.
                        Empty string = no log destination default.
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: >-
                        Default naming template for RuleGroupsNamespace resources.
                        Only applies to RuleGroupsNamespace (the only AMP resource kind
                        with a provider name field). Default: {namespace}-{name}.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        alias:
                          type: string
                        logGroupARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        alias:
                          type: string
                        logGroupARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
