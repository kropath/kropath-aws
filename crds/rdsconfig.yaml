---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rdsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: RDSConfig
    listKind: RDSConfigList
    plural: rdsconfigs
    singular: rdsconfig
    shortNames:
      - rdscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          # 16 mutual-exclusion rules — one per governance field.
          # Fields that use boolean sentinel (false = not enforced) test for both true.
          # Fields that use string sentinel ("" = not enforced) test for both non-empty.
          # Fields that use integer sentinel (0 = not enforced) test for both non-zero.
          # Cluster-only fields (serverlessV2ScalingMinCapacity, serverlessV2ScalingMaxCapacity,
          # backtrackWindow) follow the same pattern but apply only to RDSCluster resources
          # at the controller layer; RDSInstance ignores them.
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.storageEncrypted) &&
                  self.spec.mandatory.storageEncrypted == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.storageEncrypted) &&
                  self.spec.defaults.storageEncrypted == true)
              message: >-
                storageEncrypted cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyID) &&
                  self.spec.mandatory.kmsKeyID != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyID) &&
                  self.spec.defaults.kmsKeyID != "")
              message: >-
                kmsKeyID cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.deletionProtection) &&
                  self.spec.mandatory.deletionProtection == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.deletionProtection) &&
                  self.spec.defaults.deletionProtection == true)
              message: >-
                deletionProtection cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.backupRetentionPeriod) &&
                  self.spec.mandatory.backupRetentionPeriod != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.backupRetentionPeriod) &&
                  self.spec.defaults.backupRetentionPeriod != 0)
              message: >-
                backupRetentionPeriod cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.multiAZ) &&
                  self.spec.mandatory.multiAZ == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.multiAZ) &&
                  self.spec.defaults.multiAZ == true)
              message: >-
                multiAZ cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.publiclyAccessible) &&
                  self.spec.mandatory.publiclyAccessible == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.publiclyAccessible) &&
                  self.spec.defaults.publiclyAccessible == true)
              message: >-
                publiclyAccessible cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.storageType) &&
                  self.spec.mandatory.storageType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.storageType) &&
                  self.spec.defaults.storageType != "")
              message: >-
                storageType cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.autoMinorVersionUpgrade) &&
                  self.spec.mandatory.autoMinorVersionUpgrade == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.autoMinorVersionUpgrade) &&
                  self.spec.defaults.autoMinorVersionUpgrade == true)
              message: >-
                autoMinorVersionUpgrade cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.copyTagsToSnapshot) &&
                  self.spec.mandatory.copyTagsToSnapshot == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.copyTagsToSnapshot) &&
                  self.spec.defaults.copyTagsToSnapshot == true)
              message: >-
                copyTagsToSnapshot cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.performanceInsightsEnabled) &&
                  self.spec.mandatory.performanceInsightsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.performanceInsightsEnabled) &&
                  self.spec.defaults.performanceInsightsEnabled == true)
              message: >-
                performanceInsightsEnabled cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableIAMDatabaseAuthentication) &&
                  self.spec.mandatory.enableIAMDatabaseAuthentication == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableIAMDatabaseAuthentication) &&
                  self.spec.defaults.enableIAMDatabaseAuthentication == true)
              message: >-
                enableIAMDatabaseAuthentication cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.manageMasterUserPassword) &&
                  self.spec.mandatory.manageMasterUserPassword == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.manageMasterUserPassword) &&
                  self.spec.defaults.manageMasterUserPassword == true)
              message: >-
                manageMasterUserPassword cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults simultaneously.
            # Cluster-only fields — present in CRD but controller applies these only to RDSCluster.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.serverlessV2ScalingMinCapacity) &&
                  self.spec.mandatory.serverlessV2ScalingMinCapacity != 0.0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.serverlessV2ScalingMinCapacity) &&
                  self.spec.defaults.serverlessV2ScalingMinCapacity != 0.0)
              message: >-
                serverlessV2ScalingMinCapacity cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.serverlessV2ScalingMaxCapacity) &&
                  self.spec.mandatory.serverlessV2ScalingMaxCapacity != 0.0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.serverlessV2ScalingMaxCapacity) &&
                  self.spec.defaults.serverlessV2ScalingMaxCapacity != 0.0)
              message: >-
                serverlessV2ScalingMaxCapacity cannot be set in both mandatory and defaults simultaneously.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.backtrackWindow) &&
                  self.spec.mandatory.backtrackWindow != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.backtrackWindow) &&
                  self.spec.defaults.backtrackWindow != 0)
              message: >-
                backtrackWindow cannot be set in both mandatory and defaults simultaneously.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory RDS governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced at this tier.
                  properties:
                    storageEncrypted:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces encryption at rest on all RDS instances and clusters.
                        false = not enforced at this tier. Note: encryption is immutable after
                        resource creation — a change requires resource recreation.
                    kmsKeyID:
                      type: string
                      default: ""
                      description: >-
                        Mandatory KMS key ARN for customer-managed encryption.
                        Empty string = not enforced. Non-empty = org-wide CMK forced on all instances.
                    deletionProtection:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces deletion protection on all RDS instances and clusters.
                        false = not enforced at this tier. Production environments should set this true.
                    backupRetentionPeriod:
                      type: integer
                      default: 0
                      minimum: 0
                      maximum: 35
                      description: >-
                        Mandatory minimum backup retention days (0–35). 0 = not enforced.
                        When non-zero, applies minimum-floor semantics: max(mandatory, instance).
                        Instance may retain longer but cannot go below this floor.
                    multiAZ:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces Multi-AZ deployment on all RDS instances.
                        false = not enforced at this tier.
                    publiclyAccessible:
                      type: boolean
                      default: false
                      description: >-
                        Pointer field with special semantics. false = not enforced (nil pointer).
                        When explicitly set to false by platform team via mandatory tier,
                        all instances are forced private-only (cannot be made publicly accessible).
                        true = forced public access (rare; use with care).
                    storageType:
                      type: string
                      default: ""
                      description: >-
                        Mandatory storage type for all instances. Empty string = not enforced.
                        One of: "standard", "gp2", "gp3", "io1", "io2".
                    autoMinorVersionUpgrade:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces automatic minor version upgrades on all instances.
                        false = not enforced at this tier.
                    copyTagsToSnapshot:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces tag copy to snapshots on all instances and clusters.
                        false = not enforced at this tier.
                    performanceInsightsEnabled:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces Performance Insights on all instances.
                        false = not enforced at this tier.
                    enableIAMDatabaseAuthentication:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces IAM database authentication on all instances and clusters.
                        false = not enforced at this tier.
                    manageMasterUserPassword:
                      type: boolean
                      default: false
                      description: >-
                        When true, forces Secrets Manager-managed master password on all instances.
                        false = not enforced at this tier.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Mandatory naming template for RDS resource names.
                        Empty string = not enforced. Non-empty overrides all profile and instance defaults.
                    # Cluster-only fields — present in CRD for governance; controller applies
                    # these only to RDSCluster resources. RDSInstance reconciliation ignores them.
                    serverlessV2ScalingMinCapacity:
                      type: number
                      default: 0
                      minimum: 0
                      description: >-
                        Cluster-only. Mandatory minimum ACU floor for Aurora Serverless v2 clusters.
                        0 = not enforced. When non-zero, applied only to RDSCluster; RDSInstance ignores.
                    serverlessV2ScalingMaxCapacity:
                      type: number
                      default: 0
                      minimum: 0
                      description: >-
                        Cluster-only. Mandatory maximum ACU cap for Aurora Serverless v2 clusters.
                        0 = not enforced. When non-zero, applied only to RDSCluster; RDSInstance ignores.
                    backtrackWindow:
                      type: integer
                      default: 0
                      minimum: 0
                      description: >-
                        Cluster-only. Mandatory backtrack window in seconds for Aurora MySQL clusters.
                        0 = not enforced. When non-zero, applied only to RDSCluster (Aurora MySQL only).
                    tags:
                      type: object
                      default: {}
                      description: >-
                        RDS-specific mandatory cloud tags applied to all resources under this profile.
                        Merged additively with KropathConfig.mandatory.tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default RDS governance fields. Applied when no higher-priority source provides
                    a value. Zero-value means no default from this level.
                  properties:
                    storageEncrypted:
                      type: boolean
                      default: true
                      description: >-
                        Default encryption-at-rest setting. true = encrypted by default (secure default);
                        instance can override. Note: encryption is immutable after resource creation.
                    kmsKeyID:
                      type: string
                      default: ""
                      description: >-
                        Default KMS key ARN. Empty string = AWS-managed RDS encryption key.
                        Non-empty = default CMK; instance can override.
                    deletionProtection:
                      type: boolean
                      default: true
                      description: >-
                        Default deletion protection. true = deletion protection on by default (safe default);
                        instance can override.
                    backupRetentionPeriod:
                      type: integer
                      default: 7
                      minimum: 0
                      maximum: 35
                      description: >-
                        Default backup retention days (0–35). 7 = 7-day retention by default.
                        Instance can override. Minimum-floor semantics apply when mandatory is also set.
                    multiAZ:
                      type: boolean
                      default: false
                      description: >-
                        Default Multi-AZ setting. false = single-AZ by default (cost-conscious default);
                        instance can override.
                    publiclyAccessible:
                      type: boolean
                      default: false
                      description: >-
                        Default accessibility setting. false = private-only by default (secure default);
                        instance can override.
                    storageType:
                      type: string
                      default: "gp3"
                      description: >-
                        Default storage type. "gp3" = current-generation default; instance can override.
                        One of: "standard", "gp2", "gp3", "io1", "io2".
                    autoMinorVersionUpgrade:
                      type: boolean
                      default: true
                      description: >-
                        Default auto minor version upgrade. true = auto-upgrade by default; instance can override.
                    copyTagsToSnapshot:
                      type: boolean
                      default: true
                      description: >-
                        Default tag copy to snapshots. true = copy tags by default; instance can override.
                    performanceInsightsEnabled:
                      type: boolean
                      default: false
                      description: >-
                        Default Performance Insights setting. false = PI off by default (cost-conscious);
                        instance can override.
                    enableIAMDatabaseAuthentication:
                      type: boolean
                      default: false
                      description: >-
                        Default IAM database authentication. false = IAM auth off by default;
                        instance can override.
                    manageMasterUserPassword:
                      type: boolean
                      default: false
                      description: >-
                        Default master password management. false = manual password by default;
                        instance can override.
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: >-
                        Default naming template for RDS resource names.
                        "{namespace}-{name}" = standard naming pattern.
                    # Cluster-only fields — present in CRD; controller applies only to RDSCluster.
                    serverlessV2ScalingMinCapacity:
                      type: number
                      default: 0
                      minimum: 0
                      description: >-
                        Cluster-only. Default minimum ACUs for Aurora Serverless v2 clusters.
                        0 = no default. Instance can override.
                    serverlessV2ScalingMaxCapacity:
                      type: number
                      default: 0
                      minimum: 0
                      description: >-
                        Cluster-only. Default maximum ACUs for Aurora Serverless v2 clusters.
                        0 = no default. Instance can override.
                    backtrackWindow:
                      type: integer
                      default: 0
                      minimum: 0
                      description: >-
                        Cluster-only. Default backtrack window in seconds for Aurora MySQL clusters.
                        0 = no default (backtrack disabled by default).
                    tags:
                      type: object
                      default: {}
                      description: >-
                        RDS-specific baseline cloud tags. Overridable per-instance.
                        Merged additively with KropathConfig.defaults.tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        storageEncrypted:
                          type: boolean
                        kmsKeyID:
                          type: string
                        deletionProtection:
                          type: boolean
                        backupRetentionPeriod:
                          type: integer
                        multiAZ:
                          type: boolean
                        publiclyAccessible:
                          type: boolean
                        storageType:
                          type: string
                        autoMinorVersionUpgrade:
                          type: boolean
                        copyTagsToSnapshot:
                          type: boolean
                        performanceInsightsEnabled:
                          type: boolean
                        enableIAMDatabaseAuthentication:
                          type: boolean
                        manageMasterUserPassword:
                          type: boolean
                        namingTemplate:
                          type: string
                        serverlessV2ScalingMinCapacity:
                          type: number
                        serverlessV2ScalingMaxCapacity:
                          type: number
                        backtrackWindow:
                          type: integer
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        storageEncrypted:
                          type: boolean
                        kmsKeyID:
                          type: string
                        deletionProtection:
                          type: boolean
                        backupRetentionPeriod:
                          type: integer
                        multiAZ:
                          type: boolean
                        publiclyAccessible:
                          type: boolean
                        storageType:
                          type: string
                        autoMinorVersionUpgrade:
                          type: boolean
                        copyTagsToSnapshot:
                          type: boolean
                        performanceInsightsEnabled:
                          type: boolean
                        enableIAMDatabaseAuthentication:
                          type: boolean
                        manageMasterUserPassword:
                          type: boolean
                        namingTemplate:
                          type: string
                        serverlessV2ScalingMinCapacity:
                          type: number
                        serverlessV2ScalingMaxCapacity:
                          type: number
                        backtrackWindow:
                          type: integer
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
