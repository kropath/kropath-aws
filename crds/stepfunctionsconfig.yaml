---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stepfunctionsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: StepFunctionsConfig
    listKind: StepFunctionsConfigList
    plural: stepfunctionsconfigs
    singular: stepfunctionsconfig
    shortNames:
      - sfncfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.loggingLevel) &&
                  self.spec.mandatory.loggingLevel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.loggingLevel) &&
                  self.spec.defaults.loggingLevel != "")
              message: >-
                loggingLevel must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tracingEnabled) &&
                  has(self.spec.defaults) && has(self.spec.defaults.tracingEnabled))
              message: >-
                tracingEnabled must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.includeExecutionData) &&
                  has(self.spec.defaults) && has(self.spec.defaults.includeExecutionData))
              message: >-
                includeExecutionData must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Step Functions governance fields. Zero-value (empty string,
                    absent boolean, empty map) means the field is not enforced at this tier.
                  properties:
                    loggingLevel:
                      type: string
                      default: ""
                      description: >-
                        Empty string = not enforced. Valid values: ALL, ERROR, FATAL, OFF.
                        When set, this value overrides any instance or defaults setting.
                    tracingEnabled:
                      type: boolean
                      nullable: true
                      description: >-
                        Absent (null) = not enforced. true/false = enforced X-Ray tracing
                        state for all state machines in scope. Uses has() for mutual-exclusivity
                        check — explicitly setting false is distinct from omitting.
                    includeExecutionData:
                      type: boolean
                      nullable: true
                      description: >-
                        Absent (null) = not enforced. true/false = enforced execution data
                        inclusion policy. When true, execution input/output appear in
                        CloudWatch Logs (increases log volume; may expose sensitive data).
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Empty string = not enforced. When set, enforces naming pattern for
                        all Step Functions resources in scope. Tokens: {name}, {namespace},
                        {region}, {account_id}, {configRef}, {tag.<key>}.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Step Functions-specific mandatory cloud tags. Additive with defaults
                        tier; merged into effectiveConfig by kropath-controller.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        ADR-015 §6.1: labels synced to both K8s metadata.labels and cloud
                        tags. Additive with defaults tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to K8s metadata.annotations. Additive with
                        defaults tier.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Step Functions governance fields. Zero-value means no default
                    is provided at this tier; instance can override.
                  properties:
                    loggingLevel:
                      type: string
                      default: ""
                      description: >-
                        Default logging level applied when no mandatory or instance value
                        is set. Valid values: ALL, ERROR, FATAL, OFF. Empty string = no
                        default at this tier.
                    tracingEnabled:
                      type: boolean
                      nullable: true
                      description: >-
                        Default X-Ray tracing state. Absent (null) = no default at this
                        tier; instance can override. Uses has() for mutual-exclusivity check.
                    includeExecutionData:
                      type: boolean
                      nullable: true
                      description: >-
                        Default execution data inclusion policy. Absent (null) = no default
                        at this tier; instance can override.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Default naming template applied when no mandatory or nameOverride is
                        set. Default general-policy value: {namespace}-{name}. Empty string =
                        no default at this tier.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Default cloud tags. Additive with mandatory tier; overridable per
                        instance.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default synced labels. Additive with mandatory tier.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Default synced annotations. Additive with mandatory tier.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        loggingLevel:
                          type: string
                        tracingEnabled:
                          type: boolean
                          nullable: true
                        includeExecutionData:
                          type: boolean
                          nullable: true
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        loggingLevel:
                          type: string
                        tracingEnabled:
                          type: boolean
                          nullable: true
                        includeExecutionData:
                          type: boolean
                          nullable: true
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
