---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudwatchconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: CloudWatchConfig
    listKind: CloudWatchConfigList
    plural: cloudwatchconfigs
    singular: cloudwatchconfig
    shortNames:
      - cwcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory.actionsEnabled) &&
                  has(self.spec.defaults.actionsEnabled))
              message: "actionsEnabled must be set in either mandatory or defaults, not both."
            - rule: >-
                !(self.spec.mandatory.treatMissingData != '' &&
                  self.spec.defaults.treatMissingData != '')
              message: "treatMissingData must be set in either mandatory or defaults, not both."
            - rule: >-
                !(self.spec.mandatory.outputFormat != '' &&
                  self.spec.defaults.outputFormat != '')
              message: "outputFormat must be set in either mandatory or defaults, not both."
            - rule: >-
                !(self.spec.mandatory.namingTemplate != '' &&
                  self.spec.defaults.namingTemplate != '')
              message: "namingTemplate must be set in either mandatory or defaults, not both."
            - rule: >-
                self.spec.mandatory.treatMissingData == '' ||
                self.spec.mandatory.treatMissingData in ['breaching', 'notBreaching', 'ignore', 'missing']
              message: "mandatory.treatMissingData must be empty or one of: breaching, notBreaching, ignore, missing."
            - rule: >-
                self.spec.defaults.treatMissingData == '' ||
                self.spec.defaults.treatMissingData in ['breaching', 'notBreaching', 'ignore', 'missing']
              message: "defaults.treatMissingData must be empty or one of: breaching, notBreaching, ignore, missing."
            - rule: >-
                self.spec.mandatory.outputFormat == '' ||
                self.spec.mandatory.outputFormat in ['json', 'opentelemetry1.0', 'opentelemetry0.7']
              message: "mandatory.outputFormat must be empty or one of: json, opentelemetry1.0, opentelemetry0.7."
            - rule: >-
                self.spec.defaults.outputFormat == '' ||
                self.spec.defaults.outputFormat in ['json', 'opentelemetry1.0', 'opentelemetry0.7']
              message: "defaults.outputFormat must be empty or one of: json, opentelemetry1.0, opentelemetry0.7."
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory CloudWatch governance fields. Non-empty values enforce governance
                    constraints regardless of instance spec or defaults.
                    For actionsEnabled: absent = not enforced; true/false = forced.
                    For string fields: empty string = not enforced.
                  properties:
                    actionsEnabled:
                      type: boolean
                      description: >-
                        Forces alarm actions enabled/disabled for all alarms in scope.
                        Absent = not enforced; true/false = forced. Nil ≠ false.
                        Cannot be set in both mandatory and defaults tiers.
                    treatMissingData:
                      type: string
                      default: ""
                      description: >-
                        Forces missing data treatment for all alarms. Empty string = not enforced.
                        Allowed values: "", breaching, notBreaching, ignore, missing.
                        Cannot be set in both mandatory and defaults tiers.
                    outputFormat:
                      type: string
                      default: ""
                      description: >-
                        Forces output format for all metric streams. Empty string = not enforced.
                        Allowed values: "", json, opentelemetry1.0, opentelemetry0.7.
                        Cannot be set in both mandatory and defaults tiers.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Forces naming pattern; spec.nameOverride is the only escape hatch.
                        Empty string = not enforced.
                        Token vocabulary: {name}, {namespace}, {account_id}, {region}, {configRef}, {tag.<key>}.
                        Cannot be set in both mandatory and defaults tiers.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        CloudWatch-specific mandatory cloud tags applied to all CloudWatchAlarm
                        and CloudWatchMetricStream resources under this profile.
                        Uses additive merge semantics with KropathConfig.mandatory.tags.
                        Not applied to CloudWatchDashboard (no cloud tag support in ACK).
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags for CloudWatchAlarm and CloudWatchMetricStream
                        (ADR-015 section 6.1). Not synced to Dashboard cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix)
                        for all CloudWatch resource types.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default CloudWatch governance fields. Applied when no higher-priority
                    source provides a value. Zero-value means no default from this level.
                  properties:
                    actionsEnabled:
                      type: boolean
                      description: >-
                        Default alarm actions enablement. Absent = not defaulted at this tier;
                        RGD built-in true applies. Nil ≠ false.
                        Cannot be set in both mandatory and defaults tiers.
                    treatMissingData:
                      type: string
                      default: "missing"
                      description: >-
                        Default missing data treatment for alarms. AWS default: alarm state
                        unchanged on missing data. Empty string = not set at this tier.
                        Allowed values: "", breaching, notBreaching, ignore, missing.
                        Cannot be set in both mandatory and defaults tiers.
                    outputFormat:
                      type: string
                      default: "json"
                      description: >-
                        Default output format for metric streams. JSON output by default.
                        Empty string = not set at this tier.
                        Allowed values: "", json, opentelemetry1.0, opentelemetry0.7.
                        Cannot be set in both mandatory and defaults tiers.
                    namingTemplate:
                      type: string
                      default: "{namespace}-{name}"
                      description: >-
                        Default naming template for CloudWatch resource names.
                        CloudWatch alarm and metric stream names are account+region scoped.
                        Token vocabulary: {name}, {namespace}, {account_id}, {region}, {configRef}, {tag.<key>}.
                        Cannot be set in both mandatory and defaults tiers.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Default cloud resource tags applied to CloudWatchAlarm and
                        CloudWatchMetricStream resources. Overridable per-instance.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to child resources and cloud tags.
                        Overridable per-instance.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Default annotations synced to child resources. Overridable per-instance.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                    Combines KropathConfig.cloudwatch.* and CloudWatchConfig spec tiers.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        actionsEnabled:
                          type: boolean
                        treatMissingData:
                          type: string
                        outputFormat:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        actionsEnabled:
                          type: boolean
                        treatMissingData:
                          type: string
                        outputFormat:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
