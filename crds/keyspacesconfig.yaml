---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keyspacesconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: KeyspacesConfig
    listKind: KeyspacesConfigList
    plural: keyspacesconfigs
    singular: keyspacesconfig
    shortNames:
      - kscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory.replicationStrategy) && self.spec.mandatory.replicationStrategy != ''
                  && has(self.spec.defaults.replicationStrategy) && self.spec.defaults.replicationStrategy != '')
              message: "replicationStrategy cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.throughputMode) && self.spec.mandatory.throughputMode != ''
                  && has(self.spec.defaults.throughputMode) && self.spec.defaults.throughputMode != '')
              message: "throughputMode cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.encryptionType) && self.spec.mandatory.encryptionType != ''
                  && has(self.spec.defaults.encryptionType) && self.spec.defaults.encryptionType != '')
              message: "encryptionType cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.pointInTimeRecovery) && self.spec.mandatory.pointInTimeRecovery == true
                  && has(self.spec.defaults.pointInTimeRecovery) && self.spec.defaults.pointInTimeRecovery == true)
              message: "pointInTimeRecovery cannot be set to true in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.ttlEnabled) && self.spec.mandatory.ttlEnabled == true
                  && has(self.spec.defaults.ttlEnabled) && self.spec.defaults.ttlEnabled == true)
              message: "ttlEnabled cannot be set to true in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory.namingTemplate) && self.spec.mandatory.namingTemplate != ''
                  && has(self.spec.defaults.namingTemplate) && self.spec.defaults.namingTemplate != '')
              message: "namingTemplate cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Keyspaces governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced at this tier.
                  properties:
                    replicationStrategy:
                      type: string
                      description: >-
                        Mandatory replication strategy. Empty string = not enforced.
                        One of: "SINGLE_REGION", "MULTI_REGION".
                    throughputMode:
                      type: string
                      description: >-
                        Mandatory throughput capacity mode. Empty string = not enforced.
                        One of: "PAY_PER_REQUEST", "PROVISIONED".
                    encryptionType:
                      type: string
                      description: >-
                        Mandatory encryption type. Empty string = not enforced.
                        One of: "AWS_OWNED_KMS_KEY", "CUSTOMER_MANAGED_KMS_KEY".
                    pointInTimeRecovery:
                      type: boolean
                      description: >-
                        When true, forces point-in-time recovery on all Keyspaces resources.
                        false = not enforced at this tier (zero-value sentinel).
                    ttlEnabled:
                      type: boolean
                      description: >-
                        When true, forces TTL enabled on all Keyspaces tables.
                        false = not enforced at this tier (zero-value sentinel).
                    namingTemplate:
                      type: string
                      description: >-
                        Mandatory naming template for Keyspaces resource names.
                        Empty string = no mandatory template.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Keyspaces-specific mandatory cloud tags applied to all resources under this profile.
                        Merged additively with KropathConfig.mandatory.tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Keyspaces governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this level.
                  properties:
                    replicationStrategy:
                      type: string
                      description: >-
                        Default replication strategy. Empty string = no default from this profile.
                        One of: "SINGLE_REGION", "MULTI_REGION".
                    throughputMode:
                      type: string
                      description: >-
                        Default throughput capacity mode. Empty string = no default from this profile.
                        One of: "PAY_PER_REQUEST", "PROVISIONED".
                    encryptionType:
                      type: string
                      description: >-
                        Default encryption type. Empty string = no default from this profile.
                        One of: "AWS_OWNED_KMS_KEY", "CUSTOMER_MANAGED_KMS_KEY".
                    pointInTimeRecovery:
                      type: boolean
                      description: >-
                        Default PITR setting. false = PITR disabled by default (cost consideration).
                    ttlEnabled:
                      type: boolean
                      description: >-
                        Default TTL setting. false = TTL disabled by default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template for Keyspaces resource names.
                        Keyspaces identifiers allow only alphanumeric and underscores;
                        default template uses underscores not hyphens.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Keyspaces-specific baseline cloud tags. Overridable per-instance.
                        Merged additively with KropathConfig.defaults.tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        replicationStrategy:
                          type: string
                        throughputMode:
                          type: string
                        encryptionType:
                          type: string
                        pointInTimeRecovery:
                          type: boolean
                        ttlEnabled:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        replicationStrategy:
                          type: string
                        throughputMode:
                          type: string
                        encryptionType:
                          type: string
                        pointInTimeRecovery:
                          type: boolean
                        ttlEnabled:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
