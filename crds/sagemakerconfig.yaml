---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sagemakerconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: SageMakerConfig
    listKind: SageMakerConfigList
    plural: sagemakerconfigs
    singular: sagemakerconfig
    shortNames:
      - sagecfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: InstanceType
          type: string
          jsonPath: ".status.effectiveConfig.mandatory.instanceType"
        - name: NetworkIsolation
          type: boolean
          jsonPath: ".status.effectiveConfig.mandatory.enableNetworkIsolation"
        - name: Synced
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # Scalar fields may not be set in both mandatory and defaults simultaneously (ADR-015 §4.2).
            # Map fields (tags, syncedLabels, syncedAnnotations) are exempt — both tiers are merged.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.instanceType) &&
                  self.spec.mandatory.instanceType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.instanceType) &&
                  self.spec.defaults.instanceType != "")
              message: >-
                instanceType must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.volumeSizeInGB) &&
                  self.spec.mandatory.volumeSizeInGB > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.volumeSizeInGB) &&
                  self.spec.defaults.volumeSizeInGB > 0)
              message: >-
                volumeSizeInGB must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyId) &&
                  self.spec.mandatory.kmsKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyId) &&
                  self.spec.defaults.kmsKeyId != "")
              message: >-
                kmsKeyId must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableNetworkIsolation) &&
                  self.spec.mandatory.enableNetworkIsolation == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableNetworkIsolation) &&
                  self.spec.defaults.enableNetworkIsolation == true)
              message: >-
                enableNetworkIsolation must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableInterContainerTrafficEncryption) &&
                  self.spec.mandatory.enableInterContainerTrafficEncryption == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableInterContainerTrafficEncryption) &&
                  self.spec.defaults.enableInterContainerTrafficEncryption == true)
              message: >-
                enableInterContainerTrafficEncryption must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rootAccess) &&
                  self.spec.mandatory.rootAccess != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.rootAccess) &&
                  self.spec.defaults.rootAccess != "")
              message: >-
                rootAccess must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.directInternetAccess) &&
                  self.spec.mandatory.directInternetAccess != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.directInternetAccess) &&
                  self.spec.defaults.directInternetAccess != "")
              message: >-
                directInternetAccess must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory SageMaker governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value = not enforced.
                  properties:
                    instanceType:
                      type: string
                      description: >-
                        Forces this SageMaker instance type; instance spec cannot override when set.
                        Empty = not enforced.
                    volumeSizeInGB:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Hard ceiling on storage volume size in GB. RGD CEL clamps instance value to
                        this when set. 0 = not enforced.
                    kmsKeyId:
                      type: string
                      description: >-
                        Forces this KMS key ID for all SageMaker storage encryption. Instance cannot
                        override when set. Empty = not enforced.
                    enableNetworkIsolation:
                      type: boolean
                      description: >-
                        Forces network isolation for all SageMaker resources. Instance cannot
                        override when true. false = not enforced (zero-value sentinel).
                    enableInterContainerTrafficEncryption:
                      type: boolean
                      description: >-
                        Forces inter-container traffic encryption for distributed training.
                        Instance cannot override when true. false = not enforced (zero-value sentinel).
                    rootAccess:
                      type: string
                      description: >-
                        Forces root access setting for notebooks ("Enabled" | "Disabled").
                        Instance cannot override when set. Empty = not enforced.
                    directInternetAccess:
                      type: string
                      description: >-
                        Forces direct internet access for notebook instances ("Enabled" | "Disabled").
                        Instance cannot override when set. Empty = not enforced.
                    namingTemplate:
                      type: string
                      description: >-
                        Naming template for cloud resource names ({namespace}, {name}, etc.).
                        Instance cannot override when set. Empty = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Cloud resource tags merged into all SageMaker resources under this profile
                        (mandatory tier). Instance spec tags are preserved; these are added unconditionally.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and cloud
                        resource tags on every SageMaker child resource (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix) on
                        every SageMaker child resource.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default SageMaker governance fields. Applied when no higher-priority source
                    provides a value. Zero-value = no default from this level.
                  properties:
                    instanceType:
                      type: string
                      description: >-
                        Default SageMaker instance type. Applied when the instance spec does not
                        specify an instance type. Empty = no default.
                    volumeSizeInGB:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default storage volume size in GB. Applied when the instance spec does not
                        specify a volume size. 0 = no default.
                    kmsKeyId:
                      type: string
                      description: >-
                        Default KMS key ID for SageMaker storage encryption. Applied when neither
                        mandatory nor instance spec sets a KMS key. Empty = use AWS-managed key.
                    enableNetworkIsolation:
                      type: boolean
                      description: >-
                        Default network isolation setting. Applied when the instance spec does not
                        specify this field. false = no default (zero-value sentinel).
                    enableInterContainerTrafficEncryption:
                      type: boolean
                      description: >-
                        Default inter-container traffic encryption. Applied when the instance spec
                        does not specify this field. false = no default (zero-value sentinel).
                    rootAccess:
                      type: string
                      description: >-
                        Default root access setting for notebooks ("Enabled" | "Disabled").
                        Applied when the instance spec does not specify. Empty = no default.
                    directInternetAccess:
                      type: string
                      description: >-
                        Default direct internet access for notebook instances ("Enabled" | "Disabled").
                        Applied when the instance spec does not specify. Empty = no default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Uses {namespace}, {name}, etc. placeholders.
                        Empty = no default naming template.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags merged into all SageMaker resources.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to SageMaker child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to SageMaker child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of last effectiveConfig write by the controller.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. SageMaker RGDs read
                    exclusively from this field via a single resources.get() call (ADR-010).
                  properties:
                    mandatory:
                      type: object
                      description: Merged mandatory governance fields (levels 1–4 of cascade).
                      properties:
                        instanceType:
                          type: string
                        volumeSizeInGB:
                          type: integer
                          format: int64
                        kmsKeyId:
                          type: string
                        enableNetworkIsolation:
                          type: boolean
                        enableInterContainerTrafficEncryption:
                          type: boolean
                        rootAccess:
                          type: string
                        directInternetAccess:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      description: Merged defaults governance fields (levels 6–9 of cascade).
                      properties:
                        instanceType:
                          type: string
                        volumeSizeInGB:
                          type: integer
                          format: int64
                        kmsKeyId:
                          type: string
                        enableNetworkIsolation:
                          type: boolean
                        enableInterContainerTrafficEncryption:
                          type: boolean
                        rootAccess:
                          type: string
                        directInternetAccess:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      description: Provider identity copied from KropathConfig.aws.
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
