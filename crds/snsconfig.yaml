---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: snsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: SNSConfig
    listKind: SNSConfigList
    plural: snsconfigs
    singular: snsconfig
    shortNames:
      - snscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsMasterKeyId) &&
                  self.spec.mandatory.kmsMasterKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsMasterKeyId) &&
                  self.spec.defaults.kmsMasterKeyId != "")
              message: >-
                kmsMasterKeyId cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.signatureVersion) &&
                  self.spec.mandatory.signatureVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.signatureVersion) &&
                  self.spec.defaults.signatureVersion != "")
              message: >-
                signatureVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tracingConfig) &&
                  self.spec.mandatory.tracingConfig != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.tracingConfig) &&
                  self.spec.defaults.tracingConfig != "")
              message: >-
                tracingConfig cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.dataProtectionPolicy) &&
                  self.spec.mandatory.dataProtectionPolicy != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.dataProtectionPolicy) &&
                  self.spec.defaults.dataProtectionPolicy != "")
              message: >-
                dataProtectionPolicy cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory SNS governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced.
                  properties:
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: >-
                        Required KMS key ID, ARN, or alias for SSE-KMS encryption.
                        Empty string = not enforced.
                    signatureVersion:
                      type: string
                      default: ""
                      description: >-
                        Required message signing version. Empty string = not enforced.
                        One of: "1" (SHA-1), "2" (SHA-256).
                    tracingConfig:
                      type: string
                      default: ""
                      description: >-
                        Required X-Ray tracing mode. Empty string = not enforced.
                        One of: "PassThrough", "Active".
                    dataProtectionPolicy:
                      type: string
                      default: ""
                      description: >-
                        Required JSON data protection policy. Empty string = not enforced.
                    deliveryFeedback:
                      type: object
                      default: {}
                      description: >-
                        Mandatory delivery feedback logging governance per protocol.
                        Uses per-key merge semantics — no mutual-exclusivity rule needed.
                      properties:
                        application:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                              description: IAM role ARN for successful delivery feedback logging.
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                              description: IAM role ARN for failed delivery feedback logging.
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                              description: Sample rate percentage (0-100) as string. Empty = not enforced.
                        http:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        lambda:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        sqs:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        firehose:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Mandatory naming template for SNS topic names.
                        Empty string = no mandatory template.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        SNS-specific mandatory cloud tags applied to all topics under this profile.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default SNS governance fields. Applied when no higher-priority source
                    provides a value. Zero-value means no default from this level.
                  properties:
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: >-
                        Default KMS key ID, ARN, or alias. "alias/aws/sns" = AWS-managed SNS key
                        (encryption-by-default). Empty string = not set at this tier.
                    signatureVersion:
                      type: string
                      default: ""
                      description: >-
                        Default message signing version. Empty string = not set at this tier.
                        One of: "1" (SHA-1), "2" (SHA-256).
                    tracingConfig:
                      type: string
                      default: ""
                      description: >-
                        Default X-Ray tracing mode. Empty string = not set at this tier.
                        One of: "PassThrough", "Active".
                    dataProtectionPolicy:
                      type: string
                      default: ""
                      description: >-
                        Default JSON data protection policy. Empty string = no default policy.
                    deliveryFeedback:
                      type: object
                      default: {}
                      description: >-
                        Default delivery feedback logging per protocol.
                        Per-key merge semantics apply.
                      properties:
                        application:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        http:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        lambda:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        sqs:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        firehose:
                          type: object
                          default: {}
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Default naming template for SNS topic names.
                        Empty string = not set at this tier.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        kmsMasterKeyId:
                          type: string
                        signatureVersion:
                          type: string
                        tracingConfig:
                          type: string
                        dataProtectionPolicy:
                          type: string
                        deliveryFeedback:
                          type: object
                          properties:
                            application:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            http:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            lambda:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            sqs:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            firehose:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        kmsMasterKeyId:
                          type: string
                        signatureVersion:
                          type: string
                        tracingConfig:
                          type: string
                        dataProtectionPolicy:
                          type: string
                        deliveryFeedback:
                          type: object
                          properties:
                            application:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            http:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            lambda:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            sqs:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            firehose:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
