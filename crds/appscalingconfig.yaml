---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appscalingconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: AppScalingConfig
    listKind: AppScalingConfigList
    plural: appscalingconfigs
    singular: appscalingconfig
    shortNames:
      - apscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.minCapacity) &&
                  self.spec.mandatory.minCapacity > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.minCapacity) &&
                  self.spec.defaults.minCapacity > 0)
              message: "minCapacity cannot be set (non-zero) in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maxCapacity) &&
                  self.spec.mandatory.maxCapacity > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maxCapacity) &&
                  self.spec.defaults.maxCapacity > 0)
              message: "maxCapacity cannot be set (non-zero) in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.disableScaleIn) &&
                  self.spec.mandatory.disableScaleIn == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.disableScaleIn) &&
                  self.spec.defaults.disableScaleIn == true)
              message: "disableScaleIn cannot be set to true in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.scaleInCooldown) &&
                  self.spec.mandatory.scaleInCooldown > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.scaleInCooldown) &&
                  self.spec.defaults.scaleInCooldown > 0)
              message: "scaleInCooldown cannot be set (non-zero) in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.scaleOutCooldown) &&
                  self.spec.mandatory.scaleOutCooldown > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.scaleOutCooldown) &&
                  self.spec.defaults.scaleOutCooldown > 0)
              message: "scaleOutCooldown cannot be set (non-zero) in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Application Auto Scaling governance fields. Non-zero/true values
                    enforce governance constraints regardless of instance spec or defaults.
                    Zero / false means the field is not enforced.
                  properties:
                    minCapacity:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Forces a minimum capacity floor on all scaling targets in this profile.
                        0 = not enforced; >0 forces minimum capacity.
                    maxCapacity:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Forces a maximum capacity ceiling on all scaling targets in this profile.
                        0 = not enforced; >0 forces maximum capacity.
                    disableScaleIn:
                      type: boolean
                      description: >-
                        When true, scale-in is disabled across all scaling policies in this
                        profile. false = not enforced.
                    scaleInCooldown:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Forces a minimum scale-in cooldown (seconds) on all target-tracking
                        policies in this profile. 0 = not enforced; >0 forces minimum cooldown.
                    scaleOutCooldown:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Forces a minimum scale-out cooldown (seconds) on all target-tracking
                        policies in this profile. 0 = not enforced; >0 forces minimum cooldown.
                    tags:
                      type: object
                      default: {}
                      description: Cloud resource tags merged into all scaling resources under this profile.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud tags (ADR-015 §6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Application Auto Scaling governance fields. Applied when no
                    higher-priority source provides a value. Zero / false means no default
                    enforcement from this level.
                  properties:
                    minCapacity:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default minimum capacity. Applies when instance spec.minCapacity would
                        otherwise have no governance. Zero is valid (scale-to-zero).
                    maxCapacity:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default maximum capacity ceiling. Applies when instance spec.maxCapacity
                        would otherwise have no governance.
                    disableScaleIn:
                      type: boolean
                      description: >-
                        Default scale-in disable setting. Applies when instance does not explicitly
                        set disableScaleIn.
                    scaleInCooldown:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default scale-in cooldown in seconds. Applies when instance
                        spec.targetTracking.scaleInCooldown is not set.
                    scaleOutCooldown:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Default scale-out cooldown in seconds. Applies when instance
                        spec.targetTracking.scaleOutCooldown is not set.
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags applied to all scaling resources.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        minCapacity:
                          type: integer
                          format: int64
                        maxCapacity:
                          type: integer
                          format: int64
                        disableScaleIn:
                          type: boolean
                        scaleInCooldown:
                          type: integer
                          format: int64
                        scaleOutCooldown:
                          type: integer
                          format: int64
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        minCapacity:
                          type: integer
                          format: int64
                        maxCapacity:
                          type: integer
                          format: int64
                        disableScaleIn:
                          type: boolean
                        scaleInCooldown:
                          type: integer
                          format: int64
                        scaleOutCooldown:
                          type: integer
                          format: int64
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
