---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mqconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: MQConfig
    listKind: MQConfigList
    plural: mqconfigs
    singular: mqconfig
    shortNames:
      - mqcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engineType) &&
                  self.spec.mandatory.engineType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engineType) &&
                  self.spec.defaults.engineType != "")
              message: >-
                engineType must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.authenticationStrategy) &&
                  self.spec.mandatory.authenticationStrategy != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.authenticationStrategy) &&
                  self.spec.defaults.authenticationStrategy != "")
              message: >-
                authenticationStrategy must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.deploymentMode) &&
                  self.spec.mandatory.deploymentMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.deploymentMode) &&
                  self.spec.defaults.deploymentMode != "")
              message: >-
                deploymentMode must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.hostInstanceType) &&
                  self.spec.mandatory.hostInstanceType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.hostInstanceType) &&
                  self.spec.defaults.hostInstanceType != "")
              message: >-
                hostInstanceType must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.publiclyAccessible) &&
                  has(self.spec.defaults) && has(self.spec.defaults.publiclyAccessible))
              message: >-
                publiclyAccessible must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.autoMinorVersionUpgrade) &&
                  has(self.spec.defaults) && has(self.spec.defaults.autoMinorVersionUpgrade))
              message: >-
                autoMinorVersionUpgrade must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.logsGeneral) &&
                  has(self.spec.defaults) && has(self.spec.defaults.logsGeneral))
              message: >-
                logsGeneral must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.logsAudit) &&
                  has(self.spec.defaults) && has(self.spec.defaults.logsAudit))
              message: >-
                logsAudit must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionUseAWSOwnedKey) &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionUseAWSOwnedKey))
              message: >-
                encryptionUseAWSOwnedKey must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.storageType) &&
                  self.spec.mandatory.storageType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.storageType) &&
                  self.spec.defaults.storageType != "")
              message: >-
                storageType must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory MQ governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value (empty
                    string / absent boolean) means the field is not enforced.
                  properties:
                    engineType:
                      type: string
                      description: >-
                        Required broker engine type for all brokers in scope.
                        Empty string = not enforced. One of: "ACTIVEMQ", "RABBITMQ".
                    authenticationStrategy:
                      type: string
                      description: >-
                        Required authentication strategy. Empty string = not enforced.
                        One of: "SIMPLE", "LDAP" (ActiveMQ only).
                    deploymentMode:
                      type: string
                      description: >-
                        Required broker deployment mode. Empty string = not enforced.
                        One of: "SINGLE_INSTANCE", "ACTIVE_STANDBY_MULTI_AZ", "CLUSTER_MULTI_AZ".
                    hostInstanceType:
                      type: string
                      description: >-
                        Required broker EC2 instance type (e.g. mq.m5.large).
                        Empty string = not enforced.
                    publiclyAccessible:
                      type: boolean
                      description: >-
                        When set, forces public accessibility for all brokers.
                        Absent (nil) = not enforced. Immutable after broker creation.
                    autoMinorVersionUpgrade:
                      type: boolean
                      description: >-
                        When set, forces auto minor version upgrade policy.
                        Absent (nil) = not enforced.
                    logsGeneral:
                      type: boolean
                      description: >-
                        When set, forces general CloudWatch logging.
                        Absent (nil) = not enforced.
                    logsAudit:
                      type: boolean
                      description: >-
                        When set, forces audit CloudWatch logging (ActiveMQ only).
                        Absent (nil) = not enforced.
                    encryptionUseAWSOwnedKey:
                      type: boolean
                      description: >-
                        When set, forces encryption key type. false = mandate customer-managed
                        KMS key; true = allow AWS-owned key. Absent (nil) = not enforced.
                    storageType:
                      type: string
                      description: >-
                        Required storage type (ActiveMQ only). Empty string = not enforced.
                        One of: "efs", "io1".
                    namingTemplate:
                      type: string
                      description: >-
                        Mandatory naming template for MQ broker names.
                        Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        MQ-specific mandatory cloud tags applied to all brokers under this
                        profile. Merged with KropathConfig mandatory tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Labels synced to both metadata.labels (aws.kropath.run/ prefix) and
                        cloud resource tags (ADR-015 section 6.1).
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Annotations synced to metadata.annotations (aws.kropath.run/ prefix).
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default MQ governance fields. Applied when no higher-priority source
                    provides a value. Zero-value (empty string / absent boolean) means no
                    default from this level.
                  properties:
                    engineType:
                      type: string
                      description: >-
                        Default broker engine type. Empty string = not set at this tier.
                    authenticationStrategy:
                      type: string
                      description: >-
                        Default authentication strategy. Empty string = not set at this tier.
                    deploymentMode:
                      type: string
                      description: >-
                        Default broker deployment mode. Empty string = not set at this tier.
                    hostInstanceType:
                      type: string
                      description: >-
                        Default broker EC2 instance type. Empty string = not set at this tier.
                    publiclyAccessible:
                      type: boolean
                      description: >-
                        Default public accessibility. Absent (nil) = not set at this tier.
                    autoMinorVersionUpgrade:
                      type: boolean
                      description: >-
                        Default auto minor version upgrade. Absent (nil) = not set at this tier.
                    logsGeneral:
                      type: boolean
                      description: >-
                        Default general CloudWatch logging. Absent (nil) = not set at this tier.
                    logsAudit:
                      type: boolean
                      description: >-
                        Default audit CloudWatch logging (ActiveMQ only).
                        Absent (nil) = not set at this tier.
                    encryptionUseAWSOwnedKey:
                      type: boolean
                      description: >-
                        Default encryption key type. Absent (nil) = not set at this tier.
                    storageType:
                      type: string
                      description: >-
                        Default storage type (ActiveMQ only). Empty string = not set at this tier.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template for MQ broker names. Defaults to
                        "{namespace}-{name}".
                    tags:
                      type: object
                      default: {}
                      description: Default cloud resource tags.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to child resources and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Default annotations synced to child resources.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        engineType:
                          type: string
                        authenticationStrategy:
                          type: string
                        deploymentMode:
                          type: string
                        hostInstanceType:
                          type: string
                        publiclyAccessible:
                          type: boolean
                        autoMinorVersionUpgrade:
                          type: boolean
                        logsGeneral:
                          type: boolean
                        logsAudit:
                          type: boolean
                        encryptionUseAWSOwnedKey:
                          type: boolean
                        storageType:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        engineType:
                          type: string
                        authenticationStrategy:
                          type: string
                        deploymentMode:
                          type: string
                        hostInstanceType:
                          type: string
                        publiclyAccessible:
                          type: boolean
                        autoMinorVersionUpgrade:
                          type: boolean
                        logsGeneral:
                          type: boolean
                        logsAudit:
                          type: boolean
                        encryptionUseAWSOwnedKey:
                          type: boolean
                        storageType:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
