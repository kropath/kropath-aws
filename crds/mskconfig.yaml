---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mskconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: MSKConfig
    listKind: MSKConfigList
    plural: mskconfigs
    singular: mskconfig
    shortNames:
      - mskcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kafkaVersion) &&
                  self.spec.mandatory.kafkaVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kafkaVersion) &&
                  self.spec.defaults.kafkaVersion != "")
              message: >-
                kafkaVersion must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.instanceType) &&
                  self.spec.mandatory.instanceType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.instanceType) &&
                  self.spec.defaults.instanceType != "")
              message: >-
                instanceType must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionAtRestKmsKeyId) &&
                  self.spec.mandatory.encryptionAtRestKmsKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionAtRestKmsKeyId) &&
                  self.spec.defaults.encryptionAtRestKmsKeyId != "")
              message: >-
                encryptionAtRestKmsKeyId must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionInTransitClientBroker) &&
                  self.spec.mandatory.encryptionInTransitClientBroker != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionInTransitClientBroker) &&
                  self.spec.defaults.encryptionInTransitClientBroker != "")
              message: >-
                encryptionInTransitClientBroker must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionInTransitInCluster) &&
                  self.spec.mandatory.encryptionInTransitInCluster != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionInTransitInCluster) &&
                  self.spec.defaults.encryptionInTransitInCluster != "")
              message: >-
                encryptionInTransitInCluster must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enhancedMonitoring) &&
                  self.spec.mandatory.enhancedMonitoring != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.enhancedMonitoring) &&
                  self.spec.defaults.enhancedMonitoring != "")
              message: >-
                enhancedMonitoring must be set in either mandatory or defaults, not both.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate must be set in either mandatory or defaults, not both.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory MSK governance fields. Non-zero values enforce governance
                    constraints regardless of instance spec or defaults. Zero-value means
                    the field is not enforced.
                  properties:
                    kafkaVersion:
                      type: string
                      description: >-
                        Required Kafka version for all clusters in scope.
                        Empty string = not enforced.
                    instanceType:
                      type: string
                      description: >-
                        Required broker instance type (e.g. kafka.m5.large).
                        Empty string = not enforced.
                    encryptionAtRestKmsKeyId:
                      type: string
                      description: >-
                        Required KMS key ID, ARN, or alias for at-rest EBS encryption.
                        Empty string = not enforced (uses AWS service-managed key).
                    encryptionInTransitClientBroker:
                      type: string
                      description: >-
                        Required client-broker encryption mode. Empty string = not enforced.
                        One of: "TLS", "TLS_PLAINTEXT", "PLAINTEXT".
                    encryptionInTransitInCluster:
                      type: string
                      description: >-
                        Required inter-broker encryption (three-state string). Empty string = not enforced.
                        One of: "true", "false". Maps to ACK boolean encryptionInTransit.inCluster.
                    enhancedMonitoring:
                      type: string
                      description: >-
                        Required CloudWatch monitoring level. Empty string = not enforced.
                        One of: "DEFAULT", "PER_BROKER", "PER_TOPIC_PER_BROKER", "PER_TOPIC_PER_PARTITION".
                    namingTemplate:
                      type: string
                      description: >-
                        Mandatory naming template for MSK resource names.
                        Empty string = no mandatory template.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Mandatory MSK-specific cloud tags merged into all MSK resources
                        (except MSKConfiguration which has no ACK tags field).
                        Map merge semantics — no mutual-exclusivity rule needed.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Mandatory labels synced to both K8s labels and cloud tags (ADR-015 §6.1).
                        Map merge semantics — no mutual-exclusivity rule needed.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Mandatory annotations synced to child resource K8s annotations.
                        Map merge semantics — no mutual-exclusivity rule needed.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default MSK governance fields. Applied when instance spec fields are empty.
                    Zero-value preserves existing instance settings.
                  properties:
                    kafkaVersion:
                      type: string
                      description: >-
                        Default Kafka version. Applied when instance spec.kafkaVersion is empty.
                    instanceType:
                      type: string
                      description: >-
                        Default broker instance type. Applied when instance spec.instanceType is empty.
                    encryptionAtRestKmsKeyId:
                      type: string
                      description: >-
                        Default KMS key for at-rest encryption. Empty = AWS service-managed key.
                    encryptionInTransitClientBroker:
                      type: string
                      description: >-
                        Default client-broker encryption mode (secure-by-default).
                        One of: "TLS", "TLS_PLAINTEXT", "PLAINTEXT".
                    encryptionInTransitInCluster:
                      type: string
                      description: >-
                        Default inter-broker encryption (secure-by-default).
                        One of: "true", "false".
                    enhancedMonitoring:
                      type: string
                      description: >-
                        Default CloudWatch monitoring level.
                        One of: "DEFAULT", "PER_BROKER", "PER_TOPIC_PER_BROKER", "PER_TOPIC_PER_PARTITION".
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template for MSK resource names.
                    tags:
                      type: object
                      default: {}
                      description: >-
                        Default MSK-specific cloud tags. Map merge semantics.
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      description: >-
                        Default labels synced to both K8s labels and cloud tags.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: >-
                        Default annotations synced to child resource K8s annotations.
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions represent the latest available observations of an object state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the spec most recently reconciled by kropath-controller.
                syncedTimestamp:
                  type: string
                  description: RFC3339 timestamp of the last successful reconcile.
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-controller. MSK RGDs read
                    exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        kafkaVersion:
                          type: string
                        instanceType:
                          type: string
                        encryptionAtRestKmsKeyId:
                          type: string
                        encryptionInTransitClientBroker:
                          type: string
                        encryptionInTransitInCluster:
                          type: string
                        enhancedMonitoring:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        kafkaVersion:
                          type: string
                        instanceType:
                          type: string
                        encryptionAtRestKmsKeyId:
                          type: string
                        encryptionInTransitClientBroker:
                          type: string
                        encryptionInTransitInCluster:
                          type: string
                        enhancedMonitoring:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        region:
                          type: string
                        accountId:
                          type: string
