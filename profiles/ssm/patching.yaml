---
# Patch governance profile.
# Mandates AMAZON_LINUX_2 operating system for patch baselines and sets sensible
# patch compliance defaults. Instances cannot override mandatory.operatingSystem.
apiVersion: aws.kropath.run/v1alpha1
kind: SSMConfig
metadata:
  name: patching
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: patching
spec:
  mandatory:
    operatingSystem: "AMAZON_LINUX_2"
  defaults:
    approvedPatchesComplianceLevel: "HIGH"
    rejectedPatchesAction: "BLOCK"
    namingTemplate: "{namespace}-{name}"
