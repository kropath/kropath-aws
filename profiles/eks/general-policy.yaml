#
# Baseline EKSConfig profile. All mandatory fields at zero values (nothing enforced).
# Defaults provide secure baselines: API authentication, both endpoints enabled,
# standard support, simple naming.
---
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    version: ""
    authenticationMode: "API"
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: true
    endpointPrivateAccess: true
    supportType: "STANDARD"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
