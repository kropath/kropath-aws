#
# BedrockConfig sandbox profile — permissive experimentation profile with high token,
# iteration, and timeout defaults. No mandatory governance constraints. Use in sandbox
# and development namespaces for high-throughput AI experimentation.
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: sandbox
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: sandbox
spec:
  mandatory:
    foundationModel: ""
    guardrailIdentifier: ""
    guardrailVersion: ""
    allowedModels: []
    maxIterations: 0
    maxTokens: 0
    timeoutSeconds: 0
    idleSessionTTLInSeconds: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    foundationModel: ""
    guardrailIdentifier: ""
    guardrailVersion: ""
    allowedModels: []
    maxIterations: 200
    maxTokens: 500000
    timeoutSeconds: 600
    idleSessionTTLInSeconds: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
