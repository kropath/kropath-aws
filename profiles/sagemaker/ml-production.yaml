---
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ml-production
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: ml-production
spec:
  # Production security posture: enforce network isolation, no direct internet, no inter-container
  # traffic in cleartext — every instance using this profile inherits these constraints.
  mandatory:
    instanceType: ""
    volumeSizeInGB: 0
    kmsKeyId: ""
    enableNetworkIsolation: true
    enableInterContainerTrafficEncryption: true
    rootAccess: "Disabled"
    directInternetAccess: "Disabled"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  # Production defaults complement the mandatory floor.
  defaults:
    instanceType: "ml.m5.xlarge"
    volumeSizeInGB: 50
    kmsKeyId: ""
    enableNetworkIsolation: false
    enableInterContainerTrafficEncryption: false
    rootAccess: ""
    directInternetAccess: ""
    namingTemplate: "{namespace}-{name}"
    tags:
      environment: production
    syncedLabels: {}
    syncedAnnotations: {}
