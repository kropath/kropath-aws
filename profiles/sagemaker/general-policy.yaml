---
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  # All mandatory fields at zero-value sentinel (not enforced).
  mandatory:
    instanceType: ""
    volumeSizeInGB: 0
    kmsKeyId: ""
    enableNetworkIsolation: false
    enableInterContainerTrafficEncryption: false
    rootAccess: ""
    directInternetAccess: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  # Sensible defaults for general SageMaker usage.
  defaults:
    instanceType: ""
    volumeSizeInGB: 5
    kmsKeyId: ""
    enableNetworkIsolation: false
    enableInterContainerTrafficEncryption: false
    rootAccess: "Enabled"
    directInternetAccess: "Enabled"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
