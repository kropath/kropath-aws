---
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ml-training
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: ml-training
spec:
  # Training workloads: no hard mandatory constraints — defaults provide reasonable baselines
  # that training teams can override per instance (except tags).
  mandatory:
    instanceType: ""
    volumeSizeInGB: 0
    kmsKeyId: ""
    enableNetworkIsolation: false
    enableInterContainerTrafficEncryption: false
    rootAccess: ""
    directInternetAccess: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  # Reasonable defaults for distributed ML training jobs.
  defaults:
    instanceType: "ml.p3.2xlarge"
    volumeSizeInGB: 100
    kmsKeyId: ""
    enableNetworkIsolation: false
    enableInterContainerTrafficEncryption: true
    rootAccess: "Enabled"
    directInternetAccess: "Enabled"
    namingTemplate: "{namespace}-{name}"
    tags:
      workload: training
    syncedLabels: {}
    syncedAnnotations: {}
