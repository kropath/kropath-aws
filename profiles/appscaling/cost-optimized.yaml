---
# Cost-optimized AppScalingConfig profile. Enables scale-to-zero (minCapacity: 0),
# caps capacity at 5, and uses aggressive cooldowns to scale in quickly and reduce costs.
# Suitable for non-critical batch or background workloads.
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: cost-optimized
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: cost-optimized
spec:
  mandatory:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    minCapacity: 0
    maxCapacity: 5
    disableScaleIn: false
    scaleInCooldown: 60
    scaleOutCooldown: 30
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
