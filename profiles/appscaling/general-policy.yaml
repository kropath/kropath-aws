---
# Default AppScalingConfig profile. Provides sensible defaults for Application Auto Scaling
# governance: at least 1 instance, capped at 10, scale-in allowed, standard cooldowns.
# mandatory tier is zero-value — no org-wide enforcement from this profile by default.
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    minCapacity: 1
    maxCapacity: 10
    disableScaleIn: false
    scaleInCooldown: 300
    scaleOutCooldown: 60
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
