#
# high-security — high-security compliance Cognito governance profile.
# Mandatory MFA ON, minimum password length 12, mandatory deletion protection,
# advanced security enforced. Suitable for production workloads requiring strong
# security posture without PCI-DSS specific requirements.
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: high-security
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: high-security
spec:
  mandatory:
    mfaConfiguration: "ON"
    deletionProtection: "ACTIVE"
    advancedSecurityMode: "ENFORCED"
    passwordPolicy:
      minimumLength: 12
  defaults:
    passwordPolicy:
      requireLowercase: true
      requireNumbers: true
      requireSymbols: true
      requireUppercase: true
      temporaryPasswordValidityDays: 7
    namingTemplate: "{namespace}-{name}"
