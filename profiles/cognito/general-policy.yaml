# general-policy — default Cognito governance profile.
# MFA optional, standard password policy (8 chars, all complexity), no deletion
# protection, no advanced security, standard naming. Selected by default when
# CognitoUserPool.spec.configRef is not set.
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory: {}
  defaults:
    mfaConfiguration: "OFF"
    deletionProtection: "INACTIVE"
    passwordPolicy:
      minimumLength: 8
      requireLowercase: true
      requireNumbers: true
      requireSymbols: true
      requireUppercase: true
      temporaryPasswordValidityDays: 7
    namingTemplate: "{namespace}-{name}"
