# pci — PCI-DSS compliance Cognito governance profile.
# Mandatory MFA ON, minimum password length 14, mandatory deletion protection,
# advanced security enforced, all complexity requirements enforced, compliance
# tagging, 1-day temporary password validity, and PCI-prefixed naming.
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: pci
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: pci
spec:
  mandatory:
    mfaConfiguration: "ON"
    deletionProtection: "ACTIVE"
    advancedSecurityMode: "ENFORCED"
    passwordPolicy:
      minimumLength: 14
      requireLowercase: true
      requireNumbers: true
      requireSymbols: true
      requireUppercase: true
    tags:
      compliance: pci-dss
  defaults:
    passwordPolicy:
      temporaryPasswordValidityDays: 1
    namingTemplate: "pci-{namespace}-{name}"
