#
# Baseline WAFConfig profile for kro-system. All mandatory fields are at zero
# sentinel values (not enforced). Defaults provide secure, observable baseline
# governance per spec aws-waf-01-wafconfig.md.
---
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    scope: ""
    defaultAction: ""
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    scope: "REGIONAL"
    defaultAction: "block"
    cloudWatchMetricsEnabled: true
    sampledRequestsEnabled: true
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
