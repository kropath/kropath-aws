---
apiVersion: aws.kropath.run/v1alpha1
kind: EC2Config
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    flowLogsRequired: false
    flowLogTrafficType: ""
    flowLogMaxAggregationInterval: 0
    restrictPublicIpOnLaunch: false
    imdsv2Required: false
    ebsEncryptionRequired: false
    ebsDefaultKmsKeyId: ""
    publicIpRestricted: false
    allowSourceDestCheckDisable: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    flowLogsRequired: false
    flowLogTrafficType: "ALL"
    flowLogMaxAggregationInterval: 600
    restrictPublicIpOnLaunch: false
    imdsv2Required: true
    ebsEncryptionRequired: true
    ebsDefaultKmsKeyId: ""
    publicIpRestricted: false
    allowSourceDestCheckDisable: false
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
