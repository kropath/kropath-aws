---
apiVersion: aws.kropath.run/v1alpha1
kind: DSQLConfig
metadata:
  name: production
  namespace: kro-system
  labels:
    # Theme 28: DSQLCluster RGD resolves config via selector.matchLabels, not externalRef.metadata.name
    aws.kropath.run/resource-name: production
spec:
  mandatory:
    deletionProtectionEnabled: true
    kmsEncryptionKey: "arn:aws:kms:us-east-1:111122223333:key/mrk-1234abcd12ab34cd56ef1234567890ab"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    deletionProtectionEnabled: true
    kmsEncryptionKey: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
