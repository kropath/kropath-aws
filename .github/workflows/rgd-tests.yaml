name: RGD Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "rgds/**"
      - "crds/**"
      - "tests/**"
      - ".github/workflows/**"

jobs:
  test:
    name: Chainsaw E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kind runs via Docker on ubuntu-latest — no remote cluster or cloud credentials needed.
      # Single-node control-plane uses under 2 GB of the 7 GB runner RAM.
      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kropath-aws-test
          version: v0.32.0
          config: tests/fixtures/kind-config.yaml

      - name: Setup test environment
        run: |
          (cd tests && make setup)
      - name: Install Chainsaw (pinned v0.2.15)
        uses: kyverno/action-install-chainsaw@v0.2.15

      - name: Run Chainsaw E2E tests
        run: |
          (cd tests && make chainsaw-e2e)
      - name: Run tests
        run: |
          (cd tests && make test)

      # - name: Install kro operator (pinned v0.9.2)
      #   run: |
      #     kubectl create namespace kro-system
      #     kubectl apply -f https://github.com/kubernetes-sigs/kro/releases/download/v0.9.2/kro-core-install-manifests.yaml
      #     kubectl rollout status deployment/kro -n kro-system --timeout=120s

      # # CRD YAMLs are pinned in tests/fixtures/crds/ — no controller deployment,
      # # no cloud credentials. Only the schema definitions are needed for kro to create
      # # child CRs and for the API server to accept them.
      # - name: Install ACK CRD definitions (no controllers, no cloud credentials)
      #   run: hack/install-provider-crds.sh

      # # Install kropath.run CRDs in dependency order so example CRs are not applied
      # # before their CRDs exist.
      # - name: Install kropath.run CRD definitions
      #   run: |
      #     kubectl apply -f crds/
      #     kubectl apply -f crds/policy/policydocument.yaml

      # - name: Install kropath.run RGDS definitions
      #   run: kubectl apply -f rgds/

      # - name: Run IAM config tests
      #   run: |
      #     chainsaw test tests/iam/ \
      #       --parallel 4 \
      #       --report-format JUNIT-TEST \
      #       --report-path test-results/

      # - name: Run IAM policy config tests
      #   run: |
      #     chainsaw test tests/policy/ \
      #       --parallel 4 \
      #       --report-format JUNIT-TEST \
      #       --report-path test-results/

      # - name: Run S3 config tests
      #   run: |
      #     chainsaw test tests/s3/ \
      #       --parallel 4 \
      #       --report-format JUNIT-TEST \
      #       --report-path test-results/

      # - name: Run KMS config tests
      #   run: |
      #     chainsaw test tests/kms/ \
      #       --parallel 4 \
      #       --report-format JUNIT-TEST \
      #       --report-path test-results/

      - name: Publish test results to PR
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: RGD Tests
          path: tests/test-results/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 30
