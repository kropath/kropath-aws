name: RGD Tests

on:
  push:
    branches:
      - main
    paths:
      - "rgds/**"
      - "crds/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "rgds/**"
      - "crds/**"
      - "tests/**"
      - ".github/workflows/**"

jobs:
  test:
    name: Chainsaw E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so tests/select-tests.sh can diff against the base commit
          # to determine which resource families actually changed.
          fetch-depth: 0

      # kind runs via Docker on ubuntu-latest — no remote cluster or cloud credentials needed.
      # Single-node control-plane uses under 2 GB of the 7 GB runner RAM.
      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kropath-aws-test
          version: v0.32.0
          config: tests/fixtures/kind-config.yaml

      - name: Setup test environment
        run: |
          (cd tests && make setup)

      - name: Lint Chainsaw test scripts
        run: |
          (cd tests && make lint-test-scripts)

      - name: Install Chainsaw (pinned v0.2.15)
        uses: kyverno/action-install-chainsaw@v0.2.15

      - name: Run Chainsaw E2E tests
        run: |
          (cd tests && make chainsaw-e2e)

      - name: Select tests for changed files
        id: select
        env:
          # github.event.before/after cover the delta of THIS push only (present for
          # push events, and for pull_request "synchronize" — every push after the
          # first). pull_request.base.sha is the merge-base with the target branch,
          # which only makes sense on a PR's very first run ("opened"/"reopened") —
          # using it on every run would accumulate the whole PR's diff forever, so it
          # must be the fallback, not the primary. Order here matters: `before` must
          # be checked first, since pull_request.base.sha is always non-empty and
          # would otherwise short-circuit it out on every run.
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          targets=$(tests/select-tests.sh)
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          if [ -z "${targets}" ]; then
            echo "No resource-family changes detected in rgds/crds/tests — skipping per-service suites."
          else
            echo "Running: ${targets}"
          fi

      - name: Run tests
        if: steps.select.outputs.targets != ''
        run: |
          (cd tests && make ${{ steps.select.outputs.targets }})

      # - name: Install kro operator (pinned v0.9.2)
      #   run: |
      #     kubectl create namespace kro-system
      #     kubectl apply -f https://github.com/kubernetes-sigs/kro/releases/download/v0.9.2/kro-core-install-manifests.yaml
      #     kubectl rollout status deployment/kro -n kro-system --timeout=120s

      # # CRD YAMLs are pinned in tests/fixtures/crds/ — no controller deployment,
      # # no cloud credentials. Only the schema definitions are needed for kro to create
      # # child CRs and for the API server to accept them.
      # - name: Install ACK CRD definitions (no controllers, no cloud credentials)
      #   run: hack/install-provider-crds.sh

      # # Install kropath.run CRDs in dependency order so example CRs are not applied
      # # before their CRDs exist.
      # - name: Install kropath.run CRD definitions
      #   run: |
      #     kubectl apply -f crds/
      #     kubectl apply -f crds/policy/policydocument.yaml

      # - name: Install kropath.run RGDS definitions
      #   run: kubectl apply -f rgds/

      # - name: Run IAM config tests
      #   run: |
      #     chainsaw test tests/iam/ \
      #       --parallel 4 \
      #       --report-format JUNIT-TEST \
      #       --report-path test-results/

      # - name: Run IAM policy config tests
      #   run: |
      #     chainsaw test tests/policy/ \
      #       --parallel 4 \
      #       --report-format JUNIT-TEST \
      #       --report-path test-results/

      # - name: Run S3 config tests
      #   run: |
      #     chainsaw test tests/s3/ \
      #       --parallel 4 \
      #       --report-format JUNIT-TEST \
      #       --report-path test-results/

      # - name: Run KMS config tests
      #   run: |
      #     chainsaw test tests/kms/ \
      #       --parallel 4 \
      #       --report-format JUNIT-TEST \
      #       --report-path test-results/

      - name: Publish test results to PR
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: RGD Tests
          path: tests/test-results/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 30
