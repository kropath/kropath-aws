name: RGD Tests

on:
  pull_request:
    paths:
      - 'rgds/**'
      - 'crds/**'
      - 'tests/**'
      - '.github/workflows/**'

jobs:
  test:
    name: Chainsaw E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare test environment
        run: bash tests/setup.sh

      # kropath.run CRDs (AWSPolicyDocument etc.) live in crds/ — apply before policy tests.
      - name: Install kropath.run CRD definitions
        run: kubectl apply -R -f crds/

      - name: Install Chainsaw (pinned v0.2.15)
        uses: kyverno/action-install-chainsaw@v0.2.15

      - name: Run Chainsaw E2E tests
        run: |
          mkdir -p test-results
          chainsaw test tests/chainsaw/ \
            --parallel 4 \
            --report-format JUNIT-TEST \
            --report-path test-results/

      - name: Run S3 config tests
        run: |
          mkdir -p test-results
          chainsaw test tests/s3/awss3config/ \
            --parallel 4 \
            --report-format JUNIT-TEST \
            --report-path test-results/

      - name: Run S3 bucket Chainsaw tests
        run: |
          mkdir -p test-results
          chainsaw test tests/s3/awss3bucket/ \
            --parallel 4 \
            --report-format JUNIT-TEST \
            --report-path test-results/

      - name: Run policy document tests
        run: |
          chainsaw test tests/policy/ \
            --parallel 4 \
            --report-format JUNIT-TEST \
            --report-path test-results/

      - name: Publish test results to PR
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: RGD Tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
