name: Onboarding Chart Checks

on:
  pull_request:
    paths:
      - "onboarding/**"
      - "crds/**"
      - "hack/gen-family-kind-map.sh"
      - "hack/check-family-kind-map.sh"
      - "Makefile"
      - ".github/workflows/onboarding-checks.yml"
  push:
    branches:
      - main
    paths:
      - "onboarding/**"
      - "crds/**"
      - "hack/gen-family-kind-map.sh"
      - "hack/check-family-kind-map.sh"

jobs:
  lint-and-test:
    name: Lint + render tests for tenant-namespace-onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint (family-kind-map freshness + helm lint)
        run: make lint-onboarding

      - name: Render + negative-path tests
        run: make test-onboarding
