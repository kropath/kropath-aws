name: CRD Classification Check

on:
  pull_request:
    paths:
      - 'crds/**'
      - '.github/workflows/crd-classification-check.yml'
      - 'Makefile'

jobs:
  lint-crds:
    name: Detect resource-kind CRDs under crds/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CRD classification
        run: make lint-crds
