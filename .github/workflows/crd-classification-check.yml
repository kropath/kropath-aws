name: Static Checks

on:
  pull_request:
    paths:
      - 'crds/**'
      - 'rgds/**'
      - 'hack/**'
      - '.github/workflows/crd-classification-check.yml'
      - 'Makefile'

jobs:
  lint-crds:
    name: Detect resource-kind CRDs under crds/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CRD classification
        run: make lint-crds

  # Sub-second guard for the failure mode that costs the most CI time: an RGD whose CEL does not
  # parse never leaves Inactive, and the only signal is a wall of "timed out waiting for the
  # condition on resourcegraphdefinitions/<name>" ~20 minutes into the Chainsaw job.
  lint-rgd-cel:
    name: Check CEL expression balance in rgds/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check RGD CEL balance
        run: make lint-rgd-cel
