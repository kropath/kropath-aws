---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: elbloadbalancer.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: ELBLoadBalancer
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # LB type — application | network | gateway; immutable after creation
      type: string | required=true
      # Scheme — internet-facing (default) | internal; GWLB always internal
      scheme: string | default=""
      # IP address type — ipv4 (default) | dualstack | dualstack-without-public-ipv4
      ipAddressType: string | default=ipv4
      # Subnet IDs; mutually exclusive with subnetMappings
      subnets: "[]string | default=[]"
      # Subnet mappings with optional EIP/private IP; mutually exclusive with subnets
      subnetMappings: "[]SubnetMapping | default=[]"
      # Security group IDs (ALB and NLB only; ignored for GWLB)
      securityGroups: "[]string | default=[]"
      # Governance — boolean fields declared without default to support tri-state:
      #   unset → fall through to defaults tier
      #   true/false → instance tier takes precedence over defaults
      deletionProtection: boolean
      # Access logging configuration
      accessLogging:
        enabled: boolean
        s3Bucket: string | default=""
        s3Prefix: string | default=""
      # Cross-zone load balancing (NLB/GWLB governance; ALB is always cross-zone)
      crossZoneLoadBalancing: boolean
      # Idle timeout in seconds (ALB only, 1-4000); 0 = not set at this tier
      idleTimeoutSeconds: integer | default=0
      # Additional LB attributes beyond the typed governance fields above
      additionalAttributes: "[]LBAttribute | default=[]"
    types:
      SubnetMapping:
        subnetId: string | default=""
        allocationId: string | default=""
        privateIPv4Address: string | default=""
        ipv6Address: string | default=""
      LBAttribute:
        key: string | default=""
        value: string | default=""
    status:
      resourceName: >-
        ${naming.data.resourceName}
      namingStatus: >-
        ${naming.data.namingStatus}
      conditions: >-
        ${lb.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: Type
        type: string
        jsonPath: .spec.type
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
  resources:
    # Single governance config lookup — controller pre-merges all cascade layers (ADR-010 D-1).
    # Uses selector.matchLabels (Theme 28/KRO-221) — CEL in externalRef.metadata.name is not evaluated.
    # kro infers rsrcCfg as a list; access via rsrcCfg[0].* with rsrcCfg.size() > 0 guards.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: ELBConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # Naming ConfigMap — materialises effectiveName and resourceName (with .lowerAscii() for ELB
    # constraints) and namingStatus without requiring schema.* access in the status block.
    # Labeled with aws.kropath.run/resource-name for any future externalRef lookups.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-elblb-naming
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: elblb-naming
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ELBLoadBalancer
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          # effectiveName: base name resolved via naming template with {tag.X} dynamic substitution.
          # Template priority: mandatory → defaults → fallback "{namespace}-{name}".
          # {tag.X} tokens resolved in cascade order: mandatory wins over spec, spec wins over defaults.
          effectiveName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}
          # resourceName applies .lowerAscii() for ELB naming constraints (max 32 chars, alphanumeric + hyphens)
          resourceName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))
              .lowerAscii()}
          namingStatus: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef)).contains("{")
              ? "invalid-unresolved-tokens"
              : "valid"}

    # ACK ELBv2 LoadBalancer CR — primary cloud resource.
    # No status.predictedArn: ELBv2 ARNs include a hash suffix assigned by AWS at creation.
    # Use status.ackResourceMetadata.arn at runtime.
    - id: lb
      template:
        apiVersion: elbv2.services.k8s.aws/v1alpha1
        kind: LoadBalancer
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ELBLoadBalancer
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.resourceName}
          type: ${schema.spec.type}
          # scheme: resolved via three-tier cascade (mandatory.internalOnly → instance → defaults.internalOnly)
          # GWLB is always internal; scheme is not set for GWLB (ACK ignores it, but we omit for clarity).
          scheme: >-
            ${schema.spec.type == "gateway"
              ? ""
              : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?internalOnly.orValue(false)
                  ? "internal"
                  : (schema.spec.scheme != ""
                      ? schema.spec.scheme
                      : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?internalOnly.orValue(false)
                          ? "internal"
                          : "internet-facing")))}
          ipAddressType: >-
            ${schema.spec.ipAddressType != "" ? schema.spec.ipAddressType : "ipv4"}
          # Subnets: pass through user-specified IDs (mutually exclusive with subnetMappings)
          subnets: ${schema.spec.subnets}
          # subnetMappings: map kropath camelCase fields to ACK camelCase fields (subnetId→subnetID)
          subnetMappings: >-
            ${schema.spec.subnetMappings.map(m, {
              "subnetID": m.subnetId,
              "allocationID": m.allocationId,
              "privateIPv4Address": m.privateIPv4Address,
              "ipv6Address": m.ipv6Address
            })}
          # securityGroups: ALB and NLB only; not set for GWLB
          securityGroups: >-
            ${schema.spec.type != "gateway" ? schema.spec.securityGroups : []}
          # attributes: governance-derived typed attributes followed by user additionalAttributes.
          # Typed attributes are appended last so they take precedence over any duplicate keys
          # in additionalAttributes (AWS apply order: last value for a key wins).
          #
          # Boolean governance fields (deletionProtection, crossZoneLoadBalancing, accessLogging.enabled)
          # are declared without | default=false to support tri-state (unset/true/false).
          # has() checks distinguish "not set" from "explicitly false".
          #
          # Cascade: mandatory → instance (if has()) → defaults
          attributes: >-
            ${schema.spec.additionalAttributes.map(a, {"key": a.key, "value": a.value}) + [
              {"key": "deletion_protection.enabled", "value": string(
                rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deletionProtection.orValue(false)
                  ? true
                  : (has(schema.spec.deletionProtection)
                      ? schema.spec.deletionProtection
                      : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deletionProtection.orValue(false))))},
              {"key": "access_logs.s3.enabled", "value": string(
                rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?accessLogsEnabled.orValue(false)
                  ? true
                  : (has(schema.spec.accessLogging) && has(schema.spec.accessLogging.enabled)
                      ? schema.spec.accessLogging.enabled
                      : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?accessLogsEnabled.orValue(false))))},
              {"key": "access_logs.s3.bucket", "value":
                rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?accessLogsS3Bucket.orValue("") != ""
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.accessLogsS3Bucket
                  : (has(schema.spec.accessLogging) && schema.spec.accessLogging.s3Bucket != ""
                      ? schema.spec.accessLogging.s3Bucket
                      : (rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?accessLogsS3Bucket.orValue("") : ""))},
              {"key": "access_logs.s3.prefix", "value":
                has(schema.spec.accessLogging) ? schema.spec.accessLogging.s3Prefix : ""},
              {"key": "load_balancing.cross_zone.enabled", "value": string(
                rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?crossZoneEnabled.orValue(false)
                  ? true
                  : (has(schema.spec.crossZoneLoadBalancing)
                      ? schema.spec.crossZoneLoadBalancing
                      : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?crossZoneEnabled.orValue(false))))},
              {"key": "idle_timeout.timeout_seconds", "value": string(
                rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?idleTimeoutSeconds.orValue(0) != 0
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.idleTimeoutSeconds
                  : (schema.spec.idleTimeoutSeconds != 0
                      ? schema.spec.idleTimeoutSeconds
                      : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?idleTimeoutSeconds.orValue(0) != 0
                          ? rsrcCfg[0].status.effectiveConfig.defaults.idleTimeoutSeconds
                          : 60)))}
            ]}
          # Cloud resource tags — ACK ELBv2 uses []Tag (key/value pairs), not map[string]string.
          # Merge order: defaults (lowest priority) → spec → mandatory (highest priority).
          # .transformList(k, v, {key: k, value: v}) converts merged map to ACK tag format.
          # syncedLabels and syncedAnnotations are included in cloud tags (ADR-015 §6.1).
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.tags : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.tags : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations : {})
              .transformList(k, v, {"key": k, "value": v})
              .sortBy(x, x.key)}
