---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: s3vectorsvectorbucket.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: S3VectorsVectorBucket
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      encryptionConfiguration:
        sseType: string | default=""
        kmsKeyARN: string | default=""
        kmsKeyRef: string | default=""
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      predictedArn: >-
        ${rsrcCfg.size() > 0
          ? "arn:" + ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.aws.?partition.orValue("") : "") + ":s3vectors:" + rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") + ":" + rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") + ":bucket/" + naming.data.effectiveName
          : ""}
      arn: >-
        ${vectorBucket.?status.?ackResourceMetadata.?arn.orValue("")}
      conditions: >-
        ${vectorBucket.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: S3AdvancedConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsVectorBucket
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("{account_id}") : "{account_id}")
              .replace("{region}", (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("{region}") : "{region}")
              .replace("{configRef}", schema.spec.configRef)
              .lowerAscii())}

    - id: vectorBucket
      template:
        apiVersion: s3vectors.services.k8s.aws/v1alpha1
        kind: VectorBucket
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsVectorBucket
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.effectiveName}
          encryptionConfiguration:
            sseType: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?vectorBucketEncryption.orValue(null) != null && rsrcCfg[0].status.effectiveConfig.mandatory.vectorBucketEncryption.?sseType.orValue("") != "")
                ? rsrcCfg[0].status.effectiveConfig.mandatory.vectorBucketEncryption.sseType
                : (schema.spec.encryptionConfiguration.sseType != ""
                    ? schema.spec.encryptionConfiguration.sseType
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?vectorBucketEncryption.orValue(null) != null
                        ? rsrcCfg[0].status.effectiveConfig.defaults.vectorBucketEncryption.?sseType.orValue("")
                        : ""))}
            kmsKeyARN: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?vectorBucketEncryption.orValue(null) != null && rsrcCfg[0].status.effectiveConfig.mandatory.vectorBucketEncryption.?kmsKeyARN.orValue("") != "")
                ? rsrcCfg[0].status.effectiveConfig.mandatory.vectorBucketEncryption.kmsKeyARN
                : (schema.spec.encryptionConfiguration.kmsKeyARN != ""
                    ? schema.spec.encryptionConfiguration.kmsKeyARN
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?vectorBucketEncryption.orValue(null) != null
                        ? rsrcCfg[0].status.effectiveConfig.defaults.vectorBucketEncryption.?kmsKeyARN.orValue("")
                        : ""))}
          tags: >-
            ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}
