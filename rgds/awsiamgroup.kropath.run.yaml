---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awsiamgroup.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSIAMGroup
    scope: Namespaced
    spec:
      configRef: string | default="general-policy"
      path: string | default="/"
      nameOverride: string | default=""
      deletionPolicy: string | default="retain" enum="retain,delete"
      policies: "[]GroupPolicy | default=[]"
      # tags is accepted in schema but not forwarded to cloud resource spec.tags —
      # AWS IAM Groups are non-taggable (ADR-015 §6.1 waiver; see aws-iam-05 spec).
      tags: "map[string]string | default={}"
      syncedLabels: "map[string]string | default={}"
      syncedAnnotations: "map[string]string | default={}"
    types:
      GroupPolicy:
        arn: string | default=""
        ref: string | default=""
        inline:
          name: string | default=""
          documentJSON: string | default=""
          documentRef: string | default=""
    status:
      resourceName: >-
        ${group.?spec.?name.orValue("")}
      namingStatus: >-
        ${group.?spec.?name.orValue("").contains("{") ? "invalid-unresolved-tokens" : (has(group.spec) ? "valid" : "pending")}
      predictedArn: >-
        ${has(group.spec) ? "arn:aws:iam::" + rsrcCfg.status.effectiveConfig.aws.accountId + ":group" + group.spec.path + group.spec.name : ""}
      conditions: >-
        ${group.status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
      - name: Naming
        type: string
        jsonPath: .status.namingStatus
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSIAMConfig
        metadata:
          name: ${schema.?spec.?configRef.orValue("general-policy")}
          namespace: ${schema.metadata.namespace}

    - id: firstPolicyRef
      # No includeWhen — sentinel selector ensures variable is always bound as []
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSIAMPolicy
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              kropath.run/resource-name: '${has(schema.spec.policies) && schema.spec.policies.size() > 0 && schema.spec.policies[0].?ref.orValue("") != "" ? schema.spec.policies[0].ref : "kro-empty-fallback-sentinel"}'

    - id: firstInlineDoc
      # No includeWhen — sentinel selector ensures variable is always bound as []
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSPolicyDocument
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              kropath.run/resource-name: '${has(schema.spec.policies) && schema.spec.policies.size() > 0 && schema.spec.policies[0].?inline.?documentRef.orValue("") != "" ? schema.spec.policies[0].inline.documentRef : "kro-empty-fallback-sentinel"}'

    - id: group
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Group
        metadata:
          name: "${schema.metadata.name}"
          namespace: "${schema.metadata.namespace}"
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMGroup
              name: "${schema.metadata.name}"
              uid: "${schema.metadata.uid}"
              controller: true
              blockOwnerDeletion: true
        spec:
          name: >-
            ${schema.spec.nameOverride != "" ? schema.spec.nameOverride :
              ((has(rsrcCfg.status.effectiveConfig.mandatory.namingTemplate) && rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != "") ?
                rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                  .replace("{namespace}", schema.metadata.namespace)
                  .replace("{name}", schema.metadata.name) :
               ((has(rsrcCfg.status.effectiveConfig.defaults.namingTemplate) && rsrcCfg.status.effectiveConfig.defaults.namingTemplate != "") ?
                 rsrcCfg.status.effectiveConfig.defaults.namingTemplate
                   .replace("{namespace}", schema.metadata.namespace)
                   .replace("{name}", schema.metadata.name) :
                 schema.metadata.name))}
          path: "${schema.spec.path}"
          policies: >-
            ${(has(schema.spec.policies) && schema.spec.policies.size() > 0 && has(schema.spec.policies[0].arn) && schema.spec.policies[0].arn != "" ?
              [schema.spec.policies[0].arn] : [])
            + (firstPolicyRef.size() > 0 && has(firstPolicyRef[0].status) && has(firstPolicyRef[0].status.arn) && firstPolicyRef[0].status.arn != "" ?
              [firstPolicyRef[0].status.arn] : [])}
          inlinePolicies: >-
            ${(firstInlineDoc.size() > 0 && has(schema.spec.policies) && schema.spec.policies.size() > 0 &&
               schema.spec.policies[0].?inline.?name.orValue("") != "" ?
               {schema.spec.policies[0].inline.name: firstInlineDoc[0].spec.documentJSON} : {})
            .merge(has(schema.spec.policies) && schema.spec.policies.size() > 0 &&
                   schema.spec.policies[0].?inline.?documentJSON.orValue("") != "" ?
                   {schema.spec.policies[0].inline.name: schema.spec.policies[0].inline.documentJSON} : {})}
