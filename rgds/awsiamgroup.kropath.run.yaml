---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awsiamgroup.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSIAMGroup
    scope: Namespaced
    spec:
      configRef: string | default="general-policy"
      path: string | default="/"
      nameOverride: string | default=""
      deletionPolicy: string | default="retain" enum="retain,delete"
      policies: "[]GroupPolicy | default=[]"
      tags: "map[string]string | default={}"
      syncedLabels: "map[string]string | default={}"
      syncedAnnotations: "map[string]string | default={}"
    types:
      GroupPolicy:
        arn: string | default=""
        ref: string | default=""
        inline:
          name: string | default=""
          documentJSON: string | default=""
          documentRef: string | default=""
    status:
      resourceName: >-
        ${schema.spec.nameOverride != ""
          ? schema.spec.nameOverride
          : ((resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
              ? resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
              : resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.aws.accountId ?? "")
              .replace("{region}", resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.aws.region ?? "")
              .replace("{configRef}", schema.spec.configRef))}
      namingStatus: >-
        ${!(schema.spec.nameOverride != ""
          ? schema.spec.nameOverride
          : ((resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
              ? resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
              : resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.aws.accountId ?? "")
              .replace("{region}", resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.aws.region ?? "")
              .replace("{configRef}", schema.spec.configRef)).contains("{"))
          ? "valid"
          : "invalid-unresolved-tokens"}
      predictedArn: >-
        ${"arn:aws:iam::"
          + (resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.aws.accountId ?? "")
          + ":group"
          + schema.spec.path
          + (schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                  ? resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                  : resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
                  .replace("{name}", schema.metadata.name)
                  .replace("{namespace}", schema.metadata.namespace)
                  .replace("{account_id}", resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.aws.accountId ?? "")
                  .replace("{region}", resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.aws.region ?? "")
                  .replace("{configRef}", schema.spec.configRef))}
      conditions: >-
        ${group.status.conditions ?? []}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
      - name: Naming
        type: string
        jsonPath: .status.namingStatus
  resources:
    - id: group
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Group
        metadata:
          name: "${schema.metadata.name}"
          namespace: "${schema.metadata.namespace}"
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              + (resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.syncedLabels
                  + schema.spec.syncedLabels
                  + resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.defaults.syncedLabels)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              + (resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.syncedAnnotations
                  + schema.spec.syncedAnnotations
                  + resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.defaults.syncedAnnotations)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMGroup
              name: "${schema.metadata.name}"
              uid: "${schema.metadata.uid}"
              controller: true
              blockOwnerDeletion: true
        spec:
          name: >-
            ${schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                  ? resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                  : resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
                  .replace("{name}", schema.metadata.name)
                  .replace("{namespace}", schema.metadata.namespace)
                  .replace("{account_id}", resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.aws.accountId ?? "")
                  .replace("{region}", resources.get("kro-system", "AWSIAMConfig", schema.spec.configRef).status.effectiveConfig.aws.region ?? "")
                  .replace("{configRef}", schema.spec.configRef))}
          path: "${schema.spec.path}"
          policies: >-
            ${schema.spec.policies.filter(p, p.arn != "" || p.ref != "")
              .transformList(i, p, p.arn != "" ? p.arn : resources.get(schema.metadata.namespace, "AWSIAMPolicy", p.ref).status.arn)}
          inlinePolicies: >-
            ${(schema.spec.policies.filter(p, p.inline.name != "").transformList(i, p, p.inline))
              .transformMapEntry(i, p, {p.name: (p.documentRef != "" ? resources.get(schema.metadata.namespace, "AWSPolicyDocument", p.documentRef).spec.documentJSON : p.documentJSON)})}
