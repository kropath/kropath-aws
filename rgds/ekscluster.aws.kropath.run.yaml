---
# aws-eks-02 — EKSCluster RGD
# ACK field name notes (from CRD cache + spec ACs):
#   - spec.name (cluster name)
#   - spec.roleARN (uppercase ARN)
#   - spec.resourcesVPCConfig (confirmed from live CRD; spec ACs incorrectly used lowercase vpc)
#     .subnetIDs, .securityGroupIDs, .publicAccessCIDRs (uppercase acronyms)
#   - spec.kubernetesNetworkConfig.serviceIPv4CIDR (uppercase CIDR)
#   - spec.encryptionConfig[0].provider.keyARN (uppercase ARN)
#   - spec.logging.clusterLogging[0].{enabled, types}
# Boolean pointer semantics: endpointPublicAccess/endpointPrivateAccess declared without
# | default — tri-state nil/true/false; CEL checks != null to distinguish "unset" from false.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: ekscluster.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: EKSCluster
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # IAM role for the cluster control plane — required
      roleArn: string | default=""
      # Kubernetes version — governed via EKSConfig; "" = fall through to cascade
      version: string | default=""
      # VPC configuration
      resourcesVPCConfig: ClusterVPCConfig | default={}
      # Access configuration
      accessConfig: ClusterAccessConfig | default={}
      # KMS encryption for secrets
      encryptionConfig: ClusterEncryptionConfig | default={}
      # Control plane logging
      logging: ClusterLoggingConfig | default={}
      # Kubernetes service CIDR and IP family
      kubernetesNetworkConfig: ClusterNetworkConfig | default={}
      # Upgrade support policy — governed via EKSConfig; "" = fall through to cascade
      upgradePolicy: ClusterUpgradePolicy | default={}
      # Prevent accidental cluster deletion
      deletionProtection: boolean | default=false
    types:
      ClusterVPCConfig:
        subnetIds: "[]string | default=[]"
        securityGroupIds: "[]string | default=[]"
        # Boolean endpoint access — mandatory governance tier overrides instance value.
        # Default true matches EKS built-in default (AC-19). kro types schema booleans
        # as non-nullable, so CEL null-checks only work on effectiveConfig (dynamic) fields.
        endpointPublicAccess: boolean | default=true
        endpointPrivateAccess: boolean | default=true
        publicAccessCidrs: "[]string | default=[]"
      ClusterAccessConfig:
        authenticationMode: string | default=""
        # Default true (cluster creator gets admin access); instance-only (not governed).
        bootstrapClusterCreatorAdminPermissions: boolean | default=true
      ClusterEncryptionConfig:
        keyArn: string | default=""
      ClusterLoggingConfig:
        types: "[]string | default=[]"
      ClusterNetworkConfig:
        serviceIpv4Cidr: string | default=""
        ipFamily: string | default=""
      ClusterUpgradePolicy:
        supportType: string | default=""
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      # EKS cluster ARNs use the cluster name directly — predictedArn IS derivable.
      predictedArn: >-
        ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.aws) && !naming.data.effectiveName.contains("{") && naming.data.effectiveName != ""
          ? "arn:aws:eks:" + rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") + ":" + rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") + ":cluster/" + naming.data.effectiveName
          : ""}
      clusterEndpoint: >-
        ${ackCluster.?status.?endpoint.orValue("")}
      clusterCertificateAuthority: >-
        ${ackCluster.?status.?certificateAuthority.?data.orValue("")}
      conditions: >-
        ${ackCluster.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
  resources:
    # Single governance config lookup — controller pre-merges all cascade layers (ADR-010 D-1).
    # Uses selector.matchLabels (Theme 28/KRO-221) — CEL in externalRef.metadata.name is not evaluated.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: EKSConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ConfigMap that materialises effectiveName with full {tag.X} dynamic substitution support.
    # Tag tokens resolved in cascade order: mandatory wins over spec, spec wins over defaults.
    # Any {tag.X} token whose key is absent in all tiers is kept verbatim so that
    # namingStatus (computed in status block) reports "invalid-unresolved-tokens".
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: EKSCluster
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}

    # ACK EKS Cluster CR — primary cloud resource.
    # Only created when namingStatus is valid (effectiveName has no unresolved tokens).
    - id: ackCluster
      includeWhen:
        - '${!naming.data.effectiveName.contains("{")}'
      template:
        apiVersion: eks.services.k8s.aws/v1alpha1
        kind: Cluster
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: EKSCluster
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          # Cluster name — immutable; derived from naming cascade.
          name: ${naming.data.effectiveName}
          # IAM role for the cluster control plane.
          roleARN: ${schema.spec.roleArn}
          # Kubernetes version — three-tier cascade: mandatory → instance → defaults.
          version: >-
            ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?version.orValue("") != ""
              ? rsrcCfg[0].status.effectiveConfig.mandatory.version
              : (schema.spec.version != ""
                  ? schema.spec.version
                  : (rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?version.orValue("") : ""))}
          # VPC configuration — subnet IDs and security groups are instance-only passthrough.
          # Endpoint access booleans are governed: mandatory → instance → defaults (nil=unset=fall through).
          resourcesVPCConfig:
            subnetIDs: ${schema.spec.resourcesVPCConfig.subnetIds}
            securityGroupIDs: ${schema.spec.resourcesVPCConfig.securityGroupIds}
            publicAccessCIDRs: ${schema.spec.resourcesVPCConfig.publicAccessCidrs}
            # Endpoint boolean governance: mandatory tier overrides instance.
            # Schema fields are kro-typed as bool (non-nullable), so null-check only
            # works on effectiveConfig (dynamic). Instance default=true matches AC-19.
            endpointPublicAccess: >-
              ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?endpointPublicAccess != null
                ? rsrcCfg[0].status.effectiveConfig.mandatory.endpointPublicAccess
                : schema.spec.resourcesVPCConfig.endpointPublicAccess}
            endpointPrivateAccess: >-
              ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?endpointPrivateAccess != null
                ? rsrcCfg[0].status.effectiveConfig.mandatory.endpointPrivateAccess
                : schema.spec.resourcesVPCConfig.endpointPrivateAccess}
          # Access configuration — authenticationMode governed; bootstrapClusterCreatorAdminPermissions instance-only.
          accessConfig:
            # Three-tier cascade: mandatory → instance → defaults; built-in fallback "API".
            authenticationMode: >-
              ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?accessConfig.?authenticationMode.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.accessConfig.authenticationMode
                : (schema.spec.accessConfig.authenticationMode != ""
                    ? schema.spec.accessConfig.authenticationMode
                    : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?accessConfig.?authenticationMode.orValue("") != ""
                        ? rsrcCfg[0].status.effectiveConfig.defaults.accessConfig.authenticationMode
                        : "API"))}
            # Instance-only passthrough — default true (cluster creator gets admin access).
            bootstrapClusterCreatorAdminPermissions: ${schema.spec.accessConfig.bootstrapClusterCreatorAdminPermissions}
          # KMS encryption — conditional list: non-empty keyArn → [{provider: {keyARN:...}, resources: ["secrets"]}], empty → [].
          # Three-tier cascade for key resolution: mandatory → instance → defaults.
          encryptionConfig: >-
            ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionConfig.?keyArn.orValue("") != ""
              ? [{"provider": {"keyARN": rsrcCfg[0].status.effectiveConfig.mandatory.encryptionConfig.keyArn}, "resources": ["secrets"]}]
              : (schema.spec.encryptionConfig.keyArn != ""
                  ? [{"provider": {"keyARN": schema.spec.encryptionConfig.keyArn}, "resources": ["secrets"]}]
                  : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionConfig.?keyArn.orValue("") != ""
                      ? [{"provider": {"keyARN": rsrcCfg[0].status.effectiveConfig.defaults.encryptionConfig.keyArn}, "resources": ["secrets"]}]
                      : []))}
          # Control plane logging — conditional list: non-empty types → [{enabled: true, types: [...]}], empty → [].
          # Three-tier cascade for types resolution: mandatory → instance → defaults.
          logging:
            clusterLogging: >-
              ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?logging.?types.orValue([]).size() > 0
                ? [{"enabled": true, "types": rsrcCfg[0].status.effectiveConfig.mandatory.logging.types}]
                : (schema.spec.logging.types.size() > 0
                    ? [{"enabled": true, "types": schema.spec.logging.types}]
                    : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?logging.?types.orValue([]).size() > 0
                        ? [{"enabled": true, "types": rsrcCfg[0].status.effectiveConfig.defaults.logging.types}]
                        : []))}
          # Kubernetes service network configuration — instance-only passthrough.
          kubernetesNetworkConfig:
            serviceIPv4CIDR: ${schema.spec.kubernetesNetworkConfig.serviceIpv4Cidr}
            ipFamily: ${schema.spec.kubernetesNetworkConfig.ipFamily}
          # Upgrade support policy — three-tier cascade: mandatory → instance → defaults; built-in fallback "STANDARD".
          upgradePolicy:
            supportType: >-
              ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?upgradePolicy.?supportType.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.upgradePolicy.supportType
                : (schema.spec.upgradePolicy.supportType != ""
                    ? schema.spec.upgradePolicy.supportType
                    : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?upgradePolicy.?supportType.orValue("") != ""
                        ? rsrcCfg[0].status.effectiveConfig.defaults.upgradePolicy.supportType
                        : "STANDARD"))}
          # Deletion protection — instance-only passthrough; default false.
          deletionProtection: ${schema.spec.deletionProtection}
          # Cloud resource tags — direct map<string,string> passthrough (same format as CloudWatch Logs).
          # Merge order: defaults → instance spec → mandatory (mandatory wins on collision).
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}
