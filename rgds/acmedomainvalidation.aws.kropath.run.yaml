# ACMEDomainValidation RGD — wraps ACK acm.services.k8s.aws/AcmeDomainValidation.
# Naming exemption (KRO-236): domain validations are identified by the ACME
# endpoint ARN + domain, not a name field.
# Spec: kropath-core/docs/specs/aws/aws-acm-06-acmedomainvalidation.md
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: acmedomainvalidation.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: ACMEDomainValidation
    scope: Namespaced
    spec:
      # Governance
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # Domain validation fields
      domainName: string | default=""
      # ACME endpoint reference — one of ARN or ref
      acmeEndpointARN: string | default=""
      acmeEndpointRef: string | default=""
      # DNS pre-validation scope
      dnsPrevalidationEnabled: boolean
      dnsPrevalidationExactDomain: string | default=""
      dnsPrevalidationSubdomains: boolean
      dnsPrevalidationWildcards: boolean
      hostedZoneID: string | default=""
    status:
      conditions: >-
        ${ackDomainValidationWithEndpoint.?status.?conditions.orValue([])}
      noEndpointConditions: >-
        ${ackDomainValidationNoEndpoint.?status.?conditions.orValue([])}
      validationStatus: >-
        ${ackDomainValidationRef.size() > 0 ? ackDomainValidationRef[0].?status.?status.orValue("") : ""}
      endpointArnAndRefError: >-
        ${has(endpointArnAndRefError.data) ? endpointArnAndRefError.data.error : ""}
      missingEndpointError: >-
        ${has(missingEndpointError.data) ? missingEndpointError.data.error : ""}
    additionalPrinterColumns:
      - name: DomainName
        type: string
        jsonPath: .spec.domainName
      - name: ValidationStatus
        type: string
        jsonPath: .status.validationStatus

  resources:
    # Always-bound lookup of this instance's own ACK child resource.
    # The child is created by mutually exclusive includeWhen variants, so a status expression
    # naming those variables is skipped whenever any of them is excluded — see
    # docs/frequent-rgd-errors.md §"Variant-Split Resources Freeze Combined Status Expressions".
    # An externalRef is never excluded (it resolves to [] until the child exists), so reading
    # status through it keeps one stable status field per value whichever variant fired.
    - id: ackDomainValidationRef
      externalRef:
        apiVersion: acm.services.k8s.aws/v1alpha1
        kind: AcmeDomainValidation
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              app.kubernetes.io/instance: ${schema.metadata.name}

    # Governance config lookup.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: ACMConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ACME endpoint ref resolution — reads status.acmeEndpointARN from the ACK AcmeEndpoint CR.
    # The ACMEEndpoint RGD stamps aws.kropath.run/resource-name on the ACK CR so it can be
    # looked up here by the same logical name the user specified in acmeEndpointRef.
    - id: acmeEndpointRefCr
      externalRef:
        apiVersion: acm.services.k8s.aws/v1alpha1
        kind: AcmeEndpoint
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: >-
                ${schema.spec.acmeEndpointRef != "" ? schema.spec.acmeEndpointRef : "kro-empty-fallback-sentinel"}

    # Advisory ConfigMap: acmeEndpointARN and acmeEndpointRef are mutually exclusive.
    - id: endpointArnAndRefError
      includeWhen:
        - >-
          ${schema.spec.acmeEndpointARN != "" && schema.spec.acmeEndpointRef != ""}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-endpoint-arn-ref-error
          namespace: ${schema.metadata.namespace}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEDomainValidation
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "acmeEndpointARN and acmeEndpointRef are mutually exclusive"

    # Advisory ConfigMap: at least one endpoint source is required.
    - id: missingEndpointError
      includeWhen:
        - >-
          ${schema.spec.acmeEndpointARN == "" && schema.spec.acmeEndpointRef == ""}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-missing-endpoint-error
          namespace: ${schema.metadata.namespace}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEDomainValidation
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "one of acmeEndpointARN or acmeEndpointRef is required"

    # ACK AcmeDomainValidation CR — only when validations pass.
    - id: ackDomainValidationWithEndpoint
      includeWhen:
        - >-
          ${!(schema.spec.acmeEndpointARN != "" && schema.spec.acmeEndpointRef != "")
            && !(schema.spec.acmeEndpointARN == "" && schema.spec.acmeEndpointRef == "")}
        - >-
          ${schema.spec.acmeEndpointARN != ""
            || (acmeEndpointRefCr.size() > 0
                && acmeEndpointRefCr[0].?status.?acmeEndpointARN.orValue("") != "")}
      template:
        apiVersion: acm.services.k8s.aws/v1alpha1
        kind: AcmeDomainValidation
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEDomainValidation
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          domainName: "${schema.spec.domainName}"
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})
              .transformList(k, v, {"key": k, "value": v})
              .sortBy(x, x.key)}
          acmeEndpointARN: >-
            ${schema.spec.acmeEndpointARN != ""
              ? schema.spec.acmeEndpointARN
              : (acmeEndpointRefCr.size() > 0
                  ? acmeEndpointRefCr[0].status.acmeEndpointARN
                  : "")}
          prevalidationOptions: >-
            ${has(schema.spec.dnsPrevalidationEnabled) && schema.spec.dnsPrevalidationEnabled
              ? {"dnsPrevalidation": {"hostedZoneID": schema.spec.hostedZoneID, "domainScope": {"exactDomain": schema.spec.dnsPrevalidationExactDomain, "subdomains": (has(schema.spec.dnsPrevalidationSubdomains) && schema.spec.dnsPrevalidationSubdomains) ? "ENABLED" : "DISABLED", "wildcards": (has(schema.spec.dnsPrevalidationWildcards) && schema.spec.dnsPrevalidationWildcards) ? "ENABLED" : "DISABLED"}}}
              : {}}
    - id: ackDomainValidationNoEndpoint
      includeWhen:
        - >-
          ${!(schema.spec.acmeEndpointARN != "" && schema.spec.acmeEndpointRef != "")
            && !(schema.spec.acmeEndpointARN == "" && schema.spec.acmeEndpointRef == "")}
        - >-
          ${schema.spec.acmeEndpointARN == ""
            && (acmeEndpointRefCr.size() == 0
                || acmeEndpointRefCr[0].?status.?acmeEndpointARN.orValue("") == "")}
      template:
        apiVersion: acm.services.k8s.aws/v1alpha1
        kind: AcmeDomainValidation
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEDomainValidation
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          domainName: "${schema.spec.domainName}"
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})
              .transformList(k, v, {"key": k, "value": v})
              .sortBy(x, x.key)}
          prevalidationOptions: >-
            ${has(schema.spec.dnsPrevalidationEnabled) && schema.spec.dnsPrevalidationEnabled
              ? {"dnsPrevalidation": {"hostedZoneID": schema.spec.hostedZoneID, "domainScope": {"exactDomain": schema.spec.dnsPrevalidationExactDomain, "subdomains": (has(schema.spec.dnsPrevalidationSubdomains) && schema.spec.dnsPrevalidationSubdomains) ? "ENABLED" : "DISABLED", "wildcards": (has(schema.spec.dnsPrevalidationWildcards) && schema.spec.dnsPrevalidationWildcards) ? "ENABLED" : "DISABLED"}}}
              : {}}
