#
# aws-msk-05 MSKVPCConnection RGD — wraps ACK kafka.services.k8s.aws/VPCConnection.
#
# Naming exemption (KRO-236): VPCConnection has no provider `name` field — AWS identifies
# the connection purely by a system-assigned connection ARN containing a UUID. This RGD
# intentionally omits spec.nameOverride, the `naming` ConfigMap, effectiveName,
# status.resourceName, status.predictedArn, and status.namingStatus. namingTemplate is not
# read from MSKConfig's effectiveConfig by this RGD. See docs/frequent-rgd-errors.md §1 and
# kropath-core docs/specs/aws/aws-msk-05-mskvpcconnection.md "Naming".
#
# Full immutability post-creation: authentication, targetClusterArn, vpcId, clientSubnets,
# and securityGroups mirror the ACK VPCConnection CRD's own `self == oldSelf`
# x-kubernetes-validations rules (kropath-core docs/crd-cache/aws/kafka-controller-v1.8.1.md
# "Immutable fields on VPCConnection"). Deviation from the spec's literal wording (same
# precedent as rgds/kmskey.yaml AC-22/AC-23 — see tests/kms/kmskey/chainsaw-test.yaml): this
# RGD does NOT carry hand-authored x-kubernetes-validations rules for these fields, because
# kro v0.9.2 regenerates the CRD from the RGD schema on every apply and silently discards any
# validation rule not expressible in SimpleSchema (docs/frequent-rgd-errors.md
# §"x-kubernetes-validations Cannot Be Auto-Generated by kro v0.9.2", case 3: "Immutability
# after creation ... Do not implement at admission time. ACK controllers already reject or
# ignore mutating updates to immutable fields at the AWS API layer."). Immutability for these
# five fields is therefore enforced by the ACK controller at the AWS API layer, not by
# Kubernetes admission — documented here and in the Chainsaw suite rather than implemented as
# an in-graph ConfigMap advisory (no mutual-exclusivity/range-check semantics apply here, so
# the advisory pattern used for AC-3/AC-6 elsewhere in this family does not fit).
#
# Mutable fields only: tags, syncedLabels, syncedAnnotations, deletionPolicy.
#
# Only consumes from effectiveConfig: tags, syncedLabels, syncedAnnotations. Does NOT read
# namingTemplate or any MSKCluster-specific governance fields (kafkaVersion, instanceType,
# encryption, monitoring) — those apply to MSKCluster (aws-msk-03) only.
#
# status field is named connectionState, not state — kro v0.9.2 reserves the literal status
# field name "state" for its own instance-lifecycle summary and silently overwrites any CEL
# expression assigned to a field with that exact name (verified empirically; see
# docs/frequent-rgd-errors.md §"The Status Field Named `state` Is Reserved by kro" and
# docs/troubleshooting-logs/2026-09-24-mskcluster-state-field-reserved-by-kro.md). Same
# deviation already applied in rgds/mskcluster.aws.kropath.run.yaml and
# rgds/mskserverlesscluster.aws.kropath.run.yaml.
#
# status.predictedArn intentionally omitted — connection ARNs include an AWS-assigned UUID
# not deterministic at apply time. status.connectionArn (from ACK status, post-creation) is
# used instead.
#
# targetClusterArn accepts a raw ARN string — no inline externalRef composition to MSKCluster
# in this cycle; the developer reads MSKCluster.status.clusterArn out-of-band.
#
# spec.tags maps directly to ACK VPCConnection spec.tags (map<string,string> — no list
# conversion needed, same shape as MSKCluster/MSKServerlessCluster).
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: mskvpcconnection.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: MSKVPCConnection
    scope: Namespaced
    spec:
      # Standard governance fields (mutable after creation)
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}

      # Connection target (immutable after creation — enforced by ACK at the AWS API layer,
      # see header comment)
      authentication: string | required=true

      # Connecting VPC (immutable after creation — enforced by ACK at the AWS API layer)
      targetClusterArn: string | required=true
      vpcId: string | required=true
      clientSubnets: "[]string | required=true"
      securityGroups: "[]string | default=[]"

    status:
      connectionArn: >-
        ${vpcConnection.?status.?ackResourceMetadata.?arn.orValue("")}
      # NOTE: kro v0.9.2 reserves the literal status field name "state" for its own
      # instance-lifecycle summary — exposed as connectionState instead. See header comment.
      connectionState: >-
        ${vpcConnection.?status.?state.orValue("")}
      conditions: >-
        ${vpcConnection.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: ConnectionArn
        type: string
        jsonPath: .status.connectionArn
      - name: State
        type: string
        jsonPath: .status.connectionState

  resources:
    # Config lookup via labelSelector (Theme 28 / KRO-221). Only tags, syncedLabels, and
    # syncedAnnotations are consumed — namingTemplate and all MSKCluster-specific governance
    # fields on MSKConfig do NOT apply to this resource and MUST NOT be read here.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: MSKConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ACK VPCConnection CR — the primary cloud resource. authentication, targetClusterARN,
    # vpcID, clientSubnets, and securityGroups are immutable after creation at the AWS API
    # layer (ACK-enforced, not Kubernetes-admission-enforced — see header comment).
    - id: vpcConnection
      template:
        apiVersion: kafka.services.k8s.aws/v1alpha1
        kind: VPCConnection
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          authentication: ${schema.spec.authentication}
          targetClusterARN: ${schema.spec.targetClusterArn}
          vpcID: ${schema.spec.vpcId}
          clientSubnets: ${schema.spec.clientSubnets}
          securityGroups: ${schema.?spec.?securityGroups.orValue([])}
          tags: >-
            ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}
