---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awsiamrole.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSIAMRole
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      type: string | required=true
      description: string | default=""
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      policies: "[]RolePolicy | default=[]"
      inlinePolicies: "[]InlinePolicy | default=[]"
      trustPolicyRef: string | default=""
      permissionsBoundaryArn: string | default=""
      oidcProviderArn: string | default=""
      serviceAccountNamespace: string | default=""
      serviceAccountName: string | default=""
      clusterName: string | default=""
      servicePrincipal: string | default=""
      trustPolicyJSON: string | default=""
      addSsmPolicy: boolean | default=true
      addEcsExecutionPolicy: boolean | default=true
      addLambdaBasicPolicy: boolean | default=true
      createInstanceProfile: boolean | default=true
      maxSessionDuration: integer | default=0
    types:
      RolePolicy:
        arn: string | default=""
        ref: string | default=""
        inline:
          name: string | default=""
          documentJSON: string | default=""
          documentRef: string | default=""
      InlinePolicy:
        name: string | required=true
        documentRef: string | required=true
    status:
      resourceName: >-
        ${role.metadata.name}
      namingStatus: >-
        ${has(role.status) ? "valid" : "pending"}
      predictedArn: >-
        ${role.status.?ackResourceMetadata.?arn.orValue("")}
      conditions: >-
        ${role.status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: Type
        type: string
        jsonPath: .spec.type
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
      - name: Naming
        type: string
        jsonPath: .status.namingStatus
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSIAMConfig
        metadata:
          name: ${schema.?spec.?configRef.orValue("general-policy")}
          namespace: ${schema.metadata.namespace}
    - id: trustDoc
      includeWhen:
        - "${has(schema.spec) && has(schema.spec.trustPolicyRef) && schema.spec.trustPolicyRef != \"\"}"
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSPolicyDocument
        metadata:
          name: ${schema.spec.trustPolicyRef}
          namespace: ${schema.metadata.namespace}
    - id: firstPolicyRef
      includeWhen:
        - "${has(schema.spec) && has(schema.spec.policies) && schema.spec.policies.size() > 0 && has(schema.spec.policies[0].ref) && schema.spec.policies[0].ref != \"\"}"
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSIAMPolicy
        metadata:
          name: ${schema.spec.policies[0].ref}
          namespace: ${schema.metadata.namespace}
    - id: firstInlineDoc
      includeWhen:
        - "${has(schema.spec) && has(schema.spec.inlinePolicies) && schema.spec.inlinePolicies.size() > 0 && has(schema.spec.inlinePolicies[0].documentRef) && schema.spec.inlinePolicies[0].documentRef != \"\"}"
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSPolicyDocument
        metadata:
          name: ${schema.spec.inlinePolicies[0].documentRef}
          namespace: ${schema.metadata.namespace}
    - id: role
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMRole
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: "${schema.spec.nameOverride != \"\" ? schema.spec.nameOverride : schema.metadata.name}"
          description: "${schema.spec.description}"
          assumeRolePolicyDocument: >-
            ${has(schema.spec.trustPolicyRef) && schema.spec.trustPolicyRef != "" ? trustDoc.spec.documentJSON : 
             (schema.spec.type == "ec2" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}' : 
             (schema.spec.type == "ecs-task" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]}' : 
             (schema.spec.type == "lambda" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' : 
             (schema.spec.type == "eks-irsa" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"' + schema.spec.?oidcProviderArn.orValue("") + '"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"sts.amazonaws.com:sub":"system:serviceaccount:' + schema.spec.?serviceAccountNamespace.orValue("") + ':' + schema.spec.?serviceAccountName.orValue("") + '"}}}]}' : 
             (schema.spec.type == "eks-pod-identity" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"pods.eks.amazonaws.com"},"Action":"sts:AssumeRole"}]}' : 
             (schema.spec.type == "aws-service" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"' + schema.spec.?servicePrincipal.orValue("") + '"},"Action":"sts:AssumeRole"}]}' : 
             schema.spec.trustPolicyJSON))))))}
          permissionsBoundary: "${rsrcCfg.status.effectiveConfig.mandatory.permissionsBoundaryArn != \"\" ? rsrcCfg.status.effectiveConfig.mandatory.permissionsBoundaryArn : (schema.spec.permissionsBoundaryArn == \"none\" ? \"\" : (schema.spec.permissionsBoundaryArn != \"\" ? schema.spec.permissionsBoundaryArn : rsrcCfg.status.effectiveConfig.defaults.permissionsBoundaryArn))}"
          maxSessionDuration: >-
            ${(rsrcCfg.status.effectiveConfig.mandatory.maxSessionDurationSeconds > 0 && schema.spec.maxSessionDuration > rsrcCfg.status.effectiveConfig.mandatory.maxSessionDurationSeconds ? rsrcCfg.status.effectiveConfig.mandatory.maxSessionDurationSeconds : (schema.spec.maxSessionDuration > 0 ? schema.spec.maxSessionDuration : 3600))}
          policies: >-
            ${((schema.spec.type == "ec2" && schema.spec.addSsmPolicy ? ["arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"] : []) + (schema.spec.type == "ecs-task" && schema.spec.addEcsExecutionPolicy ? ["arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"] : []) + (schema.spec.type == "lambda" && schema.spec.addLambdaBasicPolicy ? ["arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"] : []))}
          tags: >-
            ${rsrcCfg.status.effectiveConfig.mandatory.tags.transformList(k, v, {"key": k, "value": v})
              + schema.spec.tags.transformList(k, v, {"key": k, "value": v})
              + rsrcCfg.status.effectiveConfig.defaults.tags.transformList(k, v, {"key": k, "value": v})}

    - id: instanceProfile
      includeWhen:
        - "${has(schema.spec) && schema.spec.type == \"ec2\" && schema.spec.createInstanceProfile}"
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: InstanceProfile
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMRole
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: "${schema.spec.nameOverride != \"\" ? schema.spec.nameOverride : schema.metadata.name}"
          role: "${schema.spec.nameOverride != \"\" ? schema.spec.nameOverride : schema.metadata.name}"

    - id: podIdentityAssociation
      includeWhen:
        - "${has(schema.spec) && has(schema.spec.type) && schema.spec.type == \"eks-pod-identity\"}"
      template:
        apiVersion: eks.services.k8s.aws/v1alpha1
        kind: PodIdentityAssociation
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMRole
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          clusterName: "${schema.spec.clusterName}"
          namespace: "${schema.spec.serviceAccountNamespace}"
          serviceAccount: "${schema.spec.serviceAccountName}"
          roleARN: "${role.status.?ackResourceMetadata.?arn.orValue(\"\")}"
