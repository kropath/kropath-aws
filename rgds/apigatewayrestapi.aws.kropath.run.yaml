              name: "${schema.metadata.name}-res-${(entry.res.parentPath != '' ? entry.res.parentPath + '.' + entry.res.pathPart : entry.res.pathPart).lowerAscii().replace('{','').replace('}','').replace('.','-')}"
          responseModels: ${entry.mr.responseModels}
          # responseParameters omitted: ACK expects map[string]boolean but RGD schema uses map[string]string (known limitation)
