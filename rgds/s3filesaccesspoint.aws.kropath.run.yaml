---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: s3filesaccesspoint.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: S3FilesAccessPoint
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      # Naming exemption (KRO-236): S3FilesAccessPoint has no provider name field.
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      fileSystemID: string | default=""
      fileSystemRef: string | default=""
      posixUser:
        uid: integer | default=0
        gid: integer | default=0
        secondaryGIDs: "[]integer | default=[]"
      rootDirectory:
        path: string | default=""
        creationPermissions:
          ownerUID: integer | default=0
          ownerGID: integer | default=0
          permissions: string | default=""
    status:
      accessPointID: >-
        ${accessPoint.?status.?accessPointID.orValue("")}
      conditions: >-
        ${accessPoint.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: AccessPointID
        type: string
        jsonPath: .status.accessPointID
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: S3AdvancedConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    - id: accessPoint
      template:
        apiVersion: s3files.services.k8s.aws/v1alpha1
        kind: AccessPoint
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          fileSystemID: ${schema.spec.fileSystemID}
          posixUser:
            uid: ${schema.spec.posixUser.uid}
            gid: ${schema.spec.posixUser.gid}
            secondaryGIDs: ${schema.spec.posixUser.secondaryGIDs}
          rootDirectory:
            path: ${schema.spec.rootDirectory.path}
            creationPermissions:
              ownerUID: ${schema.spec.rootDirectory.creationPermissions.ownerUID}
              ownerGID: ${schema.spec.rootDirectory.creationPermissions.ownerGID}
              permissions: ${schema.spec.rootDirectory.creationPermissions.permissions}
          # S3Files uses array tags: [{key, value}] — convert merged map to array.
          tags: >-
            ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})
              .transformList(k, v, {"key": k, "value": v})}
