---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awss3bucket.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSS3Bucket
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: 'string | default=""'
      deletionPolicy: string | default=retain
      region: 'string | default=""'
      tags: 'map[string]string | default={}'
      syncedLabels: 'map[string]string | default={}'
      syncedAnnotations: 'map[string]string | default={}'
      encryption:
        algorithm: 'string | default=""'
        kmsKeyArn: 'string | default=""'
        bucketKeyEnabled: boolean | default=true
      blockPublicAccess: boolean | default=true
      versioning: 'string | default=""'
      enforceHttpsOnly: boolean | default=false
      objectOwnership: string | default=BucketOwnerEnforced
    status:
      resourceName: >-
        ${schema.spec.nameOverride != ""
          ? schema.spec.nameOverride
          : ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
              ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
              : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate) != ""
              ? ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                  ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                  : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
                  .split("{tag.").transformList(i, part,
                    i == 0
                      ? part
                      : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                          .merge(schema.spec.tags)
                          .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                          .?[part.split("}")[0]].orValue("__MISSING__") == "__MISSING__"
                        ? "{tag." + part
                        : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                            .merge(schema.spec.tags)
                            .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                            .?[part.split("}")[0]].orValue("") +
                           (size(part.split("}")) > 1
                             ? part.split("}").slice(1, size(part.split("}"))).join("}")
                             : ""))))
                  .join("")
                  .replace("{name}", schema.metadata.name)
                  .replace("{namespace}", schema.metadata.namespace)
                  .replace("{account_id}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId != ""
                    ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId
                    : "")
                  .replace("{region}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region != ""
                    ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region
                    : "")
                  .replace("{configRef}", schema.spec.configRef)
                  .lowerAscii()
              : schema.metadata.name.lowerAscii())}
      namingStatus: >-
        ${schema.spec.nameOverride != ""
          ? "valid"
          : (((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
              ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
              : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate) != ""
              ? ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                  ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                  : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
                  .split("{tag.").transformList(i, part,
                    i == 0
                      ? part
                      : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                          .merge(schema.spec.tags)
                          .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                          .?[part.split("}")[0]].orValue("__MISSING__") == "__MISSING__"
                        ? "{tag." + part
                        : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                            .merge(schema.spec.tags)
                            .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                            .?[part.split("}")[0]].orValue("") +
                           (size(part.split("}")) > 1
                             ? part.split("}").slice(1, size(part.split("}"))).join("}")
                             : ""))))
                  .join("")
                  .replace("{name}", schema.metadata.name)
                  .replace("{namespace}", schema.metadata.namespace)
                  .replace("{account_id}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId != ""
                    ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId
                    : "")
                  .replace("{region}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region != ""
                    ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region
                    : "")
                  .replace("{configRef}", schema.spec.configRef)
                  .lowerAscii()
              : schema.metadata.name.lowerAscii()).contains("{")
            ? "invalid-unresolved-tokens"
            : "valid")}
      predictedArn: >-
        ${"arn:aws:s3:::" + (schema.spec.nameOverride != ""
          ? schema.spec.nameOverride
          : ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
              ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
              : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate) != ""
              ? ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                  ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                  : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
                  .split("{tag.").transformList(i, part,
                    i == 0
                      ? part
                      : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                          .merge(schema.spec.tags)
                          .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                          .?[part.split("}")[0]].orValue("__MISSING__") == "__MISSING__"
                        ? "{tag." + part
                        : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                            .merge(schema.spec.tags)
                            .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                            .?[part.split("}")[0]].orValue("") +
                           (size(part.split("}")) > 1
                             ? part.split("}").slice(1, size(part.split("}"))).join("}")
                             : ""))))
                  .join("")
                  .replace("{name}", schema.metadata.name)
                  .replace("{namespace}", schema.metadata.namespace)
                  .replace("{account_id}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId != ""
                    ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId
                    : "")
                  .replace("{region}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region != ""
                    ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region
                    : "")
                  .replace("{configRef}", schema.spec.configRef)
                  .lowerAscii()
              : schema.metadata.name.lowerAscii())}

  resources:
    - id: bucket
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro",
              "app.kubernetes.io/instance": schema.metadata.name}
              .merge((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.syncedLabels
                .merge(schema.spec.syncedLabels)
                .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.syncedLabels))
                .transformMapEntry(k, v, {("kropath.run/" + k): v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.syncedAnnotations
                .merge(schema.spec.syncedAnnotations)
                .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.syncedAnnotations))
                .transformMapEntry(k, v, {("kropath.run/" + k): v}))}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: >-
            ${schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                  ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                  : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate) != ""
                  ? ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                      ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                      : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
                      .split("{tag.").transformList(i, part,
                        i == 0
                          ? part
                          : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                              .merge(schema.spec.tags)
                              .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                              .?[part.split("}")[0]].orValue("__MISSING__") == "__MISSING__"
                            ? "{tag." + part
                            : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                                .merge(schema.spec.tags)
                                .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                                .?[part.split("}")[0]].orValue("") +
                               (size(part.split("}")) > 1
                                 ? part.split("}").slice(1, size(part.split("}"))).join("}")
                                 : ""))))
                      .join("")
                      .replace("{name}", schema.metadata.name)
                      .replace("{namespace}", schema.metadata.namespace)
                      .replace("{account_id}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId != ""
                        ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId
                        : "")
                      .replace("{region}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region != ""
                        ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region
                        : "")
                      .replace("{configRef}", schema.spec.configRef)
                      .lowerAscii()
                  : schema.metadata.name.lowerAscii())}
          createBucketConfiguration: >-
            ${schema.spec.region != "" && schema.spec.region != "us-east-1"
              ? {"locationConstraint": schema.spec.region}
              : null}
          encryption: >-
            ${((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.encryptionAlgorithm != ""
                 ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.encryptionAlgorithm
                 : (schema.spec.encryption.algorithm != ""
                     ? schema.spec.encryption.algorithm
                     : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.encryptionAlgorithm != ""
                         ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.encryptionAlgorithm
                         : "aws:kms"))) != ""
              ? {"rules": [{
                  "applyServerSideEncryptionByDefault":
                    (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.encryptionAlgorithm != ""
                      ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.encryptionAlgorithm
                      : (schema.spec.encryption.algorithm != ""
                          ? schema.spec.encryption.algorithm
                          : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.encryptionAlgorithm != ""
                              ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.encryptionAlgorithm
                              : "aws:kms"))) == "aws:kms"
                      ? ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.kmsKeyArn != ""
                          ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.kmsKeyArn
                          : (schema.spec.encryption.kmsKeyArn != ""
                              ? schema.spec.encryption.kmsKeyArn
                              : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.kmsKeyArn)) != ""
                          ? {
                              "sseAlgorithm": "aws:kms",
                              "kmsMasterKeyID": (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.kmsKeyArn != ""
                                ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.kmsKeyArn
                                : (schema.spec.encryption.kmsKeyArn != ""
                                    ? schema.spec.encryption.kmsKeyArn
                                    : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.kmsKeyArn))
                            }
                          : {"sseAlgorithm": "aws:kms"})
                      : {"sseAlgorithm": "AES256"},
                  "bucketKeyEnabled": schema.spec.encryption.bucketKeyEnabled
              }]}
              : null}
          publicAccessBlock: >-
            ${(schema.spec.configRef == "public-datasets"
              ? false
              : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.blockPublicAccess == null
                  ? (schema.spec.blockPublicAccess
                      ? true
                      : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.blockPublicAccess)
                  : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.blockPublicAccess))
              ? {
                  "blockPublicACLs": true,
                  "blockPublicPolicy": true,
                  "ignorePublicACLs": true,
                  "restrictPublicBuckets": true
                }
              : null}
          versioning: >-
            ${(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.versioning != ""
              ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.versioning
              : (schema.spec.versioning != ""
                  ? schema.spec.versioning
                  : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.versioning)) != ""
              ? {"status": (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.versioning != ""
                  ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.versioning
                  : (schema.spec.versioning != ""
                      ? schema.spec.versioning
                      : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.versioning))}
              : null}
          policy: >-
            ${resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.enforceHttpsOnly == null
              ? (schema.spec.enforceHttpsOnly
                  ? true
                  : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.enforceHttpsOnly)
              : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.enforceHttpsOnly
            }
              ? "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"DenyNonTLSAccess\",\"Effect\":\"Deny\",\"Principal\":\"*\",\"Action\":\"s3:*\",\"Resource\":[\"arn:aws:s3:::%s\",\"arn:aws:s3:::%s/*\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":\"false\"}}}]}"
                .format([
                  schema.spec.nameOverride != ""
                    ? schema.spec.nameOverride
                    : ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                        ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                        : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate) != ""
                        ? ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                            ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                            : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
                            .split("{tag.").transformList(i, part,
                              i == 0
                                ? part
                                : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                                    .merge(schema.spec.tags)
                                    .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                                    .?[part.split("}")[0]].orValue("__MISSING__") == "__MISSING__"
                                  ? "{tag." + part
                                  : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                                      .merge(schema.spec.tags)
                                      .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                                      .?[part.split("}")[0]].orValue("") +
                                     (size(part.split("}")) > 1
                                       ? part.split("}").slice(1, size(part.split("}"))).join("}")
                                       : ""))))
                            .join("")
                            .replace("{name}", schema.metadata.name)
                            .replace("{namespace}", schema.metadata.namespace)
                            .replace("{account_id}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId != ""
                              ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId
                              : "")
                            .replace("{region}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region != ""
                              ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region
                              : "")
                            .replace("{configRef}", schema.spec.configRef)
                            .lowerAscii()
                        : schema.metadata.name.lowerAscii())),
                  schema.spec.nameOverride != ""
                    ? schema.spec.nameOverride
                    : ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                        ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                        : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate) != ""
                        ? ((resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate != ""
                            ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.namingTemplate
                            : resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.namingTemplate)
                            .split("{tag.").transformList(i, part,
                              i == 0
                                ? part
                                : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                                    .merge(schema.spec.tags)
                                    .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                                    .?[part.split("}")[0]].orValue("__MISSING__") == "__MISSING__"
                                  ? "{tag." + part
                                  : (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags
                                      .merge(schema.spec.tags)
                                      .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags)
                                      .?[part.split("}")[0]].orValue("") +
                                     (size(part.split("}")) > 1
                                       ? part.split("}").slice(1, size(part.split("}"))).join("}")
                                       : ""))))
                            .join("")
                            .replace("{name}", schema.metadata.name)
                            .replace("{namespace}", schema.metadata.namespace)
                            .replace("{account_id}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId != ""
                              ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.accountId
                              : "")
                            .replace("{region}", resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region != ""
                              ? resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.aws.region
                              : "")
                            .replace("{configRef}", schema.spec.configRef)
                            .lowerAscii()
                        : schema.metadata.name.lowerAscii()))
                ])
              : ""}
          tagging: >-
            ${{"tagSet": (resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.syncedLabels
              .merge(schema.spec.syncedLabels)
              .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.syncedLabels)
              .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.syncedAnnotations)
              .merge(schema.spec.syncedAnnotations)
              .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.syncedAnnotations)
              .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.mandatory.tags)
              .merge(schema.spec.tags)
              .merge(resources.get(schema.metadata.namespace, "AWSS3Config", schema.spec.configRef).status.effectiveConfig.defaults.tags))
              .transformList(key, value, {"key": key, "value": value})}}
          objectOwnership: ${schema.spec.objectOwnership}
          ownershipControls:
            rules:
              - objectOwnership: ${schema.spec.objectOwnership}
