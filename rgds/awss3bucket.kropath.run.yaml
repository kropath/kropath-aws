---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awss3bucket.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSS3Bucket
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: 'string | default=""'
      deletionPolicy: string | default=retain
      region: 'string | default=""'
      tags: 'map[string]string | default={}'
      syncedLabels: 'map[string]string | default={}'
      syncedAnnotations: 'map[string]string | default={}'
      encryption:
        algorithm: 'string | default=""'
        kmsKeyArn: 'string | default=""'
        bucketKeyEnabled: boolean | default=true
      blockPublicAccess: boolean | default=true
      versioning: 'string | default=""'
      enforceHttpsOnly: boolean | default=false
      objectOwnership: string | default=BucketOwnerEnforced
    status:
      resourceName: >-
        ${bucket.spec.name}
      namingStatus: >-
        ${bucket.spec.name.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      predictedArn: >-
        ${"arn:aws:s3:::" + bucket.spec.name}

  resources:
    - id: config
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSS3Config
        metadata:
          name: ${schema.spec.configRef}
          namespace: ${schema.metadata.namespace}

    - id: bucket
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro",
              "app.kubernetes.io/instance": schema.metadata.name}
              .merge((config.status.effectiveConfig.mandatory.syncedLabels
                .merge(schema.spec.syncedLabels)
                .merge(config.status.effectiveConfig.defaults.syncedLabels))
                .transformMapEntry(k, v, {("kropath.run/" + k): v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((config.status.effectiveConfig.mandatory.syncedAnnotations
                .merge(schema.spec.syncedAnnotations)
                .merge(config.status.effectiveConfig.defaults.syncedAnnotations))
                .transformMapEntry(k, v, {("kropath.run/" + k): v}))}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: >-
            ${schema.spec.nameOverride != ""
              ? schema.spec.nameOverride.lowerAscii()
              : (config.status.effectiveConfig.mandatory.namingTemplate != ""
                  ? config.status.effectiveConfig.mandatory.namingTemplate
                  : config.status.effectiveConfig.defaults.namingTemplate) != ""
                ? (config.status.effectiveConfig.mandatory.namingTemplate != ""
                    ? config.status.effectiveConfig.mandatory.namingTemplate
                    : config.status.effectiveConfig.defaults.namingTemplate)
                    .replace("{name}", schema.metadata.name)
                    .replace("{namespace}", schema.metadata.namespace)
                    .replace("{account_id}", config.status.effectiveConfig.aws.accountId != ""
                      ? config.status.effectiveConfig.aws.accountId
                      : "")
                    .replace("{region}", config.status.effectiveConfig.aws.region != ""
                      ? config.status.effectiveConfig.aws.region
                      : "")
                    .replace("{configRef}", schema.spec.configRef)
                    .lowerAscii()
                : schema.metadata.name.lowerAscii()}
          createBucketConfiguration: >-
            ${schema.spec.region != "" && schema.spec.region != "us-east-1"
              ? {"locationConstraint": schema.spec.region}
              : {}}
          encryption: >-
            ${(config.status.effectiveConfig.mandatory.encryptionAlgorithm != ""
                 ? config.status.effectiveConfig.mandatory.encryptionAlgorithm
                 : (schema.spec.encryption.algorithm != ""
                     ? schema.spec.encryption.algorithm
                     : (config.status.effectiveConfig.defaults.encryptionAlgorithm != ""
                         ? config.status.effectiveConfig.defaults.encryptionAlgorithm
                         : "aws:kms"))) != ""
              ? {"rules": [{
                  "applyServerSideEncryptionByDefault":
                    (config.status.effectiveConfig.mandatory.encryptionAlgorithm != ""
                      ? config.status.effectiveConfig.mandatory.encryptionAlgorithm
                      : (schema.spec.encryption.algorithm != ""
                          ? schema.spec.encryption.algorithm
                          : (config.status.effectiveConfig.defaults.encryptionAlgorithm != ""
                              ? config.status.effectiveConfig.defaults.encryptionAlgorithm
                              : "aws:kms"))) == "aws:kms"
                      ? ((config.status.effectiveConfig.mandatory.kmsKeyArn != ""
                          ? config.status.effectiveConfig.mandatory.kmsKeyArn
                          : (schema.spec.encryption.kmsKeyArn != ""
                              ? schema.spec.encryption.kmsKeyArn
                              : config.status.effectiveConfig.defaults.kmsKeyArn)) != ""
                          ? {
                              "sseAlgorithm": "aws:kms",
                              "kmsMasterKeyID": (config.status.effectiveConfig.mandatory.kmsKeyArn != ""
                                ? config.status.effectiveConfig.mandatory.kmsKeyArn
                                : (schema.spec.encryption.kmsKeyArn != ""
                                    ? schema.spec.encryption.kmsKeyArn
                                    : config.status.effectiveConfig.defaults.kmsKeyArn))
                            }
                          : {"sseAlgorithm": "aws:kms"})
                      : {"sseAlgorithm": "AES256"},
                  "bucketKeyEnabled": schema.spec.encryption.bucketKeyEnabled
              }]}
              : {}}
          publicAccessBlock: >-
            ${(config.status.effectiveConfig.mandatory.blockPublicAccess == null
                ? (schema.spec.blockPublicAccess
                    ? true
                    : config.status.effectiveConfig.defaults.blockPublicAccess)
                : config.status.effectiveConfig.mandatory.blockPublicAccess)
              ? {
                  "blockPublicACLs": true,
                  "blockPublicPolicy": true,
                  "ignorePublicACLs": true,
                  "restrictPublicBuckets": true
                }
              : {}}
          versioning: >-
            ${(config.status.effectiveConfig.mandatory.versioning != ""
              ? config.status.effectiveConfig.mandatory.versioning
              : (schema.spec.versioning != ""
                  ? schema.spec.versioning
                  : config.status.effectiveConfig.defaults.versioning)) != ""
              ? {"status": (config.status.effectiveConfig.mandatory.versioning != ""
                  ? config.status.effectiveConfig.mandatory.versioning
                  : (schema.spec.versioning != ""
                      ? schema.spec.versioning
                      : config.status.effectiveConfig.defaults.versioning))}
              : {}}
          policy: >-
            ${(config.status.effectiveConfig.mandatory.enforceHttpsOnly == null
                ? (schema.spec.enforceHttpsOnly
                    ? true
                    : config.status.effectiveConfig.defaults.enforceHttpsOnly)
                : config.status.effectiveConfig.mandatory.enforceHttpsOnly)
              ? "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"DenyNonTLSAccess\",\"Effect\":\"Deny\",\"Principal\":\"*\",\"Action\":\"s3:*\",\"Resource\":[\"arn:aws:s3:::%s\",\"arn:aws:s3:::%s/*\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":\"false\"}}}]}"
                .format([
                  (schema.spec.nameOverride != ""
                    ? schema.spec.nameOverride.lowerAscii()
                    : (config.status.effectiveConfig.mandatory.namingTemplate != ""
                        ? config.status.effectiveConfig.mandatory.namingTemplate
                        : config.status.effectiveConfig.defaults.namingTemplate) != ""
                      ? (config.status.effectiveConfig.mandatory.namingTemplate != ""
                          ? config.status.effectiveConfig.mandatory.namingTemplate
                          : config.status.effectiveConfig.defaults.namingTemplate)
                          .replace("{name}", schema.metadata.name)
                          .replace("{namespace}", schema.metadata.namespace)
                          .replace("{account_id}", config.status.effectiveConfig.aws.accountId != ""
                            ? config.status.effectiveConfig.aws.accountId
                            : "")
                          .replace("{region}", config.status.effectiveConfig.aws.region != ""
                            ? config.status.effectiveConfig.aws.region
                            : "")
                          .replace("{configRef}", schema.spec.configRef)
                          .lowerAscii()
                      : schema.metadata.name.lowerAscii()),
                  (schema.spec.nameOverride != ""
                    ? schema.spec.nameOverride.lowerAscii()
                    : (config.status.effectiveConfig.mandatory.namingTemplate != ""
                        ? config.status.effectiveConfig.mandatory.namingTemplate
                        : config.status.effectiveConfig.defaults.namingTemplate) != ""
                      ? (config.status.effectiveConfig.mandatory.namingTemplate != ""
                          ? config.status.effectiveConfig.mandatory.namingTemplate
                          : config.status.effectiveConfig.defaults.namingTemplate)
                          .replace("{name}", schema.metadata.name)
                          .replace("{namespace}", schema.metadata.namespace)
                          .replace("{account_id}", config.status.effectiveConfig.aws.accountId != ""
                            ? config.status.effectiveConfig.aws.accountId
                            : "")
                          .replace("{region}", config.status.effectiveConfig.aws.region != ""
                            ? config.status.effectiveConfig.aws.region
                            : "")
                          .replace("{configRef}", schema.spec.configRef)
                          .lowerAscii()
                      : schema.metadata.name.lowerAscii())
                ])
              : ""}
          tagging: >-
            ${{"tagSet": (config.status.effectiveConfig.mandatory.syncedLabels
              .merge(schema.spec.syncedLabels)
              .merge(config.status.effectiveConfig.defaults.syncedLabels)
              .merge(config.status.effectiveConfig.mandatory.syncedAnnotations)
              .merge(schema.spec.syncedAnnotations)
              .merge(config.status.effectiveConfig.defaults.syncedAnnotations)
              .merge(config.status.effectiveConfig.mandatory.tags)
              .merge(schema.spec.tags)
              .merge(config.status.effectiveConfig.defaults.tags))
              .transformList(key, value, {"key": key, "value": value})}}
          objectOwnership: ${schema.spec.objectOwnership}
          ownershipControls:
            rules:
              - objectOwnership: ${schema.spec.objectOwnership}
