---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awsiampolicy.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSIAMPolicy
    scope: Namespaced
    spec:
      configRef: string | default="general-policy"
      description: string | default=""
      path: string | default="/"
      nameOverride: string | default=""
      deletionPolicy: string | default="retain"
      documentJSON: string | default=""
      documentRef: string | default=""
      tags: object | default={}
      syncedLabels: object | default={}
      syncedAnnotations: object | default={}
    status:
      resourceName: >-
        ${(schema.spec.nameOverride != ""
          ? schema.spec.nameOverride
          : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
              ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
              : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != ""
            ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                : rsrcCfg.status.effectiveConfig.defaults.namingTemplate)
                .split("{tag.")
                .transformList(i, part,
                  i == 0 ? part
                    : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split("}")[0]].orValue("")
                        + (size(part.split("}")) > 1
                          ? part.split("}").slice(1, size(part.split("}"))).join("}")
                          : "")))
                .join("")
                .replace("{name}", schema.metadata.name)
                .replace("{namespace}", schema.metadata.namespace)
                .replace("{account_id}", rsrcCfg.status.effectiveConfig.aws.accountId ?? "")
                .replace("{region}", rsrcCfg.status.effectiveConfig.aws.region ?? "")
                .replace("{configRef}", schema.spec.configRef)
            : schema.metadata.name)}
      namingStatus: >-
        ${!(schema.spec.nameOverride != ""
          ? schema.spec.nameOverride
          : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
              ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
              : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != ""
            ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                : rsrcCfg.status.effectiveConfig.defaults.namingTemplate)
                .split("{tag.")
                .transformList(i, part,
                  i == 0 ? part
                    : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split("}")[0]].orValue("")
                        + (size(part.split("}")) > 1
                          ? part.split("}").slice(1, size(part.split("}"))).join("}")
                          : "")))
                .join("")
                .replace("{name}", schema.metadata.name)
                .replace("{namespace}", schema.metadata.namespace)
                .replace("{account_id}", rsrcCfg.status.effectiveConfig.aws.accountId ?? "")
                .replace("{region}", rsrcCfg.status.effectiveConfig.aws.region ?? "")
                .replace("{configRef}", schema.spec.configRef)
            : schema.metadata.name).contains("{")) ? "valid" : "invalid-unresolved-tokens"}
      predictedArn: >-
        ${"arn:aws:iam::" + rsrcCfg.status.effectiveConfig.aws.accountId + ":policy" + schema.spec.path + (schema.spec.nameOverride != ""
          ? schema.spec.nameOverride
          : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
              ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
              : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != ""
            ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                : rsrcCfg.status.effectiveConfig.defaults.namingTemplate)
                .split("{tag.")
                .transformList(i, part,
                  i == 0 ? part
                    : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split("}")[0]].orValue("")
                        + (size(part.split("}")) > 1
                          ? part.split("}").slice(1, size(part.split("}"))).join("}")
                          : "")))
                .join("")
                .replace("{name}", schema.metadata.name)
                .replace("{namespace}", schema.metadata.namespace)
                .replace("{account_id}", rsrcCfg.status.effectiveConfig.aws.accountId ?? "")
                .replace("{region}", rsrcCfg.status.effectiveConfig.aws.region ?? "")
                .replace("{configRef}", schema.spec.configRef)
            : schema.metadata.name)}
      arn: "${policy.status.ackResourceMetadata.arn}"
      policyId: "${policy.status.policyID}"
      conditions: "${policy.status.conditions}"
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSIAMConfig
        metadata:
          name: ${schema.spec.configRef}
          namespace: ${schema.metadata.namespace}
    - id: policyDoc
      includeWhen:
        - "${schema.spec.documentRef != \"\"}"
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSPolicyDocument
        metadata:
          name: ${schema.spec.documentRef}
          namespace: ${schema.metadata.namespace}
    - id: policy
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Policy
        metadata:
          name: "${metadata.name}"
          namespace: "${metadata.namespace}"
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": metadata.name}
              + (rsrcCfg.status.effectiveConfig.mandatory.syncedLabels + schema.spec.syncedLabels + rsrcCfg.status.effectiveConfig.defaults.syncedLabels)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              + (rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations + schema.spec.syncedAnnotations + rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMPolicy
              name: ${metadata.name}
              uid: ${metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                  ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                  : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != ""
                ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                    ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                    : rsrcCfg.status.effectiveConfig.defaults.namingTemplate)
                    .split("{tag.")
                    .transformList(i, part,
                      i == 0 ? part
                        : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split("}")[0]].orValue("")
                            + (size(part.split("}")) > 1
                              ? part.split("}").slice(1, size(part.split("}"))).join("}")
                              : "")))
                    .join("")
                    .replace("{name}", schema.metadata.name)
                    .replace("{namespace}", schema.metadata.namespace)
                    .replace("{account_id}", rsrcCfg.status.effectiveConfig.aws.accountId ?? "")
                    .replace("{region}", rsrcCfg.status.effectiveConfig.aws.region ?? "")
                    .replace("{configRef}", schema.spec.configRef)
                : schema.metadata.name)}
          path: "${schema.spec.path}"
          description: "${schema.spec.description}"
          policyDocument: >-
            ${schema.spec.documentRef != ""
              ? policyDoc.spec.documentJSON
              : schema.spec.documentJSON}
          tags: >-
            ${((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags)
              + (rsrcCfg.status.effectiveConfig.mandatory.syncedLabels + schema.spec.syncedLabels + rsrcCfg.status.effectiveConfig.defaults.syncedLabels)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})
              + (rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations + schema.spec.syncedAnnotations + rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})).transformList(k, v, {key: k, value: v})}
