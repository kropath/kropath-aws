# aws-kms-03 — KMSGrant. Wraps ACK kms.services.k8s.aws/Grant.
#
# Naming exemption (KRO-236): a KMS grant has no cloud resource name — it is
# identified by an AWS-assigned grant ID and grant token. No effectiveName,
# nameOverride, resourceName, predictedArn, or namingStatus (AC-21).
#
# Variant-split for conditional field presence (KRO-928 / docs/frequent-rgd-errors.md
# §"optional.none() in Write Position Is Rejected"): kro v0.9.2 cannot omit a field
# from a single template at render time — omission is only achievable by putting the
# field in a separate `includeWhen`-gated template variant. `retiringPrincipal`
# (2 states) x `constraints` presence (4 states: neither / equals-only / subset-only /
# both) = 8 mutually exclusive ACK Grant variants below. Each renders a fully static
# spec — the optional keys are present in the YAML structure only for the variants
# that need them, never as a `""`/`{}` fallback (docs/frequent-rgd-errors.md §"Empty-
# Value Rejection", engineering-standards.md §7).
#
# Deviation from the spec doc (flagged on the Multica issue, Knowledge Source
# Precedence KRO-623):
#   1. AC-3/AC-4/AC-9 ask for `x-kubernetes-validations` rejection. kro v0.9.2
#      regenerates the RGD-derived CRD on every apply and cannot preserve hand-
#      authored `x-kubernetes-validations` (docs/frequent-rgd-errors.md
#      §"x-kubernetes-validations Cannot Be Auto-Generated by kro v0.9.2"). Uses the
#      established in-graph ConfigMap advisory + status.validationError substitute
#      instead (rgds/kmskey.yaml AC-8, rgds/dsqlcluster.aws.kropath.run.yaml). AC-17
#      (KMSConfig-level, a hand-authored CRD) *is* real rejection — already shipped by
#      KRO-1233.
#   2. AC-30 asks for an unresolvable configRef to fall through to general-policy.
#      ADR-015 §4.4/§5.2 states RGDs carry no fallback chain for missing input config
#      CRs — a single externalRef lookup, tier empty when it does not resolve. Every
#      existing RGD in this repo follows that (single lookup, `.orValue("general-
#      policy")` only for an *empty* configRef). Implemented per ADR-015: an
#      unresolvable configRef makes the governance tier empty, not a second lookup.
#   3. AC-5 asks for "no ACK Grant child CR until keySrc.status.keyID resolves".
#      Gating child existence (includeWhen) on a sibling KMSKey CR's observed status
#      is the exact hazard kropath-core/docs/checklists/pre-review.md's "includeWhen
#      graph-read safety check" prohibits (KRO-919) — flagged in Implementation
#      Reviewer's PR #311 review. childShouldExist is schema/resolved-config-only;
#      the Grant CR now renders as soon as the KMSGrant CR itself is valid, and an
#      unresolved keyRef degrades the rendered keyID to "" (status.resolvedKeyID
#      mirrors it) instead of withholding the child. Same tradeoff already accepted
#      for rgds/acmprivatecertificate.aws.kropath.run.yaml's certificateAuthorityRef.
#
# Config lookup: selector.matchLabels (Theme 28 / KRO-221) — CEL not evaluated in
# externalRef.metadata.name. rsrcCfg/keySrc/ackGrantRef are lists; always guard with
# .size() > 0 before indexing [0].
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: kmsgrant.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: KMSGrant
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # Key reference — exactly one of keyRef / keyArn (advisory-enforced, see header).
      keyRef: string | default=""
      keyArn: string | default=""
      # Grant properties.
      granteePrincipal: string | required=true
      retiringPrincipal: string | default=""
      operations: "[]string | required=true"
      # Idempotency token forwarded to ACK Grant spec.name — NOT a cloud resource name.
      grantName: string | default=""
      constraints:
        encryptionContextEquals: map[string]string | default={}
        encryptionContextSubset: map[string]string | default={}
    status:
      grantID: >-
        ${ackGrantRef.size() > 0 ? ackGrantRef[0].?status.?grantID.orValue("") : ""}
      grantToken: >-
        ${ackGrantRef.size() > 0 ? ackGrantRef[0].?status.?grantToken.orValue("") : ""}
      resolvedKeyID: >-
        ${gate.data.resolvedKeyID}
      # Operations dropped by the allowedGrantOperations allowlist filter (AC-13/14).
      # Empty when nothing was dropped (no allowlist, or full request already allowed).
      droppedOperations: >-
        ${gate.data.droppedOperationsJoined != "" ? gate.data.droppedOperationsJoined.split(",") : []}
      # Non-empty when the CR is invalid or the allowlist intersection is empty
      # (AC-3/AC-4/AC-9/AC-16) — the advisory substitute for x-kubernetes-validations,
      # see header. Empty string means no validation error.
      validationError: >-
        ${gate.data.validationError}
      # docs/frequent-rgd-errors.md §"conditions is reserved the same way (KRO-1245)":
      # kro overwrites the parent's status.conditions with its own control-plane
      # conditions regardless of this CEL; kept only for convention parity with
      # sibling RGDs. status.validationError / droppedOperations are the fields
      # Chainsaw actually asserts against for grant-level validation signals.
      conditions: >-
        ${ackGrantRef.size() > 0 ? ackGrantRef[0].?status.?conditions.orValue([]) : []}
    additionalPrinterColumns:
      - name: GrantID
        type: string
        jsonPath: .status.grantID
      - name: ResolvedKeyID
        type: string
        jsonPath: .status.resolvedKeyID
      - name: ValidationError
        type: string
        jsonPath: .status.validationError
  resources:
    # Single governance config lookup — controller pre-merges all cascade layers
    # (ADR-010 D-1). Deviation #2 (header): no fallback hop when configRef does not
    # resolve — rsrcCfg.size() == 0 and every rsrcCfg-derived value below degrades to
    # its "tier empty" branch (ADR-015 §4.4).
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: KMSConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # KMSKey lookup via sentinel label selector (docs/frequent-rgd-errors.md §"The
    # Unbound Variable Freeze") — always list-bound as [] when keyRef is empty, never
    # excluded from the graph.
    - id: keySrc
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: KMSKey
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.keyRef != "" ? schema.spec.keyRef : "kro-empty-fallback-sentinel"}'

    # Always-bound self-lookup of this instance's own ACK Grant child, by the
    # app.kubernetes.io/instance label every variant sets identically. Required
    # because status cannot name more than one includeWhen-gated resource id
    # (docs/frequent-rgd-errors.md §"Variant-Split Resources Freeze Combined Status
    # Expressions") — an externalRef is never excluded, so status stays stable no
    # matter which of the 8 variants fired.
    - id: ackGrantRef
      externalRef:
        apiVersion: kms.services.k8s.aws/v1alpha1
        kind: Grant
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              app.kubernetes.io/instance: ${schema.metadata.name}

    # In-graph advisory ConfigMap — always included (never includeWhen-gated), so
    # every field on it is a stable, always-bound value every variant and the status
    # block can read. Computes the operations-allowlist resolution, key resolution,
    # idempotency name, the child-existence gate, and the combined validationError
    # message (advisory substitute for x-kubernetes-validations — see header).
    - id: gate
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-gate
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: KMSGrant
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          resolvedKeyID: >-
            ${schema.spec.keyArn != "" ? schema.spec.keyArn : (keySrc.size() > 0 ? keySrc[0].?status.?keyID.orValue("") : "")}
          resolvedGrantName: >-
            ${schema.spec.grantName != "" ? schema.spec.grantName : schema.metadata.namespace + "-" + schema.metadata.name}
          # AO (allowedOps) inline: mandatory tier wins when non-empty, else defaults
          # tier, else no restriction. Repeated per-field (no cross-field CEL variables
          # inside one resource template — repo convention, see rgds/kmskey.yaml).
          resolvedOperationsJoined: >-
            ${schema.spec.operations.filter(op,
                size((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && size(rsrcCfg[0].status.effectiveConfig.mandatory.?allowedGrantOperations.orValue([])) > 0)
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.allowedGrantOperations
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults))
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?allowedGrantOperations.orValue([])
                      : [])) == 0
                || op in ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && size(rsrcCfg[0].status.effectiveConfig.mandatory.?allowedGrantOperations.orValue([])) > 0)
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.allowedGrantOperations
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults))
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?allowedGrantOperations.orValue([])
                      : []))
              ).join(",")}
          droppedOperationsJoined: >-
            ${schema.spec.operations.filter(op,
                size((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && size(rsrcCfg[0].status.effectiveConfig.mandatory.?allowedGrantOperations.orValue([])) > 0)
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.allowedGrantOperations
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults))
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?allowedGrantOperations.orValue([])
                      : [])) > 0
                && !(op in ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && size(rsrcCfg[0].status.effectiveConfig.mandatory.?allowedGrantOperations.orValue([])) > 0)
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.allowedGrantOperations
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults))
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?allowedGrantOperations.orValue([])
                      : [])))
              ).join(",")}
          # "Exactly one of keyRef/keyArn" via XOR ternary, ANDed with operations
          # non-empty and the allowlist intersection non-empty (AC-16). Advisory
          # substitute for x-kubernetes-validations. Deliberately schema/resolved-
          # config-only (KRO-919 / kropath-core/docs/checklists/pre-review.md
          # "includeWhen graph-read safety check") — does NOT read keySrc here. A
          # gate used as includeWhen must never depend on an independently-
          # lifecycled sibling CR's observed status: if it did, deleting the
          # referenced KMSKey while a KMSGrant still exists would flip this false
          # on the next reconcile, and kro would try to un-render an already-
          # materialized variant, which is the exact "hangs in DELETING holding
          # kro.run/finalizer" failure mode KRO-919 documents. keySrc is read only
          # in the resolvedKeyID *value* below (template-value position, not a
          # structural gate) so an unresolved/vanished key degrades the rendered
          # keyID to "" instead of toggling the child's existence — mirrors
          # rgds/acmprivatecertificate.aws.kropath.run.yaml's caRefCr handling and
          # the redrivePolicy fix in docs/troubleshooting-logs/2026-09-24-
          # snssubscription-includewhen-graph-read-unsafe.md.
          childShouldExist: >-
            ${((schema.spec.keyRef == "" ? schema.spec.keyArn != "" : schema.spec.keyArn == "")
                && size(schema.spec.operations) > 0
                && schema.spec.operations.filter(op,
                     size((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && size(rsrcCfg[0].status.effectiveConfig.mandatory.?allowedGrantOperations.orValue([])) > 0)
                       ? rsrcCfg[0].status.effectiveConfig.mandatory.allowedGrantOperations
                       : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults))
                           ? rsrcCfg[0].status.effectiveConfig.defaults.?allowedGrantOperations.orValue([])
                           : [])) == 0
                     || op in ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && size(rsrcCfg[0].status.effectiveConfig.mandatory.?allowedGrantOperations.orValue([])) > 0)
                       ? rsrcCfg[0].status.effectiveConfig.mandatory.allowedGrantOperations
                       : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults))
                           ? rsrcCfg[0].status.effectiveConfig.defaults.?allowedGrantOperations.orValue([])
                           : []))
                   ).size() > 0)
              ? "true" : "false"}
          validationError: >-
            ${(schema.spec.keyRef != "" && schema.spec.keyArn != "")
                ? "keyRef and keyArn are mutually exclusive"
                : ((schema.spec.keyRef == "" && schema.spec.keyArn == "")
                    ? "one of keyRef or keyArn is required"
                    : (size(schema.spec.operations) == 0
                        ? "operations must contain at least one entry"
                        : ((size((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && size(rsrcCfg[0].status.effectiveConfig.mandatory.?allowedGrantOperations.orValue([])) > 0)
                                ? rsrcCfg[0].status.effectiveConfig.mandatory.allowedGrantOperations
                                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults))
                                    ? rsrcCfg[0].status.effectiveConfig.defaults.?allowedGrantOperations.orValue([])
                                    : [])) > 0
                              && schema.spec.operations.filter(op,
                                   op in ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && size(rsrcCfg[0].status.effectiveConfig.mandatory.?allowedGrantOperations.orValue([])) > 0)
                                     ? rsrcCfg[0].status.effectiveConfig.mandatory.allowedGrantOperations
                                     : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults))
                                         ? rsrcCfg[0].status.effectiveConfig.defaults.?allowedGrantOperations.orValue([])
                                         : []))
                                 ).size() == 0)
                             ? "no requested operation in spec.operations is permitted by the allowedGrantOperations policy for this KMSConfig profile"
                             : "")))}

    # ────────────────────────────────────────────────────────────────────────────
    # ACK Grant CR — 8 mutually exclusive variants (see header). Every variant
    # shares the same metadata/labels/annotations/ownerReferences block and the same
    # 4 always-present spec fields (keyID, granteePrincipal, operations, name); they
    # differ only in which of retiringPrincipal/constraints keys are structurally
    # present. Tags are never forwarded (AC-23 — ACK Grant has no spec.tags field).
    # ────────────────────────────────────────────────────────────────────────────

    - id: grantNoRetireNoConstraints
      includeWhen:
        - '${gate.data.childShouldExist == "true"}'
        - '${schema.spec.retiringPrincipal == ""}'
        - '${size(schema.spec.?constraints.?encryptionContextEquals.orValue({})) == 0}'
        - '${size(schema.spec.?constraints.?encryptionContextSubset.orValue({})) == 0}'
      template:
        apiVersion: kms.services.k8s.aws/v1alpha1
        kind: Grant
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.tags.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: KMSGrant
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          keyID: ${gate.data.resolvedKeyID}
          granteePrincipal: ${schema.spec.granteePrincipal}
          operations: ${gate.data.resolvedOperationsJoined.split(",")}
          name: ${gate.data.resolvedGrantName}

    - id: grantNoRetireEqualsOnly
      includeWhen:
        - '${gate.data.childShouldExist == "true"}'
        - '${schema.spec.retiringPrincipal == ""}'
        - '${size(schema.spec.?constraints.?encryptionContextEquals.orValue({})) > 0}'
        - '${size(schema.spec.?constraints.?encryptionContextSubset.orValue({})) == 0}'
      template:
        apiVersion: kms.services.k8s.aws/v1alpha1
        kind: Grant
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.tags.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: KMSGrant
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          keyID: ${gate.data.resolvedKeyID}
          granteePrincipal: ${schema.spec.granteePrincipal}
          operations: ${gate.data.resolvedOperationsJoined.split(",")}
          name: ${gate.data.resolvedGrantName}
          constraints:
            encryptionContextEquals: ${schema.spec.?constraints.?encryptionContextEquals.orValue({})}

    - id: grantNoRetireSubsetOnly
      includeWhen:
        - '${gate.data.childShouldExist == "true"}'
        - '${schema.spec.retiringPrincipal == ""}'
        - '${size(schema.spec.?constraints.?encryptionContextEquals.orValue({})) == 0}'
        - '${size(schema.spec.?constraints.?encryptionContextSubset.orValue({})) > 0}'
      template:
        apiVersion: kms.services.k8s.aws/v1alpha1
        kind: Grant
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.tags.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}).transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
