---
# RDSParameterGroup RGD
#
# Composes: rds.services.k8s.aws/DBParameterGroup (ACK RDS Controller v1.10.2)
# ACK CRD cache: docs/crd-cache/aws/rds-controller-v1.10.2.md §DBParameterGroup
# Spec: kropath-core docs/specs/aws/aws-rds-06-rdsparametergroup.md
#
# Governance: Tags, syncedLabels, syncedAnnotations flow through RDSConfig
# effectiveConfig cascade (ADR-010). No parameter-group-specific governance
# fields (spec §"RDSConfig additions": none — spec.parameterOverrides is
# deliberately un-governed per spec OQ-1).
#
# Naming: effectiveName = {namespace}-{name} by default (overridable via
# spec.nameOverride or mandatory/defaults namingTemplate), .lowerAscii()
# applied as the final step — AWS stores DB parameter group names lowercase
# (same post-processing as rgds/elasticacheparametergroup.aws.kropath.run.yaml).
# Cloud resource name: ACK DBParameterGroup.spec.name.
#
# Predicted ARN format: arn:aws:rds:<region>:<accountId>:pg:<effectiveName>
#
# spec.family and spec.description are declared `required=true` so omitting
# either is rejected at admission (a real API-server "required" check). An
# *explicit* empty string ("") still satisfies OpenAPI presence — kro v0.9.2's
# SimpleSchema supports only `default`, `required`, `min`, `max` markers
# (`minLength`/`pattern`/`validation`/`immutable` are unsupported and make the
# RGD go Inactive — docs/frequent-rgd-errors.md §"| pattern= SimpleSchema
# Marker Is Unsupported in kro v0.9.2"), so a non-empty check cannot be
# expressed as CRD schema validation. The explicit-empty-string case is
# therefore handled with the in-graph ConfigMap advisory pattern (see
# validationErrorCm below): no ACK DBParameterGroup is created and
# status.validationError explains why — the same pattern already used by
# rgds/elasticacheparametergroup.aws.kropath.run.yaml (missingFamilyError) and
# rgds/dsqlcluster.aws.kropath.run.yaml (validationMsg). See docs/frequent-rgd-errors.md
# §"x-kubernetes-validations Cannot Be Auto-Generated by kro v0.9.2".
#
# spec.family is IMMUTABLE after creation per the spec. Per the same trap doc
# (§3 "Immutability after creation"), this is NOT enforced at admission time —
# ACK already rejects/ignores mutating updates to immutable fields at the AWS
# API layer. No in-graph ConfigMap is needed for immutability.
#
# spec.parameterOverrides must be rendered ABSENT (not `{}`) from the ACK CR
# when the developer omits it (spec AC-3). kro v0.9.2 cannot conditionally
# omit a single field within one resource template (KRO-928 — see
# docs/frequent-rgd-errors.md §"optional.none() in Write Position Is Rejected
# by kro v0.9.2"). Omission is only achievable at the resource level, so the
# ACK child is variant-split into ackParamGroupWithOverrides /
# ackParamGroupNoOverrides, mirroring rgds/dsqlcluster.aws.kropath.run.yaml's
# WithWitness/NoWitness split. Status fields that must stay stable across
# variants (parameterOverrideStatuses, conditions) use the always-bound
# self-lookup externalRef pattern (ackParamGroupRef) — see
# docs/frequent-rgd-errors.md §"Variant-Split Resources Freeze Combined
# Status Expressions".
#
# Tags: ACK DBParameterGroup.spec.tags is array<{key, value}> (not map).
# allCloudMetadata equivalent built inline via .merge() + .transformList().
#
# Config lookup: selector.matchLabels (Theme 28 / KRO-221) — CEL not evaluated
# in externalRef.metadata.name. rsrcCfg is a list; always guard with
# rsrcCfg.size() > 0 before indexing rsrcCfg[0].
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: rdsparametergroup.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: RDSParameterGroup
    scope: Namespaced
    spec:
      # Standard kropath governance fields
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # Engine family — required, IMMUTABLE after creation (ACK enforces; see
      # header comment). e.g. "mysql8.0", "postgres15".
      family: string | required=true
      # Human-readable description — required by ACK.
      description: string | required=true
      # Parameter overrides — deliberately un-governed (spec OQ-1); verbatim
      # passthrough. Rendered absent (not {}) on the ACK CR when omitted —
      # see the variant-split header comment above.
      parameterOverrides: map[string]string | default={}
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      predictedArn: >-
        ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.aws) && rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") != "" && rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") != "" && naming.data.effectiveName != "" && !naming.data.effectiveName.contains("{")
          ? "arn:aws:rds:" + rsrcCfg[0].status.effectiveConfig.aws.region + ":" + rsrcCfg[0].status.effectiveConfig.aws.accountId + ":pg:" + naming.data.effectiveName
          : ""}
      parameterOverrideStatuses: >-
        ${ackParamGroupRef.size() > 0 ? ackParamGroupRef[0].?status.?parameterOverrideStatuses.orValue([]) : []}
      validationError: >-
        ${validationErrorCm.data.error}
      conditions: >-
        ${ackParamGroupRef.size() > 0 ? ackParamGroupRef[0].?status.?conditions.orValue([]) : []}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn

  resources:
    # Single governance config lookup — controller pre-merges all cascade layers (ADR-010 D-1).
    # Uses selector.matchLabels (Theme 28/KRO-221) — CEL in externalRef.metadata.name is not evaluated.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: RDSConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ConfigMap that materialises effectiveName with full {tag.X} dynamic substitution support.
    # DB parameter group names must be lowercase — .lowerAscii() applied as final step.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RDSParameterGroup
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("{account_id}") : "{account_id}")
              .replace("{region}", (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("{region}") : "{region}")
              .replace("{configRef}", schema.spec.configRef)
              .lowerAscii())}

    # Advisory ConfigMap — always created (never includeWhen-gated, so status
    # can reference it directly with no Unbound Variable Freeze risk; see
    # rgds/dsqlcluster.aws.kropath.run.yaml validationMsg for the same shape).
    # data.error is "" when both required fields are non-empty.
    - id: validationErrorCm
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-validation-error
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RDSParameterGroup
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: >-
            ${schema.spec.family == ""
              ? "spec.family is required and must be non-empty"
              : (schema.spec.description == ""
                  ? "spec.description is required and must be non-empty"
                  : "")}

    # ACK DBParameterGroup CR — variant WITH parameterOverrides.
    # Only created when naming is valid, family/description are non-empty,
    # and at least one parameterOverrides entry is set.
    - id: ackParamGroupWithOverrides
      includeWhen:
        - '${!naming.data.effectiveName.contains("{") && schema.spec.family != "" && schema.spec.description != "" && size(schema.spec.parameterOverrides) > 0}'
      template:
        apiVersion: rds.services.k8s.aws/v1alpha1
        kind: DBParameterGroup
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RDSParameterGroup
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          # Engine family — required, immutable after creation (ACK enforces).
          family: ${schema.spec.family}
          # Description — required by ACK.
          description: ${schema.spec.description}
          # Cloud resource name — from effectiveName.
          name: ${naming.data.effectiveName}
          # Parameter overrides — verbatim passthrough; ACK validates individual parameter names
          # against spec.family at apply time.
          parameterOverrides: ${schema.spec.parameterOverrides}
          # Cloud resource tags — ACK DBParameterGroup spec.tags is array<{key, value}> (not map).
          # Merge order: defaults → instance spec → mandatory (mandatory wins on collision).
          tags: >-
            ${(((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {}))
              .transformList(k, v, {"key": k, "value": v})
              .sortBy(x, x.key)}

    # ACK DBParameterGroup CR — variant WITHOUT parameterOverrides.
    # Identical to the variant above except parameterOverrides is never rendered —
    # kro v0.9.2 cannot conditionally omit a single field within one template (KRO-928),
    # so absence is achieved by omitting the whole field from this variant instead.
    - id: ackParamGroupNoOverrides
      includeWhen:
        - '${!naming.data.effectiveName.contains("{") && schema.spec.family != "" && schema.spec.description != "" && size(schema.spec.parameterOverrides) == 0}'
      template:
        apiVersion: rds.services.k8s.aws/v1alpha1
        kind: DBParameterGroup
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RDSParameterGroup
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          # Engine family — required, immutable after creation (ACK enforces).
          family: ${schema.spec.family}
          # Description — required by ACK.
          description: ${schema.spec.description}
          # Cloud resource name — from effectiveName.
          name: ${naming.data.effectiveName}
          # parameterOverrides intentionally omitted — see variant-split header comment.
          # Cloud resource tags — ACK DBParameterGroup spec.tags is array<{key, value}> (not map).
          # Merge order: defaults → instance spec → mandatory (mandatory wins on collision).
          tags: >-
            ${(((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {}))
              .transformList(k, v, {"key": k, "value": v})
              .sortBy(x, x.key)}

    # Always-bound lookup of this instance's own ACK child, regardless of which
    # variant fired — see docs/frequent-rgd-errors.md §"Variant-Split Resources
    # Freeze Combined Status Expressions". Used only by the status block.
    - id: ackParamGroupRef
      externalRef:
        apiVersion: rds.services.k8s.aws/v1alpha1
        kind: DBParameterGroup
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              app.kubernetes.io/instance: ${schema.metadata.name}
