---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cognitouserpool.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: CognitoUserPool
    scope: Namespaced
    spec:
      # Standard governance fields
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}

      # Governed security fields (falls through to CognitoConfig cascade)
      mfaConfiguration: string | default=""
      smsAuthenticationMessage: string | default=""
      advancedSecurityMode: string | default=""
      deletionProtection: string | default=""

      # Password policy — per-sub-field cascade (OD-1 Option B).
      # Integer sub-fields: 0 = not set (fall through to governance).
      # Boolean sub-fields: bare boolean (no default) for pointer semantics —
      # kro materialises `| default=false` onto every instance, defeating has() detection.
      passwordPolicy:
        minimumLength: integer | default=0
        requireLowercase: boolean
        requireNumbers: boolean
        requireSymbols: boolean
        requireUppercase: boolean
        temporaryPasswordValidityDays: integer | default=0

      # Username and sign-in — IMMUTABLE after creation; mutually exclusive with aliasAttributes
      usernameAttributes: "[]string | default=[]"
      aliasAttributes: "[]string | default=[]"
      autoVerifiedAttributes: "[]string | default=[]"
      usernameConfiguration:
        caseSensitive: boolean

      # Admin user creation — pass-through
      adminCreateUserConfig:
        allowAdminCreateUserOnly: boolean
        inviteMessageTemplate:
          emailMessage: string | default=""
          emailSubject: string | default=""
          sMSMessage: string | default=""
        unusedAccountValidityDays: integer | default=0

      # Email configuration — pass-through
      emailConfiguration:
        emailSendingAccount: string | default=""
        from: string | default=""
        replyToEmailAddress: string | default=""
        sourceARN: string | default=""
        configurationSet: string | default=""

      # SMS configuration — pass-through
      smsConfiguration:
        snsCallerARN: string | default=""
        externalID: string | default=""
        snsRegion: string | default=""

      # Lambda triggers — pass-through (not governed; OD-4 resolved)
      lambdaConfig:
        createAuthChallenge: string | default=""
        customMessage: string | default=""
        defineAuthChallenge: string | default=""
        postAuthentication: string | default=""
        postConfirmation: string | default=""
        preAuthentication: string | default=""
        preSignUp: string | default=""
        preTokenGeneration: string | default=""
        userMigration: string | default=""
        verifyAuthChallengeResponse: string | default=""
        customEmailSender:
          lambdaARN: string | default=""
          lambdaVersion: string | default=""
        customSMSSender:
          lambdaARN: string | default=""
          lambdaVersion: string | default=""
        preTokenGenerationConfig:
          lambdaARN: string | default=""
          lambdaVersion: string | default=""
        kmsKeyID: string | default=""

      # Attribute schema — append-only; pass-through
      schema: "[]SchemaAttribute | default=[]"

      # Account recovery — pass-through
      accountRecoverySetting:
        recoveryMechanisms: "[]RecoveryMechanism | default=[]"

      # Device configuration — bare booleans (pointer semantics)
      deviceConfiguration:
        challengeRequiredOnNewDevice: boolean
        deviceOnlyRememberedOnUserPrompt: boolean

      # Verification message template — pass-through
      verificationMessageTemplate:
        defaultEmailOption: string | default=""
        emailMessage: string | default=""
        emailMessageByLink: string | default=""
        emailSubject: string | default=""
        emailSubjectByLink: string | default=""
        smsMessage: string | default=""

      # User attribute update settings — pass-through
      userAttributeUpdateSettings:
        attributesRequireVerificationBeforeUpdate: "[]string | default=[]"

    types:
      SchemaAttribute:
        attributeDataType: string | default=""
        developerOnlyAttribute: boolean
        mutable: boolean
        name: string | default=""
        required: boolean
        numberAttributeConstraints:
          minValue: string | default=""
          maxValue: string | default=""
        stringAttributeConstraints:
          minLength: string | default=""
          maxLength: string | default=""
      RecoveryMechanism:
        name: string | default=""
        priority: integer | default=1

    status:
      resourceName: >-
        ${naming.data.resourceName}
      namingStatus: >-
        ${naming.data.namingStatus}
      # userPoolArn and userPoolId — read from activePool, an externalRef that selects the
      # active ACK UserPool variant by kro.run/instance-name. This avoids referencing excluded
      # graph nodes (ackUserPool or ackUserPoolFull when inactive), which silently returns ""
      # per the "Unbound Variable Freeze" pattern (see frequent-rgd-errors.md).
      userPoolArn: >-
        ${activePool.size() > 0 && has(activePool[0].status) && has(activePool[0].status.ackResourceMetadata) ? activePool[0].status.?ackResourceMetadata.?arn.orValue("") : ""}
      userPoolId: >-
        ${activePool.size() > 0 && has(activePool[0].status) && has(activePool[0].status.id) ? activePool[0].status.?id.orValue("") : ""}
      validationError: >-
        ${has(mutualExclusionError.data) && has(mutualExclusionError.data.error) ? mutualExclusionError.data.error : ""}

    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus

  resources:
    # Single governance config lookup (ADR-010 D-1, Theme 28/KRO-221).
    # Uses selector.matchLabels — CEL in externalRef.metadata.name is not evaluated.
    # Result is a list; all accesses use rsrcCfg[0].* with rsrcCfg.size() > 0 guards.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: CognitoConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ExternalRef to read the active ACK UserPool status regardless of which variant is included.
    # kro sets kro.run/instance-name on all owned child resources. Since ackUserPool and
    # ackUserPoolFull are mutually exclusive, this list has exactly one entry when a variant is
    # active, and zero during transitions. Used in status.userPoolArn and status.userPoolId.
    - id: activePool
      externalRef:
        apiVersion: cognitoidentityprovider.services.k8s.aws/v1alpha1
        kind: UserPool
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              kro.run/instance-name: ${schema.metadata.name}

    # Naming ConfigMap — materialises resourceName, namingStatus, and key resolved values
    # used in includeWhen conditions for the ACK UserPool variants.
    # The status block cannot reference schema.* directly (out of scope); these computed values
    # flow through this ConfigMap to the status block via naming.data.*.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          # resourceName: effective cloud resource name with full {tag.X} substitution.
          # Tag tokens resolved cascade order: mandatory wins over spec, spec wins over defaults.
          # Any unresolved {tag.X} token is kept verbatim so namingStatus reports invalid.
          resourceName: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}
          namingStatus: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef)).contains("{")
              ? "invalid-unresolved-tokens"
              : "valid"}
          # resolvedAdvancedSecurityMode — used in includeWhen to select between ackUserPool
          # (no userPoolAddOns) and ackUserPoolFull (with userPoolAddOns). When "", userPoolAddOns
          # is omitted entirely from the ACK UserPool spec (OQ-2: omit rather than set empty object).
          resolvedAdvancedSecurityMode: >-
            ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?advancedSecurityMode.orValue("") != ""
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?advancedSecurityMode.orValue("")
              : (schema.spec.advancedSecurityMode != ""
                  ? schema.spec.advancedSecurityMode
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?advancedSecurityMode.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?advancedSecurityMode.orValue("")
                      : ""))}
          # usernameAliasConflict — "true" when both usernameAttributes and aliasAttributes are
          # non-empty; mutually exclusive (AC-33). ACK UserPool resources are excluded when "true".
          usernameAliasConflict: >-
            ${(schema.spec.usernameAttributes.size() > 0 && schema.spec.aliasAttributes.size() > 0) ? "true" : "false"}

    # Advisory ConfigMap for AC-33 mutual exclusion.
    # kro v0.9.2 does not preserve x-kubernetes-validations (regenerates CRD on every apply).
    # This ConfigMap surfaces as status.validationError and gates the ACK UserPool creation.
    - id: mutualExclusionError
      includeWhen:
        - '${schema.spec.usernameAttributes.size() > 0 && schema.spec.aliasAttributes.size() > 0}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-validation-error
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "usernameAttributes and aliasAttributes are mutually exclusive — set only one"

    # ACK UserPool — basic variant (no userPoolAddOns).
    # Included when: no mutual exclusion conflict, valid naming, and advancedSecurityMode is empty.
    # includeWhen must NOT reference the graph-internal "naming" ConfigMap node — it has no
    # observed state during teardown, causing "data pending" hangs (see frequent-rgd-errors.md
    # §"includeWhen Must Not Read Another Node in the Same Graph"). All three conditions are
    # inlined from schema.spec and rsrcCfg (externalRef, always available).
    - id: ackUserPool
      includeWhen:
        - '${!(schema.spec.usernameAttributes.size() > 0 && schema.spec.aliasAttributes.size() > 0) && !((schema.spec.nameOverride != "" ? schema.spec.nameOverride : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "") ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "") ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate : "{namespace}-{name}"))).split("{tag.").transformList(i, part, i == 0 ? part : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]] : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]] : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]] : (part.split("}")[0] in schema.spec.tags ? schema.spec.tags[part.split("}")[0]] : (part.split("}")[0] in schema.spec.syncedLabels ? schema.spec.syncedLabels[part.split("}")[0]] : (part.split("}")[0] in schema.spec.syncedAnnotations ? schema.spec.syncedAnnotations[part.split("}")[0]] : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]] : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]] : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]] : "{tag." + part.split("}")[0] + "}"))))))))) + (size(part.split("}")) > 1 ? part.split("}").slice(1, size(part.split("}"))).join("}") : ""))).join("").replace("{name}", schema.metadata.name).replace("{namespace}", schema.metadata.namespace).replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "").replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "").replace("{configRef}", schema.spec.configRef).contains("{")) && (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?advancedSecurityMode.orValue("") != "" ? rsrcCfg[0].status.effectiveConfig.mandatory.?advancedSecurityMode.orValue("") : (schema.spec.advancedSecurityMode != "" ? schema.spec.advancedSecurityMode : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?advancedSecurityMode.orValue("") != "" ? rsrcCfg[0].status.effectiveConfig.defaults.?advancedSecurityMode.orValue("") : ""))) == ""}'
      template:
        apiVersion: cognitoidentityprovider.services.k8s.aws/v1alpha1
        kind: UserPool
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.resourceName}
          # MFA — mandatory -> instance -> defaults -> built-in fallback (OFF)
          mfaConfiguration: >-
            ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?mfaConfiguration.orValue("") != ""
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?mfaConfiguration.orValue("")
              : (schema.spec.mfaConfiguration != ""
                  ? schema.spec.mfaConfiguration
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?mfaConfiguration.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?mfaConfiguration.orValue("")
                      : "OFF"))}
          # Deletion protection — mandatory -> instance -> defaults -> INACTIVE
          deletionProtection: >-
            ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?deletionProtection.orValue("") != ""
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?deletionProtection.orValue("")
              : (schema.spec.deletionProtection != ""
                  ? schema.spec.deletionProtection
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?deletionProtection.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?deletionProtection.orValue("")
                      : "INACTIVE"))}
          # Password policy — per-sub-field cascade
          policies:
            passwordPolicy:
              minimumLength: >-
                ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?passwordPolicy.?minimumLength.orValue(0) > 0
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.?passwordPolicy.?minimumLength.orValue(0)
                  : (schema.spec.passwordPolicy.minimumLength > 0
                      ? schema.spec.passwordPolicy.minimumLength
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?passwordPolicy.?minimumLength.orValue(0) > 0
                          ? rsrcCfg[0].status.effectiveConfig.defaults.?passwordPolicy.?minimumLength.orValue(0)
                          : 8))}
              requireLowercase: >-
                ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.passwordPolicy) && has(rsrcCfg[0].status.effectiveConfig.mandatory.passwordPolicy.requireLowercase)
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.passwordPolicy.requireLowercase
                  : (has(schema.spec.passwordPolicy.requireLowercase)
