---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awsiampolicy.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSIAMPolicy
    scope: Namespaced
    spec:
      configRef: string | default="general-policy"
      description: string | default=""
      path: string | default="/"
      nameOverride: string | default=""
      deletionPolicy: string | default="retain"
      documentJSON: string | default=""
      documentRef: string | default=""
      tags: object | default={}
      syncedLabels: object | default={}
      syncedAnnotations: object | default={}
    status:
      resourceName: "${variables.effectiveName}"
      namingStatus: "${variables._namingValid ? \"valid\" : \"invalid-unresolved-tokens\"}"
      predictedArn: "${\"arn:aws:iam::\" + variables.effCfg.aws.accountId + \":policy\" + spec.path + variables.effectiveName}"
      arn: "${policy.status.ackResourceMetadata.arn}"
      policyId: "${policy.status.policyID}"
      conditions: "${policy.status.conditions}"
  resources:
    - id: policy
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Policy
        metadata:
          name: "${metadata.name}"
          namespace: "${metadata.namespace}"
          labels: "${{\"app.kubernetes.io/managed-by\": \"kro\", \"app.kubernetes.io/instance\": metadata.name} + variables.mergedSyncedLabels}"
          annotations: "${{\"services.k8s.aws/deletion-policy\": spec.deletionPolicy} + variables.mergedSyncedAnnotations}"
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMPolicy
              name: ${metadata.name}
              uid: ${metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: "${variables.effectiveName}"
          path: "${spec.path}"
          description: "${spec.description}"
          policyDocument: "${spec.documentRef != \"\" ? resources.get(metadata.namespace, \"AWSPolicyDocument\", spec.documentRef).spec.documentJSON : spec.documentJSON}"
          tags: "${variables.allCloudMetadata.transformList(k, v, {key: k, value: v})}"
  variables:
    _rsrcCfg: "${resources.get(metadata.namespace, \"AWSIAMConfig\", spec.configRef)}"
    effCfg: "${variables._rsrcCfg.status.effectiveConfig}"
    mergedTags: >-
      ${variables.effCfg.mandatory.tags + spec.tags + variables.effCfg.defaults.tags}
    _rawSyncedLabels: >-
      ${variables.effCfg.mandatory.syncedLabels + spec.syncedLabels + variables.effCfg.defaults.syncedLabels}
    _rawSyncedAnnotations: >-
      ${variables.effCfg.mandatory.syncedAnnotations + spec.syncedAnnotations + variables.effCfg.defaults.syncedAnnotations}
    mergedSyncedLabels: >-
      ${variables._rawSyncedLabels.transformMapEntry(k, v, {("kropath.run/" + k): v})}
    mergedSyncedAnnotations: >-
      ${variables._rawSyncedAnnotations.transformMapEntry(k, v, {("kropath.run/" + k): v})}
    allCloudMetadata: >-
      ${variables.mergedTags + variables.mergedSyncedLabels + variables.mergedSyncedAnnotations}
    _namingTemplate: >-
      ${variables.effCfg.mandatory.namingTemplate != ""
        ? variables.effCfg.mandatory.namingTemplate
        : variables.effCfg.defaults.namingTemplate}
    effectiveName: >-
      ${spec.nameOverride != ""
        ? spec.nameOverride
        : (variables._namingTemplate != ""
            ? variables._namingTemplate
                .split("{tag.")
                .transformList(i, part,
                  i == 0 ? part
                         : (variables.mergedTags.?[part.split("}")[0]].orValue("") +
                            (size(part.split("}")) > 1
                              ? part.split("}").slice(1, size(part.split("}"))).join("}")
                              : "")))
                .join("")
                .replace("{name}", metadata.name)
                .replace("{namespace}", metadata.namespace)
                .replace("{account_id}", variables.effCfg.aws.accountId ?? "")
                .replace("{region}", variables.effCfg.aws.region ?? "")
                .replace("{configRef}", spec.configRef)
            : metadata.name)}
    _namingValid: "${!variables.effectiveName.contains(\"{\")}"
