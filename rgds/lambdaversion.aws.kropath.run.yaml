# aws-lambda-08: LambdaVersion RGD
# Composes: lambda.services.k8s.aws/Version
# Naming-EXEMPT (KRO-236): AWS assigns version numbers; no effectiveName, nameOverride,
#   resourceName, predictedArn, or namingStatus. status.versionNumber + status.functionArn
#   exposed after ACK reconciliation.
# No cloud tags: ACK Version has no spec.tags — K8s metadata only.
# functionRef: resolves parent LambdaFunction name via externalRef + selector.matchLabels.
# provisionedConcurrentExecutions: 0 = not set (omit from ACK spec); >0 = set.
# functionEventInvokeConfig.maximumRetryAttempts: -1 = not set (AWS default applies).
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: lambdaversion.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: LambdaVersion
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain

      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}

      # Reference to the parent LambdaFunction CR (required)
      functionRef: string | default=""

      # Optional version description
      description: string | default=""

      # Only publish if deployment package SHA256 matches; empty = no check
      codeSHA256: string | default=""

      # Pre-warmed execution environments; 0 = not set (no provisioned concurrency)
      provisionedConcurrentExecutions: integer | default=0

      # Per-version async invocation config
      functionEventInvokeConfig:
        maximumEventAgeInSeconds: integer | default=0
        maximumRetryAttempts: integer | default=-1
        destinationConfig:
          onSuccess:
            destination: string | default=""
          onFailure:
            destination: string | default=""

    status:
      # AWS-assigned immutable version number (string, e.g. "1", "2")
      versionNumber: >-
        ${ver.?status.?version.orValue("")}
      # Versioned function ARN (arn:aws:lambda:<region>:<accountId>:function:<name>:<version>)
      functionArn: >-
        ${ver.?status.?ackResourceMetadata.?arn.orValue("")}
      conditions: >-
        ${ver.?status.?conditions.orValue([])}

    additionalPrinterColumns:
      - name: VersionNumber
        type: string
        jsonPath: .status.versionNumber
      - name: FunctionArn
        type: string
        jsonPath: .status.functionArn

  resources:
    # ── governance config lookup ──────────────────────────────────────────────
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: LambdaConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ── parent LambdaFunction reference ──────────────────────────────────────
    # Resolves status.resourceName for ACK Version spec.functionName
    - id: lambdaFn
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: LambdaFunction
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.functionRef != "" ? schema.spec.functionRef : "kro-empty-fallback-sentinel"}'

    # ── ACK Version child resource ────────────────────────────────────────────
    - id: ver
      template:
        apiVersion: lambda.services.k8s.aws/v1alpha1
        kind: Version
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.tags)) ? rsrcCfg[0].status.effectiveConfig.defaults.tags.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.tags.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.tags)) ? rsrcCfg[0].status.effectiveConfig.mandatory.tags.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaVersion
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          # Resolved function name from parent LambdaFunction CR status
          functionName: >-
            ${lambdaFn.size() > 0 ? lambdaFn[0].status.resourceName : schema.spec.functionRef}
          description: "${schema.spec.description}"
          codeSHA256: "${schema.spec.codeSHA256}"
          # Provisioned concurrency: 0 means not set (no provisioning)
          provisionedConcurrencyConfig:
            provisionedConcurrentExecutions: ${schema.spec.provisionedConcurrentExecutions}
          # Async invocation config
          functionEventInvokeConfig:
            maximumEventAgeInSeconds: ${schema.spec.functionEventInvokeConfig.maximumEventAgeInSeconds}
            maximumRetryAttempts: ${schema.spec.functionEventInvokeConfig.maximumRetryAttempts}
            destinationConfig:
              onSuccess:
                destination: "${schema.spec.functionEventInvokeConfig.destinationConfig.onSuccess.destination}"
              onFailure:
                destination: "${schema.spec.functionEventInvokeConfig.destinationConfig.onFailure.destination}"
