---
# RDSInstance RGD
#
# Composes: rds.services.k8s.aws/DBInstance (ACK RDS Controller v1.10.2)
# ACK CRD cache: docs/crd-cache/aws/rds-controller-v1.10.2.md §DBInstance
#
# Governance cascade (13 fields via RDSConfig effectiveConfig — ADR-010):
#   storageEncrypted, kmsKeyID, deletionProtection, backupRetentionPeriod,
#   multiAZ, publiclyAccessible, storageType, autoMinorVersionUpgrade,
#   copyTagsToSnapshot, performanceInsightsEnabled, enableIAMDatabaseAuthentication,
#   manageMasterUserPassword, namingTemplate.
#
# Boolean pointer fields (OR logic — any "true" tier wins):
#   storageEncrypted, deletionProtection, multiAZ, autoMinorVersionUpgrade,
#   copyTagsToSnapshot, performanceInsightsEnabled, enableIAMDatabaseAuthentication,
#   manageMasterUserPassword.
#
# publiclyAccessible uses has() check (mandatory false = forced private-only).
#
# backupRetentionPeriod uses minimum-floor semantics:
#   max(effCfg.mandatory.backupRetentionPeriod, spec.backupRetentionPeriod) (OD-3).
#
# Tags: ACK DBInstance spec.tags is array<{key, value}> (not map).
#   Converted via .transformList(k, v, {"key": k, "value": v}).
#
# Cloud resource name: ACK DBInstance.spec.dbInstanceIdentifier = effectiveName.
# Predicted ARN format: arn:aws:rds:<region>:<accountId>:db/<effectiveName>
#
# masterUserPassword (G-1): SecretKeyReference passthrough via schema.spec.masterUserPassword.
#   Verify kro supports SecretKeyReference object passthrough in local cluster before PR merge.
#
# IN-21 mutual exclusion (masterUserPassword vs manageMasterUserPassword):
#   Enforced via advisory error ConfigMap (kro discards x-kubernetes-validations on regenerate).
#   See docs/frequent-rgd-errors.md §"x-kubernetes-validations Cannot Be Auto-Generated by kro".
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: rdsinstance.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: RDSInstance
    scope: Namespaced
    spec:
      # Standard kropath governance fields
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # ACK DBInstance required instance fields (not governance-overridable)
      engine: string
      dbInstanceClass: string
      # Optional instance fields — networking and identity
      allocatedStorage: integer | default=0
      engineVersion: string | default=""
      dbSubnetGroupName: string | default=""
      availabilityZone: string | default=""
      port: integer | default=0
      dbName: string | default=""
      dbParameterGroupName: string | default=""
      dbSnapshotIdentifier: string | default=""
      dbClusterIdentifier: string | default=""
      masterUsername: string | default=""
      vpcSecurityGroupIDs: "[]string | default=[]"
      enableCloudwatchLogsExports: "[]string | default=[]"
      # Boolean pointer governance fields — do NOT declare | default=false.
      # kro copies the default into the generated CRD; kubernetes then materialises
      # false on every instance, making has() always return true.
      # Declare as bare boolean so unset instances read as falsy without presence.
      storageEncrypted: boolean
      deletionProtection: boolean
      multiAZ: boolean
      publiclyAccessible: boolean
      autoMinorVersionUpgrade: boolean
      copyTagsToSnapshot: boolean
      performanceInsightsEnabled: boolean
      enableIAMDatabaseAuthentication: boolean
      manageMasterUserPassword: boolean
      # Non-pointer governance fields
      storageType: string | default=""
      kmsKeyID: string | default=""
      backupRetentionPeriod: integer | default=0
      # masterUserPassword SecretKeyReference (G-1).
      # Passed through verbatim to ACK DBInstance.spec.masterUserPassword.
      masterUserPassword:
        name: string | default=""
        key: string | default=""
    status:
      resourceName: >-
        ${naming.data.resourceName}
      namingStatus: >-
        ${naming.data.namingStatus}
      predictedArn: >-
        ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.aws) && naming.data.resourceName != "" && !naming.data.resourceName.contains("{")
          ? "arn:aws:rds:" + rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") + ":" + rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") + ":db/" + naming.data.resourceName
          : ""}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn

  resources:
    # Single governance config lookup — controller pre-merges all cascade layers (ADR-010 D-1).
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: RDSConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # Naming ConfigMap — materialises effectiveName, resourceName, namingStatus.
    # Computed here because schema.* is out of scope in the status: block.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: rdsinstance-naming
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RDSInstance
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}
          resourceName: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}
          namingStatus: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef)).contains("{")
              ? "invalid-unresolved-tokens"
              : "valid"}

    # Advisory error ConfigMap for IN-21: masterUserPassword and manageMasterUserPassword
    # cannot both be set. kro discards x-kubernetes-validations on CRD regeneration,
    # so mutual exclusion is enforced via this in-graph advisory ConfigMap.
    # When the conflict exists, the ConfigMap appears in the graph and is visible
    # in kubectl describe output. Chainsaw IN-21 asserts this ConfigMap is present.
    - id: passwordMutualExclusionError
      includeWhen:
        - >-
          ${schema.spec.masterUserPassword.name != ""
            && ((rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.manageMasterUserPassword)
                || schema.spec.?manageMasterUserPassword.orValue(false)
                || (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.manageMasterUserPassword))}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-password-exclusion-error
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: rdsinstance-error
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RDSInstance
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "masterUserPassword and manageMasterUserPassword cannot both be set; unset one of the two"
          hint: "When manageMasterUserPassword is true (via spec or governance), do not provide spec.masterUserPassword"

    # ACK DBInstance CR — primary cloud resource.
    # Only created when resourceName has no unresolved {tag.X} tokens.
    - id: ackDBInstance
      includeWhen:
        - '${!naming.data.resourceName.contains("{")}'
      template:
        apiVersion: rds.services.k8s.aws/v1alpha1
        kind: DBInstance
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RDSInstance
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          # Cloud resource identifier (effectiveName from naming ConfigMap).
          # ACK stores dbInstanceIdentifier as lowercase.
          dbInstanceIdentifier: ${naming.data.resourceName}
          # Required instance fields — developer-specified, not governance-overridable.
          dbInstanceClass: ${schema.spec.dbInstanceClass}
          engine: ${schema.spec.engine}
          # Storage — allocatedStorage required when not restoring from snapshot.
          allocatedStorage: '${schema.spec.allocatedStorage > 0 ? schema.spec.allocatedStorage : 0}'
          # Engine version — instance spec only
          engineVersion: '${schema.spec.engineVersion != "" ? schema.spec.engineVersion : ""}'
          # Networking
          dbSubnetGroupName: '${schema.spec.dbSubnetGroupName != "" ? schema.spec.dbSubnetGroupName : ""}'
          vpcSecurityGroupIDs: ${schema.spec.vpcSecurityGroupIDs}
          availabilityZone: '${schema.spec.availabilityZone != "" ? schema.spec.availabilityZone : ""}'
          port: '${schema.spec.port > 0 ? schema.spec.port : 0}'
          # Database name and parameters
          dbName: '${schema.spec.dbName != "" ? schema.spec.dbName : ""}'
          dbParameterGroupName: '${schema.spec.dbParameterGroupName != "" ? schema.spec.dbParameterGroupName : ""}'
          # Restore from snapshot (IN-19)
          dbSnapshotIdentifier: '${schema.spec.dbSnapshotIdentifier != "" ? schema.spec.dbSnapshotIdentifier : ""}'
          # Aurora cluster membership (IN-22)
          dbClusterIdentifier: '${schema.spec.dbClusterIdentifier != "" ? schema.spec.dbClusterIdentifier : ""}'
          # Auth
          masterUsername: '${schema.spec.masterUsername != "" ? schema.spec.masterUsername : ""}'
          # masterUserPassword SecretKeyReference passthrough (G-1).
          # Passed even when empty; ACK ignores empty references.
          # Mutual exclusion with manageMasterUserPassword enforced by
          # passwordMutualExclusionError advisory ConfigMap above (IN-21).
          masterUserPassword:
            name: ${schema.spec.masterUserPassword.name}
            key: ${schema.spec.masterUserPassword.key}
          # Log exports — verbatim from instance spec
          enableCloudwatchLogsExports: ${schema.spec.enableCloudwatchLogsExports}
          # storageType cascade: mandatory (non-"") → instance (non-"") → defaults → ""
          storageType: >-
            ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?storageType.orValue("") != ""
              ? rsrcCfg[0].status.effectiveConfig.mandatory.storageType
              : (schema.spec.storageType != ""
                  ? schema.spec.storageType
                  : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?storageType.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.defaults.storageType
                      : ""))}
          # kmsKeyID cascade: mandatory (non-"") → instance (non-"") → defaults
          kmsKeyID: >-
            ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?kmsKeyID.orValue("") != ""
              ? rsrcCfg[0].status.effectiveConfig.mandatory.kmsKeyID
              : (schema.spec.kmsKeyID != ""
                  ? schema.spec.kmsKeyID
                  : (rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?kmsKeyID.orValue("") : ""))}
          # backupRetentionPeriod minimum-floor semantics (OD-3):
          #   max(effCfg.mandatory.backupRetentionPeriod, spec.backupRetentionPeriod)
          #   when mandatory is non-zero; instance can exceed but not go below the floor.
          backupRetentionPeriod: >-
            ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?backupRetentionPeriod.orValue(0) > 0
              ? (schema.spec.backupRetentionPeriod > rsrcCfg[0].status.effectiveConfig.mandatory.backupRetentionPeriod
                  ? schema.spec.backupRetentionPeriod
                  : rsrcCfg[0].status.effectiveConfig.mandatory.backupRetentionPeriod)
              : (schema.spec.backupRetentionPeriod > 0
                  ? schema.spec.backupRetentionPeriod
                  : (rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?backupRetentionPeriod.orValue(0) : 0))}
          # storageEncrypted: OR cascade — any "true" tier enables encryption.
          # once enabled cannot be disabled without recreation.
          storageEncrypted: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?storageEncrypted.orValue(false))
              || schema.spec.?storageEncrypted.orValue(false)
              || (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?storageEncrypted.orValue(false))}
          # deletionProtection: OR cascade
          deletionProtection: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deletionProtection.orValue(false))
              || schema.spec.?deletionProtection.orValue(false)
              || (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deletionProtection.orValue(false))}
          # multiAZ: OR cascade
          multiAZ: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?multiAZ.orValue(false))
              || schema.spec.?multiAZ.orValue(false)
              || (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?multiAZ.orValue(false))}
          # publiclyAccessible: has() cascade — mandatory false = forced private-only (IN-8).
          # Unlike the other boolean pointers, false in mandatory IS meaningful here.
          publiclyAccessible: >-
            ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.publiclyAccessible)
              ? rsrcCfg[0].status.effectiveConfig.mandatory.publiclyAccessible
              : (has(schema.spec.publiclyAccessible)
                  ? schema.spec.publiclyAccessible
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.publiclyAccessible)
                      ? rsrcCfg[0].status.effectiveConfig.defaults.publiclyAccessible
                      : false))}
          # autoMinorVersionUpgrade: OR cascade
          autoMinorVersionUpgrade: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?autoMinorVersionUpgrade.orValue(false))
              || schema.spec.?autoMinorVersionUpgrade.orValue(false)
              || (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?autoMinorVersionUpgrade.orValue(false))}
          # copyTagsToSnapshot: OR cascade
          copyTagsToSnapshot: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?copyTagsToSnapshot.orValue(false))
              || schema.spec.?copyTagsToSnapshot.orValue(false)
              || (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?copyTagsToSnapshot.orValue(false))}
          # performanceInsightsEnabled: OR cascade
          performanceInsightsEnabled: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?performanceInsightsEnabled.orValue(false))
              || schema.spec.?performanceInsightsEnabled.orValue(false)
              || (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?performanceInsightsEnabled.orValue(false))}
          # enableIAMDatabaseAuthentication: OR cascade
          enableIAMDatabaseAuthentication: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?enableIAMDatabaseAuthentication.orValue(false))
              || schema.spec.?enableIAMDatabaseAuthentication.orValue(false)
              || (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?enableIAMDatabaseAuthentication.orValue(false))}
          # manageMasterUserPassword: OR cascade (IN-9)
          manageMasterUserPassword: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?manageMasterUserPassword.orValue(false))
              || schema.spec.?manageMasterUserPassword.orValue(false)
              || (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?manageMasterUserPassword.orValue(false))}
          # Cloud resource tags — ACK DBInstance spec.tags is array<{key, value}> (not map).
          # Merge order: defaults → instance spec → mandatory (mandatory wins on collision).
          # syncedLabels and syncedAnnotations also written to cloud tags (ADR-015 §6.1 dual-write).
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})
              .transformList(k, v, {"key": k, "value": v})}
