apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: iamrole.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: IAMRole
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      type: string | required=true
      description: string | default=""
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      policies: "[]RolePolicy | default=[]"
      inlinePolicies: "[]InlinePolicy | default=[]"
      trustPolicyRef: string | default=""
      permissionsBoundaryArn: string | default=""
      oidcProviderArn: string | default=""
      serviceAccountNamespace: string | default=""
      serviceAccountName: string | default=""
      clusterName: string | default=""
      servicePrincipal: string | default=""
      trustPolicyJSON: string | default=""
      addSsmPolicy: boolean
      addEcsExecutionPolicy: boolean
      addLambdaBasicPolicy: boolean
      createInstanceProfile: boolean
      maxSessionDuration: integer | default=0
    types:
      RolePolicy:
        arn: string | default=""
        ref: string | default=""
        inline:
          name: string | default=""
          documentJSON: string | default=""
          documentRef: string | default=""
      InlinePolicy:
        name: string | required=true
        documentRef: string | required=true
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      predictedArn: >-
        ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.aws) && has(rsrcCfg[0].status.effectiveConfig.aws.accountId) && naming.data.effectiveName != "" ? "arn:aws:iam::" + rsrcCfg[0].status.effectiveConfig.aws.accountId + ":role/" + naming.data.effectiveName : ""}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      validationError: >-
        ${has(maxSessionDurationError.data) ? maxSessionDurationError.data.error : ""}
      conditions: >-
        ${role.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: Type
        type: string
        jsonPath: .spec.type
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: ValidationError
        type: string
        jsonPath: .status.validationError
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: IAMConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    - id: trustDoc
      # No includeWhen — sentinel selector ensures variable is always bound as []
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: PolicyDocument
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.trustPolicyRef != "" ? schema.spec.trustPolicyRef : "kro-empty-fallback-sentinel"}'

    - id: firstPolicyRef
      # No includeWhen — sentinel selector ensures variable is always bound as []
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: IAMPolicy
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${has(schema.spec.policies) && schema.spec.policies.size() > 0 && schema.spec.policies[0].?ref.orValue("") != "" ? schema.spec.policies[0].ref : "kro-empty-fallback-sentinel"}'

    - id: firstInlineDoc
      # No includeWhen — sentinel selector ensures variable is always bound as []
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: PolicyDocument
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${has(schema.spec.inlinePolicies) && schema.spec.inlinePolicies.size() > 0 && schema.spec.inlinePolicies[0].?documentRef.orValue("") != "" ? schema.spec.inlinePolicies[0].documentRef : "kro-empty-fallback-sentinel"}'

    # ConfigMap that materialises effectiveName with full {tag.X} dynamic substitution support.
    # Tag tokens are resolved in cascade order: defaults → instance spec → mandatory (mandatory wins).
    # Any {tag.X} token whose key is absent in the merged tags map is kept verbatim so that
    # namingStatus reports "invalid-unresolved-tokens" and the role name is clearly invalid.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMRole
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : schema.metadata.name)))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (part.split("}")[0] in schema.spec.tags
                              ? schema.spec.tags[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.syncedLabels
                                  ? schema.spec.syncedLabels[part.split("}")[0]]
                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                      ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                          ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                          : "{tag." + part.split("}")[0] + "}"))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{kind}", "iamrole"))}

    - id: role
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMRole
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.effectiveName}
          description: "${schema.spec.description}"
          assumeRolePolicyDocument: >-
            ${trustDoc.size() > 0 && trustDoc[0].?spec.orValue(null) != null ? trustDoc[0].status.resolvedDocumentJSON : (
             schema.spec.type == "ec2" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}' :
             (schema.spec.type == "ecs-task" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]}' :
             (schema.spec.type == "lambda" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' :
             (schema.spec.type == "eks-irsa" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"' + schema.spec.?oidcProviderArn.orValue("") + '"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"sts.amazonaws.com:sub":"system:serviceaccount:' + schema.spec.?serviceAccountNamespace.orValue("") + ':' + schema.spec.?serviceAccountName.orValue("") + '"}}}]}' :
             (schema.spec.type == "eks-pod-identity" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"pods.eks.amazonaws.com"},"Action":"sts:AssumeRole"}]}' :
             (schema.spec.type == "aws-service" ? '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"' + schema.spec.?servicePrincipal.orValue("") + '"},"Action":"sts:AssumeRole"}]}' :
             schema.spec.trustPolicyJSON))))))}
          permissionsBoundary: '${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.permissionsBoundaryArn) && rsrcCfg[0].status.effectiveConfig.mandatory.permissionsBoundaryArn != "" ? rsrcCfg[0].status.effectiveConfig.mandatory.permissionsBoundaryArn : (schema.spec.permissionsBoundaryArn == "none" ? "" : (schema.spec.permissionsBoundaryArn != "" ? schema.spec.permissionsBoundaryArn : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.permissionsBoundaryArn) ? rsrcCfg[0].status.effectiveConfig.defaults.permissionsBoundaryArn : "")))}'
          maxSessionDuration: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.maxSessionDurationSeconds) && rsrcCfg[0].status.effectiveConfig.mandatory.maxSessionDurationSeconds > 0 && schema.spec.maxSessionDuration > rsrcCfg[0].status.effectiveConfig.mandatory.maxSessionDurationSeconds ? rsrcCfg[0].status.effectiveConfig.mandatory.maxSessionDurationSeconds : (schema.spec.maxSessionDuration > 0 ? schema.spec.maxSessionDuration : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.maxSessionDurationSeconds) ? rsrcCfg[0].status.effectiveConfig.defaults.maxSessionDurationSeconds : 3600)))}
          policies: >-
            ${(schema.spec.type == "ec2" && (
                (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.addSsmPolicy) && rsrcCfg[0].status.effectiveConfig.mandatory.addSsmPolicy) ||
                (has(schema.spec.addSsmPolicy) && schema.spec.addSsmPolicy) ||
                (!has(schema.spec.addSsmPolicy) && rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.addSsmPolicy) && rsrcCfg[0].status.effectiveConfig.defaults.addSsmPolicy)) ?
                ["arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"] : [])
              + (schema.spec.type == "ecs-task" && (
                (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.addEcsExecutionPolicy) && rsrcCfg[0].status.effectiveConfig.mandatory.addEcsExecutionPolicy) ||
                (has(schema.spec.addEcsExecutionPolicy) && schema.spec.addEcsExecutionPolicy) ||
                (!has(schema.spec.addEcsExecutionPolicy) && rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.addEcsExecutionPolicy) && rsrcCfg[0].status.effectiveConfig.defaults.addEcsExecutionPolicy)) ?
                ["arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"] : [])
              + (schema.spec.type == "lambda" && (
                (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.addLambdaBasicPolicy) && rsrcCfg[0].status.effectiveConfig.mandatory.addLambdaBasicPolicy) ||
                (has(schema.spec.addLambdaBasicPolicy) && schema.spec.addLambdaBasicPolicy) ||
                (!has(schema.spec.addLambdaBasicPolicy) && rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.addLambdaBasicPolicy) && rsrcCfg[0].status.effectiveConfig.defaults.addLambdaBasicPolicy)) ?
                ["arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"] : [])
              + (has(schema.spec.policies) && schema.spec.policies.size() > 0 && has(schema.spec.policies[0].arn) && schema.spec.policies[0].arn != "" ?
                [schema.spec.policies[0].arn] : [])
              + (firstPolicyRef.size() > 0 && has(firstPolicyRef[0].status) && has(firstPolicyRef[0].status.arn) && firstPolicyRef[0].status.arn != "" ?
                [firstPolicyRef[0].status.arn] : [])}
          inlinePolicies: >-
            ${(firstInlineDoc.size() > 0 && has(schema.spec.inlinePolicies) && schema.spec.inlinePolicies.size() > 0 ?
                {schema.spec.inlinePolicies[0].name: firstInlineDoc[0].status.resolvedDocumentJSON} : {})
              .merge(has(schema.spec.policies) && schema.spec.policies.size() > 0 &&
                     schema.spec.policies[0].?inline.?documentJSON.orValue("") != "" ?
                     {schema.spec.policies[0].inline.name: schema.spec.policies[0].inline.documentJSON} : {})}
          tags: >-
            ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.tags)) ? rsrcCfg[0].status.effectiveConfig.defaults.tags : {})
              .merge(schema.spec.syncedAnnotations)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.tags)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.tags)) ? rsrcCfg[0].status.effectiveConfig.mandatory.tags : {})
              .transformList(k, v, {"key": k, "value": v})
              .sortBy(x, x.key)}

    - id: instanceProfile
      includeWhen:
        - '${schema.spec.type == "ec2" && (!has(schema.spec.createInstanceProfile) || schema.spec.createInstanceProfile)}'
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: InstanceProfile
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMRole
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${role.spec.name}
          role: ${role.spec.name}

    - id: podIdentityAssociation
      includeWhen:
        - '${schema.spec.type == "eks-pod-identity"}'
      template:
        apiVersion: eks.services.k8s.aws/v1alpha1
        kind: PodIdentityAssociation
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMRole
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          clusterName: ${schema.spec.clusterName}
          namespace: ${schema.spec.serviceAccountNamespace}
          serviceAccount: ${schema.spec.serviceAccountName}
          roleARN: >-
            ${"arn:aws:iam::" + (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.aws) && has(rsrcCfg[0].status.effectiveConfig.aws.accountId) ? rsrcCfg[0].status.effectiveConfig.aws.accountId : "") + ":role/" + role.spec.name}

    - id: maxSessionDurationError
      includeWhen:
        - "${schema.spec.maxSessionDuration > 0 && schema.spec.maxSessionDuration < 900}"
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-maxsessionduration-error
          namespace: ${schema.metadata.namespace}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMRole
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "maxSessionDuration must be 0 (use config default) or in range [900, 43200]"
