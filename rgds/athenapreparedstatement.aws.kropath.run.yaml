---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: athenapreparedstatement.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: AthenaPreparedStatement
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # PreparedStatement properties
      queryStatement: string
      workGroup: string | default=""
      workGroupRef: string | default=""
      description: string | default=""
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
  resources:
    # Governance config lookup. PreparedStatement only inherits namingTemplate (1 of 12 AthenaConfig fields).
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: AthenaConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # AthenaWorkGroup cross-RGD lookup — resolves workGroupRef to a live WorkGroup resourceName.
    # Sentinel prevents kro from treating an empty selector as "match all" (KRO-221/Theme 28).
    - id: wgRef
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: AthenaWorkGroup
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.workGroupRef != "" ? schema.spec.workGroupRef : "kro-empty-fallback-sentinel"}'

    # Advisory ConfigMap: workGroup and workGroupRef are mutually exclusive.
    - id: wgMutualExclusionError
      includeWhen:
        - '${schema.spec.workGroup != "" && schema.spec.workGroupRef != ""}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-wg-mutual-exclusion-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "workGroup and workGroupRef are mutually exclusive — set one or the other, not both"

    # Advisory ConfigMap: nameOverride must start with a letter or underscore.
    # PreparedStatement names are used as ACK resource keys and must satisfy [a-zA-Z_].*.
    - id: nameInvalidStartError
      includeWhen:
        - '${schema.spec.nameOverride != "" && !schema.spec.nameOverride.matches("^[a-zA-Z_].*")}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-name-invalid-start-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "nameOverride must start with a letter or underscore — digits and other characters are not valid statement name starts"

    # Naming ConfigMap — materialises effectiveName, namingStatus.
    # Default template: {namespace}_{name}. Hyphens are replaced with underscores in both
    # the resolved template value and scalar token substitutions to match Athena statement name rules.
    # PreparedStatement does NOT govern tags/syncedLabels/syncedAnnotations in cloud, so {tag.X}
    # token resolution is omitted; any remaining {tag.*} tokens produce "invalid-unresolved-tokens".
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-statement-naming
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: preparedstatement-naming
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}_{name}"))
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef)
              .replace("-", "_"))}
          namingStatus: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}_{name}"))
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef)
              .replace("-", "_")
              .contains("{") ? "invalid-unresolved-tokens" : "valid")}

    # ACK PreparedStatement CR — primary cloud resource.
    # Only created when effectiveName has no unresolved tokens and workGroup/workGroupRef are valid.
    - id: preparedStatement
      includeWhen:
        - '${!naming.data.effectiveName.contains("{") && !(schema.spec.workGroup != "" && schema.spec.workGroupRef != "")}'
      template:
        apiVersion: athena.services.k8s.aws/v1alpha1
        kind: PreparedStatement
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          statementName: ${naming.data.effectiveName}
          queryStatement: ${schema.spec.queryStatement}
          description: "${schema.spec.description}"
          # workGroup resolved via workGroupRef cross-RGD lookup when available, else direct workGroup.
          workGroupName: >-
            ${(schema.spec.workGroupRef != "" && wgRef.size() > 0 && has(wgRef[0].status.resourceName))
              ? wgRef[0].status.resourceName
              : schema.spec.workGroup}
