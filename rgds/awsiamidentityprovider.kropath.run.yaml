---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awsiamidentityprovider.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSIAMIdentityProvider
    scope: Namespaced
    spec:
      configRef: string | default="general-policy"
      type: string | required=true enum="oidc,saml"
      nameOverride: string | default=""
      deletionPolicy: string | default="retain" enum="retain,delete"
      oidc:
        url: string | default="https://placeholder.invalid" pattern="^https://"
        thumbprints: "[]string | default=[]"
        audiences: '[]string | default=["sts.amazonaws.com"]'
      saml:
        metadataDocument: string | default=""
      tags: "map[string]string | default={}"
      syncedLabels: "map[string]string | default={}"
      syncedAnnotations: "map[string]string | default={}"
    status:
      providerArn: "${oidcProvider.status.ackResourceMetadata.arn != \"\" ? oidcProvider.status.ackResourceMetadata.arn : samlProvider.status.ackResourceMetadata.arn}"
  resources:
    - id: oidcProvider
      includeWhen:
        - ${schema.spec.type == "oidc"}
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: OpenIDConnectProvider
        metadata:
          name: >-
            ${schema.spec.nameOverride != "" ? schema.spec.nameOverride : schema.metadata.namespace + "-" + schema.metadata.name}
          namespace: "${schema.metadata.namespace}"
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name, "kropath.run/environment": "production"}}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMIdentityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          url: "${schema.spec.oidc.url}"
          clientIDs: "${schema.spec.oidc.audiences}"
          thumbprints: "${schema.spec.oidc.thumbprints}"
          tags: >-
            ${[
              {"key": "cost-centre", "value": "platform"},
              {"key": "kropath.run/environment", "value": "production"}
            ]}

    - id: samlProvider
      includeWhen:
        - ${schema.spec.type == "saml"}
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: SAMLProvider
        metadata:
          name: >-
            ${schema.spec.nameOverride != "" ? schema.spec.nameOverride : schema.metadata.namespace + "-" + schema.metadata.name}
          namespace: "${schema.metadata.namespace}"
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name, "kropath.run/environment": "production"}}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMIdentityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: >-
            ${schema.spec.nameOverride != "" ? schema.spec.nameOverride : schema.metadata.namespace + "-" + schema.metadata.name}
          samlMetadataDocument: "${schema.spec.saml.metadataDocument}"
          tags: >-
            ${[
              {"key": "cost-centre", "value": "platform"},
              {"key": "kropath.run/environment", "value": "production"}
            ]}
