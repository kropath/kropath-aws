---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: iamidentityprovider.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: IAMIdentityProvider
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      type: string | required=true
      # nameOverride is kept for schema consistency across all kropath RGDs (ADR-015 §"Required
      # Wiring") but is a no-op here: the ACK OpenIDConnectProvider CRD has no `name`/`spec.name`
      # field to set (confirmed against kropath-core/docs/crd-cache/aws/iam-controller-v1.4.2.md —
      # OpenIDConnectProvider spec is clientIDs/tags/thumbprints/url only), and SAMLProvider is not
      # yet supported by the ACK IAM controller at all. There is no cloud resource name to override.
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      oidc:
        url: string | default=""
        thumbprints: "[]string | default=[]"
        audiences: "[]string | default=[]"
      saml:
        metadataDocument: string | default=""
    # No resourceName / namingStatus / predictedArn fields here: unlike other IAM RGDs,
    # IAMIdentityProvider has no cloud resource "name" to compute. The ACK OpenIDConnectProvider
    # CRD (the only supported provider type) takes no name parameter — AWS identifies OIDC
    # providers by URL, not by name — so namingTemplate/nameOverride/{tag.X} tokens never apply
    # to this RGD's cloud resource. See docs/frequent-rgd-errors.md
    # §"IAMIdentityProvider Has No Cloud Resource Name — namingTemplate Does Not Apply".
    status:
      providerArn: >-
        ${has(oidcProvider.status) ? oidcProvider.status.?ackResourceMetadata.?arn.orValue("") : ""}
      conditions: >-
        ${has(oidcProvider.status) ? oidcProvider.status.?conditions.orValue([]) : []}
      validationError: >-
        ${has(urlValidationError.data) && has(urlValidationError.data.error) ? urlValidationError.data.error : ""}
    additionalPrinterColumns:
      - name: Type
        type: string
        jsonPath: .spec.type
      - name: ProviderArn
        type: string
        jsonPath: .status.providerArn
      - name: ValidationError
        type: string
        jsonPath: .status.validationError
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: IAMConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}
    - id: oidcProvider
      includeWhen:
        - '${has(schema.spec) && schema.spec.type == "oidc"}'
        - '${schema.spec.oidc.url == "" || schema.spec.oidc.url.startsWith("https://")}'
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: OpenIDConnectProvider
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          clientIDs: >-
            ${schema.spec.oidc.audiences}
          thumbprints: >-
            ${schema.spec.oidc.thumbprints}
          url: >-
            ${schema.spec.oidc.url}
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.tags : {})
              .merge(schema.spec.syncedAnnotations)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.tags)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.tags : {})
              .transformList(k, v, {"key": k, "value": v})}
    - id: samlProvider
      includeWhen:
        - '${has(schema.spec) && schema.spec.type == "saml"}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-samlprovider-advisory
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          status: "UNSUPPORTED"
          message: >
            ACK controller does not support samlProvider yet.
    - id: urlValidationError
      includeWhen:
        - '${has(schema.spec) && schema.spec.type == "oidc"}'
        - '${schema.spec.oidc.url != "" && !schema.spec.oidc.url.startsWith("https://")}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-url-validation-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "OIDC URL must use HTTPS"
