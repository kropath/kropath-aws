# Spec: kropath-core/docs/specs/aws/aws-bedrock-09-bedrockgatewaytarget.md
# CRD cache: kropath-core/docs/crd-cache/aws/bedrockagentcorecontrol-v1.14.0.md
#
# IMPORTANT: The ACK GatewayTarget CRD has NO tags field. Cloud-side tags cannot be
# propagated. Tags are tracked in Kubernetes metadata only (labels/annotations).
# No allCloudMetadata propagation to ACK child spec.
#
# Mutual exclusivity: gatewayIdentifier XOR gatewayIdentifierRef (ConfigMap advisory).
# Cross-family ref: gatewayIdentifierRef → ACK Gateway child by app.kubernetes.io/instance label.
# predictedArn sourced from ACK status (AWS-assigned target ID).
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: bedrockgatewaytarget.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: BedrockGatewayTarget
    scope: Namespaced
    spec:
      configRef: string | default="general-policy"
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: "map[string]string | default={}"
      syncedLabels: "map[string]string | default={}"
      syncedAnnotations: "map[string]string | default={}"
      # Required
      targetConfiguration: BedrockGatewayTargetConfiguration
      # Optional — gateway association
      gatewayIdentifier: string | default=""
      gatewayIdentifierRef: string | default=""
      # Optional
      description: string | default=""
      credentialProviderConfigurations: "[]BedrockCredentialProviderConfiguration | default=[]"
      metadataConfiguration: "BedrockTargetMetadataConfiguration | default={}"
      privateEndpoint: "BedrockPrivateEndpoint | default={}"
    types:
      BedrockGatewayTargetConfiguration:
        mcp: BedrockMcpTargetConfig
      BedrockMcpTargetConfig:
        lambda: BedrockLambdaTargetConfig
        mcpServer: BedrockMcpServerConfig
        apiGateway: BedrockApiGatewayTargetConfig
        openAPISchema: BedrockOpenAPISchemaConfig
        smithyModel: BedrockSmithyModelConfig
      BedrockLambdaTargetConfig:
        lambdaARN: string
        toolSchema: BedrockTargetToolSchema
      BedrockMcpServerConfig:
        endpoint: string
      BedrockApiGatewayTargetConfig:
        restAPIID: string
        stage: string
        apiGatewayToolConfiguration: BedrockApiGatewayToolConfig
      BedrockApiGatewayToolConfig:
        toolFilters: "[]BedrockApiToolFilter | default=[]"
        toolOverrides: "[]BedrockApiToolOverride | default=[]"
      BedrockApiToolFilter:
        filterPath: string
        methods: "[]string | default=[]"
      BedrockApiToolOverride:
        description: string
        method: string
        name: string
        path: string
      BedrockOpenAPISchemaConfig:
        inlinePayload: string
        s3: BedrockS3GatewayConfig
      BedrockSmithyModelConfig:
        inlinePayload: string
        s3: BedrockS3GatewayConfig
      BedrockS3GatewayConfig:
        bucketOwnerAccountID: string
        uri: string
      BedrockTargetToolSchema:
        inlinePayload: "[]BedrockToolDef | default=[]"
        s3: BedrockS3GatewayConfig
      BedrockToolDef:
        description: string
        inputSchema: string
        name: string
        outputSchema: string
      BedrockCredentialProviderConfiguration:
        credentialProviderType: string
        credentialProvider: BedrockTargetCredentialProvider
      BedrockTargetCredentialProvider:
        apiKeyCredentialProvider: BedrockApiKeyCredentialProvider
        oauthCredentialProvider: BedrockOauthCredentialProvider
      BedrockApiKeyCredentialProvider:
        credentialLocation: string
        credentialParameterName: string
        credentialPrefix: string
        providerARN: string
      BedrockOauthCredentialProvider:
        customParameters: "map[string]string | default={}"
        defaultReturnURL: string
        grantType: string
        providerARN: string
        scopes: "[]string | default=[]"
      BedrockTargetMetadataConfiguration:
        allowedRequestHeaders: "[]string | default=[]"
        allowedResponseHeaders: "[]string | default=[]"
        allowedQueryParameters: "[]string | default=[]"
      BedrockPrivateEndpoint:
        managedVPCResource: BedrockManagedVPCResource
        selfManagedLatticeResource: BedrockSelfManagedLatticeResource
      BedrockManagedVPCResource:
        endpointIPAddressType: string
        routingDomain: string
        securityGroupIDs: "[]string | default=[]"
        subnetIDs: "[]string | default=[]"
        vpcIdentifier: string
      BedrockSelfManagedLatticeResource:
        resourceConfigurationIdentifier: string
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      predictedArn: >-
        ${ackTargetRef.size() > 0 ? ackTargetRef[0].?status.?ackResourceMetadata.?arn.orValue("") : ""}
      conditions: >-
        ${ackTargetRef.size() > 0 ? ackTargetRef[0].?status.?conditions.orValue([]) : []}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus

  resources:
    # Config lookup.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: BedrockConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.spec.?configRef.orValue("general-policy")}

    # Naming ConfigMap.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}

    # Cross-family lookup: resolves gatewayIdentifierRef (BedrockGateway CR name) → gatewayID.
    # Looks up the ACK Gateway child by app.kubernetes.io/instance label and reads status.gatewayID.
    # Uses kro-empty-fallback-sentinel when gatewayIdentifierRef is "" to ensure empty list.
    - id: gatewayRefCr
      externalRef:
        apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
        kind: Gateway
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              app.kubernetes.io/instance: '${schema.spec.gatewayIdentifierRef != "" ? schema.spec.gatewayIdentifierRef : "kro-empty-fallback-sentinel"}'

    # ConfigMap advisory: fires when both gatewayIdentifier AND gatewayIdentifierRef are set.
    - id: mutualExclusionGatewayError
      includeWhen:
        - '${schema.spec.gatewayIdentifier != "" && schema.spec.gatewayIdentifierRef != ""}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-gateway-exclusion-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "gatewayIdentifier and gatewayIdentifierRef are mutually exclusive — set exactly one"

    # ACK GatewayTarget resource.
    # NOTE: ACK GatewayTarget CRD has no spec.tags field — no allCloudMetadata propagation.
    # Tags are reflected in Kubernetes metadata only via syncedLabels/syncedAnnotations.
    - id: ackTarget
      template:
        apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
        kind: GatewayTarget
        metadata:
          name: ${naming.data.effectiveName}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.effectiveName}
          targetConfiguration: ${schema.spec.targetConfiguration}
          gatewayIdentifier: >-
            ${schema.spec.gatewayIdentifier != ""
              ? schema.spec.gatewayIdentifier
              : (gatewayRefCr.size() > 0 ? gatewayRefCr[0].?status.?gatewayID.orValue("") : "")}
          description: ${schema.spec.?description.orValue("")}
          credentialProviderConfigurations: ${schema.spec.credentialProviderConfigurations}
          metadataConfiguration: ${schema.spec.metadataConfiguration}
          privateEndpoint: ${schema.spec.privateEndpoint}

    # Always-bound self-lookup for ACK GatewayTarget child status.
    - id: ackTargetRef
      externalRef:
        apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
        kind: GatewayTarget
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              app.kubernetes.io/instance: ${schema.metadata.name}
