---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: snstopic.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: SNSTopic
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # Topic type — true enables FIFO mode and appends .fifo suffix to effectiveName
      fifo: boolean | default=false
      # FIFO-specific fields (ignored when fifo=false)
      contentBasedDeduplication: boolean | default=false
      fifoThroughputScope: string | default=Topic
      # Display name shown for SMS and push notification deliveries
      displayName: string | default=""
      # Encryption (governed by SNSConfig cascade)
      kmsMasterKeyId: string | default=""
      # Topic access policy (resource-based via PolicyDocument)
      topicPolicyRef: string | default=""
      # Data protection (governed by SNSConfig cascade)
      dataProtectionPolicy: string | default=""
      # Message signing (governed by SNSConfig cascade)
      signatureVersion: string | default=""
      # X-Ray tracing (governed by SNSConfig cascade)
      tracingConfig: string | default=""
      # Delivery feedback logging per protocol (governed by SNSConfig cascade)
      deliveryFeedback:
        application:
          successFeedbackRoleArn: string | default=""
          failureFeedbackRoleArn: string | default=""
          successFeedbackSampleRate: string | default=""
        http:
          successFeedbackRoleArn: string | default=""
          failureFeedbackRoleArn: string | default=""
          successFeedbackSampleRate: string | default=""
        lambda:
          successFeedbackRoleArn: string | default=""
          failureFeedbackRoleArn: string | default=""
          successFeedbackSampleRate: string | default=""
        sqs:
          successFeedbackRoleArn: string | default=""
          failureFeedbackRoleArn: string | default=""
          successFeedbackSampleRate: string | default=""
        firehose:
          successFeedbackRoleArn: string | default=""
          failureFeedbackRoleArn: string | default=""
          successFeedbackSampleRate: string | default=""
    status:
      resourceName: >-
        ${naming.data.resourceName}
      namingStatus: >-
        ${naming.data.namingStatus}
      predictedArn: >-
        ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.aws) && naming.data.resourceName != "" && !naming.data.resourceName.contains("{")
          ? "arn:aws:sns:" + rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") + ":" + rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") + ":" + naming.data.resourceName
          : ""}
      topicArn: >-
        ${topicPolicyCr.size() > 0
          ? (naming.data.hasFeedback == "true"
              ? (naming.data.hasAnyFeedbackARN == "true"
                  ? ackTopicWithPolicyWithFeedback.?status.?topicARN.orValue("")
                  : ackTopicWithPolicyWithFeedbackNoARN.?status.?topicARN.orValue(""))
              : ackTopicWithPolicyNoFeedback.?status.?topicARN.orValue(""))
          : (naming.data.hasFeedback == "true"
              ? (naming.data.hasAnyFeedbackARN == "true"
                  ? ackTopicNoPolicyWithFeedback.?status.?topicARN.orValue("")
                  : ackTopicNoPolicyWithFeedbackNoARN.?status.?topicARN.orValue(""))
              : ackTopicNoPolicyNoFeedback.?status.?topicARN.orValue(""))}
      conditions: >-
        ${ackTopicNoPolicyNoFeedback.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
  resources:
    # Single governance config lookup — controller pre-merges all cascade layers (ADR-010 D-1).
    # Uses selector.matchLabels (Theme 28/KRO-221) — CEL in externalRef.metadata.name is not evaluated.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: SNSConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # Topic policy resolution via PolicyDocument (optional).
    # Sentinel pattern: when topicPolicyRef is empty, selector never matches and topicPolicyCr is [].
    - id: topicPolicyCr
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: PolicyDocument
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.topicPolicyRef != "" ? schema.spec.topicPolicyRef : "kro-empty-fallback-sentinel"}'

    # ConfigMap to materialise effectiveName, resourceName (with .fifo suffix), namingStatus,
    # and hasFeedback (KRO-911: controls whether delivery-feedback ACK attributes are emitted).
    # Computed here so the status block can reference naming.data.* without requiring schema.* access
    # (schema is out of scope in the status block — see frequent-rgd-errors.md section 3).
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: sns-naming
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: SNSTopic
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          # effectiveName: base name with full {tag.X} dynamic substitution support.
          # Tag tokens resolved in cascade order: mandatory wins over spec, spec wins over defaults.
          # Any {tag.X} token whose key is absent in all tiers is kept verbatim so namingStatus
          # (computed below from resourceName) reports "invalid-unresolved-tokens".
          effectiveName: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}
          # resourceName includes .fifo suffix for FIFO topics (appended after effectiveName resolution)
          resourceName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))
              + (schema.spec.fifo ? ".fifo" : ""))}
          namingStatus: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))
              + (schema.spec.fifo ? ".fifo" : "")).contains("{")
              ? "invalid-unresolved-tokens"
              : "valid"}
          # hasFeedback: "true" when ANY delivery-feedback field resolves to a non-empty value
          # across the mandatory tier, defaults tier, or instance spec.
          # "false" when all 15 fields are empty — ACK Topic variants that omit the delivery-feedback
          # block entirely are used in that case, so ACK never forwards empty SNS Attributes (KRO-911).
          hasFeedback: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?application.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?application.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?application.?successFeedbackSampleRate.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?http.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?http.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?http.?successFeedbackSampleRate.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?lambda.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?lambda.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?lambda.?successFeedbackSampleRate.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?sqs.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?sqs.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?sqs.?successFeedbackSampleRate.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?firehose.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?firehose.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?firehose.?successFeedbackSampleRate.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?application.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?application.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?application.?successFeedbackSampleRate.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?http.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?http.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?http.?successFeedbackSampleRate.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?lambda.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?lambda.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?lambda.?successFeedbackSampleRate.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?sqs.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?sqs.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?sqs.?successFeedbackSampleRate.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?firehose.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?firehose.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?firehose.?successFeedbackSampleRate.orValue("") != "") ||
              schema.spec.deliveryFeedback.application.successFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.application.failureFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.application.successFeedbackSampleRate != "" ||
              schema.spec.deliveryFeedback.http.successFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.http.failureFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.http.successFeedbackSampleRate != "" ||
              schema.spec.deliveryFeedback.lambda.successFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.lambda.failureFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.lambda.successFeedbackSampleRate != "" ||
              schema.spec.deliveryFeedback.sqs.successFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.sqs.failureFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.sqs.successFeedbackSampleRate != "" ||
              schema.spec.deliveryFeedback.firehose.successFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.firehose.failureFeedbackRoleArn != "" ||
              schema.spec.deliveryFeedback.firehose.successFeedbackSampleRate != ""
              ? "true" : "false"}

          hasAnyFeedbackARN: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?application.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?application.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?http.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?http.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?lambda.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?lambda.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?sqs.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?sqs.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?firehose.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?deliveryFeedback.?firehose.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?application.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?application.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?http.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?http.?failureFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?lambda.?successFeedbackRoleArn.orValue("") != "") ||
              (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?deliveryFeedback.?lambda.?failureFeedbackRoleArn.orValue("") != "") ||
