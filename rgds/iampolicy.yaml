---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: iampolicy.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: IAMPolicy
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      description: string | default=""
      path: string | default="/"
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      documentJSON: string | default=""
      documentRef: string | default=""
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
    status:
      resourceName: >-
        ${policy.?spec.?name.orValue("")}
      namingStatus: >-
        ${policy.?spec.?name.orValue("").contains("{") ? "invalid-unresolved-tokens" : (has(policy.spec) ? "valid" : "pending")}
      predictedArn: >-
        ${has(policy.spec) ? "arn:aws:iam::" + rsrcCfg.status.effectiveConfig.aws.accountId + ":policy" + policy.spec.path + policy.spec.name : ""}
      arn: >-
        ${policy.status.?ackResourceMetadata.?arn.orValue("")}
      policyId: >-
        ${policy.status.?policyID.orValue("")}
      conditions: >-
        ${policy.status.?conditions.orValue([])}
      validationError: >-
        ${has(mutualExclusionError.data) && has(mutualExclusionError.data.error) ? mutualExclusionError.data.error : ""}
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: IAMConfig
        metadata:
          name: ${schema.?spec.?configRef.orValue("general-policy")}
          namespace: ${schema.metadata.namespace}
    - id: policyDoc
      # No includeWhen — sentinel selector ensures variable is always bound as []
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: PolicyDocument
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.documentRef != "" ? schema.spec.documentRef : "kro-empty-fallback-sentinel"}'
    - id: mutualExclusionError
      includeWhen:
        - '${schema.spec.documentJSON != "" && schema.spec.documentRef != ""}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-validation-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMPolicy
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "documentJSON and documentRef are mutually exclusive — set exactly one"
    - id: policy
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Policy
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: IAMPolicy
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: >-
            ${schema.spec.nameOverride != "" ? schema.spec.nameOverride :
              ((has(rsrcCfg.status.effectiveConfig.mandatory.namingTemplate) && rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != "") ?
                rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                  .replace("{namespace}", schema.metadata.namespace)
                  .replace("{name}", schema.metadata.name) :
               ((has(rsrcCfg.status.effectiveConfig.defaults.namingTemplate) && rsrcCfg.status.effectiveConfig.defaults.namingTemplate != "") ?
                 rsrcCfg.status.effectiveConfig.defaults.namingTemplate
                   .replace("{namespace}", schema.metadata.namespace)
                   .replace("{name}", schema.metadata.name) :
                 schema.metadata.name))}
          path: "${schema.spec.path}"
          description: "${schema.spec.description}"
          policyDocument: >-
            ${schema.spec.documentRef != "" && policyDoc.size() > 0 && policyDoc[0].?spec.orValue(null) != null
              ? policyDoc[0].spec.documentJSON
              : schema.spec.documentJSON}
          tags: >-
            ${(has(rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations) ? rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations : {})
              .merge(has(rsrcCfg.status.effectiveConfig.defaults.syncedLabels) ? rsrcCfg.status.effectiveConfig.defaults.syncedLabels : {})
              .merge(has(rsrcCfg.status.effectiveConfig.defaults.tags) ? rsrcCfg.status.effectiveConfig.defaults.tags : {})
              .merge(schema.spec.syncedAnnotations)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.tags)
              .merge(has(rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations) ? rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations : {})
              .merge(has(rsrcCfg.status.effectiveConfig.mandatory.syncedLabels) ? rsrcCfg.status.effectiveConfig.mandatory.syncedLabels : {})
              .merge(has(rsrcCfg.status.effectiveConfig.mandatory.tags) ? rsrcCfg.status.effectiveConfig.mandatory.tags : {})
              .transformList(k, v, {"key": k, "value": v})}
