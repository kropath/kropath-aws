---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: apigatewayv2domainname.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: ApiGatewayV2DomainName
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # domainName: custom domain name (e.g. "api.example.com"); immutable once set (ACK enforced)
      domainName: string | required=true
      # domainNameConfigurations: ACM certificate and endpoint configs; at least one entry required.
      # Minimum size is enforced via advisory ConfigMap (kro cannot preserve x-kubernetes-validations).
      domainNameConfigurations: "[]DomainNameConfiguration | required=true"
      # mutualTlsAuthentication: optional mutual TLS configuration via S3 truststore
      mutualTlsAuthentication:
        truststoreUri: string | default=""
        truststoreVersion: string | default=""
    types:
      DomainNameConfiguration:
        # certificateArn: ACM certificate ARN (required per configuration entry)
        certificateArn: string | default=""
        # endpointType: REGIONAL only for API Gateway V2
        endpointType: string | default=REGIONAL
        # securityPolicy: TLS_1_0 | TLS_1_2; empty string = use governance/defaults cascade
        securityPolicy: string | default=""
        # ownershipCertificateArn: ownership verification certificate ARN (optional)
        ownershipCertificateArn: string | default=""
    status:
      conditions:
        - >-
          ${(ackDomain.?status.?conditions.orValue([])).map(c, runtime.newCondition({type: c.type, status: c.status, reason: c.?reason.orValue(''), message: c.?message.orValue('')}))}
      validationError: >-
        ${minSizeError.?data.?error.orValue("")}

  resources:
    # ── Governance config lookup (ADR-010 D-1, Theme 28) ─────────────────────
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: ApiGatewayV2Config
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ── TLS governance ConfigMap ──────────────────────────────────────────────
    # Pre-computes mandatory and default TLS values so the domainNameConfigurations
    # transformList can reference them without inline rsrcCfg guard complexity.
    - id: resolvedTls
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-tls
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          # mandatoryTls: non-empty when governance mandates a specific TLS version (always wins)
          mandatoryTls: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?minimumTlsVersion.orValue("") != "")
              ? rsrcCfg[0].status.effectiveConfig.mandatory.minimumTlsVersion
              : ""}
          # defaultTls: fallback when instance item does not set securityPolicy
          defaultTls: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?minimumTlsVersion.orValue("") != "")
              ? rsrcCfg[0].status.effectiveConfig.defaults.minimumTlsVersion
              : "TLS_1_2"}

    # ── Minimum-size advisory (AC-8) ──────────────────────────────────────────
    # kro cannot preserve x-kubernetes-validations across upgrades, so we use the
    # in-graph ConfigMap advisory pattern to signal invalid empty configurations.
    # status.validationError is wired to this ConfigMap's error field.
    - id: minSizeError
      includeWhen:
        - >-
          ${schema.spec.domainNameConfigurations.size() < 1}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-minsizeerror
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "At least one domainNameConfigurations entry is required."

    # ── ACK DomainName CR ─────────────────────────────────────────────────────
    # Naming exempt (KRO-236): DomainName uses spec.domainName as cloud identity,
    # not a generated effectiveName. No nameOverride, predictedArn, resourceName,
    # namingStatus, or naming ConfigMap.
    - id: ackDomain
      includeWhen:
        - >-
          ${schema.spec.domainNameConfigurations.size() >= 1}
      template:
        apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
        kind: DomainName
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          # domainName: custom domain string; identity of the resource; immutable (ACK enforced)
          domainName: ${schema.spec.domainName}
          # domainNameConfigurations: transform each entry, applying TLS governance per item.
          # Cascade: mandatory.minimumTlsVersion overrides all → instance securityPolicy → defaults.minimumTlsVersion → TLS_1_2
          # resolvedTls ConfigMap pre-computes mandatoryTls and defaultTls to avoid rsrcCfg
          # access inside the lambda (matches Stage throttling pattern).
          # CRD field names: certificateARN, ownershipVerificationCertificateARN (capital ARN — confirmed in crd-cache).
          domainNameConfigurations: >-
            ${schema.spec.domainNameConfigurations.transformList(i, item, {
              "certificateARN": item.certificateArn,
              "endpointType": item.endpointType,
              "securityPolicy": resolvedTls.data.mandatoryTls != ""
                ? resolvedTls.data.mandatoryTls
                : (item.securityPolicy != "" ? item.securityPolicy : resolvedTls.data.defaultTls),
              "ownershipVerificationCertificateARN": item.ownershipCertificateArn
            })}
          # mutualTLSAuthentication: S3 truststore for mTLS (optional; capital TLS — confirmed in crd-cache)
          mutualTLSAuthentication:
            truststoreURI: ${schema.spec.mutualTlsAuthentication.truststoreUri}
            truststoreVersion: ${schema.spec.mutualTlsAuthentication.truststoreVersion}
          # tags: ACK DomainName supports spec.tags (map[string]string — confirmed in crd-cache).
          # Cross-tier merge: defaults → spec → mandatory (last-writer-wins, mandatory has highest priority).
          # kropath.run/ prefix is Kubernetes-only; cloud tags use plain keys.
          tags: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.tags) ? rsrcCfg[0].status.effectiveConfig.defaults.tags : {})
              .merge(schema.spec.syncedAnnotations)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.tags)
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.tags) ? rsrcCfg[0].status.effectiveConfig.mandatory.tags : {})}
