# CloudFrontResponseHeadersPolicy RGD — wraps ACK cloudfront.services.k8s.aws/ResponseHeadersPolicy.
# Naming applies (responseHeadersPolicyConfig.name). No cloud tags (OD-1 option B).
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cloudfrontresponseheaderspolicy.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: CloudFrontResponseHeadersPolicy
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      comment: string | default=""
      corsConfig:
        accessControlAllowCredentials: boolean | default=false
        accessControlMaxAgeSec: integer | default=0
        originOverride: boolean | default=true
        accessControlAllowHeaders: "[]string | default=[]"
        accessControlAllowMethods: "[]string | default=[]"
        accessControlAllowOrigins: "[]string | default=[]"
        accessControlExposeHeaders: "[]string | default=[]"
      customHeadersConfig:
        items: "[]CloudFrontCustomHeader | default=[]"
      removeHeadersConfig:
        items: "[]CloudFrontRemoveHeader | default=[]"
      securityHeadersConfig:
        contentSecurityPolicy:
          contentSecurityPolicy: string | default=""
          override: boolean | default=false
        contentTypeOptions:
          override: boolean | default=false
        frameOptions:
          frameOption: string | default=""
          override: boolean | default=false
        referrerPolicy:
          referrerPolicy: string | default=""
          override: boolean | default=false
        strictTransportSecurity:
          accessControlMaxAgeSec: integer | default=0
          includeSubdomains: boolean | default=false
          preload: boolean | default=false
          override: boolean | default=false
        xssProtection:
          protection: boolean | default=false
          modeBlock: boolean | default=false
          reportURI: string | default=""
          override: boolean | default=false
      serverTimingHeadersConfig:
        enabled: boolean | default=false
        samplingRate: float | default=0
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
    types:
      CloudFrontCustomHeader:
        header: string | required=true
        value: string | required=true
        override: boolean | default=false
      CloudFrontRemoveHeader:
        header: string | required=true
    status:
      resourceName: >-
        ${naming.data.resourceName}
      namingStatus: >-
        ${naming.data.namingStatus}
      id: >-
        ${ackRHP.?status.?id.orValue("")}
      conditions:
        - >-
          ${(ackRHP.?status.?conditions.orValue([])).map(c, runtime.newCondition({type: c.type, status: c.status, reason: c.?reason.orValue(''), message: c.?message.orValue('')}))}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: PolicyID
        type: string
        jsonPath: .status.id

  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: CloudFrontConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: cloudfrontresponseheaderspolicy-naming
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontResponseHeadersPolicy
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          resourceName: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.syncedLabels
                                  ? schema.spec.syncedLabels[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedAnnotations
                                      ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                          ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                  : "{tag." + part.split("}")[0] + "}"))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}
          namingStatus: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.syncedLabels
                                  ? schema.spec.syncedLabels[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedAnnotations
                                      ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                          ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                  : "{tag." + part.split("}")[0] + "}"))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef)).contains("{")
              ? "invalid-unresolved-tokens"
              : "valid"}

    - id: ackRHP
      includeWhen:
        - '${!naming.data.resourceName.contains("{")}'
      template:
        apiVersion: cloudfront.services.k8s.aws/v1alpha1
        kind: ResponseHeadersPolicy
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name,
               "aws.kropath.run/resource-name": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontResponseHeadersPolicy
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          responseHeadersPolicyConfig:
            name: ${naming.data.resourceName}
            comment: "${schema.spec.comment}"
            corsConfig:
              accessControlAllowCredentials: ${schema.spec.corsConfig.accessControlAllowCredentials}
              accessControlMaxAgeSec: ${schema.spec.corsConfig.accessControlMaxAgeSec}
              originOverride: ${schema.spec.corsConfig.originOverride}
              accessControlAllowHeaders:
                items: ${schema.spec.corsConfig.accessControlAllowHeaders}
              accessControlAllowMethods:
                items: ${schema.spec.corsConfig.accessControlAllowMethods}
              accessControlAllowOrigins:
                items: ${schema.spec.corsConfig.accessControlAllowOrigins}
              accessControlExposeHeaders:
                items: ${schema.spec.corsConfig.accessControlExposeHeaders}
            customHeadersConfig:
              items: ${schema.spec.customHeadersConfig.items}
            removeHeadersConfig:
              items: ${schema.spec.removeHeadersConfig.items}
            securityHeadersConfig:
              contentSecurityPolicy:
                contentSecurityPolicy: "${schema.spec.securityHeadersConfig.contentSecurityPolicy.contentSecurityPolicy}"
                override: ${schema.spec.securityHeadersConfig.contentSecurityPolicy.override}
              contentTypeOptions:
                override: ${schema.spec.securityHeadersConfig.contentTypeOptions.override}
              frameOptions:
                frameOption: "${schema.spec.securityHeadersConfig.frameOptions.frameOption}"
                override: ${schema.spec.securityHeadersConfig.frameOptions.override}
              referrerPolicy:
                referrerPolicy: "${schema.spec.securityHeadersConfig.referrerPolicy.referrerPolicy}"
                override: ${schema.spec.securityHeadersConfig.referrerPolicy.override}
              strictTransportSecurity:
                accessControlMaxAgeSec: ${schema.spec.securityHeadersConfig.strictTransportSecurity.accessControlMaxAgeSec}
                includeSubdomains: ${schema.spec.securityHeadersConfig.strictTransportSecurity.includeSubdomains}
                preload: ${schema.spec.securityHeadersConfig.strictTransportSecurity.preload}
                override: ${schema.spec.securityHeadersConfig.strictTransportSecurity.override}
              xssProtection:
                protection: ${schema.spec.securityHeadersConfig.xssProtection.protection}
                modeBlock: ${schema.spec.securityHeadersConfig.xssProtection.modeBlock}
                reportURI: "${schema.spec.securityHeadersConfig.xssProtection.reportURI}"
                override: ${schema.spec.securityHeadersConfig.xssProtection.override}
            serverTimingHeadersConfig:
              enabled: ${schema.spec.serverTimingHeadersConfig.enabled}
              samplingRate: ${schema.spec.serverTimingHeadersConfig.samplingRate}
