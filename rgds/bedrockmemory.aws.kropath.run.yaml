# Spec: kropath-core/docs/specs/aws/aws-bedrock-10-bedrockmemory.md
# CRD cache: kropath-core/docs/crd-cache/aws/bedrockagentcorecontrol-v1.14.0.md
#
# No governance cascade beyond common fields (naming, tags, syncedLabels, syncedAnnotations).
# ACK field: encryptionKeyARN (uppercase ARN). ACK field: memoryExecutionRoleARN (uppercase ARN).
# Mutual exclusivity: encryptionKeyArn XOR encryptionKeyRef (ConfigMap advisory).
# Mutual exclusivity: memoryExecutionRoleArn XOR memoryExecutionRoleRef (ConfigMap advisory).
# Immutability: encryptionKeyArn/encryptionKeyRef are immutable after creation; enforced by ACK,
# not by x-kubernetes-validations (kro does not preserve CEL validation rules in generated CRDs).
# Cross-family refs: encryptionKeyRef → KMSKey CR, memoryExecutionRoleRef → IAMRole CR.
# predictedArn sourced from ACK status (AWS-assigned memory ID, not effectiveName).
# Tags field EXISTS in ACK Memory CRD — allCloudMetadata propagation applies.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: bedrockmemory.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: BedrockMemory
    scope: Namespaced
    spec:
      configRef: string | default="general-policy"
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: "map[string]string | default={}"
      syncedLabels: "map[string]string | default={}"
      syncedAnnotations: "map[string]string | default={}"
      # Required
      eventExpiryDuration: integer
      # Optional
      description: string | default=""
      encryptionKeyArn: string | default=""
      encryptionKeyRef: string | default=""
      memoryExecutionRoleArn: string | default=""
      memoryExecutionRoleRef: string | default=""
      memoryStrategies: "[]BedrockMemoryStrategy | default=[]"
      streamDeliveryResources: "BedrockStreamDeliveryResources | default={}"
    types:
      BedrockMemoryStrategy:
        episodicMemoryStrategy: BedrockEpisodicMemoryStrategy
        semanticMemoryStrategy: BedrockSemanticMemoryStrategy
        summaryMemoryStrategy: BedrockSummaryMemoryStrategy
        userPreferenceMemoryStrategy: BedrockUserPreferenceMemoryStrategy
        customMemoryStrategy: BedrockCustomMemoryStrategy
      BedrockEpisodicMemoryStrategy:
        name: string
        description: string
        namespaceTemplates: "[]string | default=[]"
        namespaces: "[]string | default=[]"
        reflectionConfiguration: BedrockMemoryReflectionConfig
      BedrockMemoryReflectionConfig:
        namespaceTemplates: "[]string | default=[]"
        namespaces: "[]string | default=[]"
      BedrockSemanticMemoryStrategy:
        name: string
        description: string
        namespaceTemplates: "[]string | default=[]"
        namespaces: "[]string | default=[]"
      BedrockSummaryMemoryStrategy:
        name: string
        description: string
        namespaceTemplates: "[]string | default=[]"
        namespaces: "[]string | default=[]"
      BedrockUserPreferenceMemoryStrategy:
        name: string
        description: string
        namespaceTemplates: "[]string | default=[]"
        namespaces: "[]string | default=[]"
      BedrockCustomMemoryStrategy:
        name: string
        description: string
        namespaceTemplates: "[]string | default=[]"
        namespaces: "[]string | default=[]"
        configuration: BedrockCustomStrategyConfiguration
      BedrockCustomStrategyConfiguration:
        episodicOverride: BedrockEpisodicOverride
        selfManagedConfiguration: BedrockSelfManagedStrategyConfig
        semanticOverride: BedrockSemanticOverride
        summaryOverride: BedrockSummaryOverride
        userPreferenceOverride: BedrockUserPreferenceOverride
      BedrockEpisodicOverride:
        consolidation: BedrockStrategyConsolidation
        extraction: BedrockStrategyExtraction
        reflection: BedrockEpisodicReflection
      BedrockSemanticOverride:
        consolidation: BedrockStrategyConsolidation
        extraction: BedrockStrategyExtraction
      BedrockSummaryOverride:
        consolidation: BedrockStrategyConsolidation
      BedrockUserPreferenceOverride:
        consolidation: BedrockStrategyConsolidation
      BedrockStrategyConsolidation:
        appendToPrompt: string
        modelID: string
      BedrockStrategyExtraction:
        appendToPrompt: string
        modelID: string
      BedrockEpisodicReflection:
        appendToPrompt: string
        modelID: string
        namespaceTemplates: "[]string | default=[]"
        namespaces: "[]string | default=[]"
      BedrockSelfManagedStrategyConfig:
        historicalContextWindowSize: integer
        invocationConfiguration: BedrockInvocationConfiguration
        triggerConditions: "[]BedrockTriggerCondition | default=[]"
      BedrockInvocationConfiguration:
        payloadDeliveryBucketName: string
        topicARN: string
      BedrockTriggerCondition:
        messageBasedTrigger: BedrockMessageBasedTrigger
        timeBasedTrigger: BedrockTimeBasedTrigger
        tokenBasedTrigger: BedrockTokenBasedTrigger
      BedrockMessageBasedTrigger:
        messageCount: integer
      BedrockTimeBasedTrigger:
        idleSessionTimeout: integer
      BedrockTokenBasedTrigger:
        tokenCount: integer
      BedrockStreamDeliveryResources:
        resources: "[]BedrockStreamDeliveryResource | default=[]"
      BedrockStreamDeliveryResource:
        kinesis: BedrockKinesisDeliveryConfig
      BedrockKinesisDeliveryConfig:
        dataStreamARN: string
        contentConfigurations: "[]BedrockContentConfiguration | default=[]"
      BedrockContentConfiguration:
        level: string
        type_: string
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      predictedArn: >-
        ${ackMemoryRef.size() > 0 ? ackMemoryRef[0].?status.?ackResourceMetadata.?arn.orValue("") : ""}
      conditions: >-
        ${ackMemoryRef.size() > 0 ? ackMemoryRef[0].?status.?conditions.orValue([]) : []}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus

  resources:
    # Config lookup.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: BedrockConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.spec.?configRef.orValue("general-policy")}

    # Naming ConfigMap.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}

    # Cross-family KMSKey lookup for encryptionKeyRef resolution.
    # Uses kro-empty-fallback-sentinel when encryptionKeyRef is "" to ensure empty list.
    - id: encryptionKeyRefCr
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: KMSKey
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.encryptionKeyRef != "" ? schema.spec.encryptionKeyRef : "kro-empty-fallback-sentinel"}'

    # Cross-family IAMRole lookup for memoryExecutionRoleRef resolution.
    - id: memoryExecutionRoleRefCr
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: IAMRole
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.memoryExecutionRoleRef != "" ? schema.spec.memoryExecutionRoleRef : "kro-empty-fallback-sentinel"}'

    # ConfigMap advisory: fires when both encryptionKeyArn AND encryptionKeyRef are set.
    - id: mutualExclusionEncryptionError
      includeWhen:
        - '${schema.spec.encryptionKeyArn != "" && schema.spec.encryptionKeyRef != ""}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-encryption-exclusion-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "encryptionKeyArn and encryptionKeyRef are mutually exclusive — set exactly one"

    # ConfigMap advisory: fires when both memoryExecutionRoleArn AND memoryExecutionRoleRef are set.
    - id: mutualExclusionRoleError
      includeWhen:
        - '${schema.spec.memoryExecutionRoleArn != "" && schema.spec.memoryExecutionRoleRef != ""}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-role-exclusion-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "memoryExecutionRoleArn and memoryExecutionRoleRef are mutually exclusive — set exactly one"

    # ACK Memory resource.
    - id: ackMemory
      template:
        apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
        kind: Memory
        metadata:
          name: ${naming.data.effectiveName}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.effectiveName}
          eventExpiryDuration: ${schema.spec.eventExpiryDuration}
          description: ${schema.spec.?description.orValue("")}
          encryptionKeyARN: >-
            ${schema.spec.encryptionKeyArn != ""
              ? schema.spec.encryptionKeyArn
              : (encryptionKeyRefCr.size() > 0 ? encryptionKeyRefCr[0].?status.?predictedArn.orValue("") : "")}
          memoryExecutionRoleARN: >-
            ${schema.spec.memoryExecutionRoleArn != ""
              ? schema.spec.memoryExecutionRoleArn
              : (memoryExecutionRoleRefCr.size() > 0 ? memoryExecutionRoleRefCr[0].?status.?predictedArn.orValue("") : "")}
          memoryStrategies: ${schema.spec.memoryStrategies}
          streamDeliveryResources: ${schema.spec.streamDeliveryResources}
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}

    # Always-bound self-lookup for ACK Memory child status.
    - id: ackMemoryRef
      externalRef:
        apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
        kind: Memory
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              app.kubernetes.io/instance: ${schema.metadata.name}
