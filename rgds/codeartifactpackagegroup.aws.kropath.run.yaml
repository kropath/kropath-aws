---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: codeartifactpackagegroup.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: CodeArtifactPackageGroup
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # Package group pattern — also the stable identifier. Immutable after creation.
      pattern: string
      # Domain reference — one of domain or domainRef is required; mutually exclusive.
      domainRef: string | default=""
      domain: string | default=""
      # Optional fields — absent from ACK PackageGroup when empty.
      domainOwner: string | default=""
      contactInfo: string | default=""
      description: string | default=""
    status:
      # Naming exemption (KRO-236): no resourceName, predictedArn, or namingStatus.
      # Package groups are identified by domain + pattern, not by a user-chosen name.
      packageGroupArn: >-
        ${ackPgBase.?status.?ackResourceMetadata.?arn.orValue(
          ackPgWithOwnerOnly.?status.?ackResourceMetadata.?arn.orValue(
            ackPgWithMetaOnly.?status.?ackResourceMetadata.?arn.orValue(
              ackPgFull.?status.?ackResourceMetadata.?arn.orValue(""))))}
      domainName: >-
        ${ackPgBase.?status.?domainName.orValue(
          ackPgWithOwnerOnly.?status.?domainName.orValue(
            ackPgWithMetaOnly.?status.?domainName.orValue(
              ackPgFull.?status.?domainName.orValue(""))))}
      conditions: >-
        ${ackPgBase.?status.?conditions.orValue([])}
      ownerConditions: >-
        ${ackPgWithOwnerOnly.?status.?conditions.orValue([])}
      metaConditions: >-
        ${ackPgWithMetaOnly.?status.?conditions.orValue([])}
      fullConditions: >-
        ${ackPgFull.?status.?conditions.orValue([])}
      validationError: >-
        ${has(domainMutualExclusionError.data) && has(domainMutualExclusionError.data.error) ? domainMutualExclusionError.data.error : ""}
    additionalPrinterColumns:
      - name: PackageGroupArn
        type: string
        jsonPath: .status.packageGroupArn
  resources:
    # Single governance config lookup — controller pre-merges all cascade layers (ADR-010 D-1).
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: CodeArtifactConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # Advisory ConfigMap — rendered only when both domain and domainRef are set simultaneously.
    - id: domainMutualExclusionError
      includeWhen:
        - '${schema.spec.domain != "" && schema.spec.domainRef != ""}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-validation-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "domain and domainRef are mutually exclusive — set exactly one"

    # CodeArtifactDomain CR lookup — conditional on domainRef being set.
    # Returns empty list when domainRef is "".
    - id: domainCr
      includeWhen:
        - ${schema.spec.domainRef != ""}
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: CodeArtifactDomain
        metadata:
          name: ${schema.spec.domainRef}
          namespace: ${schema.metadata.namespace}

    # ACK PackageGroup variant 1 — base: no optional fields (domainOwner, contactInfo, description all empty).
    # Most common case. Covers AC-7 (optional fields absent when empty).
    - id: ackPgBase
      includeWhen:
        - >-
          ${schema.spec.domainOwner == "" && schema.spec.contactInfo == "" && schema.spec.description == ""}
      template:
        apiVersion: codeartifact.services.k8s.aws/v1alpha1
        kind: PackageGroup
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          pattern: ${schema.spec.pattern}
          domain: >-
            ${schema.spec.domainRef != ""
              ? (domainCr.?status.?resourceName.orValue(""))
              : schema.spec.domain}
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}

    # ACK PackageGroup variant 2 — with domainOwner, no contactInfo/description.
    # Covers AC-6 (cross-account domain with domainOwner set).
    - id: ackPgWithOwnerOnly
      includeWhen:
        - >-
          ${schema.spec.domainOwner != "" && schema.spec.contactInfo == "" && schema.spec.description == ""}
      template:
        apiVersion: codeartifact.services.k8s.aws/v1alpha1
        kind: PackageGroup
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          pattern: ${schema.spec.pattern}
          domain: >-
            ${schema.spec.domainRef != ""
              ? (domainCr.?status.?resourceName.orValue(""))
              : schema.spec.domain}
          domainOwner: ${schema.spec.domainOwner}
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}

    # ACK PackageGroup variant 3 — with contactInfo/description, no domainOwner.
    # Covers AC-8 (contactInfo and description set without cross-account).
    - id: ackPgWithMetaOnly
      includeWhen:
        - >-
          ${schema.spec.domainOwner == "" && (schema.spec.contactInfo != "" || schema.spec.description != "")}
      template:
        apiVersion: codeartifact.services.k8s.aws/v1alpha1
        kind: PackageGroup
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          pattern: ${schema.spec.pattern}
          domain: >-
            ${schema.spec.domainRef != ""
              ? (domainCr.?status.?resourceName.orValue(""))
              : schema.spec.domain}
          contactInfo: ${schema.spec.contactInfo}
          description: ${schema.spec.description}
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}

    # ACK PackageGroup variant 4 — full: domainOwner AND contactInfo/description all set.
    - id: ackPgFull
      includeWhen:
        - >-
          ${schema.spec.domainOwner != "" && (schema.spec.contactInfo != "" || schema.spec.description != "")}
      template:
        apiVersion: codeartifact.services.k8s.aws/v1alpha1
        kind: PackageGroup
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          pattern: ${schema.spec.pattern}
          domain: >-
            ${schema.spec.domainRef != ""
              ? (domainCr.?status.?resourceName.orValue(""))
              : schema.spec.domain}
          domainOwner: ${schema.spec.domainOwner}
          contactInfo: ${schema.spec.contactInfo}
          description: ${schema.spec.description}
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}
