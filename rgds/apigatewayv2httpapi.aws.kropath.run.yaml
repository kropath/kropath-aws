---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: apigatewayv2httpapi.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: ApiGatewayV2HttpApi
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      description: string | default=""
      version: string | default=""
      # Tri-state boolean — do NOT add | default=false (frequent-rgd-errors.md §booleans)
      disableExecuteApiEndpoint: boolean
      corsConfiguration:
        allowCredentials: boolean | default=false
        allowHeaders: "[]string | default=[]"
        allowMethods: "[]string | default=[]"
        allowOrigins: "[]string | default=[]"
        exposeHeaders: "[]string | default=[]"
        maxAge: integer | default=-1
      authorizers: "[]Authorizer | default=[]"
      routes: "[]Route | required=true"
    types:
      Authorizer:
        name: string | required=true
        type: string | required=true
        identitySource: "[]string | default=[]"
        jwtIssuer: string | default=""
        jwtAudience: "[]string | default=[]"
        authorizerUri: string | default=""
        authorizerCredentials: string | default=""
        payloadFormatVersion: string | default="2.0"
        resultTtlInSeconds: integer | default=0
        # Tri-state boolean — no default (frequent-rgd-errors.md §booleans)
        enableSimpleResponses: boolean
      RouteIntegration:
        type: string | default=""
        integrationUri: string | default=""
        integrationMethod: string | default=""
        payloadFormatVersion: string | default="2.0"
        connectionType: string | default=INTERNET
        connectionRef: string | default=""
        credentialsArn: string | default=""
        timeoutInMillis: integer | default=30000
        requestParameters: map[string]string | default={}
        integrationSubtype: string | default=""
        tlsServerNameToVerify: string | default=""
      Route:
        routeKey: string | required=true
        name: string | default=""
        authorizationType: string | default=NONE
        authorizerRef: string | default=""
        authorizationScopes: "[]string | default=[]"
        operationName: string | default=""
        integration: RouteIntegration
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      conditions: >-
        ${httpApi.?status.?conditions.orValue([])}
      validationError: >-
        ${has(emptyRoutesError.data) && emptyRoutesError.data.error != "" ? emptyRoutesError.data.error : (has(duplicateRouteKeyError.data) && duplicateRouteKeyError.data.error != "" ? duplicateRouteKeyError.data.error : (has(duplicateAuthorizerNameError.data) && duplicateAuthorizerNameError.data.error != "" ? duplicateAuthorizerNameError.data.error : (has(invalidAuthorizerRefError.data) && invalidAuthorizerRefError.data.error != "" ? invalidAuthorizerRefError.data.error : (has(doubleHyphenRouteKeyError.data) && doubleHyphenRouteKeyError.data.error != "" ? doubleHyphenRouteKeyError.data.error : (has(corsValidationError.data) && corsValidationError.data.error != "" ? corsValidationError.data.error : "")))))}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: ValidationError
        type: string
        jsonPath: .status.validationError

  resources:
    # ── Governance config lookup (ADR-010 D-1, Theme 28) ─────────────────────
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: ApiGatewayV2Config
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ── Naming ConfigMap (status block cannot access schema.*) ────────────────
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (part.split("}")[0] in schema.spec.tags
                              ? schema.spec.tags[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.syncedLabels
                                  ? schema.spec.syncedLabels[part.split("}")[0]]
                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                      ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                          ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                          : "{tag." + part.split("}")[0] + "}"))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}

    # ── Advisory ConfigMaps — ALWAYS created (no includeWhen).                ─
    # ── data.error is non-empty only when the condition fires.                ─
    # ── ACK resource includeWhen mirrors the schema conditions directly        ─
    # ── (kro cannot reference an excluded resource in includeWhen).           ─

    - id: emptyRoutesError
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-empty-routes-error
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: '${schema.spec.routes.size() == 0 ? "spec.routes must contain at least one route" : ""}'

    - id: duplicateRouteKeyError
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-duplicate-route-key-error
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: >-
            ${schema.spec.routes.exists(r, schema.spec.routes.filter(r2, r2.routeKey == r.routeKey).size() > 1)
              ? "spec.routes contains duplicate routeKey values — each routeKey must be unique"
              : ""}

    - id: duplicateAuthorizerNameError
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-duplicate-authorizer-name-error
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: >-
            ${schema.spec.authorizers.exists(a, schema.spec.authorizers.filter(a2, a2.name == a.name).size() > 1)
              ? "spec.authorizers contains duplicate name values — each authorizer name must be unique"
              : ""}

    - id: invalidAuthorizerRefError
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-invalid-authorizer-ref-error
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: >-
            ${schema.spec.routes.exists(r, r.authorizerRef != "" && !schema.spec.authorizers.exists(a, a.name == r.authorizerRef))
              ? "spec.routes contains an authorizerRef that does not match any entry in spec.authorizers"
              : ""}

    - id: doubleHyphenRouteKeyError
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-double-hyphen-route-key-error
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: >-
            ${schema.spec.routes.exists(r, r.routeKey.contains("--"))
              ? "spec.routes contains a routeKey with '--'; reserved for slug delimiters — use a single slash or different separator"
              : ""}

    # CORS validation: mandatory.corsEnabled requires allowOrigins to be non-empty.
    - id: corsValidationError
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-cors-validation-error
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: >-
            ${rsrcCfg.size() > 0
              && rsrcCfg[0].?status.?effectiveConfig.?mandatory.?corsEnabled.orValue(false)
              && schema.spec.corsConfiguration.allowOrigins.size() == 0
              ? "corsConfiguration.allowOrigins is required when mandatory.corsEnabled is true"
              : ""}

    # ── Combined gate condition (mirrors all advisory ConfigMap conditions) ────
    # ── Used identically on httpApi, apiAuthorizers, apiIntegrations, apiRoutes.

    # ACK API (protocolType=HTTP, static single instance)
    - id: httpApi
      includeWhen:
        - >-
          ${!naming.data.effectiveName.contains("{")
           && schema.spec.routes.size() > 0
           && !schema.spec.routes.exists(r, schema.spec.routes.filter(r2, r2.routeKey == r.routeKey).size() > 1)
           && !schema.spec.authorizers.exists(a, schema.spec.authorizers.filter(a2, a2.name == a.name).size() > 1)
           && !schema.spec.routes.exists(r, r.authorizerRef != "" && !schema.spec.authorizers.exists(a, a.name == r.authorizerRef))
           && !schema.spec.routes.exists(r, r.routeKey.contains("--"))
           && (!(rsrcCfg.size() > 0 && rsrcCfg[0].?status.?effectiveConfig.?mandatory.?corsEnabled.orValue(false)) || schema.spec.corsConfiguration.allowOrigins.size() > 0)}
      template:
        apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
        kind: API
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.effectiveName}
          protocolType: HTTP
          description: ${schema.spec.description}
          version: ${schema.spec.version}
          # ACK field: disableExecuteAPIEndpoint (capital A and P — confirmed in crd-cache)
          disableExecuteAPIEndpoint: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].?status.?effectiveConfig.?mandatory.?disableExecuteApiEndpoint.orValue(false))
              ? true
              : (has(schema.spec.disableExecuteApiEndpoint)
                  ? schema.spec.disableExecuteApiEndpoint
                  : (rsrcCfg.size() > 0 && rsrcCfg[0].?status.?effectiveConfig.?defaults.?disableExecuteApiEndpoint.orValue(false)))}
          corsConfiguration:
            allowCredentials: ${schema.spec.corsConfiguration.allowCredentials}
            allowHeaders: ${schema.spec.corsConfiguration.allowHeaders}
            allowMethods: ${schema.spec.corsConfiguration.allowMethods}
            allowOrigins: ${schema.spec.corsConfiguration.allowOrigins}
            exposeHeaders: ${schema.spec.corsConfiguration.exposeHeaders}
            maxAge: ${schema.spec.corsConfiguration.maxAge}
          # ACK API tags is map[string]string (not {key,value} array).
          # Cascade: defaults syncedAnnotations/syncedLabels/tags → spec → mandatory (last-writer-wins).
          tags: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.tags) ? rsrcCfg[0].status.effectiveConfig.defaults.tags : {})
              .merge(schema.spec.syncedAnnotations)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.tags)
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.tags) ? rsrcCfg[0].status.effectiveConfig.mandatory.tags : {})}

    # ── ACK Authorizers (forEach over spec.authorizers) ───────────────────────
    - id: apiAuthorizers
      includeWhen:
        - >-
          ${schema.spec.authorizers.size() > 0
           && !naming.data.effectiveName.contains("{")
           && schema.spec.routes.size() > 0
           && !schema.spec.routes.exists(r, schema.spec.routes.filter(r2, r2.routeKey == r.routeKey).size() > 1)
           && !schema.spec.authorizers.exists(a, schema.spec.authorizers.filter(a2, a2.name == a.name).size() > 1)
           && !schema.spec.routes.exists(r, r.authorizerRef != "" && !schema.spec.authorizers.exists(a, a.name == r.authorizerRef))
           && !schema.spec.routes.exists(r, r.routeKey.contains("--"))
           && (!(rsrcCfg.size() > 0 && rsrcCfg[0].?status.?effectiveConfig.?mandatory.?corsEnabled.orValue(false)) || schema.spec.corsConfiguration.allowOrigins.size() > 0)}
      forEach:
        - auth: "${schema.spec.authorizers}"
      template:
        apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
        kind: Authorizer
        metadata:
          name: ${schema.metadata.name}-auth-${auth.name.lowerAscii().replace(" ", "-")}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          # ACK field: name (required by ACK Authorizer CRD)
          name: ${auth.name}
          # apiRef links to the parent ACK API CR
          apiRef:
            from:
              name: ${schema.metadata.name}
          # ACK field: authorizerType (not "type")
          authorizerType: ${auth.type}
          identitySource: ${auth.identitySource}
          # ACK field: authorizerURI (capital URI)
          authorizerURI: ${auth.authorizerUri}
          # ACK field: authorizerCredentialsARN (capital ARN)
          authorizerCredentialsARN: ${auth.authorizerCredentials}
          # ACK field: authorizerPayloadFormatVersion
          authorizerPayloadFormatVersion: ${auth.payloadFormatVersion}
          # ACK field: authorizerResultTTLInSeconds
          authorizerResultTTLInSeconds: ${auth.resultTtlInSeconds}
          enableSimpleResponses: ${auth.?enableSimpleResponses.orValue(true)}
          jwtConfiguration:
            audience: ${auth.jwtAudience}
            issuer: ${auth.jwtIssuer}

    # ── ACK Integrations (forEach over routes that have an integration) ────────
    - id: apiIntegrations
      includeWhen:
        - >-
          ${schema.spec.routes.filter(r, r.?integration.?type.orValue("") != "").size() > 0
           && !naming.data.effectiveName.contains("{")
           && schema.spec.routes.size() > 0
           && !schema.spec.routes.exists(r, schema.spec.routes.filter(r2, r2.routeKey == r.routeKey).size() > 1)
           && !schema.spec.authorizers.exists(a, schema.spec.authorizers.filter(a2, a2.name == a.name).size() > 1)
           && !schema.spec.routes.exists(r, r.authorizerRef != "" && !schema.spec.authorizers.exists(a, a.name == r.authorizerRef))
           && !schema.spec.routes.exists(r, r.routeKey.contains("--"))
           && (!(rsrcCfg.size() > 0 && rsrcCfg[0].?status.?effectiveConfig.?mandatory.?corsEnabled.orValue(false)) || schema.spec.corsConfiguration.allowOrigins.size() > 0)}
      forEach:
        - route: "${schema.spec.routes.filter(r, r.?integration.?type.orValue('') != '')}"
      template:
        apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
        kind: Integration
        metadata:
          name: ${schema.metadata.name}-int-${route.routeKey.lowerAscii().replace("$","").replace("{","").replace("}","").replace("/","--").replace(" ","-")}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          apiRef:
            from:
              name: ${schema.metadata.name}
          # ACK field: integrationType (not "type")
          integrationType: ${route.integration.type}
          # ACK field: integrationURI (capital URI)
          integrationURI: ${route.integration.integrationUri}
          integrationMethod: ${route.integration.integrationMethod}
          payloadFormatVersion: ${route.integration.payloadFormatVersion}
          connectionType: ${route.integration.connectionType}
          # connectionRef links to a VPC Link CR only when connectionType == VPC_LINK
          connectionRef:
            from:
              name: '${route.integration.connectionType == "VPC_LINK" ? route.integration.connectionRef : ""}'
          # ACK field: credentialsARN (capital ARN)
          credentialsARN: ${route.integration.credentialsArn}
          timeoutInMillis: ${route.integration.timeoutInMillis}
          requestParameters: ${route.integration.requestParameters}
          integrationSubtype: ${route.integration.integrationSubtype}
          tlsConfig:
            serverNameToVerify: ${route.integration.tlsServerNameToVerify}

    # ── ACK Routes (forEach over all spec.routes) ─────────────────────────────
    - id: apiRoutes
      includeWhen:
        - >-
          ${!naming.data.effectiveName.contains("{")
           && schema.spec.routes.size() > 0
           && !schema.spec.routes.exists(r, schema.spec.routes.filter(r2, r2.routeKey == r.routeKey).size() > 1)
           && !schema.spec.authorizers.exists(a, schema.spec.authorizers.filter(a2, a2.name == a.name).size() > 1)
           && !schema.spec.routes.exists(r, r.authorizerRef != "" && !schema.spec.authorizers.exists(a, a.name == r.authorizerRef))
           && !schema.spec.routes.exists(r, r.routeKey.contains("--"))
           && (!(rsrcCfg.size() > 0 && rsrcCfg[0].?status.?effectiveConfig.?mandatory.?corsEnabled.orValue(false)) || schema.spec.corsConfiguration.allowOrigins.size() > 0)}
      forEach:
        - route: "${schema.spec.routes}"
      template:
        apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
        kind: Route
        metadata:
          name: ${schema.metadata.name}-route-${route.routeKey.lowerAscii().replace("$","").replace("{","").replace("}","").replace("/","--").replace(" ","-")}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          apiRef:
            from:
              name: ${schema.metadata.name}
          routeKey: ${route.routeKey}
          authorizationType: ${route.authorizationType}
          authorizationScopes: ${route.authorizationScopes}
          operationName: ${route.operationName}
          # authorizerRef links to the ACK Authorizer CR by K8s name (computed from user's authorizerRef name)
          authorizerRef:
            from:
              name: '${route.authorizerRef != "" ? schema.metadata.name + "-auth-" + route.authorizerRef.lowerAscii().replace(" ", "-") : ""}'
          # targetRef links to the ACK Integration CR for this route (empty when no integration)
          targetRef:
            from:
              name: '${route.?integration.?type.orValue("") != "" ? schema.metadata.name + "-int-" + route.routeKey.lowerAscii().replace("$","").replace("{","").replace("}","").replace("/","--").replace(" ","-") : ""}'
