# aws-ram-03 — RAMResourceShare (Atomic). Wraps ACK ram.services.k8s.aws/ResourceShare.
# A RAM resource share: the bundle of resources, principals and permissions that grants
# cross-account access.
#
# Validation deviation from the spec (deliberate): the spec sketches
# `x-kubernetes-validations` for (a) permissionARNs/permissionRefs mutual exclusivity and
# (b) allowedResourceTypes enforcement. kro v0.9.2 regenerates the CRD from this schema on
# every apply and silently discards hand-authored CEL validation rules
# (docs/frequent-rgd-errors.md §"x-kubernetes-validations Cannot Be Auto-Generated by kro
# v0.9.2"). Both rules are therefore implemented with the in-graph advisory pattern: a
# `validationError` ConfigMap surfaced through `status.validationError`, plus an
# `includeWhen` gate that stops the ACK child (and therefore the cloud resource) from being
# created at all while the input is invalid.
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: ramresourceshare.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: RAMResourceShare
    scope: Namespaced
    spec:
      # ── Standard governance surface (ADR-015) ────────────────────────────
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # ── Resource share properties ────────────────────────────────────────
      # allowExternalPrincipals: tri-state. Declared WITHOUT a default so kro omits
      # `default:` from the generated CRD and has() can distinguish "unset" (defer to the
      # governance cascade) from an explicit value. Never add `| default=false` here —
      # Kubernetes would materialise false on every instance and has() would always be true
      # (docs/frequent-rgd-errors.md §"Boolean Field Presence Check (has()) Broken by CRD
      # Defaults").
      allowExternalPrincipals: boolean
      # permissionARNs / permissionRefs are mutually exclusive — see the header note.
      permissionARNs: "[]string | default=[]"
      permissionRefs: "[]RAMPermissionRef | default=[]"
      principals: "[]string | default=[]"
      resourceARNs: "[]string | default=[]"
      sources: "[]string | default=[]"
    types:
      # Leaves are declared bare (no `| default=`) so kro does not synthesize a `{}` default
      # for the parent object (docs/frequent-rgd-errors.md §"Named-type fields get a
      # synthesized {} default iff every leaf has a default").
      RAMPermissionRef:
        from: RAMPermissionRefFrom
      RAMPermissionRefFrom:
        name: string
        namespace: string
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      # RAM resource share ARNs embed an AWS-assigned UUID, not the user-chosen name, so
      # predictedArn cannot be constructed before creation (ADR-015 §9.4 carve-out). Both
      # fields are populated post-creation from the ACK child's status; resourceShareArn is
      # the canonical name and predictedArn mirrors it for cross-RGD ARN consistency.
      predictedArn: >-
        ${ackShare.?status.?ackResourceMetadata.?arn.orValue("")}
      resourceShareArn: >-
        ${ackShare.?status.?ackResourceMetadata.?arn.orValue("")}
      shareStatus: >-
        ${ackShare.?status.?status.orValue("")}
      validationError: >-
        ${has(validationError.data) && has(validationError.data.error) ? validationError.data.error : ""}
      conditions: >-
        ${ackShare.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: ShareStatus
        type: string
        jsonPath: .status.shareStatus
      - name: ResourceShareArn
        type: string
        jsonPath: .status.resourceShareArn

  resources:
    # ── Governance config lookup (ADR-010 D-1, Theme 28) ─────────────────────
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: RAMConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ── Naming ConfigMap (status block cannot access schema.* directly) ───────
    # Precedence per aws-ram-02/03 §Governance: mandatory.namingTemplate → instance
    # nameOverride → defaults.namingTemplate → "{namespace}-{name}". Note this differs from
    # older RGDs in this repo, where nameOverride is checked first; the RAM specs state
    # explicitly that the mandatory tier outranks nameOverride, which is what a mandatory
    # governance tier is for.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${(((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
              ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
              : (schema.spec.nameOverride != ""
                  ? schema.spec.nameOverride
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (part.split("}")[0] in schema.spec.tags
                              ? schema.spec.tags[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.syncedLabels
                                  ? schema.spec.syncedLabels[part.split("}")[0]]
                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                      ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                          ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                          : "{tag." + part.split("}")[0] + "}"))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}

    # ── In-graph validation advisory (replaces x-kubernetes-validations) ─────
    # Gate reads only schema.spec and the externalRef config — never another graph node —
    # so it still evaluates during deletion (docs/frequent-rgd-errors.md §"includeWhen Must
    # Not Read Another Node in the Same Graph").
    #
    # allowedResourceTypes matching (spec OQ-1): an entry is "<service>:<resourceType>"
    # (e.g. "ec2:TransitGateway") and an ARN is
    # "arn:aws:<service>:<region>:<account>:<resourceType>/<id>" (e.g. ".../transit-gateway/tgw-1").
    # Both sides are lower-cased and stripped of "-" before comparison, so the CamelCase
    # config token matches the hyphenated lower-case ARN segment.
    - id: validationError
      includeWhen:
        - >-
          ${(schema.spec.permissionARNs.size() > 0 && schema.spec.permissionRefs.size() > 0)
            || !(rsrcCfg.size() == 0
                 || rsrcCfg[0].?status.?effectiveConfig.?mandatory.?allowedResourceTypes.orValue([]).size() == 0
                 || schema.spec.resourceARNs.all(a,
                      rsrcCfg[0].status.effectiveConfig.mandatory.allowedResourceTypes.exists(t,
                        size(t.split(":")) > 1
                        && a.lowerAscii().replace("-", "").contains(":" + t.lowerAscii().replace("-", "").split(":")[0] + ":")
                        && a.lowerAscii().replace("-", "").contains(":" + t.lowerAscii().replace("-", "").split(":")[1] + "/"))))}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-validation-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: >-
            ${(schema.spec.permissionARNs.size() > 0 && schema.spec.permissionRefs.size() > 0)
              ? "permissionARNs and permissionRefs are mutually exclusive"
              : "resourceARNs contains resource types not in the allowed list"}

    # ── ACK ResourceShare CR ─────────────────────────────────────────────────
    # Gated on: naming valid, permission fields not both set, every resourceARN inside the
    # mandatory allowedResourceTypes allowlist.
    - id: ackShare
      includeWhen:
        - >-
          ${!naming.data.effectiveName.contains("{")
            && !(schema.spec.permissionARNs.size() > 0 && schema.spec.permissionRefs.size() > 0)
            && (rsrcCfg.size() == 0
                || rsrcCfg[0].?status.?effectiveConfig.?mandatory.?allowedResourceTypes.orValue([]).size() == 0
                || schema.spec.resourceARNs.all(a,
                     rsrcCfg[0].status.effectiveConfig.mandatory.allowedResourceTypes.exists(t,
                       size(t.split(":")) > 1
                       && a.lowerAscii().replace("-", "").contains(":" + t.lowerAscii().replace("-", "").split(":")[0] + ":")
                       && a.lowerAscii().replace("-", "").contains(":" + t.lowerAscii().replace("-", "").split(":")[1] + "/"))))}
      template:
        apiVersion: ram.services.k8s.aws/v1alpha1
        kind: ResourceShare
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.effectiveName}
          # Governance cascade: mandatory → instance → defaults → AWS default (true).
          # has() on the mandatory/defaults tiers is honest because RAMConfig declares
          # allowExternalPrincipals as `nullable: true` with no default.
          allowExternalPrincipals: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.allowExternalPrincipals))
              ? rsrcCfg[0].status.effectiveConfig.mandatory.allowExternalPrincipals
              : (has(schema.spec.allowExternalPrincipals)
                  ? schema.spec.allowExternalPrincipals
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.allowExternalPrincipals))
                      ? rsrcCfg[0].status.effectiveConfig.defaults.allowExternalPrincipals
                      : true))}
          permissionARNs: ${schema.spec.permissionARNs}
          permissionRefs: ${schema.spec.permissionRefs}
          principals: ${schema.spec.principals}
          resourceARNs: ${schema.spec.resourceARNs}
          sources: ${schema.spec.sources}
          # sortBy is REQUIRED — see rampermission.aws.kropath.run.yaml / §6.1.
          tags: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)
                ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations
                : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)
                ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels
                : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.tags)
                ? rsrcCfg[0].status.effectiveConfig.defaults.tags
                : {})
              .merge(schema.spec.syncedAnnotations)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.tags)
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)
                ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations
                : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)
                ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels
                : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.tags)
                ? rsrcCfg[0].status.effectiveConfig.mandatory.tags
                : {})
              .transformList(k, v, {"key": k, "value": v})
              .sortBy(x, x.key)}
