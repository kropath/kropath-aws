---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: ec2flowlog.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: EC2FlowLog
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # Required: AWS resource ID to capture flow logs for (e.g. VPC ID, subnet ID).
      resourceId: string
      # Required: VPC | Subnet | NetworkInterface | TransitGateway | TransitGatewayAttachment.
      resourceType: string
      # Governance: mandatory → instance → defaults — ACCEPT | REJECT | ALL.
      trafficType: string | default=""
      # cloud-watch-logs | s3 | kinesis-data-firehose.
      logDestinationType: string | default=cloud-watch-logs
      # S3/Firehose destination ARN (when logDestinationType != cloud-watch-logs).
      logDestination: string | default=""
      # CloudWatch Logs log group name (when logDestinationType = cloud-watch-logs).
      logGroupName: string | default=""
      # IAM role ARN for CloudWatch Logs delivery.
      deliverLogsPermissionArn: string | default=""
      # Custom flow log record format. Empty = AWS default format.
      logFormat: string | default=""
      # Governance: mandatory → instance → defaults — 60 | 600 (seconds).
      maxAggregationInterval: integer | default=0
    status:
      flowLogId: >-
        ${ackFlowLog.?status.?flowLogID.orValue("")}
      conditions:
        - >-
          ${(ackFlowLog.?status.?conditions.orValue([])).map(c, runtime.newCondition({type: c.type, status: c.status, reason: c.?reason.orValue(''), message: c.?message.orValue('')}))}
    additionalPrinterColumns:
      - name: FlowLogId
        type: string
        jsonPath: .status.flowLogId
  resources:
    # Single governance config lookup — controller pre-merges all cascade layers (ADR-010 D-1).
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: EC2Config
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ACK FlowLog CR — primary cloud resource.
    - id: ackFlowLog
      template:
        apiVersion: ec2.services.k8s.aws/v1alpha1
        kind: FlowLog
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          resourceID: ${schema.spec.resourceId}
          resourceType: ${schema.spec.resourceType}
          # trafficType governance: mandatory → instance → defaults.
          trafficType: >-
            ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?flowLogTrafficType.orValue("") != ""
              ? rsrcCfg[0].status.effectiveConfig.mandatory.flowLogTrafficType
              : (schema.spec.trafficType != ""
                  ? schema.spec.trafficType
                  : (rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?flowLogTrafficType.orValue("ALL") : "ALL"))}
          logDestinationType: ${schema.spec.logDestinationType}
          logDestination: ${schema.spec.logDestination}
          logGroupName: ${schema.spec.logGroupName}
          deliverLogsPermissionARN: ${schema.spec.deliverLogsPermissionArn}
          logFormat: ${schema.spec.logFormat}
          # maxAggregationInterval governance: mandatory → instance → defaults.
          # 0 = not set (falls through cascade; AWS defaults to 600).
          maxAggregationInterval: >-
            ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?flowLogMaxAggregationInterval.orValue(0) != 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.flowLogMaxAggregationInterval
              : (schema.spec.maxAggregationInterval != 0
                  ? schema.spec.maxAggregationInterval
                  : (rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?flowLogMaxAggregationInterval.orValue(0) : 0))}
          # Cloud resource tags — ACK EC2 FlowLog spec.tags is array<{key, value}>.
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})
              .transformList(k, v, {"key": k, "value": v})}
