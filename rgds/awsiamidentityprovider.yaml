---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awsiamidentityprovider.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSIAMIdentityProvider
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      type: string | required=true
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      oidc:
        url: string | default=""
        thumbprints: "[]string | default=[]"
        audiences: "[]string | default=[]"
      saml:
        metadataDocument: string | default=""
    status:
      resourceName: >-
        ${has(oidcProvider.metadata.name) 
          ? oidcProvider.metadata.name 
          : samlProvider.metadata.name}
      namingStatus: >-
        ${has(oidcProvider.metadata.name) ? "active" : samlProvider.data.status}
      providerArn: >-
        ${oidcProvider.status.?ackResourceMetadata.?arn.orValue("")}
      conditions: >-
        ${oidcProvider.status.?conditions.orValue([])}
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSIAMConfig
        metadata:
          name: ${schema.spec.configRef}
          namespace: ${schema.metadata.namespace}
    - id: oidcProvider
      includeWhen:
        - '${schema.spec.type == "oidc"}'
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: OpenIDConnectProvider
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMIdentityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          clientIDs: >-
            ${schema.spec.oidc.audiences}
          thumbprints: >-
            ${schema.spec.oidc.thumbprints}
          url: >-
            ${schema.spec.oidc.url}
          tags: >-
            ${(rsrcCfg.status.effectiveConfig.mandatory.tags.transformList(k, v, {"key": k, "value": v})
              + schema.spec.tags.transformList(k, v, {"key": k, "value": v})
              + rsrcCfg.status.effectiveConfig.defaults.tags.transformList(k, v, {"key": k, "value": v})
              + rsrcCfg.status.effectiveConfig.mandatory.syncedLabels.transformList(k, v, {"key": "kropath.run/" + k, "value": v})
              + schema.spec.syncedLabels.transformList(k, v, {"key": "kropath.run/" + k, "value": v})
              + rsrcCfg.status.effectiveConfig.defaults.syncedLabels.transformList(k, v, {"key": "kropath.run/" + k, "value": v})
              + rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations.transformList(k, v, {"key": "kropath.run/" + k, "value": v})
              + schema.spec.syncedAnnotations.transformList(k, v, {"key": "kropath.run/" + k, "value": v})
              + rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations.transformList(k, v, {"key": "kropath.run/" + k, "value": v}))}
    - id: samlProvider
      includeWhen:
        - '${schema.spec.type == "saml"}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-samlprovider-advisory
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMIdentityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          status: "UNSUPPORTED"
          message: >
            ACK controller does not support samlProvider yet.