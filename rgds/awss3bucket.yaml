---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awss3bucket.kropath.run
  namespace: default
spec:
  schema:
    apiVersion: v1alpha1
    kind: AWSS3Bucket
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      region: string | default=""
      tags: map<string,string> | default={}
      syncedLabels: map<string,string> | default={}
      syncedAnnotations: map<string,string> | default={}
      encryption:
        algorithm: string | default=""
        kmsKeyArn: string | default=""
        bucketKeyEnabled: boolean | default=true
      blockPublicAccess: boolean | default=true
      versioning: string | default=""
      enforceHttpsOnly: boolean | default=false
      objectOwnership: string | default=BucketOwnerEnforced
    status:
      resourceName: string
      namingStatus: string
      predictedArn: string
  variables:
    _rsrcCfg: "${resources.get(metadata.namespace, \"AWSS3Config\", spec.configRef)}"
    effCfg: "${variables._rsrcCfg.status.effectiveConfig}"
    mergedTags: "${variables.effCfg.mandatory.tags + spec.tags + variables.effCfg.defaults.tags}"
    mergedSyncedLabels: "${variables.effCfg.mandatory.syncedLabels + spec.syncedLabels + variables.effCfg.defaults.syncedLabels}"
    mergedSyncedAnnotations: "${variables.effCfg.mandatory.syncedAnnotations + spec.syncedAnnotations + variables.effCfg.defaults.syncedAnnotations}"
    allCloudMetadata: "${variables.mergedTags + variables.mergedSyncedLabels + variables.mergedSyncedAnnotations}"
    _namingTemplate: >-
      ${variables.effCfg.mandatory.namingTemplate != ""
        ? variables.effCfg.mandatory.namingTemplate
        : variables.effCfg.defaults.namingTemplate}
    effectiveName: >-
      ${spec.nameOverride != ""
        ? spec.nameOverride
        : (variables._namingTemplate != ""
            ? variables._namingTemplate
                .split("{tag.")
                .transformList(i, part,
                  i == 0
                    ? part
                    : (variables.mergedTags.?[part.split("}")[0]].orValue("") +
                       (size(part.split("}")) > 1
                         ? part.split("}").slice(1, size(part.split("}"))).join("}")
                         : ""))
                )
                .join("")
                .replace("{name}", metadata.name)
                .replace("{namespace}", metadata.namespace)
                .replace("{account_id}", variables.effCfg.aws.accountId ?? "")
                .replace("{region}", variables.effCfg.aws.region ?? "")
                .replace("{configRef}", spec.configRef)
            : metadata.name).lowerAscii()}
    _namingValid: "${!variables.effectiveName.contains(\"{\")}"
    resolvedEncryptionAlgorithm: >-
      ${variables.effCfg.mandatory.encryptionAlgorithm != ""
        ? variables.effCfg.mandatory.encryptionAlgorithm
        : (spec.encryption.algorithm != ""
            ? spec.encryption.algorithm
            : (variables.effCfg.defaults.encryptionAlgorithm != ""
                ? variables.effCfg.defaults.encryptionAlgorithm
                : "aws:kms"))}
    resolvedKmsKeyArn: >-
      ${variables.effCfg.mandatory.kmsKeyArn != ""
        ? variables.effCfg.mandatory.kmsKeyArn
        : (spec.encryption.kmsKeyArn != ""
            ? spec.encryption.kmsKeyArn
            : variables.effCfg.defaults.kmsKeyArn)}
    resolvedBlockPublicAccess: >-
      ${variables.effCfg.mandatory.blockPublicAccess
        ? true
        : (spec.blockPublicAccess
            ? spec.blockPublicAccess
            : variables.effCfg.defaults.blockPublicAccess)}
    resolvedVersioning: >-
      ${variables.effCfg.mandatory.versioning != ""
        ? variables.effCfg.mandatory.versioning
        : (spec.versioning != ""
            ? spec.versioning
            : variables.effCfg.defaults.versioning)}
    resolvedEnforceHttpsOnly: >-
      ${variables.effCfg.mandatory.enforceHttpsOnly
        ? true
        : (spec.enforceHttpsOnly
            ? spec.enforceHttpsOnly
            : variables.effCfg.defaults.enforceHttpsOnly)}
    resolvedObjectOwnership: >-
      ${spec.objectOwnership != ""
        ? spec.objectOwnership
        : "BucketOwnerEnforced"}
  resources:
    - id: bucket
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": metadata.name}
              + variables.mergedSyncedLabels.transformMap(k, v, "kropath.run/" + k, v)}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": spec.deletionPolicy}
              + variables.mergedSyncedAnnotations.transformMap(k, v, "kropath.run/" + k, v)}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              name: ${metadata.name}
              uid: ${metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${variables.effectiveName}
          createBucketConfiguration: >-
            ${spec.region != "" && spec.region != "us-east-1"
              ? {"locationConstraint": spec.region}
              : null}
          encryption: >-
            ${variables.resolvedEncryptionAlgorithm != ""
              ? {"rules": [{"applyServerSideEncryptionByDefault":
                    (variables.resolvedEncryptionAlgorithm == "aws:kms"
                      ? (variables.resolvedKmsKeyArn != ""
                          ? {"sseAlgorithm": "aws:kms", "kmsMasterKeyID": variables.resolvedKmsKeyArn}
                          : {"sseAlgorithm": "aws:kms"})
                      : {"sseAlgorithm": "AES256"}),
                    "bucketKeyEnabled": spec.encryption.bucketKeyEnabled}]}
              : null}
          publicAccessBlock: >-
            ${variables.resolvedBlockPublicAccess
              ? {
                  "blockPublicACLs": true,
                  "blockPublicPolicy": true,
                  "ignorePublicACLs": true,
                  "restrictPublicBuckets": true
                }
              : null}
          versioning: >-
            ${variables.resolvedVersioning != ""
              ? {"status": variables.resolvedVersioning}
              : null}
          policy: >-
            ${variables.resolvedEnforceHttpsOnly
              ? "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"DenyNonTLSAccess\",\"Effect\":\"Deny\",\"Principal\":\"*\",\"Action\":\"s3:*\",\"Resource\":[\"arn:aws:s3:::" + variables.effectiveName + "\",\"arn:aws:s3:::" + variables.effectiveName + "/*\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":\"false\"}}}]}"
              : ""}
          tagging: >-
            ${variables.allCloudMetadata.keys().transformList(i, key,
              {"key": key, "value": variables.allCloudMetadata.?[key].orValue("")})}
          objectOwnership: ${variables.resolvedObjectOwnership}
          ownershipControls:
            rules:
              - objectOwnership: ${variables.resolvedObjectOwnership}
  status:
    resourceName: >-
      ${variables.effectiveName}
    namingStatus: >-
      ${variables._namingValid ? "valid" : "invalid-unresolved-tokens"}
    predictedArn: >-
      ${"arn:aws:s3:::" + variables.effectiveName}
