---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awss3bucket.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSS3Bucket
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      region: string | default=""
      tags: map<string,string> | default={}
      syncedLabels: map<string,string> | default={}
      syncedAnnotations: map<string,string> | default={}
      encryption:
        algorithm: string | default=""
        kmsKeyArn: string | default=""
        bucketKeyEnabled: boolean | default=true
      blockPublicAccess: boolean | default=true
      versioning: string | default=""
      enforceHttpsOnly: boolean | default=false
      objectOwnership: string | default=BucketOwnerEnforced
    status:
      resourceName: >-
        ${(schema.spec.nameOverride != ""
          ? schema.spec.nameOverride
          : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
              ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
              : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != ""
            ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                : rsrcCfg.status.effectiveConfig.defaults.namingTemplate)
                .split("{tag.")
                .transformList(i, part,
                  i == 0
                    ? part
                    : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split("}")[0]].orValue("")
                      + (size(part.split("}")) > 1
                        ? part.split("}").slice(1, size(part.split("}"))).join("}")
                        : "")))
                .join("")
                .replace("{name}", schema.metadata.name)
                .replace("{namespace}", schema.metadata.namespace)
                .replace("{account_id}", rsrcCfg.status.effectiveConfig.aws.accountId ?? "")
                .replace("{region}", rsrcCfg.status.effectiveConfig.aws.region ?? "")
                .replace("{configRef}", schema.spec.configRef)
            : schema.metadata.name)).lowerAscii()}
      namingStatus: "${!((schema.spec.nameOverride != \"\" ? schema.spec.nameOverride : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != \"\" ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != \"\" ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != \"\" ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate : rsrcCfg.status.effectiveConfig.defaults.namingTemplate).split(\"{tag.\").transformList(i, part, i == 0 ? part : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split(\"}\")[0]].orValue(\"\") + (size(part.split(\"}\")) > 1 ? part.split(\"}\").slice(1, size(part.split(\"}\"))).join(\"}\") : \"\"))).join(\"\").replace(\"{name}\", schema.metadata.name).replace(\"{namespace}\", schema.metadata.namespace).replace(\"{account_id}\", rsrcCfg.status.effectiveConfig.aws.accountId ?? \"\").replace(\"{region}\", rsrcCfg.status.effectiveConfig.aws.region ?? \"\").replace(\"{configRef}\", schema.spec.configRef) : schema.metadata.name)).contains(\"{\")) ? \"valid\" : \"invalid-unresolved-tokens\"}"
      predictedArn: "${\"arn:aws:s3:::\" + ((schema.spec.nameOverride != \"\" ? schema.spec.nameOverride : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != \"\" ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != \"\" ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != \"\" ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate : rsrcCfg.status.effectiveConfig.defaults.namingTemplate).split(\"{tag.\").transformList(i, part, i == 0 ? part : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split(\"}\")[0]].orValue(\"\") + (size(part.split(\"}\")) > 1 ? part.split(\"}\").slice(1, size(part.split(\"}\"))).join(\"}\") : \"\"))).join(\"\").replace(\"{name}\", schema.metadata.name).replace(\"{namespace}\", schema.metadata.namespace).replace(\"{account_id}\", rsrcCfg.status.effectiveConfig.aws.accountId ?? \"\").replace(\"{region}\", rsrcCfg.status.effectiveConfig.aws.region ?? \"\").replace(\"{configRef}\", schema.spec.configRef) : schema.metadata.name)).lowerAscii()}"
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSS3Config
        metadata:
          name: ${schema.spec.configRef}
          namespace: ${schema.metadata.namespace}
    - id: bucket
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": metadata.name}
              + (rsrcCfg.status.effectiveConfig.mandatory.syncedLabels + schema.spec.syncedLabels + rsrcCfg.status.effectiveConfig.defaults.syncedLabels)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              + (rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations + schema.spec.syncedAnnotations + rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              name: ${metadata.name}
              uid: ${metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                  ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                  : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != ""
                ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                    ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                    : rsrcCfg.status.effectiveConfig.defaults.namingTemplate)
                    .split("{tag.")
                    .transformList(i, part,
                      i == 0
                        ? part
                        : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split("}")[0]].orValue("")
                           + (size(part.split("}")) > 1
                             ? part.split("}").slice(1, size(part.split("}"))).join("}")
                             : "")))
                    .join("")
                    .replace("{name}", schema.metadata.name)
                    .replace("{namespace}", schema.metadata.namespace)
                    .replace("{account_id}", rsrcCfg.status.effectiveConfig.aws.accountId ?? "")
                    .replace("{region}", rsrcCfg.status.effectiveConfig.aws.region ?? "")
                    .replace("{configRef}", schema.spec.configRef)
                : schema.metadata.name)).lowerAscii()}
          createBucketConfiguration: >-
            ${schema.spec.region != "" && schema.spec.region != "us-east-1"
              ? {"locationConstraint": schema.spec.region}
              : null}
          encryption: >-
            ${((rsrcCfg.status.effectiveConfig.mandatory.encryptionAlgorithm != ""
                ? rsrcCfg.status.effectiveConfig.mandatory.encryptionAlgorithm
                : (schema.spec.encryption.algorithm != ""
                    ? schema.spec.encryption.algorithm
                    : (rsrcCfg.status.effectiveConfig.defaults.encryptionAlgorithm != ""
                        ? rsrcCfg.status.effectiveConfig.defaults.encryptionAlgorithm
                        : "aws:kms"))) != ""
              ? {"rules": [{"applyServerSideEncryptionByDefault":
                    ((rsrcCfg.status.effectiveConfig.mandatory.encryptionAlgorithm != ""
                      ? rsrcCfg.status.effectiveConfig.mandatory.encryptionAlgorithm
                      : (schema.spec.encryption.algorithm != ""
                          ? schema.spec.encryption.algorithm
                          : (rsrcCfg.status.effectiveConfig.defaults.encryptionAlgorithm != ""
                              ? rsrcCfg.status.effectiveConfig.defaults.encryptionAlgorithm
                              : "aws:kms"))) == "aws:kms"
                      ? ((rsrcCfg.status.effectiveConfig.mandatory.kmsKeyArn != ""
                          ? rsrcCfg.status.effectiveConfig.mandatory.kmsKeyArn
                          : (schema.spec.encryption.kmsKeyArn != ""
                              ? schema.spec.encryption.kmsKeyArn
                              : rsrcCfg.status.effectiveConfig.defaults.kmsKeyArn)) != ""
                        ? {"sseAlgorithm": "aws:kms", "kmsMasterKeyID": (rsrcCfg.status.effectiveConfig.mandatory.kmsKeyArn != ""
                            ? rsrcCfg.status.effectiveConfig.mandatory.kmsKeyArn
                            : (schema.spec.encryption.kmsKeyArn != ""
                                ? schema.spec.encryption.kmsKeyArn
                                : rsrcCfg.status.effectiveConfig.defaults.kmsKeyArn))}
                        : {"sseAlgorithm": "aws:kms"})
                      : {"sseAlgorithm": "AES256"}),
                    "bucketKeyEnabled": schema.spec.encryption.bucketKeyEnabled}]}
              : null}
          publicAccessBlock: >-
            ${(rsrcCfg.status.effectiveConfig.mandatory.blockPublicAccess
              ? {
                  "blockPublicACLs": true,
                  "blockPublicPolicy": true,
                  "ignorePublicACLs": true,
                  "restrictPublicBuckets": true
                }
              : (schema.spec.blockPublicAccess
                  ? {
                      "blockPublicACLs": true,
                      "blockPublicPolicy": true,
                      "ignorePublicACLs": true,
                      "restrictPublicBuckets": true
                    }
                  : (rsrcCfg.status.effectiveConfig.defaults.blockPublicAccess
                      ? {
                          "blockPublicACLs": true,
                          "blockPublicPolicy": true,
                          "ignorePublicACLs": true,
                          "restrictPublicBuckets": true
                        }
                      : null)))}
          versioning: >-
            ${(rsrcCfg.status.effectiveConfig.mandatory.versioning != ""
              ? rsrcCfg.status.effectiveConfig.mandatory.versioning
              : (schema.spec.versioning != ""
                  ? schema.spec.versioning
                  : rsrcCfg.status.effectiveConfig.defaults.versioning)) != ""
              ? {"status": (rsrcCfg.status.effectiveConfig.mandatory.versioning != ""
                  ? rsrcCfg.status.effectiveConfig.mandatory.versioning
                  : (schema.spec.versioning != ""
                      ? schema.spec.versioning
                      : rsrcCfg.status.effectiveConfig.defaults.versioning))}
              : null}
          policy: >-
            ${(rsrcCfg.status.effectiveConfig.mandatory.enforceHttpsOnly
              ? "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"DenyNonTLSAccess\",\"Effect\":\"Deny\",\"Principal\":\"*\",\"Action\":\"s3:*\",\"Resource\":[\"arn:aws:s3:::" + ((schema.spec.nameOverride != "" ? schema.spec.nameOverride : schema.metadata.name)).lowerAscii() + "\",\"arn:aws:s3:::" + ((schema.spec.nameOverride != "" ? schema.spec.nameOverride : schema.metadata.name)).lowerAscii() + "/*\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":\"false\"}}}]}"
              : (schema.spec.enforceHttpsOnly
                  ? "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"DenyNonTLSAccess\",\"Effect\":\"Deny\",\"Principal\":\"*\",\"Action\":\"s3:*\",\"Resource\":[\"arn:aws:s3:::" + ((schema.spec.nameOverride != ""
                      ? schema.spec.nameOverride
                      : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                          ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                          : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != ""
                        ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                            ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                            : rsrcCfg.status.effectiveConfig.defaults.namingTemplate)
                            .split(\"{tag.\")
                            .transformList(i, part,
                              i == 0
                                ? part
                                : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split(\"}\")[0]].orValue(\"\")
                                   + (size(part.split(\"}\")) > 1
                                     ? part.split(\"}\").slice(1, size(part.split(\"}\"))).join(\"}\")
                                     : \"\")))
                            .join(\"\")
                            .replace(\"{name}\", schema.metadata.name)
                            .replace(\"{namespace}\", schema.metadata.namespace)
                            .replace(\"{account_id}\", rsrcCfg.status.effectiveConfig.aws.accountId ?? \"\")
                            .replace(\"{region}\", rsrcCfg.status.effectiveConfig.aws.region ?? \"\")
                            .replace(\"{configRef}\", schema.spec.configRef)
                        : schema.metadata.name)).lowerAscii() + "\",\"arn:aws:s3:::" + ((schema.spec.nameOverride != ""
                      ? schema.spec.nameOverride
                      : ((rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                          ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                          : rsrcCfg.status.effectiveConfig.defaults.namingTemplate) != ""
                        ? (rsrcCfg.status.effectiveConfig.mandatory.namingTemplate != ""
                            ? rsrcCfg.status.effectiveConfig.mandatory.namingTemplate
                            : rsrcCfg.status.effectiveConfig.defaults.namingTemplate)
                            .split(\"{tag.\")
                            .transformList(i, part,
                              i == 0
                                ? part
                                : ((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags).?[part.split(\"}\")[0]].orValue(\"\")
                                   + (size(part.split(\"}\")) > 1
                                     ? part.split(\"}\").slice(1, size(part.split(\"}\"))).join(\"}\")
                                     : \"\")))
                            .join(\"\")
                            .replace(\"{name}\", schema.metadata.name)
                            .replace(\"{namespace}\", schema.metadata.namespace)
                            .replace(\"{account_id}\", rsrcCfg.status.effectiveConfig.aws.accountId ?? \"\")
                            .replace(\"{region}\", rsrcCfg.status.effectiveConfig.aws.region ?? \"\")
                            .replace(\"{configRef}\", schema.spec.configRef)
                        : schema.metadata.name)).lowerAscii() + \"/*\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":\"false\"}}}]}"
                  : ""))}
          tagging: >-
            ${((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags)
              + (rsrcCfg.status.effectiveConfig.mandatory.syncedLabels + schema.spec.syncedLabels + rsrcCfg.status.effectiveConfig.defaults.syncedLabels)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})
              + (rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations + schema.spec.syncedAnnotations + rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations)
                .transformMapEntry(k, v, {"kropath.run/" + k: v})).keys().transformList(i, key, {"key": key, "value": (((rsrcCfg.status.effectiveConfig.mandatory.tags + schema.spec.tags + rsrcCfg.status.effectiveConfig.defaults.tags) + (rsrcCfg.status.effectiveConfig.mandatory.syncedLabels + schema.spec.syncedLabels + rsrcCfg.status.effectiveConfig.defaults.syncedLabels).transformMapEntry(k, v, {"kropath.run/" + k: v}) + (rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations + schema.spec.syncedAnnotations + rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations).transformMapEntry(k, v, {"kropath.run/" + k: v})).?[key].orValue(\"\"))})}
          objectOwnership: >-
            ${schema.spec.objectOwnership != "" ? schema.spec.objectOwnership : "BucketOwnerEnforced"}
          ownershipControls:
            rules:
              - objectOwnership: >-
                  ${schema.spec.objectOwnership != "" ? schema.spec.objectOwnership : "BucketOwnerEnforced"}
    - id: rsrcCfg
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSS3Config
        metadata:
          name: ${schema.spec.configRef}
          namespace: ${schema.metadata.namespace}
