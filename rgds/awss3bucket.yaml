---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awss3bucket.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSS3Bucket
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      region: string | default=""
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      encryption:
        algorithm: string | default=""
        kmsKeyArn: string | default=""
        bucketKeyEnabled: boolean | default=true
      blockPublicAccess: boolean | default=true
      versioning: string | default=""
      enforceHttpsOnly: boolean | default=false
      objectOwnership: string | default=BucketOwnerEnforced
    status:
      resourceName: >-
        ${bucket.metadata.name}
      namingStatus: >-
        ${has(bucket.status) ? "valid" : "pending"}
      predictedArn: >-
        ${bucket.status.?ackResourceMetadata.?arn.orValue("")}
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSS3Config
        metadata:
          name: ${schema.spec.configRef}
          namespace: ${schema.metadata.namespace}
    - id: bucket
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge(rsrcCfg.status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge(rsrcCfg.status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: "${schema.spec.nameOverride != \"\" ? schema.spec.nameOverride.lowerAscii() : schema.metadata.name.lowerAscii()}"
          createBucketConfiguration:
            locationConstraint: >-
              ${schema.spec.region != "" && schema.spec.region != "us-east-1"
                ? schema.spec.region
                : ""}
          encryption:
            rules:
              - applyServerSideEncryptionByDefault:
                  sseAlgorithm: >-
                    ${rsrcCfg.status.effectiveConfig.mandatory.encryptionAlgorithm != "" 
                      ? rsrcCfg.status.effectiveConfig.mandatory.encryptionAlgorithm 
                      : (schema.spec.encryption.algorithm != "" ? schema.spec.encryption.algorithm : "aws:kms")}
                  kmsMasterKeyID: >-
                    ${rsrcCfg.status.effectiveConfig.mandatory.kmsKeyArn != "" 
                      ? rsrcCfg.status.effectiveConfig.mandatory.kmsKeyArn 
                      : (schema.spec.encryption.kmsKeyArn != "" ? schema.spec.encryption.kmsKeyArn : "")}
                bucketKeyEnabled: ${schema.spec.encryption.bucketKeyEnabled}
          publicAccessBlock:
            blockPublicACLs: >-
              ${rsrcCfg.status.effectiveConfig.mandatory.blockPublicAccess || schema.spec.blockPublicAccess || rsrcCfg.status.effectiveConfig.defaults.blockPublicAccess ? true : false}
            blockPublicPolicy: >-
              ${rsrcCfg.status.effectiveConfig.mandatory.blockPublicAccess || schema.spec.blockPublicAccess || rsrcCfg.status.effectiveConfig.defaults.blockPublicAccess ? true : false}
            ignorePublicACLs: >-
              ${rsrcCfg.status.effectiveConfig.mandatory.blockPublicAccess || schema.spec.blockPublicAccess || rsrcCfg.status.effectiveConfig.defaults.blockPublicAccess ? true : false}
            restrictPublicBuckets: >-
              ${rsrcCfg.status.effectiveConfig.mandatory.blockPublicAccess || schema.spec.blockPublicAccess || rsrcCfg.status.effectiveConfig.defaults.blockPublicAccess ? true : false}
          versioning: >-
            ${(rsrcCfg.status.effectiveConfig.mandatory.versioning != "" ? rsrcCfg.status.effectiveConfig.mandatory.versioning : schema.spec.versioning) != ""
              ? {"status": (rsrcCfg.status.effectiveConfig.mandatory.versioning != "" ? rsrcCfg.status.effectiveConfig.mandatory.versioning : schema.spec.versioning)}
              : {"status": "Suspended"}}
          policy: >-
            ${rsrcCfg.status.effectiveConfig.mandatory.enforceHttpsOnly || schema.spec.enforceHttpsOnly
              ? "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"DenyNonTLSAccess\",\"Effect\":\"Deny\",\"Principal\":\"*\",\"Action\":\"s3:*\",\"Resource\":[\"arn:aws:s3:::" + (schema.spec.nameOverride != "" ? schema.spec.nameOverride.lowerAscii() : schema.metadata.name.lowerAscii()) + "\",\"arn:aws:s3:::" + (schema.spec.nameOverride != "" ? schema.spec.nameOverride.lowerAscii() : schema.metadata.name.lowerAscii()) + "/*\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":\"false\"}}}]}"
              : ""}
          tagging: >-
            ${rsrcCfg.status.effectiveConfig.mandatory.tags.transformList(k, v, {"key": k, "value": v})
              + schema.spec.tags.transformList(k, v, {"key": k, "value": v})
              + rsrcCfg.status.effectiveConfig.defaults.tags.transformList(k, v, {"key": k, "value": v})}
          objectOwnership: "${schema.spec.objectOwnership != \"\" ? schema.spec.objectOwnership : \"BucketOwnerEnforced\"}"
          ownershipControls:
            rules:
              - objectOwnership: "${schema.spec.objectOwnership != \"\" ? schema.spec.objectOwnership : \"BucketOwnerEnforced\"}"
