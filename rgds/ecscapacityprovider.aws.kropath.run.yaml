---
# aws-ecs-05: ECSCapacityProvider RGD — wraps ACK ecs.services.k8s.aws/CapacityProvider.
# Spec: kropath-core/docs/specs/aws/aws-ecs-05-ecscapacityprovider.md
# CRD cache: kropath-core/docs/crd-cache/aws/ecs-controller-v1.5.0.md
#
# Mutual exclusivity: autoScalingGroupProvider and managedInstancesProvider cannot both be set.
# kro v0.9.2 silently discards x-kubernetes-validations on RGDs; enforced via advisory ConfigMap.
# name field is IMMUTABLE after creation — AWS rejects updates to the name attribute.
# ECSCapacityProvider has no resource-specific governance fields (no defaultLaunchType etc.).
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: ecscapacityprovider.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: ECSCapacityProvider
    scope: Namespaced
    spec:
      # Standard kropath fields
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain

      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}

      # Cluster reference
      clusterName: string | default=""
      clusterRef:
        name: string | default=""
        namespace: string | default=""

      # AutoScaling Group provider — mutually exclusive with managedInstancesProvider.
      autoScalingGroupProvider:
        autoScalingGroupARN: string | default=""
        managedScaling:
          status: string | default=""
          targetCapacity: integer | default=0
          minimumScalingStepSize: integer | default=0
          maximumScalingStepSize: integer | default=0
          instanceWarmupPeriod: integer | default=0
        managedTerminationProtection: string | default=""
        managedDraining: string | default=""

      # Managed instances provider — mutually exclusive with autoScalingGroupProvider.
      managedInstancesProvider:
        infrastructureRoleARN: string | default=""
        instanceLaunchTemplate:
          ec2InstanceProfileARN: string | default=""
        autoRepairConfiguration:
          actionsStatus: string | default=""

    status:
      resourceName: >-
        ${naming.data.resourceName}
      namingStatus: >-
        ${naming.data.namingStatus}
      conditions: >-
        ${capacityprovider.?status.?conditions.orValue([])}

    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus

  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: ECSConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # Advisory ConfigMap — only materializes when both provider types are specified.
    - id: providerConflict
      includeWhen:
        - ${schema.spec.autoScalingGroupProvider.autoScalingGroupARN != "" && schema.spec.managedInstancesProvider.infrastructureRoleARN != ""}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-ecscapacityprovider-provider-conflict
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: ecscapacityprovider-validation-error
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ECSCapacityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "autoScalingGroupProvider and managedInstancesProvider are mutually exclusive — unset one"

    # Advisory ConfigMap — only materializes when neither provider type is specified.
    - id: neitherProviderSet
      includeWhen:
        - ${schema.spec.autoScalingGroupProvider.autoScalingGroupARN == "" && schema.spec.managedInstancesProvider.infrastructureRoleARN == ""}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-ecscapacityprovider-provider-required
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: ecscapacityprovider-validation-error
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ECSCapacityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "one of autoScalingGroupProvider or managedInstancesProvider is required"

    # Naming ConfigMap
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-ecscapacityprovider-naming
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: ecscapacityprovider-naming
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ECSCapacityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}
          resourceName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}
          namingStatus: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef)).contains("{") ? "invalid-unresolved-tokens" : "valid"}

    # ACK CapacityProvider CR
    - id: capacityprovider
      template:
        apiVersion: ecs.services.k8s.aws/v1alpha1
        kind: CapacityProvider
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ECSCapacityProvider
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          # Cloud resource name (immutable after creation)
          name: ${naming.data.effectiveName}
          # Cluster reference
          cluster: ${schema.spec.clusterName}
          clusterRef:
            from:
              name: ${schema.spec.clusterRef.name}
              namespace: ${schema.spec.clusterRef.namespace}
          # ASG provider
          autoScalingGroupProvider:
            autoScalingGroupARN: ${schema.spec.autoScalingGroupProvider.autoScalingGroupARN}
            managedScaling:
              status: ${schema.spec.autoScalingGroupProvider.managedScaling.status}
              targetCapacity: ${schema.spec.autoScalingGroupProvider.managedScaling.targetCapacity}
              minimumScalingStepSize: ${schema.spec.autoScalingGroupProvider.managedScaling.minimumScalingStepSize}
              maximumScalingStepSize: ${schema.spec.autoScalingGroupProvider.managedScaling.maximumScalingStepSize}
              instanceWarmupPeriod: ${schema.spec.autoScalingGroupProvider.managedScaling.instanceWarmupPeriod}
            managedTerminationProtection: ${schema.spec.autoScalingGroupProvider.managedTerminationProtection}
            managedDraining: ${schema.spec.autoScalingGroupProvider.managedDraining}
          # Managed instances provider
          managedInstancesProvider:
            infrastructureRoleARN: ${schema.spec.managedInstancesProvider.infrastructureRoleARN}
            instanceLaunchTemplate:
              ec2InstanceProfileARN: ${schema.spec.managedInstancesProvider.instanceLaunchTemplate.ec2InstanceProfileARN}
            autoRepairConfiguration:
              actionsStatus: ${schema.spec.managedInstancesProvider.autoRepairConfiguration.actionsStatus}
          # Cloud tags
          tags: >-
            ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(schema.spec.syncedAnnotations)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.tags)
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {}))
              .transformList(k, v, {"key": k, "value": v})
              .sortBy(x, x.key)}
