---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: emrserverlessapplication.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: EMRServerlessApplication
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # Instance-level override for releaseLabel (e.g. "emr-6.10.0").
      # Governed: mandatory wins over instance, instance wins over defaults.
      releaseLabel: string | default=""
      # Instance-level override for architecture ("X86_64" or "ARM64").
      # Governed: mandatory wins.
      architecture: string | default=""
      # Instance-level override for auto-stop idle timeout in minutes.
      # 0 = not configured (let AWS default apply). Governed: mandatory wins.
      autoStopIdleTimeoutMinutes: integer | default=0
      # Instance-level override for maximum vCPU capacity string (e.g. "200vcpu").
      maximumCapacityCPU: string | default=""
      # Instance-level override for maximum memory capacity string (e.g. "200gb").
      maximumCapacityMemory: string | default=""
      # Instance-level override for KMS key ARN for disk encryption.
      diskEncryptionKeyARN: string | default=""
      # Application engine type: "SPARK" or "HIVE".
      type_: string | default=SPARK
      # Optional image URI override.
      imageURI: string | default=""
      # Optional initial capacity map key (e.g. "Driver"). Passthrough — not governed.
      # For complex initial capacity, users apply ACK Application directly.
      # Optional network configuration — subnets and security groups.
      networkSubnetIds: "[]string | default=[]"
      networkSecurityGroupIds: "[]string | default=[]"
      # Optional monitoring configuration.
      monitoringS3BucketURI: string | default=""
      monitoringCloudWatchLogGroupName: string | default=""
      monitoringPrometheusRemoteWriteURL: string | default=""
      # Optional scheduler configuration.
      schedulerMaxConcurrentRuns: integer | default=0
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      predictedArn: >-
        ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.aws) && !naming.data.effectiveName.contains("{") && naming.data.effectiveName != "" && resolved.data.releaseLabel != ""
          ? "arn:aws:emr-serverless:" + rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") + ":" + rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") + ":/applications/" + ackApplication.?status.?id.orValue("")
          : ""}
      id: >-
        ${ackApplication.?status.?id.orValue("")}
      state: >-
        ${ackApplication.?status.?state.orValue("")}
      conditions: >-
        ${ackApplication.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
      - name: ID
        type: string
        jsonPath: .status.id
      - name: State
        type: string
        jsonPath: .status.state
  resources:
    # Single governance config lookup via selector.matchLabels (Theme 28/KRO-221).
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: EMRConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.configRef != "" ? schema.spec.configRef : "general-policy"}'

    # ConfigMap materialising effectiveName with full {tag.X} dynamic substitution.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          effectiveName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}")))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}

    # ConfigMap pre-computing all governed field values as strings.
    # Cascade order: mandatory > instance > defaults (last-writer-wins within each tier).
    # releaseLabel is required by ACK Application — ackApplication is only created when non-empty.
    - id: resolved
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-resolved
          namespace: ${schema.metadata.namespace}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          releaseLabel: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?releaseLabel.orValue("") != "")
                ? rsrcCfg[0].status.effectiveConfig.mandatory.releaseLabel
                : (schema.spec.releaseLabel != ""
                    ? schema.spec.releaseLabel
                    : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?releaseLabel.orValue("") != "")
                        ? rsrcCfg[0].status.effectiveConfig.defaults.releaseLabel
                        : "")}
          architecture: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?architecture.orValue("") != "")
                ? rsrcCfg[0].status.effectiveConfig.mandatory.architecture
                : (schema.spec.architecture != ""
                    ? schema.spec.architecture
                    : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?architecture.orValue("") != "")
                        ? rsrcCfg[0].status.effectiveConfig.defaults.architecture
                        : "")}
          autoStopIdleTimeoutMinutes: >-
            ${string((rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?autoStopIdleTimeoutMinutes.orValue(0) != 0)
                ? rsrcCfg[0].status.effectiveConfig.mandatory.autoStopIdleTimeoutMinutes
                : (schema.spec.autoStopIdleTimeoutMinutes != 0
                    ? schema.spec.autoStopIdleTimeoutMinutes
                    : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?autoStopIdleTimeoutMinutes.orValue(0) != 0)
                        ? rsrcCfg[0].status.effectiveConfig.defaults.autoStopIdleTimeoutMinutes
                        : 0))}
          maximumCapacityCPU: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?maximumCapacityCPU.orValue("") != "")
                ? rsrcCfg[0].status.effectiveConfig.mandatory.maximumCapacityCPU
                : (schema.spec.maximumCapacityCPU != ""
                    ? schema.spec.maximumCapacityCPU
                    : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?maximumCapacityCPU.orValue("") != "")
                        ? rsrcCfg[0].status.effectiveConfig.defaults.maximumCapacityCPU
                        : "")}
          maximumCapacityMemory: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?maximumCapacityMemory.orValue("") != "")
                ? rsrcCfg[0].status.effectiveConfig.mandatory.maximumCapacityMemory
                : (schema.spec.maximumCapacityMemory != ""
                    ? schema.spec.maximumCapacityMemory
                    : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?maximumCapacityMemory.orValue("") != "")
                        ? rsrcCfg[0].status.effectiveConfig.defaults.maximumCapacityMemory
                        : "")}
          diskEncryptionKeyARN: >-
            ${(rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?diskEncryptionKeyARN.orValue("") != "")
                ? rsrcCfg[0].status.effectiveConfig.mandatory.diskEncryptionKeyARN
                : (schema.spec.diskEncryptionKeyARN != ""
                    ? schema.spec.diskEncryptionKeyARN
                    : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.defaults.?diskEncryptionKeyARN.orValue("") != "")
                        ? rsrcCfg[0].status.effectiveConfig.defaults.diskEncryptionKeyARN
                        : "")}

    # ACK EMR Serverless Application CR.
    # Only created when effectiveName is valid AND releaseLabel is non-empty
    # (releaseLabel is required by ACK Application).
    - id: ackApplication
      includeWhen:
        - >-
          ${!naming.data.effectiveName.contains("{") && resolved.data.releaseLabel != ""}
      template:
        apiVersion: emrserverless.services.k8s.aws/v1alpha1
        kind: Application
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.effectiveName}
          releaseLabel: ${resolved.data.releaseLabel}
          type_: ${schema.spec.type_}
          # architecture: only set when resolved value is non-empty
          architecture: >-
            ${resolved.data.architecture != "" ? resolved.data.architecture : "X86_64"}
          # autoStopConfiguration: always set; idleTimeoutMinutes=0 means "use AWS default"
          autoStopConfiguration:
            enabled: ${int(resolved.data.autoStopIdleTimeoutMinutes) != 0}
            idleTimeoutMinutes: >-
              ${int(resolved.data.autoStopIdleTimeoutMinutes) != 0 ? int(resolved.data.autoStopIdleTimeoutMinutes) : 15}
          # maximumCapacity: only included when at least one dimension is set
          maximumCapacity:
            cpu: >-
              ${resolved.data.maximumCapacityCPU != "" ? resolved.data.maximumCapacityCPU : "200vcpu"}
            memory: >-
              ${resolved.data.maximumCapacityMemory != "" ? resolved.data.maximumCapacityMemory : "200gb"}
          # imageConfiguration: only set when imageURI is provided
          imageConfiguration:
            imageURI: ${schema.spec.imageURI}
          # networkConfiguration: passthrough — not governed
          networkConfiguration:
            subnetIDs: ${schema.spec.networkSubnetIds}
            securityGroupIDs: ${schema.spec.networkSecurityGroupIds}
          # monitoringConfiguration: passthrough — not governed
          monitoringConfiguration:
            s3MonitoringConfiguration:
              logURI: ${schema.spec.monitoringS3BucketURI}
            cloudWatchLoggingConfiguration:
              enabled: ${schema.spec.monitoringCloudWatchLogGroupName != ""}
              logGroupName: ${schema.spec.monitoringCloudWatchLogGroupName}
            managedPersistenceMonitoringConfiguration:
              enabled: false
          # schedulerConfiguration: only set when maxConcurrentRuns is non-zero
          schedulerConfiguration:
            maxConcurrentRuns: >-
              ${schema.spec.schedulerMaxConcurrentRuns != 0 ? schema.spec.schedulerMaxConcurrentRuns : 1}
          # tags: allCloudMetadata — mergedTags + mergedSyncedLabels + mergedSyncedAnnotations
          # Merge order (last-writer-wins): defaults → spec → mandatory.
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}
