---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: route53healthcheck.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: Route53HealthCheck
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # Health check type. Required. Allowed: HTTP, HTTPS, HTTP_STR_MATCH, HTTPS_STR_MATCH,
      # TCP, CALCULATED, CLOUDWATCH_METRIC. RECOVERY_CONTROL is not supported.
      healthCheckType: string | default=""
      # IPv4 or IPv6 address of the endpoint (for endpoint health checks).
      ipAddress: string | default=""
      # Port number (for endpoint health checks). Defaults to 80 for HTTP, 443 for HTTPS.
      port: integer | default=0
      # FQDN of the endpoint (for endpoint health checks).
      fullyQualifiedDomainName: string | default=""
      # Path to request (for HTTP/HTTPS health checks, e.g. "/health").
      resourcePath: string | default=""
      # String to match in the response body (for STR_MATCH types).
      searchString: string | default=""
      # Request interval in seconds. Governed by Route53Config. 10 (fast) or 30 (standard).
      # 0 = fall through to Route53Config cascade. Instance can override when not mandatory.
      requestInterval: integer | default=0
      # Failure threshold (1–10). Governed by Route53Config. 0 = fall through to cascade.
      failureThreshold: integer | default=0
      # Enable latency measurement for endpoint health checks. Immutable after creation.
      measureLatency: boolean
      # Enable SNI for HTTPS health checks.
      enableSNI: boolean
      # Invert the health check (consider healthy when unhealthy and vice versa).
      inverted: boolean
      # Disable the health check.
      disabled: boolean
      # Number of healthy health checks required for CALCULATED type.
      healthThreshold: integer | default=0
      # Child health check IDs for CALCULATED type.
      childHealthChecks: "[]string | default=[]"
      # AWS regions to receive health check requests (subset of Route53 health check regions).
      regions: "[]string | default=[]"
      # CloudWatch alarm identifier for CLOUDWATCH_METRIC type.
      alarmName: string | default=""
      alarmRegion: string | default=""
      # Behavior when CloudWatch data is insufficient.
      insufficientDataHealthStatus: string | default=""
    status:
      healthCheckID: >-
        ${ackHealthCheck.?status.?id.orValue("")}
      conditions: >-
        ${ackHealthCheck.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: HealthCheckID
        type: string
        jsonPath: .status.healthCheckID
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: Route53Config
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    - id: ackHealthCheck
      template:
        apiVersion: route53.services.k8s.aws/v1alpha1
        kind: HealthCheck
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          healthCheckConfig:
            type: ${schema.spec.healthCheckType}
            ipAddress: ${schema.spec.ipAddress}
            port: >-
              ${schema.spec.port != 0 ? schema.spec.port : 0}
            fullyQualifiedDomainName: ${schema.spec.fullyQualifiedDomainName}
            resourcePath: ${schema.spec.resourcePath}
            searchString: ${schema.spec.searchString}
            requestInterval: >-
              ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?healthCheckRequestInterval.orValue(0) != 0
                ? rsrcCfg[0].status.effectiveConfig.mandatory.healthCheckRequestInterval
                : (schema.spec.requestInterval != 0
                    ? schema.spec.requestInterval
                    : (rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?healthCheckRequestInterval.orValue(30) : 30))}
            failureThreshold: >-
              ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?healthCheckFailureThreshold.orValue(0) != 0
                ? rsrcCfg[0].status.effectiveConfig.mandatory.healthCheckFailureThreshold
                : (schema.spec.failureThreshold != 0
                    ? schema.spec.failureThreshold
                    : (rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?healthCheckFailureThreshold.orValue(3) : 3))}
            measureLatency: >-
              ${has(schema.spec.measureLatency) ? schema.spec.measureLatency : false}
            enableSNI: >-
              ${has(schema.spec.enableSNI) ? schema.spec.enableSNI : false}
            inverted: >-
              ${has(schema.spec.inverted) ? schema.spec.inverted : false}
            disabled: >-
              ${has(schema.spec.disabled) ? schema.spec.disabled : false}
            healthThreshold: ${schema.spec.healthThreshold}
            childHealthChecks: ${schema.spec.childHealthChecks}
            regions: ${schema.spec.regions}
            alarmIdentifier: >-
              ${schema.spec.alarmName != "" ? {"name": schema.spec.alarmName, "region": schema.spec.alarmRegion} : {}}
            insufficientDataHealthStatus: ${schema.spec.insufficientDataHealthStatus}
          tags: >-
            ${(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge(rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})
              .transformList(k, v, {"key": k, "value": v})}
