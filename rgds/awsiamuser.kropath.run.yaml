---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awsiamuser.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSIAMUser
    scope: Namespaced
    spec:
      configRef: string | default="general-policy"
      path: string | default="/"
      nameOverride: string | default=""
      deletionPolicy: string | default="retain" enum="retain,delete"
      groups: "[]string | default=[]"
      policies: "[]UserPolicy | default=[]"
      createAccessKey: boolean | default=false
      tags: "map[string]string | default={}"
      syncedLabels: "map[string]string | default={}"
      syncedAnnotations: "map[string]string | default={}"
    types:
      UserPolicy:
        arn: string | default=""
        ref: string | default=""
        inline:
          name: string | default=""
          documentJSON: string | default=""
          documentRef: string | default=""
    status:
      resourceName: "${variables.effectiveName}"
      namingStatus: "${variables._namingValid ? \"valid\" : \"invalid-unresolved-tokens\"}"
      predictedArn: "${\"arn:aws:iam::\" + variables.effCfg.aws.accountId + \":user\" + spec.path + variables.effectiveName}"
      accessKeyBlocked: "${variables._accessKeyBlocked}"
      conditions: >-
        ${(user.status.conditions ?? [])
          + (variables._accessKeyBlocked
              ? [{
                  type: "AccessKeyBlockedByGovernance",
                  status: "True",
                  reason: "BlockedByGovernance",
                  message: "Access key creation is blocked by effectiveConfig.mandatory.blockIamUserAccessKeys"
                }]
              : [])}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
      - name: Naming
        type: string
        jsonPath: .status.namingStatus
      - name: AccessKeyBlocked
        type: boolean
        jsonPath: .status.accessKeyBlocked
  resources:
    - id: user
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: User
        metadata:
          name: "${metadata.name}"
          namespace: "${metadata.namespace}"
          labels: "${{\"app.kubernetes.io/managed-by\": \"kro\", \"app.kubernetes.io/instance\": metadata.name} + variables.mergedSyncedLabels}"
          annotations: "${{\"services.k8s.aws/deletion-policy\": spec.deletionPolicy} + (size(spec.groups) > 0 ? {\"kropath.run/groups\": spec.groups.join(\",\")} : {}) + variables.mergedSyncedAnnotations}"
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMUser
              name: ${metadata.name}
              uid: ${metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: "${variables.effectiveName}"
          path: "${spec.path}"
          groups: "${spec.groups}"
          permissionsBoundary: "${variables.effectivePermissionsBoundary}"
          policies: "${variables.effectivePolicies}"
          inlinePolicies: "${variables.effectiveInlinePolicies}"
          tags: "${variables.allCloudMetadata.transformList(k, v, {key: k, value: v})}"

    - id: accessKey
      includeWhen:
        - "${variables._createAccessKey}"
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: AccessKey
        metadata:
          name: "${metadata.name}-access-key"
          namespace: "${metadata.namespace}"
          labels: "${{\"app.kubernetes.io/managed-by\": \"kro\", \"app.kubernetes.io/instance\": metadata.name} + variables.mergedSyncedLabels}"
          annotations: "${{\"services.k8s.aws/deletion-policy\": spec.deletionPolicy} + variables.mergedSyncedAnnotations}"
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMUser
              name: ${metadata.name}
              uid: ${metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          userName: "${variables.effectiveName}"

    - id: accessKeySecret
      includeWhen:
        - "${variables._createAccessKey}"
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: "${metadata.name}-access-key"
          namespace: "${metadata.namespace}"
          labels: "${{\"app.kubernetes.io/managed-by\": \"kro\", \"app.kubernetes.io/instance\": metadata.name} + variables.mergedSyncedLabels}"
          annotations: "${{\"services.k8s.aws/deletion-policy\": spec.deletionPolicy} + variables.mergedSyncedAnnotations}"
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMUser
              name: ${metadata.name}
              uid: ${metadata.uid}
              controller: true
              blockOwnerDeletion: true
        type: Opaque
        stringData:
          accessKeyId: "${accessKey.status.accessKeyId}"
          secretAccessKey: "${accessKey.status.secretAccessKey}"
  variables:
    _rsrcCfg: "${resources.get(metadata.namespace, \"AWSIAMConfig\", spec.configRef)}"
    effCfg: "${variables._rsrcCfg.status.effectiveConfig}"
    mergedTags: >-
      ${variables.effCfg.mandatory.tags + spec.tags + variables.effCfg.defaults.tags}
    _rawSyncedLabels: >-
      ${variables.effCfg.mandatory.syncedLabels + spec.syncedLabels + variables.effCfg.defaults.syncedLabels}
    _rawSyncedAnnotations: >-
      ${variables.effCfg.mandatory.syncedAnnotations + spec.syncedAnnotations + variables.effCfg.defaults.syncedAnnotations}
    mergedSyncedLabels: >-
      ${variables._rawSyncedLabels.transformMapEntry(k, v, {("kropath.run/" + k): v})}
    mergedSyncedAnnotations: >-
      ${variables._rawSyncedAnnotations.transformMapEntry(k, v, {("kropath.run/" + k): v})}
    allCloudMetadata: >-
      ${variables.mergedTags + variables.mergedSyncedLabels + variables.mergedSyncedAnnotations}
    _namingTemplate: >-
      ${variables.effCfg.mandatory.namingTemplate != ""
        ? variables.effCfg.mandatory.namingTemplate
        : variables.effCfg.defaults.namingTemplate}
    effectiveName: >-
      ${spec.nameOverride != ""
        ? spec.nameOverride
        : (variables._namingTemplate != ""
            ? variables._namingTemplate
                .split("{tag.")
                .transformList(i, part,
                  i == 0 ? part
                         : (variables.mergedTags.?[part.split("}")[0]].orValue("") +
                            (size(part.split("}")) > 1
                              ? part.split("}").slice(1, size(part.split("}"))).join("}")
                              : "")))
                .join("")
                .replace("{name}", metadata.name)
                .replace("{namespace}", metadata.namespace)
                .replace("{account_id}", variables.effCfg.aws.accountId ?? "")
                .replace("{region}", variables.effCfg.aws.region ?? "")
                .replace("{configRef}", spec.configRef)
          : metadata.name)}
    _namingValid: "${!variables.effectiveName.contains(\"{\")}"
    effectivePermissionsBoundary: >-
      ${variables.effCfg.mandatory.permissionsBoundaryArn != ""
        ? variables.effCfg.mandatory.permissionsBoundaryArn
        : (spec.permissionsBoundary != ""
            ? spec.permissionsBoundary
            : variables.effCfg.defaults.permissionsBoundaryArn)}
    effectivePolicies: >-
      ${(spec.policies.filter(p, p.arn != "" || p.ref != "").transformList(i, p, p.arn != "" ? p.arn : resources.get(metadata.namespace, \"AWSIAMPolicy\", p.ref).status.arn))}
    effectiveInlinePolicies: >-
      ${(spec.policies.filter(p, p.inline.name != "").transformList(i, p, p.inline)).transformMapEntry(i, p, {p.name: (p.documentRef != "" ? resources.get(metadata.namespace, \"AWSPolicyDocument\", p.documentRef).spec.documentJSON : p.documentJSON)})}
    _accessKeyBlocked: >-
      ${spec.createAccessKey && variables.effCfg.mandatory.blockIamUserAccessKeys}
    _createAccessKey: >-
      ${spec.createAccessKey && !variables.effCfg.mandatory.blockIamUserAccessKeys}
