---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: awsiamuser.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: kropath.run
    kind: AWSIAMUser
    scope: Namespaced
    spec:
      configRef: string | default="general-policy"
      path: string | default="/"
      nameOverride: string | default=""
      deletionPolicy: string | default="retain" enum="retain,delete"
      groups: "[]string | default=[]"
      policies: "[]UserPolicy | default=[]"
      createAccessKey: boolean | default=false
      tags: "map[string]string | default={}"
      syncedLabels: "map[string]string | default={}"
      syncedAnnotations: "map[string]string | default={}"
    types:
      UserPolicy:
        arn: string | default=""
        ref: string | default=""
        inline:
          name: string | default=""
          documentJSON: string | default=""
          documentRef: string | default=""
    status:
      resourceName: >-
        ${user.?spec.?name.orValue("")}
      namingStatus: >-
        ${user.?spec.?name.orValue("").contains("{") ? "invalid-unresolved-tokens" : (has(user.spec) ? "valid" : "pending")}
      predictedArn: >-
        ${has(user.spec) && rsrcCfg.size() > 0 && has(rsrcCfg[0].status) && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.aws) && has(rsrcCfg[0].status.effectiveConfig.aws.accountId) ? "arn:aws:iam::" + rsrcCfg[0].status.effectiveConfig.aws.accountId + ":user" + user.spec.path + user.spec.name : ""}
      accessKeyBlocked: >-
        ${accessKeyBlockedAdvisory.?data.?blocked.orValue("") == "true"}
      accessKeyBlockedConditionType: >-
        ${accessKeyBlockedAdvisory.?data.?blocked.orValue("") == "true" ? "AccessKeyBlockedByGovernance" : ""}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
      - name: Naming
        type: string
        jsonPath: .status.namingStatus
  resources:
    - id: rsrcCfg
      # No includeWhen — sentinel-label approach ensures variable is always bound ([] if no match)
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSIAMConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              kropath.run/config-name: ${schema.?spec.?configRef.orValue("general-policy")}

    - id: firstPolicyRef
      # No includeWhen — sentinel selector ensures variable is always bound as []
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSIAMPolicy
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              kropath.run/resource-name: '${has(schema.spec.policies) && schema.spec.policies.size() > 0 && schema.spec.policies[0].?ref.orValue("") != "" ? schema.spec.policies[0].ref : "kro-empty-fallback-sentinel"}'

    - id: firstInlineDoc
      # No includeWhen — sentinel selector ensures variable is always bound as []
      externalRef:
        apiVersion: kropath.run/v1alpha1
        kind: AWSPolicyDocument
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              kropath.run/resource-name: '${has(schema.spec.policies) && schema.spec.policies.size() > 0 && schema.spec.policies[0].?inline.?documentRef.orValue("") != "" ? schema.spec.policies[0].inline.documentRef : "kro-empty-fallback-sentinel"}'

    - id: accessKeyBlockedAdvisory
      # Advisory ConfigMap surfacing that createAccessKey was requested but blocked by governance.
      # Note: ACK AccessKey CRD is not yet available; actual key provisioning is a future addition.
      includeWhen:
        - '${schema.spec.createAccessKey && rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.blockIamUserAccessKeys) && rsrcCfg[0].status.effectiveConfig.mandatory.blockIamUserAccessKeys}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-access-key-blocked
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMUser
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          blocked: "true"
          message: "Access key creation is blocked by effectiveConfig.mandatory.blockIamUserAccessKeys"

    - id: user
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: User
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: kropath.run/v1alpha1
              kind: AWSIAMUser
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: >-
            ${schema.spec.nameOverride != "" ? schema.spec.nameOverride :
              ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate) && rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate != "") ?
                rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  .replace("{namespace}", schema.metadata.namespace)
                  .replace("{name}", schema.metadata.name) :
               ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate) && rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate != "") ?
                 rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                   .replace("{namespace}", schema.metadata.namespace)
                   .replace("{name}", schema.metadata.name) :
                 schema.metadata.name))}
          path: >-
            ${schema.spec.path}
          policies: >-
            ${(has(schema.spec.policies) && schema.spec.policies.size() > 0 && schema.spec.policies[0].?arn.orValue("") != "" ?
                [schema.spec.policies[0].arn] : [])
              + (firstPolicyRef.size() > 0 && has(firstPolicyRef[0].status) && has(firstPolicyRef[0].status.arn) && firstPolicyRef[0].status.arn != "" ?
                  [firstPolicyRef[0].status.arn] : [])}
          inlinePolicies: >-
            ${has(schema.spec.policies) && schema.spec.policies.size() > 0 && schema.spec.policies[0].?inline.?name.orValue("") != "" ?
              {schema.spec.policies[0].inline.name: (schema.spec.policies[0].?inline.?documentRef.orValue("") != "" && firstInlineDoc.size() > 0 && has(firstInlineDoc[0].spec) ? firstInlineDoc[0].spec.documentJSON : schema.spec.policies[0].?inline.?documentJSON.orValue(""))} :
              {}}
          tags: >-
            ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.tags)) ? rsrcCfg[0].status.effectiveConfig.defaults.tags : {})
              .merge(schema.spec.syncedAnnotations)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.tags)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.tags)) ? rsrcCfg[0].status.effectiveConfig.mandatory.tags : {})
              .transformList(k, v, {"key": k, "value": v})}
