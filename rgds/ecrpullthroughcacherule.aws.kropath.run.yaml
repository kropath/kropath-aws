---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: ecrpullthroughcacherule.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: ECRPullThroughCacheRule
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      tags: map[string]string | default={}
      # Required — local ECR prefix under which cached images are stored. Immutable after creation.
      ecrRepositoryPrefix: string | default=""
      # Required — URL of the upstream public registry. Immutable after creation.
      upstreamRegistryURL: string | default=""
      # Optional passthrough fields
      upstreamRegistry: string | default=""
      upstreamRepositoryPrefix: string | default=""
      credentialARN: string | default=""
      customRoleARN: string | default=""
      registryID: string | default=""
    status:
      conditions:
        - >-
          ${(pullThroughCacheRule.?status.?conditions.orValue([])).map(c, runtime.newCondition({type: c.type, status: c.status, reason: c.?reason.orValue(''), message: c.?message.orValue('')}))}
    additionalPrinterColumns:
      - name: EcrRepositoryPrefix
        type: string
        jsonPath: .spec.ecrRepositoryPrefix
      - name: UpstreamRegistryURL
        type: string
        jsonPath: .spec.upstreamRegistryURL
  resources:
    # Single governance config lookup — controller pre-merges all cascade layers (ADR-010 D-1).
    # Uses selector.matchLabels (Theme 28/KRO-221) — CEL in externalRef.metadata.name is not evaluated.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: ECRConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ACK ECR PullThroughCacheRule CR — primary cloud resource.
    # Naming exemption (KRO-236): PullThroughCacheRule has no provider name field;
    # identity is established by ecrRepositoryPrefix + registryID.
    # Immutable fields (ecrRepositoryPrefix, upstreamRegistryURL, upstreamRegistry,
    # upstreamRepositoryPrefix, registryID) carry x-kubernetes-validations in the ACK CRD;
    # enforcement is at the ACK layer — no in-graph ConfigMap needed here.
    - id: pullThroughCacheRule
      template:
        apiVersion: ecr.services.k8s.aws/v1alpha1
        kind: PullThroughCacheRule
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.tags)) ? rsrcCfg[0].status.effectiveConfig.defaults.tags.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.tags.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.tags)) ? rsrcCfg[0].status.effectiveConfig.mandatory.tags.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: ECRPullThroughCacheRule
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          ecrRepositoryPrefix: "${schema.spec.ecrRepositoryPrefix}"
          upstreamRegistryURL: "${schema.spec.upstreamRegistryURL}"
          upstreamRegistry: "${schema.spec.upstreamRegistry}"
          upstreamRepositoryPrefix: "${schema.spec.upstreamRepositoryPrefix}"
          credentialARN: "${schema.spec.credentialARN}"
          customRoleARN: "${schema.spec.customRoleARN}"
          registryID: "${schema.spec.registryID}"
