---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: route53recordset.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: Route53RecordSet
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      deletionPolicy: string | default=retain
      # No tags: Route53 RecordSets do not support cloud tags (G-3).
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # DNS record type. Required. E.g. A, AAAA, CNAME, MX, TXT, NS, SOA, SRV, PTR, CAA, DS.
      recordType: string | default=""
      # FQDN of the record set. Optional (some routing policies require it).
      name: string | default=""
      # Hosted zone by ID (mutually exclusive with hostedZoneRef).
      hostedZoneID: string | default=""
      # Hosted zone by CR reference (mutually exclusive with hostedZoneID).
      hostedZoneRef: string | default=""
      hostedZoneRefNamespace: string | default=""
      # TTL in seconds. 0 = fall through to Route53Config defaultTTL cascade. Not used for alias records.
      ttl: integer | default=0
      # Resource record values (e.g. IP addresses for A records, CNAME targets).
      resourceRecords: "[]RecordValue | default=[]"
      # Alias target (mutually exclusive with resourceRecords + ttl).
      aliasTargetDNSName: string | default=""
      aliasTargetHostedZoneID: string | default=""
      aliasTargetEvaluateTargetHealth: boolean
      # Weighted routing: weight (0–255) and set identifier (required when weight is set).
      weight: integer | default=-1
      # Latency routing: AWS region and set identifier.
      region: string | default=""
      # Failover routing: PRIMARY or SECONDARY.
      failover: string | default=""
      # Geolocation routing.
      geoLocationContinentCode: string | default=""
      geoLocationCountryCode: string | default=""
      geoLocationSubdivisionCode: string | default=""
      # Multivalue answer routing.
      multiValueAnswer: boolean
      # CIDR routing.
      cidrCollectionID: string | default=""
      cidrLocationName: string | default=""
      # Unique identifier within a resource record set group (required for weighted/latency/failover/geo/multivalue/CIDR routing).
      setIdentifier: string | default=""
      # Health check by ID or CR reference.
      healthCheckID: string | default=""
      healthCheckRef: string | default=""
      healthCheckRefNamespace: string | default=""
    types:
      RecordValue:
        value: string | default=""
    status:
      changeID: >-
        ${ackRecordSet.?status.?id.orValue("")}
      syncStatus: >-
        ${ackRecordSet.?status.?status.orValue("")}
      conditions: >-
        ${ackRecordSet.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: SyncStatus
        type: string
        jsonPath: .status.syncStatus
      - name: ChangeID
        type: string
        jsonPath: .status.changeID
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: Route53Config
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    - id: ackRecordSet
      template:
        apiVersion: route53.services.k8s.aws/v1alpha1
        kind: RecordSet
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          recordType: ${schema.spec.recordType}
          name: ${schema.spec.name}
          hostedZoneID: ${schema.spec.hostedZoneID}
          hostedZoneRef: >-
            ${schema.spec.hostedZoneRef != "" ? {"from": {"name": schema.spec.hostedZoneRef, "namespace": schema.spec.hostedZoneRefNamespace != "" ? schema.spec.hostedZoneRefNamespace : schema.metadata.namespace}} : {}}
          ttl: >-
            ${rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.mandatory.?defaultTTL.orValue(0) != 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.defaultTTL
              : (schema.spec.ttl != 0
                  ? schema.spec.ttl
                  : (rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.defaults.?defaultTTL.orValue(300) : 300))}
          resourceRecords: >-
            ${schema.spec.resourceRecords.map(r, {"value": r.value})}
          aliasTarget: >-
            ${schema.spec.aliasTargetDNSName != "" ? {
              "dnsName": schema.spec.aliasTargetDNSName,
              "hostedZoneID": schema.spec.aliasTargetHostedZoneID,
              "evaluateTargetHealth": has(schema.spec.aliasTargetEvaluateTargetHealth) ? schema.spec.aliasTargetEvaluateTargetHealth : false
            } : {}}
          weight: >-
            ${schema.spec.weight >= 0 ? schema.spec.weight : 0}
          region: ${schema.spec.region}
          failover: ${schema.spec.failover}
          geoLocation: >-
            ${(schema.spec.geoLocationContinentCode != "" || schema.spec.geoLocationCountryCode != "") ? {
              "continentCode": schema.spec.geoLocationContinentCode,
              "countryCode": schema.spec.geoLocationCountryCode,
              "subdivisionCode": schema.spec.geoLocationSubdivisionCode
            } : {}}
          multiValueAnswer: >-
            ${has(schema.spec.multiValueAnswer) ? schema.spec.multiValueAnswer : false}
          cidrRoutingConfig: >-
            ${schema.spec.cidrCollectionID != "" ? {
              "collectionID": schema.spec.cidrCollectionID,
              "locationName": schema.spec.cidrLocationName
            } : {}}
          setIdentifier: ${schema.spec.setIdentifier}
          healthCheckID: ${schema.spec.healthCheckID}
          healthCheckRef: >-
            ${schema.spec.healthCheckRef != "" ? {"from": {"name": schema.spec.healthCheckRef, "namespace": schema.spec.healthCheckRefNamespace != "" ? schema.spec.healthCheckRefNamespace : schema.metadata.namespace}} : {}}
