---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: sqsqueue.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: SQSQueue
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      # Queue type — true enables FIFO mode and appends .fifo suffix to effectiveName
      fifo: boolean | default=false
      # FIFO-specific fields (ignored when fifo=false)
      contentBasedDeduplication: boolean | default=false
      deduplicationScope: string | default=queue
      fifoThroughputLimit: string | default=perQueue
      # Queue behaviour (integer governance; 0 = not set at this tier)
      visibilityTimeout: integer | default=0
      messageRetentionPeriod: integer | default=0
      delaySeconds: integer | default=0
      receiveMessageWaitTimeSeconds: integer | default=0
      maximumMessageSize: integer | default=0
      # Encryption (governed by SQSConfig cascade)
      encryptionType: string | default=""
      kmsMasterKeyId: string | default=""
      kmsDataKeyReusePeriodSeconds: integer | default=300
      # Queue policy (resource-based via AWSPolicyDocument)
      queuePolicyRef: string | default=""
      # Dead-letter queue configuration
      redrivePolicy:
        deadLetterTargetRef: string | default=""
        maxReceiveCount: integer | default=0
      # Source queue restriction (on a DLQ itself)
      redriveAllowPolicy:
        redrivePermission: string | default=allowAll
        sourceQueueArns: "[]string | default=[]"
    status:
      resourceName: >-
        ${naming.data.resourceName}
      namingStatus: >-
        ${naming.data.namingStatus}
      predictedArn: >-
        ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.aws) && naming.data.resourceName != ""
          ? "arn:aws:sqs:" + rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") + ":" + rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") + ":" + naming.data.resourceName
          : ""}
      queueUrl: >-
        ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.aws) && naming.data.resourceName != ""
          ? "https://sqs." + rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") + ".amazonaws.com/" + rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") + "/" + naming.data.resourceName
          : ""}
      conditions: >-
        ${queueStandard.?status.?conditions.orValue([])}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus
      - name: PredictedArn
        type: string
        jsonPath: .status.predictedArn
      - name: QueueUrl
        type: string
        jsonPath: .status.queueUrl
  resources:
    # Single governance config lookup — controller pre-merges all cascade layers (ADR-010 D-1).
    # Uses selector.matchLabels (Theme 28/KRO-221) — CEL in externalRef.metadata.name is not evaluated.
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: SQSConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # DLQ ARN resolution via the DLQ's naming ConfigMap (OD-2).
    # Cannot use SQSQueue externalRef here — self-referential kind causes kro schema-not-found at init.
    # Instead, each SQSQueue's naming ConfigMap is labeled with aws.kropath.run/resource-name and
    # aws.kropath.run/kropath-type: sqs-naming so source queues can discover the DLQ's resourceName.
    # Sentinel pattern: when deadLetterTargetRef is empty, selector never matches and dlqNaming is [].
    - id: dlqNaming
      externalRef:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.redrivePolicy.deadLetterTargetRef != "" ? schema.spec.redrivePolicy.deadLetterTargetRef : "kro-empty-fallback-sentinel"}'
              aws.kropath.run/kropath-type: sqs-naming

    # Queue policy resolution via AWSPolicyDocument (optional).
    # Sentinel pattern: when queuePolicyRef is empty, selector never matches and policyDoc is [].
    - id: policyDoc
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: PolicyDocument
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.queuePolicyRef != "" ? schema.spec.queuePolicyRef : "kro-empty-fallback-sentinel"}'

    # ConfigMap to materialise effectiveName, resourceName (with .fifo suffix), and namingStatus.
    # Computed here so status block can reference naming.data.* without requiring schema.* access.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            aws.kropath.run/resource-name: ${schema.metadata.name}
            aws.kropath.run/kropath-type: sqs-naming
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          # effectiveName: base name with full {tag.X} dynamic substitution support.
          # Tag tokens resolved in cascade order: mandatory wins over spec, spec wins over defaults.
          # Any {tag.X} token whose key is absent in all tiers is kept verbatim so namingStatus
          # (computed below from resourceName) reports "invalid-unresolved-tokens".
          effectiveName: >-
            ${(schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))}
          # resourceName includes .fifo suffix for FIFO queues (appended after effectiveName resolution)
          resourceName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))
              + (schema.spec.fifo ? ".fifo" : ""))}
          namingStatus: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : "{namespace}-{name}"))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{name}", schema.metadata.name)
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef))
              + (schema.spec.fifo ? ".fifo" : "")).contains("{")
              ? "invalid-unresolved-tokens"
              : "valid"}

    # ACK SQS Queue CR — standard (non-FIFO) queue.
    # deduplicationScope and fifoThroughputLimit are intentionally absent: AWS rejects
    # these attributes when FifoQueue is false, regardless of their value (KRO-906).
    - id: queueStandard
      includeWhen:
        - '${!schema.spec.fifo}'
      template:
        apiVersion: sqs.services.k8s.aws/v1alpha1
        kind: Queue
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          queueName: ${naming.data.resourceName}
          # Encryption — resolved via three-tier cascade (mandatory -> instance -> defaults -> hardcoded fallback)
          sqsManagedSSEEnabled: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("")
                : (schema.spec.encryptionType != ""
                    ? schema.spec.encryptionType
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("") != ""
                        ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("")
                        : "sqs-managed"))) == "sqs-managed"
              ? "true"
              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("") != ""
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("")
                  : (schema.spec.encryptionType != ""
                      ? schema.spec.encryptionType
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("") != ""
                          ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("")
                          : "sqs-managed"))) == "none"
                ? "false"
                : ""}
          kmsMasterKeyID: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("")
                : (schema.spec.encryptionType != ""
                    ? schema.spec.encryptionType
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("") != ""
                        ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("")
                        : "sqs-managed"))) == "kms"
              ? (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?kmsMasterKeyId.orValue("") != ""
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.?kmsMasterKeyId.orValue("")
                  : (schema.spec.kmsMasterKeyId != ""
                      ? schema.spec.kmsMasterKeyId
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?kmsMasterKeyId.orValue("") : ""))
              : ""}
          kmsDataKeyReusePeriodSeconds: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("")
                : (schema.spec.encryptionType != ""
                    ? schema.spec.encryptionType
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("") != ""
                        ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("")
                        : "sqs-managed"))) == "kms"
              ? string(schema.spec.kmsDataKeyReusePeriodSeconds > 0 ? schema.spec.kmsDataKeyReusePeriodSeconds : 300)
              : ""}
          # Queue behaviour — integer governance: mandatory acts as ceiling (non-zero = enforce)
          visibilityTimeout: >-
            ${string(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?visibilityTimeout.orValue(0) > 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?visibilityTimeout.orValue(0)
              : (schema.spec.visibilityTimeout > 0
                  ? schema.spec.visibilityTimeout
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?visibilityTimeout.orValue(0) > 0
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?visibilityTimeout.orValue(0)
                      : 30)))}
          messageRetentionPeriod: >-
            ${string(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?messageRetentionPeriod.orValue(0) > 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?messageRetentionPeriod.orValue(0)
              : (schema.spec.messageRetentionPeriod > 0
                  ? schema.spec.messageRetentionPeriod
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?messageRetentionPeriod.orValue(0) > 0
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?messageRetentionPeriod.orValue(0)
                      : 345600)))}
          delaySeconds: >-
            ${string(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?delaySeconds.orValue(0) > 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?delaySeconds.orValue(0)
              : (schema.spec.delaySeconds > 0
                  ? schema.spec.delaySeconds
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?delaySeconds.orValue(0) > 0
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?delaySeconds.orValue(0)
                      : 0)))}
          receiveMessageWaitTimeSeconds: >-
            ${string(schema.spec.receiveMessageWaitTimeSeconds > 0 ? schema.spec.receiveMessageWaitTimeSeconds : 0)}
          maximumMessageSize: >-
            ${string(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?maximumMessageSize.orValue(0) > 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?maximumMessageSize.orValue(0)
              : (schema.spec.maximumMessageSize > 0
                  ? schema.spec.maximumMessageSize
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?maximumMessageSize.orValue(0) > 0
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?maximumMessageSize.orValue(0)
                      : 262144)))}
          # Standard queues: fifoQueue always "false"; contentBasedDeduplication always
          # "false"; deduplicationScope and fifoThroughputLimit intentionally omitted —
          # AWS rejects them when FifoQueue is false (KRO-906).
          fifoQueue: "false"
          contentBasedDeduplication: "false"
          # Queue access policy — read from AWSPolicyDocument CR when queuePolicyRef is set
          policy: >-
            ${schema.spec.queuePolicyRef != "" && policyDoc.size() > 0
              ? policyDoc[0].spec.documentJSON
              : ""}
          # Dead-letter queue — JSON-encoded string consumed by ACK.
          # ARN is constructed from dlqNaming ConfigMap (resourceName already includes .fifo suffix)
          # combined with rsrcCfg aws.region and aws.accountId (both queues share the same config).
          redrivePolicy: >-
            ${schema.spec.redrivePolicy.deadLetterTargetRef != "" && dlqNaming.size() > 0 && rsrcCfg.size() > 0
              ? "{\"deadLetterTargetArn\":\"arn:aws:sqs:" + rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") + ":" + rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") + ":" + dlqNaming[0].data.resourceName + "\",\"maxReceiveCount\":" + string(schema.spec.redrivePolicy.maxReceiveCount) + "}"
              : ""}
          # Source queue restriction — JSON-encoded string; v1 constraint: callers supply full ARNs (OD-3)
          redriveAllowPolicy: >-
            ${schema.spec.redriveAllowPolicy.redrivePermission == "byQueue"
              ? "{\"redrivePermission\":\"byQueue\",\"sourceQueueArns\":[" + schema.spec.redriveAllowPolicy.sourceQueueArns.map(arn, "\"" + arn + "\"").join(",") + "]}"
              : schema.spec.redriveAllowPolicy.redrivePermission == "denyAll"
                ? "{\"redrivePermission\":\"denyAll\"}"
                : ""}
          # Cloud resource tags — plain map (ACK SQS Queue tags field is map[string]string)
          tags: >-
            ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}

    # ACK SQS Queue CR — FIFO queue.
    # Includes deduplicationScope and fifoThroughputLimit, which are FIFO-only attributes
    # rejected by AWS when FifoQueue is false (KRO-906).
    - id: queueFifo
      includeWhen:
        - '${schema.spec.fifo}'
      template:
        apiVersion: sqs.services.k8s.aws/v1alpha1
        kind: Queue
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          queueName: ${naming.data.resourceName}
          # Encryption — resolved via three-tier cascade (mandatory -> instance -> defaults -> hardcoded fallback)
          sqsManagedSSEEnabled: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("")
                : (schema.spec.encryptionType != ""
                    ? schema.spec.encryptionType
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("") != ""
                        ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("")
                        : "sqs-managed"))) == "sqs-managed"
              ? "true"
              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("") != ""
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("")
                  : (schema.spec.encryptionType != ""
                      ? schema.spec.encryptionType
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("") != ""
                          ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("")
                          : "sqs-managed"))) == "none"
                ? "false"
                : ""}
          kmsMasterKeyID: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("")
                : (schema.spec.encryptionType != ""
                    ? schema.spec.encryptionType
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("") != ""
                        ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("")
                        : "sqs-managed"))) == "kms"
              ? (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?kmsMasterKeyId.orValue("") != ""
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.?kmsMasterKeyId.orValue("")
                  : (schema.spec.kmsMasterKeyId != ""
                      ? schema.spec.kmsMasterKeyId
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?kmsMasterKeyId.orValue("") : ""))
              : ""}
          kmsDataKeyReusePeriodSeconds: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionType.orValue("")
                : (schema.spec.encryptionType != ""
                    ? schema.spec.encryptionType
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("") != ""
                        ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionType.orValue("")
                        : "sqs-managed"))) == "kms"
              ? string(schema.spec.kmsDataKeyReusePeriodSeconds > 0 ? schema.spec.kmsDataKeyReusePeriodSeconds : 300)
              : ""}
          # Queue behaviour — integer governance: mandatory acts as ceiling (non-zero = enforce)
          visibilityTimeout: >-
            ${string(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?visibilityTimeout.orValue(0) > 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?visibilityTimeout.orValue(0)
              : (schema.spec.visibilityTimeout > 0
                  ? schema.spec.visibilityTimeout
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?visibilityTimeout.orValue(0) > 0
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?visibilityTimeout.orValue(0)
                      : 30)))}
          messageRetentionPeriod: >-
            ${string(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?messageRetentionPeriod.orValue(0) > 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?messageRetentionPeriod.orValue(0)
              : (schema.spec.messageRetentionPeriod > 0
                  ? schema.spec.messageRetentionPeriod
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?messageRetentionPeriod.orValue(0) > 0
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?messageRetentionPeriod.orValue(0)
                      : 345600)))}
          delaySeconds: >-
            ${string(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?delaySeconds.orValue(0) > 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?delaySeconds.orValue(0)
              : (schema.spec.delaySeconds > 0
                  ? schema.spec.delaySeconds
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?delaySeconds.orValue(0) > 0
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?delaySeconds.orValue(0)
                      : 0)))}
          receiveMessageWaitTimeSeconds: >-
            ${string(schema.spec.receiveMessageWaitTimeSeconds > 0 ? schema.spec.receiveMessageWaitTimeSeconds : 0)}
          maximumMessageSize: >-
            ${string(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?maximumMessageSize.orValue(0) > 0
              ? rsrcCfg[0].status.effectiveConfig.mandatory.?maximumMessageSize.orValue(0)
              : (schema.spec.maximumMessageSize > 0
                  ? schema.spec.maximumMessageSize
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?maximumMessageSize.orValue(0) > 0
                      ? rsrcCfg[0].status.effectiveConfig.defaults.?maximumMessageSize.orValue(0)
                      : 262144)))}
          # FIFO queue: all four FIFO attributes emitted (KRO-906).
          fifoQueue: "true"
          contentBasedDeduplication: '${schema.spec.contentBasedDeduplication ? "true" : "false"}'
          deduplicationScope: '${schema.spec.deduplicationScope}'
          fifoThroughputLimit: '${schema.spec.fifoThroughputLimit}'
          # Queue access policy — read from AWSPolicyDocument CR when queuePolicyRef is set
          policy: >-
            ${schema.spec.queuePolicyRef != "" && policyDoc.size() > 0
              ? policyDoc[0].spec.documentJSON
              : ""}
          # Dead-letter queue — JSON-encoded string consumed by ACK.
          redrivePolicy: >-
            ${schema.spec.redrivePolicy.deadLetterTargetRef != "" && dlqNaming.size() > 0 && rsrcCfg.size() > 0
              ? "{\"deadLetterTargetArn\":\"arn:aws:sqs:" + rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") + ":" + rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") + ":" + dlqNaming[0].data.resourceName + "\",\"maxReceiveCount\":" + string(schema.spec.redrivePolicy.maxReceiveCount) + "}"
              : ""}
          # Source queue restriction — JSON-encoded string; v1 constraint: callers supply full ARNs (OD-3)
          redriveAllowPolicy: >-
            ${schema.spec.redriveAllowPolicy.redrivePermission == "byQueue"
              ? "{\"redrivePermission\":\"byQueue\",\"sourceQueueArns\":[" + schema.spec.redriveAllowPolicy.sourceQueueArns.map(arn, "\"" + arn + "\"").join(",") + "]}"
              : schema.spec.redriveAllowPolicy.redrivePermission == "denyAll"
                ? "{\"redrivePermission\":\"denyAll\"}"
                : ""}
          # Cloud resource tags — plain map (ACK SQS Queue tags field is map[string]string)
          tags: >-
            ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}
