# aws-msk-03 MSKCluster RGD — wraps ACK kafka.services.k8s.aws/Cluster.
# Two externalRef lookups: rsrcCfg (MSKConfig, always) and mskConfigurationCr
# (MSKConfiguration, only resolved when spec.configurationRef != "" — sentinel
# fallback selector keeps the variable always bound as []).
# configurationRef/configurationArn mutual exclusivity enforced via the in-graph
# ConfigMap advisory pattern (kro v0.9.2 discards hand-authored
# x-kubernetes-validations on every regeneration — see docs/frequent-rgd-errors.md
# "x-kubernetes-validations Cannot Be Auto-Generated by kro v0.9.2"), NOT via
# schema-level x-kubernetes-validations as the spec doc's literal wording suggests.
# status.predictedArn intentionally omitted — MSK cluster ARNs include a
# non-deterministic AWS-assigned UUID; status.clusterArn (post-ACTIVE) is used
# instead. spec.tags maps directly to ACK spec.tags (map<string,string> — no
# list conversion, unlike SNS/SQS list-shaped tags).
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: mskcluster.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: MSKCluster
    scope: Namespaced
    spec:
      # Standard governance fields
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}

      # Kafka version — governed by MSKConfig cascade
      kafkaVersion: string | default=""

      # Cluster topology
      numberOfBrokerNodes: integer | required=true
      instanceType: string | default=""
      clientSubnets: "[]string | required=true"
      securityGroups: "[]string | default=[]"
      brokerAZDistribution: string | default=DEFAULT

      # Storage
      volumeSize: integer | default=100
      provisionedThroughputEnabled: boolean | default=false
      provisionedThroughputVolumeThroughput: integer | default=0
      storageMode: string | default=""

      # Authentication
      saslIamEnabled: boolean | default=false
      saslScramEnabled: boolean | default=false
      tlsEnabled: boolean | default=false
      tlsCertificateAuthorityArns: "[]string | default=[]"
      unauthenticatedEnabled: boolean | default=false
      associatedScramSecretArns: "[]string | default=[]"

      # Broker configuration reference (mutually exclusive — enforced via advisory ConfigMap)
      configurationRef: string | default=""
      configurationArn: string | default=""
      configurationRevision: integer | default=0

      # Encryption — governed by MSKConfig cascade
      encryptionAtRestKmsKeyId: string | default=""
      encryptionInTransitClientBroker: string | default=""
      encryptionInTransitInCluster: string | default=""

      # Monitoring — governed by MSKConfig cascade
      enhancedMonitoring: string | default=""

      # Prometheus open monitoring
      jmxExporterEnabled: boolean | default=false
      nodeExporterEnabled: boolean | default=false

      # Logging
      logging:
        cloudWatchLogs:
          enabled: boolean | default=false
          logGroup: string | default=""
        firehose:
          enabled: boolean | default=false
          deliveryStream: string | default=""
        s3:
          enabled: boolean | default=false
          bucket: string | default=""
          prefix: string | default=""

      # Networking
      connectivityNetworkType: string | default=""
      publicAccessType: string | default=""

      # Rebalancing (Express brokers only)
      rebalancingStatus: string | default=""
    status:
      resourceName: >-
        ${naming.data.resourceName}
      namingStatus: >-
        ${naming.data.namingStatus}
      clusterArn: >-
        ${cluster.?status.?ackResourceMetadata.?arn.orValue("")}
      # NOTE (verified empirically 2026-09-24): kro v0.9.2 reserves the exact status
      # field name "state" for its own instance-lifecycle summary (it overwrites the
      # key with "ACTIVE"/etc. regardless of the CEL expression assigned to it — the
      # child Cluster CR's real spec.status.state is never surfaced through a field
      # literally named "state"). Exposed as clusterState instead to avoid the
      # collision. See docs/troubleshooting-logs/2026-09-24-mskcluster-state-field-reserved-by-kro.md.
      clusterState: >-
        ${cluster.?status.?state.orValue("")}
      bootstrapBrokerStringTLS: >-
        ${cluster.?status.?bootstrapBrokerStringTLS.orValue("")}
      bootstrapBrokerStringSASLIAM: >-
        ${cluster.?status.?bootstrapBrokerStringSASLIAM.orValue("")}
      bootstrapBrokerStringSASLSCRAM: >-
        ${cluster.?status.?bootstrapBrokerStringSASLSCRAM.orValue("")}
      conditions: >-
        ${cluster.?status.?conditions.orValue([])}
      validationError: >-
        ${has(mutualExclusionError.data) && has(mutualExclusionError.data.error) ? mutualExclusionError.data.error : ""}
    additionalPrinterColumns:
      - name: ResourceName
        type: string
        jsonPath: .status.resourceName
      - name: State
        type: string
        jsonPath: .status.clusterState
      - name: NamingStatus
        type: string
        jsonPath: .status.namingStatus

  resources:
    # Config lookup via labelSelector (Theme 28 / KRO-221).
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: MSKConfig
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # Referenced MSKConfiguration CR — sentinel fallback selector keeps the
    # variable always bound as [] when configurationRef is empty (avoids the
    # Unbound Variable Freeze — see docs/frequent-rgd-errors.md).
    - id: mskConfigurationCr
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: MSKConfiguration
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: '${schema.spec.configurationRef != "" ? schema.spec.configurationRef : "kro-empty-fallback-sentinel"}'

    # Naming ConfigMap — computes effectiveName (resourceName) and namingStatus.
    # {tag.X} tokens resolve in cascade order: mandatory.tags -> mandatory.syncedLabels
    # -> instance spec.tags -> instance spec.syncedLabels -> defaults.tags ->
    # defaults.syncedLabels (mandatory wins). Any unresolved token is kept verbatim
    # so namingStatus correctly reports "invalid-unresolved-tokens".
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: MSKCluster
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          resourceName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : schema.metadata.name)))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (part.split("}")[0] in schema.spec.tags
                              ? schema.spec.tags[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.syncedLabels
                                  ? schema.spec.syncedLabels[part.split("}")[0]]
                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                      ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                          ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                          : "{tag." + part.split("}")[0] + "}"))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("{account_id}") : "{account_id}")
              .replace("{region}", (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("{region}") : "{region}")
              .replace("{configRef}", schema.spec.configRef))}
          namingStatus: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : schema.metadata.name)))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (part.split("}")[0] in schema.spec.tags
                              ? schema.spec.tags[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.syncedLabels
                                  ? schema.spec.syncedLabels[part.split("}")[0]]
                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                      ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                          ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                          : "{tag." + part.split("}")[0] + "}"))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("{account_id}") : "{account_id}")
              .replace("{region}", (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig)) ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("{region}") : "{region}")
              .replace("{configRef}", schema.spec.configRef)).contains("{")
              ? "invalid-unresolved-tokens"
              : "valid"}

    # Advisory ConfigMap — configurationRef/configurationArn mutual exclusivity.
    # x-kubernetes-validations cannot be preserved by kro (regenerated from the RGD
    # schema on every apply) — see docs/frequent-rgd-errors.md.
    - id: mutualExclusionError
      includeWhen:
        - '${schema.spec.configurationRef != "" && schema.spec.configurationArn != ""}'
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-validation-error
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: MSKCluster
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          error: "configurationRef and configurationArn are mutually exclusive — set at most one"

    # ACK Cluster CR — not created when naming is invalid (unresolved tokens).
    - id: cluster
      includeWhen:
        - '${!naming.data.resourceName.contains("{")}'
      template:
        apiVersion: kafka.services.k8s.aws/v1alpha1
        kind: Cluster
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"aws.kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: MSKCluster
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.resourceName}
          kafkaVersion: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?kafkaVersion.orValue("") != ""
              ? rsrcCfg[0].status.effectiveConfig.mandatory.kafkaVersion
              : (schema.spec.kafkaVersion != ""
                  ? schema.spec.kafkaVersion
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?kafkaVersion.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.defaults.kafkaVersion
                      : "3.6.0")))}
          numberOfBrokerNodes: ${schema.spec.numberOfBrokerNodes}
          brokerNodeGroupInfo:
            instanceType: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?instanceType.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.instanceType
                : (schema.spec.instanceType != ""
                    ? schema.spec.instanceType
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?instanceType.orValue("") != ""
                        ? rsrcCfg[0].status.effectiveConfig.defaults.instanceType
                        : "kafka.m5.large")))}
            clientSubnets: ${schema.spec.clientSubnets}
            securityGroups: ${schema.spec.securityGroups}
            brokerAZDistribution: ${schema.spec.brokerAZDistribution}
            connectivityInfo:
              networkType: ${schema.spec.connectivityNetworkType}
              publicAccess:
                type: ${schema.spec.publicAccessType}
            storageInfo:
              ebsStorageInfo:
                volumeSize: ${schema.spec.volumeSize}
                provisionedThroughput:
                  enabled: ${schema.spec.provisionedThroughputEnabled}
                  volumeThroughput: ${schema.spec.provisionedThroughputVolumeThroughput}
          storageMode: ${schema.spec.storageMode}
          associatedSCRAMSecrets: ${schema.spec.associatedScramSecretArns}
          clientAuthentication:
            sasl:
              iam:
                enabled: ${schema.spec.saslIamEnabled}
              scram:
                enabled: ${schema.spec.saslScramEnabled}
            tls:
              enabled: ${schema.spec.tlsEnabled}
              certificateAuthorityARNList: ${schema.spec.tlsCertificateAuthorityArns}
            unauthenticated:
              enabled: ${schema.spec.unauthenticatedEnabled}
          configurationInfo: >-
            ${schema.spec.configurationRef != ""
              ? (mskConfigurationCr.size() > 0 && mskConfigurationCr[0].?status.?configurationArn.orValue("") != ""
                  ? {"arn": mskConfigurationCr[0].status.configurationArn,
                     "revision": mskConfigurationCr[0].?status.?latestRevision.orValue(0)}
                  : {})
              : (schema.spec.configurationArn != ""
                  ? (schema.spec.configurationRevision > 0
                      ? {"arn": schema.spec.configurationArn, "revision": schema.spec.configurationRevision}
                      : {"arn": schema.spec.configurationArn})
                  : {})}
          encryptionInfo:
            encryptionInTransit:
              clientBroker: >-
                ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionInTransitClientBroker.orValue("") != ""
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.encryptionInTransitClientBroker
                  : (schema.spec.encryptionInTransitClientBroker != ""
                      ? schema.spec.encryptionInTransitClientBroker
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionInTransitClientBroker.orValue("") != ""
                          ? rsrcCfg[0].status.effectiveConfig.defaults.encryptionInTransitClientBroker
                          : "TLS"))}
              inCluster: >-
                ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionInTransitInCluster.orValue("") != ""
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.encryptionInTransitInCluster
                  : (schema.spec.encryptionInTransitInCluster != ""
                      ? schema.spec.encryptionInTransitInCluster
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionInTransitInCluster.orValue("") != ""
                          ? rsrcCfg[0].status.effectiveConfig.defaults.encryptionInTransitInCluster
                          : "true"))) == "true"}
            encryptionAtRest: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionAtRestKmsKeyId.orValue("") != ""
                ? {"dataVolumeKMSKeyID": rsrcCfg[0].status.effectiveConfig.mandatory.encryptionAtRestKmsKeyId}
                : (schema.spec.encryptionAtRestKmsKeyId != ""
                    ? {"dataVolumeKMSKeyID": schema.spec.encryptionAtRestKmsKeyId}
                    : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionAtRestKmsKeyId.orValue("") != "")
                        ? {"dataVolumeKMSKeyID": rsrcCfg[0].status.effectiveConfig.defaults.encryptionAtRestKmsKeyId}
                        : {})))}
          enhancedMonitoring: >-
            ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?enhancedMonitoring.orValue("") != ""
              ? rsrcCfg[0].status.effectiveConfig.mandatory.enhancedMonitoring
              : (schema.spec.enhancedMonitoring != ""
                  ? schema.spec.enhancedMonitoring
                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?enhancedMonitoring.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.defaults.enhancedMonitoring
                      : "DEFAULT")))}
          openMonitoring:
            prometheus:
              jmxExporter:
                enabledInBroker: ${schema.spec.jmxExporterEnabled}
              nodeExporter:
                enabledInBroker: ${schema.spec.nodeExporterEnabled}
          loggingInfo:
            brokerLogs:
              cloudWatchLogs:
                enabled: ${schema.spec.logging.cloudWatchLogs.enabled}
                logGroup: ${schema.spec.logging.cloudWatchLogs.logGroup}
              firehose:
                enabled: ${schema.spec.logging.firehose.enabled}
                deliveryStream: ${schema.spec.logging.firehose.deliveryStream}
              s3:
                enabled: ${schema.spec.logging.s3.enabled}
                bucket: ${schema.spec.logging.s3.bucket}
                prefix: ${schema.spec.logging.s3.prefix}
          rebalancing: >-
            ${schema.spec.rebalancingStatus != "" ? {"status": schema.spec.rebalancingStatus} : {}}
          tags: >-
            ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
              .merge(schema.spec.tags)
              .merge(schema.spec.syncedLabels)
              .merge(schema.spec.syncedAnnotations)
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig) && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})}
