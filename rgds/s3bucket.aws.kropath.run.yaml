---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: s3bucket.aws.kropath.run
spec:
  schema:
    apiVersion: v1alpha1
    group: aws.kropath.run
    kind: S3Bucket
    scope: Namespaced
    spec:
      configRef: string | default=general-policy
      nameOverride: string | default=""
      deletionPolicy: string | default=retain
      region: string | default=""
      tags: map[string]string | default={}
      syncedLabels: map[string]string | default={}
      syncedAnnotations: map[string]string | default={}
      encryption:
        algorithm: string | default=""
        kmsKeyArn: string | default=""
        bucketKeyEnabled: boolean | default=true
      blockPublicAccess: boolean
      versioning: string | default=""
      enforceHttpsOnly: boolean
      objectOwnership: string | default=BucketOwnerEnforced
    status:
      resourceName: >-
        ${naming.data.effectiveName}
      namingStatus: >-
        ${naming.data.effectiveName.contains("{") ? "invalid-unresolved-tokens" : "valid"}
      predictedArn: >-
        ${"arn:aws:s3:::" + naming.data.effectiveName}
  resources:
    - id: rsrcCfg
      externalRef:
        apiVersion: aws.kropath.run/v1alpha1
        kind: S3Config
        metadata:
          namespace: ${schema.metadata.namespace}
          selector:
            matchLabels:
              aws.kropath.run/resource-name: ${schema.?spec.?configRef.orValue("general-policy")}

    # ConfigMap that materialises effectiveName with full {tag.X} dynamic substitution support.
    # Tag tokens are resolved in cascade order: defaults → instance spec → mandatory (mandatory wins).
    # Any {tag.X} token whose key is absent in the merged tags map is kept verbatim so that
    # namingStatus reports "invalid-unresolved-tokens" and the bucket name is clearly invalid.
    - id: naming
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-naming
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
            app.kubernetes.io/instance: ${schema.metadata.name}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          # Dynamic {tag.X} resolution:
          #   1. Split template by "{tag." to get segments
          #   2. For each segment after the first, extract key = part before "}", resolve from
          #      merged tags (mandatory wins > instance spec > defaults), then append tail
          #   3. Re-join segments and apply standard {namespace}/{name}/etc. substitutions
          # Priority: mandatory.tags > mandatory.syncedLabels > mandatory.syncedAnnotations
          #         > spec.tags > spec.syncedLabels > spec.syncedAnnotations
          #         > defaults.tags > defaults.syncedLabels > defaults.syncedAnnotations
          # Unresolved tokens are kept verbatim as "{tag.KEY}" so namingStatus catches them.
          effectiveName: >-
            ${((schema.spec.nameOverride != ""
              ? schema.spec.nameOverride
              : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?namingTemplate.orValue("") != "")
                  ? rsrcCfg[0].status.effectiveConfig.mandatory.namingTemplate
                  : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?namingTemplate.orValue("") != "")
                      ? rsrcCfg[0].status.effectiveConfig.defaults.namingTemplate
                      : schema.metadata.name)))
              .split("{tag.")
              .transformList(i, part,
                i == 0 ? part
                : ((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.tags
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.tags[part.split("}")[0]]
                      : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({})
                          ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels[part.split("}")[0]]
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({})
                              ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations[part.split("}")[0]]
                              : (part.split("}")[0] in schema.spec.tags
                                  ? schema.spec.tags[part.split("}")[0]]
                                  : (part.split("}")[0] in schema.spec.syncedLabels
                                      ? schema.spec.syncedLabels[part.split("}")[0]]
                                      : (part.split("}")[0] in schema.spec.syncedAnnotations
                                          ? schema.spec.syncedAnnotations[part.split("}")[0]]
                                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.tags
                                              ? rsrcCfg[0].status.effectiveConfig.defaults.tags[part.split("}")[0]]
                                              : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({})
                                                  ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels[part.split("}")[0]]
                                                  : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && part.split("}")[0] in rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({})
                                                      ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations[part.split("}")[0]]
                                                      : "{tag." + part.split("}")[0] + "}")))))))))
                  + (size(part.split("}")) > 1
                      ? part.split("}").slice(1, size(part.split("}"))).join("}")
                      : "")))
              .join("")
              .replace("{namespace}", schema.metadata.namespace)
              .replace("{name}", schema.metadata.name)
              .replace("{account_id}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?accountId.orValue("") : "")
              .replace("{region}", rsrcCfg.size() > 0 ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") : "")
              .replace("{configRef}", schema.spec.configRef)
            ).lowerAscii()}

    # Bucket variant with HTTPS-only bucket policy; active when enforceHttpsOnly is true.
    # Empty-string policy is not omission in ACK — use includeWhen split to ensure
    # the policy field is absent from the spec when HTTPS enforcement is not required.
    - id: bucketWithPolicy
      includeWhen:
        - >-
          ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?enforceHttpsOnly.orValue(false))
            ? true
            : (schema.spec.?enforceHttpsOnly.orValue(false)
                ? true
                : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?enforceHttpsOnly.orValue(false)))}
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.effectiveName}
          createBucketConfiguration:
            locationConstraint: >-
              ${schema.spec.region != "" && schema.spec.region != "us-east-1"
                ? schema.spec.region
                : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") != "" && rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") != "us-east-1"
                    ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("")
                    : "")}
          encryption:
            rules:
              - applyServerSideEncryptionByDefault:
                  sseAlgorithm: >-
                    ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionAlgorithm.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionAlgorithm.orValue("")
                      : (schema.spec.encryption.algorithm != ""
                          ? schema.spec.encryption.algorithm
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionAlgorithm.orValue("") != ""
                              ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionAlgorithm.orValue("")
                              : "aws:kms"))}
                  kmsMasterKeyID: >-
                    ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?kmsKeyArn.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.?kmsKeyArn.orValue("")
                      : (schema.spec.encryption.kmsKeyArn != ""
                          ? schema.spec.encryption.kmsKeyArn
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?kmsKeyArn.orValue("") != ""
                              ? rsrcCfg[0].status.effectiveConfig.defaults.?kmsKeyArn.orValue("")
                              : "alias/aws/s3"))}
                bucketKeyEnabled: ${schema.spec.encryption.bucketKeyEnabled}
          publicAccessBlock:
            blockPublicACLs: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?blockPublicAccess.orValue(false))
                ? true
                : (schema.spec.?blockPublicAccess.orValue(false)
                    ? true
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?blockPublicAccess.orValue(false)))}
            blockPublicPolicy: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?blockPublicAccess.orValue(false))
                ? true
                : (schema.spec.?blockPublicAccess.orValue(false)
                    ? true
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?blockPublicAccess.orValue(false)))}
            ignorePublicACLs: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?blockPublicAccess.orValue(false))
                ? true
                : (schema.spec.?blockPublicAccess.orValue(false)
                    ? true
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?blockPublicAccess.orValue(false)))}
            restrictPublicBuckets: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?blockPublicAccess.orValue(false))
                ? true
                : (schema.spec.?blockPublicAccess.orValue(false)
                    ? true
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?blockPublicAccess.orValue(false)))}
          versioning:
            status: >-
              ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?versioning.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.?versioning.orValue("")
                : (schema.spec.versioning != ""
                    ? schema.spec.versioning
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?versioning.orValue("") : "")}
          policy: >-
            ${"{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"DenyNonTLSAccess\",\"Effect\":\"Deny\",\"Principal\":\"*\",\"Action\":\"s3:*\",\"Resource\":[\"arn:aws:s3:::__BNAME__\",\"arn:aws:s3:::__BNAME__/*\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":\"false\"}}}]}"
              .replace("__BNAME__", naming.data.effectiveName)}
          tagging:
            tagSet: >-
              ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
                .merge(schema.spec.tags)
                .merge(schema.spec.syncedLabels)
                .merge(schema.spec.syncedAnnotations)
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})
                .transformList(k, v, {"key": k, "value": v})}
          objectOwnership: >-
            ${schema.spec.objectOwnership != "" ? schema.spec.objectOwnership : "BucketOwnerEnforced"}
          ownershipControls:
            rules:
              - objectOwnership: >-
                  ${schema.spec.objectOwnership != "" ? schema.spec.objectOwnership : "BucketOwnerEnforced"}

    # Bucket variant without bucket policy; active when enforceHttpsOnly is false/unset.
    - id: bucket
      includeWhen:
        - >-
          ${!((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?enforceHttpsOnly.orValue(false))
            ? true
            : (schema.spec.?enforceHttpsOnly.orValue(false)
                ? true
                : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?enforceHttpsOnly.orValue(false))))}
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels: >-
            ${{"app.kubernetes.io/managed-by": "kro", "app.kubernetes.io/instance": schema.metadata.name}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedLabels.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          annotations: >-
            ${{"services.k8s.aws/deletion-policy": schema.spec.deletionPolicy}
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.defaults.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})
              .merge(schema.spec.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}))
              .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations)) ? rsrcCfg[0].status.effectiveConfig.mandatory.syncedAnnotations.transformMapEntry(k, v, {"kropath.run/" + k: v}) : {})}
          ownerReferences:
            - apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${naming.data.effectiveName}
          createBucketConfiguration:
            locationConstraint: >-
              ${schema.spec.region != "" && schema.spec.region != "us-east-1"
                ? schema.spec.region
                : (rsrcCfg.size() > 0 && rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") != "" && rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("") != "us-east-1"
                    ? rsrcCfg[0].status.effectiveConfig.aws.?region.orValue("")
                    : "")}
          encryption:
            rules:
              - applyServerSideEncryptionByDefault:
                  sseAlgorithm: >-
                    ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionAlgorithm.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.?encryptionAlgorithm.orValue("")
                      : (schema.spec.encryption.algorithm != ""
                          ? schema.spec.encryption.algorithm
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?encryptionAlgorithm.orValue("") != ""
                              ? rsrcCfg[0].status.effectiveConfig.defaults.?encryptionAlgorithm.orValue("")
                              : "aws:kms"))}
                  kmsMasterKeyID: >-
                    ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?kmsKeyArn.orValue("") != ""
                      ? rsrcCfg[0].status.effectiveConfig.mandatory.?kmsKeyArn.orValue("")
                      : (schema.spec.encryption.kmsKeyArn != ""
                          ? schema.spec.encryption.kmsKeyArn
                          : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?kmsKeyArn.orValue("") != ""
                              ? rsrcCfg[0].status.effectiveConfig.defaults.?kmsKeyArn.orValue("")
                              : "alias/aws/s3"))}
                bucketKeyEnabled: ${schema.spec.encryption.bucketKeyEnabled}
          publicAccessBlock:
            blockPublicACLs: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?blockPublicAccess.orValue(false))
                ? true
                : (schema.spec.?blockPublicAccess.orValue(false)
                    ? true
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?blockPublicAccess.orValue(false)))}
            blockPublicPolicy: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?blockPublicAccess.orValue(false))
                ? true
                : (schema.spec.?blockPublicAccess.orValue(false)
                    ? true
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?blockPublicAccess.orValue(false)))}
            ignorePublicACLs: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?blockPublicAccess.orValue(false))
                ? true
                : (schema.spec.?blockPublicAccess.orValue(false)
                    ? true
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?blockPublicAccess.orValue(false)))}
            restrictPublicBuckets: >-
              ${(rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?blockPublicAccess.orValue(false))
                ? true
                : (schema.spec.?blockPublicAccess.orValue(false)
                    ? true
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults) && rsrcCfg[0].status.effectiveConfig.defaults.?blockPublicAccess.orValue(false)))}
          versioning:
            status: >-
              ${rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory) && rsrcCfg[0].status.effectiveConfig.mandatory.?versioning.orValue("") != ""
                ? rsrcCfg[0].status.effectiveConfig.mandatory.?versioning.orValue("")
                : (schema.spec.versioning != ""
                    ? schema.spec.versioning
                    : (rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?versioning.orValue("") : "")}
          tagging:
            tagSet: >-
              ${((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?tags.orValue({}) : {})
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedLabels.orValue({}) : {})
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.defaults)) ? rsrcCfg[0].status.effectiveConfig.defaults.?syncedAnnotations.orValue({}) : {})
                .merge(schema.spec.tags)
                .merge(schema.spec.syncedLabels)
                .merge(schema.spec.syncedAnnotations)
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?tags.orValue({}) : {})
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedLabels.orValue({}) : {})
                .merge((rsrcCfg.size() > 0 && has(rsrcCfg[0].status.effectiveConfig.mandatory)) ? rsrcCfg[0].status.effectiveConfig.mandatory.?syncedAnnotations.orValue({}) : {})
                .transformList(k, v, {"key": k, "value": v})
                .sortBy(x, x.key)}
          objectOwnership: >-
            ${schema.spec.objectOwnership != "" ? schema.spec.objectOwnership : "BucketOwnerEnforced"}
          ownershipControls:
            rules:
              - objectOwnership: >-
                  ${schema.spec.objectOwnership != "" ? schema.spec.objectOwnership : "BucketOwnerEnforced"}
