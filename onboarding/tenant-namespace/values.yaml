#
# One declared input block per tenant namespace (ADR-015 §5.8.5). Copy this file per tenant
# (e.g. values-payments-dev.yaml) — see tests/values-sample.yaml for a filled-in example and
# README.md for the full walkthrough.

# The namespace being onboarded.
namespace: ""

# Namespace role per ADR-019 D-5 — controls which annotations get rendered onto the Namespace
# below. Both roles render KropathConfig/baseline and one <Family>Config per declared family;
# only the Namespace annotations differ.
#
#   local  — a resource namespace: family-owned cloud resources created in it participate in
#            the placement gate (ADR-015 §5.6). Renders all three placement annotations
#            (global-config-namespace pointer + the two ACK CARM annotations) and therefore
#            requires globalConfigNamespace, accountId, and region below.
#   global — a governance-only namespace (ADR-019 D-5): holds KropathConfig/<Family>Config
#            objects that local namespaces' globalConfigNamespace can point to, but has no
#            resource instances of its own. Renders none of the three placement annotations,
#            and does not need globalConfigNamespace, accountId, or region.
namespaceRole: local

# Namespace holding the global-tier KropathConfig/<Family>Config baseline this namespace
# inherits from. Must already exist and be reachable by kropath-controller.
# Required when namespaceRole is "local"; unused when "global".
globalConfigNamespace: ""

# 12-digit AWS account ID this namespace is placed in. Rendered verbatim into
# services.k8s.aws/owner-account-id — ACK's own CARM annotation (ADR-015 §5.8.1). Validated
# against ^[0-9]{12}$ at render time (ADR-015 §5.8.2 rule 1, InvalidAccountAnnotation).
# Required when namespaceRole is "local"; unused when "global".
accountId: ""

# AWS region this namespace is placed in. Rendered verbatim into
# services.k8s.aws/default-region — ACK's own CARM annotation (ADR-015 §5.8.1).
# Required when namespaceRole is "local"; unused when "global".
region: ""

# configRef every emitted <Family>Config carries as its aws.kropath.run/resource-name label,
# and the value resource instances in this namespace must reference (or omit, since it is
# the RGD schema default) to resolve them. One shared configRef across all declared families
# keeps the per-tenant input block to a single scalar; split it per family here if a tenant
# ever needs different profiles per family in the same namespace.
configRef: general-policy

# Family slugs to onboard in this namespace — one empty-spec local-tier <Family>Config is
# emitted per entry (see onboarding/tenant-namespace/family-kind-map.yaml for the accepted
# slugs and their <Family>Config Kind). An empty spec is deliberate: this CR's only job is to
# exist so kropath-controller's watch fires and status.effectiveConfig gets written at all
# (ADR-015 §5.9) — actual governance values still cascade from the global tier in
# globalConfigNamespace. Add mandatory/defaults overrides directly in the rendered manifest,
# or a values-driven override map, once a tenant actually needs a local-tier override.
families: []
