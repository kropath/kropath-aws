apiVersion: v2
name: tenant-namespace-onboarding
description: >-
  Renders the Namespace, the local KropathConfig/baseline, and one <Family>Config per declared
  family that a resource namespace needs before any kro resource instance (ADR-015 §5.8.5,
  KRO-1140). Renders plain manifests only — this chart never applies anything to a live cluster.
type: application
version: 0.1.0
appVersion: "1.0"
keywords:
  - kropath
  - onboarding
  - placement
home: https://github.com/kropath/kropath-core/blob/main/docs/adrs/015-consolidated-platform-decisions.md
