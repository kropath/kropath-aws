apiVersion: v2
name: tenant-namespace-onboarding
description: >-
  Renders the Namespace, the KropathConfig/baseline, and one <Family>Config per declared family
  that a namespace needs before any kro resource instance reconciles (ADR-015 §5.8.5, KRO-1140,
  KRO-1175). Supports both onboarding flows from ADR-019 D-5: a "local" resource namespace
  (carries the placement annotations) and a "global" governance-only namespace (carries none of
  them). Renders plain manifests only — this chart never applies anything to a live cluster.
type: application
version: 0.2.0
appVersion: "1.0"
keywords:
  - kropath
  - onboarding
  - placement
home: https://github.com/kropath/kropath-core/blob/main/docs/adrs/015-consolidated-platform-decisions.md
