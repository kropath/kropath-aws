# Sample "global" (governance-only) namespace input (ADR-019 D-5, KRO-1175) — no
# globalConfigNamespace/accountId/region: a global namespace carries none of the three
# placement annotations and is not itself a resource namespace. See values-sample.yaml for the
# "local" resource-namespace flow.
namespace: platform-governance
namespaceRole: global
families:
  s3:
    enabled: true
  sqs:
    enabled: true
  rds:
    enabled: true
