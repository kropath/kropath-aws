#
# The local-tier KropathConfig for this namespace, rendered regardless of namespaceRole — a
# governance-only "global" namespace needs this object too, since it (or a local namespace
# pointing at it via globalConfigNamespace) is exactly what other namespaces' global tier
# resolves through (ADR-015 §3.1, §5.7). KropathConfig is a per-namespace singleton named
# "baseline" in both tiers, looked up by literal name — never by configRef (§3.4) and never
# by label selector, unlike <Family>Config (Theme 28). Its role is determined by which
# namespace it lives in, never by its name.
#
# A namespace with no local KropathConfig is valid — absence is silently skipped, not an error
# (§3.1) — but this chart renders an empty-spec one anyway, mirroring family-configs.yaml's
# empty-spec <Family>Config: it exists so an operator has exactly one object to edit for
# namespace-wide blanket governance (levels 2 and 8 of the ten-level cascade, §5.3) instead of
# hand-deriving the schema from ADR-015 §3.2/§3.5. Populate spec.mandatory/spec.defaults (top
# level, or any <family> section such as spec.mandatory.s3) directly in the rendered manifest
# once this namespace actually needs a local override; every field must be set in exactly one
# tier (§3.2).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: {{ .Values.namespace | required "namespace is required" }}
  labels:
    app.kubernetes.io/managed-by: {{ .Chart.Name }}
spec: {}
