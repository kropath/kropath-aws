#
# The namespace itself. For namespaceRole "local" (a resource namespace) this carries the
# three provider-native annotations kropath-controller and ACK both read at runtime (ADR-015
# §5.6, §5.8.1, §5.8.5, ADR-019 D-4/D-5) — no kropath-owned runtime field holds any of this,
# these are exactly the annotations ACK's own CARM integration already honours, so this
# Namespace is the single artifact both kropath and ACK resolve placement from. For
# namespaceRole "global" (a governance-only namespace, ADR-019 D-5) none of the three are
# rendered: it has no resource instances to place, and D-4's account/region requirement
# applies only to resource namespaces.
{{- if not (has .Values.namespaceRole (list "global" "local")) }}
{{ fail (printf "namespaceRole must be \"global\" or \"local\", got %q" (.Values.namespaceRole | toString)) }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "namespace is required" .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Chart.Name }}
{{- if eq .Values.namespaceRole "local" }}
  annotations:
    # Namespace role + global-tier pointer (ADR-015 §5.6). No default: absence means "not a
    # resource namespace", never a fallback to kro-system (KRO-1139 removed that fallback).
    aws.kropath.run/global-config-namespace: {{ required "globalConfigNamespace is required when namespaceRole is \"local\" (ADR-015 §5.6)" .Values.globalConfigNamespace | quote }}
    # ACK's own CARM annotations (ADR-015 §5.8.1) — kropath reads these, never writes a
    # kropath-prefixed equivalent (ADR-019 D-3 / ADR-015 §5.8.5).
    services.k8s.aws/owner-account-id: {{ required "accountId is required when namespaceRole is \"local\" (ADR-015 §5.8.2 rule 1)" .Values.accountId | quote }}
    services.k8s.aws/default-region: {{ required "region is required when namespaceRole is \"local\" (ADR-015 §5.8.2 rule 1)" .Values.region | quote }}
{{- end }}
