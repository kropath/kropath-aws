# One empty-spec local-tier <Family>Config per declared family (ADR-015 §5.8.5, §5.9, §5.10).
# kropath-controller never creates these (ADR-003 stands unchanged) — existence is entirely
# GitOps-authored, which is the whole point: without this CR a resource namespace gets no
# watch event and no reconcile at all, so a namespace's first resource instance would
# otherwise hit an opaque externalRef-not-found failure (ADR-015 §5.9, H-6/KRO-1139).
{{- $map := include "tenant-namespace-onboarding.familyKindMapYAML" . | fromYaml }}
{{- $configRef := include "tenant-namespace-onboarding.configRef" . }}
{{- range .Values.families }}
{{- $slug := . }}
{{- $kind := index $map $slug }}
{{- if not $kind }}
{{- fail (printf "unknown family %q in .Values.families — not found in family-kind-map.yaml. Check the slug against that file's keys, or regenerate it (hack/gen-family-kind-map.sh) if this is a newly added family." $slug) }}
{{- end }}
---
apiVersion: aws.kropath.run/v1alpha1
kind: {{ $kind }}
metadata:
  name: {{ $configRef }}
  namespace: {{ $.Values.namespace | required "namespace is required" }}
  labels:
    # Theme 28 (KRO-143/KRO-221) — the label every RGD's externalRef selector.matchLabels
    # resolves this config CR by. Bare, unprefixed kropath.run/resource-name is deprecated.
    aws.kropath.run/resource-name: {{ $configRef }}
    app.kubernetes.io/managed-by: {{ $.Chart.Name }}
spec: {}
{{- end }}
