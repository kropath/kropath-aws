#
# One <Family>Config per declared, enabled family (KRO-1175 review), named after the configRef
# profile (default "general-policy", overridable per team) — rendered regardless of
# namespaceRole (ADR-015 §5.8.5, §5.9, §5.10). For a "local" namespace this is the local tier a
# resource instance's externalRef resolves against; for a "global" namespace (ADR-019 D-5)
# these objects are the global-tier input that local namespaces' globalConfigNamespace resolves
# through, and are never reconciled into a status.effectiveConfig of their own.
# kropath-controller never creates these (ADR-003 stands unchanged) — existence is entirely
# GitOps-authored, which is the whole point: without this CR a resource namespace gets no
# watch event and no reconcile at all, so a namespace's first resource instance would
# otherwise hit an opaque externalRef-not-found failure (ADR-015 §5.9, H-6/KRO-1139).
#
# spec defaults to {} (mirroring the CRD's own default, KRO-1140) unless the family's
# mandatory/defaults values below are non-empty, in which case they render explicitly —
# ack-chart-style per-family overrides (values.schema.json's families.<slug> shape).
{{- $map := include "tenant-namespace-onboarding.familyKindMapYAML" . | fromYaml }}
{{- $configRef := include "tenant-namespace-onboarding.configRef" . }}
{{- range $slug, $rawCfg := .Values.families }}
{{- $kind := index $map $slug }}
{{- if not $kind }}
{{- fail (printf "unknown family %q in .Values.families — not found in family-kind-map.yaml. Check the slug against that file's keys, or regenerate it (hack/gen-family-kind-map.sh) if this is a newly added family." $slug) }}
{{- end }}
{{- $cfg := $rawCfg | default dict }}
{{- $enabled := true }}
{{- if hasKey $cfg "enabled" }}
{{- $enabled = $cfg.enabled }}
{{- end }}
{{- if $enabled }}
{{- $mandatory := $cfg.mandatory | default dict }}
{{- $defaults := $cfg.defaults | default dict }}
---
apiVersion: aws.kropath.run/v1alpha1
kind: {{ $kind }}
metadata:
  name: {{ $configRef }}
  namespace: {{ $.Values.namespace | required "namespace is required" }}
  labels:
    # Theme 28 (KRO-143/KRO-221) — the label every RGD's externalRef selector.matchLabels
    # resolves this config CR by. Bare, unprefixed kropath.run/resource-name is deprecated.
    aws.kropath.run/resource-name: {{ $configRef }}
    app.kubernetes.io/managed-by: {{ $.Chart.Name }}
{{- if or $mandatory $defaults }}
spec:
  mandatory: {{ $mandatory | toYaml | nindent 4 }}
  defaults: {{ $defaults | toYaml | nindent 4 }}
{{- else }}
spec: {}
{{- end }}
{{- end }}
{{- end }}
