# Chainsaw configuration for local kropath-aws E2E testing.
# Run: chainsaw test ./tests/chainsaw/
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Configuration
metadata:
  name: kropath-aws-local
spec:
  # Target the local Kind cluster by default.
  # Override with KUBECONFIG or --kube-context on CI.
  timeouts:
    apply: 60s
    assert: 5m
    # cleanup/delete padded to 3m (from the chainsaw default of 2m): with 4 suites
    # running in parallel against one kro pod and no real cloud controllers to confirm
    # cascade deletion, the last step's cleanup phase can occasionally sit right at the
    # 2m boundary. See docs/frequent-rgd-errors.md §"Chainsaw Cleanup Timeout — kro
    # Cascade Deletion Queue Backup".
    cleanup: 3m
    delete: 3m
    error: 30s
    exec: 5m
  # Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
  # skipDelete"): the test cluster runs kro but no ACK controllers, so ACK finalizers are
  # never removed and chainsaw's end-of-test cascade delete hangs. skipDelete makes it the
  # default for every suite (including the smoke suite and any future suite); the ephemeral
  # kind cluster is discarded after the run, so nothing needs deleting. Individual Tests may
  # still set spec.skipDelete explicitly; this is the global default.
  skipDelete: true
  # Preserve namespace on failure for post-mortem debugging.
  namespace: kropath-aws-test
  # Print full diff on assertion failure.
  fullName: true
  # Parallel test execution — safe because each test uses its own namespace.
  parallel: 4
  failFast: false
