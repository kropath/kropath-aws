    # ═══════════════════════════════ Naming exemption (AC-19 to AC-20) ════════

    - name: ac19-no-naming-fields
      try:
        - script:
            content: |
              kubectl get crd mskvpcconnections.aws.kropath.run -o json \
                | jq -e '(.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties | has("nameOverride")) | not' \
                || { echo "FAIL: spec.nameOverride should not exist on the MSKVPCConnection CRD schema"; exit 1; }
              kubectl get crd mskvpcconnections.aws.kropath.run -o json \
                | jq -e '(.spec.versions[0].schema.openAPIV3Schema.properties.status.properties | has("resourceName") or has("predictedArn") or has("namingStatus")) | not' \
                || { echo "FAIL: status.resourceName/predictedArn/namingStatus should not exist on the MSKVPCConnection CRD schema"; exit 1; }
              echo "PASS: no naming fields on the generated CRD schema"

    - name: ac20-no-namingtemplate-governance
      try:
        # unresolved-naming-policy has an unresolvable {tag.env} token in
        # mandatory.namingTemplate. If this RGD read/validated namingTemplate at all
        # (like MSKCluster/MSKServerlessCluster do), reconciliation would be gated on
        # naming validity and this instance would never reach ResourcesReady=True.
        # MSKVPCConnection has no naming gate, so it reconciles cleanly regardless.
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac20-no-namingtemplate
                namespace: mskvpcconnection
              spec:
                configRef: unresolved-naming-policy
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac20-no-namingtemplate
                namespace: mskvpcconnection
              status:
                (conditions[?type == 'ResourcesReady']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac20-no-namingtemplate
                namespace: mskvpcconnection
