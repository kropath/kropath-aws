# aws-msk-05 MSKVPCConnection RGD Chainsaw tests — ACs 1-20.
# Wraps ACK kafka.services.k8s.aws/VPCConnection.
#
# Canonical pattern: unique resource name per step, spec.skipDelete: true, no inter-step
# ACK deletes. Governance effectiveConfig is set via kubectl patch --subresource=status
# (controller stub) directly on the MSKConfig seeds below.
#
# Seeds (created once, never mutated after their initial patch — reused read-only by many ACs):
#   general-policy             defaults.namingTemplate="{namespace}-{name}", mandatory empty
#                               (namingTemplate is irrelevant to this RGD but MSKConfig
#                               requires it be set to *something* for other MSK RGDs sharing
#                               the same config CR shape; MSKVPCConnection never reads it)
#   restricted-policy           a second, distinctly-labelled config for AC-3 selector proof
#   tags-merge-policy           mandatory.tags simulates a pre-merged KropathConfig+MSKConfig result
#   synced-dual-policy          mandatory.syncedLabels + defaults.syncedLabels (mixed tiers)
#   synced-annotations-policy   mandatory.syncedAnnotations
#   unresolved-naming-policy    mandatory.namingTemplate has an unresolvable {tag.env} token —
#                                proves this RGD does not read/validate namingTemplate at all
#                                (AC-20)
#
# MSKVPCConnection only consumes tags/syncedLabels/syncedAnnotations from MSKConfig —
# namingTemplate and all MSKCluster-specific fields (kafkaVersion, instanceType, encryption,
# monitoring) are intentionally never read by this RGD, unlike MSKCluster/MSKServerlessCluster.
#
# NOTE: status.state is NOT used — kro v0.9.2 reserves that exact field name for its own
# instance-lifecycle summary (verified empirically; see
# docs/troubleshooting-logs/2026-09-24-mskcluster-state-field-reserved-by-kro.md). The real ACK
# VPCConnection lifecycle state is surfaced as status.connectionState instead (AC-17 asserts
# connectionState, not state).
#
# NOTE on immutability (AC-8 to AC-12): unlike the x-kubernetes-validations deviation
# documented for MSKCluster/MSKServerlessCluster's mutual-exclusivity/range checks (kro
# discards hand-authored CRD validation on regeneration — see
# docs/frequent-rgd-errors.md §"x-kubernetes-validations Cannot Be Auto-Generated by kro
# v0.9.2"), immutability here is enforced one layer down: the ACK VPCConnection CRD itself
# (owned by the ACK controller, never regenerated by kro) carries `self == oldSelf`
# x-kubernetes-validations on authentication/targetClusterARN/vpcID/clientSubnets/
# securityGroups (confirmed via `kubectl get crd vpcconnections.kafka.services.k8s.aws -o
# yaml`). Verified empirically in this repo's test cluster: patching the parent
# MSKVPCConnection to change an immutable field is accepted by the parent's own schema (kro
# does not carry the rule), but kro's attempt to reconcile the child VPCConnection is rejected
# by the Kubernetes API server's CRD-level CEL admission — this surfaces on the parent as
# `status.conditions[type=ResourcesReady].status: "False"` with a message containing "Value is
# immutable once set" and the specific field name, WITHOUT requiring a live ACK controller
# process (CRD schema validation is enforced by kube-apiserver itself). This is genuinely
# testable in the local cluster and is asserted directly below — a stronger negative test than
# the "verify initial value only" pattern used for KMSKey's keySpec/keyUsage (kmskey.yaml
# AC-22/AC-23), where this exact mechanism was not exercised.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mskvpcconnection
spec:
  skipDelete: true
  namespace: mskvpcconnection
  steps:
    # ── Namespace ──────────────────────────────────────────────────────────────
    - name: setup-namespace
      try:
        - apply:
            file: 00-mskvpcconnection-namespace.yaml

    # ── Seed: general-policy ─────────────────────────────────────────────────
    - name: seed-general-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: general-policy
                name: general-policy
                namespace: mskvpcconnection
              spec:
                mandatory:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch mskconfig general-policy -n mskvpcconnection --subresource=status \
                --type=merge -p '{
                  "status":{
                    "effectiveConfig":{
                      "mandatory":{
                        "namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}
                      },
                      "defaults":{
                        "namingTemplate":"{namespace}-{name}",
                        "tags":{},"syncedLabels":{},"syncedAnnotations":{}
                      },
                      "aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}
                    }
                  }
                }'

    # ── Seed: restricted-policy (AC-3) — distinct config for selector proof ────
    - name: seed-restricted-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: restricted
                name: restricted
                namespace: mskvpcconnection
              spec:
                mandatory:
                  namingTemplate: ""
                  tags:
                    profile: restricted
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch mskconfig restricted -n mskvpcconnection --subresource=status \
                --type=merge -p '{
                  "status":{
                    "effectiveConfig":{
                      "mandatory":{
                        "namingTemplate":"","tags":{"profile":"restricted"},
                        "syncedLabels":{},"syncedAnnotations":{}
                      },
                      "defaults":{
                        "namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}
                      },
                      "aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}
                    }
                  }
                }'

    # ── Seed: tags-merge-policy (AC-4) — simulates pre-merged KropathConfig+MSKConfig ──
    - name: seed-tags-merge-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: tags-merge-policy
                name: tags-merge-policy
                namespace: mskvpcconnection
              spec:
                mandatory:
                  namingTemplate: ""
                  tags:
                    cost-centre: platform
                    connectivity: private
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch mskconfig tags-merge-policy -n mskvpcconnection --subresource=status \
                --type=merge -p '{
                  "status":{
                    "effectiveConfig":{
                      "mandatory":{
                        "namingTemplate":"",
                        "tags":{"cost-centre":"platform","connectivity":"private"},
                        "syncedLabels":{},"syncedAnnotations":{}
                      },
                      "defaults":{
                        "namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}
                      },
                      "aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}
                    }
                  }
                }'

    # ── Seed: synced-dual-policy (AC-5) — mixed tiers ───────────────────────────
    - name: seed-synced-dual-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: synced-dual-policy
                name: synced-dual-policy
                namespace: mskvpcconnection
              spec:
                mandatory:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels:
                    environment: production
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels:
                    data-class: internal
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch mskconfig synced-dual-policy -n mskvpcconnection --subresource=status \
                --type=merge -p '{
                  "status":{
                    "effectiveConfig":{
                      "mandatory":{
                        "namingTemplate":"","tags":{},
                        "syncedLabels":{"environment":"production"},"syncedAnnotations":{}
                      },
                      "defaults":{
                        "namingTemplate":"","tags":{},
                        "syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}
                      },
                      "aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}
                    }
                  }
                }'

    # ── Seed: synced-annotations-policy (AC-6) ──────────────────────────────────
    - name: seed-synced-annotations-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: synced-annotations-policy
                name: synced-annotations-policy
                namespace: mskvpcconnection
              spec:
                mandatory:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations:
                    team: streaming
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch mskconfig synced-annotations-policy -n mskvpcconnection --subresource=status \
                --type=merge -p '{
                  "status":{
                    "effectiveConfig":{
                      "mandatory":{
                        "namingTemplate":"","tags":{},"syncedLabels":{},
                        "syncedAnnotations":{"team":"streaming"}
                      },
                      "defaults":{
                        "namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}
                      },
                      "aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}
                    }
                  }
                }'

    # ── Seed: unresolved-naming-policy (AC-20) — proves namingTemplate is never read ──
    - name: seed-unresolved-naming-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: unresolved-naming-policy
                name: unresolved-naming-policy
                namespace: mskvpcconnection
              spec:
                mandatory:
                  namingTemplate: "{tag.env}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch mskconfig unresolved-naming-policy -n mskvpcconnection --subresource=status \
                --type=merge -p '{
                  "status":{
                    "effectiveConfig":{
                      "mandatory":{
                        "namingTemplate":"{tag.env}-{name}",
                        "tags":{},"syncedLabels":{},"syncedAnnotations":{}
                      },
                      "defaults":{
                        "namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}
                      },
                      "aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}
                    }
                  }
                }'

    # ═══════════════════════ Happy path — connection creation (AC-1) ═══════════

    - name: ac1-vpcconnection-create-full
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac1-create-full
                namespace: mskvpcconnection
              spec:
                configRef: general-policy
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
                securityGroups: ["sg-abc123"]
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac1-create-full
                namespace: mskvpcconnection
              spec:
                authentication: "IAM"
                targetClusterARN: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcID: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
                securityGroups: ["sg-abc123"]

    # ═════════════════ Default security groups (AC-2) ══════════════════════════

    - name: ac2-default-security-groups
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac2-default-sg
                namespace: mskvpcconnection
              spec:
                configRef: general-policy
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac2-default-sg
                namespace: mskvpcconnection
        - script:
            content: |
              SG=$(kubectl get vpcconnection ac2-default-sg -n mskvpcconnection -o json | jq -c '.spec.securityGroups // []')
              if [ "$SG" != "[]" ]; then
                echo "FAIL: expected empty securityGroups, got: $SG"
                exit 1
              fi
              echo "PASS: securityGroups is empty — AWS falls back to the VPC default security group"

    # ═══════════════ Config lookup via labelSelector (AC-3) ═════════════════════

    - name: ac3-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac3-config-selector
                namespace: mskvpcconnection
              spec:
                configRef: restricted
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac3-config-selector
                namespace: mskvpcconnection
        - script:
            content: |
              TAGS=$(kubectl get vpcconnection ac3-config-selector -n mskvpcconnection -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e '.["profile"] == "restricted"' >/dev/null \
                || { echo "FAIL: expected profile=restricted (from MSKConfig/restricted via labelSelector), got: $TAGS"; exit 1; }
              echo "PASS: rsrcCfg bound to MSKConfig/restricted via selector.matchLabels: $TAGS"
        # Default configRef (unset) resolves to MSKConfig/general-policy.
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac3-config-default
                namespace: mskvpcconnection
              spec:
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac3-config-default
                namespace: mskvpcconnection
              spec:
                configRef: general-policy

    # ═══════════════════════════════ Tags and labels (AC-4 to AC-7) ════════════

    - name: ac4-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac4-tags-merge
                namespace: mskvpcconnection
              spec:
                configRef: tags-merge-policy
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
                tags:
                  app: orders
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac4-tags-merge
                namespace: mskvpcconnection
        - script:
            content: |
              TAGS=$(kubectl get vpcconnection ac4-tags-merge -n mskvpcconnection -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e '.["cost-centre"] == "platform"' >/dev/null || { echo "FAIL: missing cost-centre=platform in $TAGS"; exit 1; }
              echo "$TAGS" | jq -e '.["connectivity"] == "private"' >/dev/null || { echo "FAIL: missing connectivity=private in $TAGS"; exit 1; }
              echo "$TAGS" | jq -e '.["app"] == "orders"' >/dev/null || { echo "FAIL: missing app=orders in $TAGS"; exit 1; }
              echo "PASS: all tags present: $TAGS"

    - name: ac5-synced-labels-dual
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac5-synced-dual
                namespace: mskvpcconnection
              spec:
                configRef: synced-dual-policy
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac5-synced-dual
                namespace: mskvpcconnection
                labels:
                  aws.kropath.run/environment: "production"
                  aws.kropath.run/data-class: "internal"
        - script:
            content: |
              TAGS=$(kubectl get vpcconnection ac5-synced-dual -n mskvpcconnection -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e '.["environment"] == "production"' >/dev/null || { echo "FAIL: missing environment=production in cloud tags: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e '.["data-class"] == "internal"' >/dev/null || { echo "FAIL: missing data-class=internal in cloud tags: $TAGS"; exit 1; }
              echo "PASS: synced labels present in both K8s labels and cloud tags: $TAGS"

    - name: ac6-synced-annotations
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac6-synced-annotations
                namespace: mskvpcconnection
              spec:
                configRef: synced-annotations-policy
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac6-synced-annotations
                namespace: mskvpcconnection
                annotations:
                  aws.kropath.run/team: "streaming"

    - name: ac7-tags-map-format
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac7-tags-format
                namespace: mskvpcconnection
              spec:
                configRef: general-policy
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
                tags:
                  app: orders
                  env: prod
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac7-tags-format
                namespace: mskvpcconnection
        - script:
            content: |
              TYPE=$(kubectl get vpcconnection ac7-tags-format -n mskvpcconnection -o json | jq -r '.spec.tags | type')
              if [ "$TYPE" != "object" ]; then
                echo "FAIL: expected spec.tags to be a map (object), got: $TYPE"
                exit 1
              fi
              APP=$(kubectl get vpcconnection ac7-tags-format -n mskvpcconnection -o jsonpath='{.spec.tags.app}')
              ENV=$(kubectl get vpcconnection ac7-tags-format -n mskvpcconnection -o jsonpath='{.spec.tags.env}')
              if [ "$APP" != "orders" ] || [ "$ENV" != "prod" ]; then
                echo "FAIL: expected app=orders env=prod, got app=$APP env=$ENV"
                exit 1
              fi
              echo "PASS: spec.tags is a map with app=$APP env=$ENV"

    # ═══════════════════════════ Immutability (AC-8 to AC-12) ═══════════════════
    #
    # Each scenario creates a connection, then attempts to change exactly one
    # immutable field. The parent MSKVPCConnection's own schema has no admission-time
    # rule (kro discards hand-authored x-kubernetes-validations on regeneration — see
    # header comment), so the patch itself succeeds against the parent. kro then tries
    # to reconcile the change onto the child ACK VPCConnection, which IS rejected by
    # the Kubernetes API server (the ACK CRD's own `self == oldSelf` CEL validation,
    # never regenerated by kro). This surfaces as `status.conditions[type=ResourcesReady]`
    # flipping to `False` with a message naming the immutable field — verified
    # empirically, see header comment.

    - name: ac8-immutable-authentication
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac8-immutable-auth
                namespace: mskvpcconnection
              spec:
                configRef: general-policy
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/orders-cluster/abc-uuid"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac8-immutable-auth
                namespace: mskvpcconnection
              spec:
                authentication: "IAM"
        - patch:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac8-immutable-auth
                namespace: mskvpcconnection
              spec:
                authentication: "TLS"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac8-immutable-auth
                namespace: mskvpcconnection
              status:
                (conditions[?type == 'ResourcesReady']):
                  - status: "False"
                    (contains(message, 'authentication')): true
                    (contains(message, 'immutable')): true
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac8-immutable-auth
                namespace: mskvpcconnection
              spec:
                authentication: "IAM"

    - name: ac9-immutable-targetclusterarn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac9-immutable-arn
                namespace: mskvpcconnection
              spec:
                configRef: general-policy
                authentication: "IAM"
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/a/uuid-1"
                vpcId: "vpc-abc123"
                clientSubnets: ["subnet-a", "subnet-b"]
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: VPCConnection
              metadata:
                name: ac9-immutable-arn
                namespace: mskvpcconnection
              spec:
                targetClusterARN: "arn:aws:kafka:us-east-1:123456789012:cluster/a/uuid-1"
        - patch:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac9-immutable-arn
                namespace: mskvpcconnection
              spec:
                targetClusterArn: "arn:aws:kafka:us-east-1:123456789012:cluster/b/uuid-2"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKVPCConnection
              metadata:
                name: ac9-immutable-arn
                namespace: mskvpcconnection
              status:
