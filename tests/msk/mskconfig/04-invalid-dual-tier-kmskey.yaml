# AC-4: rejected when encryptionAtRestKmsKeyId set in both mandatory and defaults
---
apiVersion: aws.kropath.run/v1alpha1
kind: MSKConfig
metadata:
  name: ac4-strict
  namespace: mskconfig
spec:
  mandatory:
    kafkaVersion: ""
    instanceType: ""
    encryptionAtRestKmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/abc"
    encryptionInTransitClientBroker: ""
    encryptionInTransitInCluster: ""
    enhancedMonitoring: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    kafkaVersion: "3.6.0"
    instanceType: "kafka.m5.large"
    encryptionAtRestKmsKeyId: "alias/aws/msk"
    encryptionInTransitClientBroker: "TLS"
    encryptionInTransitInCluster: "true"
    enhancedMonitoring: "DEFAULT"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
