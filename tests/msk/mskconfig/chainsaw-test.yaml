# aws-msk-01 MSKConfig governance tests -- isolated CRD ACs (AC-1 through AC-8, AC-10, AC-11, AC-14, AC-15).
# AC-9, AC-12, AC-13 are controller integration tests and are covered by the T-00 controller suite.
#
# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step + skipDelete"):
# every step uses a uniquely-named MSKConfig and deletes nothing between steps.
# skipDelete stops chainsaw's end-of-test cascade delete; the ephemeral kind cluster is
# discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mskconfig
spec:
  skipDelete: true
  namespace: mskconfig
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-mskconfig-namespace.yaml

    - name: ac1-general-policy-accepted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac1-policy
                name: ac1-policy
                namespace: mskconfig
              spec:
                mandatory:
                  kafkaVersion: ""
                  instanceType: ""
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: ""
                  encryptionInTransitInCluster: ""
                  enhancedMonitoring: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  kafkaVersion: "3.6.0"
                  instanceType: "kafka.m5.large"
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: "TLS"
                  encryptionInTransitInCluster: "true"
                  enhancedMonitoring: "DEFAULT"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                name: ac1-policy
                namespace: mskconfig
                labels:
                  aws.kropath.run/resource-name: ac1-policy
              spec:
                defaults:
                  kafkaVersion: "3.6.0"
                  instanceType: "kafka.m5.large"
                  encryptionInTransitClientBroker: "TLS"
                  encryptionInTransitInCluster: "true"
                  enhancedMonitoring: "DEFAULT"
                  namingTemplate: "{namespace}-{name}"

    - name: ac2-reject-dual-tier-kafkaversion
      try:
        - apply:
            file: 02-invalid-dual-tier-kafkaversion.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MSKConfig
                check:
                  ($error != null): true

    - name: ac3-reject-dual-tier-instancetype
      try:
        - apply:
            file: 03-invalid-dual-tier-instancetype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MSKConfig
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-kmskey
      try:
        - apply:
            file: 04-invalid-dual-tier-kmskey.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MSKConfig
                check:
                  ($error != null): true

    - name: ac5-reject-dual-tier-clientbroker
      try:
        - apply:
            file: 05-invalid-dual-tier-clientbroker.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MSKConfig
                check:
                  ($error != null): true

    - name: ac6-reject-dual-tier-incluster
      try:
        - apply:
            file: 06-invalid-dual-tier-incluster.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MSKConfig
                check:
                  ($error != null): true

    - name: ac7-reject-dual-tier-monitoring
      try:
        - apply:
            file: 07-invalid-dual-tier-monitoring.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MSKConfig
                check:
                  ($error != null): true

    - name: ac8-reject-dual-tier-naming
      try:
        - apply:
            file: 08-invalid-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MSKConfig
                check:
                  ($error != null): true

    - name: ac10-naming-template-in-effectiveconfig
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac10-policy
                name: ac10-policy
                namespace: mskconfig
              spec:
                mandatory:
                  kafkaVersion: ""
                  instanceType: ""
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: ""
                  encryptionInTransitInCluster: ""
                  enhancedMonitoring: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  kafkaVersion: "3.6.0"
                  instanceType: "kafka.m5.large"
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: "TLS"
                  encryptionInTransitInCluster: "true"
                  enhancedMonitoring: "DEFAULT"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch mskconfig ac10-policy -n mskconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kafkaVersion":"","instanceType":"","encryptionAtRestKmsKeyId":"","encryptionInTransitClientBroker":"","encryptionInTransitInCluster":"","enhancedMonitoring":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kafkaVersion":"3.6.0","instanceType":"kafka.m5.large","encryptionAtRestKmsKeyId":"","encryptionInTransitClientBroker":"TLS","encryptionInTransitInCluster":"true","enhancedMonitoring":"DEFAULT","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                name: ac10-policy
                namespace: mskconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"

    - name: ac11-mandatory-security-bundle-accepted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac11-pci
                name: ac11-pci
                namespace: mskconfig
              spec:
                mandatory:
                  kafkaVersion: ""
                  instanceType: ""
                  encryptionAtRestKmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/pci-key"
                  encryptionInTransitClientBroker: "TLS"
                  encryptionInTransitInCluster: "true"
                  enhancedMonitoring: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  kafkaVersion: "3.6.0"
                  instanceType: "kafka.m5.large"
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: ""
                  encryptionInTransitInCluster: ""
                  enhancedMonitoring: "DEFAULT"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                name: ac11-pci
                namespace: mskconfig
              spec:
                mandatory:
                  encryptionAtRestKmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/pci-key"
                  encryptionInTransitClientBroker: "TLS"
                  encryptionInTransitInCluster: "true"

    - name: ac14-mandatory-zero-value-accepted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac14-policy
                name: ac14-policy
                namespace: mskconfig
              spec:
                mandatory:
                  kafkaVersion: ""
                  instanceType: ""
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: ""
                  encryptionInTransitInCluster: ""
                  enhancedMonitoring: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  kafkaVersion: "3.6.0"
                  instanceType: "kafka.m5.large"
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: "TLS"
                  encryptionInTransitInCluster: "true"
                  enhancedMonitoring: "DEFAULT"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                name: ac14-policy
                namespace: mskconfig
              spec:
                mandatory:
                  kafkaVersion: ""
                  instanceType: ""
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: ""
                  encryptionInTransitInCluster: ""
                  enhancedMonitoring: ""
                  namingTemplate: ""

    - name: ac15-tier-valid-values-accepted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac15-mixed
                name: ac15-mixed
                namespace: mskconfig
              spec:
                mandatory:
                  kafkaVersion: "3.6.0"
                  instanceType: ""
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: ""
                  encryptionInTransitInCluster: ""
                  enhancedMonitoring: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  kafkaVersion: ""
                  instanceType: "kafka.m5.large"
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: "TLS"
                  encryptionInTransitInCluster: "true"
                  enhancedMonitoring: "DEFAULT"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                name: ac15-mixed
                namespace: mskconfig
              spec:
                mandatory:
                  kafkaVersion: "3.6.0"
                defaults:
                  instanceType: "kafka.m5.large"
                  encryptionInTransitClientBroker: "TLS"
