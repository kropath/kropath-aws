    # ── Seed: MSKConfiguration referenced by configurationRef (AC-26) ──────────
    - name: seed-mskconfiguration-ref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfiguration
              metadata:
                name: my-broker-config
                namespace: mskcluster
                labels:
                  aws.kropath.run/resource-name: my-broker-config
              spec:
                serverProperties: "auto.create.topics.enable=false\n"
        # MSKConfiguration's own status.configurationArn/latestRevision are DERIVED
        # from its child ACK Configuration CR — patching MSKConfiguration's status
        # directly is overwritten on the next reconcile. Assert the child exists,
        # then patch the child (matches tests/msk/mskconfiguration AC-16/AC-17).
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: Configuration
              metadata:
                name: my-broker-config
                namespace: mskcluster
        - script:
            content: |
              kubectl patch configuration my-broker-config -n mskcluster --subresource=status \
                --type=merge -p '{
                  "status":{
                    "ackResourceMetadata":{
                      "arn":"arn:aws:kafka:ap-southeast-2:123456789012:configuration/my-broker-config/abc",
                      "ownerAccountID":"123456789012","region":"ap-southeast-2"
                    },
                    "latestRevision":{"revision":3}
                  }
                }'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfiguration
              metadata:
                name: my-broker-config
                namespace: mskcluster
              status:
                configurationArn: "arn:aws:kafka:ap-southeast-2:123456789012:configuration/my-broker-config/abc"
                latestRevision: 3

    # ═══════════════════════ Kafka version governance (AC-1 to AC-4) ═══════════

