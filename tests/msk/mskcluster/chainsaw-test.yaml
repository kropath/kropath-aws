# aws-msk-03 MSKCluster RGD Chainsaw tests — ACs 1-57.
# Wraps ACK kafka.services.k8s.aws/Cluster.
#
# Canonical pattern: unique resource name per step, spec.skipDelete: true, no inter-step
# ACK deletes. Governance effectiveConfig is set via kubectl patch --subresource=status
# (controller stub) directly on the MSKConfig seeds below.
#
# Seeds (created once, never mutated after their initial patch — reused read-only by many ACs):
#   general-policy            defaults populated (kafkaVersion=3.6.0 etc.), mandatory empty
#   mandatory-policy          mandatory populated for all 6 governed fields
#   empty-policy              mandatory AND defaults empty (built-in-default tests)
#   mandatory-naming-policy   mandatory.namingTemplate="corp-{namespace}-{name}"
#   unresolved-naming-policy  defaults.namingTemplate has an unresolvable {tag.env} token
#   tags-merge-policy         mandatory.tags simulates a pre-merged KropathConfig+MSKConfig result
#   synced-dual-policy        mandatory.syncedLabels + defaults.syncedLabels (mixed tiers)
#   synced-annotations-policy mandatory.syncedAnnotations
#
# NOTE: status.state is NOT used — kro v0.9.2 reserves that exact field name for its own
# instance-lifecycle summary (verified empirically; see rgds/mskcluster.aws.kropath.run.yaml
# header and docs/troubleshooting-logs/2026-09-24-mskcluster-state-field-reserved-by-kro.md).
# The real ACK Cluster lifecycle state is surfaced as status.clusterState instead (AC-56/57
# assert clusterState, not state).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mskcluster
spec:
  skipDelete: true
  namespace: mskcluster
  steps:
    # ── Namespace ──────────────────────────────────────────────────────────────
    - name: setup-namespace
      try:
        - apply:
            file: 00-mskcluster-namespace.yaml

    # ── Seed: general-policy (defaults populated, mandatory empty) ────────────
    - name: seed-general-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: general-policy
                name: general-policy
                namespace: mskcluster
              spec:
                mandatory:
                  kafkaVersion: ""
                  instanceType: ""
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: ""
                  encryptionInTransitInCluster: ""
                  enhancedMonitoring: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  kafkaVersion: "3.6.0"
                  instanceType: "kafka.m5.large"
                  encryptionAtRestKmsKeyId: ""
                  encryptionInTransitClientBroker: "TLS"
                  encryptionInTransitInCluster: "true"
                  enhancedMonitoring: "DEFAULT"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch mskconfig general-policy -n mskcluster --subresource=status \
                --type=merge -p '{
                  "status":{
                    "effectiveConfig":{
                      "mandatory":{
                        "kafkaVersion":"","instanceType":"","encryptionAtRestKmsKeyId":"",
                        "encryptionInTransitClientBroker":"","encryptionInTransitInCluster":"",
                        "enhancedMonitoring":"","namingTemplate":"",
                        "tags":{},"syncedLabels":{},"syncedAnnotations":{}
                      },
                      "defaults":{
                        "kafkaVersion":"3.6.0","instanceType":"kafka.m5.large",
                        "encryptionAtRestKmsKeyId":"",
                        "encryptionInTransitClientBroker":"TLS","encryptionInTransitInCluster":"true",
                        "enhancedMonitoring":"DEFAULT","namingTemplate":"{namespace}-{name}",
                        "tags":{},"syncedLabels":{},"syncedAnnotations":{}
                      },
                      "aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}
                    }
                  }
                }'

