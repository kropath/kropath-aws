            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKCluster
              metadata:
                name: ac50-synced-dual
                namespace: mskcluster
              spec:
                configRef: synced-dual-policy
                numberOfBrokerNodes: 3
                clientSubnets: ["subnet-a", "subnet-b", "subnet-c"]
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac50-synced-dual
                namespace: mskcluster
                labels:
                  aws.kropath.run/environment: "production"
                  aws.kropath.run/data-class: "internal"
        - script:
            content: |
              TAGS=$(kubectl get clusters.kafka.services.k8s.aws ac50-synced-dual -n mskcluster -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e '.["environment"] == "production"' >/dev/null || { echo "FAIL: missing environment=production in cloud tags: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e '.["data-class"] == "internal"' >/dev/null || { echo "FAIL: missing data-class=internal in cloud tags: $TAGS"; exit 1; }
              echo "PASS: synced labels present in both K8s labels and cloud tags: $TAGS"

    - name: ac51-synced-annotations
