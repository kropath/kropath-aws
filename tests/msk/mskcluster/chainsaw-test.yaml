                name: ac51-synced-annotations
                namespace: mskcluster
                annotations:
                  aws.kropath.run/team: "streaming"

    - name: ac52-tags-map-format
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKCluster
              metadata:
                name: ac52-tags-format
                namespace: mskcluster
              spec:
                configRef: general-policy
                numberOfBrokerNodes: 3
                clientSubnets: ["subnet-a", "subnet-b", "subnet-c"]
                tags:
                  app: orders
                  env: prod
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac52-tags-format
                namespace: mskcluster
        - script:
            content: |
              TAGS=$(kubectl get clusters.kafka.services.k8s.aws ac52-tags-format -n mskcluster -o json | jq -r '.spec.tags | type')
              if [ "$TAGS" != "object" ]; then
                echo "FAIL: expected spec.tags to be a map (object), got: $TAGS"
                exit 1
              fi
              APP=$(kubectl get clusters.kafka.services.k8s.aws ac52-tags-format -n mskcluster -o jsonpath='{.spec.tags.app}')
              ENV=$(kubectl get clusters.kafka.services.k8s.aws ac52-tags-format -n mskcluster -o jsonpath='{.spec.tags.env}')
              if [ "$APP" != "orders" ] || [ "$ENV" != "prod" ]; then
                echo "FAIL: expected app=orders env=prod, got app=$APP env=$ENV"
                exit 1
              fi
              echo "PASS: spec.tags is a map with app=$APP env=$ENV"

