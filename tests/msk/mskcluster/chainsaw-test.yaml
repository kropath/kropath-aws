                namespace: mskcluster
              status:
                namingStatus: "invalid-unresolved-tokens"
        - script:
            content: |
              # Verify ACK Cluster is NOT created (includeWhen guard on invalid naming)
              COUNT=$(kubectl get clusters.kafka.services.k8s.aws -n mskcluster --field-selector=metadata.name=ac48-naming-unresolved --no-headers 2>/dev/null | wc -l | tr -d ' ')
              if [ "$COUNT" != "0" ]; then
                echo "FAIL: ACK Cluster should not exist when namingStatus=invalid-unresolved-tokens (found $COUNT)"
                exit 1
              fi
              echo "PASS: ACK Cluster not created for invalid naming"

    # ═══════════════════════════════ Tags and labels (AC-49 to AC-52) ═════════

    - name: ac49-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MSKCluster
              metadata:
                name: ac49-tags-merge
                namespace: mskcluster
              spec:
                configRef: tags-merge-policy
                numberOfBrokerNodes: 3
                clientSubnets: ["subnet-a", "subnet-b", "subnet-c"]
                tags:
                  app: orders
        - assert:
            resource:
              apiVersion: kafka.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac49-tags-merge
                namespace: mskcluster
        - script:
            content: |
              TAGS=$(kubectl get clusters.kafka.services.k8s.aws ac49-tags-merge -n mskcluster -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e '.["cost-centre"] == "platform"' >/dev/null || { echo "FAIL: missing cost-centre=platform in $TAGS"; exit 1; }
              echo "$TAGS" | jq -e '.["stream-type"] == "events"' >/dev/null || { echo "FAIL: missing stream-type=events in $TAGS"; exit 1; }
              echo "$TAGS" | jq -e '.["app"] == "orders"' >/dev/null || { echo "FAIL: missing app=orders in $TAGS"; exit 1; }
              echo "PASS: all three tags present: $TAGS"

    - name: ac50-synced-labels-dual
      try:
