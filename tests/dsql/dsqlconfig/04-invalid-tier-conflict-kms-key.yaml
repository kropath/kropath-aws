# AC-4: tier-conflict-kms-key — rejected by x-kubernetes-validations
---
apiVersion: aws.kropath.run/v1alpha1
kind: DSQLConfig
metadata:
  name: invalid-tier-conflict-kms
  namespace: dsqlconfig
  labels:
    aws.kropath.run/resource-name: invalid-tier-conflict-kms
spec:
  mandatory:
    deletionProtectionEnabled: false
    kmsEncryptionKey: "arn:aws:kms:us-east-1:111122223333:key/mrk-mandatory-key"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    deletionProtectionEnabled: true
    kmsEncryptionKey: "arn:aws:kms:us-east-1:111122223333:key/mrk-defaults-key"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
