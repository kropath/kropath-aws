# AC-3: tier-conflict-deletion-protection — rejected by x-kubernetes-validations
---
apiVersion: aws.kropath.run/v1alpha1
kind: DSQLConfig
metadata:
  name: invalid-tier-conflict-del
  namespace: dsqlconfig
  labels:
    aws.kropath.run/resource-name: invalid-tier-conflict-del
spec:
  mandatory:
    deletionProtectionEnabled: true
    kmsEncryptionKey: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    deletionProtectionEnabled: true
    kmsEncryptionKey: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
