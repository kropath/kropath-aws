    # AC-14: tag-merge-three-sources
    # Given: defaults.tags, instance spec.tags, and mandatory.tags all set
    # When: DSQLCluster applied
    # Then: ACK Cluster spec.tags = last-writer-wins map (mandatory wins over instance, instance over defaults)
    - name: ac14-tag-merge-three-sources
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac14-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac14-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{"env":"prod","tier":"mandatory-only"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{"env":"dev","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac14-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac14-cfg
                tags:
                  env: staging
                  app: myapp
        - script:
            content: |
              set -eu
              # DSQL tags are map[string]string — use jq for order-independent assertion.
              TAGS=$(kubectl get clusters.dsql.services.k8s.aws ac14-cluster -n dsqlcluster \
                -o json | jq -r '.spec.tags')
              # mandatory.tags.env="prod" wins over instance.tags.env="staging" and defaults.tags.env="dev"
              ENV_VAL=$(echo "$TAGS" | jq -r '.env')
              # mandatory-only key should be present
              TIER_VAL=$(echo "$TAGS" | jq -r '.tier')
              # instance-only key should be present
              APP_VAL=$(echo "$TAGS" | jq -r '.app')
              # defaults-only key should be present
              REGION_VAL=$(echo "$TAGS" | jq -r '.region')
              FAIL=0
              [ "$ENV_VAL" = "prod" ]    || { echo "FAIL: env expected 'prod', got '$ENV_VAL'"; FAIL=1; }
              [ "$TIER_VAL" = "mandatory-only" ] || { echo "FAIL: tier expected 'mandatory-only', got '$TIER_VAL'"; FAIL=1; }
              [ "$APP_VAL" = "myapp" ]   || { echo "FAIL: app expected 'myapp', got '$APP_VAL'"; FAIL=1; }
              [ "$REGION_VAL" = "us-east-1" ] || { echo "FAIL: region expected 'us-east-1', got '$REGION_VAL'"; FAIL=1; }
              [ "$FAIL" -eq 0 ] && echo "PASS: tag merge correct (mandatory wins, all sources merged)"
              exit $FAIL

