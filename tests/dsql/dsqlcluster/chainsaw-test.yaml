# aws-dsql-02 (KRO-799) Chainsaw tests — one scenario per acceptance criterion.
# Covers all 22 ACs for the DSQLCluster RGD.
#
# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named DSQLConfig + DSQLCluster and deletes
# nothing between steps. skipDelete: true stops chainsaw's end-of-test cascade delete (the
# test cluster runs kro but no ACK controllers, so ACK finalizers are never removed and any
# delete would hang). The ephemeral kind cluster is discarded after the suite.
#
# Notes on kro v0.9.2 limitations documented in tests:
#   - AC-2/boolean: OR-logic; only the enabling direction (instance true > defaults false) is testable.
#   - AC-13/multiRegionProperties: kro always writes the field; test asserts empty values.
#   - AC-19/20/status: ACK status is simulated via kubectl patch --subresource=status.
#   - creationTime: omitted from DSQLCluster status (kro cannot coerce timestamp to string).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: dsqlcluster
spec:
  skipDelete: true
  namespace: dsqlcluster
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: dsqlcluster

    # AC-1: defaults-apply
    # Given: DSQLConfig/ac1-cfg with defaults.deletionProtectionEnabled: true,
    #        defaults.kmsEncryptionKey: "", instance spec has no overrides
    # When: DSQLCluster applied
    # Then: ACK Cluster spec.deletionProtectionEnabled: true (from defaults)
    - name: ac1-defaults-apply
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac1-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac1-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":true,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac1-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: dsql.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac1-cluster
                namespace: dsqlcluster
              spec:
                deletionProtectionEnabled: true

    # AC-2: instance-override-deletion-protection
    # kro v0.9.2 limitation: zero-value booleans are stripped; OR-logic only reliably tests
    # the enabling direction. This test verifies: instance true overrides defaults false.
    # (The spec's "instance false overrides defaults true" direction is not achievable in v0.9.2.)
    - name: ac2-instance-override-deletion-protection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac2-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac2-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac2-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac2-cfg
                deletionProtectionEnabled: true
        - assert:
            resource:
              apiVersion: dsql.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac2-cluster
                namespace: dsqlcluster
              spec:
                deletionProtectionEnabled: true

    # AC-3: mandatory-override-deletion-protection
    # Given: mandatory.deletionProtectionEnabled: true, instance does not set the field
    # When: DSQLCluster applied
    # Then: ACK Cluster spec.deletionProtectionEnabled: true (mandatory wins via OR-logic)
    - name: ac3-mandatory-override-deletion-protection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac3-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: true
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac3-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":true,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac3-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac3-cfg
        - assert:
            resource:
              apiVersion: dsql.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac3-cluster
                namespace: dsqlcluster
              spec:
                deletionProtectionEnabled: true

    # AC-4: mandatory-override-kms-key
    # Given: mandatory.kmsEncryptionKey set; instance also sets kmsKeyArn
    # When: DSQLCluster applied
    # Then: ACK Cluster uses mandatory.kmsEncryptionKey (governance wins)
    - name: ac4-mandatory-override-kms-key
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac4-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: "arn:aws:kms:us-east-1:111122223333:key/mandatory-key"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac4-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"arn:aws:kms:us-east-1:111122223333:key/mandatory-key","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac4-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac4-cfg
                kmsKeyArn: "arn:aws:kms:us-east-1:111122223333:key/instance-key"
        - assert:
            resource:
              apiVersion: dsql.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac4-cluster
                namespace: dsqlcluster
              spec:
                kmsEncryptionKey: "arn:aws:kms:us-east-1:111122223333:key/mandatory-key"

    # AC-5: kms-key-arn-direct
    # Given: instance spec.kmsKeyArn set; no mandatory/defaults KMS key
    # When: DSQLCluster applied
    # Then: ACK Cluster spec.kmsEncryptionKey equals spec.kmsKeyArn
    - name: ac5-kms-key-arn-direct
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac5-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac5-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac5-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac5-cfg
                kmsKeyArn: "arn:aws:kms:us-east-1:111122223333:key/direct-key"
        - assert:
            resource:
              apiVersion: dsql.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac5-cluster
                namespace: dsqlcluster
              spec:
                kmsEncryptionKey: "arn:aws:kms:us-east-1:111122223333:key/direct-key"

    # AC-6: kms-key-ref-resolved
    # Given: KMSKey CR with status.keyArn set; instance spec.kmsKeyRef = KMSKey CR name
    # When: DSQLCluster applied
    # Then: ACK Cluster spec.kmsEncryptionKey = KMSKey status.keyArn
    - name: ac6-kms-key-ref-resolved
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac6-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac6-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: ac6-key
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac6-key
              spec:
                configRef: general-policy
                createAlias: false
        # Wait for kro to create the child ACK Key before patching its status.
        # kro computes kmsKey.status.keyArn from key.status.ackResourceMetadata.arn;
        # patching the KMSKey status directly is overwritten on every reconcile.
        - assert:
            timeout: 60s
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: ac6-key
                namespace: dsqlcluster
        - script:
            content: |
              kubectl patch key.kms.services.k8s.aws ac6-key -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:kms:us-east-1:111122223333:key/ref-key","ownerAccountID":"111122223333","region":"us-east-1"},"keyID":"ref-key"}}'
        # Wait for kro to reconcile KMSKey and propagate keyArn from the ACK Key status.
        - assert:
            timeout: 60s
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: ac6-key
                namespace: dsqlcluster
              status:
                keyArn: "arn:aws:kms:us-east-1:111122223333:key/ref-key"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac6-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac6-cfg
                kmsKeyRef: ac6-key
        - assert:
            resource:
              apiVersion: dsql.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac6-cluster
                namespace: dsqlcluster
              spec:
                kmsEncryptionKey: "arn:aws:kms:us-east-1:111122223333:key/ref-key"

    # AC-7: kms-key-mutual-exclusion (negative)
    # Given: instance sets both kmsKeyArn AND kmsKeyRef
    # When: DSQLCluster applied
    # Then: status.validationError is non-empty; kmsKeyMutualExclusionError ConfigMap created
    - name: ac7-kms-key-mutual-exclusion
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac7-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac7-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac7-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac7-cfg
                kmsKeyArn: "arn:aws:kms:us-east-1:111122223333:key/some-key"
                kmsKeyRef: "some-kms-key-cr"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac7-cluster
                namespace: dsqlcluster
              status:
                validationError: "spec.kmsKeyArn and spec.kmsKeyRef are mutually exclusive — set exactly one"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac7-cluster-kms-validation-error
                namespace: dsqlcluster

    # AC-8: aws-owned-kms-default
    # Given: no KMS config anywhere (no mandatory.kmsEncryptionKey, no kmsKeyArn, no kmsKeyRef,
    #        no defaults.kmsEncryptionKey)
    # When: DSQLCluster applied
    # Then: ACK Cluster spec.kmsEncryptionKey is empty (AWS uses AWS-owned key)
    - name: ac8-aws-owned-kms-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac8-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac8-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac8-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac8-cfg
        - assert:
            resource:
              apiVersion: dsql.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac8-cluster
                namespace: dsqlcluster
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac8-cluster
        - script:
            content: |
              set -eu
              # kmsEncryptionKey should be empty (kro omits empty-string fields from status,
              # but spec fields with empty values are written; the ACK Cluster spec field is empty)
              VAL=$(kubectl get clusters.dsql.services.k8s.aws ac8-cluster -n dsqlcluster \
                -o jsonpath='{.spec.kmsEncryptionKey}' 2>/dev/null || true)
              if [ -n "$VAL" ]; then
                echo "FAIL: expected kmsEncryptionKey to be empty, got: $VAL"
                exit 1
              fi
              echo "PASS: kmsEncryptionKey is empty (AWS-owned KMS key will be used)"

    # AC-9: policy-raw-json
    # Given: instance spec.policy set to a JSON string
    # When: DSQLCluster applied
    # Then: ACK Cluster spec.policy matches the raw JSON
    - name: ac9-policy-raw-json
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac9-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac9-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac9-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac9-cfg
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"dsql:*","Resource":"*"}]}'
        - assert:
            resource:
              apiVersion: dsql.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac9-cluster
                namespace: dsqlcluster
              spec:
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"dsql:*","Resource":"*"}]}'

    # AC-10: policy-ref-resolved
    # Given: PolicyDocument CR with spec.documentJSON set; instance spec.clusterPolicyRef references it
    # When: DSQLCluster applied
    # Then: ACK Cluster spec.policy = PolicyDocument spec.documentJSON
    - name: ac10-policy-ref-resolved
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac10-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac10-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: ac10-policy
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac10-policy
              spec:
                documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Deny","Principal":"*","Action":"dsql:*","Resource":"*"}]}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac10-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac10-cfg
                clusterPolicyRef: ac10-policy
        - assert:
            resource:
              apiVersion: dsql.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac10-cluster
                namespace: dsqlcluster
              spec:
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Deny","Principal":"*","Action":"dsql:*","Resource":"*"}]}'

    # AC-11: policy-mutual-exclusion (negative)
    # Given: instance sets both spec.policy AND spec.clusterPolicyRef
    # When: DSQLCluster applied
    # Then: status.validationError is non-empty; policyMutualExclusionError ConfigMap created
    - name: ac11-policy-mutual-exclusion
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLConfig
              metadata:
                name: ac11-cfg
                namespace: dsqlcluster
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtectionEnabled: false
                  kmsEncryptionKey: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch dsqlconfig ac11-cfg -n dsqlcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtectionEnabled":false,"kmsEncryptionKey":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DSQLCluster
              metadata:
                name: ac11-cluster
                namespace: dsqlcluster
              spec:
                configRef: ac11-cfg
                policy: '{"Version":"2012-10-17"}'
                clusterPolicyRef: some-policy-cr
        - assert:
