              FAIL=0
              [ "$TEAM_LABEL" = "backend" ] || { echo "FAIL: kropath.run/team label expected 'backend', got '$TEAM_LABEL'"; FAIL=1; }
              [ "$SVC_LABEL" = "dsql" ]    || { echo "FAIL: kropath.run/service label expected 'dsql', got '$SVC_LABEL'"; FAIL=1; }
              [ "$TEAM_TAG" = "backend" ]  || { echo "FAIL: tags.team expected 'backend', got '$TEAM_TAG'"; FAIL=1; }
              [ "$SVC_TAG" = "dsql" ]      || { echo "FAIL: tags.service expected 'dsql', got '$SVC_TAG'"; FAIL=1; }
              [ "$FAIL" -eq 0 ] && echo "PASS: syncedLabels dual-write correct (K8s labels and cloud tags)"
