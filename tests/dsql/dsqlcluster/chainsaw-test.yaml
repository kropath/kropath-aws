              WR=$(kubectl get clusters.dsql.services.k8s.aws ac13-cluster -n dsqlcluster \
                -o jsonpath='{.spec.multiRegionProperties.witnessRegion}' 2>/dev/null || true)
              CL=$(kubectl get clusters.dsql.services.k8s.aws ac13-cluster -n dsqlcluster \
