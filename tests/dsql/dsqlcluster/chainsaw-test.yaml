        - script:
            content: |
              set -eu
              # Check kropath.run/-prefixed labels on the ACK Cluster K8s metadata
              TEAM_LABEL=$(kubectl get clusters.dsql.services.k8s.aws ac15-cluster -n dsqlcluster \
