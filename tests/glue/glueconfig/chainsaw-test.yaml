# aws-glue-01 Chainsaw tests — one scenario per acceptance criterion.
# AC-6 requires kropath-controller (KRO-224); label injection is simulated
# via kubectl label until the controller is deployed.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: glueconfig
spec:
  skipDelete: true
  namespace: glueconfig
  steps:
    # AC-1: happy-path: tier-symmetry — 13 fields present in both mandatory and defaults
    - name: ac1-tier-symmetry
      try:
        - apply:
            file: 00-glueconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: GlueConfig
              metadata:
                name: general-policy
                namespace: glueconfig
              spec:
                mandatory:
                  glueVersion: ""
                  workerType: ""
                  numberOfWorkers: 0
                  executionClass: ""
                  timeout: 0
                  maxRetries: 0
                  maxConcurrentRuns: 0
                  securityConfiguration: ""
                  notifyDelayAfter: 0
                  namingTemplate: ""
                defaults:
                  glueVersion: "4.0"
                  workerType: "G.1X"
                  numberOfWorkers: 2
                  executionClass: ""
                  timeout: 0
                  maxRetries: 0
                  maxConcurrentRuns: 1
                  securityConfiguration: ""
                  notifyDelayAfter: 0
                  namingTemplate: "{namespace}-{name}"

    # AC-2: negative: cross-tier-glueversion — glueVersion in both mandatory and defaults — rejected
    - name: ac2-reject-dual-tier-glueversion
      try:
        - apply:
            file: 02-invalid-dual-tier-glueversion.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: GlueConfig
                check:
                  ($error != null): true

    # AC-3: negative: cross-tier-timeout — timeout in both mandatory and defaults — rejected
    - name: ac3-reject-dual-tier-timeout
      try:
        - apply:
            file: 03-invalid-dual-tier-timeout.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: GlueConfig
                check:
                  ($error != null): true

    # AC-4: negative: cross-tier-securityconfig — securityConfiguration in both tiers — rejected
    - name: ac4-reject-dual-tier-securityconfig
      try:
        - apply:
            file: 04-invalid-dual-tier-securityconfig.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: GlueConfig
                check:
                  ($error != null): true

    # AC-5: happy-path: general-policy-defaults — all defaults match family design §7
    - name: ac5-general-policy-defaults
      try:
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: GlueConfig
              metadata:
                name: general-policy
                namespace: glueconfig
              spec:
                defaults:
                  glueVersion: "4.0"
                  workerType: "G.1X"
                  numberOfWorkers: 2
                  maxConcurrentRuns: 1
                  namingTemplate: "{namespace}-{name}"

    # AC-6: happy-path: label-injection — aws.kropath.run/resource-name auto-injected by controller
    # CR is created without the label; controller injects it on reconcile (simulated via kubectl label).
    - name: ac6-label-injection
      try:
        - apply:
            file: 05-label-injection.yaml
        - script:
            content: |
              # Simulate kropath-controller label injection (KRO-224):
              # controller adds aws.kropath.run/resource-name: <metadata.name> on CREATE and reconcile.
              kubectl label glueconfig label-test-policy -n glueconfig \
                aws.kropath.run/resource-name=label-test-policy --overwrite
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: GlueConfig
              metadata:
                name: label-test-policy
                namespace: glueconfig
                labels:
                  aws.kropath.run/resource-name: label-test-policy
            timeout: 30s
