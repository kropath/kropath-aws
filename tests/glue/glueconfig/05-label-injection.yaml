# AC-6: GlueConfig created without aws.kropath.run/resource-name label;
# kropath-controller injects it on reconcile (simulated via kubectl label).
---
apiVersion: aws.kropath.run/v1alpha1
kind: GlueConfig
metadata:
  name: label-test-policy
  namespace: glueconfig
spec:
  mandatory:
    glueVersion: ""
    workerType: ""
    numberOfWorkers: 0
    executionClass: ""
    timeout: 0
    maxRetries: 0
    maxConcurrentRuns: 0
    securityConfiguration: ""
    notifyDelayAfter: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    glueVersion: "4.0"
    workerType: "G.1X"
    numberOfWorkers: 2
    executionClass: ""
    timeout: 0
    maxRetries: 0
    maxConcurrentRuns: 1
    securityConfiguration: ""
    notifyDelayAfter: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
