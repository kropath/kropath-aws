    # AC-7: maxCapacity 10.0 → maxCapacity mode; workerType/numberOfWorkers suppressed
    - name: ac7-maxcapacity-legacy-dpu
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: GlueConfig
