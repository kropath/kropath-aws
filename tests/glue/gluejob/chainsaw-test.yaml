# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named GlueConfig + GlueJob and deletes
# nothing between steps, so no ACK finalizer ever blocks a delete and kro's per-object
# backoff never compounds. Test-level skipDelete: true stops chainsaw's end-of-test
# cascade delete; the ephemeral kind cluster is discarded after the suite.
#
# Resource naming convention:
#   GlueConfig CR name: gc-NN  (label aws.kropath.run/resource-name: gc-NN)
#   GlueJob CR name:    jb-NN  (spec.configRef: gc-NN)
#   Cloud resource name via {namespace}-{name}: gluejob-jb-NN
#   ACK Job K8s name: jb-NN  (spec.name: gluejob-jb-NN)
#
# effectiveConfig patches always include ALL mandatory and defaults fields so that
# no CEL "no such key" error occurs for missing intermediate keys.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gluejob
spec:
  skipDelete: true
  namespace: gluejob
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: defaults.glueVersion "4.0"; instance empty → ACK glueVersion "4.0"
    - name: ac1-glue-version-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: GlueConfig
              metadata:
                name: gc-01
                namespace: gluejob
                labels:
                  aws.kropath.run/resource-name: gc-01
              spec: {}
        - script:
            content: |
              kubectl patch glueconfigs.aws.kropath.run gc-01 -n gluejob \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","glueVersion":"","workerType":"","numberOfWorkers":0,"executionClass":"","timeout":0,"maxRetries":0,"maxConcurrentRuns":0,"securityConfiguration":"","notifyDelayAfter":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","glueVersion":"4.0","workerType":"","numberOfWorkers":0,"executionClass":"","timeout":0,"maxRetries":0,"maxConcurrentRuns":0,"securityConfiguration":"","notifyDelayAfter":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: GlueJob
              metadata:
                name: jb-01
                namespace: gluejob
              spec:
                configRef: gc-01
                command:
                  name: glueetl
                  scriptLocation: s3://test-bucket/script.py
                role: arn:aws:iam::123456789012:role/GlueRole
        - assert:
            resource:
              apiVersion: glue.services.k8s.aws/v1alpha1
              kind: Job
              metadata:
                name: jb-01
                namespace: gluejob
              spec:
                glueVersion: "4.0"

    # AC-2: mandatory.glueVersion "4.0"; instance "3.0" → mandatory wins
