              spec:
                glueVersion: "4.0"

    # AC-4: defaults workerType "G.1X"/2; instance empty/zero → defaults applied
    - name: ac4-worker-config-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
