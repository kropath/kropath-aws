                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","glueVersion":"","workerType":"","numberOfWorkers":0,"executionClass":"","timeout":0,"maxRetries":0,"maxConcurrentRuns":0,"securityConfiguration":"","notifyDelayAfter":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","glueVersion":"4.0","workerType":"G.1X","numberOfWorkers":2,"executionClass":"","timeout":0,"maxRetries":0,"maxConcurrentRuns":0,"securityConfiguration":"","notifyDelayAfter":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: GlueJob
              metadata:
                name: jb-07
                namespace: gluejob
              spec:
                configRef: gc-07
                maxCapacity: 10.0
                command:
                  name: glueetl
                  scriptLocation: s3://test-bucket/script.py
                role: arn:aws:iam::123456789012:role/GlueRole
        - assert:
            resource:
              apiVersion: glue.services.k8s.aws/v1alpha1
              kind: Job
              metadata:
                name: jb-07
                namespace: gluejob
        - script:
            content: |
              JOB=$(kubectl get jobs.glue.services.k8s.aws jb-07 -n gluejob -o json)
              MAX_CAP=$(echo "$JOB" | jq '.spec.maxCapacity // 0')
              if [ "$(echo "$MAX_CAP == 10" | bc -l)" != "1" ] && [ "$MAX_CAP" != "10" ] && [ "$MAX_CAP" != "10.0" ]; then
                echo "ERROR: expected maxCapacity 10 but got $MAX_CAP"
                exit 1
              fi
              WORKER=$(echo "$JOB" | jq -r '.spec.workerType // ""')
              if [ -n "$WORKER" ]; then
                echo "ERROR: expected workerType absent/empty but got '$WORKER'"
                exit 1
              fi
              echo "PASS: maxCapacity=$MAX_CAP, workerType='$WORKER'"

    # AC-8: workerType "G.2X"/5; maxCapacity 0 → workerType+numberOfWorkers mode
