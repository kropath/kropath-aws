# aws-athena-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: athenaconfig
spec:
  skipDelete: true
  namespace: athenaconfig
  steps:
    - name: ac1-config-create-mandatory
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 01-mandatory-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: mandatory-only
                namespace: athenaconfig
              spec:
                mandatory:
                  enforceWorkGroupConfiguration: true
                defaults:
                  enforceWorkGroupConfiguration: false
                  namingTemplate: "{namespace}-{name}"

    - name: ac2-config-dual-tier-reject
      try:
        - apply:
            file: 02-invalid-dual-bool.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: AthenaConfig
                check:
                  ($error != null): true

    - name: ac3-config-dual-tier-string-reject
      try:
        - apply:
            file: 03-invalid-dual-string.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: AthenaConfig
                check:
                  ($error != null): true

    - name: ac4-config-dual-tier-integer-reject
      try:
        - apply:
            file: 04-invalid-dual-integer.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: AthenaConfig
                check:
                  ($error != null): true

    - name: ac5-config-create-defaults-only
      try:
        - apply:
            file: 05-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: defaults-only
                namespace: athenaconfig
              spec:
                defaults:
                  enforceWorkGroupConfiguration: true
                  publishCloudWatchMetricsEnabled: true
                  bytesScannedCutoffPerQuery: 10737418240
                  resultEncryptionOption: "SSE_S3"
                  resultOutputLocation: "s3://my-results-bucket/"
                  engineVersion: "Athena engine version 3"
                  namingTemplate: "{namespace}-{name}"

    - name: ac6-config-tags-both-tiers
      try:
        - apply:
            file: 06-tags-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: tags-both-tiers
                namespace: athenaconfig
              spec:
                mandatory:
                  tags:
                    env: prod
                defaults:
                  tags:
                    team: analytics

    - name: ac7-controller-merge-kropathconfig
      try:
        - apply:
            file: 07-controller-sim.yaml
        - script:
            content: |
              # Simulate kropath-controller cascade: KropathConfig mandatory.athena.enforceWorkGroupConfiguration=true
              # overrides the AthenaConfig spec and is written to status.effectiveConfig.
              kubectl patch athenaconfig controller-sim -n athenaconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enforceWorkGroupConfiguration":true,"publishCloudWatchMetricsEnabled":false,"bytesScannedCutoffPerQuery":0,"enableMinimumEncryptionConfiguration":false,"requesterPaysEnabled":false,"resultEncryptionOption":"","resultOutputLocation":"","engineVersion":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enforceWorkGroupConfiguration":false,"publishCloudWatchMetricsEnabled":false,"bytesScannedCutoffPerQuery":0,"enableMinimumEncryptionConfiguration":false,"requesterPaysEnabled":false,"resultEncryptionOption":"","resultOutputLocation":"","engineVersion":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: controller-sim
                namespace: athenaconfig
              status:
                effectiveConfig:
                  mandatory:
                    enforceWorkGroupConfiguration: true
                  defaults:
                    enforceWorkGroupConfiguration: false
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    accountId: "123456789012"
                    region: "us-east-1"
            timeout: 60s

    - name: ac8-config-string-field-one-tier
      try:
        - apply:
            file: 08-engine-version.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: engine-version
                namespace: athenaconfig
              spec:
                mandatory:
                  engineVersion: "Athena engine version 3"
                defaults:
                  engineVersion: ""

    - name: ac9-config-label-present
      try:
        - apply:
            file: 09-label-check.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: label-check
                namespace: athenaconfig
                labels:
                  aws.kropath.run/resource-name: label-check
