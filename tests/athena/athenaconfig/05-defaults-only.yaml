---
# AC-5: only spec.defaults populated (all mandatory fields at zero-value) — accepted.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: defaults-only
  namespace: athenaconfig
  labels:
    aws.kropath.run/resource-name: defaults-only
spec:
  mandatory:
    enforceWorkGroupConfiguration: false
    publishCloudWatchMetricsEnabled: false
    bytesScannedCutoffPerQuery: 0
    enableMinimumEncryptionConfiguration: false
    requesterPaysEnabled: false
    resultEncryptionOption: ""
    resultOutputLocation: ""
    engineVersion: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    enforceWorkGroupConfiguration: true
    publishCloudWatchMetricsEnabled: true
    bytesScannedCutoffPerQuery: 10737418240
    enableMinimumEncryptionConfiguration: false
    requesterPaysEnabled: false
    resultEncryptionOption: "SSE_S3"
    resultOutputLocation: "s3://my-results-bucket/"
    engineVersion: "Athena engine version 3"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
