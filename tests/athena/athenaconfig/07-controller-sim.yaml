---
# AC-7: AthenaConfig used to simulate kropath-controller effectiveConfig merge.
# KropathConfig mandatory.athena.enforceWorkGroupConfiguration=true is simulated
# via kubectl patch --subresource=status in the chainsaw test script step.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: controller-sim
  namespace: athenaconfig
  labels:
    aws.kropath.run/resource-name: controller-sim
spec:
  mandatory:
    enforceWorkGroupConfiguration: false
    publishCloudWatchMetricsEnabled: false
    bytesScannedCutoffPerQuery: 0
    enableMinimumEncryptionConfiguration: false
    requesterPaysEnabled: false
    resultEncryptionOption: ""
    resultOutputLocation: ""
    engineVersion: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    enforceWorkGroupConfiguration: false
    publishCloudWatchMetricsEnabled: false
    bytesScannedCutoffPerQuery: 0
    enableMinimumEncryptionConfiguration: false
    requesterPaysEnabled: false
    resultEncryptionOption: ""
    resultOutputLocation: ""
    engineVersion: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
