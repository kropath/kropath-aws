---
# AC-6: tags set in both mandatory and defaults — accepted (different-tier tag maps are allowed).
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: tags-both-tiers
  namespace: athenaconfig
  labels:
    aws.kropath.run/resource-name: tags-both-tiers
spec:
  mandatory:
    enforceWorkGroupConfiguration: false
    tags:
      env: prod
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    enforceWorkGroupConfiguration: false
    tags:
      team: analytics
    syncedLabels: {}
    syncedAnnotations: {}
