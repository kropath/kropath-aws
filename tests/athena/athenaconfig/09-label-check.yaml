---
# AC-9: metadata.labels.aws.kropath.run/resource-name present for Theme 28 labelSelector lookup.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: label-check
  namespace: athenaconfig
  labels:
    aws.kropath.run/resource-name: label-check
spec:
  mandatory:
    enforceWorkGroupConfiguration: false
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    enforceWorkGroupConfiguration: false
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
