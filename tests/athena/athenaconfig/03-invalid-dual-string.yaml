---
# AC-3: resultEncryptionOption set in BOTH tiers — rejected by x-kubernetes-validations.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: invalid-dual-string
  namespace: athenaconfig
spec:
  mandatory:
    resultEncryptionOption: "SSE_KMS"
  defaults:
    resultEncryptionOption: "SSE_S3"
