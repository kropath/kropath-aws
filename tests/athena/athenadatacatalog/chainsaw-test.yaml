apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: athenadatacatalog
spec:
  namespace: athenadatacatalog
  skipDelete: true
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Minimal DataCatalog with LAMBDA type — no namingTemplate in config → default {namespace}-{name}
    - name: ac1-minimal-lambda
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac1-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac1-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac1-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac1-cfg
                type: LAMBDA
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac1-catalog
                namespace: athenadatacatalog
              status:
                resourceName: athenadatacatalog-ac1-catalog
                namingStatus: valid

    # AC-2: nameOverride — use exact name, bypass namingTemplate
    - name: ac2-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac2-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac2-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac2-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac2-cfg
                type: GLUE
                nameOverride: custom-glue-catalog
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac2-catalog
                namespace: athenadatacatalog
              status:
                resourceName: custom-glue-catalog
                namingStatus: valid

    # AC-3: Default namingTemplate {namespace}-{name} applied via defaults tier
    - name: ac3-default-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac3-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac3-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac3-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac3-cfg
                type: LAMBDA
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac3-catalog
                namespace: athenadatacatalog
              status:
                resourceName: athenadatacatalog-ac3-catalog
                namingStatus: valid

    # AC-4: Custom namingTemplate via defaults tier
    - name: ac4-custom-template-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac4-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac4-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"data-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac4-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac4-cfg
                type: GLUE
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac4-catalog
                namespace: athenadatacatalog
              status:
                resourceName: data-ac4-catalog
                namingStatus: valid

    # AC-5: Mandatory namingTemplate overrides defaults namingTemplate
    - name: ac5-mandatory-template-overrides-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac5-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac5-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"prod-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"data-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac5-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac5-cfg
                type: LAMBDA
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac5-catalog
                namespace: athenadatacatalog
              status:
                resourceName: prod-ac5-catalog
                namingStatus: valid

    # AC-6: Tags merged — defaults < instance spec < mandatory (mandatory wins on collision)
    - name: ac6-tag-merge-priority
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac6-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac6-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{"env":"staging","team":"data"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac6-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac6-cfg
                type: GLUE
                tags:
                  app: catalog
        - assert:
            resource:
              apiVersion: athena.services.k8s.aws/v1alpha1
              kind: DataCatalog
              metadata:
                name: ac6-catalog
                namespace: athenadatacatalog
              spec:
                name: athenadatacatalog-ac6-catalog
        - script:
            content: |
              kubectl get datacatalog.athena.services.k8s.aws ac6-catalog -n athenadatacatalog -o json | jq -e '
                .spec.tags |
                (map(select(.key == "env")) | .[0].value == "prod") and
                (map(select(.key == "team")) | .[0].value == "data") and
                (map(select(.key == "app")) | .[0].value == "catalog")
              '

    # AC-7: SyncedLabels dual-write — K8s metadata.labels (prefixed) AND cloud spec.tags (plain)
    - name: ac7-syncedlabels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac7-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac7-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{"team":"analytics"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac7-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac7-cfg
                type: LAMBDA
        - assert:
            resource:
              apiVersion: athena.services.k8s.aws/v1alpha1
              kind: DataCatalog
              metadata:
                name: ac7-catalog
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/team: analytics
        - script:
            content: |
              kubectl get datacatalog.athena.services.k8s.aws ac7-catalog -n athenadatacatalog -o json | jq -e '
                .spec.tags | map(select(.key == "team")) | .[0].value == "analytics"
              '

    # AC-8: SyncedAnnotations dual-write — K8s metadata.annotations (prefixed) AND cloud spec.tags (plain)
    - name: ac8-syncedannotations-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac8-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac8-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"cost-center":"cloud"}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac8-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac8-cfg
                type: GLUE
        - assert:
            resource:
              apiVersion: athena.services.k8s.aws/v1alpha1
              kind: DataCatalog
              metadata:
                name: ac8-catalog
                namespace: athenadatacatalog
                annotations:
                  aws.kropath.run/cost-center: cloud
        - script:
            content: |
              kubectl get datacatalog.athena.services.k8s.aws ac8-catalog -n athenadatacatalog -o json | jq -e '
                .spec.tags | map(select(.key == "cost-center")) | .[0].value == "cloud"
              '

    # AC-9: {tag.env} token in namingTemplate resolved from defaults.tags
    - name: ac9-tag-token-in-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac9-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac9-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{tag.env}-{name}","tags":{"env":"test"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac9-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac9-cfg
                type: LAMBDA
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac9-catalog
                namespace: athenadatacatalog
              status:
                resourceName: athenadatacatalog-test-ac9-catalog
                namingStatus: valid

    # AC-10 (negative): FEDERATED type + nameOverride > 41 chars → advisory ConfigMap created
    - name: ac10-federated-name-too-long
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac10-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac10-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac10-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac10-cfg
                type: FEDERATED
                nameOverride: this-name-is-way-more-than-forty-one-characters-long
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac10-catalog-federated-name-too-long-error
                namespace: athenadatacatalog

    # AC-11: GLUE type with parameters map
    - name: ac11-glue-with-parameters
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac11-cfg
                namespace: athenadatacatalog
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac11-cfg -n athenadatacatalog \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac11-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac11-cfg
                type: GLUE
                description: Glue catalog for analytics
                parameters:
                  catalog-id: my-glue-catalog
        - assert:
            resource:
              apiVersion: athena.services.k8s.aws/v1alpha1
              kind: DataCatalog
              metadata:
                name: ac11-catalog
                namespace: athenadatacatalog
              spec:
                type: GLUE
                description: Glue catalog for analytics
        - script:
            content: |
              kubectl get datacatalog.athena.services.k8s.aws ac11-catalog -n athenadatacatalog -o json | jq -e '
                .spec.parameters["catalog-id"] == "my-glue-catalog"
              '

    # AC-12 (negative): Missing required type field — admission rejected by K8s validation
    - name: ac12-missing-required-type
      try:
        - script:
            content: |
              # Apply without the required `type` field — K8s schema validation must reject it
              if kubectl apply -f - <<'EOF' 2>/dev/null; then
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaDataCatalog
              metadata:
                name: ac12-catalog
                namespace: athenadatacatalog
              spec:
                configRef: ac11-cfg
              EOF
                echo "ERROR: Expected admission rejection but apply succeeded"
                exit 1
              fi
              echo "Correctly rejected by admission — missing required field type"
