# aws-athena-02 Chainsaw tests — one scenario per acceptance criterion.
# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named AthenaConfig + AthenaWorkGroup and
# deletes nothing between steps (no ACK controllers → finalizers never removed → any
# delete hangs). skipDelete: true stops chainsaw end-of-test cascade delete.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: athenaworkgroup
spec:
  skipDelete: true
  namespace: athenaworkgroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ─────────────────────────────────────────────────────────────────────────────
    # AC-1: naming default template → effectiveName = {namespace}-{name}
    # ─────────────────────────────────────────────────────────────────────────────
    - name: ac1-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac1-cfg
                namespace: athenaworkgroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  enforceWorkGroupConfiguration: false
                  publishCloudWatchMetricsEnabled: false
                  enableMinimumEncryptionConfiguration: false
                  requesterPaysEnabled: false
                  bytesScannedCutoffPerQuery: 0
                  resultEncryptionOption: ""
                  resultOutputLocation: ""
                  engineVersion: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enforceWorkGroupConfiguration: false
                  publishCloudWatchMetricsEnabled: false
                  enableMinimumEncryptionConfiguration: false
                  requesterPaysEnabled: false
                  bytesScannedCutoffPerQuery: 0
                  resultEncryptionOption: ""
                  resultOutputLocation: ""
                  engineVersion: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch athenaconfig ac1-cfg -n athenaworkgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enforceWorkGroupConfiguration":false,"publishCloudWatchMetricsEnabled":false,"enableMinimumEncryptionConfiguration":false,"requesterPaysEnabled":false,"bytesScannedCutoffPerQuery":0,"resultEncryptionOption":"","resultOutputLocation":"","engineVersion":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enforceWorkGroupConfiguration":false,"publishCloudWatchMetricsEnabled":false,"enableMinimumEncryptionConfiguration":false,"requesterPaysEnabled":false,"bytesScannedCutoffPerQuery":0,"resultEncryptionOption":"","resultOutputLocation":"","engineVersion":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaWorkGroup
              metadata:
                name: ac1-wg
                namespace: athenaworkgroup
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: athena.services.k8s.aws/v1alpha1
              kind: WorkGroup
              metadata:
                name: ac1-wg
                namespace: athenaworkgroup
              spec:
                name: athenaworkgroup-ac1-wg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaWorkGroup
              metadata:
                name: ac1-wg
                namespace: athenaworkgroup
              status:
                resourceName: athenaworkgroup-ac1-wg
                namingStatus: valid
                predictedArn: "arn:aws:athena:us-east-1:123456789012:workgroup/athenaworkgroup-ac1-wg"

    # ─────────────────────────────────────────────────────────────────────────────
    # AC-2: spec.nameOverride → effectiveName = override value
    # ─────────────────────────────────────────────────────────────────────────────
