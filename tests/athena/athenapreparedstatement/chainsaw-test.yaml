apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: athenapreparedstatement
spec:
  namespace: athenapreparedstatement
  skipDelete: true
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Minimal PreparedStatement with literal workGroup — default naming {namespace}_{name}
    # Namespace is "athenapreparedstatement"; hyphens in resource name converted to underscores.
    - name: ac1-minimal-with-workgroup
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac1-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac1-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac1-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac1-cfg
                queryStatement: SELECT id, name FROM orders WHERE active = true
                workGroup: primary
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac1-stmt
                namespace: athenapreparedstatement
              status:
                resourceName: athenapreparedstatement_ac1_stmt
                namingStatus: valid

    # AC-2: nameOverride — use exact name, bypass namingTemplate
    - name: ac2-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac2-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac2-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac2-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac2-cfg
                nameOverride: custom_stmt
                queryStatement: SELECT 1
                workGroup: primary
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac2-stmt
                namespace: athenapreparedstatement
              status:
                resourceName: custom_stmt
                namingStatus: valid

    # AC-3: Default {namespace}_{name} template — hyphens in namespace and resource name become underscores
    - name: ac3-default-template-hyphen-to-underscore
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac3-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac3-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac3-test-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac3-cfg
                queryStatement: SELECT id FROM events
                workGroup: primary
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac3-test-stmt
                namespace: athenapreparedstatement
              status:
                # athenapreparedstatement_{name_with_hyphen_converted}: ac3-test-stmt → ac3_test_stmt
                resourceName: athenapreparedstatement_ac3_test_stmt
                namingStatus: valid

    # AC-4: Custom namingTemplate via defaults tier
    - name: ac4-custom-template-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac4-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac4-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{configRef}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac4-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac4-cfg
                queryStatement: SELECT * FROM customers
                workGroup: primary
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac4-stmt
                namespace: athenapreparedstatement
              status:
                # configRef=ac4-cfg, name=ac4-stmt; hyphens → underscores: ac4_cfg_ac4_stmt
                resourceName: ac4_cfg_ac4_stmt
                namingStatus: valid

    # AC-5: Mandatory namingTemplate overrides defaults namingTemplate
    - name: ac5-mandatory-template-overrides-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac5-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac5-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"prod_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"dev_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac5-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac5-cfg
                queryStatement: SELECT * FROM prod_table
                workGroup: primary
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac5-stmt
                namespace: athenapreparedstatement
              status:
                # mandatory wins: prod_{name} → prod_ac5_stmt
                resourceName: prod_ac5_stmt
                namingStatus: valid

    # AC-6: workGroupRef cross-RGD lookup — resolves workGroupName from referenced AthenaWorkGroup.status.resourceName
    - name: ac6-workgroupref-cross-rgd
      try:
        # Create AthenaConfig for the referenced WorkGroup
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac6-wg-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac6-wg-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac6-wg-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","enforceWorkGroupConfiguration":null,"publishCloudWatchMetricsEnabled":null,"enableMinimumEncryptionConfiguration":null,"requesterPaysEnabled":null,"bytesScannedCutoffPerQuery":0,"resultEncryptionOption":"","resultOutputLocation":"","engineVersion":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","enforceWorkGroupConfiguration":null,"publishCloudWatchMetricsEnabled":null,"enableMinimumEncryptionConfiguration":null,"requesterPaysEnabled":null,"bytesScannedCutoffPerQuery":0,"resultEncryptionOption":"","resultOutputLocation":"","engineVersion":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        # Create the referenced WorkGroup with required label for selector lookup
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaWorkGroup
              metadata:
                name: ac6-wg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac6-wg
              spec:
                configRef: ac6-wg-cfg
        # Wait for WorkGroup to reconcile and set status.resourceName
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaWorkGroup
              metadata:
                name: ac6-wg
                namespace: athenapreparedstatement
              status:
                resourceName: athenapreparedstatement-ac6-wg
        # AthenaConfig for the PreparedStatement
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac6-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac6-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac6-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac6-cfg
                queryStatement: SELECT * FROM workgroup_table
                workGroupRef: ac6-wg
        - assert:
            resource:
              apiVersion: athena.services.k8s.aws/v1alpha1
              kind: PreparedStatement
              metadata:
                name: ac6-stmt
                namespace: athenapreparedstatement
              spec:
                workGroup: athenapreparedstatement-ac6-wg

    # AC-7: syncedLabels — applied to K8s metadata.labels only (PreparedStatement has no cloud tags)
    - name: ac7-syncedlabels-k8s-only
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac7-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac7-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{"team":"analytics"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac7-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac7-cfg
                queryStatement: SELECT * FROM analytics_table
                workGroup: primary
        - assert:
            resource:
              apiVersion: athena.services.k8s.aws/v1alpha1
              kind: PreparedStatement
              metadata:
                name: ac7-stmt
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/team: analytics

    # AC-8: description field passed through to ACK PreparedStatement spec.description
    - name: ac8-description-field
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac8-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac8-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac8-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac8-cfg
                queryStatement: SELECT * FROM orders
                workGroup: primary
                description: "Selects all rows from the orders table for reporting"
        - assert:
            resource:
              apiVersion: athena.services.k8s.aws/v1alpha1
              kind: PreparedStatement
              metadata:
                name: ac8-stmt
                namespace: athenapreparedstatement
              spec:
                description: Selects all rows from the orders table for reporting

    # AC-9: Mandatory {configRef}_{namespace}_{name} template — hyphens converted to underscores everywhere
    # configRef has hyphen, resource name has hyphens → all become underscores in effectiveName
    - name: ac9-mandatory-template-hyphen-conversion
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac9-analytics-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac9-analytics-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac9-analytics-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{configRef}_{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac9-test-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac9-analytics-cfg
                queryStatement: SELECT * FROM events WHERE type = :event_type
                workGroup: primary
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac9-test-stmt
                namespace: athenapreparedstatement
              status:
                # configRef=ac9-analytics-cfg, ns=athenapreparedstatement, name=ac9-test-stmt
                # After .replace("-","_"): ac9_analytics_cfg_athenapreparedstatement_ac9_test_stmt
                resourceName: ac9_analytics_cfg_athenapreparedstatement_ac9_test_stmt
                namingStatus: valid

    # AC-10 (negative): workGroup and workGroupRef are mutually exclusive → advisory ConfigMap created
    - name: ac10-workgroup-mutual-exclusion
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac10-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac10-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac10-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac10-cfg
                queryStatement: SELECT 1
                workGroup: primary
                workGroupRef: some-wg
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac10-stmt-wg-mutual-exclusion-error
                namespace: athenapreparedstatement

    # AC-11 (negative): nameOverride starts with digit → advisory ConfigMap created
    - name: ac11-name-invalid-start
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaConfig
              metadata:
                name: ac11-cfg
                namespace: athenapreparedstatement
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: |
              kubectl patch athenaconfig ac11-cfg -n athenapreparedstatement \
                --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AthenaPreparedStatement
              metadata:
                name: ac11-stmt
                namespace: athenapreparedstatement
              spec:
                configRef: ac11-cfg
                nameOverride: 9invalid_name
                queryStatement: SELECT 1
                workGroup: primary
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac11-stmt-name-invalid-start-error
                namespace: athenapreparedstatement
