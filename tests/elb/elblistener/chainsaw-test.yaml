# aws-elb-04 ELBListener Chainsaw tests — one scenario per acceptance criterion (19 ACs).
# Namespace: elblistener (fixed; Listener has no cloud resource name — ARN-identified only).
# accountId: 123456789012 | region: us-east-1
# effectiveConfig is injected via kubectl patch --subresource=status to simulate
# kropath-controller (which is not running in the local test cluster).
# Tags are lists ([]Tag{key,value}) — jq script steps used for order-independent assertions.
# spec.nameOverride is a documented no-op: ACK Listener has no name field.
# No status.resourceName or status.namingStatus — naming does not apply to Listener.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elblistener
spec:
  namespace: elblistener
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Purge: delete all resources this test may have created in a prior run.
    # ──────────────────────────────────────────────────────────────────────────
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-elblistener-namespace.yaml
        - script:
            content: |
              set -e
              NS=elblistener
              # Delete ELBListener CRs
              for name in http-fwd https-cert tcp-nlb tls-alpn redir \
                          fixed-resp multi-cert ssl-mand ssl-dflt ssl-spec \
                          tags-mrg slbl-dual sanno std-meta del-del \
                          del-ret cfg-custom name-noop ord-fwd \
                          wt-fwd-act mtls-vrfy mtls-pass; do
                kubectl delete elblistener "${name}" -n "${NS}" --ignore-not-found=true
              done
              # Delete ELBConfig CRs
              for name in general-policy ssl-mandatory ssl-defaults \
                          tags-policy synced-labels-policy synced-anno-policy custom-config; do
                kubectl delete elbconfig "${name}" -n "${NS}" --ignore-not-found=true
              done

    # ──────────────────────────────────────────────────────────────────────────
    # Seed: all governance ELBConfigs with effectiveConfig patched.
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-configs
      try:
        - script:
            content: |
              set -e
              NS=elblistener

              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: general-policy
                namespace: elblistener
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: ssl-mandatory
                namespace: elblistener
                labels:
                  aws.kropath.run/resource-name: ssl-mandatory
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: ssl-defaults
                namespace: elblistener
                labels:
                  aws.kropath.run/resource-name: ssl-defaults
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: "ELBSecurityPolicy-TLS13-1-0-2021-06"
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: tags-policy
                namespace: elblistener
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags:
                    cost-centre: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags:
                    defaults-tag: from-defaults
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: synced-labels-policy
                namespace: elblistener
                labels:
                  aws.kropath.run/resource-name: synced-labels-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels:
                    environment: production
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: synced-anno-policy
                namespace: elblistener
                labels:
                  aws.kropath.run/resource-name: synced-anno-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations:
                    team: infra
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: custom-config
                namespace: elblistener
                labels:
                  aws.kropath.run/resource-name: custom-config
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: "ELBSecurityPolicy-FS-1-2-Res-2020-10"
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF

              # Patch effectiveConfig on all configs (simulate kropath-controller)
              BASE='{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig general-policy -n elblistener --subresource=status --type=merge -p "$BASE"
              kubectl patch elbconfig ssl-mandatory -n elblistener --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"ELBSecurityPolicy-TLS13-1-2-2021-06","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig ssl-defaults -n elblistener --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"ELBSecurityPolicy-TLS13-1-0-2021-06","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig tags-policy -n elblistener --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{"defaults-tag":"from-defaults"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig synced-labels-policy -n elblistener --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig synced-anno-policy -n elblistener --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"team":"infra"}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig custom-config -n elblistener --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"ELBSecurityPolicy-FS-1-2-Res-2020-10","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: HTTP forward listener — protocol=HTTP, port=80, forward action.
    # Verifies: loadBalancerARN passthrough, protocol, port, defaultActions field mapping
    #           (targetGroupArn → targetGroupARN).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-http-forward
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: http-fwd
              spec:
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: http-fwd
              spec:
                loadBalancerRef:

                  from:

                    name: test-lb
                protocol: HTTP
                port: 80
                defaultActions:
                  - type: forward
                    targetGroupRef:

                      from:

                        name: test-tg

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2: HTTPS listener with certificate and spec sslPolicy.
    # Verifies: certificateArn → certificateARN rename, spec.sslPolicy passthrough.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac2-https-certificate-sslpolicy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: https-cert
              spec:
                loadBalancerRef: test-lb
                protocol: HTTPS
                port: 443
                sslPolicy: ELBSecurityPolicy-2016-08
                certificateArn: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: https-cert
              spec:
                protocol: HTTPS
                port: 443
                sslPolicy: ELBSecurityPolicy-2016-08
                certificates:
                  - certificateARN: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012

                    isDefault: false

    # ──────────────────────────────────────────────────────────────────────────
    # AC-3: TCP NLB listener — protocol=TCP, port=9000.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-tcp-nlb
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: tcp-nlb
              spec:
                loadBalancerRef: test-nlb
                protocol: TCP
                port: 9000
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: tcp-nlb
              spec:
                protocol: TCP
                port: 9000

    # ──────────────────────────────────────────────────────────────────────────
    # AC-4: TLS NLB listener with alpnPolicy — protocol=TLS, alpnPolicy passed through.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac4-tls-alpn-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: tls-alpn
              spec:
                loadBalancerRef: test-nlb
                protocol: TLS
                port: 443
                sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
                alpnPolicy: HTTP2Preferred
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: tls-alpn
              spec:
                protocol: TLS
                port: 443
                sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
                alpnPolicy:
                  - HTTP2Preferred

    # ──────────────────────────────────────────────────────────────────────────
    # AC-5: Redirect action — type=redirect with redirectConfig fields.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac5-redirect-action
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: redir
              spec:
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                defaultActions:
                  - type: redirect
                    order: 1
                    redirectConfig:
                      protocol: HTTPS
                      statusCode: HTTP_301
                      port: "443"
                      host: "#{host}"
                      path: "/#{path}"
                      query: "#{query}"
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: redir
              spec:
                defaultActions:
                  - type: redirect
                    order: 1
                    redirectConfig:
                      protocol: HTTPS
                      statusCode: HTTP_301
                      port: "443"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-6: Fixed-response action — type=fixed-response with fixedResponseConfig fields.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac6-fixed-response-action
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: fixed-resp
              spec:
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                defaultActions:
                  - type: fixed-response
                    fixedResponseConfig:
                      statusCode: "200"
                      contentType: text/plain
                      messageBody: OK
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: fixed-resp
              spec:
                defaultActions:
                  - type: fixed-response
                    fixedResponseConfig:
                      statusCode: "200"
                      contentType: text/plain
                      messageBody: OK

    # ──────────────────────────────────────────────────────────────────────────
    # AC-7: Certificate passthrough — certificateArn wrapped to ACK certificates list.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac7-single-cert
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: single-cert
              spec:
                loadBalancerRef: test-lb
                protocol: HTTPS
                port: 443
                sslPolicy: ELBSecurityPolicy-2016-08
                certificateArn: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: single-cert
              spec:
                certificates:
                  - certificateARN: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012

                    isDefault: false

    # ──────────────────────────────────────────────────────────────────────────
    # AC-8: mandatory.sslPolicy overrides spec.sslPolicy.
    # Config ssl-mandatory: mandatory.sslPolicy=ELBSecurityPolicy-TLS13-1-2-2021-06
    # Instance: spec.sslPolicy=ELBSecurityPolicy-2016-08 (should be overridden)
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac8-ssl-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: ssl-mand
              spec:
                configRef: ssl-mandatory
                loadBalancerRef: test-lb
                protocol: HTTPS
                port: 443
                sslPolicy: ELBSecurityPolicy-2016-08
                certificateArn: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: ssl-mand
              spec:
                sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

    # ──────────────────────────────────────────────────────────────────────────
    # AC-9: defaults.sslPolicy applies when spec.sslPolicy is unset.
    # Config ssl-defaults: defaults.sslPolicy=ELBSecurityPolicy-TLS13-1-0-2021-06
    # Instance: no spec.sslPolicy
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac9-ssl-defaults-applies
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: ssl-dflt
              spec:
                configRef: ssl-defaults
                loadBalancerRef: test-lb
                protocol: HTTPS
                port: 443
                certificateArn: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: ssl-dflt
              spec:
                sslPolicy: ELBSecurityPolicy-TLS13-1-0-2021-06

    # ──────────────────────────────────────────────────────────────────────────
    # AC-10: spec.sslPolicy overrides defaults.sslPolicy.
    # Config ssl-defaults: defaults.sslPolicy=ELBSecurityPolicy-TLS13-1-0-2021-06
    # Instance: spec.sslPolicy=ELBSecurityPolicy-2016-08 (should win over defaults)
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac10-ssl-spec-overrides-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: ssl-spec
              spec:
                configRef: ssl-defaults
                loadBalancerRef: test-lb
                protocol: HTTPS
                port: 443
                sslPolicy: ELBSecurityPolicy-2016-08
                certificateArn: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: ssl-spec
              spec:
                sslPolicy: ELBSecurityPolicy-2016-08

    # ──────────────────────────────────────────────────────────────────────────
    # AC-11: mandatory + defaults + spec tags all merge; mandatory wins on conflicts.
    # Config tags-policy: mandatory.tags={cost-centre:platform}, defaults.tags={defaults-tag:from-defaults}
    # Instance: spec.tags={env:prod, cost-centre:instance-value}
    # Expected: cost-centre=platform (mandatory wins), env=prod (spec), defaults-tag=from-defaults
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac11-tags-three-tier-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: tags-mrg
              spec:
                configRef: tags-policy
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                tags:
                  env: prod
                  cost-centre: instance-value
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - script:
            content: |
              # Poll until kro has reconciled the child listeners — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get listeners.elbv2.services.k8s.aws tags-mrg -n elblistener >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get listeners.elbv2.services.k8s.aws tags-mrg -n elblistener \
                -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e 'any(.key == "env" and .value == "prod")' \
                >/dev/null || { echo "FAIL: missing tag env=prod; tags=$TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "defaults-tag" and .value == "from-defaults")' \
                >/dev/null || { echo "FAIL: missing tag defaults-tag=from-defaults; tags=$TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "cost-centre" and .value == "platform")' \
                >/dev/null || { echo "FAIL: mandatory cost-centre=platform did not win; tags=$TAGS"; exit 1; }
              echo "PASS: all three tag tiers merged; mandatory wins on conflict"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-12: syncedLabels dual-write — K8s metadata.labels with aws.kropath.run/ prefix
    #         AND cloud tags (plain key, no prefix).
    # Config synced-labels-policy: mandatory.syncedLabels={environment:production}
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac12-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: slbl-dual
              spec:
                configRef: synced-labels-policy
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: slbl-dual
                labels:
                  aws.kropath.run/environment: production
              spec: {}
        - script:
            content: |
              # Poll until kro has reconciled the child listeners — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get listeners.elbv2.services.k8s.aws slbl-dual -n elblistener >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get listeners.elbv2.services.k8s.aws slbl-dual -n elblistener \
                -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e 'any(.key == "environment" and .value == "production")' \
                >/dev/null || { echo "FAIL: syncedLabel environment=production not in cloud tags; tags=$TAGS"; exit 1; }
              echo "PASS: syncedLabel in both K8s metadata.labels (prefixed) and cloud tags (plain)"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-13: syncedAnnotations written to ACK Listener metadata.annotations
    #         with aws.kropath.run/ prefix.
    # Config synced-anno-policy: mandatory.syncedAnnotations={team:infra}
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac13-synced-annotations-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: sanno
              spec:
                configRef: synced-anno-policy
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: sanno
                annotations:
                  aws.kropath.run/team: infra
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-14: Standard kropath metadata present on ACK Listener CR.
    # Verifies: managed-by, instance labels; deletion-policy annotation; ownerReference.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac14-standard-kropath-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: std-meta
              spec:
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: std-meta
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-meta
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}
        - script:
            content: |
              # Poll until kro has reconciled the child listeners — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get listeners.elbv2.services.k8s.aws std-meta -n elblistener >/dev/null 2>&1 && break
                sleep 1
              done
              OWNER=$(kubectl get listeners.elbv2.services.k8s.aws std-meta -n elblistener \
                -o json | jq -r '.metadata.ownerReferences[0].kind')
              [ "$OWNER" = "ELBListener" ] \
                || { echo "FAIL: ownerReference.kind should be ELBListener; got=$OWNER"; exit 1; }
              CTRL=$(kubectl get listeners.elbv2.services.k8s.aws std-meta -n elblistener \
                -o json | jq -r '.metadata.ownerReferences[0].controller')
              [ "$CTRL" = "true" ] \
                || { echo "FAIL: ownerReference.controller should be true; got=$CTRL"; exit 1; }
              echo "PASS: ownerReference points to ELBListener with controller=true"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-15: spec.deletionPolicy=delete → annotation services.k8s.aws/deletion-policy: delete.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac15-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: del-del
              spec:
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                deletionPolicy: delete
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: del-del
                annotations:
                  services.k8s.aws/deletion-policy: delete
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-16: spec.deletionPolicy=retain (explicit) → annotation retain.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac16-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: del-ret
              spec:
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                deletionPolicy: retain
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: del-ret
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-17: configRef selects non-default ELBConfig.
    # Config custom-config: defaults.sslPolicy=ELBSecurityPolicy-FS-1-2-Res-2020-10
    # Verifies that the custom ELBConfig is picked up via matchLabels selector.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac17-configref-custom
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: cfg-custom
              spec:
                configRef: custom-config
                loadBalancerRef: test-lb
                protocol: HTTPS
                port: 443
                certificateArn: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: cfg-custom
              spec:
                sslPolicy: ELBSecurityPolicy-FS-1-2-Res-2020-10

    # ──────────────────────────────────────────────────────────────────────────
    # AC-18: spec.nameOverride is a no-op for ELBListener.
    # ACK Listener has no name field — it is identified by its ARN.
    # metadata.name of the child Listener must equal the CR name, not nameOverride.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac18-name-override-noop
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: name-noop
              spec:
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                nameOverride: my-custom-listener
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: name-noop
              spec: {}
        - script:
            content: |
              # Poll until kro has reconciled the child listeners — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get listeners.elbv2.services.k8s.aws name-noop -n elblistener >/dev/null 2>&1 && break
                sleep 1
              done
              NAME=$(kubectl get listeners.elbv2.services.k8s.aws name-noop -n elblistener \
                -o json | jq -r '.metadata.name')
              [ "$NAME" = "name-noop" ] \
                || { echo "FAIL: Listener metadata.name should be 'name-noop'; got=$NAME"; exit 1; }
              HAS_SPEC_NAME=$(kubectl get listeners.elbv2.services.k8s.aws name-noop -n elblistener \
                -o json | jq '.spec | has("name")')
              [ "$HAS_SPEC_NAME" = "false" ] \
                || { echo "FAIL: ACK Listener spec should not have a name field; got has(.spec.name)=$HAS_SPEC_NAME"; exit 1; }
              echo "PASS: nameOverride is a no-op; ACK Listener has no spec.name field"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-19: forward action with explicit order field — verifies order passthrough.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac19-action-with-order
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: ord-fwd
              spec:
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                defaultActions:
                  - type: forward
                    order: 5
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: ord-fwd
              spec:
                defaultActions:
                  - type: forward
                    order: 5
                    targetGroupRef:

                      from:

                        name: test-tg

    # ──────────────────────────────────────────────────────────────────────────
    # AC-20: weighted-forward default action — forwardConfig with multiple
    #         target groups and weights; verifies CEL maps to ACK forwardConfig.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac20-weighted-forward-action
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: wt-fwd-act
              spec:
                loadBalancerRef: test-lb
                protocol: HTTP
                port: 80
                defaultActions:
                  - type: forward
                    weightedTargetGroups:
                      - targetGroupRef: tg-blue
                        weight: 80
                      - targetGroupRef: tg-green
                        weight: 20
                    forwardConfig:
                      targetGroupStickinessConfig:
                        enabled: false
                        durationSeconds: 0
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: wt-fwd-act
              spec:
                defaultActions:
                  - type: forward
                    forwardConfig:
                      targetGroups:
                        - targetGroupRef:
   from:
     name: tg-blue
                          weight: 80
                        - targetGroupRef:
   from:
     name: tg-green
                          weight: 20

    # ──────────────────────────────────────────────────────────────────────────
    # AC-21: mTLS verify — spec.mutualAuthentication.mode=verify with trustStoreArn
    #         flows to ACK Listener mutualAuthentication.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac21-mtls-verify
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: mtls-vrfy
              spec:
                loadBalancerRef: test-lb
                protocol: HTTPS
                port: 443
                mutualAuthentication:
                  mode: verify
                  trustStoreArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:truststore/my-trust-store/abcdef1234567890
                  ignoreClientCertificateExpiry: false
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: mtls-vrfy
              spec:
                mutualAuthentication:
                  mode: verify
                  trustStoreARN: arn:aws:elasticloadbalancing:us-east-1:123456789012:truststore/my-trust-store/abcdef1234567890
                  ignoreClientCertificateExpiry: false

    # ──────────────────────────────────────────────────────────────────────────
    # AC-22: mTLS passthrough — spec.mutualAuthentication.mode=passthrough
    #         (no trustStoreArn required) flows to ACK Listener.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac22-mtls-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBListener
              metadata:
                name: mtls-pass
              spec:
                loadBalancerRef: test-lb
                protocol: HTTPS
                port: 443
                mutualAuthentication:
                  mode: passthrough
                defaultActions:
                  - type: forward
                    targetGroupRef: test-tg
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Listener
              metadata:
                name: mtls-pass
              spec:
                mutualAuthentication:
                  mode: passthrough
