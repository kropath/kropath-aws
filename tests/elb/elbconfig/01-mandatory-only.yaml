# AC-0: Valid ELBConfig with fields set only in spec.mandatory
---
apiVersion: aws.kropath.run/v1alpha1
kind: ELBConfig
metadata:
  name: mandatory-only
  namespace: elbconfig
  labels:
    aws.kropath.run/resource-name: mandatory-only
spec:
  mandatory:
    deletionProtection: true
    accessLogsEnabled: true
    accessLogsS3Bucket: "company-elb-access-logs"
    crossZoneEnabled: false
    internalOnly: false
    idleTimeoutSeconds: 300
    sslPolicy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
    namingTemplate: "{namespace}-{name}"
    tags:
      env: production
    syncedLabels:
      team: platform
    syncedAnnotations: {}
  defaults:
    deletionProtection: false
    accessLogsEnabled: false
    accessLogsS3Bucket: ""
    crossZoneEnabled: false
    internalOnly: false
    idleTimeoutSeconds: 0
    sslPolicy: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
