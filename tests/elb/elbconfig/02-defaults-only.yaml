# AC-2: Valid AWSELBConfig with fields set only in spec.defaults
---
apiVersion: aws.kropath.run/v1alpha1
kind: AWSELBConfig
metadata:
  name: defaults-only
  namespace: awselbconfig
  labels:
    aws.kropath.run/resource-name: defaults-only
spec:
  mandatory:
    deletionProtection: false
    accessLogsEnabled: false
    accessLogsS3Bucket: ""
    crossZoneEnabled: false
    internalOnly: false
    idleTimeoutSeconds: 0
    sslPolicy: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    deletionProtection: true
    accessLogsEnabled: true
    accessLogsS3Bucket: "default-elb-logs"
    crossZoneEnabled: true
    internalOnly: false
    idleTimeoutSeconds: 60
    sslPolicy: "ELBSecurityPolicy-2016-08"
    namingTemplate: "{namespace}-{name}"
    tags:
      env: staging
    syncedLabels:
      team: app
    syncedAnnotations: {}
