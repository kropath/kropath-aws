# aws-elb-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elbconfig
spec:
  namespace: elbconfig
  steps:
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-elbconfig-namespace.yaml
        - script:
            content: |
              set -e
              for name in mandatory-only defaults-only general-policy test-no-label; do
                kubectl delete elbconfig "${name}" -n elbconfig --ignore-not-found=true
              done

    - name: ac1-config-create-mandatory-only
      try:
        - apply:
            file: 01-mandatory-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: mandatory-only
                namespace: elbconfig
              spec:
                mandatory:
                  deletionProtection: true
                  accessLogsEnabled: true
                  accessLogsS3Bucket: "company-elb-access-logs"
                  idleTimeoutSeconds: 300
                  sslPolicy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
                  namingTemplate: "{namespace}-{name}"
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
      cleanup:
        - delete:
            file: 01-mandatory-only.yaml

    - name: ac2-config-create-defaults-only
      try:
        - apply:
            file: 02-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: defaults-only
                namespace: elbconfig
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                defaults:
                  deletionProtection: true
                  accessLogsEnabled: true
                  accessLogsS3Bucket: "default-elb-logs"
                  crossZoneEnabled: true
                  idleTimeoutSeconds: 60
                  sslPolicy: "ELBSecurityPolicy-2016-08"
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 02-defaults-only.yaml

    - name: ac3-config-mutual-exclusion-deletionprotection
      try:
        - apply:
            file: 03-invalid-deletionprotection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ELBConfig
                check:
                  ($error != null): true

    - name: ac4-config-mutual-exclusion-accesslogs
      try:
        - apply:
            file: 04-invalid-accesslogs.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ELBConfig
                check:
                  ($error != null): true

    - name: ac5-config-mutual-exclusion-accesslogsbucket
      try:
        - apply:
            file: 05-invalid-accesslogsbucket.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ELBConfig
                check:
                  ($error != null): true

    - name: ac6-config-mutual-exclusion-crosszone
      try:
        - apply:
            file: 06-invalid-crosszone.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ELBConfig
                check:
                  ($error != null): true

    - name: ac7-config-mutual-exclusion-internalonly
      try:
        - apply:
            file: 07-invalid-internalonly.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ELBConfig
                check:
                  ($error != null): true

    - name: ac8-config-mutual-exclusion-idletimeout
      try:
        - apply:
            file: 08-invalid-idletimeout.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ELBConfig
                check:
                  ($error != null): true

    - name: ac9-config-mutual-exclusion-sslpolicy
      try:
        - apply:
            file: 09-invalid-sslpolicy.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ELBConfig
                check:
                  ($error != null): true

    - name: ac10-config-mutual-exclusion-namingtemplate
      try:
        - apply:
            file: 10-invalid-namingtemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ELBConfig
                check:
                  ($error != null): true

    - name: ac11-general-policy-baseline
      try:
        - apply:
            file: 11-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: general-policy
                namespace: elbconfig
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  crossZoneEnabled: true
                  internalOnly: false
                  idleTimeoutSeconds: 60
                  sslPolicy: ""
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 11-general-policy.yaml

    - name: ac12-config-label-injection
      try:
        - apply:
            file: 12-no-label.yaml
        - script:
            content: |
              # Simulate controller label operator injecting aws.kropath.run/resource-name on CREATE
              kubectl label elbconfig test-no-label -n elbconfig \
                aws.kropath.run/resource-name=test-no-label --overwrite
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: test-no-label
                namespace: elbconfig
                labels:
                  aws.kropath.run/resource-name: test-no-label
            timeout: 30s
      cleanup:
        - delete:
            file: 12-no-label.yaml
