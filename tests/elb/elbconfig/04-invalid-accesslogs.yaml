# AC-4: Invalid — accessLogsEnabled set to true in both mandatory and defaults
---
apiVersion: aws.kropath.run/v1alpha1
kind: ELBConfig
metadata:
  name: invalid-accesslogs
  namespace: elbconfig
spec:
  mandatory:
    deletionProtection: false
    accessLogsEnabled: true
    accessLogsS3Bucket: ""
    crossZoneEnabled: false
    internalOnly: false
    idleTimeoutSeconds: 0
    sslPolicy: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    deletionProtection: false
    accessLogsEnabled: true
    accessLogsS3Bucket: ""
    crossZoneEnabled: false
    internalOnly: false
    idleTimeoutSeconds: 0
    sslPolicy: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
