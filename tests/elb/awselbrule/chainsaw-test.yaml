# aws-elb-05 AWSELBRule Chainsaw tests — one scenario per acceptance criterion (15 ACs).
# Namespace: awselbrule (fixed; Rule has no cloud resource name — ARN-identified only).
# accountId: 123456789012 | region: us-east-1
# effectiveConfig is injected via kubectl patch --subresource=status to simulate
# kropath-controller (which is not running in the local test cluster).
# Tags are lists ([]Tag{key,value}) — jq script steps used for order-independent assertions.
# spec.nameOverride is a documented no-op: ACK Rule has no name field.
# No status.resourceName or status.namingStatus — naming does not apply to Rule.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awselbrule
spec:
  namespace: awselbrule
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Purge: delete all resources this test may have created in a prior run.
    # ──────────────────────────────────────────────────────────────────────────
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-awselbrule-namespace.yaml
        - script:
            content: |
              set -e
              NS=awselbrule
              # Delete AWSELBRule CRs
              for name in path-fwd redir fixed host-hdr multi-cond ord-fwd \
                          tags-mrg slbl-dual sanno std-meta del-del \
                          del-ret cfg-custom name-noop prio-100; do
                kubectl delete awselbrule "${name}" -n "${NS}" --ignore-not-found=true
              done
              # Delete ELBConfig CRs
              for name in general-policy tags-policy synced-labels-policy \
                          synced-anno-policy custom-config; do
                kubectl delete elbconfig "${name}" -n "${NS}" --ignore-not-found=true
              done

    # ──────────────────────────────────────────────────────────────────────────
    # Seed: all governance ELBConfigs with effectiveConfig patched.
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-configs
      try:
        - script:
            content: |
              set -e
              NS=awselbrule

              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: general-policy
                namespace: awselbrule
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: tags-policy
                namespace: awselbrule
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags:
                    cost-centre: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags:
                    defaults-tag: from-defaults
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: synced-labels-policy
                namespace: awselbrule
                labels:
                  aws.kropath.run/resource-name: synced-labels-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels:
                    environment: production
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: synced-anno-policy
                namespace: awselbrule
                labels:
                  aws.kropath.run/resource-name: synced-anno-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations:
                    team: infra
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: custom-config
                namespace: awselbrule
                labels:
                  aws.kropath.run/resource-name: custom-config
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags:
                    custom-env: staging
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF

              # Patch effectiveConfig on all configs (simulate kropath-controller)
              BASE='{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig general-policy -n awselbrule --subresource=status --type=merge -p "$BASE"
              kubectl patch elbconfig tags-policy -n awselbrule --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{"defaults-tag":"from-defaults"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig synced-labels-policy -n awselbrule --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig synced-anno-policy -n awselbrule --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"team":"infra"}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig custom-config -n awselbrule --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{"custom-env":"staging"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: path-pattern condition + forward action.
    # Verifies: listenerARN passthrough (uppercase), priority, conditions field/values,
    #           actions targetGroupARN (uppercase).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-forward-action
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: path-fwd
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 10
                conditions:
                  - field: path-pattern
                    values:
                      - /api/*
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: path-fwd
              spec:
                listenerARN: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 10
                conditions:
                  - field: path-pattern
                    values:
                      - /api/*
                actions:
                  - type: forward
                    targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2: redirect action — type=redirect with redirectConfig fields.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac2-redirect-action
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: redir
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 20
                conditions:
                  - field: host-header
                    values:
                      - old.example.com
                actions:
                  - type: redirect
                    order: 1
                    redirectConfig:
                      protocol: HTTPS
                      statusCode: HTTP_301
                      port: "443"
                      host: new.example.com
                      path: "/#{path}"
                      query: "#{query}"
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: redir
              spec:
                actions:
                  - type: redirect
                    order: 1
                    redirectConfig:
                      protocol: HTTPS
                      statusCode: HTTP_301
                      port: "443"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-3: fixed-response action — type=fixed-response with fixedResponseConfig.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-fixed-response-action
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: fixed
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 30
                conditions:
                  - field: path-pattern
                    values:
                      - /health
                actions:
                  - type: fixed-response
                    fixedResponseConfig:
                      statusCode: "200"
                      contentType: text/plain
                      messageBody: OK
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: fixed
              spec:
                actions:
                  - type: fixed-response
                    fixedResponseConfig:
                      statusCode: "200"
                      contentType: text/plain
                      messageBody: OK

    # ──────────────────────────────────────────────────────────────────────────
    # AC-4: host-header condition type — field=host-header, values passthrough.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac4-host-header-condition
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: host-hdr
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 40
                conditions:
                  - field: host-header
                    values:
                      - api.example.com
                      - www.example.com
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: host-hdr
              spec:
                conditions:
                  - field: host-header
                    values:
                      - api.example.com
                      - www.example.com

    # ──────────────────────────────────────────────────────────────────────────
    # AC-5: multiple conditions — path-pattern AND host-header in one rule.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac5-multiple-conditions
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: multi-cond
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 50
                conditions:
                  - field: path-pattern
                    values:
                      - /admin/*
                  - field: host-header
                    values:
                      - admin.example.com
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: multi-cond
              spec:
                conditions:
                  - field: path-pattern
                    values:
                      - /admin/*
                  - field: host-header
                    values:
                      - admin.example.com

    # ──────────────────────────────────────────────────────────────────────────
    # AC-6: forward action with explicit order field — verifies order passthrough.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac6-action-with-order
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: ord-fwd
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 60
                conditions:
                  - field: path-pattern
                    values:
                      - /weighted/*
                actions:
                  - type: forward
                    order: 5
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ord-fwd
              spec:
                actions:
                  - type: forward
                    order: 5
                    targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890

    # ──────────────────────────────────────────────────────────────────────────
    # AC-7: mandatory + defaults + spec tags all merge; mandatory wins on conflicts.
    # Config tags-policy: mandatory.tags={cost-centre:platform}, defaults.tags={defaults-tag:from-defaults}
    # Instance: spec.tags={env:prod, cost-centre:instance-value}
    # Expected: cost-centre=platform (mandatory wins), env=prod (spec), defaults-tag=from-defaults (defaults)
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac7-tags-three-tier-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: tags-mrg
              spec:
                configRef: tags-policy
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 70
                conditions:
                  - field: path-pattern
                    values:
                      - /tags/*
                tags:
                  env: prod
                  cost-centre: instance-value
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - script:
            content: |
              TAGS=$(kubectl get rules.elbv2.services.k8s.aws tags-mrg -n awselbrule \
                -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e 'any(.key == "env" and .value == "prod")' \
                >/dev/null || { echo "FAIL: missing tag env=prod; tags=$TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "defaults-tag" and .value == "from-defaults")' \
                >/dev/null || { echo "FAIL: missing tag defaults-tag=from-defaults; tags=$TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "cost-centre" and .value == "platform")' \
                >/dev/null || { echo "FAIL: mandatory cost-centre=platform did not win; tags=$TAGS"; exit 1; }
              echo "PASS: all three tag tiers merged; mandatory wins on conflict"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-8: syncedLabels dual-write — K8s metadata.labels with aws.kropath.run/ prefix
    #         AND cloud tags (plain key, no prefix).
    # Config synced-labels-policy: mandatory.syncedLabels={environment:production}
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac8-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: slbl-dual
              spec:
                configRef: synced-labels-policy
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 80
                conditions:
                  - field: path-pattern
                    values:
                      - /sync-labels/*
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: slbl-dual
                labels:
                  aws.kropath.run/environment: production
              spec: {}
        - script:
            content: |
              TAGS=$(kubectl get rules.elbv2.services.k8s.aws slbl-dual -n awselbrule \
                -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e 'any(.key == "environment" and .value == "production")' \
                >/dev/null || { echo "FAIL: syncedLabel environment=production not in cloud tags; tags=$TAGS"; exit 1; }
              echo "PASS: syncedLabel in both K8s metadata.labels (prefixed) and cloud tags (plain)"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-9: syncedAnnotations written to ACK Rule metadata.annotations
    #         with aws.kropath.run/ prefix.
    # Config synced-anno-policy: mandatory.syncedAnnotations={team:infra}
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac9-synced-annotations-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: sanno
              spec:
                configRef: synced-anno-policy
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 90
                conditions:
                  - field: path-pattern
                    values:
                      - /anno/*
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: sanno
                annotations:
                  aws.kropath.run/team: infra
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-10: Standard kropath metadata present on ACK Rule CR.
    # Verifies: managed-by and instance labels; deletion-policy annotation; ownerReference.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac10-standard-kropath-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: std-meta
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 100
                conditions:
                  - field: path-pattern
                    values:
                      - /meta/*
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: std-meta
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-meta
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}
        - script:
            content: |
              OWNER=$(kubectl get rules.elbv2.services.k8s.aws std-meta -n awselbrule \
                -o json | jq -r '.metadata.ownerReferences[0].kind')
              [ "$OWNER" = "AWSELBRule" ] \
                || { echo "FAIL: ownerReference.kind should be AWSELBRule; got=$OWNER"; exit 1; }
              CTRL=$(kubectl get rules.elbv2.services.k8s.aws std-meta -n awselbrule \
                -o json | jq -r '.metadata.ownerReferences[0].controller')
              [ "$CTRL" = "true" ] \
                || { echo "FAIL: ownerReference.controller should be true; got=$CTRL"; exit 1; }
              echo "PASS: ownerReference points to AWSELBRule with controller=true"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-11: spec.deletionPolicy=delete → annotation services.k8s.aws/deletion-policy: delete.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac11-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: del-del
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 110
                deletionPolicy: delete
                conditions:
                  - field: path-pattern
                    values:
                      - /del/*
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: del-del
                annotations:
                  services.k8s.aws/deletion-policy: delete
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-12: spec.deletionPolicy=retain (explicit) → annotation retain.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac12-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: del-ret
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 120
                deletionPolicy: retain
                conditions:
                  - field: path-pattern
                    values:
                      - /ret/*
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: del-ret
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-13: configRef selects non-default ELBConfig.
    # Config custom-config: mandatory.tags={custom-env:staging}
    # Verifies the custom ELBConfig is picked up via matchLabels selector.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac13-configref-custom
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: cfg-custom
              spec:
                configRef: custom-config
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 130
                conditions:
                  - field: path-pattern
                    values:
                      - /custom/*
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - script:
            content: |
              TAGS=$(kubectl get rules.elbv2.services.k8s.aws cfg-custom -n awselbrule \
                -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e 'any(.key == "custom-env" and .value == "staging")' \
                >/dev/null || { echo "FAIL: mandatory custom-env=staging not in tags; tags=$TAGS"; exit 1; }
              echo "PASS: custom-config mandatory tag picked up via configRef"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-14: spec.nameOverride is a no-op for AWSELBRule.
    # ACK Rule has no name field — it is identified by its ARN.
    # metadata.name of the child Rule must equal the CR name, not nameOverride.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac14-name-override-noop
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: name-noop
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 140
                nameOverride: my-custom-rule
                conditions:
                  - field: path-pattern
                    values:
                      - /noop/*
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: name-noop
              spec: {}
        - script:
            content: |
              NAME=$(kubectl get rules.elbv2.services.k8s.aws name-noop -n awselbrule \
                -o json | jq -r '.metadata.name')
              [ "$NAME" = "name-noop" ] \
                || { echo "FAIL: Rule metadata.name should be 'name-noop'; got=$NAME"; exit 1; }
              HAS_SPEC_NAME=$(kubectl get rules.elbv2.services.k8s.aws name-noop -n awselbrule \
                -o json | jq 'has(.spec.name)')
              [ "$HAS_SPEC_NAME" = "false" ] \
                || { echo "FAIL: ACK Rule spec should not have a name field; got has(.spec.name)=$HAS_SPEC_NAME"; exit 1; }
              echo "PASS: nameOverride is a no-op; ACK Rule has no spec.name field"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-15: priority integer passthrough — different priority value (100).
    # Verifies the priority field round-trips correctly as an integer.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac15-priority-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBRule
              metadata:
                name: prio-100
              spec:
                listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/test-lb/abcdef1234567890/1234567890abcdef
                priority: 999
                conditions:
                  - field: path-pattern
                    values:
                      - /catch-all/*
                actions:
                  - type: forward
                    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/test-tg/abcdef1234567890
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: prio-100
              spec:
                priority: 999
