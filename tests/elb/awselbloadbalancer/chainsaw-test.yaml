              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: alb-internet
              spec:
                type: application
                scheme: internet-facing
                subnets:
                  - subnet-0001
                  - subnet-0002
