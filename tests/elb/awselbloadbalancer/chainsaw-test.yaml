# aws-elb-02 AWSELBLoadBalancer Chainsaw tests — one scenario per acceptance criterion (29 ACs).
# Namespace: awselbloadbalancer (fixed; {namespace}-{name} template expands predictably).
# accountId: 123456789012 | region: us-east-1
# effectiveConfig is injected via kubectl patch --subresource=status to simulate
# kropath-controller (which is not running in the local test cluster).
# Tags/attributes are lists — jq script steps used for order-independent assertions.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awselbloadbalancer
spec:
  namespace: awselbloadbalancer
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Purge: delete all resources this test may have created in a prior run.
    # ──────────────────────────────────────────────────────────────────────────
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-awselbloadbalancer-namespace.yaml
        - script:
            content: |
              set -e
              NS=awselbloadbalancer
              # Delete AWSELBLoadBalancer CRs
              for name in alb-internet nlb-internal gwlb-subnet \
                          del-prot-m del-prot-i del-prot-d \
                          alog-mand alog-inst alog-pfx \
                          czone-mand czone-dflt \
                          int-mand int-dflt int-inst \
                          idle-mand idle-dflt \
                          sn-map-eip add-attrs \
                          name-std name-mand name-ovrd name-unresl \
                          tags-mrg slbl-dual sanno std-meta \
                          del-del del-ret ip-dual; do
                kubectl delete awselbloadbalancer "${name}" -n "${NS}" --ignore-not-found=true
              done
              # Delete ELBConfig CRs created in seed and inline steps
              for name in general-policy del-protection-mandatory del-protection-defaults \
                          access-logs-mandatory access-logs-defaults \
                          cross-zone-mandatory cross-zone-defaults \
                          internal-only-mandatory internal-only-defaults \
                          idle-timeout-mandatory idle-timeout-defaults \
                          naming-mandatory unresolved-template \
                          tags-policy synced-labels-policy synced-anno-policy; do
                kubectl delete elbconfig "${name}" -n "${NS}" --ignore-not-found=true
              done

    # ──────────────────────────────────────────────────────────────────────────
    # Seed: namespace + all governance ELBConfigs with effectiveConfig patched.
    # All configs persist for the duration of the test (namespace-level cleanup at end).
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-configs
