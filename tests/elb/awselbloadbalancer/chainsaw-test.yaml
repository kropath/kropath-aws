              metadata:
                name: sn-map-eip
              spec:
                type: network
                subnetMappings:
                  - subnetId: subnet-0010
                    allocationId: eipalloc-0001
                  - subnetId: subnet-0011
                    allocationId: eipalloc-0002
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: sn-map-eip
              spec:
                subnetMappings:
                  - subnetID: subnet-0010
                    allocationID: eipalloc-0001
                  - subnetID: subnet-0011
                    allocationID: eipalloc-0002

    # ──────────────────────────────────────────────────────────────────────────
    # AC-18: spec.additionalAttributes flow through to ACK LoadBalancer spec.attributes.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac18-additional-attributes-flow-through
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: add-attrs
              spec:
                type: application
                subnets:
                  - subnet-0001
                additionalAttributes:
                  - key: waf.fail_open.enabled
                    value: "false"
                  - key: routing.http.drop_invalid_header_fields.enabled
                    value: "true"
        - script:
            content: |
              # Poll until kro has reconciled the child loadbalancers — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get loadbalancers.elbv2.services.k8s.aws add-attrs -n awselbloadbalancer >/dev/null 2>&1 && break
                sleep 1
              done
              ATTRS=$(kubectl get loadbalancers.elbv2.services.k8s.aws add-attrs -n awselbloadbalancer \
                -o json | jq -c '.spec.attributes')
              echo "$ATTRS" | jq -e 'any(.key == "waf.fail_open.enabled" and .value == "false")' \
                >/dev/null || { echo "FAIL: missing waf.fail_open.enabled"; exit 1; }
              echo "$ATTRS" | jq -e 'any(.key == "routing.http.drop_invalid_header_fields.enabled" and .value == "true")' \
                >/dev/null || { echo "FAIL: missing routing.http.drop_invalid_header_fields.enabled"; exit 1; }
              echo "PASS: additionalAttributes present in spec.attributes"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-19: {namespace}-{name} naming template → status.resourceName lowercase.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac19-naming-standard-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: name-std
              spec:
                type: application
                subnets:
                  - subnet-0001
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: name-std-elblb-naming
              data:
                effectiveName: awselbloadbalancer-name-std
                resourceName: awselbloadbalancer-name-std
                namingStatus: valid
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: name-std
              status:
                resourceName: awselbloadbalancer-name-std
                namingStatus: valid
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: name-std
              spec:
                name: awselbloadbalancer-name-std

    # ──────────────────────────────────────────────────────────────────────────
    # AC-20: mandatory.namingTemplate=corp-{namespace}-{name} overrides defaults template.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac20-naming-mandatory-template-overrides
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: name-mand
              spec:
                configRef: naming-mandatory
                type: application
                subnets:
                  - subnet-0001
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: name-mand
              status:
                resourceName: corp-awselbloadbalancer-name-mand
                namingStatus: valid
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: name-mand
              spec:
                name: corp-awselbloadbalancer-name-mand

    # ──────────────────────────────────────────────────────────────────────────
    # AC-21: spec.nameOverride bypasses all naming templates.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac21-name-override-bypasses-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: name-ovrd
              spec:
                type: application
                subnets:
                  - subnet-0001
                nameOverride: my-custom-lb
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: name-ovrd
              status:
                resourceName: my-custom-lb
                namingStatus: valid
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: name-ovrd
              spec:
                name: my-custom-lb

    # ──────────────────────────────────────────────────────────────────────────
    # AC-22 (negative): {tag.env} token in template with no matching tag →
    #         namingStatus: invalid-unresolved-tokens.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac22-unresolved-token-invalid-naming-status
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: name-unresl
              spec:
                configRef: unresolved-template
                type: application
                subnets:
                  - subnet-0001
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: name-unresl
              status:
                namingStatus: invalid-unresolved-tokens

    # ──────────────────────────────────────────────────────────────────────────
    # AC-23: mandatory + defaults + spec tags all merge; mandatory wins on conflicts.
    # Config: mandatory.tags={cost-centre:platform}, defaults.tags={defaults-tag:from-defaults}
    # Instance: spec.tags={env:prod, cost-centre:instance-value}
    # Expected: cost-centre=platform (mandatory wins), env=prod (spec), defaults-tag=from-defaults
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac23-tags-three-tier-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: tags-mrg
              spec:
                configRef: tags-policy
                type: application
                subnets:
                  - subnet-0001
                tags:
                  env: prod
                  cost-centre: instance-value
        - script:
            # Order-independent tag check via jq (ELBv2 tags: [{key:k, value:v}])
            content: |
              # Poll until kro has reconciled the child loadbalancers — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get loadbalancers.elbv2.services.k8s.aws tags-mrg -n awselbloadbalancer >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get loadbalancers.elbv2.services.k8s.aws tags-mrg -n awselbloadbalancer \
                -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e 'any(.key == "env" and .value == "prod")' \
                >/dev/null || { echo "FAIL: missing tag env=prod; tags=$TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "defaults-tag" and .value == "from-defaults")' \
                >/dev/null || { echo "FAIL: missing tag defaults-tag=from-defaults; tags=$TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "cost-centre" and .value == "platform")' \
                >/dev/null || { echo "FAIL: mandatory cost-centre=platform did not win; tags=$TAGS"; exit 1; }
              echo "PASS: all three tag tiers merged; mandatory wins on conflict"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-24: syncedLabels dual-write — K8s metadata.labels with aws.kropath.run/ prefix
    #         AND cloud tags (plain key, no prefix).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac24-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: slbl-dual
              spec:
                configRef: synced-labels-policy
                type: application
                subnets:
                  - subnet-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: slbl-dual
                labels:
                  aws.kropath.run/environment: production
              spec: {}
        - script:
            content: |
              # Poll until kro has reconciled the child loadbalancers — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get loadbalancers.elbv2.services.k8s.aws slbl-dual -n awselbloadbalancer >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get loadbalancers.elbv2.services.k8s.aws slbl-dual -n awselbloadbalancer \
                -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e 'any(.key == "environment" and .value == "production")' \
                >/dev/null || { echo "FAIL: syncedLabel environment=production not in cloud tags; tags=$TAGS"; exit 1; }
              echo "PASS: syncedLabel in both K8s metadata.labels (prefixed) and cloud tags (plain)"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-25: syncedAnnotations written to ACK LoadBalancer metadata.annotations
    #         with aws.kropath.run/ prefix.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac25-synced-annotations-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: sanno
              spec:
                configRef: synced-anno-policy
                type: application
                subnets:
                  - subnet-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: sanno
                annotations:
                  aws.kropath.run/team: infra
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-26: Standard kropath metadata present on ACK LoadBalancer CR.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac26-standard-kropath-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: std-meta
              spec:
                type: application
                subnets:
                  - subnet-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: std-meta
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-meta
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}
        - script:
            content: |
              # Poll until kro has reconciled the child loadbalancers — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get loadbalancers.elbv2.services.k8s.aws std-meta -n awselbloadbalancer >/dev/null 2>&1 && break
                sleep 1
              done
              OWNER=$(kubectl get loadbalancers.elbv2.services.k8s.aws std-meta -n awselbloadbalancer \
                -o json | jq -r '.metadata.ownerReferences[0].kind')
              [ "$OWNER" = "AWSELBLoadBalancer" ] \
                || { echo "FAIL: ownerReference.kind should be AWSELBLoadBalancer; got=$OWNER"; exit 1; }
              CTRL=$(kubectl get loadbalancers.elbv2.services.k8s.aws std-meta -n awselbloadbalancer \
                -o json | jq -r '.metadata.ownerReferences[0].controller')
              [ "$CTRL" = "true" ] \
                || { echo "FAIL: ownerReference.controller should be true; got=$CTRL"; exit 1; }
              echo "PASS: ownerReference points to AWSELBLoadBalancer with controller=true"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-27: spec.deletionPolicy: delete → annotation services.k8s.aws/deletion-policy: delete.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac27-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: del-del
              spec:
