              kind: LoadBalancer
              metadata:
                name: del-ret
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-29: spec.ipAddressType: dualstack flows to ACK LoadBalancer spec.ipAddressType.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac29-ip-address-type-dualstack
      try:
        - apply:
