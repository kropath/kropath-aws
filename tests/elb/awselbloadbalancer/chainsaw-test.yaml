    # ──────────────────────────────────────────────────────────────────────────
    # AC-3: GWLB created with subnets; scheme is empty, securityGroups is empty.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-gwlb-no-scheme-no-sg
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBLoadBalancer
              metadata:
                name: gwlb-subnet
              spec:
                type: gateway
                subnets:
                  - subnet-0004
                securityGroups:
                  - sg-should-be-ignored
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: gwlb-subnet
              spec:
                type: gateway
                subnets:
                  - subnet-0004
        - script:
            # GWLB: securityGroups must be empty (not forwarded from spec)
            content: |
              # Poll until kro has reconciled the child loadbalancers — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get loadbalancers.elbv2.services.k8s.aws gwlb-subnet -n awselbloadbalancer >/dev/null 2>&1 && break
                sleep 1
              done
              SG=$(kubectl get loadbalancers.elbv2.services.k8s.aws gwlb-subnet -n awselbloadbalancer \
                -o jsonpath='{.spec.securityGroups}')
              if [ -n "$SG" ] && [ "$SG" != "[]" ]; then
                echo "FAIL: GWLB should have no securityGroups, got: $SG"
                exit 1
              fi
              echo "PASS: GWLB securityGroups is empty"

    # ──────────────────────────────────────────────────────────────────────────
