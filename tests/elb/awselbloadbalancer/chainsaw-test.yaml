                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: LoadBalancer
              metadata:
                name: del-del
                annotations:
                  services.k8s.aws/deletion-policy: delete
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-28: spec.deletionPolicy: retain (default) → annotation services.k8s.aws/deletion-policy: retain.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac28-deletion-policy-retain-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
