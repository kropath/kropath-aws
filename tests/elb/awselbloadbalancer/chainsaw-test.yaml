                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
