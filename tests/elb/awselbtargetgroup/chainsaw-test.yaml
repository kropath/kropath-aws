# aws-elb-03 AWSELBTargetGroup Chainsaw tests — one scenario per acceptance criterion (21 ACs).
# Namespace: awselbtargetgroup (fixed; {namespace}-{name} template expands predictably).
# accountId: 123456789012 | region: us-east-1
# effectiveConfig is injected via kubectl patch --subresource=status to simulate
# kropath-controller (which is not running in the local test cluster).
# Tags/attributes are lists — jq script steps used for order-independent assertions.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awselbtargetgroup
spec:
  namespace: awselbtargetgroup
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Purge: delete all resources this test may have created in a prior run.
    # ──────────────────────────────────────────────────────────────────────────
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-awselbtargetgroup-namespace.yaml
        - script:
            content: |
              set -e
              NS=awselbtargetgroup
              # Delete AWSELBTargetGroup CRs
              for name in tg-instance tg-ip tg-lambda tg-alb tg-tcp \
                          tg-h2 tg-grpc tg-hc tg-hc-on \
                          tg-matcher-h tg-matcher-g tg-attrs \
                          name-std name-mand name-ovrd name-unresl \
                          tags-mrg slbl-dual sanno std-meta del-del; do
                kubectl delete awselbtargetgroup "${name}" -n "${NS}" --ignore-not-found=true
              done
              # Delete ELBConfig CRs
              for name in general-policy naming-mandatory unresolved-template \
                          tags-policy synced-labels-policy synced-anno-policy; do
                kubectl delete elbconfig "${name}" -n "${NS}" --ignore-not-found=true
              done

    # ──────────────────────────────────────────────────────────────────────────
    # Seed: all governance ELBConfigs with effectiveConfig patched.
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-configs
      try:
        - script:
            content: |
              set -e
              NS=awselbtargetgroup

              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: general-policy
                namespace: awselbtargetgroup
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: naming-mandatory
                namespace: awselbtargetgroup
                labels:
                  aws.kropath.run/resource-name: naming-mandatory
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: "corp-{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  # namingTemplate left empty in spec: ELBConfig CRD forbids setting it
                  # in both mandatory and defaults. The status.effectiveConfig patch below
                  # still seeds both tiers to exercise the RGD's mandatory-wins logic.
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: unresolved-template
                namespace: awselbtargetgroup
                labels:
                  aws.kropath.run/resource-name: unresolved-template
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: "{tag.env}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: tags-policy
                namespace: awselbtargetgroup
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags:
                    cost-centre: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    defaults-tag: from-defaults
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: synced-labels-policy
                namespace: awselbtargetgroup
                labels:
                  aws.kropath.run/resource-name: synced-labels-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels:
                    environment: production
                  syncedAnnotations: {}
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl apply -f - <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: ELBConfig
              metadata:
                name: synced-anno-policy
                namespace: awselbtargetgroup
                labels:
                  aws.kropath.run/resource-name: synced-anno-policy
              spec:
                mandatory:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations:
                    team: infra
                defaults:
                  deletionProtection: false
                  accessLogsEnabled: false
                  accessLogsS3Bucket: ""
                  crossZoneEnabled: false
                  internalOnly: false
                  idleTimeoutSeconds: 0
                  sslPolicy: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF

              # Patch effectiveConfig on all configs (simulate kropath-controller)
              BASE='{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig general-policy -n awselbtargetgroup --subresource=status --type=merge -p "$BASE"
              kubectl patch elbconfig naming-mandatory -n awselbtargetgroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig unresolved-template -n awselbtargetgroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig tags-policy -n awselbtargetgroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"{namespace}-{name}","tags":{"defaults-tag":"from-defaults"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig synced-labels-policy -n awselbtargetgroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl patch elbconfig synced-anno-policy -n awselbtargetgroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"team":"infra"}},"defaults":{"deletionProtection":false,"accessLogsEnabled":false,"accessLogsS3Bucket":"","crossZoneEnabled":false,"internalOnly":false,"idleTimeoutSeconds":0,"sslPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: instance target group — targetType=instance, protocol=HTTP, port=80, vpcId set.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-instance-target-group
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-instance
              spec:
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-instance
              spec:
                targetType: instance
                protocol: HTTP
                port: 80
                vpcID: vpc-0001
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-instance
              status:
                resourceName: awselbtargetgroup-tg-instance
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2: ip target group — targetType=ip, protocol=HTTP, port=80, vpcId set.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac2-ip-target-group
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-ip
              spec:
                targetType: ip
                protocol: HTTP
                port: 80
                vpcId: vpc-0002
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-ip
              spec:
                targetType: ip
                protocol: HTTP
                port: 80
                vpcID: vpc-0002

    # ──────────────────────────────────────────────────────────────────────────
    # AC-3: lambda target group — targetType=lambda; healthCheck.enabled=false
    #         explicitly disabled (Lambda TGs disable health checks by default in AWS).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-lambda-target-group
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-lambda
              spec:
                targetType: lambda
                healthCheck:
                  enabled: false
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-lambda
              spec:
                targetType: lambda
                healthCheckEnabled: false

    # ──────────────────────────────────────────────────────────────────────────
    # AC-4: alb target group — targetType=alb, port=80, vpcId set.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac4-alb-target-group
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-alb
              spec:
                targetType: alb
                port: 80
                vpcId: vpc-0003
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-alb
              spec:
                targetType: alb
                port: 80
                vpcID: vpc-0003

    # ──────────────────────────────────────────────────────────────────────────
    # AC-5: NLB target group — protocol=TCP for network load balancer targets.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac5-protocol-tcp
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-tcp
              spec:
                targetType: instance
                protocol: TCP
                port: 443
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-tcp
              spec:
                targetType: instance
                protocol: TCP
                port: 443

    # ──────────────────────────────────────────────────────────────────────────
    # AC-6: protocolVersion=HTTP2 flows to ACK TargetGroup spec.protocolVersion.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac6-protocol-version-http2
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-h2
              spec:
                targetType: ip
                protocol: HTTP
                protocolVersion: HTTP2
                port: 80
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-h2
              spec:
                protocolVersion: HTTP2

    # ──────────────────────────────────────────────────────────────────────────
    # AC-7: protocolVersion=GRPC flows to ACK TargetGroup spec.protocolVersion.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac7-protocol-version-grpc
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-grpc
              spec:
                targetType: ip
                protocol: HTTP
                protocolVersion: GRPC
                port: 50051
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-grpc
              spec:
                protocolVersion: GRPC
                port: 50051

    # ──────────────────────────────────────────────────────────────────────────
    # AC-8: All health check fields flow to ACK spec.healthCheck* fields.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac8-health-check-full-config
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-hc
              spec:
                targetType: instance
                protocol: HTTP
                port: 8080
                vpcId: vpc-0001
                healthCheck:
                  enabled: true
                  protocol: HTTP
                  port: traffic-port
                  path: /health
                  intervalSeconds: 30
                  timeoutSeconds: 5
                  healthyThresholdCount: 3
                  unhealthyThresholdCount: 2
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-hc
              spec:
                healthCheckEnabled: true
                healthCheckProtocol: HTTP
                healthCheckPort: traffic-port
                healthCheckPath: /health
                healthCheckIntervalSeconds: 30
                healthCheckTimeoutSeconds: 5
                healthyThresholdCount: 3
                unhealthyThresholdCount: 2

    # ──────────────────────────────────────────────────────────────────────────
    # AC-9: healthCheck.enabled=true explicitly set → healthCheckEnabled=true in ACK.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac9-health-check-enabled-explicit
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-hc-on
              spec:
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
                healthCheck:
                  enabled: true
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-hc-on
              spec:
                healthCheckEnabled: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-10: matcher.httpCode flows to ACK spec.matcher.httpCode.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac10-matcher-http-code
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-matcher-h
              spec:
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
                matcher:
                  httpCode: 200-299
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-matcher-h
              spec:
                matcher:
                  httpCode: 200-299

    # ──────────────────────────────────────────────────────────────────────────
    # AC-11: matcher.grpcCode flows to ACK spec.matcher.grpcCode (gRPC health checks).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac11-matcher-grpc-code
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-matcher-g
              spec:
                targetType: ip
                protocol: HTTP
                protocolVersion: GRPC
                port: 50051
                vpcId: vpc-0001
                matcher:
                  grpcCode: 0-99
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: tg-matcher-g
              spec:
                matcher:
                  grpcCode: 0-99

    # ──────────────────────────────────────────────────────────────────────────
    # AC-12: additionalAttributes flow to ACK spec.attributes (order-independent).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac12-additional-attributes-flow-through
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tg-attrs
              spec:
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
                additionalAttributes:
                  - key: deregistration_delay.timeout_seconds
                    value: "300"
                  - key: slow_start.duration_seconds
                    value: "30"
        - script:
            # Order-independent attribute check via jq (ACK uses [{key:k, value:v}])
            content: |
              # Poll until kro has reconciled the child targetgroups — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get targetgroups.elbv2.services.k8s.aws tg-attrs -n awselbtargetgroup >/dev/null 2>&1 && break
                sleep 1
              done
              ATTRS=$(kubectl get targetgroups.elbv2.services.k8s.aws tg-attrs -n awselbtargetgroup \
                -o json | jq -c '.spec.attributes')
              echo "$ATTRS" | jq -e 'any(.key == "deregistration_delay.timeout_seconds" and .value == "300")' \
                >/dev/null || { echo "FAIL: missing attr deregistration_delay.timeout_seconds=300; attrs=$ATTRS"; exit 1; }
              echo "$ATTRS" | jq -e 'any(.key == "slow_start.duration_seconds" and .value == "30")' \
                >/dev/null || { echo "FAIL: missing attr slow_start.duration_seconds=30; attrs=$ATTRS"; exit 1; }
              echo "PASS: additionalAttributes flow to ACK spec.attributes"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-13: Standard {namespace}-{name} naming template → status.resourceName and ACK spec.name.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac13-naming-standard-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: name-std
              spec:
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: name-std-elbtg-naming
              data:
                effectiveName: awselbtargetgroup-name-std
                resourceName: awselbtargetgroup-name-std
                namingStatus: valid
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: name-std
              status:
                resourceName: awselbtargetgroup-name-std
                namingStatus: valid
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: name-std
              spec:
                name: awselbtargetgroup-name-std

    # ──────────────────────────────────────────────────────────────────────────
    # AC-14: mandatory.namingTemplate=corp-{namespace}-{name} overrides defaults template.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac14-naming-mandatory-template-overrides
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: name-mand
              spec:
                configRef: naming-mandatory
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: name-mand
              status:
                resourceName: corp-awselbtargetgroup-name-mand
                namingStatus: valid
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: name-mand
              spec:
                name: corp-awselbtargetgroup-name-mand

    # ──────────────────────────────────────────────────────────────────────────
    # AC-15: spec.nameOverride bypasses all naming templates.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac15-name-override-bypasses-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: name-ovrd
              spec:
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
                nameOverride: my-custom-tg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: name-ovrd
              status:
                resourceName: my-custom-tg
                namingStatus: valid
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: name-ovrd
              spec:
                name: my-custom-tg

    # ──────────────────────────────────────────────────────────────────────────
    # AC-16 (negative): {tag.env} token in template with no matching tag →
    #         namingStatus: invalid-unresolved-tokens.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac16-unresolved-token-invalid-naming-status
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: name-unresl
              spec:
                configRef: unresolved-template
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: name-unresl
              status:
                namingStatus: invalid-unresolved-tokens

    # ──────────────────────────────────────────────────────────────────────────
    # AC-17: mandatory + defaults + spec tags all merge; mandatory wins on conflicts.
    # Config: mandatory.tags={cost-centre:platform}, defaults.tags={defaults-tag:from-defaults}
    # Instance: spec.tags={env:prod, cost-centre:instance-value}
    # Expected: cost-centre=platform (mandatory wins), env=prod (spec), defaults-tag=from-defaults
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac17-tags-three-tier-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: tags-mrg
              spec:
                configRef: tags-policy
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
                tags:
                  env: prod
                  cost-centre: instance-value
        - script:
            # Order-independent tag check via jq (ELBv2 tags: [{key:k, value:v}])
            content: |
              # Poll until kro has reconciled the child targetgroups — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get targetgroups.elbv2.services.k8s.aws tags-mrg -n awselbtargetgroup >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get targetgroups.elbv2.services.k8s.aws tags-mrg -n awselbtargetgroup \
                -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e 'any(.key == "env" and .value == "prod")' \
                >/dev/null || { echo "FAIL: missing tag env=prod; tags=$TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "defaults-tag" and .value == "from-defaults")' \
                >/dev/null || { echo "FAIL: missing tag defaults-tag=from-defaults; tags=$TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "cost-centre" and .value == "platform")' \
                >/dev/null || { echo "FAIL: mandatory cost-centre=platform did not win; tags=$TAGS"; exit 1; }
              echo "PASS: all three tag tiers merged; mandatory wins on conflict"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-18: syncedLabels dual-write — K8s metadata.labels with aws.kropath.run/ prefix
    #         AND cloud tags (plain key, no prefix).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac18-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: slbl-dual
              spec:
                configRef: synced-labels-policy
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: slbl-dual
                labels:
                  aws.kropath.run/environment: production
              spec: {}
        - script:
            content: |
              # Poll until kro has reconciled the child targetgroups — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get targetgroups.elbv2.services.k8s.aws slbl-dual -n awselbtargetgroup >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get targetgroups.elbv2.services.k8s.aws slbl-dual -n awselbtargetgroup \
                -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e 'any(.key == "environment" and .value == "production")' \
                >/dev/null || { echo "FAIL: syncedLabel environment=production not in cloud tags; tags=$TAGS"; exit 1; }
              echo "PASS: syncedLabel in both K8s metadata.labels (prefixed) and cloud tags (plain)"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-19: syncedAnnotations written to ACK TargetGroup metadata.annotations
    #         with aws.kropath.run/ prefix.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac19-synced-annotations-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: sanno
              spec:
                configRef: synced-anno-policy
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: sanno
                annotations:
                  aws.kropath.run/team: infra
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-20: Standard kropath metadata present on ACK TargetGroup CR.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac20-standard-kropath-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: std-meta
              spec:
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: std-meta
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-meta
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}
        - script:
            content: |
              # Poll until kro has reconciled the child targetgroups — a one-shot
              # read races kro's async reconcile (child not yet created).
              for __poll_wait_child in $(seq 1 60); do
                kubectl get targetgroups.elbv2.services.k8s.aws std-meta -n awselbtargetgroup >/dev/null 2>&1 && break
                sleep 1
              done
              OWNER=$(kubectl get targetgroups.elbv2.services.k8s.aws std-meta -n awselbtargetgroup \
                -o json | jq -r '.metadata.ownerReferences[0].kind')
              [ "$OWNER" = "AWSELBTargetGroup" ] \
                || { echo "FAIL: ownerReference.kind should be AWSELBTargetGroup; got=$OWNER"; exit 1; }
              CTRL=$(kubectl get targetgroups.elbv2.services.k8s.aws std-meta -n awselbtargetgroup \
                -o json | jq -r '.metadata.ownerReferences[0].controller')
              [ "$CTRL" = "true" ] \
                || { echo "FAIL: ownerReference.controller should be true; got=$CTRL"; exit 1; }
              echo "PASS: ownerReference points to AWSELBTargetGroup with controller=true"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-21: spec.deletionPolicy: delete → annotation services.k8s.aws/deletion-policy: delete.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac21-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSELBTargetGroup
              metadata:
                name: del-del
              spec:
                targetType: instance
                protocol: HTTP
                port: 80
                vpcId: vpc-0001
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: elbv2.services.k8s.aws/v1alpha1
              kind: TargetGroup
              metadata:
                name: del-del
                annotations:
                  services.k8s.aws/deletion-policy: delete
              spec: {}
