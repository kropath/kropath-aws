# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named SNSConfig + SNSTopic and deletes
# nothing between steps, so no ACK finalizer ever blocks a delete and kro's per-object-
# key backoff never compounds. Test-level skipDelete: true stops chainsaw's end-of-test
# cascade delete; the ephemeral kind cluster is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: snstopic
spec:
  skipDelete: true
  namespace: snstopic
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-snstopic-namespace.yaml
        - apply:
            file: 02-topic-policy-document.yaml
        - script:
            content: |
              kubectl patch policydocument my-topic-policy -n snstopic \
                --subresource=status --type=merge \
                -p '{"status":{"resolvedDocumentJSON":"{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"arn:aws:iam::123456789012:root\"},\"Action\":\"sns:Publish\",\"Resource\":\"*\"}]}"}}'
    - name: ac1-encryption-default-kms
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: ac1-cfg
                namespace: snstopic
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
        - script:
            content: |
              kubectl patch snsconfig ac1-cfg -n snstopic \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsMasterKeyId":"","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"deliveryFeedback":{"application":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"http":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"lambda":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"sqs":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"firehose":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""}}},"defaults":{"kmsMasterKeyId":"alias/aws/sns","signatureVersion":"1","tracingConfig":"PassThrough","dataProtectionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{},"deliveryFeedback":{"application":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"http":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"lambda":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"sqs":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"firehose":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""}}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSTopic
              metadata:
                name: enc-default
                namespace: snstopic
              spec:
                configRef: ac1-cfg
                kmsMasterKeyId: ''
        - assert:
            resource:
              apiVersion: sns.services.k8s.aws/v1alpha1
              kind: Topic
              metadata:
                name: enc-default
                namespace: snstopic
              spec:
                kmsMasterKeyID: alias/aws/sns
