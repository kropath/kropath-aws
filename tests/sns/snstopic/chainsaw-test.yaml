              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
        - script:
            content: |
              # Only sqs.successFeedbackRoleArn is set — 1 of 10 ARN positions filled.
              # This is the mixed-ARN case: hasAnyFeedbackARN=true, hasMixedFeedbackARN=true.
              kubectl patch snsconfig ac35-cfg -n snstopic \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsMasterKeyId":"","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"deliveryFeedback":{"application":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"http":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"lambda":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"sqs":{"successFeedbackRoleArn":"arn:aws:iam::123:role/sqs-success","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"firehose":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""}}},"defaults":{"kmsMasterKeyId":"alias/aws/sns","signatureVersion":"1","tracingConfig":"PassThrough","dataProtectionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{},"deliveryFeedback":{"application":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"http":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"lambda":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"sqs":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"firehose":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""}}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSTopic
              metadata:
                name: mixed-arn-topic
                namespace: snstopic
              spec:
                configRef: ac35-cfg
        - assert:
            # The mixedFeedbackARNError advisory ConfigMap must be created.
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: mixed-arn-topic-mixed-arn-error
                namespace: snstopic
        - script:
            # No ACK Topic CR must exist for the WithARN variant when mixed ARNs detected.
            content: |
              count=$(kubectl get topic.sns.services.k8s.aws mixed-arn-topic -n snstopic --ignore-not-found --no-headers 2>/dev/null | wc -l)
              if [ "$count" -gt 0 ]; then
                echo "ERROR: ACK Topic CR was created despite mixed-ARN configuration"
                exit 1
              fi
              echo "PASS: No ACK Topic CR created for mixed-ARN case"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-36: status.topicArn propagates from the ACK Topic child regardless of
    # which of the twelve includeWhen variants fired.
    #
    # Before KRO-925's follow-up, status.topicArn coalesced across six variant
    # names, so kro skipped the whole field (Unbound Variable Freeze) and no
    # SNSTopic ever reported a topicArn — FIFO variants were not even named in
    # the expression. It now reads the always-bound ackTopicRef externalRef.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac36-topic-arn-propagation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: ac36-cfg
                namespace: snstopic
                labels:
                  aws.kropath.run/resource-name: ac36-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch snsconfig ac36-cfg -n snstopic \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsMasterKeyId":"","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsMasterKeyId":"","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSTopic
              metadata:
                name: ac36-arn-topic
                namespace: snstopic
              spec:
                configRef: ac36-cfg
        # Wait for kro to create the ACK Topic child, then inject a topicARN.
        # No ACK controller runs in this cluster, so nothing overwrites it.
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get topic.sns.services.k8s.aws ac36-arn-topic -n snstopic >/dev/null 2>&1 && break
                sleep 2
              done
              kubectl patch topic.sns.services.k8s.aws ac36-arn-topic -n snstopic \
                --subresource=status --type=merge \
                -p '{"status":{"topicARN":"arn:aws:sns:ap-southeast-2:123456789012:snstopic-ac36-arn-topic"}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSTopic
              metadata:
                name: ac36-arn-topic
                namespace: snstopic
              status:
                topicArn: "arn:aws:sns:ap-southeast-2:123456789012:snstopic-ac36-arn-topic"
