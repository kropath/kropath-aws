                echo "FAIL: spec.policy must be present (AWS default) when topicPolicyRef is empty — got ABSENT"
                exit 1
              fi
              EXPECTED_ARN="arn:aws:sns:ap-southeast-2:123456789012:snstopic-no-policy"
              EXPECTED_OWNER="123456789012"
              EXPECTED_ID="__default_policy_ID"
              ACTUAL_ID=$(echo "$POLICY" | jq -r '.Id // empty')
              ACTUAL_ARN=$(echo "$POLICY" | jq -r '.Statement[0].Resource // empty')
              ACTUAL_OWNER=$(echo "$POLICY" | jq -r '.Statement[0].Condition.StringEquals["AWS:SourceOwner"] // empty')
              FAIL=0
              if [ "$ACTUAL_ID" != "$EXPECTED_ID" ]; then
                echo "FAIL: policy Id: expected '$EXPECTED_ID', got '$ACTUAL_ID'"
                FAIL=1
              fi
              if [ "$ACTUAL_ARN" != "$EXPECTED_ARN" ]; then
                echo "FAIL: policy Resource ARN: expected '$EXPECTED_ARN', got '$ACTUAL_ARN'"
                FAIL=1
              fi
              if [ "$ACTUAL_OWNER" != "$EXPECTED_OWNER" ]; then
                echo "FAIL: policy SourceOwner: expected '$EXPECTED_OWNER', got '$ACTUAL_OWNER'"
                FAIL=1
              fi
              if [ "$FAIL" = "1" ]; then exit 1; fi
              echo "PASS: spec.policy contains AWS default policy with correct ARN and SourceOwner"
