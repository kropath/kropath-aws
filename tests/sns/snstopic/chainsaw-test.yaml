# aws-sns-02 Chainsaw tests -- all 34 acceptance criteria.
# Namespace: snstopic. Naming template {namespace}-{name} => snstopic-<cr-name>.
# effectiveConfig patched via kubectl --subresource=status per scenario.
# Each step has a cleanup: script that removes ACK Topic CR finalizers and
# deletes Topic CRs. ACK adds finalizers.sns.services.k8s.aws to Topic CRs
# which blocks deletion without live AWS; running this in every step's cleanup
# ensures the cascade runs cleanly regardless of which step the test fails at.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: snstopic
spec:
  namespace: snstopic
  steps:
    # ── Seed: namespace + governance config ────────────────────────────────
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              # ACK Topic CRs acquire finalizers.sns.services.k8s.aws that require real AWS
              # to clear. Force-remove them first so namespace deletion does not hang.
              for name in $(kubectl get topic -n snstopic -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch topic "$name" -n snstopic --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              for name in $(kubectl get snstopic -n snstopic -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch snstopic "$name" -n snstopic --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete topic --all -n snstopic --ignore-not-found
              kubectl delete snsconfig --all -n snstopic --ignore-not-found
              kubectl delete snstopic --all -n snstopic --ignore-not-found
              kubectl delete policydocument --all -n snstopic --ignore-not-found
              kubectl delete namespace snstopic --ignore-not-found
              sleep 3

    - name: seed-namespace-and-config
      try:
        - apply:
            file: 00-snstopic-namespace.yaml
        - apply:
            file: 01-general-policy-snsconfig.yaml
        - apply:
            file: 02-topic-policy-document.yaml
        - script:
            content: |
              kubectl patch snsconfig general-policy -n snstopic \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsMasterKeyId":"","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"deliveryFeedback":{"application":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"http":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"lambda":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"sqs":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"firehose":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""}}},"defaults":{"kmsMasterKeyId":"alias/aws/sns","signatureVersion":"1","tracingConfig":"PassThrough","dataProtectionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{},"deliveryFeedback":{"application":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"http":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"lambda":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"sqs":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""},"firehose":{"successFeedbackRoleArn":"","failureFeedbackRoleArn":"","successFeedbackSampleRate":""}}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'

    # ── AC-1: encryption default from SNSConfig.defaults.kmsMasterKeyId ───
    - name: ac1-encryption-default-kms
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSTopic
              metadata:
                name: enc-default
                namespace: snstopic
              spec:
                configRef: general-policy
                kmsMasterKeyId: ""
        - assert:
            resource:
              apiVersion: sns.services.k8s.aws/v1alpha1
              kind: Topic
              metadata:
                name: enc-default
                namespace: snstopic
              spec:
                kmsMasterKeyID: alias/aws/sns
      cleanup:
        - script:
            content: |
              for name in $(kubectl get topic -n snstopic -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch topic "$name" -n snstopic --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete topic --all -n snstopic --ignore-not-found=true
              for name in $(kubectl get snstopic -n snstopic -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch snstopic "$name" -n snstopic --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete snstopic --all -n snstopic --ignore-not-found=true

