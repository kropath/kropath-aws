                           sqsSuccessFeedbackSampleRate \
                           firehoseSuccessFeedbackRoleARN firehoseFailureFeedbackRoleARN \
                           firehoseSuccessFeedbackSampleRate; do
                VAL=$(echo "$SPEC" | jq -r --arg f "$FIELD" 'if has($f) then .[$f] else "ABSENT" end')
                if [ "$VAL" != "ABSENT" ]; then
                  echo "FAIL: spec.$FIELD must be absent when no delivery feedback is configured, got: '$VAL'"
                  FAIL=1
                fi
              done
              if [ "$FAIL" -eq 0 ]; then
                echo "PASS: all delivery-feedback fields are absent"
              else
                exit 1
              fi
