    # ── AC-31: tags are list format {key, value} not map ──────────────────
    - name: ac31-tags-list-format
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSTopic
              metadata:
                name: tags-list
                namespace: snstopic
              spec:
                configRef: general-policy
                tags:
                  app: orders
                  env: prod
        - assert:
            resource:
              apiVersion: sns.services.k8s.aws/v1alpha1
              kind: Topic
              metadata:
                name: tags-list
                namespace: snstopic
              spec:
                name: snstopic-tags-list
        - script:
            content: |
              TAGS=$(kubectl get topics.sns.services.k8s.aws tags-list -n snstopic -o json | jq -c '.spec.tags')
              VALID=$(echo "$TAGS" | jq 'all(has("key") and has("value"))')
              [ "$VALID" = "true" ] || { echo "FAIL: tags not in {key, value} list format: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "app" and .value == "orders")' >/dev/null || { echo "FAIL: missing app=orders"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "env" and .value == "prod")' >/dev/null || { echo "FAIL: missing env=prod"; exit 1; }
      cleanup:
        - script:
            content: |
              for name in $(kubectl get topic -n snstopic -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch topic "$name" -n snstopic --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete topic --all -n snstopic --ignore-not-found=true
              for name in $(kubectl get snstopic -n snstopic -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch snstopic "$name" -n snstopic --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete snstopic --all -n snstopic --ignore-not-found=true

