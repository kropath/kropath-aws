              SPEC=$(kubectl get topic feedback-none -n snstopic -o json | jq '.spec')
              FAIL=0
              for FIELD in applicationSuccessFeedbackRoleARN applicationFailureFeedbackRoleARN \
                           applicationSuccessFeedbackSampleRate \
                           httpSuccessFeedbackRoleARN httpFailureFeedbackRoleARN \
                           httpSuccessFeedbackSampleRate \
                           lambdaSuccessFeedbackRoleARN lambdaFailureFeedbackRoleARN \
                           lambdaSuccessFeedbackSampleRate \
