# Base SNSConfig for snstopic tests — general-policy with realistic defaults.
# Applied in the namespace seed step; status.effectiveConfig patched per-scenario.
---
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: general-policy
  namespace: snstopic
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    kmsMasterKeyId: ""
    signatureVersion: ""
    tracingConfig: ""
    dataProtectionPolicy: ""
    deliveryFeedback:
      application:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
      http:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
      lambda:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
      sqs:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
      firehose:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    kmsMasterKeyId: "alias/aws/sns"
    signatureVersion: "1"
    tracingConfig: "PassThrough"
    dataProtectionPolicy: ""
    deliveryFeedback:
      application:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
      http:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
      lambda:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
      sqs:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
      firehose:
        successFeedbackRoleArn: ""
        failureFeedbackRoleArn: ""
        successFeedbackSampleRate: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
