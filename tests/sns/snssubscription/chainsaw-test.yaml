    - name: ac30-no-naming-fields
      try:
        - script:
            content: |
              # AC-30: no nameOverride/resourceName/predictedArn/namingStatus fields anywhere
              # in the generated CRD (KRO-236 naming exemption).
              SPEC_FIELDS=$(kubectl get crd snssubscriptions.aws.kropath.run -o json | jq -r '.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties | keys | join(",")')
              STATUS_FIELDS=$(kubectl get crd snssubscriptions.aws.kropath.run -o json | jq -r '.spec.versions[0].schema.openAPIV3Schema.properties.status.properties | keys | join(",")')
              FAIL=0
              for FIELD in nameOverride resourceName predictedArn namingStatus; do
                if echo "$SPEC_FIELDS" | tr ',' '\n' | grep -qx "$FIELD"; then
                  echo "FAIL: spec.$FIELD must not exist on SNSSubscription"
                  FAIL=1
                fi
                if echo "$STATUS_FIELDS" | tr ',' '\n' | grep -qx "$FIELD"; then
                  echo "FAIL: status.$FIELD must not exist on SNSSubscription"
                  FAIL=1
                fi
              done
              if [ "$FAIL" -eq 0 ]; then
                echo "PASS: no naming fields present on SNSSubscription CRD"
              else
                exit 1
              fi
