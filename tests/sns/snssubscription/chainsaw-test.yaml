# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named resources and deletes nothing between
# steps, so no ACK finalizer ever blocks a delete and kro's per-object-key backoff never
# compounds. Test-level skipDelete: true stops chainsaw's end-of-test cascade delete; the
# ephemeral kind cluster is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: snssubscription
spec:
  skipDelete: true
  namespace: snssubscription
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-snssubscription-namespace.yaml
    - name: ac1-topic-ref-local
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: ac1-cfg
                namespace: snssubscription
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec: {}
        - script:
            content: |
              kubectl patch snsconfig ac1-cfg -n snssubscription \
                --subresource=status --type=merge \
                -p '{"status": {"effectiveConfig": {"mandatory": {"tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}, "defaults": {"tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSTopic
              metadata:
                name: ac1-topic
                namespace: snssubscription
                labels:
                  aws.kropath.run/resource-name: ac1-topic
              spec: {}
        - script:
            content: |
              kubectl patch snstopic ac1-topic -n snssubscription \
                --subresource=status --type=merge \
                -p '{"status":{"predictedArn":"arn:aws:sns:ap-southeast-2:123456789012:events-prod-order-events"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSSubscription
              metadata:
                name: ac1-sub
                namespace: snssubscription
              spec:
                configRef: 'ac1-cfg'
                topicRef: 'ac1-topic'
                protocol: 'sqs'
                endpoint: 'arn:aws:sqs:ap-southeast-2:123456789012:order-events-consumer'
        - assert:
            resource:
              apiVersion: sns.services.k8s.aws/v1alpha1
              kind: Subscription
              metadata:
                name: ac1-sub
                namespace: snssubscription
              spec:
                topicARN: 'arn:aws:sns:ap-southeast-2:123456789012:events-prod-order-events'
    - name: ac2-topic-arn-external
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
