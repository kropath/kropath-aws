        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get subscription ac11-sub -n snssubscription >/dev/null 2>&1 && break
                sleep 1
              done
              # AC-11: filterPolicy must be absent (not empty string) on the ACK child.
              VAL=$(kubectl get subscription ac11-sub -n snssubscription -o json | jq -r 'if .spec | has("filterPolicy") then .spec.filterPolicy else "ABSENT" end')
              if [ "$VAL" != "ABSENT" ]; then
                echo "FAIL: spec.filterPolicy must be absent, got: '$VAL'"
                exit 1
              fi
              echo "PASS: spec.filterPolicy is absent"
