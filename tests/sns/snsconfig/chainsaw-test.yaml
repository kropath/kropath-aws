#
# aws-sns-01 SNSConfig governance tests -- all 13 acceptance criteria.
# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step uses a uniquely-named SNSConfig and deletes nothing between
# steps. skipDelete stops chainsaw's end-of-test cascade delete; the ephemeral kind
# cluster is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: snsconfig
spec:
  skipDelete: true
  namespace: snsconfig
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-snsconfig-namespace.yaml
    - name: ac1-general-policy-accepted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac1-policy
                name: ac1-policy
                namespace: snsconfig
              spec:
                defaults:
                  dataProtectionPolicy: ''
                  deliveryFeedback:
                    application:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    firehose:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    http:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    lambda:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    sqs:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                  kmsMasterKeyId: alias/aws/sns
                  namingTemplate: '{namespace}-{name}'
                  signatureVersion: '1'
                  syncedAnnotations: {}
                  syncedLabels: {}
                  tags: {}
                  tracingConfig: PassThrough
                mandatory:
                  dataProtectionPolicy: ''
                  deliveryFeedback:
                    application:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    firehose:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    http:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    lambda:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    sqs:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                  kmsMasterKeyId: ''
                  namingTemplate: ''
                  signatureVersion: ''
                  syncedAnnotations: {}
                  syncedLabels: {}
                  tags: {}
                  tracingConfig: ''
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: ac1-policy
                namespace: snsconfig
                labels:
                  aws.kropath.run/resource-name: ac1-policy
              spec:
                defaults:
                  kmsMasterKeyId: alias/aws/sns
                  signatureVersion: '1'
                  tracingConfig: PassThrough
                  namingTemplate: '{namespace}-{name}'
    - name: ac2-reject-dual-tier-kms
      try:
        - apply:
            file: 02-invalid-dual-tier-kms.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true
    - name: ac3-reject-dual-tier-signature
      try:
        - apply:
            file: 03-invalid-dual-tier-signature.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true
    - name: ac4-reject-dual-tier-tracing
      try:
        - apply:
            file: 04-invalid-dual-tier-tracing.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true
    - name: ac5-reject-dual-tier-dataprotection
      try:
        - apply:
            file: 05-invalid-dual-tier-dataprotection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true
    - name: ac6-reject-dual-tier-naming
      try:
        - apply:
            file: 06-invalid-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true
    - name: ac7-effective-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac7-policy
                name: ac7-policy
                namespace: snsconfig
              spec:
                defaults:
                  dataProtectionPolicy: ''
                  kmsMasterKeyId: alias/aws/sns
                  namingTemplate: '{namespace}-{name}'
                  signatureVersion: '1'
                  syncedAnnotations: {}
                  syncedLabels: {}
                  tags: {}
                  tracingConfig: PassThrough
                mandatory:
                  dataProtectionPolicy: ''
                  kmsMasterKeyId: ''
                  namingTemplate: ''
                  signatureVersion: ''
                  syncedAnnotations: {}
                  syncedLabels: {}
                  tags: {}
                  tracingConfig: ''
        - script:
            content: |
              kubectl patch snsconfig ac7-policy -n snsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsMasterKeyId":"arn:aws:kms:ap-southeast-2:123:key/org-key","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsMasterKeyId":"alias/aws/sns","signatureVersion":"1","tracingConfig":"PassThrough","dataProtectionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: ac7-policy
                namespace: snsconfig
              status:
                effectiveConfig:
                  mandatory:
                    kmsMasterKeyId: arn:aws:kms:ap-southeast-2:123:key/org-key
                  defaults:
                    kmsMasterKeyId: alias/aws/sns
                    namingTemplate: '{namespace}-{name}'
    - name: ac8-naming-template-in-effectiveconfig
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac8-policy
                name: ac8-policy
                namespace: snsconfig
              spec:
                defaults:
                  dataProtectionPolicy: ''
                  deliveryFeedback:
                    application:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    firehose:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    http:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    lambda:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                    sqs:
                      failureFeedbackRoleArn: ''
                      successFeedbackRoleArn: ''
                      successFeedbackSampleRate: ''
                  kmsMasterKeyId: alias/aws/sns
                  namingTemplate: '{namespace}-{name}'
                  signatureVersion: '1'
                  syncedAnnotations: {}
