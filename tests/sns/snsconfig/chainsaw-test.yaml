# aws-sns-01 Chainsaw tests -- all 13 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: snsconfig
spec:
  namespace: snsconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-snsconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: general-policy
                namespace: snsconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  kmsMasterKeyId: alias/aws/sns
                  signatureVersion: "1"
                  tracingConfig: PassThrough
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-dual-tier-kms
      try:
        - apply:
            file: 02-invalid-dual-tier-kms.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true

    - name: ac3-reject-dual-tier-signature
      try:
        - apply:
            file: 03-invalid-dual-tier-signature.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-tracing
      try:
        - apply:
            file: 04-invalid-dual-tier-tracing.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true

    - name: ac5-reject-dual-tier-dataprotection
      try:
        - apply:
            file: 05-invalid-dual-tier-dataprotection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true

    - name: ac6-reject-dual-tier-naming
      try:
        - apply:
            file: 06-invalid-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SNSConfig
                check:
                  ($error != null): true

    - name: ac7-effective-cascade
      try:
        - apply:
            file: 00-snsconfig-namespace.yaml
        - apply:
            file: 07-local-general-policy.yaml
        - script:
            content: |
              kubectl patch snsconfig general-policy -n snsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsMasterKeyId":"arn:aws:kms:ap-southeast-2:123:key/org-key","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsMasterKeyId":"alias/aws/sns","signatureVersion":"1","tracingConfig":"PassThrough","dataProtectionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: general-policy
                namespace: snsconfig
              status:
                effectiveConfig:
                  mandatory:
                    kmsMasterKeyId: "arn:aws:kms:ap-southeast-2:123:key/org-key"
                  defaults:
                    kmsMasterKeyId: alias/aws/sns
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 07-local-general-policy.yaml
        - delete:
            file: 00-snsconfig-namespace.yaml

    - name: ac8-naming-template-in-effectiveconfig
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch snsconfig general-policy -n snsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsMasterKeyId":"","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsMasterKeyId":"alias/aws/sns","signatureVersion":"1","tracingConfig":"PassThrough","dataProtectionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: general-policy
                namespace: snsconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac9-mandatory-security-bundle-accepted
      try:
        - apply:
            file: 09-mandatory-security-bundle.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: pci
                namespace: snsconfig
              spec:
                mandatory:
                  kmsMasterKeyId: "arn:aws:kms:ap-southeast-2:123:key/pci-key"
                  signatureVersion: "2"
                  tracingConfig: Active
      cleanup:
        - delete:
            file: 09-mandatory-security-bundle.yaml

    - name: ac10-tag-merge-in-effectiveconfig
      try:
        - apply:
            file: 10-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch snsconfig general-policy -n snsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsMasterKeyId":"","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"","tags":{"topic-type":"messaging","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsMasterKeyId":"alias/aws/sns","signatureVersion":"1","tracingConfig":"PassThrough","dataProtectionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: general-policy
                namespace: snsconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      topic-type: messaging
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform
      cleanup:
        - delete:
            file: 10-tags-general-policy.yaml

    - name: ac11-synced-labels-in-effectiveconfig
      try:
        - apply:
            file: 11-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch snsconfig general-policy -n snsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsMasterKeyId":"","signatureVersion":"","tracingConfig":"","dataProtectionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"kmsMasterKeyId":"alias/aws/sns","signatureVersion":"1","tracingConfig":"PassThrough","dataProtectionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: general-policy
                namespace: snsconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: internal
      cleanup:
        - delete:
            file: 11-synced-labels-general-policy.yaml

    - name: ac12-delivery-feedback-accepted
      try:
        - apply:
            file: 12-delivery-feedback-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: general-policy
                namespace: snsconfig
              spec:
                mandatory:
                  deliveryFeedback:
                    http:
                      successFeedbackRoleArn: "arn:aws:iam::123:role/http-log"
                      failureFeedbackRoleArn: "arn:aws:iam::123:role/http-log-fail"
                      successFeedbackSampleRate: "100"
      cleanup:
        - delete:
            file: 12-delivery-feedback-general-policy.yaml

    - name: ac13-data-protection-mandatory-accepted
      try:
        - apply:
            file: 13-data-protection-mandatory-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                name: general-policy
                namespace: snsconfig
              spec:
                mandatory:
                  dataProtectionPolicy: '{"Name":"policy","Statement":[]}'
      cleanup:
        - delete:
            file: 13-data-protection-mandatory-general-policy.yaml
