    - name: ac12-delivery-feedback-accepted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac12-policy
