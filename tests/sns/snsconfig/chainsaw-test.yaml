                  defaults:
                    namingTemplate: '{namespace}-{name}'
    - name: ac9-mandatory-security-bundle-accepted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SNSConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac9-pci
                name: ac9-pci
