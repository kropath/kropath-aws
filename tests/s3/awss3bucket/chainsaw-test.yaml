            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: artifacts
                namespace: default
              spec:
                createBucketConfiguration:
                  locationConstraint: ap-southeast-2
                versioning:
                  status: Enabled
                policy: '{"Version":"2012-10-17","Statement":[{"Sid":"DenyNonTLSAccess","Effect":"Deny","Principal":"*","Action":"s3:*","Resource":["arn:aws:s3:::default-artifacts-123456789012","arn:aws:s3:::default-artifacts-123456789012/*"],"Condition":{"Bool":{"aws:SecureTransport":"false"}}}]}'
