        - script:
            content: |
              kubectl patch awss3config synced-annots-cfg -n awss3bucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"team":"data"}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: synced-annotations
              spec:
                configRef: synced-annots-cfg
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: synced-annotations
                annotations:
                  kropath.run/team: data

    # ──────────────────────────────────────────────────────────────────────────
    # AC-20: Standard metadata — managed-by, instance, deletion-policy, ownerRef
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac20-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: std-metadata
              spec: {}
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: std-metadata
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-metadata
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              OWNER_KIND=$(kubectl get bucket std-metadata -n awss3bucket \
                -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null || echo "")
              OWNER_NAME=$(kubectl get bucket std-metadata -n awss3bucket \
                -o jsonpath='{.metadata.ownerReferences[0].name}' 2>/dev/null || echo "")
              [ "$OWNER_KIND" = "AWSS3Bucket" ] || { echo "FAIL: ownerRef kind=$OWNER_KIND"; exit 1; }
              [ "$OWNER_NAME" = "std-metadata" ] || { echo "FAIL: ownerRef name=$OWNER_NAME"; exit 1; }
              echo "OK: ownerRef kind=AWSS3Bucket name=std-metadata"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-21: Object ownership — default BucketOwnerEnforced
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac21-object-ownership-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: ownership-default
              spec: {}
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: ownership-default
              spec:
                objectOwnership: BucketOwnerEnforced
                ownershipControls:
                  rules:
                    - objectOwnership: BucketOwnerEnforced

    # ──────────────────────────────────────────────────────────────────────────
    # AC-22: Object ownership — instance override ObjectWriter
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac22-object-ownership-override
      try:
