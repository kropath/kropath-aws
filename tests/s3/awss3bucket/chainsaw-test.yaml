apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awss3bucket-public-datasets-exception
spec:
  steps:
    - name: apply-rgd-config-and-bucket
      try:
        - script:
            content: |
              kubectl apply -f ../../../rgds/awss3bucket.kropath.run.yaml
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSS3Config
              metadata:
                name: public-datasets
                namespace: default
              spec:
                mandatory: {}
                defaults: {}
              EOF
              kubectl patch awss3config public-datasets -n default --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - script:
            content: |
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: public-bucket
                namespace: default
              spec:
                configRef: public-datasets
                nameOverride: ""
                deletionPolicy: retain
                region: ""
                tags: {}
                syncedLabels: {}
                syncedAnnotations: {}
                encryption:
                  algorithm: ""
                  kmsKeyArn: ""
                  bucketKeyEnabled: true
                blockPublicAccess: false
                versioning: ""
                enforceHttpsOnly: false
                objectOwnership: BucketOwnerEnforced
              EOF
    - name: assert-public-access-exception
      try:
        - script:
            content: |
              python3 - <<'PY'
              import json, subprocess, time
              for _ in range(60):
                  proc = subprocess.run([
                      "kubectl", "get", "bucket", "public-bucket", "-n", "default", "-o", "json"
                  ], capture_output=True, text=True)
                  if proc.returncode == 0:
                      obj = json.loads(proc.stdout)
                      if obj["spec"].get("name") != "default-public-bucket-123456789012":
                          raise SystemExit("unexpected bucket name")
                      break
                  time.sleep(1)
              else:
                  raise SystemExit("timed out waiting for public-bucket")
              PY
