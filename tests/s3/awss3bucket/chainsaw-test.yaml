# aws-s3-02 Chainsaw tests — one sequential scenario group per acceptance area.
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awss3bucket
spec:
  steps:
    - name: bootstrap-rgd-and-config
      try:
        - script:
            content: |
              kubectl delete resourcegraphdefinition awss3bucket.kropath.run --ignore-not-found --wait=false
              kubectl delete crd awss3buckets.kropath.run --ignore-not-found --wait=false
              kubectl delete awss3config general-policy -n default --ignore-not-found --wait=false
              kubectl delete awss3bucket --all -n default --ignore-not-found --wait=false --force --grace-period=0
              kubectl delete bucket --all -n default --ignore-not-found --wait=false --force --grace-period=0
              kubectl apply -f ../../../rgds/awss3bucket.kropath.run.yaml
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSS3Config
              metadata:
                name: general-policy
                namespace: default
              spec:
                mandatory: {}
                defaults: {}
              EOF
              kubectl patch awss3config general-policy -n default --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    - name: core-bucket-apply
      try:
        - script:
            content: |
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: core-bucket
                namespace: default
              spec:
                configRef: general-policy
                nameOverride: ""
                deletionPolicy: retain
                region: ""
                tags: {}
                syncedLabels: {}
                syncedAnnotations: {}
                encryption:
                  algorithm: ""
                  kmsKeyArn: ""
                  bucketKeyEnabled: true
                blockPublicAccess: true
                versioning: ""
                enforceHttpsOnly: false
                objectOwnership: BucketOwnerEnforced
              EOF

    - name: core-bucket-assert
      try:
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: core-bucket
                namespace: default
              spec:
                encryption:
                  rules:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: aws:kms
                      bucketKeyEnabled: true
                publicAccessBlock:
                  blockPublicACLs: true
                  blockPublicPolicy: true
                  ignorePublicACLs: true
                  restrictPublicBuckets: true

    - name: core-bucket-cleanup
      try:
        - script:
            content: |
              kubectl delete bucket core-bucket -n default --ignore-not-found --wait=false --force --grace-period=0

    - name: naming-region-bucket-update-config
      try:
        - script:
            content: |
              kubectl patch awss3config general-policy -n default --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"Enabled","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":true,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - script:
            content: |
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: artifacts
                namespace: default
              spec:
                configRef: general-policy
                nameOverride: ""
                deletionPolicy: retain
                region: ap-southeast-2
                tags: {}
                syncedLabels: {}
                syncedAnnotations: {}
                encryption:
                  algorithm: ""
                  kmsKeyArn: ""
                  bucketKeyEnabled: true
                blockPublicAccess: false
                versioning: Suspended
                enforceHttpsOnly: false
                objectOwnership: BucketOwnerEnforced
              EOF

    - name: naming-region-bucket-assert
      try:
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: artifacts
                namespace: default
              status:
                resourceName: default-artifacts-123456789012
                namingStatus: valid
                predictedArn: arn:aws:s3:::default-artifacts-123456789012
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: artifacts
                namespace: default
              spec:
                createBucketConfiguration:
                  locationConstraint: ap-southeast-2
                versioning:
                  status: Enabled
                policy: '{"Statement":[{"Action":"s3:*","Condition":{"Bool":{"aws:SecureTransport":"false"}},"Effect":"Deny","Principal":"*","Resource":["arn:aws:s3:::default-artifacts-123456789012","arn:aws:s3:::default-artifacts-123456789012/*"],"Sid":"DenyNonTLSAccess"}],"Version":"2012-10-17"}'

    - name: naming-region-bucket-cleanup
      try:
        - script:
            content: |
              kubectl delete bucket artifacts -n default --ignore-not-found --wait=false --force --grace-period=0

    - name: tags-labels-bucket-update-config
      try:
        - script:
            content: |
              kubectl patch awss3config general-policy -n default --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{"environment":"production"},"syncedAnnotations":{"team":"data"}},"defaults":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{"team":"storage"},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{"runbook":"https://example.invalid"}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - script:
            content: |
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: tagged-bucket
                namespace: default
              spec:
                configRef: general-policy
                nameOverride: ""
                deletionPolicy: retain
                region: ""
                tags:
                  app: data-pipeline
                syncedLabels: {}
                syncedAnnotations: {}
                encryption:
                  algorithm: ""
                  kmsKeyArn: ""
                  bucketKeyEnabled: true
                blockPublicAccess: false
                versioning: ""
                enforceHttpsOnly: false
                objectOwnership: BucketOwnerEnforced
              EOF

    - name: tags-labels-bucket-assert
      try:
        - script:
            content: |
              python3 - <<'PY'
              import json, subprocess, sys
              raw = subprocess.check_output([
                  "kubectl", "get", "bucket", "tagged-bucket", "-n", "default", "-o", "json"
              ])
              obj = json.loads(raw)
              labels = obj["metadata"].get("labels", {})
              annotations = obj["metadata"].get("annotations", {})
              tagset = {item["key"]: item["value"] for item in obj["spec"]["tags"]}
              if labels.get("kropath.run/environment") != "production":
                  raise SystemExit("missing synced label environment")
              if labels.get("kropath.run/data-class") != "internal":
                  raise SystemExit("missing synced label data-class")
              if annotations.get("kropath.run/team") != "data":
                  raise SystemExit("missing synced annotation team")
              if annotations.get("kropath.run/runbook") != "https://example.invalid":
                  raise SystemExit("missing synced annotation runbook")
              for key, value in {
                  "cost-centre": "platform",
                  "team": "storage",
                  "app": "data-pipeline",
                  "environment": "production",
                  "data-class": "internal",
                  "runbook": "https://example.invalid",
              }.items():
                  if tagset.get(key) != value:
                      raise SystemExit(f"missing tag {key}={value}")
              PY

    - name: tags-labels-bucket-cleanup
      try:
        - script:
            content: |
              kubectl delete bucket tagged-bucket -n default --ignore-not-found --wait=false --force --grace-period=0

    - name: metadata-ownership-bucket-update-config
      try:
        - script:
            content: |
              kubectl patch awss3config general-policy -n default --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    - name: metadata-ownership-bucket-apply
      try:
        - script:
            content: |
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: locked-bucket
                namespace: default
              spec:
                configRef: general-policy
                nameOverride: ""
                deletionPolicy: delete
                region: ""
                tags: {}
                syncedLabels: {}
                syncedAnnotations: {}
                encryption:
                  algorithm: ""
                  kmsKeyArn: ""
                  bucketKeyEnabled: true
                blockPublicAccess: false
                versioning: ""
                enforceHttpsOnly: false
                objectOwnership: ObjectWriter
              EOF

    - name: metadata-ownership-bucket-assert
      try:
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: locked-bucket
                namespace: default
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: locked-bucket
                  kropath.run/environment: production
                  kropath.run/data-class: internal
                annotations:
                  services.k8s.aws/deletion-policy: delete
                  kropath.run/team: data
                  kropath.run/runbook: https://example.invalid
                ownerReferences:
                  - apiVersion: kropath.run/v1alpha1
                    kind: AWSS3Bucket
                    name: locked-bucket
                    controller: true
                    blockOwnerDeletion: true
              spec:
                ownershipControls:
                  rules:
                    - objectOwnership: ObjectWriter

    - name: metadata-ownership-bucket-cleanup
      try:
        - script:
            content: |
              kubectl delete bucket locked-bucket -n default --ignore-not-found --wait=false --force --grace-period=0
              kubectl delete awss3config general-policy -n default --ignore-not-found --wait=false
              kubectl delete crd awss3buckets.kropath.run --ignore-not-found --wait=false
              kubectl delete resourcegraphdefinition awss3bucket.kropath.run --ignore-not-found --wait=false
