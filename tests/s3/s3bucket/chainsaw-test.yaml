# aws-s3-02 Chainsaw tests — all 24 acceptance criteria.
# Namespace: s3bucket (fixed; naming template {namespace}-{name}-{account_id} expands predictably)
# accountId: 123456789012 | region: us-east-1
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3bucket
spec:
  # Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
  # skipDelete"): unique bucket name per step, delete nothing between steps; skipDelete stops
  # chainsaw's end-of-test cascade delete. No ACK controllers run, so deleting a kro S3Bucket
  # (→ ACK Bucket child) would hang on the never-cleared finalizer.
  skipDelete: true
  namespace: s3bucket
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Seed: create the namespace and the general-policy S3Config, then patch
    # status.effectiveConfig so the RGD can resolve governance values without
    # a live kropath-controller (mirrors tests/iam/cascade pattern).
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-effective-config
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 00-s3config.yaml
        - script:
            content: |
              kubectl patch s3config general-policy -n s3bucket \
                --subresource=status \
                --type=merge \
                --patch-file 00-s3config.yaml

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: Encryption — defaults apply (no mandatory, no instance encryption)
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-encryption-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: enc-defaults
              spec: {}
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: enc-defaults
              spec:
                name: s3bucket-enc-defaults-123456789012
                encryption:
                  rules:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: aws:kms
                        kmsMasterKeyID: alias/aws/s3
                      bucketKeyEnabled: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2: Encryption — mandatory wins over instance request for AES256
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac2-encryption-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: strict-encryption
                labels:
                  aws.kropath.run/resource-name: strict-encryption
              spec: {}
        - script:
            content: |
              kubectl patch s3config strict-encryption -n s3bucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"arn:aws:kms:ap-southeast-2:123456789012:key/mandatory-key","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: enc-mandatory
              spec:
                configRef: strict-encryption
                encryption:
                  algorithm: AES256
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: enc-mandatory
              spec:
                name: s3bucket-enc-mandatory-123456789012
                encryption:
                  rules:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: aws:kms
                        kmsMasterKeyID: arn:aws:kms:ap-southeast-2:123456789012:key/mandatory-key
                      bucketKeyEnabled: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-3: Encryption — instance wins over defaults
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-encryption-instance-wins-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: defaults-aes256
                labels:
                  aws.kropath.run/resource-name: defaults-aes256
              spec: {}
        - script:
            content: |
              kubectl patch s3config defaults-aes256 -n s3bucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"AES256","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: enc-instance
              spec:
                configRef: defaults-aes256
                encryption:
                  algorithm: aws:kms
                  kmsKeyArn: arn:aws:kms:us-east-1:123456789012:key/instance-key
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: enc-instance
              spec:
                name: s3bucket-enc-instance-123456789012
                encryption:
                  rules:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: aws:kms
                        kmsMasterKeyID: arn:aws:kms:us-east-1:123456789012:key/instance-key
                      bucketKeyEnabled: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-4: Public access — mandatory true wins over instance false
    # (false = "follow cascade" semantics; mandatory still enforces)
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac4-public-access-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: mandatory-block
                labels:
                  aws.kropath.run/resource-name: mandatory-block
              spec: {}
        - script:
            content: |
              kubectl patch s3config mandatory-block -n s3bucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: pub-mandatory
              spec:
                configRef: mandatory-block
                blockPublicAccess: false
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: pub-mandatory
              spec:
                publicAccessBlock:
                  blockPublicACLs: true
                  blockPublicPolicy: true
                  ignorePublicACLs: true
                  restrictPublicBuckets: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-5: Public access — defaults applied when instance not set
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac5-public-access-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: pub-defaults
              spec: {}
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: pub-defaults
              spec:
                publicAccessBlock:
                  blockPublicACLs: true
                  blockPublicPolicy: true
                  ignorePublicACLs: true
                  restrictPublicBuckets: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-6: Public access — exception via public-datasets profile
    # mandatory.blockPublicAccess=false + defaults.blockPublicAccess=false
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac6-public-access-exception
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: public-datasets
                labels:
                  aws.kropath.run/resource-name: public-datasets
              spec:
                mandatory:
                  blockPublicAccess: false
        - script:
            content: |
              kubectl patch s3config public-datasets -n s3bucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: pub-exception
              spec:
                configRef: public-datasets
                blockPublicAccess: false
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: pub-exception
              spec:
                publicAccessBlock:
                  blockPublicACLs: false
                  blockPublicPolicy: false
                  ignorePublicACLs: false
                  restrictPublicBuckets: false

    # ──────────────────────────────────────────────────────────────────────────
    # AC-7: Versioning — mandatory Enabled wins over instance Suspended
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac7-versioning-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: mandatory-versioning
                labels:
                  aws.kropath.run/resource-name: mandatory-versioning
              spec: {}
        - script:
            content: |
              kubectl patch s3config mandatory-versioning -n s3bucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"Enabled","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: ver-mandatory
              spec:
                configRef: mandatory-versioning
                versioning: Suspended
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: ver-mandatory
              spec:
                versioning:
                  status: Enabled

    # ──────────────────────────────────────────────────────────────────────────
    # AC-8: Versioning — no versioning when unset at all tiers
    # versioning.status="" is omitted by kro; ACK Bucket receives no explicit
    # versioning setting. Assert reconciliation succeeded and no value is set.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac8-versioning-none
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: ver-none
              spec: {}
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: ver-none
              spec:
                name: s3bucket-ver-none-123456789012
        - script:
            content: |
              STATUS=$(kubectl get buckets.s3.services.k8s.aws ver-none -n s3bucket \
                -o jsonpath='{.spec.versioning.status}' 2>/dev/null || echo "")
              if [ "$STATUS" = "Enabled" ] || [ "$STATUS" = "Suspended" ]; then
                echo "FAIL: versioning.status should be empty, got: $STATUS"
                exit 1
              fi
              echo "OK: versioning not explicitly set (status='$STATUS')"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-9: HTTPS enforcement — mandatory enforceHttpsOnly generates deny policy
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac9-https-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: mandatory-https
                labels:
                  aws.kropath.run/resource-name: mandatory-https
              spec: {}
        - script:
            content: |
              kubectl patch s3config mandatory-https -n s3bucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":true,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: https-mandatory
              spec:
                configRef: mandatory-https
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: https-mandatory
              spec:
                name: s3bucket-https-mandatory-123456789012
        - script:
            content: |
              POLICY=$(kubectl get buckets.s3.services.k8s.aws https-mandatory -n s3bucket \
                -o jsonpath='{.spec.policy}' 2>/dev/null || echo "")
              echo "Policy: $POLICY"
              echo "$POLICY" | grep -q "DenyNonTLSAccess" || { echo "FAIL: DenyNonTLSAccess not found"; exit 1; }
              echo "$POLICY" | grep -q "s3bucket-https-mandatory-123456789012" || { echo "FAIL: bucket name not in policy"; exit 1; }
              echo "$POLICY" | grep -q "aws:SecureTransport" || { echo "FAIL: SecureTransport not in policy"; exit 1; }
              echo "OK: HTTPS deny policy verified"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-10: HTTPS enforcement — no policy when enforceHttpsOnly=false everywhere
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac10-https-none
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: https-none
              spec: {}
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: https-none
              spec:
                name: s3bucket-https-none-123456789012
        - script:
            content: |
              POLICY=$(kubectl get buckets.s3.services.k8s.aws https-none -n s3bucket \
                -o jsonpath='{.spec.policy}' 2>/dev/null || echo "")
              if [ -n "$POLICY" ]; then
                echo "FAIL: policy should be empty, got: $POLICY"
                exit 1
              fi
              echo "OK: no HTTPS policy (enforceHttpsOnly=false everywhere)"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-11: Naming — default template {namespace}-{name}-{account_id}
    # namespace=s3bucket, name=naming-default, accountId=123456789012
    # → effectiveName = s3bucket-naming-default-123456789012
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac11-naming-default-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: naming-default
              spec: {}
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: naming-default
              spec:
                name: s3bucket-naming-default-123456789012
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: naming-default
              status:
                resourceName: s3bucket-naming-default-123456789012
                predictedArn: arn:aws:s3:::s3bucket-naming-default-123456789012
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-12: Naming — mandatory template corp-{namespace}-{name}
    # effectiveName = corp-s3bucket-naming-mandatory-tmpl
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac12-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: mandatory-naming
                labels:
                  aws.kropath.run/resource-name: mandatory-naming
              spec: {}
        - script:
            content: |
              kubectl patch s3config mandatory-naming -n s3bucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: naming-mandatory-tmpl
              spec:
                configRef: mandatory-naming
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: naming-mandatory-tmpl
              spec:
                name: corp-s3bucket-naming-mandatory-tmpl
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: naming-mandatory-tmpl
              status:
                resourceName: corp-s3bucket-naming-mandatory-tmpl
                predictedArn: arn:aws:s3:::corp-s3bucket-naming-mandatory-tmpl
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-13: Naming — spec.nameOverride bypasses template
    # effectiveName = my-custom-bucket
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac13-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: naming-override
              spec:
                nameOverride: my-custom-bucket
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: naming-override
              spec:
                name: my-custom-bucket
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: naming-override
              status:
                resourceName: my-custom-bucket
                predictedArn: arn:aws:s3:::my-custom-bucket
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-14: Naming — unresolved {tag.env} token → invalid-unresolved-tokens
    # template = {tag.env}-{name}; after {name} replacement: "{tag.env}-naming-invalid"
    # contains "{" → namingStatus = invalid-unresolved-tokens
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac14-naming-invalid-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: invalid-naming
                labels:
                  aws.kropath.run/resource-name: invalid-naming
              spec: {}
        - script:
            content: |
              kubectl patch s3config invalid-naming -n s3bucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: naming-invalid
              spec:
                configRef: invalid-naming
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: naming-invalid
              status:
                namingStatus: invalid-unresolved-tokens

    # ──────────────────────────────────────────────────────────────────────────
    # AC-15: Region — non-us-east-1 sets locationConstraint
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac15-region-non-us-east-1
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: region-non-us
              spec:
                region: ap-southeast-2
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: region-non-us
              spec:
                createBucketConfiguration:
                  locationConstraint: ap-southeast-2

    # ──────────────────────────────────────────────────────────────────────────
    # AC-16: Region — us-east-1 omits createBucketConfiguration
    # locationConstraint="" is omitted by kro (empty-string field omission).
    # Assert reconciliation succeeded; script verifies no constraint set.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac16-region-us-east-1
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: region-us
              spec:
                region: us-east-1
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: region-us
              spec:
                name: s3bucket-region-us-123456789012
        - script:
            content: |
              LOC=$(kubectl get buckets.s3.services.k8s.aws region-us -n s3bucket \
                -o jsonpath='{.spec.createBucketConfiguration.locationConstraint}' 2>/dev/null || echo "")
              if [ -n "$LOC" ] && [ "$LOC" != "<no value>" ]; then
                echo "FAIL: locationConstraint should be empty for us-east-1, got: $LOC"
                exit 1
              fi
