    # ──────────────────────────────────────────────────────────────────────────
    # AC-924-1: Region — effective region from S3Config sets locationConstraint
    # spec.region="" but S3Config.effectiveConfig.aws.region="ap-southeast-2"
    # → locationConstraint should be "ap-southeast-2" (not "" which caused KRO-920 drift)
