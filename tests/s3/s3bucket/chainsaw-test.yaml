        - script:
            # See AC-17 note above re: why a jq-based check is used here.
            content: |
              TAGGING=$(kubectl get buckets.s3.services.k8s.aws synced-labels -n s3bucket -o json | jq -c '.spec.tagging.tagSet')
              COUNT=$(echo "$TAGGING" | jq 'length')
              [ "$COUNT" -eq 2 ] || { echo "FAIL: expected 2 tags, got $COUNT: $TAGGING"; exit 1; }
              echo "$TAGGING" | jq -e 'any(.key == "environment" and .value == "production")' >/dev/null || { echo "FAIL: missing tag environment=production"; exit 1; }
              echo "$TAGGING" | jq -e 'any(.key == "data-class" and .value == "internal")' >/dev/null || { echo "FAIL: missing tag data-class=internal"; exit 1; }

