# Should be rejected: loggingEnabled set in both mandatory and defaults.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: invalid-logging-both-tiers
  namespace: kro-system
spec:
  mandatory:
    encryptionAlgorithm: ""
    kmsKeyArn: ""
    blockPublicAccess: false
    versioning: ""
    loggingEnabled: true
    logDeliveryBucket: ""
    enforceHttpsOnly: false
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAlgorithm: "aws:kms"
    kmsKeyArn: ""
    blockPublicAccess: true
    versioning: ""
    loggingEnabled: true
    logDeliveryBucket: ""
    enforceHttpsOnly: false
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: "{namespace}-{name}-{account_id}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
