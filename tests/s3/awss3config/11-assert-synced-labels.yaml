# Assert: synced labels propagate through effectiveConfig.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: general-policy
  namespace: kro-system
status:
  effectiveConfig:
    mandatory:
      syncedLabels:
        data-class: internal
    defaults:
      syncedLabels: {}
    aws:
      accountId: "123456789012"
      region: "us-east-1"
