# Assert: effectiveConfig reflects merged KropathConfig, global, and local profile values.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: general-policy
  namespace: payments-prod
status:
  effectiveConfig:
    mandatory:
      encryptionAlgorithm: "aws:kms"
      blockPublicAccess: true
      loggingEnabled: false
      logDeliveryBucket: ""
      objectLockMode: ""
      objectLockRetentionDays: 0
      namingTemplate: ""
      tags:
        cost-centre: infra
        resource-type: storage
      syncedLabels:
        data-class: internal
    defaults:
      encryptionAlgorithm: "aws:kms"
      blockPublicAccess: true
      namingTemplate: "{namespace}-{name}-{account_id}"
      tags:
        team: platform
    aws:
      accountId: "123456789012"
      region: "us-east-1"
