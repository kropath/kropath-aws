# aws-s3-01 Chainsaw tests for AWSS3Config.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awss3config
spec:
  steps:
    - name: ac1-crd-present
      try:
        - assert:
            file: 01-assert-crd-present.yaml

    - name: ac2-reject-both-tiers-encryption
      try:
        - apply:
            file: 02-invalid-both-tiers-encryption.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSS3Config
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-block-public-access
      try:
        - apply:
            file: 03-invalid-both-tiers-block-public-access.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSS3Config
                check:
                  ($error != null): true

    - name: ac7-reject-both-tiers-logging-enabled
      try:
        - apply:
            file: 04-invalid-both-tiers-logging-enabled.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSS3Config
                check:
                  ($error != null): true

    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 05-awss3config-general-policy.yaml
        - assert:
            file: 06-assert-general-policy.yaml

    - name: ac6-strict-profile-accepted
      try:
        - apply:
            file: 07-awss3config-strict.yaml
        - assert:
            file: 08-assert-strict.yaml
      cleanup:
        - delete:
            file: 07-awss3config-strict.yaml

    - name: ac8-public-datasets-profile-accepted
      try:
        - apply:
            file: 09-awss3config-public-datasets.yaml
        - assert:
            file: 10-assert-public-datasets.yaml
      cleanup:
        - delete:
            file: 09-awss3config-public-datasets.yaml

    - name: ac4-ac5-ac9-ac10-ac11-effectiveconfig-merged
      try:
        - apply:
            file: 05-awss3config-general-policy.yaml
        - apply:
            file: 11-payments-prod-namespace.yaml
        - apply:
            file: 12-awss3config-general-policy-payments-prod.yaml
        - script:
            content: |
              kubectl patch awss3config general-policy -n payments-prod \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{"cost-centre":"infra","resource-type":"storage"},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            file: 13-assert-effectiveconfig-merged.yaml
      cleanup:
        - delete:
            file: 12-awss3config-general-policy-payments-prod.yaml
        - delete:
            file: 11-payments-prod-namespace.yaml
        - delete:
            file: 05-awss3config-general-policy.yaml
