# Assert: controller-side effectiveConfig merge reflects the expected mandatory/default tiers.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: general-policy
  namespace: payments-prod
status:
  effectiveConfig:
    mandatory:
      encryptionAlgorithm: "aws:kms"
    defaults:
      encryptionAlgorithm: "aws:kms"
      blockPublicAccess: true
      namingTemplate: "{namespace}-{name}-{account_id}"
    aws:
      accountId: "123456789012"
      region: "us-east-1"
