# Assert: naming template propagates through effectiveConfig unchanged.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: general-policy
  namespace: kro-system
status:
  effectiveConfig:
    defaults:
      namingTemplate: "{namespace}-{name}-{account_id}"
    aws:
      accountId: "123456789012"
      region: "us-east-1"
