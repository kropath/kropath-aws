# Assert: mandatory and default tags are preserved in effectiveConfig.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: general-policy
  namespace: kro-system
status:
  effectiveConfig:
    mandatory:
      tags:
        cost-centre: infra
        resource-type: storage
    defaults:
      tags:
        team: platform
    aws:
      accountId: "123456789012"
      region: "us-east-1"
