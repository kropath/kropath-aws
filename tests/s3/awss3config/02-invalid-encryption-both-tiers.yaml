# Should be rejected: encryptionAlgorithm set in both mandatory and defaults.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: invalid-encryption-both-tiers
  namespace: kro-system
spec:
  mandatory:
    encryptionAlgorithm: "aws:kms"
    kmsKeyArn: ""
    blockPublicAccess: false
    versioning: ""
    loggingEnabled: false
    logDeliveryBucket: ""
    enforceHttpsOnly: false
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAlgorithm: "AES256"
    kmsKeyArn: ""
    blockPublicAccess: true
    versioning: ""
    loggingEnabled: false
    logDeliveryBucket: ""
    enforceHttpsOnly: false
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: "{namespace}-{name}-{account_id}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
