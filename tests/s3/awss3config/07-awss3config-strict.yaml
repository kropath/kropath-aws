apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: strict
  namespace: kro-system
spec:
  mandatory:
    encryptionAlgorithm: "aws:kms"
    kmsKeyArn: ""
    blockPublicAccess: true
    versioning: ""
    loggingEnabled: true
    logDeliveryBucket: "org-access-logs"
    enforceHttpsOnly: true
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAlgorithm: ""
    kmsKeyArn: ""
    blockPublicAccess: false
    versioning: ""
    loggingEnabled: false
    logDeliveryBucket: ""
    enforceHttpsOnly: false
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
