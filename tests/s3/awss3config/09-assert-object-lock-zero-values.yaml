# Assert: object lock fields remain zero-value when not enforced.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: general-policy
  namespace: kro-system
status:
  effectiveConfig:
    mandatory:
      objectLockMode: ""
      objectLockRetentionDays: 0
    defaults:
      objectLockMode: ""
      objectLockRetentionDays: 0
    aws:
      accountId: "123456789012"
      region: "us-east-1"
