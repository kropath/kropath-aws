# Local profile used to exercise controller-side effectiveConfig merging.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: general-policy
  namespace: payments-prod
spec:
  mandatory:
    encryptionAlgorithm: ""
    kmsKeyArn: ""
    blockPublicAccess: false
    versioning: ""
    loggingEnabled: false
    logDeliveryBucket: ""
    enforceHttpsOnly: false
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAlgorithm: "aws:kms"
    kmsKeyArn: ""
    blockPublicAccess: true
    versioning: ""
    loggingEnabled: false
    logDeliveryBucket: ""
    enforceHttpsOnly: false
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: "{namespace}-{name}-{account_id}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
