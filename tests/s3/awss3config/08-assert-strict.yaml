# Assert: strict profile carries mandatory logging, encryption, and HTTPS enforcement.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: strict
  namespace: kro-system
spec:
  mandatory:
    encryptionAlgorithm: "aws:kms"
    kmsKeyArn: ""
    blockPublicAccess: true
    versioning: ""
    loggingEnabled: true
    logDeliveryBucket: "org-access-logs"
    enforceHttpsOnly: true
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
