# Should be rejected: blockPublicAccess set to true in both mandatory and defaults.
apiVersion: kropath.run/v1alpha1
kind: AWSS3Config
metadata:
  name: invalid-block-public-access-both-tiers
  namespace: kro-system
spec:
  mandatory:
    encryptionAlgorithm: ""
    kmsKeyArn: ""
    blockPublicAccess: true
    versioning: ""
    loggingEnabled: false
    logDeliveryBucket: ""
    enforceHttpsOnly: false
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAlgorithm: "aws:kms"
    kmsKeyArn: ""
    blockPublicAccess: true
    versioning: ""
    loggingEnabled: false
    logDeliveryBucket: ""
    enforceHttpsOnly: false
    objectLockMode: ""
    objectLockRetentionDays: 0
    namingTemplate: "{namespace}-{name}-{account_id}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
