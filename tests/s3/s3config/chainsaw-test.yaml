# aws-s3-01 Chainsaw tests — all 11 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3config
spec:
  skipDelete: true
  namespace: s3config
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 04-s3config-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: general-policy
                namespace: s3config
              spec:
                defaults:
                  encryptionAlgorithm: aws:kms
                  blockPublicAccess: true
                  namingTemplate: "{namespace}-{name}-{account_id}"
    - name: ac2-reject-both-tiers-encryption
      try:
        - apply:
            file: 02-invalid-both-tiers-encryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: S3Config
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-block-public-access
      try:
        - apply:
            file: 03-invalid-both-tiers-block-public-access.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: S3Config
                check:
                  ($error != null): true

    - name: ac4-kropathconfig-wins-in-effectiveconfig
      try:
        - apply:
            file: 04-s3config-namespace.yaml
        - apply:
            file: 04-local-general-policy.yaml
        - script:
            content: |
              kubectl patch s3config general-policy -n s3config \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: general-policy
                namespace: s3config
              status:
                effectiveConfig:
                  mandatory:
                    encryptionAlgorithm: aws:kms
                  defaults:
                    encryptionAlgorithm: aws:kms
                    blockPublicAccess: true
                    namingTemplate: "{namespace}-{name}-{account_id}"
    - name: ac5-naming-template-propagates
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch s3config general-policy -n s3config \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: general-policy
                namespace: s3config
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}-{account_id}"
    - name: ac6-strict-accepts-logging-fields
      try:
        - apply:
            file: 06-strict.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: strict
                namespace: s3config
              spec:
                mandatory:
                  loggingEnabled: true
                  logDeliveryBucket: org-access-logs
    - name: ac7-reject-both-tiers-logging-enabled
      try:
        - apply:
            file: 07-invalid-both-tiers-logging-enabled.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: S3Config
                check:
                  ($error != null): true

    - name: ac8-public-datasets-accepts-bare-public-block-exception
      try:
        - apply:
            file: 08-public-datasets.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: public-datasets
                namespace: s3config
              spec:
                mandatory:
                  blockPublicAccess: false
    - name: ac9-zero-value-object-lock-passes-through
      try:
        - apply:
            file: 09-zero-object-lock.yaml
        - script:
            content: |
              kubectl patch s3config zero-object-lock -n s3config \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: zero-object-lock
                namespace: s3config
              status:
                effectiveConfig:
                  mandatory:
                    objectLockMode: ""
                    objectLockRetentionDays: 0
                  defaults:
                    objectLockMode: ""
                    objectLockRetentionDays: 0
    - name: ac10-tags-merge-and-kropathconfig-wins
      try:
        - apply:
            file: 10-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch s3config general-policy -n s3config \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{"resource-type":"storage","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: general-policy
                namespace: s3config
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      resource-type: storage
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform
    - name: ac11-synced-labels-propagate-through-effectiveconfig
      try:
        - apply:
            file: 11-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch s3config general-policy -n s3config \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: general-policy
                namespace: s3config
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: internal
        # Create the S3Bucket and seed the S3Config — no waiting in this script.
        - script:
            content: |
              kubectl apply -f ../../../tests/fixtures/crds/s3/
              kubectl apply -f ../../../rgds/s3bucket.yaml
              cat <<'EOF' | kubectl apply -f -
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Config
              metadata:
                name: general-policy
                namespace: s3config
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory: {}
                defaults: {}
              EOF
              kubectl patch s3config general-policy -n s3config --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAlgorithm":"","kmsKeyArn":"","blockPublicAccess":false,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"encryptionAlgorithm":"aws:kms","kmsKeyArn":"","blockPublicAccess":true,"versioning":"","loggingEnabled":false,"logDeliveryBucket":"","enforceHttpsOnly":false,"objectLockMode":"","objectLockRetentionDays":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              cat <<'EOF' | kubectl apply -f -
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3Bucket
              metadata:
                name: tagged-bucket
                namespace: s3config
              spec:
                configRef: general-policy
                nameOverride: ""
                deletionPolicy: retain
                region: ""
                tags:
                  app: data-pipeline
                syncedLabels: {}
                syncedAnnotations: {}
                encryption:
                  algorithm: ""
                  kmsKeyArn: ""
                  bucketKeyEnabled: true
                blockPublicAccess: false
                versioning: ""
                enforceHttpsOnly: false
                objectOwnership: BucketOwnerEnforced
              EOF
        # Use Chainsaw's built-in assert retry (AssertTimeout 30s) to wait for the ACK
        # Bucket to appear. The naming ConfigMap is an intermediate resource kro must
        # create before the Bucket, so the Bucket takes slightly longer to appear.
        - assert:
            resource:
              apiVersion: s3.services.k8s.aws/v1alpha1
              kind: Bucket
              metadata:
                name: tagged-bucket
                namespace: s3config
        # Bucket is confirmed present — run the label/tag verification immediately.
