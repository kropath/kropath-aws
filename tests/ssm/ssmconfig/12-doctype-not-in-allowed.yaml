---
# AC-12: mandatory.documentType: "Automation" and mandatory.allowedDocumentTypes: ["Command", "Policy"]
# The CRD allows this (no x-kubernetes-validation for this case — it's a controller concern).
# Controller sets status.conditions[type=Valid].status = False with reason InvalidDocumentTypeNotInAllowedList.
# Test simulates the controller condition via kubectl patch.
apiVersion: aws.kropath.run/v1alpha1
kind: SSMConfig
metadata:
  name: doctype-conflict
  namespace: ssmconfig
  labels:
    aws.kropath.run/resource-name: doctype-conflict
spec:
  mandatory:
    documentType: "Automation"
    allowedDocumentTypes:
      - "Command"
      - "Policy"
