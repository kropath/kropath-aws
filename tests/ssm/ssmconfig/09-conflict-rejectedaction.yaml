---
# AC-9: mandatory.rejectedPatchesAction: "BLOCK" AND defaults.rejectedPatchesAction: "ALLOW_AS_DEPENDENCY"
# Expected: Rejected with "rejectedPatchesAction cannot be set in both mandatory and defaults"
apiVersion: aws.kropath.run/v1alpha1
kind: SSMConfig
metadata:
  name: conflict-rejectedaction
  namespace: ssmconfig
  labels:
    aws.kropath.run/resource-name: conflict-rejectedaction
spec:
  mandatory:
    rejectedPatchesAction: "BLOCK"
  defaults:
    rejectedPatchesAction: "ALLOW_AS_DEPENDENCY"
