# aws-ssm-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ssmconfig
spec:
  skipDelete: true
  namespace: ssmconfig
  steps:
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-namespace.yaml

    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SSMConfig
              metadata:
                name: general-policy
                namespace: ssmconfig
              spec:
                defaults:
                  type: "String"
                  namingTemplate: "{namespace}-{name}"

    - name: ac1b-minimal-mandatory-only-accepted
      try:
        - apply:
            file: 15-minimal-mandatory-type.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SSMConfig
              metadata:
                name: minimal-secure
                namespace: ssmconfig
              spec:
                mandatory:
                  type: "SecureString"

    - name: ac2-reject-both-tiers-type
      try:
        - apply:
            file: 02-conflict-type.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SSMConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-tier
      try:
        - apply:
            file: 03-conflict-tier.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SSMConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-keyid
      try:
        - apply:
            file: 04-conflict-keyid.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SSMConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-documenttype
      try:
        - apply:
            file: 05-conflict-documenttype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SSMConfig
                check:
                  ($error != null): true

    - name: ac6-reject-both-tiers-alloweddoctypes
      try:
        - apply:
            file: 06-conflict-alloweddoctypes.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SSMConfig
                check:
                  ($error != null): true

    - name: ac7-reject-both-tiers-os
      try:
        - apply:
            file: 07-conflict-os.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SSMConfig
                check:
                  ($error != null): true

    - name: ac8-reject-both-tiers-compliancelevel
      try:
        - apply:
            file: 08-conflict-compliancelevel.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SSMConfig
                check:
                  ($error != null): true

    - name: ac9-reject-both-tiers-rejectedaction
      try:
        - apply:
            file: 09-conflict-rejectedaction.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SSMConfig
                check:
                  ($error != null): true

    - name: ac10-reject-both-tiers-nonsecurity
      try:
        - apply:
            file: 10-conflict-nonsecurity.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SSMConfig
                check:
                  ($error != null): true

    - name: ac11-effective-config-cascade
      try:
        - apply:
            file: 11-effective-config-cascade.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory.ssm.parameterType: "SecureString"
              # cascades into effectiveConfig.mandatory.type; defaults from SSMConfig are preserved.
              kubectl patch ssmconfig cascade-config -n ssmconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"type":"SecureString","tier":"","keyID":"","documentType":"","allowedDocumentTypes":[],"operatingSystem":"","approvedPatchesComplianceLevel":"","rejectedPatchesAction":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"type":"String","tier":"","keyID":"","documentType":"","allowedDocumentTypes":[],"operatingSystem":"","approvedPatchesComplianceLevel":"","rejectedPatchesAction":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SSMConfig
              metadata:
                name: cascade-config
                namespace: ssmconfig
              status:
                effectiveConfig:
                  mandatory:
                    type: "SecureString"
                  defaults:
                    type: "String"
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: "us-east-1"
                    accountId: "123456789012"
            timeout: 60s

    - name: ac12-doctype-not-in-allowed
      try:
        - apply:
            file: 12-doctype-not-in-allowed.yaml
        - script:
            content: |
              # Simulate controller validation: documentType "Automation" not in
              # allowedDocumentTypes ["Command", "Policy"].
              # Controller sets Valid condition to False with InvalidDocumentTypeNotInAllowedList.
              kubectl patch ssmconfig doctype-conflict -n ssmconfig \
                --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"False","reason":"InvalidDocumentTypeNotInAllowedList","message":"mandatory.documentType \"Automation\" is not in mandatory.allowedDocumentTypes [Command Policy]"}]}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SSMConfig
              metadata:
                name: doctype-conflict
                namespace: ssmconfig
              status:
                conditions:
                  - type: "Valid"
                    status: "False"
                    reason: "InvalidDocumentTypeNotInAllowedList"
            timeout: 60s

    - name: ac13-tags-merge
      try:
        - apply:
            file: 13-tags-merge.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory.tags merged with
              # SSMConfig mandatory.tags; SSMConfig defaults.tags preserved in defaults tier.
              kubectl patch ssmconfig tags-config -n ssmconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"type":"","tier":"","keyID":"","documentType":"","allowedDocumentTypes":[],"operatingSystem":"","approvedPatchesComplianceLevel":"","rejectedPatchesAction":"","namingTemplate":"","tags":{"team":"ops","cost-centre":"infrastructure"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"type":"String","tier":"","keyID":"","documentType":"","allowedDocumentTypes":[],"operatingSystem":"","approvedPatchesComplianceLevel":"","rejectedPatchesAction":"","namingTemplate":"{namespace}-{name}","tags":{"env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SSMConfig
              metadata:
                name: tags-config
                namespace: ssmconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      team: "ops"
                      cost-centre: "infrastructure"
                  defaults:
                    tags:
                      env: "dev"
            timeout: 60s

    - name: ac14-patching-profile-accepted
      try:
        - apply:
            file: 14-patching-profile.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SSMConfig
              metadata:
                name: patching
                namespace: ssmconfig
              spec:
                mandatory:
                  operatingSystem: "AMAZON_LINUX_2"
                defaults:
                  approvedPatchesComplianceLevel: "HIGH"
                  rejectedPatchesAction: "BLOCK"
