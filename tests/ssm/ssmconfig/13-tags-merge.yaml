---
# AC-13: SSMConfig with mandatory.tags and defaults.tags; KropathConfig with mandatory.tags.
# Controller merges: effectiveConfig.mandatory.tags = KropathConfig.mandatory.tags + SSMConfig.mandatory.tags
# Simulated via kubectl patch on status.
apiVersion: aws.kropath.run/v1alpha1
kind: SSMConfig
metadata:
  name: tags-config
  namespace: ssmconfig
  labels:
    aws.kropath.run/resource-name: tags-config
spec:
  mandatory:
    tags:
      team: "ops"
  defaults:
    type: "String"
    namingTemplate: "{namespace}-{name}"
    tags:
      env: "dev"
