---
# AC-1b: SSMConfig with only mandatory.type: "SecureString" — no explicit defaults section.
# Verifies that removing CRD scalar defaults does not cause spurious mutual-exclusion
# violations: K8s must NOT materialise defaults.type, so the cross-tier rule must not fire.
# Expected: CR accepted with no validation errors.
apiVersion: aws.kropath.run/v1alpha1
kind: SSMConfig
metadata:
  name: minimal-secure
  namespace: ssmconfig
  labels:
    aws.kropath.run/resource-name: minimal-secure
spec:
  mandatory:
    type: "SecureString"
