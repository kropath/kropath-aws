apiVersion: aws.kropath.run/v1alpha1
kind: AWSKMSConfig
metadata:
  name: dev
  namespace: awskmsconfig
spec:
  mandatory:
    enableKeyRotation: false
    keySpec: ""
    keyUsage: ""
    allowedKeySpecs: []
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    enableKeyRotation: true
    keySpec: ""
    keyUsage: ""
    allowedKeySpecs: []
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
