# aws-kms-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awskmsconfig
spec:
  namespace: awskmsconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-awskmsconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: awskmsconfig
              spec:
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-both-tiers-keyspec
      try:
        - apply:
            file: 02-invalid-both-tiers-keyspec.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKMSConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-rotation
      try:
        - apply:
            file: 03-invalid-both-tiers-rotation.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKMSConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-allowedkeys
      try:
        - apply:
            file: 04-invalid-both-tiers-allowedkeys.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKMSConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-keyusage
      try:
        - apply:
            file: 05-invalid-both-tiers-keyusage.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKMSConfig
                check:
                  ($error != null): true

    - name: ac6-effectiveconfig-merges-global-local-configs
      try:
        - apply:
            file: 00-awskmsconfig-namespace.yaml
        - apply:
            file: 06-global-kropathconfig.yaml
        - apply:
            file: 09-local-general-policy.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory wins; global + local AWSKMSConfig defaults merge
              kubectl patch awskmsconfig general-policy -n awskmsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":true,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{"cost-centre":"security","key-type":"encryption"},"syncedLabels":{"data-class":"restricted"},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: awskmsconfig
              status:
                effectiveConfig:
                  mandatory:
                    enableKeyRotation: true
                  defaults:
                    enableKeyRotation: true
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: "us-east-1"
                    accountId: "123456789012"
            timeout: 60s

    - name: ac7-naming-template-propagates
      try:
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: awskmsconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
            timeout: 60s

    - name: ac8-pci-profile-accepted
      try:
        - apply:
            file: 10-pci.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: pci
                namespace: awskmsconfig
              spec:
                mandatory:
                  enableKeyRotation: true
                  allowedKeySpecs:
                    - SYMMETRIC_DEFAULT
                    - RSA_4096
                  tags:
                    classification: pci
      cleanup:
        - delete:
            file: 10-pci.yaml

    - name: ac9-invalid-keyspec-not-in-allowed-list
      try:
        - apply:
            file: 11-invalid-pci.yaml
        - script:
            content: |
              # Simulate controller rejection: keySpec RSA_2048 not in allowedKeySpecs [SYMMETRIC_DEFAULT]
              kubectl patch awskmsconfig pci -n awskmsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"False","reason":"InvalidKeySpecNotInAllowedList","message":"keySpec RSA_2048 is not in allowedKeySpecs [SYMMETRIC_DEFAULT]"}]}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: pci
                namespace: awskmsconfig
              status:
                conditions:
                  - type: Valid
                    status: "False"
                    reason: InvalidKeySpecNotInAllowedList
            timeout: 60s
        - script:
            content: |
              set -eu
              valid_message="$(kubectl get awskmsconfig pci -n awskmsconfig -o jsonpath='{.status.conditions[?(@.type=="Valid")].message}')"
              test "$(kubectl get awskmsconfig pci -n awskmsconfig -o jsonpath='{.status.conditions[?(@.type=="Valid")].status}')" = "False"
              test "$(kubectl get awskmsconfig pci -n awskmsconfig -o jsonpath='{.status.conditions[?(@.type=="Valid")].reason}')" = "InvalidKeySpecNotInAllowedList"
              printf '%s' "${valid_message}" | grep -F "RSA_2048"
              printf '%s' "${valid_message}" | grep -F "SYMMETRIC_DEFAULT"
              test -z "$(kubectl get awskmsconfig pci -n awskmsconfig -o jsonpath='{.status.effectiveConfig}' 2>/dev/null)"
      cleanup:
        - delete:
            file: 11-invalid-pci.yaml

    - name: ac10-tags-merge-and-kropathconfig-wins
      try:
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: awskmsconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      cost-centre: security
                      key-type: encryption
                  defaults:
                    tags:
                      team: platform
            timeout: 60s

    - name: ac11-synced-labels-propagate-through-effectiveconfig
      try:
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: awskmsconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: restricted
            timeout: 60s
      cleanup:
        - delete:
            file: 09-local-general-policy.yaml
        - delete:
            file: 06-global-kropathconfig.yaml

    - name: ac12-dev-profile-accepts-zero-key-spec-and-empty-allowlist
      try:
        - apply:
            file: 12-dev.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: dev
                namespace: awskmsconfig
              spec:
                defaults:
                  enableKeyRotation: true
                  keySpec: ""
                  allowedKeySpecs: []
      cleanup:
        - delete:
            file: 12-dev.yaml
