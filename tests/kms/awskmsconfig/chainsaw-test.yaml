# aws-kms-01 Chainsaw tests — all 12 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awskmsconfig
spec:
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: ../../../profiles/kms/general-policy.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: kro-system
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
      cleanup:
        - delete:
            file: ../../../profiles/kms/general-policy.yaml

    - name: ac2-reject-both-tiers-keyspec
      try:
        - script:
            content: |
              set -euo pipefail
              cat <<'EOF' >/tmp/awskmsconfig-ac2.yaml
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: invalid-keyspec
                namespace: kro-system
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: false
                  keySpec: RSA_4096
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              set +e
              output="$(kubectl apply -f /tmp/awskmsconfig-ac2.yaml 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                echo "expected apply to fail"
                exit 1
              fi
              printf '%s\n' "$output" | grep -F "keySpec cannot be set in both mandatory and defaults"

    - name: ac3-reject-both-tiers-enable-key-rotation
      try:
        - script:
            content: |
              set -euo pipefail
              cat <<'EOF' >/tmp/awskmsconfig-ac3.yaml
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: invalid-rotation
                namespace: kro-system
              spec:
                mandatory:
                  enableKeyRotation: true
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              set +e
              output="$(kubectl apply -f /tmp/awskmsconfig-ac3.yaml 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                echo "expected apply to fail"
                exit 1
              fi
              printf '%s\n' "$output" | grep -F "enableKeyRotation cannot be set to true in both mandatory and defaults"

    - name: ac4-reject-both-tiers-allowed-key-specs
      try:
        - script:
            content: |
              set -euo pipefail
              cat <<'EOF' >/tmp/awskmsconfig-ac4.yaml
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: invalid-allowlist
                namespace: kro-system
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs:
                    - SYMMETRIC_DEFAULT
                    - RSA_4096
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs:
                    - SYMMETRIC_DEFAULT
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              set +e
              output="$(kubectl apply -f /tmp/awskmsconfig-ac4.yaml 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                echo "expected apply to fail"
                exit 1
              fi
              printf '%s\n' "$output" | grep -F "allowedKeySpecs cannot be set in both mandatory and defaults"

    - name: ac5-reject-both-tiers-key-usage
      try:
        - script:
            content: |
              set -euo pipefail
              cat <<'EOF' >/tmp/awskmsconfig-ac5.yaml
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: invalid-keyusage
                namespace: kro-system
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: SIGN_VERIFY
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              set +e
              output="$(kubectl apply -f /tmp/awskmsconfig-ac5.yaml 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                echo "expected apply to fail"
                exit 1
              fi
              printf '%s\n' "$output" | grep -F "keyUsage cannot be set in both mandatory and defaults"

    - name: ac6-kropathconfig-and-config-level-merge
      try:
        - script:
            content: |
              set -euo pipefail
              kubectl create namespace payments-prod --dry-run=client -o yaml | kubectl apply -f -
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSKropathConfig
              metadata:
                name: global-kms
                namespace: kro-system
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: ""
                  iam: {}
                  s3: {}
                  kms:
                    enableKeyRotation: true
                    allowedKeySpecs: []
                defaults:
                  tags:
                    team: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: ""
                  iam: {}
                  s3: {}
                  kms:
                    enableKeyRotation: false
                    allowedKeySpecs: []
                aws:
                  accountId: "123456789012"
                  region: "us-east-1"
              EOF
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: kro-system
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: payments-prod
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags:
                    service: billing
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl patch awskmsconfig general-policy -n payments-prod --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":true,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{"team":"platform","service":"billing"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl get awskmsconfig general-policy -n payments-prod -o json >/tmp/awskmsconfig-ac6.json
              python3 - <<'PY'
              import json
              with open('/tmp/awskmsconfig-ac6.json', 'r', encoding='utf-8') as fh:
                  obj = json.load(fh)
              eff = obj["status"]["effectiveConfig"]
              assert eff["mandatory"]["enableKeyRotation"] is True, eff
              assert eff["defaults"]["tags"] == {"team": "platform", "service": "billing"}, eff
              assert eff["defaults"]["namingTemplate"] == "{namespace}-{name}", eff
              PY

