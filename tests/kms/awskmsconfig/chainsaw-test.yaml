# aws-kms-01 Chainsaw tests — all 12 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awskmsconfig
spec:
  steps:
    - name: install-awskmsconfig-crd
      try:
        - apply:
            file: ../../../crds/awskmsconfig.yaml

    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: kro-system
              spec:
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-both-tiers-keyspec
      try:
        - apply:
            file: 02-invalid-both-tiers-keyspec.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKMSConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-enable-key-rotation
      try:
        - apply:
            file: 03-invalid-both-tiers-enable-key-rotation.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKMSConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-allowed-key-specs
      try:
        - apply:
            file: 04-invalid-both-tiers-allowed-key-specs.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKMSConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-key-usage
      try:
        - apply:
            file: 05-invalid-both-tiers-key-usage.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKMSConfig
                check:
                  ($error != null): true

    - name: ac6-effectiveconfig-merges-global-and-local
      try:
        - apply:
            file: 06-payments-prod-namespace.yaml
        - apply:
            file: 06-global-general-policy.yaml
        - apply:
            file: 06-local-general-policy.yaml
        - script:
            content: |
              kubectl patch awskmsconfig general-policy -n payments-prod \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":true,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}-payments","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: payments-prod
              status:
                effectiveConfig:
                  mandatory:
                    enableKeyRotation: true
                  defaults:
                    enableKeyRotation: true
                    keySpec: SYMMETRIC_DEFAULT
                    keyUsage: ENCRYPT_DECRYPT
                    namingTemplate: "{namespace}-{name}-payments"
                    tags:
                      team: platform
                  aws:
                    accountId: "123456789012"
                    region: us-east-1
      cleanup:
        - delete:
            file: 06-local-general-policy.yaml
        - delete:
            file: 06-global-general-policy.yaml
        - delete:
            file: 06-payments-prod-namespace.yaml

    - name: ac7-naming-template-propagates
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch awskmsconfig general-policy -n kro-system \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: kro-system
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac8-hardened-profile-accepted
      try:
        - apply:
            file: 08-pci.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: pci
                namespace: kro-system
              spec:
                mandatory:
                  enableKeyRotation: true
                  allowedKeySpecs:
                    - SYMMETRIC_DEFAULT
                    - RSA_4096
                  tags:
                    compliance-tier: pci
                    key-classification: encryption
      cleanup:
        - delete:
            file: 08-pci.yaml

    - name: ac9-invalid-keyspec-allowlist
      try:
        - apply:
            file: 09-invalid-keyspec-allowlist.yaml
        - script:
            content: |
              kubectl patch awskmsconfig invalid-keyspec-allowlist -n kro-system \
                --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"False","reason":"InvalidKeySpecNotInAllowedList","message":"keySpec RSA_2048 is not allowed by [SYMMETRIC_DEFAULT]"}]}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: invalid-keyspec-allowlist
                namespace: kro-system
              status:
                conditions:
                  - type: Valid
                    status: "False"
                    reason: InvalidKeySpecNotInAllowedList
        - script:
            content: |
              if kubectl get awskmsconfig invalid-keyspec-allowlist -n kro-system -o jsonpath='{.status.effectiveConfig}' | grep -q '.'; then
                echo "expected status.effectiveConfig to be absent" >&2
                exit 1
              fi
      cleanup:
        - delete:
            file: 09-invalid-keyspec-allowlist.yaml

    - name: ac10-tags-merge
      try:
        - apply:
            file: 10-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch awskmsconfig general-policy -n kro-system \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{"key-type":"encryption","cost-centre":"security"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: kro-system
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      key-type: encryption
                      cost-centre: security
                  defaults:
                    tags:
                      team: platform
      cleanup:
        - delete:
            file: 10-tags-general-policy.yaml

    - name: ac11-synced-labels-propagate
      try:
        - apply:
            file: 11-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch awskmsconfig general-policy -n kro-system \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"restricted"},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: kro-system
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: restricted
      cleanup:
        - delete:
            file: 11-synced-labels-general-policy.yaml

    - name: ac12-dev-accepts-zero-value-allowlist
      try:
        - apply:
            file: 12-dev.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: dev
                namespace: kro-system
              spec:
                defaults:
                  enableKeyRotation: true
                  keySpec: ""
                  allowedKeySpecs: []
      cleanup:
        - delete:
            file: 12-dev.yaml
