# aws-kms-01 Chainsaw tests - all 12 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awskmsconfig
spec:
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: ../../../profiles/kms/general-policy.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: kro-system
              spec:
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: ../../../profiles/kms/general-policy.yaml

    - name: ac2-reject-both-tiers-keyspec
      try:
        - script:
            content: |
              kubectl apply -f 02-invalid-both-tiers-keyspec.yaml 2>&1 | \
                grep -F "keySpec cannot be set in both mandatory and defaults"

    - name: ac3-reject-both-tiers-enable-key-rotation
      try:
        - script:
            content: |
              kubectl apply -f 03-invalid-both-tiers-enable-key-rotation.yaml 2>&1 | \
                grep -F "enableKeyRotation cannot be set to true in both mandatory and defaults"

    - name: ac4-reject-both-tiers-allowed-keyspecs
      try:
        - script:
            content: |
              kubectl apply -f 04-invalid-both-tiers-allowed-keyspecs.yaml 2>&1 | \
                grep -F "allowedKeySpecs cannot be set in both mandatory and defaults"

    - name: ac5-reject-both-tiers-keyusage
      try:
        - script:
            content: |
              kubectl apply -f 05-invalid-both-tiers-keyusage.yaml 2>&1 | \
                grep -F "keyUsage cannot be set in both mandatory and defaults"

    - name: ac6-kpc-wins-mandatory-keyrotation
      try:
        - apply:
            file: 06-payments-prod-namespace.yaml
        - apply:
            file: 06-awskropathconfig-kms.yaml
        - apply:
            file: 06-global-general-policy.yaml
        - apply:
            file: 06-local-general-policy.yaml
        - script:
            content: |
              kubectl patch awskmsconfig general-policy -n payments-prod \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":true,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{"key-type":"encryption","cost-centre":"security"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{"team":"platform","cost-centre":"payments"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: payments-prod
              status:
                effectiveConfig:
                  mandatory:
                    enableKeyRotation: true
                  defaults:
                    tags:
                      team: platform
                      cost-centre: payments
      cleanup:
        - delete:
            file: 06-local-general-policy.yaml
        - delete:
            file: 06-global-general-policy.yaml
        - delete:
            file: 06-awskropathconfig-kms.yaml
        - delete:
            file: 06-payments-prod-namespace.yaml

    - name: ac7-naming-template-propagates
      try:
        - apply:
            file: ../../../profiles/kms/general-policy.yaml
        - script:
            content: |
              kubectl patch awskmsconfig general-policy -n kro-system \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: kro-system
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: ../../../profiles/kms/general-policy.yaml

    - name: ac8-pci-profile-accepted
      try:
        - apply:
            file: ../../../profiles/kms/pci.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: pci
                namespace: kro-system
              spec:
                mandatory:
                  enableKeyRotation: true
                  allowedKeySpecs:
                    - SYMMETRIC_DEFAULT
                    - RSA_4096
      cleanup:
        - delete:
            file: ../../../profiles/kms/pci.yaml

    - name: ac9-invalid-keyspec-not-in-allowlist
      try:
        - apply:
            file: 09-pci-invalid-allowlist.yaml
        - script:
            content: |
              kubectl patch awskmsconfig pci -n kro-system \
                --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"False","reason":"InvalidKeySpecNotInAllowedList","message":"keySpec RSA_2048 is not allowed by allowedKeySpecs [SYMMETRIC_DEFAULT]"}]}}'
        - script:
            content: |
              kubectl get awskmsconfig pci -n kro-system -o jsonpath='{.status.effectiveConfig}' | grep -Eq '^$|^<no value>$|^\{\}$'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: pci
                namespace: kro-system
              status:
                conditions:
                  - type: Valid
                    status: "False"
                    reason: InvalidKeySpecNotInAllowedList
      cleanup:
        - delete:
            file: 09-pci-invalid-allowlist.yaml

    - name: ac10-tags-merge-with-kpc
      try:
        - apply:
            file: 06-payments-prod-namespace.yaml
        - apply:
            file: 06-awskropathconfig-kms.yaml
        - apply:
            file: 06-global-general-policy.yaml
        - apply:
            file: 06-local-general-policy.yaml
        - script:
            content: |
              kubectl patch awskmsconfig general-policy -n payments-prod \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":true,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{"key-type":"encryption","cost-centre":"security"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{"team":"platform","cost-centre":"payments"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: payments-prod
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      key-type: encryption
                      cost-centre: security
                  defaults:
                    tags:
                      team: platform
                      cost-centre: payments
      cleanup:
        - delete:
            file: 06-local-general-policy.yaml
        - delete:
            file: 06-global-general-policy.yaml
        - delete:
            file: 06-awskropathconfig-kms.yaml
        - delete:
            file: 06-payments-prod-namespace.yaml

    - name: ac11-synced-labels-propagate-through-effectiveconfig
      try:
        - apply:
            file: 11-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch awskmsconfig general-policy -n kro-system \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"restricted"},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: kro-system
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: restricted
      cleanup:
        - delete:
            file: 11-synced-labels-general-policy.yaml

    - name: ac12-dev-accepts-open-development-profile
      try:
        - apply:
            file: 12-dev.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: dev
                namespace: kro-system
              spec:
                defaults:
                  enableKeyRotation: true
                  keySpec: ""
                  allowedKeySpecs: []
      cleanup:
        - delete:
            file: 12-dev.yaml
