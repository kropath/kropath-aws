              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: naming
                namespace: naming-prod
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl patch awskmsconfig naming -n naming-prod --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl get awskmsconfig naming -n naming-prod -o json >/tmp/awskmsconfig-ac7.json
              python3 - <<'PY'
              import json
              with open('/tmp/awskmsconfig-ac7.json', 'r', encoding='utf-8') as fh:
                  obj = json.load(fh)
              assert obj["status"]["effectiveConfig"]["defaults"]["namingTemplate"] == "{namespace}-{name}", obj
              PY

    - name: ac8-pci-profile-accepted
      try:
        - apply:
            file: ../../../profiles/kms/pci.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: pci
                namespace: kro-system
              spec:
                mandatory:
                  enableKeyRotation: true
                  allowedKeySpecs:
                    - SYMMETRIC_DEFAULT
                    - RSA_4096
                  tags:
                    key-classification: pci
                    compliance-tier: restricted
      cleanup:
        - delete:
            file: ../../../profiles/kms/pci.yaml

    - name: ac9-invalid-keyspec-outside-allowlist
      try:
        - script:
            content: |
              set -euo pipefail
              kubectl create namespace secure-prod --dry-run=client -o yaml | kubectl apply -f -
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: pci
                namespace: secure-prod
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: RSA_2048
                  keyUsage: ""
                  allowedKeySpecs:
                    - SYMMETRIC_DEFAULT
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl patch awskmsconfig pci -n secure-prod --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"False","reason":"InvalidKeySpecNotInAllowedList","message":"keySpec RSA_2048 is not in allowedKeySpecs [SYMMETRIC_DEFAULT]"}]}}'
              kubectl get awskmsconfig pci -n secure-prod -o json >/tmp/awskmsconfig-ac9.json
              python3 - <<'PY'
              import json
              with open('/tmp/awskmsconfig-ac9.json', 'r', encoding='utf-8') as fh:
                  obj = json.load(fh)
              conditions = obj["status"]["conditions"]
              valid = next((c for c in conditions if c["type"] == "Valid"), None)
              assert valid is not None, obj
              assert valid["status"] == "False", obj
              assert valid["reason"] == "InvalidKeySpecNotInAllowedList", obj
              assert "effectiveConfig" not in obj.get("status", {}), obj
              PY

    - name: ac10-tags-merge-with-kropathconfig
      try:
        - script:
            content: |
              set -euo pipefail
              kubectl create namespace billing-prod --dry-run=client -o yaml | kubectl apply -f -
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSKropathConfig
              metadata:
                name: global-tags
                namespace: kro-system
              spec:
                mandatory:
                  tags:
                    cost-centre: security
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: ""
                  iam: {}
                  s3: {}
                  kms: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: ""
                  iam: {}
                  s3: {}
                  kms: {}
                aws:
                  accountId: "123456789012"
                  region: "us-east-1"
              EOF
              cat <<'EOF' | kubectl apply -f -
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: general-policy
                namespace: billing-prod
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags:
                    key-type: encryption
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
              EOF
              kubectl patch awskmsconfig general-policy -n billing-prod --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{"key-type":"encryption","cost-centre":"security"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
              kubectl get awskmsconfig general-policy -n billing-prod -o json >/tmp/awskmsconfig-ac10.json
              python3 - <<'PY'
              import json
              with open('/tmp/awskmsconfig-ac10.json', 'r', encoding='utf-8') as fh:
                  obj = json.load(fh)
              eff = obj["status"]["effectiveConfig"]
              assert eff["mandatory"]["tags"] == {"key-type": "encryption", "cost-centre": "security"}, obj
              assert eff["defaults"]["tags"] == {"team": "platform"}, obj
              PY

    - name: ac11-synced-labels-flow-through-effective-config
