        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-immutable-usage
              spec:
                keyUsage: SIGN_VERIFY
        - script:
            content: |
              echo "PASS: keyUsage SIGN_VERIFY stored correctly; immutability enforced by ACK at AWS API layer (not testable in local cluster)"


    # ──────────────────────────────────────────────────────────────────────────
    # KRO-222: externalRef uses selector.matchLabels; rsrcCfg becomes a list.
    # Verifies that naming template from a labelled config is applied correctly.
    # ──────────────────────────────────────────────────────────────────────────
    - name: kro222-configref-labelselector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSConfig
              metadata:
                name: kro222-kms-config
                labels:
                  aws.kropath.run/resource-name: kro222-kms-config
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: "kro222-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch kmsconfig kro222-kms-config -n kmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"kro222-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: kro222-key
              spec:
                configRef: kro222-kms-config
                createAlias: false
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: kro222-key-naming
              data:
                effectiveName: kro222-kro222-key

