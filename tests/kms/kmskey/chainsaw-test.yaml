# aws-kms-02 Chainsaw tests — one scenario per acceptance criterion.
# Namespace: kmskey (fixed; {namespace}-{name} template expands predictably).
# accountId: 123456789012 | region: us-east-1
# Effective config is injected via kubectl patch --subresource=status to simulate
# kropath-controller (which is not running in the local test cluster).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kmskey
spec:
  # Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
  # skipDelete"): unique key name per step, delete nothing between steps; skipDelete stops
  # chainsaw's end-of-test cascade delete. No ACK controllers run, so deleting a kro KMSKey
  # (→ ACK Key child) would hang on the never-cleared finalizer.
  skipDelete: true
  namespace: kmskey
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Seed: namespace + general-policy KMSConfig with effectiveConfig patched
    # in so the RGD can resolve governance values without a live controller.
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-general-policy
      try:
        - apply:
            file: 00-kmskey-namespace.yaml
        - apply:
            file: 01-general-policy-config.yaml
        - script:
            content: |
              kubectl patch kmsconfig general-policy -n kmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: defaults.keySpec / defaults.keyUsage / defaults.enableKeyRotation
    #       applied when instance spec is empty.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-defaults-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-defaults
              spec: {}
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-defaults
              spec:
                keySpec: SYMMETRIC_DEFAULT
                keyUsage: ENCRYPT_DECRYPT
                enableKeyRotation: true
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-defaults
              status:
                resourceName: kmskey-key-defaults
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2 / AC-5: instance keySpec and keyUsage override defaults;
    #              enableKeyRotation falls through to defaults when instance
    #              does not set it (boolean zero-value sentinel).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac2-instance-override-keyspec-keyusage
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-rsa
              spec:
                keySpec: RSA_4096
                keyUsage: SIGN_VERIFY
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-rsa
              spec:
                keySpec: RSA_4096
                keyUsage: SIGN_VERIFY
                enableKeyRotation: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-3 / AC-4: mandatory.keySpec and mandatory.enableKeyRotation win over
    #              instance overrides.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-mandatory-wins-keyspec-rotation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSConfig
              metadata:
                name: mandatory-symmetric
                labels:
                  aws.kropath.run/resource-name: mandatory-symmetric
              spec:
                mandatory:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch kmsconfig mandatory-symmetric -n kmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-mandatory-wins
              spec:
                configRef: mandatory-symmetric
                keySpec: RSA_4096
                keyUsage: SIGN_VERIFY
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-mandatory-wins
              spec:
                keySpec: SYMMETRIC_DEFAULT
                keyUsage: ENCRYPT_DECRYPT
                enableKeyRotation: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-6: spec.policy (raw JSON) is set directly on the ACK Key.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac6-policy-raw
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-policy-raw
              spec:
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:root"},"Action":"kms:*","Resource":"*"}]}'
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-policy-raw
              spec:
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:root"},"Action":"kms:*","Resource":"*"}]}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-7: spec.keyPolicyRef resolves via PolicyDocument selector and the
    #       documentJSON is placed on the ACK Key spec.policy.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac7-policy-ref
      try:
        - apply:
            file: 02-policy-document.yaml
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-policy-ref
              spec:
                keyPolicyRef: kms-key-policy
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-policy-ref
              spec:
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:root"},"Action":"kms:*","Resource":"*"}]}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-8: spec.policy and spec.keyPolicyRef mutually exclusive — kro surfaces the
    #       error in status.validationError (advisory pattern; admission-time CEL not
    #       available via kro v0.9.2; keySpec/keyUsage immutability enforced by ACK).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac8-policy-both-rejected
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-policy-both
              spec:
                policy: '{"Version":"2012-10-17"}'
                keyPolicyRef: kms-key-policy
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-policy-both
              status:
                validationError: "spec.policy and spec.keyPolicyRef are mutually exclusive — set exactly one"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-9: createAlias=true + empty aliasName → alias name derived from
    #       effectiveName ({namespace}-{name}).
    # AC-11 (aliasArn): status.aliasArn is predictable when alias is created.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac9-alias-derived-from-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: alias-derived
              spec:
                createAlias: true
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Alias
              metadata:
                name: alias-derived
              spec:
                name: alias/kmskey-alias-derived
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: alias-derived
              status:
                aliasArn: "arn:aws:kms:us-east-1:123456789012:alias/kmskey-alias-derived"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-10: spec.aliasName non-empty → "alias/<aliasName>" used directly.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac10-alias-custom-name
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: alias-custom
              spec:
                aliasName: my-custom-alias
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Alias
              metadata:
                name: alias-custom
              spec:
                name: alias/my-custom-alias
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: alias-custom
              status:
                aliasArn: "arn:aws:kms:us-east-1:123456789012:alias/my-custom-alias"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-11: createAlias=false → no ACK Alias CR is created.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac11-no-alias
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-no-alias
              spec:
                createAlias: false
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-no-alias
        - script:
            content: |
              # Alias must NOT exist; if it does the test fails.
              if kubectl get aliases.kms.services.k8s.aws key-no-alias -n kmskey 2>/dev/null; then
                echo "ERROR: ACK Alias CR should not have been created"; exit 1
              fi
              echo "PASS: no Alias CR created"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-12: defaults.namingTemplate "{namespace}-{name}" → effectiveName is
    #        "kmskey-<cr-name>"; namingStatus is "valid".
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac12-naming-defaults-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: naming-default
              spec: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: naming-default
              status:
                resourceName: kmskey-naming-default
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-13: mandatory.namingTemplate overrides defaults.namingTemplate.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac13-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSConfig
              metadata:
                name: corp-naming
                labels:
                  aws.kropath.run/resource-name: corp-naming
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: "corp-{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch kmsconfig corp-naming -n kmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: naming-mandatory
              spec:
                configRef: corp-naming
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: naming-mandatory
              status:
                resourceName: corp-kmskey-naming-mandatory
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-14: spec.nameOverride bypasses the naming template entirely.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac14-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: naming-override
              spec:
                nameOverride: my-special-key
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: naming-override
              status:
                resourceName: my-special-key
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-15: Unresolvable template token → namingStatus = "invalid-unresolved-tokens".
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac15-naming-invalid-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSConfig
              metadata:
                name: badtpl-naming
                labels:
                  aws.kropath.run/resource-name: badtpl-naming
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{tag.env}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch kmsconfig badtpl-naming -n kmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: naming-badtpl
              spec:
                configRef: badtpl-naming
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: naming-badtpl
              status:
                namingStatus: invalid-unresolved-tokens

    # ──────────────────────────────────────────────────────────────────────────
    # AC-16: Three-tier tag merge — mandatory wins on collision;
    # Trace (defaults→spec→mandatory, each merge puts right-map keys first):
    #   defaults.tags={env:prod}
    #   .merge(spec.tags={cost-centre:billing,app:payments})
    #     → {cost-centre:billing, app:payments, env:prod}
    #   .merge(mandatory.tags={cost-centre:security})
    #     → {cost-centre:security, app:payments, env:prod}   ← mandatory wins
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac16-tags-three-tier-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSConfig
              metadata:
                name: tags-policy
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags:
                    cost-centre: security
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch kmsconfig tags-policy -n kmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{"cost-centre":"security"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-tags
              spec:
                configRef: tags-policy
                tags:
                  cost-centre: billing
                  app: payments
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-tags
              spec: {}
        - script:
            # Order-independent tag check via jq — chainsaw's assertion engine does not
            # support CEL's .exists(); a per-item list assert is positional and flakes on
            # CEL map-iteration order (see docs/frequent-rgd-errors.md §6).
            content: |
              TAGS=$(kubectl get keys.kms.services.k8s.aws key-tags -n kmskey -o json | jq -c '.spec.tags')
              COUNT=$(echo "$TAGS" | jq 'length')
              [ "$COUNT" -eq 3 ] || { echo "FAIL: expected 3 tags, got $COUNT: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.tagKey == "cost-centre" and .tagValue == "security")' >/dev/null || { echo "FAIL: missing tag cost-centre=security"; exit 1; }
              echo "$TAGS" | jq -e 'any(.tagKey == "app" and .tagValue == "payments")' >/dev/null || { echo "FAIL: missing tag app=payments"; exit 1; }
              echo "$TAGS" | jq -e 'any(.tagKey == "env" and .tagValue == "prod")' >/dev/null || { echo "FAIL: missing tag env=prod"; exit 1; }
              # Verify mandatory wins: cost-centre must be "security", not "billing"
              actual=$(kubectl get keys.kms.services.k8s.aws key-tags -n kmskey \
                -o jsonpath='{.spec.tags[?(@.tagKey=="cost-centre")].tagValue}')
              if [ "$actual" != "security" ]; then
                echo "ERROR: mandatory tag did not win; got cost-centre=$actual, want security"
                exit 1
              fi
              echo "PASS: mandatory tag cost-centre=security wins over instance cost-centre=billing"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-17: syncedLabels dual-write — applied to Key metadata.labels with
    #        "kropath.run/" prefix AND to spec.tags without prefix.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac17-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSConfig
              metadata:
                name: synced-labels-policy
                labels:
                  aws.kropath.run/resource-name: synced-labels-policy
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels:
                    environment: production
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch kmsconfig synced-labels-policy -n kmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-synced
              spec:
                configRef: synced-labels-policy
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-synced
                labels:
                  kropath.run/environment: production
              spec: {}
        - script:
            content: |
              TAGS=$(kubectl get keys.kms.services.k8s.aws key-synced -n kmskey -o json | jq -c '.spec.tags')
              COUNT=$(echo "$TAGS" | jq 'length')
              [ "$COUNT" -eq 1 ] || { echo "FAIL: expected 1 tag, got $COUNT: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.tagKey == "environment" and .tagValue == "production")' >/dev/null || { echo "FAIL: missing tag environment=production"; exit 1; }

    # ──────────────────────────────────────────────────────────────────────────
    # AC-18: ACK Key CR carries standard kropath metadata.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac18-standard-metadata-key
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-metadata
              spec: {}
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-metadata
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: key-metadata
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-19: ACK Alias CR carries the same standard kropath metadata.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac19-standard-metadata-alias
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: alias-metadata
              spec:
                createAlias: true
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Alias
              metadata:
                name: alias-metadata
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: alias-metadata
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-20: deletionPolicy=delete sets annotation on Key and Alias CRs.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac20-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-delete-policy
              spec:
                deletionPolicy: delete
                createAlias: true
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-delete-policy
                annotations:
                  services.k8s.aws/deletion-policy: delete
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Alias
              metadata:
                name: key-delete-policy
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # ──────────────────────────────────────────────────────────────────────────
    # AC-21: deletionPolicy=retain (default) sets annotation accordingly.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac21-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-retain-policy
              spec:
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-retain-policy
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # ──────────────────────────────────────────────────────────────────────────
    # AC-22: spec.keySpec is immutable after creation — enforced by ACK at the AWS
    #        API layer. Not enforceable at Kubernetes admission time via kro v0.9.2.
    #        Test verifies the initial value is stored and surfaced correctly.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac22-keyspec-immutable
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-immutable-spec
              spec:
                keySpec: RSA_4096
                keyUsage: SIGN_VERIFY
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: key-immutable-spec
              spec:
                keySpec: RSA_4096
        - script:
            content: |
              echo "PASS: keySpec RSA_4096 stored correctly; immutability enforced by ACK at AWS API layer (not testable in local cluster)"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-23: spec.keyUsage is immutable after creation — enforced by ACK at the AWS
    #        API layer. Not enforceable at Kubernetes admission time via kro v0.9.2.
    #        Test verifies the initial value is stored and surfaced correctly.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac23-keyusage-immutable
