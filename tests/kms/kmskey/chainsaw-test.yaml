    # Verifies has(mandatory) + ?keySpec.orValue("") guards.
    # ──────────────────────────────────────────────────────────────────────────
    - name: kro899-zero-value-pruned-mandatory-fields
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSConfig
              metadata:
                name: kro899-kms-cfg
                namespace: kmskey
                labels:
                  aws.kropath.run/resource-name: kro899-kms-cfg
              spec: {}
        - script:
            content: |
              kubectl patch kmsconfig kro899-kms-cfg -n kmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KMSKey
              metadata:
                name: kro899-key
              spec:
                configRef: kro899-kms-cfg
                createAlias: false
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: kro899-key
              spec:
                keySpec: SYMMETRIC_DEFAULT
                keyUsage: ENCRYPT_DECRYPT
                enableKeyRotation: true
                namingStatus: valid
