# aws-kms-02 Chainsaw tests — one scenario per acceptance criterion.
# Namespace: awskmskey (fixed; {namespace}-{name} template expands predictably).
# accountId: 123456789012 | region: us-east-1
# Effective config is injected via kubectl patch --subresource=status to simulate
# kropath-controller (which is not running in the local test cluster).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awskmskey
spec:
  namespace: awskmskey
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Seed: namespace + general-policy AWSKMSConfig with effectiveConfig patched
    # in so the RGD can resolve governance values without a live controller.
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-general-policy
      try:
        - apply:
            file: 00-awskmskey-namespace.yaml
        - apply:
            file: 01-general-policy-config.yaml
        - script:
            content: |
              kubectl patch awskmsconfig general-policy -n awskmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: defaults.keySpec / defaults.keyUsage / defaults.enableKeyRotation
    #       applied when instance spec is empty.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-defaults-cascade
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-defaults
              spec: {}
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-defaults
              spec:
                keySpec: SYMMETRIC_DEFAULT
                keyUsage: ENCRYPT_DECRYPT
                enableKeyRotation: true
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-defaults
              status:
                resourceName: awskmskey-key-defaults
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2 / AC-5: instance keySpec and keyUsage override defaults;
    #              enableKeyRotation falls through to defaults when instance
    #              does not set it (boolean zero-value sentinel).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac2-instance-override-keyspec-keyusage
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-rsa
              spec:
                keySpec: RSA_4096
                keyUsage: SIGN_VERIFY
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-rsa
              spec:
                keySpec: RSA_4096
                keyUsage: SIGN_VERIFY
                enableKeyRotation: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-3 / AC-4: mandatory.keySpec and mandatory.enableKeyRotation win over
    #              instance overrides.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-mandatory-wins-keyspec-rotation
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: mandatory-symmetric
              spec:
                mandatory:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch awskmsconfig mandatory-symmetric -n awskmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-mandatory-wins
              spec:
                configRef: mandatory-symmetric
                keySpec: RSA_4096
                keyUsage: SIGN_VERIFY
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-mandatory-wins
              spec:
                keySpec: SYMMETRIC_DEFAULT
                keyUsage: ENCRYPT_DECRYPT
                enableKeyRotation: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-6: spec.policy (raw JSON) is set directly on the ACK Key.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac6-policy-raw
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-policy-raw
              spec:
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:root"},"Action":"kms:*","Resource":"*"}]}'
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-policy-raw
              spec:
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:root"},"Action":"kms:*","Resource":"*"}]}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-7: spec.keyPolicyRef resolves via AWSPolicyDocument selector and the
    #       documentJSON is placed on the ACK Key spec.policy.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac7-policy-ref
      try:
        - apply:
            file: 02-policy-document.yaml
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-policy-ref
              spec:
                keyPolicyRef: kms-key-policy
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-policy-ref
              spec:
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:root"},"Action":"kms:*","Resource":"*"}]}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-8: spec.policy and spec.keyPolicyRef mutually exclusive — admission
    #       must reject the object.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac8-policy-both-rejected
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-policy-both
              spec:
                policy: '{"Version":"2012-10-17"}'
                keyPolicyRef: kms-key-policy
            expect:
              - check:
                  ($error != null): true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-9: createAlias=true + empty aliasName → alias name derived from
    #       effectiveName ({namespace}-{name}).
    # AC-11 (aliasArn): status.aliasArn is predictable when alias is created.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac9-alias-derived-from-naming
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: alias-derived
              spec:
                createAlias: true
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Alias
              metadata:
                name: alias-derived
              spec:
                name: alias/awskmskey-alias-derived
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: alias-derived
              status:
                aliasArn: "arn:aws:kms:us-east-1:123456789012:alias/awskmskey-alias-derived"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-10: spec.aliasName non-empty → "alias/<aliasName>" used directly.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac10-alias-custom-name
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: alias-custom
              spec:
                aliasName: my-custom-alias
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Alias
              metadata:
                name: alias-custom
              spec:
                name: alias/my-custom-alias
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: alias-custom
              status:
                aliasArn: "arn:aws:kms:us-east-1:123456789012:alias/my-custom-alias"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-11: createAlias=false → no ACK Alias CR is created.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac11-no-alias
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-no-alias
              spec:
                createAlias: false
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-no-alias
        - script:
            content: |
              # Alias must NOT exist; if it does the test fails.
              if kubectl get aliases.kms.services.k8s.aws key-no-alias -n awskmskey 2>/dev/null; then
                echo "ERROR: ACK Alias CR should not have been created"; exit 1
              fi
              echo "PASS: no Alias CR created"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-12: defaults.namingTemplate "{namespace}-{name}" → effectiveName is
    #        "awskmskey-<cr-name>"; namingStatus is "valid".
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac12-naming-defaults-template
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: naming-default
              spec: {}
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: naming-default
              status:
                resourceName: awskmskey-naming-default
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-13: mandatory.namingTemplate overrides defaults.namingTemplate.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac13-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: corp-naming
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: "corp-{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch awskmsconfig corp-naming -n awskmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: naming-mandatory
              spec:
                configRef: corp-naming
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: naming-mandatory
              status:
                resourceName: corp-awskmskey-naming-mandatory
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-14: spec.nameOverride bypasses the naming template entirely.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac14-naming-override
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: naming-override
              spec:
                nameOverride: my-special-key
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: naming-override
              status:
                resourceName: my-special-key
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-15: Unresolvable template token → namingStatus = "invalid-unresolved-tokens".
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac15-naming-invalid-template
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: badtpl-naming
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{tag.env}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch awskmsconfig badtpl-naming -n awskmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: naming-badtpl
              spec:
                configRef: badtpl-naming
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: naming-badtpl
              status:
                namingStatus: invalid-unresolved-tokens

    # ──────────────────────────────────────────────────────────────────────────
    # AC-16: Three-tier tag merge — mandatory wins on collision;
    # Trace (defaults→spec→mandatory, each merge puts right-map keys first):
    #   defaults.tags={env:prod}
    #   .merge(spec.tags={cost-centre:billing,app:payments})
    #     → {cost-centre:billing, app:payments, env:prod}
    #   .merge(mandatory.tags={cost-centre:security})
    #     → {cost-centre:security, app:payments, env:prod}   ← mandatory wins
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac16-tags-three-tier-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: tags-policy
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags:
                    cost-centre: security
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch awskmsconfig tags-policy -n awskmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{"cost-centre":"security"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-tags
              spec:
                configRef: tags-policy
                tags:
                  cost-centre: billing
                  app: payments
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-tags
              spec:
                tags:
                  - key: cost-centre
                    value: security
                  - key: app
                    value: payments
                  - key: env
                    value: prod
        - script:
            content: |
              # Verify mandatory wins: cost-centre must be "security", not "billing"
              actual=$(kubectl get keys.kms.services.k8s.aws key-tags -n awskmskey \
                -o jsonpath='{.spec.tags[?(@.key=="cost-centre")].value}')
              if [ "$actual" != "security" ]; then
                echo "ERROR: mandatory tag did not win; got cost-centre=$actual, want security"
                exit 1
              fi
              echo "PASS: mandatory tag cost-centre=security wins over instance cost-centre=billing"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-17: syncedLabels dual-write — applied to Key metadata.labels with
    #        "kropath.run/" prefix AND to spec.tags without prefix.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac17-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSConfig
              metadata:
                name: synced-labels-policy
              spec:
                mandatory:
                  enableKeyRotation: false
                  keySpec: ""
                  keyUsage: ""
                  allowedKeySpecs: []
                  namingTemplate: ""
                  tags: {}
                  syncedLabels:
                    environment: production
                  syncedAnnotations: {}
                defaults:
                  enableKeyRotation: true
                  keySpec: SYMMETRIC_DEFAULT
                  keyUsage: ENCRYPT_DECRYPT
                  allowedKeySpecs: []
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch awskmsconfig synced-labels-policy -n awskmskey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"enableKeyRotation":false,"keySpec":"","keyUsage":"","allowedKeySpecs":[],"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"enableKeyRotation":true,"keySpec":"SYMMETRIC_DEFAULT","keyUsage":"ENCRYPT_DECRYPT","allowedKeySpecs":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-synced
              spec:
                configRef: synced-labels-policy
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-synced
                labels:
                  kropath.run/environment: production
              spec:
                tags:
                  - key: environment
                    value: production

    # ──────────────────────────────────────────────────────────────────────────
    # AC-18: ACK Key CR carries standard kropath metadata.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac18-standard-metadata-key
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-metadata
              spec: {}
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-metadata
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: key-metadata
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-19: ACK Alias CR carries the same standard kropath metadata.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac19-standard-metadata-alias
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: alias-metadata
              spec:
                createAlias: true
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Alias
              metadata:
                name: alias-metadata
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: alias-metadata
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-20: deletionPolicy=delete sets annotation on Key and Alias CRs.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac20-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-delete-policy
              spec:
                deletionPolicy: delete
                createAlias: true
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-delete-policy
                annotations:
                  services.k8s.aws/deletion-policy: delete
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Alias
              metadata:
                name: key-delete-policy
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # ──────────────────────────────────────────────────────────────────────────
    # AC-21: deletionPolicy=retain (default) sets annotation accordingly.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac21-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-retain-policy
              spec:
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: key-retain-policy
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # ──────────────────────────────────────────────────────────────────────────
    # AC-22: spec.keySpec is immutable after creation — update must be rejected.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac22-keyspec-immutable
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-immutable-spec
              spec:
                keySpec: RSA_4096
                keyUsage: SIGN_VERIFY
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-immutable-spec
              spec:
                keySpec: RSA_4096
        - script:
            content: |
              output=$(kubectl patch awskmskey key-immutable-spec -n awskmskey \
                --type=merge -p '{"spec":{"keySpec":"ECC_NIST_P256"}}' 2>&1 || true)
              if echo "$output" | grep -q "keySpec is immutable"; then
                echo "PASS: keySpec immutability enforced"
              else
                echo "ERROR: expected 'keySpec is immutable' rejection, got: $output"
                exit 1
              fi

    # ──────────────────────────────────────────────────────────────────────────
    # AC-23: spec.keyUsage is immutable after creation — update must be rejected.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac23-keyusage-immutable
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-immutable-usage
              spec:
                keySpec: RSA_4096
                keyUsage: SIGN_VERIFY
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSKMSKey
              metadata:
                name: key-immutable-usage
              spec:
                keyUsage: SIGN_VERIFY
        - script:
            content: |
              output=$(kubectl patch awskmskey key-immutable-usage -n awskmskey \
                --type=merge -p '{"spec":{"keyUsage":"ENCRYPT_DECRYPT"}}' 2>&1 || true)
              if echo "$output" | grep -q "keyUsage is immutable"; then
                echo "PASS: keyUsage immutability enforced"
              else
                echo "ERROR: expected 'keyUsage is immutable' rejection, got: $output"
                exit 1
              fi
