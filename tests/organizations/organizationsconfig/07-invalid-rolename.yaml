# AC-7: rejected when defaults.roleName contains invalid characters
---
apiVersion: aws.kropath.run/v1alpha1
kind: OrganizationsConfig
metadata:
  name: invalid-role
  namespace: organizationsconfig
spec:
  mandatory:
    iamUserAccessToBilling: ""
    roleName: ""
    parentID: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    iamUserAccessToBilling: ""
    roleName: "role-with-invalid-chars!!!"
    parentID: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
