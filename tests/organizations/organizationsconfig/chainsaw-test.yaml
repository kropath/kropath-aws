# aws-org-01 Chainsaw tests -- all 11 acceptance criteria for OrganizationsConfig CRD.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: organizationsconfig
spec:
  namespace: organizationsconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-organizationsconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: general-policy
                namespace: organizationsconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  iamUserAccessToBilling: "allow"
                  roleName: "OrganizationAccountAccessRole"
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-dual-tier-iamUserAccessToBilling
      try:
        - apply:
            file: 02-dual-tier-iambilling.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OrganizationsConfig
                check:
                  ($error != null): true

    - name: ac3-reject-dual-tier-roleName
      try:
        - apply:
            file: 03-dual-tier-rolename.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OrganizationsConfig
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-parentID
      try:
        - apply:
            file: 04-dual-tier-parentid.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OrganizationsConfig
                check:
                  ($error != null): true

    - name: ac5-reject-dual-tier-namingTemplate
      try:
        - apply:
            file: 05-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OrganizationsConfig
                check:
                  ($error != null): true

    - name: ac6-reject-invalid-iamUserAccessToBilling
      try:
        - apply:
            file: 06-invalid-billing.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OrganizationsConfig
                check:
                  ($error != null): true

    - name: ac7-reject-invalid-roleName
      try:
        - apply:
            file: 07-invalid-rolename.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OrganizationsConfig
                check:
                  ($error != null): true

    - name: ac8-reject-invalid-parentID
      try:
        - apply:
            file: 08-invalid-parentid.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OrganizationsConfig
                check:
                  ($error != null): true

    - name: ac9-effective-cascade
      try:
        - apply:
            file: 00-organizationsconfig-namespace.yaml
        - apply:
            file: 09-cascade-general-policy.yaml
        - script:
            content: |
              kubectl patch organizationsconfig general-policy -n organizationsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"deny","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"allow","roleName":"OrganizationAccountAccessRole","parentID":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: general-policy
                namespace: organizationsconfig
              status:
                effectiveConfig:
                  mandatory:
                    iamUserAccessToBilling: "deny"
                  defaults:
                    iamUserAccessToBilling: "allow"
                    roleName: "OrganizationAccountAccessRole"
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 09-cascade-general-policy.yaml
        - delete:
            file: 00-organizationsconfig-namespace.yaml

    - name: ac10-tag-merge-in-effectiveconfig
      try:
        - apply:
            file: 10-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch organizationsconfig general-policy -n organizationsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{"compliance":"sox","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"allow","roleName":"OrganizationAccountAccessRole","parentID":"","namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: general-policy
                namespace: organizationsconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      compliance: sox
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform
      cleanup:
        - delete:
            file: 10-tags-general-policy.yaml

    - name: ac11-synced-labels-in-effectiveconfig
      try:
        - apply:
            file: 11-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch organizationsconfig general-policy -n organizationsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{"data-class":"restricted"},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"allow","roleName":"OrganizationAccountAccessRole","parentID":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: general-policy
                namespace: organizationsconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: restricted
      cleanup:
        - delete:
            file: 11-synced-labels-general-policy.yaml
