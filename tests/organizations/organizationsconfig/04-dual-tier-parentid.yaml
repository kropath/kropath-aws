# AC-4: rejected when parentID set in both mandatory and defaults
---
apiVersion: aws.kropath.run/v1alpha1
kind: OrganizationsConfig
metadata:
  name: strict-parent
  namespace: organizationsconfig
spec:
  mandatory:
    iamUserAccessToBilling: ""
    roleName: ""
    parentID: "r-ab12"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    iamUserAccessToBilling: ""
    roleName: ""
    parentID: "ou-ab12-cd34567890"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
