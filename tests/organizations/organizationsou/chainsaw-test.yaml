# aws-org-03 Chainsaw tests -- 18 acceptance criteria for OrganizationsOU RGD.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: organizationsou
spec:
  skipDelete: true
  namespace: organizationsou
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # OU-AC-1: parentID from defaults tier → ACK OrganizationalUnit gets correct parentID.
    - name: ou-ac1-parentID-from-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac1-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac1-cfg
              spec:
                defaults:
                  parentID: r-abc1
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac1-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-abc1","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac1-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac1-cfg
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac1-ou
                namespace: organizationsou
              spec:
                name: organizationsou-ou-ac1-ou
                parentID: r-abc1
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac1-ou
                namespace: organizationsou
              status:
                resourceName: organizationsou-ou-ac1-ou
                namingStatus: valid

    # OU-AC-2: mandatory.parentID overrides defaults and instance parentID.
    - name: ou-ac2-mandatory-parentID
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac2-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac2-cfg
              spec:
                mandatory:
                  parentID: r-mandatory1
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac2-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-mandatory1","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-defaults1","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac2-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac2-cfg
                parentID: ou-instance1
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac2-ou
                namespace: organizationsou
              spec:
                parentID: r-mandatory1

    # OU-AC-3: instance parentID overrides defaults.parentID.
    - name: ou-ac3-instance-parentID
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac3-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac3-cfg
              spec:
                defaults:
                  parentID: r-defaults2
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac3-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-defaults2","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac3-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac3-cfg
                parentID: ou-instance2
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac3-ou
                namespace: organizationsou
              spec:
                parentID: ou-instance2

    # OU-AC-4: ACK reports OU id → OrganizationsOU surfaces ouID and ouArn.
    - name: ou-ac4-status-propagation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac4-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac4-cfg
              spec:
                defaults:
                  parentID: r-abc4
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac4-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-abc4","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac4-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac4-cfg
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac4-ou
                namespace: organizationsou
        - script:
            content: |
              kubectl patch organizationalunit ou-ac4-ou -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"id":"ou-abc4-12345678","ackResourceMetadata":{"arn":"arn:aws:organizations::123456789012:ou/o-abc12345/ou-abc4-12345678"}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac4-ou
                namespace: organizationsou
              status:
                ouID: ou-abc4-12345678
                ouArn: arn:aws:organizations::123456789012:ou/o-abc12345/ou-abc4-12345678

    # OU-AC-5 (negative): no parentID in any tier → empty parentID passed to ACK (ACK will reject).
    - name: ou-ac5-missing-parentID
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac5-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac5-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac5-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac5-cfg
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac5-ou
                namespace: organizationsou
              spec:
                parentID: ""

    # OU-AC-6 (negative): invalid parentID format → parentIDError ConfigMap → status.validationError set.
    - name: ou-ac6-invalid-parentID-format
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac6-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac6-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac6-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac6-cfg
                parentID: invalid-format-id
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac6-ou
                namespace: organizationsou
              status:
                (validationError != ""): true

    # OU-AC-7 (negative): valid r- prefix passes format check → no advisory error.
    - name: ou-ac7-valid-root-parentID
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac7-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac7-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac7-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac7-cfg
                parentID: r-valid123
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac7-ou
                namespace: organizationsou
              spec:
                parentID: r-valid123
        # kro omits empty-string status fields, so `validationError: ""` never
        # materialises. Assert the advisory ConfigMap was NOT created instead.
        - error:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ou-ac7-ou-parentid-error
                namespace: organizationsou

    # OU-AC-8 (negative): valid ou- prefix passes format check → no advisory error.
    - name: ou-ac8-valid-ou-parentID
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac8-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac8-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac8-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac8-cfg
                parentID: ou-valid-abc123
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac8-ou
                namespace: organizationsou
              spec:
                parentID: ou-valid-abc123
        # kro omits empty-string status fields, so `validationError: ""` never
        # materialises. Assert the advisory ConfigMap was NOT created instead.
        - error:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ou-ac8-ou-parentid-error
                namespace: organizationsou

    # OU-AC-9: {namespace}-{name} template → status.resourceName correct.
    - name: ou-ac9-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac9-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac9-cfg
              spec:
                defaults:
                  parentID: r-abc9
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac9-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-abc9","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac9-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac9-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac9-ou
                namespace: organizationsou
              status:
                resourceName: organizationsou-ou-ac9-ou
                namingStatus: valid

    # OU-AC-10: spec.nameOverride bypasses naming template.
    - name: ou-ac10-nameOverride
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac10-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac10-cfg
              spec:
                defaults:
                  parentID: r-abc10
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac10-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-abc10","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac10-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac10-cfg
                nameOverride: my-engineering-ou
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac10-ou
                namespace: organizationsou
              status:
                resourceName: my-engineering-ou
                namingStatus: valid

    # OU-AC-11: tags merge with mandatory winning on conflict.
    - name: ou-ac11-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac11-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac11-cfg
              spec:
                defaults:
                  parentID: r-abc11
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac11-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{"compliance":"sox","environment":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-abc11","namingTemplate":"{namespace}-{name}","tags":{"environment":"dev","team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac11-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac11-cfg
                tags:
                  project: myou
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac11-ou
                namespace: organizationsou
              spec:
                name: organizationsou-ou-ac11-ou
        - script:
            content: |
              TAGS=$(kubectl get organizationalunit ou-ac11-ou -n organizationsou -o jsonpath='{.spec.tags}')
              echo "$TAGS" | python3 -c "
              import sys, json
              tags = {t['key']: t['value'] for t in json.load(sys.stdin)}
              assert tags.get('compliance') == 'sox', f'expected sox, got {tags.get(\"compliance\")}'
              assert tags.get('environment') == 'prod', f'mandatory must win: expected prod, got {tags.get(\"environment\")}'
              assert tags.get('team') == 'platform', f'expected platform, got {tags.get(\"team\")}'
              assert tags.get('project') == 'myou', f'expected myou, got {tags.get(\"project\")}'
              print('OU tag merge assertion passed')
              "

    # OU-AC-12: mandatory.syncedLabels → child metadata.labels has aws.kropath.run/ prefix.
    - name: ou-ac12-syncedLabels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac12-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac12-cfg
              spec:
                mandatory:
                  syncedLabels:
                    ou-tier: restricted
                defaults:
                  parentID: r-abc12
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac12-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{"ou-tier":"restricted"},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-abc12","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac12-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac12-cfg
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac12-ou
                namespace: organizationsou
                labels:
                  aws.kropath.run/ou-tier: restricted

    # OU-AC-13: standard metadata — managed-by kro, instance label, deletion-policy retain.
    - name: ou-ac13-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac13-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac13-cfg
              spec:
                defaults:
                  parentID: r-abc13
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac13-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-abc13","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac13-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac13-cfg
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac13-ou
                namespace: organizationsou
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ou-ac13-ou
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # OU-AC-14: spec.deletionPolicy=delete → annotation delete.
    - name: ou-ac14-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac14-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac14-cfg
              spec:
                defaults:
                  parentID: r-abc14
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch organizationsconfig ou-ac14-cfg -n organizationsou \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"iamUserAccessToBilling":"","roleName":"","parentID":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"iamUserAccessToBilling":"","roleName":"","parentID":"r-abc14","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsOU
              metadata:
                name: ou-ac14-ou
                namespace: organizationsou
              spec:
                configRef: ou-ac14-cfg
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: organizations.services.k8s.aws/v1alpha1
              kind: OrganizationalUnit
              metadata:
                name: ou-ac14-ou
                namespace: organizationsou
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # OU-AC-15: spec.deletionPolicy=retain (default) → annotation retain.
    - name: ou-ac15-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OrganizationsConfig
              metadata:
                name: ou-ac15-cfg
                namespace: organizationsou
                labels:
                  aws.kropath.run/resource-name: ou-ac15-cfg
              spec:
