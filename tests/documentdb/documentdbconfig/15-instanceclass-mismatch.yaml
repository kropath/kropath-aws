# AC-15: dbInstanceClass not in allowedInstanceClasses — CRD accepts, controller sets Invalid condition.
---
apiVersion: aws.kropath.run/v1alpha1
kind: DocumentDBConfig
metadata:
  name: instanceclass-mismatch
  namespace: documentdbconfig
  labels:
    aws.kropath.run/resource-name: instanceclass-mismatch
spec:
  mandatory:
    storageEncrypted: false
    deletionProtection: false
    kmsKeyArn: ""
    performanceInsightsEnabled: false
    dbInstanceClass: "db.r6g.large"
    engineVersion: ""
    allowedInstanceClasses:
      - db.t3.medium
    storageType: ""
    backupRetentionPeriod: 0
    enableCloudwatchLogsExports: []
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    storageEncrypted: false
    deletionProtection: false
    kmsKeyArn: ""
    performanceInsightsEnabled: false
    dbInstanceClass: ""
    engineVersion: ""
    allowedInstanceClasses: []
    storageType: ""
    backupRetentionPeriod: 0
    enableCloudwatchLogsExports: []
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
