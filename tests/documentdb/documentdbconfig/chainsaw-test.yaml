# aws-docdb-01 Chainsaw tests — all 17 acceptance criteria for DocumentDBConfig CRD (KRO-781).
# Canonical pattern: spec.skipDelete: true, unique resource names per step, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: documentdbconfig
spec:
  skipDelete: true
  namespace: documentdbconfig
  steps:
    # AC-1: Create general-policy DocumentDBConfig; CR accepted; label present; defaults verified.
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-documentdbconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: general-policy
                namespace: documentdbconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  storageEncrypted: true
                  backupRetentionPeriod: 7
                  namingTemplate: "{namespace}-{name}"

    # AC-2: storageEncrypted true in both mandatory and defaults — rejected by x-kubernetes-validations.
    - name: ac2-reject-dual-tier-storageencrypted
      try:
        - apply:
            file: 02-invalid-storageencrypted.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-3: deletionProtection true in both mandatory and defaults — rejected.
    - name: ac3-reject-dual-tier-deletionprotection
      try:
        - apply:
            file: 03-invalid-deletionprotection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-4: kmsKeyArn set in both mandatory and defaults — rejected.
    - name: ac4-reject-dual-tier-kms
      try:
        - apply:
            file: 04-invalid-kmskey.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-5: dbInstanceClass set in both mandatory and defaults — rejected.
    - name: ac5-reject-dual-tier-instanceclass
      try:
        - apply:
            file: 05-invalid-instanceclass.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-6: engineVersion set in both mandatory and defaults — rejected.
    - name: ac6-reject-dual-tier-engineversion
      try:
        - apply:
            file: 06-invalid-engineversion.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-7: allowedInstanceClasses non-empty in both mandatory and defaults — rejected.
    - name: ac7-reject-dual-tier-allowedclasses
      try:
        - apply:
            file: 07-invalid-allowedclasses.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-8: storageType set in both mandatory and defaults — rejected.
    - name: ac8-reject-dual-tier-storagetype
      try:
        - apply:
            file: 08-invalid-storagetype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-9: backupRetentionPeriod non-zero in both mandatory and defaults — rejected.
    - name: ac9-reject-dual-tier-retention
      try:
        - apply:
            file: 09-invalid-retention.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-10: enableCloudwatchLogsExports non-empty in both mandatory and defaults — rejected.
    - name: ac10-reject-dual-tier-logs
      try:
        - apply:
            file: 10-invalid-logs.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-11: performanceInsightsEnabled true in both mandatory and defaults — rejected.
    - name: ac11-reject-dual-tier-pi
      try:
        - apply:
            file: 11-invalid-pi.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DocumentDBConfig
                check:
                  ($error != null): true

    # AC-12: effectiveConfig cascade — KropathConfig mandatory.storageEncrypted: true flows into
    # effectiveConfig.mandatory. Simulated via kubectl patch --subresource=status.
    - name: ac12-cascade-effective-config
      try:
        - apply:
            file: 14-cascade-config.yaml
        - script:
            content: |
              kubectl patch documentdbconfig cascade-test -n documentdbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":true,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","allowedInstanceClasses":[],"storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","allowedInstanceClasses":[],"storageType":"","backupRetentionPeriod":7,"enableCloudwatchLogsExports":["audit"],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: cascade-test
                namespace: documentdbconfig
              status:
                effectiveConfig:
                  mandatory:
                    storageEncrypted: true
                  defaults:
                    storageEncrypted: false
                    backupRetentionPeriod: 7
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    accountId: "123456789012"
                    region: "ap-southeast-2"

    # AC-13: defaults.namingTemplate in effectiveConfig.defaults.namingTemplate — verified via
    # status patch simulating controller output.
    - name: ac13-naming-template-defaults
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch documentdbconfig general-policy -n documentdbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","allowedInstanceClasses":[],"storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","allowedInstanceClasses":[],"storageType":"","backupRetentionPeriod":7,"enableCloudwatchLogsExports":["audit"],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: general-policy
                namespace: documentdbconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"

    # AC-14: production profile with all mandatory governance fields — CR accepted.
    - name: ac14-mandatory-production-profile
      try:
        - apply:
            file: 13-production-profile.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: production
                namespace: documentdbconfig
                labels:
                  aws.kropath.run/resource-name: production
              spec:
                mandatory:
                  storageEncrypted: true
                  deletionProtection: true
                  kmsKeyArn: "arn:aws:kms:ap-southeast-2:123456789012:key/prod-key"
                  backupRetentionPeriod: 14

    # AC-15: dbInstanceClass not in allowedInstanceClasses — CRD admits the CR; controller sets
    # status.conditions[Valid]=False with reason InvalidInstanceClassNotInAllowedList.
    # effectiveConfig is NOT written. Simulated via kubectl patch --subresource=status.
    - name: ac15-instanceclass-not-in-allowed
      try:
        - apply:
            file: 15-instanceclass-mismatch.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: instanceclass-mismatch
                namespace: documentdbconfig
              spec:
                mandatory:
                  dbInstanceClass: "db.r6g.large"
                  allowedInstanceClasses:
                    - db.t3.medium
        - script:
            content: |
              kubectl patch documentdbconfig instanceclass-mismatch -n documentdbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"False","reason":"InvalidInstanceClassNotInAllowedList","message":"dbInstanceClass db.r6g.large is not in allowedInstanceClasses [db.t3.medium]","lastTransitionTime":"2026-08-24T00:00:00Z"}]}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: instanceclass-mismatch
                namespace: documentdbconfig
              status:
                conditions:
                  - type: Valid
                    status: "False"
                    reason: InvalidInstanceClassNotInAllowedList

    # AC-16: tags in both mandatory and defaults — valid (additive merge).
    # Controller merges DocumentDBConfig.mandatory.tags + KropathConfig.mandatory.tags.
    # Simulated via kubectl patch --subresource=status.
    - name: ac16-tag-merge
      try:
        - apply:
            file: 16-tags-config.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: tags-config
                namespace: documentdbconfig
              spec:
                mandatory:
                  tags:
                    service: documentdb
                defaults:
                  tags:
                    team: platform
        - script:
            content: |
              kubectl patch documentdbconfig tags-config -n documentdbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","allowedInstanceClasses":[],"storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{"service":"documentdb","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","allowedInstanceClasses":[],"storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: tags-config
                namespace: documentdbconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      service: documentdb
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform

    # AC-17: mandatory.syncedLabels appear in effectiveConfig.mandatory.syncedLabels.
    # Simulated via kubectl patch --subresource=status.
    - name: ac17-synced-labels
      try:
        - apply:
            file: 17-synced-labels-config.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: synced-labels-config
                namespace: documentdbconfig
              spec:
                mandatory:
                  syncedLabels:
                    data-class: confidential
        - script:
            content: |
              kubectl patch documentdbconfig synced-labels-config -n documentdbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","allowedInstanceClasses":[],"storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"confidential"},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","allowedInstanceClasses":[],"storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: synced-labels-config
                namespace: documentdbconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: confidential
