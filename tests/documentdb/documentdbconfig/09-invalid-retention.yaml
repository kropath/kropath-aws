# AC-9: backupRetentionPeriod non-zero in both mandatory and defaults — rejected.
---
apiVersion: aws.kropath.run/v1alpha1
kind: DocumentDBConfig
metadata:
  name: invalid-retention
  namespace: documentdbconfig
spec:
  mandatory:
    storageEncrypted: false
    deletionProtection: false
    kmsKeyArn: ""
    performanceInsightsEnabled: false
    dbInstanceClass: ""
    engineVersion: ""
    allowedInstanceClasses: []
    storageType: ""
    backupRetentionPeriod: 14
    enableCloudwatchLogsExports: []
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    storageEncrypted: false
    deletionProtection: false
    kmsKeyArn: ""
    performanceInsightsEnabled: false
    dbInstanceClass: ""
    engineVersion: ""
    allowedInstanceClasses: []
    storageType: ""
    backupRetentionPeriod: 7
    enableCloudwatchLogsExports: []
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
