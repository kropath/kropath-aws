    # AC-8: No governance kmsKeyArn; instance empty → ACK has no kmsKeyID (AWS-owned key)
    - name: ac8-kms-aws-owned
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac8-cfg
                namespace: documentdbcluster
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac8-cfg -n documentdbcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBCluster
              metadata:
                name: ac8-cluster
                namespace: documentdbcluster
              spec:
                configRef: ac8-cfg
                masterUsername: admin
        - script:
            content: |
              KEY=$(kubectl get dbcluster ac8-cluster -n documentdbcluster -o jsonpath='{.spec.kmsKeyID}' 2>/dev/null)
              if [ -z "$KEY" ]; then
                echo "kmsKeyID is absent/empty - OK"
                exit 0
              else
                echo "kmsKeyID should be empty but is: $KEY"
                exit 1
              fi

    # AC-9: defaults.engineVersion="5.0.0"; instance empty → default applied
    - name: ac9-engineversion-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac9-cfg
                namespace: documentdbcluster
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  engineVersion: "5.0.0"
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac9-cfg -n documentdbcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"5.0.0","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
