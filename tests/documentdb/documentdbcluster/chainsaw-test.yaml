                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac6-cfg -n documentdbcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"arn:aws:kms:ap-southeast-2:123456789012:key/mandatory-key","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
