# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named resources and deletes nothing between
# steps. spec.skipDelete: true stops chainsaw's end-of-test cascade delete. The cluster
# runs kro but no ACK controllers, so ACK finalizers are never removed.
#
# Tests cover all 35 ACs from kropath-core/docs/specs/aws/documentdbcluster.md.
# effectiveConfig is patched via --subresource=status since the controller pre-merges.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: documentdbcluster
spec:
  skipDelete: true
  namespace: documentdbcluster
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: defaults.storageEncrypted=true; instance nil → ACK storageEncrypted=true
    - name: ac1-encryption-default-enabled
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac1-cfg
                namespace: documentdbcluster
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac1-cfg -n documentdbcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":7,"enableCloudwatchLogsExports":["audit"],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBCluster
              metadata:
                name: ac1-cluster
                namespace: documentdbcluster
              spec:
                configRef: ac1-cfg
                masterUsername: admin
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: ac1-cluster
                namespace: documentdbcluster
              spec:
                storageEncrypted: true
                engine: docdb

    # AC-2: mandatory.storageEncrypted=true; instance false → mandatory wins
    - name: ac2-encryption-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac2-cfg
                namespace: documentdbcluster
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  storageEncrypted: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac2-cfg -n documentdbcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":true,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBCluster
              metadata:
                name: ac2-cluster
                namespace: documentdbcluster
              spec:
                configRef: ac2-cfg
                storageEncrypted: false
                masterUsername: admin
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: ac2-cluster
                namespace: documentdbcluster
              spec:
                storageEncrypted: true

    # AC-3: defaults.storageEncrypted=true; instance false → instance wins over defaults
