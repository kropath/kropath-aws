# Canonical pattern: unique resource name per step, spec.skipDelete: true,
# no inter-step deletes. Covers all 22 ACs from the DocumentDBInstance spec.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: documentdbinstance
spec:
  skipDelete: true
  namespace: documentdbinstance
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: mandatory.dbInstanceClass="db.r6g.large"; instance "db.t3.medium" → mandatory wins
    - name: ac1-instanceclass-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac1-cfg
                namespace: documentdbinstance
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  dbInstanceClass: "db.r6g.large"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac1-cfg -n documentdbinstance \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"db.r6g.large","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBInstance
              metadata:
                name: ac1-instance
                namespace: documentdbinstance
              spec:
                configRef: ac1-cfg
                dbInstanceClass: "db.t3.medium"
                dbClusterIdentifier: my-cluster
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBInstance
              metadata:
                name: ac1-instance
                namespace: documentdbinstance
              spec:
                dbInstanceClass: "db.r6g.large"
                engine: docdb

    # AC-2: defaults.dbInstanceClass="db.r6g.large"; instance empty → default applied
    - name: ac2-instanceclass-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac2-cfg
                namespace: documentdbinstance
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
