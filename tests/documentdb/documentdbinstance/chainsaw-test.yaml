                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","performanceInsightsEnabled":false,"dbInstanceClass":"db.r6g.large","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBInstance
              metadata:
                name: ac2-instance
                namespace: documentdbinstance
              spec:
                configRef: ac2-cfg
                dbClusterIdentifier: my-cluster
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBInstance
              metadata:
