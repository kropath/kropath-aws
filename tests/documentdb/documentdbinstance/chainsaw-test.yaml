              kind: DBInstance
              metadata:
                name: ac7-instance
                namespace: documentdbinstance
              spec:
                dbClusterIdentifier: my-prod-cluster

    # AC-8: promotionTier=0 → ACK spec.promotionTier=0 (explicit zero passes through)
    - name: ac8-promotion-tier-zero
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
