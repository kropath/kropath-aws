                namespace: documentdbinstance
              spec:
                performanceInsightsEnabled: true
                performanceInsightsKMSKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/pi-key"

    # AC-7: dbClusterIdentifier="my-prod-cluster" → ACK spec.dbClusterIdentifier set
    - name: ac7-cluster-membership
      try:
