        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBInstance
              metadata:
                name: ac3-instance
                namespace: documentdbinstance
              spec:
                configRef: ac3-cfg
                dbInstanceClass: "db.r6g.xlarge"
                dbClusterIdentifier: my-cluster
        - assert:
