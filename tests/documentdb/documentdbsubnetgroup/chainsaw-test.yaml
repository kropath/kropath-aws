# Canonical pattern: unique resource name per step, spec.skipDelete: true,
# no inter-step deletes. Covers all 13 ACs from the DocumentDBSubnetGroup spec.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: documentdbsubnetgroup
spec:
  skipDelete: true
  namespace: documentdbsubnetgroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: description + subnetIDs=["subnet-aaa","subnet-bbb"] → ACK DBSubnetGroup fields set
    - name: ac1-subnetgroup-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac1-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac1-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac1-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac1-cfg
                description: "Test subnet group"
                subnetIDs:
                  - subnet-aaa
                  - subnet-bbb
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: ac1-sg
                namespace: documentdbsubnetgroup
              spec:
                description: "Test subnet group"
                subnetIDs:
                  - subnet-aaa
                  - subnet-bbb

    # AC-2: Three subnet IDs → ACK spec.subnetIDs contains all three
    - name: ac2-subnetgroup-three-subnets
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac2-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac2-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac2-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac2-cfg
                description: "Three subnet group"
                subnetIDs:
                  - subnet-aaa
                  - subnet-bbb
                  - subnet-ccc
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: ac2-sg
                namespace: documentdbsubnetgroup
              spec:
                subnetIDs:
                  - subnet-aaa
                  - subnet-bbb
                  - subnet-ccc

    # AC-3: {namespace}-{name} → status.resourceName = "documentdbsubnetgroup-ac3-sg", ARN has :subgrp:
    - name: ac3-naming-standard
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac3-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac3-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac3-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac3-cfg
                description: "Naming test"
                subnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac3-sg
                namespace: documentdbsubnetgroup
              status:
                resourceName: documentdbsubnetgroup-ac3-sg
                (contains(predictedArn, ':subgrp:')): true
                (contains(predictedArn, 'documentdbsubnetgroup-ac3-sg')): true

    # AC-4: spec.nameOverride="my-custom-subnetgroup" → template bypassed
    - name: ac4-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac4-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac4-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac4-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac4-cfg
                nameOverride: my-custom-subnetgroup
                description: "Override test"
                subnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac4-sg
                namespace: documentdbsubnetgroup
              status:
                resourceName: my-custom-subnetgroup
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: ac4-sg
                namespace: documentdbsubnetgroup
              spec:
                name: my-custom-subnetgroup

    # AC-5: mandatory.namingTemplate="corp-{namespace}-{name}" → mandatory used
    - name: ac5-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac5-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  namingTemplate: "corp-{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac5-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac5-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac5-cfg
                description: "Mandatory naming test"
                subnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac5-sg
                namespace: documentdbsubnetgroup
              status:
                resourceName: corp-documentdbsubnetgroup-ac5-sg

    # AC-6 (negative): {tag.env}-{name} but tag absent → namingStatus=invalid-unresolved-tokens
    - name: ac6-naming-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac6-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.env}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac6-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac6-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac6-cfg
                description: "Unresolved token test"
                subnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac6-sg
                namespace: documentdbsubnetgroup
              status:
                namingStatus: invalid-unresolved-tokens

    # AC-7: Mixed-case → status.resourceName all lowercase
    - name: ac7-naming-lowercase
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac7-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory:
                  namingTemplate: "MySubGroup-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac7-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"MySubGroup-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac7-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac7-cfg
                description: "Lowercase test"
                subnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac7-sg
                namespace: documentdbsubnetgroup
              status:
                resourceName: mysubgroup-ac7-sg

    # AC-8: Tags merge in ACK spec.tags
    - name: ac8-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac8-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory:
                  tags:
                    env: production
                defaults:
                  tags:
                    env: staging
                    team: infra
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac8-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{"env":"production"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{"env":"staging","team":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac8-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac8-cfg
                tags:
                  service: docdb-subnets
                description: "Tags test"
                subnetIDs:
                  - subnet-aaa
        - script:
            content: |
              TAGS=$(kubectl get dbsubnetgroup ac8-sg -n documentdbsubnetgroup -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="production")' > /dev/null || (echo "FAIL: mandatory env tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="infra")' > /dev/null || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="service" and .value=="docdb-subnets")' > /dev/null || (echo "FAIL: instance service tag missing" && exit 1)
              echo "PASS"

    # AC-9: syncedLabels → ACK metadata.labels AND spec.tags (dual-write)
    - name: ac9-synced-labels-dual
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac9-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac9-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac9-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac9-cfg
                syncedLabels:
                  network-tier: private
                description: "SyncedLabels test"
                subnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: ac9-sg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/network-tier: private
        - script:
            content: |
              kubectl get dbsubnetgroup ac9-sg -n documentdbsubnetgroup -o json | \
                jq -e '.spec.tags[] | select(.key=="network-tier" and .value=="private")' > /dev/null || \
                (echo "FAIL: syncedLabel not dual-written to spec.tags" && exit 1)
              echo "PASS"

    # AC-10: DocumentDBConfig.mandatory.syncedAnnotations → ACK metadata.annotations prefixed
    - name: ac10-synced-annotations
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac10-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  syncedAnnotations:
                    owner: network-team
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac10-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"owner":"network-team"}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac10-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac10-cfg
                description: "SyncedAnnotations test"
                subnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: ac10-sg
                namespace: documentdbsubnetgroup
                annotations:
                  aws.kropath.run/owner: network-team

    # AC-11: ACK DBSubnetGroup has managed-by: kro, instance: <cr-name>, deletion-policy: retain, ownerReferences
    - name: ac11-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac11-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac11-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac11-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac11-cfg
                description: "Standard metadata test"
                subnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: ac11-sg
                namespace: documentdbsubnetgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac11-sg
                annotations:
                  services.k8s.aws/deletion-policy: retain
              (metadata.ownerReferences[0].name): ac11-sg

    # AC-12: deletionPolicy="delete" → ACK annotation delete
    - name: ac12-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac12-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch documentdbconfig ac12-cfg -n documentdbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"deletionProtection":false,"kmsKeyArn":"","engineVersion":"","storageType":"","backupRetentionPeriod":0,"enableCloudwatchLogsExports":[],"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBSubnetGroup
              metadata:
                name: ac12-sg
                namespace: documentdbsubnetgroup
              spec:
                configRef: ac12-cfg
                deletionPolicy: delete
                description: "Deletion policy delete test"
                subnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: documentdb.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: ac12-sg
                namespace: documentdbsubnetgroup
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-13: deletionPolicy="retain" (default) → ACK annotation retain
    - name: ac13-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DocumentDBConfig
              metadata:
                name: ac13-cfg
                namespace: documentdbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
