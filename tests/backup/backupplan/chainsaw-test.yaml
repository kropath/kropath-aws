        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupPlan
              metadata:
                name: ac2-plan
                namespace: backupplan
              spec:
                configRef: ac2-cfg
                rules:
                  - ruleName: daily
                    scheduleExpression: "cron(0 2 * * ? *)"
                    targetBackupVaultName: my-vault
                    enableContinuousBackup: false
        - script:
            content: |
              # mandatory.enableContinuousBackup=true must override instance rule.enableContinuousBackup=false
              kubectl get backupplan.backup.services.k8s.aws ac2-plan -n backupplan \
                -o json | jq -e '.spec.rules[0].enableContinuousBackup == true'

