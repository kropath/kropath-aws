# BackupPlan Chainsaw tests — one scenario per acceptance criterion.
# Canonical pattern: unique acN-cfg + acN-plan per step, skipDelete: true,
# no ACK child deletes between steps.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backupplan
spec:
  skipDelete: true
  namespace: backupplan
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: basic plan with one rule → ACK BackupPlan created with correct spec.rules.
    - name: ac1-basic-plan-with-rules
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupConfig
              metadata:
                name: ac1-cfg
                namespace: backupplan
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  encryptionKeyARN: ""
                  vaultLockMinRetentionDays: 0
                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  encryptionKeyARN: ""
                  vaultLockMinRetentionDays: 0
                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch backupconfig ac1-cfg -n backupplan \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupPlan
              metadata:
                name: ac1-plan
                namespace: backupplan
              spec:
                configRef: ac1-cfg
                rules:
                  - ruleName: daily
                    scheduleExpression: "cron(0 2 * * ? *)"
                    targetBackupVaultName: my-vault
        - assert:
            resource:
              apiVersion: backup.services.k8s.aws/v1alpha1
              kind: BackupPlan
              metadata:
                name: ac1-plan
                namespace: backupplan
              spec:
                rules:
                  - ruleName: daily
                    scheduleExpression: "cron(0 2 * * ? *)"
                    targetBackupVaultName: my-vault

    # AC-2: mandatory.enableContinuousBackup=true overrides per-rule instance value.
