# BackupSelection Chainsaw tests — one scenario per acceptance criterion.
# Naming: EXEMPT (OD-4, Option B). No effectiveName, nameOverride, predictedArn.
# Tags: K8s metadata only — ACK BackupSelection has no cloud-side tag field.
# Canonical pattern: unique acN-cfg + acN-sel per step, skipDelete: true,
# no ACK child deletes between steps.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backupselection
spec:
  skipDelete: true
  namespace: backupselection
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: backupPlanRef → ACK spec.backupPlanRef.from.name set; spec.backupPlanID empty.
    - name: ac1-backup-plan-ref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupConfig
              metadata:
                name: ac1-cfg
                namespace: backupselection
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  encryptionKeyARN: ""
                  vaultLockMinRetentionDays: 0
                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  encryptionKeyARN: ""
                  vaultLockMinRetentionDays: 0
                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch backupconfig ac1-cfg -n backupselection \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupSelection
              metadata:
                name: ac1-sel
                namespace: backupselection
              spec:
                configRef: ac1-cfg
                backupPlanRef: my-plan-cr
                iamRoleARN: "arn:aws:iam::123456789012:role/BackupRole"
                resources:
                  - "arn:aws:dynamodb:*:*:table/*"
        - assert:
            resource:
              apiVersion: backup.services.k8s.aws/v1alpha1
              kind: BackupSelection
              metadata:
                name: ac1-sel
                namespace: backupselection
              spec:
                backupPlanRef:
