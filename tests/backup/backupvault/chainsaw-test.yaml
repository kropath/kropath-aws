                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: ""
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  encryptionKeyARN: ""
                  vaultLockMinRetentionDays: 0
                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    cost-center: cc1
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch backupconfig ac8-cfg -n backupvault \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"{namespace}-{name}","tags":{"cost-center":"cc1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupVault
              metadata:
                name: ac8-vault
                namespace: backupvault
              spec:
                configRef: ac8-cfg
                tags:
                  env: dev
                  owner: team-a
        - assert:
            resource:
              apiVersion: backup.services.k8s.aws/v1alpha1
              kind: BackupVault
              metadata:
                name: ac8-vault
                namespace: backupvault
              spec:
                name: backupvault-ac8-vault
        - script:
            content: |
              TAGS=$(kubectl get backupvault.backup.services.k8s.aws ac8-vault -n backupvault -o json | jq '.spec.tags')
              echo "Tags: $TAGS"
              # mandatory.tags.env=prod overrides instance.tags.env=dev
              echo "$TAGS" | jq -e '."env" == "prod"'
              # instance.tags.owner=team-a passes through
              echo "$TAGS" | jq -e '."owner" == "team-a"'
              # defaults.tags["cost-center"]=cc1 passes through
              echo "$TAGS" | jq -e '."cost-center" == "cc1"'

    # AC-9: default naming template {namespace}-{name} produces correct effectiveName.
    - name: ac9-default-naming-template
      try:
        - apply:
