                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch backupconfig ac5-cfg -n backupvault \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKeyARN":"","vaultLockMinRetentionDays":90,"vaultLockMaxRetentionDays":365,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupVault
              metadata:
                name: ac5-vault
                namespace: backupvault
              spec:
