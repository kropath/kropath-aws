                name: ac5-vault
                namespace: backupvault
              status:
                namingStatus: valid

    # AC-6: instance vaultLockMinRetentionDays used when mandatory is 0.
    - name: ac6-instance-vaultlock-min
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupConfig
              metadata:
                name: ac6-cfg
                namespace: backupvault
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  encryptionKeyARN: ""
                  vaultLockMinRetentionDays: 0
                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  encryptionKeyARN: ""
                  vaultLockMinRetentionDays: 0
                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch backupconfig ac6-cfg -n backupvault \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
