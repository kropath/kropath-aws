    # AC-8: tag merge — mandatory.tags override instance, instance overrides defaults.
    # ACK spec.tags is a map[string]string — use script+jq for order-independent assertion.
    - name: ac8-tag-merge-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupConfig
              metadata:
                name: ac8-cfg
                namespace: backupvault
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
