                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKeyARN":"arn:aws:kms:us-east-1:123456789012:key/ac3-defaults","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
