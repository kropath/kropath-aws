# BackupVault Chainsaw tests — one scenario per acceptance criterion.
# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step uses a unique acN-cfg + acN-vault pair; no ACK child resources
# are deleted between steps (the cluster runs kro but no ACK controllers, so ACK finalizers
# are never removed and any delete would hang).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backupvault
spec:
  skipDelete: true
  namespace: backupvault
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: instance spec.encryptionKeyARN used when mandatory.encryptionKeyARN is empty.
    - name: ac1-instance-encryption-key
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupConfig
              metadata:
                name: ac1-cfg
                namespace: backupvault
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  encryptionKeyARN: ""
                  vaultLockMinRetentionDays: 0
                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  encryptionKeyARN: ""
                  vaultLockMinRetentionDays: 0
                  vaultLockMaxRetentionDays: 0
                  enableContinuousBackup: false
                  defaultLifecycleDeleteAfterDays: 0
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  enableMalwareScan: false
                  scannerRoleARN: ""
                  iamRoleARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch backupconfig ac1-cfg -n backupvault \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKeyARN":"","vaultLockMinRetentionDays":0,"vaultLockMaxRetentionDays":0,"enableContinuousBackup":false,"defaultLifecycleDeleteAfterDays":0,"defaultLifecycleMoveToColdStorageAfterDays":0,"enableMalwareScan":false,"scannerRoleARN":"","iamRoleARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupVault
              metadata:
                name: ac1-vault
                namespace: backupvault
              spec:
                configRef: ac1-cfg
                encryptionKeyARN: "arn:aws:kms:us-east-1:123456789012:key/ac1-instance-key"
        - assert:
            resource:
              apiVersion: backup.services.k8s.aws/v1alpha1
              kind: BackupVault
              metadata:
                name: ac1-vault
                namespace: backupvault
              spec:
                name: backupvault-ac1-vault
                encryptionKeyARN: "arn:aws:kms:us-east-1:123456789012:key/ac1-instance-key"

    # AC-2: mandatory.encryptionKeyARN overrides instance spec.encryptionKeyARN.
