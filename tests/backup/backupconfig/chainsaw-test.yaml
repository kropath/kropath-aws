# aws-backup-01 Chainsaw tests — one scenario per acceptance criterion.
# AC-12 and AC-13 are controller tests covered in KRO-1015 (kropath-controller task).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backupconfig
spec:
  skipDelete: true
  namespace: backupconfig
  steps:
    - name: ac1-config-mandatory-encryption
      try:
        - apply:
            file: 00-backupconfig-namespace.yaml
        - apply:
            file: 01-config-mandatory-encryption.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupConfig
              metadata:
                name: mandatory-encryption
                namespace: backupconfig
              spec:
                mandatory:
                  encryptionKeyARN: "arn:aws:kms:us-east-1:123456789012:key/key-1"
                defaults:
                  defaultLifecycleDeleteAfterDays: 35
                  namingTemplate: "{namespace}-{name}"

    - name: ac2-reject-both-tiers-encryption
      try:
        - apply:
            file: 02-config-both-tiers-encryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BackupConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-vaultlock-min
      try:
        - apply:
            file: 03-config-both-tiers-vaultlock-min.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BackupConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-vaultlock-max
      try:
        - apply:
            file: 04-config-both-tiers-vaultlock-max.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BackupConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-pitr
      try:
        - apply:
            file: 05-config-both-tiers-pitr.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BackupConfig
                check:
                  ($error != null): true

    - name: ac6-reject-both-tiers-lifecycle-delete
      try:
        - apply:
            file: 06-config-both-tiers-lifecycle-delete.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BackupConfig
                check:
                  ($error != null): true

    - name: ac7-reject-both-tiers-malware-scan
      try:
        - apply:
            file: 07-config-both-tiers-malware-scan.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BackupConfig
                check:
                  ($error != null): true

    - name: ac8-reject-both-tiers-scanner-role
      try:
        - apply:
            file: 08-config-both-tiers-scanner-role.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BackupConfig
                check:
                  ($error != null): true

    - name: ac9-reject-both-tiers-iam-role
      try:
        - apply:
            file: 09-config-both-tiers-iam-role.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BackupConfig
                check:
                  ($error != null): true

    - name: ac10-config-defaults-only
      try:
        - apply:
            file: 10-config-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupConfig
              metadata:
                name: defaults-only
                namespace: backupconfig
              spec:
                defaults:
                  defaultLifecycleDeleteAfterDays: 35
                  namingTemplate: "{namespace}-{name}"

    - name: ac11-config-mandatory-malware-scan
      try:
        - apply:
            file: 11-config-mandatory-malware-scan.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupConfig
              metadata:
                name: mandatory-malware-scan
                namespace: backupconfig
              spec:
                mandatory:
                  enableMalwareScan: true
                  scannerRoleARN: "arn:aws:iam::123456789012:role/ScannerRole"

    - name: ac14-config-lifecycle-cold-storage-mandatory-only
      try:
        - apply:
            file: 12-config-lifecycle-cold-storage-mandatory-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BackupConfig
              metadata:
                name: lifecycle-cold-storage-mandatory-only
                namespace: backupconfig
              spec:
                mandatory:
                  defaultLifecycleMoveToColdStorageAfterDays: 30
                defaults:
                  defaultLifecycleMoveToColdStorageAfterDays: 0
                  defaultLifecycleDeleteAfterDays: 35
