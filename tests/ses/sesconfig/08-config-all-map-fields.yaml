# AC-8: SESConfig with all three map fields populated in mixed tiers — controller
# writes all into status.effectiveConfig with correct tier placement.
---
apiVersion: aws.kropath.run/v1alpha1
kind: SESConfig
metadata:
  name: all-map-fields-config
  namespace: sesconfig
  labels:
    aws.kropath.run/resource-name: all-map-fields-config
spec:
  mandatory:
    namingTemplate: ""
    tags:
      env: prod
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels:
      tier: standard
    syncedAnnotations:
      provisioner: kropath
