# AC-3: local SESConfig in email-prod namespace — controller will merge KropathConfig
# mandatory.tags and global SESConfig defaults into status.effectiveConfig.
---
apiVersion: aws.kropath.run/v1alpha1
kind: SESConfig
metadata:
  name: general-policy
  namespace: email-prod
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
