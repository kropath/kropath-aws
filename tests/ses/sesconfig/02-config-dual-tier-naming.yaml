# AC-2 (negative): namingTemplate set in BOTH mandatory and defaults tiers — rejected by
# x-kubernetes-validations: "namingTemplate cannot be set in both mandatory and defaults".
---
apiVersion: aws.kropath.run/v1alpha1
kind: SESConfig
metadata:
  name: strict-invalid
  namespace: sesconfig
  labels:
    aws.kropath.run/resource-name: strict-invalid
spec:
  mandatory:
    namingTemplate: "corp-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
