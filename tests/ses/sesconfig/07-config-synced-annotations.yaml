# AC-7: SESConfig with mandatory.syncedAnnotations — controller writes into
# status.effectiveConfig.mandatory.syncedAnnotations; RGD applies as K8s annotation.
---
apiVersion: aws.kropath.run/v1alpha1
kind: SESConfig
metadata:
  name: synced-annotations-config
  namespace: sesconfig
  labels:
    aws.kropath.run/resource-name: synced-annotations-config
spec:
  mandatory:
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations:
      owner: email-team
  defaults:
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
