# AC-6: SESConfig with mandatory.syncedLabels — controller writes into
# status.effectiveConfig.mandatory.syncedLabels; RGD applies as K8s label.
---
apiVersion: aws.kropath.run/v1alpha1
kind: SESConfig
metadata:
  name: synced-labels-config
  namespace: sesconfig
  labels:
    aws.kropath.run/resource-name: synced-labels-config
spec:
  mandatory:
    namingTemplate: ""
    tags: {}
    syncedLabels:
      data-class: internal
    syncedAnnotations: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
