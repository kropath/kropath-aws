                echo "ERROR: expected cloud tag team=data-platform (plain key, no prefix), got: $TEAM_VAL"
                exit 1
              fi
              echo "PASS: syncedLabel team=data-platform written to both K8s labels (prefixed) and cloud tags (plain)"

