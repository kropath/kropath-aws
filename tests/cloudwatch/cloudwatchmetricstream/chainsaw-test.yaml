# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named CloudWatchConfig + CloudWatchMetricStream.
# skipDelete: true stops chainsaw's end-of-test cascade delete.
#
# MetricStream-specific notes:
# - outputFormat cascades: mandatory > instance > defaults > built-in "json"
# - ACK field names: spec.firehoseARN and spec.roleARN (capital ARN)
# - ACK MetricStream spec.tags is {key,value} list — use jq for order-independent asserts
# - ARN: arn:aws:cloudwatch:<region>:<accountId>:metric-stream/<effectiveName>
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudwatchmetricstream
spec:
  skipDelete: true
  namespace: cloudwatchmetricstream
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: firehoseArn and roleArn pass through as ACK spec.firehoseARN and spec.roleARN.
    # Note ACK field names use capital ARN.
    - name: ac1-firehose-role-arn-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac1-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac1-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac1-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac1-cfg
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/my-stream"
                roleArn: "arn:aws:iam::123456789012:role/my-metric-stream-role"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac1-stream
                namespace: cloudwatchmetricstream
              spec:
                name: cloudwatchmetricstream-ac1-stream
                firehoseARN: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/my-stream"
                roleARN: "arn:aws:iam::123456789012:role/my-metric-stream-role"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac1-stream
                namespace: cloudwatchmetricstream
              status:
                resourceName: cloudwatchmetricstream-ac1-stream
                namingStatus: valid

    # AC-2: outputFormat default cascade — when not set anywhere, built-in "json" is used.
    - name: ac2-output-format-builtin-default-json
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac2-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac2-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac2-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac2-cfg
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac2-stream
                namespace: cloudwatchmetricstream
              spec:
                outputFormat: json

    # AC-3: outputFormat from defaults.outputFormat when mandatory and instance are unset.
    - name: ac3-output-format-from-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac3-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  outputFormat: "opentelemetry0.7"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac3-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"opentelemetry0.7","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac3-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac3-cfg
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac3-stream
                namespace: cloudwatchmetricstream
              spec:
                outputFormat: opentelemetry0.7

    # AC-4: outputFormat instance override when mandatory is unset.
    - name: ac4-output-format-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac4-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  outputFormat: "json"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac4-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac4-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac4-cfg
                outputFormat: "opentelemetry1.0"
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac4-stream
                namespace: cloudwatchmetricstream
              spec:
                outputFormat: opentelemetry1.0

    # AC-5: outputFormat mandatory wins over instance and defaults.
    - name: ac5-output-format-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac5-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  outputFormat: "opentelemetry0.7"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac5-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"opentelemetry0.7","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac5-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac5-cfg
                outputFormat: "json"
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac5-stream
                namespace: cloudwatchmetricstream
              spec:
                outputFormat: opentelemetry0.7

    # AC-6: includeFilters pass through (namespace + metricNames).
    - name: ac6-include-filters-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac6-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac6-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac6-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac6-cfg
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
                includeFilters:
                  - namespace: AWS/EC2
                    metricNames:
                      - CPUUtilization
                      - NetworkIn
                  - namespace: AWS/RDS
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac6-stream
                namespace: cloudwatchmetricstream
              spec:
                includeFilters:
                  - namespace: AWS/EC2
                    metricNames:
                      - CPUUtilization
                      - NetworkIn
                  - namespace: AWS/RDS

    # AC-7: excludeFilters pass through.
    - name: ac7-exclude-filters-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac7-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac7-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac7-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac7-cfg
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
                excludeFilters:
                  - namespace: AWS/Billing
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac7-stream
                namespace: cloudwatchmetricstream
              spec:
                excludeFilters:
                  - namespace: AWS/Billing

    # AC-8: includeLinkedAccountsMetrics pass-through.
    - name: ac8-include-linked-accounts-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac8-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac8-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac8-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac8-cfg
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
                includeLinkedAccountsMetrics: true
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac8-stream
                namespace: cloudwatchmetricstream
              spec:
                includeLinkedAccountsMetrics: true

    # AC-9: predictedArn built from effectiveName and region/accountId from aws config.
    - name: ac9-predicted-arn-metric-stream
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac9-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac9-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac9-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac9-cfg
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac9-stream
                namespace: cloudwatchmetricstream
              status:
                predictedArn: "arn:aws:cloudwatch:ap-southeast-2:123456789012:metric-stream/cloudwatchmetricstream-ac9-stream"

    # AC-10: nameOverride takes precedence over namingTemplate.
    - name: ac10-name-override-takes-precedence
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac10-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac10-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac10-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac10-cfg
                nameOverride: my-custom-stream
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac10-stream
                namespace: cloudwatchmetricstream
              spec:
                name: my-custom-stream

    # AC-11: Naming: unresolved {tag.X} token → namingStatus=invalid-unresolved-tokens,
    # ACK MetricStream CR is NOT created.
    - name: ac11-unresolved-tag-token-blocks-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac11-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "stream-{tag.env}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac11-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"stream-{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac11-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac11-cfg
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac11-stream
                namespace: cloudwatchmetricstream
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              COUNT=$(kubectl get metricstream ac11-stream -n cloudwatchmetricstream 2>&1 | grep -c "not found" || true)
              if [ "$COUNT" -lt 1 ]; then
                echo "ERROR: MetricStream should NOT exist when naming has unresolved tokens"
                exit 1
              fi
              echo "Confirmed: MetricStream not created for ac11-stream (unresolved token)"

    # AC-12: Cloud tags merge order: defaults → spec → mandatory (mandatory wins on collision).
    # Uses jq for order-independent {key,value} list assertion.
    - name: ac12-tags-mandatory-wins-over-spec
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac12-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac12-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{"env":"prod-mandatory"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{"tier":"default-tier"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac12-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac12-cfg
                tags:
                  env: spec-env-attempt
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac12-stream
                namespace: cloudwatchmetricstream
        - script:
            content: |
              TAGS=$(kubectl get metricstream ac12-stream -n cloudwatchmetricstream -o json | jq -r '.spec.tags')
              echo "Tags: $TAGS"
              ENV_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key == "env") | .value')
              TIER_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key == "tier") | .value')
              if [ "$ENV_VAL" != "prod-mandatory" ]; then
                echo "ERROR: expected env=prod-mandatory (mandatory wins), got: $ENV_VAL"
                exit 1
              fi
              if [ "$TIER_VAL" != "default-tier" ]; then
                echo "ERROR: expected tier=default-tier (from defaults), got: $TIER_VAL"
                exit 1
              fi
              echo "PASS: tag merge order correct"

    # AC-13: syncedLabels written to K8s metadata.labels (prefixed) AND cloud tags (plain key).
    - name: ac13-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac13-cfg
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac13-cfg -n cloudwatchmetricstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{"team":"data-platform"},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchMetricStream
              metadata:
                name: ac13-stream
                namespace: cloudwatchmetricstream
              spec:
                configRef: ac13-cfg
                firehoseArn: "arn:aws:firehose:ap-southeast-2:123456789012:deliverystream/s"
                roleArn: "arn:aws:iam::123456789012:role/r"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricStream
              metadata:
                name: ac13-stream
                namespace: cloudwatchmetricstream
                labels:
                  aws.kropath.run/team: data-platform
        - script:
            content: |
              TAGS=$(kubectl get metricstream ac13-stream -n cloudwatchmetricstream -o json | jq -r '.spec.tags')
              TEAM_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key == "team") | .value')
