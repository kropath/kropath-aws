# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named CloudWatchConfig + CloudWatchDashboard.
# skipDelete: true stops chainsaw's end-of-test cascade delete.
#
# Dashboard-specific notes:
# - ACK Dashboard has NO spec.tags field — cloud tagging is not supported.
# - syncedLabels/syncedAnnotations write to K8s metadata only (no cloud-tag dual-write).
# - ARN is global (empty region): arn:aws:cloudwatch::<accountId>:dashboard/<effectiveName>
# - ACK identifier: spec.dashboardName (not spec.name)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudwatchdashboard
spec:
  skipDelete: true
  namespace: cloudwatchdashboard
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: dashboardBody passes through to ACK Dashboard spec.dashboardBody.
    # ACK identifier is spec.dashboardName (not spec.name).
    - name: ac1-dashboard-body-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac1-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac1-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac1-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac1-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac1-dashboard
                namespace: cloudwatchdashboard
              spec:
                dashboardName: cloudwatchdashboard-ac1-dashboard
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac1-dashboard
                namespace: cloudwatchdashboard
              status:
                resourceName: cloudwatchdashboard-ac1-dashboard
                namingStatus: valid

    # AC-2: predictedArn is global (empty region segment).
    # Format: arn:aws:cloudwatch::<accountId>:dashboard/<effectiveName>
    - name: ac2-predicted-arn-global-format
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac2-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac2-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac2-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac2-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac2-dashboard
                namespace: cloudwatchdashboard
              status:
                predictedArn: "arn:aws:cloudwatch::123456789012:dashboard/cloudwatchdashboard-ac2-dashboard"

    # AC-3: nameOverride takes precedence over namingTemplate.
    - name: ac3-name-override-precedence
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac3-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac3-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac3-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac3-cfg
                nameOverride: my-custom-dashboard
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac3-dashboard
                namespace: cloudwatchdashboard
              spec:
                dashboardName: my-custom-dashboard
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac3-dashboard
                namespace: cloudwatchdashboard
              status:
                resourceName: my-custom-dashboard

    # AC-4: mandatory.namingTemplate overrides defaults.namingTemplate.
    - name: ac4-mandatory-naming-template-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac4-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  namingTemplate: "mand-{name}"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac4-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"mand-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac4-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac4-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac4-dashboard
                namespace: cloudwatchdashboard
              spec:
                dashboardName: mand-ac4-dashboard

    # AC-5: Naming: {account_id} and {region} tokens resolved from aws config.
    - name: ac5-naming-account-region-tokens
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac5-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "dash-{account_id}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac5-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"dash-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac5-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac5-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac5-dashboard
                namespace: cloudwatchdashboard
              status:
                resourceName: dash-123456789012

    # AC-6: Naming: {tag.X} token unresolved → namingStatus=invalid-unresolved-tokens,
    # ACK Dashboard CR is NOT created.
    - name: ac6-unresolved-tag-token-blocks-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac6-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "dash-{tag.team}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac6-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"dash-{tag.team}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac6-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac6-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac6-dashboard
                namespace: cloudwatchdashboard
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              COUNT=$(kubectl get dashboard ac6-dashboard -n cloudwatchdashboard 2>&1 | grep -c "not found" || true)
              if [ "$COUNT" -lt 1 ]; then
                echo "ERROR: Dashboard should NOT exist when naming has unresolved tokens"
                exit 1
              fi
              echo "Confirmed: Dashboard not created for ac6-dashboard (unresolved token)"

    # AC-7: syncedLabels written to K8s metadata.labels (prefixed aws.kropath.run/).
    # Dashboard has no cloud tags — syncedLabels are K8s-only (no cloud-tag dual-write).
    - name: ac7-synced-labels-k8s-labels-only
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac7-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac7-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{"team":"platform"},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac7-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac7-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac7-dashboard
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/team: platform
        - script:
            content: |
              SPEC=$(kubectl get dashboard ac7-dashboard -n cloudwatchdashboard -o json | jq '.spec')
              if echo "$SPEC" | jq -e '.tags' > /dev/null 2>&1; then
                echo "ERROR: Dashboard should have no spec.tags (ACK Dashboard has no tags field)"
                exit 1
              fi
              echo "PASS: Dashboard has no spec.tags field (as expected for ACK Dashboard)"

    # AC-8: syncedAnnotations written to K8s metadata.annotations (prefixed).
    - name: ac8-synced-annotations-k8s-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac8-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac8-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"owner":"dashboard-team"}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac8-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac8-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac8-dashboard
                namespace: cloudwatchdashboard
                annotations:
                  aws.kropath.run/owner: dashboard-team

    # AC-9: deletionPolicy=retain → services.k8s.aws/deletion-policy: retain.
    - name: ac9-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac9-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac9-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac9-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac9-cfg
                deletionPolicy: retain
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac9-dashboard
                namespace: cloudwatchdashboard
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-10: deletionPolicy=delete → services.k8s.aws/deletion-policy: delete.
    - name: ac10-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac10-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac10-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac10-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac10-cfg
                deletionPolicy: delete
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac10-dashboard
                namespace: cloudwatchdashboard
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-11: K8s metadata.name = schema.metadata.name (not dashboardName/effectiveName).
    - name: ac11-k8s-name-is-schema-name
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac11-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory:
                  namingTemplate: "very-different-cloud-dash"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac11-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"very-different-cloud-dash","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac11-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac11-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac11-dashboard
                namespace: cloudwatchdashboard
              spec:
                dashboardName: very-different-cloud-dash

    # AC-12: configRef references a non-default named config.
    - name: ac12-custom-config-ref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac12-special-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac12-special-cfg
              spec:
                mandatory:
                  namingTemplate: "special-{name}"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac12-special-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"special-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac12-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac12-special-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac12-dashboard
                namespace: cloudwatchdashboard
              spec:
                dashboardName: special-ac12-dashboard

    # AC-13: instance spec.syncedLabels also written to K8s labels (prefixed).
    # Default config syncedLabels included in K8s labels as well.
    - name: ac13-instance-synced-labels-merged
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac13-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  syncedLabels:
                    cost-center: infra
        - script:
            content: |
              kubectl patch cloudwatchconfig ac13-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{"cost-center":"infra"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac13-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac13-cfg
                syncedLabels:
                  env: staging
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac13-dashboard
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/env: staging
                  aws.kropath.run/cost-center: infra

    # AC-14: app.kubernetes.io/managed-by and app.kubernetes.io/instance always present.
    - name: ac14-standard-k8s-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac14-cfg
                namespace: cloudwatchdashboard
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac14-cfg -n cloudwatchdashboard \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchDashboard
              metadata:
                name: ac14-dashboard
                namespace: cloudwatchdashboard
              spec:
                configRef: ac14-cfg
                dashboardBody: '{"widgets":[]}'
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac14-dashboard
                namespace: cloudwatchdashboard
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac14-dashboard
