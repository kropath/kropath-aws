    # Spec AC-9: extendedStatistic "p99" — statistic field must not be set.
    - name: ac30-extended-statistic-alarm
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac30-cfg
                namespace: cloudwatchalarm
