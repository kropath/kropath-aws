# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named CloudWatchConfig + CloudWatchAlarm and
# deletes nothing between steps, so no ACK finalizer ever blocks a delete and kro's
# per-object-key backoff never compounds. Test-level skipDelete: true stops chainsaw's
# end-of-test cascade delete; the ephemeral kind cluster is discarded after the suite.
#
# effectiveConfig injected via kubectl patch --subresource=status (controller pre-merges
# all cascade layers; tests bypass the controller by patching status directly).
#
# Tag assertions use a script + jq pattern (order-independent) because ACK MetricAlarm
# spec.tags is a {key,value} list whose iteration order is not guaranteed stable.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudwatchalarm
spec:
  skipDelete: true
  namespace: cloudwatchalarm
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Simple metric alarm — comparisonOperator, metricName, namespace, statistic,
    # period, threshold pass through to ACK MetricAlarm spec.
    - name: ac1-simple-metric-alarm-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac1-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac1-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac1-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac1-cfg
                comparisonOperator: GreaterThanThreshold
                metricName: CPUUtilization
                namespace: AWS/EC2
                statistic: Average
                period: 300
                threshold: 80
                evaluationPeriods: 2
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac1-alarm
                namespace: cloudwatchalarm
              spec:
                name: cloudwatchalarm-ac1-alarm
                comparisonOperator: GreaterThanThreshold
                metricName: CPUUtilization
                namespace: AWS/EC2
                statistic: Average
                period: 300
                threshold: 80
                evaluationPeriods: 2
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac1-alarm
                namespace: cloudwatchalarm
              status:
                resourceName: cloudwatchalarm-ac1-alarm
                namingStatus: valid

    # AC-2: treatMissingData default cascade — mandatory > instance > defaults > "missing".
    # When instance does not set it and defaults.treatMissingData = "missing", ACK gets "missing".
    - name: ac2-treat-missing-data-defaults-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac2-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  treatMissingData: "missing"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac2-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac2-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac2-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac2-alarm
                namespace: cloudwatchalarm
              spec:
                treatMissingData: missing

    # AC-3: treatMissingData mandatory wins over instance and defaults.
    - name: ac3-treat-missing-data-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac3-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  treatMissingData: "breaching"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac3-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"breaching","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac3-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac3-cfg
                treatMissingData: "notBreaching"
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac3-alarm
                namespace: cloudwatchalarm
              spec:
                treatMissingData: breaching

    # AC-4: treatMissingData instance value used when mandatory is unset and instance is set.
    - name: ac4-treat-missing-data-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac4-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  treatMissingData: "missing"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac4-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac4-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac4-cfg
                treatMissingData: "ignore"
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac4-alarm
                namespace: cloudwatchalarm
              spec:
                treatMissingData: ignore

    # AC-5: actionsEnabled boolean pointer cascade — mandatory true overrides instance and defaults.
    - name: ac5-actions-enabled-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac5-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  actionsEnabled: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac5-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":true,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac5-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac5-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac5-alarm
                namespace: cloudwatchalarm
              spec:
                actionsEnabled: true

    # AC-6: actionsEnabled defaults to true (RGD built-in) when not set anywhere.
    - name: ac6-actions-enabled-rg-builtin-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac6-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac6-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac6-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac6-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac6-alarm
                namespace: cloudwatchalarm
              spec:
                actionsEnabled: true

    # AC-7: alarmActions, okActions, insufficientDataActions pass through.
    # Note ACK field name: oKActions (capital K).
    - name: ac7-action-arns-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac7-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac7-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac7-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac7-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
                alarmActions:
                  - arn:aws:sns:ap-southeast-2:123456789012:alarm-action
                okActions:
                  - arn:aws:sns:ap-southeast-2:123456789012:ok-action
                insufficientDataActions:
                  - arn:aws:sns:ap-southeast-2:123456789012:insufficient-action
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac7-alarm
                namespace: cloudwatchalarm
              spec:
                alarmActions:
                  - arn:aws:sns:ap-southeast-2:123456789012:alarm-action
                oKActions:
                  - arn:aws:sns:ap-southeast-2:123456789012:ok-action
                insufficientDataActions:
                  - arn:aws:sns:ap-southeast-2:123456789012:insufficient-action

    # AC-8: alarmDescription pass-through.
    - name: ac8-alarm-description-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac8-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac8-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac8-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac8-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
                alarmDescription: "High CPU utilization alert"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac8-alarm
                namespace: cloudwatchalarm
              spec:
                alarmDescription: "High CPU utilization alert"

    # AC-9: dimensions pass through as {name,value} array.
    - name: ac9-dimensions-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac9-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac9-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac9-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac9-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
                metricName: CPUUtilization
                namespace: AWS/EC2
                dimensions:
                  - name: InstanceId
                    value: i-1234567890abcdef0
                  - name: AutoScalingGroupName
                    value: my-asg
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac9-alarm
                namespace: cloudwatchalarm
              spec:
                dimensions:
                  - name: InstanceId
                    value: i-1234567890abcdef0
                  - name: AutoScalingGroupName
                    value: my-asg

    # AC-10: datapointsToAlarm and evaluateLowSampleCountPercentile pass-through.
    - name: ac10-percentile-and-datapoints-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac10-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac10-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac10-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac10-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 5
                datapointsToAlarm: 3
                evaluateLowSampleCountPercentile: evaluate
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac10-alarm
                namespace: cloudwatchalarm
              spec:
                datapointsToAlarm: 3
                evaluateLowSampleCountPercentile: evaluate

    # AC-11: nameOverride takes precedence over namingTemplate.
    - name: ac11-name-override-takes-precedence
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac11-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac11-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac11-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac11-cfg
                nameOverride: my-custom-alarm-name
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac11-alarm
                namespace: cloudwatchalarm
              spec:
                name: my-custom-alarm-name
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac11-alarm
                namespace: cloudwatchalarm
              status:
                resourceName: my-custom-alarm-name

    # AC-12: Naming: mandatory.namingTemplate overrides defaults.namingTemplate.
    - name: ac12-mandatory-naming-template-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac12-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                mandatory:
                  namingTemplate: "mandatory-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac12-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"mandatory-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac12-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac12-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac12-alarm
                namespace: cloudwatchalarm
              spec:
                name: mandatory-ac12-alarm
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac12-alarm
                namespace: cloudwatchalarm
              status:
                resourceName: mandatory-ac12-alarm
                namingStatus: valid

    # AC-13: Naming: {account_id} and {region} tokens resolved from aws config.
    - name: ac13-naming-account-region-tokens
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac13-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{account_id}-{region}-alarm"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac13-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{account_id}-{region}-alarm","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac13-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac13-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac13-alarm
                namespace: cloudwatchalarm
              spec:
                name: 123456789012-ap-southeast-2-alarm
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac13-alarm
                namespace: cloudwatchalarm
              status:
                resourceName: 123456789012-ap-southeast-2-alarm

    # AC-14: Naming: {tag.X} token resolved from instance spec.tags.
    - name: ac14-naming-tag-token-from-spec
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac14-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                defaults:
                  namingTemplate: "alarm-{tag.env}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac14-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"alarm-{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
