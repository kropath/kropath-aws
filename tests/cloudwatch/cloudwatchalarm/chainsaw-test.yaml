    # Spec AC-11: anomaly detection alarm — ANOMALY_DETECTION_BAND metric math,
    # thresholdMetricID set, spec.threshold must NOT be present.
    - name: ac31-anomaly-detection-alarm
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac31-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac31-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac31-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac31-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac31-cfg
                comparisonOperator: LessThanLowerOrGreaterThanUpperThreshold
                evaluationPeriods: 2
                thresholdMetricID: ad1
                metrics:
                  - id: m1
                    returnData: false
                    metricStat:
                      metric:
                        metricName: CPUUtilization
                        namespace: AWS/EC2
                      period: 300
                      stat: Average
                  - id: ad1
                    returnData: true
                    expression: "ANOMALY_DETECTION_BAND(m1, 2)"
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac31-alarm
                namespace: cloudwatchalarm
              spec:
                thresholdMetricID: ad1
                comparisonOperator: LessThanLowerOrGreaterThanUpperThreshold

    # Spec AC-14: all alarm action arrays absent/empty → no action fields on ACK MetricAlarm.
    - name: ac32-alarm-actions-none
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: ac32-cfg
                namespace: cloudwatchalarm
                labels:
                  aws.kropath.run/resource-name: ac32-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudwatchconfig ac32-cfg -n cloudwatchalarm \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":null,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"actionsEnabled":null,"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchAlarm
              metadata:
                name: ac32-alarm
                namespace: cloudwatchalarm
              spec:
                configRef: ac32-cfg
                comparisonOperator: GreaterThanThreshold
                evaluationPeriods: 1
        - assert:
            resource:
              apiVersion: cloudwatch.services.k8s.aws/v1alpha1
              kind: MetricAlarm
              metadata:
                name: ac32-alarm
                namespace: cloudwatchalarm
        - script:
            content: |
              alarm=$(kubectl get metricalarm ac32-alarm -n cloudwatchalarm -o json)
              for field in alarmActions oKActions insufficientDataActions; do
                count=$(echo "$alarm" | jq -r ".spec.${field} // [] | length")
                if [ "$count" != "0" ]; then
                  echo "ERROR: $field should be absent or empty, got count=$count"
                  exit 1
                fi
              done
              echo "OK: no alarm action fields set on ACK MetricAlarm"
