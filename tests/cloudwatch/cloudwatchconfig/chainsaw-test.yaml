# aws-cloudwatch-01 Chainsaw tests -- all 13 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudwatchconfig
spec:
  namespace: cloudwatchconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-cloudwatchconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: general-policy
                namespace: cloudwatchconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  treatMissingData: "missing"
                  outputFormat: "json"
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-dual-tier-actions-enabled
      try:
        - apply:
            file: 02-invalid-dual-tier-actions-enabled.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchConfig
                check:
                  ($error != null): true

    - name: ac3-reject-dual-tier-treat-missing
      try:
        - apply:
            file: 03-invalid-dual-tier-treat-missing.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchConfig
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-output-format
      try:
        - apply:
            file: 04-invalid-dual-tier-output-format.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchConfig
                check:
                  ($error != null): true

    - name: ac5-reject-dual-tier-naming
      try:
        - apply:
            file: 05-invalid-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchConfig
                check:
                  ($error != null): true

    - name: ac6-reject-invalid-mandatory-treat-missing
      try:
        - apply:
            file: 06-invalid-mandatory-treat-missing.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchConfig
                check:
                  ($error != null): true

    - name: ac7-reject-invalid-defaults-output-format
      try:
        - apply:
            file: 07-invalid-defaults-output-format.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchConfig
                check:
                  ($error != null): true

    - name: ac8-effective-cascade
      try:
        - apply:
            file: 00-cloudwatchconfig-namespace.yaml
        - apply:
            file: 08-local-general-policy.yaml
        - script:
            content: |
              kubectl patch cloudwatchconfig local-general-policy -n cloudwatchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"actionsEnabled":true,"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: local-general-policy
                namespace: cloudwatchconfig
              status:
                effectiveConfig:
                  mandatory:
                    actionsEnabled: true
                  defaults:
                    treatMissingData: "missing"
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 08-local-general-policy.yaml
        - delete:
            file: 00-cloudwatchconfig-namespace.yaml

    - name: ac9-naming-template-in-effectiveconfig
      try:
        - apply:
            file: 09-naming-template-general-policy.yaml
        - script:
            content: |
              kubectl patch cloudwatchconfig naming-general-policy -n cloudwatchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: naming-general-policy
                namespace: cloudwatchconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 09-naming-template-general-policy.yaml

    - name: ac10-mandatory-alarm-bundle-accepted
      try:
        - apply:
            file: 10-mandatory-alarm-bundle.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: pci-alarm-bundle
                namespace: cloudwatchconfig
              spec:
                mandatory:
                  actionsEnabled: true
                  treatMissingData: "breaching"
      cleanup:
        - delete:
            file: 10-mandatory-alarm-bundle.yaml

    - name: ac11-tag-merge-in-effectiveconfig
      try:
        - apply:
            file: 11-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch cloudwatchconfig tags-general-policy -n cloudwatchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{"resource-type":"monitoring","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: tags-general-policy
                namespace: cloudwatchconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      resource-type: monitoring
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform
      cleanup:
        - delete:
            file: 11-tags-general-policy.yaml

    - name: ac12-synced-labels-in-effectiveconfig
      try:
        - apply:
            file: 12-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch cloudwatchconfig synced-labels-general-policy -n cloudwatchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: synced-labels-general-policy
                namespace: cloudwatchconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: internal
      cleanup:
        - delete:
            file: 12-synced-labels-general-policy.yaml

    - name: ac13-defaults-zero-values-in-effectiveconfig
      try:
        - apply:
            file: 13-defaults-zero-values.yaml
        - script:
            content: |
              kubectl patch cloudwatchconfig zero-values-general-policy -n cloudwatchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"treatMissingData":"","outputFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"treatMissingData":"missing","outputFormat":"json","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchConfig
              metadata:
                name: zero-values-general-policy
                namespace: cloudwatchconfig
              status:
                effectiveConfig:
                  defaults:
                    treatMissingData: "missing"
                    outputFormat: "json"
      cleanup:
        - delete:
            file: 13-defaults-zero-values.yaml
