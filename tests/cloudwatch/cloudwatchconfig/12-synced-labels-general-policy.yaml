# AC-12: general-policy with mandatory.syncedLabels for cascade test
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: synced-labels-general-policy
  namespace: cloudwatchconfig
  labels:
    aws.kropath.run/resource-name: synced-labels-general-policy
spec:
  mandatory:
    treatMissingData: ""
    outputFormat: ""
    namingTemplate: ""
    tags: {}
    syncedLabels:
      data-class: internal
    syncedAnnotations: {}
  defaults:
    treatMissingData: "missing"
    outputFormat: "json"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
