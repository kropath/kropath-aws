# AC-4: rejected when outputFormat set in both mandatory and defaults
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: strict-dual-format
  namespace: cloudwatchconfig
spec:
  mandatory:
    treatMissingData: ""
    outputFormat: "opentelemetry1.0"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    treatMissingData: "missing"
    outputFormat: "json"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
