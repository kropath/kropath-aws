# AC-10: pci profile with mandatory.actionsEnabled and mandatory.treatMissingData both in mandatory tier
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: pci-alarm-bundle
  namespace: cloudwatchconfig
  labels:
    aws.kropath.run/resource-name: pci-alarm-bundle
spec:
  mandatory:
    actionsEnabled: true
    treatMissingData: "breaching"
    outputFormat: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    treatMissingData: ""
    outputFormat: "json"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
