# AC-6: rejected when defaults.retentionDays is 100 (not a CloudWatch Logs allowed value)
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: bad-defaults
  namespace: cloudwatchlogsconfig
spec:
  mandatory:
    kmsKeyId: ""
    retentionDays: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    kmsKeyId: ""
    retentionDays: 100
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
