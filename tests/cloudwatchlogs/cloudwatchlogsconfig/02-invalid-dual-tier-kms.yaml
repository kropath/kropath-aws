# AC-2: rejected when kmsKeyId set in both mandatory and defaults
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: pci
  namespace: cloudwatchlogsconfig
spec:
  mandatory:
    kmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/abc"
    retentionDays: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    kmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/def"
    retentionDays: 90
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
