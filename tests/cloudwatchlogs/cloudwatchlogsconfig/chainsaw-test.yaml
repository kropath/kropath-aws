# aws-cloudwatchlogs-01 Chainsaw tests -- all 11 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudwatchlogsconfig
spec:
  namespace: cloudwatchlogsconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-cloudwatchlogsconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchLogsConfig
              metadata:
                name: general-policy
                namespace: cloudwatchlogsconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  retentionDays: 90
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-dual-tier-kms
      try:
        - apply:
            file: 02-invalid-dual-tier-kms.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchLogsConfig
                check:
                  ($error != null): true

    - name: ac3-reject-dual-tier-retention
      try:
        - apply:
            file: 03-invalid-dual-tier-retention.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchLogsConfig
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-naming
      try:
        - apply:
            file: 04-invalid-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchLogsConfig
                check:
                  ($error != null): true

    - name: ac5-reject-invalid-mandatory-retention
      try:
        - apply:
            file: 05-invalid-mandatory-retention.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchLogsConfig
                check:
                  ($error != null): true

    - name: ac6-reject-invalid-defaults-retention
      try:
        - apply:
            file: 06-invalid-defaults-retention.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudWatchLogsConfig
                check:
                  ($error != null): true

    - name: ac7-effective-cascade
      try:
        - apply:
            file: 00-cloudwatchlogsconfig-namespace.yaml
        - apply:
            file: 07-local-general-policy.yaml
        - script:
            content: |
              kubectl patch cloudwatchlogsconfig general-policy -n cloudwatchlogsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyId":"arn:aws:kms:ap-southeast-2:123:key/org-key","retentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsKeyId":"","retentionDays":90,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchLogsConfig
              metadata:
                name: general-policy
                namespace: cloudwatchlogsconfig
              status:
                effectiveConfig:
                  mandatory:
                    kmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/org-key"
                  defaults:
                    retentionDays: 90
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 07-local-general-policy.yaml
        - delete:
            file: 00-cloudwatchlogsconfig-namespace.yaml

    - name: ac8-naming-template-in-effectiveconfig
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch cloudwatchlogsconfig general-policy -n cloudwatchlogsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyId":"","retentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsKeyId":"","retentionDays":90,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchLogsConfig
              metadata:
                name: general-policy
                namespace: cloudwatchlogsconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac9-mandatory-hipaa-accepted
      try:
        - apply:
            file: 09-hipaa.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchLogsConfig
              metadata:
                name: hipaa
                namespace: cloudwatchlogsconfig
              spec:
                mandatory:
                  kmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/hipaa-key"
                  retentionDays: 2557
      cleanup:
        - delete:
            file: 09-hipaa.yaml

    - name: ac10-tag-merge-in-effectiveconfig
      try:
        - apply:
            file: 10-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch cloudwatchlogsconfig general-policy -n cloudwatchlogsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyId":"","retentionDays":0,"namingTemplate":"","tags":{"log-class":"production","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsKeyId":"","retentionDays":90,"namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchLogsConfig
              metadata:
                name: general-policy
                namespace: cloudwatchlogsconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      log-class: production
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform
      cleanup:
        - delete:
            file: 10-tags-general-policy.yaml

    - name: ac11-synced-labels-in-effectiveconfig
      try:
        - apply:
            file: 11-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch cloudwatchlogsconfig general-policy -n cloudwatchlogsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyId":"","retentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"kmsKeyId":"","retentionDays":90,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchLogsConfig
              metadata:
                name: general-policy
                namespace: cloudwatchlogsconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: internal
      cleanup:
        - delete:
            file: 11-synced-labels-general-policy.yaml
