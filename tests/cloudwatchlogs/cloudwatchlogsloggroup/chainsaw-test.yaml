                  services.k8s.aws/deletion-policy: delete

    # ──────────────────────────────────────────────────────────────────────────
    # AC-23: Deletion policy — retain (default).
    # Default spec.deletionPolicy=retain → ACK LogGroup annotation = retain.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac23-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchLogsLogGroup
              metadata:
                name: retain-policy-lg
              spec:
                deletionPolicy: retain
        - assert:
