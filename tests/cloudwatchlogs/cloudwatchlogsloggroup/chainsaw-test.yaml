              metadata:
                name: retain-policy-lg
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # ──────────────────────────────────────────────────────────────────────────
    # AC-24: Immutable name — ACK LogGroup spec.name is not mutated after creation.
    # The naming ConfigMap reflects the new effectiveName but the ACK LogGroup
    # spec.name stays unchanged (ACK enforces self == oldSelf CEL on spec.name).
    # In this test, we verify that the ACK LogGroup exists with the original name
    # even after the effectiveConfig namingTemplate changes.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac24-immutable-name
      try:
        - script:
            content: |
              kubectl patch cloudwatchlogsconfig general-policy -n cloudwatchlogsloggroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyId":"","retentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsKeyId":"","retentionDays":90,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudWatchLogsLogGroup
              metadata:
                name: immutable-name-lg
              spec: {}
        - assert:
            resource:
              apiVersion: cloudwatchlogs.services.k8s.aws/v1alpha1
              kind: LogGroup
              metadata:
                name: immutable-name-lg
              spec:
                name: cloudwatchlogsloggroup-immutable-name-lg
        # Simulate template change by patching mandatory.namingTemplate
        - script:
            content: |
              kubectl patch cloudwatchlogsconfig general-policy -n cloudwatchlogsloggroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyId":"","retentionDays":0,"namingTemplate":"new-prefix-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsKeyId":"","retentionDays":90,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        # Wait for kro to reconcile; naming ConfigMap effectiveName changes but
        # ACK LogGroup spec.name stays at the original value (immutable after creation).
        - assert:
            resource:
              apiVersion: cloudwatchlogs.services.k8s.aws/v1alpha1
              kind: LogGroup
              metadata:
                name: immutable-name-lg
              spec:
                name: cloudwatchlogsloggroup-immutable-name-lg
