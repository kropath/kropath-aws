# WAFWebACL Chainsaw tests — one scenario per acceptance criterion (AC-1 through AC-41).
# Namespace: wafwebacl (fixed; {namespace}-{name} naming template expands predictably).
# effectiveConfig is injected via kubectl patch --subresource=status.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: wafwebacl
spec:
  skipDelete: true
  namespace: wafwebacl
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Seed: namespace + general-policy WAFConfig with effectiveConfig status
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-general-policy
      try:
        - apply:
            file: 00-wafwebacl-namespace.yaml
        - apply:
            file: 01-general-policy-config.yaml
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"block","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: defaults.scope applied when instance scope matches defaults.
    # Scenario: scope-default-regional
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-scope-default-regional
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-scope-default
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-scope-default
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-scope-default
              spec:
                scope: REGIONAL

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2: mandatory.scope overrides instance scope.
    # Scenario: scope-mandatory-override
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac2-scope-mandatory-override
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"REGIONAL","defaultAction":"","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"CLOUDFRONT","defaultAction":"block","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-scope-mandatory
              spec:
                scope: CLOUDFRONT
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-scope-mandatory
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-scope-mandatory
              spec:
                scope: REGIONAL

    # ──────────────────────────────────────────────────────────────────────────
    # AC-3: instance scope overrides defaults.
    # Scenario: scope-instance-override
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-scope-instance-override
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"block","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-scope-instance
              spec:
                scope: CLOUDFRONT
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-scope-instance
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-scope-instance
              spec:
                scope: CLOUDFRONT

    # ──────────────────────────────────────────────────────────────────────────
    # AC-4: scope immutability — WAFConfig CRD rejects dual mandatory+defaults scope.
    # Scope immutability on WAFWebACL is enforced by ACK WAFv2 in production.
    # Scenario: scope-immutable (negative)
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac4-scope-immutable-validation
      try:
        - script:
            content: |
              kubectl apply -f - <<'EOF' && echo "UNEXPECTEDLY ACCEPTED" || echo "REJECTED AS EXPECTED"
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFConfig
              metadata:
                name: dual-scope-webacl
                namespace: wafwebacl
                labels:
                  aws.kropath.run/resource-name: dual-scope-webacl
              spec:
                mandatory:
                  scope: "REGIONAL"
                defaults:
                  scope: "CLOUDFRONT"
              EOF
            check:
              ($stdout): (contains(@, 'REJECTED AS EXPECTED'))

    # ──────────────────────────────────────────────────────────────────────────
    # AC-5: mandatory.defaultAction=block overrides instance allow.
    # Scenario: default-action-mandatory-block
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac5-default-action-mandatory-block
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"block","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"allow","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-da-mandatory-block
              spec:
                scope: REGIONAL
                defaultAction:
                  allow: {}
                visibilityConfig:
                  metricName: webacl-da-mandatory-block
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-da-mandatory-block
              spec:
                defaultAction:
                  block: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-6: mandatory.defaultAction=allow overrides instance block.
    # Scenario: default-action-mandatory-allow
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac6-default-action-mandatory-allow
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"allow","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"block","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-da-mandatory-allow
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-da-mandatory-allow
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-da-mandatory-allow
              spec:
                defaultAction:
                  allow: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-7: instance defaultAction with custom allow handling passthrough (webACLInstance variant).
    # No mandatory defaultAction, instance sets allow with customRequestHandling.
    # Scenario: default-action-instance-custom-allow
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac7-default-action-instance-custom-allow
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-da-instance-custom
              spec:
                scope: REGIONAL
                defaultAction:
                  allow:
                    customRequestHandling:
                      insertHeaders:
                        - name: X-Custom-Header
                          value: custom-value
                visibilityConfig:
                  metricName: webacl-da-instance-custom
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-da-instance-custom
              spec:
                defaultAction:
                  allow:
                    customRequestHandling:
                      insertHeaders:
                        - name: X-Custom-Header
                          value: custom-value

    # ──────────────────────────────────────────────────────────────────────────
    # AC-8: defaults.defaultAction=block applied when no mandatory or instance defaultAction.
    # Scenario: default-action-default-block
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac8-default-action-default-block
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"block","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-da-default-block
              spec:
                scope: REGIONAL
                visibilityConfig:
                  metricName: webacl-da-default-block
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-da-default-block
              spec:
                defaultAction:
                  block: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-9: mandatory.cloudWatchMetricsEnabled overrides instance false.
    # Scenario: visibility-mandatory-cloudwatch
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac9-visibility-mandatory-cloudwatch
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"block","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-vis-mandatory-cw
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-vis-mandatory-cw
                  cloudWatchMetricsEnabled: false
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-vis-mandatory-cw
              spec:
                visibilityConfig:
                  cloudWatchMetricsEnabled: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-10: mandatory.sampledRequestsEnabled overrides instance false.
    # Scenario: visibility-mandatory-sampling
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac10-visibility-mandatory-sampling
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":true,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"block","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-vis-mandatory-sample
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-vis-mandatory-sample
                  sampledRequestsEnabled: false
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-vis-mandatory-sample
              spec:
                visibilityConfig:
                  sampledRequestsEnabled: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-11: defaults.cloudWatchMetricsEnabled applied when no mandatory override.
    # Scenario: visibility-default-cloudwatch
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac11-visibility-default-cloudwatch
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"block","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-vis-default-cw
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-vis-default-cw
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-vis-default-cw
              spec:
                visibilityConfig:
                  cloudWatchMetricsEnabled: true

    # ──────────────────────────────────────────────────────────────────────────
    # AC-12: visibilityConfig.metricName derived from effectiveName.
    # Scenario: visibility-metric-name-derived
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac12-visibility-metric-name-derived
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: block-ips
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: placeholder
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: block-ips
              spec:
                visibilityConfig:
                  metricName: wafwebacl-block-ips

    # ──────────────────────────────────────────────────────────────────────────
    # AC-13: rules passthrough — basic IP-based rate limit rule.
    # Scenario: rules-custom-rule
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac13-rules-custom-rule
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-rules-custom
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-rules-custom
                rules:
                  - name: block-bad-ips
                    priority: 1
                    action:
                      block: {}
                    statement:
                      ipSetReferenceStatement:
                        arn: arn:aws:wafv2:us-east-1:123456789012:regional/ipset/bad-ips/abc123
                    visibilityConfig:
                      metricName: block-bad-ips
                      cloudWatchMetricsEnabled: true
                      sampledRequestsEnabled: true
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-rules-custom
              spec:
                rules:
                  - name: block-bad-ips
                    priority: 1
                    action:
                      block: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-14: rule group reference passthrough.
    # Scenario: rules-rule-group-reference
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac14-rules-rule-group-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-rules-rgref
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-rules-rgref
                rules:
                  - name: custom-rule-group
                    priority: 2
                    statement:
                      ruleGroupReferenceStatement:
                        arn: arn:aws:wafv2:us-east-1:123456789012:regional/rulegroup/my-group/xyz789
                    overrideAction:
                      none: {}
                    visibilityConfig:
                      metricName: custom-rule-group
                      cloudWatchMetricsEnabled: true
                      sampledRequestsEnabled: true
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-rules-rgref
              spec:
                rules:
                  - name: custom-rule-group
                    priority: 2

    # ──────────────────────────────────────────────────────────────────────────
    # AC-15: managed rule group reference passthrough.
    # Scenario: rules-managed-rule-group
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac15-rules-managed-rule-group
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-rules-mrg
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-rules-mrg
                rules:
                  - name: aws-core-rules
                    priority: 10
                    statement:
                      managedRuleGroupStatement:
                        vendorName: AWS
                        name: AWSManagedRulesCommonRuleSet
                    overrideAction:
                      none: {}
                    visibilityConfig:
                      metricName: aws-core-rules
                      cloudWatchMetricsEnabled: true
                      sampledRequestsEnabled: true
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-rules-mrg
              spec:
                rules:
                  - name: aws-core-rules
                    priority: 10
                    statement:
                      managedRuleGroupStatement:
                        vendorName: AWS
                        name: AWSManagedRulesCommonRuleSet

    # ──────────────────────────────────────────────────────────────────────────
    # AC-16: managed rule group with excluded rules passthrough.
    # Scenario: rules-excluded-rules
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac16-rules-excluded-rules
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-rules-excl
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-rules-excl
                rules:
                  - name: core-rules-with-exclusions
                    priority: 10
                    statement:
                      managedRuleGroupStatement:
                        vendorName: AWS
                        name: AWSManagedRulesCommonRuleSet
                        excludedRules:
                          - name: SizeRestrictions_BODY
                          - name: CrossSiteScripting_BODY
                    overrideAction:
                      none: {}
                    visibilityConfig:
                      metricName: core-rules-with-exclusions
                      cloudWatchMetricsEnabled: true
                      sampledRequestsEnabled: true
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-rules-excl
              spec:
                rules:
                  - name: core-rules-with-exclusions
                    statement:
                      managedRuleGroupStatement:
                        excludedRules:
                          - name: SizeRestrictions_BODY
                          - name: CrossSiteScripting_BODY

    # ──────────────────────────────────────────────────────────────────────────
    # AC-17: rule action overrides on managed rule group passthrough.
    # Scenario: rules-action-overrides
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac17-rules-action-overrides
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-rules-overrides
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-rules-overrides
                rules:
                  - name: core-rules-overrides
                    priority: 10
                    statement:
                      managedRuleGroupStatement:
                        vendorName: AWS
                        name: AWSManagedRulesCommonRuleSet
                        ruleActionOverrides:
                          - name: SizeRestrictions_BODY
                            actionToUse:
                              count: {}
                    overrideAction:
                      none: {}
                    visibilityConfig:
                      metricName: core-rules-overrides
                      cloudWatchMetricsEnabled: true
                      sampledRequestsEnabled: true
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-rules-overrides
              spec:
                rules:
                  - name: core-rules-overrides
                    statement:
                      managedRuleGroupStatement:
                        ruleActionOverrides:
                          - name: SizeRestrictions_BODY
                            actionToUse:
                              count: {}

    # ──────────────────────────────────────────────────────────────────────────
    # AC-18: IPSet reference statement in a rule passthrough.
    # Scenario: rules-ipset-reference
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac18-rules-ipset-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-rules-ipref
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-rules-ipref
                rules:
                  - name: ip-allow-list
                    priority: 1
                    action:
                      allow: {}
                    statement:
                      ipSetReferenceStatement:
                        arn: arn:aws:wafv2:us-east-1:123456789012:regional/ipset/allow-list/def456
                        ipSetForwardedIPConfig:
                          headerName: X-Forwarded-For
                          fallbackBehavior: MATCH
                          position: FIRST
                    visibilityConfig:
                      metricName: ip-allow-list
                      cloudWatchMetricsEnabled: true
                      sampledRequestsEnabled: true
        - assert:
            resource:
              apiVersion: wafv2.services.k8s.aws/v1alpha1
              kind: WebACL
              metadata:
                name: webacl-rules-ipref
              spec:
                rules:
                  - name: ip-allow-list
                    action:
                      allow: {}
                    statement:
                      ipSetReferenceStatement:
                        arn: arn:aws:wafv2:us-east-1:123456789012:regional/ipset/allow-list/def456

    # ──────────────────────────────────────────────────────────────────────────
    # AC-19: AND statement combining multiple conditions passthrough.
    # Scenario: rules-and-statement
