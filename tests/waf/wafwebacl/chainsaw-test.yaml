    # ──────────────────────────────────────────────────────────────────────────
    # AC-32: spec.tags merged into WAFv2 tags array (mandatory wins).
    # Scenario: tags-spec-merge
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac32-tags-spec-merge
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafwebacl \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"block","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFWebACL
              metadata:
                name: webacl-tags-merge
              spec:
                scope: REGIONAL
                defaultAction:
                  block: {}
                visibilityConfig:
                  metricName: webacl-tags-merge
                tags:
                  service: api-gateway
        - script:
            content: |
              # Order-independent tag assertion using jq
              TAGS=$(kubectl get webacl webacl-tags-merge -n wafwebacl -o json | jq -r '.spec.tags // []')
              for kv in '{"key":"env","value":"prod"}' '{"key":"team","value":"platform"}' '{"key":"service","value":"api-gateway"}'; do
                echo "$TAGS" | jq -e --argjson kv "$kv" 'any(.[]; .key == $kv.key and .value == $kv.value)' > /dev/null \
                  || { echo "MISSING TAG: $kv"; exit 1; }
              done
              echo "ALL TAGS PRESENT"
            check:
              ($stdout): (contains(@, 'ALL TAGS PRESENT'))

