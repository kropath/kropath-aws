# Assert: production CR was accepted with correct mandatory field values (AC-9).
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: production
  namespace: wafconfig
spec:
  mandatory:
    scope: "REGIONAL"
    defaultAction: "block"
    cloudWatchMetricsEnabled: true
    sampledRequestsEnabled: false
    namingTemplate: "prod-{name}"
  defaults:
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: true
