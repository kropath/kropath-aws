# aws-waf-01 Chainsaw tests — 11 acceptance criteria.
# AC-1 through AC-6, AC-9: isolated tests (no controller required).
# AC-7, AC-8, AC-10, AC-11: integration tests (require kropath-controller
#   with --enable-waf-cascade). Commented out pending KRO-882.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: wafconfig
spec:
  # Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
  # skipDelete"): skipDelete stops chainsaw's end-of-test cascade delete; the ephemeral
  # kind cluster is discarded after the suite.
  skipDelete: true
  namespace: wafconfig
  steps:
    - name: prepare
      try:
        - apply:
            file: 00-namespace-wafconfig.yaml

    # AC-1: CRD is present with correct field structure.
    - name: ac1-crd-present
      try:
        - assert:
            file: 01-assert-crd-present.yaml

    # AC-2: scope in both tiers is rejected.
    - name: ac2-reject-dual-tier-scope
      try:
        - apply:
            file: 02-dual-tier-scope.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: WAFConfig
                check:
                  ($error != null): true

    # AC-3: defaultAction in both tiers is rejected.
    - name: ac3-reject-dual-tier-default-action
      try:
        - apply:
            file: 03-dual-tier-default-action.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: WAFConfig
                check:
                  ($error != null): true

    # AC-4: cloudWatchMetricsEnabled=true in both tiers is rejected.
    - name: ac4-reject-dual-tier-cloudwatch
      try:
        - apply:
            file: 04-dual-tier-cloudwatch.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: WAFConfig
                check:
                  ($error != null): true

    # AC-5: sampledRequestsEnabled=true in both tiers is rejected.
    - name: ac5-reject-dual-tier-sampling
      try:
        - apply:
            file: 05-dual-tier-sampling.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: WAFConfig
                check:
                  ($error != null): true

    # AC-6: namingTemplate in both tiers is rejected.
    - name: ac6-reject-dual-tier-naming
      try:
        - apply:
            file: 06-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: WAFConfig
                check:
                  ($error != null): true

    # AC-1 (happy path): general-policy CR is accepted with zero mandatory fields and correct defaults.
    - name: ac1-general-policy-cr
      try:
        - apply:
            file: 07-general-policy-cr.yaml
        - assert:
            file: 08-assert-general-policy.yaml

    # AC-9: production CR with mandatory fields is accepted.
    - name: ac9-production-cr
      try:
        - apply:
            file: 09-production-cr.yaml
        - assert:
            file: 10-assert-production.yaml

