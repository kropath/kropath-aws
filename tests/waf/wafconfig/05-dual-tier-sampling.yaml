# Should be rejected: sampledRequestsEnabled=true in both mandatory and defaults.
# AC-5: dual-tier mutual-exclusion for sampledRequestsEnabled field.
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: invalid-dual-tier-sampling
  namespace: wafconfig
spec:
  mandatory:
    scope: ""
    defaultAction: ""
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: true
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    scope: ""
    defaultAction: ""
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: true
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
