# Should be rejected: scope in both mandatory and defaults (non-zero values).
# AC-2: dual-tier mutual-exclusion for scope field.
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: invalid-dual-tier-scope
  namespace: wafconfig
spec:
  mandatory:
    scope: "REGIONAL"
    defaultAction: ""
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    scope: "CLOUDFRONT"
    defaultAction: ""
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
