# AC-1: general-policy CR — zero mandatory fields, correct defaults.
# Mirrors profiles/waf/general-policy.yaml for the test namespace.
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: general-policy
  namespace: wafconfig
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    scope: ""
    defaultAction: ""
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    scope: "REGIONAL"
    defaultAction: "block"
    cloudWatchMetricsEnabled: true
    sampledRequestsEnabled: true
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
