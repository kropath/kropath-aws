# AC-9: production CR — mandatory scope enforced, metrics enforced, custom naming template.
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: production
  namespace: wafconfig
  labels:
    aws.kropath.run/resource-name: production
spec:
  mandatory:
    scope: "REGIONAL"
    defaultAction: "block"
    cloudWatchMetricsEnabled: true
    sampledRequestsEnabled: false
    namingTemplate: "prod-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    scope: ""
    defaultAction: ""
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: true
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
