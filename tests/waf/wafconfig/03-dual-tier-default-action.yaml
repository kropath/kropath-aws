# Should be rejected: defaultAction in both mandatory and defaults (non-zero values).
# AC-3: dual-tier mutual-exclusion for defaultAction field.
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: invalid-dual-tier-default-action
  namespace: wafconfig
spec:
  mandatory:
    scope: ""
    defaultAction: "block"
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    scope: ""
    defaultAction: "allow"
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
