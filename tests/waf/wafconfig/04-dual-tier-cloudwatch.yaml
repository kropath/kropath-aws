# Should be rejected: cloudWatchMetricsEnabled=true in both mandatory and defaults.
# AC-4: dual-tier mutual-exclusion for cloudWatchMetricsEnabled field.
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: invalid-dual-tier-cloudwatch
  namespace: wafconfig
spec:
  mandatory:
    scope: ""
    defaultAction: ""
    cloudWatchMetricsEnabled: true
    sampledRequestsEnabled: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    scope: ""
    defaultAction: ""
    cloudWatchMetricsEnabled: true
    sampledRequestsEnabled: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
