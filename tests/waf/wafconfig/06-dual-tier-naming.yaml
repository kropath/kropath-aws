# Should be rejected: namingTemplate in both mandatory and defaults (non-empty values).
# AC-6: dual-tier mutual-exclusion for namingTemplate field.
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: invalid-dual-tier-naming
  namespace: wafconfig
spec:
  mandatory:
    scope: ""
    defaultAction: ""
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: false
    namingTemplate: "{namespace}-{name}-mandatory"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    scope: ""
    defaultAction: ""
    cloudWatchMetricsEnabled: false
    sampledRequestsEnabled: false
    namingTemplate: "{namespace}-{name}-default"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
