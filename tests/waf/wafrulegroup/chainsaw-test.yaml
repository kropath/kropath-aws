    # ──────────────────────────────────────────────────────────────────────────
    # AC-26: tags merge array format (defaults < instance < mandatory).
    # Scenario: tags-merge-array-format
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac26-tags-merge-array-format
      try:
        - script:
            content: |
              kubectl patch wafconfig general-policy -n wafrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"scope":"","defaultAction":"","cloudWatchMetricsEnabled":false,"sampledRequestsEnabled":false,"namingTemplate":"","tags":{"cost-centre":"platform","waf-managed":"true"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"scope":"REGIONAL","defaultAction":"block","cloudWatchMetricsEnabled":true,"sampledRequestsEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: WAFRuleGroup
              metadata:
                name: rg-tags
              spec:
                scope: REGIONAL
                capacity: 50
                visibilityConfig:
                  metricName: rg-tags
                tags:
                  app: firewall
        - script:
            content: |
              kubectl wait wafrulegroup rg-tags -n wafrulegroup --for=condition=Ready --timeout=60s
              TAGS=$(kubectl get rulegroups.wafv2.services.k8s.aws rg-tags -n wafrulegroup -o json | jq -r '.spec.tags // []')
              for kv in '{"key":"cost-centre","value":"platform"}' '{"key":"waf-managed","value":"true"}' '{"key":"app","value":"firewall"}'; do
                echo "$TAGS" | jq -e --argjson kv "$kv" 'any(.[]; .key == $kv.key and .value == $kv.value)' > /dev/null \
                  || { echo "MISSING TAG: $kv"; exit 1; }
              done
              echo "ALL TAGS PRESENT"
            check:
              (contains($stdout, 'ALL TAGS PRESENT')): true

