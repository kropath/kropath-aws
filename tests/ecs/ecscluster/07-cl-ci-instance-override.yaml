---
# Uses general-policy (mandatory.containerInsights=false) but instance enables CI.
# Verifies mandatory=false does NOT block instance from enabling.
apiVersion: aws.kropath.run/v1alpha1
kind: ECSCluster
metadata:
  name: cl-ci-inst-override
  namespace: ecscluster
spec:
  configRef: general-policy
  containerInsights: true
  deletionPolicy: retain
