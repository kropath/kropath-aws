# aws-ecs-02 Chainsaw tests — all 20 acceptance criteria for ECSCluster RGD.
# Canonical pattern: unique resource name per step, spec.skipDelete: true, no inter-step deletes.
# Controller not available; status.effectiveConfig patched via kubectl to simulate governance.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ecscluster
spec:
  namespace: ecscluster
  steps:
    # AC-1: Basic cluster accepted with general-policy config.
    # Naming template {namespace}-{name} → ecscluster-cl-basic.
    - name: ac1-basic-cluster-accepted
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch ecsconfig general-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 02-cl-basic.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cl-basic-ecscluster-naming
                namespace: ecscluster
              data:
                resourceName: ecscluster-cl-basic
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-basic
                namespace: ecscluster
              spec:
                name: ecscluster-cl-basic

    # AC-2: Container Insights disabled when no governance and no instance override.
    - name: ac2-container-insights-default-disabled
      try:
        - apply:
            file: 03-cl-no-ci.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-no-ci
                namespace: ecscluster
              spec:
                settings:
                  - name: containerInsights
                    value: disabled

    # AC-3: Container Insights enabled via instance spec.containerInsights: true.
    - name: ac3-container-insights-instance-enabled
      try:
        - apply:
            file: 04-cl-ci-instance.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-ci-instance
                namespace: ecscluster
              spec:
                settings:
                  - name: containerInsights
                    value: enabled

    # AC-4: mandatory.containerInsights=true forces enabled regardless of instance spec.
    - name: ac4-container-insights-mandatory-override
      try:
        - apply:
            file: 05-ci-mandatory-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig ci-mandatory-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":true,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 06-cl-ci-mandatory.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-ci-mandatory
                namespace: ecscluster
              spec:
                settings:
                  - name: containerInsights
                    value: enabled

    # AC-5: mandatory.containerInsights=false does NOT block instance from enabling it.
    - name: ac5-container-insights-mandatory-false-no-block
      try:
        - apply:
            file: 07-cl-ci-instance-override.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-ci-inst-override
                namespace: ecscluster
              spec:
                settings:
                  - name: containerInsights
                    value: enabled

    # AC-6: defaults.containerInsights=true is applied when instance does not set it.
    - name: ac6-container-insights-defaults-enabled
      try:
        - apply:
            file: 08-ci-defaults-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig ci-defaults-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":true,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 09-cl-ci-defaults.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-ci-defaults
                namespace: ecscluster
              spec:
                settings:
                  - name: containerInsights
                    value: enabled

    # AC-7: nameOverride takes precedence over naming template.
    - name: ac7-name-override
      try:
        - apply:
            file: 10-cl-name-override.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cl-name-override-ecscluster-naming
                namespace: ecscluster
              data:
                resourceName: my-custom-cluster
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-name-override
                namespace: ecscluster
              spec:
                name: my-custom-cluster

    # AC-8: Naming template from defaults.namingTemplate resolves {namespace}-{name}.
    # Default template already tested in AC-1; here we verify a custom defaults template.
    - name: ac8-naming-defaults-template
      try:
        - apply:
            file: 11-custom-naming-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig custom-naming-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"ecs-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 12-cl-custom-naming.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cl-custom-naming-ecscluster-naming
                namespace: ecscluster
              data:
                resourceName: ecs-cl-custom-naming
                namingStatus: valid

    # AC-9: mandatory.namingTemplate overrides defaults.namingTemplate.
    - name: ac9-naming-mandatory-template
      try:
        - apply:
            file: 13-mandatory-naming-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig mandatory-naming-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"mand-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"ecs-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 14-cl-mandatory-naming.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cl-mandatory-naming-ecscluster-naming
                namespace: ecscluster
              data:
                resourceName: mand-cl-mandatory-naming
                namingStatus: valid

    # AC-10: Capacity providers list passes through to ACK Cluster spec.
    - name: ac10-capacity-providers-passthrough
      try:
        - apply:
            file: 15-cl-capacity-providers.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-cap-providers
                namespace: ecscluster
              spec:
                capacityProviders:
                  - FARGATE
                  - FARGATE_SPOT

    # AC-11: Default capacity provider strategy passes through.
    - name: ac11-default-capacity-provider-strategy
      try:
        - apply:
            file: 16-cl-cap-strategy.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-cap-strategy
                namespace: ecscluster
              spec:
                defaultCapacityProviderStrategy:
                  - capacityProvider: FARGATE
                    weight: 1
                    base: 0
                  - capacityProvider: FARGATE_SPOT
                    weight: 2
                    base: 0

    # AC-12: Execute command configuration passes through.
    - name: ac12-execute-command-config
      try:
        - apply:
            file: 17-cl-exec-command.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-exec-cmd
                namespace: ecscluster
              spec:
                configuration:
                  executeCommandConfiguration:
                    logging: OVERRIDE
                    kmsKeyID: arn:aws:kms:ap-southeast-2:123456789012:key/test-key

    # AC-13: Service connect defaults namespace passes through.
    - name: ac13-service-connect-defaults
      try:
        - apply:
            file: 18-cl-svc-connect.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-svc-connect
                namespace: ecscluster
              spec:
                serviceConnectDefaults:
                  namespace: my-service-namespace

    # AC-14: deletionPolicy=retain sets annotation services.k8s.aws/deletion-policy=retain.
    - name: ac14-deletion-policy-retain
      try:
        - apply:
            file: 19-cl-retain.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-retain
                namespace: ecscluster
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-15: deletionPolicy=delete sets annotation services.k8s.aws/deletion-policy=delete.
    - name: ac15-deletion-policy-delete
      try:
        - apply:
            file: 20-cl-delete.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-delete
                namespace: ecscluster
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-16: Tags merged: defaults < instance < mandatory (last-writer-wins).
    # Use script with jq for order-independent tag assertion (CEL list order is unstable).
    - name: ac16-tag-merge
      try:
        - apply:
            file: 21-tag-merge-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig tag-merge-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{"env":"prod","owner":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{"env":"dev","team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 22-cl-tag-merge.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-tag-merge
                namespace: ecscluster
        - script:
            content: |
              TAGS=$(kubectl get clusters.ecs.services.k8s.aws cl-tag-merge -n ecscluster -o json | jq '.spec.tags')
              echo "Tags: $TAGS"
              # mandatory.tags.env=prod overrides defaults.tags.env=dev; mandatory wins
              echo "$TAGS" | jq -e 'map(select(.key=="env")) | .[0].value == "prod"'
              # mandatory.tags.owner=platform present
              echo "$TAGS" | jq -e 'map(select(.key=="owner")) | .[0].value == "platform"'
              # defaults.tags.team=platform present (not overridden by mandatory)
              echo "$TAGS" | jq -e 'map(select(.key=="team")) | .[0].value == "platform"'
              # instance.tags.cost-centre=engineering present
              echo "$TAGS" | jq -e 'map(select(.key=="cost-centre")) | .[0].value == "engineering"'

    # AC-17: syncedLabels appear as aws.kropath.run/<key> in K8s labels AND plain key in cloud tags.
    - name: ac17-synced-labels
      try:
        - apply:
            file: 23-synced-labels-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig synced-labels-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{"workload":"ecs"},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 24-cl-synced-labels.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-synced-labels
                namespace: ecscluster
                labels:
                  aws.kropath.run/workload: ecs
        - script:
            content: |
              # syncedLabels also appear as plain key in cloud tags
              TAGS=$(kubectl get clusters.ecs.services.k8s.aws cl-synced-labels -n ecscluster -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="workload")) | .[0].value == "ecs"'

    # AC-18: syncedAnnotations appear as aws.kropath.run/<key> in K8s annotations AND plain key in cloud tags.
    - name: ac18-synced-annotations
      try:
        - apply:
            file: 25-synced-annotations-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig synced-annotations-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"cost-centre":"platform"}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 26-cl-synced-annotations.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-synced-annotations
                namespace: ecscluster
                annotations:
                  aws.kropath.run/cost-centre: platform
        - script:
            content: |
              TAGS=$(kubectl get clusters.ecs.services.k8s.aws cl-synced-annotations -n ecscluster -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="cost-centre")) | .[0].value == "platform"'

    # AC-19: namingStatus=invalid-unresolved-tokens when template contains unresolvable {account_id}
    # and the config does not provide accountId in status.effectiveConfig.aws.
    - name: ac19-naming-status-invalid-unresolved
      try:
        - apply:
            file: 27-unresolved-naming-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig unresolved-naming-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}-{unknown_token}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 28-cl-unresolved-naming.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cl-unresolved-naming-ecscluster-naming
                namespace: ecscluster
              data:
                namingStatus: invalid-unresolved-tokens

    # AC-20: configRef pointing to a named (non-general-policy) ECSConfig is used.
    - name: ac20-custom-configref
      try:
        - apply:
            file: 29-fargate-policy.yaml
        - script:
            content: |
              kubectl patch ecsconfig fargate-policy -n ecscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":true,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{"policy-type":"fargate"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 30-cl-fargate-configref.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: cl-fargate-configref
                namespace: ecscluster
              spec:
                # Container Insights enabled from fargate-policy mandatory governance
                settings:
                  - name: containerInsights
                    value: enabled
        - script:
            content: |
              TAGS=$(kubectl get clusters.ecs.services.k8s.aws cl-fargate-configref -n ecscluster -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="policy-type")) | .[0].value == "fargate"'
