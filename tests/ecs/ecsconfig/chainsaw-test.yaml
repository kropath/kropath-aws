# aws-ecs-01 Chainsaw tests — all 12 acceptance criteria for ECSConfig CRD (KRO-522).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ecsconfig
spec:
  namespace: ecsconfig
  steps:
    # AC-1: general-policy ECSConfig accepted in kro-system (tested in ecsconfig ns).
    # CR carries label aws.kropath.run/resource-name: general-policy, defaults include
    # defaultNetworkMode: "awsvpc", defaultPlatformVersion: "LATEST",
    # namingTemplate: "{namespace}-{name}".
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-ecsconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSConfig
              metadata:
                name: general-policy
                namespace: ecsconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  containerInsights: false
                  defaultLaunchType: ""
                  defaultNetworkMode: ""
                  defaultPlatformVersion: ""
                  namingTemplate: ""
                defaults:
                  defaultNetworkMode: "awsvpc"
                  defaultPlatformVersion: "LATEST"
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    # AC-2: defaultLaunchType cannot be set in both mandatory and defaults.
    - name: ac2-reject-dual-tier-launch-type
      try:
        - apply:
            file: 02-invalid-dual-tier-launch-type.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECSConfig
                check:
                  ($error != null): true

    # AC-3: defaultPlatformVersion cannot be set in both mandatory and defaults.
    - name: ac3-reject-dual-tier-platform-version
      try:
        - apply:
            file: 03-invalid-dual-tier-platform-version.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECSConfig
                check:
                  ($error != null): true

    # AC-4: defaultNetworkMode cannot be set in both mandatory and defaults.
    - name: ac4-reject-dual-tier-network-mode
      try:
        - apply:
            file: 04-invalid-dual-tier-network-mode.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECSConfig
                check:
                  ($error != null): true

    # AC-5: defaultTaskCPU cannot be set in both mandatory and defaults.
    - name: ac5-reject-dual-tier-task-cpu
      try:
        - apply:
            file: 05-invalid-dual-tier-task-cpu.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECSConfig
                check:
                  ($error != null): true

    # AC-6: defaultTaskMemory cannot be set in both mandatory and defaults.
    - name: ac6-reject-dual-tier-task-memory
      try:
        - apply:
            file: 06-invalid-dual-tier-task-memory.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECSConfig
                check:
                  ($error != null): true

    # AC-7: containerInsights cannot be set to true in both mandatory and defaults.
    - name: ac7-reject-dual-tier-container-insights
      try:
        - apply:
            file: 07-invalid-dual-tier-container-insights.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECSConfig
                check:
                  ($error != null): true

    # AC-8: effectiveConfig cascade — KropathConfig mandatory.ecs.containerInsights: true
    # flows into effectiveConfig.mandatory.containerInsights. Controller not available;
    # status patched via kubectl patch --subresource=status to simulate cascade.
    - name: ac8-effective-cascade
      try:
        - apply:
            file: 08-effective-cascade.yaml
        - script:
            content: |
              kubectl patch ecsconfig cascade-policy -n ecsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":true,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSConfig
              metadata:
                name: cascade-policy
                namespace: ecsconfig
              status:
                effectiveConfig:
                  mandatory:
                    containerInsights: true
                  defaults:
                    defaultPlatformVersion: "LATEST"
                    defaultNetworkMode: "awsvpc"
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 08-effective-cascade.yaml

    # AC-9: defaults.namingTemplate present in status.effectiveConfig after controller patch.
    - name: ac9-naming-template
      try:
        - apply:
            file: 09-naming-template.yaml
        - script:
            content: |
              kubectl patch ecsconfig naming-policy -n ecsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSConfig
              metadata:
                name: naming-policy
                namespace: ecsconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 09-naming-template.yaml

    # AC-10: ECSConfig with mandatory Fargate governance fields accepted.
    # mandatory.defaultLaunchType: "FARGATE", mandatory.defaultPlatformVersion: "1.4.0",
    # mandatory.defaultNetworkMode: "awsvpc" — all three fields present in mandatory tier.
    - name: ac10-mandatory-fargate-accepted
      try:
        - apply:
            file: 10-mandatory-fargate.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSConfig
              metadata:
                name: fargate-only
                namespace: ecsconfig
                labels:
                  aws.kropath.run/resource-name: fargate-only
              spec:
                mandatory:
                  defaultLaunchType: "FARGATE"
                  defaultPlatformVersion: "1.4.0"
                  defaultNetworkMode: "awsvpc"
      cleanup:
        - delete:
            file: 10-mandatory-fargate.yaml

    # AC-11: tag merge — ECSConfig mandatory.tags + KropathConfig mandatory.tags merged
    # in effectiveConfig.mandatory.tags. Simulated via status patch.
    - name: ac11-tag-merge
      try:
        - apply:
            file: 11-tag-merge.yaml
        - script:
            content: |
              kubectl patch ecsconfig tags-policy -n ecsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{"service-type":"containers","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSConfig
              metadata:
                name: tags-policy
                namespace: ecsconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      service-type: containers
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform
      cleanup:
        - delete:
            file: 11-tag-merge.yaml

    # AC-12: syncedLabels in effectiveConfig — mandatory.syncedLabels: {workload-type: ecs}.
    # Simulated via status patch; RGD applies as both K8s label and cloud tag.
    - name: ac12-synced-labels
      try:
        - apply:
            file: 12-synced-labels.yaml
        - script:
            content: |
              kubectl patch ecsconfig synced-labels-policy -n ecsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{"workload-type":"ecs"},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSConfig
              metadata:
                name: synced-labels-policy
                namespace: ecsconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      workload-type: ecs
      cleanup:
        - delete:
            file: 12-synced-labels.yaml
