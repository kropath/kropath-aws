---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSService
metadata:
  name: svc-exec-cmd
  namespace: ecsservice
spec:
  configRef: general-policy
  clusterName: default-cluster
  taskDefinition: default-task:1
  launchType: FARGATE
  desiredCount: 1
  enableExecuteCommand: true
  deletionPolicy: retain
