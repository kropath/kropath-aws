---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSService
metadata:
  name: svc-load-balancers
  namespace: ecsservice
spec:
  configRef: general-policy
  clusterName: default-cluster
  taskDefinition: default-task:1
  launchType: FARGATE
  desiredCount: 1
  loadBalancers:
    - targetGroupARN: arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:targetgroup/my-tg/abc123
      containerName: app
      containerPort: 8080
  deletionPolicy: retain
