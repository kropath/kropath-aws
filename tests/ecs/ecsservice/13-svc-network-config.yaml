---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSService
metadata:
  name: svc-network-config
  namespace: ecsservice
spec:
  configRef: general-policy
  clusterName: default-cluster
  taskDefinition: default-task:1
  launchType: FARGATE
  desiredCount: 1
  networkConfiguration:
    awsvpcConfiguration:
      subnets:
        - subnet-abc123
        - subnet-def456
      securityGroups:
        - sg-abc123
      assignPublicIp: DISABLED
  deletionPolicy: retain
