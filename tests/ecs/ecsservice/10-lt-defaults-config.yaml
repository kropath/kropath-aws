---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSConfig
metadata:
  name: lt-defaults-policy
  namespace: ecsservice
  labels:
    aws.kropath.run/resource-name: lt-defaults-policy
spec:
  mandatory:
    containerInsights: false
    defaultLaunchType: ""
    defaultPlatformVersion: ""
    defaultNetworkMode: ""
    defaultTaskCPU: ""
    defaultTaskMemory: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    containerInsights: false
    defaultLaunchType: "EC2"
    defaultPlatformVersion: "LATEST"
    defaultNetworkMode: "awsvpc"
    defaultTaskCPU: ""
    defaultTaskMemory: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
