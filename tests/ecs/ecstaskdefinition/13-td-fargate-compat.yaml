---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSTaskDefinition
metadata:
  name: td-fargate-compat
  namespace: ecstaskdefinition
spec:
  configRef: general-policy
  containerDefinitions:
    - name: app
      image: nginx:latest
      essential: true
  requiresCompatibilities:
    - FARGATE
  deletionPolicy: retain
