---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSTaskDefinition
metadata:
  name: td-port-mappings
  namespace: ecstaskdefinition
spec:
  configRef: general-policy
  containerDefinitions:
    - name: app
      image: nginx:latest
      essential: true
      portMappings:
        - containerPort: 8080
          hostPort: 0
          protocol: tcp
  deletionPolicy: retain
