---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSTaskDefinition
metadata:
  name: td-mount-points
  namespace: ecstaskdefinition
spec:
  configRef: general-policy
  containerDefinitions:
    - name: app
      image: nginx:latest
      essential: true
      mountPoints:
        - containerPath: /data
          sourceVolume: data-volume
          readOnly: false
  volumes:
    - name: data-volume
      host:
        sourcePath: /data
  deletionPolicy: retain
