---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSConfig
metadata:
  name: cpu-mandatory-policy
  namespace: ecstaskdefinition
  labels:
    aws.kropath.run/resource-name: cpu-mandatory-policy
spec:
  mandatory:
    containerInsights: false
    defaultLaunchType: ""
    defaultPlatformVersion: ""
    defaultNetworkMode: ""
    defaultTaskCPU: "1024"
    defaultTaskMemory: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    containerInsights: false
    defaultLaunchType: ""
    defaultPlatformVersion: "LATEST"
    defaultNetworkMode: "awsvpc"
    defaultTaskCPU: ""
    defaultTaskMemory: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
