---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSTaskDefinition
metadata:
  name: td-name-override
  namespace: ecstaskdefinition
spec:
  configRef: general-policy
  nameOverride: my-custom-family
  containerDefinitions:
    - name: app
      image: nginx:latest
      essential: true
  deletionPolicy: retain
