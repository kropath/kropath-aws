---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSTaskDefinition
metadata:
  name: td-custom-configref
  namespace: ecstaskdefinition
spec:
  configRef: td-cpu-mandatory-policy
  containerDefinitions:
    - name: app
      image: nginx:latest
      essential: true
  cpu: "256"
  memory: "512"
  deletionPolicy: retain
