# aws-ecs-04 Chainsaw tests — all 27 acceptance criteria for ECSTaskDefinition RGD.
# Canonical pattern: unique resource name per step, spec.skipDelete: true, no inter-step deletes.
# effectiveName maps to spec.family (not spec.name) — ACK TaskDefinition primary key.
# essential: true must be explicitly set on containers (Go zero-value is false, AWS default is true).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ecstaskdefinition
spec:
  namespace: ecstaskdefinition
  steps:
    # AC-1: Basic task definition accepted; spec.family = effectiveName from naming template.
    - name: ac1-basic-task-definition-accepted
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch ecsconfig general-policy -n ecstaskdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 02-td-basic.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: td-basic-ecstaskdefinition-naming
                namespace: ecstaskdefinition
              data:
                resourceName: ecstaskdefinition-td-basic
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-basic
                namespace: ecstaskdefinition
              spec:
                # family receives effectiveName, not metadata.name
                family: ecstaskdefinition-td-basic

    # AC-2: container definitions passthrough; essential=true is explicit.
    - name: ac2-container-definitions-essential-true
      try:
        - apply:
            file: 03-td-essential-true.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-essential-true
                namespace: ecstaskdefinition
              spec:
                containerDefinitions:
                  - name: app
                    image: nginx:latest
                    essential: true

    # AC-3: CPU from instance spec passes through.
    - name: ac3-cpu-instance
      try:
        - apply:
            file: 04-td-cpu-instance.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-cpu-instance
                namespace: ecstaskdefinition
              spec:
                cpu: "256"

    # AC-4: mandatory.defaultTaskCPU overrides instance spec.cpu.
    - name: ac4-cpu-mandatory-governance
      try:
        - apply:
            file: 05-cpu-mandatory-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig cpu-mandatory-policy -n ecstaskdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"1024","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 06-td-cpu-mandatory.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-cpu-mandatory
                namespace: ecstaskdefinition
              spec:
                cpu: "1024"

    # AC-5: defaults.defaultTaskCPU applied when instance does not set cpu.
    - name: ac5-cpu-defaults-governance
      try:
        - apply:
            file: 07-cpu-defaults-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig cpu-defaults-policy -n ecstaskdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"512","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 08-td-cpu-defaults.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-cpu-defaults
                namespace: ecstaskdefinition
              spec:
                cpu: "512"

    # AC-6: mandatory.defaultTaskMemory overrides instance spec.memory.
    - name: ac6-memory-mandatory-governance
      try:
        - apply:
            file: 09-memory-mandatory-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig memory-mandatory-policy -n ecstaskdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"2048","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 10-td-memory-mandatory.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-memory-mandatory
                namespace: ecstaskdefinition
              spec:
                memory: "2048"

    # AC-7: networkMode governance — mandatory.defaultNetworkMode overrides instance.
    - name: ac7-network-mode-mandatory-governance
      try:
        - apply:
            file: 11-network-mode-mandatory-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig network-mode-mandatory-policy -n ecstaskdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"bridge","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 12-td-network-mode-mandatory.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-network-mode-mandatory
                namespace: ecstaskdefinition
              spec:
                networkMode: awsvpc

    # AC-8: requiresCompatibilities passthrough (Fargate).
    - name: ac8-requires-compatibilities
      try:
        - apply:
            file: 13-td-fargate-compat.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-fargate-compat
                namespace: ecstaskdefinition
              spec:
                requiresCompatibilities:
                  - FARGATE

    # AC-9: executionRoleARN passthrough.
    - name: ac9-execution-role-arn
      try:
        - apply:
            file: 14-td-execution-role.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-execution-role
                namespace: ecstaskdefinition
              spec:
                executionRoleARN: arn:aws:iam::123456789012:role/ecsTaskExecutionRole

    # AC-10: taskRoleARN passthrough.
    - name: ac10-task-role-arn
      try:
        - apply:
            file: 15-td-task-role.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-task-role
                namespace: ecstaskdefinition
              spec:
                taskRoleARN: arn:aws:iam::123456789012:role/myTaskRole

    # AC-11: port mappings in container definitions pass through.
    - name: ac11-port-mappings
      try:
        - apply:
            file: 16-td-port-mappings.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-port-mappings
                namespace: ecstaskdefinition
              spec:
                containerDefinitions:
                  - name: app
                    essential: true
                    portMappings:
                      - containerPort: 8080
                        protocol: tcp

    # AC-12: environment variables in container definitions pass through.
    - name: ac12-environment-variables
      try:
        - apply:
            file: 17-td-env-vars.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-env-vars
                namespace: ecstaskdefinition
              spec:
                containerDefinitions:
                  - name: app
                    essential: true
                    environment:
                      - name: APP_ENV
                        value: production

    # AC-13: log configuration in container definitions passes through.
    - name: ac13-log-configuration
      try:
        - apply:
            file: 18-td-log-config.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-log-config
                namespace: ecstaskdefinition
              spec:
                containerDefinitions:
                  - name: app
                    essential: true
                    logConfiguration:
                      logDriver: awslogs

    # AC-14: volumes passthrough.
    - name: ac14-volumes-passthrough
      try:
        - apply:
            file: 19-td-volumes.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-volumes
                namespace: ecstaskdefinition
              spec:
                volumes:
                  - name: data-volume

    # AC-15: ephemeralStorage passthrough.
    - name: ac15-ephemeral-storage
      try:
        - apply:
            file: 20-td-ephemeral.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-ephemeral
                namespace: ecstaskdefinition
              spec:
                ephemeralStorage:
                  sizeInGiB: 50

    # AC-16: nameOverride → spec.family = nameOverride value.
    - name: ac16-name-override
      try:
        - apply:
            file: 21-td-name-override.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: td-name-override-ecstaskdefinition-naming
                namespace: ecstaskdefinition
              data:
                resourceName: my-custom-family
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-name-override
                namespace: ecstaskdefinition
              spec:
                family: my-custom-family

    # AC-17: tag merge — mandatory wins over instance wins over defaults.
    - name: ac17-tag-merge
      try:
        - apply:
            file: 22-tag-merge-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig td-tag-merge-policy -n ecstaskdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{"env":"dev","team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 23-td-tag-merge.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-tag-merge
                namespace: ecstaskdefinition
        - script:
            content: |
              TAGS=$(kubectl get taskdefinition td-tag-merge -n ecstaskdefinition -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="env")) | .[0].value == "prod"'
              echo "$TAGS" | jq -e 'map(select(.key=="team")) | .[0].value == "platform"'

    # AC-18: syncedLabels appear as aws.kropath.run/<key> in K8s labels AND plain key in cloud tags.
    - name: ac18-synced-labels
      try:
        - apply:
            file: 24-synced-labels-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig td-synced-labels-policy -n ecstaskdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{"workload":"ecs"},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 25-td-synced-labels.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-synced-labels
                namespace: ecstaskdefinition
                labels:
                  aws.kropath.run/workload: ecs
        - script:
            content: |
              TAGS=$(kubectl get taskdefinition td-synced-labels -n ecstaskdefinition -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="workload")) | .[0].value == "ecs"'

    # AC-19: deletionPolicy=retain.
    - name: ac19-deletion-policy-retain
      try:
        - apply:
            file: 26-td-retain.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-retain
                namespace: ecstaskdefinition
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-20: deletionPolicy=delete.
    - name: ac20-deletion-policy-delete
      try:
        - apply:
            file: 27-td-delete.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-delete
                namespace: ecstaskdefinition
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-21: namingStatus=invalid-unresolved-tokens.
    - name: ac21-naming-status-invalid
      try:
        - apply:
            file: 28-unresolved-naming-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig td-unresolved-naming-policy -n ecstaskdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{name}-{unknown_token}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 29-td-unresolved-naming.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: td-unresolved-naming-ecstaskdefinition-naming
                namespace: ecstaskdefinition
              data:
                namingStatus: invalid-unresolved-tokens

    # AC-22: pidMode passthrough.
    - name: ac22-pid-mode
      try:
        - apply:
            file: 30-td-pid-mode.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-pid-mode
                namespace: ecstaskdefinition
              spec:
                pidMode: task

    # AC-23: ipcMode passthrough.
    - name: ac23-ipc-mode
      try:
        - apply:
            file: 31-td-ipc-mode.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-ipc-mode
                namespace: ecstaskdefinition
              spec:
                ipcMode: task

    # AC-24: Full Fargate task definition (cpu + memory + networkMode + requiresCompatibilities).
    - name: ac24-full-fargate-task
      try:
        - apply:
            file: 32-td-full-fargate.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-full-fargate
                namespace: ecstaskdefinition
              spec:
                family: ecstaskdefinition-td-full-fargate
                cpu: "256"
                memory: "512"
                networkMode: awsvpc
                requiresCompatibilities:
                  - FARGATE

    # AC-25: mount points in container definitions pass through.
    - name: ac25-mount-points
      try:
        - apply:
            file: 33-td-mount-points.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-mount-points
                namespace: ecstaskdefinition
              spec:
                containerDefinitions:
                  - name: app
                    essential: true
                    mountPoints:
                      - containerPath: /data
                        sourceVolume: data-volume
                        readOnly: false

    # AC-26: container dependsOn passthrough.
    - name: ac26-container-depends-on
      try:
        - apply:
            file: 34-td-depends-on.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-depends-on
                namespace: ecstaskdefinition
              spec:
                containerDefinitions:
                  - name: app
                    essential: true
                  - name: sidecar
                    essential: false
                    dependsOn:
                      - containerName: app
                        condition: START

    # AC-27: configRef to named ECSConfig with mandatory CPU governance.
    - name: ac27-custom-configref
      try:
        - apply:
            file: 35-cpu-gpu-policy.yaml
        - script:
            content: |
              kubectl patch ecsconfig td-cpu-gpu-policy -n ecstaskdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"4096","defaultTaskMemory":"8192","namingTemplate":"","tags":{"workload-type":"gpu"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 36-td-custom-configref.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: TaskDefinition
              metadata:
                name: td-custom-configref
                namespace: ecstaskdefinition
              spec:
                cpu: "4096"
                memory: "8192"
        - script:
            content: |
              TAGS=$(kubectl get taskdefinition td-custom-configref -n ecstaskdefinition -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="workload-type")) | .[0].value == "gpu"'
