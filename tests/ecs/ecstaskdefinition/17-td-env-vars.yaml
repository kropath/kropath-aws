---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSTaskDefinition
metadata:
  name: td-env-vars
  namespace: ecstaskdefinition
spec:
  configRef: general-policy
  containerDefinitions:
    - name: app
      image: nginx:latest
      essential: true
      environment:
        - name: APP_ENV
          value: production
  deletionPolicy: retain
