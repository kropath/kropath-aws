---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSTaskDefinition
metadata:
  name: td-log-config
  namespace: ecstaskdefinition
spec:
  configRef: general-policy
  containerDefinitions:
    - name: app
      image: nginx:latest
      essential: true
      logConfiguration:
        logDriver: awslogs
        options:
          awslogs-group: /ecs/app
          awslogs-region: ap-southeast-2
  deletionPolicy: retain
