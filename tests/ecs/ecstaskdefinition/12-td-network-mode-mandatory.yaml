---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSTaskDefinition
metadata:
  name: td-network-mode-mandatory
  namespace: ecstaskdefinition
spec:
  configRef: network-mode-mandatory-policy
  containerDefinitions:
    - name: app
      image: nginx:latest
      essential: true
  networkMode: bridge
  deletionPolicy: retain
