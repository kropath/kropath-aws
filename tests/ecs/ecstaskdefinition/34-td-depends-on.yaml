---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSTaskDefinition
metadata:
  name: td-depends-on
  namespace: ecstaskdefinition
spec:
  configRef: general-policy
  containerDefinitions:
    - name: init
      image: busybox:latest
      essential: false
    - name: app
      image: nginx:latest
      essential: true
      dependsOn:
        - containerName: init
          condition: COMPLETE
  deletionPolicy: retain
