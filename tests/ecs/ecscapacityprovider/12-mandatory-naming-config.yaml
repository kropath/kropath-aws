---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSConfig
metadata:
  name: cp-mandatory-naming-policy
  namespace: ecscapacityprovider
  labels:
    aws.kropath.run/resource-name: cp-mandatory-naming-policy
spec:
  mandatory:
    containerInsights: false
    defaultLaunchType: ""
    defaultPlatformVersion: ""
    defaultNetworkMode: ""
    defaultTaskCPU: ""
    defaultTaskMemory: ""
    namingTemplate: "cp-mandatory-naming-fixed"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    containerInsights: false
    defaultLaunchType: ""
    defaultPlatformVersion: "LATEST"
    defaultNetworkMode: "awsvpc"
    defaultTaskCPU: ""
    defaultTaskMemory: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
