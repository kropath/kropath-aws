---
# ECSCapacityProvider Chainsaw Test Suite
# Spec: kropath-core/docs/specs/aws/aws-ecs-05-ecscapacityprovider.md
# Pattern: canonical unique-name-per-step + skipDelete (see CLAUDE.md)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ecscapacityprovider
spec:
  namespace: ecscapacityprovider
  skipDelete: true
  steps:
    # ── AC-1: Basic ASG provider — spec.name = effectiveName (namespace-name) ──
    - name: ac1-basic-asg-provider
      try:
        - apply:
            file: 02-cp-basic-asg.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-basic-asg
                namespace: ecscapacityprovider
              spec:
                name: ecscapacityprovider-cp-basic-asg
                autoScalingGroupProvider:
                  autoScalingGroupARN: arn:aws:autoscaling:ap-southeast-2:123456789012:autoScalingGroup:asg-basic
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSCapacityProvider
              metadata:
                name: cp-basic-asg
              status:
                resourceName: ecscapacityprovider-cp-basic-asg
                namingStatus: valid

    # ── AC-2: Managed scaling config ──
    - name: ac2-managed-scaling
      try:
        - apply:
            file: 03-cp-managed-scaling.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-managed-scaling
                namespace: ecscapacityprovider
              spec:
                autoScalingGroupProvider:
                  managedScaling:
                    status: ENABLED
                    targetCapacity: 80
                    minimumScalingStepSize: 1
                    maximumScalingStepSize: 10

    # ── AC-3: Managed termination protection ──
    - name: ac3-managed-termination-protection
      try:
        - apply:
            file: 04-cp-managed-termination.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-managed-termination
                namespace: ecscapacityprovider
              spec:
                autoScalingGroupProvider:
                  managedTerminationProtection: ENABLED

    # ── AC-4: Managed draining enabled ──
    - name: ac4-managed-draining
      try:
        - apply:
            file: 05-cp-managed-draining.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-managed-draining
                namespace: ecscapacityprovider
              spec:
                autoScalingGroupProvider:
                  managedDraining: ENABLED

    # ── AC-5: Managed instances provider — ECSCapacityProvider CR accepted ──
    # Note: managedInstancesProvider.cPUArchitecture and .operatingSystemFamily are not
    # present in ACK ECS v1.5.0 CapacityProvider CRD; assert only that the kro resource
    # and its ACK child were created successfully.
    - name: ac5-managed-instances-cpu-arch
      try:
        - apply:
            file: 06-cp-managed-instances.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-managed-instances
                namespace: ecscapacityprovider
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSCapacityProvider
              metadata:
                name: cp-managed-instances
              status:
                namingStatus: valid

    # ── AC-6: Managed instances provider OS family — ECSCapacityProvider CR accepted ──
    - name: ac6-managed-instances-os-family
      try:
        - apply:
            file: 07-cp-os-family.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-os-family
                namespace: ecscapacityprovider
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSCapacityProvider
              metadata:
                name: cp-os-family
              status:
                namingStatus: valid

    # ── AC-7: Provider conflict advisory — both ASG and managed instances set ──
    - name: ac7-provider-conflict-advisory
      try:
        - apply:
            file: 08-cp-provider-conflict.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cp-provider-conflict-ecscapacityprovider-provider-conflict
                namespace: ecscapacityprovider

    # ── AC-8: No advisory ConfigMap when only one provider is set ──
    - name: ac8-no-advisory-when-single-provider
      try:
        - apply:
            file: 09-cp-single-provider.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-single-provider
                namespace: ecscapacityprovider
        - script:
            content: |
              COUNT=$(kubectl get configmap -n ecscapacityprovider \
                -l aws.kropath.run/kropath-type=ecscapacityprovider-validation-error \
                --field-selector metadata.name=cp-single-provider-ecscapacityprovider-provider-conflict \
                -o json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['items']))")
              if [ "$COUNT" != "0" ]; then
                echo "Expected no advisory ConfigMap for single-provider CP, found $COUNT"
                exit 1
              fi
              echo "PASS: no advisory ConfigMap"

    # ── AC-9: NameOverride custom cloud resource name ──
    - name: ac9-name-override
      try:
        - apply:
            file: 10-cp-name-override.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-name-override
                namespace: ecscapacityprovider
              spec:
                name: my-custom-cp
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSCapacityProvider
              metadata:
                name: cp-name-override
              status:
                resourceName: my-custom-cp
                namingStatus: valid

    # ── AC-10: Default naming template produces namespace-name ──
    - name: ac10-default-naming
      try:
        - apply:
            file: 11-cp-default-naming.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-default-naming
                namespace: ecscapacityprovider
              spec:
                name: ecscapacityprovider-cp-default-naming

    # ── AC-11: Mandatory naming template overrides defaults ──
    - name: ac11-mandatory-naming-template
      try:
        - apply:
            file: 12-mandatory-naming-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig cp-mandatory-naming-policy -n ecscapacityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"cp-mandatory-naming-fixed","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 13-cp-mandatory-naming.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-mandatory-naming
                namespace: ecscapacityprovider
              spec:
                name: cp-mandatory-naming-fixed

    # ── AC-12: Unresolved naming tokens → namingStatus invalid ──
    - name: ac12-unresolved-naming-status
      try:
        - apply:
            file: 14-unresolved-naming-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig cp-unresolved-naming-policy -n ecscapacityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{name}-{unknown_token}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 15-cp-unresolved-naming.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECSCapacityProvider
              metadata:
                name: cp-unresolved-naming
              status:
                namingStatus: invalid-unresolved-tokens

    # ── AC-13: Tag merge — mandatory wins over spec wins over defaults ──
    - name: ac13-tag-merge
      try:
        - apply:
            file: 16-tag-merge-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig cp-tag-merge-policy -n ecscapacityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{"env":"dev","team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 17-cp-tag-merge.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-tag-merge
                namespace: ecscapacityprovider
        - script:
            content: |
              TAGS=$(kubectl get capacityprovider -n ecscapacityprovider cp-tag-merge -o json | \
                jq '.spec.tags')
              echo "$TAGS"
              echo "$TAGS" | jq -e 'map(select(.key=="env")) | .[0].value == "prod"' || \
                { echo "env tag should be prod (mandatory wins)"; exit 1; }
              echo "$TAGS" | jq -e 'map(select(.key=="team")) | .[0].value == "platform"' || \
                { echo "team tag should be platform (from defaults)"; exit 1; }
              echo "PASS: tag merge"

    # ── AC-14: Synced labels — appear in metadata.labels and spec.tags ──
    - name: ac14-synced-labels
      try:
        - apply:
            file: 18-synced-labels-config.yaml
        - script:
            content: |
              kubectl patch ecsconfig cp-synced-labels-policy -n ecscapacityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"","defaultNetworkMode":"","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"","tags":{},"syncedLabels":{"team":"platform"},"syncedAnnotations":{}},"defaults":{"containerInsights":false,"defaultLaunchType":"","defaultPlatformVersion":"LATEST","defaultNetworkMode":"awsvpc","defaultTaskCPU":"","defaultTaskMemory":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 19-cp-synced-labels.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-synced-labels
                namespace: ecscapacityprovider
                labels:
                  aws.kropath.run/team: platform
        - script:
            content: |
              TAGS=$(kubectl get capacityprovider -n ecscapacityprovider cp-synced-labels -o json | \
                jq '.spec.tags')
              echo "$TAGS"
              echo "$TAGS" | jq -e 'map(select(.key=="team")) | .[0].value == "platform"' || \
                { echo "team tag should appear in spec.tags from syncedLabels"; exit 1; }
              echo "PASS: synced labels in spec.tags"

    # ── AC-15: Deletion policy retain ──
    - name: ac15-deletion-policy-retain
      try:
        - apply:
            file: 20-cp-retain.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-retain
                namespace: ecscapacityprovider
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # ── AC-16: Deletion policy delete ──
    - name: ac16-deletion-policy-delete
      try:
        - apply:
            file: 21-cp-delete.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-delete
                namespace: ecscapacityprovider
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # ── AC-17: Owner references on naming ConfigMap and ACK CapacityProvider ──
    - name: ac17-owner-references
      try:
        - apply:
            file: 22-cp-owner-ref.yaml
        - assert:
            resource:
              apiVersion: ecs.services.k8s.aws/v1alpha1
              kind: CapacityProvider
              metadata:
                name: cp-owner-ref
                namespace: ecscapacityprovider
        - script:
            content: |
              CP_UID=$(kubectl get ecscapacityprovider -n ecscapacityprovider cp-owner-ref \
                -o jsonpath='{.metadata.uid}')
              # Check naming ConfigMap ownerRef
              CM_OWNER=$(kubectl get configmap -n ecscapacityprovider \
                cp-owner-ref-ecscapacityprovider-naming \
                -o json | jq -r '.metadata.ownerReferences[0].uid')
              if [ "$CM_OWNER" != "$CP_UID" ]; then
                echo "Naming ConfigMap ownerRef uid mismatch: expected $CP_UID got $CM_OWNER"
                exit 1
              fi
              # Check ACK CapacityProvider ownerRef
              CP_OWNER=$(kubectl get capacityprovider -n ecscapacityprovider cp-owner-ref \
                -o json | jq -r '.metadata.ownerReferences[0].uid')
              if [ "$CP_OWNER" != "$CP_UID" ]; then
                echo "ACK CapacityProvider ownerRef uid mismatch: expected $CP_UID got $CP_OWNER"
                exit 1
              fi
              echo "PASS: owner references"
