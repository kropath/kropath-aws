---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSCapacityProvider
metadata:
  name: cp-name-override
  namespace: ecscapacityprovider
spec:
  configRef: general-policy
  nameOverride: my-custom-cp
  autoScalingGroupProvider:
    autoScalingGroupARN: arn:aws:autoscaling:ap-southeast-2:123456789012:autoScalingGroup:asg-override
  deletionPolicy: retain
