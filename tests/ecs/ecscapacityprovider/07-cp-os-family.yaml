---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSCapacityProvider
metadata:
  name: cp-os-family
  namespace: ecscapacityprovider
spec:
  configRef: general-policy
  managedInstancesProvider:
    infrastructureRoleARN: arn:aws:iam::123456789012:role/ecs-infra-role
    instanceLaunchTemplate:
      ec2InstanceProfileARN: arn:aws:iam::123456789012:instance-profile/ecs-instance-profile
  deletionPolicy: retain
