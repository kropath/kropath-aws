---
apiVersion: aws.kropath.run/v1alpha1
kind: ECSCapacityProvider
metadata:
  name: cp-managed-scaling
  namespace: ecscapacityprovider
spec:
  configRef: general-policy
  autoScalingGroupProvider:
    autoScalingGroupARN: arn:aws:autoscaling:ap-southeast-2:123456789012:autoScalingGroup:asg-scaling
    managedScaling:
      status: ENABLED
      targetCapacity: 80
      minimumScalingStepSize: 1
      maximumScalingStepSize: 10
  deletionPolicy: retain
