# EC2VPCEndpoint governance tests — 11 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2vpcendpoint
spec:
  skipDelete: true
  namespace: ec2vpcendpoint
  steps:
    # AC-1: Basic Gateway endpoint — vpcId and serviceName required fields.
    # AC-7: Standard metadata: managed-by label and app.kubernetes.io/instance on ACK child.
    - name: ac1-basic-gateway-endpoint
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac1-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: ac1-cfg
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.s3
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac1-vpce
                namespace: ec2vpcendpoint
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-vpce
              spec:
                vpcID: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.s3
                vpcEndpointType: Gateway

    # AC-2: Interface endpoint with subnetIds and securityGroupIds.
    - name: ac2-interface-endpoint
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac2-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: ac2-cfg
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.ec2
                vpcEndpointType: Interface
                subnetIds:
                  - subnet-0123456789abcdef0
                  - subnet-0123456789abcdef1
                securityGroupIds:
                  - sg-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac2-vpce
                namespace: ec2vpcendpoint
              spec:
                vpcEndpointType: Interface
                subnetIDs:
                  - subnet-0123456789abcdef0
                  - subnet-0123456789abcdef1
                securityGroupIDs:
                  - sg-0123456789abcdef0

    # AC-3: policyDocument passed through to ACK spec.policyDocument.
    - name: ac3-policy-document
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac3-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: ac3-cfg
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.s3
                policyDocument: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"*","Resource":"*"}]}'
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac3-vpce
                namespace: ec2vpcendpoint
              spec:
                policyDocument: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"*","Resource":"*"}]}'

    # AC-4: routeTableIds for Gateway endpoints.
    - name: ac4-route-table-ids
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac4-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: ac4-cfg
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.s3
                routeTableIds:
                  - rtb-0123456789abcdef0
                  - rtb-0123456789abcdef1
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac4-vpce
                namespace: ec2vpcendpoint
              spec:
                routeTableIDs:
                  - rtb-0123456789abcdef0
                  - rtb-0123456789abcdef1

    # AC-5: privateDnsEnabled=true passed through to ACK spec.privateDNSEnabled.
    - name: ac5-private-dns-enabled
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac5-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: ac5-cfg
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.ec2
                vpcEndpointType: Interface
                privateDnsEnabled: true
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac5-vpce
                namespace: ec2vpcendpoint
              spec:
                privateDNSEnabled: "true"

    # AC-6: privateDnsEnabled=false passed through as "false".
    - name: ac6-private-dns-disabled
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac6-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: ac6-cfg
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.s3
                privateDnsEnabled: false
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac6-vpce
                namespace: ec2vpcendpoint
              spec:
                privateDNSEnabled: "false"

    # AC-8: Tag merge — mandatory > spec > defaults. Assert via script (unstable order).
    - name: ac8-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"env":"dev","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac8-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: ac8-cfg
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.s3
                tags:
                  team: networking
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac8-vpce
                namespace: ec2vpcendpoint
        - script:
            content: |
              TAGS=$(kubectl get vpcendpoint ac8-vpce -n ec2vpcendpoint -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="networking")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="region" and .value=="us-east-1")' || (echo "FAIL: defaults-only tag missing" && exit 1)

    # AC-9: Synced labels propagated to K8s child resource labels with aws.kropath.run/ prefix.
    - name: ac9-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{"cost-center":"networking"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac9-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: ac9-cfg
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.s3
                syncedLabels:
                  owner: platform-team
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac9-vpce
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/owner: platform-team
                  aws.kropath.run/cost-center: networking

    # AC-10: Deletion policy delete — annotation set on ACK child.
    - name: ac10-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-cfg
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: kubectl patch ec2config ac10-cfg -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac10-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: ac10-cfg
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.s3
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac10-vpce
                namespace: ec2vpcendpoint
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-11: Custom configRef selects a different EC2Config.
    - name: ac11-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: custom-vpce-policy
                namespace: ec2vpcendpoint
                labels:
                  aws.kropath.run/resource-name: custom-vpce-policy
        - script:
            content: kubectl patch ec2config custom-vpce-policy -n ec2vpcendpoint --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"policy":"custom"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCEndpoint
              metadata:
                name: ac11-vpce
                namespace: ec2vpcendpoint
              spec:
                configRef: custom-vpce-policy
                vpcId: vpc-0123456789abcdef0
                serviceName: com.amazonaws.us-east-1.s3
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              metadata:
                name: ac11-vpce
                namespace: ec2vpcendpoint
        - script:
            content: |
              kubectl get vpcendpoint ac11-vpce -n ec2vpcendpoint -o json | jq -e '.spec.tags[] | select(.key=="policy" and .value=="custom")' || (echo "FAIL: custom policy tag not applied" && exit 1)
