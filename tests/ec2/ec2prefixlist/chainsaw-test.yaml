apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2prefixlist
spec:
  skipDelete: true
  namespace: ec2prefixlist
  steps:
    # AC1: Basic creation — required fields only, default naming ({namespace}-{name}).
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac1-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac1-cfg
                addressFamily: IPv4
                maxEntries: 10
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac1-pl
                namespace: ec2prefixlist
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-pl
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: ec2prefixlist-ac1-pl
                addressFamily: IPv4
                maxEntries: 10

    # AC2: Cloud resource name derived from default naming template {namespace}-{name}.
    - name: ac2-naming-template-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac2-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac2-cfg
                addressFamily: IPv6
                maxEntries: 100
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac2-pl
                namespace: ec2prefixlist
              spec:
                name: ec2prefixlist-ac2-pl
                addressFamily: IPv6
                maxEntries: 100

    # AC3: nameOverride — explicit cloud resource name bypasses naming template.
    - name: ac3-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac3-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac3-cfg
                nameOverride: my-corporate-prefixlist
                addressFamily: IPv4
                maxEntries: 50
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac3-pl
                namespace: ec2prefixlist
              spec:
                name: my-corporate-prefixlist

    # AC4: Mandatory naming template overrides defaults template.
    - name: ac4-mandatory-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"mandatory-{name}"},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac4-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac4-cfg
                addressFamily: IPv4
                maxEntries: 20
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac4-pl
                namespace: ec2prefixlist
              spec:
                name: mandatory-ac4-pl

    # AC5: Unresolved naming token — ACK child not created (includeWhen guard).
    # namingStatus should be "invalid-unresolved-tokens" when token cannot be resolved.
    - name: ac5-unresolved-token-guard
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{tag.nonexistent}-{name}"},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac5-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac5-cfg
                addressFamily: IPv4
                maxEntries: 5
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac5-pl
                namespace: ec2prefixlist
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              COUNT=$(kubectl get managedprefixlist -n ec2prefixlist --no-headers 2>/dev/null | grep "^ac5-pl " | wc -l)
              if [ "$COUNT" -gt 0 ]; then echo "ACK child should NOT be created for unresolved token"; exit 1; fi
              echo "OK: ACK child not created (includeWhen guard correct)"

    # AC6: Entries specified — CIDR entries added to prefix list.
    - name: ac6-with-entries
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac6-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac6-cfg
                addressFamily: IPv4
                maxEntries: 20
                entries:
                  - cidr: 10.0.0.0/8
                    description: RFC1918 class A
                  - cidr: 172.16.0.0/12
                    description: RFC1918 class B
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac6-pl
                namespace: ec2prefixlist
              spec:
                entries:
                  - cidr: 10.0.0.0/8
                    description: RFC1918 class A
                  - cidr: 172.16.0.0/12
                    description: RFC1918 class B

    # AC7: maxEntries enforced.
    - name: ac7-max-entries
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac7-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac7-cfg
                addressFamily: IPv4
                maxEntries: 1000
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac7-pl
                namespace: ec2prefixlist
              spec:
                maxEntries: 1000

    # AC8: Deletion policy delete.
    - name: ac8-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac8-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac8-cfg
                addressFamily: IPv4
                maxEntries: 10
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac8-pl
                namespace: ec2prefixlist
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC9: Spec tags appear in cloud tags.
    - name: ac9-spec-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac9-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac9-cfg
                addressFamily: IPv4
                maxEntries: 10
                tags:
                  Service: egress-filtering
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac9-pl
                namespace: ec2prefixlist
        - script:
            content: |
              TAGS=$(kubectl get managedprefixlist ac9-pl -n ec2prefixlist -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Service" and .value == "egress-filtering")) | length == 1' || (echo "Missing Service cloud tag"; exit 1)

    # AC10: Defaults tags from EC2Config applied.
    - name: ac10-defaults-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: kubectl patch ec2config ac10-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"Team":"security"},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac10-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac10-cfg
                addressFamily: IPv4
                maxEntries: 10
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac10-pl
                namespace: ec2prefixlist
        - script:
            content: |
              TAGS=$(kubectl get managedprefixlist ac10-pl -n ec2prefixlist -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Team" and .value == "security")) | length == 1' || (echo "Missing Team defaults tag"; exit 1)

    # AC11: Mandatory tags override spec and defaults.
    - name: ac11-mandatory-tags-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: kubectl patch ec2config ac11-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"Env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"Env":"dev"},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac11-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac11-cfg
                addressFamily: IPv4
                maxEntries: 10
                tags:
                  Env: staging
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac11-pl
                namespace: ec2prefixlist
        - script:
            content: |
              TAGS=$(kubectl get managedprefixlist ac11-pl -n ec2prefixlist -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Env" and .value == "prod")) | length == 1' || (echo "Mandatory Env=prod should win"; exit 1)

    # AC12: syncedLabels dual-write.
    - name: ac12-syncedlabels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac12-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
        - script:
            content: kubectl patch ec2config ac12-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac12-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac12-cfg
                addressFamily: IPv4
                maxEntries: 10
                syncedLabels:
                  team: egress
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac12-pl
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/team: egress
        - script:
            content: |
              TAGS=$(kubectl get managedprefixlist ac12-pl -n ec2prefixlist -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "team" and .value == "egress")) | length == 1' || (echo "Missing team cloud tag from syncedLabels"; exit 1)

    # AC13: {tag.X} naming token resolved from spec tags.
    - name: ac13-tag-token-in-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac13-cfg
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
        - script:
            content: kubectl patch ec2config ac13-cfg -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{tag.project}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac13-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac13-cfg
                addressFamily: IPv4
                maxEntries: 10
                tags:
                  project: myapp
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac13-pl
                namespace: ec2prefixlist
              spec:
                name: ec2prefixlist-myapp-ac13-pl

    # AC14: configRef selects a non-default EC2Config.
    - name: ac14-configref-selection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac14-custom-policy
                namespace: ec2prefixlist
                labels:
                  aws.kropath.run/resource-name: ac14-custom-policy
        - script:
            content: kubectl patch ec2config ac14-custom-policy -n ec2prefixlist --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"PolicySource":"custom"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2PrefixList
              metadata:
                name: ac14-pl
                namespace: ec2prefixlist
              spec:
                configRef: ac14-custom-policy
                addressFamily: IPv4
                maxEntries: 10
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: ManagedPrefixList
              metadata:
                name: ac14-pl
                namespace: ec2prefixlist
        - script:
            content: |
              TAGS=$(kubectl get managedprefixlist ac14-pl -n ec2prefixlist -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "PolicySource" and .value == "custom")) | length == 1' || (echo "configRef did not select custom-policy config"; exit 1)
