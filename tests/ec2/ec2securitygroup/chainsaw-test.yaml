# aws-ec2-04 EC2SecurityGroup governance tests — 14 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# Naming note: default template is {namespace}-{name}; test namespace = ec2securitygroup.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2securitygroup
spec:
  skipDelete: true
  namespace: ec2securitygroup
  steps:
    # AC-1: Basic creation — ACK SecurityGroup appears with correct vpcID and description.
    # AC-12: Standard metadata labels.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac1-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac1-cfg
                description: "Test security group"
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac1-sg
                namespace: ec2securitygroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-sg
              spec:
                description: "Test security group"
                vpcID: vpc-0123456789abcdef0

    # AC-2: Default naming template {namespace}-{name} produces "ec2securitygroup-ac2-sg".
    - name: ac2-default-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac2-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac2-cfg
                description: "Naming test"
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac2-sg
                namespace: ec2securitygroup
              status:
                resourceName: ec2securitygroup-ac2-sg
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac2-sg
                namespace: ec2securitygroup
              spec:
                name: ec2securitygroup-ac2-sg

    # AC-3: Mandatory namingTemplate overrides default.
    - name: ac3-mandatory-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"mandatory-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"defaults-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac3-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac3-cfg
                description: "Mandatory naming test"
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac3-sg
                namespace: ec2securitygroup
              status:
                resourceName: mandatory-ac3-sg
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac3-sg
                namespace: ec2securitygroup
              spec:
                name: mandatory-ac3-sg

    # AC-4: Defaults namingTemplate used when mandatory has none.
    - name: ac4-defaults-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"dflt-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac4-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac4-cfg
                description: "Defaults naming test"
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac4-sg
                namespace: ec2securitygroup
              status:
                resourceName: dflt-ac4-sg
                namingStatus: valid

    # AC-5: nameOverride takes precedence over all naming templates.
    - name: ac5-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"mandatory-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac5-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac5-cfg
                nameOverride: my-explicit-sg-name
                description: "nameOverride test"
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac5-sg
                namespace: ec2securitygroup
              status:
                resourceName: my-explicit-sg-name
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac5-sg
                namespace: ec2securitygroup
              spec:
                name: my-explicit-sg-name

    # AC-6: Unresolved token in naming → namingStatus=invalid, ACK SG NOT created.
    - name: ac6-naming-invalid-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{tag.nonexistent}-sg","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac6-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac6-cfg
                description: "Invalid token test"
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac6-sg
                namespace: ec2securitygroup
              status:
                namingStatus: invalid-unresolved-tokens

    # AC-7: Ingress rules mapped to ACK IPPermission format.
    - name: ac7-ingress-rules
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac7-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac7-cfg
                description: "Ingress rules test"
                vpcId: vpc-0123456789abcdef0
                ingressRules:
                  - ipProtocol: tcp
                    fromPort: 443
                    toPort: 443
                    description: HTTPS
                    cidrBlocks:
                      - "0.0.0.0/0"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac7-sg
                namespace: ec2securitygroup
              spec:
                ingressRules:
                  - fromPort: 443
                    toPort: 443
                    ipProtocol: tcp
                    ipRanges:
                      - cidrIP: "0.0.0.0/0"
                        description: HTTPS

    # AC-8: Egress rules mapped.
    - name: ac8-egress-rules
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac8-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac8-cfg
                description: "Egress rules test"
                vpcId: vpc-0123456789abcdef0
                egressRules:
                  - ipProtocol: "-1"
                    fromPort: 0
                    toPort: 0
                    description: all-outbound
                    cidrBlocks:
                      - "0.0.0.0/0"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac8-sg
                namespace: ec2securitygroup
              spec:
                egressRules:
                  - fromPort: 0
                    toPort: 0
                    ipProtocol: "-1"
                    ipRanges:
                      - cidrIP: "0.0.0.0/0"
                        description: all-outbound

    # AC-9: sourceSecurityGroupIds → userIDGroupPairs mapping.
    - name: ac9-sg-source-rule
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac9-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac9-cfg
                description: "SG source rule test"
                vpcId: vpc-0123456789abcdef0
                ingressRules:
                  - ipProtocol: tcp
                    fromPort: 8080
                    toPort: 8080
                    description: from-lb
                    sourceSecurityGroupIds:
                      - sg-0fedcba9876543210
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac9-sg
                namespace: ec2securitygroup
              spec:
                ingressRules:
                  - fromPort: 8080
                    toPort: 8080
                    ipProtocol: tcp
                    userIDGroupPairs:
                      - groupID: sg-0fedcba9876543210
                        description: from-lb

    # AC-10: Tag merge — mandatory > spec > defaults.
    - name: ac10-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: kubectl patch ec2config ac10-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"env":"dev","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac10-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac10-cfg
                description: "Tag merge test"
                vpcId: vpc-0123456789abcdef0
                tags:
                  team: networking
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac10-sg
                namespace: ec2securitygroup
        - script:
            content: |
              TAGS=$(kubectl get securitygroup ac10-sg -n ec2securitygroup -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="networking")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="region" and .value=="us-east-1")' || (echo "FAIL: defaults-only tag missing" && exit 1)

    # AC-11: Synced labels propagated with aws.kropath.run/ prefix.
    - name: ac11-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: kubectl patch ec2config ac11-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac11-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac11-cfg
                description: "Synced labels test"
                vpcId: vpc-0123456789abcdef0
                syncedLabels:
                  cost-center: infra
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac11-sg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/cost-center: infra

    # AC-13: Deletion policy retain (default).
    - name: ac13-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac13-cfg
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
        - script:
            content: kubectl patch ec2config ac13-cfg -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac13-sg
                namespace: ec2securitygroup
              spec:
                configRef: ac13-cfg
                description: "Deletion policy test"
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac13-sg
                namespace: ec2securitygroup
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-14: Custom configRef selects a different EC2Config.
    - name: ac14-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: sg-policy
                namespace: ec2securitygroup
                labels:
                  aws.kropath.run/resource-name: sg-policy
        - script:
            content: kubectl patch ec2config sg-policy -n ec2securitygroup --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"policy":"sg-policy"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2SecurityGroup
              metadata:
                name: ac14-sg
                namespace: ec2securitygroup
              spec:
                configRef: sg-policy
                description: "Config selector test"
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: ac14-sg
                namespace: ec2securitygroup
        - script:
            content: |
              kubectl get securitygroup ac14-sg -n ec2securitygroup -o json | jq -e '.spec.tags[] | select(.key=="policy" and .value=="sg-policy")' || (echo "FAIL: config-selector tag not applied" && exit 1)
