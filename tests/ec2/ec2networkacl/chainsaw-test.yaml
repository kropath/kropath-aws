# EC2NetworkACL governance tests — 12 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2networkacl
spec:
  skipDelete: true
  namespace: ec2networkacl
  steps:
    # AC-1: Basic NACL creation with required vpcId.
    # AC-8: Standard metadata: managed-by label and app.kubernetes.io/instance on ACK child.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac1-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac1-cfg
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac1-nacl
                namespace: ec2networkacl
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-nacl
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                vpcID: vpc-0123456789abcdef0

    # AC-2: Inbound entry (egress=false) with protocol, ruleAction, and cidrBlock.
    - name: ac2-inbound-entry
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac2-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac2-cfg
                vpcId: vpc-0123456789abcdef0
                entries:
                  - ruleNumber: 100
                    protocol: "6"
                    ruleAction: allow
                    egress: false
                    cidrBlock: "0.0.0.0/0"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac2-nacl
                namespace: ec2networkacl
              spec:
                entries:
                  - ruleNumber: 100
                    protocol: "6"
                    ruleAction: allow
                    egress: false
                    cidrBlock: "0.0.0.0/0"

    # AC-3: Outbound entry (egress=true).
    - name: ac3-outbound-entry
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac3-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac3-cfg
                vpcId: vpc-0123456789abcdef0
                entries:
                  - ruleNumber: 100
                    protocol: "-1"
                    ruleAction: allow
                    egress: true
                    cidrBlock: "0.0.0.0/0"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac3-nacl
                namespace: ec2networkacl
              spec:
                entries:
                  - ruleNumber: 100
                    protocol: "-1"
                    ruleAction: allow
                    egress: true
                    cidrBlock: "0.0.0.0/0"

    # AC-4: Multiple entries — mixed inbound and outbound.
    - name: ac4-multiple-entries
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac4-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac4-cfg
                vpcId: vpc-0123456789abcdef0
                entries:
                  - ruleNumber: 100
                    protocol: "6"
                    ruleAction: allow
                    egress: false
                    cidrBlock: "10.0.0.0/8"
                  - ruleNumber: 200
                    protocol: "-1"
                    ruleAction: deny
                    egress: false
                    cidrBlock: "0.0.0.0/0"
                  - ruleNumber: 100
                    protocol: "-1"
                    ruleAction: allow
                    egress: true
                    cidrBlock: "0.0.0.0/0"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac4-nacl
                namespace: ec2networkacl
              spec:
                entries:
                  - ruleNumber: 100
                    protocol: "6"
                    ruleAction: allow
                    egress: false
                    cidrBlock: "10.0.0.0/8"
                  - ruleNumber: 200
                    protocol: "-1"
                    ruleAction: deny
                    egress: false
                    cidrBlock: "0.0.0.0/0"
                  - ruleNumber: 100
                    protocol: "-1"
                    ruleAction: allow
                    egress: true
                    cidrBlock: "0.0.0.0/0"

    # AC-5: Port range fields (from, to) passed through in portRange.
    - name: ac5-port-range
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac5-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac5-cfg
                vpcId: vpc-0123456789abcdef0
                entries:
                  - ruleNumber: 100
                    protocol: "6"
                    ruleAction: allow
                    egress: false
                    cidrBlock: "0.0.0.0/0"
                    portRange:
                      from: 443
                      to: 443
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac5-nacl
                namespace: ec2networkacl
              spec:
                entries:
                  - ruleNumber: 100
                    portRange:
                      from: 443
                      to: 443

    # AC-6: IPv6 CIDR mapping — spec.ipv6CidrBlock → ACK spec.ipv6CIDRBlock (all-caps CIDR).
    - name: ac6-ipv6-cidr
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac6-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac6-cfg
                vpcId: vpc-0123456789abcdef0
                entries:
                  - ruleNumber: 100
                    protocol: "-1"
                    ruleAction: allow
                    egress: false
                    ipv6CidrBlock: "::/0"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac6-nacl
                namespace: ec2networkacl
              spec:
                entries:
                  - ipv6CIDRBlock: "::/0"

    # AC-7: Subnet associations — subnetIds mapped to ACK associations array.
    - name: ac7-subnet-associations
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac7-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac7-cfg
                vpcId: vpc-0123456789abcdef0
                subnetIds:
                  - subnet-0123456789abcdef0
                  - subnet-0123456789abcdef1
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac7-nacl
                namespace: ec2networkacl
              spec:
                associations:
                  - subnetID: subnet-0123456789abcdef0
                  - subnetID: subnet-0123456789abcdef1

    # AC-9: Tag merge — mandatory > spec > defaults. Assert via script (unstable order).
    - name: ac9-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"env":"dev","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac9-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac9-cfg
                vpcId: vpc-0123456789abcdef0
                tags:
                  team: networking
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac9-nacl
                namespace: ec2networkacl
        - script:
            content: |
              TAGS=$(kubectl get networkacl ac9-nacl -n ec2networkacl -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="networking")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="region" and .value=="us-east-1")' || (echo "FAIL: defaults-only tag missing" && exit 1)

    # AC-10: Synced labels propagated to K8s child resource labels with aws.kropath.run/ prefix.
    - name: ac10-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: kubectl patch ec2config ac10-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{"cost-center":"networking"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac10-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac10-cfg
                vpcId: vpc-0123456789abcdef0
                syncedLabels:
                  owner: platform-team
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac10-nacl
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/owner: platform-team
                  aws.kropath.run/cost-center: networking

    # AC-11: Deletion policy delete — annotation set on ACK child.
    - name: ac11-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: kubectl patch ec2config ac11-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac11-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac11-cfg
                vpcId: vpc-0123456789abcdef0
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac11-nacl
                namespace: ec2networkacl
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-9a (retain): Deletion policy retain (default) — annotation set on ACK child.
    - name: ac11b-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11b-cfg
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: ac11b-cfg
        - script:
            content: kubectl patch ec2config ac11b-cfg -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac11b-nacl
                namespace: ec2networkacl
              spec:
                configRef: ac11b-cfg
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac11b-nacl
                namespace: ec2networkacl
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-12: Custom configRef selects a different EC2Config.
    - name: ac12-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: custom-nacl-policy
                namespace: ec2networkacl
                labels:
                  aws.kropath.run/resource-name: custom-nacl-policy
        - script:
            content: kubectl patch ec2config custom-nacl-policy -n ec2networkacl --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"policy":"custom"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NetworkACL
              metadata:
                name: ac12-nacl
                namespace: ec2networkacl
              spec:
                configRef: custom-nacl-policy
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NetworkACL
              metadata:
                name: ac12-nacl
                namespace: ec2networkacl
        - script:
            content: |
              kubectl get networkacl ac12-nacl -n ec2networkacl -o json | jq -e '.spec.tags[] | select(.key=="policy" and .value=="custom")' || (echo "FAIL: custom policy tag not applied" && exit 1)
