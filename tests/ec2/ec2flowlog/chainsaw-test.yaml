# aws-ec2-08 EC2FlowLog governance tests — 15 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# Governance: trafficType (ACCEPT|REJECT|ALL) and maxAggregationInterval (60|600) cascade
# through mandatory → instance → defaults (0 = unset).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2flowlog
spec:
  skipDelete: true
  namespace: ec2flowlog
  steps:
    # AC-1: Basic creation — resourceID, resourceType, logDestinationType wired through.
    # AC-13: Standard metadata labels.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac1-fl
                namespace: ec2flowlog
              spec:
                configRef: ac1-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                logDestinationType: cloud-watch-logs
                logGroupName: /aws/vpc/flow-logs
                deliverLogsPermissionArn: arn:aws:iam::123456789012:role/FlowLogRole
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac1-fl
                namespace: ec2flowlog
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-fl
              spec:
                resourceID: vpc-0123456789abcdef0
                resourceType: VPC
                logDestinationType: cloud-watch-logs
                logGroupName: /aws/vpc/flow-logs
                deliverLogsPermissionARN: arn:aws:iam::123456789012:role/FlowLogRole

    # AC-2: trafficType from mandatory tier overrides instance and defaults.
    - name: ac2-traffic-type-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"flowLogTrafficType":"REJECT","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"flowLogTrafficType":"ACCEPT","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac2-fl
                namespace: ec2flowlog
              spec:
                configRef: ac2-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                trafficType: ALL
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac2-fl
                namespace: ec2flowlog
              spec:
                trafficType: REJECT

    # AC-3: trafficType from instance spec (no mandatory, no defaults value).
    - name: ac3-traffic-type-instance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac3-fl
                namespace: ec2flowlog
              spec:
                configRef: ac3-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                trafficType: ACCEPT
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac3-fl
                namespace: ec2flowlog
              spec:
                trafficType: ACCEPT

    # AC-4: trafficType from defaults (no mandatory, no instance value).
    - name: ac4-traffic-type-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"flowLogTrafficType":"REJECT","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac4-fl
                namespace: ec2flowlog
              spec:
                configRef: ac4-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                # trafficType intentionally empty — falls to defaults
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac4-fl
                namespace: ec2flowlog
              spec:
                trafficType: REJECT

    # AC-5: maxAggregationInterval from mandatory tier overrides others.
    - name: ac5-max-agg-interval-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"flowLogMaxAggregationInterval":60,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"flowLogMaxAggregationInterval":600,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac5-fl
                namespace: ec2flowlog
              spec:
                configRef: ac5-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                maxAggregationInterval: 600
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac5-fl
                namespace: ec2flowlog
              spec:
                maxAggregationInterval: 60

    # AC-6: maxAggregationInterval from instance (no mandatory, no defaults).
    - name: ac6-max-agg-interval-instance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac6-fl
                namespace: ec2flowlog
              spec:
                configRef: ac6-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                maxAggregationInterval: 60
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac6-fl
                namespace: ec2flowlog
              spec:
                maxAggregationInterval: 60

    # AC-7: maxAggregationInterval from defaults (no mandatory, no instance).
    - name: ac7-max-agg-interval-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"flowLogMaxAggregationInterval":60,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac7-fl
                namespace: ec2flowlog
              spec:
                configRef: ac7-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                # maxAggregationInterval = 0 → falls to defaults
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac7-fl
                namespace: ec2flowlog
              spec:
                maxAggregationInterval: 60

    # AC-8: S3 log destination type.
    - name: ac8-s3-destination
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac8-fl
                namespace: ec2flowlog
              spec:
                configRef: ac8-cfg
                resourceId: subnet-0123456789abcdef0
                resourceType: Subnet
                logDestinationType: s3
                logDestination: arn:aws:s3:::my-flow-log-bucket
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac8-fl
                namespace: ec2flowlog
              spec:
                resourceID: subnet-0123456789abcdef0
                resourceType: Subnet
                logDestinationType: s3
                logDestination: arn:aws:s3:::my-flow-log-bucket

    # AC-9: Custom log format string passed through.
    - name: ac9-custom-log-format
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac9-fl
                namespace: ec2flowlog
              spec:
                configRef: ac9-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                logFormat: "${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr}"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac9-fl
                namespace: ec2flowlog
              spec:
                logFormat: "${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr}"

    # AC-11: Tag merge — mandatory > spec > defaults.
    - name: ac11-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: kubectl patch ec2config ac11-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"env":"dev","log-type":"vpc"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac11-fl
                namespace: ec2flowlog
              spec:
                configRef: ac11-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                tags:
                  owner: security
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac11-fl
                namespace: ec2flowlog
        - script:
            content: |
              TAGS=$(kubectl get flowlog ac11-fl -n ec2flowlog -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="owner" and .value=="security")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="log-type" and .value=="vpc")' || (echo "FAIL: defaults-only tag missing" && exit 1)

    # AC-12: Synced labels propagated with aws.kropath.run/ prefix.
    - name: ac12-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac12-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
        - script:
            content: kubectl patch ec2config ac12-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac12-fl
                namespace: ec2flowlog
              spec:
                configRef: ac12-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
                syncedLabels:
                  log-class: flow
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac12-fl
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/log-class: flow

    # AC-14: Deletion policy retain (default).
    - name: ac14-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac14-cfg
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
        - script:
            content: kubectl patch ec2config ac14-cfg -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac14-fl
                namespace: ec2flowlog
              spec:
                configRef: ac14-cfg
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac14-fl
                namespace: ec2flowlog
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-15: Custom configRef selects a different EC2Config.
    - name: ac15-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: fl-policy
                namespace: ec2flowlog
                labels:
                  aws.kropath.run/resource-name: fl-policy
        - script:
            content: kubectl patch ec2config fl-policy -n ec2flowlog --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"policy":"fl-policy"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2FlowLog
              metadata:
                name: ac15-fl
                namespace: ec2flowlog
              spec:
                configRef: fl-policy
                resourceId: vpc-0123456789abcdef0
                resourceType: VPC
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: FlowLog
              metadata:
                name: ac15-fl
                namespace: ec2flowlog
        - script:
            content: |
              kubectl get flowlog ac15-fl -n ec2flowlog -o json | jq -e '.spec.tags[] | select(.key=="policy" and .value=="fl-policy")' || (echo "FAIL: config-selector tag not applied" && exit 1)
