# aws-ec2-05 EC2RouteTable governance tests — 12 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# ACK RouteTable fields use SCREAMING_CAPS IDs (destinationCIDRBlock, gatewayID, etc.).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2routetable
spec:
  skipDelete: true
  namespace: ec2routetable
  steps:
    # AC-1: Basic creation with VPC ID.
    # AC-10: Standard metadata labels.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac1-rt
                namespace: ec2routetable
              spec:
                configRef: ac1-cfg
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac1-rt
                namespace: ec2routetable
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-rt
              spec:
                vpcID: vpc-0123456789abcdef0

    # AC-2: Route with internet gateway target.
    - name: ac2-igw-route
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac2-rt
                namespace: ec2routetable
              spec:
                configRef: ac2-cfg
                vpcId: vpc-0123456789abcdef0
                routes:
                  - destinationCidrBlock: "0.0.0.0/0"
                    gatewayId: igw-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac2-rt
                namespace: ec2routetable
              spec:
                routes:
                  - destinationCIDRBlock: "0.0.0.0/0"
                    gatewayID: igw-0123456789abcdef0

    # AC-3: Route with NAT gateway target.
    - name: ac3-nat-route
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac3-rt
                namespace: ec2routetable
              spec:
                configRef: ac3-cfg
                vpcId: vpc-0123456789abcdef0
                routes:
                  - destinationCidrBlock: "0.0.0.0/0"
                    natGatewayId: nat-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac3-rt
                namespace: ec2routetable
              spec:
                routes:
                  - destinationCIDRBlock: "0.0.0.0/0"
                    natGatewayID: nat-0123456789abcdef0

    # AC-4: Route with transit gateway target.
    - name: ac4-tgw-route
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac4-rt
                namespace: ec2routetable
              spec:
                configRef: ac4-cfg
                vpcId: vpc-0123456789abcdef0
                routes:
                  - destinationCidrBlock: "10.99.0.0/16"
                    transitGatewayId: tgw-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac4-rt
                namespace: ec2routetable
              spec:
                routes:
                  - destinationCIDRBlock: "10.99.0.0/16"
                    transitGatewayID: tgw-0123456789abcdef0

    # AC-5: IPv6 destination route.
    - name: ac5-ipv6-route
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac5-rt
                namespace: ec2routetable
              spec:
                configRef: ac5-cfg
                vpcId: vpc-0123456789abcdef0
                routes:
                  - destinationIpv6CidrBlock: "::/0"
                    gatewayId: igw-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac5-rt
                namespace: ec2routetable
              spec:
                routes:
                  - destinationIPv6CIDRBlock: "::/0"
                    gatewayID: igw-0123456789abcdef0

    # AC-6: VPC peering connection route.
    - name: ac6-peering-route
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac6-rt
                namespace: ec2routetable
              spec:
                configRef: ac6-cfg
                vpcId: vpc-0123456789abcdef0
                routes:
                  - destinationCidrBlock: "172.16.0.0/12"
                    vpcPeeringConnectionId: pcx-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac6-rt
                namespace: ec2routetable
              spec:
                routes:
                  - destinationCIDRBlock: "172.16.0.0/12"
                    vpcPeeringConnectionID: pcx-0123456789abcdef0

    # AC-7: Multiple routes in one table.
    - name: ac7-multi-route
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac7-rt
                namespace: ec2routetable
              spec:
                configRef: ac7-cfg
                vpcId: vpc-0123456789abcdef0
                routes:
                  - destinationCidrBlock: "0.0.0.0/0"
                    gatewayId: igw-0123456789abcdef0
                  - destinationCidrBlock: "10.99.0.0/16"
                    transitGatewayId: tgw-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac7-rt
                namespace: ec2routetable
              spec:
                routes:
                  - destinationCIDRBlock: "0.0.0.0/0"
                    gatewayID: igw-0123456789abcdef0
                  - destinationCIDRBlock: "10.99.0.0/16"
                    transitGatewayID: tgw-0123456789abcdef0

    # AC-8: Tag merge — mandatory > spec > defaults.
    - name: ac8-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"type":"private"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"type":"public","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac8-rt
                namespace: ec2routetable
              spec:
                configRef: ac8-cfg
                vpcId: vpc-0123456789abcdef0
                tags:
                  team: networking
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac8-rt
                namespace: ec2routetable
        - script:
            content: |
              TAGS=$(kubectl get routetable ac8-rt -n ec2routetable -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="type" and .value=="private")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="networking")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="region" and .value=="us-east-1")' || (echo "FAIL: defaults-only tag missing" && exit 1)

    # AC-9: Synced labels propagated with aws.kropath.run/ prefix.
    - name: ac9-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac9-rt
                namespace: ec2routetable
              spec:
                configRef: ac9-cfg
                vpcId: vpc-0123456789abcdef0
                syncedLabels:
                  subnet-type: private
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac9-rt
                namespace: ec2routetable
                labels:
                  aws.kropath.run/subnet-type: private

    # AC-11: Deletion policy retain (default).
    - name: ac11-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11-cfg
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: kubectl patch ec2config ac11-cfg -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac11-rt
                namespace: ec2routetable
              spec:
                configRef: ac11-cfg
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac11-rt
                namespace: ec2routetable
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-12: Custom configRef selects a different EC2Config.
    - name: ac12-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: rt-policy
                namespace: ec2routetable
                labels:
                  aws.kropath.run/resource-name: rt-policy
        - script:
            content: kubectl patch ec2config rt-policy -n ec2routetable --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"policy":"rt-policy"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2RouteTable
              metadata:
                name: ac12-rt
                namespace: ec2routetable
              spec:
                configRef: rt-policy
                vpcId: vpc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: ac12-rt
                namespace: ec2routetable
        - script:
            content: |
              kubectl get routetable ac12-rt -n ec2routetable -o json | jq -e '.spec.tags[] | select(.key=="policy" and .value=="rt-policy")' || (echo "FAIL: config-selector tag not applied" && exit 1)
