apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2vpcpeering
spec:
  skipDelete: true
  namespace: ec2vpcpeering
  steps:
    # AC1: Basic creation — same-account, same-region peering (vpcId + peerVpcId required).
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac1-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac1-cfg
                vpcId: vpc-0aaa0000000000001
                peerVpcId: vpc-0bbb0000000000001
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac1-peering
                namespace: ec2vpcpeering
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-peering
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                vpcID: vpc-0aaa0000000000001
                peerVPCID: vpc-0bbb0000000000001

    # AC2: Cross-account peering — peerOwnerId set.
    - name: ac2-cross-account
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac2-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac2-cfg
                vpcId: vpc-0aaa0000000000002
                peerVpcId: vpc-0bbb0000000000002
                peerOwnerId: "987654321098"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac2-peering
                namespace: ec2vpcpeering
              spec:
                peerOwnerID: "987654321098"

    # AC3: Cross-region peering — peerRegion set.
    - name: ac3-cross-region
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac3-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac3-cfg
                vpcId: vpc-0aaa0000000000003
                peerVpcId: vpc-0bbb0000000000003
                peerRegion: eu-west-1
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac3-peering
                namespace: ec2vpcpeering
              spec:
                peerRegion: eu-west-1

    # AC4: acceptRequest true — auto-accept same-account peering.
    - name: ac4-accept-request
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac4-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac4-cfg
                vpcId: vpc-0aaa0000000000004
                peerVpcId: vpc-0bbb0000000000004
                acceptRequest: true
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac4-peering
                namespace: ec2vpcpeering
              spec:
                acceptRequest: true

    # AC5: acceptRequest false (explicit opt-out).
    - name: ac5-accept-request-false
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac5-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac5-cfg
                vpcId: vpc-0aaa0000000000005
                peerVpcId: vpc-0bbb0000000000005
                acceptRequest: false
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac5-peering
                namespace: ec2vpcpeering
              spec:
                acceptRequest: false

    # AC6: Deletion policy delete.
    - name: ac6-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac6-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac6-cfg
                vpcId: vpc-0aaa0000000000006
                peerVpcId: vpc-0bbb0000000000006
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac6-peering
                namespace: ec2vpcpeering
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC7: Spec tags appear in cloud tags.
    - name: ac7-spec-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac7-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac7-cfg
                vpcId: vpc-0aaa0000000000007
                peerVpcId: vpc-0bbb0000000000007
                tags:
                  Purpose: dev-connectivity
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac7-peering
                namespace: ec2vpcpeering
        - script:
            content: |
              TAGS=$(kubectl get vpcpeeringconnection ac7-peering -n ec2vpcpeering -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Purpose" and .value == "dev-connectivity")) | length == 1' || (echo "Missing Purpose cloud tag"; exit 1)

    # AC8: Mandatory tags override spec and defaults.
    - name: ac8-mandatory-tags-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"Env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"Env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac8-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac8-cfg
                vpcId: vpc-0aaa0000000000008
                peerVpcId: vpc-0bbb0000000000008
                tags:
                  Env: staging
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac8-peering
                namespace: ec2vpcpeering
        - script:
            content: |
              TAGS=$(kubectl get vpcpeeringconnection ac8-peering -n ec2vpcpeering -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Env" and .value == "prod")) | length == 1' || (echo "Mandatory Env=prod should win"; exit 1)

    # AC9: syncedLabels dual-write.
    - name: ac9-syncedlabels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac9-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac9-cfg
                vpcId: vpc-0aaa0000000000009
                peerVpcId: vpc-0bbb0000000000009
                syncedLabels:
                  team: platform
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac9-peering
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/team: platform
        - script:
            content: |
              TAGS=$(kubectl get vpcpeeringconnection ac9-peering -n ec2vpcpeering -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "team" and .value == "platform")) | length == 1' || (echo "Missing team cloud tag from syncedLabels"; exit 1)

    # AC10: configRef selects a non-default EC2Config.
    - name: ac10-configref-selection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-vpc-policy
                namespace: ec2vpcpeering
                labels:
                  aws.kropath.run/resource-name: ac10-vpc-policy
        - script:
            content: kubectl patch ec2config ac10-vpc-policy -n ec2vpcpeering --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"PolicyName":"vpc-policy"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPCPeering
              metadata:
                name: ac10-peering
                namespace: ec2vpcpeering
              spec:
                configRef: ac10-vpc-policy
                vpcId: vpc-0aaa000000000000a
                peerVpcId: vpc-0bbb000000000000a
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCPeeringConnection
              metadata:
                name: ac10-peering
                namespace: ec2vpcpeering
        - script:
            content: |
              TAGS=$(kubectl get vpcpeeringconnection ac10-peering -n ec2vpcpeering -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "PolicyName" and .value == "vpc-policy")) | length == 1' || (echo "configRef did not select vpc-policy config"; exit 1)
