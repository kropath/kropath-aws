# aws-ec2-01 EC2Config governance tests -- all 8 acceptance criteria.
# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step uses a uniquely-named EC2Config and deletes nothing between
# steps. skipDelete stops chainsaw's end-of-test cascade delete; the ephemeral kind
# cluster is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2config
spec:
  skipDelete: true
  namespace: ec2config
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-ec2config-namespace.yaml

    - name: ac1-reject-dual-tier-boolean
      try:
        - apply:
            file: 02-invalid-dual-tier-boolean.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EC2Config
                check:
                  ($error != null): true

    - name: ac2-reject-dual-tier-string
      try:
        - apply:
            file: 03-invalid-dual-tier-string.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EC2Config
                check:
                  ($error != null): true

    - name: ac3-reject-dual-tier-integer
      try:
        - apply:
            file: 04-invalid-dual-tier-integer.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EC2Config
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-naming
      try:
        - apply:
            file: 05-invalid-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EC2Config
                check:
                  ($error != null): true

    - name: ac5-map-fields-both-tiers-accepted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac5-policy
                name: ac5-policy
                namespace: ec2config
              spec:
                mandatory:
                  flowLogsRequired: false
                  flowLogTrafficType: ""
                  flowLogMaxAggregationInterval: 0
                  restrictPublicIpOnLaunch: false
                  imdsv2Required: false
                  ebsEncryptionRequired: false
                  ebsDefaultKmsKeyId: ""
                  publicIpRestricted: false
                  allowSourceDestCheckDisable: false
                  namingTemplate: ""
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  flowLogsRequired: false
                  flowLogTrafficType: "ALL"
                  flowLogMaxAggregationInterval: 600
                  restrictPublicIpOnLaunch: false
                  imdsv2Required: true
                  ebsEncryptionRequired: true
                  ebsDefaultKmsKeyId: ""
                  publicIpRestricted: false
                  allowSourceDestCheckDisable: false
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-policy
                namespace: ec2config
              spec:
                mandatory:
                  tags:
                    env: prod
                defaults:
                  tags:
                    team: platform

    - name: ac6-general-policy-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac6-general-policy
                name: ac6-general-policy
                namespace: ec2config
              spec:
                mandatory:
                  flowLogsRequired: false
                  flowLogTrafficType: ""
                  flowLogMaxAggregationInterval: 0
                  restrictPublicIpOnLaunch: false
                  imdsv2Required: false
                  ebsEncryptionRequired: false
                  ebsDefaultKmsKeyId: ""
                  publicIpRestricted: false
                  allowSourceDestCheckDisable: false
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  flowLogsRequired: false
                  flowLogTrafficType: "ALL"
                  flowLogMaxAggregationInterval: 600
                  restrictPublicIpOnLaunch: false
                  imdsv2Required: true
                  ebsEncryptionRequired: true
                  ebsDefaultKmsKeyId: ""
                  publicIpRestricted: false
                  allowSourceDestCheckDisable: false
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-general-policy
                namespace: ec2config
              spec:
                defaults:
                  imdsv2Required: true
                  ebsEncryptionRequired: true
                  flowLogTrafficType: "ALL"
                  flowLogMaxAggregationInterval: 600
                  namingTemplate: "{namespace}-{name}"
                mandatory:
                  imdsv2Required: false
                  ebsEncryptionRequired: false
                  flowLogTrafficType: ""
                  flowLogMaxAggregationInterval: 0
                  namingTemplate: ""

    - name: ac7-restricted-profile
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac7-restricted
                name: ac7-restricted
                namespace: ec2config
              spec:
                mandatory:
                  flowLogsRequired: true
                  flowLogTrafficType: "ALL"
                  flowLogMaxAggregationInterval: 60
                  restrictPublicIpOnLaunch: true
                  imdsv2Required: true
                  ebsEncryptionRequired: true
                  ebsDefaultKmsKeyId: ""
                  publicIpRestricted: true
                  allowSourceDestCheckDisable: false
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  flowLogsRequired: false
                  flowLogTrafficType: ""
                  flowLogMaxAggregationInterval: 0
                  restrictPublicIpOnLaunch: false
                  imdsv2Required: false
                  ebsEncryptionRequired: false
                  ebsDefaultKmsKeyId: ""
                  publicIpRestricted: false
                  allowSourceDestCheckDisable: false
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-restricted
                namespace: ec2config
              spec:
                mandatory:
                  imdsv2Required: true
                  ebsEncryptionRequired: true

    - name: ac8-label-selector-lookup
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac8-policy
                name: ac8-policy
                namespace: ec2config
              spec:
                mandatory:
                  flowLogsRequired: false
                  flowLogTrafficType: ""
                  flowLogMaxAggregationInterval: 0
                  restrictPublicIpOnLaunch: false
                  imdsv2Required: false
                  ebsEncryptionRequired: false
                  ebsDefaultKmsKeyId: ""
                  publicIpRestricted: false
                  allowSourceDestCheckDisable: false
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  flowLogsRequired: false
                  flowLogTrafficType: "ALL"
                  flowLogMaxAggregationInterval: 600
                  restrictPublicIpOnLaunch: false
                  imdsv2Required: true
                  ebsEncryptionRequired: true
                  ebsDefaultKmsKeyId: ""
                  publicIpRestricted: false
                  allowSourceDestCheckDisable: false
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-policy
                namespace: ec2config
                labels:
                  aws.kropath.run/resource-name: ac8-policy
        - script:
            content: |
              count=$(kubectl get ec2config -n ec2config \
                -l aws.kropath.run/resource-name=ac8-policy \
                -o json | jq '.items | length')
              if [ "$count" -ne 1 ]; then
                echo "ERROR: expected 1 EC2Config with label aws.kropath.run/resource-name=ac8-policy, got $count"
                exit 1
              fi
              echo "PASS: label selector lookup found $count EC2Config"
