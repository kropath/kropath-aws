# AC-2: rejected when flowLogTrafficType set non-empty in both mandatory and defaults
---
apiVersion: aws.kropath.run/v1alpha1
kind: EC2Config
metadata:
  name: ac2-dual-tier-string
  namespace: ec2config
spec:
  mandatory:
    flowLogsRequired: false
    flowLogTrafficType: "ALL"
    flowLogMaxAggregationInterval: 0
    restrictPublicIpOnLaunch: false
    imdsv2Required: false
    ebsEncryptionRequired: false
    ebsDefaultKmsKeyId: ""
    publicIpRestricted: false
    allowSourceDestCheckDisable: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    flowLogsRequired: false
    flowLogTrafficType: "REJECT"
    flowLogMaxAggregationInterval: 600
    restrictPublicIpOnLaunch: false
    imdsv2Required: true
    ebsEncryptionRequired: true
    ebsDefaultKmsKeyId: ""
    publicIpRestricted: false
    allowSourceDestCheckDisable: false
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
