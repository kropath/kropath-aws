# EC2LaunchTemplate governance tests — 16 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2launchtemplate
spec:
  skipDelete: true
  namespace: ec2launchtemplate
  steps:
    # AC-1: Basic launch template creation with default naming {namespace}-{name}.
    # AC-16: Standard metadata: managed-by label and app.kubernetes.io/instance on ACK child.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac1-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac1-lt
                namespace: ec2launchtemplate
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-lt
              spec:
                name: ec2launchtemplate-ac1-lt

    # AC-2: Default naming template {namespace}-{name} produces "ec2launchtemplate-ac2-lt".
    - name: ac2-default-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac2-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac2-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac2-lt
                namespace: ec2launchtemplate
              status:
                resourceName: ec2launchtemplate-ac2-lt
                namingStatus: valid

    # AC-3: Mandatory namingTemplate overrides default.
    - name: ac3-mandatory-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"mandatory-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"defaults-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac3-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac3-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac3-lt
                namespace: ec2launchtemplate
              status:
                resourceName: mandatory-ac3-lt
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac3-lt
                namespace: ec2launchtemplate
              spec:
                name: mandatory-ac3-lt

    # AC-4: Defaults namingTemplate used when mandatory has none.
    - name: ac4-defaults-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"dflt-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac4-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac4-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac4-lt
                namespace: ec2launchtemplate
              status:
                resourceName: dflt-ac4-lt
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac4-lt
                namespace: ec2launchtemplate
              spec:
                name: dflt-ac4-lt

    # AC-5: nameOverride takes priority over all naming templates.
    - name: ac5-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"mandatory-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac5-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac5-cfg
                nameOverride: my-custom-launch-template
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac5-lt
                namespace: ec2launchtemplate
              status:
                resourceName: my-custom-launch-template
                namingStatus: valid
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac5-lt
                namespace: ec2launchtemplate
              spec:
                name: my-custom-launch-template

    # AC-6: Unresolved token in namingTemplate → namingStatus: invalid-unresolved-tokens,
    #        ACK LaunchTemplate not created.
    - name: ac6-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"prefix-{tag.missing-tag}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac6-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac6-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac6-lt
                namespace: ec2launchtemplate
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              COUNT=$(kubectl get launchtemplate ac6-lt -n ec2launchtemplate --ignore-not-found 2>/dev/null | grep -c ac6-lt || true)
              if [ "$COUNT" -gt "0" ]; then echo "FAIL: ACK LaunchTemplate created despite unresolved token" && exit 1; fi

    # AC-7: imageId, instanceType, securityGroupIds passed through to ACK spec.data.
    - name: ac7-compute-fields
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac7-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac7-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.large
                securityGroupIds:
                  - sg-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac7-lt
                namespace: ec2launchtemplate
              spec:
                data:
                  imageID: ami-0123456789abcdef0
                  instanceType: t3.large
                  securityGroupIDs:
                    - sg-0123456789abcdef0

    # AC-8: keyName and userData passed through to ACK spec.data.
    - name: ac8-key-and-userdata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac8-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac8-cfg
                keyName: my-keypair
                userData: IyEvYmluL2Jhc2gKZWNobyAiSGVsbG8i
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac8-lt
                namespace: ec2launchtemplate
              spec:
                data:
                  keyName: my-keypair
                  userData: IyEvYmluL2Jhc2gKZWNobyAiSGVsbG8i

    # AC-9: IAM instance profile — arn and name passed through.
    - name: ac9-iam-instance-profile
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac9-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac9-cfg
                iamInstanceProfile:
                  arn: arn:aws:iam::123456789012:instance-profile/my-lt-profile
                  name: my-lt-profile
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac9-lt
                namespace: ec2launchtemplate
              spec:
                data:
                  iamInstanceProfile:
                    arn: arn:aws:iam::123456789012:instance-profile/my-lt-profile
                    name: my-lt-profile

    # AC-10: blockDeviceMappings — deviceName, volumeSize, volumeType passed through.
    - name: ac10-block-device-mappings
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: kubectl patch ec2config ac10-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac10-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac10-cfg
                blockDeviceMappings:
                  - deviceName: /dev/xvda
                    volumeSize: 30
                    volumeType: gp3
                    iops: 3000
                    encrypted: true
                    deleteOnTermination: true
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac10-lt
                namespace: ec2launchtemplate
              spec:
                data:
                  blockDeviceMappings:
                    - deviceName: /dev/xvda
                      ebs:
                        volumeSize: 30
                        volumeType: gp3
                        iops: 3000
                        encrypted: true
                        deleteOnTermination: true

    # AC-11: IMDSv2 governance — mandatory.imdsv2Required=true forces httpTokens="required".
    - name: ac11-imdsv2-mandatory-required
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: kubectl patch ec2config ac11-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"imdsv2Required":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac11-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac11-cfg
                metadataHttpTokens: optional
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac11-lt
                namespace: ec2launchtemplate
              spec:
                data:
                  metadataOptions:
                    httpTokens: required

    # AC-12: EBS encryption governance — mandatory.ebsEncryptionRequired=true forces encrypted=true.
    - name: ac12-ebs-encryption-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac12-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
        - script:
            content: kubectl patch ec2config ac12-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"ebsEncryptionRequired":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac12-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac12-cfg
                blockDeviceMappings:
                  - deviceName: /dev/xvda
                    volumeSize: 20
                    encrypted: false
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac12-lt
                namespace: ec2launchtemplate
              spec:
                data:
                  blockDeviceMappings:
                    - ebs:
                        encrypted: true

    # AC-13: instanceTags → ACK spec.data.tagSpecifications with resourceType: instance.
    - name: ac13-instance-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac13-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
        - script:
            content: kubectl patch ec2config ac13-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac13-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac13-cfg
                instanceTags:
                  env: prod
                  team: compute
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac13-lt
                namespace: ec2launchtemplate
              spec:
                data:
                  tagSpecifications:
                    - resourceType: instance
        - script:
            content: |
              TAGS=$(kubectl get launchtemplate ac13-lt -n ec2launchtemplate -o json | jq '.spec.data.tagSpecifications[0].tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' || (echo "FAIL: instanceTags env not present" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="compute")' || (echo "FAIL: instanceTags team not present" && exit 1)

    # AC-14: versionDescription passed through to ACK spec.versionDescription.
    - name: ac14-version-description
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac14-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
        - script:
            content: kubectl patch ec2config ac14-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac14-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac14-cfg
                versionDescription: Initial version for prod fleet
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac14-lt
                namespace: ec2launchtemplate
              spec:
                versionDescription: Initial version for prod fleet

    # AC-15: Template-level tag merge — mandatory > spec > defaults. Assert via script.
    - name: ac15-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac15-cfg
                namespace: ec2launchtemplate
                labels:
                  aws.kropath.run/resource-name: ac15-cfg
        - script:
            content: kubectl patch ec2config ac15-cfg -n ec2launchtemplate --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"env":"dev","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2LaunchTemplate
              metadata:
                name: ac15-lt
                namespace: ec2launchtemplate
              spec:
                configRef: ac15-cfg
                tags:
                  team: compute
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: LaunchTemplate
              metadata:
                name: ac15-lt
                namespace: ec2launchtemplate
        - script:
            content: |
              TAGS=$(kubectl get launchtemplate ac15-lt -n ec2launchtemplate -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="compute")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="region" and .value=="us-east-1")' || (echo "FAIL: defaults-only tag missing" && exit 1)
