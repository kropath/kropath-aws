# aws-ec2-07 EC2NATGateway governance tests — 10 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# ACK NATGateway uses kind: NATGateway (all-caps NAT).
# allocationError advisory in status (from allocationCheck ConfigMap).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2natgateway
spec:
  skipDelete: true
  namespace: ec2natgateway
  steps:
    # AC-1: Private NAT gateway — no allocationId required, no allocationError.
    # AC-7: Standard metadata labels.
    - name: ac1-private-nat
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2natgateway
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2natgateway --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac1-nat
                namespace: ec2natgateway
              spec:
                configRef: ac1-cfg
                subnetId: subnet-0123456789abcdef0
                connectivityType: private
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NATGateway
              metadata:
                name: ac1-nat
                namespace: ec2natgateway
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-nat
              spec:
                subnetID: subnet-0123456789abcdef0
                connectivityType: private
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac1-nat
                namespace: ec2natgateway
              status:
                allocationError: ""

    # AC-2: Public NAT gateway with allocationId — no allocationError.
    - name: ac2-public-nat-with-allocation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2natgateway
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2natgateway --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac2-nat
                namespace: ec2natgateway
              spec:
                configRef: ac2-cfg
                subnetId: subnet-0123456789abcdef0
                connectivityType: public
                allocationId: eipalloc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NATGateway
              metadata:
                name: ac2-nat
                namespace: ec2natgateway
              spec:
                subnetID: subnet-0123456789abcdef0
                connectivityType: public
                allocationID: eipalloc-0123456789abcdef0
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac2-nat
                namespace: ec2natgateway
              status:
                allocationError: ""

    # AC-3: Public NAT gateway without allocationId → allocationError advisory set.
    - name: ac3-public-nat-missing-allocation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2natgateway
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2natgateway --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac3-nat
                namespace: ec2natgateway
              spec:
                configRef: ac3-cfg
                subnetId: subnet-0123456789abcdef0
                connectivityType: public
                # allocationId intentionally omitted
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac3-nat
                namespace: ec2natgateway
              status:
                allocationError: "public NAT gateway requires allocationId (Elastic IP)"

    # AC-4: Tag merge — mandatory > spec > defaults.
    - name: ac4-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2natgateway
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2natgateway --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"tier":"nat"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"tier":"other","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac4-nat
                namespace: ec2natgateway
              spec:
                configRef: ac4-cfg
                subnetId: subnet-0123456789abcdef0
                connectivityType: private
                tags:
                  owner: networking
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NATGateway
              metadata:
                name: ac4-nat
                namespace: ec2natgateway
        - script:
            content: |
              TAGS=$(kubectl get natgateway ac4-nat -n ec2natgateway -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="tier" and .value=="nat")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="owner" and .value=="networking")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="region" and .value=="us-east-1")' || (echo "FAIL: defaults-only tag missing" && exit 1)

    # AC-5: Synced labels propagated with aws.kropath.run/ prefix.
    - name: ac5-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2natgateway
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2natgateway --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac5-nat
                namespace: ec2natgateway
              spec:
                configRef: ac5-cfg
                subnetId: subnet-0123456789abcdef0
                connectivityType: private
                syncedLabels:
                  gateway-type: nat
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NATGateway
              metadata:
                name: ac5-nat
                namespace: ec2natgateway
                labels:
                  aws.kropath.run/gateway-type: nat

    # AC-8: Deletion policy retain (default).
    - name: ac8-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2natgateway
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2natgateway --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac8-nat
                namespace: ec2natgateway
              spec:
                configRef: ac8-cfg
                subnetId: subnet-0123456789abcdef0
                connectivityType: private
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NATGateway
              metadata:
                name: ac8-nat
                namespace: ec2natgateway
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-9: Deletion policy delete.
    - name: ac9-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2natgateway
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2natgateway --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac9-nat
                namespace: ec2natgateway
              spec:
                configRef: ac9-cfg
                subnetId: subnet-0123456789abcdef0
                connectivityType: private
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NATGateway
              metadata:
                name: ac9-nat
                namespace: ec2natgateway
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-10: Custom configRef selects a different EC2Config.
    - name: ac10-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: nat-policy
                namespace: ec2natgateway
                labels:
                  aws.kropath.run/resource-name: nat-policy
        - script:
            content: kubectl patch ec2config nat-policy -n ec2natgateway --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"policy":"nat-policy"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2NATGateway
              metadata:
                name: ac10-nat
                namespace: ec2natgateway
              spec:
                configRef: nat-policy
                subnetId: subnet-0123456789abcdef0
                connectivityType: private
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: NATGateway
              metadata:
                name: ac10-nat
                namespace: ec2natgateway
        - script:
            content: |
              kubectl get natgateway ac10-nat -n ec2natgateway -o json | jq -e '.spec.tags[] | select(.key=="policy" and .value=="nat-policy")' || (echo "FAIL: config-selector tag not applied" && exit 1)
