apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2dhcpoptions
spec:
  skipDelete: true
  namespace: ec2dhcpoptions
  steps:
    # AC1: Basic creation — domain name and domain name servers.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac1-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac1-cfg
                domainName: us-east-1.compute.internal
                domainNameServers:
                  - AmazonProvidedDNS
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: DHCPOptions
              metadata:
                name: ac1-dhcp
                namespace: ec2dhcpoptions
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-dhcp
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              DC=$(kubectl get dhcpoptions ac1-dhcp -n ec2dhcpoptions -o json | jq '.spec.dhcpConfigurations // []')
              echo "$DC" | jq -e 'map(select(.key == "domain-name")) | length == 1' || (echo "Missing domain-name configuration"; exit 1)
              echo "$DC" | jq -e 'map(select(.key == "domain-name-servers")) | length == 1' || (echo "Missing domain-name-servers configuration"; exit 1)
              echo "$DC" | jq -e 'map(select(.key == "domain-name"))[0].values[0].value == "us-east-1.compute.internal"' || (echo "Wrong domain-name value"; exit 1)

    # AC2: NTP servers configured.
    - name: ac2-ntp-servers
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac2-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac2-cfg
                ntpServers:
                  - 169.254.169.123
                  - 169.254.169.124
        - script:
            content: |
              DC=$(kubectl get dhcpoptions ac2-dhcp -n ec2dhcpoptions -o json | jq '.spec.dhcpConfigurations // []')
              echo "$DC" | jq -e 'map(select(.key == "ntp-servers")) | length == 1' || (echo "Missing ntp-servers configuration"; exit 1)
              echo "$DC" | jq -e 'map(select(.key == "ntp-servers"))[0].values | length == 2' || (echo "Expected 2 NTP server entries"; exit 1)

    # AC3: NetBIOS name servers configured.
    - name: ac3-netbios-name-servers
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac3-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac3-cfg
                netbiosNameServers:
                  - 10.0.0.1
        - script:
            content: |
              DC=$(kubectl get dhcpoptions ac3-dhcp -n ec2dhcpoptions -o json | jq '.spec.dhcpConfigurations // []')
              echo "$DC" | jq -e 'map(select(.key == "netbios-name-servers")) | length == 1' || (echo "Missing netbios-name-servers configuration"; exit 1)

    # AC4: NetBIOS node type configured (integer converted to string in dhcpConfigurations).
    - name: ac4-netbios-node-type
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac4-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac4-cfg
                netbiosNameServers:
                  - 10.0.0.2
                netbiosNodeType: 2
        - script:
            content: |
              DC=$(kubectl get dhcpoptions ac4-dhcp -n ec2dhcpoptions -o json | jq '.spec.dhcpConfigurations // []')
              echo "$DC" | jq -e 'map(select(.key == "netbios-node-type")) | length == 1' || (echo "Missing netbios-node-type configuration"; exit 1)
              echo "$DC" | jq -e 'map(select(.key == "netbios-node-type"))[0].values[0].value == "2"' || (echo "netbios-node-type value should be string \"2\""; exit 1)

    # AC5: Multiple DHCP options combined.
    - name: ac5-combined-options
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac5-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac5-cfg
                domainName: corp.example.com
                domainNameServers:
                  - 10.0.0.53
                ntpServers:
                  - 10.0.0.123
        - script:
            content: |
              DC=$(kubectl get dhcpoptions ac5-dhcp -n ec2dhcpoptions -o json | jq '.spec.dhcpConfigurations // []')
              echo "$DC" | jq -e 'map(select(.key == "domain-name")) | length == 1' || (echo "Missing domain-name"; exit 1)
              echo "$DC" | jq -e 'map(select(.key == "domain-name-servers")) | length == 1' || (echo "Missing domain-name-servers"; exit 1)
              echo "$DC" | jq -e 'map(select(.key == "ntp-servers")) | length == 1' || (echo "Missing ntp-servers"; exit 1)

    # AC6: VPC IDs association — spec.vpcIds mapped to ACK spec.vpc.
    - name: ac6-vpc-association
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac6-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac6-cfg
                domainNameServers:
                  - AmazonProvidedDNS
                vpcIds:
                  - vpc-associate0000001
                  - vpc-associate0000002
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: DHCPOptions
              metadata:
                name: ac6-dhcp
                namespace: ec2dhcpoptions
              spec:
                vpc:
                  - vpc-associate0000001
                  - vpc-associate0000002

    # AC7: Deletion policy delete.
    - name: ac7-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac7-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac7-cfg
                domainNameServers:
                  - AmazonProvidedDNS
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: DHCPOptions
              metadata:
                name: ac7-dhcp
                namespace: ec2dhcpoptions
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC8: Spec tags appear in cloud tags.
    - name: ac8-spec-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac8-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac8-cfg
                domainNameServers:
                  - AmazonProvidedDNS
                tags:
                  Tier: infrastructure
        - script:
            content: |
              TAGS=$(kubectl get dhcpoptions ac8-dhcp -n ec2dhcpoptions -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Tier" and .value == "infrastructure")) | length == 1' || (echo "Missing Tier cloud tag"; exit 1)

    # AC9: Defaults tags from EC2Config applied.
    - name: ac9-defaults-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"Owner":"network-team"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac9-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac9-cfg
                domainNameServers:
                  - AmazonProvidedDNS
        - script:
            content: |
              TAGS=$(kubectl get dhcpoptions ac9-dhcp -n ec2dhcpoptions -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Owner" and .value == "network-team")) | length == 1' || (echo "Missing Owner defaults tag"; exit 1)

    # AC10: Mandatory tags override spec and defaults.
    - name: ac10-mandatory-tags-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-cfg
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: kubectl patch ec2config ac10-cfg -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"Env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"Env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac10-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac10-cfg
                domainNameServers:
                  - AmazonProvidedDNS
                tags:
                  Env: staging
        - script:
            content: |
              TAGS=$(kubectl get dhcpoptions ac10-dhcp -n ec2dhcpoptions -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Env" and .value == "prod")) | length == 1' || (echo "Mandatory Env=prod should win"; exit 1)

    # AC11: configRef selects a non-default EC2Config.
    - name: ac11-configref-selection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11-dhcp-policy
                namespace: ec2dhcpoptions
                labels:
                  aws.kropath.run/resource-name: ac11-dhcp-policy
        - script:
            content: kubectl patch ec2config ac11-dhcp-policy -n ec2dhcpoptions --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"PolicyName":"dhcp-policy"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2DHCPOptions
              metadata:
                name: ac11-dhcp
                namespace: ec2dhcpoptions
              spec:
                configRef: ac11-dhcp-policy
                domainNameServers:
                  - AmazonProvidedDNS
        - script:
            content: |
              TAGS=$(kubectl get dhcpoptions ac11-dhcp -n ec2dhcpoptions -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "PolicyName" and .value == "dhcp-policy")) | length == 1' || (echo "configRef did not select dhcp-policy config"; exit 1)
