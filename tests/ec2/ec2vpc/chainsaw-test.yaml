# aws-ec2-02 EC2VPC governance tests — 13 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2vpc
spec:
  skipDelete: true
  namespace: ec2vpc
  steps:
    # AC-1: Basic VPC creation with default config.
    # AC-6: Standard metadata (managed-by label, app.kubernetes.io/instance).
    # AC-12: Status fields exist (vpcID, state, flowLogStatus reported).
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac1-vpc
                namespace: ec2vpc
              spec:
                configRef: ac1-cfg
                cidrBlock: "10.0.0.0/16"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: ac1-vpc
                namespace: ec2vpc
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-vpc
              spec:
                cidrBlocks:
                  - "10.0.0.0/16"

    # AC-2: Secondary CIDR blocks appear in spec.cidrBlocks.
    - name: ac2-secondary-cidrs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac2-vpc
                namespace: ec2vpc
              spec:
                configRef: ac2-cfg
                cidrBlock: "10.0.0.0/16"
                secondaryCidrBlocks:
                  - "10.1.0.0/16"
                  - "10.2.0.0/16"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: ac2-vpc
                namespace: ec2vpc
              spec:
                cidrBlocks:
                  - "10.0.0.0/16"
                  - "10.1.0.0/16"
                  - "10.2.0.0/16"

    # AC-3: Dedicated instance tenancy.
    - name: ac3-dedicated-tenancy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac3-vpc
                namespace: ec2vpc
              spec:
                configRef: ac3-cfg
                cidrBlock: "10.3.0.0/16"
                instanceTenancy: dedicated
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: ac3-vpc
                namespace: ec2vpc
              spec:
                instanceTenancy: dedicated

    # AC-4: Tag merge — mandatory > spec > defaults. Assert via script (unstable order).
    - name: ac4-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"env":"dev","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac4-vpc
                namespace: ec2vpc
              spec:
                configRef: ac4-cfg
                cidrBlock: "10.4.0.0/16"
                tags:
                  team: networking
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: ac4-vpc
                namespace: ec2vpc
        - script:
            content: |
              TAGS=$(kubectl get vpc ac4-vpc -n ec2vpc -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="networking")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="region" and .value=="us-east-1")' || (echo "FAIL: defaults-only tag missing" && exit 1)

    # AC-5: Synced labels propagated to K8s child resource labels with aws.kropath.run/ prefix.
    - name: ac5-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{"cost-center":"networking"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac5-vpc
                namespace: ec2vpc
              spec:
                configRef: ac5-cfg
                cidrBlock: "10.5.0.0/16"
                syncedLabels:
                  owner: platform-team
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: ac5-vpc
                namespace: ec2vpc
                labels:
                  aws.kropath.run/owner: platform-team
                  aws.kropath.run/cost-center: networking

    # AC-7: Deletion policy delete — annotation set on ACK child.
    - name: ac7-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac7-vpc
                namespace: ec2vpc
              spec:
                configRef: ac7-cfg
                cidrBlock: "10.7.0.0/16"
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: ac7-vpc
                namespace: ec2vpc
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-8: Deletion policy retain (default).
    - name: ac8-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac8-vpc
                namespace: ec2vpc
              spec:
                configRef: ac8-cfg
                cidrBlock: "10.8.0.0/16"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: ac8-vpc
                namespace: ec2vpc
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-9: flowLogsRequired=true, no flow-log-active label → status.flowLogStatus="missing-flow-log".
    - name: ac9-flow-log-missing
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"flowLogsRequired":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac9-vpc
                namespace: ec2vpc
              spec:
                configRef: ac9-cfg
                cidrBlock: "10.9.0.0/16"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac9-vpc
                namespace: ec2vpc
              status:
                flowLogStatus: missing-flow-log

    # AC-10: flowLogsRequired=true, label aws.kropath.run/flow-log-active="true" → "compliant".
    - name: ac10-flow-log-compliant
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: kubectl patch ec2config ac10-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"flowLogsRequired":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac10-vpc
                namespace: ec2vpc
                labels:
                  aws.kropath.run/flow-log-active: "true"
              spec:
                configRef: ac10-cfg
                cidrBlock: "10.10.0.0/16"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac10-vpc
                namespace: ec2vpc
              status:
                flowLogStatus: compliant

    # AC-11: flowLogsRequired=false → status.flowLogStatus="" (not set / empty).
    - name: ac11-flow-log-not-required
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11-cfg
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: kubectl patch ec2config ac11-cfg -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"flowLogsRequired":false,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac11-vpc
                namespace: ec2vpc
              spec:
                configRef: ac11-cfg
                cidrBlock: "10.11.0.0/16"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac11-vpc
                namespace: ec2vpc
              status:
                flowLogStatus: ""

    # AC-13: Custom configRef selects a different EC2Config.
    - name: ac13-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: custom-ec2-policy
                namespace: ec2vpc
                labels:
                  aws.kropath.run/resource-name: custom-ec2-policy
        - script:
            content: kubectl patch ec2config custom-ec2-policy -n ec2vpc --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"policy":"custom"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2VPC
              metadata:
                name: ac13-vpc
                namespace: ec2vpc
              spec:
                configRef: custom-ec2-policy
                cidrBlock: "10.13.0.0/16"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: ac13-vpc
                namespace: ec2vpc
        - script:
            content: |
              kubectl get vpc ac13-vpc -n ec2vpc -o json | jq -e '.spec.tags[] | select(.key=="policy" and .value=="custom")' || (echo "FAIL: custom policy tag not applied" && exit 1)
