# EC2Instance governance tests — 16 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2instance
spec:
  skipDelete: true
  namespace: ec2instance
  steps:
    # AC-1: Basic instance creation — imageId, instanceType, subnetId are required.
    # AC-14: Standard metadata: managed-by label and app.kubernetes.io/instance on ACK child.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac1-instance
                namespace: ec2instance
              spec:
                configRef: ac1-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac1-instance
                namespace: ec2instance
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-instance
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                imageID: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetID: subnet-0123456789abcdef0

    # AC-2: Optional fields — securityGroupIds and keyName passed through.
    - name: ac2-optional-fields
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac2-instance
                namespace: ec2instance
              spec:
                configRef: ac2-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                securityGroupIds:
                  - sg-0123456789abcdef0
                  - sg-0123456789abcdef1
                keyName: my-keypair
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac2-instance
                namespace: ec2instance
              spec:
                securityGroupIDs:
                  - sg-0123456789abcdef0
                  - sg-0123456789abcdef1
                keyName: my-keypair

    # AC-3: userData passed through to ACK spec.userData.
    - name: ac3-user-data
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac3-instance
                namespace: ec2instance
              spec:
                configRef: ac3-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                userData: IyEvYmluL2Jhc2gKZWNobyAiSGVsbG8gV29ybGQi
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac3-instance
                namespace: ec2instance
              spec:
                userData: IyEvYmluL2Jhc2gKZWNobyAiSGVsbG8gV29ybGQi

    # AC-4: IAM instance profile — arn passed through.
    - name: ac4-iam-instance-profile
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac4-instance
                namespace: ec2instance
              spec:
                configRef: ac4-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                iamInstanceProfile:
                  arn: arn:aws:iam::123456789012:instance-profile/my-profile
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac4-instance
                namespace: ec2instance
              spec:
                iamInstanceProfile:
                  arn: arn:aws:iam::123456789012:instance-profile/my-profile

    # AC-5: blockDeviceMappings — deviceName, volumeSize, volumeType passed through.
    - name: ac5-block-device-mappings
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac5-instance
                namespace: ec2instance
              spec:
                configRef: ac5-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                blockDeviceMappings:
                  - deviceName: /dev/xvda
                    volumeSize: 50
                    volumeType: gp3
                    encrypted: false
                    deleteOnTermination: true
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac5-instance
                namespace: ec2instance
              spec:
                blockDeviceMappings:
                  - deviceName: /dev/xvda
                    ebs:
                      volumeSize: 50
                      volumeType: gp3
                      encrypted: false
                      deleteOnTermination: true

    # AC-6: IMDSv2 governance — mandatory.imdsv2Required=true forces httpTokens="required"
    #        regardless of spec.metadataHttpTokens value.
    - name: ac6-imdsv2-mandatory-required
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"imdsv2Required":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac6-instance
                namespace: ec2instance
              spec:
                configRef: ac6-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                metadataHttpTokens: optional
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac6-instance
                namespace: ec2instance
              spec:
                metadataOptions:
                  httpTokens: required

    # AC-7: IMDSv2 — spec.metadataHttpTokens honored when mandatory absent.
    - name: ac7-imdsv2-spec-honored
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac7-instance
                namespace: ec2instance
              spec:
                configRef: ac7-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                metadataHttpTokens: required
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac7-instance
                namespace: ec2instance
              spec:
                metadataOptions:
                  httpTokens: required

    # AC-8: IMDSv2 — defaults.imdsv2Required=true → required when mandatory absent and spec unset.
    - name: ac8-imdsv2-defaults-required
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"imdsv2Required":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac8-instance
                namespace: ec2instance
              spec:
                configRef: ac8-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac8-instance
                namespace: ec2instance
              spec:
                metadataOptions:
                  httpTokens: required

    # AC-9: sourceDestCheck — governance blocks disable when allowSourceDestCheckDisable=false.
    #        Result: sourceDestCheckEnabled forced to true.
    - name: ac9-source-dest-check-blocked
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"allowSourceDestCheckDisable":false,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac9-instance
                namespace: ec2instance
              spec:
                configRef: ac9-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                sourceDestCheck: false
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac9-instance
                namespace: ec2instance
              spec:
                sourceDestCheckEnabled: true

    # AC-10: sourceDestCheck — allowed when mandatory.allowSourceDestCheckDisable=true.
    - name: ac10-source-dest-check-allowed
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: kubectl patch ec2config ac10-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"allowSourceDestCheckDisable":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac10-instance
                namespace: ec2instance
              spec:
                configRef: ac10-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                sourceDestCheck: false
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac10-instance
                namespace: ec2instance
              spec:
                sourceDestCheckEnabled: false

    # AC-11: EBS encryption — mandatory.ebsEncryptionRequired=true forces encrypted=true on all volumes.
    - name: ac11-ebs-encryption-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac11-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
        - script:
            content: kubectl patch ec2config ac11-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"ebsEncryptionRequired":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac11-instance
                namespace: ec2instance
              spec:
                configRef: ac11-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                blockDeviceMappings:
                  - deviceName: /dev/xvda
                    volumeSize: 20
                    encrypted: false
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac11-instance
                namespace: ec2instance
              spec:
                blockDeviceMappings:
                  - ebs:
                      encrypted: true

    # AC-12: EBS KMS key — mandatory.ebsDefaultKmsKeyId overrides per-volume kmsKeyId.
    - name: ac12-ebs-kms-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac12-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
        - script:
            content: kubectl patch ec2config ac12-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"ebsDefaultKmsKeyId":"arn:aws:kms:us-east-1:123456789012:key/mandatory-key","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac12-instance
                namespace: ec2instance
              spec:
                configRef: ac12-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                blockDeviceMappings:
                  - deviceName: /dev/xvda
                    volumeSize: 20
                    kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/instance-key
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac12-instance
                namespace: ec2instance
              spec:
                blockDeviceMappings:
                  - ebs:
                      kmsKeyID: arn:aws:kms:us-east-1:123456789012:key/mandatory-key

    # AC-13: publicIpRestricted=true → status.publicIpStatus="public-ip-restricted".
    - name: ac13-public-ip-restricted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac13-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
        - script:
            content: kubectl patch ec2config ac13-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"publicIpRestricted":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac13-instance
                namespace: ec2instance
              spec:
                configRef: ac13-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac13-instance
                namespace: ec2instance
              status:
                publicIpStatus: public-ip-restricted

    # AC-14: Deletion policy retain (default) — annotation set on ACK child.
    - name: ac14-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac14-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
        - script:
            content: kubectl patch ec2config ac14-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac14-instance
                namespace: ec2instance
              spec:
                configRef: ac14-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac14-instance
                namespace: ec2instance
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-15: Tag merge — mandatory > spec > defaults. Assert via script (unstable order).
    - name: ac15-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac15-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac15-cfg
        - script:
            content: kubectl patch ec2config ac15-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"env":"dev","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac15-instance
                namespace: ec2instance
              spec:
                configRef: ac15-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                tags:
                  team: compute
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac15-instance
                namespace: ec2instance
        - script:
            content: |
              TAGS=$(kubectl get instance ac15-instance -n ec2instance -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="compute")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="region" and .value=="us-east-1")' || (echo "FAIL: defaults-only tag missing" && exit 1)

    # AC-16: Deletion policy delete — annotation set on ACK child.
    - name: ac16-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac16-cfg
                namespace: ec2instance
                labels:
                  aws.kropath.run/resource-name: ac16-cfg
        - script:
            content: kubectl patch ec2config ac16-cfg -n ec2instance --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Instance
              metadata:
                name: ac16-instance
                namespace: ec2instance
              spec:
                configRef: ac16-cfg
                imageId: ami-0123456789abcdef0
                instanceType: t3.micro
                subnetId: subnet-0123456789abcdef0
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              metadata:
                name: ac16-instance
                namespace: ec2instance
                annotations:
                  services.k8s.aws/deletion-policy: delete
