apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2transitgatewayattachment
spec:
  skipDelete: true
  namespace: ec2transitgatewayattachment
  steps:
    # AC1: Basic creation — required fields only.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac1-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac1-cfg
                transitGatewayId: tgw-0123456789abcdef0
                vpcId: vpc-0123456789abcdef0
                subnetIds:
                  - subnet-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac1-attach
                namespace: ec2transitgatewayattachment
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-attach
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                transitGatewayID: tgw-0123456789abcdef0
                vpcID: vpc-0123456789abcdef0
                subnetIDs:
                  - subnet-0123456789abcdef0

    # AC2: Multiple subnets across availability zones.
    - name: ac2-multiple-subnets
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac2-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac2-cfg
                transitGatewayId: tgw-abcdef1234567890a
                vpcId: vpc-abcdef1234567890a
                subnetIds:
                  - subnet-aaaa000000000001
                  - subnet-aaaa000000000002
                  - subnet-aaaa000000000003
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac2-attach
                namespace: ec2transitgatewayattachment
              spec:
                subnetIDs:
                  - subnet-aaaa000000000001
                  - subnet-aaaa000000000002
                  - subnet-aaaa000000000003

    # AC3: DNS support enabled.
    - name: ac3-dns-support
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac3-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac3-cfg
                transitGatewayId: tgw-0000000000000001
                vpcId: vpc-0000000000000001
                subnetIds:
                  - subnet-0000000000000001
                dnsSupport: enable
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac3-attach
                namespace: ec2transitgatewayattachment
              spec:
                options:
                  dnsSupport: enable

    # AC4: IPv6 and appliance mode support.
    - name: ac4-ipv6-appliance-mode
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac4-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac4-cfg
                transitGatewayId: tgw-0000000000000002
                vpcId: vpc-0000000000000002
                subnetIds:
                  - subnet-0000000000000002
                ipv6Support: enable
                applianceModeSupport: enable
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac4-attach
                namespace: ec2transitgatewayattachment
              spec:
                options:
                  ipv6Support: enable
                  applianceModeSupport: enable

    # AC5: Deletion policy delete.
    - name: ac5-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac5-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac5-cfg
                transitGatewayId: tgw-0000000000000003
                vpcId: vpc-0000000000000003
                subnetIds:
                  - subnet-0000000000000003
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac5-attach
                namespace: ec2transitgatewayattachment
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC6: Spec tags appear in ACK resource cloud tags.
    - name: ac6-spec-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac6-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac6-cfg
                transitGatewayId: tgw-0000000000000004
                vpcId: vpc-0000000000000004
                subnetIds:
                  - subnet-0000000000000004
                tags:
                  Project: shared-network
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac6-attach
                namespace: ec2transitgatewayattachment
        - script:
            content: |
              TAGS=$(kubectl get transitgatewayvpcattachment ac6-attach -n ec2transitgatewayattachment -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Project" and .value == "shared-network")) | length == 1' || (echo "Missing Project cloud tag"; exit 1)

    # AC7: Defaults tags from EC2Config applied.
    - name: ac7-defaults-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"ManagedBy":"kropath"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac7-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac7-cfg
                transitGatewayId: tgw-0000000000000005
                vpcId: vpc-0000000000000005
                subnetIds:
                  - subnet-0000000000000005
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac7-attach
                namespace: ec2transitgatewayattachment
        - script:
            content: |
              TAGS=$(kubectl get transitgatewayvpcattachment ac7-attach -n ec2transitgatewayattachment -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "ManagedBy" and .value == "kropath")) | length == 1' || (echo "Missing ManagedBy defaults tag"; exit 1)

    # AC8: Mandatory tags override spec tags.
    - name: ac8-mandatory-tags-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"Env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"Env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac8-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac8-cfg
                transitGatewayId: tgw-0000000000000006
                vpcId: vpc-0000000000000006
                subnetIds:
                  - subnet-0000000000000006
                tags:
                  Env: staging
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac8-attach
                namespace: ec2transitgatewayattachment
        - script:
            content: |
              TAGS=$(kubectl get transitgatewayvpcattachment ac8-attach -n ec2transitgatewayattachment -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Env" and .value == "prod")) | length == 1' || (echo "Mandatory Env=prod should win"; exit 1)

    # AC9: syncedLabels dual-write.
    - name: ac9-syncedlabels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac9-cfg
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
        - script:
            content: kubectl patch ec2config ac9-cfg -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac9-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac9-cfg
                transitGatewayId: tgw-0000000000000007
                vpcId: vpc-0000000000000007
                subnetIds:
                  - subnet-0000000000000007
                syncedLabels:
                  team: networking
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac9-attach
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/team: networking
        - script:
            content: |
              TAGS=$(kubectl get transitgatewayvpcattachment ac9-attach -n ec2transitgatewayattachment -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "team" and .value == "networking")) | length == 1' || (echo "Missing team cloud tag from syncedLabels"; exit 1)

    # AC10: configRef selects a non-default EC2Config.
    - name: ac10-configref-selection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-custom-policy
                namespace: ec2transitgatewayattachment
                labels:
                  aws.kropath.run/resource-name: ac10-custom-policy
        - script:
            content: kubectl patch ec2config ac10-custom-policy -n ec2transitgatewayattachment --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"Policy":"custom"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2TransitGatewayAttachment
              metadata:
                name: ac10-attach
                namespace: ec2transitgatewayattachment
              spec:
                configRef: ac10-custom-policy
                transitGatewayId: tgw-0000000000000008
                vpcId: vpc-0000000000000008
                subnetIds:
                  - subnet-0000000000000008
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: TransitGatewayVPCAttachment
              metadata:
                name: ac10-attach
                namespace: ec2transitgatewayattachment
        - script:
            content: |
              TAGS=$(kubectl get transitgatewayvpcattachment ac10-attach -n ec2transitgatewayattachment -o json | jq '.spec.tags // []')
              echo "$TAGS" | jq -e 'map(select(.key == "Policy" and .value == "custom")) | length == 1' || (echo "configRef did not select custom-policy config"; exit 1)
