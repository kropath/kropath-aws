# aws-ec2-03 EC2Subnet governance tests — 12 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ec2subnet
spec:
  skipDelete: true
  namespace: ec2subnet
  steps:
    # AC-1: Basic subnet creation.
    # AC-9: Standard metadata.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac1-cfg
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
        - script:
            content: kubectl patch ec2config ac1-cfg -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac1-subnet
                namespace: ec2subnet
              spec:
                configRef: ac1-cfg
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.1.0/24"
                availabilityZone: us-east-1a
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac1-subnet
                namespace: ec2subnet
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-subnet
              spec:
                vpcID: vpc-0123456789abcdef0
                cidrBlock: "10.0.1.0/24"
                availabilityZone: us-east-1a

    # AC-2: restrictPublicIpOnLaunch from mandatory tier → mapPublicIPOnLaunch=false.
    - name: ac2-restrict-public-ip-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac2-cfg
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
        - script:
            content: kubectl patch ec2config ac2-cfg -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"restrictPublicIpOnLaunch":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac2-subnet
                namespace: ec2subnet
              spec:
                configRef: ac2-cfg
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.2.0/24"
                availabilityZone: us-east-1a
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac2-subnet
                namespace: ec2subnet
              spec:
                mapPublicIPOnLaunch: false

    # AC-3: restrictPublicIpOnLaunch from instance spec.
    - name: ac3-restrict-public-ip-instance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac3-cfg
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
        - script:
            content: kubectl patch ec2config ac3-cfg -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac3-subnet
                namespace: ec2subnet
              spec:
                configRef: ac3-cfg
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.3.0/24"
                availabilityZone: us-east-1a
                restrictPublicIpOnLaunch: true
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac3-subnet
                namespace: ec2subnet
              spec:
                mapPublicIPOnLaunch: false

    # AC-4: restrictPublicIpOnLaunch from defaults tier.
    - name: ac4-restrict-public-ip-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac4-cfg
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
        - script:
            content: kubectl patch ec2config ac4-cfg -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"restrictPublicIpOnLaunch":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac4-subnet
                namespace: ec2subnet
              spec:
                configRef: ac4-cfg
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.4.0/24"
                availabilityZone: us-east-1a
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac4-subnet
                namespace: ec2subnet
              spec:
                mapPublicIPOnLaunch: false

    # AC-5: IPv6 CIDR block passed through.
    - name: ac5-ipv6-cidr
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac5-cfg
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
        - script:
            content: kubectl patch ec2config ac5-cfg -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac5-subnet
                namespace: ec2subnet
              spec:
                configRef: ac5-cfg
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.5.0/24"
                availabilityZone: us-east-1a
                ipv6CidrBlock: "2001:db8::/64"
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac5-subnet
                namespace: ec2subnet
              spec:
                ipv6CIDRBlock: "2001:db8::/64"

    # AC-6: Route table IDs passed to spec.routeTables.
    - name: ac6-route-table-ids
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac6-cfg
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
        - script:
            content: kubectl patch ec2config ac6-cfg -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac6-subnet
                namespace: ec2subnet
              spec:
                configRef: ac6-cfg
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.6.0/24"
                availabilityZone: us-east-1a
                routeTableIds:
                  - rtb-0123456789abcdef0
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac6-subnet
                namespace: ec2subnet
              spec:
                routeTables:
                  - rtb-0123456789abcdef0

    # AC-7: Tag merge — mandatory > spec > defaults (via script for order-independence).
    - name: ac7-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac7-cfg
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
        - script:
            content: kubectl patch ec2config ac7-cfg -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"tier":"private"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{"tier":"public","zone":"us-east-1a"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac7-subnet
                namespace: ec2subnet
              spec:
                configRef: ac7-cfg
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.7.0/24"
                availabilityZone: us-east-1a
                tags:
                  owner: platform
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac7-subnet
                namespace: ec2subnet
        - script:
            content: |
              TAGS=$(kubectl get subnet ac7-subnet -n ec2subnet -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="tier" and .value=="private")' || (echo "FAIL: mandatory tag not winning" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="owner" and .value=="platform")' || (echo "FAIL: spec tag missing" && exit 1)
              echo "$TAGS" | jq -e '.[] | select(.key=="zone" and .value=="us-east-1a")' || (echo "FAIL: defaults-only tag missing" && exit 1)

    # AC-8: Synced labels propagated with aws.kropath.run/ prefix.
    - name: ac8-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac8-cfg
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
        - script:
            content: kubectl patch ec2config ac8-cfg -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac8-subnet
                namespace: ec2subnet
              spec:
                configRef: ac8-cfg
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.8.0/24"
                availabilityZone: us-east-1a
                syncedLabels:
                  az: us-east-1a
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac8-subnet
                namespace: ec2subnet
                labels:
                  aws.kropath.run/az: us-east-1a

    # AC-10: Deletion policy retain (default).
    - name: ac10-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: ac10-cfg
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
        - script:
            content: kubectl patch ec2config ac10-cfg -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac10-subnet
                namespace: ec2subnet
              spec:
                configRef: ac10-cfg
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.10.0/24"
                availabilityZone: us-east-1a
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac10-subnet
                namespace: ec2subnet
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-12: Custom configRef selects a different EC2Config.
    - name: ac12-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Config
              metadata:
                name: subnet-policy
                namespace: ec2subnet
                labels:
                  aws.kropath.run/resource-name: subnet-policy
        - script:
            content: kubectl patch ec2config subnet-policy -n ec2subnet --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"restrictPublicIpOnLaunch":true,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EC2Subnet
              metadata:
                name: ac12-subnet
                namespace: ec2subnet
              spec:
                configRef: subnet-policy
                vpcId: vpc-0123456789abcdef0
                cidrBlock: "10.0.12.0/24"
                availabilityZone: us-east-1a
        - assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: ac12-subnet
                namespace: ec2subnet
              spec:
                mapPublicIPOnLaunch: false
