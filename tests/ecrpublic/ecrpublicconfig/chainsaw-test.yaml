# aws-ecrpub-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ecrpublicconfig
spec:
  skipDelete: true
  namespace: ecrpublicconfig
  steps:
    - name: ac1-ecrpublicconfig-valid-admission
      try:
        - apply:
            file: 00-ecrpublicconfig-namespace.yaml
        - apply:
            file: 01-valid-admission.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECRPublicConfig
              metadata:
                name: valid-admission
                namespace: ecrpublicconfig
              spec:
                mandatory:
                  tags:
                    env: production
                defaults:
                  namingTemplate: "{namespace}/{name}"

    - name: ac2-ecrpublicconfig-defaults-only
      try:
        - apply:
            file: 02-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECRPublicConfig
              metadata:
                name: defaults-only
                namespace: ecrpublicconfig
              spec:
                defaults:
                  namingTemplate: "{namespace}/{name}"

    - name: ac3-ecrpublicconfig-tags-both-tiers
      try:
        - apply:
            file: 03-tags-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECRPublicConfig
              metadata:
                name: tags-both-tiers
                namespace: ecrpublicconfig
              spec:
                mandatory:
                  tags:
                    org: my-company
                    env: production
                defaults:
                  tags:
                    team: platform

    - name: ac4-ecrpublicconfig-label-selector
      try:
        - apply:
            file: 04-label-selector.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECRPublicConfig
              metadata:
                name: label-selector-test
                namespace: ecrpublicconfig
                labels:
                  aws.kropath.run/resource-name: label-selector-test
        - script:
            content: |
              set -eu
              label="$(kubectl get ecrpublicconfig label-selector-test -n ecrpublicconfig \
                -o jsonpath='{.metadata.labels.aws\.kropath\.run/resource-name}')"
              test "$label" = "label-selector-test"

    - name: ac5-ecrpublicconfig-namingtemplate-both-tiers
      try:
        - apply:
            file: 05-invalid-both-tiers-namingtemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECRPublicConfig
                check:
                  ($error != null): true
