# AC-3: ECRPublicConfig with map fields (tags) in both mandatory and defaults is
# accepted — map fields use additive merge, no mutual-exclusion rule applies.
---
apiVersion: aws.kropath.run/v1alpha1
kind: ECRPublicConfig
metadata:
  name: tags-both-tiers
  namespace: ecrpublicconfig
  labels:
    aws.kropath.run/resource-name: tags-both-tiers
spec:
  mandatory:
    tags:
      org: my-company
      env: production
  defaults:
    tags:
      team: platform
