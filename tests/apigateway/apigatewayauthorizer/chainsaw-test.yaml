              kind: APIGatewayRestAPI
              metadata:
                name: ac10-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac10-api
              spec:
                configRef: ac10-cfg
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac10-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac10-cfg
                restApiRef: ac10-api
                type: TOKEN
