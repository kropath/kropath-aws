# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named config + CR and deletes nothing
# between steps. skipDelete stops chainsaw's end-of-test cascade delete (no ACK
# controllers running, so ACK finalizers are never removed). Ephemeral kind cluster
# is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayauthorizer
spec:
  skipDelete: true
  namespace: apigatewayauthorizer
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ─────────────────────────────────────────────────────────────────────────
    # AC-1: TOKEN authorizer — type, authorizerUri, identitySource, restApiRef.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac1-token-authorizer
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac1-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac1-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac1-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac1-api
              spec:
                configRef: ac1-cfg
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac1-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac1-cfg
                restApiRef: ac1-api
                type: TOKEN
                authorizerUri: "arn:aws:apigateway:ap-southeast-2:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-southeast-2:123456789012:function:my-auth/invocations"
                identitySource: "method.request.header.Authorization"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: ac1-auth
                namespace: apigatewayauthorizer
              spec:
                name: apigatewayauthorizer-ac1-auth
                type: TOKEN
                authorizerURI: "arn:aws:apigateway:ap-southeast-2:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-southeast-2:123456789012:function:my-auth/invocations"
                identitySource: "method.request.header.Authorization"
                authorizerResultTTLInSeconds: 300
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac1-auth
                namespace: apigatewayauthorizer
              status:
                resourceName: apigatewayauthorizer-ac1-auth
                namingStatus: valid

    # ─────────────────────────────────────────────────────────────────────────
    # AC-2: REQUEST authorizer — multiple identitySource values.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac2-request-authorizer
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac2-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac2-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac2-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac2-api
              spec:
                configRef: ac2-cfg
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac2-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac2-cfg
                restApiRef: ac2-api
                type: REQUEST
                authorizerUri: "arn:aws:apigateway:ap-southeast-2:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-southeast-2:123456789012:function:my-request-auth/invocations"
                identitySource: "method.request.header.Authorization, method.request.querystring.token"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: ac2-auth
                namespace: apigatewayauthorizer
              spec:
                type: REQUEST
                authorizerURI: "arn:aws:apigateway:ap-southeast-2:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-southeast-2:123456789012:function:my-request-auth/invocations"
                identitySource: "method.request.header.Authorization, method.request.querystring.token"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-3: COGNITO_USER_POOLS authorizer — providerArns, no authorizerUri.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac3-cognito-authorizer
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac3-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac3-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac3-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac3-api
              spec:
                configRef: ac3-cfg
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac3-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac3-cfg
                restApiRef: ac3-api
                type: COGNITO_USER_POOLS
                providerArns:
                  - "arn:aws:cognito-idp:ap-southeast-2:123456789012:userpool/ap-southeast-2_abc123"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: ac3-auth
                namespace: apigatewayauthorizer
              spec:
                type: COGNITO_USER_POOLS
                providerARNs:
                  - "arn:aws:cognito-idp:ap-southeast-2:123456789012:userpool/ap-southeast-2_abc123"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-4: authorizerResultTtlInSeconds: 0 — caching disabled (explicit zero).
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac4-cache-disabled
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac4-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac4-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac4-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac4-api
              spec:
                configRef: ac4-cfg
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac4-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac4-cfg
                restApiRef: ac4-api
                type: TOKEN
                authorizerUri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:auth/invocations"
                identitySource: "method.request.header.Authorization"
                authorizerResultTtlInSeconds: 0
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: ac4-auth
                namespace: apigatewayauthorizer
              spec:
                authorizerResultTTLInSeconds: 0

    # ─────────────────────────────────────────────────────────────────────────
    # AC-5: authorizerResultTtlInSeconds not set — default 300 applied.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac5-default-ttl
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac5-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac5-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac5-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac5-api
              spec:
                configRef: ac5-cfg
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac5-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac5-cfg
                restApiRef: ac5-api
                type: TOKEN
                authorizerUri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:auth/invocations"
                identitySource: "method.request.header.Authorization"
                # authorizerResultTtlInSeconds intentionally omitted — expects default 300
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: ac5-auth
                namespace: apigatewayauthorizer
              spec:
                authorizerResultTTLInSeconds: 300

    # ─────────────────────────────────────────────────────────────────────────
    # AC-6: restApiRef wiring — restAPIID populated from APIGatewayRestAPI status.
    # Patches the ACK RestAPI status.id to inject a fake restApiId; kro propagates
    # this to APIGatewayRestAPI.status.restApiId; Authorizer reads it via externalRef.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac6-restapi-ref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac6-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac6-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac6-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac6-api
              spec:
                configRef: ac6-cfg
        # Wait for kro to create the ACK RestAPI child, then inject a fake restApiId.
        # No ACK controller overwrites status in this test cluster.
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get restapis.apigateway.services.k8s.aws ac6-api -n apigatewayauthorizer 2>/dev/null && break
                sleep 2
              done
              kubectl patch restapi ac6-api -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"id":"abc123def"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac6-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac6-cfg
                restApiRef: ac6-api
                type: TOKEN
                authorizerUri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:auth/invocations"
                identitySource: "method.request.header.Authorization"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: ac6-auth
                namespace: apigatewayauthorizer
              spec:
                restAPIID: abc123def

    # ─────────────────────────────────────────────────────────────────────────
    # AC-7: Naming template — {namespace}-{name} resolves to expected value.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac7-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac7-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac7-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac7-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac7-api
              spec:
                configRef: ac7-cfg
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac7-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac7-cfg
                restApiRef: ac7-api
                type: TOKEN
                authorizerUri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:auth/invocations"
                identitySource: "method.request.header.Authorization"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: ac7-auth
                namespace: apigatewayauthorizer
              spec:
                name: apigatewayauthorizer-ac7-auth
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac7-auth
                namespace: apigatewayauthorizer
              status:
                resourceName: apigatewayauthorizer-ac7-auth
                namingStatus: valid

    # ─────────────────────────────────────────────────────────────────────────
    # AC-8a: deletionPolicy: retain (default) — annotation set to retain.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac8a-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac8a-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac8a-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac8a-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac8a-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac8a-api
              spec:
                configRef: ac8a-cfg
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac8a-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac8a-cfg
                restApiRef: ac8a-api
                type: TOKEN
                authorizerUri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:auth/invocations"
                identitySource: "method.request.header.Authorization"
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: ac8a-auth
                namespace: apigatewayauthorizer
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # ─────────────────────────────────────────────────────────────────────────
    # AC-8b: deletionPolicy: delete — annotation set to delete.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac8b-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac8b-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac8b-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac8b-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac8b-api
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac8b-api
              spec:
                configRef: ac8b-cfg
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac8b-auth
                namespace: apigatewayauthorizer
              spec:
                configRef: ac8b-cfg
                restApiRef: ac8b-api
                type: TOKEN
                authorizerUri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:auth/invocations"
                identitySource: "method.request.header.Authorization"
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: ac8b-auth
                namespace: apigatewayauthorizer
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # ─────────────────────────────────────────────────────────────────────────
    # AC-9: Missing required fields — Kubernetes admission must reject the CR.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac9-missing-required
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -n apigatewayauthorizer -f - 2>&1 <<'MANIFEST'
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAuthorizer
              metadata:
                name: ac9-missing-type
                namespace: apigatewayauthorizer
              spec:
                restApiRef: ac9-api
              MANIFEST
              )
              EC=$?
              if [ $EC -eq 0 ]; then
                echo "FAIL: Expected admission error for missing required field 'type', but CR was accepted"
                exit 1
              fi
              echo "PASS: $OUTPUT"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-10: Tags are no-op on cloud. syncedLabels wire to K8s metadata labels.
    # ACK Authorizer has no spec.tags field.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac10-tags-noop
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac10-cfg
                namespace: apigatewayauthorizer
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  syncedLabels:
                    data-class: internal
        - script:
            content: |
              kubectl patch apigatewayconfig ac10-cfg -n apigatewayauthorizer \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"team":"api"}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{"data-class":"internal"},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
