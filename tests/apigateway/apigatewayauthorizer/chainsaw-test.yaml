              kind: Authorizer
              metadata:
                name: ac10-auth
                namespace: apigatewayauthorizer
                labels:
                  app.kubernetes.io/managed-by: kro
                  aws.kropath.run/data-class: internal
        # Verify no spec.tags field on ACK Authorizer (field does not exist on ACK CRD)
        - script:
            content: |
              TAGS=$(kubectl get authorizers.apigateway.services.k8s.aws ac10-auth -n apigatewayauthorizer -o jsonpath='{.spec.tags}' 2>/dev/null)
              if [ -n "$TAGS" ]; then
                echo "FAIL: ACK Authorizer unexpectedly has spec.tags: $TAGS"
                exit 1
              fi
              echo "PASS: ACK Authorizer has no spec.tags"

