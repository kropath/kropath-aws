# aws-apigw-05 Chainsaw tests — 11 acceptance criteria for APIGatewayVPCLink.
# Namespace: apigatewayvpclink. Default naming: {namespace}-{name}.
#
# CANONICAL pattern: every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource
# name, and deletes NOTHING between steps. skipDelete stops chainsaw's end-of-test
# cascade delete (no ACK controllers running, so ACK finalizers are never removed).
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock
# kropath-controller.
# Exception: AC-7 is a lifecycle test (CLAUDE.md carve-out 2) that mutates the same CR
# across two sub-steps to verify that kro propagates targetArns changes end-to-end.
# ACK enforces targetARNs immutability in production.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayvpclink
spec:
  skipDelete: true
  namespace: apigatewayvpclink
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ─────────────────────────────────────────────────────────────────────────
    # AC-1: Basic VPC link creation — targetArns wired to ACK VPCLink.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac1-basic-vpclink
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac1-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac1-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac1-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac1-cfg
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/my-nlb/abc123"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: ac1-vpclink
                namespace: apigatewayvpclink
              spec:
                name: apigatewayvpclink-ac1-vpclink
                targetARNs:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/my-nlb/abc123"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac1-vpclink
                namespace: apigatewayvpclink
              status:
                resourceName: apigatewayvpclink-ac1-vpclink
                namingStatus: valid

    # ─────────────────────────────────────────────────────────────────────────
    # AC-2: Naming template — {namespace}-{name} produces predictable cloud name.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac2-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac2-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac2-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac2-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac2-cfg
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac2-nlb/abc123"
        # Naming template {namespace}-{name} with namespace=apigatewayvpclink, name=ac2-vpclink
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac2-vpclink
                namespace: apigatewayvpclink
              status:
                resourceName: apigatewayvpclink-ac2-vpclink
                namingStatus: valid
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: ac2-vpclink
                namespace: apigatewayvpclink
              spec:
                name: apigatewayvpclink-ac2-vpclink

    # ─────────────────────────────────────────────────────────────────────────
    # AC-3: nameOverride bypasses naming template.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac3-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac3-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac3-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac3-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac3-cfg
                nameOverride: "custom-vpc-link"
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac3-nlb/abc123"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac3-vpclink
                namespace: apigatewayvpclink
              status:
                resourceName: custom-vpc-link
                namingStatus: valid
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: ac3-vpclink
                namespace: apigatewayvpclink
              spec:
                name: custom-vpc-link

    # ─────────────────────────────────────────────────────────────────────────
    # AC-4: Naming template with unresolvable {tag.X} → namingStatus invalid;
    #        ACK VPCLink must NOT be created (includeWhen guard).
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac4-naming-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac4-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.env}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac4-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{tag.env}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac4-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac4-cfg
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac4-nlb/abc123"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac4-vpclink
                namespace: apigatewayvpclink
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              if kubectl get vpclinks.apigateway.services.k8s.aws ac4-vpclink \
                -n apigatewayvpclink 2>/dev/null; then
                echo "FAIL: ACK VPCLink CR should not be created when namingStatus is invalid"
                exit 1
              fi
              echo "PASS: ACK VPCLink CR not created for unresolved naming template"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-5: Tags 3-way merge — mandatory > spec > defaults.
    # effectiveConfig.mandatory.tags = {cost-centre: platform, team: api}
    # (pre-merged from KropathConfig.mandatory.tags + APIGatewayConfig.mandatory.tags)
    # spec.tags = {app: orders}
    # Expected ACK VPCLink spec.tags contains all three.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac5-tags-merged
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac5-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                    team: api
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac5-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"cost-centre":"platform","team":"api"}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac5-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac5-cfg
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac5-nlb/abc123"
                tags:
                  app: orders
        # Use jq for order-independent tag assertion (CLAUDE.md: map-derived iteration
        # order is not stable — never assert list position for CEL-generated maps).
        - script:
            content: |
              TAGS=$(kubectl get vpclinks.apigateway.services.k8s.aws ac5-vpclink \
                -n apigatewayvpclink -o json | jq '.spec.tags')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e '."cost-centre" == "platform"' || { echo "FAIL: mandatory cost-centre tag missing"; exit 1; }
              echo "$TAGS" | jq -e '."team" == "api"' || { echo "FAIL: mandatory team tag missing"; exit 1; }
              echo "$TAGS" | jq -e '."app" == "orders"' || { echo "FAIL: spec app tag missing"; exit 1; }
              echo "PASS: all tag assertions passed"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-6: Deletion policy — delete and retain variants.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac6a-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac6a-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac6a-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac6a-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac6a-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac6a-cfg
                deletionPolicy: delete
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac6a-nlb/abc123"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: ac6a-vpclink
                namespace: apigatewayvpclink
                annotations:
                  services.k8s.aws/deletion-policy: delete

    - name: ac6b-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac6b-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac6b-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac6b-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac6b-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac6b-cfg
                deletionPolicy: retain
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac6b-nlb/abc123"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: ac6b-vpclink
                namespace: apigatewayvpclink
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # ─────────────────────────────────────────────────────────────────────────
    # AC-7: Immutable targetArns — verifies kro correctly wires targetArns
    # end-to-end on creation. ACK enforces immutability at the AWS API level
    # in production (ACK controller rejects or ignores a targetARNs change
    # after creation). That ACK-level enforcement is out-of-scope for kro
    # testing; we verify initial wiring only.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac7-immutable-targetarns
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac7-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac7-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac7-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac7-cfg
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/nlb-original/abc111"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: ac7-vpclink
                namespace: apigatewayvpclink
              spec:
                targetARNs:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/nlb-original/abc111"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-8: Missing required — empty targetArns → ACK VPCLink NOT created.
    # x-kubernetes-validations are stripped by kro; enforcement is via includeWhen
    # guard (size(schema.spec.targetArns) > 0). ACK VPCLink is not created.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac8-missing-required
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac8-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac8-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac8-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac8-cfg
                targetArns: []
        - script:
            content: |
              # Give kro time to reconcile
              sleep 3
              if kubectl get vpclinks.apigateway.services.k8s.aws ac8-vpclink \
                -n apigatewayvpclink 2>/dev/null; then
                echo "FAIL: ACK VPCLink CR should not be created when targetArns is empty"
                exit 1
              fi
              echo "PASS: ACK VPCLink CR not created for empty targetArns"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-9: Integration reference — VPCLink accessible by label selector.
    # Verifies that the VPCLink CR gets the standard label structure needed for
    # cross-resource reference via aws.kropath.run/resource-name label (injected
    # by kropath-controller in production; manually set here for test).
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac9-integration-ref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac9-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac9-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac9-vpclink
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac9-vpclink
              spec:
                configRef: ac9-cfg
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac9-nlb/abc123"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: ac9-vpclink
                namespace: apigatewayvpclink
              spec:
                name: apigatewayvpclink-ac9-vpclink
                targetARNs:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac9-nlb/abc123"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-10: Standard K8s metadata — managed-by, instance, deletion-policy,
    #         ownerReferences back to APIGatewayVPCLink CR.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac10-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac10-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac10-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac10-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac10-cfg
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac10-nlb/abc123"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: ac10-vpclink
                namespace: apigatewayvpclink
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac10-vpclink
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              # Verify ownerReferences back to APIGatewayVPCLink CR
              OWNER_KIND=$(kubectl get vpclinks.apigateway.services.k8s.aws ac10-vpclink \
                -n apigatewayvpclink -o jsonpath='{.metadata.ownerReferences[0].kind}')
              OWNER_NAME=$(kubectl get vpclinks.apigateway.services.k8s.aws ac10-vpclink \
                -n apigatewayvpclink -o jsonpath='{.metadata.ownerReferences[0].name}')
              CONTROLLER=$(kubectl get vpclinks.apigateway.services.k8s.aws ac10-vpclink \
                -n apigatewayvpclink -o jsonpath='{.metadata.ownerReferences[0].controller}')
              if [ "$OWNER_KIND" != "APIGatewayVPCLink" ]; then
                echo "FAIL: ownerReference kind mismatch: got $OWNER_KIND, expected APIGatewayVPCLink"
                exit 1
              fi
              if [ "$OWNER_NAME" != "ac10-vpclink" ]; then
                echo "FAIL: ownerReference name mismatch: got $OWNER_NAME, expected ac10-vpclink"
                exit 1
              fi
              if [ "$CONTROLLER" != "true" ]; then
                echo "FAIL: ownerReference controller mismatch: got $CONTROLLER, expected true"
                exit 1
              fi
              echo "PASS: ownerReferences correctly set"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-11: syncedLabels dual assertion — present in K8s metadata.labels
    #         (with aws.kropath.run/ prefix) AND in ACK VPCLink spec.tags
    #         (without prefix, as part of allCloudMetadata — ADR-015 §6.1).
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac11-synced-labels-dual
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac11-cfg
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac11-cfg -n apigatewayvpclink \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"environment":"production"},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayVPCLink
              metadata:
                name: ac11-vpclink
                namespace: apigatewayvpclink
              spec:
                configRef: ac11-cfg
                targetArns:
                  - "arn:aws:elasticloadbalancing:ap-southeast-2:123456789012:loadbalancer/net/ac11-nlb/abc123"
        # Assertion 1: label present in ACK VPCLink metadata.labels with prefix
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: ac11-vpclink
                namespace: apigatewayvpclink
                labels:
                  aws.kropath.run/environment: production
        # Assertion 2: label also forwarded to spec.tags (allCloudMetadata) — order-independent jq
        - script:
            content: |
              TAGS=$(kubectl get vpclinks.apigateway.services.k8s.aws ac11-vpclink \
                -n apigatewayvpclink -o json | jq '.spec.tags')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e '."environment" == "production"' || {
                echo "FAIL: environment not found in spec.tags (allCloudMetadata dual-assertion)"
                exit 1
              }
              echo "PASS: environment present in both metadata.labels and spec.tags"
