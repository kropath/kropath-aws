# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named config + CR and deletes nothing
# between steps. skipDelete stops chainsaw's end-of-test cascade delete (no ACK
# controllers running, so ACK finalizers are never removed). Ephemeral kind cluster
# is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayrestapi
spec:
  skipDelete: true
  namespace: apigatewayrestapi
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ─────────────────────────────────────────────────────────────────────────
    # AC-1: Simple Lambda proxy — one resource, one method, one integration,
    #       one integration response, one method response.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac1-simple-lambda-proxy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac1-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac1-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac1-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac1-cfg
                resources:
                  - pathPart: orders
                    parentPath: ""
                    methods:
                      - httpMethod: GET
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:orders/invocations
                          integrationHttpMethod: POST
                          responses:
                            - statusCode: "200"
                        methodResponses:
                          - statusCode: "200"
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: RestAPI
              metadata:
                name: ac1-api
                namespace: apigatewayrestapi
              spec:
                name: apigatewayrestapi-ac1-api
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac1-api
                namespace: apigatewayrestapi
              status:
                resourceName: apigatewayrestapi-ac1-api
                namingStatus: valid
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Resource
              metadata:
                name: ac1-api-res-orders
                namespace: apigatewayrestapi
              spec:
                pathPart: orders
                restAPIRef:
                  from:
                    name: ac1-api
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Method
              metadata:
                name: ac1-api-m-orders-get
                namespace: apigatewayrestapi
              spec:
                httpMethod: GET
                authorizationType: NONE
                restAPIRef:
                  from:
                    name: ac1-api
                resourceRef:
                  from:
                    name: ac1-api-res-orders
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Integration
              metadata:
                name: ac1-api-int-orders-get
                namespace: apigatewayrestapi
              spec:
                httpMethod: GET
                type: AWS_PROXY
                uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:orders/invocations
                integrationHTTPMethod: POST
                restAPIRef:
                  from:
                    name: ac1-api
                resourceRef:
                  from:
                    name: ac1-api-res-orders
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIIntegrationResponse
              metadata:
                name: ac1-api-ir-orders-get-200
                namespace: apigatewayrestapi
              spec:
                httpMethod: GET
                statusCode: "200"
                restAPIRef:
                  from:
                    name: ac1-api
                resourceRef:
                  from:
                    name: ac1-api-res-orders
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIMethodResponse
              metadata:
                name: ac1-api-mr-orders-get-200
                namespace: apigatewayrestapi
              spec:
                httpMethod: GET
                statusCode: "200"
                restAPIRef:
                  from:
                    name: ac1-api
                resourceRef:
                  from:
                    name: ac1-api-res-orders

    # ─────────────────────────────────────────────────────────────────────────
    # AC-2: Multi-resource tree — /orders, /orders/{id} (nested), /products.
    #       Verifies parentRef wiring for nested resource.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac2-multi-resource-tree
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac2-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac2-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac2-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac2-cfg
                resources:
                  - pathPart: orders
                    parentPath: ""
                    methods:
                      - httpMethod: GET
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:orders/invocations
                          integrationHttpMethod: POST
                  - pathPart: "{id}"
                    parentPath: orders
                    methods:
                      - httpMethod: GET
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:order-detail/invocations
                          integrationHttpMethod: POST
                  - pathPart: products
                    parentPath: ""
                    methods:
                      - httpMethod: GET
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:products/invocations
                          integrationHttpMethod: POST
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Resource
              metadata:
                name: ac2-api-res-orders
                namespace: apigatewayrestapi
              spec:
                pathPart: orders
                restAPIRef:
                  from:
                    name: ac2-api
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Resource
              metadata:
                name: ac2-api-res-orders-id
                namespace: apigatewayrestapi
              spec:
                pathPart: "{id}"
                restAPIRef:
                  from:
                    name: ac2-api
                parentRef:
                  from:
                    name: ac2-api-res-orders
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Resource
              metadata:
                name: ac2-api-res-products
                namespace: apigatewayrestapi
              spec:
                pathPart: products
                restAPIRef:
                  from:
                    name: ac2-api

    # ─────────────────────────────────────────────────────────────────────────
    # AC-3: Empty resources — only RestAPI CR created, no children.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac3-empty-resources
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac3-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac3-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac3-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac3-cfg
                resources: []
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: RestAPI
              metadata:
                name: ac3-api
                namespace: apigatewayrestapi
              spec:
                name: apigatewayrestapi-ac3-api
        - script:
            content: |
              COUNT=$(kubectl get resource -n apigatewayrestapi --selector=app.kubernetes.io/instance=ac3-api -o name 2>/dev/null | wc -l | tr -d ' ')
              echo "Resource CR count: $COUNT"
              if [ "$COUNT" -eq "0" ]; then echo "PASS: no Resource CRs created"; exit 0; fi
              echo "FAIL: expected 0 Resource CRs, found $COUNT"; exit 1

    # ─────────────────────────────────────────────────────────────────────────
    # AC-4: Scale-up — start with GET, add POST to the same path.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac4-scale-up-add-method
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac4-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac4-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac4-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac4-cfg
                resources:
                  - pathPart: items
                    parentPath: ""
                    methods:
                      - httpMethod: GET
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:list-items/invocations
                          integrationHttpMethod: POST
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Method
              metadata:
                name: ac4-api-m-items-get
                namespace: apigatewayrestapi
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac4-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac4-cfg
                resources:
                  - pathPart: items
                    parentPath: ""
                    methods:
                      - httpMethod: GET
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:list-items/invocations
                          integrationHttpMethod: POST
                      - httpMethod: POST
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:create-item/invocations
                          integrationHttpMethod: POST
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Method
              metadata:
                name: ac4-api-m-items-post
                namespace: apigatewayrestapi
              spec:
                httpMethod: POST
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Method
              metadata:
                name: ac4-api-m-items-get
                namespace: apigatewayrestapi
              spec:
                httpMethod: GET

    # ─────────────────────────────────────────────────────────────────────────
    # AC-5: Scale-down — remove /products, verify /orders child CRs survive.
    #       Note: ACK Resource CR for /products will be stuck in Terminating
    #       without a live ACK controller. We verify the surviving path only.
    #       (Lifecycle test — single resource name across sub-steps is correct
    #        per CLAUDE.md carve-out #2 for genuine lifecycle tests.)
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac5-scale-down-remove-path
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac5-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac5-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac5-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac5-cfg
                resources:
                  - pathPart: orders
                    parentPath: ""
                    methods:
                      - httpMethod: GET
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:orders/invocations
                          integrationHttpMethod: POST
                  - pathPart: products
                    parentPath: ""
                    methods:
                      - httpMethod: GET
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:products/invocations
                          integrationHttpMethod: POST
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Resource
              metadata:
                name: ac5-api-res-products
                namespace: apigatewayrestapi
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac5-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac5-cfg
                resources:
                  - pathPart: orders
                    parentPath: ""
                    methods:
                      - httpMethod: GET
                        authorizationType: NONE
                        integration:
                          type: AWS_PROXY
                          uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:orders/invocations
                          integrationHttpMethod: POST
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: Resource
              metadata:
                name: ac5-api-res-orders
                namespace: apigatewayrestapi
              spec:
                pathPart: orders

    # ─────────────────────────────────────────────────────────────────────────
    # AC-6: Mandatory endpointType override — mandatory REGIONAL wins over
    #       instance EDGE.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac6-mandatory-override-endpointtype
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac6-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  endpointType: REGIONAL
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac6-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"REGIONAL","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac6-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac6-cfg
                endpointType: EDGE
                resources: []
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: RestAPI
              metadata:
                name: ac6-api
                namespace: apigatewayrestapi
              spec:
                endpointConfiguration:
                  types:
                    - REGIONAL

    # ─────────────────────────────────────────────────────────────────────────
    # AC-7: Defaults fallback endpointType — defaults REGIONAL when mandatory
    #       is empty and instance spec is empty.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac7-defaults-fallback-endpointtype
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac7-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  endpointType: REGIONAL
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac7-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"REGIONAL","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac7-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac7-cfg
                resources: []
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: RestAPI
              metadata:
                name: ac7-api
                namespace: apigatewayrestapi
              spec:
                endpointConfiguration:
                  types:
                    - REGIONAL

    # ─────────────────────────────────────────────────────────────────────────
    # AC-8: minimumTlsVersion → securityPolicy.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac8-tls-security-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac8-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory:
                  minimumTlsVersion: TLS_1_2
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac8-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"TLS_1_2","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac8-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac8-cfg
                resources: []
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: RestAPI
              metadata:
                name: ac8-api
                namespace: apigatewayrestapi
              spec:
                securityPolicy: TLS_1_2

    # ─────────────────────────────────────────────────────────────────────────
    # AC-9: Naming template — {namespace}-{name} → apigatewayrestapi-ac9-api.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac9-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac9-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac9-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac9-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac9-cfg
                resources: []
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac9-api
                namespace: apigatewayrestapi
              status:
                resourceName: apigatewayrestapi-ac9-api
                namingStatus: valid
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: RestAPI
              metadata:
                name: ac9-api
                namespace: apigatewayrestapi
              spec:
                name: apigatewayrestapi-ac9-api

