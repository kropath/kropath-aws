        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac11-cfg
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory:
                  tags:
                    api-type: rest
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac11-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"api-type":"rest"}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac11-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac11-cfg
                tags:
                  app: orders
                resources: []
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 15); do
                TAGS=$(kubectl get restapi ac11-api -n apigatewayrestapi -o jsonpath='{.spec.tags}' 2>/dev/null)
                if echo "$TAGS" | grep -q "api-type" && echo "$TAGS" | grep -q "app"; then
                  echo "PASS: tags contain api-type and app: $TAGS"; exit 0
                fi
                sleep 2
              done
              echo "FAIL: expected both api-type and app in tags"
              kubectl get restapi ac11-api -n apigatewayrestapi -o jsonpath='{.spec.tags}'
              exit 1

