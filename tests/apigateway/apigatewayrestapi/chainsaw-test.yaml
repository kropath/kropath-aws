                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac24-cfg -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: my-api-policy
                namespace: apigatewayrestapi
                labels:
                  aws.kropath.run/resource-name: my-api-policy
              spec:
                documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:root"},"Action":"execute-api:Invoke","Resource":"*"}]}'
        - script:
            content: |
              # Patch PolicyDocument status since no controller runs locally
              kubectl patch policydocument my-api-policy -n apigatewayrestapi \
                --subresource=status --type=merge \
                -p '{"status":{"resolvedDocumentJSON":"{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"arn:aws:iam::123456789012:root\"},\"Action\":\"execute-api:Invoke\",\"Resource\":\"*\"}]}"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayRestAPI
              metadata:
                name: ac24-api
                namespace: apigatewayrestapi
              spec:
                configRef: ac24-cfg
                resourcePolicyRef: my-api-policy
                resources: []
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 15); do
                POLICY=$(kubectl get restapi ac24-api -n apigatewayrestapi -o jsonpath='{.spec.policy}' 2>/dev/null)
                if [ -n "$POLICY" ]; then
                  echo "PASS: policy is set (length ${#POLICY})"
                  exit 0
                fi
                echo "Attempt $i: policy not yet set, waiting..."
                sleep 2
              done
              echo "FAIL: policy still not set after 30s"
              kubectl get restapi ac24-api -n apigatewayrestapi -o yaml
              exit 1

