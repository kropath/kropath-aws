    # AC-12: Mutual exclusion — policy AND resourcePolicyRef both set.
    #        Advisory ConfigMap validation error surfaced in status.validationError.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac12-mutual-exclusion-policy
