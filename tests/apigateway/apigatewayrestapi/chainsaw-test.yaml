                namespace: apigatewayrestapi
              status:
                (validationError != ""): true
        - script:
            content: |
              # Verify RestAPI ACK CR was NOT created (includeWhen blocks it on mutual exclusion)
              COUNT=$(kubectl get restapi ac12-api -n apigatewayrestapi --ignore-not-found 2>/dev/null | grep -v NAME | wc -l | tr -d ' ')
              echo "RestAPI CR count: $COUNT"
              if [ "$COUNT" -eq "0" ]; then echo "PASS: RestAPI CR not created"; exit 0; fi
