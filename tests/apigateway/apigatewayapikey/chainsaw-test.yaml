#
# aws-apigw-06 Chainsaw tests — 12 acceptance criteria for APIGatewayAPIKey.
# Namespace: apigatewayapikey. Default naming: {namespace}-{name}.
#
# CANONICAL pattern: every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource
# name, and deletes NOTHING between steps. skipDelete stops chainsaw's end-of-test
# cascade delete (no ACK controllers running, so ACK finalizers are never removed).
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock
# kropath-controller.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayapikey
spec:
  skipDelete: true
  namespace: apigatewayapikey
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ─────────────────────────────────────────────────────────────────────────
    # AC-1: Basic API key — no enabled field set (nil → default true).
    # Verifies ACK APIKey is created with spec.enabled: true.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac1-basic-apikey
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac1-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac1-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac1-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIKey
              metadata:
                name: ac1-apikey
                namespace: apigatewayapikey
              spec:
                name: apigatewayapikey-ac1-apikey
                enabled: true
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac1-apikey
                namespace: apigatewayapikey
              status:
                resourceName: apigatewayapikey-ac1-apikey
                namingStatus: valid

    # ─────────────────────────────────────────────────────────────────────────
    # AC-2: Disabled key — enabled: false → ACK APIKey with spec.enabled: false.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac2-disabled-key
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac2-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac2-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac2-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac2-cfg
                enabled: false
        - script:
            content: |
              # Wait for kro to create the ACK APIKey
              sleep 3
              ENABLED=$(kubectl get apikeys.apigateway.services.k8s.aws ac2-apikey \
                -n apigatewayapikey -o jsonpath='{.spec.enabled}' 2>/dev/null)
              echo "enabled: $ENABLED"
              if [ "$ENABLED" != "false" ]; then
                echo "FAIL: expected spec.enabled=false, got '$ENABLED'"
                exit 1
              fi
              echo "PASS: ACK APIKey has spec.enabled: false"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-3: Naming — {namespace}-{name} template produces predictable cloud name.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac3-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac3-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac3-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac3-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac3-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac3-apikey
                namespace: apigatewayapikey
              status:
                resourceName: apigatewayapikey-ac3-apikey
                namingStatus: valid
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIKey
              metadata:
                name: ac3-apikey
                namespace: apigatewayapikey
              spec:
                name: apigatewayapikey-ac3-apikey

    # ─────────────────────────────────────────────────────────────────────────
    # AC-4: nameOverride bypasses naming template.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac4-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac4-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac4-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac4-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac4-cfg
                nameOverride: "custom-api-key"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac4-apikey
                namespace: apigatewayapikey
              status:
                resourceName: custom-api-key
                namingStatus: valid
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIKey
              metadata:
                name: ac4-apikey
                namespace: apigatewayapikey
              spec:
                name: custom-api-key

    # ─────────────────────────────────────────────────────────────────────────
    # AC-5: Naming with unresolvable {tag.env} → namingStatus invalid;
    #        ACK APIKey must NOT be created (includeWhen guard).
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac5-naming-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac5-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.env}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac5-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{tag.env}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac5-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac5-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac5-apikey
                namespace: apigatewayapikey
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              if kubectl get apikeys.apigateway.services.k8s.aws ac5-apikey \
                -n apigatewayapikey 2>/dev/null; then
                echo "FAIL: ACK APIKey CR should not be created when namingStatus is invalid"
                exit 1
              fi
              echo "PASS: ACK APIKey CR not created for unresolved naming template"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-6: Tags 3-way merge — mandatory > spec > defaults.
    # effectiveConfig.mandatory.tags = {cost-centre: platform, team: api}
    # (pre-merged from KropathConfig.mandatory.tags + APIGatewayConfig.mandatory.tags)
    # spec.tags = {app: orders}
    # Expected ACK APIKey spec.tags contains all three.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac6-tags-merged
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac6-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                    team: api
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac6-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"cost-centre":"platform","team":"api"}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac6-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac6-cfg
                tags:
                  app: orders
        # Wait for kro to create the ACK APIKey before checking tags.
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIKey
              metadata:
                name: ac6-apikey
                namespace: apigatewayapikey
        # Use jq for order-independent tag assertion (CLAUDE.md: map-derived iteration
        # order is not stable — never assert list position for CEL-generated maps).
        - script:
            content: |
              TAGS=$(kubectl get apikeys.apigateway.services.k8s.aws ac6-apikey \
                -n apigatewayapikey -o json | jq '.spec.tags')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e '."cost-centre" == "platform"' || { echo "FAIL: mandatory cost-centre tag missing"; exit 1; }
              echo "$TAGS" | jq -e '."team" == "api"' || { echo "FAIL: mandatory team tag missing"; exit 1; }
              echo "$TAGS" | jq -e '."app" == "orders"' || { echo "FAIL: spec app tag missing"; exit 1; }
              echo "PASS: all tag assertions passed"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-7a: Deletion policy delete.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac7a-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac7a-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac7a-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac7a-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac7a-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac7a-cfg
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIKey
              metadata:
                name: ac7a-apikey
                namespace: apigatewayapikey
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # ─────────────────────────────────────────────────────────────────────────
    # AC-7b: Deletion policy retain (default).
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac7b-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac7b-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac7b-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac7b-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac7b-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac7b-cfg
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIKey
              metadata:
                name: ac7b-apikey
                namespace: apigatewayapikey
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # ─────────────────────────────────────────────────────────────────────────
    # AC-8: Auto-generated value — no spec.value field in RGD schema (Phase 1).
    # Verifies ACK APIKey does not have a spec.value field.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac8-auto-value
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac8-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac8-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac8-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac8-cfg
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIKey
              metadata:
                name: ac8-apikey
                namespace: apigatewayapikey
        - script:
            content: |
              # Verify the ACK APIKey does not have spec.value set
              VALUE=$(kubectl get apikeys.apigateway.services.k8s.aws ac8-apikey \
                -n apigatewayapikey -o json | jq '.spec | has("value")')
              echo "spec.value present: $VALUE"
              if [ "$VALUE" = "true" ]; then
                echo "FAIL: ACK APIKey spec.value should not be set in Phase 1"
                exit 1
              fi
              echo "PASS: ACK APIKey spec.value is absent (AWS auto-generates key value)"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-9: Standard K8s metadata — managed-by, instance, deletion-policy,
    #        ownerReferences back to APIGatewayAPIKey CR.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac9-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac9-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac9-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac9-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac9-cfg
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIKey
              metadata:
                name: ac9-apikey
                namespace: apigatewayapikey
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac9-apikey
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              # Verify ownerReferences back to APIGatewayAPIKey CR
              OWNER_KIND=$(kubectl get apikeys.apigateway.services.k8s.aws ac9-apikey \
                -n apigatewayapikey -o jsonpath='{.metadata.ownerReferences[0].kind}')
              OWNER_NAME=$(kubectl get apikeys.apigateway.services.k8s.aws ac9-apikey \
                -n apigatewayapikey -o jsonpath='{.metadata.ownerReferences[0].name}')
              CONTROLLER=$(kubectl get apikeys.apigateway.services.k8s.aws ac9-apikey \
                -n apigatewayapikey -o jsonpath='{.metadata.ownerReferences[0].controller}')
              if [ "$OWNER_KIND" != "APIGatewayAPIKey" ]; then
                echo "FAIL: ownerReference kind mismatch: got $OWNER_KIND, expected APIGatewayAPIKey"
                exit 1
              fi
              if [ "$OWNER_NAME" != "ac9-apikey" ]; then
                echo "FAIL: ownerReference name mismatch: got $OWNER_NAME, expected ac9-apikey"
                exit 1
              fi
              if [ "$CONTROLLER" != "true" ]; then
                echo "FAIL: ownerReference controller mismatch: got $CONTROLLER, expected true"
                exit 1
              fi
              echo "PASS: ownerReferences correctly set"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-10: syncedLabels dual assertion — present in K8s metadata.labels
    #         (with aws.kropath.run/ prefix) AND in ACK APIKey spec.tags
    #         (without prefix, as part of allCloudMetadata — ADR-015 §6.1).
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac10-synced-labels-dual
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac10-cfg
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch apigatewayconfig ac10-cfg -n apigatewayapikey \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"environment":"production"},"tags":{}},"defaults":{"apiKeySource":"","disableExecuteApiEndpoint":false,"endpointType":"","minimumTlsVersion":"","namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayAPIKey
              metadata:
                name: ac10-apikey
                namespace: apigatewayapikey
              spec:
                configRef: ac10-cfg
        # Assertion 1: label present in ACK APIKey metadata.labels with prefix
        - assert:
            resource:
              apiVersion: apigateway.services.k8s.aws/v1alpha1
              kind: APIKey
              metadata:
                name: ac10-apikey
                namespace: apigatewayapikey
                labels:
                  aws.kropath.run/environment: production
        # Assertion 2: label also forwarded to spec.tags (allCloudMetadata) — order-independent jq
        - script:
            content: |
              TAGS=$(kubectl get apikeys.apigateway.services.k8s.aws ac10-apikey \
                -n apigatewayapikey -o json | jq '.spec.tags')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e '."environment" == "production"' || {
                echo "FAIL: environment not found in spec.tags (allCloudMetadata dual-assertion)"
                exit 1
              }
              echo "PASS: environment present in both metadata.labels and spec.tags"

    # ─────────────────────────────────────────────────────────────────────────
    # AC-11: Mandatory naming template — mandatory.namingTemplate wins over
    #         defaults.namingTemplate; instance cannot override via configRef defaults.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ac11-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: ac11-cfg
                namespace: apigatewayapikey
                labels:
