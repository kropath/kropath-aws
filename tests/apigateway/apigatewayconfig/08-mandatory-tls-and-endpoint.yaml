# AC-9: mandatory.minimumTlsVersion="TLS_1_2" and mandatory.disableExecuteApiEndpoint=true.
#         CR must be accepted (no dual-tier conflict — defaults fields are not set).
---
apiVersion: aws.kropath.run/v1alpha1
kind: APIGatewayConfig
metadata:
  name: pci-policy
  namespace: apigatewayconfig
spec:
  mandatory:
    endpointType: ""
    apiKeySource: ""
    minimumTlsVersion: "TLS_1_2"
    disableExecuteApiEndpoint: true
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    endpointType: "REGIONAL"
    apiKeySource: "HEADER"
    minimumTlsVersion: ""
    disableExecuteApiEndpoint: false
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
