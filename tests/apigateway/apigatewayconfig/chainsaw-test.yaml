# aws-apigw-01 Chainsaw tests — one scenario per acceptance criterion.
# AC-1 through AC-6, AC-8, AC-9: isolated tests (no controller required).
# AC-7, AC-10, AC-11: integration tests (require kropath-controller); commented out.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayconfig
spec:
  # Canonical pattern: skipDelete=true, unique resource name per step (config CRs have
  # no ACK finalizers so deletes are safe, but unique-per-step keeps steps independent).
  skipDelete: true
  namespace: apigatewayconfig
  steps:
    - name: prepare
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: general-policy CR with defaults.endpointType="REGIONAL", defaults.apiKeySource="HEADER",
    #         defaults.namingTemplate="{namespace}-{name}"; label aws.kropath.run/resource-name present.
    - name: ac1-create-general-policy
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: general-policy
                namespace: apigatewayconfig
              spec:
                mandatory:
                  endpointType: ""
                  apiKeySource: ""
                  minimumTlsVersion: ""
                  disableExecuteApiEndpoint: false
                  namingTemplate: ""
                defaults:
                  endpointType: "REGIONAL"
                  apiKeySource: "HEADER"
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              set -eu
              # Verify label is present (controller label operator injects it; fixture carries it explicitly).
              label=$(kubectl get apigatewayconfig general-policy -n apigatewayconfig \
                -o jsonpath='{.metadata.labels.aws\.kropath\.run/resource-name}' 2>/dev/null)
              test "${label}" = "general-policy"

    # AC-2: mandatory.endpointType + defaults.endpointType both set → rejected by x-kubernetes-validations.
    - name: ac2-reject-dual-tier-endpointtype
      try:
        - apply:
            file: 02-invalid-both-endpointtype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: APIGatewayConfig
                check:
                  ($error != null): true

    # AC-3: mandatory.apiKeySource + defaults.apiKeySource both set → rejected.
    - name: ac3-reject-dual-tier-apikeysource
      try:
        - apply:
            file: 03-invalid-both-apikeysource.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: APIGatewayConfig
                check:
                  ($error != null): true

    # AC-4: mandatory.minimumTlsVersion + defaults.minimumTlsVersion both set → rejected.
    - name: ac4-reject-dual-tier-tlsversion
      try:
        - apply:
            file: 04-invalid-both-tlsversion.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: APIGatewayConfig
                check:
                  ($error != null): true

    # AC-5: mandatory.disableExecuteApiEndpoint=true + defaults.disableExecuteApiEndpoint=true → rejected.
    - name: ac5-reject-dual-tier-disableexecuteapi
      try:
        - apply:
            file: 05-invalid-both-disableexecuteapi.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: APIGatewayConfig
                check:
                  ($error != null): true

    # AC-6: mandatory.namingTemplate + defaults.namingTemplate both set → rejected.
    - name: ac6-reject-dual-tier-namingtemplate
      try:
        - apply:
            file: 06-invalid-both-namingtemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: APIGatewayConfig
                check:
                  ($error != null): true

    # AC-7: Commented out — requires kropath-controller to write status.effectiveConfig.
    # - name: ac7-effective-cascade
    #   try:
    #     - script:
    #         content: |
    #           # Requires kropath-controller reconciling KropathConfig + APIGatewayConfig.
    #           # Run in integration test environment only.
    #           echo "SKIP: controller-dependent"
    #           exit 0

    # AC-8: All mandatory fields at zero values — nothing enforced. CR is accepted.
    - name: ac8-empty-mandatory-not-enforced
      try:
        - apply:
            file: 07-empty-mandatory.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: empty-mandatory
                namespace: apigatewayconfig
              spec:
                mandatory:
                  endpointType: ""
                  apiKeySource: ""
                  minimumTlsVersion: ""
                  disableExecuteApiEndpoint: false
                  namingTemplate: ""

    # AC-9: mandatory.minimumTlsVersion="TLS_1_2" and mandatory.disableExecuteApiEndpoint=true.
    #         CR accepted (no dual-tier conflict).
    - name: ac9-mandatory-tls-and-endpoint
      try:
        - apply:
            file: 08-mandatory-tls-and-endpoint.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: APIGatewayConfig
              metadata:
                name: pci-policy
                namespace: apigatewayconfig
              spec:
                mandatory:
                  minimumTlsVersion: "TLS_1_2"
                  disableExecuteApiEndpoint: true

    # AC-10: Commented out — requires kropath-controller to merge tags into status.effectiveConfig.
    # - name: ac10-tag-merge
    #   try:
    #     - script:
    #         content: |
    #           # Requires kropath-controller reconciling KropathConfig.mandatory.tags +
    #           # APIGatewayConfig.mandatory.tags → status.effectiveConfig.mandatory.tags.
    #           echo "SKIP: controller-dependent"
    #           exit 0

