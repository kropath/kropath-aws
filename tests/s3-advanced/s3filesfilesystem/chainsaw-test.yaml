# S3FilesFileSystem Chainsaw tests.
# Naming exempt (KRO-236): S3FilesFileSystem has no provider name field.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3filesfilesystem
spec:
  skipDelete: true
  namespace: s3filesfilesystem
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — FileSystem created with bucket and roleARN.
    - name: ac1-happy-path-filesystem-created
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac1-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac1-fs
                namespace: s3filesfilesystem
              spec:
                bucket: my-s3-bucket
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"

    # AC-2: Mandatory kmsKeyID overrides instance kmsKeyID.
    # filesEncryption.kmsKeyID from mandatory takes precedence.
    - name: ac2-mandatory-kms-key-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  filesEncryption:
                    kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/mandatory-files-key"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":"arn:aws:kms:us-east-1:123456789012:key/mandatory-files-key"},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac2-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
                kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/instance-key"
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac2-fs
                namespace: s3filesfilesystem
              spec:
                kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/mandatory-files-key"
