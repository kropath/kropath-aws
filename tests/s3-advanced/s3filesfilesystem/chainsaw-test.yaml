# S3FilesFileSystem Chainsaw tests.
# Naming exempt (KRO-236): S3FilesFileSystem has no provider name field — no effectiveName,
# no namingTemplate wiring, no status.resourceName, no status.predictedArn.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
#
# NOTE AC-8: importDataRules and expirationDataRules are NOT in the RGD schema; that step
#            is a placeholder documenting the gap. Update when the RGD is extended.
# NOTE AC-11: Mutual exclusion for bucket/bucketRef is NOT implemented (no
#            mutualExclusionError ConfigMap in the RGD for that pair). The step documents
#            current behaviour.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3filesfilesystem
spec:
  skipDelete: true
  namespace: s3filesfilesystem
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — FileSystem created with bucket ARN and roleARN; no kmsKeyID.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac1-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                bucket: "arn:aws:s3:::my-bucket"
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac1-fs
                namespace: s3filesfilesystem
              spec:
                bucket: "arn:aws:s3:::my-bucket"
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"

    # AC-2: defaults.filesEncryption.kmsKeyID is applied when instance sets no kmsKeyID.
    - name: ac2-defaults-encryption
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  filesEncryption:
                    kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/default-files"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":"arn:aws:kms:us-east-1:123456789012:key/default-files"},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac2-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                bucket: "arn:aws:s3:::my-bucket"
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
                kmsKeyID: ""
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac2-fs
                namespace: s3filesfilesystem
              spec:
                kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/default-files"

    # AC-3: mandatory.filesEncryption.kmsKeyID overrides both instance and defaults.
    - name: ac3-mandatory-encryption-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac3-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  filesEncryption:
                    kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/pci-files"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac3-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":"arn:aws:kms:us-east-1:123456789012:key/pci-files"},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac3-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                bucket: "arn:aws:s3:::my-bucket"
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
                kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/custom"
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac3-fs
                namespace: s3filesfilesystem
              spec:
                kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/pci-files"

    # AC-4: instance kmsKeyID wins over defaults.filesEncryption.kmsKeyID.
    - name: ac4-instance-encryption-over-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac4-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  filesEncryption:
                    kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/default"
        - script:
            content: |
              kubectl patch s3advancedconfig ac4-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":"arn:aws:kms:us-east-1:123456789012:key/default"},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac4-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                bucket: "arn:aws:s3:::my-bucket"
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
                kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/custom"
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac4-fs
                namespace: s3filesfilesystem
              spec:
                kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/custom"

    # AC-5: No kmsKeyID anywhere — field absent from ACK FileSystem spec.
    # kro omits empty-string fields; assert via script.
    - name: ac5-no-encryption-absent
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac5-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac5-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac5-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                bucket: "arn:aws:s3:::my-bucket"
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac5-fs
                namespace: s3filesfilesystem
        - script:
            content: |
              KMSKEYID=$(kubectl get filesystems.s3files.services.k8s.aws ac5-fs -n s3filesfilesystem \
                -o jsonpath='{.spec.kmsKeyID}' 2>/dev/null || echo "")
              if [ -z "$KMSKEYID" ]; then
                echo "PASS: kmsKeyID absent or empty as expected"
                exit 0
              else
                echo "FAIL: kmsKeyID should be absent but got: $KMSKEYID"
                exit 1
              fi

    # AC-6: Tag merge — mandatory.tags wins, instance tags preserved; result is [{key,value}] array.
    # Assert order-independently via jq per docs/frequent-rgd-errors.md §6.
    - name: ac6-tag-merge-array-format
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac6-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac6-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac6-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                bucket: "arn:aws:s3:::my-bucket"
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
                tags:
                  app: analytics
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac6-fs
                namespace: s3filesfilesystem
        - script:
            content: |
              kubectl get filesystems.s3files.services.k8s.aws ac6-fs -n s3filesfilesystem -o json | \
                jq -e '.spec.tags | (map(select(.key == "cost-centre" and .value == "platform")) | length == 1) and (map(select(.key == "app" and .value == "analytics")) | length == 1)'

    # AC-7: Direct bucket ARN pass-through (bucketRef is schema-only; not wired into ACK spec).
    - name: ac7-bucket-arn-pass-through
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac7-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac7-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac7-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac7-cfg
                deletionPolicy: retain
                bucket: "arn:aws:s3:::ref-bucket"
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac7-fs
                namespace: s3filesfilesystem
              spec:
                bucket: "arn:aws:s3:::ref-bucket"

    # AC-8: importDataRules / expirationDataRules pass-through.
    # GAP: These fields are NOT present in the RGD schema (s3filesfilesystem.aws.kropath.run.yaml).
    # They cannot be set in the instance CR. This step creates a baseline FileSystem and
    # documents the gap. Update when the RGD is extended to include these fields.
    - name: ac8-import-expiration-rules-gap
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac8-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac8-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac8-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
                bucket: "arn:aws:s3:::my-bucket"
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac8-fs
                namespace: s3filesfilesystem
        - script:
            content: |
              # TODO: extend when RGD adds importDataRules/expirationDataRules.
              # For now verify the resource was created.
              NAME=$(kubectl get filesystems.s3files.services.k8s.aws ac8-fs -n s3filesfilesystem \
                -o jsonpath='{.metadata.name}' 2>/dev/null || echo "")
              if [ "$NAME" = "ac8-fs" ]; then
                echo "PASS: filesystem created (importDataRules/expirationDataRules gap noted)"
                exit 0
              else
                echo "FAIL: filesystem ac8-fs not found"
                exit 1
              fi

    # AC-9: prefix and policy pass-through.
    - name: ac9-prefix-and-policy-pass-through
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac9-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac9-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesFileSystem
              metadata:
                name: ac9-fs
                namespace: s3filesfilesystem
              spec:
                configRef: ac9-cfg
                deletionPolicy: retain
                bucket: "arn:aws:s3:::my-bucket"
                acceptBucketWarning: true
                roleARN: "arn:aws:iam::123456789012:role/s3files-role"
                prefix: "project-a/"
                policy: '{"Version":"2012-10-17"}'
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac9-fs
                namespace: s3filesfilesystem
              spec:
                prefix: "project-a/"
                policy: '{"Version":"2012-10-17"}'

    # AC-10: Standard metadata — managed-by label, deletion-policy annotation set on ACK child.
    # No naming status fields (naming exemption KRO-236).
    - name: ac10-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac10-cfg
                namespace: s3filesfilesystem
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac10-cfg -n s3filesfilesystem \
                --subresource=status --type=merge \
