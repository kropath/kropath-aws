# S3FilesMountTarget Chainsaw tests.
# Naming exempt (KRO-236): S3FilesMountTarget has no provider name field.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
#
# Mutual-exclusion implementation note:
#   fileSystemID vs fileSystemRef: both exist in the schema. The RGD template uses
#   schema.spec.fileSystemID directly; fileSystemRef is a schema-only field (no-op in
#   template). No mutualExclusionError ConfigMap is implemented — AC-8/AC-9 test observable
#   behavior (direct field wins).
#
#   securityGroupRefs: NOT a schema field. Applying with this key produces an API server
#   unknown-field validation error — AC-10 tests that rejection.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3filesmounttarget
spec:
  skipDelete: true
  namespace: s3filesmounttarget
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Basic creation — MountTarget created with fileSystemID, subnetID, and securityGroups.
    - name: ac1-happy-path-mount-target-created
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3filesmounttarget
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3filesmounttarget \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesMountTarget
              metadata:
                name: ac1-mt
                namespace: s3filesmounttarget
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                fileSystemID: fs-0123456789abcdef0
                subnetID: subnet-0123456789abcdef0
                securityGroups:
                  - sg-0123456789abcdef0
                  - sg-fedcba9876543210
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: MountTarget
              metadata:
                name: ac1-mt
                namespace: s3filesmounttarget
              spec:
                fileSystemID: fs-0123456789abcdef0
                subnetID: subnet-0123456789abcdef0
                securityGroups:
                  - sg-0123456789abcdef0
                  - sg-fedcba9876543210

    # AC-2: fileSystemID passthrough — direct fileSystemID value reaches ACK MountTarget spec.
    - name: ac2-filesystem-id-direct
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3filesmounttarget
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3filesmounttarget \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesMountTarget
              metadata:
                name: ac2-mt
                namespace: s3filesmounttarget
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                fileSystemID: fs-def456abcdef1234
                subnetID: subnet-0123456789abcdef0
                securityGroups:
                  - sg-0123456789abcdef0
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: MountTarget
              metadata:
                name: ac2-mt
                namespace: s3filesmounttarget
              spec:
                fileSystemID: fs-def456abcdef1234

    # AC-3: subnetID passthrough — direct subnetID value reaches ACK MountTarget spec.
