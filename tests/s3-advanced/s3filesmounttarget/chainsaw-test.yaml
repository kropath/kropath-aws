            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac8-cfg
                namespace: s3filesmounttarget
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
