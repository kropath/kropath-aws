        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesMountTarget
              metadata:
                name: ac4-mt
                namespace: s3filesmounttarget
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                fileSystemID: fs-0123456789abcdef0
                subnetID: subnet-0123456789abcdef0
                securityGroups:
                  - sg-bbb1111111111111b
                  - sg-ccc2222222222222c
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: MountTarget
              metadata:
                name: ac4-mt
                namespace: s3filesmounttarget
              spec:
                securityGroups:
                  - sg-bbb1111111111111b
                  - sg-ccc2222222222222c

    # AC-5: IP addressing — dualstack ipAddressType with ipv4Address and ipv6Address pass through.
    - name: ac5-ip-addressing-dualstack
      try:
        - apply:
