# aws-s3adv-01 Chainsaw tests — all 11 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3advancedconfig
spec:
  skipDelete: true
  namespace: s3advancedconfig
  steps:
    # AC-1: General policy CR is accepted (zero mandatory, non-zero defaults)
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: general-policy
                namespace: s3advancedconfig
              spec:
                defaults:
                  accessPointPublicAccessBlock:
                    blockPublicACLs: true
                    blockPublicPolicy: true
                    ignorePublicACLs: true
                    restrictPublicBuckets: true
                  namingTemplate: "{namespace}-{name}"

    # AC-2: PCI policy CR is accepted (mandatory KMS + VPC-only enforcement)
    - name: ac2-pci-policy-accepted
      try:
        - apply:
            file: 02-pci-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: pci-policy
                namespace: s3advancedconfig
              spec:
                mandatory:
                  tableBucketEncryption:
                    sseAlgorithm: aws:kms
                  vectorBucketEncryption:
                    sseType: aws:kms
                  vectorIndexEncryption:
                    sseType: aws:kms
                  accessPointPublicAccessBlock:
                    blockPublicACLs: true
                    blockPublicPolicy: true
                    ignorePublicACLs: true
                    restrictPublicBuckets: true
                  accessPointVpcOnly: true

    # AC-3: tableBucketEncryption defaults apply through effectiveConfig when mandatory is zero
    - name: ac3-table-encryption-defaults-flow
      try:
        - apply:
            file: 03-table-encryption-defaults.yaml
        - script:
            content: |
              kubectl patch s3advancedconfig table-encryption-defaults -n s3advancedconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"aws:kms","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: table-encryption-defaults
                namespace: s3advancedconfig
              status:
                effectiveConfig:
                  mandatory:
                    tableBucketEncryption:
                      sseAlgorithm: ""
                  defaults:
                    tableBucketEncryption:
                      sseAlgorithm: aws:kms

    # AC-4: mandatory tableBucketEncryption overrides defaults in effectiveConfig
    - name: ac4-mandatory-table-encryption-wins
      try:
        - apply:
            file: 04-table-encryption-mandatory.yaml
        - script:
            content: |
              kubectl patch s3advancedconfig table-encryption-mandatory -n s3advancedconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/mrk-test"},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: table-encryption-mandatory
                namespace: s3advancedconfig
              status:
                effectiveConfig:
                  mandatory:
                    tableBucketEncryption:
                      sseAlgorithm: aws:kms
                      kmsKeyARN: arn:aws:kms:us-east-1:123456789012:key/mrk-test

    # AC-5: vectorBucketEncryption and vectorIndexEncryption flow through effectiveConfig
    - name: ac5-vector-encryption-fields
      try:
        - apply:
            file: 05-vector-encryption.yaml
        - script:
            content: |
              kubectl patch s3advancedconfig vector-encryption -n s3advancedconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/vec-bucket-key"},"vectorIndexEncryption":{"sseType":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/vec-index-key"},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: vector-encryption
                namespace: s3advancedconfig
              status:
                effectiveConfig:
                  mandatory:
                    vectorBucketEncryption:
                      sseType: aws:kms
                      kmsKeyARN: arn:aws:kms:us-east-1:123456789012:key/vec-bucket-key
                    vectorIndexEncryption:
                      sseType: aws:kms
                      kmsKeyARN: arn:aws:kms:us-east-1:123456789012:key/vec-index-key

    # AC-6: filesEncryption kmsKeyID flows through effectiveConfig
    - name: ac6-files-encryption-kms-key-id
      try:
        - apply:
            file: 06-files-encryption.yaml
        - script:
            content: |
              kubectl patch s3advancedconfig files-encryption -n s3advancedconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":"mrk-files-test-key-id"},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: files-encryption
                namespace: s3advancedconfig
              status:
                effectiveConfig:
                  mandatory:
                    filesEncryption:
                      kmsKeyID: mrk-files-test-key-id

    # AC-7: namingTemplate propagates through effectiveConfig
    - name: ac7-naming-template-propagates
      try:
        - apply:
            file: 07-naming-template.yaml
        - script:
            content: |
              kubectl patch s3advancedconfig naming-template -n s3advancedconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: naming-template
                namespace: s3advancedconfig
              status:
                effectiveConfig:
                  mandatory:
                    namingTemplate: "{namespace}-{name}-{account_id}"
                  defaults:
                    namingTemplate: "{namespace}-{name}"

    # AC-8 (NEGATIVE): tableBucketEncryption in both mandatory and defaults is rejected
    - name: ac8-reject-table-encryption-both-tiers
      try:
        - apply:
            file: 08-invalid-table-encryption-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: S3AdvancedConfig
                check:
                  ($error != null): true

    # AC-9 (NEGATIVE): accessPointPublicAccessBlock in both mandatory and defaults is rejected
    - name: ac9-reject-public-access-block-both-tiers
      try:
        - apply:
            file: 09-invalid-public-access-block-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: S3AdvancedConfig
                check:
                  ($error != null): true

    # AC-10 (NEGATIVE): accessPointVpcOnly in both mandatory and defaults is rejected
    - name: ac10-reject-vpc-only-both-tiers
      try:
        - apply:
            file: 10-invalid-vpc-only-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: S3AdvancedConfig
                check:
                  ($error != null): true

    # AC-11: syncedLabels propagate through effectiveConfig
    - name: ac11-synced-labels-propagate
      try:
        - apply:
            file: 11-synced-labels.yaml
        - script:
            content: |
              kubectl patch s3advancedconfig synced-labels -n s3advancedconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"confidential"},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: synced-labels
                namespace: s3advancedconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: confidential
