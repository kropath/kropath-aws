# S3VectorsVectorBucket Chainsaw tests.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3vectorsvectorbucket
spec:
  skipDelete: true
  namespace: s3vectorsvectorbucket
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — VectorBucket created with default naming.
    # effectiveName = "{namespace}-{name}" → "s3vectorsvectorbucket-ac1-vb"
    - name: ac1-happy-path-vector-bucket-created
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3vectorsvectorbucket
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3vectorsvectorbucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsVectorBucket
              metadata:
                name: ac1-vb
                namespace: s3vectorsvectorbucket
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: VectorBucket
              metadata:
                name: ac1-vb
                namespace: s3vectorsvectorbucket
              spec:
                name: s3vectorsvectorbucket-ac1-vb
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsVectorBucket
              metadata:
                name: ac1-vb
                namespace: s3vectorsvectorbucket
              status:
                resourceName: s3vectorsvectorbucket-ac1-vb
                predictedArn: "arn:aws:s3vectors:us-east-1:123456789012:bucket/s3vectorsvectorbucket-ac1-vb"

    # AC-2: Mandatory vectorBucketEncryption overrides instance encryption.
    - name: ac2-mandatory-encryption-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3vectorsvectorbucket
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  vectorBucketEncryption:
                    sseType: "aws:kms"
                    kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-vec-key"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3vectorsvectorbucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/mandatory-vec-key"},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsVectorBucket
              metadata:
                name: ac2-vb
                namespace: s3vectorsvectorbucket
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                encryptionConfiguration:
                  sseType: "AES256"
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: VectorBucket
              metadata:
                name: ac2-vb
                namespace: s3vectorsvectorbucket
              spec:
                encryptionConfiguration:
                  sseType: aws:kms
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-vec-key"
