# S3ControlAccessPoint Chainsaw tests.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3controlaccesspoint
spec:
  skipDelete: true
  namespace: s3controlaccesspoint
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — AccessPoint created with defaults public access block governance.
    # Defaults enforce blockPublicACLs=true, ignorePublicACLs=true, etc.
    # Note: mandatory must NOT include accessPointPublicAccessBlock for defaults to apply;
    # the CEL uses has() to check presence, so any present-but-false value triggers mandatory.
    - name: ac1-happy-path-defaults-pab
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  accessPointPublicAccessBlock:
                    blockPublicACLs: true
                    ignorePublicACLs: true
                    blockPublicPolicy: true
                    restrictPublicBuckets: true
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":null,"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":true,"blockPublicPolicy":true,"ignorePublicACLs":true,"restrictPublicBuckets":true},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac1-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                accountID: "123456789012"
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac1-ap
                namespace: s3controlaccesspoint
              spec:
                name: s3controlaccesspoint-ac1-ap
                bucket: my-s3-bucket
                accountID: "123456789012"
                publicAccessBlockConfiguration:
                  blockPublicAcls: true
                  ignorePublicAcls: true
                  blockPublicPolicy: true
                  restrictPublicBuckets: true

    # AC-2: Mandatory PAB overrides instance spec and defaults.
    - name: ac2-mandatory-pab-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  accessPointPublicAccessBlock:
                    blockPublicACLs: true
                    ignorePublicACLs: true
                    blockPublicPolicy: true
                    restrictPublicBuckets: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":true,"blockPublicPolicy":true,"ignorePublicACLs":true,"restrictPublicBuckets":true},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac2-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                accountID: "123456789012"
                publicAccessBlockConfiguration:
                  blockPublicAcls: false
                  ignorePublicAcls: false
                  blockPublicPolicy: false
                  restrictPublicBuckets: false
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac2-ap
                namespace: s3controlaccesspoint
              spec:
                publicAccessBlockConfiguration:
                  blockPublicAcls: true
                  ignorePublicAcls: true
                  blockPublicPolicy: true
                  restrictPublicBuckets: true

    # AC-3: VPC configuration pass-through — vpcConfiguration.vpcID flows to ACK spec.
    - name: ac3-vpc-configuration
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac3-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac3-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac3-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                accountID: "123456789012"
                vpcConfiguration:
                  vpcID: "vpc-0123456789abcdef0"
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac3-ap
                namespace: s3controlaccesspoint
              spec:
                vpcConfiguration:
                  vpcID: "vpc-0123456789abcdef0"

    # AC-4: Boolean cascade — defaults PAB all true, instance sets no PAB config.
    # When mandatory.accessPointPublicAccessBlock is null and the instance omits
    # publicAccessBlockConfiguration (struct absent), the CEL cascade applies the defaults tier (all true).
    - name: ac4-boolean-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac4-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {}
                defaults:
                  accessPointPublicAccessBlock:
                    blockPublicACLs: true
                    ignorePublicACLs: true
                    blockPublicPolicy: true
                    restrictPublicBuckets: true
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac4-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":null,"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":true,"blockPublicPolicy":true,"ignorePublicACLs":true,"restrictPublicBuckets":true},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - script:
            content: |
              kubectl patch s3controlaccesspoint ac4-ap -n s3controlaccesspoint \
                --type=merge -p '{"spec":{"publicAccessBlockConfiguration":null}}' \
                2>/dev/null || true
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac4-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                accountID: "123456789012"
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac4-ap
                namespace: s3controlaccesspoint
              spec:
                publicAccessBlockConfiguration:
                  blockPublicAcls: true

    # AC-5: VPC from instance — mandatory.accessPointVpcOnly: false, instance supplies vpcID.
    # Verifies vpcConfiguration.vpcID flows through regardless of the governance VpcOnly flag.
    - name: ac5-vpc-instance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac5-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  accessPointVpcOnly: false
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac5-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":null,"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac5-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                accountID: "123456789012"
                vpcConfiguration:
                  vpcID: "vpc-12345"
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac5-ap
                namespace: s3controlaccesspoint
              spec:
                vpcConfiguration:
                  vpcID: "vpc-12345"

    # AC-6: Mandatory VPC-only governance flag plus instance-supplied VPC ID.
    # mandatory.accessPointVpcOnly: true enforces VPC-only access; instance provides the ID.
    - name: ac6-mandatory-vpc-with-id
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac6-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  accessPointVpcOnly: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac6-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":null,"accessPointVpcOnly":true,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac6-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                accountID: "123456789012"
                vpcConfiguration:
                  vpcID: "vpc-abcdef"
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac6-ap
                namespace: s3controlaccesspoint
              spec:
                vpcConfiguration:
                  vpcID: "vpc-abcdef"

    # AC-7: Cross-account — bucketAccountID in instance spec flows to ACK AccessPoint.
    # Tests cross-account bucket ownership: accountID owns the access point, bucketAccountID
    # owns the target bucket.
    - name: ac7-cross-account
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac7-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac7-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":null,"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac7-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac7-cfg
                deletionPolicy: retain
                bucket: other-bucket
                accountID: "123456789012"
                bucketAccountID: "987654321098"
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac7-ap
                namespace: s3controlaccesspoint
              spec:
                accountID: "123456789012"
                bucket: other-bucket
                bucketAccountID: "987654321098"

    # AC-8: Policy pass-through — spec.policy flows verbatim to ACK AccessPoint spec.policy.
    - name: ac8-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac8-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac8-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":null,"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac8-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                accountID: "123456789012"
                policy: '{"Version":"2012-10-17","Statement":[]}'
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac8-ap
                namespace: s3controlaccesspoint
        - script:
            content: |
              POLICY=$(kubectl get accesspoints.s3control.services.k8s.aws ac8-ap -n s3controlaccesspoint -o json \
                | jq -r '.spec.policy // ""')
              echo "Policy: $POLICY"
              echo "$POLICY" | jq -e '.Version == "2012-10-17"' || { echo "FAIL: policy Version mismatch"; exit 1; }
              echo "$POLICY" | jq -e '.Statement | length == 0' || { echo "FAIL: policy Statement not empty"; exit 1; }
              echo "PASS: policy pass-through verified"

    # AC-9: nameOverride — spec.nameOverride overrides the naming template for the cloud resource name.
    # status.resourceName and ACK AccessPoint spec.name must both equal the override value.
    - name: ac9-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac9-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac9-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":null,"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac9-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac9-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                accountID: "123456789012"
                nameOverride: "custom-ap"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac9-ap
                namespace: s3controlaccesspoint
              status:
                resourceName: "custom-ap"
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac9-ap
                namespace: s3controlaccesspoint
              spec:
                name: "custom-ap"

    # AC-10: Standard metadata — ACK AccessPoint carries the expected managed-by label,
    # deletion-policy annotation, and ownerReference back to the S3ControlAccessPoint CR.
    - name: ac10-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac10-cfg
                namespace: s3controlaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac10-cfg -n s3controlaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":null,"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3ControlAccessPoint
              metadata:
                name: ac10-ap
                namespace: s3controlaccesspoint
              spec:
                configRef: ac10-cfg
                deletionPolicy: retain
                bucket: my-s3-bucket
                accountID: "123456789012"
        - assert:
            resource:
              apiVersion: s3control.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac10-ap
                namespace: s3controlaccesspoint
                labels:
                  app.kubernetes.io/managed-by: kro
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              OWNER_KIND=$(kubectl get accesspoints.s3control.services.k8s.aws ac10-ap -n s3controlaccesspoint -o json \
                | jq -r '.metadata.ownerReferences[0].kind // ""')
              if [ "$OWNER_KIND" != "S3ControlAccessPoint" ]; then
