# S3TablesTable Chainsaw tests.
# Naming uses underscore separator: default template "{namespace}_{name}" with
# .replace("-","_").lowerAscii() — dashes in namespace/name become underscores.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3tablestable
spec:
  skipDelete: true
  namespace: s3tablestable
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — Table created with underscore naming.
    # namespace="s3tablestable", name="ac1-table"
    # effectiveName = "s3tablestable_{namespace}_{name}" →
    #   "s3tablestable_ac1-table" → .replace("-","_") → "s3tablestable_ac1_table"
    # (template is "{namespace}_{name}" so: "s3tablestable_ac1-table" → "s3tablestable_ac1_table")
    - name: ac1-happy-path-table-created
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3tablestable
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}_{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3tablestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTable
              metadata:
                name: ac1-table
                namespace: s3tablestable
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                format: ICEBERG
                tableBucketARN: "arn:aws:s3tables:us-east-1:123456789012:bucket/my-bucket"
                namespace: my-namespace
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac1-table
                namespace: s3tablestable
              spec:
                name: s3tablestable_ac1_table
                format: ICEBERG
                tableBucketARN: "arn:aws:s3tables:us-east-1:123456789012:bucket/my-bucket"
                namespace: my-namespace

    # AC-2: Mandatory encryption overrides instance spec for Table.
    - name: ac2-mandatory-encryption-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3tablestable
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  tableBucketEncryption:
                    sseAlgorithm: "aws:kms"
                    kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-key"
                defaults:
                  namingTemplate: "{namespace}_{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3tablestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/mandatory-key"},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTable
              metadata:
                name: ac2-table
                namespace: s3tablestable
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                format: ICEBERG
                tableBucketARN: "arn:aws:s3tables:us-east-1:123456789012:bucket/my-bucket"
                namespace: my-namespace
                encryptionConfiguration:
                  sseAlgorithm: "AES256"
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac2-table
                namespace: s3tablestable
              spec:
                encryptionConfiguration:
                  sseAlgorithm: aws:kms
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-key"
