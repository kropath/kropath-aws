    # AC-11: format defaults to ICEBERG when not explicitly set.
    # NOTE: The S3TablesTable RGD declares `format: string | default=ICEBERG`. A "missing format"
    # scenario cannot trigger a validation error — the default is always applied. No
    # validationError ConfigMap is implemented in the RGD for this field.
