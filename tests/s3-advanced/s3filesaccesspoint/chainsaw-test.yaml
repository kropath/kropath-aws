# S3FilesAccessPoint Chainsaw tests.
# Naming exempt (KRO-236): S3FilesAccessPoint has no provider name field.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3filesaccesspoint
spec:
  skipDelete: true
  namespace: s3filesaccesspoint
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — AccessPoint created with posixUser and rootDirectory.
    - name: ac1-happy-path-accesspoint-with-posix-user
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac1-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                fileSystemID: fs-0123456789abcdef0
                posixUser:
                  uid: 1000
                  gid: 1000
                rootDirectory:
                  path: /data
                  creationPermissions:
                    ownerUID: 1000
                    ownerGID: 1000
                    permissions: "755"
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac1-ap
                namespace: s3filesaccesspoint
              spec:
                fileSystemID: fs-0123456789abcdef0
                posixUser:
                  uid: 1000
                  gid: 1000
                rootDirectory:
                  path: /data

    # AC-2: secondaryGIDs array passes through correctly.
    - name: ac2-secondary-gids-pass-through
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac2-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                fileSystemID: fs-0123456789abcdef0
                posixUser:
                  uid: 1000
                  gid: 1000
                  secondaryGIDs:
                    - 2000
                    - 3000
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac2-ap
                namespace: s3filesaccesspoint
              spec:
                posixUser:
                  uid: 1000
                  gid: 1000
                  secondaryGIDs:
                    - 2000
                    - 3000
