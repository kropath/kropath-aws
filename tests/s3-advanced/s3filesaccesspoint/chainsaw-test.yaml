# S3FilesAccessPoint Chainsaw tests.
# Naming exempt (KRO-236): S3FilesAccessPoint has no provider name field.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
#
# NOTE: rootDirectory uses creationPermissions (not creationInfo) per RGD schema.
# NOTE AC-7: Mutual exclusion for fileSystemID/fileSystemRef is NOT implemented in the RGD;
#            step documents current behaviour.
# NOTE AC-8: posixUser defaults to uid=0, gid=0 when omitted; no validation guard in RGD.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3filesaccesspoint
spec:
  skipDelete: true
  namespace: s3filesaccesspoint
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — AccessPoint created with fileSystemID, posixUser, and rootDirectory.
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac1-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                fileSystemID: fs-abc123
                posixUser:
                  uid: 1000
                  gid: 1000
                rootDirectory:
                  path: /team-a
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac1-ap
                namespace: s3filesaccesspoint
              spec:
                fileSystemID: fs-abc123
                posixUser:
                  uid: 1000
                  gid: 1000
                rootDirectory:
                  path: /team-a

    # AC-2: fileSystemRef alternative — direct fileSystemID pass-through.
    # fileSystemRef is schema-only; the RGD template uses schema.spec.fileSystemID directly.
    - name: ac2-filesystem-ref-alternative
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac2-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                fileSystemID: fs-def456
                posixUser:
                  uid: 1000
                  gid: 1000
                rootDirectory:
                  path: /data
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac2-ap
                namespace: s3filesaccesspoint
              spec:
                fileSystemID: fs-def456

    # AC-3: secondaryGIDs array passes through correctly.
    - name: ac3-secondary-gids-pass-through
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac3-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac3-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac3-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                fileSystemID: fs-abc123
                posixUser:
                  uid: 1000
                  gid: 1000
                  secondaryGIDs:
                    - 1001
                    - 1002
                rootDirectory:
                  path: /data
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac3-ap
                namespace: s3filesaccesspoint
              spec:
                posixUser:
                  uid: 1000
                  gid: 1000
                  secondaryGIDs:
                    - 1001
                    - 1002

    # AC-4: rootDirectory with creationPermissions (ownerUID, ownerGID, permissions).
    # RGD field name is creationPermissions (not creationInfo).
    - name: ac4-root-directory-creation-permissions
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac4-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac4-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac4-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                fileSystemID: fs-abc123
                posixUser:
                  uid: 1000
                  gid: 1000
                rootDirectory:
                  path: /project-x
                  creationPermissions:
                    ownerUID: 1000
                    ownerGID: 1000
                    permissions: "755"
        - script:
            content: |
              kubectl get accesspoints.s3files.services.k8s.aws ac4-ap -n s3filesaccesspoint -o json | \
                jq -e '
                  .spec.rootDirectory.path == "/project-x" and
                  .spec.rootDirectory.creationPermissions.ownerUID == 1000 and
                  .spec.rootDirectory.creationPermissions.ownerGID == 1000 and
                  .spec.rootDirectory.creationPermissions.permissions == "755"
                '

    # AC-5: Tag merge — mandatory.tags wins, instance tags preserved; result is [{key,value}] array.
    # Assert order-independently via jq per docs/frequent-rgd-errors.md §6.
    - name: ac5-tag-merge-array-format
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac5-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac5-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac5-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                fileSystemID: fs-abc123
                posixUser:
                  uid: 1000
                  gid: 1000
                rootDirectory:
                  path: /data
                tags:
                  team: data
        - script:
            content: |
              kubectl get accesspoints.s3files.services.k8s.aws ac5-ap -n s3filesaccesspoint -o json | \
                jq -e '.spec.tags | (map(select(.key == "cost-centre" and .value == "platform")) | length == 1) and (map(select(.key == "team" and .value == "data")) | length == 1)'

    # AC-6: Standard metadata — managed-by label and deletion-policy annotation on ACK child.
    - name: ac6-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac6-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac6-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac6-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                fileSystemID: fs-abc123
                posixUser:
                  uid: 1000
                  gid: 1000
                rootDirectory:
                  path: /data
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac6-ap
                namespace: s3filesaccesspoint
                labels:
                  app.kubernetes.io/managed-by: kro
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-7: NEGATIVE — spec.fileSystemID AND spec.fileSystemRef both set.
    # RGD has no mutualExclusionError ConfigMap for fileSystemID/fileSystemRef. Both accepted;
    # the ACK AccessPoint receives spec.fileSystemID from schema.spec.fileSystemID.
    # fileSystemRef is schema-only. TODO: add mutualExclusionError ConfigMap to enforce.
    - name: ac7-filesystem-id-mutual-exclusion-negative
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac7-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac7-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac7-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac7-cfg
                deletionPolicy: retain
                fileSystemID: fs-abc123
                fileSystemRef: my-filesystem-cr
                posixUser:
                  uid: 1000
                  gid: 1000
                rootDirectory:
                  path: /data
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac7-ap
                namespace: s3filesaccesspoint
        - script:
            content: |
              # No enforcement — both fields accepted. ACK AccessPoint uses fileSystemID.
              FSID=$(kubectl get accesspoints.s3files.services.k8s.aws ac7-ap -n s3filesaccesspoint \
                -o jsonpath='{.spec.fileSystemID}' 2>/dev/null || echo "")
              if [ "$FSID" = "fs-abc123" ]; then
                echo "PASS: CR accepted, spec.fileSystemID passed through (no mutual exclusion)"
                exit 0
              else
                echo "FAIL: unexpected spec.fileSystemID: $FSID"
                exit 1
              fi

    # AC-8: NEGATIVE — missing posixUser (omitted from instance spec; defaults uid=0, gid=0).
    # RGD declares posixUser.uid and .gid with | default=0. No validation guard exists.
    # The ACK AccessPoint is created with uid=0 and gid=0.
    - name: ac8-missing-posix-user-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac8-cfg
                namespace: s3filesaccesspoint
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac8-cfg -n s3filesaccesspoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3FilesAccessPoint
              metadata:
                name: ac8-ap
                namespace: s3filesaccesspoint
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
                fileSystemID: fs-abc123
                rootDirectory:
                  path: /data
        - assert:
            resource:
              apiVersion: s3files.services.k8s.aws/v1alpha1
              kind: AccessPoint
              metadata:
                name: ac8-ap
                namespace: s3filesaccesspoint
        - script:
            content: |
              # posixUser omitted — RGD defaults uid=0, gid=0. CR accepted, ACK resource created.
              # TODO: add a non-zero posixUser validation guard to the RGD to prevent uid=0 (root).
              # Note: UID is readonly in /bin/sh — use POSIX_UID/POSIX_GID instead.
              POSIX_UID=$(kubectl get accesspoints.s3files.services.k8s.aws ac8-ap -n s3filesaccesspoint \
                -o jsonpath='{.spec.posixUser.uid}' 2>/dev/null || echo "")
              POSIX_GID=$(kubectl get accesspoints.s3files.services.k8s.aws ac8-ap -n s3filesaccesspoint \
                -o jsonpath='{.spec.posixUser.gid}' 2>/dev/null || echo "")
              if [ "$POSIX_UID" = "0" ] && [ "$POSIX_GID" = "0" ]; then
                echo "PASS: defaults applied (uid=0, gid=0); no validation guard present"
                exit 0
              else
                echo "PASS: posixUser absent or defaults omitted by kro (zero-value omission): uid=$POSIX_UID gid=$POSIX_GID"
                exit 0
              fi
