# S3VectorsIndex Chainsaw tests.
# predictedArn references naming.data.vectorBucketName (stored in naming ConfigMap)
# to avoid schema.spec.* in status expressions.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3vectorsindex
spec:
  skipDelete: true
  namespace: s3vectorsindex
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — Index created with correct vectorBucketName pass-through.
    # predictedArn includes vectorBucketName from naming ConfigMap.
    - name: ac1-happy-path-index-created
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac1-idx
                namespace: s3vectorsindex
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                vectorBucketName: my-vector-bucket
                dataType: float32
                dimension: 1536
                distanceMetric: cosine
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac1-idx
                namespace: s3vectorsindex
              spec:
                name: s3vectorsindex-ac1-idx
                vectorBucketName: my-vector-bucket
                dataType: float32
                dimension: 1536
                distanceMetric: cosine
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac1-idx
                namespace: s3vectorsindex
              status:
                resourceName: s3vectorsindex-ac1-idx
                predictedArn: "arn:aws:s3vectors:us-east-1:123456789012:vectorbucket/my-vector-bucket/index/s3vectorsindex-ac1-idx"

    # AC-2: Mandatory vectorIndexEncryption overrides instance encryption.
    - name: ac2-mandatory-encryption-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  vectorIndexEncryption:
                    sseType: "aws:kms"
                    kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-idx-key"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/mandatory-idx-key"},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac2-idx
                namespace: s3vectorsindex
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                vectorBucketName: my-vector-bucket
                dataType: float32
                dimension: 1536
                distanceMetric: cosine
                encryptionConfiguration:
                  sseType: "AES256"
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/instance-key"
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac2-idx
                namespace: s3vectorsindex
              spec:
                encryptionConfiguration:
                  sseType: aws:kms
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-idx-key"
