# S3VectorsIndex Chainsaw tests — 16 acceptance criteria.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# predictedArn uses naming.data.vectorBucketName (stored in naming ConfigMap) to avoid
# schema.spec.* references in status expressions.
# Advisory ConfigMaps (dataTypeError, dimensionError, distanceMetricError) are asserted in
# negative scenarios AC-12, AC-13, AC-14.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3vectorsindex
spec:
  skipDelete: true
  namespace: s3vectorsindex
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ─── AC-1: Happy path — basic creation with required fields ────────────────
    # Verifies spec pass-through, effectiveName from naming template,
    # predictedArn substring, and empty validationError.
    - name: ac1-happy-path-index-created
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac1-index
                namespace: s3vectorsindex
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                vectorBucketName: ml-team-embeddings
                dataType: float32
                dimension: 768
                distanceMetric: cosine
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac1-index
                namespace: s3vectorsindex
              spec:
                name: s3vectorsindex-ac1-index
                vectorBucketName: ml-team-embeddings
                dataType: float32
                dimension: 768
                distanceMetric: cosine
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac1-index
                namespace: s3vectorsindex
              status:
                resourceName: s3vectorsindex-ac1-index
        - script:
            content: |
              ARN=$(kubectl get s3vectorsindex ac1-index -n s3vectorsindex \
                -o jsonpath='{.status.predictedArn}' 2>/dev/null || echo "")
              echo "$ARN" | grep -q "vectorbucket/ml-team-embeddings/index/s3vectorsindex-ac1-index" \
                && echo "PASS" \
                || (echo "FAIL: predictedArn substring not found. Got: $ARN" && exit 1)
        - script:
            content: |
              VE=$(kubectl get s3vectorsindex ac1-index -n s3vectorsindex \
                -o jsonpath='{.status.validationError}' 2>/dev/null || echo "")
              [ -z "$VE" ] && echo "PASS" \
                || (echo "FAIL: expected empty validationError, got: $VE" && exit 1)

    # ─── AC-2: Defaults encryption flows through ────────────────────────────────
    # Encryption from defaults tier reaches ACK Index when instance sets none.
    - name: ac2-defaults-encryption
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  vectorIndexEncryption:
                    sseType: "aws:kms"
                    kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/default"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/default"},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac2-index
                namespace: s3vectorsindex
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                vectorBucketName: ml-team-embeddings
                dataType: float32
                dimension: 128
                distanceMetric: cosine
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac2-index
                namespace: s3vectorsindex
              spec:
                encryptionConfiguration:
                  sseType: "aws:kms"
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/default"

    # ─── AC-3: Mandatory encryption overrides instance ──────────────────────────
    # Mandatory tier wins regardless of what the instance sets.
    - name: ac3-mandatory-encryption-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac3-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  vectorIndexEncryption:
                    sseType: "aws:kms"
                    kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/pci"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac3-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/pci"},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac3-index
                namespace: s3vectorsindex
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                vectorBucketName: ml-team-embeddings
                dataType: float32
                dimension: 128
                distanceMetric: cosine
                encryptionConfiguration:
                  sseType: ""
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac3-index
                namespace: s3vectorsindex
              spec:
                encryptionConfiguration:
                  sseType: "aws:kms"
        - script:
            content: |
              KEY=$(kubectl get index ac3-index -n s3vectorsindex \
                -o jsonpath='{.spec.encryptionConfiguration.kmsKeyARN}' 2>/dev/null || echo "")
              echo "$KEY" | grep -q ":key/pci" \
                && echo "PASS" \
                || (echo "FAIL: expected mandatory key ending in /key/pci, got: $KEY" && exit 1)

    # ─── AC-4: Instance encryption overrides defaults ───────────────────────────
    # Instance kmsKeyARN wins over defaults tier when mandatory is empty.
    - name: ac4-instance-encryption-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac4-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  vectorIndexEncryption:
                    kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/default"
        - script:
            content: |
              kubectl patch s3advancedconfig ac4-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/default"},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac4-index
                namespace: s3vectorsindex
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                vectorBucketName: ml-team-embeddings
                dataType: float32
                dimension: 128
                distanceMetric: cosine
                encryptionConfiguration:
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/custom"
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac4-index
                namespace: s3vectorsindex
              spec:
                encryptionConfiguration:
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/custom"

    # ─── AC-5: Mandatory encryption applied (update scenario) ───────────────────
    # Mandatory vectorIndexEncryption enforced; instance cannot override sseType.
    - name: ac5-encryption-update
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac5-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  vectorIndexEncryption:
                    sseType: "aws:kms"
                    kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/updated"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac5-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/updated"},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac5-index
                namespace: s3vectorsindex
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                vectorBucketName: ml-team-embeddings
                dataType: float32
                dimension: 128
                distanceMetric: cosine
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac5-index
                namespace: s3vectorsindex
              spec:
                encryptionConfiguration:
                  sseType: "aws:kms"

    # ─── AC-6: No encryption anywhere — fields absent ───────────────────────────
    # When no encryption is configured in any tier or on the instance, both fields
    # resolve to empty string and may be omitted from the ACK Index spec.
    - name: ac6-no-encryption
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac6-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac6-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac6-index
                namespace: s3vectorsindex
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                vectorBucketName: ml-team-embeddings
                dataType: float32
                dimension: 128
                distanceMetric: cosine
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac6-index
                namespace: s3vectorsindex
        - script:
            content: |
              RESULT=$(kubectl get index ac6-index -n s3vectorsindex -o json | \
                jq '((.spec.encryptionConfiguration.sseType // "") == "") and
                    ((.spec.encryptionConfiguration.kmsKeyARN // "") == "")')
              [ "$RESULT" = "true" ] && echo "PASS" \
                || (echo "FAIL: expected empty encryptionConfiguration. jq result: $RESULT" && exit 1)

    # ─── AC-7: metadataConfiguration.nonFilterableMetadataKeys pass-through ─────
    - name: ac7-metadata-configuration
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac7-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac7-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac7-index
                namespace: s3vectorsindex
              spec:
                configRef: ac7-cfg
                deletionPolicy: retain
                vectorBucketName: ml-team-embeddings
                dataType: float32
                dimension: 256
                distanceMetric: cosine
                metadataConfiguration:
                  nonFilterableMetadataKeys:
                    - category
                    - price
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac7-index
                namespace: s3vectorsindex
        - script:
            content: |
              COUNT=$(kubectl get index ac7-index -n s3vectorsindex -o json | \
                jq '.spec.metadataConfiguration.nonFilterableMetadataKeys | length')
              [ "$COUNT" = "2" ] && echo "PASS" \
                || (echo "FAIL: expected 2 nonFilterableMetadataKeys, got: $COUNT" && exit 1)

    # ─── AC-8: vectorBucketName pass-through ────────────────────────────────────
    - name: ac8-vector-bucket-name-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac8-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac8-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac8-index
                namespace: s3vectorsindex
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
                vectorBucketName: search-products-bucket
                dataType: float32
                dimension: 256
                distanceMetric: cosine
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac8-index
                namespace: s3vectorsindex
              spec:
                vectorBucketName: search-products-bucket

    # ─── AC-9: Tag merge — mandatory + instance tags both present ───────────────
    # Tags use map[string]string format (S3Vectors). Mandatory wins on collision.
    # Order is non-deterministic; asserted via jq has() checks.
    - name: ac9-tag-merge-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac9-cfg
                namespace: s3vectorsindex
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac9-cfg -n s3vectorsindex \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3VectorsIndex
              metadata:
                name: ac9-index
                namespace: s3vectorsindex
              spec:
                configRef: ac9-cfg
                deletionPolicy: retain
                vectorBucketName: ml-team-embeddings
                dataType: float32
                dimension: 256
                distanceMetric: cosine
                tags:
                  model: bert
        - assert:
            resource:
              apiVersion: s3vectors.services.k8s.aws/v1alpha1
              kind: Index
              metadata:
                name: ac9-index
                namespace: s3vectorsindex
        - script:
            content: |
              RESULT=$(kubectl get index ac9-index -n s3vectorsindex -o json | \
                jq '.spec.tags | (has("cost-centre")) and (has("model"))')
              [ "$RESULT" = "true" ] && echo "PASS" \
                || (echo "FAIL: expected both cost-centre and model tags present. tags: $(kubectl get index ac9-index -n s3vectorsindex -o jsonpath='{.spec.tags}')" && exit 1)

