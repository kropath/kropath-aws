# S3TablesNamespace Chainsaw tests.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3tablesnamespace
spec:
  skipDelete: true
  namespace: s3tablesnamespace
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — Namespace created with tableBucketARN passed through.
    # effectiveName = "{namespace}-{name}" → "s3tablesnamespace-ac1-ns"
    - name: ac1-happy-path-namespace-created
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3tablesnamespace
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3tablesnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesNamespace
              metadata:
                name: ac1-ns
                namespace: s3tablesnamespace
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                tableBucketARN: "arn:aws:s3tables:us-east-1:123456789012:bucket/my-table-bucket"
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: Namespace
              metadata:
                name: ac1-ns
                namespace: s3tablesnamespace
              spec:
                name: s3tablesnamespace-ac1-ns
                tableBucketARN: "arn:aws:s3tables:us-east-1:123456789012:bucket/my-table-bucket"

    # AC-2: nameOverride sets cloud resource name directly.
    - name: ac2-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3tablesnamespace
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3tablesnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesNamespace
              metadata:
                name: ac2-ns
                namespace: s3tablesnamespace
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                nameOverride: "my-custom-namespace"
                tableBucketARN: "arn:aws:s3tables:us-east-1:123456789012:bucket/my-table-bucket"
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: Namespace
              metadata:
                name: ac2-ns
                namespace: s3tablesnamespace
              spec:
                name: my-custom-namespace
