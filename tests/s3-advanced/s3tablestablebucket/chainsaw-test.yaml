# S3TablesTableBucket Chainsaw tests.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s3tablestablebucket
spec:
  skipDelete: true
  namespace: s3tablestablebucket
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Happy path — TableBucket created with default naming template.
    # effectiveName = "{namespace}-{name}" → "s3tablestablebucket-ac1-bucket"
    - name: ac1-happy-path-default-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac1-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac1-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac1-bucket
                namespace: s3tablestablebucket
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: TableBucket
              metadata:
                name: ac1-bucket
                namespace: s3tablestablebucket
              spec:
                name: s3tablestablebucket-ac1-bucket
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac1-bucket
                namespace: s3tablestablebucket
              status:
                resourceName: s3tablestablebucket-ac1-bucket
                namingStatus: valid
                predictedArn: "arn:aws:s3tables:us-east-1:123456789012:bucket/s3tablestablebucket-ac1-bucket"

    # AC-2: Mandatory encryption overrides instance encryption.
    # mandatory.tableBucketEncryption.sseAlgorithm=aws:kms overrides instance spec.
    - name: ac2-mandatory-encryption-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac2-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  tableBucketEncryption:
                    sseAlgorithm: "aws:kms"
                    kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-key"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac2-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/mandatory-key"},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac2-bucket
                namespace: s3tablestablebucket
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                encryptionConfiguration:
                  sseAlgorithm: "AES256"
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: TableBucket
              metadata:
                name: ac2-bucket
                namespace: s3tablestablebucket
              spec:
                encryptionConfiguration:
                  sseAlgorithm: aws:kms
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-key"

    # AC-3: nameOverride sets effectiveName directly.
    - name: ac3-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac3-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac3-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac3-bucket
                namespace: s3tablestablebucket
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                nameOverride: "my-custom-bucket-name"
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: TableBucket
              metadata:
                name: ac3-bucket
                namespace: s3tablestablebucket
              spec:
                name: my-custom-bucket-name
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac3-bucket
                namespace: s3tablestablebucket
              status:
                resourceName: my-custom-bucket-name

    # AC-4: defaults encryption with instance override.
    # defaults.tableBucketEncryption.kmsKeyARN="...key/default" set, but instance
    # spec.encryptionConfiguration.kmsKeyARN overrides it.
    # Priority: mandatory > instance > defaults — instance key wins.
    - name: ac4-instance-encryption-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac4-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {}
                defaults:
                  tableBucketEncryption:
                    sseAlgorithm: "aws:kms"
                    kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/default"
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac4-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"aws:kms","kmsKeyARN":"arn:aws:kms:us-east-1:123456789012:key/default"},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac4-bucket
                namespace: s3tablestablebucket
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                encryptionConfiguration:
                  sseAlgorithm: "aws:kms"
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/custom"
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: TableBucket
              metadata:
                name: ac4-bucket
                namespace: s3tablestablebucket
              spec:
                encryptionConfiguration:
                  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/custom"

    # AC-5: maintenance configuration pass-through.
    # Instance spec.maintenanceConfiguration is forwarded verbatim to the ACK TableBucket.
    - name: ac5-maintenance-config
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac5-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac5-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac5-bucket
                namespace: s3tablestablebucket
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                maintenanceConfiguration:
                  icebergUnreferencedFileRemoval:
                    status: "enabled"
                    settings:
                      unreferencedDays: 7
                      nonCurrentDays: 3
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: TableBucket
              metadata:
                name: ac5-bucket
                namespace: s3tablestablebucket
              spec:
                maintenanceConfiguration:
                  icebergUnreferencedFileRemoval:
                    status: "enabled"
                    settings:
                      unreferencedDays: 7
                      nonCurrentDays: 3

    # AC-6: storage class configuration pass-through.
    # Instance spec.storageClassConfiguration.storageClass: "STANDARD_IA" is forwarded verbatim.
    - name: ac6-storage-class
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac6-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac6-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac6-bucket
                namespace: s3tablestablebucket
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                storageClassConfiguration:
                  storageClass: "STANDARD_IA"
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: TableBucket
              metadata:
                name: ac6-bucket
                namespace: s3tablestablebucket
              spec:
                storageClassConfiguration:
                  storageClass: "STANDARD_IA"

    # AC-7: tag merge — mandatory tags win on conflict; all tiers' tags present.
    # mandatory.tags: {cost-centre: platform}, instance spec.tags: {app: analytics}.
    # Both must appear on the ACK TableBucket; jq used for order-independent verification.
    - name: ac7-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac7-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac7-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac7-bucket
                namespace: s3tablestablebucket
              spec:
                configRef: ac7-cfg
                deletionPolicy: retain
                tags:
                  app: analytics
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: TableBucket
              metadata:
                name: ac7-bucket
                namespace: s3tablestablebucket
        - script:
            content: |
              kubectl get tablebucket ac7-bucket -n s3tablestablebucket -o json | jq -e '
                .spec.tags | to_entries |
                (map(select(.key == "cost-centre" and .value == "platform")) | length == 1) and
                (map(select(.key == "app" and .value == "analytics")) | length == 1)
              '

    # AC-8: defaults naming template expansion.
    # defaults.namingTemplate: "{namespace}-{name}", instance name=ac8-bucket in namespace s3tablestablebucket.
    # Expected effectiveName: "s3tablestablebucket-ac8-bucket".
    - name: ac8-default-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac8-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac8-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac8-bucket
                namespace: s3tablestablebucket
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: TableBucket
              metadata:
                name: ac8-bucket
                namespace: s3tablestablebucket
              spec:
                name: s3tablestablebucket-ac8-bucket
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac8-bucket
                namespace: s3tablestablebucket
              status:
                resourceName: s3tablestablebucket-ac8-bucket

    # AC-10: mandatory naming template takes precedence over defaults.
    # mandatory.namingTemplate: "corp-{namespace}-{name}" wins over defaults "{namespace}-{name}".
    # Expected effectiveName: "corp-s3tablestablebucket-ac10-bucket".
    - name: ac10-mandatory-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac10-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  namingTemplate: "corp-{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac10-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
                name: ac10-bucket
                namespace: s3tablestablebucket
              spec:
                configRef: ac10-cfg
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: s3tables.services.k8s.aws/v1alpha1
              kind: TableBucket
              metadata:
                name: ac10-bucket
                namespace: s3tablestablebucket
              spec:
                name: corp-s3tablestablebucket-ac10-bucket

    # AC-11: bucket policy pass-through.
    # Instance spec.policy JSON string is forwarded verbatim to ACK TableBucket spec.policy.
    - name: ac11-bucket-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3AdvancedConfig
              metadata:
                name: ac11-cfg
                namespace: s3tablestablebucket
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch s3advancedconfig ac11-cfg -n s3tablestablebucket \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tableBucketEncryption":{"sseAlgorithm":"","kmsKeyARN":""},"vectorBucketEncryption":{"sseType":"","kmsKeyARN":""},"vectorIndexEncryption":{"sseType":"","kmsKeyARN":""},"filesEncryption":{"kmsKeyID":""},"accessPointPublicAccessBlock":{"blockPublicACLs":false,"blockPublicPolicy":false,"ignorePublicACLs":false,"restrictPublicBuckets":false},"accessPointVpcOnly":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: S3TablesTableBucket
              metadata:
