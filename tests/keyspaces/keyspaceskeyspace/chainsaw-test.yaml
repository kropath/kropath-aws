    # ──────────────────────────────────────────────────────────────────────────
    # AC-14 + AC-15: replicationSpecification fields are immutable at ACK CRD
    #                level. Verify the ACK CRD has the immutability rule.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac14-ac15-replicationspec-immutability
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac14-cfg
                namespace: keyspaceskeyspace
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}_{name}"
        - script:
            content: |
              kubectl patch keyspacesconfigs.aws.kropath.run ac14-cfg -n keyspaceskeyspace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"replicationStrategy":"","throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"replicationStrategy":"SINGLE_REGION","throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesKeyspace
              metadata:
                name: ac14-keyspace
                namespace: keyspaceskeyspace
              spec:
                configRef: ac14-cfg
                replicationStrategy: SINGLE_REGION
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Keyspace
              metadata:
                name: ac14-keyspace
                namespace: keyspaceskeyspace
              spec:
                replicationSpecification:
                  replicationStrategy: SINGLE_REGION
        - script:
            content: |
              # Verify immutability rule is present on the ACK CRD
              IMMUTABLE=$(kubectl get crd keyspaces.keyspaces.services.k8s.aws -o json \
                | jq '[.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.replicationSpecification."x-kubernetes-validations"[]?.rule // empty] | map(test("self == oldSelf")) | any')
              echo "replicationSpecification has immutability rule: $IMMUTABLE"
              # If the CRD carries the immutability rule, try to mutate and verify rejection
              if [ "$IMMUTABLE" = "true" ]; then
                ERROR=$(kubectl patch keyspaces.keyspaces.services.k8s.aws ac14-keyspace \
                  -n keyspaceskeyspace --type=merge \
                  -p '{"spec":{"replicationSpecification":{"replicationStrategy":"MULTI_REGION"}}}' 2>&1 || true)
                echo "$ERROR" | grep -qi "immutable\|forbidden\|invalid\|cannot" \
                  || (echo "Expected immutability rejection, got: $ERROR" && exit 1)
                echo "Immutability enforced at CRD level — OK"
              else
                echo "ACK CRD version does not declare immutability rule — enforcement deferred to AWS API"
              fi

