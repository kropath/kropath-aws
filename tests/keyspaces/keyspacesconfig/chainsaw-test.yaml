# aws-keyspaces-01 Chainsaw tests — all 13 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keyspacesconfig
spec:
  skipDelete: true
  namespace: keyspacesconfig
  steps:
    - name: ac1-crd-install
      try:
        - apply:
            file: 00-keyspacesconfig-namespace.yaml
        - script:
            content: |
              kubectl get crd keyspacesconfigs.aws.kropath.run -o jsonpath='{.spec.names.kind}' | grep -q 'KeyspacesConfig'

    - name: ac2-profile-general-policy
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: general-policy
                namespace: keyspacesconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  replicationStrategy: "SINGLE_REGION"
                  throughputMode: "PAY_PER_REQUEST"
                  encryptionType: "AWS_OWNED_KMS_KEY"
                  pointInTimeRecovery: false
                  ttlEnabled: false
                  namingTemplate: "{namespace}_{name}"

    - name: ac3-profile-compliance
      try:
        - apply:
            file: 02-compliance.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: compliance
                namespace: keyspacesconfig
                labels:
                  aws.kropath.run/resource-name: compliance
              spec:
                mandatory:
                  encryptionType: "CUSTOMER_MANAGED_KMS_KEY"
                  pointInTimeRecovery: true
                defaults:
                  replicationStrategy: "SINGLE_REGION"
                  throughputMode: "PAY_PER_REQUEST"
                  ttlEnabled: false
                  namingTemplate: "{namespace}_{name}"

    - name: ac4-profile-high-availability
      try:
        - apply:
            file: 03-high-availability.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: high-availability
                namespace: keyspacesconfig
                labels:
                  aws.kropath.run/resource-name: high-availability
              spec:
                mandatory:
                  replicationStrategy: "MULTI_REGION"
                  pointInTimeRecovery: true
                defaults:
                  throughputMode: "PAY_PER_REQUEST"
                  encryptionType: "AWS_OWNED_KMS_KEY"
                  ttlEnabled: false
                  namingTemplate: "{namespace}_{name}"

    - name: ac5-reject-both-tiers-replicationStrategy
      try:
        - apply:
            file: 04-invalid-dual-tier-replicationStrategy.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: KeyspacesConfig
                check:
                  ($error != null): true

    - name: ac6-reject-both-tiers-throughputMode
      try:
        - apply:
            file: 05-invalid-dual-tier-throughputMode.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: KeyspacesConfig
                check:
                  ($error != null): true

    - name: ac7-reject-both-tiers-encryptionType
      try:
        - apply:
            file: 06-invalid-dual-tier-encryptionType.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: KeyspacesConfig
                check:
                  ($error != null): true

    - name: ac8-reject-both-tiers-pointInTimeRecovery
      try:
        - apply:
            file: 07-invalid-dual-tier-pointInTimeRecovery.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: KeyspacesConfig
                check:
                  ($error != null): true

    - name: ac9-reject-both-tiers-ttlEnabled
      try:
        - apply:
            file: 08-invalid-dual-tier-ttlEnabled.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: KeyspacesConfig
                check:
                  ($error != null): true

    - name: ac10-reject-both-tiers-namingTemplate
      try:
        - apply:
            file: 09-invalid-dual-tier-namingTemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: KeyspacesConfig
                check:
                  ($error != null): true

    - name: ac11-effective-config-merge
      try:
        - apply:
            file: 10-general-policy-effectiveconfig.yaml
        - script:
            content: |
              kubectl patch keyspacesconfigs.aws.kropath.run general-policy -n keyspacesconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"replicationStrategy":"","throughputMode":"","encryptionType":"CUSTOMER_MANAGED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"replicationStrategy":"SINGLE_REGION","throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: general-policy
                namespace: keyspacesconfig
              status:
                effectiveConfig:
                  mandatory:
                    encryptionType: "CUSTOMER_MANAGED_KMS_KEY"
                    pointInTimeRecovery: false
                  defaults:
                    replicationStrategy: "SINGLE_REGION"
                    throughputMode: "PAY_PER_REQUEST"
                    namingTemplate: "{namespace}_{name}"

    - name: ac12-effective-config-tags-merge
      try:
        - apply:
            file: 11-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch keyspacesconfigs.aws.kropath.run general-policy -n keyspacesconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"replicationStrategy":"","throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{"cost-centre":"data-services"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"replicationStrategy":"SINGLE_REGION","throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: general-policy
                namespace: keyspacesconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      cost-centre: data-services
                  defaults:
                    tags:
                      team: platform

    - name: ac13-label-selector-lookup
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: general-policy
                namespace: keyspacesconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
        - script:
            content: |
              COUNT=$(kubectl get keyspacesconfigs.aws.kropath.run \
                -n keyspacesconfig \
                -l 'aws.kropath.run/resource-name=general-policy' \
                -o json | jq '.items | length')
              [ "$COUNT" -ge 1 ] || (echo "label selector returned 0 results; expected >= 1" && exit 1)
