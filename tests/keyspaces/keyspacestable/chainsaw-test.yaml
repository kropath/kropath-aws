---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keyspacestable-scenarios
spec:
  namespace: keyspacestable
  skipDelete: true
  steps:

    # ── AC-1: Defaults apply (PAY_PER_REQUEST, AWS_OWNED_KMS_KEY, PITR disabled, TTL disabled) ──
    - name: ac1-defaults-apply
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac1-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac1-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac1-table
                namespace: keyspacestable
              spec:
                configRef: ac1-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac1-table
                namespace: keyspacestable
              spec:
                capacitySpecification:
                  throughputMode: PAY_PER_REQUEST
                encryptionSpecification:
                  type_: AWS_OWNED_KMS_KEY
                pointInTimeRecovery:
                  status: DISABLED
                ttl:
                  status: disabled

    # ── AC-2: Provisioned capacity via instance spec ──
    - name: ac2-provisioned-capacity
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac2-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac2-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac2-table
                namespace: keyspacestable
              spec:
                configRef: ac2-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
                throughputMode: PROVISIONED
                readCapacityUnits: 100
                writeCapacityUnits: 50
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac2-table
                namespace: keyspacestable
              spec:
                capacitySpecification:
                  throughputMode: PROVISIONED
                  readCapacityUnits: 100
                  writeCapacityUnits: 50

    # ── AC-3: Mandatory throughput wins over instance ──
    - name: ac3-mandatory-throughput-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac3-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  throughputMode: PAY_PER_REQUEST
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac3-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac3-table
                namespace: keyspacestable
              spec:
                configRef: ac3-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
                throughputMode: PROVISIONED
                readCapacityUnits: 100
                writeCapacityUnits: 50
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac3-table
                namespace: keyspacestable
              spec:
                capacitySpecification:
                  throughputMode: PAY_PER_REQUEST

    # ── AC-4: Mandatory encryptionType wins with kmsKeyArn ──
    - name: ac4-mandatory-encryption-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac4-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  encryptionType: CUSTOMER_MANAGED_KMS_KEY
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac4-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"CUSTOMER_MANAGED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac4-table
                namespace: keyspacestable
              spec:
                configRef: ac4-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
                encryptionType: AWS_OWNED_KMS_KEY
                kmsKeyArn: "arn:aws:kms:ap-southeast-2:123456789012:key/test-key-ac4"
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac4-table
                namespace: keyspacestable
              spec:
                encryptionSpecification:
                  type_: CUSTOMER_MANAGED_KMS_KEY
                  kmsKeyIdentifier: "arn:aws:kms:ap-southeast-2:123456789012:key/test-key-ac4"

    # ── AC-5: Mandatory PITR enabled ──
    - name: ac5-mandatory-pitr
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac5-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  pointInTimeRecovery: true
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac5-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":true,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac5-table
                namespace: keyspacestable
              spec:
                configRef: ac5-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac5-table
                namespace: keyspacestable
              spec:
                pointInTimeRecovery:
                  status: ENABLED

    # ── AC-6: Mandatory TTL enabled ──
    - name: ac6-mandatory-ttl
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac6-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  ttlEnabled: true
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac6-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":true,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac6-table
                namespace: keyspacestable
              spec:
                configRef: ac6-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac6-table
                namespace: keyspacestable
              spec:
                ttl:
                  status: enabled

    # ── AC-7: Schema definition — columns, partitionKeys, clusteringKeys ──
    - name: ac7-schema-definition
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac7-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac7-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac7-table
                namespace: keyspacestable
              spec:
                configRef: ac7-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                  - name: email
                    type: text
                  - name: created_at
                    type: timestamp
                partitionKeys:
                  - name: user_id
                clusteringKeys:
                  - name: created_at
                    orderBy: DESC
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac7-table
                namespace: keyspacestable
              spec:
                schemaDefinition:
                  allColumns:
                    - name: user_id
                      type_: uuid
                    - name: email
                      type_: text
                    - name: created_at
                      type_: timestamp
                  partitionKeys:
                    - name: user_id
                  clusteringKeys:
                    - name: created_at
                      orderBy: DESC

    # ── AC-8: Static columns ──
    - name: ac8-schema-static-columns
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac8-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac8-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac8-table
                namespace: keyspacestable
              spec:
                configRef: ac8-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                  - name: profile_picture
                    type: text
                partitionKeys:
                  - name: user_id
                staticColumns:
                  - name: profile_picture
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac8-table
                namespace: keyspacestable
              spec:
                schemaDefinition:
                  staticColumns:
                    - name: profile_picture

    # ── AC-9: Encryption — CMK via kmsKeyArn ──
    - name: ac9-encryption-cmk-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac9-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac9-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac9-table
                namespace: keyspacestable
              spec:
                configRef: ac9-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
                encryptionType: CUSTOMER_MANAGED_KMS_KEY
                kmsKeyArn: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-ac9"
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac9-table
                namespace: keyspacestable
              spec:
                encryptionSpecification:
                  type_: CUSTOMER_MANAGED_KMS_KEY
                  kmsKeyIdentifier: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-ac9"

    # ── AC-10: Encryption — CMK via kmsKeyRef (ACK KMS Key CR) ──
    - name: ac10-encryption-cmk-ref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac10-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac10-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: kms.services.k8s.aws/v1alpha1
              kind: Key
              metadata:
                name: data-key
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: data-key
              spec: {}
        - script:
            content: |
              kubectl patch key data-key -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:kms:ap-southeast-2:123456789012:key/test-key-ac10","ownerAccountID":"123456789012","region":"ap-southeast-2"}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac10-table
                namespace: keyspacestable
              spec:
                configRef: ac10-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
                encryptionType: CUSTOMER_MANAGED_KMS_KEY
                kmsKeyRef: data-key
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac10-table
                namespace: keyspacestable
              spec:
                encryptionSpecification:
                  type_: CUSTOMER_MANAGED_KMS_KEY
                  kmsKeyIdentifier: "arn:aws:kms:ap-southeast-2:123456789012:key/test-key-ac10"

    # ── AC-11: Advisory ConfigMap — kmsKeyArn + kmsKeyRef mutually exclusive ──
    - name: ac11-advisory-kms-mutual-exclusive
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac11-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac11-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac11-table
                namespace: keyspacestable
              spec:
                configRef: ac11-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
                encryptionType: CUSTOMER_MANAGED_KMS_KEY
                kmsKeyArn: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-ac11"
                kmsKeyRef: data-key
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac11-table-kms-mutual-exclusion
                namespace: keyspacestable
              data:
                (error != ""): true
        - script:
            content: |
              kubectl get configmap ac11-table-kms-mutual-exclusion -n keyspacestable

    # ── AC-12: Advisory ConfigMap — CMK encryptionType but no key ──
    - name: ac12-advisory-cmk-missing-key
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac12-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac12-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac12-table
                namespace: keyspacestable
              spec:
                configRef: ac12-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
                encryptionType: CUSTOMER_MANAGED_KMS_KEY
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac12-table-kms-missing-key
                namespace: keyspacestable
              data:
                (error != ""): true
        - script:
            content: |
              kubectl get configmap ac12-table-kms-missing-key -n keyspacestable

    # ── AC-13: Instance PITR enabled ──
    - name: ac13-pitr-enabled
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac13-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac13-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac13-table
                namespace: keyspacestable
