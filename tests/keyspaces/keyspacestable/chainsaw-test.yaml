      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesConfig
              metadata:
                name: ac27-cfg
                namespace: keyspacestable
                labels:
                  aws.kropath.run/resource-name: ac27-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch keyspacesconfig ac27-cfg -n keyspacestable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"throughputMode":"","encryptionType":"","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"throughputMode":"PAY_PER_REQUEST","encryptionType":"AWS_OWNED_KMS_KEY","pointInTimeRecovery":false,"ttlEnabled":false,"namingTemplate":"{namespace}_{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KeyspacesTable
              metadata:
                name: ac27-table
                namespace: keyspacestable
              spec:
                configRef: ac27-cfg
                keyspaceName: test-keyspace
                columns:
                  - name: user_id
                    type: uuid
                partitionKeys:
                  - name: user_id
        - assert:
            resource:
              apiVersion: keyspaces.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac27-table
                namespace: keyspacestable
                annotations:
                  services.k8s.aws/deletion-policy: retain

