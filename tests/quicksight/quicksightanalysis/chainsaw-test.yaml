    # AN-AC-8 (negative): Unresolved token in naming template → namingStatus: invalid, no ACK Analysis.
    - name: anac8-negative-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
