                mandatory:
                  namingTemplate: "an-{tag.env}-{name}"
        - script:
            content: |
              kubectl -n quicksightanalysis patch quicksightconfigs.aws.kropath.run ac8-cfg \
                --subresource=status --type=merge -p '{
                  "status":{"effectiveConfig":{
                    "mandatory":{"namingTemplate":"an-{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "aws":{"accountId":"111111111111","region":"us-east-1"}
