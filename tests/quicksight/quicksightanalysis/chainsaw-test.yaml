    # AN-AC-10: two dataSetReferences entries — both must appear in ACK Analysis.
    - name: anac10-two-dataset-refs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: ac20-cfg
                namespace: quicksightanalysis
                labels:
                  aws.kropath.run/resource-name: ac20-cfg
              spec: {}
        - script:
            content: |
              kubectl -n quicksightanalysis patch quicksightconfigs.aws.kropath.run ac20-cfg \
                --subresource=status --type=merge -p '{
                  "status":{"effectiveConfig":{
                    "mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "aws":{"accountId":"111111111111","region":"us-east-1"}
                  }}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightAnalysis
              metadata:
                name: ac20-an
                namespace: quicksightanalysis
              spec:
                configRef: ac20-cfg
                resourceId: ac20-analysis-id
                sourceEntity:
                  sourceTemplate:
                    arn: arn:aws:quicksight:us-east-1:111111111111:template/tmpl-multi
                    dataSetReferences:
                      - dataSetPlaceholder: ds1
                        dataSetARN: arn:aws:quicksight:us-east-1:111111111111:dataset/ds-id-alpha
                      - dataSetPlaceholder: ds2
                        dataSetARN: arn:aws:quicksight:us-east-1:111111111111:dataset/ds-id-beta
        - assert:
            resource:
              apiVersion: quicksight.services.k8s.aws/v1alpha1
              kind: Analysis
              metadata:
                name: ac20-an
                namespace: quicksightanalysis
              spec:
                analysisID: ac20-analysis-id
        - script:
            content: |
              DS_REFS=$(kubectl -n quicksightanalysis get analyses.quicksight.services.k8s.aws ac20-an -o json \
                | jq '.spec.sourceEntity.sourceTemplate.dataSetReferences')
              REF_COUNT=$(echo "$DS_REFS" | jq 'length')
              if [ "$REF_COUNT" != "2" ]; then
                echo "FAIL: expected 2 dataSetReferences, got $REF_COUNT: $DS_REFS"
                exit 1
              fi
              HAS_DS1=$(echo "$DS_REFS" | jq '[.[].dataSetPlaceholder] | contains(["ds1"])')
              HAS_DS2=$(echo "$DS_REFS" | jq '[.[].dataSetPlaceholder] | contains(["ds2"])')
              if [ "$HAS_DS1" != "true" ] || [ "$HAS_DS2" != "true" ]; then
                echo "FAIL: missing dataSetPlaceholders — has ds1=$HAS_DS1, ds2=$HAS_DS2"
                echo "$DS_REFS"
                exit 1
              fi
              echo "PASS: both dataSetReferences (ds1, ds2) present in ACK Analysis"
