        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightAnalysis
              metadata:
                name: ac8-an
                namespace: quicksightanalysis
              spec:
                configRef: ac8-cfg
                resourceId: ac8-analysis-id
                sourceEntity:
                  sourceTemplate:
                    arn: arn:aws:quicksight:us-east-1:111111111111:template/tmpl1
                    dataSetReferences:
                      - dataSetPlaceholder: ds1
                        dataSetARN: arn:aws:quicksight:us-east-1:111111111111:dataset/ds-id-1
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightAnalysis
              metadata:
                name: ac8-an
                namespace: quicksightanalysis
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              COUNT=$(kubectl -n quicksightanalysis get analyses.quicksight.services.k8s.aws ac8-an 2>/dev/null | grep -c ac8-an || true)
              if [ "$COUNT" -gt 0 ]; then
                echo "FAIL: ACK Analysis created despite invalid naming token"
                exit 1
              fi
              echo "PASS: ACK Analysis correctly absent when naming is invalid"

