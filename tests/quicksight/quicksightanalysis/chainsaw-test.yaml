              spec:
                configRef: ac4-cfg
                resourceId: ac4-analysis-id
                sourceEntity:
                  sourceTemplate:
                    arn: arn:aws:quicksight:us-east-1:111111111111:template/tmpl1
                    dataSetReferences:
                      - dataSetPlaceholder: ds1
                        dataSetARN: arn:aws:quicksight:us-east-1:111111111111:dataset/ds-id-1
        - assert:
            resource:
              apiVersion: quicksight.services.k8s.aws/v1alpha1
              kind: Analysis
              metadata:
                name: ac4-an
                namespace: quicksightanalysis
                annotations:
                  aws.kropath.run/cost-center: "9900"
        - script:
            content: |
              TAGS=$(kubectl -n quicksightanalysis get analyses.quicksight.services.k8s.aws ac4-an -o json | jq -r '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="cost-center")) | length == 1 and .[0].value == "9900"' \
                || { echo "FAIL: syncedAnnotations not in cloud tags: $TAGS"; exit 1; }
              echo "PASS: syncedAnnotations dual-write verified"

    # AN-AC-5: Default naming template {namespace}-{name}.
    - name: anac5-default-naming
