        - script:
            content: |
              kubectl -n quicksightanalysis patch quicksightconfigs.aws.kropath.run ac3-cfg \
                --subresource=status --type=merge -p '{
                  "status":{"effectiveConfig":{
                    "mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "defaults":{"tags":{},"syncedLabels":{"team":"infra"},"syncedAnnotations":{}},
                    "aws":{"accountId":"111111111111","region":"us-east-1"}
                  }}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightAnalysis
              metadata:
                name: ac3-an
                namespace: quicksightanalysis
              spec:
                configRef: ac3-cfg
                resourceId: ac3-analysis-id
                sourceEntity:
                  sourceTemplate:
                    arn: arn:aws:quicksight:us-east-1:111111111111:template/tmpl1
                    dataSetReferences:
                      - dataSetPlaceholder: ds1
                        dataSetARN: arn:aws:quicksight:us-east-1:111111111111:dataset/ds-id-1
        - assert:
            resource:
              apiVersion: quicksight.services.k8s.aws/v1alpha1
              kind: Analysis
              metadata:
                name: ac3-an
                namespace: quicksightanalysis
                labels:
                  aws.kropath.run/team: infra
        - script:
            content: |
              TAGS=$(kubectl -n quicksightanalysis get analyses.quicksight.services.k8s.aws ac3-an -o json | jq -r '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="team")) | length == 1 and .[0].value == "infra"' \
                || { echo "FAIL: syncedLabels not in cloud tags: $TAGS"; exit 1; }
              echo "PASS: syncedLabels dual-write verified"

    # AN-AC-4: syncedAnnotations dual-write.
    - name: anac4-syncedannotations-dualwrite
