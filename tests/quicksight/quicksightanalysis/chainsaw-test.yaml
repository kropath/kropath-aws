# Chainsaw test suite for QuickSightAnalysis RGD.
# Acceptance criteria: AN-AC-1 through AN-AC-18.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step ACK deletes.
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: quicksightanalysis
spec:
  namespace: quicksightanalysis
  skipDelete: true
  steps:

    # AN-AC-1: sourceEntity.sourceTemplate passed through to ACK Analysis.
    - name: anac1-source-entity
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: ac1-cfg
                namespace: quicksightanalysis
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec: {}
        - script:
            content: |
              kubectl -n quicksightanalysis patch quicksightconfigs.aws.kropath.run ac1-cfg \
                --subresource=status --type=merge -p '{
                  "status":{"effectiveConfig":{
                    "mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "aws":{"accountId":"111111111111","region":"us-east-1"}
                  }}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightAnalysis
              metadata:
                name: ac1-an
                namespace: quicksightanalysis
              spec:
                configRef: ac1-cfg
                resourceId: ac1-analysis-id
                sourceEntity:
                  sourceTemplate:
                    arn: arn:aws:quicksight:us-east-1:111111111111:template/tmpl1
                    dataSetReferences:
                      - dataSetPlaceholder: ds1
                        dataSetARN: arn:aws:quicksight:us-east-1:111111111111:dataset/ds-id-1
        - assert:
            resource:
              apiVersion: quicksight.services.k8s.aws/v1alpha1
              kind: Analysis
              metadata:
                name: ac1-an
                namespace: quicksightanalysis
              spec:
                analysisID: ac1-analysis-id
        - script:
            content: |
              ENTITY=$(kubectl -n quicksightanalysis get analyses.quicksight.services.k8s.aws ac1-an -o json | jq '.spec.sourceEntity')
              echo "$ENTITY" | jq -e '
                .sourceTemplate.arn == "arn:aws:quicksight:us-east-1:111111111111:template/tmpl1" and
                (.sourceTemplate.dataSetReferences | length == 1) and
                .sourceTemplate.dataSetReferences[0].dataSetPlaceholder == "ds1"
              ' || { echo "FAIL: sourceEntity not passed through: $ENTITY"; exit 1; }
              echo "PASS: sourceEntity passed through"

    # AN-AC-2: Tags merge — defaults + spec + mandatory, mandatory wins.
    - name: anac2-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: ac2-cfg
                namespace: quicksightanalysis
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  tags:
                    env: prod
                    owner: mandatory-owner
                defaults:
                  tags:
                    env: dev
                    team: platform
        - script:
            content: |
              kubectl -n quicksightanalysis patch quicksightconfigs.aws.kropath.run ac2-cfg \
                --subresource=status --type=merge -p '{
                  "status":{"effectiveConfig":{
                    "mandatory":{"tags":{"env":"prod","owner":"mandatory-owner"},"syncedLabels":{},"syncedAnnotations":{}},
                    "defaults":{"tags":{"env":"dev","team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},
                    "aws":{"accountId":"111111111111","region":"us-east-1"}
                  }}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightAnalysis
              metadata:
                name: ac2-an
                namespace: quicksightanalysis
              spec:
                configRef: ac2-cfg
                resourceId: ac2-analysis-id
                sourceEntity:
                  sourceTemplate:
                    arn: arn:aws:quicksight:us-east-1:111111111111:template/tmpl1
                    dataSetReferences:
                      - dataSetPlaceholder: ds1
                        dataSetARN: arn:aws:quicksight:us-east-1:111111111111:dataset/ds-id-1
        - assert:
            resource:
              apiVersion: quicksight.services.k8s.aws/v1alpha1
              kind: Analysis
              metadata:
                name: ac2-an
                namespace: quicksightanalysis
        - script:
            content: |
              TAGS=$(kubectl -n quicksightanalysis get analyses.quicksight.services.k8s.aws ac2-an -o json | jq -r '.spec.tags')
              echo "$TAGS" | jq -e '
                (map(select(.key=="env")) | length == 1) and
                (map(select(.key=="env"))[0].value == "prod") and
                (map(select(.key=="owner")) | length == 1) and
                (map(select(.key=="owner"))[0].value == "mandatory-owner") and
                (map(select(.key=="team")) | length == 1) and
                (map(select(.key=="team"))[0].value == "platform")
              ' || { echo "FAIL: tags merge incorrect: $TAGS"; exit 1; }
              echo "PASS: tags merged correctly with mandatory-wins"

    # AN-AC-3: syncedLabels dual-write — K8s labels (prefixed) AND cloud tags (plain).
    - name: anac3-syncedlabels-dualwrite
      try:
        - apply:
            resource:
