              spec:
                configRef: ac20-cfg
                nameOverride: display-name-dashboard
                resourceId: immutable-dashboard-id-456
                sourceEntity:
                  sourceTemplate:
                    arn: arn:aws:quicksight:ap-southeast-1:123456789012:template/tmpl1
                    dataSetReferences:
