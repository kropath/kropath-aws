              spec:
                name: display-name-dashboard
                dashboardID: immutable-dashboard-id-456
        - script:
            content: |
              ARN=$(kubectl -n quicksightdashboard get quicksightdashboards.aws.kropath.run ac20-db -o jsonpath='{.status.predictedArn}')
              EXPECTED="arn:aws:quicksight:ap-southeast-1:123456789012:dashboard/immutable-dashboard-id-456"
              if [ "$ARN" != "$EXPECTED" ]; then
                echo "FAIL: predictedArn='$ARN', expected='$EXPECTED'"
