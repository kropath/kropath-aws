    # DB-AC-8 (negative): Unresolved {tag.env} in naming template → namingStatus: invalid-unresolved-tokens, no ACK Dashboard.
    - name: dbac8-negative-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: ac8-cfg
                namespace: quicksightdashboard
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory:
                  namingTemplate: "db-{tag.env}-{name}"
        - script:
            content: |
              kubectl -n quicksightdashboard patch quicksightconfigs.aws.kropath.run ac8-cfg \
                --subresource=status --type=merge -p '{
                  "status":{"effectiveConfig":{
                    "mandatory":{"namingTemplate":"db-{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "aws":{"accountId":"111111111111","region":"us-east-1"}
                  }}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightDashboard
              metadata:
                name: ac8-db
                namespace: quicksightdashboard
              spec:
                configRef: ac8-cfg
                resourceId: ac8-dashboard-id
                sourceEntity:
                  sourceTemplate:
                    arn: arn:aws:quicksight:us-east-1:111111111111:template/tmpl1
                    dataSetReferences:
                      - dataSetPlaceholder: ds1
                        dataSetARN: arn:aws:quicksight:us-east-1:111111111111:dataset/ds-id-1
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightDashboard
              metadata:
                name: ac8-db
                namespace: quicksightdashboard
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              COUNT=$(kubectl -n quicksightdashboard get dashboards.quicksight.services.k8s.aws ac8-db 2>/dev/null | grep -c ac8-db || true)
              if [ "$COUNT" -gt 0 ]; then
                echo "FAIL: ACK Dashboard created despite invalid naming token"
                exit 1
              fi
              echo "PASS: ACK Dashboard correctly absent when naming is invalid"

