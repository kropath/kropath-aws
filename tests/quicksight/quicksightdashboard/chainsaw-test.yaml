                sourceEntity:
                  sourceTemplate:
                    arn: arn:aws:quicksight:us-east-1:111111111111:template/tmpl1
                    dataSetReferences:
                      - dataSetPlaceholder: ds1
                        dataSetARN: arn:aws:quicksight:us-east-1:111111111111:dataset/ds-id-1
        - assert:
            resource:
              apiVersion: quicksight.services.k8s.aws/v1alpha1
              kind: Dashboard
              metadata:
                name: ac4-db
                namespace: quicksightdashboard
                annotations:
                  aws.kropath.run/cost-center: "8800"
        - script:
            content: |
              TAGS=$(kubectl -n quicksightdashboard get dashboards.quicksight.services.k8s.aws ac4-db -o json | jq -r '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="cost-center")) | length == 1 and .[0].value == "8800"' \
                || { echo "FAIL: syncedAnnotations not in cloud tags: $TAGS"; exit 1; }
              echo "PASS: syncedAnnotations dual-write verified"

    # DB-AC-5: Default naming template {namespace}-{name}.
    - name: dbac5-default-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
