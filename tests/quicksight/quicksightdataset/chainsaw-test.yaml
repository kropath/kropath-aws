# Chainsaw test suite for QuickSightDataSet RGD.
# Acceptance criteria: DST-AC-1 through DST-AC-21.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step ACK deletes.
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: quicksightdataset
spec:
  namespace: quicksightdataset
  skipDelete: true
  steps:

    # DST-AC-1: Tags merge — defaults + spec + mandatory, mandatory wins; list format {key,value}.
    - name: dstac1-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: ac1-cfg
                namespace: quicksightdataset
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  tags:
                    env: prod
                    owner: mandatory-owner
                defaults:
                  tags:
                    env: dev
                    team: platform
        - script:
            content: |
              kubectl -n quicksightdataset patch quicksightconfigs.aws.kropath.run ac1-cfg \
                --subresource=status --type=merge -p '{
                  "status":{"effectiveConfig":{
                    "mandatory":{"tags":{"env":"prod","owner":"mandatory-owner"},"syncedLabels":{},"syncedAnnotations":{}},
                    "defaults":{"tags":{"env":"dev","team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},
                    "aws":{"accountId":"111111111111","region":"us-east-1"}
                  }}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightDataSet
              metadata:
                name: ac1-ds
                namespace: quicksightdataset
              spec:
                configRef: ac1-cfg
                resourceId: ac1-dataset-id
                physicalTableMap:
                  Table1:
                    relationalTable:
                      dataSourceArn: arn:aws:quicksight:us-east-1:111111111111:datasource/ds1
                      name: table1
                      inputColumns:
                        - name: id
                          type: STRING
        - assert:
            resource:
              apiVersion: quicksight.services.k8s.aws/v1alpha1
              kind: DataSet
              metadata:
                name: ac1-ds
                namespace: quicksightdataset
              spec:
                dataSetID: ac1-dataset-id
        - script:
            content: |
              TAGS=$(kubectl -n quicksightdataset get datasets.quicksight.services.k8s.aws ac1-ds -o json | jq -r '.spec.tags')
              echo "$TAGS" | jq -e '
                (map(select(.key=="env")) | length == 1) and
                (map(select(.key=="env"))[0].value == "prod") and
                (map(select(.key=="owner")) | length == 1) and
                (map(select(.key=="owner"))[0].value == "mandatory-owner") and
                (map(select(.key=="team")) | length == 1) and
                (map(select(.key=="team"))[0].value == "platform")
              ' || { echo "FAIL: tags merge incorrect: $TAGS"; exit 1; }
              echo "PASS: tags merged correctly with mandatory-wins"

    # DST-AC-2: syncedLabels dual-write — K8s metadata.labels (prefixed) AND cloud spec.tags (plain).
    - name: dstac2-syncedlabels-dualwrite
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: ac2-cfg
                namespace: quicksightdataset
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  syncedLabels:
                    team: infra
        - script:
            content: |
              kubectl -n quicksightdataset patch quicksightconfigs.aws.kropath.run ac2-cfg \
                --subresource=status --type=merge -p '{
                  "status":{"effectiveConfig":{
                    "mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "defaults":{"tags":{},"syncedLabels":{"team":"infra"},"syncedAnnotations":{}},
                    "aws":{"accountId":"111111111111","region":"us-east-1"}
                  }}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightDataSet
              metadata:
                name: ac2-ds
                namespace: quicksightdataset
              spec:
                configRef: ac2-cfg
                resourceId: ac2-dataset-id
                physicalTableMap:
                  T1:
                    relationalTable:
                      dataSourceArn: arn:aws:quicksight:us-east-1:111111111111:datasource/ds1
                      name: t1
                      inputColumns:
                        - name: id
                          type: STRING
        - assert:
            resource:
              apiVersion: quicksight.services.k8s.aws/v1alpha1
              kind: DataSet
              metadata:
                name: ac2-ds
                namespace: quicksightdataset
                labels:
                  aws.kropath.run/team: infra
        - script:
            content: |
              # Cloud tags must contain plain key "team" (no prefix)
              TAGS=$(kubectl -n quicksightdataset get datasets.quicksight.services.k8s.aws ac2-ds -o json | jq -r '.spec.tags')
              echo "$TAGS" | jq -e 'map(select(.key=="team")) | length == 1 and .[0].value == "infra"' \
                || { echo "FAIL: syncedLabels not in cloud tags: $TAGS"; exit 1; }
              echo "PASS: syncedLabels dual-write verified"

    # DST-AC-3: syncedAnnotations dual-write — K8s metadata.annotations (prefixed) AND cloud spec.tags (plain).
    - name: dstac3-syncedannotations-dualwrite
