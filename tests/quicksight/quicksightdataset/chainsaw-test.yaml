    # DST-AC-7 (negative): Unresolved {tag.env} in naming template → namingStatus: invalid-unresolved-tokens, no ACK DataSet.
    - name: dstac7-negative-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: ac7-cfg
                namespace: quicksightdataset
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory:
                  namingTemplate: "ds-{tag.env}-{name}"
        - script:
            content: |
              kubectl -n quicksightdataset patch quicksightconfigs.aws.kropath.run ac7-cfg \
                --subresource=status --type=merge -p '{
                  "status":{"effectiveConfig":{
                    "mandatory":{"namingTemplate":"ds-{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{}},
                    "aws":{"accountId":"111111111111","region":"us-east-1"}
                  }}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightDataSet
              metadata:
                name: ac7-ds
                namespace: quicksightdataset
              spec:
                configRef: ac7-cfg
                resourceId: ac7-dataset-id
                physicalTableMap:
                  T1:
                    relationalTable:
                      dataSourceArn: arn:aws:quicksight:us-east-1:111111111111:datasource/ds1
                      name: t1
                      inputColumns:
                        - name: id
                          type: STRING
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightDataSet
              metadata:
                name: ac7-ds
                namespace: quicksightdataset
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              # ACK DataSet must NOT be created when naming is invalid
              COUNT=$(kubectl -n quicksightdataset get datasets.quicksight.services.k8s.aws ac7-ds 2>/dev/null | grep -c ac7-ds || true)
              if [ "$COUNT" -gt 0 ]; then
                echo "FAIL: ACK DataSet was created despite invalid naming token"
                exit 1
              fi
              echo "PASS: ACK DataSet correctly absent when naming is invalid"

