# AC-5: QuickSightConfig with defaults.importMode: "DIRECT_QUERY"; controller merges
# KropathConfig mandatory.quicksight.importMode: "SPICE" (highest priority) into
# status.effectiveConfig.mandatory.importMode = "SPICE"; defaults tier preserved.
---
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: cascade-import-mode-config
  namespace: quicksightconfig
  labels:
    aws.kropath.run/resource-name: cascade-import-mode-config
spec:
  mandatory:
    importMode: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    importMode: "DIRECT_QUERY"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
