# AC-3: QuickSightConfig with mandatory.importMode: "SPICE" and defaults.importMode: ""
# — accepted; no validation error (only one tier has a non-empty importMode).
---
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: import-mode-mandatory-config
  namespace: quicksightconfig
  labels:
    aws.kropath.run/resource-name: import-mode-mandatory-config
spec:
  mandatory:
    importMode: "SPICE"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    importMode: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
