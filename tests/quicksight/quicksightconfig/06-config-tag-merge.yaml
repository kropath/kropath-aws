# AC-6: QuickSightConfig with mandatory.tags and defaults.tags — controller merges with
# KropathConfig mandatory.tags into status.effectiveConfig.
# KropathConfig contributes {cost-centre: platform}; QuickSightConfig mandatory adds {bi-team: analytics}.
---
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: tags-merge-config
  namespace: quicksightconfig
  labels:
    aws.kropath.run/resource-name: tags-merge-config
spec:
  mandatory:
    importMode: ""
    namingTemplate: ""
    tags:
      bi-team: analytics
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    importMode: "SPICE"
    namingTemplate: "{namespace}-{name}"
    tags:
      environment: production
    syncedLabels: {}
    syncedAnnotations: {}
