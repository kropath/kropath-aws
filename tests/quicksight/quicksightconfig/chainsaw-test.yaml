# aws-qs-01 Chainsaw tests — one scenario per acceptance criterion (10 ACs).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: quicksightconfig
spec:
  skipDelete: true
  namespace: quicksightconfig
  steps:
    - name: ac1-reject-import-mode-both-tiers
      try:
        - apply:
            file: 00-quicksightconfig-namespace.yaml
        - apply:
            file: 01-config-import-mode-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: QuickSightConfig
                check:
                  ($error != null): true

    - name: ac2-reject-naming-template-both-tiers
      try:
        - apply:
            file: 02-config-naming-template-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: QuickSightConfig
                check:
                  ($error != null): true

    - name: ac3-import-mode-mandatory-only-accepted
      try:
        - apply:
            file: 03-config-import-mode-mandatory-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: import-mode-mandatory-config
                namespace: quicksightconfig
              spec:
                mandatory:
                  importMode: "SPICE"
                defaults:
                  importMode: ""

    - name: ac4-import-mode-defaults-only-accepted
      try:
        - apply:
            file: 04-config-import-mode-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: import-mode-defaults-config
                namespace: quicksightconfig
              spec:
                mandatory:
                  importMode: ""
                defaults:
                  importMode: "SPICE"

    - name: ac5-effective-config-import-mode-cascade
      try:
        - apply:
            file: 05-config-import-mode-cascade.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory.quicksight.importMode: "SPICE"
              # (highest priority) merged with QuickSightConfig defaults.importMode: "DIRECT_QUERY".
              # effectiveConfig.mandatory.importMode = "SPICE" (from KropathConfig);
              # effectiveConfig.defaults.importMode = "DIRECT_QUERY" (from QuickSightConfig).
              kubectl patch quicksightconfigs.aws.kropath.run cascade-import-mode-config -n quicksightconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"importMode":"SPICE","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"importMode":"DIRECT_QUERY","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: cascade-import-mode-config
                namespace: quicksightconfig
              status:
                effectiveConfig:
                  mandatory:
                    importMode: "SPICE"
                  defaults:
                    importMode: "DIRECT_QUERY"
                  aws:
                    accountId: "123456789012"
                    region: us-east-1
            timeout: 60s

    - name: ac6-effective-config-tags-merge
      try:
        - apply:
            file: 06-config-tag-merge.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory.tags {cost-centre: platform}
              # merged with QuickSightConfig mandatory.tags {bi-team: analytics}.
              # Both keys appear in effectiveConfig.mandatory.tags.
              kubectl patch quicksightconfigs.aws.kropath.run tags-merge-config -n quicksightconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"importMode":"","namingTemplate":"","tags":{"bi-team":"analytics","cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"importMode":"SPICE","namingTemplate":"{namespace}-{name}","tags":{"environment":"production"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: tags-merge-config
                namespace: quicksightconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      bi-team: analytics
                      cost-centre: platform
                  defaults:
                    tags:
                      environment: production
            timeout: 60s

    - name: ac7-effective-config-synced-labels-merge
      try:
        - apply:
            file: 07-config-synced-labels-merge.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig defaults.syncedLabels {env: prod}
              # merged with QuickSightConfig defaults.syncedLabels {data-class: internal}.
              # Both keys appear in effectiveConfig.defaults.syncedLabels.
              kubectl patch quicksightconfigs.aws.kropath.run synced-labels-merge-config -n quicksightconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"importMode":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"importMode":"SPICE","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{"data-class":"internal","env":"prod"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: synced-labels-merge-config
                namespace: quicksightconfig
              status:
                effectiveConfig:
                  defaults:
                    syncedLabels:
                      data-class: internal
                      env: prod
            timeout: 60s

    - name: ac8-effective-config-naming-template
      try:
        - apply:
            file: 08-config-naming-template.yaml
        - script:
            content: |
              # Simulate controller writing effectiveConfig with defaults.namingTemplate.
              # No KropathConfig mandatory namingTemplate — only QuickSightConfig defaults value.
              kubectl patch quicksightconfigs.aws.kropath.run naming-template-config -n quicksightconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"importMode":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"importMode":"SPICE","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: naming-template-config
                namespace: quicksightconfig
              status:
                effectiveConfig:
                  mandatory:
                    namingTemplate: ""
                  defaults:
                    namingTemplate: "{namespace}-{name}"
            timeout: 60s

    - name: ac9-label-selector-resolution
      try:
        - apply:
            file: 09-config-label-selector.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: general-policy
                namespace: kro-system
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  importMode: ""
                defaults:
                  importMode: "SPICE"
                  namingTemplate: "{namespace}-{name}"

    - name: ac10-effective-config-aws-section
      try:
        - apply:
            file: 10-config-aws-section.yaml
        - script:
            content: |
              # Simulate controller writing effectiveConfig.aws from KropathConfig:
              # aws.accountId: "123456789012" and aws.region: "ap-southeast-2".
              kubectl patch quicksightconfigs.aws.kropath.run aws-section-config -n quicksightconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"importMode":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"importMode":"SPICE","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: QuickSightConfig
              metadata:
                name: aws-section-config
                namespace: quicksightconfig
              status:
                effectiveConfig:
                  aws:
                    accountId: "123456789012"
                    region: ap-southeast-2
            timeout: 60s
