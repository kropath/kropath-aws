# AC-7: Tags from KropathConfig + OpenSearchConfig mandatory + defaults merge additively.
---
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: tags-config
  namespace: opensearchconfig
  labels:
    aws.kropath.run/resource-name: tags-config
spec:
  mandatory:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: ""
    autoTuneDesiredState: ""
    standbyReplicas: ""
    namingTemplate: ""
    tags:
      team: search
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAtRestEnabled: true
    nodeToNodeEncryptionEnabled: true
    enforceHTTPS: true
    tlsSecurityPolicy: "Policy-Min-TLS-1-2-2019-07"
    advancedSecurityEnabled: false
    engineVersion: "OpenSearch_2.9"
    autoTuneDesiredState: "ENABLED"
    standbyReplicas: "ENABLED"
    namingTemplate: "{namespace}-{name}"
    tags:
      env: dev
    syncedLabels: {}
    syncedAnnotations: {}
