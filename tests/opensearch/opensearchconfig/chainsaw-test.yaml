# aws-os-01 Chainsaw tests — all 9 acceptance criteria for OpenSearchConfig CRD (KRO-805).
# Canonical pattern: spec.skipDelete: true, unique resource names per step, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: opensearchconfig
spec:
  skipDelete: true
  namespace: opensearchconfig
  steps:
    # AC-9: Create general-policy OpenSearchConfig; CR accepted; Theme 28 label present.
    - name: ac9-label-selector-lookup
      try:
        - apply:
            file: 00-opensearchconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: general-policy
                namespace: opensearchconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  encryptionAtRestEnabled: true
                  nodeToNodeEncryptionEnabled: true
                  enforceHTTPS: true
                  tlsSecurityPolicy: "Policy-Min-TLS-1-2-2019-07"
                  engineVersion: "OpenSearch_2.9"
                  autoTuneDesiredState: "ENABLED"
                  standbyReplicas: "ENABLED"
                  namingTemplate: "{namespace}-{name}"

    # AC-1: encryptionAtRestEnabled true in both mandatory and defaults — rejected.
    - name: ac1-reject-tier-conflict-boolean
      try:
        - apply:
            file: 02-invalid-boolean-tier-conflict.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OpenSearchConfig
                check:
                  ($error != null): true

    # AC-2: tlsSecurityPolicy set in both mandatory and defaults — rejected.
    - name: ac2-reject-tier-conflict-string
      try:
        - apply:
            file: 03-invalid-string-tier-conflict.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OpenSearchConfig
                check:
                  ($error != null): true

    # AC-3: standbyReplicas set in both mandatory and defaults — rejected.
    - name: ac3-reject-tier-conflict-standby
      try:
        - apply:
            file: 04-invalid-standby-tier-conflict.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: OpenSearchConfig
                check:
                  ($error != null): true

    # AC-4: KropathConfig mandatory.encryptionAtRestEnabled: true flows into
    # effectiveConfig.mandatory. Simulated via kubectl patch --subresource=status.
    - name: ac4-effective-merge-mandatory
      try:
        - apply:
            file: 05-cascade-mandatory-config.yaml
        - script:
            content: |
              kubectl patch opensearchconfig cascade-mandatory -n opensearchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":true,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":true,"nodeToNodeEncryptionEnabled":true,"enforceHTTPS":true,"tlsSecurityPolicy":"Policy-Min-TLS-1-2-2019-07","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"ENABLED","standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: cascade-mandatory
                namespace: opensearchconfig
              status:
                effectiveConfig:
                  mandatory:
                    encryptionAtRestEnabled: true
                  defaults:
                    encryptionAtRestEnabled: true
                    tlsSecurityPolicy: "Policy-Min-TLS-1-2-2019-07"
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    accountId: "123456789012"
                    region: "ap-southeast-2"

    # AC-5: Profile-level defaults.tlsSecurityPolicy wins over KropathConfig.defaults for same tier.
    # Controller resolution: profile-level defaults (priority 6-7) > KropathConfig defaults (8-9).
    # Simulated via kubectl patch --subresource=status with profile-level value winning.
    - name: ac5-effective-merge-defaults
      try:
        - apply:
            file: 06-cascade-defaults-config.yaml
        - script:
            content: |
              kubectl patch opensearchconfig cascade-defaults -n opensearchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":true,"nodeToNodeEncryptionEnabled":true,"enforceHTTPS":true,"tlsSecurityPolicy":"Policy-Min-TLS-1-2-2019-07","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"ENABLED","standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: cascade-defaults
                namespace: opensearchconfig
              status:
                effectiveConfig:
                  defaults:
                    tlsSecurityPolicy: "Policy-Min-TLS-1-2-2019-07"

    # AC-6: No KropathConfig opensearch section; profile mandatory.engineVersion flows through.
    # Simulated via kubectl patch --subresource=status.
    - name: ac6-effective-merge-profile-only
      try:
        - apply:
            file: 07-profile-only-config.yaml
        - script:
            content: |
              kubectl patch opensearchconfig profile-only -n opensearchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":true,"nodeToNodeEncryptionEnabled":true,"enforceHTTPS":true,"tlsSecurityPolicy":"Policy-Min-TLS-1-2-2019-07","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"ENABLED","standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: profile-only
                namespace: opensearchconfig
              status:
                effectiveConfig:
                  mandatory:
                    engineVersion: "OpenSearch_2.9"

    # AC-7: Tags from KropathConfig mandatory + OpenSearchConfig mandatory/defaults merge additively.
    # Simulated via kubectl patch --subresource=status.
    - name: ac7-tags-merge
      try:
        - apply:
            file: 08-tags-config.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: tags-config
                namespace: opensearchconfig
              spec:
                mandatory:
                  tags:
                    team: search
                defaults:
                  tags:
                    env: dev
        - script:
            content: |
              kubectl patch opensearchconfig tags-config -n opensearchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{"cost-centre":"platform","team":"search"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":true,"nodeToNodeEncryptionEnabled":true,"enforceHTTPS":true,"tlsSecurityPolicy":"Policy-Min-TLS-1-2-2019-07","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"ENABLED","standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{name}","tags":{"env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: tags-config
                namespace: opensearchconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      cost-centre: platform
                      team: search
                  defaults:
                    tags:
                      env: dev

    # AC-8: PCI profile (advancedSecurityEnabled: true in mandatory) — CR accepted and config readable.
    - name: ac8-profile-selection-pci
      try:
        - apply:
            file: 09-pci-profile.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: pci
                namespace: opensearchconfig
                labels:
                  aws.kropath.run/resource-name: pci
              spec:
                mandatory:
                  advancedSecurityEnabled: true
                  encryptionAtRestEnabled: true
                  nodeToNodeEncryptionEnabled: true
                  enforceHTTPS: true
                  tlsSecurityPolicy: "Policy-Min-TLS-1-2-PFS-2023-10"
        - script:
            content: |
              kubectl patch opensearchconfig pci -n opensearchconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":true,"nodeToNodeEncryptionEnabled":true,"enforceHTTPS":true,"tlsSecurityPolicy":"Policy-Min-TLS-1-2-PFS-2023-10","advancedSecurityEnabled":true,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{"compliance":"pci-dss"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"ENABLED","standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: pci
                namespace: opensearchconfig
              status:
                effectiveConfig:
                  mandatory:
                    advancedSecurityEnabled: true
                    encryptionAtRestEnabled: true
