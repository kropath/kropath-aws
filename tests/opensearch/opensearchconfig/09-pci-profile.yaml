# AC-8: PCI profile with mandatory.advancedSecurityEnabled: true — used to test profile selection.
---
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: pci
  namespace: opensearchconfig
  labels:
    aws.kropath.run/resource-name: pci
spec:
  mandatory:
    encryptionAtRestEnabled: true
    nodeToNodeEncryptionEnabled: true
    enforceHTTPS: true
    tlsSecurityPolicy: "Policy-Min-TLS-1-2-PFS-2023-10"
    advancedSecurityEnabled: true
    engineVersion: ""
    autoTuneDesiredState: ""
    standbyReplicas: ""
    namingTemplate: ""
    tags:
      compliance: pci-dss
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: "OpenSearch_2.9"
    autoTuneDesiredState: "ENABLED"
    standbyReplicas: "ENABLED"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
