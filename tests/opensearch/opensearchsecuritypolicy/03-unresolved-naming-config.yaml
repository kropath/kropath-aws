#
# Config with an unresolvable {tag.nonexistent} token in naming template — for AC-11.
# When no tag named "nonexistent" is present, the token is left unresolved (contains "{").
# Theme 28 label required for externalRef selector.
---
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: unresolved-naming
  namespace: opensearchsecuritypolicy
  labels:
    aws.kropath.run/resource-name: unresolved-naming
spec:
  mandatory:
    standbyReplicas: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    standbyReplicas: "ENABLED"
    namingTemplate: "{namespace}-{tag.nonexistent}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
