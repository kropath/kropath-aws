# aws-os-03 Chainsaw tests — all 15 acceptance criteria for OpenSearchCollection RGD (KRO-885).
# Canonical pattern: spec.skipDelete: true, unique resource names per step, no inter-step ACK deletes.
# AC-to-scenario map: posted on Multica issue b104e050-552e-4fed-9135-916c424b2691 (Theme 19-2).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: opensearchcollection
spec:
  skipDelete: true
  namespace: opensearchcollection
  steps:
    # ── Setup: namespace + shared configs ───────────────────────────────────────

    - name: setup-namespace-and-configs
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - apply:
            file: 02-mandatory-standby-config.yaml
        - apply:
            file: 03-unresolved-naming-config.yaml
        - apply:
            file: 04-mandatory-tags-config.yaml
        - apply:
            file: 05-synced-labels-config.yaml
        # Inject status.effectiveConfig — test cluster runs kro but NOT kropath-controller,
        # so effectiveConfig must be manually seeded (follows DynamoDB canonical pattern).
        - script:
            content: |
              NS=opensearchcollection
              kubectl patch opensearchconfig general-policy -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-standby -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"standbyReplicas":"ENABLED","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig unresolved-naming -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{tag.nonexistent}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-tags -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"standbyReplicas":"","namingTemplate":"","tags":{"team":"search"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig synced-labels -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{"environment":"staging"},"syncedAnnotations":{}},"defaults":{"standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        # Verify Theme 28 label present on configs as sanity check
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: general-policy
                namespace: opensearchcollection
                labels:
                  aws.kropath.run/resource-name: general-policy

    # ── AC-1: collection type SEARCH (default) ──────────────────────────────────
    # Given: instance spec.type: "SEARCH"
    # When: OpenSearchCollection CR applied
    # Then: ACK Collection spec.type: "SEARCH"

    - name: ac1-type-search
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac1
                namespace: opensearchcollection
              spec:
                configRef: general-policy
                type: SEARCH
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac1
                namespace: opensearchcollection
              spec:
                type: SEARCH

    # ── AC-2: collection type VECTORSEARCH ──────────────────────────────────────
    # Given: instance spec.type: "VECTORSEARCH"
    # When: OpenSearchCollection CR applied
    # Then: ACK Collection spec.type: "VECTORSEARCH"

    - name: ac2-type-vectorsearch
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac2
                namespace: opensearchcollection
              spec:
                configRef: general-policy
                type: VECTORSEARCH
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac2
                namespace: opensearchcollection
              spec:
                type: VECTORSEARCH

    # ── AC-3: collection type TIMESERIES ────────────────────────────────────────
    # Given: instance spec.type: "TIMESERIES"
    # When: OpenSearchCollection CR applied
    # Then: ACK Collection spec.type: "TIMESERIES"

    - name: ac3-type-timeseries
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac3
                namespace: opensearchcollection
              spec:
                configRef: general-policy
                type: TIMESERIES
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac3
                namespace: opensearchcollection
              spec:
                type: TIMESERIES

    # ── AC-4: mandatory.standbyReplicas wins over instance ──────────────────────
    # Given: mandatory.standbyReplicas: "ENABLED"; instance spec.standbyReplicas: "DISABLED"
    # When: OpenSearchCollection CR applied
    # Then: ACK Collection spec.standbyReplicas: "ENABLED" (mandatory wins)

    - name: ac4-standby-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac4
                namespace: opensearchcollection
              spec:
                configRef: mandatory-standby
                standbyReplicas: DISABLED
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac4
                namespace: opensearchcollection
              spec:
                standbyReplicas: ENABLED

    # ── AC-5: defaults.standbyReplicas applied when instance not set ─────────────
    # Given: defaults.standbyReplicas: "ENABLED"; instance spec.standbyReplicas not set (= "")
    # When: OpenSearchCollection CR applied
    # Then: ACK Collection spec.standbyReplicas: "ENABLED" (defaults applied)

    - name: ac5-standby-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac5
                namespace: opensearchcollection
              spec:
                configRef: general-policy
                # standbyReplicas intentionally absent — schema default "" lets defaults kick in
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac5
                namespace: opensearchcollection
              spec:
                standbyReplicas: ENABLED

    # ── AC-6: instance.standbyReplicas wins over defaults ───────────────────────
    # Given: defaults.standbyReplicas: "ENABLED"; instance spec.standbyReplicas: "DISABLED"
    # When: OpenSearchCollection CR applied
    # Then: ACK Collection spec.standbyReplicas: "DISABLED" (instance wins over defaults)

    - name: ac6-standby-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac6
                namespace: opensearchcollection
              spec:
                configRef: general-policy
                standbyReplicas: DISABLED
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac6
                namespace: opensearchcollection
              spec:
                standbyReplicas: DISABLED

    # ── AC-7: description passthrough ───────────────────────────────────────────
    # Given: instance spec.description: "Vector search for product catalog embeddings"
    # When: OpenSearchCollection CR applied
    # Then: ACK Collection spec.description: "Vector search for product catalog embeddings"

    - name: ac7-description
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac7
                namespace: opensearchcollection
              spec:
                configRef: general-policy
                description: "Vector search for product catalog embeddings"
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac7
                namespace: opensearchcollection
              spec:
                description: "Vector search for product catalog embeddings"

    # ── AC-8: naming template {namespace}-{name} ─────────────────────────────────
    # Given: namespace=opensearchcollection, CR name=embeddings; defaults.namingTemplate="{namespace}-{name}"
    # When: OpenSearchCollection reconciled
    # Then: status.resourceName: "opensearchcollection-embeddings"

    - name: ac8-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: embeddings
                namespace: opensearchcollection
              spec:
                configRef: general-policy
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: embeddings
                namespace: opensearchcollection
              status:
                resourceName: opensearchcollection-embeddings
                namingStatus: valid
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: embeddings
                namespace: opensearchcollection
              spec:
                name: opensearchcollection-embeddings

    # ── AC-9: spec.nameOverride bypasses naming template ──────────────────────────
    # Given: spec.nameOverride: "custom-collection"
    # When: OpenSearchCollection reconciled
    # Then: status.resourceName: "custom-collection"; naming template bypassed

    - name: ac9-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac9
                namespace: opensearchcollection
              spec:
                configRef: general-policy
                nameOverride: custom-collection
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac9
                namespace: opensearchcollection
              status:
                resourceName: custom-collection
                namingStatus: valid
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac9
                namespace: opensearchcollection
              spec:
                name: custom-collection

    # ── AC-10: unresolved naming token → invalid-unresolved-tokens ───────────────
    # Given: namingTemplate="{namespace}-{tag.nonexistent}-{name}" but tag "nonexistent" absent
    # When: OpenSearchCollection reconciled
    # Then: status.namingStatus: "invalid-unresolved-tokens"; ACK Collection NOT created

    - name: ac10-naming-unresolved
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac10
                namespace: opensearchcollection
              spec:
                configRef: unresolved-naming
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac10
                namespace: opensearchcollection
              status:
                namingStatus: invalid-unresolved-tokens

    # ── AC-11: tags merge (mandatory wins on key conflict) ───────────────────────
    # Given: mandatory.tags={team:search}; instance spec.tags={app:embeddings}
    # When: OpenSearchCollection reconciled
    # Then: ACK Collection spec.tags contains both {team:search} and {app:embeddings}

    - name: ac11-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac11
                namespace: opensearchcollection
              spec:
                configRef: mandatory-tags
                tags:
                  app: embeddings
        - assert:
            timeout: 90s
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac11
                namespace: opensearchcollection
        # Tags list order is non-deterministic — use jq for order-independent assertions.
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 12); do
                TAGS=$(kubectl get collections.opensearchserverless.services.k8s.aws acosc-ac11 -n opensearchcollection -o json 2>/dev/null | jq '.spec.tags // empty')
                if [ -n "$TAGS" ]; then break; fi
                sleep 2
              done
              echo "$TAGS" | jq -e 'map(select(.key == "team" and .value == "search")) | length == 1' || { echo "FAIL: missing {key:team, value:search}"; exit 1; }
              echo "$TAGS" | jq -e 'map(select(.key == "app" and .value == "embeddings")) | length == 1' || { echo "FAIL: missing {key:app, value:embeddings}"; exit 1; }
              echo "PASS: both expected tags present"

    # ── AC-12: syncedLabels written to metadata.labels and cloud tags ─────────────
    # Given: mandatory.syncedLabels={environment:staging}
    # When: OpenSearchCollection reconciled
    # Then: ACK Collection metadata.labels contains aws.kropath.run/environment:staging
    #       AND spec.tags contains {key:environment, value:staging}

    - name: ac12-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac12
                namespace: opensearchcollection
              spec:
                configRef: synced-labels
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac12
                namespace: opensearchcollection
                labels:
                  aws.kropath.run/environment: staging
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 12); do
                TAGS=$(kubectl get collections.opensearchserverless.services.k8s.aws acosc-ac12 -n opensearchcollection -o json 2>/dev/null | jq '.spec.tags // empty')
                if [ -n "$TAGS" ]; then break; fi
                sleep 2
              done
              echo "$TAGS" | jq -e 'map(select(.key == "environment" and .value == "staging")) | length == 1' || { echo "FAIL: missing {key:environment, value:staging} in cloud tags"; exit 1; }
              echo "PASS: environment:staging present in cloud tags"

    # ── AC-13: standard child resource metadata ──────────────────────────────────
    # Given: any collection CR
    # When: ACK Collection child inspected
    # Then: managed-by:kro, instance:<cr-name>, deletion-policy:retain, ownerRef→OpenSearchCollection

    - name: ac13-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac13
                namespace: opensearchcollection
              spec:
                configRef: general-policy
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac13
                namespace: opensearchcollection
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: acosc-ac13
                annotations:
                  services.k8s.aws/deletion-policy: retain
                ownerReferences:
                  - apiVersion: aws.kropath.run/v1alpha1
                    kind: OpenSearchCollection
                    name: acosc-ac13
                    controller: true
                    blockOwnerDeletion: true

    # ── AC-14: deletionPolicy=delete → annotation delete ──────────────────────────
    # Given: spec.deletionPolicy: "delete"
    # When: OpenSearchCollection CR applied
    # Then: ACK Collection annotation services.k8s.aws/deletion-policy: delete

    - name: ac14-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac14
                namespace: opensearchcollection
              spec:
                configRef: general-policy
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac14
                namespace: opensearchcollection
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # ── AC-15: deletionPolicy=retain (default) → annotation retain ────────────────
    # Given: spec.deletionPolicy: "retain" (default)
    # When: OpenSearchCollection CR applied
    # Then: ACK Collection annotation services.k8s.aws/deletion-policy: retain

    - name: ac15-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchCollection
              metadata:
                name: acosc-ac15
                namespace: opensearchcollection
              spec:
                configRef: general-policy
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: opensearchserverless.services.k8s.aws/v1alpha1
              kind: Collection
              metadata:
                name: acosc-ac15
                namespace: opensearchcollection
                annotations:
                  services.k8s.aws/deletion-policy: retain
