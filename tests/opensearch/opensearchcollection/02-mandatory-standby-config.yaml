# Config with mandatory.standbyReplicas=ENABLED — for AC-4 (mandatory wins over instance DISABLED).
# Theme 28 label required for externalRef selector.
---
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: mandatory-standby
  namespace: opensearchcollection
  labels:
    aws.kropath.run/resource-name: mandatory-standby
spec:
  mandatory:
    standbyReplicas: "ENABLED"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    standbyReplicas: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
