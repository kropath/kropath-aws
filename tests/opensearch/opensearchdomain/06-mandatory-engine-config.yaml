# mandatory.engineVersion: "OpenSearch_2.11" — tests AC-11 (mandatory engine wins).
---
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: mandatory-engine
  namespace: opensearchdomain
  labels:
    aws.kropath.run/resource-name: mandatory-engine
spec:
  mandatory:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: "OpenSearch_2.11"
    autoTuneDesiredState: ""
    standbyReplicas: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: "OpenSearch_2.9"
    autoTuneDesiredState: ""
    standbyReplicas: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
