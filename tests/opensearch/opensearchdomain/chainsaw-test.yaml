# aws-os-02 Chainsaw tests — all 34 acceptance criteria for OpenSearchDomain RGD (KRO-807).
# Canonical pattern: spec.skipDelete: true, unique resource names per step, no inter-step ACK deletes.
# AC-to-scenario map: posted on Multica issue 935cc54d-9596-4805-98e5-3dec45509e5f (Theme 19-2).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: opensearchdomain
spec:
  skipDelete: true
  namespace: opensearchdomain
  steps:
    # ── Setup: namespace + shared configs ───────────────────────────────────────

    - name: setup-namespace-and-configs
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - apply:
            file: 02-mandatory-encryption-config.yaml
        - apply:
            file: 03-mandatory-n2n-config.yaml
        - apply:
            file: 04-mandatory-https-tls-config.yaml
        - apply:
            file: 05-mandatory-fgac-config.yaml
        - apply:
            file: 06-mandatory-engine-config.yaml
        - apply:
            file: 07-mandatory-autotune-config.yaml
        - apply:
            file: 08-mandatory-naming-config.yaml
        - apply:
            file: 09-mandatory-tags-config.yaml
        - apply:
            file: 10-unresolved-naming-config.yaml
        - apply:
            file: 11-synced-labels-config.yaml
        # Inject status.effectiveConfig — test cluster runs kro but NOT kropath-controller,
        # so effectiveConfig must be manually seeded (follows DynamoDB canonical pattern).
        - script:
            content: |
              NS=opensearchdomain
              kubectl patch opensearchconfig general-policy -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":true,"nodeToNodeEncryptionEnabled":true,"enforceHTTPS":true,"tlsSecurityPolicy":"Policy-Min-TLS-1-2-2019-07","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"ENABLED","standbyReplicas":"ENABLED","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-encryption -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":true,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-n2n -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":true,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-https-tls -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":true,"tlsSecurityPolicy":"Policy-Min-TLS-1-2-PFS-2023-10","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-fgac -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":true,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-engine -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.11","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-autotune -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"DISABLED","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-naming -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"kr-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig mandatory-tags -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{"env":"staging"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig unresolved-naming -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{tag.nonexistent}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch opensearchconfig synced-labels -n "$NS" --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionAtRestEnabled":false,"nodeToNodeEncryptionEnabled":false,"enforceHTTPS":false,"tlsSecurityPolicy":"","advancedSecurityEnabled":false,"engineVersion":"OpenSearch_2.9","autoTuneDesiredState":"","standbyReplicas":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{"team":"platform"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        # Verify Theme 28 label present on one config as sanity check
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchConfig
              metadata:
                name: general-policy
                namespace: opensearchdomain
                labels:
                  aws.kropath.run/resource-name: general-policy

    # ── AC-1: encryptionAtRest from defaults ────────────────────────────────────
    # Given: general-policy (defaults.encryptionAtRestEnabled: true, mandatory sentinel false)
    # When: OpenSearchDomain with no explicit encryptionAtRestEnabled
    # Then: ACK Domain spec.encryptionAtRestOptions.enabled: true

    - name: ac1-encryption-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac1
                namespace: opensearchdomain
              spec:
                configRef: general-policy
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: acosd-ac1-naming
                namespace: opensearchdomain
              data:
                effectiveName: opensearchdomain-acosd-ac1
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac1
                namespace: opensearchdomain
              spec:
                encryptionAtRestOptions:
                  enabled: true

    # ── AC-2: mandatory encryptionAtRest overrides instance false ───────────────
    # Given: mandatory-encryption (mandatory.encryptionAtRestEnabled: true)
    # When: OpenSearchDomain with no explicit encryptionAtRestEnabled
    # Then: ACK Domain enabled: true (mandatory wins)

    - name: ac2-encryption-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac2
                namespace: opensearchdomain
              spec:
                configRef: mandatory-encryption
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac2
                namespace: opensearchdomain
              spec:
                encryptionAtRestOptions:
                  enabled: true

    # ── AC-3: KMS key ID passthrough ────────────────────────────────────────────
    # Given: general-policy, encryptionAtRestKmsKeyID set in instance spec
    # When: OpenSearchDomain applied
    # Then: ACK Domain spec.encryptionAtRestOptions.kmsKeyID reflects the provided key ID

    - name: ac3-encryption-cmk
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac3
                namespace: opensearchdomain
              spec:
                configRef: general-policy
                encryptionAtRestKmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/test-key-id"
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac3
                namespace: opensearchdomain
              spec:
                encryptionAtRestOptions:
                  kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/test-key-id"

    # ── AC-4: nodeToNode from mandatory ─────────────────────────────────────────
    # Given: mandatory-n2n (mandatory.nodeToNodeEncryptionEnabled: true)
    # When: OpenSearchDomain applied
    # Then: ACK Domain spec.nodeToNodeEncryptionOptions.enabled: true

    - name: ac4-n2n-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac4
                namespace: opensearchdomain
              spec:
                configRef: mandatory-n2n
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac4
                namespace: opensearchdomain
              spec:
                nodeToNodeEncryptionOptions:
                  enabled: true

    # ── AC-5: enforceHTTPS + tlsSecurityPolicy from mandatory ──────────────────
    # Given: mandatory-https-tls (mandatory.enforceHTTPS: true, mandatory.tlsSecurityPolicy: PFS)
    # When: OpenSearchDomain applied
    # Then: ACK Domain enforceHTTPS: true, tlsSecurityPolicy: PFS policy

    - name: ac5-https-tls-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac5
                namespace: opensearchdomain
              spec:
                configRef: mandatory-https-tls
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac5
                namespace: opensearchdomain
              spec:
                domainEndpointOptions:
                  enforceHTTPS: true
                  tlsSecurityPolicy: "Policy-Min-TLS-1-2-PFS-2023-10"

    # ── AC-6: enforceHTTPS + tlsSecurityPolicy from defaults ──────────────────
    # Given: general-policy (defaults.enforceHTTPS: true, defaults.tlsSecurityPolicy: 2019-07)
    # When: OpenSearchDomain applied
    # Then: ACK Domain enforceHTTPS: true, tlsSecurityPolicy: 2019-07

    - name: ac6-https-tls-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac6
                namespace: opensearchdomain
              spec:
                configRef: general-policy
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac6
                namespace: opensearchdomain
              spec:
                domainEndpointOptions:
                  enforceHTTPS: true
                  tlsSecurityPolicy: "Policy-Min-TLS-1-2-2019-07"

    # ── AC-7: instance tlsSecurityPolicy overrides defaults ────────────────────
    # Given: general-policy (defaults.tlsSecurityPolicy: 2019-07, mandatory: "")
    # When: OpenSearchDomain with spec.tlsSecurityPolicy: "Policy-Min-TLS-1-0-2021-02"
    # Then: ACK Domain tlsSecurityPolicy: "Policy-Min-TLS-1-0-2021-02" (instance wins over defaults)

    - name: ac7-tls-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac7
                namespace: opensearchdomain
              spec:
                configRef: general-policy
                tlsSecurityPolicy: "Policy-Min-TLS-1-0-2021-02"
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac7
                namespace: opensearchdomain
              spec:
                domainEndpointOptions:
                  tlsSecurityPolicy: "Policy-Min-TLS-1-0-2021-02"

    # ── AC-8: FGAC from mandatory with masterUserARN ────────────────────────────
    # Given: mandatory-fgac (mandatory.advancedSecurityEnabled: true)
    # When: OpenSearchDomain with masterUserARN set
    # Then: ACK Domain advancedSecurityOptions.enabled: true, masterUserARN present

    - name: ac8-fgac-mandatory-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac8
                namespace: opensearchdomain
              spec:
                configRef: mandatory-fgac
                masterUserARN: "arn:aws:iam::123456789012:user/os-master"
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac8
                namespace: opensearchdomain
              spec:
                advancedSecurityOptions:
                  enabled: true
                  masterUserOptions:
                    masterUserARN: "arn:aws:iam::123456789012:user/os-master"

    # ── AC-9: FGAC enabled but no master user — advisory ConfigMap created ──────
    # Given: mandatory-fgac (mandatory.advancedSecurityEnabled: true)
    # When: OpenSearchDomain with no masterUserARN / masterUserName / masterUserPassword
    # Then: fgacNoMasterUserError advisory ConfigMap is created

    - name: ac9-fgac-no-master-user
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac9
                namespace: opensearchdomain
              spec:
                configRef: mandatory-fgac
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: acosd-ac9-fgac-no-master-user-error
                namespace: opensearchdomain
              data:
                error: "advancedSecurityEnabled requires masterUserARN, or masterUserName + masterUserPassword"

    # ── AC-10: instance FGAC + internalUserDatabaseEnabled ────────────────────
    # Given: general-policy (defaults.advancedSecurityEnabled: false, mandatory sentinel false)
    # When: OpenSearchDomain with advancedSecurityEnabled: true, internalUserDatabaseEnabled: true,
    #       masterUserName + masterUserPassword set
    # Then: ACK Domain advancedSecurityOptions.enabled: true, internalUserDatabaseEnabled: true

    - name: ac10-fgac-instance-userdb
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac10
                namespace: opensearchdomain
              spec:
                configRef: general-policy
                advancedSecurityEnabled: true
                internalUserDatabaseEnabled: true
                masterUserName: "admin"
                masterUserPassword:
                  name: os-master-secret
                  key: password
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac10
                namespace: opensearchdomain
              spec:
                advancedSecurityOptions:
                  enabled: true
                  internalUserDatabaseEnabled: true
                  masterUserOptions:
                    masterUserName: "admin"

    # ── AC-11: engineVersion from mandatory ─────────────────────────────────────
    # Given: mandatory-engine (mandatory.engineVersion: "OpenSearch_2.11",
    #         defaults.engineVersion: "")
    # When: OpenSearchDomain applied (instance engineVersion "")
    # Then: ACK Domain spec.engineVersion: "OpenSearch_2.11"

    - name: ac11-engine-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac11
                namespace: opensearchdomain
              spec:
                configRef: mandatory-engine
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac11
                namespace: opensearchdomain
              spec:
                engineVersion: "OpenSearch_2.11"

    # ── AC-12: engineVersion from defaults ──────────────────────────────────────
    # Given: general-policy (defaults.engineVersion: "OpenSearch_2.9", mandatory: "")
    # When: OpenSearchDomain applied (instance engineVersion "")
    # Then: ACK Domain spec.engineVersion: "OpenSearch_2.9"

    - name: ac12-engine-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac12
                namespace: opensearchdomain
              spec:
                configRef: general-policy
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac12
                namespace: opensearchdomain
              spec:
                engineVersion: "OpenSearch_2.9"

    # ── AC-13: autoTuneDesiredState from mandatory ──────────────────────────────
    # Given: mandatory-autotune (mandatory.autoTuneDesiredState: "DISABLED",
    #         defaults.autoTuneDesiredState: "")
    # When: OpenSearchDomain applied
    # Then: ACK Domain autoTuneOptions.desiredState: "DISABLED"

    - name: ac13-autotune-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac13
                namespace: opensearchdomain
              spec:
                configRef: mandatory-autotune
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac13
                namespace: opensearchdomain
              spec:
                autoTuneOptions:
                  desiredState: "DISABLED"

    # ── AC-14: autoTuneDesiredState from defaults ───────────────────────────────
    # Given: general-policy (defaults.autoTuneDesiredState: "ENABLED", mandatory: "")
    # When: OpenSearchDomain applied (instance autoTuneDesiredState "")
    # Then: ACK Domain autoTuneOptions.desiredState: "ENABLED"

    - name: ac14-autotune-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac14
                namespace: opensearchdomain
              spec:
                configRef: general-policy
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac14
                namespace: opensearchdomain
              spec:
                autoTuneOptions:
                  desiredState: "ENABLED"

    # ── AC-15: cluster topology passthrough ─────────────────────────────────────
    # Given: general-policy
    # When: OpenSearchDomain with instanceType, instanceCount, dedicatedMaster, zoneAwareness
    # Then: ACK Domain clusterConfig reflects the instance spec values

    - name: ac15-cluster-topology
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac15
                namespace: opensearchdomain
              spec:
                configRef: general-policy
                instanceType: "r6g.large.search"
                instanceCount: 3
                dedicatedMasterEnabled: true
                dedicatedMasterType: "r6g.large.search"
                dedicatedMasterCount: 3
                zoneAwarenessEnabled: true
                availabilityZoneCount: 3
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac15
                namespace: opensearchdomain
              spec:
                clusterConfig:
                  instanceType: "r6g.large.search"
                  instanceCount: 3
                  dedicatedMasterEnabled: true
                  dedicatedMasterType: "r6g.large.search"
                  dedicatedMasterCount: 3
                  zoneAwarenessEnabled: true
                  zoneAwarenessConfig:
                    availabilityZoneCount: 3

    # ── AC-16: multiAZWithStandby passthrough ───────────────────────────────────
    # Given: general-policy
    # When: OpenSearchDomain with multiAZWithStandbyEnabled: true
    # Then: ACK Domain clusterConfig.multiAZWithStandbyEnabled: true

    - name: ac16-multi-az-standby
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac16
                namespace: opensearchdomain
              spec:
                configRef: general-policy
                multiAZWithStandbyEnabled: true
                instanceType: "r6g.2xlarge.search"
                instanceCount: 3
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
