    # ── AC-28: tags merge — mandatory wins on key collision ─────────────────────
    # Given: mandatory-tags (mandatory.tags: {env: prod}, defaults.tags: {env: staging})
    # When: OpenSearchDomain with spec.tags: {team: search}
    # Then: ACK Domain spec.tags contains key=env value=prod (mandatory wins) and key=team value=search
    # Note: tags are array[{key,value}] — assert via script+jq (frequent-rgd-errors.md)

    - name: ac28-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: OpenSearchDomain
              metadata:
                name: acosd-ac28
                namespace: opensearchdomain
              spec:
                configRef: mandatory-tags
                tags:
                  team: search
        - assert:
            resource:
              apiVersion: opensearchservice.services.k8s.aws/v1alpha1
              kind: Domain
              metadata:
                name: acosd-ac28
                namespace: opensearchdomain
        - script:
            content: |
              TAGS=$(kubectl get domain acosd-ac28 -n opensearchdomain -o json | jq -r '.spec.tags // []')
              ENV_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key == "env") | .value')
              TEAM_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key == "team") | .value')
              if [ "$ENV_VAL" != "prod" ]; then
                echo "FAIL: expected env=prod but got env=$ENV_VAL (mandatory should win over defaults)"
                exit 1
              fi
              if [ "$TEAM_VAL" != "search" ]; then
                echo "FAIL: expected team=search but got team=$TEAM_VAL (instance tag not merged)"
                exit 1
              fi
              echo "PASS: tags merged correctly"

