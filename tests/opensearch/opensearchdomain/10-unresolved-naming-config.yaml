# defaults.namingTemplate with unresolvable {tag.nonexistent} — tests AC-27 (invalid naming).
---
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: unresolved-naming
  namespace: opensearchdomain
  labels:
    aws.kropath.run/resource-name: unresolved-naming
spec:
  mandatory:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: ""
    autoTuneDesiredState: ""
    standbyReplicas: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: "OpenSearch_2.9"
    autoTuneDesiredState: ""
    standbyReplicas: ""
    namingTemplate: "{namespace}-{tag.nonexistent}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
