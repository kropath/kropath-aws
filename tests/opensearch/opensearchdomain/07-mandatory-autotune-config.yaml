# mandatory.autoTuneDesiredState: "DISABLED" — tests AC-13 (mandatory auto-tune wins).
---
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: mandatory-autotune
  namespace: opensearchdomain
  labels:
    aws.kropath.run/resource-name: mandatory-autotune
spec:
  mandatory:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: ""
    autoTuneDesiredState: "DISABLED"
    standbyReplicas: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: "OpenSearch_2.9"
    autoTuneDesiredState: "ENABLED"
    standbyReplicas: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
