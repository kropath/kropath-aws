# defaults.syncedLabels: {team: platform} — tests AC-29 (syncedLabels written to cloud tags).
---
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: synced-labels
  namespace: opensearchdomain
  labels:
    aws.kropath.run/resource-name: synced-labels
spec:
  mandatory:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: ""
    autoTuneDesiredState: ""
    standbyReplicas: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionAtRestEnabled: false
    nodeToNodeEncryptionEnabled: false
    enforceHTTPS: false
    tlsSecurityPolicy: ""
    advancedSecurityEnabled: false
    engineVersion: "OpenSearch_2.9"
    autoTuneDesiredState: ""
    standbyReplicas: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels:
      team: platform
    syncedAnnotations: {}
