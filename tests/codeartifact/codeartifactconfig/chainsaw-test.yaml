# aws-codeartifact-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: codeartifactconfig
spec:
  skipDelete: true
  namespace: codeartifactconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-codeartifactconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: general-policy
                namespace: codeartifactconfig
              spec:
                defaults:
                  encryptionKey: ""
                  namingTemplate: "{namespace}-{name}"

    - name: ac2-reject-both-tiers-encryptionkey
      try:
        - apply:
            file: 02-invalid-both-tiers-encryptionkey.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CodeArtifactConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-namingtemplate
      try:
        - apply:
            file: 03-invalid-both-tiers-namingtemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CodeArtifactConfig
                check:
                  ($error != null): true

    - name: ac4-effective-config-merge
      try:
        - apply:
            file: 00-codeartifactconfig-namespace.yaml
        - apply:
            file: 04-global-kropathconfig.yaml
        - apply:
            file: 05-local-general-policy.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory.tags win; CodeArtifactConfig mandatory.syncedLabels merged in;
              # defaults.namingTemplate and defaults.tags from CodeArtifactConfig; mandatory.encryptionKey from a
              # would-be KropathConfig.mandatory.codeartifact.encryptionKey (simulated — codeartifact section added in controller task).
              kubectl patch codeartifactconfig general-policy -n codeartifactconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"arn:aws:kms:us-east-1:123456789012:key/abc-123","namingTemplate":"","tags":{"cost-centre":"dev-tools","security":"encrypted"},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: general-policy
                namespace: codeartifactconfig
              status:
                effectiveConfig:
                  mandatory:
                    encryptionKey: "arn:aws:kms:us-east-1:123456789012:key/abc-123"
                  defaults:
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: "us-east-1"
                    accountId: "123456789012"
            timeout: 60s

    - name: ac5-naming-template-default
      try:
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: general-policy
                namespace: codeartifactconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
            timeout: 60s

    - name: ac6-production-profile-accepted
      try:
        - apply:
            file: 06-production.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: production
                namespace: codeartifactconfig
              spec:
                mandatory:
                  encryptionKey: "arn:aws:kms:ap-southeast-2:123456789012:key/abc-123"
                  tags:
                    compliance: pci

    - name: ac7-tag-merge
      try:
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: general-policy
                namespace: codeartifactconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      cost-centre: dev-tools
                      security: encrypted
                  defaults:
                    tags:
                      team: platform
            timeout: 60s

    - name: ac8-synced-labels-propagate
      try:
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: general-policy
                namespace: codeartifactconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: internal
            timeout: 60s

    - name: ac9-dev-profile-accepted
      try:
        - apply:
            file: 07-dev.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: dev
                namespace: codeartifactconfig
              spec:
                defaults:
                  encryptionKey: ""
                  namingTemplate: "{name}"
