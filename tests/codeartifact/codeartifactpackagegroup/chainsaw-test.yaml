# aws-codeartifact-03 Chainsaw tests — one scenario per acceptance criterion.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: codeartifactpackagegroup
spec:
  skipDelete: true
  namespace: codeartifactpackagegroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: codeartifactpackagegroup

    # AC-1: domainRef resolves CodeArtifactDomain.status.resourceName for spec.domain.
    - name: ac1-domain-ref-resolves
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac1-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac1-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        # Create stub CodeArtifactDomain CR with resourceName in status.
        # Label aws.kropath.run/resource-name: shared-domain required for selector-based domainCr externalRef lookup.
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactDomain
              metadata:
                name: shared-domain
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: shared-domain
              spec:
                configRef: ac1-cfg
        - script:
            content: |
              kubectl patch codeartifactdomain shared-domain -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"resourceName":"codeartifactpackagegroup-shared-domain","namingStatus":"valid","predictedArn":"arn:aws:codeartifact:ap-southeast-2:123456789012:domain/codeartifactpackagegroup-shared-domain"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac1-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac1-cfg
                pattern: "npm/*"
                domainRef: shared-domain
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac1-pg
                namespace: codeartifactpackagegroup
              spec:
                pattern: "npm/*"
                domain: codeartifactpackagegroup-shared-domain

    # AC-2: spec.domain used directly when domainRef is empty.
    - name: ac2-domain-direct
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac2-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac2-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac2-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac2-cfg
                pattern: "pypi/*"
                domain: my-existing-domain
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac2-pg
                namespace: codeartifactpackagegroup
              spec:
                pattern: "pypi/*"
                domain: my-existing-domain

    # AC-3: Both domain and domainRef set → advisory validationError ConfigMap rendered.
    - name: ac3-both-domain-and-domainref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac3-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac3-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac3-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac3-cfg
                pattern: "maven/*"
                domain: my-domain
                domainRef: shared-domain
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac3-pg-validation-error
                namespace: codeartifactpackagegroup
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac3-pg
                namespace: codeartifactpackagegroup
              status:
                (validationError != ""): true

    # AC-4: Both domain and domainRef empty — no variant selects; advisory test documents the constraint.
    - name: ac4-both-domain-fields-empty
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac4-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac4-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac4-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac4-cfg
                pattern: "npm/empty-domain-test"
                # domain and domainRef both omitted — ACK will fail with "domain is required"
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac4-pg
                namespace: codeartifactpackagegroup
              spec:
                domain: ""

    # AC-5: pattern immutability — enforced by ACK reconciler; test documents the constraint.
    # Create with npm/*, verify pattern is set correctly. ACK will reject pattern changes.
    - name: ac5-pattern-immutability-documented
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac5-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac5-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac5-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac5-cfg
                pattern: "npm/*"
                domain: my-domain
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac5-pg
                namespace: codeartifactpackagegroup
              spec:
                pattern: "npm/*"

    # AC-6: domainOwner set → ackPgWithOwnerOnly rendered with domainOwner field.
    - name: ac6-domain-owner
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac6-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac6-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac6-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac6-cfg
                pattern: "npm/shared-*"
                domain: shared-org-domain
                domainOwner: "123456789012"
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac6-pg
                namespace: codeartifactpackagegroup
              spec:
                domain: shared-org-domain
                domainOwner: "123456789012"
        # Verify contactInfo and description fields are absent (OwnerOnly variant)
        - script:
            content: |
              CI=$(kubectl get packagegroups.codeartifact.services.k8s.aws ac6-pg -n codeartifactpackagegroup -o jsonpath='{.spec.contactInfo}' 2>/dev/null)
              DESC=$(kubectl get packagegroups.codeartifact.services.k8s.aws ac6-pg -n codeartifactpackagegroup -o jsonpath='{.spec.description}' 2>/dev/null)
              if [ -n "$CI" ] || [ -n "$DESC" ]; then
                echo "FAIL: contactInfo and description should be absent; got contactInfo='$CI' description='$DESC'"
                exit 1
              fi
              echo "PASS: contactInfo and description absent from OwnerOnly variant"

    # AC-7: No optional fields → ackPgBase; contactInfo, description, domainOwner all absent.
    - name: ac7-optional-fields-absent
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac7-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac7-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac7-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac7-cfg
                pattern: "maven/org.example/*"
                domain: my-domain
                # domainOwner, contactInfo, description all absent (use defaults "")
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac7-pg
                namespace: codeartifactpackagegroup
              spec:
                pattern: "maven/org.example/*"
                domain: my-domain
        - script:
            content: |
              OWNER=$(kubectl get packagegroups.codeartifact.services.k8s.aws ac7-pg -n codeartifactpackagegroup -o jsonpath='{.spec.domainOwner}' 2>/dev/null)
              CI=$(kubectl get packagegroups.codeartifact.services.k8s.aws ac7-pg -n codeartifactpackagegroup -o jsonpath='{.spec.contactInfo}' 2>/dev/null)
              DESC=$(kubectl get packagegroups.codeartifact.services.k8s.aws ac7-pg -n codeartifactpackagegroup -o jsonpath='{.spec.description}' 2>/dev/null)
              FAIL=""
              [ -n "$OWNER" ] && FAIL="$FAIL domainOwner='$OWNER'"
              [ -n "$CI" ]    && FAIL="$FAIL contactInfo='$CI'"
              [ -n "$DESC" ]  && FAIL="$FAIL description='$DESC'"
              if [ -n "$FAIL" ]; then
                echo "FAIL: optional fields should be absent: $FAIL"
                exit 1
              fi
              echo "PASS: all optional fields absent in base variant"

    # AC-8: contactInfo and description set (no domainOwner) → ackPgWithMetaOnly.
    - name: ac8-contact-info-description
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac8-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac8-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac8-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac8-cfg
                pattern: "nuget/*"
                domain: my-domain
                contactInfo: "platform-team@example.com"
                description: "Platform team NuGet packages"
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac8-pg
                namespace: codeartifactpackagegroup
              spec:
                contactInfo: "platform-team@example.com"
                description: "Platform team NuGet packages"
        # domainOwner should be absent in MetaOnly variant
        - script:
            content: |
              OWNER=$(kubectl get packagegroups.codeartifact.services.k8s.aws ac8-pg -n codeartifactpackagegroup -o jsonpath='{.spec.domainOwner}' 2>/dev/null)
              if [ -n "$OWNER" ]; then
                echo "FAIL: domainOwner should be absent; got '$OWNER'"
                exit 1
              fi
              echo "PASS: domainOwner absent in MetaOnly variant"

    # AC-9: Tags cascade mandatory > spec > defaults.
    - name: ac9-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac9-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
                  tags:
                    cost-centre: dev-tools
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                  tags:
                    cost-centre: should-be-overridden
                    env: production
        - script:
            content: |
              kubectl patch codeartifactconfig ac9-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{"cost-centre":"dev-tools"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{"cost-centre":"should-be-overridden","env":"production"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac9-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac9-cfg
                pattern: "npm/internal-*"
                domain: my-domain
                tags:
                  team: platform
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac9-pg
                namespace: codeartifactpackagegroup
              spec:
                pattern: "npm/internal-*"
        - script:
            content: |
              TAGS=$(kubectl get packagegroups.codeartifact.services.k8s.aws ac9-pg -n codeartifactpackagegroup -o json | jq -r '[.spec.tags[] | {(.key): .value}] | add')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e '."cost-centre" == "dev-tools"' || { echo "FAIL: cost-centre should be dev-tools (mandatory wins)"; exit 1; }
              echo "$TAGS" | jq -e '."env" == "production"' || { echo "FAIL: env missing (from defaults)"; exit 1; }
              echo "$TAGS" | jq -e '."team" == "platform"' || { echo "FAIL: team missing (from spec)"; exit 1; }
              echo "PASS: tags cascade correct"

    # AC-10: syncedLabels from mandatory mapped to ACK PackageGroup labels with aws.kropath.run/ prefix.
    - name: ac10-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac10-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
                  syncedLabels:
                    data-class: internal
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac10-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac10-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac10-cfg
                pattern: "pypi/internal-*"
                domain: my-domain
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac10-pg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/data-class: internal
                  app.kubernetes.io/managed-by: kro

    # AC-11: Standard kro labels on ACK PackageGroup.
    - name: ac11-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac11-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac11-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac11-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac11-cfg
                pattern: "maven/com.example/*"
                domain: my-domain
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac11-pg
                namespace: codeartifactpackagegroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac11-pg

    # AC-12: deletionPolicy=delete → annotation services.k8s.aws/deletion-policy=delete.
    - name: ac12-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac12-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac12-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac12-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac12-cfg
                pattern: "npm/temp-*"
                domain: my-domain
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac12-pg
                namespace: codeartifactpackagegroup
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-13: deletionPolicy=retain (default) → annotation=retain.
    - name: ac13-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac13-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac13-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac13-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac13-cfg
                pattern: "nuget/stable-*"
                domain: my-domain
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac13-pg
                namespace: codeartifactpackagegroup
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-14: Naming exemption (KRO-236) — no resourceName, namingStatus, predictedArn in status.
    - name: ac14-naming-exemption
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactConfig
              metadata:
                name: ac14-cfg
                namespace: codeartifactpackagegroup
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  encryptionKey: ""
                mandatory:
                  namingTemplate: ""
                  encryptionKey: ""
        - script:
            content: |
              kubectl patch codeartifactconfig ac14-cfg -n codeartifactpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionKey":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionKey":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CodeArtifactPackageGroup
              metadata:
                name: ac14-pg
                namespace: codeartifactpackagegroup
              spec:
                configRef: ac14-cfg
                pattern: "maven/org.kropath/*"
                domain: my-domain
        # Guard: wait for kro to reconcile the graph before reading status fields.
        # Asserting the ACK child (not the kro CR's own spec) proves reconciliation ran,
        # so the absence of naming fields below is a real result, not an unwritten status.
        - assert:
            resource:
              apiVersion: codeartifact.services.k8s.aws/v1alpha1
              kind: PackageGroup
              metadata:
                name: ac14-pg
                namespace: codeartifactpackagegroup
              spec:
                pattern: "maven/org.kropath/*"
                domain: my-domain
        - script:
            content: |
              RN=$(kubectl get codeartifactpackagegroup ac14-pg -n codeartifactpackagegroup -o jsonpath='{.status.resourceName}' 2>/dev/null)
              NS=$(kubectl get codeartifactpackagegroup ac14-pg -n codeartifactpackagegroup -o jsonpath='{.status.namingStatus}' 2>/dev/null)
              PA=$(kubectl get codeartifactpackagegroup ac14-pg -n codeartifactpackagegroup -o jsonpath='{.status.predictedArn}' 2>/dev/null)
              FAIL=""
              [ -n "$RN" ] && FAIL="$FAIL resourceName='$RN'"
              [ -n "$NS" ] && FAIL="$FAIL namingStatus='$NS'"
              [ -n "$PA" ] && FAIL="$FAIL predictedArn='$PA'"
              if [ -n "$FAIL" ]; then
                echo "FAIL: naming exemption violated — naming fields should be absent: $FAIL"
                exit 1
              fi
              echo "PASS: no resourceName/namingStatus/predictedArn fields (naming exemption KRO-236)"

    # AC-15: Origin controls are status-only (not managed by kropath). Documented test only.
    # The ACK v1.6.1 controller does not map UpdatePackageGroupOriginConfiguration;
    # origin controls must be managed via AWS CLI/SDK directly.
    - name: ac15-origin-controls-status-only
      try:
        - script:
            content: |
              echo "AC-15: Origin controls are ACK status-only for v1.6.1."
              echo "       UpdatePackageGroupOriginConfiguration is not mapped by this controller version."
              echo "       Manage origin controls via AWS CLI or SDK outside kropath."
              exit 0
