# AC-1 fixture: baseline EFSConfig general-policy CR.
# AC-6 fixture: verifies all mandatory fields at zero + expected defaults.
# AC-7 fixture: carries aws.kropath.run/resource-name label for selector lookup.
---
apiVersion: aws.kropath.run/v1alpha1
kind: EFSConfig
metadata:
  name: general-policy
  namespace: efsconfig
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    encrypted: false
    kmsKeyId: ""
    performanceMode: ""
    throughputMode: ""
    backupEnabled: false
    transitionToIA: ""
    transitionToArchive: ""
    transitionToPrimaryStorage: ""
    replicationOverwriteProtection: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encrypted: true
    kmsKeyId: ""
    performanceMode: "generalPurpose"
    throughputMode: "elastic"
    backupEnabled: true
    transitionToIA: ""
    transitionToArchive: ""
    transitionToPrimaryStorage: ""
    replicationOverwriteProtection: "ENABLED"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
