# aws-efs-01 Chainsaw tests — one scenario per acceptance criterion.
# Spec: kropath-core/docs/specs/aws/aws-efs-01-efsconfig.md
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: efsconfig
spec:
  skipDelete: true
  namespace: efsconfig
  steps:
    - name: ac1-crd-install
      # AC-1: CRD installed; schema has mandatory + defaults + status.effectiveConfig.
      try:
        - apply:
            file: 00-efsconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: general-policy
                namespace: efsconfig
              spec:
                mandatory: {}
                defaults: {}

    - name: ac2-reject-both-tiers-encrypted
      # AC-2: mandatory.encrypted: true AND defaults.encrypted: true → CEL reject.
      try:
        - apply:
            file: 02-invalid-both-tiers-encrypted.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EFSConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-performanceMode
      # AC-3: mandatory.performanceMode non-empty AND defaults.performanceMode non-empty → CEL reject.
      try:
        - apply:
            file: 03-invalid-both-tiers-performanceMode.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EFSConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-transitionToIA
      # AC-4: mandatory.transitionToIA non-empty AND defaults.transitionToIA non-empty → CEL reject.
      try:
        - apply:
            file: 04-invalid-both-tiers-transitionToIA.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EFSConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-backupEnabled
      # AC-5: mandatory.backupEnabled: true AND defaults.backupEnabled: true → CEL reject.
      try:
        - apply:
            file: 05-invalid-both-tiers-backupEnabled.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EFSConfig
                check:
                  ($error != null): true

    - name: ac6-general-policy-baseline
      # AC-6: general-policy CR has all mandatory fields at zero + expected non-zero defaults.
      try:
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: general-policy
                namespace: efsconfig
              spec:
                mandatory:
                  encrypted: false
                  kmsKeyId: ""
                  performanceMode: ""
                  throughputMode: ""
                  backupEnabled: false
                  transitionToIA: ""
                  transitionToArchive: ""
                  transitionToPrimaryStorage: ""
                  replicationOverwriteProtection: ""
                defaults:
                  encrypted: true
                  performanceMode: "generalPurpose"
                  throughputMode: "elastic"
                  backupEnabled: true
                  replicationOverwriteProtection: "ENABLED"

    - name: ac7-label-selector-lookup
      # AC-7: general-policy CR carries aws.kropath.run/resource-name label for externalRef
      # matchLabels selector. This verifies the CR is discoverable by EFS RGDs using
      # selector.matchLabels.aws.kropath.run/resource-name: general-policy (Theme 28).
      try:
        - script:
            content: |
              set -eu
              label="$(kubectl get efsconfig general-policy -n efsconfig \
                -o jsonpath='{.metadata.labels.aws\.kropath\.run/resource-name}')"
              test "${label}" = "general-policy"
              echo "Label aws.kropath.run/resource-name=${label} verified"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: general-policy
                namespace: efsconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
