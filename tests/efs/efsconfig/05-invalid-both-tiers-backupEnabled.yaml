# AC-5 fixture: backupEnabled set to true in both mandatory AND defaults — CEL must reject.
---
apiVersion: aws.kropath.run/v1alpha1
kind: EFSConfig
metadata:
  name: invalid-dual-backupenabled
  namespace: efsconfig
spec:
  mandatory:
    encrypted: false
    kmsKeyId: ""
    performanceMode: ""
    throughputMode: ""
    backupEnabled: true
    transitionToIA: ""
    transitionToArchive: ""
    transitionToPrimaryStorage: ""
    replicationOverwriteProtection: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encrypted: false
    kmsKeyId: ""
    performanceMode: ""
    throughputMode: ""
    backupEnabled: true
    transitionToIA: ""
    transitionToArchive: ""
    transitionToPrimaryStorage: ""
    replicationOverwriteProtection: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
