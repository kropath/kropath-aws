    # AC-15: transitionToPrimaryStorage set → lifecyclePolicies includes transitionToPrimaryStorageClass.
    - name: ac15-lifecycle-transition-to-primary
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac15-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac15-cfg
              spec: {}
        - script:
            content: |
