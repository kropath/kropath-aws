                namespace: efsfilesystem
              spec:
                performanceMode: generalPurpose

    # AC-7: performanceMode in mandatory → ACK performanceMode set.
    - name: ac7-performancemode-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac7-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
