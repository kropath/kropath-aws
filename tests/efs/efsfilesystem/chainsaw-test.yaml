                  performanceMode: maxIO
        - script:
            content: |
              kubectl patch efsconfig ac7-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"maxIO","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac7-fs
                namespace: efsfilesystem
              spec:
                configRef: ac7-cfg
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac7-fs
                namespace: efsfilesystem
              spec:
                performanceMode: maxIO

    # AC-8: throughputMode defaults to elastic when no governance.
    - name: ac8-throughputmode-default-elastic
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac8-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec: {}
        - script:
            content: |
              kubectl patch efsconfig ac8-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac8-fs
                namespace: efsfilesystem
              spec:
                configRef: ac8-cfg
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac8-fs
                namespace: efsfilesystem
              spec:
                throughputMode: elastic

    # AC-9: throughputMode in mandatory overrides spec.
    - name: ac9-throughputmode-mandatory-overrides-spec
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac9-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  throughputMode: bursting
        - script:
            content: |
              kubectl patch efsconfig ac9-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"bursting","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac9-fs
                namespace: efsfilesystem
              spec:
                configRef: ac9-cfg
                throughputMode: elastic
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac9-fs
                namespace: efsfilesystem
              spec:
                throughputMode: bursting

    # AC-10: provisionedThroughputInMiBps pass-through (non-zero value).
    - name: ac10-provisioned-throughput-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac10-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec: {}
        - script:
            content: |
              kubectl patch efsconfig ac10-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"provisioned","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac10-fs
                namespace: efsfilesystem
              spec:
                configRef: ac10-cfg
                throughputMode: provisioned
                provisionedThroughputInMiBps: 128
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac10-fs
                namespace: efsfilesystem
              spec:
                throughputMode: provisioned
                provisionedThroughputInMiBps: 128

    # AC-11: backupEnabled in defaults → ACK backup=true.
    - name: ac11-backup-enabled-from-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac11-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  backupEnabled: true
        - script:
            content: |
              kubectl patch efsconfig ac11-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":true,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac11-fs
                namespace: efsfilesystem
              spec:
                configRef: ac11-cfg
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac11-fs
                namespace: efsfilesystem
              spec:
                backup: true

    # AC-12: backupEnabled in mandatory → ACK backup=true (overrides spec false).
    - name: ac12-backup-mandatory-overrides-spec
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac12-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                mandatory:
                  backupEnabled: true
        - script:
            content: |
              kubectl patch efsconfig ac12-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":true,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac12-fs
                namespace: efsfilesystem
              spec:
                configRef: ac12-cfg
                backupEnabled: false
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac12-fs
                namespace: efsfilesystem
              spec:
                backup: true

    # AC-13: transitionToIA set in spec → lifecyclePolicies includes transitionToIA entry.
    - name: ac13-lifecycle-transition-to-ia
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac13-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec: {}
        - script:
            content: |
              kubectl patch efsconfig ac13-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac13-fs
                namespace: efsfilesystem
              spec:
                configRef: ac13-cfg
                transitionToIA: AFTER_30_DAYS
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac13-fs
                namespace: efsfilesystem
              spec:
                lifecyclePolicies:
                  - transitionToIA: AFTER_30_DAYS

    # AC-14: transitionToArchive set in spec → lifecyclePolicies includes transitionToArchive.
    - name: ac14-lifecycle-transition-to-archive
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac14-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec: {}
        - script:
            content: |
              kubectl patch efsconfig ac14-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
