# EFSFileSystem Chainsaw tests.
# Canonical pattern: unique resource name per step, spec.skipDelete: true,
# no inter-step deletes. Test cluster runs kro but no ACK controllers, so
# ACK finalizers are never removed — deletes would hang.
# All 30 ACs are happy-path only (no negative tests for EFSFileSystem).
#
# Tag order note (from CLAUDE.md §"CEL .merge() tag output order"):
# After the defaults→spec→mandatory .merge() chain, mandatory keys come first in the list,
# then spec-only keys, then defaults-only keys. Tag assertions use jq script steps to be
# order-independent.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: efsfilesystem
spec:
  skipDelete: true
  namespace: efsfilesystem
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: When no encryption governance is set and spec.encrypted is not set,
    # ACK FileSystem spec.encrypted defaults to false.
    - name: ac1-encrypted-default-false
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac1-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec: {}
        - script:
            content: |
              kubectl patch efsconfig ac1-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac1-fs
                namespace: efsfilesystem
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac1-fs
                namespace: efsfilesystem
              spec:
                encrypted: false

    # AC-2: When defaults.encrypted=true and spec.encrypted is not set,
    # ACK FileSystem spec.encrypted=true.
    - name: ac2-encrypted-from-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac2-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  encrypted: true
        - script:
            content: |
              kubectl patch efsconfig ac2-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":true,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac2-fs
                namespace: efsfilesystem
              spec:
                configRef: ac2-cfg
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac2-fs
                namespace: efsfilesystem
              spec:
                encrypted: true

    # AC-3: When mandatory.encrypted=true, spec.encrypted=false is ignored —
    # ACK FileSystem spec.encrypted=true.
    - name: ac3-encrypted-mandatory-overrides-spec
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac3-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  encrypted: true
        - script:
            content: |
              kubectl patch efsconfig ac3-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":true,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac3-fs
                namespace: efsfilesystem
              spec:
                configRef: ac3-cfg
                encrypted: false
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac3-fs
                namespace: efsfilesystem
              spec:
                encrypted: true

    # AC-4: kmsKeyId from defaults → ACK kmsKeyID set.
    - name: ac4-kmskey-from-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac4-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  kmsKeyId: "arn:aws:kms:ap-southeast-2:123456789012:key/default-key"
        - script:
            content: |
              kubectl patch efsconfig ac4-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"arn:aws:kms:ap-southeast-2:123456789012:key/default-key","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac4-fs
                namespace: efsfilesystem
              spec:
                configRef: ac4-cfg
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac4-fs
                namespace: efsfilesystem
              spec:
                kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/default-key"

    # AC-5: kmsKeyId in mandatory overrides spec and defaults.
    - name: ac5-kmskey-mandatory-overrides
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac5-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  kmsKeyId: "arn:aws:kms:ap-southeast-2:123456789012:key/org-key"
        - script:
            content: |
              kubectl patch efsconfig ac5-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"arn:aws:kms:ap-southeast-2:123456789012:key/org-key","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"arn:aws:kms:ap-southeast-2:123456789012:key/default-key","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac5-fs
                namespace: efsfilesystem
              spec:
                configRef: ac5-cfg
                kmsKeyId: "arn:aws:kms:ap-southeast-2:123456789012:key/instance-key"
        - assert:
            resource:
              apiVersion: efs.services.k8s.aws/v1alpha1
              kind: FileSystem
              metadata:
                name: ac5-fs
                namespace: efsfilesystem
              spec:
                kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/org-key"

    # AC-6: performanceMode defaults to generalPurpose when no governance is set.
    - name: ac6-performancemode-default-generalpurpose
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSConfig
              metadata:
                name: ac6-cfg
                namespace: efsfilesystem
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec: {}
        - script:
            content: |
              kubectl patch efsconfig ac6-cfg -n efsfilesystem \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encrypted":false,"kmsKeyId":"","performanceMode":"","throughputMode":"","backupEnabled":false,"transitionToIA":"","transitionToArchive":"","transitionToPrimaryStorage":"","replicationOverwriteProtection":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EFSFileSystem
              metadata:
                name: ac6-fs
                namespace: efsfilesystem
              spec:
                configRef: ac6-cfg
        - assert:
