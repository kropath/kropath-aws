---
# AC-6: healthCheckGracePeriod non-zero in BOTH mandatory (600) and defaults (300) — must be rejected.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: invalid-both-tiers-hcperiod
  namespace: autoscalingconfig
spec:
  mandatory:
    newInstancesProtectedFromScaleIn: false
    capacityRebalance: false
    healthCheckType: ""
    healthCheckGracePeriod: 600
    maxInstanceLifetime: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    newInstancesProtectedFromScaleIn: false
    capacityRebalance: false
    healthCheckType: ""
    healthCheckGracePeriod: 300
    maxInstanceLifetime: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
