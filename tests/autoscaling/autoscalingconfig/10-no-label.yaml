---
# AC-10: AutoScalingConfig CR created WITHOUT explicit aws.kropath.run/resource-name label.
# The controller label operator should add the label on reconcile.
# Test simulates this by applying the CR and then using kubectl label to add it (controller simulation).
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: no-label-config
  namespace: autoscalingconfig
spec:
  mandatory:
    newInstancesProtectedFromScaleIn: false
    capacityRebalance: false
    healthCheckType: ""
    healthCheckGracePeriod: 0
    maxInstanceLifetime: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    newInstancesProtectedFromScaleIn: false
    capacityRebalance: false
    healthCheckType: "EC2"
    healthCheckGracePeriod: 300
    maxInstanceLifetime: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
