# aws-autoscaling-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: autoscalingconfig
spec:
  skipDelete: true
  namespace: autoscalingconfig
  steps:
    # AC-1: happy-path: config-create-mandatory-only
    - name: ac1-config-create-mandatory-only
      try:
        - apply:
            file: 00-autoscalingconfig-namespace.yaml
        - apply:
            file: 01-mandatory-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AutoScalingConfig
              metadata:
                name: mandatory-only
                namespace: autoscalingconfig
              spec:
                mandatory:
                  newInstancesProtectedFromScaleIn: true
                  capacityRebalance: true
                  healthCheckType: "EC2,ELB"
                  healthCheckGracePeriod: 600
                  maxInstanceLifetime: 604800
                  namingTemplate: "{name}"
                defaults:
                  newInstancesProtectedFromScaleIn: false
                  healthCheckType: ""
                  healthCheckGracePeriod: 0
                  maxInstanceLifetime: 0
                  namingTemplate: ""

    # AC-2: happy-path: config-create-defaults-only
    - name: ac2-config-create-defaults-only
      try:
        - apply:
            file: 02-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AutoScalingConfig
              metadata:
                name: defaults-only
                namespace: autoscalingconfig
              spec:
                mandatory:
                  newInstancesProtectedFromScaleIn: false
                  healthCheckType: ""
                  healthCheckGracePeriod: 0
                  maxInstanceLifetime: 0
                  namingTemplate: ""
                defaults:
                  newInstancesProtectedFromScaleIn: true
                  capacityRebalance: true
                  healthCheckType: "EC2"
                  healthCheckGracePeriod: 300
                  maxInstanceLifetime: 86400
                  namingTemplate: "{namespace}-{name}"

    # AC-3: negative: config-mutual-exclusion-scaleInProtection
    - name: ac3-config-mutual-exclusion-scaleInProtection
      try:
        - apply:
            file: 03-invalid-both-tiers-scaleInProtection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: AutoScalingConfig
                check:
                  ($error != null): true

    # AC-4: negative: config-mutual-exclusion-capacityRebalance
    - name: ac4-config-mutual-exclusion-capacityRebalance
      try:
        - apply:
            file: 04-invalid-both-tiers-capacityRebalance.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: AutoScalingConfig
                check:
                  ($error != null): true

    # AC-5: negative: config-mutual-exclusion-healthCheckType
    - name: ac5-config-mutual-exclusion-healthCheckType
      try:
        - apply:
            file: 05-invalid-both-tiers-healthCheckType.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: AutoScalingConfig
                check:
                  ($error != null): true

    # AC-6: negative: config-mutual-exclusion-healthCheckGracePeriod
    - name: ac6-config-mutual-exclusion-healthCheckGracePeriod
      try:
        - apply:
            file: 06-invalid-both-tiers-healthCheckGracePeriod.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: AutoScalingConfig
                check:
                  ($error != null): true

    # AC-7: negative: config-mutual-exclusion-maxInstanceLifetime
    - name: ac7-config-mutual-exclusion-maxInstanceLifetime
      try:
        - apply:
            file: 07-invalid-both-tiers-maxInstanceLifetime.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: AutoScalingConfig
                check:
                  ($error != null): true

    # AC-8: negative: config-mutual-exclusion-namingTemplate
    - name: ac8-config-mutual-exclusion-namingTemplate
      try:
        - apply:
            file: 08-invalid-both-tiers-namingTemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: AutoScalingConfig
                check:
                  ($error != null): true

    # AC-9: happy-path: general-policy-baseline
    - name: ac9-general-policy-baseline
      try:
        - apply:
            file: 09-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AutoScalingConfig
              metadata:
                name: general-policy
                namespace: autoscalingconfig
              spec:
                mandatory:
                  newInstancesProtectedFromScaleIn: false
                  capacityRebalance: false
                  healthCheckType: ""
                  healthCheckGracePeriod: 0
                  maxInstanceLifetime: 0
                  namingTemplate: ""
                defaults:
                  healthCheckType: "EC2"
                  healthCheckGracePeriod: 300
                  namingTemplate: "{namespace}-{name}"

    # AC-10: happy-path: config-label-injection
    # Apply a CR without the label; simulate the controller label operator by adding
    # the label via kubectl, then assert it is present.
    - name: ac10-config-label-injection
      try:
        - apply:
            file: 10-no-label.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AutoScalingConfig
              metadata:
                name: no-label-config
                namespace: autoscalingconfig
        - script:
            content: |
              # Simulate the kropath-controller label operator injecting the resource-name label.
              kubectl label autoscalingconfig no-label-config \
                -n autoscalingconfig \
                aws.kropath.run/resource-name=no-label-config \
                --overwrite
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AutoScalingConfig
              metadata:
                name: no-label-config
                namespace: autoscalingconfig
                labels:
                  aws.kropath.run/resource-name: no-label-config
            timeout: 30s
