# unresolved-token-cfg: mandatory.namingTemplate with unresolvable {tag.missing} token. (AC-40)
# defaults.namingTemplate must be "" when mandatory.namingTemplate is set (mutual exclusion CRD rule).
# The {tag.missing} token has no corresponding tag in any tier, so namingStatus becomes
# "invalid-unresolved-tokens" and predictedArn is empty.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: unresolved-token-cfg
  namespace: autoscalinggroup
  labels:
    aws.kropath.run/resource-name: unresolved-token-cfg
spec:
  mandatory:
    newInstancesProtectedFromScaleIn: false
    capacityRebalance: false
    healthCheckType: ""
    healthCheckGracePeriod: 0
    maxInstanceLifetime: 0
    namingTemplate: "{tag.missing}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    newInstancesProtectedFromScaleIn: false
    capacityRebalance: false
    healthCheckType: "EC2"
    healthCheckGracePeriod: 300
    maxInstanceLifetime: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
