# AutoScalingConfig fixtures for autoscalinggroup Chainsaw tests.
# One config per governance scenario; each carries the matchLabels selector label.
# All configs include BOTH mandatory and defaults tiers with ALL governance fields
# to avoid "no such key" CEL errors in the RGD.
---
# general-cfg: baseline — empty mandatory governance, standard defaults.
# Used by: AC-1,2,3,7,8,9,10,11,12,16,20,21,22,23,26,29,32,33,34,35,36,38
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: general-cfg
  namespace: autoscalinggroup
  labels:
    aws.kropath.run/resource-name: general-cfg
spec:
  mandatory:
    newInstancesProtectedFromScaleIn: false
    capacityRebalance: false
    healthCheckType: ""
    healthCheckGracePeriod: 0
    maxInstanceLifetime: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    newInstancesProtectedFromScaleIn: false
    capacityRebalance: false
    healthCheckType: "EC2"
    healthCheckGracePeriod: 300
    maxInstanceLifetime: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
---
