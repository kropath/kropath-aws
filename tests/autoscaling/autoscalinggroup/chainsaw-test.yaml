    # AC-36: happy: instance spec.tags appear in ACK spec.tags as {key, value} pairs.
    # Tag list order is map-derived and unstable; assert via jq script.
    - name: ac36-instance-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AutoScalingGroup
              metadata: {name: ac36-asg, namespace: autoscalinggroup}
              spec:
                configRef: general-cfg
                minSize: 1
                maxSize: 2
                launchTemplate: {name: test-lt}
                tags:
                  app: myapp
                  env: dev
        - script:
            timeout: 60s
            content: |
              # Wait for ACK child CR to appear and assert tag values order-independently.
              for i in $(seq 1 20); do
                COUNT=$(kubectl get autoscalinggroup.autoscaling.services.k8s.aws ac36-asg \
                  -n autoscalinggroup -o json 2>/dev/null \
                  | jq '.spec.tags | length' 2>/dev/null || echo 0)
                if [ "$COUNT" -gt 0 ]; then break; fi
                sleep 3
              done
              kubectl get autoscalinggroup.autoscaling.services.k8s.aws ac36-asg \
                -n autoscalinggroup -o json \
                | jq -e '
                    (.spec.tags | map(select(.key == "app" and .value == "myapp")) | length == 1) and
                    (.spec.tags | map(select(.key == "env" and .value == "dev")) | length == 1)
                  '

    # AC-37: happy: mandatory.tags win over instance tags on the same key.
    # mandatory-tags-cfg: mandatory.tags={env: prod}. Instance sets env=dev → mandatory wins.
    - name: ac37-mandatory-tags-win
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AutoScalingGroup
              metadata: {name: ac37-asg, namespace: autoscalinggroup}
              spec:
                configRef: mandatory-tags-cfg
                minSize: 1
                maxSize: 2
                launchTemplate: {name: test-lt}
                tags:
                  env: dev
                  app: myapp
        - script:
            timeout: 60s
            content: |
              # Wait for ACK child CR to appear, then assert mandatory tag wins.
              for i in $(seq 1 20); do
                COUNT=$(kubectl get autoscalinggroup.autoscaling.services.k8s.aws ac37-asg \
                  -n autoscalinggroup -o json 2>/dev/null \
                  | jq '.spec.tags | length' 2>/dev/null || echo 0)
                if [ "$COUNT" -gt 0 ]; then break; fi
                sleep 3
              done
              kubectl get autoscalinggroup.autoscaling.services.k8s.aws ac37-asg \
                -n autoscalinggroup -o json \
                | jq -e '
                    (.spec.tags | map(select(.key == "env" and .value == "prod")) | length == 1) and
                    (.spec.tags | map(select(.key == "env" and .value == "dev")) | length == 0) and
                    (.spec.tags | map(select(.key == "app" and .value == "myapp")) | length == 1)
                  '

