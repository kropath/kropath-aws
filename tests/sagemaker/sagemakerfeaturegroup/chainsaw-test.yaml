apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakerfeaturegroup
spec:
  namespace: sagemakerfeaturegroup
  steps:
    # AC-1: Basic creation with required fields
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakerfeaturegroup
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch sagemakerconfig general-policy -n sagemakerfeaturegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerFeatureGroup
              metadata:
                name: basic-fg
                namespace: sagemakerfeaturegroup
              spec:
                featureDefinitions:
                  - featureName: customer_id
                    featureType: Integral
                  - featureName: event_time
                    featureType: String
                  - featureName: feature1
                    featureType: Fractional
                recordIdentifierFeatureName: customer_id
                eventTimeFeatureName: event_time
                roleArn: arn:aws:iam::123456789012:role/SageMakerFeatureStoreRole
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerFeatureGroup
              metadata:
                name: basic-fg
                namespace: sagemakerfeaturegroup
              status:
                resourceName: sagemakerfeaturegroup-basic-fg
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: FeatureGroup
              metadata:
                name: basic-fg
                namespace: sagemakerfeaturegroup
              spec:
                featureGroupName: sagemakerfeaturegroup-basic-fg
                recordIdentifierFeatureName: customer_id
                eventTimeFeatureName: event_time
                roleARN: arn:aws:iam::123456789012:role/SageMakerFeatureStoreRole

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerFeatureGroup
              metadata:
                name: arn-fg
                namespace: sagemakerfeaturegroup
              spec:
                featureDefinitions:
                  - featureName: id
                    featureType: Integral
                  - featureName: ts
                    featureType: String
                recordIdentifierFeatureName: id
                eventTimeFeatureName: ts
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerFeatureGroup
              metadata:
                name: arn-fg
                namespace: sagemakerfeaturegroup
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:feature-group/sagemakerfeaturegroup-arn-fg"

    # AC-3: tags cascade
    - name: ac3-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakerfeaturegroup
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig tags-policy -n sagemakerfeaturegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{"team":"ml"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerFeatureGroup
              metadata:
                name: tags-fg
                namespace: sagemakerfeaturegroup
              spec:
                configRef: tags-policy
                featureDefinitions:
                  - featureName: id
                    featureType: Integral
                  - featureName: ts
                    featureType: String
                recordIdentifierFeatureName: id
                eventTimeFeatureName: ts
                tags:
                  project: features
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: FeatureGroup
              metadata:
                name: tags-fg
                namespace: sagemakerfeaturegroup
        - script:
            content: |
              TAGS=$(kubectl get featuregroup tags-fg -n sagemakerfeaturegroup -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=features" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-4: deletion policy
    - name: ac4-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerFeatureGroup
              metadata:
                name: del-fg
                namespace: sagemakerfeaturegroup
              spec:
                deletionPolicy: delete
                featureDefinitions:
                  - featureName: id
                    featureType: Integral
                  - featureName: ts
                    featureType: String
                recordIdentifierFeatureName: id
                eventTimeFeatureName: ts
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: FeatureGroup
              metadata:
                name: del-fg
                namespace: sagemakerfeaturegroup
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # Standard labels
    - name: ac-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerFeatureGroup
              metadata:
                name: std-fg
                namespace: sagemakerfeaturegroup
              spec:
                featureDefinitions:
                  - featureName: id
                    featureType: Integral
                  - featureName: ts
                    featureType: String
                recordIdentifierFeatureName: id
                eventTimeFeatureName: ts
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: FeatureGroup
              metadata:
                name: std-fg
                namespace: sagemakerfeaturegroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-fg
