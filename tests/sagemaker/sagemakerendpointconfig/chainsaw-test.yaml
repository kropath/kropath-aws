apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakerendpointconfig
spec:
  namespace: sagemakerendpointconfig
  steps:
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              kubectl delete sagemakerEndpointconfig --all -n sagemakerendpointconfig --ignore-not-found=true 2>/dev/null || true
              kubectl delete SageMakerConfig --all -n sagemakerendpointconfig --ignore-not-found=true 2>/dev/null || true
              sleep 2
              echo "Purge complete"

    # AC-1: Basic creation with productionVariants
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakerendpointconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch sagemakerconfig general-policy -n sagemakerendpointconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpointConfig
              metadata:
                name: basic-epc
                namespace: sagemakerendpointconfig
              spec:
                productionVariants:
                  - variantName: AllTraffic
                    modelName: sagemakermodel-my-model
                    instanceType: ml.m5.xlarge
                    initialInstanceCount: 1
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpointConfig
              metadata:
                name: basic-epc
                namespace: sagemakerendpointconfig
              status:
                resourceName: sagemakerendpointconfig-basic-epc
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: EndpointConfig
              metadata:
                name: basic-epc
                namespace: sagemakerendpointconfig
              spec:
                endpointConfigName: sagemakerendpointconfig-basic-epc

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpointConfig
              metadata:
                name: arn-epc
                namespace: sagemakerendpointconfig
              spec:
                productionVariants:
                  - variantName: AllTraffic
                    modelName: sagemakermodel-my-model
                    instanceType: ml.m5.xlarge
                    initialInstanceCount: 1
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpointConfig
              metadata:
                name: arn-epc
                namespace: sagemakerendpointconfig
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:endpoint-config/sagemakerendpointconfig-arn-epc"

    # AC-3: kmsKeyId governance
    - name: ac3-kms-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: kms-policy
                namespace: sagemakerendpointconfig
                labels:
                  aws.kropath.run/resource-name: kms-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/mand-key
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig kms-policy -n sagemakerendpointconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"kmsKeyId":"arn:aws:kms:us-east-1:123456789012:key/mand-key"},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpointConfig
              metadata:
                name: kms-epc
                namespace: sagemakerendpointconfig
              spec:
                productionVariants:
                  - variantName: AllTraffic
                    modelName: sagemakermodel-my-model
                    instanceType: ml.m5.xlarge
                    initialInstanceCount: 1
                configRef: kms-policy
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: EndpointConfig
              metadata:
                name: kms-epc
                namespace: sagemakerendpointconfig
              spec:
                kmsKeyID: arn:aws:kms:us-east-1:123456789012:key/mand-key

    # AC-4: enableNetworkIsolation governance
    - name: ac4-network-isolation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: isolation-policy
                namespace: sagemakerendpointconfig
                labels:
                  aws.kropath.run/resource-name: isolation-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  enableNetworkIsolation: true
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig isolation-policy -n sagemakerendpointconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"enableNetworkIsolation":true},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpointConfig
              metadata:
                name: isolation-epc
                namespace: sagemakerendpointconfig
              spec:
                productionVariants:
                  - variantName: AllTraffic
                    modelName: sagemakermodel-my-model
                    instanceType: ml.m5.xlarge
                    initialInstanceCount: 1
                enableNetworkIsolation: false
                configRef: isolation-policy
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: EndpointConfig
              metadata:
                name: isolation-epc
                namespace: sagemakerendpointconfig
              spec:
                enableNetworkIsolation: true

    # AC-5: deletion policy
    - name: ac5-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpointConfig
              metadata:
                name: del-epc
                namespace: sagemakerendpointconfig
              spec:
                productionVariants:
                  - variantName: AllTraffic
                    modelName: sagemakermodel-my-model
                    instanceType: ml.m5.xlarge
                    initialInstanceCount: 1
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: EndpointConfig
              metadata:
                name: del-epc
                namespace: sagemakerendpointconfig
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-6: standard labels
    - name: ac6-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpointConfig
              metadata:
                name: std-epc
                namespace: sagemakerendpointconfig
              spec:
                productionVariants:
                  - variantName: AllTraffic
                    modelName: sagemakermodel-my-model
                    instanceType: ml.m5.xlarge
                    initialInstanceCount: 1
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: EndpointConfig
              metadata:
                name: std-epc
                namespace: sagemakerendpointconfig
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-epc
