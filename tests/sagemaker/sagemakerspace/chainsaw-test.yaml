apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakerspace
spec:
  namespace: sagemakerspace
  steps:
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              kubectl delete sagemakerspace --all -n sagemakerspace --ignore-not-found=true 2>/dev/null || true
              kubectl delete SageMakerConfig --all -n sagemakerspace --ignore-not-found=true 2>/dev/null || true
              sleep 2
              echo "Purge complete"

    # AC-1: Basic creation with required domainId
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakerspace
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: basic-space
                namespace: sagemakerspace
              spec:
                domainId: d-abc123
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: basic-space
                namespace: sagemakerspace
              status:
                resourceName: sagemakerspace-basic-space
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Space
              metadata:
                name: basic-space
                namespace: sagemakerspace
              spec:
                domainID: d-abc123
                spaceName: sagemakerspace-basic-space

    # AC-2: predictedArn format
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: arn-space
                namespace: sagemakerspace
              spec:
                domainId: d-yyy111
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: arn-space
                namespace: sagemakerspace
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:space/d-yyy111/sagemakerspace-arn-space"

    # AC-3: nameOverride
    - name: ac3-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: override-space
                namespace: sagemakerspace
              spec:
                domainId: d-abc123
                nameOverride: my-custom-space
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: override-space
                namespace: sagemakerspace
              status:
                resourceName: my-custom-space

    # AC-4: deletion policy
    - name: ac4-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: del-policy-space
                namespace: sagemakerspace
              spec:
                domainId: d-abc123
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Space
              metadata:
                name: del-policy-space
                namespace: sagemakerspace
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-5: spaceDisplayName pass-through
    - name: ac5-space-display-name
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: display-name-space
                namespace: sagemakerspace
              spec:
                domainId: d-abc123
                spaceDisplayName: "My ML Space"
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Space
              metadata:
                name: display-name-space
                namespace: sagemakerspace
              spec:
                spaceDisplayName: "My ML Space"

    # AC-6: tags cascade
    - name: ac6-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakerspace
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      env: prod
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags:
                      team: ml
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: tags-space
                namespace: sagemakerspace
              spec:
                domainId: d-abc123
                configRef: tags-policy
                tags:
                  project: myproject
        - script:
            content: |
              TAGS=$(kubectl get space tags-space -n sagemakerspace -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=myproject" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-7: standard labels on ACK resource
    - name: ac7-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerSpace
              metadata:
                name: std-labels-space
                namespace: sagemakerspace
              spec:
                domainId: d-abc123
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Space
              metadata:
                name: std-labels-space
                namespace: sagemakerspace
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-labels-space
