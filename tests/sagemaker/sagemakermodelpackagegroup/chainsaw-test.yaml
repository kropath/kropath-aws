apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakermodelpackagegroup
spec:
  namespace: sagemakermodelpackagegroup
  steps:
    # AC-1: Basic creation
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakermodelpackagegroup
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch sagemakerconfig general-policy -n sagemakermodelpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackageGroup
              metadata:
                name: basic-mpg
                namespace: sagemakermodelpackagegroup
              spec:
                modelPackageGroupDescription: My model package group
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackageGroup
              metadata:
                name: basic-mpg
                namespace: sagemakermodelpackagegroup
              status:
                resourceName: sagemakermodelpackagegroup-basic-mpg
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelPackageGroup
              metadata:
                name: basic-mpg
                namespace: sagemakermodelpackagegroup
              spec:
                modelPackageGroupName: sagemakermodelpackagegroup-basic-mpg

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackageGroup
              metadata:
                name: arn-mpg
                namespace: sagemakermodelpackagegroup
              spec: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackageGroup
              metadata:
                name: arn-mpg
                namespace: sagemakermodelpackagegroup
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:model-package-group/sagemakermodelpackagegroup-arn-mpg"

    # AC-3: tags cascade
    - name: ac3-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakermodelpackagegroup
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig tags-policy -n sagemakermodelpackagegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{"team":"ml"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackageGroup
              metadata:
                name: tags-mpg
                namespace: sagemakermodelpackagegroup
              spec:
                configRef: tags-policy
                tags:
                  project: registry
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelPackageGroup
              metadata:
                name: tags-mpg
                namespace: sagemakermodelpackagegroup
        - script:
            content: |
              TAGS=$(kubectl get modelpackagegroup tags-mpg -n sagemakermodelpackagegroup -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=registry" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-4: deletion policy
    - name: ac4-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackageGroup
              metadata:
                name: del-mpg
                namespace: sagemakermodelpackagegroup
              spec:
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelPackageGroup
              metadata:
                name: del-mpg
                namespace: sagemakermodelpackagegroup
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # Standard labels
    - name: ac-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackageGroup
              metadata:
                name: std-mpg
                namespace: sagemakermodelpackagegroup
              spec: {}
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelPackageGroup
              metadata:
                name: std-mpg
                namespace: sagemakermodelpackagegroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-mpg
