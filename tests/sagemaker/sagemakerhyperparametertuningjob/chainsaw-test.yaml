apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakerhyperparametertuningjob
spec:
  namespace: sagemakerhyperparametertuningjob
  steps:
    # AC-1/6: Basic creation with single trainingJobDefinition
    - name: ac1-basic-creation-single-algo
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakerhyperparametertuningjob
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch sagemakerconfig general-policy -n sagemakerhyperparametertuningjob \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerHyperParameterTuningJob
              metadata:
                name: basic-hpt
                namespace: sagemakerhyperparametertuningjob
              spec:
                hyperParameterTuningJobConfig:
                  strategy: Bayesian
                  hyperParameterTuningJobObjective:
                    type: Maximize
                    metricName: validation:accuracy
                  resourceLimits:
                    maxNumberOfTrainingJobs: 10
                    maxParallelTrainingJobs: 2
                trainingJobDefinition:
                  algorithmSpecification:
                    trainingInputMode: File
                    trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-algo:latest
                  roleARN: arn:aws:iam::123456789012:role/SageMakerRole
                  outputDataConfig:
                    s3OutputPath: s3://my-bucket/output
                  resourceConfig:
                    instanceType: ml.m5.xlarge
                    instanceCount: 1
                    volumeSizeInGB: 30
                  stoppingCondition:
                    maxRuntimeInSeconds: 3600
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerHyperParameterTuningJob
              metadata:
                name: basic-hpt
                namespace: sagemakerhyperparametertuningjob
              status:
                resourceName: sagemakerhyperparametertuningjob-basic-hpt
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: HyperParameterTuningJob
              metadata:
                name: basic-hpt
                namespace: sagemakerhyperparametertuningjob
              spec:
                hyperParameterTuningJobName: sagemakerhyperparametertuningjob-basic-hpt

    # AC-4: predictedArn
    - name: ac4-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerHyperParameterTuningJob
              metadata:
                name: arn-hpt
                namespace: sagemakerhyperparametertuningjob
              spec:
                hyperParameterTuningJobConfig:
                  strategy: Random
                  resourceLimits:
                    maxNumberOfTrainingJobs: 5
                    maxParallelTrainingJobs: 1
                trainingJobDefinition:
                  algorithmSpecification:
                    trainingInputMode: File
                    trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-algo:latest
                  roleARN: arn:aws:iam::123456789012:role/SageMakerRole
                  outputDataConfig:
                    s3OutputPath: s3://my-bucket/output
                  resourceConfig:
                    instanceType: ml.m5.xlarge
                    instanceCount: 1
                    volumeSizeInGB: 30
                  stoppingCondition:
                    maxRuntimeInSeconds: 3600
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerHyperParameterTuningJob
              metadata:
                name: arn-hpt
                namespace: sagemakerhyperparametertuningjob
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:hyper-parameter-tuning-job/sagemakerhyperparametertuningjob-arn-hpt"

    # AC-5: tags cascade
    - name: ac5-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakerhyperparametertuningjob
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig tags-policy -n sagemakerhyperparametertuningjob \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{"team":"ml"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerHyperParameterTuningJob
              metadata:
                name: tags-hpt
                namespace: sagemakerhyperparametertuningjob
              spec:
                configRef: tags-policy
                tags:
                  project: hpo
                hyperParameterTuningJobConfig:
                  strategy: Random
                  resourceLimits:
                    maxNumberOfTrainingJobs: 5
                    maxParallelTrainingJobs: 1
                trainingJobDefinition:
                  algorithmSpecification:
                    trainingInputMode: File
                    trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-algo:latest
                  roleARN: arn:aws:iam::123456789012:role/SageMakerRole
                  outputDataConfig:
                    s3OutputPath: s3://my-bucket/output
                  resourceConfig:
                    instanceType: ml.m5.xlarge
                    instanceCount: 1
                    volumeSizeInGB: 30
                  stoppingCondition:
                    maxRuntimeInSeconds: 3600
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: HyperParameterTuningJob
              metadata:
                name: tags-hpt
                namespace: sagemakerhyperparametertuningjob
        - script:
            content: |
              TAGS=$(kubectl get hyperparametertuningjob tags-hpt -n sagemakerhyperparametertuningjob -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=hpo" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-14: deletion policy
    - name: ac14-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerHyperParameterTuningJob
              metadata:
                name: del-hpt
                namespace: sagemakerhyperparametertuningjob
              spec:
                deletionPolicy: delete
                hyperParameterTuningJobConfig:
                  strategy: Random
                  resourceLimits:
                    maxNumberOfTrainingJobs: 5
                    maxParallelTrainingJobs: 1
                trainingJobDefinition:
                  algorithmSpecification:
                    trainingInputMode: File
                    trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-algo:latest
                  roleARN: arn:aws:iam::123456789012:role/SageMakerRole
                  outputDataConfig:
                    s3OutputPath: s3://my-bucket/output
                  resourceConfig:
                    instanceType: ml.m5.xlarge
                    instanceCount: 1
                    volumeSizeInGB: 30
                  stoppingCondition:
                    maxRuntimeInSeconds: 3600
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: HyperParameterTuningJob
              metadata:
                name: del-hpt
                namespace: sagemakerhyperparametertuningjob
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # Standard labels
    - name: ac-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerHyperParameterTuningJob
              metadata:
                name: std-hpt
                namespace: sagemakerhyperparametertuningjob
              spec:
                hyperParameterTuningJobConfig:
                  strategy: Random
                  resourceLimits:
                    maxNumberOfTrainingJobs: 5
                    maxParallelTrainingJobs: 1
                trainingJobDefinition:
                  algorithmSpecification:
                    trainingInputMode: File
                    trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-algo:latest
                  roleARN: arn:aws:iam::123456789012:role/SageMakerRole
                  outputDataConfig:
                    s3OutputPath: s3://my-bucket/output
                  resourceConfig:
                    instanceType: ml.m5.xlarge
                    instanceCount: 1
                    volumeSizeInGB: 30
                  stoppingCondition:
                    maxRuntimeInSeconds: 3600
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: HyperParameterTuningJob
              metadata:
                name: std-hpt
                namespace: sagemakerhyperparametertuningjob
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-hpt
