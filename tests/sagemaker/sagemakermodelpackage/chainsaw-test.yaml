apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakermodelpackage
spec:
  namespace: sagemakermodelpackage
  steps:
    # AC-1: Versioned package (modelPackageGroupName set)
    - name: ac1-versioned-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakermodelpackage
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackage
              metadata:
                name: versioned-pkg
                namespace: sagemakermodelpackage
              spec:
                modelPackageGroupName: fraud-models
                inferenceSpecification:
                  containers:
                    - image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/fraud:v1
                      supportedContentTypes:
                        - text/csv
                      supportedResponseMIMETypes:
                        - text/csv
                modelApprovalStatus: PendingManualApproval
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackage
              metadata:
                name: versioned-pkg
                namespace: sagemakermodelpackage
              status:
                resourceName: not-applicable
                namingStatus: not-applicable
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelPackage
              metadata:
                name: versioned-pkg
                namespace: sagemakermodelpackage
              spec:
                modelPackageGroupName: fraud-models
                modelApprovalStatus: PendingManualApproval

    # AC-3: Unversioned package (no modelPackageGroupName)
    - name: ac3-unversioned-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackage
              metadata:
                name: standalone-pkg
                namespace: sagemakermodelpackage
              spec:
                inferenceSpecification:
                  containers:
                    - image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-model:v1
                      supportedContentTypes:
                        - text/csv
                      supportedResponseMIMETypes:
                        - text/csv
                modelApprovalStatus: Approved
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackage
              metadata:
                name: standalone-pkg
                namespace: sagemakermodelpackage
              status:
                resourceName: sagemakermodelpackage-standalone-pkg
                namingStatus: valid
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:model-package/sagemakermodelpackage-standalone-pkg"
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelPackage
              metadata:
                name: standalone-pkg
                namespace: sagemakermodelpackage
              spec:
                modelPackageName: sagemakermodelpackage-standalone-pkg

    # AC-4: tags cascade
    - name: ac4-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakermodelpackage
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      env: prod
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags:
                      team: ml
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackage
              metadata:
                name: tags-pkg
                namespace: sagemakermodelpackage
              spec:
                configRef: tags-policy
                modelPackageGroupName: my-group
                tags:
                  project: registry
        - script:
            content: |
              TAGS=$(kubectl get modelpackage tags-pkg -n sagemakermodelpackage -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=registry" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-5: deletion policy
    - name: ac5-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackage
              metadata:
                name: del-pkg
                namespace: sagemakermodelpackage
              spec:
                deletionPolicy: delete
                modelPackageGroupName: my-group
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelPackage
              metadata:
                name: del-pkg
                namespace: sagemakermodelpackage
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # Standard labels
    - name: ac-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelPackage
              metadata:
                name: std-pkg
                namespace: sagemakermodelpackage
              spec:
                modelPackageGroupName: my-group
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelPackage
              metadata:
                name: std-pkg
                namespace: sagemakermodelpackage
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-pkg
