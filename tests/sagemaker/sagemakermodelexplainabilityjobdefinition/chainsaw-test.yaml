apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakermodelexplainabilityjobdefinition
spec:
  namespace: modelexplainabilityjobdefinition
  steps:
    # AC-1: Basic creation with required fields
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: modelexplainabilityjobdefinition
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
                  instanceType: ml.m5.xlarge
        - script:
            content: |
              kubectl patch sagemakerconfig general-policy -n modelexplainabilityjobdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{},"instanceType":"ml.m5.xlarge"},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelExplainabilityJobDefinition
              metadata:
                name: basic-jd
                namespace: modelexplainabilityjobdefinition
              spec:
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelExplainabilityAppSpecification:
                  imageURI: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelExplainabilityJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelExplainabilityJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelExplainabilityJobDefinition
              metadata:
                name: basic-jd
                namespace: modelexplainabilityjobdefinition
              status:
                resourceName: modelexplainabilityjobdefinition-basic-jd
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelExplainabilityJobDefinition
              metadata:
                name: basic-jd
                namespace: modelexplainabilityjobdefinition
              spec:
                jobDefinitionName: modelexplainabilityjobdefinition-basic-jd
                roleARN: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                jobResources:
                  clusterConfig:
                    instanceType: ml.m5.xlarge

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelExplainabilityJobDefinition
              metadata:
                name: arn-jd
                namespace: modelexplainabilityjobdefinition
              spec:
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelExplainabilityAppSpecification:
                  imageURI: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelExplainabilityJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelExplainabilityJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelExplainabilityJobDefinition
              metadata:
                name: arn-jd
                namespace: modelexplainabilityjobdefinition
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:model-explainability-job-definition/modelexplainabilityjobdefinition-arn-jd"

    # AC-3: mandatory instanceType and kmsKeyId override
    - name: ac3-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: mandatory-policy
                namespace: modelexplainabilityjobdefinition
                labels:
                  aws.kropath.run/resource-name: mandatory-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  instanceType: ml.m5.4xlarge
                  kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/mrk-mandatory
                  enableNetworkIsolation: true
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig mandatory-policy -n modelexplainabilityjobdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"instanceType":"ml.m5.4xlarge","kmsKeyId":"arn:aws:kms:us-east-1:123456789012:key/mrk-mandatory","enableNetworkIsolation":true},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelExplainabilityJobDefinition
              metadata:
                name: mand-jd
                namespace: modelexplainabilityjobdefinition
              spec:
                configRef: mandatory-policy
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelExplainabilityAppSpecification:
                  imageURI: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelExplainabilityJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelExplainabilityJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceType: ml.m5.xlarge
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
                enableNetworkIsolation: false
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelExplainabilityJobDefinition
              metadata:
                name: mand-jd
                namespace: modelexplainabilityjobdefinition
              spec:
                jobResources:
                  clusterConfig:
                    instanceType: ml.m5.4xlarge
                    volumeKMSKeyID: arn:aws:kms:us-east-1:123456789012:key/mrk-mandatory
                networkConfig:
                  enableNetworkIsolation: true

    # AC-4: tags cascade
    - name: ac4-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: modelexplainabilityjobdefinition
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig tags-policy -n modelexplainabilityjobdefinition \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{"team":"ml"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelExplainabilityJobDefinition
              metadata:
                name: tags-jd
                namespace: modelexplainabilityjobdefinition
              spec:
                configRef: tags-policy
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelExplainabilityAppSpecification:
                  imageURI: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelExplainabilityJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelExplainabilityJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
                tags:
                  project: monitoring
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelExplainabilityJobDefinition
              metadata:
                name: tags-jd
                namespace: modelexplainabilityjobdefinition
        - script:
            content: |
              KIND=modelexplainabilityjobdefinition
              TAGS=$(kubectl get ModelExplainabilityJobDefinition tags-jd -n modelexplainabilityjobdefinition -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")' 2>/dev/null)
              if [ -z "$TAGS" ]; then
                PLURAL=$(kubectl api-resources --api-group=sagemaker.services.k8s.aws --no-headers 2>/dev/null | awk '{print $1}' | grep -i "modelexplainabilityjobdefinition" | head -1)
                TAGS=$(kubectl get $PLURAL tags-jd -n modelexplainabilityjobdefinition -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")' 2>/dev/null)
              fi
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=monitoring" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-5: deletion policy
    - name: ac5-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelExplainabilityJobDefinition
              metadata:
                name: del-jd
                namespace: modelexplainabilityjobdefinition
              spec:
                deletionPolicy: delete
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelExplainabilityAppSpecification:
                  imageURI: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelExplainabilityJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelExplainabilityJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelExplainabilityJobDefinition
              metadata:
                name: del-jd
                namespace: modelexplainabilityjobdefinition
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # Standard labels
    - name: ac-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelExplainabilityJobDefinition
              metadata:
                name: std-jd
                namespace: modelexplainabilityjobdefinition
              spec:
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelExplainabilityAppSpecification:
                  imageURI: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelExplainabilityJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelExplainabilityJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelExplainabilityJobDefinition
              metadata:
                name: std-jd
                namespace: modelexplainabilityjobdefinition
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-jd
