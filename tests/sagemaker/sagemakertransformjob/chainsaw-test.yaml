apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakertransformjob
spec:
  namespace: sagemakertransformjob
  steps:
    # AC-1: Basic creation with defaults instanceType
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakertransformjob
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
                  instanceType: ml.m5.xlarge
        - script:
            content: |
              kubectl patch sagemakerconfig general-policy -n sagemakertransformjob \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{},"instanceType":"ml.m5.xlarge"},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTransformJob
              metadata:
                name: basic-tj
                namespace: sagemakertransformjob
              spec:
                modelName: sagemakertransformjob-my-model
                transformInput:
                  dataSource:
                    s3DataSource:
                      s3DataType: S3Prefix
                      s3URI: s3://my-bucket/input
                  contentType: text/csv
                transformOutputS3OutputPath: s3://my-bucket/output
                transformResourcesInstanceCount: 1
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTransformJob
              metadata:
                name: basic-tj
                namespace: sagemakertransformjob
              status:
                resourceName: sagemakertransformjob-basic-tj
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TransformJob
              metadata:
                name: basic-tj
                namespace: sagemakertransformjob
              spec:
                transformJobName: sagemakertransformjob-basic-tj
                transformResources:
                  instanceType: ml.m5.xlarge

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTransformJob
              metadata:
                name: arn-tj
                namespace: sagemakertransformjob
              spec:
                modelName: sagemakertransformjob-my-model
                transformInput:
                  dataSource:
                    s3DataSource:
                      s3DataType: S3Prefix
                      s3URI: s3://my-bucket/input
                  contentType: text/csv
                transformOutputS3OutputPath: s3://my-bucket/output
                transformResourcesInstanceCount: 1
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTransformJob
              metadata:
                name: arn-tj
                namespace: sagemakertransformjob
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:transform-job/sagemakertransformjob-arn-tj"

    # AC-3: kmsKeyId governance on transformOutput
    - name: ac3-kms-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: kms-policy
                namespace: sagemakertransformjob
                labels:
                  aws.kropath.run/resource-name: kms-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/mand-key
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig kms-policy -n sagemakertransformjob \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"kmsKeyId":"arn:aws:kms:us-east-1:123456789012:key/mand-key"},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTransformJob
              metadata:
                name: kms-tj
                namespace: sagemakertransformjob
              spec:
                configRef: kms-policy
                modelName: sagemakertransformjob-my-model
                transformInput:
                  dataSource:
                    s3DataSource:
                      s3DataType: S3Prefix
                      s3URI: s3://my-bucket/input
                  contentType: text/csv
                transformOutputS3OutputPath: s3://my-bucket/output
                transformResourcesInstanceCount: 1
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TransformJob
              metadata:
                name: kms-tj
                namespace: sagemakertransformjob
              spec:
                transformOutput:
                  kmsKeyID: arn:aws:kms:us-east-1:123456789012:key/mand-key

    # AC-4: mandatory instanceType override
    - name: ac4-mandatory-instance-type
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: mandatory-policy
                namespace: sagemakertransformjob
                labels:
                  aws.kropath.run/resource-name: mandatory-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  instanceType: ml.c5.4xlarge
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig mandatory-policy -n sagemakertransformjob \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"instanceType":"ml.c5.4xlarge"},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTransformJob
              metadata:
                name: mandatory-tj
                namespace: sagemakertransformjob
              spec:
                configRef: mandatory-policy
                modelName: sagemakertransformjob-my-model
                transformInput:
                  dataSource:
                    s3DataSource:
                      s3DataType: S3Prefix
                      s3URI: s3://my-bucket/input
                  contentType: text/csv
                transformOutputS3OutputPath: s3://my-bucket/output
                transformResourcesInstanceType: ml.m5.xlarge
                transformResourcesInstanceCount: 1
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TransformJob
              metadata:
                name: mandatory-tj
                namespace: sagemakertransformjob
              spec:
                transformResources:
                  instanceType: ml.c5.4xlarge

    # AC-5: deletion policy
    - name: ac5-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTransformJob
              metadata:
                name: del-tj
                namespace: sagemakertransformjob
              spec:
                deletionPolicy: delete
                modelName: sagemakertransformjob-my-model
                transformInput:
                  dataSource:
                    s3DataSource:
                      s3DataType: S3Prefix
                      s3URI: s3://my-bucket/input
                  contentType: text/csv
                transformOutputS3OutputPath: s3://my-bucket/output
                transformResourcesInstanceCount: 1
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TransformJob
              metadata:
                name: del-tj
                namespace: sagemakertransformjob
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-6: tags cascade
    - name: ac6-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakertransformjob
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig tags-policy -n sagemakertransformjob \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{"team":"ml"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTransformJob
              metadata:
                name: tags-tj
                namespace: sagemakertransformjob
              spec:
                configRef: tags-policy
                tags:
                  project: batch
                modelName: sagemakertransformjob-my-model
                transformInput:
                  dataSource:
                    s3DataSource:
                      s3DataType: S3Prefix
                      s3URI: s3://my-bucket/input
                  contentType: text/csv
                transformOutputS3OutputPath: s3://my-bucket/output
                transformResourcesInstanceCount: 1
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TransformJob
              metadata:
                name: tags-tj
                namespace: sagemakertransformjob
        - script:
            content: |
              TAGS=$(kubectl get transformjob tags-tj -n sagemakertransformjob -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=batch" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-7: standard labels
    - name: ac7-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTransformJob
              metadata:
                name: std-tj
                namespace: sagemakertransformjob
              spec:
                modelName: sagemakertransformjob-my-model
                transformInput:
                  dataSource:
                    s3DataSource:
                      s3DataType: S3Prefix
                      s3URI: s3://my-bucket/input
                  contentType: text/csv
                transformOutputS3OutputPath: s3://my-bucket/output
                transformResourcesInstanceCount: 1
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TransformJob
              metadata:
                name: std-tj
                namespace: sagemakertransformjob
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-tj
