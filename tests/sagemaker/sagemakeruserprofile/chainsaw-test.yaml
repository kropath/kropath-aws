apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakeruserprofile
spec:
  namespace: sagemakeruserprofile
  steps:
    # ─── Purge stale leftovers ─────────────────────────────────────────────────
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              kubectl delete sagemakeruserprofile --all -n sagemakeruserprofile --ignore-not-found=true
              kubectl delete sagemakerconfig --all -n sagemakeruserprofile --ignore-not-found=true 2>/dev/null || true
              kubectl delete sagemakeruserprofile --all -n sagemakeruserprofile --ignore-not-found=true 2>/dev/null || true
              # Delete governance config CRs
              kubectl delete SageMakerConfig --all -n sagemakeruserprofile --ignore-not-found=true 2>/dev/null || true
              sleep 2
              echo "Purge complete"

    # ─── AC-1: Basic creation with required domainId ─────────────────────────
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakeruserprofile
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch sagemakerconfig general-policy -n sagemakeruserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: basic-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-abc123
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: basic-user
                namespace: sagemakeruserprofile
              status:
                resourceName: sagemakeruserprofile-basic-user
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: UserProfile
              metadata:
                name: basic-user
                namespace: sagemakeruserprofile
              spec:
                domainID: d-abc123
                userProfileName: sagemakeruserprofile-basic-user

    # ─── AC-2: predictedArn includes domainId and effectiveName ──────────────
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: arn-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-xyz789
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: arn-user
                namespace: sagemakeruserprofile
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:user-profile/d-xyz789/sagemakeruserprofile-arn-user"

    # ─── AC-3: nameOverride overrides cloud resource name ────────────────────
    - name: ac3-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: override-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-abc123
                nameOverride: my-custom-user-profile
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: override-user
                namespace: sagemakeruserprofile
              status:
                resourceName: my-custom-user-profile
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: UserProfile
              metadata:
                name: override-user
                namespace: sagemakeruserprofile
              spec:
                userProfileName: my-custom-user-profile

    # ─── AC-4: mandatory namingTemplate overrides defaults ───────────────────
    - name: ac4-mandatory-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: mandatory-naming-policy
                namespace: sagemakeruserprofile
                labels:
                  aws.kropath.run/resource-name: mandatory-naming-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "mand-{name}"
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch sagemakerconfig mandatory-naming-policy -n sagemakeruserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"mand-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: mand-naming-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-abc123
                configRef: mandatory-naming-policy
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: mand-naming-user
                namespace: sagemakeruserprofile
              status:
                resourceName: mand-mand-naming-user

    # ─── AC-5: deletion policy annotation applied to ACK resource ─────────────
    - name: ac5-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: del-policy-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-abc123
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: UserProfile
              metadata:
                name: del-policy-user
                namespace: sagemakeruserprofile
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # ─── AC-6: tags governance cascade (mandatory wins over spec over defaults) ─
    - name: ac6-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakeruserprofile
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: production
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sagemakerconfig tags-policy -n sagemakeruserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{"env":"production"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: tags-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-abc123
                configRef: tags-policy
                tags:
                  owner: alice
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: UserProfile
              metadata:
                name: tags-user
                namespace: sagemakeruserprofile
        - script:
            content: |
              TAGS=$(kubectl get userprofile tags-user -n sagemakeruserprofile -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=production" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "owner=alice" || (echo "FAIL: spec owner tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=platform" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS: all tags present"

    # ─── AC-7: singleSignOnUserIdentifier and singleSignOnUserValue pass-through
    - name: ac7-sso-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: sso-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-abc123
                singleSignOnUserIdentifier: UserName
                singleSignOnUserValue: alice@example.com
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: UserProfile
              metadata:
                name: sso-user
                namespace: sagemakeruserprofile
              spec:
                singleSignOnUserIdentifier: UserName
                singleSignOnUserValue: alice@example.com

    # ─── AC-8: ACK resource inherits managed-by and instance labels ───────────
    - name: ac8-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: labels-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-abc123
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: UserProfile
              metadata:
                name: labels-user
                namespace: sagemakeruserprofile
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: labels-user

    # ─── AC-9: unresolved naming token marks namingStatus invalid ─────────────
    - name: ac9-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: bad-token-policy
                namespace: sagemakeruserprofile
                labels:
                  aws.kropath.run/resource-name: bad-token-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{tag.nonexistent-key}"
        - script:
            content: |
              kubectl patch sagemakerconfig bad-token-policy -n sagemakeruserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{tag.nonexistent-key}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"region":"us-east-1","accountId":"123456789012"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: bad-token-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-abc123
                configRef: bad-token-policy
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: bad-token-user
                namespace: sagemakeruserprofile
              status:
                namingStatus: invalid-unresolved-tokens

    # ─── AC-10: syncedLabels applied to ACK resource metadata ────────────────
    - name: ac10-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerUserProfile
              metadata:
                name: synced-labels-user
                namespace: sagemakeruserprofile
              spec:
                domainId: d-abc123
                syncedLabels:
                  cost-center: ml-team
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: UserProfile
              metadata:
                name: synced-labels-user
                namespace: sagemakeruserprofile
                labels:
                  aws.kropath.run/cost-center: ml-team
