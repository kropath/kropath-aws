# aws-sagemaker-01 SageMakerConfig Chainsaw tests — 10 acceptance criteria.
# AC-1 through AC-10: CRD admission and schema validation tests (no controller required).
# AC-7 and AC-10 use kubectl patch --subresource=status to mock effectiveConfig.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakerconfig
spec:
  # Canonical pattern: unique resource name per step, skipDelete prevents chainsaw's cascade
  # delete — the ephemeral kind cluster is discarded after the suite anyway.
  skipDelete: true
  namespace: sagemakerconfig
  steps:
    - name: prepare
      try:
        - apply:
            file: 00-namespace-sagemakerconfig.yaml

    # AC-1: CRD is present with ESTABLISHED status.
    - name: ac1-crd-present
      try:
        - assert:
            file: 01-assert-crd-present.yaml

    # AC-2: dual-tier scalar (instanceType) must be rejected by x-kubernetes-validations.
    - name: ac2-dual-tier-scalar-rejection
      try:
        - apply:
            file: 02-invalid-both-tiers-scalar.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SageMakerConfig
                check:
                  ($error != null): true

    # AC-3: dual-tier boolean (enableNetworkIsolation) must be rejected.
    - name: ac3-dual-tier-boolean-rejection
      try:
        - apply:
            file: 03-invalid-both-tiers-boolean.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SageMakerConfig
                check:
                  ($error != null): true

    # AC-4: maps (tags) in both tiers must be accepted — maps merge, not mutually exclusive.
    - name: ac4-map-both-tiers
      try:
        - apply:
            file: 04-valid-map-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: ac4-map-both-tiers

    # AC-5: defaults-only profile must be accepted.
    - name: ac5-defaults-only-profile
      try:
        - apply:
            file: 05-valid-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: ac5-defaults-only

    # AC-6: general-policy CR is found via label aws.kropath.run/resource-name selector.
    - name: ac6-label-selector-lookup
      try:
        - apply:
            file: 06-valid-label-selector.yaml
        - assert:
            file: 07-assert-ac6-label.yaml

    # AC-1 (admission): kmsKeyId-only CR is admitted.
    - name: ac1-config-admission
      try:
        - apply:
            file: 08-valid-config-admission.yaml
        - assert:
            file: 09-assert-ac1.yaml

    # AC-8: single-tier string field (mandatory.rootAccess only) must be accepted.
    - name: ac8-single-tier-string-field
      try:
        - apply:
            file: 10-valid-single-tier-string.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: ac8-single-tier-string
              spec:
                mandatory:
                  rootAccess: "Disabled"

    # AC-9: namingTemplate in both tiers must be rejected.
    - name: ac9-dual-tier-naming-rejection
      try:
        - apply:
            file: 11-invalid-both-tiers-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SageMakerConfig
                check:
                  ($error != null): true

    # AC-7: KropathConfig mandatory.sagemaker.kmsKeyId cascades into status.effectiveConfig.
    # Uses kubectl patch --subresource=status to mock the controller output.
    - name: ac7-kropathconfig-cascade-precedence
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: ac7-cascade
                namespace: sagemakerconfig
              spec:
                mandatory:
                  kmsKeyId: ""
        - script:
            content: |
              kubectl patch sagemakerconfig ac7-cascade -n sagemakerconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyId":"arn:aws:kms:us-east-1:123456789012:key/org-level-key","instanceType":"","volumeSizeInGB":0,"enableNetworkIsolation":false,"enableInterContainerTrafficEncryption":false,"rootAccess":"","directInternetAccess":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsKeyId":"","instanceType":"","volumeSizeInGB":0,"enableNetworkIsolation":false,"enableInterContainerTrafficEncryption":false,"rootAccess":"","directInternetAccess":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            file: 12-ac7-cascade-assert.yaml

    # AC-10: general-policy effectiveConfig.defaults reflects baseline values from spec.
    - name: ac10-general-policy-baseline
      try:
        - script:
            content: |
              kubectl patch sagemakerconfig general-policy -n sagemakerconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyId":"","instanceType":"","volumeSizeInGB":0,"enableNetworkIsolation":false,"enableInterContainerTrafficEncryption":false,"rootAccess":"","directInternetAccess":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsKeyId":"","instanceType":"","volumeSizeInGB":5,"enableNetworkIsolation":false,"enableInterContainerTrafficEncryption":false,"rootAccess":"Enabled","directInternetAccess":"Enabled","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            file: 13-ac10-general-policy-baseline-assert.yaml
