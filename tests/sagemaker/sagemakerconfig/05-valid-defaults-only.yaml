# AC-5: SageMakerConfig with only defaults fields set must be accepted.
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac5-defaults-only
  namespace: sagemakerconfig
spec:
  defaults:
    instanceType: "ml.m5.large"
    volumeSizeInGB: 20
    rootAccess: "Enabled"
    namingTemplate: "{namespace}-{name}"
