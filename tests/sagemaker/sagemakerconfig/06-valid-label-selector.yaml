# AC-6: general-policy CR has label aws.kropath.run/resource-name: general-policy so RGDs can
# find it via externalRef selector.matchLabels.
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: general-policy
  namespace: sagemakerconfig
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    instanceType: ""
    volumeSizeInGB: 0
    kmsKeyId: ""
    enableNetworkIsolation: false
    enableInterContainerTrafficEncryption: false
    rootAccess: ""
    directInternetAccess: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    instanceType: ""
    volumeSizeInGB: 5
    kmsKeyId: ""
    enableNetworkIsolation: false
    enableInterContainerTrafficEncryption: false
    rootAccess: "Enabled"
    directInternetAccess: "Enabled"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
