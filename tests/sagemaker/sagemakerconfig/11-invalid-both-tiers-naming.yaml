# AC-9: namingTemplate in both mandatory and defaults must be rejected.
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac9-dual-tier-naming
  namespace: sagemakerconfig
spec:
  mandatory:
    namingTemplate: "{namespace}-{name}-prod"
  defaults:
    namingTemplate: "{namespace}-{name}"
