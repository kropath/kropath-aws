# AC-3: enableNetworkIsolation=true in both mandatory and defaults must be rejected.
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac3-dual-tier-boolean
  namespace: sagemakerconfig
spec:
  mandatory:
    enableNetworkIsolation: true
  defaults:
    enableNetworkIsolation: true
