# AC-2: instanceType in both mandatory and defaults must be rejected by x-kubernetes-validations.
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac2-dual-tier-scalar
  namespace: sagemakerconfig
spec:
  mandatory:
    instanceType: "ml.m5.xlarge"
  defaults:
    instanceType: "ml.t3.medium"
