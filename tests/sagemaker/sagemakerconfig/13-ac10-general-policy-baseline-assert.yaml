# AC-10 assert: general-policy status.effectiveConfig.defaults reflects expected baseline values.
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: general-policy
  namespace: sagemakerconfig
status:
  effectiveConfig:
    defaults:
      volumeSizeInGB: 5
      rootAccess: "Enabled"
      directInternetAccess: "Enabled"
      namingTemplate: "{namespace}-{name}"
