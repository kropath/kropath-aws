apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakernotebookinstance
spec:
  namespace: sagemakernotebookinstance
  steps:
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              kubectl delete sagemakernotebookinstance --all -n sagemakernotebookinstance --ignore-not-found=true 2>/dev/null || true
              kubectl delete SageMakerConfig --all -n sagemakernotebookinstance --ignore-not-found=true 2>/dev/null || true
              sleep 2
              echo "Purge complete"

    # AC-1: Basic creation with required instanceType and roleArn
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakernotebookinstance
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: basic-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.t3.medium
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: basic-nb
                namespace: sagemakernotebookinstance
              status:
                resourceName: sagemakernotebookinstance-basic-nb
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: NotebookInstance
              metadata:
                name: basic-nb
                namespace: sagemakernotebookinstance
              spec:
                notebookInstanceName: sagemakernotebookinstance-basic-nb
                instanceType: ml.t3.medium
                roleARN: arn:aws:iam::123456789012:role/SageMakerRole

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: arn-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.t3.medium
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: arn-nb
                namespace: sagemakernotebookinstance
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:notebook-instance/sagemakernotebookinstance-arn-nb"

    # AC-3: instanceType governance — mandatory overrides spec
    - name: ac3-instancetype-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: mandatory-instance-policy
                namespace: sagemakernotebookinstance
                labels:
                  aws.kropath.run/resource-name: mandatory-instance-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  instanceType: ml.m5.xlarge
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    instanceType: ml.m5.xlarge
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: mand-inst-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.t3.medium
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                configRef: mandatory-instance-policy
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: NotebookInstance
              metadata:
                name: mand-inst-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.m5.xlarge

    # AC-4: volumeSizeInGB governance
    - name: ac4-volume-size-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: volume-policy
                namespace: sagemakernotebookinstance
                labels:
                  aws.kropath.run/resource-name: volume-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  volumeSizeInGB: 100
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    volumeSizeInGB: 100
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: vol-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.t3.medium
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                configRef: volume-policy
                volumeSizeInGB: 5
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: NotebookInstance
              metadata:
                name: vol-nb
                namespace: sagemakernotebookinstance
              spec:
                volumeSizeInGB: 100

    # AC-5: kmsKeyId governance
    - name: ac5-kms-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: kms-policy
                namespace: sagemakernotebookinstance
                labels:
                  aws.kropath.run/resource-name: kms-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/mandatory-key
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/mandatory-key
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: kms-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.t3.medium
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                configRef: kms-policy
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: NotebookInstance
              metadata:
                name: kms-nb
                namespace: sagemakernotebookinstance
              spec:
                kmsKeyID: arn:aws:kms:us-east-1:123456789012:key/mandatory-key

    # AC-6: lifecycleConfigName pass-through
    - name: ac6-lifecycle-config
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: lc-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.t3.medium
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                lifecycleConfigName: my-lifecycle-config
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: NotebookInstance
              metadata:
                name: lc-nb
                namespace: sagemakernotebookinstance
              spec:
                lifecycleConfigName: my-lifecycle-config

    # AC-7: subnetId and securityGroupIds pass-through
    - name: ac7-network-config
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: net-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.t3.medium
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                subnetId: subnet-12345
                securityGroupIds:
                  - sg-aaa111
                  - sg-bbb222
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: NotebookInstance
              metadata:
                name: net-nb
                namespace: sagemakernotebookinstance
              spec:
                subnetID: subnet-12345
                securityGroupIDs:
                  - sg-aaa111
                  - sg-bbb222

    # AC-8: deletion policy
    - name: ac8-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: del-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.t3.medium
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: NotebookInstance
              metadata:
                name: del-nb
                namespace: sagemakernotebookinstance
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-9: standard labels
    - name: ac9-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerNotebookInstance
              metadata:
                name: std-nb
                namespace: sagemakernotebookinstance
              spec:
                instanceType: ml.t3.medium
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: NotebookInstance
              metadata:
                name: std-nb
                namespace: sagemakernotebookinstance
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-nb
