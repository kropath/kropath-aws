apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakerendpoint
spec:
  namespace: sagemakerendpoint
  steps:
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              kubectl delete SageMakerEndpoint --all -n sagemakerendpoint --ignore-not-found=true 2>/dev/null || true
              kubectl delete SageMakerConfig --all -n sagemakerendpoint --ignore-not-found=true 2>/dev/null || true
              sleep 2
              echo "Purge complete"

    # AC-1: Basic creation with endpointConfigName
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakerendpoint
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpoint
              metadata:
                name: basic-ep
                namespace: sagemakerendpoint
              spec:
                endpointConfigName: sagemakerendpointconfig-my-epc
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpoint
              metadata:
                name: basic-ep
                namespace: sagemakerendpoint
              status:
                resourceName: sagemakerendpoint-basic-ep
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Endpoint
              metadata:
                name: basic-ep
                namespace: sagemakerendpoint
              spec:
                endpointName: sagemakerendpoint-basic-ep
                endpointConfigName: sagemakerendpointconfig-my-epc

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpoint
              metadata:
                name: arn-ep
                namespace: sagemakerendpoint
              spec:
                endpointConfigName: sagemakerendpointconfig-my-epc
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpoint
              metadata:
                name: arn-ep
                namespace: sagemakerendpoint
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:endpoint/sagemakerendpoint-arn-ep"

    # AC-3: nameOverride
    - name: ac3-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpoint
              metadata:
                name: override-ep
                namespace: sagemakerendpoint
              spec:
                endpointConfigName: sagemakerendpointconfig-my-epc
                nameOverride: my-custom-endpoint
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpoint
              metadata:
                name: override-ep
                namespace: sagemakerendpoint
              status:
                resourceName: my-custom-endpoint

    # AC-4: deletion policy
    - name: ac4-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpoint
              metadata:
                name: del-ep
                namespace: sagemakerendpoint
              spec:
                endpointConfigName: sagemakerendpointconfig-my-epc
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Endpoint
              metadata:
                name: del-ep
                namespace: sagemakerendpoint
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-5: tags cascade
    - name: ac5-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakerendpoint
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      env: prod
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags:
                      team: ml
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpoint
              metadata:
                name: tags-ep
                namespace: sagemakerendpoint
              spec:
                endpointConfigName: sagemakerendpointconfig-my-epc
                configRef: tags-policy
                tags:
                  project: myep
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Endpoint
              metadata:
                name: tags-ep
                namespace: sagemakerendpoint
        - script:
            content: |
              TAGS=$(kubectl get endpoint tags-ep -n sagemakerendpoint -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=myep" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-6: standard labels
    - name: ac6-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerEndpoint
              metadata:
                name: std-ep
                namespace: sagemakerendpoint
              spec:
                endpointConfigName: sagemakerendpointconfig-my-epc
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Endpoint
              metadata:
                name: std-ep
                namespace: sagemakerendpoint
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-ep
