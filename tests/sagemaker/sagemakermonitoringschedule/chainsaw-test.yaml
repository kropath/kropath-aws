apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakermonitoringschedule
spec:
  namespace: sagemakermonitoringschedule
  steps:
    # AC-1: Basic creation with monitoringScheduleConfig
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakermonitoringschedule
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerMonitoringSchedule
              metadata:
                name: basic-ms
                namespace: sagemakermonitoringschedule
              spec:
                monitoringScheduleConfig:
                  scheduleConfig:
                    scheduleExpression: cron(0 * ? * * *)
                  monitoringType: DataQuality
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerMonitoringSchedule
              metadata:
                name: basic-ms
                namespace: sagemakermonitoringschedule
              status:
                resourceName: sagemakermonitoringschedule-basic-ms
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: MonitoringSchedule
              metadata:
                name: basic-ms
                namespace: sagemakermonitoringschedule
              spec:
                monitoringScheduleName: sagemakermonitoringschedule-basic-ms

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerMonitoringSchedule
              metadata:
                name: arn-ms
                namespace: sagemakermonitoringschedule
              spec:
                monitoringScheduleConfig:
                  monitoringType: DataQuality
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerMonitoringSchedule
              metadata:
                name: arn-ms
                namespace: sagemakermonitoringschedule
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:monitoring-schedule/sagemakermonitoringschedule-arn-ms"

    # AC-3: tags cascade
    - name: ac3-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakermonitoringschedule
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      env: prod
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags:
                      team: ml
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerMonitoringSchedule
              metadata:
                name: tags-ms
                namespace: sagemakermonitoringschedule
              spec:
                configRef: tags-policy
                monitoringScheduleConfig:
                  monitoringType: DataQuality
                tags:
                  project: monitor
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: MonitoringSchedule
              metadata:
                name: tags-ms
                namespace: sagemakermonitoringschedule
        - script:
            content: |
              TAGS=$(kubectl get monitoringschedule tags-ms -n sagemakermonitoringschedule -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=monitor" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-4: deletion policy
    - name: ac4-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerMonitoringSchedule
              metadata:
                name: del-ms
                namespace: sagemakermonitoringschedule
              spec:
                deletionPolicy: delete
                monitoringScheduleConfig:
                  monitoringType: DataQuality
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: MonitoringSchedule
              metadata:
                name: del-ms
                namespace: sagemakermonitoringschedule
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # Standard labels
    - name: ac-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerMonitoringSchedule
              metadata:
                name: std-ms
                namespace: sagemakermonitoringschedule
              spec:
                monitoringScheduleConfig:
                  monitoringType: DataQuality
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: MonitoringSchedule
              metadata:
                name: std-ms
                namespace: sagemakermonitoringschedule
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-ms
