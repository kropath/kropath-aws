apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakermodel
spec:
  namespace: sagemakermodel
  steps:
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              kubectl delete sagemakermodel --all -n sagemakermodel --ignore-not-found=true 2>/dev/null || true
              kubectl delete SageMakerConfig --all -n sagemakermodel --ignore-not-found=true 2>/dev/null || true
              sleep 2
              echo "Purge complete"

    # AC-1: Basic creation with primaryContainer
    - name: ac1-primary-container
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakermodel
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: basic-model
                namespace: sagemakermodel
              spec:
                executionRoleArn: arn:aws:iam::123456789012:role/SageMakerRole
                primaryContainer:
                  image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/mymodel:latest
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: basic-model
                namespace: sagemakermodel
              status:
                resourceName: sagemakermodel-basic-model
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Model
              metadata:
                name: basic-model
                namespace: sagemakermodel
              spec:
                modelName: sagemakermodel-basic-model
                executionRoleARN: arn:aws:iam::123456789012:role/SageMakerRole

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: arn-model
                namespace: sagemakermodel
              spec:
                executionRoleArn: arn:aws:iam::123456789012:role/SageMakerRole
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: arn-model
                namespace: sagemakermodel
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:model/sagemakermodel-arn-model"

    # AC-3: enableNetworkIsolation governance — mandatory true wins over spec false
    - name: ac3-network-isolation-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: isolation-policy
                namespace: sagemakermodel
                labels:
                  aws.kropath.run/resource-name: isolation-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  enableNetworkIsolation: true
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    enableNetworkIsolation: true
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: isolation-model
                namespace: sagemakermodel
              spec:
                executionRoleArn: arn:aws:iam::123456789012:role/SageMakerRole
                enableNetworkIsolation: false
                configRef: isolation-policy
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Model
              metadata:
                name: isolation-model
                namespace: sagemakermodel
              spec:
                enableNetworkIsolation: true

    # AC-4: nameOverride
    - name: ac4-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: override-model
                namespace: sagemakermodel
              spec:
                executionRoleArn: arn:aws:iam::123456789012:role/SageMakerRole
                nameOverride: my-custom-model
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: override-model
                namespace: sagemakermodel
              status:
                resourceName: my-custom-model
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Model
              metadata:
                name: override-model
                namespace: sagemakermodel
              spec:
                modelName: my-custom-model

    # AC-5: deletion policy
    - name: ac5-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: del-model
                namespace: sagemakermodel
              spec:
                executionRoleArn: arn:aws:iam::123456789012:role/SageMakerRole
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Model
              metadata:
                name: del-model
                namespace: sagemakermodel
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-6: tags cascade
    - name: ac6-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-model-policy
                namespace: sagemakermodel
                labels:
                  aws.kropath.run/resource-name: tags-model-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      env: prod
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags:
                      team: ml
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: tags-model
                namespace: sagemakermodel
              spec:
                executionRoleArn: arn:aws:iam::123456789012:role/SageMakerRole
                configRef: tags-model-policy
                tags:
                  project: mymodel
        - script:
            content: |
              TAGS=$(kubectl get model tags-model -n sagemakermodel -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=mymodel" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-7: standard labels
    - name: ac7-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModel
              metadata:
                name: std-model
                namespace: sagemakermodel
              spec:
                executionRoleArn: arn:aws:iam::123456789012:role/SageMakerRole
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Model
              metadata:
                name: std-model
                namespace: sagemakermodel
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-model
