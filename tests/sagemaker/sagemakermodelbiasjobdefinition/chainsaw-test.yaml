apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakermodelbiasjobdefinition
spec:
  namespace: modelbiasjobdefinition
  steps:
    # AC-1: Basic creation with required fields
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: modelbiasjobdefinition
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
                  instanceType: ml.m5.xlarge
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    namingTemplate: "{namespace}-{name}"
                    instanceType: ml.m5.xlarge
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelBiasJobDefinition
              metadata:
                name: basic-jd
                namespace: modelbiasjobdefinition
              spec:
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelBiasAppSpecification:
                  imageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelBiasJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelBiasJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelBiasJobDefinition
              metadata:
                name: basic-jd
                namespace: modelbiasjobdefinition
              status:
                resourceName: modelbiasjobdefinition-basic-jd
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelBiasJobDefinition
              metadata:
                name: basic-jd
                namespace: modelbiasjobdefinition
              spec:
                jobDefinitionName: modelbiasjobdefinition-basic-jd
                roleARN: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                jobResources:
                  clusterConfig:
                    instanceType: ml.m5.xlarge

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelBiasJobDefinition
              metadata:
                name: arn-jd
                namespace: modelbiasjobdefinition
              spec:
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelBiasAppSpecification:
                  imageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelBiasJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelBiasJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelBiasJobDefinition
              metadata:
                name: arn-jd
                namespace: modelbiasjobdefinition
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:model-bias-job-definition/modelbiasjobdefinition-arn-jd"

    # AC-3: mandatory instanceType and kmsKeyId override
    - name: ac3-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: mandatory-policy
                namespace: modelbiasjobdefinition
                labels:
                  aws.kropath.run/resource-name: mandatory-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  instanceType: ml.m5.4xlarge
                  kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/mrk-mandatory
                  enableNetworkIsolation: true
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    instanceType: ml.m5.4xlarge
                    kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/mrk-mandatory
                    enableNetworkIsolation: true
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelBiasJobDefinition
              metadata:
                name: mand-jd
                namespace: modelbiasjobdefinition
              spec:
                configRef: mandatory-policy
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelBiasAppSpecification:
                  imageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelBiasJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelBiasJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceType: ml.m5.xlarge
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
                enableNetworkIsolation: false
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelBiasJobDefinition
              metadata:
                name: mand-jd
                namespace: modelbiasjobdefinition
              spec:
                jobResources:
                  clusterConfig:
                    instanceType: ml.m5.4xlarge
                    volumeKMSKeyID: arn:aws:kms:us-east-1:123456789012:key/mrk-mandatory
                networkConfig:
                  enableNetworkIsolation: true

    # AC-4: tags cascade
    - name: ac4-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: modelbiasjobdefinition
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      env: prod
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags:
                      team: ml
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelBiasJobDefinition
              metadata:
                name: tags-jd
                namespace: modelbiasjobdefinition
              spec:
                configRef: tags-policy
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelBiasAppSpecification:
                  imageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelBiasJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelBiasJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
                tags:
                  project: monitoring
        - script:
            content: |
              KIND=modelbiasjobdefinition
              TAGS=$(kubectl get ModelBiasJobDefinition tags-jd -n modelbiasjobdefinition -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")' 2>/dev/null)
              if [ -z "$TAGS" ]; then
                PLURAL=$(kubectl api-resources --api-group=sagemaker.services.k8s.aws --no-headers 2>/dev/null | awk '{print $1}' | grep -i "modelbiasjobdefinition" | head -1)
                TAGS=$(kubectl get $PLURAL tags-jd -n modelbiasjobdefinition -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")' 2>/dev/null)
              fi
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=monitoring" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-5: deletion policy
    - name: ac5-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelBiasJobDefinition
              metadata:
                name: del-jd
                namespace: modelbiasjobdefinition
              spec:
                deletionPolicy: delete
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelBiasAppSpecification:
                  imageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelBiasJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelBiasJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelBiasJobDefinition
              metadata:
                name: del-jd
                namespace: modelbiasjobdefinition
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # Standard labels
    - name: ac-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerModelBiasJobDefinition
              metadata:
                name: std-jd
                namespace: modelbiasjobdefinition
              spec:
                roleArn: arn:aws:iam::123456789012:role/SageMakerMonitoringRole
                modelBiasAppSpecification:
                  imageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/monitor:latest
                modelBiasJobInput:
                  endpointInput:
                    endpointName: my-endpoint
                    localPath: /opt/ml/processing/input/endpoint
                modelBiasJobOutputConfig:
                  monitoringOutputs:
                    - s3Output:
                        s3URI: s3://my-bucket/output
                        localPath: /opt/ml/processing/output
                clusterConfigInstanceCount: 1
                clusterConfigVolumeSizeInGB: 20
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: ModelBiasJobDefinition
              metadata:
                name: std-jd
                namespace: modelbiasjobdefinition
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-jd
