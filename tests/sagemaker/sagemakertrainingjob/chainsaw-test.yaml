apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakertrainingjob
spec:
  namespace: sagemakertrainingjob
  steps:
    # AC-1: Basic creation with required fields
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakertrainingjob
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: basic-tj
                namespace: sagemakertrainingjob
              spec:
                algorithmSpecification:
                  trainingInputMode: File
                  trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-training:latest
                resourceConfig:
                  instanceType: ml.m5.xlarge
                  instanceCount: 1
                  volumeSizeInGB: 30
                stoppingCondition:
                  maxRuntimeInSeconds: 3600
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                outputDataConfigS3OutputPath: s3://my-bucket/output
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: basic-tj
                namespace: sagemakertrainingjob
              status:
                resourceName: sagemakertrainingjob-basic-tj
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TrainingJob
              metadata:
                name: basic-tj
                namespace: sagemakertrainingjob
              spec:
                trainingJobName: sagemakertrainingjob-basic-tj
                outputDataConfig:
                  s3OutputPath: s3://my-bucket/output

    # AC-2: predictedArn
    - name: ac2-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: arn-tj
                namespace: sagemakertrainingjob
              spec:
                algorithmSpecification:
                  trainingInputMode: File
                  trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-training:latest
                resourceConfig:
                  instanceType: ml.m5.xlarge
                  instanceCount: 1
                  volumeSizeInGB: 30
                stoppingCondition:
                  maxRuntimeInSeconds: 3600
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                outputDataConfigS3OutputPath: s3://my-bucket/output
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: arn-tj
                namespace: sagemakertrainingjob
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:training-job/sagemakertrainingjob-arn-tj"

    # AC-3: kmsKeyId governance — injected into outputDataConfig.kmsKeyID
    - name: ac3-kms-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: kms-policy
                namespace: sagemakertrainingjob
                labels:
                  aws.kropath.run/resource-name: kms-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/mand-key
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/mand-key
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: kms-tj
                namespace: sagemakertrainingjob
              spec:
                configRef: kms-policy
                algorithmSpecification:
                  trainingInputMode: File
                  trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-training:latest
                resourceConfig:
                  instanceType: ml.m5.xlarge
                  instanceCount: 1
                  volumeSizeInGB: 30
                stoppingCondition:
                  maxRuntimeInSeconds: 3600
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                outputDataConfigS3OutputPath: s3://my-bucket/output
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TrainingJob
              metadata:
                name: kms-tj
                namespace: sagemakertrainingjob
              spec:
                outputDataConfig:
                  kmsKeyID: arn:aws:kms:us-east-1:123456789012:key/mand-key

    # AC-4: nameOverride
    - name: ac4-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: override-tj
                namespace: sagemakertrainingjob
              spec:
                nameOverride: my-custom-training
                algorithmSpecification:
                  trainingInputMode: File
                  trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-training:latest
                resourceConfig:
                  instanceType: ml.m5.xlarge
                  instanceCount: 1
                  volumeSizeInGB: 30
                stoppingCondition:
                  maxRuntimeInSeconds: 3600
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                outputDataConfigS3OutputPath: s3://my-bucket/output
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: override-tj
                namespace: sagemakertrainingjob
              status:
                resourceName: my-custom-training

    # AC-5: enableNetworkIsolation mandatory override
    - name: ac5-network-isolation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: isolation-policy
                namespace: sagemakertrainingjob
                labels:
                  aws.kropath.run/resource-name: isolation-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  enableNetworkIsolation: true
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    enableNetworkIsolation: true
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: isolation-tj
                namespace: sagemakertrainingjob
              spec:
                configRef: isolation-policy
                enableNetworkIsolation: false
                algorithmSpecification:
                  trainingInputMode: File
                  trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-training:latest
                resourceConfig:
                  instanceType: ml.m5.xlarge
                  instanceCount: 1
                  volumeSizeInGB: 30
                stoppingCondition:
                  maxRuntimeInSeconds: 3600
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                outputDataConfigS3OutputPath: s3://my-bucket/output
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TrainingJob
              metadata:
                name: isolation-tj
                namespace: sagemakertrainingjob
              spec:
                enableNetworkIsolation: true

    # AC-6: deletion policy
    - name: ac6-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: del-tj
                namespace: sagemakertrainingjob
              spec:
                deletionPolicy: delete
                algorithmSpecification:
                  trainingInputMode: File
                  trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-training:latest
                resourceConfig:
                  instanceType: ml.m5.xlarge
                  instanceCount: 1
                  volumeSizeInGB: 30
                stoppingCondition:
                  maxRuntimeInSeconds: 3600
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                outputDataConfigS3OutputPath: s3://my-bucket/output
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TrainingJob
              metadata:
                name: del-tj
                namespace: sagemakertrainingjob
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-7: tags cascade
    - name: ac7-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakertrainingjob
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      env: prod
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags:
                      team: ml
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: tags-tj
                namespace: sagemakertrainingjob
              spec:
                configRef: tags-policy
                tags:
                  project: mytrain
                algorithmSpecification:
                  trainingInputMode: File
                  trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-training:latest
                resourceConfig:
                  instanceType: ml.m5.xlarge
                  instanceCount: 1
                  volumeSizeInGB: 30
                stoppingCondition:
                  maxRuntimeInSeconds: 3600
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                outputDataConfigS3OutputPath: s3://my-bucket/output
        - script:
            content: |
              TAGS=$(kubectl get trainingjob tags-tj -n sagemakertrainingjob -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=mytrain" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-8: standard labels
    - name: ac8-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerTrainingJob
              metadata:
                name: std-tj
                namespace: sagemakertrainingjob
              spec:
                algorithmSpecification:
                  trainingInputMode: File
                  trainingImage: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-training:latest
                resourceConfig:
                  instanceType: ml.m5.xlarge
                  instanceCount: 1
                  volumeSizeInGB: 30
                stoppingCondition:
                  maxRuntimeInSeconds: 3600
                roleArn: arn:aws:iam::123456789012:role/SageMakerRole
                outputDataConfigS3OutputPath: s3://my-bucket/output
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: TrainingJob
              metadata:
                name: std-tj
                namespace: sagemakertrainingjob
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-tj
