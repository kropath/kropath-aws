apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sagemakerpipeline
spec:
  namespace: sagemakerpipeline
  steps:
    # AC-1: Basic creation with roleArn and pipelineDefinition
    - name: ac1-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: general-policy
                namespace: sagemakerpipeline
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  namingTemplate: "{namespace}-{name}"
              status:
                effectiveConfig:
                  mandatory:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags: {}
                    syncedLabels: {}
                    syncedAnnotations: {}
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerPipeline
              metadata:
                name: basic-pipeline
                namespace: sagemakerpipeline
              spec:
                roleArn: arn:aws:iam::123456789012:role/SageMakerPipelineRole
                pipelineDefinition: '{"Version":"2020-12-01","Steps":[]}'
                pipelineDescription: Test pipeline
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerPipeline
              metadata:
                name: basic-pipeline
                namespace: sagemakerpipeline
              status:
                resourceName: sagemakerpipeline-basic-pipeline
                namingStatus: valid
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Pipeline
              metadata:
                name: basic-pipeline
                namespace: sagemakerpipeline
              spec:
                pipelineName: sagemakerpipeline-basic-pipeline
                roleARN: arn:aws:iam::123456789012:role/SageMakerPipelineRole

    # AC-4: predictedArn
    - name: ac4-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerPipeline
              metadata:
                name: arn-pipeline
                namespace: sagemakerpipeline
              spec:
                roleArn: arn:aws:iam::123456789012:role/SageMakerPipelineRole
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerPipeline
              metadata:
                name: arn-pipeline
                namespace: sagemakerpipeline
              status:
                predictedArn: "arn:aws:sagemaker:us-east-1:123456789012:pipeline/sagemakerpipeline-arn-pipeline"

    # AC-5: tags cascade
    - name: ac5-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerConfig
              metadata:
                name: tags-policy
                namespace: sagemakerpipeline
                labels:
                  aws.kropath.run/resource-name: tags-policy
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  tags:
                    team: ml
                  syncedLabels: {}
                  syncedAnnotations: {}
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      env: prod
                    syncedLabels: {}
                    syncedAnnotations: {}
                  defaults:
                    tags:
                      team: ml
                    syncedLabels: {}
                    syncedAnnotations: {}
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerPipeline
              metadata:
                name: tags-pipeline
                namespace: sagemakerpipeline
              spec:
                configRef: tags-policy
                roleArn: arn:aws:iam::123456789012:role/SageMakerPipelineRole
                tags:
                  project: mlops
        - script:
            content: |
              TAGS=$(kubectl get pipeline tags-pipeline -n sagemakerpipeline -o json | jq -r '.spec.tags | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || (echo "FAIL: mandatory env tag missing" && exit 1)
              echo "$TAGS" | grep -q "project=mlops" || (echo "FAIL: spec project tag missing" && exit 1)
              echo "$TAGS" | grep -q "team=ml" || (echo "FAIL: defaults team tag missing" && exit 1)
              echo "PASS"

    # AC-14: deletion policy
    - name: ac14-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerPipeline
              metadata:
                name: del-pipeline
                namespace: sagemakerpipeline
              spec:
                deletionPolicy: delete
                roleArn: arn:aws:iam::123456789012:role/SageMakerPipelineRole
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Pipeline
              metadata:
                name: del-pipeline
                namespace: sagemakerpipeline
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # Standard labels
    - name: ac-standard-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SageMakerPipeline
              metadata:
                name: std-pipeline
                namespace: sagemakerpipeline
              spec:
                roleArn: arn:aws:iam::123456789012:role/SageMakerPipelineRole
        - assert:
            resource:
              apiVersion: sagemaker.services.k8s.aws/v1alpha1
              kind: Pipeline
              metadata:
                name: std-pipeline
                namespace: sagemakerpipeline
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: std-pipeline
