        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: ac2-stream
                namespace: kinesisstream
              spec:
                configRef: ac2-cfg
                streamMode: provisioned
                shardCount: 4
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
