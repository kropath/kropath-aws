              metadata:
                name: ac2-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  streamMode: ""
                  shardCount: 0
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  streamMode: "on_demand"
                  shardCount: 0
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
