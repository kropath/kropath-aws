# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named KinesisConfig + KinesisStream
# resources and deletes nothing between steps. skipDelete: true stops chainsaw's
# end-of-test cascade; the ephemeral kind cluster is discarded after the suite.
#
# Implementation note: kro CEL prohibits int/null mixed ternary branches, so the
# shardCount field returns 0 as a sentinel for ON_DEMAND mode (not absent). Tests
# assert shardCount: 0 for ON_DEMAND scenarios. This is a known kro limitation
# documented in docs/troubleshooting-logs/.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kinesisstream
spec:
  skipDelete: true
  namespace: kinesisstream
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: defaults.streamMode "on_demand"; instance streamMode empty
    # → ACK Stream streamModeDetails.streamMode: ON_DEMAND; shardCount: 0 (sentinel)
    - name: ac1-streammode-default-ondemand
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac1-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  streamMode: ""
                  shardCount: 0
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  streamMode: "on_demand"
                  shardCount: 0
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch kinesisconfig ac1-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: ac1-stream
                namespace: kinesisstream
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: ac1-stream
                namespace: kinesisstream
              spec:
                name: kinesisstream-ac1-stream
                streamModeDetails:
                  streamMode: ON_DEMAND
                shardCount: 0
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: ac1-stream
                namespace: kinesisstream
              status:
                resourceName: kinesisstream-ac1-stream
                namingStatus: valid
                predictedArn: arn:aws:kinesis:ap-southeast-2:123456789012:stream/kinesisstream-ac1-stream

    # AC-2: defaults on_demand; instance streamMode "provisioned", shardCount 4 → instance wins
    # → PROVISIONED, shardCount: 4
    - name: ac2-streammode-instance-provisioned
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
