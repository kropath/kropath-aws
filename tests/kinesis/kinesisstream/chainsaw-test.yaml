# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named KinesisConfig + KinesisStream
# and deletes nothing between steps, so no ACK finalizer ever blocks a delete.
# Test-level skipDelete: true stops chainsaw's end-of-test cascade delete;
# the ephemeral kind cluster is discarded after the suite.
#
# Note on shardCount: the RGD always emits an integer shardCount (1 minimum) to
# satisfy CEL strict ternary type alignment — AWS ignores shardCount for ON_DEMAND
# streams; see frequent-rgd-errors.md §"Strict Ternary Type Alignment".
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kinesisstream
spec:
  skipDelete: true
  namespace: kinesisstream
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: defaults on_demand; instance empty → ACK ON_DEMAND; shardCount 1 (built-in min)
    - name: ac1-streammode-default-ondemand
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac1-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac1-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: sm-default-od
                namespace: kinesisstream
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: sm-default-od
                namespace: kinesisstream
              spec:
                streamModeDetails:
                  streamMode: ON_DEMAND
                shardCount: 1
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: sm-default-od
                namespace: kinesisstream
              status:
                resourceName: kinesisstream-sm-default-od
                namingStatus: valid

    # AC-2: defaults on_demand; instance provisioned + shardCount 4 → instance wins
    - name: ac2-streammode-instance-provisioned
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac2-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  streamMode: on_demand
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac2-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: sm-inst-prov
                namespace: kinesisstream
              spec:
                configRef: ac2-cfg
                streamMode: provisioned
                shardCount: 4
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: sm-inst-prov
                namespace: kinesisstream
              spec:
                streamModeDetails:
                  streamMode: PROVISIONED
                shardCount: 4

    # AC-3: mandatory on_demand; instance provisioned → mandatory wins; shardCount 1 (ON_DEMAND min)
    - name: ac3-streammode-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac3-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  streamMode: on_demand
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac3-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: sm-mand-override
                namespace: kinesisstream
              spec:
                configRef: ac3-cfg
                streamMode: provisioned
                shardCount: 8
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: sm-mand-override
                namespace: kinesisstream
              spec:
                streamModeDetails:
                  streamMode: ON_DEMAND
                shardCount: 1

    # AC-4: defaults provisioned + shardCount 2; instance empty → defaults applied
    - name: ac4-streammode-provisioned-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac4-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  streamMode: provisioned
                  shardCount: 2
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac4-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"provisioned","shardCount":2,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: sm-prov-defaults
                namespace: kinesisstream
              spec:
                configRef: ac4-cfg
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: sm-prov-defaults
                namespace: kinesisstream
              spec:
                streamModeDetails:
                  streamMode: PROVISIONED
                shardCount: 2

    # AC-5: mandatory.shardCount 4; instance 8; provisioned → mandatory wins
    - name: ac5-shardcount-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac5-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  shardCount: 4
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac5-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"provisioned","shardCount":4,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: sc-mand-override
                namespace: kinesisstream
              spec:
                configRef: ac5-cfg
                streamMode: provisioned
                shardCount: 8
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: sc-mand-override
                namespace: kinesisstream
              spec:
                streamModeDetails:
                  streamMode: PROVISIONED
                shardCount: 4

    # AC-6: defaults.shardCount 2; instance 0; provisioned → default applied
    - name: ac6-shardcount-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac6-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  shardCount: 2
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac6-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"provisioned","shardCount":2,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: sc-default
                namespace: kinesisstream
              spec:
                configRef: ac6-cfg
                streamMode: provisioned
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: sc-default
                namespace: kinesisstream
              spec:
                streamModeDetails:
                  streamMode: PROVISIONED
                shardCount: 2

    # AC-7: no config shard; instance 0; provisioned → built-in: shardCount 1
    - name: ac7-shardcount-builtin-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac7-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac7-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: sc-builtin
                namespace: kinesisstream
              spec:
                configRef: ac7-cfg
                streamMode: provisioned
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: sc-builtin
                namespace: kinesisstream
              spec:
                streamModeDetails:
                  streamMode: PROVISIONED
                shardCount: 1

    # AC-8: defaults.shardCount 4; on_demand → shardCount 1 (ON_DEMAND minimum; AWS ignores it)
    - name: ac8-shardcount-ignored-ondemand
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac8-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  shardCount: 4
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac8-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"on_demand","shardCount":4,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: sc-od-ignore
                namespace: kinesisstream
              spec:
                configRef: ac8-cfg
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: sc-od-ignore
                namespace: kinesisstream
              spec:
                streamModeDetails:
                  streamMode: ON_DEMAND
                shardCount: 1

    # AC-9: {namespace}-{name} template → resourceName: kinesisstream-click-events
    - name: ac9-naming-standard
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac9-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac9-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: click-events
                namespace: kinesisstream
              spec:
                configRef: ac9-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: click-events
                namespace: kinesisstream
              status:
                resourceName: kinesisstream-click-events
                namingStatus: valid
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: click-events
                namespace: kinesisstream
              spec:
                name: kinesisstream-click-events

    # AC-10: mandatory template corp-{namespace}-{name}
    - name: ac10-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac10-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  namingTemplate: "corp-{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac10-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: naming-mand
                namespace: kinesisstream
              spec:
                configRef: ac10-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: naming-mand
                namespace: kinesisstream
              status:
                resourceName: corp-kinesisstream-naming-mand
                namingStatus: valid
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: naming-mand
                namespace: kinesisstream
              spec:
                name: corp-kinesisstream-naming-mand

    # AC-11: spec.nameOverride: my-custom-stream → template bypassed
    - name: ac11-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac11-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac11-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: naming-override
                namespace: kinesisstream
              spec:
                configRef: ac11-cfg
                nameOverride: my-custom-stream
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: naming-override
                namespace: kinesisstream
              status:
                resourceName: my-custom-stream
                namingStatus: valid
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: naming-override
                namespace: kinesisstream
              spec:
                name: my-custom-stream

    # AC-12: {tag.env}-{name}; env absent → kro keeps "{tag.env}" verbatim in name but
    # namingStatus is "valid" (the `{tag.*}` token was processed — key just wasn't found,
    # so it emits "{tag.env}" literal which does NOT contain an unresolved "{" ...
    # Wait: the CEL keeps "{tag.env}" if the key is missing (see RGD logic), which contains "{".
    # namingStatus check: "{tag.env}" DOES contain "{", so namingStatus = "invalid-unresolved-tokens".
    # Actually re-reading the RGD: if the tag key is not found in any tier, we emit "{tag.<key>}":
    #   ? "{tag." + part.split("}")[0] + "}"
    # So for missing tag, the name contains "{tag.env}-naming-missing-tag" which contains "{"
    # → namingStatus = "invalid-unresolved-tokens" and ackStream is NOT created (includeWhen: false)
    # AC-12 is: tag key absent → ACK Stream NOT created, namingStatus invalid
    - name: ac12-naming-missing-tag-no-stream
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac12-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.env}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac12-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: naming-missing-tag
                namespace: kinesisstream
              spec:
                configRef: ac12-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: naming-missing-tag
                namespace: kinesisstream
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              # ACK Stream must NOT be created when namingStatus is invalid
              count=$(kubectl get stream naming-missing-tag -n kinesisstream --ignore-not-found 2>/dev/null | wc -l)
              if [ "$count" -gt 1 ]; then
                echo "FAIL: ACK Stream was created despite invalid naming status"
                exit 1
              fi
              echo "OK: ACK Stream not created"

    # AC-12a: {env}-{name} (unrecognized token, not {tag.*} form) → namingStatus: invalid-unresolved-tokens
    - name: ac12a-naming-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac12a-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac12a-cfg
              spec:
                defaults:
                  namingTemplate: "{env}-{name}"
        - script:
            content: |
              kubectl patch kinesisconfig ac12a-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"","shardCount":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"{env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: naming-bad-token
                namespace: kinesisstream
              spec:
                configRef: ac12a-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: naming-bad-token
                namespace: kinesisstream
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              count=$(kubectl get stream naming-bad-token -n kinesisstream --ignore-not-found 2>/dev/null | wc -l)
              if [ "$count" -gt 1 ]; then
                echo "FAIL: ACK Stream was created despite invalid naming status"
                exit 1
              fi
              echo "OK: ACK Stream not created for bad-token case"

    # AC-13: tags merged from KinesisConfig + instance — merged order: defaults→spec→mandatory
    - name: ac13-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisConfig
              metadata:
                name: ac13-cfg
                namespace: kinesisstream
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                mandatory:
                  tags:
                    env: prod
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: platform
        - script:
            content: |
              kubectl patch kinesisconfig ac13-cfg -n kinesisstream \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"streamMode":"on_demand","shardCount":0,"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"streamMode":"","shardCount":0,"namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KinesisStream
              metadata:
                name: tags-merge
                namespace: kinesisstream
              spec:
                configRef: ac13-cfg
                tags:
                  component: events
        - assert:
            resource:
              apiVersion: kinesis.services.k8s.aws/v1alpha1
              kind: Stream
              metadata:
                name: tags-merge
                namespace: kinesisstream
        - script:
            content: |
