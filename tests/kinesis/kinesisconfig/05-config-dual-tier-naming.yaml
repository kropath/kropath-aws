# AC-5: mandatory.namingTemplate AND defaults.namingTemplate both non-empty → CEL reject
---
apiVersion: aws.kropath.run/v1alpha1
kind: KinesisConfig
metadata:
  name: ac5-dual-tier-naming
  namespace: kinesisconfig
spec:
  mandatory:
    streamMode: ""
    shardCount: 0
    namingTemplate: "corp-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    streamMode: ""
    shardCount: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
