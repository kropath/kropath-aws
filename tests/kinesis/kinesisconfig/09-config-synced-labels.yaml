# AC-9: effectiveConfig.mandatory.syncedLabels contains data-class: streaming;
# RGD applies this as both K8s label and cloud tag.
---
apiVersion: aws.kropath.run/v1alpha1
kind: KinesisConfig
metadata:
  name: synced-labels-config
  namespace: kinesisconfig
  labels:
    aws.kropath.run/resource-name: synced-labels-config
spec:
  mandatory:
    streamMode: ""
    shardCount: 0
    namingTemplate: ""
    tags: {}
    syncedLabels:
      data-class: streaming
    syncedAnnotations: {}
  defaults:
    streamMode: "on_demand"
    shardCount: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
