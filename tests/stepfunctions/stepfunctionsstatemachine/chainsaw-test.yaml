                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              for _ in $(seq 1 60); do
                kubectl get statemachines.sfn.services.k8s.aws standard-metadata -n stepfunctionsstatemachine >/dev/null 2>&1 && break
                sleep 1
              done
              OWNER=$(kubectl get statemachines.sfn.services.k8s.aws standard-metadata -n stepfunctionsstatemachine \
                -o jsonpath='{.metadata.ownerReferences[0].kind}')
              [ "$OWNER" = "StepFunctionsStateMachine" ] || { echo "FAIL: ownerRef.kind=$OWNER, expected StepFunctionsStateMachine"; exit 1; }
              CTL=$(kubectl get statemachines.sfn.services.k8s.aws standard-metadata -n stepfunctionsstatemachine \
                -o jsonpath='{.metadata.ownerReferences[0].controller}')
              [ "$CTL" = "true" ] || { echo "FAIL: ownerRef.controller=$CTL, expected true"; exit 1; }
              echo "PASS: standard metadata wired correctly"

    # ── AC-30 / AC-31: deletion-policy ───────────────────────────────────────────────────
    # AC-30: spec.deletionPolicy="delete" → ACK annotation delete
    # AC-31: spec.deletionPolicy="retain" (default) → ACK annotation retain
    - name: ac30-ac31-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac30-cfg
                labels:
                  aws.kropath.run/resource-name: ac30-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac30-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: deletion-delete
              spec:
                configRef: ac30-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: deletion-delete
                annotations:
                  services.k8s.aws/deletion-policy: delete
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: deletion-retain
              spec:
                configRef: ac30-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: deletion-retain
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # ── AC-32: status-arn-populated ──────────────────────────────────────────────────────
    # status.stateMachineArn populated from ACK StateMachine status.ackResourceMetadata.arn
    - name: ac32-status-arn-populated
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac32-cfg
                labels:
                  aws.kropath.run/resource-name: ac32-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac32-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: status-arn
              spec:
                configRef: ac32-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
        - script:
            content: |
              # Wait for the ACK StateMachine to be created, then patch its status to inject an ARN
              for _ in $(seq 1 60); do
                kubectl get statemachines.sfn.services.k8s.aws status-arn -n stepfunctionsstatemachine >/dev/null 2>&1 && break
                sleep 1
              done
              kubectl patch statemachines.sfn.services.k8s.aws status-arn -n stepfunctionsstatemachine \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:states:ap-southeast-2:123456789012:stateMachine:stepfunctionsstatemachine-status-arn"}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: status-arn
              status:
                stateMachineArn: "arn:aws:states:ap-southeast-2:123456789012:stateMachine:stepfunctionsstatemachine-status-arn"
