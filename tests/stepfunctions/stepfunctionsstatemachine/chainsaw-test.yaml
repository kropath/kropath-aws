    # ── AC-25: tags cascade — mandatory wins over instance and defaults ───────────────────────
    # Use jq script assert — tags list order is map-derived, not positional-stable.
    - name: ac25-tags-cascade-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac25-cfg
                namespace: stepfunctionsstatemachine
                labels:
                  aws.kropath.run/resource-name: ac25-cfg
