                  syncedAnnotations: {}
                defaults:
                  loggingLevel: "OFF"
                  tracingEnabled: false
                  includeExecutionData: false
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    env: staging
                    team: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac25-cfg -n stepfunctionsstatemachine \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{"env":"production","managed-by":"kropath"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{"env":"staging","team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: ac25-sm
                namespace: stepfunctionsstatemachine
              spec:
                configRef: ac25-cfg
                definition: '{"Comment":"Test","StartAt":"Done","States":{"Done":{"Type":"Succeed"}}}'
                tags:
                  env: override-attempt
                  instance-tag: "yes"
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: ac25-sm
                namespace: stepfunctionsstatemachine
        # Mandatory env=production must win; instance env=override-attempt is discarded.
        - script:
            timeout: 5m
            content: |
              set -e
              for i in $(seq 1 30); do
                TAGS=$(kubectl get statemachine ac25-sm -n stepfunctionsstatemachine -o json | jq -r '.spec.tags // []')
                ENV_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="env") | .value')
                MANAGED_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="managed-by") | .value')
                TEAM_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="team") | .value')
                if [ "$ENV_VAL" = "production" ] && [ "$MANAGED_VAL" = "kropath" ] && [ "$TEAM_VAL" = "platform" ]; then
                  echo "Tags correct: env=production managed-by=kropath team=platform"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: expected tags not found. Got: $TAGS"
              exit 1

