# aws-sfn-02 Chainsaw tests — StepFunctionsStateMachine RGD, 32 acceptance criteria.
# Namespace: stepfunctionsstatemachine. Default naming: {namespace}-{name}.
#
# CANONICAL pattern (unique config + resource name per step, skipDelete globally):
# each step uses its own acN-cfg to avoid effectiveConfig cross-contamination between
# concurrently reconciled instances. effectiveConfig is injected via
# `kubectl patch --subresource=status` to mock kropath-controller.
#
# ACK StateMachine CRDs (statemachines.sfn.services.k8s.aws) are installed via setup.sh.
# No live ACK controller — child StateMachine CRs are created by kro from the RGD template
# and assertions verify the generated spec, not AWS provisioning results.
#
# AC-16 (type immutability): enforced by ACK at the AWS API level; the ACK CRD in the test
# cluster may not carry x-kubernetes-validations on type_ — see the test step comment.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: stepfunctionsstatemachine
spec:
  namespace: stepfunctionsstatemachine
  steps:

    # ── AC-1 / AC-4: logging-default-off and logging-builtin-default ─────────────────────
    # AC-1: defaults.loggingLevel="OFF"; instance loggingLevel empty → level="OFF", empty destinations
    # AC-4: All loggingLevel tiers empty → built-in default "OFF", empty destinations
    - name: ac1-ac4-logging-default-off
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac1-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: logging-default-off
              spec:
                configRef: ac1-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: logging-default-off
              spec:
                loggingConfiguration:
                  level: "OFF"
        - script:
            content: |
              DESTS=$(kubectl get statemachines.sfn.services.k8s.aws logging-default-off -n stepfunctionsstatemachine -o jsonpath='{.spec.loggingConfiguration.destinations}')
              [ "$DESTS" = "" ] || [ "$DESTS" = "[]" ] || { echo "FAIL: destinations should be empty, got: $DESTS"; exit 1; }
              echo "PASS: loggingLevel=OFF and destinations empty"

    # ── AC-2: logging-mandatory-override ─────────────────────────────────────────────────
    # mandatory.loggingLevel="ALL" wins over instance "ERROR"
    - name: ac2-logging-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac2-cfg
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {loggingLevel: "ALL", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "ERROR", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac2-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"ALL","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"ERROR","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: logging-mandatory
              spec:
                configRef: ac2-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                loggingLevel: "ERROR"
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: logging-mandatory
              spec:
                loggingConfiguration:
                  level: "ALL"

    # ── AC-3: logging-instance-override ──────────────────────────────────────────────────
    # instance loggingLevel="ALL" wins over defaults "ERROR"; logDestinationArn set → destinations populated
    - name: ac3-logging-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac3-cfg
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "ERROR", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac3-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"ERROR","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: logging-instance
              spec:
                configRef: ac3-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                loggingLevel: "ALL"
                logDestinationArn: "arn:aws:logs:ap-southeast-2:123456789012:log-group:/aws/states/my-sm"
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: logging-instance
              spec:
                loggingConfiguration:
                  level: "ALL"
        - script:
            content: |
              for _ in $(seq 1 60); do
                kubectl get statemachines.sfn.services.k8s.aws logging-instance -n stepfunctionsstatemachine >/dev/null 2>&1 && break
                sleep 1
              done
              DEST=$(kubectl get statemachines.sfn.services.k8s.aws logging-instance -n stepfunctionsstatemachine \
                -o jsonpath='{.spec.loggingConfiguration.destinations[0].cloudWatchLogsLogGroup.logGroupARN}')
              [ "$DEST" = "arn:aws:logs:ap-southeast-2:123456789012:log-group:/aws/states/my-sm" ] || \
                { echo "FAIL: logGroupARN=$DEST"; exit 1; }
              echo "PASS: instance loggingLevel=ALL wins over defaults, destinations populated"

    # ── AC-5: tracing-mandatory-override ─────────────────────────────────────────────────
    # mandatory.tracingEnabled=true wins over instance spec.tracingEnabled=false
    - name: ac5-tracing-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac5-cfg
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory: {loggingLevel: "", tracingEnabled: true, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac5-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","tracingEnabled":true,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: tracing-mandatory
              spec:
                configRef: ac5-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                tracingEnabled: false
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: tracing-mandatory
              spec:
                tracingConfiguration:
                  enabled: true

    # ── AC-6: tracing-instance-override ──────────────────────────────────────────────────
    # instance tracingEnabled=true wins over defaults.tracingEnabled=false
    - name: ac6-tracing-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac6-cfg
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac6-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: tracing-instance
              spec:
                configRef: ac6-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                tracingEnabled: true
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: tracing-instance
              spec:
                tracingConfiguration:
                  enabled: true

    # ── AC-7 / AC-8: tracing-default and tracing-builtin-default ─────────────────────────
    # AC-7: defaults.tracingEnabled=false applied (instance absent)
    # AC-8: all tracingEnabled tiers absent → built-in default false
    - name: ac7-ac8-tracing-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac7-cfg
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac7-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: tracing-default
              spec:
                configRef: ac7-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: tracing-default
              spec:
                tracingConfiguration:
                  enabled: false

    # ── AC-9: execdata-mandatory-override ────────────────────────────────────────────────
    # mandatory.includeExecutionData=false wins over instance spec.includeExecutionData=true
    - name: ac9-execdata-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac9-cfg
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory: {loggingLevel: "", includeExecutionData: false, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac9-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","includeExecutionData":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: execdata-mandatory
              spec:
                configRef: ac9-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                includeExecutionData: true
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: execdata-mandatory
              spec:
                loggingConfiguration:
                  includeExecutionData: false

    # ── AC-10: execdata-instance-override ────────────────────────────────────────────────
    # instance spec.includeExecutionData=true wins over defaults.includeExecutionData=false
    - name: ac10-execdata-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac10-cfg
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac10-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: execdata-instance
              spec:
                configRef: ac10-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                includeExecutionData: true
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: execdata-instance
              spec:
                loggingConfiguration:
                  includeExecutionData: true

    # ── AC-11: execdata-builtin-default ──────────────────────────────────────────────────
    # All includeExecutionData tiers absent → built-in default false
    - name: ac11-execdata-builtin-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac11-cfg
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac11-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: execdata-builtin
              spec:
                configRef: ac11-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: execdata-builtin
              spec:
                loggingConfiguration:
                  includeExecutionData: false

    # ── AC-12: logging-full-config ───────────────────────────────────────────────────────
    # Full logging config: level=ALL, includeExecutionData=true, logDestinationArn set → nested ACK shape
    - name: ac12-logging-full-config
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac12-cfg
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac12-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: logging-full
              spec:
                configRef: ac12-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                loggingLevel: "ALL"
                includeExecutionData: true
                logDestinationArn: "arn:aws:logs:ap-southeast-2:123456789012:log-group:/aws/states/my-sm"
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: logging-full
              spec:
                loggingConfiguration:
                  level: "ALL"
                  includeExecutionData: true
        - script:
            content: |
              for _ in $(seq 1 60); do
                kubectl get statemachines.sfn.services.k8s.aws logging-full -n stepfunctionsstatemachine >/dev/null 2>&1 && break
                sleep 1
              done
              DEST=$(kubectl get statemachines.sfn.services.k8s.aws logging-full -n stepfunctionsstatemachine \
                -o jsonpath='{.spec.loggingConfiguration.destinations[0].cloudWatchLogsLogGroup.logGroupARN}')
              [ "$DEST" = "arn:aws:logs:ap-southeast-2:123456789012:log-group:/aws/states/my-sm" ] || \
                { echo "FAIL: logGroupARN=$DEST"; exit 1; }
              echo "PASS: full logging config with correct nested ACK shape"

    # ── AC-13: logging-off-no-destinations ──────────────────────────────────────────────
    # level=OFF → destinations must be empty regardless of logDestinationArn
    - name: ac13-logging-off-no-destinations
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac13-cfg
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac13-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: logging-off
              spec:
                configRef: ac13-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                loggingLevel: "OFF"
                logDestinationArn: "arn:aws:logs:ap-southeast-2:123456789012:log-group:/aws/states/my-sm"
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: logging-off
              spec:
                loggingConfiguration:
                  level: "OFF"
        - script:
            content: |
              DESTS=$(kubectl get statemachines.sfn.services.k8s.aws logging-off -n stepfunctionsstatemachine -o jsonpath='{.spec.loggingConfiguration.destinations}')
              [ "$DESTS" = "" ] || [ "$DESTS" = "[]" ] || { echo "FAIL: destinations not empty when level=OFF, got: $DESTS"; exit 1; }
              echo "PASS: level=OFF → empty destinations"

    # ── AC-14 / AC-15: type-default-standard and type-express ───────────────────────────
    # AC-14: spec.type empty → type_="STANDARD"
    # AC-15: spec.type="EXPRESS" → type_="EXPRESS"
    - name: ac14-ac15-type-default-and-express
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac14-cfg
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac14-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: type-standard
              spec:
                configRef: ac14-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: type-standard
              spec:
                type_: "STANDARD"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: type-express
              spec:
                configRef: ac14-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                type: "EXPRESS"
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: type-express
              spec:
                type_: "EXPRESS"

    # ── AC-16: type-immutable ─────────────────────────────────────────────────────────────
    # Immutability of spec.type: STANDARD → EXPRESS update is rejected.
    # In production, this is enforced by ACK at the AWS API level (AWS Step Functions returns
