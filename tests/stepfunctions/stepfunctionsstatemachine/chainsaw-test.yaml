# aws-sfn-02 Chainsaw tests — StepFunctionsStateMachine RGD.
# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named resources and deletes nothing between
# steps. No ACK controllers run in the local cluster so ACK finalizers are never removed;
# skipDelete prevents chainsaw's cascade delete from hanging. The ephemeral kind cluster
# is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: stepfunctionsstatemachine
spec:
  skipDelete: true
  namespace: stepfunctionsstatemachine
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ── AC-1: loggingLevel governance — mandatory wins over defaults and instance ──────────────
    - name: ac1-logging-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac1-cfg
                namespace: stepfunctionsstatemachine
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  loggingLevel: "ALL"
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  loggingLevel: ""
                  tracingEnabled: false
                  includeExecutionData: false
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac1-cfg -n stepfunctionsstatemachine \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"ALL","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"ERROR","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: ac1-sm
                namespace: stepfunctionsstatemachine
              spec:
                configRef: ac1-cfg
                definition: '{"Comment":"Test","StartAt":"Done","States":{"Done":{"Type":"Succeed"}}}'
                loggingLevel: "OFF"
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachine
              metadata:
                name: ac1-sm
                namespace: stepfunctionsstatemachine
              spec:
                loggingConfiguration:
                  level: ALL

    # ── AC-2: loggingLevel governance — instance wins over defaults ────────────────────────────
