    # ── AC-25 / AC-28: tags-merge and tags-list-format ──────────────────────────────────
    # AC-25: tags cascade from StepFunctionsConfig mandatory/instance/defaults; mandatory wins on collision
    # AC-28: ACK StateMachine spec.tags is list format [{key, value}], not a map
    - name: ac25-ac28-tags-merge-and-format
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac25-cfg
                labels:
                  aws.kropath.run/resource-name: ac25-cfg
              spec:
                mandatory: {loggingLevel: "", namingTemplate: "", tags: {service: workflows, env: prod}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {loggingLevel: "OFF", tracingEnabled: false, includeExecutionData: false, namingTemplate: "{namespace}-{name}", tags: {env: dev, team: platform}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac25-cfg -n stepfunctionsstatemachine --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"loggingLevel":"","namingTemplate":"","tags":{"service":"workflows","env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"loggingLevel":"OFF","tracingEnabled":false,"includeExecutionData":false,"namingTemplate":"{namespace}-{name}","tags":{"env":"dev","team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachine
              metadata:
                name: tags-merge
              spec:
                configRef: ac25-cfg
                definition: '{"StartAt":"Hello","States":{"Hello":{"Type":"Pass","End":true}}}'
                tags:
                  app: orders
                  env: staging
        - script:
            content: |
              for _ in $(seq 1 60); do
                kubectl get statemachines.sfn.services.k8s.aws tags-merge -n stepfunctionsstatemachine >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get statemachines.sfn.services.k8s.aws tags-merge -n stepfunctionsstatemachine -o json | jq -r '.spec.tags')
              echo "Tags: $TAGS"
              # Mandatory wins on collision: env=prod (not staging or dev)
              ENV=$(echo "$TAGS" | jq -r '.[] | select(.key == "env") | .value')
              [ "$ENV" = "prod" ] || { echo "FAIL: env=$ENV, expected prod (mandatory wins)"; exit 1; }
              # From mandatory: service=workflows
              SVC=$(echo "$TAGS" | jq -r '.[] | select(.key == "service") | .value')
              [ "$SVC" = "workflows" ] || { echo "FAIL: service=$SVC, expected workflows"; exit 1; }
              # From defaults: team=platform
              TEAM=$(echo "$TAGS" | jq -r '.[] | select(.key == "team") | .value')
              [ "$TEAM" = "platform" ] || { echo "FAIL: team=$TEAM, expected platform"; exit 1; }
              # From instance: app=orders
              APP=$(echo "$TAGS" | jq -r '.[] | select(.key == "app") | .value')
              [ "$APP" = "orders" ] || { echo "FAIL: app=$APP, expected orders"; exit 1; }
              # Verify list format: each element must have key and value fields
              BAD=$(echo "$TAGS" | jq '[.[] | select((has("key") and has("value")) | not)] | length')
              [ "$BAD" = "0" ] || { echo "FAIL: $BAD tags missing key or value field (should be list format)"; exit 1; }
              echo "PASS: tags cascade correct and list format verified"

