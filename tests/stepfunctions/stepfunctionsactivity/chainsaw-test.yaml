# aws-sfn-03 Chainsaw tests — StepFunctionsActivity RGD.
# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named resources and deletes nothing between
# steps. No ACK controllers run in the local cluster so ACK finalizers are never removed;
# skipDelete prevents chainsaw's cascade delete from hanging. The ephemeral kind cluster
# is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: stepfunctionsactivity
spec:
  skipDelete: true
  namespace: stepfunctionsactivity
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ── AC-1: tags-merge — mandatory KropathConfig + StepFunctionsConfig + instance tags all appear ──
    - name: ac1-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac1-cfg
                namespace: stepfunctionsactivity
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  tags:
                    service: workflows
                  namingTemplate: ""
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac1-cfg -n stepfunctionsactivity \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{"service":"workflows","cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsActivity
              metadata:
                name: ac1-act
                namespace: stepfunctionsactivity
              spec:
                configRef: ac1-cfg
                tags:
                  app: worker-pool
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: Activity
              metadata:
                name: ac1-act
                namespace: stepfunctionsactivity
        # Mandatory wins on key conflict; all three sources (KropathConfig, StepFunctionsConfig, instance) present.
        - script:
            timeout: 5m
            content: |
              set -e
              for i in $(seq 1 30); do
                TAGS=$(kubectl get activity ac1-act -n stepfunctionsactivity -o json | jq -r '.spec.tags // []')
                SERVICE_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="service") | .value')
                COST_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="cost-centre") | .value')
                APP_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="app") | .value')
                if [ "$SERVICE_VAL" = "workflows" ] && [ "$COST_VAL" = "platform" ] && [ "$APP_VAL" = "worker-pool" ]; then
                  echo "Tags correct: service=workflows cost-centre=platform app=worker-pool"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: expected tags not found. Got: $TAGS"
              exit 1

    # ── AC-2: synced-labels-dual — syncedLabels written to both K8s labels AND cloud tags ────
    - name: ac2-synced-labels-dual
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac2-cfg
                namespace: stepfunctionsactivity
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  tags: {}
                  namingTemplate: ""
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels:
                    data-class: internal
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac2-cfg -n stepfunctionsactivity \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsActivity
              metadata:
                name: ac2-act
                namespace: stepfunctionsactivity
              spec:
                configRef: ac2-cfg
        # Assert K8s metadata labels contain prefixed syncedLabels
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: Activity
              metadata:
                name: ac2-act
                namespace: stepfunctionsactivity
                labels:
                  (contains(keys(@), 'aws.kropath.run/environment')): true
                  (contains(keys(@), 'aws.kropath.run/data-class')): true
        # Also verify syncedLabels appear in cloud tags
        - script:
            timeout: 5m
            content: |
              set -e
              for i in $(seq 1 30); do
                TAGS=$(kubectl get activity ac2-act -n stepfunctionsactivity -o json | jq -r '.spec.tags // []')
                ENV_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="environment") | .value')
                DC_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="data-class") | .value')
                if [ "$ENV_VAL" = "production" ] && [ "$DC_VAL" = "internal" ]; then
                  echo "syncedLabels in cloud tags: environment=production data-class=internal"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: syncedLabels not in cloud tags. Got: $TAGS"
              exit 1

