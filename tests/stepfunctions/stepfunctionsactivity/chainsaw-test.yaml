                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac4-cfg -n stepfunctionsactivity \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsActivity
              metadata:
                name: ac4-act
                namespace: stepfunctionsactivity
              spec:
                configRef: ac4-cfg
                tags:
                  app: worker-pool
                  env: prod
        # Verify tags are array<{key,value}> format, not a map
        - script:
            timeout: 5m
            content: |
              set -e
              for i in $(seq 1 30); do
                TAGS=$(kubectl get activity ac4-act -n stepfunctionsactivity -o json | jq -r '.spec.tags // []')
                # Tags must be an array, not an object
                TYPE=$(echo "$TAGS" | jq -r 'type')
                APP_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="app") | .value')
                ENV_VAL=$(echo "$TAGS" | jq -r '.[] | select(.key=="env") | .value')
                if [ "$TYPE" = "array" ] && [ "$APP_VAL" = "worker-pool" ] && [ "$ENV_VAL" = "prod" ]; then
                  echo "Tags in list format: [{key: app, value: worker-pool}, {key: env, value: prod}]"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: tags not in expected list format. Got: $TAGS"
              exit 1

    # ── AC-5: naming-standard — default {namespace}-{name} template applied ───────────────────
    - name: ac5-naming-standard
      try:
        - apply:
