    # ── AC-25: status-alias-arn — status.aliasArn mirrors ACK ackResourceMetadata.arn ────────
    # No live ACK controller runs in this cluster, so ackResourceMetadata.arn is never populated
    # by a real reconciler. Patch the child's status subresource directly to simulate what ACK
    # would report after provisioning, then assert the parent reflects it verbatim.
    - name: ac25-status-alias-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac25-cfg
                namespace: stepfunctionsstatemachinealias
                labels:
                  aws.kropath.run/resource-name: ac25-cfg
              spec:
                mandatory:
                  tags: {}
                  namingTemplate: ""
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac25-cfg -n stepfunctionsstatemachinealias \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachineAlias
              metadata:
                name: ac25-alias
                namespace: stepfunctionsstatemachinealias
              spec:
                configRef: ac25-cfg
                # description set: exercises ackAliasWithDescription, which is what the
                # primary status.aliasArn field reads from (see RGD comment on that field).
                description: "prod traffic router"
                routingConfiguration:
                  - stateMachineVersionArn: "arn:aws:states:ap-southeast-2:123456789012:stateMachine:orders:3"
                    weight: 100
        - script:
            timeout: 3m
            content: |
              set -e
              for i in $(seq 1 30); do
                if kubectl get statemachinealias ac25-alias -n stepfunctionsstatemachinealias >/dev/null 2>&1; then
                  break
                fi
                sleep 3
              done
              kubectl patch statemachinealias ac25-alias -n stepfunctionsstatemachinealias \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:states:ap-southeast-2:123456789012:stateMachine:orders:alias:stepfunctionsstatemachinealias-ac25-alias","ownerAccountID":"123456789012","region":"ap-southeast-2"}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachineAlias
              metadata:
                name: ac25-alias
                namespace: stepfunctionsstatemachinealias
              status:
                aliasArn: "arn:aws:states:ap-southeast-2:123456789012:stateMachine:orders:alias:stepfunctionsstatemachinealias-ac25-alias"

    # ── AC-26: status-no-predicted-arn — predictedArn key absent from the status schema ──────
    - name: ac26-status-no-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac26-cfg
                namespace: stepfunctionsstatemachinealias
                labels:
                  aws.kropath.run/resource-name: ac26-cfg
              spec:
                mandatory:
                  tags: {}
                  namingTemplate: ""
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac26-cfg -n stepfunctionsstatemachinealias \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachineAlias
              metadata:
                name: ac26-alias
                namespace: stepfunctionsstatemachinealias
              spec:
                configRef: ac26-cfg
                routingConfiguration:
                  - stateMachineVersionArn: "arn:aws:states:ap-southeast-2:123456789012:stateMachine:orders:3"
                    weight: 100
        - script:
            timeout: 3m
            content: |
              set -e
              for i in $(seq 1 30); do
                JSON=$(kubectl get stepfunctionsstatemachinealias ac26-alias -n stepfunctionsstatemachinealias -o json 2>/dev/null || echo "")
                RN=$(echo "$JSON" | jq -r '.status.resourceName // ""')
                if [ -n "$RN" ]; then
                  break
                fi
                sleep 3
              done
              HAS_PREDICTED=$(echo "$JSON" | jq -r '.status | has("predictedArn")')
              # Also confirm it is absent from the CRD schema itself, not just this instance.
              SCHEMA_HAS_PREDICTED=$(kubectl get crd stepfunctionsstatemachinealias.aws.kropath.run -o json | jq -r '.spec.versions[0].schema.openAPIV3Schema.properties.status.properties | has("predictedArn")')
              if [ "$HAS_PREDICTED" = "false" ] && [ "$SCHEMA_HAS_PREDICTED" = "false" ]; then
                echo "PASS: predictedArn absent from both the instance and the CRD schema"
                exit 0
              fi
              echo "FAIL: instance has predictedArn=$HAS_PREDICTED, schema has predictedArn=$SCHEMA_HAS_PREDICTED"
              exit 1
