              done
              kubectl get configmap ac3-alias-routing-weight-sum-error -n stepfunctionsstatemachinealias -o jsonpath='{.data.error}'
              echo
              if kubectl get statemachinealias ac3-alias -n stepfunctionsstatemachinealias >/dev/null 2>&1; then
                echo "FAIL: ACK child was created despite invalid weight sum"
                exit 1
              fi
              echo "PASS: no ACK child created"

