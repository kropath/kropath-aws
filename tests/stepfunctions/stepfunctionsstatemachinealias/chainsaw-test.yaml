# aws-sfn-04 Chainsaw tests — StepFunctionsStateMachineAlias RGD.
# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates uniquely-named resources and deletes nothing between
# steps. No ACK controllers run in the local cluster so ACK finalizers are never removed;
# skipDelete prevents chainsaw's cascade delete from hanging. Exception: ac14-naming-immutable
# is a genuine single-resource lifecycle test (mutates the same CR across two applies within
# one step by design — CLAUDE.md carve-out #2).
#
# Negative-case ACs (routing/naming validation): kro has no admission webhook for in-graph CEL
# rules, so "admission rejected" is asserted as: advisory <constraint>Error ConfigMap present
# AND the ACK StateMachineAlias child absent — the established in-graph ConfigMap advisory
# pattern (docs/frequent-rgd-errors.md §"x-kubernetes-validations Cannot Be Auto-Generated by
# kro v0.9.2"), same mechanism as stepfunctionsstatemachine's definitionError.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: stepfunctionsstatemachinealias
spec:
  skipDelete: true
  namespace: stepfunctionsstatemachinealias
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ── AC-1: routing-single-version — one entry, weight 100 ─────────────────────────────────
    - name: ac1-routing-single-version
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: ac1-cfg
                namespace: stepfunctionsstatemachinealias
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  tags: {}
                  namingTemplate: ""
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch stepfunctionsconfig ac1-cfg -n stepfunctionsstatemachinealias \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachineAlias
              metadata:
                name: ac1-alias
                namespace: stepfunctionsstatemachinealias
              spec:
                configRef: ac1-cfg
                routingConfiguration:
                  - stateMachineVersionArn: "arn:aws:states:ap-southeast-2:123456789012:stateMachine:orders:3"
                    weight: 100
        - assert:
            resource:
              apiVersion: sfn.services.k8s.aws/v1alpha1
              kind: StateMachineAlias
              metadata:
                name: ac1-alias
                namespace: stepfunctionsstatemachinealias
              spec:
                routingConfiguration:
                  - stateMachineVersionARN: "arn:aws:states:ap-southeast-2:123456789012:stateMachine:orders:3"
                    weight: 100

