                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsStateMachineAlias
              metadata:
                name: ac5-alias
                namespace: stepfunctionsstatemachinealias
              spec:
                configRef: ac5-cfg
                routingConfiguration:
                  - stateMachineVersionArn: "arn:aws:states:ap-southeast-2:123456789012:stateMachine:orders:9"
                    weight: 100
        - script:
            timeout: 3m
            content: |
              set -e
              for i in $(seq 1 30); do
                JSON=$(kubectl get statemachinealias ac5-alias -n stepfunctionsstatemachinealias -o json 2>/dev/null || echo "")
                if [ -n "$JSON" ]; then
                  break
                fi
                sleep 3
              done
              HAS_ACK_FIELD=$(echo "$JSON" | jq -r '.spec.routingConfiguration[0] | has("stateMachineVersionARN")')
              HAS_KROPATH_FIELD=$(echo "$JSON" | jq -r '.spec.routingConfiguration[0] | has("stateMachineVersionArn")')
              VALUE=$(echo "$JSON" | jq -r '.spec.routingConfiguration[0].stateMachineVersionARN')
              if [ "$HAS_ACK_FIELD" = "true" ] && [ "$HAS_KROPATH_FIELD" = "false" ] && [ "$VALUE" = "arn:aws:states:ap-southeast-2:123456789012:stateMachine:orders:9" ]; then
                echo "PASS: child carries stateMachineVersionARN only"
                exit 0
              fi
              echo "FAIL: hasACKField=$HAS_ACK_FIELD hasKropathField=$HAS_KROPATH_FIELD value=$VALUE"
              exit 1

