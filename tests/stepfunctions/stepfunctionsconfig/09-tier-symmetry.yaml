# CRD-9: all governance fields populated in a single tier (defaults) → admission succeeds
---
apiVersion: aws.kropath.run/v1alpha1
kind: StepFunctionsConfig
metadata:
  name: crd9-tier-symmetry
  namespace: stepfunctionsconfig
spec:
  mandatory:
    loggingLevel: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    loggingLevel: "ERROR"
    tracingEnabled: false
    includeExecutionData: false
    namingTemplate: "{namespace}-{name}"
    tags:
      env: staging
    syncedLabels:
      tier: backend
    syncedAnnotations:
      team: platform
