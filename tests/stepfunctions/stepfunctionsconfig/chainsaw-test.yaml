# aws-sfn-01 Chainsaw tests — StepFunctionsConfig CRD schema validation.
# One scenario per acceptance criterion. Covers x-kubernetes-validations mutual-exclusivity
# rules for scalar fields (loggingLevel, tracingEnabled, includeExecutionData, namingTemplate)
# and additive map fields (tags, syncedLabels, syncedAnnotations).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: stepfunctionsconfig
spec:
  skipDelete: true
  namespace: stepfunctionsconfig
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-stepfunctionsconfig-namespace.yaml

    - name: crd1-logging-level-mandatory-accepted
      try:
        - apply:
            file: 01-logging-level-mandatory.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: crd1-logging-level-mandatory
                namespace: stepfunctionsconfig
              spec:
                mandatory:
                  loggingLevel: "ALL"
                defaults:
                  loggingLevel: ""

    - name: crd2-reject-logging-level-both-tiers
      try:
        - apply:
            file: 02-logging-level-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: StepFunctionsConfig
                check:
                  ($error != null): true

    - name: crd3-tracing-enabled-mandatory-accepted
      try:
        - apply:
            file: 03-tracing-enabled-mandatory.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: crd3-tracing-enabled-mandatory
                namespace: stepfunctionsconfig
              spec:
                mandatory:
                  tracingEnabled: true

    - name: crd4-reject-tracing-enabled-both-tiers
      try:
        - apply:
            file: 04-tracing-enabled-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: StepFunctionsConfig
                check:
                  ($error != null): true

    - name: crd5-include-execution-data-mandatory-accepted
      try:
        - apply:
            file: 05-include-execution-data-mandatory.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: crd5-exec-data-mandatory
                namespace: stepfunctionsconfig
              spec:
                mandatory:
                  includeExecutionData: false

    - name: crd6-reject-include-execution-data-both-tiers
      try:
        - apply:
            file: 06-include-execution-data-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: StepFunctionsConfig
                check:
                  ($error != null): true

    - name: crd7-naming-template-mandatory-accepted
      try:
        - apply:
            file: 07-naming-template-mandatory.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: crd7-naming-template-mandatory
                namespace: stepfunctionsconfig
              spec:
                mandatory:
                  namingTemplate: "corp-{namespace}-{name}"
                defaults:
                  namingTemplate: ""

    - name: crd8-reject-naming-template-both-tiers
      try:
        - apply:
            file: 08-naming-template-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: StepFunctionsConfig
                check:
                  ($error != null): true

    - name: crd9-tier-symmetry-all-defaults-accepted
      try:
        - apply:
            file: 09-tier-symmetry.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: crd9-tier-symmetry
                namespace: stepfunctionsconfig
              spec:
                mandatory:
                  loggingLevel: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  loggingLevel: "ERROR"
                  tracingEnabled: false
                  includeExecutionData: false
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    env: staging
                  syncedLabels:
                    tier: backend
                  syncedAnnotations:
                    team: platform

    - name: crd10-tags-both-tiers-accepted
      try:
        - apply:
            file: 10-tags-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: crd10-tags-both-tiers
                namespace: stepfunctionsconfig
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  tags:
                    team: workflows

    - name: crd11-synced-labels-both-tiers-accepted
      try:
        - apply:
            file: 11-synced-labels-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: crd11-synced-labels-both-tiers
                namespace: stepfunctionsconfig
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  syncedLabels:
                    data-class: internal

    - name: crd12-general-policy-deployed-in-kro-system
      try:
        - apply:
            file: 12-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: StepFunctionsConfig
              metadata:
                name: general-policy
                namespace: kro-system
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  loggingLevel: ""
                  namingTemplate: ""
                defaults:
                  loggingLevel: "OFF"
                  tracingEnabled: false
                  includeExecutionData: false
                  namingTemplate: "{namespace}-{name}"
