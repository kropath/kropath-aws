# aws-rds-01 Chainsaw tests — all 22 acceptance criteria for RDSConfig CRD (KRO-399).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rdsconfig
spec:
  namespace: rdsconfig
  steps:
    # AC-1: Create general-policy RDSConfig with all fields at zero-value; resource is admitted.
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-rdsconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: general-policy
                namespace: rdsconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  storageEncrypted: false
                  deletionProtection: false
                  backupRetentionPeriod: 0
                defaults:
                  storageEncrypted: true
                  deletionProtection: true
                  backupRetentionPeriod: 7
                  storageType: "gp3"
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    # AC-2: Create strict RDSConfig with mandatory fields set; resource is admitted.
    - name: ac2-strict-profile-accepted
      try:
        - apply:
            file: 02-strict-profile.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: strict
                namespace: rdsconfig
                labels:
                  aws.kropath.run/resource-name: strict
              spec:
                mandatory:
                  storageEncrypted: true
                  deletionProtection: true
                  backupRetentionPeriod: 7
                  manageMasterUserPassword: true
      cleanup:
        - delete:
            file: 02-strict-profile.yaml

    # AC-3: storageEncrypted cannot be set in both mandatory and defaults simultaneously.
    - name: ac3-reject-dual-tier-storageencrypted
      try:
        - apply:
            file: 03-invalid-dual-tier-storageencrypted.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-4: kmsKeyID cannot be set in both mandatory and defaults simultaneously.
    - name: ac4-reject-dual-tier-kmskeyid
      try:
        - apply:
            file: 04-invalid-dual-tier-kmskeyid.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-5: deletionProtection cannot be set in both mandatory and defaults simultaneously.
    - name: ac5-reject-dual-tier-deletionprotection
      try:
        - apply:
            file: 05-invalid-dual-tier-deletionprotection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-6: backupRetentionPeriod cannot be set in both mandatory and defaults simultaneously.
    - name: ac6-reject-dual-tier-backupretention
      try:
        - apply:
            file: 06-invalid-dual-tier-backupretention.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-7: multiAZ cannot be set in both mandatory and defaults simultaneously.
    - name: ac7-reject-dual-tier-multiaz
      try:
        - apply:
            file: 07-invalid-dual-tier-multiaz.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-8: publiclyAccessible cannot be set in both mandatory and defaults simultaneously
    # (pointer field — mutual exclusion fires when both are explicitly true).
    - name: ac8-reject-dual-tier-publiclyaccessible
      try:
        - apply:
            file: 08-invalid-dual-tier-publiclyaccessible.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-9: storageType cannot be set in both mandatory and defaults simultaneously.
    - name: ac9-reject-dual-tier-storagetype
      try:
        - apply:
            file: 09-invalid-dual-tier-storagetype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-10: autoMinorVersionUpgrade cannot be set in both mandatory and defaults simultaneously.
    - name: ac10-reject-dual-tier-autominorupgrade
      try:
        - apply:
            file: 10-invalid-dual-tier-autominorupgrade.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-11: copyTagsToSnapshot cannot be set in both mandatory and defaults simultaneously.
    - name: ac11-reject-dual-tier-copytagstosnapshot
      try:
        - apply:
            file: 11-invalid-dual-tier-copytagstosnapshot.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-12: performanceInsightsEnabled cannot be set in both mandatory and defaults simultaneously.
    - name: ac12-reject-dual-tier-piinsights
      try:
        - apply:
            file: 12-invalid-dual-tier-piinsights.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-13: enableIAMDatabaseAuthentication cannot be set in both mandatory and defaults simultaneously.
    - name: ac13-reject-dual-tier-iamauth
      try:
        - apply:
            file: 13-invalid-dual-tier-iamauth.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-14: manageMasterUserPassword cannot be set in both mandatory and defaults simultaneously.
    - name: ac14-reject-dual-tier-managemasterpassword
      try:
        - apply:
            file: 14-invalid-dual-tier-managemasterpassword.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-15: namingTemplate cannot be set in both mandatory and defaults simultaneously.
    - name: ac15-reject-dual-tier-namingtemplate
      try:
        - apply:
            file: 15-invalid-dual-tier-namingtemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-16: serverlessV2ScalingMinCapacity cannot be set in both mandatory and defaults simultaneously.
    - name: ac16-reject-dual-tier-serverlessminacus
      try:
        - apply:
            file: 16-invalid-dual-tier-serverlessminacus.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-17: serverlessV2ScalingMaxCapacity cannot be set in both mandatory and defaults simultaneously.
    - name: ac17-reject-dual-tier-serverlessmaxacus
      try:
        - apply:
            file: 17-invalid-dual-tier-serverlessmaxacus.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-18: backtrackWindow cannot be set in both mandatory and defaults simultaneously.
    - name: ac18-reject-dual-tier-backtrackwindow
      try:
        - apply:
            file: 18-invalid-dual-tier-backtrackwindow.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RDSConfig
                check:
                  ($error != null): true

    # AC-19: defaults.storageEncrypted: true, defaults.deletionProtection: true,
    # defaults.backupRetentionPeriod: 7 reflect secure defaults in status.effectiveConfig.
    # Controller writes status.effectiveConfig; simulated via kubectl patch --subresource=status.
    - name: ac19-secure-defaults-in-effectiveconfig
      try:
        - apply:
            file: 19-secure-defaults.yaml
        - script:
            content: |
              kubectl patch rdsconfig secure-defaults -n rdsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: secure-defaults
                namespace: rdsconfig
              status:
                effectiveConfig:
                  defaults:
                    storageEncrypted: true
                    deletionProtection: true
                    backupRetentionPeriod: 7
                    storageType: "gp3"
      cleanup:
        - delete:
            file: 19-secure-defaults.yaml

    # AC-20: tags/syncedLabels/syncedAnnotations in both mandatory and defaults are valid
    # (additive merge — no mutual exclusion). Both tiers can carry different tag sets.
    - name: ac20-tags-both-tiers-valid
      try:
        - apply:
            file: 20-tags-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: tags-both-tiers
                namespace: rdsconfig
                labels:
                  aws.kropath.run/resource-name: tags-both-tiers
              spec:
                mandatory:
                  tags:
                    compliance: required
                    data-class: confidential
                  syncedLabels:
                    cost-centre: platform
                defaults:
                  tags:
                    team: application
                  syncedLabels:
                    environment: production
      cleanup:
        - delete:
            file: 20-tags-both-tiers.yaml

    # AC-21: Controller auto-injects aws.kropath.run/resource-name: <metadata.name> label on CREATE.
    # In the test cluster this label is injected by the operator on CREATE; test fixtures must
    # include the label manually to simulate this behaviour in local tests.
    - name: ac21-label-injection
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: general-policy
                namespace: rdsconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    # AC-22: general-policy profile CR carries expected defaults
    # (storageEncrypted=true, deletionProtection=true, backupRetentionPeriod=7, storageType="gp3").
    - name: ac22-general-policy-defaults
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: general-policy
                namespace: rdsconfig
              spec:
                defaults:
                  storageEncrypted: true
                  deletionProtection: true
                  backupRetentionPeriod: 7
                  storageType: "gp3"
                  autoMinorVersionUpgrade: true
                  copyTagsToSnapshot: true
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml
