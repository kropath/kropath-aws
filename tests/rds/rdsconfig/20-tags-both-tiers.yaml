---
# AC-20: tags/syncedLabels/syncedAnnotations in both mandatory and defaults are valid —
# these use additive merge semantics, not mutual-exclusion. Setting both tiers is allowed.
apiVersion: aws.kropath.run/v1alpha1
kind: RDSConfig
metadata:
  name: tags-both-tiers
  namespace: rdsconfig
  labels:
    aws.kropath.run/resource-name: tags-both-tiers
spec:
  mandatory:
    storageEncrypted: false
    kmsKeyID: ""
    deletionProtection: false
    backupRetentionPeriod: 0
    multiAZ: false
    publiclyAccessible: false
    storageType: ""
    autoMinorVersionUpgrade: false
    copyTagsToSnapshot: false
    performanceInsightsEnabled: false
    enableIAMDatabaseAuthentication: false
    manageMasterUserPassword: false
    namingTemplate: ""
    serverlessV2ScalingMinCapacity: 0
    serverlessV2ScalingMaxCapacity: 0
    backtrackWindow: 0
    tags:
      compliance: required
      data-class: confidential
    syncedLabels:
      cost-centre: platform
    syncedAnnotations:
      backup-policy: daily
  defaults:
    storageEncrypted: true
    kmsKeyID: ""
    deletionProtection: true
    backupRetentionPeriod: 7
    multiAZ: false
    publiclyAccessible: false
    storageType: "gp3"
    autoMinorVersionUpgrade: true
    copyTagsToSnapshot: true
    performanceInsightsEnabled: false
    enableIAMDatabaseAuthentication: false
    manageMasterUserPassword: false
    namingTemplate: "{namespace}-{name}"
    serverlessV2ScalingMinCapacity: 0
    serverlessV2ScalingMaxCapacity: 0
    backtrackWindow: 0
    tags:
      team: application
    syncedLabels:
      environment: production
    syncedAnnotations: {}
