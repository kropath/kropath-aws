# KRO-1238 Chainsaw tests — RDSClusterParameterGroup (AC-1 through AC-14).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# effectiveConfig is simulated via kubectl patch --subresource=status (no kropath-controller
# running in the kind cluster — kro reconciles child resources from patched status; see
# kropath-core docs/specs/aws/aws-rds-07-rdsclusterparametergroup.md header).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rdsclusterparametergroup
spec:
  skipDelete: true
  namespace: rdsclusterparametergroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: happy-path: basic-create
    # family and description forwarded verbatim.
    - name: ac1-basic-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac1-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac1-cfg -n rdsclusterparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac1-cpg
                namespace: rdsclusterparametergroup
              spec:
                configRef: ac1-cfg
                family: "aurora-postgresql15"
                description: "tuned aurora cluster params"
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBClusterParameterGroup
              metadata:
                name: ac1-cpg
                namespace: rdsclusterparametergroup
              spec:
                family: "aurora-postgresql15"
                description: "tuned aurora cluster params"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac1-cpg
                namespace: rdsclusterparametergroup
              status:
                resourceName: rdsclusterparametergroup-ac1-cpg
                namingStatus: valid

    # AC-2: happy-path: parameter-overrides
    # parameterOverrides forwarded verbatim to ACK.
    - name: ac2-parameter-overrides
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac2-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac2-cfg -n rdsclusterparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac2-cpg
                namespace: rdsclusterparametergroup
              spec:
                configRef: ac2-cfg
                family: "aurora-mysql8.0"
                description: "mysql aurora overrides"
                parameterOverrides:
                  rds.force_ssl: "1"
                  aurora_parallel_query: "ON"
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBClusterParameterGroup
              metadata:
                name: ac2-cpg
                namespace: rdsclusterparametergroup
              spec:
                parameterOverrides:
                  rds.force_ssl: "1"
                  aurora_parallel_query: "ON"

    # AC-3: happy-path: no-overrides
    # parameterOverrides omitted → ACK spec.parameterOverrides key is absent (not {}).
    - name: ac3-no-overrides
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac3-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac3-cfg -n rdsclusterparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac3-cpg
                namespace: rdsclusterparametergroup
              spec:
                configRef: ac3-cfg
                family: "aurora-mysql8.0"
                description: "no overrides"
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBClusterParameterGroup
              metadata:
                name: ac3-cpg
                namespace: rdsclusterparametergroup
              spec:
                family: "aurora-mysql8.0"
        - script:
            timeout: 60s
            content: |
              kubectl get dbclusterparametergroups.rds.services.k8s.aws ac3-cpg -n rdsclusterparametergroup -o json \
                | jq -e '(.spec | has("parameterOverrides")) == false'

    # AC-4: happy-path: deprecated-parameters-unused
    # parameterOverrides set → ACK spec.parameterOverrides populated, deprecated spec.parameters
    # is never rendered by the RGD (the RGD template has no `parameters` field at all).
    - name: ac4-deprecated-parameters-unused
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac4-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac4-cfg -n rdsclusterparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac4-cpg
                namespace: rdsclusterparametergroup
              spec:
                configRef: ac4-cfg
                family: "aurora-mysql8.0"
                description: "deprecated parameters unused"
                parameterOverrides:
                  binlog_format: "ROW"
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBClusterParameterGroup
              metadata:
                name: ac4-cpg
                namespace: rdsclusterparametergroup
              spec:
                parameterOverrides:
                  binlog_format: "ROW"
        - script:
            timeout: 60s
            content: |
              kubectl get dbclusterparametergroups.rds.services.k8s.aws ac4-cpg -n rdsclusterparametergroup -o json \
                | jq -e '(.spec | has("parameters")) == false'

    # AC-5: happy-path: tag-merge
    # mandatory tags win on key conflict.
    - name: ac5-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac5-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    tier: baseline
        - script:
            content: |
              kubectl patch rdsconfig ac5-cfg -n rdsclusterparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{"tier":"baseline"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac5-cpg
                namespace: rdsclusterparametergroup
              spec:
                configRef: ac5-cfg
                family: "aurora-postgresql15"
                description: "tag merge test"
                tags:
                  app: orders
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBClusterParameterGroup
              metadata:
                name: ac5-cpg
                namespace: rdsclusterparametergroup
              spec:
                family: "aurora-postgresql15"
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get dbclusterparametergroups.rds.services.k8s.aws ac5-cpg -n rdsclusterparametergroup -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "cost-centre" and .value == "platform")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "tier" and .value == "baseline")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "app" and .value == "orders")) | length == 1'

    # AC-6: happy-path: synced-labels
    # mandatory.syncedLabels forwarded to K8s labels (prefixed) AND spec.tags (ADR-015 §6.1).
    - name: ac6-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac6-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac6-cfg -n rdsclusterparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac6-cpg
                namespace: rdsclusterparametergroup
              spec:
                configRef: ac6-cfg
                family: "aurora-postgresql15"
                description: "synced labels test"
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBClusterParameterGroup
              metadata:
                name: ac6-cpg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/environment: production
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get dbclusterparametergroups.rds.services.k8s.aws ac6-cpg -n rdsclusterparametergroup -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "environment" and .value == "production")) | length == 1'

    # AC-7: happy-path: naming-template
    - name: ac7-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac7-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac7-cfg -n rdsclusterparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: orders-cpg
                namespace: rdsclusterparametergroup
              spec:
                configRef: ac7-cfg
                family: "aurora-postgresql15"
                description: "naming template test"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: orders-cpg
                namespace: rdsclusterparametergroup
              status:
                resourceName: rdsclusterparametergroup-orders-cpg
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBClusterParameterGroup
              metadata:
                name: orders-cpg
                namespace: rdsclusterparametergroup
              spec:
                name: rdsclusterparametergroup-orders-cpg

    # AC-8: happy-path: name-override
    # spec.nameOverride bypasses the naming template entirely.
    - name: ac8-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac8-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac8-cfg -n rdsclusterparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac8-cpg
                namespace: rdsclusterparametergroup
              spec:
                configRef: ac8-cfg
                nameOverride: "legacy-aurora-cpg"
                family: "aurora-mysql8.0"
                description: "name override test"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac8-cpg
                namespace: rdsclusterparametergroup
              status:
                resourceName: legacy-aurora-cpg
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBClusterParameterGroup
              metadata:
                name: ac8-cpg
                namespace: rdsclusterparametergroup
              spec:
                name: legacy-aurora-cpg

    # AC-9: negative: naming-unresolved-token
    # Unresolved {tag.X} token → namingStatus invalid-unresolved-tokens, no ACK CR created.
    - name: ac9-naming-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac9-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{tag.nonexistent}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac9-cfg -n rdsclusterparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{tag.nonexistent}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2","partition":"aws"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac9-cpg
                namespace: rdsclusterparametergroup
              spec:
                configRef: ac9-cfg
                family: "aurora-postgresql15"
                description: "unresolved token test"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSClusterParameterGroup
              metadata:
                name: ac9-cpg
                namespace: rdsclusterparametergroup
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            timeout: 60s
            content: |
              kubectl get dbclusterparametergroups.rds.services.k8s.aws ac9-cpg -n rdsclusterparametergroup 2>&1 \
                | grep -qi "NotFound" && echo "confirmed absent"

    # AC-10: negative: missing-family
    # spec.family explicit empty string → advisory ConfigMap + no ACK CR (kro v0.9.2 cannot
    # express minLength/pattern admission validation — see rgds/rdsclusterparametergroup header).
    - name: ac10-missing-family
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac10-cfg
                namespace: rdsclusterparametergroup
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
