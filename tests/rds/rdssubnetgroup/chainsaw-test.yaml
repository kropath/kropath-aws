# KRO-401 Chainsaw tests — RDSSubnetGroup (SG-1 through SG-6).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# effectiveConfig is simulated via kubectl patch --subresource=status (no kropath-controller
# running in the kind cluster — kro reconciles child resources from patched status).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rdssubnetgroup
spec:
  skipDelete: true
  namespace: rdssubnetgroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # SG-1: Create RDSSubnetGroup with required fields (description, subnetIDs);
    #        ACK DBSubnetGroup created with correct spec.
    - name: sg1-create-basic
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: sg1-cfg
                namespace: rdssubnetgroup
                labels:
                  aws.kropath.run/resource-name: sg1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig sg1-cfg -n rdssubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSSubnetGroup
              metadata:
                name: sg1-grp
                namespace: rdssubnetgroup
              spec:
                configRef: sg1-cfg
                description: "SG-1 test subnet group"
                subnetIDs:
                  - subnet-aaa00001
                  - subnet-bbb00002
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: sg1-grp
                namespace: rdssubnetgroup
              spec:
                description: "SG-1 test subnet group"
                subnetIDs:
                  - subnet-aaa00001
                  - subnet-bbb00002
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSSubnetGroup
              metadata:
                name: sg1-grp
                namespace: rdssubnetgroup
              status:
                resourceName: rdssubnetgroup-sg1-grp

    # SG-2: Naming: effectiveName = {namespace}-{name} (default template);
    #        status.resourceName, status.predictedArn, and status.namingStatus set correctly.
    - name: sg2-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: sg2-cfg
                namespace: rdssubnetgroup
                labels:
                  aws.kropath.run/resource-name: sg2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig sg2-cfg -n rdssubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSSubnetGroup
              metadata:
                name: sg2-grp
                namespace: rdssubnetgroup
              spec:
                configRef: sg2-cfg
                description: "SG-2 naming test"
                subnetIDs:
                  - subnet-aaa00001
                  - subnet-bbb00002
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: sg2-grp
                namespace: rdssubnetgroup
              spec:
                name: rdssubnetgroup-sg2-grp
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSSubnetGroup
              metadata:
                name: sg2-grp
                namespace: rdssubnetgroup
              status:
                resourceName: rdssubnetgroup-sg2-grp
                namingStatus: valid
                predictedArn: "arn:aws:rds:ap-southeast-2:123456789012:subgrp/rdssubnetgroup-sg2-grp"

    # SG-3: spec.nameOverride non-empty: effectiveName = override value; namingStatus valid.
    - name: sg3-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: sg3-cfg
                namespace: rdssubnetgroup
                labels:
                  aws.kropath.run/resource-name: sg3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig sg3-cfg -n rdssubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSSubnetGroup
              metadata:
                name: sg3-grp
                namespace: rdssubnetgroup
              spec:
                configRef: sg3-cfg
                nameOverride: "sg3-custom-name"
                description: "SG-3 nameOverride test"
                subnetIDs:
                  - subnet-aaa00001
                  - subnet-bbb00002
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: sg3-grp
                namespace: rdssubnetgroup
              spec:
                name: sg3-custom-name
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSSubnetGroup
              metadata:
                name: sg3-grp
                namespace: rdssubnetgroup
              status:
                resourceName: sg3-custom-name
                namingStatus: valid

    # SG-4: Tags/syncedLabels/syncedAnnotations flow through effectiveConfig cascade;
    #        merged tags appear on ACK DBSubnetGroup (order-independent jq assertion).
    - name: sg4-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: sg4-cfg
                namespace: rdssubnetgroup
                labels:
                  aws.kropath.run/resource-name: sg4-cfg
              spec:
                mandatory:
                  tags:
                    env: prod
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    tier: db
        - script:
            content: |
              kubectl patch rdsconfig sg4-cfg -n rdssubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{"tier":"db"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSSubnetGroup
              metadata:
                name: sg4-grp
                namespace: rdssubnetgroup
              spec:
                configRef: sg4-cfg
                description: "SG-4 tags test"
                subnetIDs:
                  - subnet-aaa00001
                  - subnet-bbb00002
                tags:
                  component: data
        # Wait for kro to reconcile the DBSubnetGroup child before the jq script
        # queries it — a bare `- script:` races the reconciler and sees NotFound.
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: sg4-grp
                namespace: rdssubnetgroup
              spec:
                description: "SG-4 tags test"
        - script:
            content: |
              TAGS=$(kubectl get dbsubnetgroups.rds.services.k8s.aws sg4-grp -n rdssubnetgroup -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' > /dev/null
              echo "$TAGS" | jq -e '.[] | select(.key=="component" and .value=="data")' > /dev/null
              echo "$TAGS" | jq -e '.[] | select(.key=="tier" and .value=="db")' > /dev/null

    # SG-5: deletionPolicy: delete wires services.k8s.aws/deletion-policy: delete annotation
    #        on ACK DBSubnetGroup.
    - name: sg5-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: sg5-cfg
                namespace: rdssubnetgroup
                labels:
                  aws.kropath.run/resource-name: sg5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig sg5-cfg -n rdssubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSSubnetGroup
              metadata:
                name: sg5-grp
                namespace: rdssubnetgroup
              spec:
                configRef: sg5-cfg
                deletionPolicy: delete
                description: "SG-5 deletion policy delete test"
                subnetIDs:
                  - subnet-aaa00001
                  - subnet-bbb00002
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: sg5-grp
                namespace: rdssubnetgroup
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # SG-6: deletionPolicy: retain (default) wires services.k8s.aws/deletion-policy: retain;
    #        standard metadata labels (managed-by, instance) wired to ACK DBSubnetGroup.
    - name: sg6-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: sg6-cfg
                namespace: rdssubnetgroup
                labels:
                  aws.kropath.run/resource-name: sg6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig sg6-cfg -n rdssubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSSubnetGroup
              metadata:
                name: sg6-grp
                namespace: rdssubnetgroup
              spec:
                configRef: sg6-cfg
                description: "SG-6 retain + standard labels test"
                subnetIDs:
                  - subnet-aaa00001
                  - subnet-bbb00002
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBSubnetGroup
              metadata:
                name: sg6-grp
                namespace: rdssubnetgroup
                annotations:
                  services.k8s.aws/deletion-policy: retain
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: sg6-grp
