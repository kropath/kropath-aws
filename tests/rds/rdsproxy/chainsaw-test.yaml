              metadata:
                name: ac8-proxy
                namespace: rdsproxy
              spec:
                configRef: ac8-cfg
                engineFamily: "POSTGRESQL"
                auth:
                  - secretARN: "arn:aws:secretsmanager:eu-west-1:111122223333:secret:db-creds"
