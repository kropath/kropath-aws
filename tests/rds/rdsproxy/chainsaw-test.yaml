# KRO-1239 Chainsaw tests — RDSProxy (AC-1 through AC-20).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# effectiveConfig is simulated via kubectl patch --subresource=status (no kropath-controller
# running in the kind cluster — kro reconciles child resources from patched status; see
# kropath-core docs/specs/aws/aws-rds-08-rdsproxy.md header).
#
# ACK DBProxy.spec.tags is array<{key,value}> (confirmed against the live CRD — see
# rgds/rdsproxy.aws.kropath.run.yaml header). The RGD sorts the merged tag list by key
# (.sortBy(x, x.key)) so every tag-bearing assert below lists tags in alphabetical
# key order regardless of merge-tier precedence.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rdsproxy
spec:
  skipDelete: true
  namespace: rdsproxy
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: happy-path: basic-create
    - name: ac1-basic-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac1-cfg
                namespace: rdsproxy
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac1-cfg -n rdsproxy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":""},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"111122223333","region":"eu-west-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSProxy
              metadata:
                name: ac1-proxy
                namespace: rdsproxy
              spec:
                configRef: ac1-cfg
                engineFamily: "POSTGRESQL"
                auth:
                  - secretARN: "arn:aws:secretsmanager:eu-west-1:111122223333:secret:db-creds"
                vpcSubnetIDs:
                  - subnet-aaa
                  - subnet-bbb
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBProxy
              metadata:
                name: ac1-proxy
                namespace: rdsproxy
              spec:
                engineFamily: "POSTGRESQL"
                auth:
                  - authScheme: "SECRETS"
                    iamAuth: "DISABLED"
                    secretARN: "arn:aws:secretsmanager:eu-west-1:111122223333:secret:db-creds"
                    clientPasswordAuthType: ""
                vpcSubnetIDs:
                  - subnet-aaa
                  - subnet-bbb
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSProxy
              metadata:
                name: ac1-proxy
                namespace: rdsproxy
              status:
                resourceName: rdsproxy-ac1-proxy
                namingStatus: valid

    # AC-2: happy-path: auth-defaults
    - name: ac2-auth-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: ac2-cfg
                namespace: rdsproxy
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig ac2-cfg -n rdsproxy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":""},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}"},"aws":{"accountId":"111122223333","region":"eu-west-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSProxy
              metadata:
