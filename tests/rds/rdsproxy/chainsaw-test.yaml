        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSProxy
              metadata:
                name: ac5-proxy
                namespace: rdsproxy
              spec:
                configRef: ac5-cfg
                engineFamily: "POSTGRESQL"
                auth: []
                vpcSubnetIDs:
                  - subnet-aaa
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac5-proxy-validation-error
                namespace: rdsproxy
              data:
                error: "spec.auth requires at least one entry"
        - script:
            timeout: 60s
            content: |
              kubectl get dbproxies.rds.services.k8s.aws ac5-proxy -n rdsproxy 2>&1 \
                | grep -qi "NotFound" && echo "confirmed absent"

