    # CL-14: Tags/syncedLabels dual-write (ADR-015 §6.1):
    #          mandatory.tags + defaults.tags + spec.tags merged in DBCluster.spec.tags (jq asserts);
    #          mandatory.syncedLabels appear in DBCluster.metadata.labels with kropath.run/ prefix.
    - name: cl14-tags-synced-labels-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl14-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl14-cfg
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels:
                    team: data
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    tier: db
        - script:
            content: |
              kubectl patch rdsconfig cl14-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{"env":"prod"},"syncedLabels":{"team":"data"},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{"tier":"db"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl14-cluster
                namespace: rdscluster
              spec:
                configRef: cl14-cfg
                engine: aurora-mysql
                tags:
                  component: analytics
        # Wait for kro to reconcile the DBCluster child before the jq script
        # queries it — a bare `- script:` races the reconciler and sees NotFound.
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl14-cluster
                namespace: rdscluster
              spec:
                engine: aurora-mysql
        - script:
            content: |
              TAGS=$(kubectl get dbcluster cl14-cluster -n rdscluster -o json | jq -c '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="env" and .value=="prod")' > /dev/null
              echo "$TAGS" | jq -e '.[] | select(.key=="tier" and .value=="db")' > /dev/null
              echo "$TAGS" | jq -e '.[] | select(.key=="component" and .value=="analytics")' > /dev/null
              echo "$TAGS" | jq -e '.[] | select(.key=="team" and .value=="data")' > /dev/null
              kubectl get dbcluster cl14-cluster -n rdscluster -o json | \
                jq -e '.metadata.labels["aws.kropath.run/team"] == "data"' > /dev/null

