# KRO-401 Chainsaw tests — RDSCluster (CL-1 through CL-18).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# effectiveConfig is simulated via kubectl patch --subresource=status (no kropath-controller
# running in the kind cluster — kro reconciles ACK child resources from patched status).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rdscluster
spec:
  skipDelete: true
  namespace: rdscluster
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # CL-1: Create RDSCluster with aurora-mysql engine; ACK DBCluster created.
    - name: cl1-create-aurora-mysql
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl1-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl1-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl1-cluster
                namespace: rdscluster
              spec:
                configRef: cl1-cfg
                engine: aurora-mysql
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl1-cluster
                namespace: rdscluster
              spec:
                engine: aurora-mysql

    # CL-2: engine passthrough: aurora-postgresql wired to ACK DBCluster.spec.engine.
    - name: cl2-engine-aurora-postgresql
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl2-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl2-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl2-cluster
                namespace: rdscluster
              spec:
                configRef: cl2-cfg
                engine: aurora-postgresql
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl2-cluster
                namespace: rdscluster
              spec:
                engine: aurora-postgresql

    # CL-3: storageEncrypted cascade: mandatory: true forces encryption on DBCluster.
    - name: cl3-cascade-storageencrypted-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl3-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl3-cfg
              spec:
                mandatory:
                  storageEncrypted: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl3-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl3-cluster
                namespace: rdscluster
              spec:
                configRef: cl3-cfg
                engine: aurora-mysql
                storageEncrypted: false
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl3-cluster
                namespace: rdscluster
              spec:
                storageEncrypted: true

    # CL-4: deletionProtection cascade: mandatory: true forces protection on DBCluster.
    - name: cl4-cascade-deletionprotection-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl4-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl4-cfg
              spec:
                mandatory:
                  deletionProtection: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl4-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl4-cluster
                namespace: rdscluster
              spec:
                configRef: cl4-cfg
                engine: aurora-mysql
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl4-cluster
                namespace: rdscluster
              spec:
                deletionProtection: true

    # CL-5: backupRetentionPeriod minimum floor: max(mandatory, spec.backupRetentionPeriod).
    #         Two sub-cases: spec exceeds floor (gets spec) and spec below floor (gets mandatory).
    - name: cl5-cascade-backupretention-floor
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl5-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl5-cfg
              spec:
                mandatory:
                  backupRetentionPeriod: 7
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl5-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl5-hi
                namespace: rdscluster
              spec:
                configRef: cl5-cfg
                engine: aurora-mysql
                backupRetentionPeriod: 14
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl5-lo
                namespace: rdscluster
              spec:
                configRef: cl5-cfg
                engine: aurora-mysql
                backupRetentionPeriod: 3
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl5-hi
                namespace: rdscluster
              spec:
                backupRetentionPeriod: 14
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl5-lo
                namespace: rdscluster
              spec:
                backupRetentionPeriod: 7

    # CL-6: manageMasterUserPassword cascade: mandatory: true forces Secrets Manager.
    - name: cl6-cascade-managemasterpassword-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl6-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl6-cfg
              spec:
                mandatory:
                  manageMasterUserPassword: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl6-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":true,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl6-cluster
                namespace: rdscluster
              spec:
                configRef: cl6-cfg
                engine: aurora-mysql
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl6-cluster
                namespace: rdscluster
              spec:
                manageMasterUserPassword: true

    # CL-7: Serverless v2 scaling spec passthrough: instance spec sets min=0.5, max=4.0;
    #         mandatory has 0,0; result: DBCluster.spec.serverlessV2ScalingConfiguration.
    - name: cl7-serverless-scaling-spec-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl7-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl7-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl7-cluster
                namespace: rdscluster
              spec:
                configRef: cl7-cfg
                engine: aurora-mysql
                serverlessV2ScalingMinCapacity: 0.5
                serverlessV2ScalingMaxCapacity: 4.0
        # Wait for kro to reconcile the DBCluster child before the jq script
        # queries it — a bare `- script:` races the reconciler and sees NotFound.
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl7-cluster
                namespace: rdscluster
              spec:
                engine: aurora-mysql
        - script:
            content: |
              kubectl get dbcluster cl7-cluster -n rdscluster -o json | \
                jq -e '.spec.serverlessV2ScalingConfiguration.minCapacity == 0.5 and .spec.serverlessV2ScalingConfiguration.maxCapacity == 4.0' > /dev/null

    # CL-8: mandatory.serverlessV2ScalingMinCapacity floor: spec=0.3, mandatory=0.5 → min=0.5.
    - name: cl8-serverless-scaling-min-mandatory-floor
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl8-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl8-cfg
              spec:
                mandatory:
                  serverlessV2ScalingMinCapacity: 0.5
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl8-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0.5,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl8-cluster
                namespace: rdscluster
              spec:
                configRef: cl8-cfg
                engine: aurora-mysql
                serverlessV2ScalingMinCapacity: 0.3
                serverlessV2ScalingMaxCapacity: 4.0
        # Wait for kro to reconcile the DBCluster child before the jq script
        # queries it — a bare `- script:` races the reconciler and sees NotFound.
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl8-cluster
                namespace: rdscluster
              spec:
                engine: aurora-mysql
        - script:
            content: |
              kubectl get dbcluster cl8-cluster -n rdscluster -o json | \
                jq -e '.spec.serverlessV2ScalingConfiguration.minCapacity == 0.5' > /dev/null

    # CL-9: mandatory.serverlessV2ScalingMaxCapacity floor: spec=6.0, mandatory=8.0 → max=8.0.
    - name: cl9-serverless-scaling-max-mandatory-floor
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl9-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl9-cfg
              spec:
                mandatory:
                  serverlessV2ScalingMaxCapacity: 8.0
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl9-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":8.0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl9-cluster
                namespace: rdscluster
              spec:
                configRef: cl9-cfg
                engine: aurora-mysql
                serverlessV2ScalingMinCapacity: 0.5
                serverlessV2ScalingMaxCapacity: 6.0
        # Wait for kro to reconcile the DBCluster child before the jq script
        # queries it — a bare `- script:` races the reconciler and sees NotFound.
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl9-cluster
                namespace: rdscluster
              spec:
                engine: aurora-mysql
        - script:
            content: |
              kubectl get dbcluster cl9-cluster -n rdscluster -o json | \
                jq -e '.spec.serverlessV2ScalingConfiguration.maxCapacity == 8.0' > /dev/null

    # CL-10: backtrackWindow cascade: mandatory=72 forces DBCluster.spec.backtrackWindow=72.
    - name: cl10-cascade-backtrackwindow-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl10-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl10-cfg
              spec:
                mandatory:
                  backtrackWindow: 72
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch rdsconfig cl10-cfg -n rdscluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"storageEncrypted":false,"kmsKeyID":"","deletionProtection":false,"backupRetentionPeriod":0,"multiAZ":false,"publiclyAccessible":false,"storageType":"","autoMinorVersionUpgrade":false,"copyTagsToSnapshot":false,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":72,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"storageEncrypted":true,"kmsKeyID":"","deletionProtection":true,"backupRetentionPeriod":7,"multiAZ":false,"publiclyAccessible":false,"storageType":"gp3","autoMinorVersionUpgrade":true,"copyTagsToSnapshot":true,"performanceInsightsEnabled":false,"enableIAMDatabaseAuthentication":false,"manageMasterUserPassword":false,"namingTemplate":"{namespace}-{name}","serverlessV2ScalingMinCapacity":0,"serverlessV2ScalingMaxCapacity":0,"backtrackWindow":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSCluster
              metadata:
                name: cl10-cluster
                namespace: rdscluster
              spec:
                configRef: cl10-cfg
                engine: aurora-mysql
        - assert:
            resource:
              apiVersion: rds.services.k8s.aws/v1alpha1
              kind: DBCluster
              metadata:
                name: cl10-cluster
                namespace: rdscluster
              spec:
                backtrackWindow: 72

    # CL-11: Default naming template {namespace}-{name}; status.resourceName, predictedArn,
    #          dbClusterIdentifier all set correctly.
    - name: cl11-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RDSConfig
              metadata:
                name: cl11-cfg
                namespace: rdscluster
                labels:
                  aws.kropath.run/resource-name: cl11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
