# AC-11: LambdaConfig with mandatory.syncedLabels for synced-labels propagation test.
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: synced-labels-policy
  namespace: lambdaconfig
  labels:
    aws.kropath.run/resource-name: synced-labels-policy
spec:
  mandatory:
    runtime: ""
    memorySize: 0
    timeout: 0
    tracingMode: ""
    kmsKeyArn: ""
    namingTemplate: ""
    tags: {}
    syncedLabels:
      data-class: internal
    syncedAnnotations: {}
  defaults:
    runtime: ""
    memorySize: 128
    timeout: 3
    tracingMode: "PassThrough"
    kmsKeyArn: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
