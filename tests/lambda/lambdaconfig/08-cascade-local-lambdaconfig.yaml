# AC-7: Local (namespace-scoped) LambdaConfig for cascade test.
# Controller reads KropathConfig.mandatory.lambda.tracingMode + this config's defaults
# and writes status.effectiveConfig (simulated via kubectl patch in the test).
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: cascade-policy
  namespace: lambdaconfig
  labels:
    aws.kropath.run/resource-name: cascade-policy
spec:
  mandatory:
    runtime: ""
    memorySize: 0
    timeout: 0
    tracingMode: ""
    kmsKeyArn: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    runtime: "python3.12"
    memorySize: 256
    timeout: 10
    tracingMode: ""
    kmsKeyArn: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
