# AC-10: LambdaConfig with mandatory.tags and defaults.tags for merge test.
# Controller merges KropathConfig.mandatory.tags + LambdaConfig.mandatory.tags
# into status.effectiveConfig.mandatory.tags (simulated via kubectl patch).
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: tag-policy
  namespace: lambdaconfig
  labels:
    aws.kropath.run/resource-name: tag-policy
spec:
  mandatory:
    runtime: ""
    memorySize: 0
    timeout: 0
    tracingMode: ""
    kmsKeyArn: ""
    namingTemplate: ""
    tags:
      service: lambda
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    runtime: ""
    memorySize: 128
    timeout: 3
    tracingMode: "PassThrough"
    kmsKeyArn: ""
    namingTemplate: "{namespace}-{name}"
    tags:
      team: platform
    syncedLabels: {}
    syncedAnnotations: {}
