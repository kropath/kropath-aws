# AC-9: security-hardened profile with mandatory kmsKeyArn and tracingMode — must be accepted.
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: security-hardened
  namespace: lambdaconfig
  labels:
    aws.kropath.run/resource-name: security-hardened
spec:
  mandatory:
    runtime: ""
    memorySize: 0
    timeout: 0
    tracingMode: "Active"
    kmsKeyArn: "arn:aws:kms:ap-southeast-2:123456789012:key/abc-security"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    runtime: ""
    memorySize: 128
    timeout: 3
    tracingMode: ""
    kmsKeyArn: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
