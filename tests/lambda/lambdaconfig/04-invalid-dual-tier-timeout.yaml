# AC-4: timeout set in both mandatory and defaults — must be rejected.
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: strict-ac4-timeout
  namespace: lambdaconfig
spec:
  mandatory:
    runtime: ""
    memorySize: 0
    timeout: 30
    tracingMode: ""
    kmsKeyArn: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    runtime: ""
    memorySize: 128
    timeout: 3
    tracingMode: "PassThrough"
    kmsKeyArn: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
