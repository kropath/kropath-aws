# aws-lambda-03 Chainsaw tests — 13 acceptance criteria for LambdaEventSourceMapping.
# Namespace: lambdaeventsourcemapping.
# Naming exemption: no resourceName/predictedArn/namingStatus; status.uuid exposed.
# Each step creates a unique LambdaConfig (acN-cfg) and mock LambdaFunction CR, then
# patches both statuses to simulate kropath-controller and function reconciliation.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lambdaeventsourcemapping
spec:
  skipDelete: true
  namespace: lambdaeventsourcemapping
  steps:
    # ── AC-1: sqs-basic-create ────────────────────────────────────────────────
    # ── AC-11: standard-metadata (managed-by, instance, ownerRef, deletion-policy) ──
    # ── AC-13: naming-exemption (no resourceName/predictedArn/namingStatus) ───
    - name: ac1-ac11-ac13-sqs-basic-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaConfig
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {runtime: "", memorySize: 0, timeout: 0, tracingMode: "", kmsKeyArn: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {runtime: "python3.12", memorySize: 128, timeout: 3, tracingMode: "PassThrough", kmsKeyArn: "", namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch lambdaconfig ac1-cfg -n lambdaeventsourcemapping --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"runtime":"","memorySize":0,"timeout":0,"tracingMode":"","kmsKeyArn":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"runtime":"python3.12","memorySize":128,"timeout":3,"tracingMode":"PassThrough","kmsKeyArn":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        # Create mock LambdaFunction CR and patch its status.resourceName
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaFunction
              metadata:
                name: my-fn
                namespace: lambdaeventsourcemapping
                labels:
                  aws.kropath.run/resource-name: my-fn
              spec:
                configRef: ac1-cfg
                handler: handler.main
                role: "arn:aws:iam::123456789012:role/lambda-exec"
                code:
                  s3Bucket: my-bucket
                  s3Key: fn.zip
        - script:
            content: |
              kubectl patch lambdafunction my-fn -n lambdaeventsourcemapping --subresource=status --type=merge \
                -p '{"status":{"resourceName":"apps-prod-my-fn","namingStatus":"valid","predictedArn":"arn:aws:lambda:ap-southeast-2:123456789012:function:apps-prod-my-fn"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaEventSourceMapping
              metadata:
                name: sqs-esm
              spec:
                configRef: ac1-cfg
                functionRef: my-fn
                eventSourceArn: "arn:aws:sqs:ap-southeast-2:123456789012:my-queue"
                batchSize: 5
        - assert:
            resource:
              apiVersion: lambda.services.k8s.aws/v1alpha1
              kind: EventSourceMapping
              metadata:
                name: sqs-esm
                namespace: lambdaeventsourcemapping
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: sqs-esm
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                functionName: apps-prod-my-fn
                eventSourceARN: "arn:aws:sqs:ap-southeast-2:123456789012:my-queue"
                batchSize: 5
        # AC-13: naming exemption — ESM status has no resourceName, predictedArn, or namingStatus
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaEventSourceMapping
              metadata:
                name: sqs-esm
              (status.resourceName): null
              (status.predictedArn): null
              (status.namingStatus): null

