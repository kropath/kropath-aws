                defaults: {runtime: "python3.12", memorySize: 128, timeout: 3, tracingMode: "PassThrough", kmsKeyArn: "", namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch lambdaconfig ac2-cfg -n lambdaeventsourcemapping --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"runtime":"","memorySize":0,"timeout":0,"tracingMode":"","kmsKeyArn":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"runtime":"python3.12","memorySize":128,"timeout":3,"tracingMode":"PassThrough","kmsKeyArn":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaFunction
              metadata:
                name: stream-proc
                namespace: lambdaeventsourcemapping
                labels:
                  aws.kropath.run/resource-name: stream-proc
              spec:
                configRef: ac2-cfg
                handler: handler.main
                role: "arn:aws:iam::123456789012:role/lambda-exec"
                code:
                  s3Bucket: my-bucket
                  s3Key: fn.zip
        - script:
            content: |
              kubectl patch lambdafunction stream-proc -n lambdaeventsourcemapping --subresource=status --type=merge \
                -p '{"status":{"resourceName":"lambdaeventsourcemapping-stream-proc","namingStatus":"valid"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaEventSourceMapping
              metadata:
                name: kinesis-esm
              spec:
                configRef: ac2-cfg
                functionRef: stream-proc
                eventSourceArn: "arn:aws:kinesis:ap-southeast-2:123456789012:stream/my-stream"
                startingPosition: TRIM_HORIZON
                parallelizationFactor: 5
                bisectBatchOnFunctionError: true
        - assert:
            resource:
              apiVersion: lambda.services.k8s.aws/v1alpha1
              kind: EventSourceMapping
              metadata:
                name: kinesis-esm
              spec:
                startingPosition: TRIM_HORIZON
                parallelizationFactor: 5
                bisectBatchOnFunctionError: true

