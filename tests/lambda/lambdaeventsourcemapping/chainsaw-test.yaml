                -p '{"status":{"resourceName":"lambdaeventsourcemapping-filter-fn","namingStatus":"valid"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaEventSourceMapping
              metadata:
                name: filter-esm
              spec:
                configRef: ac4-cfg
                functionRef: filter-fn
                eventSourceArn: "arn:aws:sqs:ap-southeast-2:123456789012:temp-queue"
                filterCriteria:
                  filters:
                    - pattern: '{"body": {"temperature": [{"numeric": [">", 50]}]}}'
        - assert:
            resource:
              apiVersion: lambda.services.k8s.aws/v1alpha1
              kind: EventSourceMapping
              metadata:
                name: filter-esm
                namespace: lambdaeventsourcemapping
        - script:
            content: |
              OUT=$(kubectl get eventsourcemapping filter-esm -n lambdaeventsourcemapping -o json)
              echo "$OUT" | python3 -c "
              import json, sys
              esm = json.load(sys.stdin)
              filters = esm['spec']['filterCriteria']['filters']
              assert len(filters) == 1, f'expected 1 filter, got {len(filters)}'
              assert '{\"body\": {\"temperature\": [{\"numeric\": [\">\", 50]}]}}' in filters[0]['pattern'], f'pattern mismatch: {filters[0]}'
              print('event-filtering: OK')
              "

