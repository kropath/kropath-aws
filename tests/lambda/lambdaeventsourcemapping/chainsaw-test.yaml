              kubectl patch lambdaconfig ac10-cfg -n lambdaeventsourcemapping --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"runtime":"","memorySize":0,"timeout":0,"tracingMode":"","kmsKeyArn":"","namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"runtime":"python3.12","memorySize":128,"timeout":3,"tracingMode":"PassThrough","kmsKeyArn":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaFunction
