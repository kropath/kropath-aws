                defaults: {runtime: "python3.12", memorySize: 128, timeout: 3, tracingMode: "PassThrough", kmsKeyArn: "", namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {data-class: internal}, syncedAnnotations: {}}
        - script:
