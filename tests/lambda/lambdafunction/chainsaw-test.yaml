# aws-lambda-02 Chainsaw tests — 38 acceptance criteria for LambdaFunction.
# Namespace: lambdafunction. Default naming: {namespace}-{name} => lambdafunction-<cr-name>.
#
# CANONICAL pattern: every step uses a UNIQUE config (acN-cfg) and a UNIQUE CR name.
# spec.skipDelete: true is the global default; no inter-step deletes.
# effectiveConfig is injected via kubectl patch --subresource=status to mock kropath-controller.
# iamRoleCr / kmsKeyCr / cscCr externalRef variables bind to [] when the sentinel label is
# not matched — the fallback ("") is used for most ACs; mock CRs are created only for ref tests.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lambdafunction
spec:
  skipDelete: true
  namespace: lambdafunction
  steps:
    # ── AC-1: runtime-instance ────────────────────────────────────────────────
    # ── AC-25: naming-standard ({namespace}-{name} from defaults template) ────
    # ── AC-32: standard-metadata (managed-by, instance, ownerRef, deletion-policy) ──
    # ── AC-34: deletion-policy-retain (default) ──────────────────────────────
    - name: ac1-ac25-ac32-ac34-basic-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaConfig
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {runtime: "", memorySize: 0, timeout: 0, tracingMode: "", kmsKeyArn: "", namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {runtime: "", memorySize: 128, timeout: 3, tracingMode: "PassThrough", kmsKeyArn: "", namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch lambdaconfig ac1-cfg -n lambdafunction --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"runtime":"","memorySize":0,"timeout":0,"tracingMode":"","kmsKeyArn":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"runtime":"","memorySize":128,"timeout":3,"tracingMode":"PassThrough","kmsKeyArn":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaFunction
              metadata:
                name: basic-fn
              spec:
                configRef: ac1-cfg
                runtime: python3.12
                handler: handler.main
                role: "arn:aws:iam::123456789012:role/lambda-exec"
                code:
                  s3Bucket: my-bucket
                  s3Key: fn.zip
        - assert:
            resource:
              apiVersion: lambda.services.k8s.aws/v1alpha1
              kind: Function
              metadata:
                name: basic-fn
                namespace: lambdafunction
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: basic-fn
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: lambdafunction-basic-fn
                runtime: python3.12
                handler: handler.main
                role: "arn:aws:iam::123456789012:role/lambda-exec"
                code:
                  s3Bucket: my-bucket
                  s3Key: fn.zip
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaFunction
              metadata:
                name: basic-fn
              status:
                resourceName: lambdafunction-basic-fn
                namingStatus: valid
                predictedArn: "arn:aws:lambda:ap-southeast-2:123456789012:function:lambdafunction-basic-fn"

