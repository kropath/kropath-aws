    # ── AC-13: deletion policy delete ─────────────────────────────────────────
    - name: ac13-alias-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaFunction
              metadata:
                name: fn-ac13
                labels:
                  aws.kropath.run/resource-name: fn-ac13
              spec:
                configRef: fn-general
                role: "arn:aws:iam::123456789012:role/test-role"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaFunction
              metadata:
                name: fn-ac13
              status:
                resourceName: lambdaalias-fn-ac13
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaConfig
              metadata:
                name: ac13-cfg
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
