                name: fn-ac10
              status:
                resourceName: lambdaalias-fn-ac10
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: LambdaConfig
              metadata:
                name: ac10-cfg
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch lambdaconfig ac10-cfg -n lambdaalias --subresource=status --type=merge -p \
                '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
