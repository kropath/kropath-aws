apiVersion: aws.kropath.run/v1alpha1
kind: MWAAConfig
metadata:
  name: airflow-config-both-tiers-test-07
  namespace: mwaaconfig
spec:
  mandatory:
    airflowConfigurationOptions:
      core.parallelism: "32"
      core.max_active_tasks_per_dag: "16"
  defaults:
    airflowConfigurationOptions:
      logging.logging_level: "WARNING"
      core.default_timezone: "utc"
