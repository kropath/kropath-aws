---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mwaaconfig
spec:
  skipDelete: true
  namespace: mwaaconfig
  steps:

    # ── AC-1: MWAAConfig CR accepted ──────────────────────────────────────────
    - name: config-create
      description: >-
        AC-1: A well-formed MWAAConfig with non-overlapping mandatory and defaults
        fields is accepted by the API server.
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAConfig
              metadata:
                name: general-policy-test-01
                namespace: mwaaconfig

    # ── AC-2: Dual-tier airflowVersion rejected ────────────────────────────────
    - name: dual-tier-airflowversion
      description: >-
        AC-2: Setting airflowVersion in both mandatory and defaults is rejected with
        a CEL validation error.
      try:
        - apply:
            file: 02-invalid-dual-tier-airflowversion.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MWAAConfig
                  metadata:
                    name: dual-tier-airflowversion-test-02
                check:
                  ($error != null): true

    # ── AC-3: Dual-tier environmentClass rejected ──────────────────────────────
    - name: dual-tier-environmentclass
      description: >-
        AC-3: Setting environmentClass in both mandatory and defaults is rejected.
      try:
        - apply:
            file: 03-invalid-dual-tier-environmentclass.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MWAAConfig
                  metadata:
                    name: dual-tier-environmentclass-test-03
                check:
                  ($error != null): true

    # ── AC-4: Dual-tier webserverAccessMode rejected ───────────────────────────
    - name: dual-tier-webserveraccessmode
      description: >-
        AC-4: Setting webserverAccessMode in both mandatory and defaults is rejected.
      try:
        - apply:
            file: 04-invalid-dual-tier-webserveraccessmode.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MWAAConfig
                  metadata:
                    name: dual-tier-webserveraccessmode-test-04
                check:
                  ($error != null): true

    # ── AC-5: Dual-tier maxWorkers rejected ───────────────────────────────────
    - name: dual-tier-maxworkers
      description: >-
        AC-5: Setting maxWorkers (non-zero) in both mandatory and defaults is rejected.
      try:
        - apply:
            file: 05-invalid-dual-tier-maxworkers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MWAAConfig
                  metadata:
                    name: dual-tier-maxworkers-test-05
                check:
                  ($error != null): true

    # ── AC-6: Dual-tier boolean (dagProcessingLogsEnabled) rejected ───────────
    - name: dual-tier-dagprocessinglogsenabled
      description: >-
        AC-6: Setting dagProcessingLogsEnabled (nil-sentinel boolean) in both
        mandatory and defaults is rejected.
      try:
        - apply:
            file: 06-invalid-dual-tier-dagprocessinglogsenabled.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MWAAConfig
                  metadata:
                    name: dual-tier-daglogging-test-06
                check:
                  ($error != null): true

    # ── AC-7: airflowConfigurationOptions in both tiers accepted ──────────────
    - name: airflow-config-options-both-tiers
      description: >-
        AC-7: Map field airflowConfigurationOptions may be set in both mandatory and
        defaults simultaneously (no mutual-exclusion rule applies to maps).
      try:
        - apply:
            file: 07-airflow-config-options-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAConfig
              metadata:
                name: airflow-config-both-tiers-test-07
                namespace: mwaaconfig

    # ── AC-8: tags in both tiers accepted ─────────────────────────────────────
    - name: tags-both-tiers
      description: >-
        AC-8: Map field tags may be set in both mandatory and defaults simultaneously.
      try:
        - apply:
            file: 08-tags-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAConfig
              metadata:
                name: tags-both-tiers-test-08
                namespace: mwaaconfig

    # ── AC-9: Production-grade full config accepted ────────────────────────────
    - name: production
      description: >-
        AC-9: A fully-specified production MWAAConfig with all scalar fields in a
        single tier is accepted.
      try:
        - apply:
            file: 09-production.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAConfig
              metadata:
                name: production-test-09
                namespace: mwaaconfig

    # ── AC-10: Per-component logging config accepted ───────────────────────────
    - name: per-component-logging
      description: >-
        AC-10: Different log levels per MWAA component (dag, scheduler, task,
        webserver, worker) can be set independently in mandatory.
      try:
        - apply:
            file: 10-per-component-logging.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAConfig
              metadata:
                name: per-component-logging-test-10
                namespace: mwaaconfig
