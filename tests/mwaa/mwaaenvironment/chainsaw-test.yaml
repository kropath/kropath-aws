# aws-mwaa-02 Chainsaw tests — one scenario per acceptance criterion.
# Namespace: mwaaenvironment (fixed; mwaa-{namespace}-{name} template expands predictably).
# accountId: 123456789012 | region: ap-southeast-2
# effectiveConfig is injected via kubectl patch --subresource=status to simulate
# kropath-controller (which is not running in the local test cluster).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mwaaenvironment
spec:
  skipDelete: true
  namespace: mwaaenvironment
  steps:

    # ──────────────────────────────────────────────────────────────────────────
    # Seed: namespace + general-policy MWAAConfig with effectiveConfig patched in.
    # Base state: no KMS, SERVICE mode, defaults for scaling/logging, {namespace}-{name} naming.
    # Boolean logging-enabled fields intentionally omitted from mandatory so RGD default (true) applies.
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-general-policy
      try:
        - apply:
            file: 00-mwaaenvironment-namespace.yaml
        - apply:
            file: 01-general-policy-config.yaml
        - script:
            content: |
              kubectl patch mwaaconfig general-policy -n mwaaenvironment \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"airflowVersion":"","environmentClass":"","webserverAccessMode":"","endpointManagement":"","kmsKeyARN":"","maxWorkers":0,"minWorkers":0,"maxWebservers":0,"minWebservers":0,"schedulers":0,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"","schedulerLogsLevel":"","taskLogsLevel":"","webserverLogsLevel":"","workerLogsLevel":"","airflowConfigurationOptions":{},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"airflowVersion":"2.10.3","environmentClass":"mw1.small","webserverAccessMode":"PRIVATE_ONLY","endpointManagement":"SERVICE","kmsKeyARN":"","maxWorkers":10,"minWorkers":1,"maxWebservers":2,"minWebservers":2,"schedulers":2,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"INFO","schedulerLogsLevel":"INFO","taskLogsLevel":"INFO","webserverLogsLevel":"INFO","workerLogsLevel":"INFO","airflowConfigurationOptions":{},"namingTemplate":"mwaa-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: Naming — default template mwaa-{namespace}-{name} → effectiveName computed.
    # Unique resource name: env-ac1
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-naming-default-template
      description: >-
        AC-1: No nameOverride, no namingTemplate override → effectiveName uses
        defaults.namingTemplate "mwaa-{namespace}-{name}".
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac1
              spec:
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac1
              status:
                resourceName: mwaa-mwaaenvironment-env-ac1
                namingStatus: valid
                predictedArn: "arn:aws:airflow:ap-southeast-2:123456789012:environment/mwaa-mwaaenvironment-env-ac1"
        - assert:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac1
              spec:
                name: mwaa-mwaaenvironment-env-ac1

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2: Naming — mandatory.namingTemplate overrides defaults.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac2-naming-mandatory-template
      description: >-
        AC-2: mandatory.namingTemplate set → effectiveName uses mandatory template
        (ignores defaults.namingTemplate and nameOverride absence).
      try:
        - script:
            content: |
              kubectl patch mwaaconfig general-policy -n mwaaenvironment \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"airflowVersion":"","environmentClass":"","webserverAccessMode":"","endpointManagement":"","kmsKeyARN":"","maxWorkers":0,"minWorkers":0,"maxWebservers":0,"minWebservers":0,"schedulers":0,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"","schedulerLogsLevel":"","taskLogsLevel":"","webserverLogsLevel":"","workerLogsLevel":"","airflowConfigurationOptions":{},"namingTemplate":"env-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"airflowVersion":"2.10.3","environmentClass":"mw1.small","webserverAccessMode":"PRIVATE_ONLY","endpointManagement":"SERVICE","kmsKeyARN":"","maxWorkers":10,"minWorkers":1,"maxWebservers":2,"minWebservers":2,"schedulers":2,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"INFO","schedulerLogsLevel":"INFO","taskLogsLevel":"INFO","webserverLogsLevel":"INFO","workerLogsLevel":"INFO","airflowConfigurationOptions":{},"namingTemplate":"mwaa-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac2
              spec:
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac2
              status:
                resourceName: env-env-ac2
                namingStatus: valid
        - assert:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac2
              spec:
                name: env-env-ac2

    # ──────────────────────────────────────────────────────────────────────────
    # AC-3: Naming — spec.nameOverride takes precedence over all templates.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-naming-name-override
      description: >-
        AC-3: spec.nameOverride set → effectiveName uses nameOverride verbatim,
        ignoring namingTemplate from mandatory and defaults.
      try:
        - script:
            content: |
              kubectl patch mwaaconfig general-policy -n mwaaenvironment \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"airflowVersion":"","environmentClass":"","webserverAccessMode":"","endpointManagement":"","kmsKeyARN":"","maxWorkers":0,"minWorkers":0,"maxWebservers":0,"minWebservers":0,"schedulers":0,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"","schedulerLogsLevel":"","taskLogsLevel":"","webserverLogsLevel":"","workerLogsLevel":"","airflowConfigurationOptions":{},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"airflowVersion":"2.10.3","environmentClass":"mw1.small","webserverAccessMode":"PRIVATE_ONLY","endpointManagement":"SERVICE","kmsKeyARN":"","maxWorkers":10,"minWorkers":1,"maxWebservers":2,"minWebservers":2,"schedulers":2,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"INFO","schedulerLogsLevel":"INFO","taskLogsLevel":"INFO","webserverLogsLevel":"INFO","workerLogsLevel":"INFO","airflowConfigurationOptions":{},"namingTemplate":"mwaa-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac3
              spec:
                nameOverride: my-custom-env
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac3
              status:
                resourceName: my-custom-env
                namingStatus: valid
        - assert:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac3
              spec:
                name: my-custom-env

    # ──────────────────────────────────────────────────────────────────────────
    # AC-4: Naming — nameOverride with letter-start produces valid name.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac4-naming-valid-name
      description: >-
        AC-4: nameOverride="mwaa-prod-env" matches ^[a-zA-Z][a-zA-Z0-9-]{0,79}$
        → namingStatus=valid, ACK Environment created.
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac4
              spec:
                nameOverride: mwaa-prod-env
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac4
              status:
                resourceName: mwaa-prod-env
                namingStatus: valid
        - assert:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac4

    # ──────────────────────────────────────────────────────────────────────────
    # AC-5: Naming — invalid name (starts with digit) → namingStatus=invalid-format,
    #        ACK Environment is NOT created.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac5-naming-invalid-format-digit-start
      description: >-
        AC-5: nameOverride="1invalid" does not match ^[a-zA-Z].*$
        → namingStatus=invalid-format; ACK Environment not created.
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac5
              spec:
                nameOverride: "1invalid-name"
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac5
              status:
                resourceName: 1invalid-name
                namingStatus: invalid-format
        - error:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac5

    # ──────────────────────────────────────────────────────────────────────────
    # AC-6: Naming — unresolved {tag.X} token → namingStatus=invalid-unresolved-tokens,
    #        ACK Environment is NOT created.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac6-naming-unresolved-token
      description: >-
        AC-6: namingTemplate uses {tag.env} but no tag "env" exists in any tier
        → effectiveName contains "{tag.env}", namingStatus=invalid-unresolved-tokens.
      try:
        - script:
            content: |
              kubectl patch mwaaconfig general-policy -n mwaaenvironment \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"airflowVersion":"","environmentClass":"","webserverAccessMode":"","endpointManagement":"","kmsKeyARN":"","maxWorkers":0,"minWorkers":0,"maxWebservers":0,"minWebservers":0,"schedulers":0,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"","schedulerLogsLevel":"","taskLogsLevel":"","webserverLogsLevel":"","workerLogsLevel":"","airflowConfigurationOptions":{},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"airflowVersion":"2.10.3","environmentClass":"mw1.small","webserverAccessMode":"PRIVATE_ONLY","endpointManagement":"SERVICE","kmsKeyARN":"","maxWorkers":10,"minWorkers":1,"maxWebservers":2,"minWebservers":2,"schedulers":2,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"INFO","schedulerLogsLevel":"INFO","taskLogsLevel":"INFO","webserverLogsLevel":"INFO","workerLogsLevel":"INFO","airflowConfigurationOptions":{},"namingTemplate":"mwaa-{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac6
              spec:
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac6
              status:
                namingStatus: invalid-unresolved-tokens
        - error:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac6

    # ──────────────────────────────────────────────────────────────────────────
    # Reset config back to base state for remaining AC tests.
    # ──────────────────────────────────────────────────────────────────────────
    - name: reset-general-policy-base
      try:
        - script:
            content: |
              kubectl patch mwaaconfig general-policy -n mwaaenvironment \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"airflowVersion":"","environmentClass":"","webserverAccessMode":"","endpointManagement":"","kmsKeyARN":"","maxWorkers":0,"minWorkers":0,"maxWebservers":0,"minWebservers":0,"schedulers":0,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"","schedulerLogsLevel":"","taskLogsLevel":"","webserverLogsLevel":"","workerLogsLevel":"","airflowConfigurationOptions":{},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"airflowVersion":"2.10.3","environmentClass":"mw1.small","webserverAccessMode":"PRIVATE_ONLY","endpointManagement":"SERVICE","kmsKeyARN":"","maxWorkers":10,"minWorkers":1,"maxWebservers":2,"minWebservers":2,"schedulers":2,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"INFO","schedulerLogsLevel":"INFO","taskLogsLevel":"INFO","webserverLogsLevel":"INFO","workerLogsLevel":"INFO","airflowConfigurationOptions":{},"namingTemplate":"mwaa-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-7: predictedArn — computed from accountId + region + effectiveName.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac7-predicted-arn
      description: >-
        AC-7: predictedArn = "arn:aws:airflow:<region>:<accountId>:environment/<effectiveName>"
        computed from effectiveConfig.aws fields.
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac7
              spec:
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac7
              status:
                resourceName: mwaa-mwaaenvironment-env-ac7
                predictedArn: "arn:aws:airflow:ap-southeast-2:123456789012:environment/mwaa-mwaaenvironment-env-ac7"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-8: kmsKey — no kmsKeyARN in any tier → ackEnvNoKms variant created.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac8-no-kms-variant
      description: >-
        AC-8: mandatory.kmsKeyARN="", spec.kmsKeyARN="", defaults.kmsKeyARN=""
        → ackEnvNoKms variant created (ACK Environment with no kmsKey field).
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac8
              spec:
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac8
              spec:
                name: mwaa-mwaaenvironment-env-ac8

    # ──────────────────────────────────────────────────────────────────────────
    # AC-9: kmsKey — mandatory.kmsKeyARN set → ackEnvWithKms variant; mandatory key used.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac9-mandatory-kms-override
      description: >-
        AC-9: mandatory.kmsKeyARN set → ackEnvWithKms variant; mandatory key overrides
        instance and defaults kmsKeyARN.
      try:
        - script:
            content: |
              kubectl patch mwaaconfig general-policy -n mwaaenvironment \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"airflowVersion":"","environmentClass":"","webserverAccessMode":"","endpointManagement":"","kmsKeyARN":"arn:aws:kms:ap-southeast-2:123456789012:key/org-key","maxWorkers":0,"minWorkers":0,"maxWebservers":0,"minWebservers":0,"schedulers":0,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"","schedulerLogsLevel":"","taskLogsLevel":"","webserverLogsLevel":"","workerLogsLevel":"","airflowConfigurationOptions":{},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"airflowVersion":"2.10.3","environmentClass":"mw1.small","webserverAccessMode":"PRIVATE_ONLY","endpointManagement":"SERVICE","kmsKeyARN":"","maxWorkers":10,"minWorkers":1,"maxWebservers":2,"minWebservers":2,"schedulers":2,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"INFO","schedulerLogsLevel":"INFO","taskLogsLevel":"INFO","webserverLogsLevel":"INFO","workerLogsLevel":"INFO","airflowConfigurationOptions":{},"namingTemplate":"mwaa-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac9
              spec:
                kmsKeyARN: "arn:aws:kms:ap-southeast-2:123456789012:key/team-key"
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac9
              spec:
                kmsKey: "arn:aws:kms:ap-southeast-2:123456789012:key/org-key"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-10: kmsKey — instance wins over defaults kmsKeyARN.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac10-instance-kms-wins-over-defaults
      description: >-
        AC-10: mandatory.kmsKeyARN="" but spec.kmsKeyARN set and defaults.kmsKeyARN set
        → instance kmsKeyARN wins; ackEnvWithKms variant.
      try:
        - script:
            content: |
              kubectl patch mwaaconfig general-policy -n mwaaenvironment \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"airflowVersion":"","environmentClass":"","webserverAccessMode":"","endpointManagement":"","kmsKeyARN":"","maxWorkers":0,"minWorkers":0,"maxWebservers":0,"minWebservers":0,"schedulers":0,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"","schedulerLogsLevel":"","taskLogsLevel":"","webserverLogsLevel":"","workerLogsLevel":"","airflowConfigurationOptions":{},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"airflowVersion":"2.10.3","environmentClass":"mw1.small","webserverAccessMode":"PRIVATE_ONLY","endpointManagement":"SERVICE","kmsKeyARN":"arn:aws:kms:ap-southeast-2:123456789012:key/default-key","maxWorkers":10,"minWorkers":1,"maxWebservers":2,"minWebservers":2,"schedulers":2,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"INFO","schedulerLogsLevel":"INFO","taskLogsLevel":"INFO","webserverLogsLevel":"INFO","workerLogsLevel":"INFO","airflowConfigurationOptions":{},"namingTemplate":"mwaa-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac10
              spec:
                kmsKeyARN: "arn:aws:kms:ap-southeast-2:123456789012:key/instance-key"
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac10
              spec:
                kmsKey: "arn:aws:kms:ap-southeast-2:123456789012:key/instance-key"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-11: kmsKey — defaults kmsKeyARN used when mandatory and instance are empty.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac11-defaults-kms-fallback
      description: >-
        AC-11: mandatory.kmsKeyARN="", spec.kmsKeyARN="", defaults.kmsKeyARN set
        → defaults kmsKeyARN used; ackEnvWithKms variant.
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MWAAEnvironment
              metadata:
                name: env-ac11
              spec:
                dagS3Path: "s3://my-bucket/dags/"
                sourceBucketARN: "arn:aws:s3:::my-mwaa-bucket"
                executionRoleARN: "arn:aws:iam::123456789012:role/MWAARole"
                networkConfiguration:
                  subnetIDs: ["subnet-12345678"]
        - assert:
            resource:
              apiVersion: mwaa.services.k8s.aws/v1alpha1
              kind: Environment
              metadata:
                name: env-ac11
              spec:
                kmsKey: "arn:aws:kms:ap-southeast-2:123456789012:key/default-key"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-12: Governance — mandatory.endpointManagement overrides instance+defaults.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac12-mandatory-endpointmanagement
      description: >-
        AC-12: mandatory.endpointManagement="CUSTOMER" overrides spec.endpointManagement="SERVICE"
        → ACK Environment gets endpointManagement="CUSTOMER".
        (Without a VPC gate ConfigMap, ackEnv is blocked; only namingStatus and no ackEnv created.)
      try:
        - script:
            content: |
              kubectl patch mwaaconfig general-policy -n mwaaenvironment \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"airflowVersion":"","environmentClass":"","webserverAccessMode":"","endpointManagement":"CUSTOMER","kmsKeyARN":"","maxWorkers":0,"minWorkers":0,"maxWebservers":0,"minWebservers":0,"schedulers":0,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"","schedulerLogsLevel":"","taskLogsLevel":"","webserverLogsLevel":"","workerLogsLevel":"","airflowConfigurationOptions":{},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"airflowVersion":"2.10.3","environmentClass":"mw1.small","webserverAccessMode":"PRIVATE_ONLY","endpointManagement":"SERVICE","kmsKeyARN":"","maxWorkers":10,"minWorkers":1,"maxWebservers":2,"minWebservers":2,"schedulers":2,"weeklyMaintenanceWindowStart":"","dagProcessingLogsLevel":"INFO","schedulerLogsLevel":"INFO","taskLogsLevel":"INFO","webserverLogsLevel":"INFO","workerLogsLevel":"INFO","airflowConfigurationOptions":{},"namingTemplate":"mwaa-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
