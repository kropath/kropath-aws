---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro:aggregate-aws-s3
  labels:
    rbac.kro.run/aggregate-to-controller: "true"
rules:
  - apiGroups:
      - kropath.run
    resources:
      - awss3buckets
      - awss3configs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - kropath.run
    resources:
      - awss3buckets/status
      - awss3configs/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - s3.services.k8s.aws
    resources:
      - buckets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
