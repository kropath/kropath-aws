apiVersion: kropath.run/v1alpha1
kind: AWSKropathConfig
metadata:
  name: general-policy
  namespace: kro-system
  spec:
  mandatory:
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: ""
    iam: {}
    s3: {}
    kms:
      enableKeyRotation: false
      allowedKeySpecs: []
  defaults:
    tags:
      environment: test
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: ""
    iam: {}
    s3: {}
    kms:
      enableKeyRotation: false
      allowedKeySpecs: []
  aws:
    accountId: "123456789012"
    region: "us-east-1"
