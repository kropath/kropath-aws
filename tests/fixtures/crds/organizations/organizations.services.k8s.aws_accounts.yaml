---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: accounts.organizations.services.k8s.aws
spec:
  group: organizations.services.k8s.aws
  names:
    kind: Account
    listKind: AccountList
    plural: accounts
    singular: account
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Account is the Schema for the Accounts API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: AccountSpec defines the desired state of Account
            properties:
              email:
                description: Email address of the owner for the new member account.
                type: string
              iamUserAccessToBilling:
                description: Whether IAM users and roles can access billing information.
                type: string
                enum:
                  - ALLOW
                  - DENY
              name:
                description: Friendly name of the new member account.
                type: string
              roleName:
                description: Name of the IAM cross-account access role.
                type: string
              tags:
                description: Tags to attach to the account.
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  required:
                    - key
                    - value
                  type: object
                type: array
            required:
              - email
              - name
            type: object
          status:
            description: AccountStatus defines the observed state of Account
            properties:
              accountID:
                description: 12-digit identifier of the new account.
                type: string
              ackResourceMetadata:
                description: ACK standard resource metadata.
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  partition:
                    type: string
                  region:
                    type: string
                type: object
              completedTimestamp:
                description: Timestamp when account creation completed.
                type: string
              conditions:
                description: ACK standard condition objects.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                    - status
                    - type
                  type: object
                type: array
              createAccountRequestID:
                description: Reference ID for the async create-account request.
                type: string
              failureReason:
                description: Human-readable reason if account creation failed.
                type: string
              state:
                description: Async creation request status.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
