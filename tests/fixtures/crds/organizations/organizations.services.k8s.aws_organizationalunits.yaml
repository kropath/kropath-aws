                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  partition:
                    type: string
                  region:
                    type: string
                type: object
              conditions:
                description: ACK standard condition objects.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
