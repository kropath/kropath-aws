---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: indexes.s3vectors.services.k8s.aws
spec:
  group: s3vectors.services.k8s.aws
  names:
    kind: Index
    listKind: IndexList
    plural: indexes
    singular: index
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Index is the Schema for the S3 Vectors Indexes API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              name:
                description: Index name. Required. Immutable.
                type: string
              vectorBucketName:
                description: Vector bucket name. Immutable.
                type: string
              vectorBucketRef:
                properties:
                  from:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              dataType:
                description: Vector data type. Required. Immutable.
                type: string
              dimension:
                description: Number of dimensions. Required. Immutable.
                format: int64
                type: integer
              distanceMetric:
                description: Distance metric for similarity. Required. Immutable.
                type: string
              encryptionConfiguration:
                description: Server-side encryption configuration. Mutable.
                properties:
                  sseType:
                    description: SSE type (SSE-S3 or SSE-KMS).
                    type: string
                  kmsKeyARN:
                    description: KMS key ARN for SSE-KMS.
                    type: string
                  kmsKeyRef:
                    properties:
                      from:
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                type: object
              metadataConfiguration:
                description: Metadata configuration. Immutable.
                properties:
                  nonFilterableMetadataKeys:
                    description: Metadata keys that cannot be used for filtering.
                    items:
                      type: string
                    type: array
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags to assign to the index.
                type: object
            required:
            - name
            - dataType
            - dimension
            - distanceMetric
            type: object
          status:
            properties:
              ackResourceMetadata:
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  region:
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
