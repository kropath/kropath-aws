---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vectorbuckets.s3vectors.services.k8s.aws
spec:
  group: s3vectors.services.k8s.aws
  names:
    kind: VectorBucket
    listKind: VectorBucketList
    plural: vectorbuckets
    singular: vectorbucket
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VectorBucket is the Schema for the S3 Vectors VectorBuckets API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              name:
                description: Vector bucket name. Required. Immutable.
                type: string
              encryptionConfiguration:
                description: Server-side encryption configuration.
                properties:
                  sseType:
                    description: SSE type (SSE-S3 or SSE-KMS).
                    type: string
                  kmsKeyARN:
                    description: KMS key ARN for SSE-KMS.
                    type: string
                  kmsKeyRef:
                    properties:
                      from:
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags to assign to the vector bucket.
                type: object
            required:
            - name
            type: object
          status:
            properties:
              ackResourceMetadata:
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  region:
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
