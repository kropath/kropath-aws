---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: accesspoints.s3files.services.k8s.aws
spec:
  group: s3files.services.k8s.aws
  names:
    kind: AccessPoint
    listKind: AccessPointList
    plural: accesspoints
    singular: accesspoint
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AccessPoint is the Schema for the S3 Express Access Points API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              fileSystemID:
                description: File system ID to attach this access point to.
                type: string
              fileSystemRef:
                properties:
                  from:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              posixUser:
                description: POSIX user identity for this access point.
                properties:
                  uid:
                    description: POSIX user ID.
                    format: int64
                    type: integer
                  gid:
                    description: POSIX group ID.
                    format: int64
                    type: integer
                  secondaryGIDs:
                    description: Secondary POSIX group IDs.
                    items:
                      format: int64
                      type: integer
                    type: array
                type: object
              rootDirectory:
                description: Root directory configuration.
                properties:
                  path:
                    description: Path of the directory in the file system.
                    type: string
                  creationPermissions:
                    description: Permissions to set when creating the root directory.
                    properties:
                      ownerUID:
                        description: POSIX user ID of the root directory owner.
                        format: int64
                        type: integer
                      ownerGID:
                        description: POSIX group ID of the root directory owner.
                        format: int64
                        type: integer
                      permissions:
                        description: POSIX permissions in octal notation.
                        type: string
                    type: object
                type: object
              tags:
                description: Tags as key-value pairs (array format).
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  required:
                  - key
                  - value
                  type: object
                type: array
            type: object
          status:
            properties:
              ackResourceMetadata:
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  region:
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              accessPointID:
                description: Access point ID assigned by AWS.
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
