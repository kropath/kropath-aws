---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: filesystems.s3files.services.k8s.aws
spec:
  group: s3files.services.k8s.aws
  names:
    kind: FileSystem
    listKind: FileSystemList
    plural: filesystems
    singular: filesystem
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FileSystem is the Schema for the S3 Express File Systems API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              bucket:
                description: S3 Express bucket name. Required.
                type: string
              bucketRef:
                properties:
                  from:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              acceptBucketWarning:
                description: Acknowledge bucket-level warnings.
                type: boolean
              prefix:
                description: Key prefix within the bucket.
                type: string
              roleARN:
                description: IAM role ARN for file system access.
                type: string
              roleRef:
                properties:
                  from:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              kmsKeyID:
                description: KMS key ID for server-side encryption.
                type: string
              kmsKeyRef:
                properties:
                  from:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              policy:
                description: Resource-based policy.
                type: string
              tags:
                description: Tags as key-value pairs (array format).
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  required:
                  - key
                  - value
                  type: object
                type: array
            type: object
          status:
            properties:
              ackResourceMetadata:
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  region:
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              fileSystemID:
                description: File system ID assigned by AWS.
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
