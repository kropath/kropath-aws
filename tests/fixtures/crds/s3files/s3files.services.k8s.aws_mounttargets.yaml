---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mounttargets.s3files.services.k8s.aws
spec:
  group: s3files.services.k8s.aws
  names:
    kind: MountTarget
    listKind: MountTargetList
    plural: mounttargets
    singular: mounttarget
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MountTarget is the Schema for the S3 Express Mount Targets API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              fileSystemID:
                description: File system ID.
                type: string
              fileSystemRef:
                properties:
                  from:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              subnetID:
                description: VPC subnet ID.
                type: string
              subnetRef:
                properties:
                  from:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              securityGroups:
                description: Security group IDs.
                items:
                  type: string
                type: array
              securityGroupRefs:
                description: ACK references for security groups.
                items:
                  properties:
                    from:
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      type: object
                  type: object
                type: array
              ipAddressType:
                description: IP address type (ipv4, dualstack, etc.).
                type: string
              ipv4Address:
                description: Static IPv4 address for the mount target.
                type: string
              ipv6Address:
                description: Static IPv6 address for the mount target.
                type: string
            type: object
          status:
            properties:
              ackResourceMetadata:
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  region:
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              mountTargetID:
                description: Mount target ID assigned by AWS.
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
