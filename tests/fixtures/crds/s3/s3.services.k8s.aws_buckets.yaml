---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: buckets.s3.services.k8s.aws
spec:
  group: s3.services.k8s.aws
  names:
    kind: Bucket
    listKind: BucketList
    plural: buckets
    singular: bucket
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                createBucketConfiguration:
                  type: object
                  properties:
                    locationConstraint:
                      type: string
                encryption:
                  type: object
                  properties:
                    rules:
                      type: array
                      items:
                        type: object
                        properties:
                          applyServerSideEncryptionByDefault:
                            type: object
                            properties:
                              sseAlgorithm:
                                type: string
                              kmsMasterKeyID:
                                type: string
                          bucketKeyEnabled:
                            type: boolean
                objectOwnership:
                  type: string
                ownershipControls:
                  type: object
                  properties:
                    rules:
                      type: array
                      items:
                        type: object
                        properties:
                          objectOwnership:
                            type: string
                policy:
                  type: string
                publicAccessBlock:
                  type: object
                  properties:
                    blockPublicACLs:
                      type: boolean
                    blockPublicPolicy:
                      type: boolean
                    ignorePublicACLs:
                      type: boolean
                    restrictPublicBuckets:
                      type: boolean
                tagging:
                  type: object
                  properties:
                    tagSet:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          value:
                            type: string
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                versioning:
                  type: object
                  properties:
                    status:
                      type: string
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
