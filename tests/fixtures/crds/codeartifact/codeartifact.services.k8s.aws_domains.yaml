  names:
    kind: Domain
    listKind: DomainList
    plural: domains
    singular: domain
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Domain is the Schema for the Domains API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
