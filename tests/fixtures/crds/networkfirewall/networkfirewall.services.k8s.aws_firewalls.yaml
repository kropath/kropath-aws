---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.2
  name: firewalls.networkfirewall.services.k8s.aws
spec:
  group: networkfirewall.services.k8s.aws
  names:
    kind: Firewall
    listKind: FirewallList
    plural: firewalls
    singular: firewall
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Firewall is the Schema for the Firewalls API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: FirewallSpec defines the desired state of Firewall.
            properties:
              firewallName:
                description: The descriptive name of the firewall.
                type: string
              description:
                description: A description of the firewall.
                type: string
              vpcID:
                description: The unique identifier of the VPC where Network Firewall
                  should create the firewall.
                type: string
              subnetMappings:
                description: The public subnets to use for your Network Firewall
                  firewalls.
                items:
                  description: The ID for a subnet that you want to associate with
                    the firewall.
                  properties:
                    ipAddressType:
                      type: string
                    subnetID:
                      type: string
                  type: object
                type: array
              firewallPolicyARN:
                description: The Amazon Resource Name (ARN) of the FirewallPolicy
                  that you want to use for the firewall.
                type: string
              deleteProtection:
                description: A flag indicating whether it is possible to delete the
                  firewall.
                type: boolean
              firewallPolicyChangeProtection:
                description: A setting indicating whether the firewall is protected
                  against a change to the firewall policy association.
                type: boolean
              subnetChangeProtection:
                description: A setting indicating whether the firewall is protected
                  against changes to the subnet associations.
                type: boolean
              encryptionConfiguration:
                description: A complex type that contains optional KMS encryption
                  settings for your Network Firewall resources.
                properties:
                  keyID:
                    description: The ID of the KMS customer managed key.
                    type: string
                  type_:
                    description: The type of KMS key to use for encryption.
                    type: string
                type: object
              loggingConfiguration:
                description: Defines how Network Firewall performs logging for a
                  firewall.
                properties:
                  logDestinationConfigs:
                    description: Defines the logging destinations for the logs for
                      a firewall.
                    items:
                      description: Defines where Network Firewall sends logs for
                        the firewall for one log type.
                      properties:
                        logDestination:
                          additionalProperties:
                            type: string
                          type: object
                        logDestinationType:
                          type: string
                        logType:
                          type: string
                      type: object
                    type: array
                type: object
              tags:
                description: The key:value pairs to associate with the resource.
                items:
                  description: A key:value pair associated with an AWS resource.
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  type: object
                type: array
            required:
            - firewallName
            - vpcID
            - subnetMappings
            - firewallPolicyARN
            type: object
          status:
            description: FirewallStatus defines the observed state of Firewall
            properties:
              ackResourceMetadata:
                description: All CRs managed by ACK have a common Status.ACKResourceMetadata
                  member.
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  region:
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              firewallID:
                description: The unique identifier for the firewall.
                type: string
              firewallARN:
                description: The Amazon Resource Name (ARN) of the firewall.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
