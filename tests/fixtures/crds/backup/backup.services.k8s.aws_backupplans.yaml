---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: backupplans.backup.services.k8s.aws
spec:
  group: backup.services.k8s.aws
  names:
    kind: BackupPlan
    listKind: BackupPlanList
    plural: backupplans
    singular: backupplan
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BackupPlan is the Schema for the BackupPlans API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: BackupPlanSpec defines the desired state of BackupPlan.
            properties:
              advancedBackupSettings:
                description: Per-resource-type backup options.
                items:
                  properties:
                    backupOptions:
                      additionalProperties:
                        type: string
                      type: object
                    resourceType:
                      type: string
                  type: object
                type: array
              name:
                description: Display name.
                type: string
              rules:
                description: Backup rule objects defining schedules and lifecycle.
                items:
                  properties:
                    completionWindowMinutes:
                      description: Maximum time (in minutes) a backup job may run.
                      format: int64
                      type: integer
                    copyActions:
                      description: Copy operations to replicate recovery points.
                      items:
                        properties:
                          destinationBackupVaultARN:
                            type: string
                          destinationBackupVaultRef:
                            properties:
                              from:
                                properties:
                                  name:
                                    type: string
                                  namespace:
                                    type: string
                                required:
                                - name
                                type: object
                            type: object
                          lifecycle:
                            properties:
                              deleteAfterDays:
                                format: int64
                                type: integer
                              moveToColdStorageAfterDays:
                                format: int64
                                type: integer
                            type: object
                        type: object
                      type: array
                    enableContinuousBackup:
                      description: Whether to enable continuous backup.
                      type: boolean
                    lifecycle:
                      description: Lifecycle policy for recovery points.
                      properties:
                        deleteAfterDays:
                          description: Days after which the recovery point is deleted.
                          format: int64
                          type: integer
                        moveToColdStorageAfterDays:
                          description: Days after which the recovery point transitions
                            to cold storage.
                          format: int64
                          type: integer
                      type: object
                    recoveryPointTags:
                      additionalProperties:
                        type: string
                      description: Tags to assign to recovery points.
                      type: object
                    ruleName:
                      description: Display name for this rule.
                      type: string
                    scanActions:
                      description: Malware scanning actions per rule.
                      items:
                        properties:
                          malwareScanner:
                            type: string
                          scanMode:
                            type: string
                        type: object
                      type: array
                    scheduleExpression:
                      description: Cron or rate expression for backup schedule.
                      type: string
                    scheduleExpressionTimezone:
                      description: Timezone for the schedule expression.
                      type: string
                    startWindowMinutes:
                      description: Window after schedule within which backup must start.
                      format: int64
                      type: integer
                    targetBackupVaultName:
                      description: Name of vault to back up to.
                      type: string
                    targetBackupVaultRef:
                      description: ACK reference wrapper for the vault.
                      properties:
                        from:
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          required:
                          - name
                          type: object
                      type: object
                  type: object
                type: array
              scanSettings:
                description: Malware scanning configuration.
                items:
                  properties:
                    malwareScanner:
                      type: string
                    resourceTypes:
                      items:
                        type: string
                      type: array
                    scannerRoleARN:
                      type: string
                    scannerRoleRef:
                      properties:
                        from:
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          required:
                          - name
                          type: object
                      type: object
                  type: object
                type: array
              tags:
                additionalProperties:
                  type: string
                description: Tags to assign to the backup plan.
                type: object
            type: object
          status:
            description: BackupPlanStatus defines the observed state of BackupPlan.
            properties:
              ackResourceMetadata:
                description: Standard ACK resource metadata.
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  partition:
                    type: string
                  region:
                    type: string
                type: object
              conditions:
                description: ACK condition list.
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              creationDate:
                description: Plan creation timestamp.
                type: string
              id:
                description: Unique ID assigned to the backup plan by AWS Backup.
                type: string
              lastExecutionDate:
                description: Last time this plan was run.
                type: string
              versionID:
                description: UUID identifying the plan version.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
