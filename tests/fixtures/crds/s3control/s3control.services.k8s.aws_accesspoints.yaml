---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: accesspoints.s3control.services.k8s.aws
spec:
  group: s3control.services.k8s.aws
  names:
    kind: AccessPoint
    listKind: AccessPointList
    plural: accesspoints
    singular: accesspoint
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AccessPoint is the Schema for the S3Control AccessPoints API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              name:
                description: Access point name. Required.
                type: string
              accountID:
                description: AWS account ID. Required.
                type: string
              bucket:
                description: S3 bucket name or ARN. Required.
                type: string
              bucketAccountID:
                description: Account ID of the bucket owner. Optional.
                type: string
              vpcConfiguration:
                description: VPC configuration restricting access point to a VPC.
                properties:
                  vpcID:
                    description: VPC ID.
                    type: string
                type: object
              publicAccessBlockConfiguration:
                description: Public access block configuration.
                properties:
                  blockPublicAcls:
                    type: boolean
                  ignorePublicAcls:
                    type: boolean
                  blockPublicPolicy:
                    type: boolean
                  restrictPublicBuckets:
                    type: boolean
                type: object
              policy:
                description: Access point policy document.
                type: string
            required:
            - name
            - accountID
            - bucket
            type: object
          status:
            properties:
              ackResourceMetadata:
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  region:
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              alias:
                description: Access point alias.
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
