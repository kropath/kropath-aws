---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tables.s3tables.services.k8s.aws
spec:
  group: s3tables.services.k8s.aws
  names:
    kind: Table
    listKind: TableList
    plural: tables
    singular: table
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Table is the Schema for the S3 Tables Tables API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              name:
                description: Table name. Required. Pattern ^[0-9a-z_]*$.
                type: string
              format:
                description: Table format. Required. Immutable.
                type: string
              tableBucketARN:
                description: ARN of the table bucket. Immutable.
                type: string
              tableBucketRef:
                properties:
                  from:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              namespace:
                description: Namespace name. Immutable.
                type: string
              namespaceRef:
                properties:
                  from:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              encryptionConfiguration:
                description: Encryption configuration. Immutable.
                properties:
                  sseAlgorithm:
                    type: string
                  kmsKeyARN:
                    type: string
                  kmsKeyRef:
                    properties:
                      from:
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                type: object
              storageClassConfiguration:
                description: Storage class configuration. Immutable.
                properties:
                  storageClass:
                    type: string
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags to assign to the table.
                type: object
            required:
            - name
            - format
            type: object
          status:
            properties:
              ackResourceMetadata:
                properties:
                  arn:
                    type: string
                  ownerAccountID:
                    type: string
                  region:
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
