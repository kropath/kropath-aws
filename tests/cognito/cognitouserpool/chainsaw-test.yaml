    # AC-5: When mandatory.deletionProtection=ACTIVE, ACK UserPool uses ACTIVE.
    - name: ac5-mandatory-deletion-protection-active
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
