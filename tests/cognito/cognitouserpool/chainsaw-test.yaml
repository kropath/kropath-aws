    # AC-13: When mandatory.advancedSecurityMode=ENFORCED, ackUserPoolFull variant is created
    # with userPoolAddOns.advancedSecurityMode=ENFORCED. ackUserPool variant is not created.
    - name: ac13-mandatory-advanced-security-enforced
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: ac13-cfg
                namespace: cognitouserpool
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cognitoconfig ac13-cfg -n cognitouserpool \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"mfaConfiguration":"","deletionProtection":"","advancedSecurityMode":"ENFORCED","passwordPolicy":{"minimumLength":0,"temporaryPasswordValidityDays":0},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"mfaConfiguration":"OFF","deletionProtection":"INACTIVE","advancedSecurityMode":"","passwordPolicy":{"minimumLength":8,"requireLowercase":true,"requireNumbers":true,"requireSymbols":true,"requireUppercase":true,"temporaryPasswordValidityDays":7},"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
