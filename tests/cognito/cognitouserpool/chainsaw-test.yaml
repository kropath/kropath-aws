    # AC-7: mandatory.passwordPolicy.minimumLength overrides instance and defaults.
    - name: ac7-mandatory-password-min-length
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: ac7-cfg
                namespace: cognitouserpool
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cognitoconfig ac7-cfg -n cognitouserpool \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"mfaConfiguration":"","deletionProtection":"","advancedSecurityMode":"","passwordPolicy":{"minimumLength":20,"temporaryPasswordValidityDays":0},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"mfaConfiguration":"OFF","deletionProtection":"INACTIVE","advancedSecurityMode":"","passwordPolicy":{"minimumLength":8,"requireLowercase":true,"requireNumbers":true,"requireSymbols":true,"requireUppercase":true,"temporaryPasswordValidityDays":7},"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              metadata:
                name: ac7-pool
                namespace: cognitouserpool
              spec:
                configRef: ac7-cfg
                passwordPolicy:
                  minimumLength: 10
        - assert:
            resource:
              apiVersion: cognitoidentityprovider.services.k8s.aws/v1alpha1
              kind: UserPool
              metadata:
                name: ac7-pool
                namespace: cognitouserpool
              spec:
                policies:
                  passwordPolicy:
                    minimumLength: 20

    # AC-8: Instance passwordPolicy.minimumLength overrides defaults when mandatory is 0.
    - name: ac8-instance-password-min-length
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: ac8-cfg
                namespace: cognitouserpool
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cognitoconfig ac8-cfg -n cognitouserpool \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"mfaConfiguration":"","deletionProtection":"","advancedSecurityMode":"","passwordPolicy":{"minimumLength":0,"temporaryPasswordValidityDays":0},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"mfaConfiguration":"OFF","deletionProtection":"INACTIVE","advancedSecurityMode":"","passwordPolicy":{"minimumLength":8,"requireLowercase":true,"requireNumbers":true,"requireSymbols":true,"requireUppercase":true,"temporaryPasswordValidityDays":7},"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              metadata:
                name: ac8-pool
                namespace: cognitouserpool
              spec:
                configRef: ac8-cfg
                passwordPolicy:
                  minimumLength: 14
        - assert:
            resource:
              apiVersion: cognitoidentityprovider.services.k8s.aws/v1alpha1
              kind: UserPool
              metadata:
                name: ac8-pool
                namespace: cognitouserpool
              spec:
                policies:
                  passwordPolicy:
                    minimumLength: 14

    # AC-9: defaults.passwordPolicy.minimumLength used when mandatory and instance are both 0.
    - name: ac9-defaults-password-min-length
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: ac9-cfg
                namespace: cognitouserpool
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cognitoconfig ac9-cfg -n cognitouserpool \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"mfaConfiguration":"","deletionProtection":"","advancedSecurityMode":"","passwordPolicy":{"minimumLength":0,"temporaryPasswordValidityDays":0},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"mfaConfiguration":"OFF","deletionProtection":"INACTIVE","advancedSecurityMode":"","passwordPolicy":{"minimumLength":12,"requireLowercase":true,"requireNumbers":true,"requireSymbols":true,"requireUppercase":true,"temporaryPasswordValidityDays":7},"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              metadata:
                name: ac9-pool
                namespace: cognitouserpool
              spec:
                configRef: ac9-cfg
        - assert:
