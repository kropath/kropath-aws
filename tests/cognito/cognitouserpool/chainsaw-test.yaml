# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named CognitoConfig + CognitoUserPool and
# deletes nothing between steps. skipDelete: true stops chainsaw's end-of-test cascade
# delete; the ephemeral kind cluster is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cognitouserpool
spec:
  skipDelete: true
  namespace: cognitouserpool
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: When no governance sets mfaConfiguration, ACK UserPool defaults to OFF.
    - name: ac1-default-mfa-off
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: ac1-cfg
                namespace: cognitouserpool
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cognitoconfig ac1-cfg -n cognitouserpool \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"mfaConfiguration":"","deletionProtection":"","advancedSecurityMode":"","passwordPolicy":{"minimumLength":0,"temporaryPasswordValidityDays":0},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"mfaConfiguration":"","deletionProtection":"","advancedSecurityMode":"","passwordPolicy":{"minimumLength":8,"requireLowercase":true,"requireNumbers":true,"requireSymbols":true,"requireUppercase":true,"temporaryPasswordValidityDays":7},"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              metadata:
                name: ac1-pool
                namespace: cognitouserpool
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: cognitoidentityprovider.services.k8s.aws/v1alpha1
              kind: UserPool
              metadata:
                name: ac1-pool
                namespace: cognitouserpool
              spec:
                name: cognitouserpool-ac1-pool
                mfaConfiguration: "OFF"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              metadata:
                name: ac1-pool
                namespace: cognitouserpool
              status:
                resourceName: cognitouserpool-ac1-pool
                namingStatus: valid

    # AC-2: When mandatory.mfaConfiguration=ON, it overrides instance and defaults.
    - name: ac2-mandatory-mfa-on
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: ac2-cfg
                namespace: cognitouserpool
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cognitoconfig ac2-cfg -n cognitouserpool \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"mfaConfiguration":"ON","deletionProtection":"","advancedSecurityMode":"","passwordPolicy":{"minimumLength":0,"temporaryPasswordValidityDays":0},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"mfaConfiguration":"OFF","deletionProtection":"","advancedSecurityMode":"","passwordPolicy":{"minimumLength":8,"requireLowercase":true,"requireNumbers":true,"requireSymbols":true,"requireUppercase":true,"temporaryPasswordValidityDays":7},"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              metadata:
                name: ac2-pool
                namespace: cognitouserpool
              spec:
                configRef: ac2-cfg
                mfaConfiguration: "OPTIONAL"
        - assert:
            resource:
              apiVersion: cognitoidentityprovider.services.k8s.aws/v1alpha1
              kind: UserPool
              metadata:
                name: ac2-pool
                namespace: cognitouserpool
              spec:
                mfaConfiguration: "ON"

    # AC-3: Instance mfaConfiguration overrides defaults when mandatory is empty.
    - name: ac3-instance-mfa-overrides-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
