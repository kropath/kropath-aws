    - name: ac33-mutual-exclusion-username-alias-negative
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: ac33-cfg
                namespace: cognitouserpool
                labels:
                  aws.kropath.run/resource-name: ac33-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cognitoconfig ac33-cfg -n cognitouserpool \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"mfaConfiguration":"","deletionProtection":"","advancedSecurityMode":"","passwordPolicy":{"minimumLength":0,"temporaryPasswordValidityDays":0},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"mfaConfiguration":"OFF","deletionProtection":"INACTIVE","advancedSecurityMode":"","passwordPolicy":{"minimumLength":8,"requireLowercase":true,"requireNumbers":true,"requireSymbols":true,"requireUppercase":true,"temporaryPasswordValidityDays":7},"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              metadata:
                name: ac33-pool
                namespace: cognitouserpool
              spec:
                configRef: ac33-cfg
                usernameAttributes:
                  - email
                aliasAttributes:
                  - phone_number
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoUserPool
              metadata:
                name: ac33-pool
                namespace: cognitouserpool
              status:
                validationError: "usernameAttributes and aliasAttributes are mutually exclusive — set only one"
        # ACK UserPool must NOT be created
        - script:
            content: |
              COUNT=$(kubectl get userpool ac33-pool -n cognitouserpool --no-headers 2>/dev/null | wc -l | tr -d ' ')
              if [ "$COUNT" = "0" ]; then
                echo "PASS: ACK UserPool not created as expected (mutual exclusion)"
                exit 0
              else
                echo "FAIL: ACK UserPool was created despite usernameAttributes+aliasAttributes conflict"
                exit 1
              fi
