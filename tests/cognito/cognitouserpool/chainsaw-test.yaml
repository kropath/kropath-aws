    # no userPoolAddOns field.
    - name: ac14-no-advanced-security-omits-addons
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: ac14-cfg
                namespace: cognitouserpool
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
