    # AC-11: mandatory.requireLowercase=false overrides defaults.requireLowercase=true.
    - name: ac11-mandatory-require-lowercase-false
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: ac11-cfg
                namespace: cognitouserpool
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory: {}
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cognitoconfig ac11-cfg -n cognitouserpool \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"mfaConfiguration":"","deletionProtection":"","advancedSecurityMode":"","passwordPolicy":{"minimumLength":0,"requireLowercase":false,"temporaryPasswordValidityDays":0},"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"mfaConfiguration":"OFF","deletionProtection":"INACTIVE","advancedSecurityMode":"","passwordPolicy":{"minimumLength":8,"requireLowercase":true,"requireNumbers":true,"requireSymbols":true,"requireUppercase":true,"temporaryPasswordValidityDays":7},"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
