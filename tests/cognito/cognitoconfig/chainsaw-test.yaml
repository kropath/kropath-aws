# aws-cognito-01 (T-01) Chainsaw tests — CRD-admission ACs only.
# Covers ACs 1, 2, 3, 4, 5, 6, 12. Cascade ACs 7–11 are in T-02 (KRO-737).
# Canonical pattern: unique name per step, spec.skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cognitoconfig
spec:
  skipDelete: true
  namespace: cognitoconfig
  steps:
    # AC-1: happy-path: general-policy-creation
    # Given: CognitoConfig/general-policy with defaults.mfaConfiguration: "OFF",
    #        defaults.passwordPolicy.minimumLength: 8, mandatory: {}
    # When: CR applied
    # Then: CR is accepted; spec.defaults persisted as specified; mandatory is empty
    - name: ac1-general-policy-creation
      try:
        - apply:
            file: 00-cognitoconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CognitoConfig
              metadata:
                name: general-policy
                namespace: cognitoconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  mfaConfiguration: "OFF"
                  deletionProtection: "INACTIVE"
                  passwordPolicy:
                    minimumLength: 8
                    requireLowercase: true
                    requireNumbers: true
                    requireSymbols: true
                    requireUppercase: true
                    temporaryPasswordValidityDays: 7
                  namingTemplate: "{namespace}-{name}"

    # AC-2: negative: dual-tier-mfa-rejected
    # Given: CognitoConfig with mandatory.mfaConfiguration: "ON" AND defaults.mfaConfiguration: "OFF"
    # When: CR applied
    # Then: Rejected by x-kubernetes-validations: "mfaConfiguration cannot be set in both mandatory and defaults"
    - name: ac2-dual-tier-mfa-rejected
      try:
        - apply:
            file: 02-invalid-dual-tier-mfa.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CognitoConfig
                check:
                  ($error != null): true

    # AC-3: negative: dual-tier-deletion-protection-rejected
    # Given: CognitoConfig with mandatory.deletionProtection: "ACTIVE" AND defaults.deletionProtection: "INACTIVE"
    # When: CR applied
    # Then: Rejected by x-kubernetes-validations: "deletionProtection cannot be set in both mandatory and defaults"
    - name: ac3-dual-tier-deletion-protection-rejected
      try:
        - apply:
            file: 03-invalid-dual-tier-deletion-protection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CognitoConfig
                check:
                  ($error != null): true

    # AC-4: negative: dual-tier-advanced-security-rejected
    # Given: CognitoConfig with mandatory.advancedSecurityMode: "ENFORCED" AND defaults.advancedSecurityMode: "OFF"
    # When: CR applied
    # Then: Rejected by x-kubernetes-validations: "advancedSecurityMode cannot be set in both mandatory and defaults"
    - name: ac4-dual-tier-advanced-security-rejected
      try:
        - apply:
            file: 04-invalid-dual-tier-advanced-security.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CognitoConfig
                check:
                  ($error != null): true

    # AC-5: negative: dual-tier-password-length-rejected
    # Given: CognitoConfig with mandatory.passwordPolicy.minimumLength: 12 AND defaults.passwordPolicy.minimumLength: 8
    # When: CR applied
    # Then: Rejected by x-kubernetes-validations: "passwordPolicy.minimumLength cannot be set in both mandatory and defaults"
    - name: ac5-dual-tier-password-length-rejected
      try:
        - apply:
            file: 05-invalid-dual-tier-password-length.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CognitoConfig
                check:
                  ($error != null): true

    # AC-6: negative: dual-tier-require-lowercase-rejected
    # Given: CognitoConfig with mandatory.passwordPolicy.requireLowercase: true AND defaults.passwordPolicy.requireLowercase: true
    # When: CR applied
    # Then: Rejected by x-kubernetes-validations (boolean pointer — has() checks presence, not value)
    - name: ac6-dual-tier-require-lowercase-rejected
      try:
        - apply:
            file: 06-invalid-dual-tier-require-lowercase.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CognitoConfig
                check:
                  ($error != null): true

    # AC-12: negative: dual-tier-require-numbers-rejected
    # Given: CognitoConfig with mandatory.passwordPolicy.requireNumbers: true AND defaults.passwordPolicy.requireNumbers: false
    # When: CR applied
    # Then: Rejected by x-kubernetes-validations (boolean pointer — has() checks presence, not value;
    #       any presence in both tiers is rejected regardless of value)
    - name: ac12-dual-tier-require-numbers-rejected
      try:
        - apply:
            file: 07-invalid-dual-tier-require-numbers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CognitoConfig
                check:
                  ($error != null): true
