# AC-12: negative: dual-tier-require-numbers-rejected — rejected by x-kubernetes-validations.
# Boolean pointer semantics: has() checks PRESENCE, not value.
# requireNumbers: true in mandatory and false in defaults → both present → rejected.
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: invalid-dual-tier-pwnums
  namespace: cognitoconfig
  labels:
    aws.kropath.run/resource-name: invalid-dual-tier-pwnums
spec:
  mandatory:
    passwordPolicy:
      requireNumbers: true
  defaults:
    passwordPolicy:
      requireNumbers: false
