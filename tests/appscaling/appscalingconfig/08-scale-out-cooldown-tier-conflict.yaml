---
# AC-8: scaleOutCooldown set non-zero in BOTH mandatory and defaults — must be rejected.
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: invalid-scaleoutcooldown-both-tiers
  namespace: appscalingconfig
spec:
  mandatory:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 120
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 60
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
