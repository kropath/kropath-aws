---
# AC-11: AppScalingConfig with mandatory.syncedLabels for synced labels cascade test.
# After controller reconciliation, effectiveConfig.mandatory.syncedLabels must contain team:scaling.
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: cascade-test-synced-labels
  namespace: appscalingconfig
  labels:
    aws.kropath.run/resource-name: cascade-test-synced-labels
spec:
  mandatory:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels:
      team: scaling
    syncedAnnotations: {}
  defaults:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
