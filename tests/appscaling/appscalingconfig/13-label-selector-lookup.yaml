---
# AC-13: AppScalingConfig carrying the aws.kropath.run/resource-name label for RGD labelSelector lookup (Theme 28).
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: label-selector-test
  namespace: appscalingconfig
  labels:
    aws.kropath.run/resource-name: label-selector-test
spec:
  mandatory:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    minCapacity: 1
    maxCapacity: 10
    disableScaleIn: false
    scaleInCooldown: 300
    scaleOutCooldown: 60
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
