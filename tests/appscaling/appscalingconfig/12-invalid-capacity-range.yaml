---
# AC-12: AppScalingConfig with mandatory.minCapacity > mandatory.maxCapacity.
# Controller must set status.conditions[type=Valid].status = False, reason InvalidCapacityRange.
# CRD admission allows this (the range check is controller-side, not CEL admission).
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: cascade-test-invalid-capacity-range
  namespace: appscalingconfig
  labels:
    aws.kropath.run/resource-name: cascade-test-invalid-capacity-range
spec:
  mandatory:
    minCapacity: 10
    maxCapacity: 5
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
