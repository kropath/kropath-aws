---
# AC-3: AppScalingConfig with scale-to-zero and aggressive cooldowns (cost-optimized style).
# defaults.minCapacity: 0 allows scale-to-zero; defaults.maxCapacity: 5 caps capacity.
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: cost-optimized-test
  namespace: appscalingconfig
  labels:
    aws.kropath.run/resource-name: cost-optimized-test
spec:
  mandatory:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    minCapacity: 0
    maxCapacity: 5
    disableScaleIn: false
    scaleInCooldown: 60
    scaleOutCooldown: 30
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
