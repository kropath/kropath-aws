---
# AC-2: AppScalingConfig with mandatory fields set (production profile style).
# Enforces minCapacity: 2, maxCapacity: 100, disableScaleIn: true, scaleInCooldown: 600.
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: production-profile-test
  namespace: appscalingconfig
  labels:
    aws.kropath.run/resource-name: production-profile-test
spec:
  mandatory:
    minCapacity: 2
    maxCapacity: 100
    disableScaleIn: true
    scaleInCooldown: 600
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 60
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
