---
# AC-9: AppScalingConfig used as target for KropathConfig mandatory override cascade.
# Controller will set effectiveConfig.mandatory.minCapacity = 2 (from KropathConfig level).
# This fixture is the AppScalingConfig CR; controller patching is simulated in the test step.
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: cascade-test-mandatory-override
  namespace: appscalingconfig
  labels:
    aws.kropath.run/resource-name: cascade-test-mandatory-override
spec:
  mandatory:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    minCapacity: 1
    maxCapacity: 10
    disableScaleIn: false
    scaleInCooldown: 300
    scaleOutCooldown: 60
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
