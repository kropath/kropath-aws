apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingTarget
metadata:
  name: ac14-synced-labels
  namespace: appscalingtarget
spec:
  serviceNamespace: ecs
  scalableDimension: ecs:service:DesiredCount
  resourceID: service/default/synced-labels-svc
  minCapacity: 1
  maxCapacity: 10
  syncedLabels:
    team: platform
    env: staging
