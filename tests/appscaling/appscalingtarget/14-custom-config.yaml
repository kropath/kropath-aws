apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: custom-policy
  namespace: appscalingtarget
  labels:
    aws.kropath.run/resource-name: custom-policy
spec:
  mandatory:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    minCapacity: 0
    maxCapacity: 0
    disableScaleIn: false
    scaleInCooldown: 0
    scaleOutCooldown: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
