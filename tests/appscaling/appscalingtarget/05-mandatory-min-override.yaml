apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingTarget
metadata:
  name: ac3-mandatory-min-override
  namespace: appscalingtarget
spec:
  configRef: mandatory-policy
  serviceNamespace: ecs
  scalableDimension: ecs:service:DesiredCount
  resourceID: service/default/mandatory-min-svc
  minCapacity: 1
  maxCapacity: 10
