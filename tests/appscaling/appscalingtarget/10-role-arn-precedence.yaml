apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingTarget
metadata:
  name: ac7-role-arn-precedence
  namespace: appscalingtarget
spec:
  serviceNamespace: ecs
  scalableDimension: ecs:service:DesiredCount
  resourceID: service/default/precedence-svc
  minCapacity: 1
  maxCapacity: 10
  roleARN: "arn:aws:iam::123456789012:role/direct-role"
