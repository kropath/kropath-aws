# aws-mq-01 Chainsaw tests — all 19 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mqconfig
spec:
  skipDelete: true
  namespace: mqconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-mqconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: general-policy
                namespace: mqconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"

    - name: ac2-reject-both-tiers-enginetype
      try:
        - apply:
            file: 02-invalid-dual-tier-enginetype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-authstrategy
      try:
        - apply:
            file: 03-invalid-dual-tier-authstrategy.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-deploymentmode
      try:
        - apply:
            file: 04-invalid-dual-tier-deploymentmode.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-instancetype
      try:
        - apply:
            file: 05-invalid-dual-tier-instancetype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac6-reject-both-tiers-publicaccess
      try:
        - apply:
            file: 06-invalid-dual-tier-publicaccess.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac7-reject-both-tiers-autoupgrade
      try:
        - apply:
            file: 07-invalid-dual-tier-autoupgrade.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac8-reject-both-tiers-logsgeneral
      try:
        - apply:
            file: 08-invalid-dual-tier-logsgeneral.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac9-reject-both-tiers-logsaudit
      try:
        - apply:
            file: 09-invalid-dual-tier-logsaudit.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac10-reject-both-tiers-encryption
      try:
        - apply:
            file: 10-invalid-dual-tier-encryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac11-reject-both-tiers-storagetype
      try:
        - apply:
            file: 11-invalid-dual-tier-storagetype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac12-reject-both-tiers-naming
      try:
        - apply:
            file: 12-invalid-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MQConfig
                check:
                  ($error != null): true

    - name: ac13-effective-cascade-from-controller
      try:
        - apply:
            file: 00-mqconfig-namespace.yaml
        - script:
            content: |
              kubectl create namespace mq-prod --dry-run=client -o yaml | kubectl apply -f -
        - apply:
            file: 01-general-policy.yaml
        - apply:
            file: 13-local-general-policy.yaml
        - script:
            content: |
              kubectl patch mqconfig general-policy -n mq-prod \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"","publiclyAccessible":false,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: general-policy
                namespace: mq-prod
              status:
                effectiveConfig:
                  mandatory:
                    publiclyAccessible: false
                  defaults:
                    namingTemplate: "{namespace}-{name}"

    - name: ac14-naming-template-propagates
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch mqconfig general-policy -n mqconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: general-policy
                namespace: mqconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"

    - name: ac15-mandatory-security-bundle-accepted
      try:
        - apply:
            file: 15-production.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: production
                namespace: mqconfig
              spec:
                mandatory:
                  deploymentMode: "ACTIVE_STANDBY_MULTI_AZ"
                  publiclyAccessible: false
                  encryptionUseAWSOwnedKey: false

    - name: ac16-tags-merge
      try:
        - apply:
            file: 16-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch mqconfig general-policy-tags -n mqconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"","tags":{"broker-type":"messaging","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: general-policy-tags
                namespace: mqconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      broker-type: messaging
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform

    - name: ac17-synced-labels-propagate
      try:
        - apply:
            file: 17-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch mqconfig general-policy-synced-labels -n mqconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: general-policy-synced-labels
                namespace: mqconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: internal

    - name: ac18-mandatory-zero-value-accepted
      try:
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: general-policy
                namespace: mqconfig
              spec:
                mandatory:
                  engineType: ""
                  authenticationStrategy: ""
                  deploymentMode: ""
                  hostInstanceType: ""
                  storageType: ""
                  namingTemplate: ""

    - name: ac19-mixed-tier-valid-values-accepted
      try:
        - apply:
            file: 19-mixed-tier.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: mixed-tier
                namespace: mqconfig
              spec:
                mandatory:
                  engineType: "RABBITMQ"
                defaults:
                  deploymentMode: "SINGLE_INSTANCE"
