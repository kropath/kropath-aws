# aws-mq-02 Chainsaw tests — all 57 acceptance criteria.
# Namespace: mqbroker (fixed; {namespace}-{name} template expands predictably).
# accountId: 123456789012 | region: us-east-1
#
# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): unique resource name per step, skipDelete, no inter-step deletes.
# Each step uses its own MQConfig with effectiveConfig injected via kubectl patch
# to simulate the kropath-controller (not running in the local test cluster).
# No ACK controllers run — ACK Broker CRs persist with whatever kro writes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mqbroker
spec:
  skipDelete: true
  namespace: mqbroker
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Seed: namespace + general-policy MQConfig for "all tiers empty / builtin"
    # scenarios. String fields empty, boolean fields absent (has() returns false),
    # maps empty, defaults.namingTemplate = "{namespace}-{name}".
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-general-policy
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: mqbroker
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: general-policy
                namespace: mqbroker
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch mqconfig general-policy -n mqbroker \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: mandatory.engineType wins over instance spec
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-enginetype-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: cfg-ac1
                namespace: mqbroker
                labels:
                  aws.kropath.run/resource-name: cfg-ac1
              spec:
                mandatory:
                  engineType: "ACTIVEMQ"
        - script:
            content: |
              kubectl patch mqconfig cfg-ac1 -n mqbroker \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"engineType":"ACTIVEMQ","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQBroker
              metadata:
                name: broker-ac1
                namespace: mqbroker
              spec:
                configRef: cfg-ac1
                engineType: "RABBITMQ"
                engineVersion: "3.13"
        - assert:
            resource:
              apiVersion: mq.services.k8s.aws/v1alpha1
              kind: Broker
              metadata:
                name: broker-ac1
                namespace: mqbroker
              spec:
                engineType: ACTIVEMQ

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2: instance engineType wins over defaults
    # ──────────────────────────────────────────────────────────────────────────
