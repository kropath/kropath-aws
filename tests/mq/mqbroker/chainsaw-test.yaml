                name: broker-ac4
                namespace: mqbroker
              spec:
                engineType: ""

    # ──────────────────────────────────────────────────────────────────────────
    # AC-5: mandatory.authenticationStrategy wins over instance
    # ──────────────────────────────────────────────────────────────────────────
