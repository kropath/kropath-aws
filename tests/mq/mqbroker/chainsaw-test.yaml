                defaults:
                  engineType: "RABBITMQ"
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch mqconfig cfg-ac2 -n mqbroker \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"engineType":"","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"engineType":"RABBITMQ","authenticationStrategy":"","deploymentMode":"","hostInstanceType":"","storageType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
