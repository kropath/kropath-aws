      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MQConfig
              metadata:
                name: cfg-ac2
                namespace: mqbroker
                labels:
                  aws.kropath.run/resource-name: cfg-ac2
