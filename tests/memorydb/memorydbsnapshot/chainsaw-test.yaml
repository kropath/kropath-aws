# Canonical pattern: unique resource name per step, skipDelete: true.
# Note: spec.kmsKeyArn maps to ACK Snapshot.spec.kmsKeyID (field rename, not governed).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: memorydbsnapshot
spec:
  skipDelete: true
  namespace: memorydbsnapshot
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-MDB07-01: clusterName pass-through → ACK Snapshot spec.clusterName
    - name: ac1-cluster-name-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac1-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac1-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac1-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac1-cfg
                clusterName: my-source-cluster
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: Snapshot
              metadata:
                name: ac1-snap
                namespace: memorydbsnapshot
              spec:
                clusterName: my-source-cluster

    # AC-MDB07-02: sourceSnapshotName pass-through (copy-snapshot path)
    - name: ac2-source-snapshot-name-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac2-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac2-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac2-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac2-cfg
                sourceSnapshotName: original-backup-snap
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: Snapshot
              metadata:
                name: ac2-snap
                namespace: memorydbsnapshot
              spec:
                sourceSnapshotName: original-backup-snap

    # AC-MDB07-03: kmsKeyArn → ACK kmsKeyID field rename pass-through
    - name: ac3-kms-key-arn-field-rename
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac3-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac3-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac3-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac3-cfg
                clusterName: my-cluster
                kmsKeyArn: arn:aws:kms:us-east-1:123456789012:key/mrk-abc123
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: Snapshot
              metadata:
                name: ac3-snap
                namespace: memorydbsnapshot
              spec:
                kmsKeyID: arn:aws:kms:us-east-1:123456789012:key/mrk-abc123

    # AC-MDB07-04: Default naming {namespace}-{name}
    - name: ac4-default-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac4-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac4-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac4-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac4-cfg
                clusterName: my-cluster
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac4-snap
                namespace: memorydbsnapshot
              status:
                resourceName: memorydbsnapshot-ac4-snap
                namingStatus: valid
                predictedArn: arn:aws:memorydb:us-east-1:123456789012:snapshot/memorydbsnapshot-ac4-snap

    # AC-MDB07-05: mandatory.namingTemplate overrides defaults
    - name: ac5-mandatory-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac5-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac5-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"backup-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac5-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac5-cfg
                clusterName: my-cluster
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac5-snap
                namespace: memorydbsnapshot
              status:
                resourceName: backup-ac5-snap
                namingStatus: valid

    # AC-MDB07-06: spec.nameOverride takes precedence
    - name: ac6-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac6-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac6-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac6-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac6-cfg
                nameOverride: my-monthly-backup
                clusterName: my-cluster
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac6-snap
                namespace: memorydbsnapshot
              status:
                resourceName: my-monthly-backup
                namingStatus: valid
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: Snapshot
              metadata:
                name: ac6-snap
                namespace: memorydbsnapshot
              spec:
                name: my-monthly-backup

    # AC-MDB07-07: Unresolved {tag.X} token → no ACK Snapshot created
    - name: ac7-unresolved-token-blocks-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac7-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac7-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{tag.env}-snap","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac7-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac7-cfg
                clusterName: my-cluster
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac7-snap
                namespace: memorydbsnapshot
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              count=$(kubectl get snapshot ac7-snap -n memorydbsnapshot --ignore-not-found -o name 2>/dev/null | wc -l | tr -d ' ')
              [ "$count" -eq 0 ]

    # AC-MDB07-08: Tags merge cascade (mandatory > spec > defaults)
    - name: ac8-tags-merge-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac8-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac8-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{"team":"sre","env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac8-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac8-cfg
                clusterName: my-cluster
                tags:
                  backup-type: manual
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 15); do
                TAGS=$(kubectl get snapshot ac8-snap -n memorydbsnapshot -o json 2>/dev/null | jq -c '.spec.tags')
                if [ -n "$TAGS" ] && [ "$TAGS" != "null" ]; then
                  if echo "$TAGS" | jq -e '
                    (map(select(.key == "env")) | length == 1 and .[0].value == "prod") and
                    (map(select(.key == "team")) | length == 1 and .[0].value == "sre") and
                    (map(select(.key == "backup-type")) | length == 1 and .[0].value == "manual")
                  ' >/dev/null; then
                    echo "PASS"
                    exit 0
                  fi
                fi
                echo "Attempt $i: waiting..."
                sleep 2
              done
              echo "FAIL"
              exit 1

    # AC-MDB07-09: syncedLabels dual-write
    - name: ac9-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac9-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac9-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{"retention":"long"},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac9-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac9-cfg
                clusterName: my-cluster
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: Snapshot
              metadata:
                name: ac9-snap
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/retention: long
        - script:
            content: |
              kubectl get snapshot ac9-snap -n memorydbsnapshot -o json | jq -e '
                .spec.tags | map(select(.key == "retention")) | length == 1 and .[0].value == "long"
              '

    # AC-MDB07-10: syncedAnnotations → K8s metadata.annotations with aws.kropath.run/ prefix
    - name: ac10-synced-annotations
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac10-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac10-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"schedule":"daily"}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac10-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac10-cfg
                clusterName: my-cluster
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: Snapshot
              metadata:
                name: ac10-snap
                namespace: memorydbsnapshot
                annotations:
                  aws.kropath.run/schedule: daily

    # AC-MDB07-11: Standard metadata (managed-by, instance, deletion-policy, ownerRef)
    - name: ac11-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac11-cfg
                namespace: memorydbsnapshot
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac11-cfg -n memorydbsnapshot \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSnapshot
              metadata:
                name: ac11-snap
                namespace: memorydbsnapshot
              spec:
                configRef: ac11-cfg
                deletionPolicy: retain
                clusterName: my-cluster
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: Snapshot
              metadata:
                name: ac11-snap
                namespace: memorydbsnapshot
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac11-snap
                annotations:
                  services.k8s.aws/deletion-policy: retain
                (length(ownerReferences)): 1
