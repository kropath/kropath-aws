# aws-mdb-01 Chainsaw tests — 15 acceptance criteria for MemoryDBConfig CRD (KRO-429).
# Controller-simulating tests use kubectl patch --subresource=status to write effectiveConfig
# as kropath-controller (KRO-430) would, matching the pattern in tests/elasticache/elasticacheconfig/.
# Canonical pattern: unique resource name per step, spec.skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: memorydbconfig
spec:
  namespace: memorydbconfig
  steps:
    # AC-1: happy-path: config-create-general-policy
    # MemoryDBConfig/general-policy created in kro-system with secure defaults;
    # CR has label aws.kropath.run/resource-name: general-policy → accepted with no validation errors.
    - name: ac1-config-create-general-policy
      try:
        - apply:
            file: 00-memorydbconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: general-policy
                namespace: memorydbconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  tlsEnabled: false
                  snapshotRetentionLimit: 0
                  numReplicasPerShard: 0
                  autoMinorVersionUpgrade: false
                defaults:
                  tlsEnabled: true
                  numReplicasPerShard: 1
                  snapshotRetentionLimit: 7
                  autoMinorVersionUpgrade: true
                  namingTemplate: "{namespace}-{name}"
            timeout: 60s

    # AC-2: negative: config-dual-tier-tls
    # mandatory.tlsEnabled: true AND defaults.tlsEnabled: true → rejected by x-kubernetes-validations.
    - name: ac2-config-dual-tier-tls
      try:
        - apply:
            file: 02-dual-tier-tls.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MemoryDBConfig
                check:
                  ($error != null): true

    # AC-3: negative: config-dual-tier-nodetype
    # mandatory.nodeType AND defaults.nodeType both set → rejected by x-kubernetes-validations.
    - name: ac3-config-dual-tier-nodetype
      try:
        - apply:
            file: 03-dual-tier-nodetype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MemoryDBConfig
                check:
                  ($error != null): true

    # AC-4: negative: config-dual-tier-engineversion
    # mandatory.engineVersion AND defaults.engineVersion both set → rejected.
    - name: ac4-config-dual-tier-engineversion
      try:
        - apply:
            file: 04-dual-tier-engineversion.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MemoryDBConfig
                check:
                  ($error != null): true

    # AC-5: negative: config-dual-tier-kms
    # mandatory.kmsKeyArn AND defaults.kmsKeyArn both set → rejected.
    - name: ac5-config-dual-tier-kms
      try:
        - apply:
            file: 05-dual-tier-kms.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MemoryDBConfig
                check:
                  ($error != null): true

    # AC-6: negative: config-dual-tier-replicas
    # mandatory.numReplicasPerShard: 2 AND defaults.numReplicasPerShard: 1 → rejected.
    - name: ac6-config-dual-tier-replicas
      try:
        - apply:
            file: 06-dual-tier-replicas.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MemoryDBConfig
                check:
                  ($error != null): true

    # AC-7: negative: config-dual-tier-retention
    # mandatory.snapshotRetentionLimit: 14 AND defaults.snapshotRetentionLimit: 7 → rejected.
    - name: ac7-config-dual-tier-retention
      try:
        - apply:
            file: 07-dual-tier-retention.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MemoryDBConfig
                check:
                  ($error != null): true

    # AC-8: negative: config-dual-tier-autoupgrade
    # mandatory.autoMinorVersionUpgrade: true AND defaults.autoMinorVersionUpgrade: true → rejected.
    - name: ac8-config-dual-tier-autoupgrade
      try:
        - apply:
            file: 08-dual-tier-autoupgrade.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MemoryDBConfig
                check:
                  ($error != null): true

    # AC-9: negative: config-dual-tier-allowednodes
    # mandatory.allowedNodeTypes AND defaults.allowedNodeTypes both non-empty → rejected.
    - name: ac9-config-dual-tier-allowednodes
      try:
        - apply:
            file: 09-dual-tier-allowednodes.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: MemoryDBConfig
                check:
                  ($error != null): true

    # AC-10: happy-path: config-effective-cascade
    # KropathConfig with mandatory.memorydb.tlsEnabled: true; controller writes effectiveConfig
    # with mandatory.tlsEnabled: true on the MemoryDBConfig CR.
    - name: ac10-config-effective-cascade
      try:
        - apply:
            file: 13-kropathconfig-memorydb.yaml
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch memorydbconfig general-policy -n memorydbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":true,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":true,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":1,"snapshotRetentionLimit":7,"autoMinorVersionUpgrade":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: general-policy
                namespace: memorydbconfig
              status:
                effectiveConfig:
                  mandatory:
                    tlsEnabled: true
            timeout: 60s

    # AC-11: happy-path: config-naming-template
    # MemoryDBConfig/naming-policy with defaults.namingTemplate: "{namespace}-{name}";
    # effectiveConfig reflects the naming template.
    - name: ac11-config-naming-template
      try:
        - apply:
            file: 11-naming-template.yaml
        - script:
            content: |
              kubectl patch memorydbconfig naming-policy -n memorydbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: naming-policy
                namespace: memorydbconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
            timeout: 60s

    # AC-12: happy-path: config-mandatory-production
    # MemoryDBConfig/production with mandatory.tlsEnabled: true, mandatory.snapshotRetentionLimit: 14,
    # mandatory.numReplicasPerShard: 2, mandatory.kmsKeyArn set → CR accepted.
    - name: ac12-config-mandatory-production
      try:
        - apply:
            file: 10-production-mandatory.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: production
                namespace: memorydbconfig
              spec:
                mandatory:
                  tlsEnabled: true
                  kmsKeyArn: "arn:aws:kms:ap-southeast-2:123456789012:key/abc"
                  snapshotRetentionLimit: 14
                  numReplicasPerShard: 2
            timeout: 60s

    # AC-13: negative: config-nodetype-not-in-allowed
    # mandatory.nodeType: "db.r7g.large" with mandatory.allowedNodeTypes: ["db.t4g.small"] →
    # controller sets status.conditions[type=Valid].status = False with reason InvalidNodeTypeNotInAllowedList;
    # status.effectiveConfig is NOT written (simulated by patching the invalid condition).
    - name: ac13-config-nodetype-not-in-allowed
      try:
        - apply:
            file: 15-nodetype-not-in-allowed.yaml
        - script:
            content: |
              kubectl patch memorydbconfig invalid-nodetype-allowed -n memorydbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"False","reason":"InvalidNodeTypeNotInAllowedList","message":"nodeType db.r7g.large is not in allowedNodeTypes [db.t4g.small]"}]}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: invalid-nodetype-allowed
                namespace: memorydbconfig
              status:
                conditions:
                  - type: Valid
                    status: "False"
                    reason: InvalidNodeTypeNotInAllowedList
            timeout: 60s

    # AC-14: happy-path: config-tag-merge
    # MemoryDBConfig/tag-merge-policy with mandatory.tags: {service: memorydb} and
    # defaults.tags: {team: platform}; KropathConfig with mandatory.tags: {cost-centre: infra} →
    # effectiveConfig.mandatory.tags contains both service and cost-centre keys.
    - name: ac14-config-tag-merge
      try:
        - apply:
            file: 12-tag-merge-config.yaml
        - script:
            content: |
              kubectl patch memorydbconfig tag-merge-policy -n memorydbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{"service":"memorydb","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - script:
            content: |
              TAGS=$(kubectl get memorydbconfig tag-merge-policy -n memorydbconfig \
                -o jsonpath='{.status.effectiveConfig.mandatory.tags}')
              echo "$TAGS" | grep -q '"service":"memorydb"' || (echo "missing service:memorydb tag"; exit 1)
              echo "$TAGS" | grep -q '"cost-centre":"infra"' || (echo "missing cost-centre:infra tag"; exit 1)
              DEFAULTS_TAGS=$(kubectl get memorydbconfig tag-merge-policy -n memorydbconfig \
                -o jsonpath='{.status.effectiveConfig.defaults.tags}')
              echo "$DEFAULTS_TAGS" | grep -q '"team":"platform"' || (echo "missing team:platform defaults tag"; exit 1)
              echo "Tag merge verified"
            check:
              ($stdout != ""): true

    # AC-15: happy-path: config-synced-labels
    # MemoryDBConfig/synced-labels-policy with mandatory.syncedLabels: {data-class: confidential} →
    # effectiveConfig.mandatory.syncedLabels contains data-class: confidential.
    - name: ac15-config-synced-labels
      try:
        - apply:
            file: 14-synced-labels-config.yaml
        - script:
            content: |
              kubectl patch memorydbconfig synced-labels-policy -n memorydbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"confidential"},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: synced-labels-policy
                namespace: memorydbconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: confidential
            timeout: 60s
