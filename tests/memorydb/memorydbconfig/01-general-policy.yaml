---
apiVersion: aws.kropath.run/v1alpha1
kind: MemoryDBConfig
metadata:
  name: general-policy
  namespace: memorydbconfig
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    tlsEnabled: false
    kmsKeyArn: ""
    nodeType: ""
    engineVersion: ""
    allowedNodeTypes: []
    numReplicasPerShard: 0
    snapshotRetentionLimit: 0
    autoMinorVersionUpgrade: false
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    tlsEnabled: true
    kmsKeyArn: ""
    nodeType: ""
    engineVersion: ""
    allowedNodeTypes: []
    numReplicasPerShard: 1
    snapshotRetentionLimit: 7
    autoMinorVersionUpgrade: true
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
