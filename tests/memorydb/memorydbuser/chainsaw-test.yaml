# Canonical pattern: unique resource name per step, skipDelete: true.
# Note: ACK User.spec.authenticationMode.type_ uses a trailing underscore (Python SDK convention).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: memorydbuser
spec:
  skipDelete: true
  namespace: memorydbuser
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-MDB04-01: authenticationMode.type_ pass-through (trailing underscore in ACK CRD)
    - name: ac1-authentication-mode-type-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac1-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac1-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac1-user
                namespace: memorydbuser
              spec:
                configRef: ac1-cfg
                authenticationMode:
                  type: iam
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac1-user
                namespace: memorydbuser
              spec:
                authenticationMode:
                  type_: iam

    # AC-MDB04-02: authenticationMode.passwords array pass-through
    - name: ac2-authentication-passwords-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac2-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac2-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ac2-password-secret
                namespace: memorydbuser
              stringData:
                password: supersecretpassword
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac2-user
                namespace: memorydbuser
              spec:
                configRef: ac2-cfg
                authenticationMode:
                  type: password
                  passwords:
                    - name: ac2-password-secret
                      key: password
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac2-user
                namespace: memorydbuser
              spec:
                (length(authenticationMode.passwords)): 1

    # AC-MDB04-03: Default naming {namespace}-{name}
    - name: ac3-default-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac3-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac3-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac3-user
                namespace: memorydbuser
              spec:
                configRef: ac3-cfg
                authenticationMode:
                  type: iam
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac3-user
                namespace: memorydbuser
              status:
                resourceName: memorydbuser-ac3-user
                namingStatus: valid
                predictedArn: arn:aws:memorydb:us-east-1:123456789012:user/memorydbuser-ac3-user

    # AC-MDB04-04: mandatory.namingTemplate overrides defaults
    - name: ac4-mandatory-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac4-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac4-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"usr-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac4-user
                namespace: memorydbuser
              spec:
                configRef: ac4-cfg
                authenticationMode:
                  type: iam
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac4-user
                namespace: memorydbuser
              status:
                resourceName: usr-ac4-user
                namingStatus: valid

    # AC-MDB04-05: spec.nameOverride takes precedence
    - name: ac5-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac5-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac5-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac5-user
                namespace: memorydbuser
              spec:
                configRef: ac5-cfg
                nameOverride: admin-user
                authenticationMode:
                  type: iam
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac5-user
                namespace: memorydbuser
              status:
                resourceName: admin-user
                namingStatus: valid
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac5-user
                namespace: memorydbuser
              spec:
                name: admin-user

    # AC-MDB04-06: Unresolved {tag.X} token → no ACK User created
    - name: ac6-unresolved-token-blocks-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac6-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac6-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{tag.env}-user","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac6-user
                namespace: memorydbuser
              spec:
                configRef: ac6-cfg
                authenticationMode:
                  type: iam
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac6-user
                namespace: memorydbuser
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              count=$(kubectl get user ac6-user -n memorydbuser --ignore-not-found -o name 2>/dev/null | wc -l | tr -d ' ')
              [ "$count" -eq 0 ]

    # AC-MDB04-07: Tags merge cascade (mandatory > spec > defaults)
    - name: ac7-tags-merge-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac7-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac7-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{"team":"auth","env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac7-user
                namespace: memorydbuser
              spec:
                configRef: ac7-cfg
                authenticationMode:
                  type: iam
                tags:
                  service: auth-service
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 15); do
                TAGS=$(kubectl get user ac7-user -n memorydbuser -o json 2>/dev/null | jq -c '.spec.tags')
                if [ -n "$TAGS" ] && [ "$TAGS" != "null" ]; then
                  if echo "$TAGS" | jq -e '
                    (map(select(.key == "env")) | length == 1 and .[0].value == "prod") and
                    (map(select(.key == "team")) | length == 1 and .[0].value == "auth") and
                    (map(select(.key == "service")) | length == 1 and .[0].value == "auth-service")
                  ' >/dev/null; then
                    echo "PASS"
                    exit 0
                  fi
                fi
                echo "Attempt $i: waiting..."
                sleep 2
              done
              echo "FAIL"
              exit 1

    # AC-MDB04-08: syncedLabels dual-write
    - name: ac8-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac8-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac8-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{"role":"admin"},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac8-user
                namespace: memorydbuser
              spec:
                configRef: ac8-cfg
                authenticationMode:
                  type: iam
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac8-user
                namespace: memorydbuser
                labels:
                  aws.kropath.run/role: admin
        - script:
            content: |
              kubectl get user ac8-user -n memorydbuser -o json | jq -e '
                .spec.tags | map(select(.key == "role")) | length == 1 and .[0].value == "admin"
              '

    # AC-MDB04-09: syncedAnnotations → K8s metadata.annotations with aws.kropath.run/ prefix
    - name: ac9-synced-annotations
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac9-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac9-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"owner":"security-team"}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac9-user
                namespace: memorydbuser
              spec:
                configRef: ac9-cfg
                authenticationMode:
                  type: iam
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac9-user
                namespace: memorydbuser
                annotations:
                  aws.kropath.run/owner: security-team

    # AC-MDB04-10: Standard metadata (managed-by, instance, deletion-policy, ownerRef)
    - name: ac10-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac10-cfg
                namespace: memorydbuser
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac10-cfg -n memorydbuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBUser
              metadata:
                name: ac10-user
                namespace: memorydbuser
              spec:
                configRef: ac10-cfg
                deletionPolicy: retain
                authenticationMode:
                  type: iam
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac10-user
                namespace: memorydbuser
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac10-user
                annotations:
                  services.k8s.aws/deletion-policy: retain
                (length(ownerReferences)): 1
