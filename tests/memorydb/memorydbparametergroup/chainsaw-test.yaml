# Canonical pattern: unique resource name per step, skipDelete: true.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: memorydbparametergroup
spec:
  skipDelete: true
  namespace: memorydbparametergroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-MDB06-01: family pass-through → ACK ParameterGroup spec.family
    - name: ac1-family-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac1-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac1-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac1-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac1-cfg
                family: memorydb_redis7
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: ParameterGroup
              metadata:
                name: ac1-pg
                namespace: memorydbparametergroup
              spec:
                family: memorydb_redis7

    # AC-MDB06-02: description pass-through
    - name: ac2-description-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac2-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac2-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac2-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac2-cfg
                family: memorydb_redis7
                description: "Custom Redis 7 parameter group"
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: ParameterGroup
              metadata:
                name: ac2-pg
                namespace: memorydbparametergroup
              spec:
                description: "Custom Redis 7 parameter group"

    # AC-MDB06-03: parameterNameValues array pass-through
    - name: ac3-parameter-name-values-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac3-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac3-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac3-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac3-cfg
                family: memorydb_redis7
                parameterNameValues:
                  - parameterName: activerehashing
                    parameterValue: "yes"
                  - parameterName: maxmemory-policy
                    parameterValue: allkeys-lru
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: ParameterGroup
              metadata:
                name: ac3-pg
                namespace: memorydbparametergroup
              spec:
                (length(parameterNameValues)): 2

    # AC-MDB06-04: Default naming {namespace}-{name}
    - name: ac4-default-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac4-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac4-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac4-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac4-cfg
                family: memorydb_redis7
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac4-pg
                namespace: memorydbparametergroup
              status:
                resourceName: memorydbparametergroup-ac4-pg
                namingStatus: valid
                predictedArn: arn:aws:memorydb:us-east-1:123456789012:parametergroup/memorydbparametergroup-ac4-pg

    # AC-MDB06-05: mandatory.namingTemplate overrides defaults
    - name: ac5-mandatory-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac5-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac5-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"prod-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac5-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac5-cfg
                family: memorydb_redis7
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac5-pg
                namespace: memorydbparametergroup
              status:
                resourceName: prod-ac5-pg
                namingStatus: valid

    # AC-MDB06-06: spec.nameOverride takes precedence
    - name: ac6-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac6-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac6-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac6-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac6-cfg
                nameOverride: my-custom-param-group
                family: memorydb_redis7
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac6-pg
                namespace: memorydbparametergroup
              status:
                resourceName: my-custom-param-group
                namingStatus: valid

    # AC-MDB06-07: Unresolved {tag.X} token → no ACK ParameterGroup created
    - name: ac7-unresolved-token-blocks-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac7-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac7-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{tag.env}-pg","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac7-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac7-cfg
                family: memorydb_redis7
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac7-pg
                namespace: memorydbparametergroup
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              count=$(kubectl get parametergroup ac7-pg -n memorydbparametergroup --ignore-not-found -o name 2>/dev/null | wc -l | tr -d ' ')
              [ "$count" -eq 0 ]

    # AC-MDB06-08: Tags merge cascade (mandatory > spec > defaults)
    - name: ac8-tags-merge-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac8-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac8-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{"team":"platform","env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac8-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac8-cfg
                family: memorydb_redis7
                tags:
                  service: orders
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 15); do
                TAGS=$(kubectl get parametergroup ac8-pg -n memorydbparametergroup -o json 2>/dev/null | jq -c '.spec.tags')
                if [ -n "$TAGS" ] && [ "$TAGS" != "null" ]; then
                  if echo "$TAGS" | jq -e '
                    (map(select(.key == "env")) | length == 1 and .[0].value == "prod") and
                    (map(select(.key == "team")) | length == 1 and .[0].value == "platform") and
                    (map(select(.key == "service")) | length == 1 and .[0].value == "orders")
                  ' >/dev/null; then
                    echo "PASS: all 3 cascade tags present"
                    exit 0
                  fi
                fi
                echo "Attempt $i: waiting..."
                sleep 2
              done
              echo "FAIL"
              exit 1

    # AC-MDB06-09: syncedLabels dual write (K8s metadata.labels + cloud tags)
    - name: ac9-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac9-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac9-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac9-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac9-cfg
                family: memorydb_redis7
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: ParameterGroup
              metadata:
                name: ac9-pg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/data-class: internal
        - script:
            content: |
              kubectl get parametergroup ac9-pg -n memorydbparametergroup -o json | jq -e '
                .spec.tags | map(select(.key == "data-class")) | length == 1 and .[0].value == "internal"
              '

    # AC-MDB06-10: Standard metadata (managed-by, instance, deletion-policy, ownerRef)
    - name: ac10-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac10-cfg
                namespace: memorydbparametergroup
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac10-cfg -n memorydbparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBParameterGroup
              metadata:
                name: ac10-pg
                namespace: memorydbparametergroup
              spec:
                configRef: ac10-cfg
                deletionPolicy: delete
                family: memorydb_redis7
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: ParameterGroup
              metadata:
                name: ac10-pg
                namespace: memorydbparametergroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac10-pg
                annotations:
                  services.k8s.aws/deletion-policy: delete
                (length(ownerReferences)): 1
