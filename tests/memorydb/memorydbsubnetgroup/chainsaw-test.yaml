# Canonical pattern: unique resource name per step, skipDelete: true.
# Test cluster has kro but no ACK controllers — ACK finalizers never removed.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: memorydbsubnetgroup
spec:
  skipDelete: true
  namespace: memorydbsubnetgroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-MDB05-01: subnetIDs pass-through → ACK SubnetGroup spec.subnetIDs
    - name: ac1-subnet-ids-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac1-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac1-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac1-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac1-cfg
                subnetIDs:
                  - subnet-aaa00001
                  - subnet-aaa00002
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: SubnetGroup
              metadata:
                name: ac1-sg
                namespace: memorydbsubnetgroup
              spec:
                (length(subnetIDs)): 2

    # AC-MDB05-02: description pass-through → ACK SubnetGroup spec.description
    - name: ac2-description-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac2-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac2-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac2-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac2-cfg
                description: "Test subnet group for memorydb"
                subnetIDs:
                  - subnet-bbb00001
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: SubnetGroup
              metadata:
                name: ac2-sg
                namespace: memorydbsubnetgroup
              spec:
                description: "Test subnet group for memorydb"

    # AC-MDB05-03: Default naming {namespace}-{name} → resourceName, predictedArn
    - name: ac3-default-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac3-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac3-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac3-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac3-cfg
                subnetIDs:
                  - subnet-ccc00001
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac3-sg
                namespace: memorydbsubnetgroup
              status:
                resourceName: memorydbsubnetgroup-ac3-sg
                namingStatus: valid
                predictedArn: arn:aws:memorydb:us-east-1:123456789012:subnetgroup/memorydbsubnetgroup-ac3-sg
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: SubnetGroup
              metadata:
                name: ac3-sg
                namespace: memorydbsubnetgroup
              spec:
                name: memorydbsubnetgroup-ac3-sg

    # AC-MDB05-04: mandatory.namingTemplate overrides defaults.namingTemplate
    - name: ac4-mandatory-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac4-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac4-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"prod-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac4-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac4-cfg
                subnetIDs:
                  - subnet-ddd00001
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac4-sg
                namespace: memorydbsubnetgroup
              status:
                resourceName: prod-ac4-sg
                namingStatus: valid

    # AC-MDB05-05: spec.nameOverride takes precedence over namingTemplate
    - name: ac5-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac5-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac5-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"prod-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac5-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac5-cfg
                nameOverride: my-custom-subnet-group
                subnetIDs:
                  - subnet-eee00001
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac5-sg
                namespace: memorydbsubnetgroup
              status:
                resourceName: my-custom-subnet-group
                namingStatus: valid
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: SubnetGroup
              metadata:
                name: ac5-sg
                namespace: memorydbsubnetgroup
              spec:
                name: my-custom-subnet-group

    # AC-MDB05-06: Unresolved {tag.X} token → no ACK SubnetGroup created, namingStatus=invalid-unresolved-tokens
    - name: ac6-unresolved-token-blocks-creation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac6-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac6-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{tag.env}-subnet","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac6-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac6-cfg
                subnetIDs:
                  - subnet-fff00001
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac6-sg
                namespace: memorydbsubnetgroup
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              for i in $(seq 1 15); do
                count=$(kubectl get subnetgroups.memorydb.services.k8s.aws ac6-sg -n memorydbsubnetgroup --ignore-not-found -o name 2>/dev/null | wc -l | tr -d ' ')
                [ "$count" -eq 0 ] && break
                sleep 2
              done
              [ "$count" -eq 0 ] || { echo "FAIL: ac6-sg ACK SubnetGroup still exists after 30s"; exit 1; }

    # AC-MDB05-07: Tags merge order: mandatory wins over spec wins over defaults
    - name: ac7-tags-merge-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac7-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac7-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{"env":"prod","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{"team":"platform","env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac7-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac7-cfg
                tags:
                  service: orders
                subnetIDs:
                  - subnet-ggg00001
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 15); do
                TAGS=$(kubectl get subnetgroups.memorydb.services.k8s.aws ac7-sg -n memorydbsubnetgroup -o json 2>/dev/null | jq -c '.spec.tags')
                if [ -n "$TAGS" ] && [ "$TAGS" != "null" ]; then
                  if echo "$TAGS" | jq -e '
                    (map(select(.key == "env")) | length == 1 and .[0].value == "prod") and
                    (map(select(.key == "cost-centre")) | length == 1 and .[0].value == "infra") and
                    (map(select(.key == "team")) | length == 1 and .[0].value == "platform") and
                    (map(select(.key == "service")) | length == 1 and .[0].value == "orders")
                  ' >/dev/null; then
                    echo "PASS: all 4 cascade tags present with correct values"
                    exit 0
                  fi
                fi
                echo "Attempt $i: SubnetGroup not found or tags not yet merged, waiting..."
                sleep 2
              done
              echo "FAIL: cascade tags not merged after 30 seconds"
              kubectl get subnetgroups.memorydb.services.k8s.aws ac7-sg -n memorydbsubnetgroup -o yaml
              exit 1

    # AC-MDB05-08: syncedLabels written to K8s labels (aws.kropath.run/ prefix) AND cloud tags (plain key)
    - name: ac8-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac8-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac8-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"restricted"},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac8-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac8-cfg
                subnetIDs:
                  - subnet-hhh00001
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: SubnetGroup
              metadata:
                name: ac8-sg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/data-class: restricted
        - script:
            content: |
              kubectl get subnetgroups.memorydb.services.k8s.aws ac8-sg -n memorydbsubnetgroup -o json | jq -e '
                .spec.tags | map(select(.key == "data-class")) | length == 1 and .[0].value == "restricted"
              '

    # AC-MDB05-09: syncedAnnotations written to ACK SubnetGroup K8s annotations with aws.kropath.run/ prefix
    - name: ac9-synced-annotations
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac9-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac9-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"runbook":"https://wiki.example.com/memorydb-sg"}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac9-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac9-cfg
                subnetIDs:
                  - subnet-iii00001
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: SubnetGroup
              metadata:
                name: ac9-sg
                namespace: memorydbsubnetgroup
                annotations:
                  aws.kropath.run/runbook: https://wiki.example.com/memorydb-sg

    # AC-MDB05-10: Standard metadata wiring (managed-by, instance, deletion-policy, ownerRef)
    - name: ac10-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac10-cfg
                namespace: memorydbsubnetgroup
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac10-cfg -n memorydbsubnetgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBSubnetGroup
              metadata:
                name: ac10-sg
                namespace: memorydbsubnetgroup
              spec:
                configRef: ac10-cfg
                deletionPolicy: retain
                subnetIDs:
                  - subnet-jjj00001
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: SubnetGroup
              metadata:
                name: ac10-sg
                namespace: memorydbsubnetgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac10-sg
                annotations:
                  services.k8s.aws/deletion-policy: retain
                (length(ownerReferences)): 1
