#
# Canonical pattern: unique resource name per step, skipDelete: true.
#
# Notes:
# - effectiveName is lowercased (.lowerAscii()) — MemoryDB cluster names are stored lowercase.
# - defaults.nodeType must be non-empty ("db.r6g.large") in all tests since ACK requires nodeType.
# - tlsEnabled and autoMinorVersionUpgrade use OR cascade (any tier enabling it wins).
# - kmsKeyArn, nodeType, engineVersion use string cascade: mandatory > instance > defaults.
# - numReplicasPerShard, snapshotRetentionLimit use integer minimum-floor cascade.
# - snsTopicArn → ACK snsTopicARN (capital ARN suffix).
# - snapshotARNs → ACK snapshotARNs (same spelling, capital ARNs).
# - securityGroupIDs → ACK securityGroupIDs (capital IDs).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: memorydbcluster
spec:
  skipDelete: true
  namespace: memorydbcluster
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-MDB02-01: tlsEnabled OR cascade — mandatory=true wins
    - name: ac1-tls-enabled-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac1-cfg
                namespace: memorydbcluster
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch memorydbconfig ac1-cfg -n memorydbcluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tlsEnabled":true,"kmsKeyArn":"","nodeType":"","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"tlsEnabled":false,"kmsKeyArn":"","nodeType":"db.r6g.large","engineVersion":"","allowedNodeTypes":[],"numReplicasPerShard":0,"snapshotRetentionLimit":0,"autoMinorVersionUpgrade":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBCluster
              metadata:
                name: ac1-cluster
                namespace: memorydbcluster
              spec:
                configRef: ac1-cfg
                tlsEnabled: false
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: Cluster
              metadata:
                name: ac1-cluster
                namespace: memorydbcluster
              spec:
                tlsEnabled: true

    # AC-MDB02-02: tlsEnabled OR cascade — instance=true propagates when mandatory=false
    - name: ac2-tls-enabled-instance-propagates
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: MemoryDBConfig
              metadata:
                name: ac2-cfg
                namespace: memorydbcluster
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
