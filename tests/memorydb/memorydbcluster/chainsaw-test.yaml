              metadata:
                name: ac2-cluster
                namespace: memorydbcluster
              spec:
                configRef: ac2-cfg
                tlsEnabled: true
        - assert:
            resource:
              apiVersion: memorydb.services.k8s.aws/v1alpha1
              kind: Cluster
