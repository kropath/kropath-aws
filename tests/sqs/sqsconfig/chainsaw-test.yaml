# aws-sqs-01 Chainsaw tests — all 11 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sqsconfig
spec:
  namespace: sqsconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-sqsconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSConfig
              metadata:
                name: general-policy
                namespace: sqsconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  encryptionType: sqs-managed
                  visibilityTimeout: 30
                  messageRetentionPeriod: 345600
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-both-tiers-encryption
      try:
        - apply:
            file: 02-invalid-dual-tier-encryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SQSConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-visibility
      try:
        - apply:
            file: 03-invalid-dual-tier-visibility.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SQSConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-retention
      try:
        - apply:
            file: 04-invalid-dual-tier-retention.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SQSConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-delay
      try:
        - apply:
            file: 05-invalid-dual-tier-delay.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SQSConfig
                check:
                  ($error != null): true

    - name: ac6-reject-both-tiers-msgsize
      try:
        - apply:
            file: 06-invalid-dual-tier-msgsize.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SQSConfig
                check:
                  ($error != null): true

    - name: ac7-kropathconfig-wins-in-effectiveconfig
      try:
        - apply:
            file: 00-sqsconfig-namespace.yaml
        - apply:
            file: 07-local-general-policy.yaml
        - script:
            content: |
              kubectl patch sqsconfig general-policy -n sqsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"kms","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSConfig
              metadata:
                name: general-policy
                namespace: sqsconfig
              status:
                effectiveConfig:
                  mandatory:
                    encryptionType: kms
                  defaults:
                    encryptionType: sqs-managed
                    visibilityTimeout: 30
                    messageRetentionPeriod: 345600
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 07-local-general-policy.yaml
        - delete:
            file: 00-sqsconfig-namespace.yaml

    - name: ac8-naming-template-propagates
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch sqsconfig general-policy -n sqsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSConfig
              metadata:
                name: general-policy
                namespace: sqsconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac9-mandatory-kms-accepted
      try:
        - apply:
            file: 09-mandatory-kms.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSConfig
              metadata:
                name: pci
                namespace: sqsconfig
              spec:
                mandatory:
                  encryptionType: kms
                  kmsMasterKeyId: "arn:aws:kms:ap-southeast-2:123:key/abc"
      cleanup:
        - delete:
            file: 09-mandatory-kms.yaml

    - name: ac10-tags-merge-and-kropathconfig-wins
      try:
        - apply:
            file: 10-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch sqsconfig general-policy -n sqsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{"queue-type":"messaging","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSConfig
              metadata:
                name: general-policy
                namespace: sqsconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      queue-type: messaging
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform
      cleanup:
        - delete:
            file: 10-tags-general-policy.yaml

    - name: ac11-synced-labels-propagate-through-effectiveconfig
      try:
        - apply:
            file: 11-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch sqsconfig general-policy -n sqsconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSConfig
              metadata:
                name: general-policy
                namespace: sqsconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: internal
      cleanup:
        - delete:
            file: 11-synced-labels-general-policy.yaml
