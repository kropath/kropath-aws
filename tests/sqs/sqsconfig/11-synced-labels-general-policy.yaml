---
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: general-policy
  namespace: sqsconfig
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    encryptionType: ""
    kmsMasterKeyId: ""
    visibilityTimeout: 0
    messageRetentionPeriod: 0
    delaySeconds: 0
    maximumMessageSize: 0
    namingTemplate: ""
    tags: {}
    syncedLabels:
      data-class: internal
    syncedAnnotations: {}
  defaults:
    encryptionType: "sqs-managed"
    kmsMasterKeyId: ""
    visibilityTimeout: 30
    messageRetentionPeriod: 345600
    delaySeconds: 0
    maximumMessageSize: 262144
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
