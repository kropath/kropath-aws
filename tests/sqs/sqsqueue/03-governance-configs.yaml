# Pre-seeded SQSConfig governance fixtures — applied once in the seed step so
# kro has stable configs throughout all AC test steps. All effectiveConfig
# statuses are patched via the seed-configs script.
---
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: kms-mandatory
  namespace: sqsqueue
  labels:
    aws.kropath.run/resource-name: kms-mandatory
spec:
  mandatory:
    encryptionType: kms
    kmsMasterKeyId: ""
    visibilityTimeout: 0
    messageRetentionPeriod: 0
    delaySeconds: 0
    maximumMessageSize: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    encryptionType: ""
    kmsMasterKeyId: ""
    visibilityTimeout: 30
    messageRetentionPeriod: 345600
    delaySeconds: 0
    maximumMessageSize: 262144
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
