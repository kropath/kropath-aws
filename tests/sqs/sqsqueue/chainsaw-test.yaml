    # ──────────────────────────────────────────────────────────────────────────
    # KRO-899: mandatory tier with only visibilityTimeout set; controller has
    # pruned all other zero-value keys (delaySeconds, encryptionType, etc.) from
    # effectiveConfig.mandatory. Verifies that the unguarded access bug is fixed:
    # mandatory.?delaySeconds.orValue(0), mandatory.?encryptionType.orValue(""),
    # etc. must not throw "no such key" when the key is absent.
    # ──────────────────────────────────────────────────────────────────────────
    - name: kro899-zero-value-pruned-mandatory-fields
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: kro899-pruned-queue
              spec:
                configRef: pruned-mandatory
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: kro899-pruned-queue
              spec:
                # visibilityTimeout=120 from mandatory (non-zero, present in pruned map)
                visibilityTimeout: "120"
                # delaySeconds falls through to 0 (mandatory key absent → orValue(0) → 0 = not > 0 → fallback to 0)
                delaySeconds: "0"
                # encryptionType absent in mandatory → falls to defaults "sqs-managed"
                sqsManagedSSEEnabled: "true"
                # messageRetentionPeriod absent in mandatory → falls to defaults 345600
                messageRetentionPeriod: "345600"
                # maximumMessageSize absent in mandatory → falls to defaults 262144
                maximumMessageSize: "262144"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: kro899-pruned-queue
              status:
                resourceName: sqsqueue-kro899-pruned-queue
                namingStatus: valid

