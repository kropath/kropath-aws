# aws-sqs-02 Chainsaw tests — one scenario per acceptance criterion (32 ACs).
# Namespace: sqsqueue (fixed; {namespace}-{name} template expands predictably).
# accountId: 123456789012 | region: ap-southeast-2
# effectiveConfig is injected via kubectl patch --subresource=status to simulate
# kropath-controller (which is not running in the local test cluster).
# Per-step cleanup is intentionally omitted — each step uses a unique resource
# name, and Chainsaw deletes the managed namespace at test end.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sqsqueue
spec:
  # Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
  # skipDelete"): unique queue name per step, delete nothing between steps; skipDelete stops
  # chainsaw's end-of-test cascade delete. No ACK controllers run, so deleting a kro SQSQueue
  # (→ ACK Queue child) would hang on the never-cleared finalizer.
  skipDelete: true
  namespace: sqsqueue
  steps:
    # ──────────────────────────────────────────────────────────────────────────
    # Seed: namespace + general-policy SQSConfig with effectiveConfig patched.
    # Persists for the duration of the test (namespace-level cleanup at end).
    # ──────────────────────────────────────────────────────────────────────────
    - name: seed-general-policy
      try:
        - apply:
            file: 00-sqsqueue-namespace.yaml
        - apply:
            file: 01-general-policy-config.yaml
        - script:
            content: |
              kubectl apply -f 03-governance-configs.yaml
        - script:
            content: |
              kubectl patch sqsconfig general-policy -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch sqsconfig kms-mandatory -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"kms","kmsMasterKeyId":"arn:aws:kms:ap-southeast-2:123:key/abc","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch sqsconfig vis-mandatory -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":120,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch sqsconfig retention-mandatory -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":604800,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch sqsconfig msgsize-mandatory -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":131072,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch sqsconfig naming-mandatory -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch sqsconfig unresolved-template -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch sqsconfig tags-policy -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{"cost-centre":"platform","queue-type":"messaging"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch sqsconfig synced-labels-policy -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              kubectl patch sqsconfig synced-anno-policy -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{"team":"events"}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
              # KRO-899: pruned-mandatory simulates the controller pruning zero-value keys.
              # mandatory has ONLY visibilityTimeout=120; all other mandatory keys (delaySeconds,
              # encryptionType, kmsMasterKeyId, etc.) are absent — controller omits zero-value fields.
              kubectl patch sqsconfig pruned-mandatory -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"visibilityTimeout":120},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-1: defaults.encryptionType = "sqs-managed" applied when instance is empty.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac1-encryption-default-sqs-managed
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: enc-default
              spec: {}
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: enc-default
              spec:
                sqsManagedSSEEnabled: "true"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: enc-default
              status:
                resourceName: sqsqueue-enc-default
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-2: mandatory.encryptionType = "kms" wins over instance sqs-managed.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac2-encryption-mandatory-kms-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: enc-mandatory-kms
              spec:
                configRef: kms-mandatory
                encryptionType: sqs-managed
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: enc-mandatory-kms
              spec:
                kmsMasterKeyID: "arn:aws:kms:ap-southeast-2:123:key/abc"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-3: instance encryptionType = "kms" wins over defaults.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac3-encryption-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: enc-instance-kms
              spec:
                encryptionType: kms
                kmsMasterKeyId: "arn:aws:kms:ap-southeast-2:123456789012:key/test"
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: enc-instance-kms
              spec:
                kmsMasterKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/test"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-4: instance encryptionType = "none" wins over defaults sqs-managed.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac4-encryption-none
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: enc-none
              spec:
                encryptionType: none
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: enc-none
              spec:
                sqsManagedSSEEnabled: "false"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-5: mandatory.visibilityTimeout = 120 clamps instance 600.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac5-visibility-mandatory-clamp
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: vis-clamp
              spec:
                configRef: vis-mandatory
                visibilityTimeout: 600
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: vis-clamp
              spec:
                visibilityTimeout: "120"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-6: defaults.visibilityTimeout = 30 applied when instance is 0 (not set).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac6-visibility-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: vis-default
              spec:
                visibilityTimeout: 0
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: vis-default
              spec:
                visibilityTimeout: "30"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-7: mandatory.messageRetentionPeriod = 604800 clamps instance 1209600.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac7-retention-mandatory-clamp
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: retention-clamp
              spec:
                configRef: retention-mandatory
                messageRetentionPeriod: 1209600
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: retention-clamp
              spec:
                messageRetentionPeriod: "604800"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-8: instance delaySeconds = 300 wins over defaults 0.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac8-delay-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: delay-override
              spec:
                delaySeconds: 300
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: delay-override
              spec:
                delaySeconds: "300"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-9: mandatory.maximumMessageSize = 131072 (128 KB) clamps instance 262144.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac9-msgsize-mandatory-clamp
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: msgsize-clamp
              spec:
                configRef: msgsize-mandatory
                maximumMessageSize: 262144
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: msgsize-clamp
              spec:
                maximumMessageSize: "131072"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-10: receiveMessageWaitTimeSeconds = 20 (long polling).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac10-long-polling
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: long-poll
              spec:
                receiveMessageWaitTimeSeconds: 20
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: long-poll
              spec:
                receiveMessageWaitTimeSeconds: "20"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-11: FIFO queue creation with contentBasedDeduplication.
    # resourceName = sqsqueue-fifo-create.fifo (default template + .fifo suffix)
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac11-fifo-queue-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: fifo-create
              spec:
                fifo: true
                contentBasedDeduplication: true
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: fifo-create
              spec:
                fifoQueue: "true"
                contentBasedDeduplication: "true"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: fifo-create
              status:
                resourceName: sqsqueue-fifo-create.fifo
                namingStatus: valid

    # ──────────────────────────────────────────────────────────────────────────
    # AC-12: FIFO high-throughput mode.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac12-fifo-high-throughput
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: fifo-htp
              spec:
                fifo: true
                fifoThroughputLimit: perMessageGroupId
                deduplicationScope: messageGroup
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: fifo-htp
              spec:
                fifoQueue: "true"
                fifoThroughputLimit: perMessageGroupId
                deduplicationScope: messageGroup

    # ──────────────────────────────────────────────────────────────────────────
    # AC-13: Standard queue (fifo: false default) — no .fifo suffix; all FIFO attributes absent.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac13-standard-queue-no-fifo
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: std-queue
              spec: {}
        # Wait for the ACK Queue to be created by kro before inspecting its spec.
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: std-queue
        # KRO-906, KRO-912: standard queues must not include any FIFO-specific attributes —
        # AWS rejects fifoQueue, contentBasedDeduplication, deduplicationScope, and
        # fifoThroughputLimit for standard queues even when set to valid values.
        - script:
            content: |
              SPEC=$(kubectl get queue -n sqsqueue std-queue -o json | jq '.spec')
              FAIL=0
              for ATTR in fifoQueue contentBasedDeduplication deduplicationScope fifoThroughputLimit; do
                if echo "$SPEC" | jq -e --arg a "$ATTR" 'has($a)' > /dev/null 2>&1; then
                  echo "FAIL: $ATTR present on standard queue"
                  FAIL=1
                fi
              done
              if [ "$FAIL" -eq 0 ]; then
                echo "PASS: no FIFO-only attributes on standard queue"
              else
                exit 1
              fi
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: std-queue
              status:
                resourceName: sqsqueue-std-queue

    # ──────────────────────────────────────────────────────────────────────────
    # AC-14: queuePolicyRef resolves AWSPolicyDocument and sets ACK policy field.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac14-queue-policy-ref
      try:
        - apply:
            file: 02-policy-document.yaml
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: policy-ref-queue
              spec:
                queuePolicyRef: my-queue-policy
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: policy-ref-queue
              spec:
                policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:root"},"Action":"sqs:SendMessage","Resource":"*"}]}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-15: No queue policy — spec.policy is absent when queuePolicyRef is "".
    # KRO-915: the NN template (no-policy, no-redrive) omits policy entirely;
    # AWS rejects empty-string Attribute values, so the field must be absent not "".
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac15-no-queue-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: no-policy-queue
              spec: {}
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: no-policy-queue
        - script:
            content: |
              SPEC=$(kubectl get queue -n sqsqueue no-policy-queue -o json | jq '.spec')
              if echo "$SPEC" | jq -e 'has("policy")' > /dev/null 2>&1; then
                echo "FAIL: spec.policy must be absent when no queue policy is configured, got: $(echo "$SPEC" | jq -r '.policy')"
                exit 1
              fi
              echo "PASS: spec.policy is correctly absent in no-policy queue"

    # ──────────────────────────────────────────────────────────────────────────
    # AC-16: DLQ redrive policy — source queue reads DLQ resourceName from the
    # naming ConfigMap (aws.kropath.run/resource-name=my-dlq,
    # aws.kropath.run/kropath-type=sqs-naming) to construct the redrivePolicy ARN.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac16-dlq-redrive-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: my-dlq
              spec: {}
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: my-dlq-naming
                labels:
                  aws.kropath.run/resource-name: my-dlq
                  aws.kropath.run/kropath-type: sqs-naming
              data:
                resourceName: sqsqueue-my-dlq
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: src-queue
              spec:
                redrivePolicy:
                  deadLetterTargetRef: my-dlq
                  maxReceiveCount: 5
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: src-queue
              spec:
                redrivePolicy: '{"deadLetterTargetArn":"arn:aws:sqs:ap-southeast-2:123456789012:sqsqueue-my-dlq","maxReceiveCount":5}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-17: redriveAllowPolicy byQueue with sourceQueueArns (full ARNs supplied).
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac17-dlq-allow-policy-byqueue
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: allow-byqueue-dlq
              spec:
                redriveAllowPolicy:
                  redrivePermission: byQueue
                  sourceQueueArns:
                    - "arn:aws:sqs:ap-southeast-2:123456789012:payments-prod-source-1"
                    - "arn:aws:sqs:ap-southeast-2:123456789012:payments-prod-source-2"
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: allow-byqueue-dlq
              spec:
                redriveAllowPolicy: '{"redrivePermission":"byQueue","sourceQueueArns":["arn:aws:sqs:ap-southeast-2:123456789012:payments-prod-source-1","arn:aws:sqs:ap-southeast-2:123456789012:payments-prod-source-2"]}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-18: redriveAllowPolicy denyAll.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac18-dlq-allow-policy-denyall
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: allow-denyall-dlq
              spec:
                redriveAllowPolicy:
                  redrivePermission: denyAll
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: allow-denyall-dlq
              spec:
                redriveAllowPolicy: '{"redrivePermission":"denyAll"}'

    # ──────────────────────────────────────────────────────────────────────────
    # AC-19: DLQ is a FIFO queue; redrivePolicy ARN includes .fifo suffix.
    # The .fifo suffix is in resourceName from the DLQ naming ConfigMap.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac19-dlq-fifo-suffix
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: my-fifo-dlq
              spec:
                fifo: true
