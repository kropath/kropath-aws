    # ──────────────────────────────────────────────────────────────────────────
    # AC-16b (KRO-922): redrivePolicy guard — field is OMITTED when
    # effectiveConfig.aws.region is empty, preventing a malformed ARN from
    # reaching ACK. Field is re-emitted once region is restored.
    # ──────────────────────────────────────────────────────────────────────────
    - name: ac16b-redrive-policy-guard-empty-region
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSConfig
              metadata:
                name: region-guard-config
                namespace: sqsqueue
                labels:
                  aws.kropath.run/resource-name: region-guard-config
              spec:
                mandatory:
                  encryptionType: ""
                  kmsMasterKeyId: ""
                  visibilityTimeout: 0
                  messageRetentionPeriod: 0
                  delaySeconds: 0
                  maximumMessageSize: 0
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  encryptionType: sqs-managed
                  kmsMasterKeyId: ""
                  visibilityTimeout: 30
                  messageRetentionPeriod: 345600
                  delaySeconds: 0
                  maximumMessageSize: 262144
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch sqsconfig region-guard-config -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","kmsMasterKeyId":"","visibilityTimeout":0,"messageRetentionPeriod":0,"delaySeconds":0,"maximumMessageSize":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"sqs-managed","kmsMasterKeyId":"","visibilityTimeout":30,"messageRetentionPeriod":345600,"delaySeconds":0,"maximumMessageSize":262144,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":""}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: region-guard-dlq
              spec:
                configRef: region-guard-config
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: region-guard-dlq-naming
                labels:
                  aws.kropath.run/resource-name: region-guard-dlq
                  aws.kropath.run/kropath-type: sqs-naming
              data:
                resourceName: sqsqueue-region-guard-dlq
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SQSQueue
              metadata:
                name: region-guard-src
              spec:
                configRef: region-guard-config
                redrivePolicy:
                  deadLetterTargetRef: region-guard-dlq
                  maxReceiveCount: 3
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: region-guard-src
        - script:
            content: |
              for i in $(seq 1 15); do
                POLICY=$(kubectl get queue -n sqsqueue region-guard-src -o json 2>/dev/null | jq -r '.spec.redrivePolicy // ""')
                if [ -z "$POLICY" ]; then
                  echo "PASS: redrivePolicy correctly empty while region is empty (confirmed at attempt ${i})"
                  exit 0
                fi
                sleep 2
              done
              echo "FAIL: redrivePolicy must be empty when effectiveConfig.aws.region is empty (timed out after 30s)"
              kubectl get queue -n sqsqueue region-guard-src -o json | jq '.spec.redrivePolicy'
              exit 1
        - script:
            content: |
              kubectl patch sqsconfig region-guard-config -n sqsqueue \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: sqs.services.k8s.aws/v1alpha1
              kind: Queue
              metadata:
                name: region-guard-src
              spec:
                redrivePolicy: '{"deadLetterTargetArn":"arn:aws:sqs:ap-southeast-2:123456789012:sqsqueue-region-guard-dlq","maxReceiveCount":3}'

