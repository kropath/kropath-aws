# aws-acm-05 ACMEEndpoint Chainsaw tests.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# Spec: kropath-core/docs/specs/aws/aws-acm-05-acmeendpoint.md
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: acmeendpoint
spec:
  skipDelete: true
  namespace: acmeendpoint
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    - name: preamble-verify-crds-and-rgds
      try:
        - script:
            content: |
              ../ensure-acm-prereqs.sh acmeendpoint

    # AC-1: ACMEEndpoint created when authorizationBehavior=PRE_APPROVED — ACK AcmeEndpoint created.
    - name: ac1-authorization-behavior-pre-approved
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac1-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac1-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac1-ep
                namespace: acmeendpoint
              spec:
                configRef: ac1-cfg
                authorizationBehavior: PRE_APPROVED
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac1-ep
                namespace: acmeendpoint
              spec:
                authorizationBehavior: PRE_APPROVED

    # AC-2: allowedKeyAlgorithms passed through to ACK AcmeEndpoint.
    - name: ac2-allowed-key-algorithms
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac2-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac2-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac2-ep
                namespace: acmeendpoint
              spec:
                configRef: ac2-cfg
                authorizationBehavior: PRE_APPROVED
                allowedKeyAlgorithms:
                  - RSA_2048
                  - EC_prime256v1
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac2-ep
                namespace: acmeendpoint
              spec:
                certificateAuthority:
                  publicCertificateAuthority:
                    allowedKeyAlgorithms:
                      - RSA_2048
                      - EC_prime256v1

    # AC-3: contact=REQUIRED passed through to ACK AcmeEndpoint.
    - name: ac3-contact-required
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac3-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac3-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac3-ep
                namespace: acmeendpoint
              spec:
                configRef: ac3-cfg
                authorizationBehavior: PRE_APPROVED
                contact: REQUIRED
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac3-ep
                namespace: acmeendpoint
              spec:
                contact: REQUIRED

    # AC-4: certificateTags passed through to ACK AcmeEndpoint.
    - name: ac4-certificate-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac4-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac4-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac4-ep
                namespace: acmeendpoint
              spec:
                configRef: ac4-cfg
                authorizationBehavior: PRE_APPROVED
                certificateTags:
                  - key: env
                    value: prod
                  - key: team
                    value: platform
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac4-ep
                namespace: acmeendpoint
              spec:
                certificateTags:
                  - key: env
                    value: prod
                  - key: team
                    value: platform

    # AC-5 (negative): authorizationBehavior missing → error ConfigMap created, ACK AcmeEndpoint NOT created.
    - name: ac5-missing-authorization-behavior-error
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac5-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac5-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac5-ep
                namespace: acmeendpoint
              spec:
                configRef: ac5-cfg
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac5-ep-missing-authorization-behavior-error
                namespace: acmeendpoint
              data:
                error: "authorizationBehavior is required"

    # AC-6: Standard metadata — ACK AcmeEndpoint carries managed-by and resource-name labels.
    # resource-name label enables ACMEDomainValidation to find this endpoint via acmeEndpointRef.
    - name: ac6-standard-metadata-and-resource-name-label
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac6-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac6-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac6-ep
                namespace: acmeendpoint
              spec:
                configRef: ac6-cfg
                authorizationBehavior: PRE_APPROVED
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac6-ep
                namespace: acmeendpoint
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac6-ep
                  aws.kropath.run/resource-name: ac6-ep
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-7: deletion-policy=delete wired as ACK annotation.
    - name: ac7-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac7-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac7-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac7-ep
                namespace: acmeendpoint
              spec:
                configRef: ac7-cfg
                authorizationBehavior: PRE_APPROVED
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac7-ep
                namespace: acmeendpoint
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-8: Status fields from ACK AcmeEndpoint propagated to ACMEEndpoint status.
    - name: ac8-status-outputs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac8-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac8-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac8-ep
                namespace: acmeendpoint
              spec:
                configRef: ac8-cfg
                authorizationBehavior: PRE_APPROVED
        - script:
            content: |
              for i in $(seq 1 30); do
                EP=$(kubectl get acmeendpoint ac8-ep -n acmeendpoint --ignore-not-found=true)
                if [ -n "$EP" ]; then break; fi
                sleep 2
              done
              kubectl patch acmeendpoint ac8-ep -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"acmeEndpointARN":"arn:aws:acm:us-east-1:123456789012:acme-endpoint/ac8","endpointURL":"https://acme8.example.com/directory","endpointStatus":"ACTIVE"}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac8-ep
                namespace: acmeendpoint
              status:
                acmeEndpointARN: "arn:aws:acm:us-east-1:123456789012:acme-endpoint/ac8"

    # AC-9: Tag merge — governance tags + spec tags on ACK AcmeEndpoint; order-independent jq check.
    - name: ac9-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac9-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac9-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{"cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac9-ep
                namespace: acmeendpoint
              spec:
                configRef: ac9-cfg
                authorizationBehavior: PRE_APPROVED
                tags:
                  team: security
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac9-ep
                namespace: acmeendpoint
        - script:
            content: |
              for i in $(seq 1 30); do
                TAGS=$(kubectl get acmeendpoint.acm.services.k8s.aws ac9-ep -n acmeendpoint -o json | jq -r '.spec.tags // []')
                HAS_INFRA=$(echo "$TAGS" | jq -e 'map(select(.key=="cost-centre" and .value=="infra")) | length > 0')
                HAS_TEAM=$(echo "$TAGS" | jq -e 'map(select(.key=="team" and .value=="security")) | length > 0')
                if [ "$HAS_INFRA" = "true" ] && [ "$HAS_TEAM" = "true" ]; then
                  echo "Tag merge verified: cost-centre=infra and team=security both present"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: expected tags not found"
              exit 1
