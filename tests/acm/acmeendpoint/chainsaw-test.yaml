# aws-acm-05 ACMEEndpoint Chainsaw tests.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# Spec: kropath-core/docs/specs/aws/aws-acm-05-acmeendpoint.md
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: acmeendpoint
spec:
  skipDelete: true
  namespace: acmeendpoint
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    - name: preamble-apply-crds-and-rgds
      try:
        - script:
            content: |
              kubectl apply -f ../../fixtures/crds/acm/
              kubectl apply -f ../../fixtures/crds/acmpca/
              kubectl wait crd certificates.acm.services.k8s.aws acmeendpoints.acm.services.k8s.aws acmedomainvalidations.acm.services.k8s.aws --for=condition=Established --timeout=60s
              kubectl delete rgd acmeendpoint.aws.kropath.run --ignore-not-found=true
              kubectl apply -f ../../../rgds/acmeendpoint.aws.kropath.run.yaml
              kubectl wait rgd acmeendpoint.aws.kropath.run --for=condition=Ready --timeout=120s

    # AC-1: ACME endpoint created with endpointURL and CA certificate ARN.
    - name: ac1-endpoint-created
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac1-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac1-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac1-ep
                namespace: acmeendpoint
              spec:
                configRef: ac1-cfg
                endpointURL: "https://acme.example.com/directory"
                acmeCACertificateARN: "arn:aws:acm:us-east-1:123456789012:certificate/abc"
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac1-ep
                namespace: acmeendpoint
              spec:
                endpointURL: "https://acme.example.com/directory"
                acmeCACertificateARN: "arn:aws:acm:us-east-1:123456789012:certificate/abc"

    # AC-4: ACK AcmeEndpoint CR carries aws.kropath.run/resource-name label for ACMEDomainValidation lookup.
    - name: ac4-resource-name-label
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac4-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac4-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac4-ep
                namespace: acmeendpoint
              spec:
                configRef: ac4-cfg
                endpointURL: "https://acme2.example.com/directory"
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac4-ep
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac4-ep

    # AC-7: deletion-policy=delete wired as ACK annotation.
    - name: ac7-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac7-cfg
                namespace: acmeendpoint
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac7-cfg -n acmeendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMEEndpoint
              metadata:
                name: ac7-ep
                namespace: acmeendpoint
              spec:
                configRef: ac7-cfg
                endpointURL: "https://acme3.example.com/directory"
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: acm.services.k8s.aws/v1alpha1
              kind: AcmeEndpoint
              metadata:
                name: ac7-ep
                namespace: acmeendpoint
                annotations:
                  services.k8s.aws/deletion-policy: delete
