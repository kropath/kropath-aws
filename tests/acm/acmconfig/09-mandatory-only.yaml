---
# Only spec.mandatory is set; spec.defaults is omitted entirely.
# Verifies that the CRD does not auto-materialize defaults tier values
# that would trigger the dual-tier mutual-exclusion validation rules.
apiVersion: aws.kropath.run/v1alpha1
kind: ACMConfig
metadata:
  name: mandatory-only
  namespace: acmconfig
  labels:
    aws.kropath.run/resource-name: mandatory-only
spec:
  mandatory:
    keyAlgorithm: "EC_prime256v1"
    certificateTransparencyLogging: "ENABLED"
    usageMode: ""
    keyStorageSecurityStandard: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
