# aws-acm-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: acmconfig
spec:
  skipDelete: true
  namespace: acmconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 05-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: general-policy
                namespace: acmconfig
              spec:
                defaults:
                  keyAlgorithm: "RSA_2048"
                  certificateTransparencyLogging: "ENABLED"
                  usageMode: "GENERAL_PURPOSE"
                  keyStorageSecurityStandard: "FIPS_140_2_LEVEL_3_OR_HIGHER"

    - name: ac2-pci-profile-accepted
      try:
        - apply:
            file: 06-pci.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: pci
                namespace: acmconfig
              spec:
                mandatory:
                  keyAlgorithm: "EC_prime256v1"
                  certificateTransparencyLogging: "ENABLED"
                  keyStorageSecurityStandard: "FIPS_140_2_LEVEL_3_OR_HIGHER"

    - name: ac3-internal-services-profile-accepted
      try:
        - apply:
            file: 07-internal-services.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: internal-services
                namespace: acmconfig
              spec:
                defaults:
                  keyAlgorithm: "EC_prime256v1"
                  certificateTransparencyLogging: "DISABLED"
                  usageMode: "SHORT_LIVED_CERTIFICATE"

    - name: ac4-reject-both-tiers-key-algorithm
      try:
        - apply:
            file: 01-invalid-both-tiers-key-algorithm.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ACMConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-ct-logging
      try:
        - apply:
            file: 02-invalid-both-tiers-ct-logging.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ACMConfig
                check:
                  ($error != null): true

    - name: ac6-reject-both-tiers-usage-mode
      try:
        - apply:
            file: 03-invalid-both-tiers-usage-mode.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ACMConfig
                check:
                  ($error != null): true

    - name: ac7-reject-both-tiers-key-storage
      try:
        - apply:
            file: 04-invalid-both-tiers-key-storage.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ACMConfig
                check:
                  ($error != null): true

    - name: ac11-label-selector-lookup
      try:
        - apply:
            file: 08-label-selector.yaml
        - script:
            content: |
              set -eu
              count=$(kubectl get acmconfig -n acmconfig -l aws.kropath.run/resource-name=label-selector-test -o json | jq '.items | length')
              test "$count" -eq 1
