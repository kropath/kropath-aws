# aws-acm-04 ACMPrivateCertificate Chainsaw tests.
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# Spec: kropath-core/docs/specs/aws/aws-acm-04-acmprivatecertificate.md
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: acmprivatecertificate
spec:
  skipDelete: true
  namespace: acmprivatecertificate
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    - name: preamble-apply-crds-and-rgds
      try:
        - script:
            content: |
              kubectl apply -f ../../fixtures/crds/acm/
              kubectl apply -f ../../fixtures/crds/acmpca/
              kubectl wait crd certificates.acm.services.k8s.aws acmeendpoints.acm.services.k8s.aws acmedomainvalidations.acm.services.k8s.aws certificateauthorities.acmpca.services.k8s.aws certificateauthorityactivations.acmpca.services.k8s.aws certificates.acmpca.services.k8s.aws --for=condition=Established --timeout=60s
              kubectl delete rgd acmprivatecertificate.aws.kropath.run acmprivateca.aws.kropath.run --ignore-not-found=true
              kubectl apply -f ../../../rgds/acmprivateca.aws.kropath.run.yaml
              kubectl apply -f ../../../rgds/acmprivatecertificate.aws.kropath.run.yaml
              kubectl wait rgd acmprivatecertificate.aws.kropath.run acmprivateca.aws.kropath.run --for=condition=Ready --timeout=120s

    # AC-1: Private cert issued with direct CA ARN, default signing algorithm and validity.
    - name: ac1-private-cert-with-ca-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac1-cfg
                namespace: acmprivatecertificate
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac1-cfg -n acmprivatecertificate \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMPrivateCertificate
              metadata:
                name: ac1-cert
                namespace: acmprivatecertificate
              spec:
                configRef: ac1-cfg
                certificateAuthorityARN: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/abc"
                commonName: "ac1.example.com"
        - assert:
            resource:
              apiVersion: acmpca.services.k8s.aws/v1alpha1
              kind: Certificate
              metadata:
                name: ac1-cert
                namespace: acmprivatecertificate
              spec:
                certificateAuthorityARN: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/abc"
                commonName: "ac1.example.com"
                signingAlgorithm: SHA256WITHRSA
                validity:
                  type_: YEARS
                  value: 1

    # AC-5: Custom signingAlgorithm is passed through.
    - name: ac5-custom-signing-algorithm
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac5-cfg
                namespace: acmprivatecertificate
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac5-cfg -n acmprivatecertificate \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMPrivateCertificate
              metadata:
                name: ac5-cert
                namespace: acmprivatecertificate
              spec:
                configRef: ac5-cfg
                certificateAuthorityARN: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/abc"
                commonName: "ac5.example.com"
                signingAlgorithm: SHA384WITHRSA
        - assert:
            resource:
              apiVersion: acmpca.services.k8s.aws/v1alpha1
              kind: Certificate
              metadata:
                name: ac5-cert
                namespace: acmprivatecertificate
              spec:
                signingAlgorithm: SHA384WITHRSA

    # AC-7 (negative): both certificateAuthorityARN and certificateAuthorityRef set — error ConfigMap.
    - name: ac7-ca-arn-and-ref-mutually-exclusive
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac7-cfg
                namespace: acmprivatecertificate
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac7-cfg -n acmprivatecertificate \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMPrivateCertificate
              metadata:
                name: ac7-cert
                namespace: acmprivatecertificate
              spec:
                configRef: ac7-cfg
                certificateAuthorityARN: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/abc"
                certificateAuthorityRef: my-private-ca
                commonName: "ac7.example.com"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac7-cert-ca-arn-ref-error
                namespace: acmprivatecertificate
              data:
                error: "certificateAuthorityARN and certificateAuthorityRef are mutually exclusive"

    # AC-10 (negative): neither certificateAuthorityARN nor certificateAuthorityRef set — error ConfigMap.
    - name: ac10-missing-ca-source
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac10-cfg
                namespace: acmprivatecertificate
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac10-cfg -n acmprivatecertificate \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMPrivateCertificate
              metadata:
                name: ac10-cert
                namespace: acmprivatecertificate
              spec:
                configRef: ac10-cfg
                commonName: "ac10.example.com"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac10-cert-missing-ca-error
                namespace: acmprivatecertificate
              data:
                error: "one of certificateAuthorityARN or certificateAuthorityRef is required"

    # AC-3: Certificate output secret written to Kubernetes Secret.
    - name: ac3-cert-output-secret
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac3-cfg
                namespace: acmprivatecertificate
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac3-cfg -n acmprivatecertificate \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMPrivateCertificate
              metadata:
                name: ac3-cert
                namespace: acmprivatecertificate
              spec:
                configRef: ac3-cfg
                certificateAuthorityARN: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/abc"
                commonName: "ac3.example.com"
                certificateSecretName: my-cert-output
        - assert:
            resource:
              apiVersion: acmpca.services.k8s.aws/v1alpha1
              kind: Certificate
              metadata:
                name: ac3-cert
                namespace: acmprivatecertificate
              spec:
                certificateOutput:
                  name: my-cert-output
                  key: tls.crt

    # AC-4: Custom templateARN is passed through.
    - name: ac4-custom-template-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac4-cfg
                namespace: acmprivatecertificate
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac4-cfg -n acmprivatecertificate \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMPrivateCertificate
              metadata:
                name: ac4-cert
                namespace: acmprivatecertificate
              spec:
                configRef: ac4-cfg
                certificateAuthorityARN: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/abc"
                commonName: "ac4.example.com"
                templateARN: "arn:aws:acm-pca:::template/EndEntityCertificate/V1"
        - assert:
            resource:
              apiVersion: acmpca.services.k8s.aws/v1alpha1
              kind: Certificate
              metadata:
                name: ac4-cert
                namespace: acmprivatecertificate
              spec:
                templateARN: "arn:aws:acm-pca:::template/EndEntityCertificate/V1"

    # AC-11: Tags merged to ACK Certificate; order-independent jq check.
    - name: ac11-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac11-cfg
                namespace: acmprivatecertificate
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac11-cfg -n acmprivatecertificate \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{"cost-centre":"pki"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMPrivateCertificate
              metadata:
                name: ac11-cert
                namespace: acmprivatecertificate
              spec:
                configRef: ac11-cfg
                certificateAuthorityARN: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/abc"
                commonName: "ac11.example.com"
                tags:
                  service: api
        - script:
            content: |
              for i in $(seq 1 30); do
                TAGS=$(kubectl get certificate.acmpca.services.k8s.aws ac11-cert -n acmprivatecertificate -o json | jq -r '.spec.tags // []')
                HAS_PKI=$(echo "$TAGS" | jq -e 'map(select(.key=="cost-centre" and .value=="pki")) | length > 0')
                HAS_SVC=$(echo "$TAGS" | jq -e 'map(select(.key=="service" and .value=="api")) | length > 0')
                if [ "$HAS_PKI" = "true" ] && [ "$HAS_SVC" = "true" ]; then
                  echo "Tags verified: cost-centre=pki and service=api"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: expected tags not found"
              exit 1

    # AC-12: deletion-policy=delete wired as ACK annotation.
    - name: ac12-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMConfig
              metadata:
                name: ac12-cfg
                namespace: acmprivatecertificate
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                mandatory: {}
                defaults: {}
        - script:
            content: |
              kubectl patch acmconfig ac12-cfg -n acmprivatecertificate \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"keyAlgorithm":"","certificateTransparencyLogging":"","usageMode":"","keyStorageSecurityStandard":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"keyAlgorithm":"RSA_2048","certificateTransparencyLogging":"ENABLED","usageMode":"GENERAL_PURPOSE","keyStorageSecurityStandard":"FIPS_140_2_LEVEL_3_OR_HIGHER","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ACMPrivateCertificate
              metadata:
                name: ac12-cert
                namespace: acmprivatecertificate
              spec:
                configRef: ac12-cfg
                certificateAuthorityARN: "arn:aws:acm-pca:us-east-1:123456789012:certificate-authority/abc"
                commonName: "ac12.example.com"
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: acmpca.services.k8s.aws/v1alpha1
              kind: Certificate
              metadata:
                name: ac12-cert
                namespace: acmprivatecertificate
                annotations:
                  services.k8s.aws/deletion-policy: delete
