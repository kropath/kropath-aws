# aws-ecr-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ecrconfig
spec:
  skipDelete: true
  namespace: ecrconfig
  steps:
    - name: ac1-ecrconfig-valid-admission
      try:
        - apply:
            file: 00-ecrconfig-namespace.yaml
        - apply:
            file: 01-valid-admission.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECRConfig
              metadata:
                name: valid-admission
                namespace: ecrconfig
              spec:
                mandatory:
                  imageTagMutability: "IMMUTABLE"
                defaults:
                  encryptionType: "AES256"
                  namingTemplate: "{namespace}/{name}"

    - name: ac2-ecrconfig-defaults-only
      try:
        - apply:
            file: 02-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECRConfig
              metadata:
                name: defaults-only
                namespace: ecrconfig
              spec:
                defaults:
                  imageTagMutability: "MUTABLE"
                  encryptionType: "AES256"
                  namingTemplate: "{namespace}/{name}"

    - name: ac3-ecrconfig-label-selector
      try:
        - apply:
            file: 03-label-selector.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECRConfig
              metadata:
                name: label-selector-test
                namespace: ecrconfig
                labels:
                  aws.kropath.run/resource-name: label-selector-test
        - script:
            content: |
              set -eu
              label="$(kubectl get ecrconfig label-selector-test -n ecrconfig \
                -o jsonpath='{.metadata.labels.aws\.kropath\.run/resource-name}')"
              test "$label" = "label-selector-test"

    - name: ac4-ecrconfig-imageTagMutability-both-tiers
      try:
        - apply:
            file: 04-invalid-both-tiers-imagetagmutability.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECRConfig
                check:
                  ($error != null): true

    - name: ac5-ecrconfig-encryptionType-both-tiers
      try:
        - apply:
            file: 05-invalid-both-tiers-encryptiontype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECRConfig
                check:
                  ($error != null): true

    - name: ac6-ecrconfig-kmsKeyID-both-tiers
      try:
        - apply:
            file: 06-invalid-both-tiers-kmskeyid.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECRConfig
                check:
                  ($error != null): true

    - name: ac7-ecrconfig-lifecyclePolicy-both-tiers
      try:
        - apply:
            file: 07-invalid-both-tiers-lifecyclepolicy.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECRConfig
                check:
                  ($error != null): true

    - name: ac8-ecrconfig-namingTemplate-both-tiers
      try:
        - apply:
            file: 08-invalid-both-tiers-namingtemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ECRConfig
                check:
                  ($error != null): true

    - name: ac3-effectiveconfig-status-written-by-controller
      try:
        - script:
            content: |
              # Simulate controller writing effectiveConfig onto the label-selector-test CR.
              kubectl patch ecrconfig label-selector-test -n ecrconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"imageTagMutability":"","encryptionType":"","kmsKeyID":"","lifecyclePolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"imageTagMutability":"MUTABLE","encryptionType":"AES256","kmsKeyID":"","lifecyclePolicy":"","namingTemplate":"{namespace}/{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ECRConfig
              metadata:
                name: label-selector-test
                namespace: ecrconfig
              status:
                effectiveConfig:
                  defaults:
                    imageTagMutability: "MUTABLE"
                    encryptionType: "AES256"
                    namingTemplate: "{namespace}/{name}"
                  aws:
                    region: "us-east-1"
                    accountId: "123456789012"
            timeout: 60s
