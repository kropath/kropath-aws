# AC-7 (negative): lifecyclePolicy set in both mandatory and defaults — must be rejected.
---
apiVersion: aws.kropath.run/v1alpha1
kind: ECRConfig
metadata:
  name: invalid-both-tiers-lifecycle
  namespace: ecrconfig
spec:
  mandatory:
    lifecyclePolicy: '{"rules":[{"rulePriority":1,"description":"Expire old images","selection":{"tagStatus":"untagged","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  defaults:
    lifecyclePolicy: '{"rules":[{"rulePriority":1,"description":"Keep last 30","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}'
