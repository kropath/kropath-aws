# aws-pipes-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pipesconfig
spec:
  skipDelete: true
  namespace: pipesconfig
  steps:
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-pipesconfig-namespace.yaml
    - name: ac1-desired-state-mandatory-accepted
      try:
        - apply:
            file: 01-desired-state-mandatory.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PipesConfig
              metadata:
                name: ac1-desired-state-mandatory
                namespace: pipesconfig
              spec:
                mandatory:
                  desiredState: "stopped"
                defaults:
                  desiredState: ""
    - name: ac2-reject-desired-state-both-tiers
      try:
        - apply:
            file: 02-desired-state-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: PipesConfig
                check:
                  ($error != null): true

    - name: ac3-naming-mandatory-accepted
      try:
        - apply:
            file: 03-naming-mandatory.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PipesConfig
              metadata:
                name: ac3-naming-mandatory
                namespace: pipesconfig
              spec:
                mandatory:
                  namingTemplate: "corp-{namespace}-{name}"
                defaults:
                  namingTemplate: ""
    - name: ac4-reject-naming-both-tiers
      try:
        - apply:
            file: 04-naming-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: PipesConfig
                check:
                  ($error != null): true

    - name: ac5-tier-symmetry-accepted
      try:
        - apply:
            file: 05-tier-symmetry.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PipesConfig
              metadata:
                name: ac5-tier-symmetry
                namespace: pipesconfig
              spec:
                mandatory:
                  desiredState: ""
                  namingTemplate: ""
                  tags:
                    env: prod
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  desiredState: ""
                  namingTemplate: ""
                  tags: {}
    - name: ac6-tags-both-tiers-accepted
      try:
        - apply:
            file: 06-tags-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PipesConfig
              metadata:
                name: ac6-tags-both-tiers
                namespace: pipesconfig
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  tags:
                    team: infra
    - name: ac7-synced-labels-both-tiers-accepted
      try:
        - apply:
            file: 07-synced-labels-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PipesConfig
              metadata:
                name: ac7-synced-labels-both-tiers
                namespace: pipesconfig
              spec:
                mandatory:
                  syncedLabels:
                    env: prod
                defaults:
                  syncedLabels:
                    tier: standard
    - name: ac8-general-policy-deployed-in-kro-system
      try:
        - apply:
            file: 08-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PipesConfig
              metadata:
                name: general-policy
                namespace: kro-system
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  desiredState: ""
                  namingTemplate: ""
                defaults:
                  desiredState: "running"
                  namingTemplate: "{namespace}-{name}"
