# AC-5: only mandatory.tags set, all other fields at zero → admission succeeds
---
apiVersion: aws.kropath.run/v1alpha1
kind: PipesConfig
metadata:
  name: ac5-tier-symmetry
  namespace: pipesconfig
spec:
  mandatory:
    desiredState: ""
    namingTemplate: ""
    tags:
      env: prod
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    desiredState: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
