---
# AC-3: mandatory.desiredState "stopped" wins over instance.desiredState "running"
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac3-desired-state-mandatory-override
  namespace: pipespipe
spec:
  configRef: config-mandatory-stopped
  source: arn:aws:sqs:us-east-1:123456789012:ac3-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac3-target
  desiredState: running
