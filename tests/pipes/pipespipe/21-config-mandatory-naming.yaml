---
# PipesConfig with mandatory.namingTemplate overriding default — used for AC-17
apiVersion: aws.kropath.run/v1alpha1
kind: PipesConfig
metadata:
  name: config-mandatory-naming
  namespace: pipespipe
  labels:
    aws.kropath.run/resource-name: config-mandatory-naming
spec:
  mandatory:
    desiredState: ""
    namingTemplate: "corp-{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    desiredState: "running"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
