---
# PipesConfig with mandatory.desiredState "stopped" — used for AC-3
apiVersion: aws.kropath.run/v1alpha1
kind: PipesConfig
metadata:
  name: config-mandatory-stopped
  namespace: pipespipe
  labels:
    aws.kropath.run/resource-name: config-mandatory-stopped
spec:
  mandatory:
    desiredState: "stopped"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    desiredState: "running"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
