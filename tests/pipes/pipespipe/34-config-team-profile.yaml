---
# PipesConfig "team-profile" with mandatory.desiredState "stopped" — used for AC-26
apiVersion: aws.kropath.run/v1alpha1
kind: PipesConfig
metadata:
  name: team-profile
  namespace: pipespipe
  labels:
    aws.kropath.run/resource-name: team-profile
spec:
  mandatory:
    desiredState: "stopped"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    desiredState: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
