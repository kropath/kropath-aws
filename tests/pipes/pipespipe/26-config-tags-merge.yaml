---
# PipesConfig for AC-20 — tags merge test
# mandatory.tags has "env:prod", defaults.tags has "team:platform"
# spec.tags has "project:pipes" → all three should appear (mandatory wins on collision)
apiVersion: aws.kropath.run/v1alpha1
kind: PipesConfig
metadata:
  name: config-tags-merge
  namespace: pipespipe
  labels:
    aws.kropath.run/resource-name: config-tags-merge
spec:
  mandatory:
    desiredState: ""
    namingTemplate: ""
    tags:
      env: prod
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    desiredState: "running"
    namingTemplate: "{namespace}-{name}"
    tags:
      team: platform
    syncedLabels: {}
    syncedAnnotations: {}
