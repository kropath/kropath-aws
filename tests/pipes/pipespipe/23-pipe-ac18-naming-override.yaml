---
# AC-18: nameOverride takes highest precedence
# effectiveName → "my-custom-pipe-name"
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac18-naming-override
  namespace: pipespipe
spec:
  configRef: general-policy
  nameOverride: my-custom-pipe-name
  source: arn:aws:sqs:us-east-1:123456789012:ac18-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac18-target
