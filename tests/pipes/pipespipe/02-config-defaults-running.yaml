---
# PipesConfig with defaults.desiredState "running" — used for AC-1
apiVersion: aws.kropath.run/v1alpha1
kind: PipesConfig
metadata:
  name: config-defaults-running
  namespace: pipespipe
  labels:
    aws.kropath.run/resource-name: config-defaults-running
spec:
  mandatory:
    desiredState: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    desiredState: "running"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
