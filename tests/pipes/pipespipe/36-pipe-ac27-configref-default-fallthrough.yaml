---
# AC-27: configRef="" defaults to "general-policy" (the default value in the schema)
# Uses the general-policy in kro-system (applied in step 1)
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac27-configref-default-fallthrough
  namespace: pipespipe
spec:
  # configRef defaults to "general-policy" per schema default
  source: arn:aws:sqs:us-east-1:123456789012:ac27-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac27-target
