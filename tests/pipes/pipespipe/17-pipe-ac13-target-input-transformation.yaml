---
# AC-13: inputTemplate with SQS target in targetParameters
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac13-target-input-transformation
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac13-source
  target: arn:aws:sqs:us-east-1:123456789012:ac13-destination
  targetParameters:
    inputTemplate: '{"order": <$.body.order>}'
