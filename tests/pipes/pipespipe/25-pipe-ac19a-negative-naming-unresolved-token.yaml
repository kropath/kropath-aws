---
# AC-19a (negative): namingTemplate with bare {env} token (not {tag.env}) → unresolved
# kro only replaces {namespace}/{name}/{account_id}/{region}/{configRef} and {tag.*}
# Bare {env} is unknown and left as literal → namingStatus: invalid-unresolved-tokens
apiVersion: aws.kropath.run/v1alpha1
kind: PipesConfig
metadata:
  name: config-bare-token
  namespace: pipespipe
  labels:
    aws.kropath.run/resource-name: config-bare-token
spec:
  mandatory:
    desiredState: ""
    namingTemplate: "{namespace}-{env}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    desiredState: "running"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac19a-negative-naming-unresolved-token
  namespace: pipespipe
spec:
  configRef: config-bare-token
  source: arn:aws:sqs:us-east-1:123456789012:ac19a-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac19a-target
