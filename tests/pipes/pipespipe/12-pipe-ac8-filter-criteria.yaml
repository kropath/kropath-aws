---
# AC-8: filter criteria in sourceParameters
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac8-filter-criteria
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac8-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac8-target
  sourceParameters:
    filterCriteria:
      filters:
        - pattern: '{"body":{"temperature":[{"numeric":[">",0,"<=",212]}]}}'
