---
# AC-21: syncedLabels dual-write to K8s metadata.labels (with aws.kropath.run/ prefix)
# AND cloud tags (plain key=env, value=prod)
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac21-synced-labels-dual
  namespace: pipespipe
spec:
  configRef: config-synced-labels
  source: arn:aws:sqs:us-east-1:123456789012:ac21-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac21-target
