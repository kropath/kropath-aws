---
# AC-11: Lambda target with FIRE_AND_FORGET invocationType
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac11-target-lambda-async
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac11-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac11-target
  targetParameters:
    lambdaFunctionParameters:
      invocationType: FIRE_AND_FORGET
