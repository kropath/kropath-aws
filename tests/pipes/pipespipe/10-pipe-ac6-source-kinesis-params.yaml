---
# AC-6: Kinesis source with sourceParameters passthrough
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac6-source-kinesis-params
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:kinesis:us-east-1:123456789012:stream/my-stream
  target: arn:aws:lambda:us-east-1:123456789012:function:ac6-target
  sourceParameters:
    kinesisStreamParameters:
      startingPosition: TRIM_HORIZON
      batchSize: 10
