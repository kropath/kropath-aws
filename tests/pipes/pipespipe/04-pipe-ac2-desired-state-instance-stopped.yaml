---
# AC-2: instance spec.desiredState "stopped" wins over defaults.desiredState "running"
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac2-desired-state-instance-stopped
  namespace: pipespipe
spec:
  configRef: config-defaults-running
  source: arn:aws:sqs:us-east-1:123456789012:ac2-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac2-target
  desiredState: stopped
