---
# AC-25: deletionPolicy "retain" (default) → services.k8s.aws/deletion-policy: retain
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac25-deletion-policy-retain
  namespace: pipespipe
spec:
  configRef: general-policy
  # deletionPolicy defaults to "retain"
  source: arn:aws:sqs:us-east-1:123456789012:ac25-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac25-target
