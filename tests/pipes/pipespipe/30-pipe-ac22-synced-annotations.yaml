apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac22-synced-annotations
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac22-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac22-target
  syncedAnnotations:
    cost-centre: platform
