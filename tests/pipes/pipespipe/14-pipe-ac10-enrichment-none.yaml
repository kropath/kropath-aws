---
# AC-10: empty enrichment → no enrichment ARN set (ackPipe.spec.enrichment is "")
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac10-enrichment-none
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac10-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac10-target
