---
# AC-19: namingTemplate with {tag.env} but no "env" in tags — resolves to literal "{tag.env}"
# → namingStatus: invalid-unresolved-tokens → ackPipe NOT created (includeWhen guard)
apiVersion: aws.kropath.run/v1alpha1
kind: PipesConfig
metadata:
  name: config-tag-naming
  namespace: pipespipe
  labels:
    aws.kropath.run/resource-name: config-tag-naming
spec:
  mandatory:
    desiredState: ""
    namingTemplate: "{namespace}-{tag.env}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    desiredState: "running"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac19-naming-missing-tag-empty
  namespace: pipespipe
spec:
  configRef: config-tag-naming
  source: arn:aws:sqs:us-east-1:123456789012:ac19-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac19-target
  # No tags — {tag.env} resolves to literal "{tag.env}" → invalid-unresolved-tokens
