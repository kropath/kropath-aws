---
# AC-9: Lambda enrichment + inputTemplate in enrichmentParameters
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac9-enrichment-lambda
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac9-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac9-target
  enrichment: arn:aws:lambda:us-east-1:123456789012:function:enricher
  enrichmentParameters:
    inputTemplate: '{"id": <$.id>}'
