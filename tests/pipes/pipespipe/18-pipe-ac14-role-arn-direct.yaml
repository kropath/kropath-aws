---
# AC-14: roleARN direct passthrough
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac14-role-arn-direct
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac14-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac14-target
  roleARN: arn:aws:iam::123456789012:role/PipesExecutionRole
