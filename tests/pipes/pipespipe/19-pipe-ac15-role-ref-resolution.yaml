---
# AC-15: roleRef object passthrough
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac15-role-ref-resolution
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac15-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac15-target
  roleRef:
    from:
      name: my-pipes-role
