---
# AC-20: cross-tier tags merge (mandatory > spec > defaults)
# Expected cloud tags: env=prod (mandatory), team=platform (defaults), project=pipes (spec)
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac20-tags-merge
  namespace: pipespipe
spec:
  configRef: config-tags-merge
  source: arn:aws:sqs:us-east-1:123456789012:ac20-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac20-target
  tags:
    project: pipes
