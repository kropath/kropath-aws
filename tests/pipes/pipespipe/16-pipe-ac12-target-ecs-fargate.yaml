---
# AC-12: ECS Fargate task params in targetParameters
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac12-target-ecs-fargate
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac12-source
  target: arn:aws:ecs:us-east-1:123456789012:cluster/my-cluster
  targetParameters:
    ecsTaskParameters:
      taskDefinitionArn: arn:aws:ecs:us-east-1:123456789012:task-definition/my-task:1
      launchType: FARGATE
      networkConfiguration:
        awsvpcConfiguration:
          subnets:
            - subnet-12345678
