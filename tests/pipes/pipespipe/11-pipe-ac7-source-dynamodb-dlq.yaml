---
# AC-7: DynamoDB stream source with DLQ in sourceParameters
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac7-source-dynamodb-dlq
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:dynamodb:us-east-1:123456789012:table/my-table/stream/2026-01-01T00:00:00.000
  target: arn:aws:lambda:us-east-1:123456789012:function:ac7-target
  sourceParameters:
    dynamoDBStreamParameters:
      startingPosition: TRIM_HORIZON
      deadLetterConfig:
        arn: arn:aws:sqs:us-east-1:123456789012:dlq
