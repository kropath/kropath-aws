---
# AC-16: standard naming {namespace}-{name} (default template from general-policy)
# effectiveName → "pipespipe-ac16-naming-standard"
apiVersion: aws.kropath.run/v1alpha1
kind: PipesPipe
metadata:
  name: ac16-naming-standard
  namespace: pipespipe
spec:
  configRef: general-policy
  source: arn:aws:sqs:us-east-1:123456789012:ac16-source
  target: arn:aws:lambda:us-east-1:123456789012:function:ac16-target
