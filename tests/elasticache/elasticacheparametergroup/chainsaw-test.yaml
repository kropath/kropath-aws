# aws-ec-03 Chainsaw tests — ElastiCacheParameterGroup (KRO-413).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elasticacheparametergroup
spec:
  skipDelete: true
  namespace: elasticacheparametergroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: happy-path: basic-create
    # cacheParameterGroupFamily and description forwarded verbatim.
    - name: ac1-basic-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac1-cfg
                namespace: elasticacheparametergroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac1-cfg -n elasticacheparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: ac1-params
                namespace: elasticacheparametergroup
              spec:
                configRef: ac1-cfg
                cacheParameterGroupFamily: "valkey8"
                description: "tuned valkey params"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheParameterGroup
              metadata:
                name: ac1-params
                namespace: elasticacheparametergroup
              spec:
                cacheParameterGroupFamily: "valkey8"
                description: "tuned valkey params"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: ac1-params
                namespace: elasticacheparametergroup
              status:
                resourceName: elasticacheparametergroup-ac1-params
                namingStatus: valid

    # AC-2: happy-path: parameter-overrides
    # parameterNameValues forwarded verbatim to ACK.
    - name: ac2-parameter-overrides
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac2-cfg
                namespace: elasticacheparametergroup
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac2-cfg -n elasticacheparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: ac2-params
                namespace: elasticacheparametergroup
              spec:
                configRef: ac2-cfg
                cacheParameterGroupFamily: "redis7"
                parameterNameValues:
                  - parameterName: "maxmemory-policy"
                    parameterValue: "allkeys-lru"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheParameterGroup
              metadata:
                name: ac2-params
                namespace: elasticacheparametergroup
              spec:
                parameterNameValues:
                  - parameterName: "maxmemory-policy"
                    parameterValue: "allkeys-lru"

    # AC-3: happy-path: tag-merge
    # mandatory tags win on key conflict.
    - name: ac3-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac3-cfg
                namespace: elasticacheparametergroup
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    tier: baseline
        - script:
            content: |
              kubectl patch elasticacheconfig ac3-cfg -n elasticacheparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{"tier":"baseline"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: ac3-params
                namespace: elasticacheparametergroup
              spec:
                configRef: ac3-cfg
                cacheParameterGroupFamily: "valkey8"
                tags:
                  app: orders
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheParameterGroup
              metadata:
                name: ac3-params
                namespace: elasticacheparametergroup
              spec:
                cacheParameterGroupFamily: "valkey8"
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get cacheparametergroups.elasticache.services.k8s.aws ac3-params -n elasticacheparametergroup -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "cost-centre" and .value == "platform")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "tier" and .value == "baseline")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "app" and .value == "orders")) | length == 1'

    # AC-4: happy-path: synced-labels
    # mandatory.syncedLabels forwarded to ACK labels (prefixed) and spec.tags.
    - name: ac4-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac4-cfg
                namespace: elasticacheparametergroup
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac4-cfg -n elasticacheparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: ac4-params
                namespace: elasticacheparametergroup
              spec:
                configRef: ac4-cfg
                cacheParameterGroupFamily: "redis7"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheParameterGroup
              metadata:
                name: ac4-params
                namespace: elasticacheparametergroup
                labels:
                  aws.kropath.run/environment: production
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get cacheparametergroups.elasticache.services.k8s.aws ac4-params -n elasticacheparametergroup -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "environment" and .value == "production")) | length == 1'

    # AC-5: happy-path: naming-template
    # defaults.namingTemplate controls cacheParameterGroupName.
    - name: ac5-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac5-cfg
                namespace: elasticacheparametergroup
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac5-cfg -n elasticacheparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: redis-params
                namespace: elasticacheparametergroup
              spec:
                configRef: ac5-cfg
                cacheParameterGroupFamily: "redis7"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: redis-params
                namespace: elasticacheparametergroup
              status:
                resourceName: elasticacheparametergroup-redis-params
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheParameterGroup
              metadata:
                name: redis-params
                namespace: elasticacheparametergroup
              spec:
                cacheParameterGroupName: elasticacheparametergroup-redis-params

    # AC-6: negative: missing-family advisory
    # When cacheParameterGroupFamily is empty, advisory ConfigMap is created (not admission rejection,
    # since kro v0.9.2 does not preserve x-kubernetes-validations).
    - name: ac6-missing-family-advisory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac6-cfg
                namespace: elasticacheparametergroup
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac6-cfg -n elasticacheparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: ac6-params
                namespace: elasticacheparametergroup
              spec:
                configRef: ac6-cfg
                cacheParameterGroupFamily: ""
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac6-params-missing-family-error
                namespace: elasticacheparametergroup

    # AC-7: happy-path: deletion-policy
    # delete and retain cases.
    - name: ac7-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac7-cfg
                namespace: elasticacheparametergroup
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac7-cfg -n elasticacheparametergroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: ac7-params-delete
                namespace: elasticacheparametergroup
              spec:
                configRef: ac7-cfg
                deletionPolicy: "delete"
                cacheParameterGroupFamily: "valkey8"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheParameterGroup
              metadata:
                name: ac7-params-retain
                namespace: elasticacheparametergroup
              spec:
                configRef: ac7-cfg
                cacheParameterGroupFamily: "valkey8"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheParameterGroup
              metadata:
                name: ac7-params-delete
                namespace: elasticacheparametergroup
                annotations:
                  services.k8s.aws/deletion-policy: delete
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheParameterGroup
              metadata:
                name: ac7-params-retain
                namespace: elasticacheparametergroup
                annotations:
                  services.k8s.aws/deletion-policy: retain
