# aws-ec-06 Chainsaw tests — ElastiCacheUser (KRO-413).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elasticacheuser
spec:
  skipDelete: true
  namespace: elasticacheuser
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: happy-path: basic-create
    # userName, engine, accessString forwarded verbatim to ACK User.
    - name: ac1-basic-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac1-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac1-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac1-user
                namespace: elasticacheuser
              spec:
                configRef: ac1-cfg
                userName: "app-reader"
                engine: "valkey"
                accessString: "on ~* &* +@read"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac1-user
                namespace: elasticacheuser
              spec:
                userName: "app-reader"
                engine: "valkey"
                accessString: "on ~* &* +@read"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac1-user
                namespace: elasticacheuser
              status:
                resourceName: elasticacheuser-ac1-user
                namingStatus: valid

    # AC-2: happy-path: iam-auth
    # authenticationMode.type: "iam" forwarded to ACK User.
    - name: ac2-iam-auth
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac2-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac2-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac2-user
                namespace: elasticacheuser
              spec:
                configRef: ac2-cfg
                userName: "iam-user"
                engine: "valkey"
                accessString: "on ~* &* +@all"
                authenticationMode:
                  type: "iam"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac2-user
                namespace: elasticacheuser
              spec:
                authenticationMode:
                  type: "iam"

    # AC-3: happy-path: password-auth
    # authenticationMode.type: "password" and passwords (SecretKeyRef) forwarded to ACK User.
    - name: ac3-password-auth
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac3-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac3-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ac3-pass-secret
                namespace: elasticacheuser
              stringData:
                password: "SecretPass123!"
              type: Opaque
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac3-user
                namespace: elasticacheuser
              spec:
                configRef: ac3-cfg
                userName: "password-user"
                engine: "valkey"
                accessString: "on ~* +@read"
                authenticationMode:
                  type: "password"
                  passwords:
                    - name: ac3-pass-secret
                      key: password
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac3-user
                namespace: elasticacheuser
              spec:
                authenticationMode:
                  type: "password"
                  passwords:
                    - name: ac3-pass-secret
                      key: password

    # AC-4: happy-path: no-password allowed
    # noPasswordRequired: true when governance does not block it.
    - name: ac4-no-password-allowed
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac4-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac4-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac4-user
                namespace: elasticacheuser
              spec:
                configRef: ac4-cfg
                userName: "anon-user"
                engine: "valkey"
                accessString: "on ~* +@read"
                noPasswordRequired: true
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac4-user
                namespace: elasticacheuser
              spec:
                noPasswordRequired: true

    # AC-5: negative: block-no-password
    # mandatory.blockNoPasswordUsers=true → advisory ConfigMap created, noPasswordRequired forced to false.
    - name: ac5-block-no-password
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac5-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  blockNoPasswordUsers: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac5-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":true,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac5-user
                namespace: elasticacheuser
              spec:
                configRef: ac5-cfg
                userName: "blocked-user"
                engine: "valkey"
                accessString: "on ~* +@read"
                noPasswordRequired: true
        # Advisory ConfigMap surfaced
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac5-user-no-password-blocked
                namespace: elasticacheuser
        # noPasswordRequired forced to false in ACK User
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac5-user
                namespace: elasticacheuser
              spec:
                noPasswordRequired: false

    # AC-6: happy-path: tag-merge
    # mandatory tags win; syncedLabels appear in both K8s labels and spec.tags.
    - name: ac6-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac6-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    tier: baseline
        - script:
            content: |
              kubectl patch elasticacheconfig ac6-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{"tier":"baseline"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac6-user
                namespace: elasticacheuser
              spec:
                configRef: ac6-cfg
                userName: "tagged-user"
                engine: "valkey"
                accessString: "on ~* +@read"
                tags:
                  app: orders
                syncedLabels:
                  environment: production
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: ac6-user
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/environment: production
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get user ac6-user -n elasticacheuser -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "cost-centre" and .value == "platform")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "tier" and .value == "baseline")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "app" and .value == "orders")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "environment" and .value == "production")) | length == 1'

    # AC-7: happy-path: naming-arn
    # status.resourceName and predictedArn from naming template.
    - name: ac7-naming-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac7-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac7-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: app-user
                namespace: elasticacheuser
              spec:
                configRef: ac7-cfg
                userName: "app-user"
                engine: "valkey"
                accessString: "on ~* +@read"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: app-user
                namespace: elasticacheuser
              status:
                resourceName: elasticacheuser-app-user
                predictedArn: "arn:aws:elasticache:ap-southeast-2:123456789012:user:elasticacheuser-app-user"

    # AC-8: negative: missing-username advisory
    # userName empty → advisory ConfigMap; ACK User not created.
    - name: ac8-missing-username-advisory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac8-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac8-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac8-user
                namespace: elasticacheuser
              spec:
                configRef: ac8-cfg
                engine: "valkey"
                accessString: "on ~* +@read"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac8-user-missing-username-error
                namespace: elasticacheuser

    # AC-9: negative: missing-engine advisory
    # engine="" → advisory ConfigMap created; ACK User not created.
    - name: ac9-missing-engine-advisory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac9-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac9-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac9-user
                namespace: elasticacheuser
              spec:
                configRef: ac9-cfg
                userName: "no-engine-user"
                engine: ""
                accessString: "on ~* +@read"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac9-user-missing-engine-error
                namespace: elasticacheuser
        - script:
            timeout: 60s
            content: |
              sleep 5
              COUNT=$(kubectl get user ac9-user -n elasticacheuser --ignore-not-found 2>/dev/null | wc -l)
              echo "ACK User count: $COUNT"
              test "$COUNT" -eq 0

    # AC-10: negative: missing-access-string advisory
    # accessString="" → advisory ConfigMap created; ACK User not created.
    - name: ac10-missing-access-string-advisory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac10-cfg
                namespace: elasticacheuser
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac10-cfg -n elasticacheuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheUser
              metadata:
                name: ac10-user
                namespace: elasticacheuser
              spec:
                configRef: ac10-cfg
                userName: "no-access-user"
                engine: "valkey"
                accessString: ""
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac10-user-missing-access-string-error
                namespace: elasticacheuser
        - script:
            timeout: 60s
            content: |
              sleep 5
              COUNT=$(kubectl get user ac10-user -n elasticacheuser --ignore-not-found 2>/dev/null | wc -l)
              echo "ACK User count: $COUNT"
              test "$COUNT" -eq 0
