# aws-ec-05 Chainsaw tests — ElastiCacheServerless (KRO-413).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elasticacheserverless
spec:
  skipDelete: true
  namespace: elasticacheserverless
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1 + AC-2: happy-path: basic-create with usage-limits
    # engine, cacheUsageLimits fields forwarded correctly.
    - name: ac1-basic-create-usage-limits
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac1-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac1-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac1-serverless
                namespace: elasticacheserverless
              spec:
                configRef: ac1-cfg
                engine: "valkey"
                dataStorageMaximumGB: 100
                ecpuPerSecondMaximum: 5000
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac1-serverless
                namespace: elasticacheserverless
              spec:
                engine: "valkey"
                cacheUsageLimits:
                  dataStorage:
                    maximum: 100
                    unit: Gigabytes
                  eCPUPerSecond:
                    maximum: 5000
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac1-serverless
                namespace: elasticacheserverless
              status:
                resourceName: elasticacheserverless-ac1-serverless
                namingStatus: valid

    # AC-2: happy-path: usage-limits
    # dataStorageMaximumGB=0 and ecpuPerSecondMaximum=0 forwarded as "no limit" to ACK.
    - name: ac2-usage-limits
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac2-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac2-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac2-serverless
                namespace: elasticacheserverless
              spec:
                configRef: ac2-cfg
                engine: "valkey"
                dataStorageMaximumGB: 0
                ecpuPerSecondMaximum: 0
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac2-serverless
                namespace: elasticacheserverless
              spec:
                cacheUsageLimits:
                  dataStorage:
                    maximum: 0
                    unit: Gigabytes
                  eCPUPerSecond:
                    maximum: 0

    # AC-3: happy-path: tag-merge
    # mandatory, spec, defaults tags all merged.
    - name: ac3-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac3-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  tags:
                    service: cache
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    owner: platform-team
        - script:
            content: |
              kubectl patch elasticacheconfig ac3-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{"service":"cache"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{"owner":"platform-team"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac3-serverless
                namespace: elasticacheserverless
              spec:
                configRef: ac3-cfg
                engine: "valkey"
                tags:
                  app: sessions
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac3-serverless
                namespace: elasticacheserverless
              spec:
                engine: "valkey"
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get serverlesscache ac3-serverless -n elasticacheserverless -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "service" and .value == "cache")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "owner" and .value == "platform-team")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "app" and .value == "sessions")) | length == 1'

    # AC-4: happy-path: synced-labels
    # mandatory.syncedLabels forwarded to ACK labels (prefixed) and spec.tags.
    - name: ac4-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac4-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac4-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac4-serverless
                namespace: elasticacheserverless
              spec:
                configRef: ac4-cfg
                engine: "valkey"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac4-serverless
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/environment: production
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get serverlesscache ac4-serverless -n elasticacheserverless -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "environment" and .value == "production")) | length == 1'

    # AC-5: happy-path: naming-arn
    # status.resourceName and status.predictedArn derived correctly.
    - name: ac5-naming-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac5-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac5-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: sessions
                namespace: elasticacheserverless
              spec:
                configRef: ac5-cfg
                engine: "valkey"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: sessions
                namespace: elasticacheserverless
              status:
                resourceName: elasticacheserverless-sessions
                predictedArn: "arn:aws:elasticache:ap-southeast-2:123456789012:serverlesscache:elasticacheserverless-sessions"

    # AC-6: happy-path: snapshot-governance
    # mandatory.snapshotRetentionLimit: 5 raises instance value 2 to the floor.
    - name: ac6-snapshot-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac6-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  snapshotRetentionLimit: 5
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac6-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":5,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac6-serverless
                namespace: elasticacheserverless
              spec:
                configRef: ac6-cfg
                engine: "valkey"
                snapshotRetentionLimit: 2
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac6-serverless
                namespace: elasticacheserverless
              spec:
                snapshotRetentionLimit: 5

    # AC-7: happy-path: mandatory-engine
    # mandatory.engine: "redis" overrides instance "valkey".
    - name: ac7-mandatory-engine
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac7-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory:
                  engine: "redis"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac7-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"redis","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac7-serverless
                namespace: elasticacheserverless
              spec:
                configRef: ac7-cfg
                engine: "valkey"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac7-serverless
                namespace: elasticacheserverless
              spec:
                engine: "redis"

    # AC-8: happy-path: rbac-usergroup
    # spec.userGroupID forwarded verbatim to ACK ServerlessCache.
    - name: ac8-rbac-usergroup
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac8-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac8-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac8-serverless
                namespace: elasticacheserverless
              spec:
                configRef: ac8-cfg
                engine: "valkey"
                userGroupID: "my-user-group"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac8-serverless
                namespace: elasticacheserverless
              spec:
                userGroupID: "my-user-group"

    # AC-9: happy-path: kms-key
    # spec.kmsKeyID forwarded verbatim to ACK ServerlessCache.
    - name: ac9-kms-key
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac9-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac9-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac9-serverless
                namespace: elasticacheserverless
              spec:
                configRef: ac9-cfg
                engine: "valkey"
                kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/test-key"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac9-serverless
                namespace: elasticacheserverless
              spec:
                kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/test-key"

    # AC-10: negative: immutable-engine
    # engine="" → includeWhen gate blocks ACK ServerlessCache creation.
    # Documents that engine is required and immutable once set (ACK enforces immutability).
    - name: ac10-immutable-engine-negative
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac10-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac10-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac10-serverless
                namespace: elasticacheserverless
              spec:
                configRef: ac10-cfg
                engine: ""
        # engine="" triggers the includeWhen guard — ACK ServerlessCache must NOT be created.
        - script:
            timeout: 60s
            content: |
              sleep 5
              COUNT=$(kubectl get serverlesscache ac10-serverless -n elasticacheserverless --ignore-not-found 2>/dev/null | wc -l)
              echo "ServerlessCache count: $COUNT"
              test "$COUNT" -eq 0

    # AC-11: happy-path: deletion-policy
    # delete and retain propagate to ACK annotation.
    - name: ac11-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac11-cfg
                namespace: elasticacheserverless
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac11-cfg -n elasticacheserverless \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac11-serverless-delete
                namespace: elasticacheserverless
              spec:
                configRef: ac11-cfg
                engine: "valkey"
                deletionPolicy: "delete"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheServerless
              metadata:
                name: ac11-serverless-retain
                namespace: elasticacheserverless
              spec:
                configRef: ac11-cfg
                engine: "valkey"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac11-serverless-delete
                namespace: elasticacheserverless
                annotations:
                  services.k8s.aws/deletion-policy: delete
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ServerlessCache
              metadata:
                name: ac11-serverless-retain
                namespace: elasticacheserverless
                annotations:
                  services.k8s.aws/deletion-policy: retain
