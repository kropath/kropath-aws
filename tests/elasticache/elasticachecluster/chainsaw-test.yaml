# aws-ec-08 Chainsaw tests — ElastiCacheCluster (KRO-413).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elasticachecluster
spec:
  skipDelete: true
  namespace: elasticachecluster
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: happy-path: basic-memcached
    # engine, cacheNodeType, numCacheNodes forwarded to ACK CacheCluster.
    - name: ac1-basic-memcached
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac1-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac1-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac1-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac1-cfg
                engine: "memcached"
                cacheNodeType: "cache.m7g.large"
                numCacheNodes: 3
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac1-cluster
                namespace: elasticachecluster
              spec:
                engine: "memcached"
                cacheNodeType: "cache.m7g.large"
                numCacheNodes: 3
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac1-cluster
                namespace: elasticachecluster
              status:
                resourceName: elasticachecluster-ac1-cluster
                namingStatus: valid

    # AC-2: happy-path: basic-redis
    # engine: redis, numCacheNodes unset → resolves to 1.
    - name: ac2-basic-redis
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac2-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac2-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac2-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac2-cfg
                engine: "redis"
                cacheNodeType: "cache.t4g.micro"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac2-cluster
                namespace: elasticachecluster
              spec:
                engine: "redis"
                numCacheNodes: 1

    # AC-3: happy-path: mandatory-transit-encryption
    # mandatory.transitEncryptionEnabled: true overrides instance false.
    - name: ac3-mandatory-transit-encryption
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac3-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  transitEncryptionEnabled: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac3-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":true,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac3-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac3-cfg
                engine: "redis"
                cacheNodeType: "cache.r7g.large"
                transitEncryptionEnabled: false
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac3-cluster
                namespace: elasticachecluster
              spec:
                transitEncryptionEnabled: true

    # AC-4: happy-path: snapshot-governance
    # mandatory.snapshotRetentionLimit: 5 raises instance value 2 to the floor.
    - name: ac4-snapshot-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac4-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  snapshotRetentionLimit: 5
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac4-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":5,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac4-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac4-cfg
                engine: "redis"
                cacheNodeType: "cache.r7g.large"
                snapshotRetentionLimit: 2
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac4-cluster
                namespace: elasticachecluster
              spec:
                snapshotRetentionLimit: 5

    # AC-5: happy-path: tag-merge
    # mandatory, spec, defaults tags all merged; mandatory wins on conflict.
    - name: ac5-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac5-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: platform
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    tier: baseline
        - script:
            content: |
              kubectl patch elasticacheconfig ac5-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{"tier":"baseline"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac5-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac5-cfg
                engine: "memcached"
                cacheNodeType: "cache.m7g.large"
                tags:
                  app: cache
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac5-cluster
                namespace: elasticachecluster
              spec:
                engine: "memcached"
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get cacheclusters.elasticache.services.k8s.aws ac5-cluster -n elasticachecluster -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "cost-centre" and .value == "platform")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "tier" and .value == "baseline")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "app" and .value == "cache")) | length == 1'

    # AC-7: happy-path: naming-arn
    # status.resourceName and predictedArn from naming template.
    - name: ac7-naming-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac7-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac7-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: memcached-01
                namespace: elasticachecluster
              spec:
                configRef: ac7-cfg
                engine: "memcached"
                cacheNodeType: "cache.m7g.large"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: memcached-01
                namespace: elasticachecluster
              status:
                resourceName: elasticachecluster-memcached-01
                predictedArn: "arn:aws:elasticache:ap-southeast-2:123456789012:cluster:elasticachecluster-memcached-01"

    # AC-8: happy-path: mandatory-engine
    # mandatory.engine: "valkey" overrides instance "redis".
    - name: ac8-mandatory-engine
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac8-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory:
                  engine: "valkey"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac8-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"valkey","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac8-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac8-cfg
                engine: "redis"
                cacheNodeType: "cache.r7g.large"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac8-cluster
                namespace: elasticachecluster
              spec:
                engine: "valkey"

    # AC-9: negative: redis-multi-node advisory
    # redis engine + numCacheNodes > 1 → multiNodeRedisError advisory ConfigMap created.
    - name: ac9-redis-multi-node-advisory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac9-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac9-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac9-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac9-cfg
                engine: "redis"
                cacheNodeType: "cache.r7g.large"
                numCacheNodes: 3
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac9-cluster-multi-node-redis-error
                namespace: elasticachecluster

    # AC-10: happy-path: memcached-cross-az
    # azMode and preferredAvailabilityZones forwarded for memcached multi-node.
    - name: ac10-memcached-cross-az
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac10-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac10-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac10-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac10-cfg
                engine: "memcached"
                cacheNodeType: "cache.m7g.large"
                numCacheNodes: 3
                azMode: "cross-az"
                preferredAvailabilityZones:
                  - ap-southeast-2a
                  - ap-southeast-2b
                  - ap-southeast-2c
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac10-cluster
                namespace: elasticachecluster
              spec:
                azMode: "cross-az"
                preferredAvailabilityZones:
                  - ap-southeast-2a
                  - ap-southeast-2b
                  - ap-southeast-2c

    # AC-11: happy-path: deletion-policy
    # delete and retain propagate to ACK annotation.
    - name: ac11-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac11-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac11-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac11-cluster-delete
                namespace: elasticachecluster
              spec:
                configRef: ac11-cfg
                deletionPolicy: "delete"
                engine: "memcached"
                cacheNodeType: "cache.m7g.large"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac11-cluster-retain
                namespace: elasticachecluster
              spec:
                configRef: ac11-cfg
                engine: "memcached"
                cacheNodeType: "cache.m7g.large"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac11-cluster-delete
                namespace: elasticachecluster
                annotations:
                  services.k8s.aws/deletion-policy: delete
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac11-cluster-retain
                namespace: elasticachecluster
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-12: negative: no-at-rest-encryption field on CacheCluster
    # mandatory.atRestEncryptionEnabled=true has no effect on CacheCluster (no such field).
    # Reconciliation succeeds; no at-rest field on the ACK CacheCluster spec.
    - name: ac12-no-at-rest-encryption
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac12-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                mandatory:
                  atRestEncryptionEnabled: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac12-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":true,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac12-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac12-cfg
                engine: "memcached"
                cacheNodeType: "cache.m7g.large"
        # ACK CacheCluster created successfully (no at-rest field = not a failure)
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac12-cluster
                namespace: elasticachecluster
              spec:
                engine: "memcached"
                cacheNodeType: "cache.m7g.large"

    # AC-6 (cluster): happy-path: synced-labels
    # mandatory.syncedLabels forwarded to ACK CacheCluster labels and spec.tags.
    - name: ac6-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac6-cfg
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac6-cfg -n elasticachecluster \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheCluster
              metadata:
                name: ac6-cluster
                namespace: elasticachecluster
              spec:
                configRef: ac6-cfg
                engine: "memcached"
                cacheNodeType: "cache.t3.micro"
                numCacheNodes: 1
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: CacheCluster
              metadata:
                name: ac6-cluster
                namespace: elasticachecluster
                labels:
                  aws.kropath.run/environment: production
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get cacheclusters.elasticache.services.k8s.aws ac6-cluster -n elasticachecluster -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "environment" and .value == "production")) | length == 1'
