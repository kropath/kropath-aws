# aws-ec-04 Chainsaw tests — ElastiCacheReplicationGroup (KRO-413).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elasticachereplicationgroup
spec:
  skipDelete: true
  namespace: elasticachereplicationgroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: happy-path: basic-create
    # engine, cacheNodeType, description forwarded verbatim.
    - name: ac1-basic-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac1-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac1-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac1-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac1-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
                description: "prod cache"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac1-rg
                namespace: elasticachereplicationgroup
              spec:
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
                description: "prod cache"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac1-rg
                namespace: elasticachereplicationgroup
              status:
                resourceName: elasticachereplicationgroup-ac1-rg
                namingStatus: valid

    # AC-2: happy-path: mandatory-encryption-at-rest
    # mandatory.atRestEncryptionEnabled: true overrides instance false.
    - name: ac2-mandatory-encryption-at-rest
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac2-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  atRestEncryptionEnabled: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac2-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":true,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac2-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac2-cfg
                engine: "redis"
                cacheNodeType: "cache.r7g.large"
                atRestEncryptionEnabled: false
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac2-rg
                namespace: elasticachereplicationgroup
              spec:
                atRestEncryptionEnabled: true

    # AC-3: happy-path: defaults-transit-encryption
    # defaults.transitEncryptionEnabled: true applied when spec is unset.
    - name: ac3-defaults-transit-encryption
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac3-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  transitEncryptionEnabled: true
        - script:
            content: |
              kubectl patch elasticacheconfig ac3-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":true,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac3-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac3-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac3-rg
                namespace: elasticachereplicationgroup
              spec:
                transitEncryptionEnabled: true

    # AC-4: happy-path: ha-coupling
    # mandatory.multiAZEnabled=true forces both multiAZEnabled and automaticFailoverEnabled in ACK.
    - name: ac4-ha-coupling
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac4-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  automaticFailoverEnabled: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac4-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":true,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac4-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac4-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
                automaticFailoverEnabled: false
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac4-rg
                namespace: elasticachereplicationgroup
              spec:
                automaticFailoverEnabled: true

    # AC-5: negative: multiaz-without-failover
    # multiAZEnabled=true forces automaticFailoverEnabled=true regardless of instance intent.
    - name: ac5-multiaz-forces-failover
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac5-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac5-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac5-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac5-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
                multiAZEnabled: true
                automaticFailoverEnabled: false
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac5-rg
                namespace: elasticachereplicationgroup
              spec:
                multiAZEnabled: true
                automaticFailoverEnabled: true

    # AC-6: happy-path: mandatory-snapshot-floor
    # mandatory.snapshotRetentionLimit: 7 raises instance value 3 to the floor.
    - name: ac6-mandatory-snapshot-floor
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac6-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  snapshotRetentionLimit: 7
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac6-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":7,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac6-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac6-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
                snapshotRetentionLimit: 3
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac6-rg
                namespace: elasticachereplicationgroup
              spec:
                snapshotRetentionLimit: 7

    # AC-7: happy-path: snapshot-disable-blocked
    # mandatory.snapshotRetentionLimit floor prevents instance from disabling snapshots (setting 0).
    - name: ac7-snapshot-disable-blocked
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac7-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory:
                  snapshotRetentionLimit: 7
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac7-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":7,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac7-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac7-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
                snapshotRetentionLimit: 0
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac7-rg
                namespace: elasticachereplicationgroup
              spec:
                snapshotRetentionLimit: 7

    # AC-8: happy-path: tag-merge
    # mandatory tags win on key conflict; all tiers merged.
    - name: ac8-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac8-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory:
                  tags:
                    service: cache
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    owner: platform-team
        - script:
            content: |
              kubectl patch elasticacheconfig ac8-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{"service":"cache"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{"owner":"platform-team"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac8-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac8-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
                tags:
                  app: orders
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac8-rg
                namespace: elasticachereplicationgroup
              spec:
                engine: "valkey"
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get replicationgroups.elasticache.services.k8s.aws ac8-rg -n elasticachereplicationgroup -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "service" and .value == "cache")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "owner" and .value == "platform-team")) | length == 1' && \
              echo "$TAGS" | jq -e 'map(select(.key == "app" and .value == "orders")) | length == 1'

    # AC-9: happy-path: synced-labels
    # mandatory.syncedLabels forwarded to ACK labels (prefixed) and spec.tags.
    - name: ac9-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac9-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac9-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac9-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac9-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac9-rg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/environment: production
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get replicationgroups.elasticache.services.k8s.aws ac9-rg -n elasticachereplicationgroup -o json | jq -r '.spec.tags // []')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e 'map(select(.key == "environment" and .value == "production")) | length == 1'

    # AC-10: happy-path: naming-arn
    # status.resourceName and status.predictedArn derived from naming template.
    - name: ac10-naming-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac10-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac10-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: sessions
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac10-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: sessions
                namespace: elasticachereplicationgroup
              status:
                resourceName: elasticachereplicationgroup-sessions
                predictedArn: "arn:aws:elasticache:ap-southeast-2:123456789012:replicationgroup:elasticachereplicationgroup-sessions"

    # AC-15: happy-path: mandatory-engine
    # mandatory.engine: "redis" overrides instance "valkey".
    - name: ac15-mandatory-engine
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac15-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac15-cfg
              spec:
                mandatory:
                  engine: "redis"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac15-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"redis","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac15-rg
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac15-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac15-rg
                namespace: elasticachereplicationgroup
              spec:
                engine: "redis"

    # AC-13: happy-path: deletion-policy
    # delete and retain propagate to ACK annotation.
    - name: ac13-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: ac13-cfg
                namespace: elasticachereplicationgroup
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch elasticacheconfig ac13-cfg -n elasticachereplicationgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac13-rg-delete
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac13-cfg
                deletionPolicy: "delete"
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheReplicationGroup
              metadata:
                name: ac13-rg-retain
                namespace: elasticachereplicationgroup
              spec:
                configRef: ac13-cfg
                engine: "valkey"
                cacheNodeType: "cache.r7g.large"
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac13-rg-delete
                namespace: elasticachereplicationgroup
                annotations:
                  services.k8s.aws/deletion-policy: delete
        - assert:
            resource:
              apiVersion: elasticache.services.k8s.aws/v1alpha1
              kind: ReplicationGroup
              metadata:
                name: ac13-rg-retain
                namespace: elasticachereplicationgroup
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-11: happy-path: name-override
    # spec.nameOverride bypasses naming template; replicationGroupID uses the override.
