# AC-5: ElastiCacheConfig with mandatory.engine: "redis" — restricts engine choice.
---
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: pci-engine
  namespace: elasticacheconfig
  labels:
    aws.kropath.run/resource-name: pci-engine
spec:
  mandatory:
    atRestEncryptionEnabled: false
    transitEncryptionEnabled: false
    automaticFailoverEnabled: false
    multiAZEnabled: false
    engine: "redis"
    blockNoPasswordUsers: false
    snapshotRetentionLimit: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    atRestEncryptionEnabled: false
    transitEncryptionEnabled: false
    automaticFailoverEnabled: false
    multiAZEnabled: false
    engine: ""
    blockNoPasswordUsers: false
    snapshotRetentionLimit: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
