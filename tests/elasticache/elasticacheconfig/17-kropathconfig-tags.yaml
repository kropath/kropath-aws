# AC-7: KropathConfig with mandatory.tags: {cost-centre: infra} — contributes to merged effectiveConfig tags.
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: elasticacheconfig
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    tags:
      cost-centre: infra
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: ""
    elasticache:
      atRestEncryptionEnabled: false
      transitEncryptionEnabled: false
  defaults:
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: ""
    elasticache:
      atRestEncryptionEnabled: false
      transitEncryptionEnabled: false
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
