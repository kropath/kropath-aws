# aws-ec-01 Chainsaw tests — 10 acceptance criteria for ElastiCacheConfig CRD (KRO-411).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elasticacheconfig
spec:
  namespace: elasticacheconfig
  steps:
    # AC-1 (OD-1): general-policy ElastiCacheConfig with zero mandatory values and secure defaults
    # is admitted by the API server.
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-elasticacheconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: general-policy
                namespace: elasticacheconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  atRestEncryptionEnabled: false
                  transitEncryptionEnabled: false
                  automaticFailoverEnabled: false
                  multiAZEnabled: false
                defaults:
                  atRestEncryptionEnabled: true
                  transitEncryptionEnabled: true
                  automaticFailoverEnabled: true
                  multiAZEnabled: true
                  engine: "valkey"
                  snapshotRetentionLimit: 1
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    # AC-2 (OD-2): strict-compliance ElastiCacheConfig with mandatory enforcement fields set
    # is admitted by the API server.
    - name: ac2-strict-compliance-accepted
      try:
        - apply:
            file: 02-strict-compliance.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: strict-compliance
                namespace: elasticacheconfig
                labels:
                  aws.kropath.run/resource-name: strict-compliance
              spec:
                mandatory:
                  atRestEncryptionEnabled: true
                  transitEncryptionEnabled: true
                  automaticFailoverEnabled: true
                  multiAZEnabled: true
                  engine: "valkey"
                  blockNoPasswordUsers: true
                  snapshotRetentionLimit: 7
      cleanup:
        - delete:
            file: 02-strict-compliance.yaml

    # AC-3 (OD-3): atRestEncryptionEnabled: true in BOTH mandatory and defaults is rejected.
    - name: ac3-reject-dual-tier-atrestencryption
      try:
        - apply:
            file: 03-invalid-dual-tier-atrestencryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ElastiCacheConfig
                check:
                  ($error != null): true

    # AC-4 (OD-3): transitEncryptionEnabled: true in BOTH mandatory and defaults is rejected.
    - name: ac4-reject-dual-tier-transitencryption
      try:
        - apply:
            file: 04-invalid-dual-tier-transitencryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ElastiCacheConfig
                check:
                  ($error != null): true

    # AC-5 (OD-3): automaticFailoverEnabled: true in BOTH mandatory and defaults is rejected.
    - name: ac5-reject-dual-tier-automaticfailover
      try:
        - apply:
            file: 05-invalid-dual-tier-automaticfailover.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ElastiCacheConfig
                check:
                  ($error != null): true

    # AC-6 (OD-3): multiAZEnabled: true in BOTH mandatory and defaults is rejected.
    - name: ac6-reject-dual-tier-multiaz
      try:
        - apply:
            file: 06-invalid-dual-tier-multiaz.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ElastiCacheConfig
                check:
                  ($error != null): true

    # AC-7 (OD-3): snapshotRetentionLimit > 0 in BOTH mandatory and defaults is rejected.
    - name: ac7-reject-dual-tier-snapshotretention
      try:
        - apply:
            file: 07-invalid-dual-tier-snapshotretention.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ElastiCacheConfig
                check:
                  ($error != null): true

    # AC-8 (OD-3): namingTemplate != "" in BOTH mandatory and defaults is rejected.
    - name: ac8-reject-dual-tier-namingtemplate
      try:
        - apply:
            file: 08-invalid-dual-tier-namingtemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ElastiCacheConfig
                check:
                  ($error != null): true

    # AC-9 (OD-3): engine != "" in BOTH mandatory and defaults is rejected.
    - name: ac9-reject-dual-tier-engine
      try:
        - apply:
            file: 09-invalid-dual-tier-engine.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ElastiCacheConfig
                check:
                  ($error != null): true

    # AC-10 (OD-4): blockNoPasswordUsers: true in BOTH mandatory and defaults is rejected.
    - name: ac10-reject-dual-tier-blocknopasswordusers
      try:
        - apply:
            file: 10-invalid-dual-tier-blocknopasswordusers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ElastiCacheConfig
                check:
                  ($error != null): true
