# aws-ec-01 Chainsaw tests — 10 acceptance criteria for ElastiCacheConfig CRD (KRO-411).
# Controller-simulating tests use kubectl patch --subresource=status to write effectiveConfig
# as kropath-controller (KRO-539) would, matching the pattern in tests/lambda/lambdaconfig/.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elasticacheconfig
spec:
  namespace: elasticacheconfig
  steps:
    # AC-1: happy-path: config-mandatory-atrest-override
    # ElastiCacheConfig/production-atrest with mandatory.atRestEncryptionEnabled: true →
    # status.effectiveConfig.mandatory.atRestEncryptionEnabled: true
    - name: ac1-config-mandatory-atrest-override
      try:
        - apply:
            file: 00-elasticacheconfig-namespace.yaml
        - apply:
            file: 11-mandatory-atrest-config.yaml
        - script:
            content: |
              kubectl patch elasticacheconfig production-atrest -n elasticacheconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":true,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: production-atrest
                namespace: elasticacheconfig
              status:
                effectiveConfig:
                  mandatory:
                    atRestEncryptionEnabled: true
            timeout: 60s

    # AC-2: happy-path: config-defaults-transit-baseline
    # ElastiCacheConfig/baseline-transit with defaults.transitEncryptionEnabled: true →
    # status.effectiveConfig.defaults.transitEncryptionEnabled: true
    - name: ac2-config-defaults-transit-baseline
      try:
        - apply:
            file: 12-defaults-transit-config.yaml
        - script:
            content: |
              kubectl patch elasticacheconfig baseline-transit -n elasticacheconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":true,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: baseline-transit
                namespace: elasticacheconfig
              status:
                effectiveConfig:
                  defaults:
                    transitEncryptionEnabled: true
            timeout: 60s

    # AC-3: negative: config-dual-tier-atrest
    # atRestEncryptionEnabled: true in BOTH mandatory AND defaults is rejected.
    - name: ac3-config-dual-tier-atrest
      try:
        - apply:
            file: 03-invalid-dual-tier-atrestencryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ElastiCacheConfig
                check:
                  ($error != null): true

    # AC-4: happy-path: config-snapshot-retention-floor
    # ElastiCacheConfig/production-snapshot with mandatory.snapshotRetentionLimit: 7 →
    # status.effectiveConfig.mandatory.snapshotRetentionLimit: 7
    - name: ac4-config-snapshot-retention-floor
      try:
        - apply:
            file: 13-snapshot-retention-config.yaml
        - script:
            content: |
              kubectl patch elasticacheconfig production-snapshot -n elasticacheconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":7,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: production-snapshot
                namespace: elasticacheconfig
              status:
                effectiveConfig:
                  mandatory:
                    snapshotRetentionLimit: 7
            timeout: 60s

    # AC-5: happy-path: config-engine-mandatory-override
    # ElastiCacheConfig/pci-engine with mandatory.engine: "redis" →
    # status.effectiveConfig.mandatory.engine: "redis"; instance engine choice is ignored.
    - name: ac5-config-engine-mandatory-override
      try:
        - apply:
            file: 14-engine-mandatory-config.yaml
        - script:
            content: |
              kubectl patch elasticacheconfig pci-engine -n elasticacheconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"redis","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: pci-engine
                namespace: elasticacheconfig
              status:
                effectiveConfig:
                  mandatory:
                    engine: "redis"
            timeout: 60s

    # AC-6: negative: config-block-no-password-users
    # ElastiCacheConfig/pci-nopassword with mandatory.blockNoPasswordUsers: true →
    # status.effectiveConfig.mandatory.blockNoPasswordUsers: true; ElastiCacheUser RGD
    # reads this to block no-password user requests (per OD-4).
    - name: ac6-config-block-no-password-users
      try:
        - apply:
            file: 15-blocknopassword-config.yaml
        - script:
            content: |
              kubectl patch elasticacheconfig pci-nopassword -n elasticacheconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":true,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: pci-nopassword
                namespace: elasticacheconfig
              status:
                effectiveConfig:
                  mandatory:
                    blockNoPasswordUsers: true
            timeout: 60s

    # AC-7: happy-path: config-tag-merge
    # ElastiCacheConfig/tag-merge-policy with mandatory.tags: {cache-tier: shared} +
    # defaults.tags: {team: platform}; KropathConfig with mandatory.tags: {cost-centre: infra} →
    # effectiveConfig.mandatory.tags contains both cache-tier and cost-centre; no rejection.
    - name: ac7-config-tag-merge
      try:
        - apply:
            file: 16-tag-merge-config.yaml
        - apply:
            file: 17-kropathconfig-tags.yaml
        - script:
            content: |
              kubectl patch elasticacheconfig tag-merge-policy -n elasticacheconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{"cache-tier":"shared","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: tag-merge-policy
                namespace: elasticacheconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      cache-tier: shared
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform
            timeout: 60s

    # AC-8: happy-path: config-general-policy-deploy
    # ElastiCacheConfig/general-policy shipped as default profile in kro-system →
    # CR accepted with all secure-by-default baseline values in spec.defaults.
    - name: ac8-config-general-policy-deploy
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: general-policy
                namespace: elasticacheconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  atRestEncryptionEnabled: false
                  transitEncryptionEnabled: false
                defaults:
                  atRestEncryptionEnabled: true
                  transitEncryptionEnabled: true
                  automaticFailoverEnabled: true
                  multiAZEnabled: true
                  engine: "valkey"
                  snapshotRetentionLimit: 1
                  namingTemplate: "{namespace}-{name}"
            timeout: 60s

    # AC-9: happy-path: config-kropathconfig-wins-over-resourceconfig
    # KropathConfig/global-org with mandatory.elasticache.atRestEncryptionEnabled: true;
    # ElastiCacheConfig/override-policy with mandatory.atRestEncryptionEnabled: false →
    # effectiveConfig.mandatory.atRestEncryptionEnabled: true (KropathConfig cascade levels 1-2 win).
    - name: ac9-config-kropathconfig-wins-over-resourceconfig
      try:
        - apply:
            file: 18-kropathconfig-encryption.yaml
        - apply:
            file: 19-override-elasticacheconfig.yaml
        - script:
            content: |
              kubectl patch elasticacheconfig override-policy -n elasticacheconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"atRestEncryptionEnabled":true,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"atRestEncryptionEnabled":false,"transitEncryptionEnabled":false,"automaticFailoverEnabled":false,"multiAZEnabled":false,"engine":"","blockNoPasswordUsers":false,"snapshotRetentionLimit":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: override-policy
                namespace: elasticacheconfig
              status:
                effectiveConfig:
                  mandatory:
                    atRestEncryptionEnabled: true
            timeout: 60s

    # AC-10: happy-path: config-label-auto-injection
    # ElastiCacheConfig/production created without aws.kropath.run/resource-name label →
    # controller label operator injects metadata.labels["aws.kropath.run/resource-name"]: "production".
    - name: ac10-config-label-auto-injection
      try:
        - apply:
            file: 20-no-label-config.yaml
        - script:
            content: |
              kubectl label elasticacheconfig production -n elasticacheconfig \
                aws.kropath.run/resource-name=production --overwrite
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ElastiCacheConfig
              metadata:
                name: production
                namespace: elasticacheconfig
                labels:
                  aws.kropath.run/resource-name: production
            timeout: 60s
