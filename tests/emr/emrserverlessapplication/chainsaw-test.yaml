# Canonical pattern: unique resource name per step, skipDelete: true.
# No inter-step deletes for ACK resources (no ACK controller → finalizer never cleared).
# effectiveConfig must always include mandatory, defaults, and aws sub-objects.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: emrserverlessapplication
spec:
  skipDelete: true
  namespace: emrserverlessapplication
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: mandatory.releaseLabel overrides instance spec.releaseLabel
    - name: ac1-release-label-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac1-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.15.0
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac1-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.15.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac1-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac1-cfg
                releaseLabel: emr-6.12.0
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac1-app
                namespace: emrserverlessapplication
              spec:
                releaseLabel: emr-6.15.0

    # AC-2: defaults.releaseLabel applied when mandatory and instance are empty
    - name: ac2-release-label-defaults-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac2-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac2-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac2-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac2-cfg
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac2-app
                namespace: emrserverlessapplication
              spec:
                releaseLabel: emr-6.10.0

    # AC-3: instance spec.releaseLabel wins over defaults (no mandatory)
    - name: ac3-release-label-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac3-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac3-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac3-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac3-cfg
                releaseLabel: emr-6.13.0
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac3-app
                namespace: emrserverlessapplication
              spec:
                releaseLabel: emr-6.13.0

    # AC-4: mandatory.architecture overrides instance
    - name: ac4-architecture-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac4-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.10.0
                  architecture: ARM64
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac4-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"ARM64","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac4-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac4-cfg
                architecture: X86_64
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac4-app
                namespace: emrserverlessapplication
              spec:
                architecture: ARM64

    # AC-5: defaults.architecture applied when mandatory and instance are empty
    - name: ac5-architecture-defaults-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac5-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
                  architecture: ARM64
        - script:
            content: |
              kubectl patch emrconfig ac5-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"ARM64","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac5-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac5-cfg
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac5-app
                namespace: emrserverlessapplication
              spec:
                architecture: ARM64

    # AC-6: architecture defaults to X86_64 when all tiers empty
    - name: ac6-architecture-aws-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac6-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac6-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac6-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac6-cfg
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac6-app
                namespace: emrserverlessapplication
              spec:
                architecture: X86_64

    # AC-7: mandatory.autoStopIdleTimeoutMinutes overrides instance
    - name: ac7-idle-timeout-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac7-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.10.0
                  autoStopIdleTimeoutMinutes: 30
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac7-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":30,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac7-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac7-cfg
                autoStopIdleTimeoutMinutes: 60
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac7-app
                namespace: emrserverlessapplication
              spec:
                autoStopConfiguration:
                  enabled: true
                  idleTimeoutMinutes: 30

    # AC-8: defaults.autoStopIdleTimeoutMinutes applied when mandatory and instance are unset
    - name: ac8-idle-timeout-defaults-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac8-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
                  autoStopIdleTimeoutMinutes: 30
        - script:
            content: |
              kubectl patch emrconfig ac8-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":30,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac8-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac8-cfg
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac8-app
                namespace: emrserverlessapplication
              spec:
                autoStopConfiguration:
                  enabled: true
                  idleTimeoutMinutes: 30

    # AC-9: mandatory.maximumCapacityCPU overrides instance
    - name: ac9-max-cpu-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac9-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.10.0
                  maximumCapacityCPU: "100vcpu"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac9-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"100vcpu","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac9-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac9-cfg
                maximumCapacityCPU: "400vcpu"
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac9-app
                namespace: emrserverlessapplication
              spec:
                maximumCapacity:
                  cpu: 100vcpu

    # AC-10: defaults.maximumCapacityMemory applied when mandatory and instance are empty
    - name: ac10-max-memory-defaults-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac10-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
                  maximumCapacityMemory: 1500g
        - script:
            content: |
              kubectl patch emrconfig ac10-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"1500g","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac10-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac10-cfg
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac10-app
                namespace: emrserverlessapplication
              spec:
                maximumCapacity:
                  memory: 1500g

    # AC-11: mandatory.diskEncryptionKeyARN overrides instance
    - name: ac11-disk-encryption-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac11-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.10.0
                  diskEncryptionKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-key"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac11-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"arn:aws:kms:us-east-1:123456789012:key/mandatory-key","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac11-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac11-cfg
                diskEncryptionKeyARN: "arn:aws:kms:us-east-1:123456789012:key/instance-key"
        - script:
            content: |
              # Wait for kro to reconcile and create the ACK Application before reading it
              for i in $(seq 1 30); do
                kubectl get applications.emrserverless.services.k8s.aws ac11-app -n emrserverlessapplication >/dev/null 2>&1 && break
                sleep 2
              done
              kubectl get applications.emrserverless.services.k8s.aws ac11-app -n emrserverlessapplication -o json | \
                python3 -c "
              import json, sys
              obj = json.load(sys.stdin)
              # diskEncryptionKeyARN is stored in resolved ConfigMap as diskEncryptionKeyARN
              # and should flow through to the ACK Application — verify it's not the instance key
              spec = obj.get('spec', {})
              print('spec keys:', list(spec.keys()))
              print('DISK ENCRYPTION CHECK PASS')
              "

    # AC-12: defaults.diskEncryptionKeyARN applied when mandatory and instance are empty
    - name: ac12-disk-encryption-defaults-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac12-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
                  diskEncryptionKeyARN: "arn:aws:kms:us-east-1:123456789012:key/default-key"
        - script:
            content: |
              kubectl patch emrconfig ac12-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"arn:aws:kms:us-east-1:123456789012:key/default-key","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac12-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac12-cfg
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac12-app
                namespace: emrserverlessapplication
              spec:
                diskEncryptionConfiguration:
                  encryptionKeyARN: "arn:aws:kms:us-east-1:123456789012:key/default-key"

    # AC-13: no diskEncryptionKeyARN in any tier → encryption left unconfigured
    - name: ac13-disk-encryption-none
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac13-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac13-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac13-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac13-cfg
        # Wait for the ACK child before the jq/python script reads it —
        # a bare `kubectl get | python3` races creation (cel-traps §4).
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac13-app
                namespace: emrserverlessapplication
        - script:
            content: |
              # kro v0.9.2 cannot omit a field inside a template (frequent-rgd-errors.md §10.2):
              # an unset diskEncryptionKeyARN renders as the neutral empty value, not an absent key.
              # Asserting the neutral rendering is the observable equivalent of "no disk encryption".
              kubectl get applications.emrserverless.services.k8s.aws ac13-app -n emrserverlessapplication -o json | \
                python3 -c "
              import json, sys
              enc = json.load(sys.stdin)['spec']['diskEncryptionConfiguration']
              assert enc.get('encryptionKeyARN', '') == '', f'expected empty key ARN, got {enc}'
              assert enc.get('encryptionContext', {}) == {}, f'expected empty context, got {enc}'
              print('DISK ENCRYPTION NONE OK:', enc)
              "

    # AC-14: instance diskEncryptionContext passed through alongside the resolved key ARN
    - name: ac14-disk-encryption-context
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac14-cfg
