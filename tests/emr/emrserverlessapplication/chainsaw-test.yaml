                namespace: emrserverlessapplication
              spec:
                configRef: ac20-cfg
        # Wait for the ACK child before the jq/python script reads it —
        # a bare `kubectl get | python3` races creation (cel-traps §4).
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac20-app
                namespace: emrserverlessapplication
        - script:
            content: |
              # Same kro constraint as AC-13 (frequent-rgd-errors.md §10.2): the key cannot be
              # dropped, so "AWS-managed networking" is observable as both lists being empty.
              kubectl get applications.emrserverless.services.k8s.aws ac20-app -n emrserverlessapplication -o json | \
                python3 -c "
              import json, sys
              net = json.load(sys.stdin)['spec']['networkConfiguration']
              assert net.get('subnetIDs', []) == [], f'expected no subnets, got {net}'
              assert net.get('securityGroupIDs', []) == [], f'expected no security groups, got {net}'
              print('NETWORK NONE OK:', net)
              "

