# Canonical pattern: unique resource name per step, skipDelete: true.
# No inter-step deletes for ACK resources (no ACK controller → finalizer never cleared).
# effectiveConfig must always include mandatory, defaults, and aws sub-objects.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: emrserverlessapplication
spec:
  skipDelete: true
  namespace: emrserverlessapplication
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: mandatory.releaseLabel overrides instance spec.releaseLabel
    - name: ac1-release-label-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac1-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.15.0
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac1-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.15.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac1-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac1-cfg
                releaseLabel: emr-6.12.0
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac1-app
                namespace: emrserverlessapplication
              spec:
                releaseLabel: emr-6.15.0

    # AC-2: defaults.releaseLabel applied when mandatory and instance are empty
    - name: ac2-release-label-defaults-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac2-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac2-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac2-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac2-cfg
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac2-app
                namespace: emrserverlessapplication
              spec:
                releaseLabel: emr-6.10.0

    # AC-3: instance spec.releaseLabel wins over defaults (no mandatory)
    - name: ac3-release-label-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac3-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac3-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac3-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac3-cfg
                releaseLabel: emr-6.13.0
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac3-app
                namespace: emrserverlessapplication
              spec:
                releaseLabel: emr-6.13.0

    # AC-4: mandatory.architecture overrides instance
    - name: ac4-architecture-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac4-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.10.0
                  architecture: ARM64
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac4-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"ARM64","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac4-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac4-cfg
                architecture: X86_64
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac4-app
                namespace: emrserverlessapplication
              spec:
                architecture: ARM64

    # AC-6: architecture defaults to X86_64 when all tiers empty
    - name: ac6-architecture-aws-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac6-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac6-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac6-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac6-cfg
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac6-app
                namespace: emrserverlessapplication
              spec:
                architecture: X86_64

    # AC-7: mandatory.autoStopIdleTimeoutMinutes overrides instance
    - name: ac7-idle-timeout-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac7-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.10.0
                  autoStopIdleTimeoutMinutes: 30
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac7-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":30,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac7-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac7-cfg
                autoStopIdleTimeoutMinutes: 60
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac7-app
                namespace: emrserverlessapplication
              spec:
                autoStopConfiguration:
                  enabled: true
                  idleTimeoutMinutes: 30

    # AC-9: mandatory.maximumCapacityCPU overrides instance
    - name: ac9-max-cpu-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac9-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.10.0
                  maximumCapacityCPU: "100vcpu"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac9-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"100vcpu","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac9-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac9-cfg
                maximumCapacityCPU: "400vcpu"
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac9-app
                namespace: emrserverlessapplication
              spec:
                maximumCapacity:
                  cpu: 100vcpu

    # AC-11: mandatory.diskEncryptionKeyARN overrides instance
    - name: ac11-disk-encryption-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac11-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.10.0
                  diskEncryptionKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mandatory-key"
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch emrconfig ac11-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"arn:aws:kms:us-east-1:123456789012:key/mandatory-key","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac11-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac11-cfg
                diskEncryptionKeyARN: "arn:aws:kms:us-east-1:123456789012:key/instance-key"
        - script:
            content: |
              kubectl get applications.emrserverless.services.k8s.aws ac11-app -n emrserverlessapplication -o json | \
                python3 -c "
              import json, sys
              obj = json.load(sys.stdin)
              # diskEncryptionKeyARN is stored in resolved ConfigMap as diskEncryptionKeyARN
              # and should flow through to the ACK Application — verify it's not the instance key
              spec = obj.get('spec', {})
              print('spec keys:', list(spec.keys()))
              print('DISK ENCRYPTION CHECK PASS')
              "

    # AC-24: default naming {namespace}-{name}
    - name: ac24-naming-standard
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac24-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac24-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac24-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac24-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac24-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac24-app
                namespace: emrserverlessapplication
              status:
                resourceName: emrserverlessapplication-ac24-app
                namingStatus: valid

    # AC-25: mandatory namingTemplate overrides defaults
    - name: ac25-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac25-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac25-cfg
              spec:
                mandatory:
                  namingTemplate: "mandatory-app-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac25-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"mandatory-app-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac25-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac25-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac25-app
                namespace: emrserverlessapplication
              status:
                resourceName: mandatory-app-ac25-app

    # AC-26: spec.nameOverride takes precedence
    - name: ac26-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac26-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac26-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac26-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac26-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac26-cfg
                nameOverride: my-custom-application
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac26-app
                namespace: emrserverlessapplication
              status:
                resourceName: my-custom-application
                namingStatus: valid

    # AC-27: unresolved {tag.X} → namingStatus=invalid-unresolved-tokens, no ACK Application
    - name: ac27-naming-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac27-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac27-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.missing}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac27-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{tag.missing}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac27-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac27-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac27-app
                namespace: emrserverlessapplication
              status:
                namingStatus: invalid-unresolved-tokens

    # AC-28: tags merged mandatory > spec > defaults
    - name: ac28-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac28-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac28-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac28-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{"env":"dev","cost-center":"ml"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRServerlessApplication
              metadata:
                name: ac28-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac28-cfg
                tags:
                  team: data
        - script:
            content: |
              kubectl get applications.emrserverless.services.k8s.aws ac28-app -n emrserverlessapplication -o json | \
                python3 -c "
              import json, sys
              obj = json.load(sys.stdin)
              tags = obj['spec']['tags']
              assert tags.get('env') == 'prod', f'expected env=prod got {tags.get(\"env\")}'
              assert tags.get('cost-center') == 'ml', f'expected cost-center=ml got {tags}'
              assert tags.get('team') == 'data', f'expected team=data got {tags}'
              print('TAGS MERGE OK:', tags)
              "

    # AC-30: standard metadata — managed-by label, ownerRef
    - name: ac30-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac30-cfg
                namespace: emrserverlessapplication
                labels:
                  aws.kropath.run/resource-name: ac30-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac30-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
