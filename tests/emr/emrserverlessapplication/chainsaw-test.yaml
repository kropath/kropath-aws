              kind: EMRServerlessApplication
              metadata:
                name: ac28-app
                namespace: emrserverlessapplication
              spec:
                configRef: ac28-cfg
                tags:
                  team: data
        # Wait for the ACK child to exist before the jq/python script reads it.
        # Chainsaw's assert has built-in retry/timeout; a bare `kubectl get | python3`
        # races creation and dies on empty stdin (cel-traps §4).
        - assert:
            resource:
              apiVersion: emrserverless.services.k8s.aws/v1alpha1
              kind: Application
              metadata:
                name: ac28-app
                namespace: emrserverlessapplication
        - script:
            content: |
              kubectl get applications.emrserverless.services.k8s.aws ac28-app -n emrserverlessapplication -o json | \
                python3 -c "
              import json, sys
              obj = json.load(sys.stdin)
              tags = obj['spec']['tags']
              assert tags.get('env') == 'prod', f'expected env=prod got {tags.get(\"env\")}'
              assert tags.get('cost-center') == 'ml', f'expected cost-center=ml got {tags}'
              assert tags.get('team') == 'data', f'expected team=data got {tags}'
              print('TAGS MERGE OK:', tags)
              "

