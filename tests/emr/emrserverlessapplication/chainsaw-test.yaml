        - script:
            content: |
              kubectl patch emrconfig ac28-cfg -n emrserverlessapplication \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","architecture":"","autoStopIdleTimeoutMinutes":0,"maximumCapacityCPU":"","maximumCapacityMemory":"","diskEncryptionKeyARN":"","tags":{"env":"dev","cost-center":"ml"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
