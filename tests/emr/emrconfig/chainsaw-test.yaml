# KRO-829 EMRConfig governance tests — all 11 acceptance criteria.
# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step uses a uniquely-named EMRConfig and deletes nothing between
# steps. skipDelete stops chainsaw's end-of-test cascade delete; the ephemeral kind
# cluster is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: emrconfig
spec:
  skipDelete: true
  namespace: emrconfig
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-emrconfig-namespace.yaml

    - name: ac1-reject-dual-tier-releaseLabel
      try:
        - apply:
            file: 02-invalid-dual-tier-releaseLabel.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EMRConfig
                check:
                  ($error != null): true

    - name: ac2-reject-dual-tier-architecture
      try:
        - apply:
            file: 03-invalid-dual-tier-architecture.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EMRConfig
                check:
                  ($error != null): true

    - name: ac3-reject-dual-tier-autoStopIdleTimeoutMinutes
      try:
        - apply:
            file: 04-invalid-dual-tier-autoStop.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EMRConfig
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-maximumCapacityCPU
      try:
        - apply:
            file: 05-invalid-dual-tier-maxCPU.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EMRConfig
                check:
                  ($error != null): true

    - name: ac5-reject-dual-tier-maximumCapacityMemory
      try:
        - apply:
            file: 06-invalid-dual-tier-maxMemory.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EMRConfig
                check:
                  ($error != null): true

    - name: ac6-reject-dual-tier-diskEncryptionKeyARN
      try:
        - apply:
            file: 07-invalid-dual-tier-diskEncryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EMRConfig
                check:
                  ($error != null): true

    - name: ac7-reject-dual-tier-namingTemplate
      try:
        - apply:
            file: 08-invalid-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EMRConfig
                check:
                  ($error != null): true

    - name: ac8-map-fields-both-tiers-accepted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac8-policy
                name: ac8-policy
                namespace: emrconfig
              spec:
                mandatory:
                  releaseLabel: ""
                  architecture: ""
                  autoStopIdleTimeoutMinutes: 0
                  maximumCapacityCPU: ""
                  maximumCapacityMemory: ""
                  diskEncryptionKeyARN: ""
                  namingTemplate: ""
                  tags:
                    env: prod
                  syncedLabels:
                    tier: production
                  syncedAnnotations: {}
                defaults:
                  releaseLabel: ""
                  architecture: ""
                  autoStopIdleTimeoutMinutes: 30
                  maximumCapacityCPU: ""
                  maximumCapacityMemory: ""
                  diskEncryptionKeyARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac8-policy
                namespace: emrconfig
              spec:
                mandatory:
                  tags:
                    env: prod
                  syncedLabels:
                    tier: production
                defaults:
                  tags:
                    team: platform
                  namingTemplate: "{namespace}-{name}"

    - name: ac9-general-policy-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac9-general-policy
                name: ac9-general-policy
                namespace: emrconfig
              spec:
                mandatory:
                  releaseLabel: ""
                  architecture: ""
                  autoStopIdleTimeoutMinutes: 0
                  maximumCapacityCPU: ""
                  maximumCapacityMemory: ""
                  diskEncryptionKeyARN: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  releaseLabel: ""
                  architecture: ""
                  autoStopIdleTimeoutMinutes: 30
                  maximumCapacityCPU: ""
                  maximumCapacityMemory: ""
                  diskEncryptionKeyARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac9-general-policy
                namespace: emrconfig
              spec:
                mandatory:
                  releaseLabel: ""
                  architecture: ""
                  autoStopIdleTimeoutMinutes: 0
                  namingTemplate: ""
                defaults:
                  autoStopIdleTimeoutMinutes: 30
                  namingTemplate: "{namespace}-{name}"

    - name: ac10-spark-production-profile
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac10-spark-production
                name: ac10-spark-production
                namespace: emrconfig
              spec:
                mandatory:
                  releaseLabel: ""
                  architecture: "ARM64"
                  autoStopIdleTimeoutMinutes: 15
                  maximumCapacityCPU: "200"
                  maximumCapacityMemory: "1500g"
                  diskEncryptionKeyARN: ""
                  namingTemplate: ""
                  tags:
                    environment: production
                  syncedLabels:
                    tier: production
                  syncedAnnotations: {}
                defaults:
                  releaseLabel: ""
                  architecture: ""
                  autoStopIdleTimeoutMinutes: 0
                  maximumCapacityCPU: ""
                  maximumCapacityMemory: ""
                  diskEncryptionKeyARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac10-spark-production
                namespace: emrconfig
              spec:
                mandatory:
                  architecture: "ARM64"
                  autoStopIdleTimeoutMinutes: 15
                  maximumCapacityCPU: "200"
                  maximumCapacityMemory: "1500g"
                  tags:
                    environment: production
                  syncedLabels:
                    tier: production
                defaults:
                  namingTemplate: "{namespace}-{name}"

    - name: ac11-label-selector-lookup
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                labels:
                  aws.kropath.run/resource-name: ac11-policy
                name: ac11-policy
                namespace: emrconfig
              spec:
                mandatory:
                  releaseLabel: ""
                  architecture: ""
                  autoStopIdleTimeoutMinutes: 0
                  maximumCapacityCPU: ""
                  maximumCapacityMemory: ""
                  diskEncryptionKeyARN: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  releaseLabel: ""
                  architecture: ""
                  autoStopIdleTimeoutMinutes: 30
                  maximumCapacityCPU: ""
                  maximumCapacityMemory: ""
                  diskEncryptionKeyARN: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac11-policy
                namespace: emrconfig
                labels:
                  aws.kropath.run/resource-name: ac11-policy
        - script:
            content: |
              count=$(kubectl get emrconfig -n emrconfig \
                -l aws.kropath.run/resource-name=ac11-policy \
                -o json | jq '.items | length')
              if [ "$count" -ne 1 ]; then
                echo "ERROR: expected 1 EMRConfig with label aws.kropath.run/resource-name=ac11-policy, got $count"
                exit 1
              fi
              echo "PASS: label selector lookup found $count EMRConfig"
