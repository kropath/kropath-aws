# AC-5: rejected when maximumCapacityMemory set in both mandatory and defaults
---
apiVersion: aws.kropath.run/v1alpha1
kind: EMRConfig
metadata:
  name: ac5-dual-tier-maxmemory
  namespace: emrconfig
spec:
  mandatory:
    releaseLabel: ""
    architecture: ""
    autoStopIdleTimeoutMinutes: 0
    maximumCapacityCPU: ""
    maximumCapacityMemory: "1500g"
    diskEncryptionKeyARN: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    releaseLabel: ""
    architecture: ""
    autoStopIdleTimeoutMinutes: 30
    maximumCapacityCPU: ""
    maximumCapacityMemory: "3000g"
    diskEncryptionKeyARN: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
