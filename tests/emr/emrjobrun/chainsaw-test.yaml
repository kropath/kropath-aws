# Canonical pattern: unique resource name per step, skipDelete: true.
# No inter-step deletes for ACK resources (no ACK controller → finalizer never cleared).
# effectiveConfig must always include mandatory, defaults, and aws sub-objects.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: emrjobrun
spec:
  skipDelete: true
  namespace: emrjobrun
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: mandatory.releaseLabel overrides instance spec.releaseLabel
    - name: ac1-release-label-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac1-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  releaseLabel: emr-6.15.0
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac1-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.15.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac1-run
                namespace: emrjobrun
              spec:
                configRef: ac1-cfg
                releaseLabel: emr-6.12.0
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: emrcontainers.services.k8s.aws/v1alpha1
              kind: JobRun
              metadata:
                name: ac1-run
                namespace: emrjobrun
              spec:
                releaseLabel: emr-6.15.0

    # AC-2: defaults.releaseLabel applied when mandatory and instance are empty
    - name: ac2-release-label-defaults-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac2-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac2-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac2-run
                namespace: emrjobrun
              spec:
                configRef: ac2-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: emrcontainers.services.k8s.aws/v1alpha1
              kind: JobRun
              metadata:
                name: ac2-run
                namespace: emrjobrun
              spec:
                releaseLabel: emr-6.10.0

    # AC-3: instance spec.releaseLabel wins over defaults (no mandatory)
    - name: ac3-release-label-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac3-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac3-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac3-run
                namespace: emrjobrun
              spec:
                configRef: ac3-cfg
                releaseLabel: emr-6.13.0
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: emrcontainers.services.k8s.aws/v1alpha1
              kind: JobRun
              metadata:
                name: ac3-run
                namespace: emrjobrun
              spec:
                releaseLabel: emr-6.13.0

    # AC-4: virtualClusterID passthrough to ACK JobRun spec
    - name: ac4-virtual-cluster-id-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac4-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac4-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac4-run
                namespace: emrjobrun
              spec:
                configRef: ac4-cfg
                virtualClusterID: vc-abc123def456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: emrcontainers.services.k8s.aws/v1alpha1
              kind: JobRun
              metadata:
                name: ac4-run
                namespace: emrjobrun
              spec:
                virtualClusterID: vc-abc123def456

    # AC-5: executionRoleARN passthrough (operational, not governed)
    - name: ac5-execution-role-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac5-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac5-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac5-run
                namespace: emrjobrun
              spec:
                configRef: ac5-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/specific-emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: emrcontainers.services.k8s.aws/v1alpha1
              kind: JobRun
              metadata:
                name: ac5-run
                namespace: emrjobrun
              spec:
                executionRoleARN: "arn:aws:iam::123456789012:role/specific-emr-role"

    # AC-6: sparkSubmit entryPoint passthrough
    - name: ac6-spark-submit-entrypoint
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac6-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac6-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac6-run
                namespace: emrjobrun
              spec:
                configRef: ac6-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://my-bucket/my-app.jar"
                sparkSubmitSparkSubmitParameters: "--class com.example.Main --conf spark.executor.memory=2g"
        - assert:
            resource:
              apiVersion: emrcontainers.services.k8s.aws/v1alpha1
              kind: JobRun
              metadata:
                name: ac6-run
                namespace: emrjobrun
              spec:
                jobDriver:
                  sparkSubmitJobDriver:
                    entryPoint: "s3://my-bucket/my-app.jar"
                    sparkSubmitParameters: "--class com.example.Main --conf spark.executor.memory=2g"

    # AC-9: default naming {namespace}-{name}
    - name: ac9-naming-standard
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac9-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac9-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac9-run
                namespace: emrjobrun
              spec:
                configRef: ac9-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac9-run
                namespace: emrjobrun
              status:
                resourceName: emrjobrun-ac9-run
                namingStatus: valid

    # AC-10: mandatory namingTemplate wins
    - name: ac10-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac10-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  namingTemplate: "mandatory-run-{name}"
                  releaseLabel: emr-6.10.0
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac10-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"mandatory-run-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac10-run
                namespace: emrjobrun
              spec:
                configRef: ac10-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac10-run
                namespace: emrjobrun
              status:
                resourceName: mandatory-run-ac10-run

    # AC-11: nameOverride takes precedence
    - name: ac11-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac11-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac11-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac11-run
                namespace: emrjobrun
              spec:
                configRef: ac11-cfg
                nameOverride: my-custom-job-run
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac11-run
                namespace: emrjobrun
              status:
                resourceName: my-custom-job-run
                namingStatus: valid

    # AC-12: unresolved {tag.X} → namingStatus=invalid-unresolved-tokens, no ACK JobRun
    - name: ac12-naming-unresolved-token
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac12-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.missing}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac12-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{tag.missing}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac12-run
                namespace: emrjobrun
              spec:
                configRef: ac12-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac12-run
                namespace: emrjobrun
              status:
                namingStatus: invalid-unresolved-tokens

    # AC-13: tags merged mandatory > spec > defaults
    - name: ac13-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac13-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac13-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"emr-6.10.0","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{"env":"dev","cost-center":"emr"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac13-run
                namespace: emrjobrun
              spec:
                configRef: ac13-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
                tags:
                  team: data
        - script:
            content: |
              kubectl get jobruns.emrcontainers.services.k8s.aws ac13-run -n emrjobrun -o json | \
                python3 -c "
              import json, sys
              obj = json.load(sys.stdin)
              tags = obj['spec']['tags']
              assert tags.get('env') == 'prod', f'expected env=prod got {tags.get(\"env\")}'
              assert tags.get('cost-center') == 'emr', f'expected cost-center=emr got {tags}'
              assert tags.get('team') == 'data', f'expected team=data got {tags}'
              print('TAGS MERGE OK:', tags)
              "

    # AC-15: synced-labels applied with aws.kropath.run/ prefix
    - name: ac15-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac15-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac15-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
                  syncedLabels:
                    cost-center: emr-team
        - script:
            content: |
              kubectl patch emrconfig ac15-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{"cost-center":"emr-team"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac15-run
                namespace: emrjobrun
              spec:
                configRef: ac15-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: emrcontainers.services.k8s.aws/v1alpha1
              kind: JobRun
              metadata:
                name: ac15-run
                namespace: emrjobrun
                labels:
                  aws.kropath.run/cost-center: emr-team

    # AC-16: standard metadata — managed-by and instance labels
    - name: ac16-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac16-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac16-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac16-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac16-run
                namespace: emrjobrun
              spec:
                configRef: ac16-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: emrcontainers.services.k8s.aws/v1alpha1
              kind: JobRun
              metadata:
                name: ac16-run
                namespace: emrjobrun
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac16-run

    # AC-17: deletionPolicy: delete (default for EMRJobRun)
    - name: ac17-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac17-cfg
                namespace: emrjobrun
                labels:
                  aws.kropath.run/resource-name: ac17-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  releaseLabel: emr-6.10.0
        - script:
            content: |
              kubectl patch emrconfig ac17-cfg -n emrjobrun \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","releaseLabel":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","releaseLabel":"emr-6.10.0","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRJobRun
              metadata:
                name: ac17-run
                namespace: emrjobrun
              spec:
                configRef: ac17-cfg
                virtualClusterID: vc-123456
                executionRoleARN: "arn:aws:iam::123456789012:role/emr-role"
                sparkSubmitEntryPoint: "s3://bucket/app.py"
        - assert:
            resource:
              apiVersion: emrcontainers.services.k8s.aws/v1alpha1
              kind: JobRun
              metadata:
                name: ac17-run
                namespace: emrjobrun
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-18: deletionPolicy: retain
    - name: ac18-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EMRConfig
              metadata:
                name: ac18-cfg
