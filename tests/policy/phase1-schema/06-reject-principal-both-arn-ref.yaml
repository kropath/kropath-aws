# AC-PD1-7: Principal with both arn and ref set is rejected.
apiVersion: kropath.run/v1alpha1
kind: AWSPolicyDocument
metadata:
  name: invalid-principal-both-arn-ref
spec:
  statements:
    - sid: AllowBoth
      effect: Allow
      principals:
        - type: AWS
          arn: "arn:aws:iam::123456789012:role/my-role"
          ref:
            kind: AWSIAMRole
            name: my-role
      actions:
        - "s3:GetObject"
      resources:
        - arn: "*"
