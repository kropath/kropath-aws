# Phase 1 schema validation tests for AWSPolicyDocument CRD.
# Tests x-kubernetes-validations rules without a running controller.
# Covers all acceptance criteria AC-PD1-1 through AC-PD1-8.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awspolicydocument-phase1-schema-validation
spec:
  description: >-
    Verifies AWSPolicyDocument CRD schema validation and x-kubernetes-validations
    rules. No controller required — pure admission-time checks.
  namespace: phase1-schema
  steps:
    # AC-PD1-1: CRD is present (installed via CI pipeline step before this test)
    - name: crd-exists
      description: "AC-PD1-1: AWSPolicyDocument CRD is registered."
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: awspolicydocuments.kropath.run

    # AC-PD1-2: CR with only spec.documentJSON is accepted
    - name: accept-documentjson-form
      description: "AC-PD1-2: CR with spec.documentJSON only is accepted."
      try:
        - apply:
            file: 00-phase1-schema-namespace.yaml
        - apply:
            file: 01-accept-documentjson.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: raw-form
      cleanup:
        - delete:
            file: 01-accept-documentjson.yaml

    # AC-PD1-3: CR with only spec.statements[] is accepted
    - name: accept-statements-only-form
      description: "AC-PD1-3: CR with spec.statements[] only (no refs) is accepted."
      try:
        - apply:
            file: 02-accept-statements-only.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: structured-form
      cleanup:
        - delete:
            file: 02-accept-statements-only.yaml

    # AC-PD1-4: CR with both spec.documentJSON and spec.statements is rejected
    - name: reject-both-documentjson-and-statements
      description: "AC-PD1-4: x-kubernetes-validations rejects documentJSON + statements."
      try:
        - apply:
            file: 03-reject-both-documentjson-statements.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSPolicyDocument
                check:
                  ($error != null): true

    # AC-PD1-5: CR with both spec.documentJSON and spec.sources is rejected
    - name: reject-both-documentjson-and-sources
      description: "AC-PD1-5: x-kubernetes-validations rejects documentJSON + sources."
      try:
        - apply:
            file: 04-reject-both-documentjson-sources.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSPolicyDocument
                check:
                  ($error != null): true

    # AC-PD1-6: Statement with effect: Invalid is rejected
    - name: reject-invalid-effect
      description: "AC-PD1-6: CRD enum validation rejects statements with effect other than Allow/Deny."
      try:
        - apply:
            file: 05-reject-invalid-effect.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSPolicyDocument
                check:
                  ($error != null): true

    # AC-PD1-7: Principal with both arn and ref is rejected
    - name: reject-principal-both-arn-and-ref
      description: "AC-PD1-7: x-kubernetes-validations rejects principal with both arn and ref."
      try:
        - apply:
            file: 06-reject-principal-both-arn-ref.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSPolicyDocument
                check:
                  ($error != null): true

    # AC-PD1-8: Resource with both arn and ref is rejected
    - name: reject-resource-both-arn-and-ref
      description: "AC-PD1-8: x-kubernetes-validations rejects resource with both arn and ref."
      try:
        - apply:
            file: 07-reject-resource-both-arn-ref.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSPolicyDocument
                check:
                  ($error != null): true
