# AC-PD1-5: CR with both spec.documentJSON and spec.sources is rejected.
apiVersion: aws.kropath.run/v1alpha1
kind: AWSPolicyDocument
metadata:
  name: invalid-both-forms-sources
spec:
  documentJSON: '{"Version":"2012-10-17","Statement":[]}'
  sources:
    - name: base-policy
