                firewallPolicyArn: "arn:aws:network-firewall:us-east-1:123456789012:firewall-policy/base-policy"
                deleteProtection: false
                alertLogDestination:
                  type: CloudWatchLogs
                  destination:
                    logGroup: /aws/nfw/alerts
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: Firewall
              metadata:
                name: networkfirewallfirewall-ac10-fw
                namespace: networkfirewallfirewall
        - script:
            content: |
              LOGS=$(kubectl get firewall networkfirewallfirewall-ac10-fw -n networkfirewallfirewall \
                -o json | jq '.spec.loggingConfiguration.logDestinationConfigs')
              echo "Logging configs: $LOGS"
              echo "$LOGS" | jq -e '.[] | select(.logType=="ALERT" and .logDestinationType=="CloudWatchLogs")' > /dev/null
              echo "ALERT log entry present"

