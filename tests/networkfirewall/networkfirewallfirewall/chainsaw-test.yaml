                name: ac26-fw
                namespace: networkfirewallfirewall
              status:
                firewallArn: "arn:aws:network-firewall:us-east-1:123456789012:firewall/networkfirewallfirewall-ac26-fw"

    # AC-27: Tags 3-tier merge — mandatory > instance > defaults.
    - name: ac27-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac27-cfg
                namespace: networkfirewallfirewall
                labels:
                  aws.kropath.run/resource-name: ac27-cfg
              spec:
                mandatory:
                  tags:
                    nfw-managed: "true"
                defaults:
                  tags:
                    cost-centre: infra
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac27-cfg -n networkfirewallfirewall \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{"nfw-managed":"true"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{"cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallFirewall
              metadata:
                name: ac27-fw
                namespace: networkfirewallfirewall
              spec:
                configRef: ac27-cfg
                vpcId: "vpc-0abc123def456027"
                subnetMappings:
                  - subnetId: "subnet-0abc123def456027"
                firewallPolicyArn: "arn:aws:network-firewall:us-east-1:123456789012:firewall-policy/base-policy"
                deleteProtection: false
                tags:
                  app: edge-fw
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: Firewall
              metadata:
                name: networkfirewallfirewall-ac27-fw
                namespace: networkfirewallfirewall
        - script:
            content: |
              TAGS=$(kubectl get firewall networkfirewallfirewall-ac27-fw -n networkfirewallfirewall \
                -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.[] | select(.key=="nfw-managed" and .value=="true")' > /dev/null
              echo "$TAGS" | jq -e '.[] | select(.key=="cost-centre" and .value=="infra")' > /dev/null
              echo "$TAGS" | jq -e '.[] | select(.key=="app" and .value=="edge-fw")' > /dev/null
              echo "All tags present"

