# aws-nfw-01 Chainsaw tests — one scenario per acceptance criterion (29 ACs).
# Spec: kropath-core/docs/specs/aws/aws-nfw-01-networkfirewallfirewall.md
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
#
# Note: protection flags (deleteProtection, firewallPolicyChangeProtection, subnetChangeProtection)
# default to true when not set via mandatory/instance/defaults. Tests for false must set the
# instance spec field explicitly while keeping mandatory absent.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: networkfirewallfirewall
spec:
  skipDelete: true
  namespace: networkfirewallfirewall
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Basic firewall with single subnet — asserts ACK Firewall CR wired correctly.
    - name: ac1-basic-single-subnet
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac1-cfg
                namespace: networkfirewallfirewall
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac1-cfg -n networkfirewallfirewall \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallFirewall
              metadata:
                name: ac1-fw
                namespace: networkfirewallfirewall
              spec:
                configRef: ac1-cfg
                vpcId: "vpc-0abc123def456001"
                subnetMappings:
                  - subnetId: "subnet-0abc123def456001"
                firewallPolicyArn: "arn:aws:network-firewall:us-east-1:123456789012:firewall-policy/base-policy"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: Firewall
              metadata:
                name: networkfirewallfirewall-ac1-fw
                namespace: networkfirewallfirewall
              spec:
                firewallName: networkfirewallfirewall-ac1-fw
                vpcID: "vpc-0abc123def456001"
                firewallPolicyARN: "arn:aws:network-firewall:us-east-1:123456789012:firewall-policy/base-policy"

    # AC-2: Firewall with multiple subnets (one per AZ).
    - name: ac2-multiple-subnets
      try:
