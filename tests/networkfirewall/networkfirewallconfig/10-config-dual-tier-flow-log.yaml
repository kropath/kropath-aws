# AC-10 (negative): loggingDestination.flowLogDestination type set in BOTH tiers — rejected.
---
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: strict-invalid-flow-log
  namespace: networkfirewallconfig
  labels:
    aws.kropath.run/resource-name: strict-invalid-flow-log
spec:
  mandatory:
    loggingDestination:
      flowLogDestination:
        type: "S3"
        destination:
          bucketName: "flow-logs-mandatory"
  defaults:
    statefulDefaultActions: []
    loggingDestination:
      flowLogDestination:
        type: "S3"
        destination:
          bucketName: "flow-logs-defaults"
