# AC-7 (negative): statefulDefaultActions set (non-empty) in BOTH mandatory and defaults — rejected.
---
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: strict-invalid-default-actions
  namespace: networkfirewallconfig
  labels:
    aws.kropath.run/resource-name: strict-invalid-default-actions
spec:
  mandatory:
    statefulDefaultActions:
      - "aws:drop_strict"
  defaults:
    statefulDefaultActions:
      - "aws:alert_established"
