# aws-nfw-01 Chainsaw tests — one scenario per acceptance criterion (17 ACs).
# Spec: kropath-core/docs/specs/aws/aws-nfw-01-networkfirewallconfig.md
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: networkfirewallconfig
spec:
  skipDelete: true
  namespace: networkfirewallconfig
  steps:
    # AC-1: general-policy CR accepted with full defaults baseline; label auto-injected by controller.
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-networkfirewallconfig-namespace.yaml
        - apply:
            file: 01-config-create-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: general-policy
                namespace: kro-system
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  encryptionType: ""
                  statefulRuleOrder: ""
                  namingTemplate: ""
                defaults:
                  encryptionType: "AWS_OWNED_KMS_KEY"
                  statefulRuleOrder: "STRICT_ORDER"
                  streamExceptionPolicy: "DROP"
                  namingTemplate: "{namespace}-{name}"

    # AC-2 (negative): encryptionType in both mandatory and defaults — rejected.
    - name: ac2-reject-dual-tier-encryption
      try:
        - apply:
            file: 02-config-dual-tier-encryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-3 (negative): deleteProtection true in both tiers — rejected.
    - name: ac3-reject-dual-tier-delete-protection
      try:
        - apply:
            file: 03-config-dual-tier-delete-protection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-4 (negative): firewallPolicyChangeProtection true in both tiers — rejected.
    - name: ac4-reject-dual-tier-policy-change-protection
      try:
        - apply:
            file: 04-config-dual-tier-policy-change-protection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-5 (negative): subnetChangeProtection true in both tiers — rejected.
    - name: ac5-reject-dual-tier-subnet-change-protection
      try:
        - apply:
            file: 05-config-dual-tier-subnet-change-protection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-6 (negative): statefulRuleOrder in both tiers — rejected.
    - name: ac6-reject-dual-tier-stateful-rule-order
      try:
        - apply:
            file: 06-config-dual-tier-stateful-rule-order.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-7 (negative): statefulDefaultActions non-empty in both tiers — rejected.
    - name: ac7-reject-dual-tier-stateful-default-actions
      try:
        - apply:
            file: 07-config-dual-tier-stateful-default-actions.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-8 (negative): streamExceptionPolicy in both tiers — rejected.
    - name: ac8-reject-dual-tier-stream-exception-policy
      try:
        - apply:
            file: 08-config-dual-tier-stream-exception-policy.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-9 (negative): alertLogDestination.type set in both tiers — rejected.
    - name: ac9-reject-dual-tier-alert-log
      try:
        - apply:
            file: 09-config-dual-tier-alert-log.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-10 (negative): flowLogDestination.type set in both tiers — rejected.
    - name: ac10-reject-dual-tier-flow-log
      try:
        - apply:
            file: 10-config-dual-tier-flow-log.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-11 (negative): tlsLogDestination.type set in both tiers — rejected.
    - name: ac11-reject-dual-tier-tls-log
      try:
        - apply:
            file: 11-config-dual-tier-tls-log.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-12 (negative): namingTemplate in both tiers — rejected.
    - name: ac12-reject-dual-tier-naming
      try:
        - apply:
            file: 12-config-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: NetworkFirewallConfig
                check:
                  ($error != null): true

    # AC-13 (happy-path): KropathConfig mandatory.networkfirewall.encryptionType wins in effectiveConfig.
    - name: ac13-effective-config-cascade
      try:
        - script:
            content: |
              kubectl create namespace security-prod --dry-run=client -o yaml | kubectl apply -f -
        - apply:
            file: 13-config-effective-cascade.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory.networkfirewall.encryptionType
              # = "CUSTOMER_KMS" wins; defaults merged from global (kro-system) + local (security-prod).
              kubectl patch networkfirewallconfig general-policy -n security-prod \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deleteProtection":false,"firewallPolicyChangeProtection":false,"subnetChangeProtection":false,"encryptionType":"CUSTOMER_KMS","statefulRuleOrder":"","statefulDefaultActions":[],"streamExceptionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deleteProtection":true,"firewallPolicyChangeProtection":true,"subnetChangeProtection":true,"encryptionType":"AWS_OWNED_KMS_KEY","statefulRuleOrder":"STRICT_ORDER","statefulDefaultActions":["aws:drop_strict"],"streamExceptionPolicy":"DROP","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: general-policy
                namespace: security-prod
              status:
                effectiveConfig:
                  mandatory:
                    encryptionType: "CUSTOMER_KMS"
                  defaults:
                    encryptionType: "AWS_OWNED_KMS_KEY"
                    statefulRuleOrder: "STRICT_ORDER"
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: us-east-1
                    accountId: "123456789012"
            timeout: 60s

    # AC-14 (happy-path): effectiveConfig.defaults.namingTemplate = "{namespace}-{name}".
    - name: ac14-naming-template-in-effective-config
      try:
        - apply:
            file: 14-config-naming-template.yaml
        - script:
            content: |
              kubectl patch networkfirewallconfig naming-config -n networkfirewallconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deleteProtection":false,"firewallPolicyChangeProtection":false,"subnetChangeProtection":false,"encryptionType":"","statefulRuleOrder":"","statefulDefaultActions":[],"streamExceptionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deleteProtection":false,"firewallPolicyChangeProtection":false,"subnetChangeProtection":false,"encryptionType":"","statefulRuleOrder":"","statefulDefaultActions":[],"streamExceptionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: naming-config
                namespace: networkfirewallconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
            timeout: 60s

    # AC-15 (happy-path): PCI full mandatory governance profile accepted.
    - name: ac15-pci-profile-accepted
      try:
        - apply:
            file: 15-config-pci-profile.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: pci
                namespace: networkfirewallconfig
              spec:
                mandatory:
                  deleteProtection: true
                  encryptionType: "CUSTOMER_KMS"
                  statefulRuleOrder: "STRICT_ORDER"
                  streamExceptionPolicy: "DROP"

    # AC-16 (happy-path): tag merge — mandatory.tags from NetworkFirewallConfig merged with
    # KropathConfig.mandatory.tags; defaults.tags preserved separately.
    - name: ac16-tag-merge-in-effective-config
      try:
        - apply:
            file: 16-config-tag-merge.yaml
        - script:
            content: |
              # Simulate controller cascade: NetworkFirewallConfig.mandatory.tags {nfw-managed: "true"}
              # merged with KropathConfig.mandatory.tags {cost-centre: infra} via map union.
              # NetworkFirewallConfig.defaults.tags {team: security} preserved in defaults tier.
              kubectl patch networkfirewallconfig tags-config -n networkfirewallconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deleteProtection":false,"firewallPolicyChangeProtection":false,"subnetChangeProtection":false,"encryptionType":"","statefulRuleOrder":"","statefulDefaultActions":[],"streamExceptionPolicy":"","namingTemplate":"","tags":{"nfw-managed":"true","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"deleteProtection":false,"firewallPolicyChangeProtection":false,"subnetChangeProtection":false,"encryptionType":"","statefulRuleOrder":"","statefulDefaultActions":[],"streamExceptionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{"team":"security"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: tags-config
                namespace: networkfirewallconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      nfw-managed: "true"
                      cost-centre: infra
                  defaults:
                    tags:
                      team: security
            timeout: 60s

    # AC-17 (happy-path): mandatory.syncedLabels in effectiveConfig;
    # RGD applies compliance:pci as K8s label (aws.kropath.run/compliance: pci) and cloud tag.
    - name: ac17-synced-labels-in-effective-config
      try:
        - apply:
            file: 17-config-synced-labels.yaml
        - script:
            content: |
              # Simulate controller writing effectiveConfig with mandatory.syncedLabels.
              kubectl patch networkfirewallconfig synced-labels-config -n networkfirewallconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"deleteProtection":false,"firewallPolicyChangeProtection":false,"subnetChangeProtection":false,"encryptionType":"","statefulRuleOrder":"","statefulDefaultActions":[],"streamExceptionPolicy":"","namingTemplate":"","tags":{},"syncedLabels":{"compliance":"pci"},"syncedAnnotations":{}},"defaults":{"deleteProtection":false,"firewallPolicyChangeProtection":false,"subnetChangeProtection":false,"encryptionType":"","statefulRuleOrder":"","statefulDefaultActions":[],"streamExceptionPolicy":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: synced-labels-config
                namespace: networkfirewallconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      compliance: pci
            timeout: 60s
