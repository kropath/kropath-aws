# AC-3 (negative): deleteProtection set to true in BOTH mandatory and defaults — rejected by
# x-kubernetes-validations: "deleteProtection cannot be set to true in both mandatory and defaults".
# Note: mandatory=true + defaults=false is valid; only dual-true is rejected.
---
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: pci-invalid-delete-protection
  namespace: networkfirewallconfig
  labels:
    aws.kropath.run/resource-name: pci-invalid-delete-protection
spec:
  mandatory:
    deleteProtection: true
  defaults:
    deleteProtection: true
    statefulDefaultActions: []
