                statelessFragmentDefaultActions:
                  - "aws:pass"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac13-fp
                namespace: networkfirewallpolicy
              spec:
                (encryptionConfiguration == null || encryptionConfiguration == `{}`): true

    # AC-14: Naming standard — mandatory template {namespace}-{name}.
    - name: ac14-naming-standard
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
