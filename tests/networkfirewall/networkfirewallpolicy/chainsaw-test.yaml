        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac11-fp
                namespace: networkfirewallpolicy
              spec:
                encryptionConfiguration:
                  type_: AWS_OWNED_KMS_KEY

    # AC-12: Instance kmsKeyId sets ACK encryptionConfiguration.keyID.
    - name: ac12-encryption-kms-key-id
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac12-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac12-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac12-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac12-cfg
                statelessDefaultActions:
                  - "aws:pass"
                statelessFragmentDefaultActions:
                  - "aws:pass"
                encryptionType: CUSTOMER_KMS
                kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/test-policy-key"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac12-fp
                namespace: networkfirewallpolicy
              spec:
                encryptionConfiguration:
                  type_: CUSTOMER_KMS
                  keyID: "arn:aws:kms:us-east-1:123456789012:key/test-policy-key"

    # AC-13: No encryption configured — ACK FirewallPolicy has no encryptionConfiguration.
    - name: ac13-encryption-omitted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac13-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac13-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac13-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac13-cfg
                statelessDefaultActions:
