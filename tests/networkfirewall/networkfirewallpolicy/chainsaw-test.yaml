# aws-nfw-03 Chainsaw tests — one scenario per acceptance criterion (27 ACs).
# Spec: kropath-core/docs/specs/aws/aws-nfw-03-networkfirewallpolicy.md
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: networkfirewallpolicy
spec:
  skipDelete: true
  namespace: networkfirewallpolicy
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # Shared effectiveConfig patch helper (used inline per step with per-step config name).
    # effectiveConfig minimal shape: mandatory + defaults + aws.

    # AC-1: Basic stateless-only policy; statelessDefaultActions=aws:pass.
    - name: ac1-basic-stateless-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac1-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac1-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac1-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac1-cfg
                statelessDefaultActions:
                  - "aws:pass"
                statelessFragmentDefaultActions:
                  - "aws:pass"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac1-fp
                namespace: networkfirewallpolicy
              spec:
                firewallPolicyName: networkfirewallpolicy-ac1-fp
                firewallPolicy:
                  statelessDefaultActions:
                    - "aws:pass"
                  statelessFragmentDefaultActions:
                    - "aws:pass"

    # AC-2: Stateless rule group reference by direct ARN.
    - name: ac2-stateless-rg-ref-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac2-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac2-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac2-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac2-cfg
                statelessDefaultActions:
                  - "aws:forward_to_sfe"
                statelessFragmentDefaultActions:
                  - "aws:forward_to_sfe"
                statelessRuleGroupReferences:
                  - resourceArn: "arn:aws:network-firewall:us-east-1:123456789012:stateless-rulegroup/my-stateless-rg"
                    priority: 100
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac2-fp
                namespace: networkfirewallpolicy
              spec:
                firewallPolicy:
                  statelessRuleGroupReferences:
                    - resourceARN: "arn:aws:network-firewall:us-east-1:123456789012:stateless-rulegroup/my-stateless-rg"
                      priority: 100

    # AC-3: Stateful rule group reference by direct ARN.
    - name: ac3-stateful-rg-ref-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac3-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac3-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac3-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac3-cfg
                statelessDefaultActions:
                  - "aws:forward_to_sfe"
                statelessFragmentDefaultActions:
                  - "aws:forward_to_sfe"
                statefulRuleGroupReferences:
                  - resourceArn: "arn:aws:network-firewall:us-east-1:123456789012:stateful-rulegroup/my-stateful-rg"
                    priority: 1
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac3-fp
                namespace: networkfirewallpolicy
              spec:
                firewallPolicy:
                  statefulRuleGroupReferences:
                    - resourceARN: "arn:aws:network-firewall:us-east-1:123456789012:stateful-rulegroup/my-stateful-rg"
                      priority: 1

    # AC-4: Both stateless and stateful rule group references.
    - name: ac4-both-rg-refs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac4-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac4-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac4-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac4-cfg
                statelessDefaultActions:
                  - "aws:forward_to_sfe"
                statelessFragmentDefaultActions:
                  - "aws:forward_to_sfe"
                statelessRuleGroupReferences:
                  - resourceArn: "arn:aws:network-firewall:us-east-1:123456789012:stateless-rulegroup/sl-rg"
                    priority: 100
                statefulRuleGroupReferences:
                  - resourceArn: "arn:aws:network-firewall:us-east-1:123456789012:stateful-rulegroup/sf-rg"
                    priority: 1
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac4-fp
                namespace: networkfirewallpolicy
              spec:
                firewallPolicy:
                  statelessDefaultActions:
                    - "aws:forward_to_sfe"

    # AC-5: Custom stateless actions.
    - name: ac5-custom-stateless-actions
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac5-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac5-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac5-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac5-cfg
                statelessDefaultActions:
                  - "aws:pass"
                  - PublishMetric
                statelessFragmentDefaultActions:
                  - "aws:pass"
                statelessCustomActions:
                  - actionName: PublishMetric
                    actionDefinition:
                      publishMetricAction:
                        dimensions:
                          - value: blocked-traffic
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac5-fp
                namespace: networkfirewallpolicy
              spec:
                firewallPolicy:
                  statelessDefaultActions:
                    - "aws:pass"
                    - PublishMetric

    # AC-6: statefulRuleOrder=STRICT_ORDER from instance.
    - name: ac6-stateful-rule-order-instance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac6-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac6-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac6-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac6-cfg
                statelessDefaultActions:
                  - "aws:forward_to_sfe"
                statelessFragmentDefaultActions:
                  - "aws:forward_to_sfe"
                statefulRuleOrder: STRICT_ORDER
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac6-fp
                namespace: networkfirewallpolicy
              spec:
                firewallPolicy:
                  statefulEngineOptions:
                    ruleOrder: STRICT_ORDER

    # AC-7: streamExceptionPolicy=DROP from instance.
    - name: ac7-stream-exception-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac7-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac7-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac7-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac7-cfg
                statelessDefaultActions:
                  - "aws:forward_to_sfe"
                statelessFragmentDefaultActions:
                  - "aws:forward_to_sfe"
                streamExceptionPolicy: DROP
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac7-fp
                namespace: networkfirewallpolicy
              spec:
                firewallPolicy:
                  statefulEngineOptions:
                    streamExceptionPolicy: DROP

    # AC-8: statefulDefaultActions from instance.
    - name: ac8-stateful-default-actions
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac8-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac8-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac8-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac8-cfg
                statelessDefaultActions:
                  - "aws:forward_to_sfe"
                statelessFragmentDefaultActions:
                  - "aws:forward_to_sfe"
                statefulDefaultActions:
                  - "aws:alert_strict"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac8-fp
                namespace: networkfirewallpolicy
              spec:
                firewallPolicy:
                  statefulDefaultActions:
                    - "aws:alert_strict"

    # AC-9: Policy variables (HOME_NET override).
    - name: ac9-policy-variables
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac9-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac9-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac9-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac9-cfg
                statelessDefaultActions:
                  - "aws:forward_to_sfe"
                statelessFragmentDefaultActions:
                  - "aws:forward_to_sfe"
                policyVariables:
                  ruleVariables:
                    HOME_NET:
                      definition:
                        - "10.0.0.0/8"
                        - "192.168.0.0/16"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac9-fp
                namespace: networkfirewallpolicy
              spec:
                firewallPolicy:
                  statelessDefaultActions:
                    - "aws:forward_to_sfe"

    # AC-10: Mandatory encryptionType=CUSTOMER_KMS overrides instance AWS_OWNED_KMS_KEY.
    - name: ac10-encryption-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac10-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  encryptionType: CUSTOMER_KMS
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac10-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"CUSTOMER_KMS","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallPolicy
              metadata:
                name: ac10-fp
                namespace: networkfirewallpolicy
              spec:
                configRef: ac10-cfg
                statelessDefaultActions:
                  - "aws:pass"
                statelessFragmentDefaultActions:
                  - "aws:pass"
                encryptionType: AWS_OWNED_KMS_KEY
                kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/override-key"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: FirewallPolicy
              metadata:
                name: networkfirewallpolicy-ac10-fp
                namespace: networkfirewallpolicy
              spec:
                encryptionConfiguration:
                  type_: CUSTOMER_KMS

    # AC-11: Defaults encryptionType=AWS_OWNED_KMS_KEY applies; no keyID.
    - name: ac11-encryption-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac11-cfg
                namespace: networkfirewallpolicy
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  encryptionType: AWS_OWNED_KMS_KEY
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac11-cfg -n networkfirewallpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"AWS_OWNED_KMS_KEY","namingTemplate":"{namespace}-{name}","statefulRuleOrder":"","streamExceptionPolicy":"","statefulDefaultActions":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
