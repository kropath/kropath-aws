# aws-nfw-02 Chainsaw tests — one scenario per acceptance criterion (28 ACs).
# Spec: kropath-core/docs/specs/aws/aws-nfw-02-networkfirewallrulegroup.md
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: networkfirewallrulegroup
spec:
  skipDelete: true
  namespace: networkfirewallrulegroup
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Stateless rule group with statelessRulesAndCustomActions.
    - name: ac1-stateless-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac1-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac1-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac1-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac1-cfg
                type: STATELESS
                capacity: 100
                ruleGroup:
                  rulesSource:
                    statelessRulesAndCustomActions:
                      statelessRules:
                        - priority: 1
                          ruleDefinition:
                            actions:
                              - "aws:pass"
                            matchAttributes:
                              protocols:
                                - 6
                              destinations:
                                - addressDefinition: "10.0.0.0/8"
                              destinationPorts:
                                - fromPort: 443
                                  toPort: 443
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac1-rg
                namespace: networkfirewallrulegroup
              spec:
                type_: STATELESS
                capacity: 100

    # AC-2: Stateless rule group with custom actions.
    - name: ac2-stateless-custom-actions
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac2-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac2-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac2-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac2-cfg
                type: STATELESS
                capacity: 50
                ruleGroup:
                  rulesSource:
                    statelessRulesAndCustomActions:
                      customActions:
                        - actionName: PublishMetric
                          actionDefinition:
                            publishMetricAction:
                              dimensions:
                                - value: blocked-traffic
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac2-rg
                namespace: networkfirewallrulegroup
              spec:
                type_: STATELESS

    # AC-3: Stateful rule group with structured rules (individual stateful rules).
    - name: ac3-stateful-structured-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac3-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac3-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac3-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac3-cfg
                type: STATEFUL
                capacity: 50
                ruleGroup:
                  rulesSource:
                    statefulRules:
                      - action: DROP
                        header:
                          protocol: TCP
                          source: ANY
                          sourcePort: ANY
                          destination: ANY
                          destinationPort: "22"
                          direction: FORWARD
                        ruleOptions:
                          - keyword: sid
                            settings:
                              - "1"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac3-rg
                namespace: networkfirewallrulegroup
              spec:
                type_: STATEFUL
                capacity: 50

    # AC-4: Stateful rule group with STRICT_ORDER.
    - name: ac4-stateful-strict-order
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac4-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac4-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac4-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac4-cfg
                type: STATEFUL
                capacity: 100
                ruleGroup:
                  statefulRuleOptions:
                    ruleOrder: STRICT_ORDER
                  rulesSource:
                    statefulRules:
                      - action: PASS
                        header:
                          protocol: TCP
                          source: ANY
                          sourcePort: ANY
                          destination: ANY
                          destinationPort: "443"
                          direction: FORWARD
                        ruleOptions:
                          - keyword: sid
                            settings:
                              - "2"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac4-rg
                namespace: networkfirewallrulegroup
              spec:
                type_: STATEFUL

    # AC-5: Stateful rule group with Suricata flat-format rules string; ruleGroup absent.
    - name: ac5-stateful-suricata-string
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac5-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac5-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac5-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac5-cfg
                type: STATEFUL
                capacity: 200
                rules: 'pass tcp $HOME_NET any -> $EXTERNAL_NET 443 (msg:"Allow HTTPS"; sid:1; rev:1;)'
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac5-rg
                namespace: networkfirewallrulegroup
              spec:
                type_: STATEFUL
                capacity: 200
                rules: 'pass tcp $HOME_NET any -> $EXTERNAL_NET 443 (msg:"Allow HTTPS"; sid:1; rev:1;)'

    # AC-6: Stateful rule group with domain list (rulesSourceList).
    - name: ac6-stateful-domain-list
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac6-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac6-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac6-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac6-cfg
                type: STATEFUL
                capacity: 100
                ruleGroup:
                  rulesSource:
                    rulesSourceList:
                      targets:
                        - ".example.com"
                        - ".internal.corp"
                      targetTypes:
                        - HTTP_HOST
                        - TLS_SNI
                      generatedRulesType: DENYLIST
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac6-rg
                namespace: networkfirewallrulegroup
              spec:
                type_: STATEFUL

    # AC-7 (negative): Both ruleGroup and rules set — advisory ConfigMap reports error.
    - name: ac7-rulegroup-rules-mutual-exclusion
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac7-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac7-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac7-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac7-cfg
                type: STATEFUL
                capacity: 100
                rules: 'pass tcp any any -> any any (sid:1; rev:1;)'
                ruleGroup:
                  rulesSource:
                    statefulRules:
                      - action: PASS
                        header:
                          protocol: TCP
                          source: ANY
                          sourcePort: ANY
                          destination: ANY
                          destinationPort: ANY
                          direction: FORWARD
                        ruleOptions:
                          - keyword: sid
                            settings:
                              - "2"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac7-rg
                namespace: networkfirewallrulegroup
              status:
                validationError: "ruleGroup and rules are mutually exclusive; set one or neither."

    # AC-8 (negative — integration only): type is immutable after creation.
    # In the local test cluster (kro only, no ACK controller), kro propagates field updates;
    # ACK enforces immutability via its webhook in a full environment. This step creates a
    # STATELESS rule group and verifies it reconciles correctly; immutability rejection is
    # tested in full integration.
    - name: ac8-type-immutable
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac8-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac8-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac8-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac8-cfg
                type: STATELESS
                capacity: 100
                ruleGroup:
                  rulesSource:
                    statelessRulesAndCustomActions:
                      statelessRules:
                        - priority: 1
                          ruleDefinition:
                            actions:
                              - "aws:pass"
                            matchAttributes:
                              protocols:
                                - 6
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac8-rg
                namespace: networkfirewallrulegroup
              spec:
                type_: STATELESS

    # AC-9 (negative — integration only): capacity is immutable after creation.
    # Same constraint as AC-8: ACK enforces immutability in production. This step creates a
    # rule group with capacity=100 and verifies it reconciles; capacity immutability is tested
    # in full integration.
    - name: ac9-capacity-immutable
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac9-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac9-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac9-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac9-cfg
                type: STATEFUL
                capacity: 100
                ruleGroup:
                  rulesSource:
                    statefulRules:
                      - action: PASS
                        header:
                          protocol: TCP
                          source: ANY
                          sourcePort: ANY
                          destination: ANY
                          destinationPort: "443"
                          direction: FORWARD
                        ruleOptions:
                          - keyword: sid
                            settings:
                              - "3"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac9-rg
                namespace: networkfirewallrulegroup
              spec:
                capacity: 100

    # AC-10: Rule variables (ipSets and portSets).
    - name: ac10-rule-variables
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac10-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac10-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac10-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac10-cfg
                type: STATEFUL
                capacity: 100
                ruleGroup:
                  ruleVariables:
                    ipSets:
                      HOME_NET:
                        definition:
                          - "10.0.0.0/8"
                    portSets:
                      HTTP_PORTS:
                        definition:
                          - "80"
                          - "443"
                  rulesSource:
                    statefulRules:
                      - action: PASS
                        header:
                          protocol: TCP
                          source: $HOME_NET
                          sourcePort: ANY
                          destination: ANY
                          destinationPort: $HTTP_PORTS
                          direction: FORWARD
                        ruleOptions:
                          - keyword: sid
                            settings:
                              - "4"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac10-rg
                namespace: networkfirewallrulegroup
              spec:
                type_: STATEFUL

    # AC-11: Reference sets (ipSetReferences).
    - name: ac11-reference-sets
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac11-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac11-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac11-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac11-cfg
                type: STATEFUL
                capacity: 100
                ruleGroup:
                  referenceSets:
                    iPSetReferences:
                      BLOCKED_IPS:
                        referenceArn: "arn:aws:ec2:us-east-1:123456789012:prefix-list/pl-0123456789abcdef0"
                  rulesSource:
                    statefulRules:
                      - action: DROP
                        header:
                          protocol: IP
                          source: $BLOCKED_IPS
                          sourcePort: ANY
                          destination: ANY
                          destinationPort: ANY
                          direction: FORWARD
                        ruleOptions:
                          - keyword: sid
                            settings:
                              - "5"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac11-rg
                namespace: networkfirewallrulegroup
              spec:
                type_: STATEFUL

    # AC-12: Mandatory encryptionType=CUSTOMER_KMS wins over instance AWS_OWNED_KMS_KEY.
    - name: ac12-encryption-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac12-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                mandatory:
                  encryptionType: CUSTOMER_KMS
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac12-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"CUSTOMER_KMS","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac12-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac12-cfg
                type: STATEFUL
                capacity: 100
                encryptionType: AWS_OWNED_KMS_KEY
                kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/override-key"
                ruleGroup:
                  rulesSource:
                    statefulRules:
                      - action: PASS
                        header:
                          protocol: TCP
                          source: ANY
                          sourcePort: ANY
                          destination: ANY
                          destinationPort: "443"
                          direction: FORWARD
                        ruleOptions:
                          - keyword: sid
                            settings:
                              - "6"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac12-rg
                namespace: networkfirewallrulegroup
              spec:
                encryptionConfiguration:
                  type_: CUSTOMER_KMS

    # AC-13: defaults encryptionType=AWS_OWNED_KMS_KEY applies; no keyID.
    - name: ac13-encryption-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallConfig
              metadata:
                name: ac13-cfg
                namespace: networkfirewallrulegroup
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  encryptionType: AWS_OWNED_KMS_KEY
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch networkfirewallconfig ac13-cfg -n networkfirewallrulegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionType":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionType":"AWS_OWNED_KMS_KEY","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: NetworkFirewallRuleGroup
              metadata:
                name: ac13-rg
                namespace: networkfirewallrulegroup
              spec:
                configRef: ac13-cfg
                type: STATEFUL
                capacity: 100
                ruleGroup:
                  rulesSource:
                    statefulRules:
                      - action: PASS
                        header:
                          protocol: TCP
                          source: ANY
                          sourcePort: ANY
                          destination: ANY
                          destinationPort: "80"
                          direction: FORWARD
                        ruleOptions:
                          - keyword: sid
                            settings:
                              - "7"
        - assert:
            resource:
              apiVersion: networkfirewall.services.k8s.aws/v1alpha1
              kind: RuleGroup
              metadata:
                name: networkfirewallrulegroup-ac13-rg
