# aws-apigwv2-06 Chainsaw tests — 6 acceptance criteria for ApiGatewayV2ApiMapping.
# Namespace: apigatewayv2apimapping.
# Naming exempt (KRO-236): APIMapping has no spec.name field. No effectiveName,
# nameOverride, predictedArn, resourceName, or namingStatus.
# No cloud tags (G-7): ACK APIMapping does not support spec.tags.
#
# CANONICAL pattern: every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource name,
# deletes NOTHING between steps. The test cluster has kro but no ACK controllers, so ACK
# finalizers are never removed — per-step unique names avoid cross-contamination.
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock kropath-controller.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayv2apimapping
spec:
  skipDelete: true
  namespace: apigatewayv2apimapping
  steps:
    # ── AC-1: root mapping (apiMappingKey: "") ────────────────────────────────
    - name: ac1-apimapping-root
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac1-cfg -n apigatewayv2apimapping --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2ApiMapping
              metadata:
                name: ac1-mapping
              spec:
                configRef: ac1-cfg
                apiRef: my-http-api
                domainRef: my-domain
                stage: "$default"
                apiMappingKey: ""
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: APIMapping
              metadata:
                name: ac1-mapping
              spec:
                stage: "$default"
                apiRef:
                  from:
                    name: my-http-api
                domainRef:
                  from:
                    name: my-domain
                apiMappingKey: ""

    # ── AC-2: base-path mapping (apiMappingKey: "v1") ────────────────────────
