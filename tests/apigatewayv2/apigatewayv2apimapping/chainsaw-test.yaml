        - script:
            content: |
              kubectl patch apigatewayv2config ac3-cfg -n apigatewayv2apimapping --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2ApiMapping
              metadata:
                name: ac3a-mapping
              spec:
                configRef: ac3-cfg
                apiRef: my-http-api
                domainRef: shared-domain
                stage: "$default"
                apiMappingKey: "v1"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2ApiMapping
              metadata:
                name: ac3b-mapping
              spec:
                configRef: ac3-cfg
                apiRef: my-ws-api
                domainRef: shared-domain
                stage: "prod"
                apiMappingKey: "v2"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: APIMapping
              metadata:
                name: ac3a-mapping
              spec:
                domainRef:
                  from:
                    name: shared-domain
                apiMappingKey: "v1"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: APIMapping
              metadata:
                name: ac3b-mapping
              spec:
                domainRef:
                  from:
                    name: shared-domain
                apiMappingKey: "v2"

    # ── AC-4: cross-resource ref wiring ──────────────────────────────────────
    - name: ac4-apimapping-ref-wiring
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac4-cfg
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
