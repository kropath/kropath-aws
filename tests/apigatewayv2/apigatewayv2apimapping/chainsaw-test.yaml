                  from:
                    name: my-http-api
                domainRef:
                  from:
                    name: my-domain

    # ── AC-5: standard K8s metadata (labels, annotations, deletion policy) ────
    - name: ac5-apimapping-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
