    # ── AC-6: 3-way tag merge (defaults → spec → mandatory) ────────────────────
    # Tags in ACK VPCLink are map[string]string — last-writer-wins via .merge().
    # Merge order: defaults.syncedAnnotations → defaults.syncedLabels → defaults.tags →
    #              spec.syncedAnnotations → spec.syncedLabels → spec.tags →
    #              mandatory.syncedAnnotations → mandatory.syncedLabels → mandatory.tags
    # Use a script assert (jq) for order-independent verification per CLAUDE.md.
    - name: ac6-vpclink-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac6-cfg
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
