                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac6-cfg -n apigatewayv2vpclink --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{"environment":"production"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2VpcLink
              metadata:
                name: tagged-link
              spec:
                configRef: ac6-cfg
                tags:
                  team: networking
                subnetIds:
                  - subnet-aaa
        - script:
            content: |
              # Order-independent tag assertion — mandatory wins over spec wins over defaults
              TAGS=$(kubectl get vpclink tagged-link -n apigatewayv2vpclink -o json | jq -r '.spec.tags')
              echo "Tags: $TAGS"
              echo "$TAGS" | jq -e '."cost-centre" == "platform"' || { echo "FAIL: mandatory cost-centre tag missing"; exit 1; }
              echo "$TAGS" | jq -e '."environment" == "production"' || { echo "FAIL: defaults environment tag missing"; exit 1; }
              echo "$TAGS" | jq -e '."team" == "networking"' || { echo "FAIL: spec team tag missing"; exit 1; }
              echo "All tag assertions passed"

