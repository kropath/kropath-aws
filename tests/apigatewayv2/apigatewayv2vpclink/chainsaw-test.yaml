    # ── AC-9: immutable-subnets — lifecycle test (CLAUDE.md carve-out 2) ────────
    # In production with ACK running, the ACK controller rejects or ignores a subnetIDs
    # change (field is immutable at the AWS API level). In this test cluster (kro only,
    # no ACK controller), kro propagates the updated spec to the ACK VPCLink CR spec.
    # This step verifies that kro correctly wires the subnetIds field end-to-end and
    # propagates mutations — ACK immutability enforcement is out-of-scope for kro.
    - name: ac9-vpclink-immutable-subnets
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac9-cfg
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac9-cfg -n apigatewayv2vpclink --subresource=status --type=merge \
