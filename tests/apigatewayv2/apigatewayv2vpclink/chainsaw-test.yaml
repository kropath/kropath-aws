# aws-apigwv2-07 Chainsaw tests — 9 acceptance criteria for ApiGatewayV2VpcLink.
# Namespace: apigatewayv2vpclink. Default naming: {namespace}-{name}.
#
# CANONICAL pattern: every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource name, and
# deletes NOTHING between steps. The test cluster has kro but no ACK controllers, so ACK
# finalizers are never removed — per-step unique names avoid cross-contamination.
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock kropath-controller.
# Exception: AC-9 is a lifecycle test (CLAUDE.md carve-out 2) that mutates the same CR across
# two sub-steps to verify that kro propagates field changes; ACK enforces immutability in
# production.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayv2vpclink
spec:
  skipDelete: true
  namespace: apigatewayv2vpclink
  steps:
    # ── AC-1: basic VPC link creation with subnets and security groups ─────────
    - name: ac1-vpclink-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac1-cfg -n apigatewayv2vpclink --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2VpcLink
              metadata:
                name: create-link
              spec:
                configRef: ac1-cfg
                subnetIds:
                  - subnet-aaa
                  - subnet-bbb
                securityGroupIds:
                  - sg-111
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: VPCLink
              metadata:
                name: create-link
              spec:
                name: apigatewayv2vpclink-create-link
                subnetIDs:
                  - subnet-aaa
                  - subnet-bbb
                securityGroupIDs:
                  - sg-111
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2VpcLink
              metadata:
                name: create-link
              status:
                resourceName: apigatewayv2vpclink-create-link
                namingStatus: valid

