    # ── AC-11: tags selective — API CR gets cloud tags; Route/Integration/Authorizer don't ──
    - name: ac11-tags-selective
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac11-cfg
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags:
                    owner: ops
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac11-cfg -n apigatewayv2websocketapi --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{"owner":"ops"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: tags-api
              spec:
                configRef: ac11-cfg
                routeSelectionExpression: "$request.body.action"
                tags:
                  team: platform
                routes:
                  - routeKey: "$connect"
                    integration:
                      type: AWS_PROXY
                      integrationUri: "arn:aws:lambda:ap-southeast-2:123456789012:function:connect-fn"
                  - routeKey: "$default"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: API
              metadata:
                name: tags-api
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: tags-api-route-connect
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Integration
              metadata:
                name: tags-api-int-connect
        - script:
            content: |
              # ACK API CR must carry tags merged from mandatory + spec levels
              TAGS=$(kubectl get apis.apigatewayv2.services.k8s.aws tags-api -n apigatewayv2websocketapi -o json | jq -r '.spec.tags')
              echo "API tags: $TAGS"
              echo "$TAGS" | jq -e '.owner == "ops"'
              echo "$TAGS" | jq -e '.team == "platform"'
              # ACK Route CRs must NOT have spec.tags (WebSocket Routes don't support cloud tags)
              ROUTE_TAGS=$(kubectl get routes.apigatewayv2.services.k8s.aws tags-api-route-connect -n apigatewayv2websocketapi \
                -o json | jq -r '.spec.tags // "null"')
              echo "Route spec.tags: $ROUTE_TAGS"
              test "$ROUTE_TAGS" = "null"
              # ACK Integration CRs must NOT have spec.tags
              INT_TAGS=$(kubectl get integrations.apigatewayv2.services.k8s.aws tags-api-int-connect -n apigatewayv2websocketapi \
                -o json | jq -r '.spec.tags // "null"')
              echo "Integration spec.tags: $INT_TAGS"
              test "$INT_TAGS" = "null"

