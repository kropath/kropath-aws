      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac4-cfg
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac4-cfg -n apigatewayv2websocketapi --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        # Initial apply: 3 routes
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: scale-api
              spec:
                configRef: ac4-cfg
                routeSelectionExpression: "$request.body.action"
                routes:
                  - routeKey: "$connect"
                  - routeKey: "$disconnect"
                  - routeKey: "$default"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: scale-api-route-connect
              spec:
                routeKey: "$connect"
        # Scale-up: add sendMessage route
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: scale-api
              spec:
                configRef: ac4-cfg
                routeSelectionExpression: "$request.body.action"
                routes:
                  - routeKey: "$connect"
                  - routeKey: "$disconnect"
                  - routeKey: "$default"
                  - routeKey: "sendMessage"
                    integration:
                      type: AWS_PROXY
                      integrationUri: "arn:aws:lambda:ap-southeast-2:123456789012:function:msg-fn"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: scale-api-route-sendmessage
              spec:
                routeKey: "sendMessage"
        # Existing routes must still be present after scale-up
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: scale-api-route-connect
              spec:
                routeKey: "$connect"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: scale-api-route-default
              spec:
                routeKey: "$default"

    # ── AC-5: scale-down — remove a route from an existing WebSocket API ───────
    # Lifecycle test: same CR mutated. In the test cluster (no ACK controllers) the
    # removed Route CR remains in Terminating state due to ACK finalizers — we assert
    # only that the CR spec update is accepted and remaining routes still exist.
    - name: ac5-scale-down-remove-route
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac5-cfg
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac5-cfg -n apigatewayv2websocketapi --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        # Initial apply: 4 routes
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: shrink-api
              spec:
                configRef: ac5-cfg
                routeSelectionExpression: "$request.body.action"
                routes:
                  - routeKey: "$connect"
                  - routeKey: "$disconnect"
                  - routeKey: "$default"
                  - routeKey: "sendMessage"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: shrink-api-route-connect
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: shrink-api-route-sendmessage
        # Scale-down: re-apply with sendMessage removed
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: shrink-api
              spec:
                configRef: ac5-cfg
                routeSelectionExpression: "$request.body.action"
                routes:
                  - routeKey: "$connect"
                  - routeKey: "$disconnect"
                  - routeKey: "$default"
        # CR is still valid after removing a route
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: shrink-api
              status:
                resourceName: apigatewayv2websocketapi-shrink-api
                namingStatus: valid
        # Remaining routes must still exist
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: shrink-api-route-connect
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: shrink-api-route-disconnect
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: shrink-api-route-default

    # ── AC-6: empty routes sets validationError; ACK API NOT created ───────────
    - name: ac6-empty-routes-validation-error
      try:
        - apply:
