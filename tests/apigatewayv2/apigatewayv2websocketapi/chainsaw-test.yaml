# aws-apigwv2-03 Chainsaw tests — 12 acceptance criteria for ApiGatewayV2WebSocketApi.
# Namespace: apigatewayv2websocketapi. Default naming: {namespace}-{name}.
#
# CANONICAL pattern: every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource name, and
# deletes NOTHING between steps. The test cluster has kro but no ACK controllers, so ACK
# finalizers are never removed — per-step unique names avoid cross-contamination.
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock kropath-controller.
# Exceptions: AC-4 and AC-5 are lifecycle tests (CLAUDE.md carve-out) that mutate the same CR.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayv2websocketapi
spec:
  skipDelete: true
  namespace: apigatewayv2websocketapi
  steps:
    # ── AC-1: basic WebSocket API with $connect/$disconnect/$default + integrations ─
    - name: ac1-connect-disconnect-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac1-cfg -n apigatewayv2websocketapi --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: connect-api
              spec:
                configRef: ac1-cfg
                routeSelectionExpression: "$request.body.action"
                routes:
                  - routeKey: "$connect"
                    integration:
                      type: AWS_PROXY
                      integrationUri: "arn:aws:lambda:ap-southeast-2:123456789012:function:connect-fn"
                  - routeKey: "$disconnect"
                    integration:
                      type: AWS_PROXY
                      integrationUri: "arn:aws:lambda:ap-southeast-2:123456789012:function:disconnect-fn"
                  - routeKey: "$default"
                    integration:
                      type: AWS_PROXY
                      integrationUri: "arn:aws:lambda:ap-southeast-2:123456789012:function:default-fn"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: API
              metadata:
                name: connect-api
              spec:
                protocolType: WEBSOCKET
                routeSelectionExpression: "$request.body.action"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: connect-api-route-connect
              spec:
                routeKey: "$connect"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: connect-api-route-disconnect
              spec:
                routeKey: "$disconnect"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: connect-api-route-default
              spec:
                routeKey: "$default"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Integration
              metadata:
                name: connect-api-int-connect
              spec:
                integrationType: AWS_PROXY
                integrationURI: "arn:aws:lambda:ap-southeast-2:123456789012:function:connect-fn"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Integration
              metadata:
                name: connect-api-int-disconnect
              spec:
                integrationType: AWS_PROXY
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Integration
              metadata:
                name: connect-api-int-default
              spec:
                integrationType: AWS_PROXY
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: connect-api
              status:
                resourceName: apigatewayv2websocketapi-connect-api
                namingStatus: valid

    # ── AC-2: custom route key alongside standard routes ──────────────────────
    - name: ac2-custom-route-key
      try:
        - apply:
