              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Integration
              metadata:
                name: custom-api-int-sendmessage
              spec:
                integrationType: AWS_PROXY
                integrationURI: "arn:aws:lambda:ap-southeast-2:123456789012:function:message-fn"
        # All four routes must be present
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: custom-api-route-connect
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: custom-api-route-disconnect
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: custom-api-route-default

    # ── AC-3: REQUEST authorizer creates ACK Authorizer CR ─────────────────────
    - name: ac3-request-authorizer
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac3-cfg
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac3-cfg -n apigatewayv2websocketapi --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: auth-api
              spec:
                configRef: ac3-cfg
                routeSelectionExpression: "$request.body.action"
                authorizers:
                  - name: ConnectAuth
                    identitySource:
                      - "route.request.header.Authorization"
                    authorizerUri: "arn:aws:apigateway:ap-southeast-2:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-southeast-2:123456789012:function:authorizer/invocations"
                routes:
                  - routeKey: "$connect"
                    authorizationType: CUSTOM
                    authorizerRef: ConnectAuth
                  - routeKey: "$disconnect"
                  - routeKey: "$default"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Authorizer
              metadata:
                name: auth-api-auth-connectauth
              spec:
                authorizerType: REQUEST
                identitySource:
                  - "route.request.header.Authorization"
                authorizerURI: "arn:aws:apigateway:ap-southeast-2:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-southeast-2:123456789012:function:authorizer/invocations"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: auth-api-route-connect
              spec:
                routeKey: "$connect"
                authorizationType: CUSTOM
                authorizerRef:
                  from:
                    name: auth-api-auth-connectauth

    # ── AC-4: scale-up — add a 4th route to an existing WebSocket API ─────────
