                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac2-cfg -n apigatewayv2websocketapi --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2WebSocketApi
              metadata:
                name: custom-api
              spec:
                configRef: ac2-cfg
                routeSelectionExpression: "$request.body.action"
                routes:
                  - routeKey: "$connect"
                    integration:
                      type: AWS_PROXY
                      integrationUri: "arn:aws:lambda:ap-southeast-2:123456789012:function:connect-fn"
                  - routeKey: "$disconnect"
                    integration:
                      type: AWS_PROXY
                      integrationUri: "arn:aws:lambda:ap-southeast-2:123456789012:function:disconnect-fn"
                  - routeKey: "$default"
                    integration:
                      type: AWS_PROXY
                      integrationUri: "arn:aws:lambda:ap-southeast-2:123456789012:function:default-fn"
                  - routeKey: "sendMessage"
                    integration:
                      type: AWS_PROXY
                      integrationUri: "arn:aws:lambda:ap-southeast-2:123456789012:function:message-fn"
        - assert:
