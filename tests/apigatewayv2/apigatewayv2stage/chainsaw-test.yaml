              kubectl patch apigatewayv2config ac5-cfg -n apigatewayv2stage --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"arn:aws:logs:us-east-1:123456789012:log-group:mand-logs","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Stage
              metadata:
                name: ac5-stage
              spec:
                configRef: ac5-cfg
                apiRef: my-http-api
                stageName: ac5
                # accessLogSettings omitted; format comes from fallback
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Stage
              metadata:
                name: ac5-stage
              spec:
                accessLogSettings:
                  destinationARN: "arn:aws:logs:us-east-1:123456789012:log-group:mand-logs"
        - script:
            # Verify AWS-recommended JSON fallback format is applied
            content: |
              FORMAT=$(kubectl get stage ac5-stage -n apigatewayv2stage -o jsonpath='{.spec.accessLogSettings.format}')
              echo "Format: $FORMAT"
              echo "$FORMAT" | grep -q '"requestId":"$context.requestId"' || { echo "FAIL: AWS JSON fallback format not applied. Got: $FORMAT"; exit 1; }
              echo "PASS: AWS JSON fallback format applied"

    # ── AC-6: mandatory throttlingBurstLimit wins over instance ──────────────
    - name: ac6-stage-throttling-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
