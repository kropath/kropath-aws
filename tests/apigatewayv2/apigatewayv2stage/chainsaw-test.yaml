                  accessLogDestinationArn: "arn:aws:logs:us-east-1:123456789012:log-group:mandatory-logs"
                  accessLogFormat: "$mandatory-json-format"
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
