                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac3-cfg -n apigatewayv2stage --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"arn:aws:logs:us-east-1:123456789012:log-group:mandatory-logs","accessLogFormat":"$mandatory-json-format","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Stage
              metadata:
                name: ac3-stage
              spec:
                configRef: ac3-cfg
                apiRef: my-http-api
                stageName: ac3
                # accessLogSettings omitted — mandatory config governs
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Stage
              metadata:
                name: ac3-stage
              spec:
                accessLogSettings:
                  destinationARN: "arn:aws:logs:us-east-1:123456789012:log-group:mandatory-logs"
                  format: "$mandatory-json-format"

