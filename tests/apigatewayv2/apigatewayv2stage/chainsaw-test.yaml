        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Stage
              metadata:
                name: ac6-stage
              spec:
                defaultRouteSettings:
                  # mandatory 100 wins over instance 500
                  throttlingBurstLimit: 100

