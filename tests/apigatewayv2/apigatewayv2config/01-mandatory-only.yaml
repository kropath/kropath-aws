# AC-1: CR with fields only in spec.mandatory is accepted by API server.
---
apiVersion: aws.kropath.run/v1alpha1
kind: ApiGatewayV2Config
metadata:
  name: mandatory-only
  namespace: apigatewayv2config
spec:
  mandatory:
    corsEnabled: true
    disableExecuteApiEndpoint: true
    defaultThrottlingBurstLimit: 500
    defaultThrottlingRateLimit: 100.0
    minimumTlsVersion: "TLS_1_2"
    accessLogDestinationArn: "arn:aws:logs:us-east-1:123456789012:log-group:/aws/apigw"
    accessLogFormat: "$context.requestId"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    corsEnabled: false
    disableExecuteApiEndpoint: false
    defaultThrottlingBurstLimit: 0
    defaultThrottlingRateLimit: 0.0
    minimumTlsVersion: ""
    accessLogDestinationArn: ""
    accessLogFormat: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
