# AC-9: accessLogFormat set in both tiers — must be rejected.
---
apiVersion: aws.kropath.run/v1alpha1
kind: ApiGatewayV2Config
metadata:
  name: invalid-both-accesslogformat
  namespace: apigatewayv2config
spec:
  mandatory:
    corsEnabled: false
    disableExecuteApiEndpoint: false
    defaultThrottlingBurstLimit: 0
    defaultThrottlingRateLimit: 0.0
    minimumTlsVersion: ""
    accessLogDestinationArn: ""
    accessLogFormat: "$json"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    corsEnabled: false
    disableExecuteApiEndpoint: false
    defaultThrottlingBurstLimit: 0
    defaultThrottlingRateLimit: 0.0
    minimumTlsVersion: ""
    accessLogDestinationArn: ""
    accessLogFormat: "$clf"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
