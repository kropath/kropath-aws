# aws-apigwv2-05 Chainsaw tests — 9 acceptance criteria for ApiGatewayV2DomainName.
# Namespace: apigatewayv2domainname.
# Naming exempt (KRO-236): DomainName uses spec.domainName as identity; no effectiveName,
# nameOverride, predictedArn, resourceName, or namingStatus.
#
# CANONICAL pattern: every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource name,
# deletes NOTHING between steps. The test cluster has kro but no ACK controllers, so ACK
# finalizers are never removed — per-step unique names avoid cross-contamination.
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock kropath-controller.
#
# AC-8 (negative: empty domainNameConfigurations): uses ConfigMap advisory pattern instead of
# API server rejection — kro cannot preserve x-kubernetes-validations across upgrades.
# Test asserts status.validationError is set, NOT that the resource is rejected at admission.
#
# Tag assertions (AC-6) use jq script steps — CEL map-to-list transforms have unstable order
# and chainsaw has no order-independent list assert (see frequent-rgd-errors.md §6).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayv2domainname
spec:
  skipDelete: true
  namespace: apigatewayv2domainname
  steps:
    # ── AC-1: basic domain name creation with certificate and TLS_1_2 ─────────
    - name: ac1-domain-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac1-cfg -n apigatewayv2domainname --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              metadata:
                name: ac1-domain
              spec:
                configRef: ac1-cfg
                domainName: "api.example.com"
                domainNameConfigurations:
                  - certificateArn: "arn:aws:acm:ap-southeast-2:123456789012:certificate/abc-123"
                    endpointType: REGIONAL
                    securityPolicy: "TLS_1_2"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: DomainName
              metadata:
                name: ac1-domain
              spec:
                domainName: "api.example.com"
                domainNameConfigurations:
                  - certificateARN: "arn:aws:acm:ap-southeast-2:123456789012:certificate/abc-123"
                    endpointType: REGIONAL
                    securityPolicy: "TLS_1_2"
                    ownershipVerificationCertificateARN: ""

    # ── AC-2: mutual TLS with S3 truststore URI ────────────────────────────────
    - name: ac2-domain-mtls
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac2-cfg
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac2-cfg -n apigatewayv2domainname --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              metadata:
                name: ac2-domain
              spec:
                configRef: ac2-cfg
                domainName: "mtls.example.com"
                domainNameConfigurations:
                  - certificateArn: "arn:aws:acm:ap-southeast-2:123456789012:certificate/def-456"
                    endpointType: REGIONAL
                    securityPolicy: "TLS_1_2"
                mutualTlsAuthentication:
                  truststoreUri: "s3://my-bucket/truststore.pem"
                  truststoreVersion: "abc123"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: DomainName
              metadata:
                name: ac2-domain
              spec:
                domainName: "mtls.example.com"
                mutualTLSAuthentication:
                  truststoreURI: "s3://my-bucket/truststore.pem"
                  truststoreVersion: "abc123"

    # ── AC-3: mandatory.minimumTlsVersion overrides instance securityPolicy ────
    - name: ac3-domain-tls-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac3-cfg
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac3-cfg -n apigatewayv2domainname --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              metadata:
                name: ac3-domain
              spec:
                configRef: ac3-cfg
                domainName: "mandatory-tls.example.com"
                domainNameConfigurations:
                  - certificateArn: "arn:aws:acm:ap-southeast-2:123456789012:certificate/ghi-789"
                    # instance sets TLS_1_0 but mandatory.minimumTlsVersion: TLS_1_2 must win
                    securityPolicy: "TLS_1_0"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: DomainName
              metadata:
                name: ac3-domain
              spec:
                domainNameConfigurations:
                  - securityPolicy: "TLS_1_2"

    # ── AC-4: defaults.minimumTlsVersion applies when instance does not set securityPolicy ─
    - name: ac4-domain-tls-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac4-cfg
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac4-cfg -n apigatewayv2domainname --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              metadata:
                name: ac4-domain
              spec:
                configRef: ac4-cfg
                domainName: "default-tls.example.com"
                domainNameConfigurations:
                  - certificateArn: "arn:aws:acm:ap-southeast-2:123456789012:certificate/jkl-012"
                    # securityPolicy not set → empty string "" → defaults.minimumTlsVersion applies
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: DomainName
              metadata:
                name: ac4-domain
              spec:
                domainNameConfigurations:
                  - securityPolicy: "TLS_1_2"

    # ── AC-5: instance securityPolicy wins over defaults.minimumTlsVersion ─────
    - name: ac5-domain-tls-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac5-cfg
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac5-cfg -n apigatewayv2domainname --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              metadata:
                name: ac5-domain
              spec:
                configRef: ac5-cfg
                domainName: "instance-tls.example.com"
                domainNameConfigurations:
                  - certificateArn: "arn:aws:acm:ap-southeast-2:123456789012:certificate/mno-345"
                    # instance explicitly sets TLS_1_0; defaults has TLS_1_2 but instance wins
                    securityPolicy: "TLS_1_0"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: DomainName
              metadata:
                name: ac5-domain
              spec:
                domainNameConfigurations:
                  - securityPolicy: "TLS_1_0"

    # ── AC-6: tags from all three tiers merge correctly (mandatory wins) ────────
    # Tags have unstable iteration order from CEL map merge — use jq for assertions.
    - name: ac6-domain-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac6-cfg
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags:
                    environment: production
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    environment: staging
                    team: platform
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac6-cfg -n apigatewayv2domainname --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{"environment":"production"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{"environment":"staging","team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              metadata:
                name: ac6-domain
              spec:
                configRef: ac6-cfg
                domainName: "tags.example.com"
                domainNameConfigurations:
                  - certificateArn: "arn:aws:acm:ap-southeast-2:123456789012:certificate/pqr-678"
                    securityPolicy: "TLS_1_2"
                tags:
                  cost-centre: platform
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: DomainName
              metadata:
                name: ac6-domain
        - script:
            content: |
              # Verify mandatory wins for 'environment' (production over staging)
              ENV=$(kubectl get domainnames.apigatewayv2.services.k8s.aws ac6-domain -n apigatewayv2domainname -o json | jq -r '.spec.tags.environment')
              if [ "$ENV" != "production" ]; then
                echo "FAIL: expected environment=production (mandatory wins), got $ENV"
                exit 1
              fi
              # Verify defaults-only tag 'team' is present
              TEAM=$(kubectl get domainnames.apigatewayv2.services.k8s.aws ac6-domain -n apigatewayv2domainname -o json | jq -r '.spec.tags.team')
              if [ "$TEAM" != "platform" ]; then
                echo "FAIL: expected team=platform (from defaults), got $TEAM"
                exit 1
              fi
              # Verify instance-only tag 'cost-centre' is present
              CC=$(kubectl get domainnames.apigatewayv2.services.k8s.aws ac6-domain -n apigatewayv2domainname -o json | jq -r '.spec.tags["cost-centre"]')
              if [ "$CC" != "platform" ]; then
                echo "FAIL: expected cost-centre=platform (from instance), got $CC"
                exit 1
              fi
              echo "AC-6 tags OK: environment=production (mandatory wins), team=platform (defaults), cost-centre=platform (instance)"

    # ── AC-7: standard K8s labels, annotations, and deletion policy ───────────
    - name: ac7-domain-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac7-cfg
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels:
                    team: ops
                  syncedAnnotations:
                    owner: platform-team
        - script:
            content: |
              kubectl patch apigatewayv2config ac7-cfg -n apigatewayv2domainname --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{"team":"ops"},"syncedAnnotations":{"owner":"platform-team"}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              metadata:
                name: ac7-domain
              spec:
                configRef: ac7-cfg
                domainName: "metadata.example.com"
                domainNameConfigurations:
                  - certificateArn: "arn:aws:acm:ap-southeast-2:123456789012:certificate/stu-901"
                    securityPolicy: "TLS_1_2"
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: DomainName
              metadata:
                name: ac7-domain
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac7-domain
                  aws.kropath.run/team: ops
                annotations:
                  services.k8s.aws/deletion-policy: retain
                  aws.kropath.run/owner: platform-team

    # ── AC-8: negative — empty domainNameConfigurations triggers advisory ───────
    # kro cannot preserve x-kubernetes-validations; uses ConfigMap advisory pattern.
    # status.validationError is set; ACK DomainName is NOT created.
    - name: ac8-domain-empty-configurations
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac8-cfg
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac8-cfg -n apigatewayv2domainname --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              metadata:
                name: ac8-domain
              spec:
                configRef: ac8-cfg
                domainName: "empty-cfg.example.com"
                # domainNameConfigurations: [] — empty array triggers minSizeError advisory
                domainNameConfigurations: []
        # Advisory ConfigMap must exist with the error message
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac8-domain-minsizeerror
                namespace: apigatewayv2domainname
              data:
                error: "At least one domainNameConfigurations entry is required."
        # status.validationError must reflect the advisory error
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2DomainName
              metadata:
                name: ac8-domain
              status:
                validationError: "At least one domainNameConfigurations entry is required."
        # ACK DomainName must NOT be created (includeWhen gates on size >= 1)
        - script:
            content: |
              COUNT=$(kubectl get domainnames.apigatewayv2.services.k8s.aws -n apigatewayv2domainname -o json | jq '[.items[] | select(.metadata.name == "ac8-domain")] | length')
              if [ "$COUNT" != "0" ]; then
                echo "FAIL: ACK DomainName ac8-domain must not be created when configurations is empty, got $COUNT"
                exit 1
              fi
              echo "AC-8 OK: ACK DomainName not created; advisory ConfigMap present with error"

    # ── AC-9: deletionPolicy: delete → annotation services.k8s.aws/deletion-policy: delete ─
    - name: ac9-domain-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac9-cfg
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
