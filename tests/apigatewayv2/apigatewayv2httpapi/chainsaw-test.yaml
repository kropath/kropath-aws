    # ── AC-21: protocolType is always HTTP on all created ACK APIs ─────────────
    - name: ac21-protocol-type-always-http
      try:
        - script:
            content: |
              # Verify that all ACK API CRs in the namespace have protocolType: HTTP
              TYPES=$(kubectl get apis.apigatewayv2.services.k8s.aws -n apigatewayv2httpapi -o jsonpath='{.items[*].spec.protocolType}')
              echo "Found protocolTypes: $TYPES"
              for TYPE in $TYPES; do
                test "$TYPE" = "HTTP" || (echo "Expected HTTP but got $TYPE" && exit 1)
              done
              # Ensure we actually found at least one API
              COUNT=$(kubectl get apis.apigatewayv2.services.k8s.aws -n apigatewayv2httpapi --no-headers 2>/dev/null | wc -l | tr -d ' ')
              test "$COUNT" -gt "0"

