# aws-apigwv2-02 Chainsaw tests — 21 acceptance criteria for ApiGatewayV2HttpApi.
# Namespace: apigatewayv2httpapi. Default naming: {namespace}-{name} → apigatewayv2httpapi-<cr-name>.
#
# CANONICAL pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource name, and
# deletes NOTHING between steps. The test cluster has kro but no ACK controllers, so ACK
# finalizers are never removed — per-step unique names avoid cross-contamination.
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock kropath-controller.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apigatewayv2httpapi
spec:
  skipDelete: true
  namespace: apigatewayv2httpapi
  steps:
    # ── AC-1 + AC-2: basic HTTP API creation + default naming ─────────────────
    - name: ac1-ac2-basic-api-default-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2Config
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: ""
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  corsEnabled: false
                  disableExecuteApiEndpoint: false
                  defaultThrottlingBurstLimit: 0
                  defaultThrottlingRateLimit: 0.0
                  minimumTlsVersion: "TLS_1_2"
                  accessLogDestinationArn: ""
                  accessLogFormat: ""
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch apigatewayv2config ac1-cfg -n apigatewayv2httpapi --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"corsEnabled":false,"disableExecuteApiEndpoint":false,"defaultThrottlingBurstLimit":0,"defaultThrottlingRateLimit":0,"minimumTlsVersion":"TLS_1_2","accessLogDestinationArn":"","accessLogFormat":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              metadata:
                name: minimal-api
              spec:
                configRef: ac1-cfg
                routes:
                  - routeKey: "$default"
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: API
              metadata:
                name: minimal-api
              spec:
                name: apigatewayv2httpapi-minimal-api
                protocolType: HTTP
        - assert:
            resource:
              apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
              kind: Route
              metadata:
                name: minimal-api-route-default
              spec:
                routeKey: "$default"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ApiGatewayV2HttpApi
              metadata:
                name: minimal-api
              status:
                resourceName: apigatewayv2httpapi-minimal-api
                namingStatus: valid

