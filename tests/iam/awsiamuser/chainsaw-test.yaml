---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awsiamuser
spec:
  namespace: awsiamuser
  steps:
    - name: seed-effective-config
      try:
        - script:
            content: |
              kubectl delete awsiamconfig user-general-policy -n awsiamuser --ignore-not-found=true
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl patch awsiamconfig user-general-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - script:
            content: |
              echo "=== LIVE STATUS REVEAL ==="
              kubectl get awsiamconfig user-general-policy -n awsiamuser -o yaml

    # AC-1: basic user, no access key created
    - name: ac1-basic-user-no-access-key
      try:
        - apply:
            file: 01-basic-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: basic-user
                namespace: awsiamuser
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: basic-user
              spec:
                name: awsiamuser-basic-user
                path: /

    # AC-3: createAccessKey=true but mandatory.blockIamUserAccessKeys=true — access key suppressed
    - name: ac3-access-key-blocked-by-mandatory
      try:
        - script:
            content: |
              kubectl patch awsiamconfig user-general-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig user-general-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":true,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 03-blocked-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: blocked-user
                namespace: awsiamuser
              spec:
                name: awsiamuser-blocked-user
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMUser
              metadata:
                name: blocked-user
                namespace: awsiamuser
              status:
                accessKeyBlocked: true
                accessKeyBlockedConditionType: AccessKeyBlockedByGovernance

    # AC-5: createAccessKey=false + mandatory.blockIamUserAccessKeys=true — blocked flag is false (user didn't request a key)
    - name: ac5-no-request-when-governance-blocked
      try:
        - apply:
            file: 04-no-request-blocked-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: no-request-blocked-user
                namespace: awsiamuser
              spec:
                name: awsiamuser-no-request-blocked-user
        # Advisory ConfigMap must NOT exist — no key was requested so governance suppression should not trigger
        - script:
            content: |
              if kubectl get configmap no-request-blocked-user-access-key-blocked -n awsiamuser 2>/dev/null; then
                echo "FAIL: advisory ConfigMap should not exist" >&2
                exit 1
              fi
              echo "OK: advisory ConfigMap absent as expected"

    - name: reset-config-to-unblocked
      try:
        - script:
            content: |
              kubectl patch awsiamconfig user-general-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig user-general-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'


    # AC-4: namespace-local AWSIAMConfig with mandatory.blockIamUserAccessKeys=true suppresses access key
    - name: ac4-namespace-local-block
      try:
        - script:
            content: |
              kubectl delete awsiamconfig namespace-strict-policy -n awsiamuser --ignore-not-found=true
        - apply:
            file: 15-namespace-strict-config.yaml
        - script:
            content: |
              kubectl patch awsiamconfig namespace-strict-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":true,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 16-namespace-blocked-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: namespace-blocked-user
                namespace: awsiamuser
              spec:
                name: awsiamuser-namespace-blocked-user
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMUser
              metadata:
                name: namespace-blocked-user
                namespace: awsiamuser
              status:
                accessKeyBlocked: true
                accessKeyBlockedConditionType: AccessKeyBlockedByGovernance

    # AC-6: groups passed through to ACK User
    - name: ac6-groups-user
      try:
        - apply:
            file: 05-groups-user.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMUser
              metadata:
                name: groups-user
                namespace: awsiamuser
              status:
                namingStatus: valid

    # AC-7: policy ARN attached directly
    - name: ac7-arn-policy-user
      try:
        - apply:
            file: 06-arn-policy-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: arn-policy-user
                namespace: awsiamuser
              spec:
                name: awsiamuser-arn-policy-user
                policies:
                  - arn:aws:iam::aws:policy/ReadOnlyAccess

    # AC-8: policy attached via AWSIAMPolicy CR ref
    - name: ac8-policy-ref-user
      try:
        - apply:
            file: 07-my-policy.yaml
        - script:
            content: |
              # Wait for kro to create the underlying ACK Policy object
              for i in $(seq 1 30); do
                kubectl get policies.iam.services.k8s.aws my-policy -n awsiamuser 2>/dev/null && break
                sleep 1
              done
              # Seed a fake ARN on the ACK Policy status — kro reads ackResourceMetadata.arn
              kubectl patch policies.iam.services.k8s.aws my-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:policy/MyPolicy","ownerAccountID":"123456789012","region":"us-east-1"}}}'
              # Wait for kro to propagate the ARN to AWSIAMPolicy.status.arn
              for i in $(seq 1 30); do
                arn=$(kubectl get awsiampolicy my-policy -n awsiamuser -o jsonpath='{.status.arn}' 2>/dev/null)
                [ -n "$arn" ] && break
                sleep 1
              done
        - apply:
            file: 08-policy-ref-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: policy-ref-user
                namespace: awsiamuser
              spec:
                name: awsiamuser-policy-ref-user
                policies:
                  - arn:aws:iam::123456789012:policy/MyPolicy

    # AC-9: inline policy via documentJSON
    - name: ac9-inline-policy-json
      try:
        - apply:
            file: 09-inline-json-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: inline-json-user
                namespace: awsiamuser
              spec:
                name: awsiamuser-inline-json-user
                inlinePolicies:
                  s3-write: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject"],"Resource":"*"}]}'

    # AC-9b: inline policy via AWSPolicyDocument CR ref
    - name: ac9b-inline-policy-doc-ref
      try:
        - apply:
            file: 10-policy-doc.yaml
        - apply:
            file: 11-inline-doc-ref-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: inline-doc-ref-user
                namespace: awsiamuser
              spec:
                name: awsiamuser-inline-doc-ref-user
                inlinePolicies:
                  ec2-read: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["ec2:Describe*"],"Resource":"*"}]}'

    # AC-10: naming template produces resourceName and predictedArn
    - name: ac10-naming-template-resource-name
      try:
        - apply:
            file: 12-named-user.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMUser
              metadata:
                name: named-user
                namespace: awsiamuser
              status:
                resourceName: awsiamuser-named-user
                predictedArn: "arn:aws:iam::123456789012:user/awsiamuser-named-user"
                namingStatus: valid

    # AC-11: mandatory + spec tags merge, mandatory wins
    - name: ac11-tags-merge
      try:
        - script:
            content: |
              kubectl patch awsiamconfig user-general-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig user-general-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":false,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 13-tags-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: tags-user
                namespace: awsiamuser
              spec:
                name: awsiamuser-tags-user
                tags:
                  - key: cost-centre
                    value: platform
                  - key: team
                    value: ops

    # AC-12: syncedLabels appear as kropath.run/ labels on User AND as plain keys in cloud tags
    - name: ac12-synced-labels
      try:
        - script:
            content: |
              kubectl patch awsiamconfig user-general-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig user-general-policy -n awsiamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":false,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 14-synced-labels-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: synced-labels-user
                namespace: awsiamuser
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: synced-labels-user
                  kropath.run/environment: production
              spec:
                name: awsiamuser-synced-labels-user
                tags:
                  - key: environment
                    value: production

    # AC-13: ACK User child has required standard metadata
    - name: ac13-standard-metadata
      try:
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: basic-user
                namespace: awsiamuser
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: basic-user
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: awsiamuser-basic-user
                path: /
