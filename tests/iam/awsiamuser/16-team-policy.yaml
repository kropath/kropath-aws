apiVersion: kropath.run/v1alpha1
kind: AWSIAMPolicy
metadata:
  name: team-policy
  namespace: default
spec:
  configRef: user-general-policy
  description: Team policy for user ref resolution
  path: "/"
  nameOverride: ""
  deletionPolicy: retain
  documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"*"}]}'
  documentRef: ""
  tags: {}
  syncedLabels: {}
  syncedAnnotations: {}
