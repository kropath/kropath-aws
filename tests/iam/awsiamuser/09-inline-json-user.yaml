apiVersion: kropath.run/v1alpha1
kind: AWSIAMUser
metadata:
  name: inline-json-user
  namespace: awsiamuser
spec:
  configRef: user-general-policy
  policies:
    - inline:
        name: s3-write
        documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject"],"Resource":"*"}]}'
