apiVersion: aws.kropath.run/v1alpha1
kind: AWSIAMIdentityProvider
metadata:
  name: insecure-oidc
  namespace: awsiamidentityprovider
spec:
  configRef: general-policy
  type: oidc
  nameOverride: ""
  deletionPolicy: retain
  tags: {}
  syncedLabels: {}
  syncedAnnotations: {}
  oidc:
    url: http://insecure-url.com
    thumbprints: []
    audiences:
      - sts.amazonaws.com
