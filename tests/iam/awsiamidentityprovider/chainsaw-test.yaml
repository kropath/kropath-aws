# aws-iam-04 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awsiamidentityprovider
spec:
  steps:
    - name: ac1-oidc-child-created
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 01-oidc-basic.yaml
        - assert:
            file: 02-assert-oidc-provider.yaml
      cleanup:
        - delete:
            file: 01-oidc-basic.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml

    - name: ac2-saml-child-created
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 03-saml-basic.yaml
        - assert:
            file: 04-assert-saml-provider.yaml
      cleanup:
        - delete:
            file: 03-saml-basic.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml

    - name: ac3-oidc-provider-arn
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 01-oidc-basic.yaml
        - script:
            content: |
              kubectl patch openidconnectprovider oidc-provider -n default \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID"}}}'
        - assert:
            file: 05-assert-oidc-provider-arn.yaml
      cleanup:
        - delete:
            file: 01-oidc-basic.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml

    - name: ac4-saml-provider-arn
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 03-saml-basic.yaml
        - script:
            content: |
              kubectl patch samlprovider saml-provider -n default \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:saml-provider/example-saml"}}}'
        - assert:
            file: 06-assert-saml-provider-arn.yaml
      cleanup:
        - delete:
            file: 03-saml-basic.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml

    - name: ac5-role-trust-policy-uses-provider-arn
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 01-oidc-basic.yaml
        - script:
            content: |
              kubectl patch openidconnectprovider oidc-provider -n default \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID"}}}'
        - apply:
            file: 07-awsiamrole-irsa.yaml
        - assert:
            file: 08-assert-role-trust-policy.yaml
      cleanup:
        - delete:
            file: 07-awsiamrole-irsa.yaml
        - delete:
            file: 01-oidc-basic.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml

    - name: ac6-oidc-url-must-be-https
      try:
        - apply:
            file: 05-invalid-oidc-url.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSIAMIdentityProvider
                check:
                  ($error != null): true

    - name: ac7-mandatory-tags-forwarded
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 09-tags.yaml
        - assert:
            file: 10-assert-tags.yaml
      cleanup:
        - delete:
            file: 09-tags.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml

    - name: ac8-synced-labels-forwarded
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 11-synced-labels.yaml
        - assert:
            file: 12-assert-synced-labels.yaml
      cleanup:
        - delete:
            file: 11-synced-labels.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml

    - name: ac9-standard-metadata
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 01-oidc-basic.yaml
        - assert:
            file: 13-assert-standard-metadata.yaml
      cleanup:
        - delete:
            file: 01-oidc-basic.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml

    - name: ac10-default-retain-policy
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 01-oidc-basic.yaml
        - assert:
            file: 14-assert-retain-policy.yaml
      cleanup:
        - delete:
            file: 01-oidc-basic.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml

    - name: ac11-delete-policy-forwarded
      try:
        - apply:
            file: 00-awsiamconfig-general-policy.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 15-delete-policy.yaml
        - assert:
            file: 16-assert-delete-policy.yaml
      cleanup:
        - delete:
            file: 15-delete-policy.yaml
        - delete:
            file: 00-awsiamconfig-general-policy.yaml
