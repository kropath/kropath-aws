---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awsiamidentityprovider
spec:
  steps:
    - name: seed-effective-config
      try:
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'

    - name: oidc-create
      try:
        - apply:
            file: 01-oidc-provider.yaml
        - assert:
            file: 01-assert-oidc-provider.yaml
      cleanup:
        - delete:
            file: 01-oidc-provider.yaml

    - name: saml-create
      try:
        - apply:
            file: 02-saml-provider.yaml
        - assert:
            file: 02-assert-saml-provider.yaml
      cleanup:
        - delete:
            file: 02-saml-provider.yaml

    - name: oidc-provider-arn
      try:
        - apply:
            file: 01-oidc-provider.yaml
        - assert:
            file: 01-assert-oidc-provider.yaml
        - script:
            content: |
              kubectl patch openidconnectprovider oidc-provider -n default \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID"}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSIAMIdentityProvider
              metadata:
                name: oidc-provider
                namespace: default
              status:
                providerArn: arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID
      cleanup:
        - delete:
            file: 01-oidc-provider.yaml

    - name: saml-provider-arn
      try:
        - apply:
            file: 02-saml-provider.yaml
        - assert:
            file: 02-assert-saml-provider.yaml
        - script:
            content: |
              kubectl patch samlprovider saml-provider -n default \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:saml-provider/saml-provider"}}}'
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSIAMIdentityProvider
              metadata:
                name: saml-provider
                namespace: default
              status:
                providerArn: arn:aws:iam::123456789012:saml-provider/saml-provider
      cleanup:
        - delete:
            file: 02-saml-provider.yaml

    - name: eks-irsa-trust
      try:
        - apply:
            file: 01-oidc-provider.yaml
        - script:
            content: |
              kubectl patch openidconnectprovider oidc-provider -n default \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID"}}}'
        - apply:
            file: 03-eks-irsa-role.yaml
        - assert:
            file: 03-assert-irsa-role.yaml
      cleanup:
        - delete:
            file: 03-eks-irsa-role.yaml
        - delete:
            file: 01-oidc-provider.yaml

    - name: https-validation
      try:
        - apply:
            file: 04-http-oidc.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSIAMIdentityProvider
                check:
                  ($error != null): true

    - name: mandatory-tags
      try:
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 05-oidc-tags.yaml
        - assert:
            file: 05-assert-oidc-tags.yaml
      cleanup:
        - delete:
            file: 05-oidc-tags.yaml

    - name: synced-labels
      try:
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{"team":"platform"}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 06-oidc-synced-labels.yaml
        - assert:
            file: 06-assert-oidc-synced-labels.yaml
      cleanup:
        - delete:
            file: 06-oidc-synced-labels.yaml

    - name: standard-metadata
      try:
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n default \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 07-oidc-standard-metadata.yaml
        - assert:
            file: 07-assert-oidc-standard-metadata.yaml
      cleanup:
        - delete:
            file: 07-oidc-standard-metadata.yaml

    - name: retain-delete-policy
      try:
        - apply:
            file: 08-oidc-retain-policy.yaml
        - assert:
            file: 08-assert-oidc-retain-policy.yaml
      cleanup:
        - delete:
            file: 08-oidc-retain-policy.yaml

    - name: delete-delete-policy
      try:
        - apply:
            file: 09-oidc-delete-policy.yaml
        - assert:
            file: 09-assert-oidc-delete-policy.yaml
      cleanup:
        - delete:
            file: 09-oidc-delete-policy.yaml

    - name: cleanup-config
      try:
        - delete:
            file: 00-awsiamconfig.yaml
