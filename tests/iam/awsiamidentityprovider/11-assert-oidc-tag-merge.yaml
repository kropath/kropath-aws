apiVersion: iam.services.k8s.aws/v1alpha1
kind: OpenIDConnectProvider
metadata:
  name: tag-merge-oidc
  namespace: awsiamidentityprovider
spec:
  tags:
    - key: cost-centre
      value: platform
    - key: environment
      value: mandatory
    - key: app
      value: payments
    - key: team
      value: ops
