apiVersion: kropath.run/v1alpha1
kind: AWSIAMRole
metadata:
  name: irsa-role
  namespace: default
spec:
  configRef: general-policy
  type: eks-irsa
  oidcProviderArn: arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID
  serviceAccountNamespace: payments-prod
  serviceAccountName: app
  tags: {}
  syncedLabels: {}
  syncedAnnotations: {}
  permissionsBoundaryArn: ""
  addSsmPolicy: false
  addEcsExecutionPolicy: false
  addLambdaBasicPolicy: false
  createInstanceProfile: false
  maxSessionDuration: 0
