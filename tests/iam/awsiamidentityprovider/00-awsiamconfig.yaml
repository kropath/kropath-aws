# Conservative baseline AWSIAMConfig for identity-provider tests.
apiVersion: kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: general-policy
  namespace: default
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 3600
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
