# Should be rejected: namingTemplate non-empty in both tiers.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: invalid-both-tiers-naming
  namespace: iamconfig
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    namingTemplate: "{namespace}-{name}-mandatory"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 3600
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
