# KropathConfig with mandatory.iam.permissionsBoundaryArn set (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: iamconfig
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/OrgBoundary"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
