# Local (iamconfig) AWSKropathConfig with mandatory boundary (level 2 — should lose).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: iamconfig
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/LocalBoundary"
