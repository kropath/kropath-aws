apiVersion: aws.kropath.run/v1alpha1
kind: IAMIdentityProvider
metadata:
  name: saml-provider
  namespace: iamidentityprovider
spec:
  configRef: general-policy
  type: saml
  nameOverride: ""
  deletionPolicy: retain
  tags: {}
  syncedLabels: {}
  syncedAnnotations: {}
  saml:
    metadataDocument: >-
      <EntityDescriptor entityID="https://idp.example.com/saml"><IDPSSODescriptor/></EntityDescriptor>
