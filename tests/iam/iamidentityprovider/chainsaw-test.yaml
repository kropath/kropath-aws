---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: iamidentityprovider
spec:
  namespace: iamidentityprovider
  steps:
    - name: seed-effective-config
      try:
        - apply:
            file: 00-iamidentityprovider-namespace.yaml
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'

    - name: oidc-create
      try:
        - apply:
            file: 01-oidc-provider.yaml
        - assert:
            file: 01-assert-oidc-provider.yaml
      cleanup:
        - delete:
            file: 01-oidc-provider.yaml

    - name: oidc-provider-arn
      try:
        - apply:
            file: 01-oidc-provider.yaml
        - assert:
            file: 01-assert-oidc-provider.yaml
        - script:
            content: |
              kubectl patch openidconnectprovider oidc-provider -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID","ownerAccountID":"123456789012","region":"ap-southeast-2"}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: oidc-provider
                namespace: iamidentityprovider
              status:
                providerArn: arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID

    - name: saml-provider-arn
      try:
        - apply:
            file: 02-saml-provider.yaml
        - assert:
            file: 02-assert-saml-provider.yaml
      cleanup:
        - delete:
            file: 02-saml-provider.yaml

    - name: eks-irsa-trust
      try:
        - apply:
            file: 01-oidc-provider.yaml
        - script:
            content: |
              kubectl patch openidconnectprovider oidc-provider -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID","ownerAccountID":"123456789012","region":"ap-southeast-2"}}}'
        - apply:
            file: 03-eks-irsa-role.yaml
        - assert:
            file: 03-assert-irsa-role.yaml
      cleanup:
        - delete:
            file: 03-eks-irsa-role.yaml
        - delete:
            file: 01-oidc-provider.yaml

    - name: https-validation
      try:
        - apply:
            file: 04-http-oidc.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: insecure-oidc
                namespace: iamidentityprovider
              status:
                validationError: "OIDC URL must use HTTPS"

    - name: mandatory-tags
      try:
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 05-oidc-tags.yaml
        - assert:
            file: 05-assert-oidc-tags.yaml

    - name: synced-labels
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{"team":"platform"}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 06-oidc-synced-labels.yaml
        - assert:
            file: 06-assert-oidc-synced-labels.yaml

    - name: standard-metadata
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 07-oidc-standard-metadata.yaml
        - assert:
            file: 07-assert-oidc-standard-metadata.yaml

    - name: naming-template
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 10-oidc-naming-template.yaml
        - assert:
            file: 10-assert-oidc-naming-template.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: naming-oidc
                namespace: iamidentityprovider
              status:
                resourceName: iamidentityprovider-naming-oidc
                namingStatus: active

    - name: tag-merge-prefers-mandatory-values
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{"cost-centre":"platform","environment":"mandatory"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{"environment":"defaults","team":"ops"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 11-oidc-tag-merge.yaml
        - assert:
            file: 11-assert-oidc-tag-merge.yaml

    - name: mandatory-naming-template-wins
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}-{account_id}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 12-oidc-mandatory-naming.yaml
        - assert:
            file: 12-assert-oidc-mandatory-naming.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: mandatory-naming-oidc
                namespace: iamidentityprovider
              status:
                resourceName: iamidentityprovider-mandatory-naming-oidc-123456789012
                namingStatus: active

    - name: retain-delete-policy
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 08-oidc-retain-policy.yaml
        - assert:
            file: 08-assert-oidc-retain-policy.yaml

    - name: delete-delete-policy
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 09-oidc-delete-policy.yaml
        - assert:
            file: 09-assert-oidc-delete-policy.yaml

    - name: kro222-configref-labelselector
      try:
        - script:
            content: |
              kubectl apply -f - << 'YAML'
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: custom-idp-config
                namespace: iamidentityprovider
                labels:
                  aws.kropath.run/resource-name: custom-idp-config
              spec:
                mandatory:
                  permissionsBoundaryArn: ""
                  blockIamUserAccessKeys: false
                  maxSessionDurationSeconds: 0
                  namingTemplate: "kro222-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  permissionsBoundaryArn: ""
                  blockIamUserAccessKeys: false
                  maxSessionDurationSeconds: 3600
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              YAML
              kubectl patch iamconfig custom-idp-config -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"kro222-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: kro222-oidc
                namespace: iamidentityprovider
              spec:
                configRef: custom-idp-config
                type: oidc
                nameOverride: ""
                deletionPolicy: retain
                oidc:
                  url: https://oidc.eks.ap-southeast-2.amazonaws.com/id/KRO222
                  thumbprints:
                    - 9e99a48a9960b14926bb7f3b02e22da2b0ab7280
                  audiences:
                    - sts.amazonaws.com
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: OpenIDConnectProvider
              metadata:
                name: kro222-kro222-oidc
                namespace: iamidentityprovider
      cleanup:
        - script:
            content: |
              kubectl delete iamidentityprovider kro222-oidc -n iamidentityprovider --ignore-not-found=true
              kubectl delete iamconfig custom-idp-config -n iamidentityprovider --ignore-not-found=true

    # ──────────────────────────────────────────────────────────────────────────
    # KRO-236: {tag.X} dynamic token resolution in namingTemplate for
    # IAMIdentityProvider. The OIDC provider name is set in metadata.name.
    # ──────────────────────────────────────────────────────────────────────────

    - name: kro236-iamidp-tag-token-resolved-from-spec-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: kro236-idp-tag-config
                namespace: iamidentityprovider
                labels:
                  aws.kropath.run/resource-name: kro236-idp-tag-config
              spec:
                mandatory:
                  namingTemplate: "{namespace}-{name}-{tag.team}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch iamconfig kro236-idp-tag-config -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{namespace}-{name}-{tag.team}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: kro236-tag-oidc
                namespace: iamidentityprovider
              spec:
                configRef: kro236-idp-tag-config
                type: oidc
                oidc:
                  url: https://token.actions.githubusercontent.com
                  thumbprints:
                    - 6938fd4d98bab03faadb97b34396831e3780aea1
                  audiences:
                    - sts.amazonaws.com
                tags:
                  team: platform
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: OpenIDConnectProvider
              metadata:
                name: iamidentityprovider-kro236-tag-oidc-platform
                namespace: iamidentityprovider
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: kro236-tag-oidc
                namespace: iamidentityprovider
              status:
                resourceName: iamidentityprovider-kro236-tag-oidc-platform
                namingStatus: active
      cleanup:
        - script:
            content: |
              kubectl delete iamidentityprovider kro236-tag-oidc -n iamidentityprovider --ignore-not-found=true
              kubectl delete iamconfig kro236-idp-tag-config -n iamidentityprovider --ignore-not-found=true

    - name: kro236-iamidp-tag-token-unresolved-invalid-status
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: kro236-idp-missing-tag-config
                namespace: iamidentityprovider
                labels:
                  aws.kropath.run/resource-name: kro236-idp-missing-tag-config
              spec:
                mandatory:
                  namingTemplate: "{namespace}-{name}-{tag.team}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch iamconfig kro236-idp-missing-tag-config -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{namespace}-{name}-{tag.team}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: kro236-missing-tag-oidc
                namespace: iamidentityprovider
              spec:
                configRef: kro236-idp-missing-tag-config
                type: oidc
                oidc:
                  url: https://token.actions.githubusercontent.com
                  thumbprints:
                    - 6938fd4d98bab03faadb97b34396831e3780aea1
                  audiences:
                    - sts.amazonaws.com
                tags: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: kro236-missing-tag-oidc
                namespace: iamidentityprovider
              status:
                namingStatus: invalid-unresolved-tokens
      cleanup:
        - script:
            content: |
              kubectl delete iamidentityprovider kro236-missing-tag-oidc -n iamidentityprovider --ignore-not-found=true
              kubectl delete iamconfig kro236-idp-missing-tag-config -n iamidentityprovider --ignore-not-found=true

    - name: kro236-iamidp-mandatory-tag-overrides-spec-tag
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: kro236-idp-mandatory-tag-config
                namespace: iamidentityprovider
                labels:
                  aws.kropath.run/resource-name: kro236-idp-mandatory-tag-config
              spec:
                mandatory:
                  namingTemplate: "{namespace}-{name}-{tag.team}"
                  tags:
                    team: mandatory-team
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch iamconfig kro236-idp-mandatory-tag-config -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{namespace}-{name}-{tag.team}","tags":{"team":"mandatory-team"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: kro236-mandatory-tag-oidc
                namespace: iamidentityprovider
              spec:
                configRef: kro236-idp-mandatory-tag-config
                type: oidc
                oidc:
                  url: https://token.actions.githubusercontent.com
                  thumbprints:
                    - 6938fd4d98bab03faadb97b34396831e3780aea1
                  audiences:
                    - sts.amazonaws.com
                tags:
                  team: spec-team
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: OpenIDConnectProvider
              metadata:
                name: iamidentityprovider-kro236-mandatory-tag-oidc-mandatory-team
                namespace: iamidentityprovider
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: kro236-mandatory-tag-oidc
                namespace: iamidentityprovider
              status:
                resourceName: iamidentityprovider-kro236-mandatory-tag-oidc-mandatory-team
                namingStatus: active
      cleanup:
        - script:
            content: |
              kubectl delete iamidentityprovider kro236-mandatory-tag-oidc -n iamidentityprovider --ignore-not-found=true
              kubectl delete iamconfig kro236-idp-mandatory-tag-config -n iamidentityprovider --ignore-not-found=true
