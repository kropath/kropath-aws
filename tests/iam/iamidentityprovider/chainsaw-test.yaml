apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: iamidentityprovider
spec:
  skipDelete: true
  namespace: iamidentityprovider
  steps:
    - name: seed-effective-config
      try:
        - apply:
            file: 00-iamidentityprovider-namespace.yaml
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'

    - name: oidc-create
      try:
        - apply:
            file: 01-oidc-provider.yaml
        - assert:
            file: 01-assert-oidc-provider.yaml
    - name: oidc-provider-arn
      try:
        - apply:
            file: 01-oidc-provider.yaml
        - assert:
            file: 01-assert-oidc-provider.yaml
        - script:
            content: |
              kubectl patch openidconnectprovider oidc-provider -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID","ownerAccountID":"123456789012","region":"ap-southeast-2"}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: oidc-provider
                namespace: iamidentityprovider
              status:
                providerArn: arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID
    - name: saml-provider-arn
      try:
        - apply:
            file: 02-saml-provider.yaml
        - assert:
            file: 02-assert-saml-provider.yaml
    - name: eks-irsa-trust
      try:
        - apply:
            file: 01-oidc-provider.yaml
        - script:
            content: |
              kubectl patch openidconnectprovider oidc-provider -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/EXAMPLEID","ownerAccountID":"123456789012","region":"ap-southeast-2"}}}'
        - apply:
            file: 03-eks-irsa-role.yaml
        - assert:
            file: 03-assert-irsa-role.yaml
    - name: https-validation
      try:
        - apply:
            file: 04-http-oidc.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: insecure-oidc
                namespace: iamidentityprovider
              status:
                validationError: "OIDC URL must use HTTPS"
    - name: mandatory-tags
      try:
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 05-oidc-tags.yaml
        - assert:
            file: 05-assert-oidc-tags.yaml
    - name: synced-labels
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{"team":"platform"}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 06-oidc-synced-labels.yaml
        - assert:
            file: 06-assert-oidc-synced-labels.yaml
        - script:
            # Order-independent tag check via jq — chainsaw's assertion engine does not
            # support CEL's .exists(), and a per-item list assert is positional and flakes
            # on CEL map-iteration order (see docs/frequent-rgd-errors.md §6).
            content: |
              TAGS=$(kubectl get openidconnectprovider synced-labels-oidc -n iamidentityprovider -o json | jq -c '.spec.tags')
              COUNT=$(echo "$TAGS" | jq 'length')
              [ "$COUNT" -eq 2 ] || { echo "FAIL: expected 2 tags, got $COUNT: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "environment" and .value == "production")' >/dev/null || { echo "FAIL: missing tag environment=production"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "team" and .value == "platform")' >/dev/null || { echo "FAIL: missing tag team=platform"; exit 1; }
    - name: standard-metadata
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 07-oidc-standard-metadata.yaml
        - assert:
            file: 07-assert-oidc-standard-metadata.yaml
    - name: tag-merge-prefers-mandatory-values
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{"cost-centre":"platform","environment":"mandatory"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{"environment":"defaults","team":"ops"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 11-oidc-tag-merge.yaml
        - assert:
            file: 11-assert-oidc-tag-merge.yaml
        - script:
            content: |
              TAGS=$(kubectl get openidconnectprovider tag-merge-oidc -n iamidentityprovider -o json | jq -c '.spec.tags')
              COUNT=$(echo "$TAGS" | jq 'length')
              [ "$COUNT" -eq 4 ] || { echo "FAIL: expected 4 tags, got $COUNT: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "cost-centre" and .value == "platform")' >/dev/null || { echo "FAIL: missing tag cost-centre=platform"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "environment" and .value == "mandatory")' >/dev/null || { echo "FAIL: missing tag environment=mandatory"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "app" and .value == "payments")' >/dev/null || { echo "FAIL: missing tag app=payments"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "team" and .value == "ops")' >/dev/null || { echo "FAIL: missing tag team=ops"; exit 1; }
    - name: retain-delete-policy
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 08-oidc-retain-policy.yaml
        - assert:
            file: 08-assert-oidc-retain-policy.yaml
    - name: delete-delete-policy
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            file: 09-oidc-delete-policy.yaml
        - assert:
            file: 09-assert-oidc-delete-policy.yaml
    - name: kro222-configref-labelselector
      try:
        - script:
            content: |
              kubectl apply -f - << 'YAML'
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: custom-idp-config
                namespace: iamidentityprovider
                labels:
                  aws.kropath.run/resource-name: custom-idp-config
              spec:
                mandatory:
                  permissionsBoundaryArn: ""
                  blockIamUserAccessKeys: false
                  maxSessionDurationSeconds: 0
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  permissionsBoundaryArn: ""
                  blockIamUserAccessKeys: false
                  maxSessionDurationSeconds: 3600
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              YAML
              kubectl patch iamconfig custom-idp-config -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: kro222-oidc
                namespace: iamidentityprovider
              spec:
                configRef: custom-idp-config
                type: oidc
                nameOverride: ""
                deletionPolicy: retain
                oidc:
                  url: https://oidc.eks.ap-southeast-2.amazonaws.com/id/KRO222
                  thumbprints:
                    - 9e99a48a9960b14926bb7f3b02e22da2b0ab7280
                  audiences:
                    - sts.amazonaws.com
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: OpenIDConnectProvider
              metadata:
                name: kro222-oidc
                namespace: iamidentityprovider
    - name: nameoverride-and-naming-template-are-noop-for-oidc
      try:
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamidentityprovider --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iamidentityprovider \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"{namespace}-{name}-{tag.team}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMIdentityProvider
              metadata:
                name: no-naming-oidc
                namespace: iamidentityprovider
              spec:
                configRef: general-policy
                type: oidc
                nameOverride: "should-be-ignored"
                oidc:
                  url: https://oidc.eks.ap-southeast-2.amazonaws.com/id/NONAMING
                  thumbprints:
                    - 9e99a48a9960b14926bb7f3b02e22da2b0ab7280
                  audiences:
                    - sts.amazonaws.com
                tags:
                  team: platform
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: OpenIDConnectProvider
              metadata:
                name: no-naming-oidc
                namespace: iamidentityprovider
