# Asserts that AWSIAMRole with maxSessionDuration below the 900-second floor
# emits a validationError in status via in-graph ConfigMap advisory.
apiVersion: aws.kropath.run/v1alpha1
kind: AWSIAMRole
metadata:
  name: invalid-max-session-duration
  namespace: schema-validation
status:
  validationError: "maxSessionDuration must be 0 (use config default) or in range [900, 43200]"
