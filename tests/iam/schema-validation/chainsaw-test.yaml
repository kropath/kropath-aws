# Verifies x-kubernetes-validations rules reject invalid input at apply time
# (ADR-003: both mandatory and defaults tiers cannot be set simultaneously).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awsiamconfig-schema-validation
spec:
  namespace: schema-validation # <--- Forces Chainsaw to use 'schema-validation' instead of a random string
  steps:
    - name: reject-both-tiers-string-field
      try:
        - apply:
            file: 01-invalid-both-tiers-boundary.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSIAMConfig
                check:
                  ($error != null): true

    - name: reject-both-tiers-bool-field
      try:
        - apply:
            file: 02-invalid-both-tiers-bool.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSIAMConfig
                check:
                  ($error != null): true

    - name: reject-both-tiers-int-field
      try:
        - apply:
            file: 03-invalid-both-tiers-int.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSIAMConfig
                check:
                  ($error != null): true

    - name: reject-max-session-duration-below-floor
      try:
        - apply:
            file: 04-invalid-max-session-duration.yaml
        - assert:
            file: 04-assert-max-session-duration.yaml
