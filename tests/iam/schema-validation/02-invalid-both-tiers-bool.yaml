# Should be rejected: blockIamUserAccessKeys set to true in both mandatory and defaults.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: invalid-both-tiers-bool
  namespace: schema-validation
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: true
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: true
    maxSessionDurationSeconds: 3600
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
