apiVersion: aws.kropath.run/v1alpha1
kind: IAMRole
metadata:
  name: my-lambda-role
  namespace: metadata
spec:
  configRef: general-policy
  nameOverride: ""
  # Explicit retain so chainsaw's merge-apply resets a leftover `delete` from a prior
  # run's patch-to-delete-policy step (skipDelete keeps resources across runs; an omitted
  # field is NOT cleared by kubectl apply's merge). See docs/frequent-rgd-errors.md.
  deletionPolicy: retain
  type: lambda
  description: "Test lambda role for metadata assertions"
  tags: {}
  syncedLabels: {}
  syncedAnnotations: {}
  permissionsBoundaryArn: ""
  addLambdaBasicPolicy: true
  maxSessionDuration: 0
