# Verifies standard resource wiring: managed-by/instance labels, deletion-policy
# annotation, and ownerReferences (ADR-008, CLAUDE.md "Every RGD Must Wire").
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: iamrole-standard-metadata
spec:
  namespace: metadata # <--- Forces Chainsaw to use 'metadata' instead of a random string
  steps:
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-metadata-namespace.yaml
        - script:
            content: |
              kubectl patch iamrole my-lambda-role -n metadata \
                --type=merge \
                -p '{"metadata":{"finalizers":null}}' \
                2>/dev/null || true
              kubectl delete iamrole my-lambda-role -n metadata \
                --ignore-not-found=true

    - name: apply-and-seed-governance-config
      try:
        - apply:
            file: 00-metadata-namespace.yaml
        - apply:
            file: 00-governance-config.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n metadata \
                --subresource=status \
                --type=merge \
                --patch-file 00-governance-config.yaml
        - script:
            content: |
              echo "=== LIVE STATUS REVEAL ==="
              kubectl get iamconfig general-policy -n metadata -o yaml

    - name: apply-role-retain
      try:
        - apply:
            file: 01-iamrole-lambda.yaml

    - name: assert-managed-by-and-instance-labels
      try:
        - assert:
            file: 02-assert-labels.yaml
            timeout: 60s

    - name: assert-deletion-policy-retain
      try:
        - assert:
            file: 03-assert-deletion-retain.yaml
            timeout: 60s

    - name: assert-ownerrefs
      try:
        - assert:
            file: 06-assert-ownerrefs.yaml
            timeout: 60s

    - name: patch-to-delete-policy
      try:
        - apply:
            file: 04-iamrole-delete-policy.yaml

    - name: assert-deletion-policy-delete
      try:
        - assert:
            file: 05-assert-deletion-delete.yaml
            timeout: 60s
