apiVersion: kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: general-policy
  namespace: awsiamgroup
  labels:
    kropath.run/config-name: general-policy
spec:
  mandatory:
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: ""
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
  defaults:
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: "{namespace}-{name}"
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 3600
