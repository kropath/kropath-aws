apiVersion: kropath.run/v1alpha1
kind: AWSIAMGroup
metadata:
  name: inline-json-group
  namespace: default
spec:
  configRef: general-policy
  path: "/"
  nameOverride: ""
  deletionPolicy: retain
  policies:
    - inline:
        name: s3-list
        documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:ListBucket","Resource":"*"}]}'
  tags: {}
  syncedLabels: {}
  syncedAnnotations: {}
