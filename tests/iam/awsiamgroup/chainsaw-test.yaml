# aws-iam-05 Chainsaw tests — AWSIAMGroup RGD.
# AC-7 note: AWS IAM Groups are non-taggable (ADR-015 §6.1 waiver).
#   Cloud tags are accepted in schema but not forwarded to spec.tags.
#   The AC-6/AC-7 checks also verify the ACK Group child does not expose
#   a spec.tags field.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awsiamgroup
spec:
  namespace: awsiamgroup
  steps:
    - name: seed-config
      try:
        - apply:
            file: 00-awsiamgroup-namespace.yaml
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiamgroup --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    - name: ac1-no-policies
      try:
        - apply:
            file: 01-group-basic.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: basic-group
                namespace: awsiamgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: basic-group
              spec:
                name: awsiamgroup-basic-group
                path: "/"
                policies: []
                inlinePolicies: {}
      cleanup:
        - delete:
            file: 01-group-basic.yaml

    - name: ac2-managed-arn
      try:
        - apply:
            file: 02-group-managed-arn.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: arn-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-arn-group
                path: "/"
                policies:
                  - arn:aws:iam::aws:policy/ReadOnlyAccess
      cleanup:
        - delete:
            file: 02-group-managed-arn.yaml

    - name: ac3-policy-ref
      try:
        - apply:
            file: 03-awsiampolicy.yaml
        - script:
            content: |
              # Wait for kro to create the underlying ACK Policy
              for i in $(seq 1 30); do
                kubectl get policies.iam.services.k8s.aws my-policy -n awsiamgroup 2>/dev/null && break
                sleep 1
              done
              # Seed a fake ARN on the ACK Policy status — kro reads ackResourceMetadata.arn
              # and propagates it to AWSIAMPolicy.status.arn
              kubectl patch policies.iam.services.k8s.aws my-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:policy/MyGroupPolicy","ownerAccountID":"123456789012","region":"us-east-1"}}}'
              # Wait for kro to propagate the ARN to AWSIAMPolicy.status.arn
              for i in $(seq 1 30); do
                arn=$(kubectl get awsiampolicy my-policy -n awsiamgroup -o jsonpath='{.status.arn}' 2>/dev/null)
                [ -n "$arn" ] && break
                sleep 1
              done
        - apply:
            file: 03-group-ref.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: ref-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-ref-group
                policies:
                  - arn:aws:iam::123456789012:policy/MyGroupPolicy
      cleanup:
        - delete:
            file: 03-group-ref.yaml
        - delete:
            file: 03-awsiampolicy.yaml

    - name: ac4-inline-documentjson
      try:
        - apply:
            file: 04-group-inline-json.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: inline-json-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-inline-json-group
                inlinePolicies:
                  s3-list: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:ListBucket","Resource":"*"}]}'
      cleanup:
        - delete:
            file: 04-group-inline-json.yaml

    - name: ac4b-inline-documentref
      try:
        - apply:
            file: 04b-awspolicydocument.yaml
        - apply:
            file: 04b-group-inline-ref.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: inline-ref-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-inline-ref-group
                inlinePolicies:
                  s3-list: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"*"}]}'
      cleanup:
        - delete:
            file: 04b-group-inline-ref.yaml
        - delete:
            file: 04b-awspolicydocument.yaml

    - name: ac5-naming
      try:
        - apply:
            file: 05-group-naming.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSIAMGroup
              metadata:
                name: admins
                namespace: awsiamgroup
              status:
                resourceName: awsiamgroup-admins
                namingStatus: valid
                predictedArn: "arn:aws:iam::123456789012:group/awsiamgroup-admins"
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: admins
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-admins
                path: "/"
      cleanup:
        - delete:
            file: 05-group-naming.yaml

    - name: ac6-tags
      try:
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiamgroup --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig general-policy -n awsiamgroup --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 06-group-tags.yaml
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSIAMGroup
              metadata:
                name: tags-group
                namespace: awsiamgroup
              status:
                resourceName: awsiamgroup-tags-group
        - script:
            content: |
              value=$(kubectl get group awsiamgroup-tags-group -n awsiamgroup -o jsonpath='{.spec.tags}' 2>/dev/null)
              [ -z "$value" ]
      cleanup:
        - delete:
            file: 06-group-tags.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiamgroup --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig general-policy -n awsiamgroup --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    - name: ac7-synced-labels
      try:
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiamgroup --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig general-policy -n awsiamgroup --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 07-group-synced-labels.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: synced-labels-group
                namespace: awsiamgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: synced-labels-group
                  kropath.run/environment: production
        - script:
            content: |
              value=$(kubectl get group awsiamgroup-synced-labels-group -n awsiamgroup -o jsonpath='{.spec.tags}' 2>/dev/null)
              [ -z "$value" ]
      cleanup:
        - delete:
            file: 07-group-synced-labels.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiamgroup --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig general-policy -n awsiamgroup --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    - name: ac8-standard-metadata
      try:
        - apply:
            file: 08-group-standard-metadata.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: standard-metadata-group
                namespace: awsiamgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: standard-metadata-group
                annotations:
                  services.k8s.aws/deletion-policy: retain
                ownerReferences:
                  - apiVersion: kropath.run/v1alpha1
                    kind: AWSIAMGroup
                    name: standard-metadata-group
                    controller: true
                    blockOwnerDeletion: true
              spec:
                name: awsiamgroup-standard-metadata-group
                path: "/"
      cleanup:
        - delete:
            file: 08-group-standard-metadata.yaml
