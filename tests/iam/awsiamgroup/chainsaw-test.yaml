---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awsiamgroup
spec:
  namespace: awsiamgroup
  steps:
    - name: ac1-no-policies
      try:
        - apply:
            file: 00-awsiamgroup-namespace.yaml
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl delete awsiamconfig general-policy -n awsiamgroup --ignore-not-found=true
              kubectl apply -f 00-awsiamconfig.yaml
              kubectl patch awsiamconfig general-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 01-group-no-policies.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group no-policies-group -n awsiamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: no-policies-group
                namespace: awsiamgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: no-policies-group
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: awsiamgroup-no-policies-group
                path: /
                policies: []
                inlinePolicies: {}
      cleanup:
        - delete:
            file: 01-group-no-policies.yaml
        - delete:
            file: 00-awsiamconfig.yaml

    - name: ac2-managed-policy
      try:
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl delete awsiamconfig general-policy -n awsiamgroup --ignore-not-found=true
              kubectl apply -f 00-awsiamconfig.yaml
              kubectl patch awsiamconfig general-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 02-group-managed-policy.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group managed-policy-group -n awsiamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: managed-policy-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-managed-policy-group
                policies:
                  - arn:aws:iam::aws:policy/ReadOnlyAccess
      cleanup:
        - delete:
            file: 02-group-managed-policy.yaml
        - delete:
            file: 00-awsiamconfig.yaml

    - name: ac3-policy-ref
      try:
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl delete awsiamconfig general-policy -n awsiamgroup --ignore-not-found=true
              kubectl apply -f 00-awsiamconfig.yaml
              kubectl patch awsiamconfig general-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 03-my-policy.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get policies.iam.services.k8s.aws my-policy -n awsiamgroup 2>/dev/null && break
                sleep 2
              done
              kubectl patch policies.iam.services.k8s.aws my-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:policy/MyPolicy","ownerAccountID":"123456789012","region":"us-east-1"}}}'
              for i in $(seq 1 30); do
                arn="$(kubectl get awsiampolicy my-policy -n awsiamgroup -o jsonpath='{.status.arn}' 2>/dev/null || true)"
                [ -n "$arn" ] && break
                sleep 1
              done
        - apply:
            file: 04-group-policy-ref.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group policy-ref-group -n awsiamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: policy-ref-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-policy-ref-group
                policies:
                  - arn:aws:iam::123456789012:policy/MyPolicy
      cleanup:
        - delete:
            file: 04-group-policy-ref.yaml
        - delete:
            file: 03-my-policy.yaml
        - delete:
            file: 00-awsiamconfig.yaml

    - name: ac4-inline-json
      try:
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl delete awsiamconfig general-policy -n awsiamgroup --ignore-not-found=true
              kubectl apply -f 00-awsiamconfig.yaml
              kubectl patch awsiamconfig general-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 06-group-inline-json.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group inline-json-group -n awsiamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: inline-json-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-inline-json-group
                inlinePolicies:
                  s3-list: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":"*"}]}'
      cleanup:
        - delete:
            file: 06-group-inline-json.yaml
        - delete:
            file: 00-awsiamconfig.yaml

    - name: ac4b-inline-document-ref
      try:
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl delete awsiamconfig general-policy -n awsiamgroup --ignore-not-found=true
              kubectl apply -f 00-awsiamconfig.yaml
              kubectl patch awsiamconfig general-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 05-inline-doc.yaml
        - apply:
            file: 07-group-inline-ref.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group inline-ref-group -n awsiamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: inline-ref-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-inline-ref-group
                inlinePolicies:
                  s3-list: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"*"}]}'
      cleanup:
        - delete:
            file: 07-group-inline-ref.yaml
        - delete:
            file: 05-inline-doc.yaml
        - delete:
            file: 00-awsiamconfig.yaml

    - name: ac5-resource-name
      try:
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl delete awsiamconfig general-policy -n awsiamgroup --ignore-not-found=true
              kubectl apply -f 00-awsiamconfig.yaml
              kubectl patch awsiamconfig general-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 08-group-naming.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group named-group -n awsiamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: named-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-named-group
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMGroup
              metadata:
                name: named-group
                namespace: awsiamgroup
              status:
                resourceName: awsiamgroup-named-group
                predictedArn: arn:aws:iam::123456789012:group/awsiamgroup-named-group
      cleanup:
        - delete:
            file: 08-group-naming.yaml
        - delete:
            file: 00-awsiamconfig.yaml

    - name: ac6-tags
      try:
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl delete awsiamconfig general-policy -n awsiamgroup --ignore-not-found=true
              kubectl apply -f 00-awsiamconfig.yaml
              kubectl patch awsiamconfig general-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 09-group-tags.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group tags-group -n awsiamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: tags-group
                namespace: awsiamgroup
              spec:
                name: awsiamgroup-tags-group
                path: "/"
                policies: []
        - script:
            content: |
              kubectl get groups.iam.services.k8s.aws tags-group -n awsiamgroup -o json \
                | jq -e '.spec | has("tags") | not' >/dev/null
      cleanup:
        - delete:
            file: 09-group-tags.yaml
        - delete:
            file: 00-awsiamconfig.yaml

    - name: ac7-synced-labels
      try:
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl delete awsiamconfig general-policy -n awsiamgroup --ignore-not-found=true
              kubectl apply -f 00-awsiamconfig.yaml
              kubectl patch awsiamconfig general-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 10-group-synced-labels.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group synced-labels-group -n awsiamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: synced-labels-group
                namespace: awsiamgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: synced-labels-group
                  kropath.run/environment: production
              spec:
                name: awsiamgroup-synced-labels-group
                path: "/"
                policies: []
        - script:
            content: |
              kubectl get groups.iam.services.k8s.aws synced-labels-group -n awsiamgroup -o json \
                | jq -e '.spec | has("tags") | not' >/dev/null
      cleanup:
        - delete:
            file: 10-group-synced-labels.yaml
        - delete:
            file: 00-awsiamconfig.yaml

    - name: ac8-standard-metadata
      try:
        - apply:
            file: 00-awsiamconfig.yaml
        - script:
            content: |
              kubectl delete awsiamconfig general-policy -n awsiamgroup --ignore-not-found=true
              kubectl apply -f 00-awsiamconfig.yaml
              kubectl patch awsiamconfig general-policy -n awsiamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 11-group-standard-metadata.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group standard-metadata-group -n awsiamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: standard-metadata-group
                namespace: awsiamgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: standard-metadata-group
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: awsiamgroup-standard-metadata-group
        - script:
            content: |
              tags="$(kubectl get group standard-metadata-group -n awsiamgroup -o jsonpath='{.spec.tags}' 2>/dev/null || true)"
              test -z "$tags"
      cleanup:
        - delete:
            file: 11-group-standard-metadata.yaml
        - delete:
            file: 00-awsiamconfig.yaml
