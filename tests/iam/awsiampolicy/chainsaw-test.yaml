# aws-iam-03 Chainsaw tests.
# AC-7 is covered at the status/ARN surface until aws-iam-02 lands in this branch.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awsiampolicy
spec:
  namespace: awsiampolicy
  steps:
    - name: ac1-documentjson
      try:
        - apply:
            file: 00-awsiampolicy-namespace.yaml
        - apply:
            file: 01-awsiamconfig-default.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 01-awsiampolicy-documentjson.yaml
        - assert:
            file: 01-assert-created-policy.yaml

    - name: ac1b-documentref
      try:
        - apply:
            file: 01-awsiamconfig-default.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 02-awspolicydocument.yaml
        - apply:
            file: 02-awsiampolicy-documentref.yaml
        - assert:
            file: 02-assert-created-policy.yaml

    - name: ac1c-mutual-exclusion
      try:
        - apply:
            file: 01-awsiamconfig-default.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 03-invalid-documentjson-and-ref.yaml
        - assert:
