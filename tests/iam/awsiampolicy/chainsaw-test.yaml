    - name: ac6-synced-labels
      try:
        - apply:
            file: 01-awsiamconfig-default.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 08-awsiampolicy-synced-labels.yaml
        - assert:
            file: 08-assert-synced-labels.yaml
      cleanup:
        - delete:
            file: 08-awsiampolicy-synced-labels.yaml
        - delete:
            file: 01-awsiamconfig-default.yaml

    - name: ac7-status-arn
      try:
        - apply:
            file: 01-awsiamconfig-default.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 09-awsiampolicy-status-arn.yaml
        - assert:
            file: 09-assert-status-arn.yaml
      cleanup:
        - delete:
            file: 09-awsiampolicy-status-arn.yaml
        - delete:
            file: 01-awsiamconfig-default.yaml

    - name: ac8-standard-metadata
      try:
        - apply:
            file: 01-awsiamconfig-default.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 10-awsiampolicy-standard-metadata.yaml
        - assert:
            file: 10-assert-standard-metadata.yaml
      cleanup:
        - delete:
            file: 10-awsiampolicy-standard-metadata.yaml
        - delete:
            file: 01-awsiamconfig-default.yaml

    - name: ac9-status-arn-actual
      try:
        - apply:
            file: 01-awsiamconfig-default.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch awsiamconfig general-policy -n awsiampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 09-awsiampolicy-status-arn.yaml
        - assert:
            file: 09-assert-status-arn.yaml
      cleanup:
        - delete:
            file: 09-awsiampolicy-status-arn.yaml
        - delete:
