# Should be rejected: blockIamUserAccessKeys=true in both tiers.
apiVersion: kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: invalid-both-tiers-bool
  namespace: kro-system
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: true
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: true
    maxSessionDurationSeconds: 3600
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
