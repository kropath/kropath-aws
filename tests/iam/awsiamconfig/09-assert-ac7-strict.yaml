# Assert: strict has non-zero mandatory fields.
apiVersion: aws.kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: strict
  namespace: awsiamconfig
spec:
  mandatory:
    permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/OrgPermissionsBoundary"
    blockIamUserAccessKeys: true
    maxSessionDurationSeconds: 3600
