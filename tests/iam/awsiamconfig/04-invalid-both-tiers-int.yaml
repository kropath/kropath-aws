# Should be rejected: maxSessionDurationSeconds non-zero in both tiers.
apiVersion: kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: invalid-both-tiers-int
  namespace: kro-system
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 3600
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 7200
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
