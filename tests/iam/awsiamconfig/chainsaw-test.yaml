# aws-iam-01 Chainsaw tests — all 12 acceptance criteria.
# AC-1 through AC-7: isolated tests (no controller required).
# AC-8 through AC-12: integration tests (require kropath-operator with --enable-iam-cascade).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awsiamconfig
spec:
  namespace: awsiamconfig
  steps:
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              # Delete any stale config from previous failed runs to guarantee a clean slate
              kubectl delete awsiamconfig general-policy -n awsiamconfig --ignore-not-found=true

    - name: prepare
      try:
        - script:
            content: |
              kubectl apply -f 00-namespace-awsiamconfig.yaml

    # AC-1: CRD is present with correct field structure.
    - name: ac1-crd-present
      try:
        - assert:
            file: 01-assert-crd-present.yaml

    # AC-2: permissionsBoundaryArn in both tiers is rejected.
    - name: ac2-reject-both-tiers-boundary
      try:
        - apply:
            file: 02-invalid-both-tiers-boundary.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSIAMConfig
                check:
                  ($error != null): true

    # AC-3: blockIamUserAccessKeys in both tiers is rejected.
    - name: ac3-reject-both-tiers-bool
      try:
        - apply:
            file: 03-invalid-both-tiers-bool.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSIAMConfig
                check:
                  ($error != null): true

    # AC-4: maxSessionDurationSeconds in both tiers is rejected.
    - name: ac4-reject-both-tiers-int
      try:
        - apply:
            file: 04-invalid-both-tiers-int.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSIAMConfig
                check:
                  ($error != null): true

    # AC-5: namingTemplate in both tiers is rejected.
    - name: ac5-reject-both-tiers-naming
      try:
        - apply:
            file: 05-invalid-both-tiers-naming.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSIAMConfig
                check:
                  ($error != null): true

    # AC-6: general-policy CR has zero mandatory fields and correct defaults.
    - name: ac6-general-policy-cr
      try:
        - apply:
            file: 06-awsiamconfig-general-policy.yaml
        - assert:
            file: 07-assert-ac6-general-policy.yaml

    # AC-7: strict CR has non-zero mandatory fields.
    - name: ac7-strict-cr
      try:
        - apply:
            file: 08-awsiamconfig-strict.yaml
        - assert:
            file: 09-assert-ac7-strict.yaml

