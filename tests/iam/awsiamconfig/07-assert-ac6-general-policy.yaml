# Assert: general-policy has zero mandatory fields and correct defaults.
apiVersion: kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: general-policy
  namespace: awsiamconfig
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
  defaults:
    maxSessionDurationSeconds: 3600
    namingTemplate: "{namespace}-{name}"
