# Hardened AWSIAMConfig (strict).
apiVersion: kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: strict
  namespace: awsiamconfig
spec:
  mandatory:
    permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/OrgPermissionsBoundary"
    blockIamUserAccessKeys: true
    maxSessionDurationSeconds: 3600
    namingTemplate: ""
    tags:
      compliance-tier: strict
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
