# Local (payments-prod) AWSKropathConfig with mandatory boundary (level 2 — should lose).
apiVersion: kropath.run/v1alpha1
kind: AWSKropathConfig
metadata:
  name: general-policy
  namespace: payments-prod
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/LocalBoundary"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
