# Global (kro-system) AWSKropathConfig with mandatory boundary (level 1).
apiVersion: kropath.run/v1alpha1
kind: AWSKropathConfig
metadata:
  name: general-policy
  namespace: awsiamconfig
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/GlobalBoundary"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
