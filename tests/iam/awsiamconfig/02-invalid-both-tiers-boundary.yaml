# Should be rejected: permissionsBoundaryArn in both mandatory and defaults.
apiVersion: aws.kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: invalid-both-tiers-boundary
  namespace: awsiamconfig
spec:
  mandatory:
    permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/MandatoryBoundary"
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/DefaultBoundary"
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 3600
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
