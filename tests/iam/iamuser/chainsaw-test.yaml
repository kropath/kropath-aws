---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: iamuser
spec:
  namespace: iamuser
  steps:
    - name: seed-effective-config
      try:
        - script:
            content: |
              kubectl delete iamconfig user-general-policy -n iamuser --ignore-not-found=true
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl patch iamconfig user-general-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - script:
            content: |
              echo "=== LIVE STATUS REVEAL ==="
              kubectl get iamconfig user-general-policy -n iamuser -o yaml

    # AC-1: basic user, no access key created
    - name: ac1-basic-user-no-access-key
      try:
        - apply:
            file: 01-basic-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: basic-user
                namespace: iamuser
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: basic-user
              spec:
                name: iamuser-basic-user
                path: /

    # AC-3: createAccessKey=true but mandatory.blockIamUserAccessKeys=true — access key suppressed
    - name: ac3-access-key-blocked-by-mandatory
      try:
        - script:
            content: |
              kubectl patch iamconfig user-general-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch iamconfig user-general-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":true,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 03-blocked-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: blocked-user
                namespace: iamuser
              spec:
                name: iamuser-blocked-user
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: blocked-user
                namespace: iamuser
              status:
                accessKeyBlocked: true
                accessKeyBlockedConditionType: AccessKeyBlockedByGovernance

    # AC-5: createAccessKey=false + mandatory.blockIamUserAccessKeys=true — blocked flag is false (user didn't request a key)
    - name: ac5-no-request-when-governance-blocked
      try:
        - apply:
            file: 04-no-request-blocked-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: no-request-blocked-user
                namespace: iamuser
              spec:
                name: iamuser-no-request-blocked-user
        # Advisory ConfigMap must NOT exist — no key was requested so governance suppression should not trigger
        - script:
            content: |
              if kubectl get configmap no-request-blocked-user-access-key-blocked -n iamuser 2>/dev/null; then
                echo "FAIL: advisory ConfigMap should not exist" >&2
                exit 1
              fi
              echo "OK: advisory ConfigMap absent as expected"

    - name: reset-config-to-unblocked
      try:
        - script:
            content: |
              kubectl patch iamconfig user-general-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch iamconfig user-general-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'

    # AC-4: namespace-local IAMConfig with mandatory.blockIamUserAccessKeys=true suppresses access key
    - name: ac4-namespace-local-block
      try:
        - script:
            content: |
              kubectl delete iamconfig namespace-strict-policy -n iamuser --ignore-not-found=true
        - apply:
            file: 15-namespace-strict-config.yaml
        - script:
            content: |
              kubectl patch iamconfig namespace-strict-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":true,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 16-namespace-blocked-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: namespace-blocked-user
                namespace: iamuser
              spec:
                name: iamuser-namespace-blocked-user
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: namespace-blocked-user
                namespace: iamuser
              status:
                accessKeyBlocked: true
                accessKeyBlockedConditionType: AccessKeyBlockedByGovernance

    # AC-6: groups passed through to ACK User
    - name: ac6-groups-user
      try:
        - apply:
            file: 05-groups-user.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: groups-user
                namespace: iamuser
              status:
                namingStatus: valid

    # AC-7: policy ARN attached directly
    - name: ac7-arn-policy-user
      try:
        - apply:
            file: 06-arn-policy-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: arn-policy-user
                namespace: iamuser
              spec:
                name: iamuser-arn-policy-user
                policies:
                  - arn:aws:iam::aws:policy/ReadOnlyAccess

    # AC-8: policy attached via AWSIAMPolicy CR ref
    - name: ac8-policy-ref-user
      try:
        - apply:
            file: 07-my-policy.yaml
        - script:
            content: |
              # Wait for kro to create the underlying ACK Policy object
              for i in $(seq 1 30); do
                kubectl get policies.iam.services.k8s.aws my-policy -n iamuser 2>/dev/null && break
                sleep 1
              done
              # Seed a fake ARN on the ACK Policy status — kro reads ackResourceMetadata.arn
              kubectl patch policies.iam.services.k8s.aws my-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:policy/MyPolicy","ownerAccountID":"123456789012","region":"us-east-1"}}}'
              # Wait for kro to propagate the ARN to AWSIAMPolicy.status.arn
              for i in $(seq 1 30); do
                arn=$(kubectl get iampolicy my-policy -n iamuser -o jsonpath='{.status.arn}' 2>/dev/null)
                [ -n "$arn" ] && break
                sleep 1
              done
        - apply:
            file: 08-policy-ref-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: policy-ref-user
                namespace: iamuser
              spec:
                name: iamuser-policy-ref-user
                policies:
                  - arn:aws:iam::123456789012:policy/MyPolicy

    # AC-9: inline policy via documentJSON
    - name: ac9-inline-policy-json
      try:
        - apply:
            file: 09-inline-json-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: inline-json-user
                namespace: iamuser
              spec:
                name: iamuser-inline-json-user
                inlinePolicies:
                  s3-write: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject"],"Resource":"*"}]}'

    # AC-9b: inline policy via PolicyDocument CR ref
    - name: ac9b-inline-policy-doc-ref
      try:
        - apply:
            file: 10-policy-doc.yaml
        - apply:
            file: 11-inline-doc-ref-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: inline-doc-ref-user
                namespace: iamuser
              spec:
                name: iamuser-inline-doc-ref-user
                inlinePolicies:
                  ec2-read: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["ec2:Describe*"],"Resource":"*"}]}'

    # AC-10: naming template produces resourceName and predictedArn
    - name: ac10-naming-template-resource-name
      try:
        - apply:
            file: 12-named-user.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: named-user
                namespace: iamuser
              status:
                resourceName: iamuser-named-user
                predictedArn: "arn:aws:iam::123456789012:user/iamuser-named-user"
                namingStatus: valid

    # AC-11: mandatory + spec tags merge, mandatory wins
    - name: ac11-tags-merge
      try:
        - script:
            content: |
              kubectl patch iamconfig user-general-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch iamconfig user-general-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":false,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 13-tags-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: tags-user
                namespace: iamuser
              spec:
                name: iamuser-tags-user
        - script:
            content: |
              TAGS=$(kubectl get user tags-user -n iamuser -o json | jq -c '.spec.tags')
              COUNT=$(echo "$TAGS" | jq 'length')
              [ "$COUNT" -eq 2 ] || { echo "FAIL: expected 2 tags, got $COUNT: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "cost-centre" and .value == "platform")' >/dev/null || { echo "FAIL: missing tag cost-centre=platform"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "team" and .value == "ops")' >/dev/null || { echo "FAIL: missing tag team=ops"; exit 1; }

    # AC-12: syncedLabels appear as kropath.run/ labels on User AND as plain keys in cloud tags
    - name: ac12-synced-labels
      try:
        - script:
            content: |
              kubectl patch iamconfig user-general-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch iamconfig user-general-policy -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"blockIamUserAccessKeys":false,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"blockIamUserAccessKeys":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 14-synced-labels-user.yaml
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: synced-labels-user
                namespace: iamuser
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: synced-labels-user
                  kropath.run/environment: production
              spec:
                name: iamuser-synced-labels-user
        - script:
            content: |
              TAGS=$(kubectl get user synced-labels-user -n iamuser -o json | jq -c '.spec.tags')
              COUNT=$(echo "$TAGS" | jq 'length')
              [ "$COUNT" -eq 1 ] || { echo "FAIL: expected 1 tag, got $COUNT: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "environment" and .value == "production")' >/dev/null || { echo "FAIL: missing tag environment=production"; exit 1; }

    # AC-13: ACK User child has required standard metadata
    - name: ac13-standard-metadata
      try:
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: basic-user
                namespace: iamuser
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: basic-user
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: iamuser-basic-user
                path: /

    # ──────────────────────────────────────────────────────────────────────────
    # KRO-236: {tag.X} dynamic token resolution in namingTemplate for IAMUser.
    # ──────────────────────────────────────────────────────────────────────────

    - name: kro236-iamuser-tag-token-resolved-from-spec-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: kro236-user-tag-config
                namespace: iamuser
                labels:
                  aws.kropath.run/resource-name: kro236-user-tag-config
              spec:
                mandatory:
                  namingTemplate: "{namespace}-{name}-{tag.team}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  blockIamUserAccessKeys: false
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  blockIamUserAccessKeys: false
        - script:
            content: |
              kubectl patch iamconfig kro236-user-tag-config -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{namespace}-{name}-{tag.team}","tags":{},"syncedLabels":{},"syncedAnnotations":{},"blockIamUserAccessKeys":false},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"blockIamUserAccessKeys":false},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: kro236-tag-user
                namespace: iamuser
              spec:
                configRef: kro236-user-tag-config
                tags:
                  team: platform
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: kro236-tag-user
                namespace: iamuser
              spec:
                name: iamuser-kro236-tag-user-platform
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: kro236-tag-user
                namespace: iamuser
              status:
                resourceName: iamuser-kro236-tag-user-platform
                namingStatus: valid
      cleanup:
        - script:
            content: |
              kubectl delete iamuser kro236-tag-user -n iamuser --ignore-not-found=true
              kubectl delete iamconfig kro236-user-tag-config -n iamuser --ignore-not-found=true

    - name: kro236-iamuser-tag-token-unresolved-invalid-status
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: kro236-user-missing-tag-config
                namespace: iamuser
                labels:
                  aws.kropath.run/resource-name: kro236-user-missing-tag-config
              spec:
                mandatory:
                  namingTemplate: "{namespace}-{name}-{tag.team}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  blockIamUserAccessKeys: false
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  blockIamUserAccessKeys: false
        - script:
            content: |
              kubectl patch iamconfig kro236-user-missing-tag-config -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{namespace}-{name}-{tag.team}","tags":{},"syncedLabels":{},"syncedAnnotations":{},"blockIamUserAccessKeys":false},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"blockIamUserAccessKeys":false},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: kro236-missing-tag-user
                namespace: iamuser
              spec:
                configRef: kro236-user-missing-tag-config
                tags: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: kro236-missing-tag-user
                namespace: iamuser
              status:
                namingStatus: invalid-unresolved-tokens
      cleanup:
        - script:
            content: |
              kubectl delete iamuser kro236-missing-tag-user -n iamuser --ignore-not-found=true
              kubectl delete iamconfig kro236-user-missing-tag-config -n iamuser --ignore-not-found=true

    - name: kro236-iamuser-mandatory-tag-overrides-spec-tag
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: kro236-user-mandatory-tag-config
                namespace: iamuser
                labels:
                  aws.kropath.run/resource-name: kro236-user-mandatory-tag-config
              spec:
                mandatory:
                  namingTemplate: "{namespace}-{name}-{tag.team}"
                  tags:
                    team: mandatory-team
                  syncedLabels: {}
                  syncedAnnotations: {}
                  blockIamUserAccessKeys: false
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                  blockIamUserAccessKeys: false
        - script:
            content: |
              kubectl patch iamconfig kro236-user-mandatory-tag-config -n iamuser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{namespace}-{name}-{tag.team}","tags":{"team":"mandatory-team"},"syncedLabels":{},"syncedAnnotations":{},"blockIamUserAccessKeys":false},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{},"blockIamUserAccessKeys":false},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: kro236-mandatory-tag-user
                namespace: iamuser
              spec:
                configRef: kro236-user-mandatory-tag-config
                tags:
                  team: spec-team
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: User
              metadata:
                name: kro236-mandatory-tag-user
                namespace: iamuser
              spec:
                name: iamuser-kro236-mandatory-tag-user-mandatory-team
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMUser
              metadata:
                name: kro236-mandatory-tag-user
                namespace: iamuser
              status:
                resourceName: iamuser-kro236-mandatory-tag-user-mandatory-team
                namingStatus: valid
      cleanup:
        - script:
            content: |
              kubectl delete iamuser kro236-mandatory-tag-user -n iamuser --ignore-not-found=true
              kubectl delete iamconfig kro236-user-mandatory-tag-config -n iamuser --ignore-not-found=true
