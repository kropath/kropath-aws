apiVersion: aws.kropath.run/v1alpha1
kind: IAMPolicy
metadata:
  name: my-policy
  namespace: iamuser
  labels:
    aws.kropath.run/resource-name: my-policy
spec:
  configRef: user-general-policy
  path: /
  documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"*"}]}'
