# aws-iam-03 Chainsaw tests.
# AC-7 is covered at the status/ARN surface until aws-iam-02 lands in this branch.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: iampolicy
spec:
  skipDelete: true
  namespace: iampolicy
  steps:
    - name: ac1-documentjson
      try:
        - apply:
            file: 00-iampolicy-namespace.yaml
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 01-iampolicy-documentjson.yaml
        - assert:
            file: 01-assert-created-policy.yaml

    - name: ac1b-documentref
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 02-policydocument.yaml
        - script:
            content: |
              kubectl patch policydocument my-policy-doc -n iampolicy \
                --subresource=status --type=merge \
                -p '{"status":{"resolvedDocumentJSON":"{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":\"s3:PutObject\",\"Resource\":\"*\"}]}"}}'
        - apply:
            file: 02-iampolicy-documentref.yaml
        - assert:
            file: 02-assert-created-policy.yaml

    - name: ac1c-mutual-exclusion
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 03-invalid-documentjson-and-ref.yaml
        - assert:
            file: 03-assert-mutual-exclusion.yaml

    - name: ac2-update-documentjson
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 04-iampolicy-update-v1.yaml
        - apply:
            file: 04-iampolicy-update-v2.yaml
        - assert:
            file: 04-assert-updated-policy.yaml

    - name: ac3-path
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 05-iampolicy-service-role.yaml
        - assert:
            file: 05-assert-service-role-policy.yaml

    - name: ac4-resource-name
      try:
        - apply:
            file: 06-iamconfig-iampolicy.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 06-iampolicy-resource-name.yaml
        - assert:
            file: 06-assert-resource-name.yaml
    - name: ac5-tags
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 07-iampolicy-tags.yaml
        - assert:
            file: 07-assert-tags.yaml
    - name: ac6-synced-labels
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 08-iampolicy-synced-labels.yaml
        - assert:
            file: 08-assert-synced-labels.yaml
    - name: ac7-status-arn
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 09-iampolicy-status-arn.yaml
        - assert:
            file: 09-assert-status-arn.yaml
    - name: ac8-standard-metadata
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 10-iampolicy-standard-metadata.yaml
        - assert:
            file: 10-assert-standard-metadata.yaml
    - name: ac9-status-arn-actual
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 09-iampolicy-status-arn.yaml
        - assert:
            file: 09-assert-status-arn.yaml
    - name: ac10-delete-policy
      try:
        - apply:
            file: 01-iamconfig-default.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch iamconfig general-policy -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 11-iampolicy-delete-policy.yaml
        - assert:
            file: 11-assert-delete-policy.yaml
    - name: kro222-configref-labelselector
      try:
        - script:
            content: |
              kubectl apply -f - <<'YAML'
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: custom-policy-config
                namespace: iampolicy
                labels:
                  aws.kropath.run/resource-name: custom-policy-config
              spec:
                mandatory:
                  permissionsBoundaryArn: ""
                  blockIamUserAccessKeys: false
                  maxSessionDurationSeconds: 0
                  namingTemplate: "kro222-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  permissionsBoundaryArn: ""
                  blockIamUserAccessKeys: false
                  maxSessionDurationSeconds: 3600
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              YAML
              kubectl patch iamconfig custom-policy-config -n iampolicy --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"kro222-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMPolicy
              metadata:
                name: kro222-policy
                namespace: iampolicy
              spec:
                configRef: custom-policy-config
                nameOverride: ""
                deletionPolicy: retain
                documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"*"}]}'
                documentRef: ""
                tags: {}
                syncedLabels: {}
                syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Policy
              metadata:
                name: kro222-policy
                namespace: iampolicy
              spec:
                name: kro222-kro222-policy
    - name: kro236-iampolicy-tag-token-resolved-from-spec-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: kro236-policy-tag-config
                namespace: iampolicy
                labels:
                  aws.kropath.run/resource-name: kro236-policy-tag-config
              spec:
                mandatory:
                  namingTemplate: "{namespace}-{name}-{tag.team}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch iamconfig kro236-policy-tag-config -n iampolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{namespace}-{name}-{tag.team}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMPolicy
              metadata:
                name: kro236-tag-policy
                namespace: iampolicy
              spec:
                configRef: kro236-policy-tag-config
                documentJSON: '{"Version":"2012-10-17","Statement":[]}'
                tags:
                  team: platform
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Policy
              metadata:
                name: kro236-tag-policy
                namespace: iampolicy
              spec:
                name: iampolicy-kro236-tag-policy-platform
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMPolicy
              metadata:
                name: kro236-tag-policy
                namespace: iampolicy
              status:
                resourceName: iampolicy-kro236-tag-policy-platform
                namingStatus: valid
    - name: kro236-iampolicy-tag-token-unresolved-invalid-status
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: kro236-policy-missing-tag-config
                namespace: iampolicy
                labels:
                  aws.kropath.run/resource-name: kro236-policy-missing-tag-config
              spec:
                mandatory:
                  namingTemplate: "{namespace}-{name}-{tag.team}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch iamconfig kro236-policy-missing-tag-config -n iampolicy \
