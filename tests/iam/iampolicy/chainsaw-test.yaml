                namespace: iampolicy
              spec:
                configRef: kro236-policy-missing-tag-config
                documentJSON: '{"Version":"2012-10-17","Statement":[]}'
                tags: {}
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMPolicy
              metadata:
                name: kro236-missing-tag-policy
                namespace: iampolicy
              status:
                namingStatus: invalid-unresolved-tokens
