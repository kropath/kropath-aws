apiVersion: kropath.run/v1alpha1
kind: AWSIAMRole
metadata:
  name: my-test-role
  namespace: default
spec:
  configRef: general-policy
  nameOverride: ""
  deletionPolicy: retain
  type: ec2
  description: "Test EC2 role"
  tags:
    team: backend
  syncedLabels: {}
  syncedAnnotations: {}
  # Instance attempts to set its own boundary — mandatory must win
  permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/TeamBoundary"
  addSsmPolicy: true
  createInstanceProfile: true
  maxSessionDuration: 0
