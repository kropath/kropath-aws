# AC-2 (removed-spec-aws-is-inert, KRO-1129): a manifest authored as if spec.aws still
# existed (the exact shape every KropathConfig fixture carried before this ticket). The
# CRD no longer declares the field (spec §4.1) -- applied under non-strict field
# validation, the API server's structural-schema pruning drops it before any validation
# runs, per spec §6.1. See chainsaw-test.yaml's ac2-removed-spec-aws-is-inert step for why
# this is applied via `kubectl apply --validate=false` rather than chainsaw's own `apply:`
# step.
#
# Re-applies the same singleton object (kind: KropathConfig is a per-namespace singleton
# named "baseline", enforced by an x-kubernetes-validations rule) created earlier in this
# suite by 01-global-kropathconfig.yaml. This step runs last, after every assertion that
# depends on the object's earlier state, so mutating it here is safe.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: cascade
spec:
  mandatory:
    tags:
      cost-center: platform
    syncedLabels:
      managed-by: kropath
  defaults:
    tags:
      environment: test
  aws:
    accountId: "999988887777"
    region: "us-east-1"
