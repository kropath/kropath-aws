apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cascade
spec:
  # Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
  # skipDelete"): skipDelete stops chainsaw's end-of-test cascade delete; the cluster runs
  # kro but no ACK controllers, so ACK finalizers never clear and any delete would hang.
  skipDelete: true
  namespace: cascade
  steps:
    - name: apply-governance-config
      try:
        - apply:
            file: 00-cascade-namespace.yaml
        - apply:
            file: 01-global-kropathconfig.yaml
        - apply:
            file: 02-iamconfig-mandatory-boundary.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n cascade \
                --subresource=status \
                --type=merge \
                --patch-file 02-iamconfig-mandatory-boundary.yaml

    - name: create-iam-role-with-instance-override-attempt
      try:
        - apply:
            file: 03-iamrole-ec2.yaml

    - name: assert-mandatory-boundary-wins
      try:
        - assert:
            file: 04-expected-role.yaml
            timeout: 60s
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get roles.iam.services.k8s.aws my-test-role -n cascade -o json | jq -c '.spec.tags')
              COUNT=$(echo "$TAGS" | jq 'length')
              [ "$COUNT" -eq 4 ] || { echo "FAIL: expected 4 tags, got $COUNT: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "cost-center" and .value == "platform")' >/dev/null || { echo "FAIL: missing mandatory tag cost-center=platform"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "managed-by" and .value == "kropath")' >/dev/null || { echo "FAIL: missing mandatory syncedLabel managed-by=kropath"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "team" and .value == "backend")' >/dev/null || { echo "FAIL: missing instance tag team=backend"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "environment" and .value == "test")' >/dev/null || { echo "FAIL: missing defaults tag environment=test"; exit 1; }
