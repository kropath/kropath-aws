apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cascade
spec:
  # Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
  # skipDelete"): skipDelete stops chainsaw's end-of-test cascade delete; the cluster runs
  # kro but no ACK controllers, so ACK finalizers never clear and any delete would hang.
  skipDelete: true
  namespace: cascade
  steps:
    - name: apply-governance-config
      try:
        - apply:
            file: 00-cascade-namespace.yaml
        - apply:
            file: 01-global-kropathconfig.yaml
        - apply:
            file: 02-iamconfig-mandatory-boundary.yaml
        - script:
            content: |
              kubectl patch iamconfig general-policy -n cascade \
                --subresource=status \
                --type=merge \
                --patch-file 02-iamconfig-mandatory-boundary.yaml

    - name: create-iam-role-with-instance-override-attempt
      try:
        - apply:
            file: 03-iamrole-ec2.yaml

    - name: assert-mandatory-boundary-wins
      try:
        - assert:
            file: 04-expected-role.yaml
            timeout: 60s
        - script:
            timeout: 60s
            content: |
              TAGS=$(kubectl get roles.iam.services.k8s.aws my-test-role -n cascade -o json | jq -c '.spec.tags')
              COUNT=$(echo "$TAGS" | jq 'length')
              [ "$COUNT" -eq 4 ] || { echo "FAIL: expected 4 tags, got $COUNT: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "cost-center" and .value == "platform")' >/dev/null || { echo "FAIL: missing mandatory tag cost-center=platform"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "managed-by" and .value == "kropath")' >/dev/null || { echo "FAIL: missing mandatory syncedLabel managed-by=kropath"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "team" and .value == "backend")' >/dev/null || { echo "FAIL: missing instance tag team=backend"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "environment" and .value == "test")' >/dev/null || { echo "FAIL: missing defaults tag environment=test"; exit 1; }

    # AC-2 (removed-spec-aws-is-inert, KRO-1129): 05-kropathconfig-with-spec-aws.yaml
    # re-applies the "baseline" singleton with spec.aws still set, matching the exact shape
    # every KropathConfig manifest carried before the CRD (spec §4.1) dropped the field.
    #
    # Applied via `kubectl apply --validate=false` rather than chainsaw's own `apply:` step.
    # Reproduced locally: chainsaw's `apply:` step -- like a bare `kubectl apply` on any
    # kubectl >=1.24 -- requests server-side field validation in Strict mode by default, and
    # under Strict mode an unrecognised field is a loud "strict decoding error" rejection,
    # not the silent structural-schema pruning spec §6.1 describes. §6.1's claim holds only
    # for a client that does not request Strict field validation -- the API server's own
    # default (no fieldValidation query param) is Warn, which prunes and merely logs a
    # warning. `--validate=false` reproduces that non-Strict path so this step tests the
    # scenario the spec actually describes, without silently masking the Strict-mode gap.
    # Flagged for Design/human review: a KropathConfig applied by plain `kubectl apply`
    # (kubectl's own default since 1.24) is rejected outright, not silently pruned -- the
    # opposite of what spec §6.1 states ("no mechanism ... makes a removed field a loud
    # failure at admission"). GitOps tools using server-side apply without an explicit
    # fieldValidation=Strict request (the common case) do see the silent-prune behaviour;
    # kubectl CLI users do not.
    - name: ac2-removed-spec-aws-is-inert
      try:
        - script:
            content: |
              kubectl apply --validate=false -f 05-kropathconfig-with-spec-aws.yaml
              HAS_AWS=$(kubectl get kropathconfig baseline -n cascade -o json | jq '(.spec | has("aws"))')
              [ "$HAS_AWS" = "false" ] || { echo "FAIL: spec.aws should be pruned (absent), got has(aws)=$HAS_AWS"; exit 1; }
              ACCOUNT=$(kubectl get kropathconfig baseline -n cascade -o jsonpath='{.spec.mandatory.tags.cost-center}')
              [ "$ACCOUNT" = "platform" ] || { echo "FAIL: unrelated spec fields should be unaffected by the prune"; exit 1; }
              echo "PASS: spec.aws pruned rather than rejected (non-Strict field validation)"
