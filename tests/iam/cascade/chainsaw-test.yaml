apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awsiamrole-permissionsboundary-mandatory-wins
spec:
  namespace: cascade
  steps:
    - name: apply-governance-config
      try:
        - apply:
            file: 00-cascade-namespace.yaml
        - apply:
            file: 01-global-kropathconfig.yaml
        - apply:
            file: 02-awsiamconfig-mandatory-boundary.yaml
        - script:
            content: |
              kubectl patch awsiamconfig general-policy -n cascade \
                --subresource=status \
                --type=merge \
                --patch-file 02-awsiamconfig-mandatory-boundary.yaml

    - name: create-iam-role-with-instance-override-attempt
      try:
        - apply:
            file: 03-awsiamrole-ec2.yaml

    - name: assert-mandatory-boundary-wins
      try:
        - assert:
            file: 04-expected-role.yaml
            timeout: 60s
