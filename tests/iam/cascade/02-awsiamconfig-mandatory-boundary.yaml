apiVersion: kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: general-policy
  namespace: cascade
  labels:
    kropath.run/config-name: general-policy
spec: {}
status:
  effectiveConfig:
    mandatory:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/OrgBoundary"
      tags:
        cost-center: platform
      syncedLabels:
        managed-by: kropath
    defaults:
      maxSessionDurationSeconds: 3600
      tags:
        environment: test
    aws:
      accountId: "123456789012"
      region: "us-east-1"
