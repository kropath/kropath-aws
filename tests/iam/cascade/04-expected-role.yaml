# Partial-match assertion — Chainsaw ignores extra fields; only asserts what is listed.
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: my-test-role
  namespace: cascade
  labels:
    app.kubernetes.io/instance: my-test-role
    app.kubernetes.io/managed-by: kro
    kropath.run/managed-by: kropath
spec:
  permissionsBoundary: "arn:aws:iam::123456789012:policy/OrgBoundary"
  tags:
    - key: cost-center
      value: platform
    - key: managed-by
      value: kropath
    - key: team
      value: backend
    - key: environment
      value: test
  maxSessionDuration: 3600
