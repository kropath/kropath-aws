apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: general-policy
  namespace: iamgroup
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: ""
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
  defaults:
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: "{namespace}-{name}"
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 3600
