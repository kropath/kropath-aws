---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: iamgroup
spec:
  namespace: iamgroup
  steps:
    - name: ac1-no-policies
      try:
        - apply:
            file: 00-iamgroup-namespace.yaml
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamgroup --ignore-not-found=true
              kubectl apply -f 00-iamconfig.yaml
              kubectl patch iamconfig general-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 01-group-no-policies.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group no-policies-group -n iamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: no-policies-group
                namespace: iamgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: no-policies-group
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: iamgroup-no-policies-group
                path: /
                policies: []
                inlinePolicies: {}
      cleanup:
        - delete:
            file: 01-group-no-policies.yaml
        - delete:
            file: 00-iamconfig.yaml

    - name: ac2-managed-policy
      try:
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamgroup --ignore-not-found=true
              kubectl apply -f 00-iamconfig.yaml
              kubectl patch iamconfig general-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 02-group-managed-policy.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group managed-policy-group -n iamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: managed-policy-group
                namespace: iamgroup
              spec:
                name: iamgroup-managed-policy-group
                policies:
                  - arn:aws:iam::aws:policy/ReadOnlyAccess
      cleanup:
        - delete:
            file: 02-group-managed-policy.yaml
        - delete:
            file: 00-iamconfig.yaml

    - name: ac3-policy-ref
      try:
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamgroup --ignore-not-found=true
              kubectl apply -f 00-iamconfig.yaml
              kubectl patch iamconfig general-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 03-my-policy.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get policies.iam.services.k8s.aws my-policy -n iamgroup 2>/dev/null && break
                sleep 2
              done
              kubectl patch policies.iam.services.k8s.aws my-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:iam::123456789012:policy/MyPolicy","ownerAccountID":"123456789012","region":"us-east-1"}}}'
              for i in $(seq 1 30); do
                arn="$(kubectl get iampolicy my-policy -n iamgroup -o jsonpath='{.status.arn}' 2>/dev/null || true)"
                [ -n "$arn" ] && break
                sleep 1
              done
        - apply:
            file: 04-group-policy-ref.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group policy-ref-group -n iamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: policy-ref-group
                namespace: iamgroup
              spec:
                name: iamgroup-policy-ref-group
                policies:
                  - arn:aws:iam::123456789012:policy/MyPolicy
      cleanup:
        - delete:
            file: 04-group-policy-ref.yaml
        - delete:
            file: 03-my-policy.yaml
        - delete:
            file: 00-iamconfig.yaml

    - name: ac4-inline-json
      try:
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamgroup --ignore-not-found=true
              kubectl apply -f 00-iamconfig.yaml
              kubectl patch iamconfig general-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 06-group-inline-json.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group inline-json-group -n iamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: inline-json-group
                namespace: iamgroup
              spec:
                name: iamgroup-inline-json-group
                inlinePolicies:
                  s3-list: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":"*"}]}'
      cleanup:
        - delete:
            file: 06-group-inline-json.yaml
        - delete:
            file: 00-iamconfig.yaml

    - name: ac4b-inline-document-ref
      try:
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamgroup --ignore-not-found=true
              kubectl apply -f 00-iamconfig.yaml
              kubectl patch iamconfig general-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 05-inline-doc.yaml
        - apply:
            file: 07-group-inline-ref.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group inline-ref-group -n iamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: inline-ref-group
                namespace: iamgroup
              spec:
                name: iamgroup-inline-ref-group
                inlinePolicies:
                  s3-list: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"*"}]}'
      cleanup:
        - delete:
            file: 07-group-inline-ref.yaml
        - delete:
            file: 05-inline-doc.yaml
        - delete:
            file: 00-iamconfig.yaml

    - name: ac5-resource-name
      try:
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamgroup --ignore-not-found=true
              kubectl apply -f 00-iamconfig.yaml
              kubectl patch iamconfig general-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 08-group-naming.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group named-group -n iamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: named-group
                namespace: iamgroup
              spec:
                name: iamgroup-named-group
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMGroup
              metadata:
                name: named-group
                namespace: iamgroup
              status:
                resourceName: iamgroup-named-group
                predictedArn: arn:aws:iam::123456789012:group/iamgroup-named-group
      cleanup:
        - delete:
            file: 08-group-naming.yaml
        - delete:
            file: 00-iamconfig.yaml

    - name: ac6-tags
      try:
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamgroup --ignore-not-found=true
              kubectl apply -f 00-iamconfig.yaml
              kubectl patch iamconfig general-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 09-group-tags.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group tags-group -n iamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: tags-group
                namespace: iamgroup
              spec:
                name: iamgroup-tags-group
                path: "/"
                policies: []
        - script:
            content: |
              kubectl get groups.iam.services.k8s.aws tags-group -n iamgroup -o json \
                | jq -e '.spec | has("tags") | not' >/dev/null
      cleanup:
        - delete:
            file: 09-group-tags.yaml
        - delete:
            file: 00-iamconfig.yaml

    - name: ac7-synced-labels
      try:
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamgroup --ignore-not-found=true
              kubectl apply -f 00-iamconfig.yaml
              kubectl patch iamconfig general-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{"environment":"production"},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 10-group-synced-labels.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group synced-labels-group -n iamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: synced-labels-group
                namespace: iamgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: synced-labels-group
                  kropath.run/environment: production
              spec:
                name: iamgroup-synced-labels-group
                path: "/"
                policies: []
        - script:
            content: |
              kubectl get groups.iam.services.k8s.aws synced-labels-group -n iamgroup -o json \
                | jq -e '.spec | has("tags") | not' >/dev/null
      cleanup:
        - delete:
            file: 10-group-synced-labels.yaml
        - delete:
            file: 00-iamconfig.yaml

    - name: ac8-standard-metadata
      try:
        - apply:
            file: 00-iamconfig.yaml
        - script:
            content: |
              kubectl delete iamconfig general-policy -n iamgroup --ignore-not-found=true
              kubectl apply -f 00-iamconfig.yaml
              kubectl patch iamconfig general-policy -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0},"defaults":{"tags":{},"syncedLabels":{},"syncedAnnotations":{},"namingTemplate":"{namespace}-{name}","permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            file: 11-group-standard-metadata.yaml
        - script:
            content: |
              for i in $(seq 1 30); do
                kubectl get group standard-metadata-group -n iamgroup >/dev/null 2>&1 && break
                sleep 1
              done
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: standard-metadata-group
                namespace: iamgroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: standard-metadata-group
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: iamgroup-standard-metadata-group
        - script:
            content: |
              tags="$(kubectl get group standard-metadata-group -n iamgroup -o jsonpath='{.spec.tags}' 2>/dev/null || true)"
              test -z "$tags"
      cleanup:
        - delete:
            file: 11-group-standard-metadata.yaml
        - delete:
            file: 00-iamconfig.yaml

    - name: kro222-configref-labelselector
      try:
        - script:
            content: |
              kubectl apply -f - << 'YAML'
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMConfig
              metadata:
                name: custom-group-config
                namespace: iamgroup
                labels:
                  aws.kropath.run/resource-name: custom-group-config
              spec:
                mandatory:
                  permissionsBoundaryArn: ""
                  blockIamUserAccessKeys: false
                  maxSessionDurationSeconds: 0
                  namingTemplate: "kro222-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  permissionsBoundaryArn: ""
                  blockIamUserAccessKeys: false
                  maxSessionDurationSeconds: 3600
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
              YAML
              kubectl patch iamconfig custom-group-config -n iamgroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":0,"namingTemplate":"kro222-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"permissionsBoundaryArn":"","blockIamUserAccessKeys":false,"maxSessionDurationSeconds":3600,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: IAMGroup
              metadata:
                name: kro222-group
                namespace: iamgroup
              spec:
                configRef: custom-group-config
                nameOverride: ""
                deletionPolicy: retain
                tags: {}
                syncedLabels: {}
                syncedAnnotations: {}
        - assert:
            resource:
              apiVersion: iam.services.k8s.aws/v1alpha1
              kind: Group
              metadata:
                name: kro222-group
                namespace: iamgroup
              spec:
                name: kro222-kro222-group
      cleanup:
        - script:
            content: |
              kubectl delete iamgroup kro222-group -n iamgroup --ignore-not-found=true
              kubectl delete iamconfig custom-group-config -n iamgroup --ignore-not-found=true
