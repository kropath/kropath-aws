apiVersion: aws.kropath.run/v1alpha1
kind: IAMRole
metadata:
  name: inline-json-role
  namespace: iamrole
spec:
  configRef: role-general-policy
  type: lambda
  addLambdaBasicPolicy: false
  policies:
    - inline:
        name: inline-json
        documentJSON: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"*"}]}
