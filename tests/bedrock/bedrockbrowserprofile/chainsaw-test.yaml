# BedrockBrowserProfile Chainsaw tests — spec: aws-bedrock-12.
# Canonical pattern: skipDelete + unique resource name per step; no inter-step deletes.
# Tags on ACK BrowserProfile are map[string]string; use jq to_entries for order-independent assertion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockbrowserprofile
spec:
  skipDelete: true
  namespace: bedrockbrowserprofile
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: minimal create — no optional fields. ACK BrowserProfile created.
    - name: ac1-create-profile-minimal
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac1-cfg
                namespace: bedrockbrowserprofile
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac1-cfg -n bedrockbrowserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac1-profile
                namespace: bedrockbrowserprofile
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac1-profile
                namespace: bedrockbrowserprofile
              status:
                resourceName: bedrockbrowserprofile-ac1-profile
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: BrowserProfile
              metadata:
                name: bedrockbrowserprofile-ac1-profile
                namespace: bedrockbrowserprofile
              spec:
                name: bedrockbrowserprofile-ac1-profile

    # AC-2: create with description.
    - name: ac2-create-profile-with-desc
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac2-cfg
                namespace: bedrockbrowserprofile
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac2-cfg -n bedrockbrowserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac2-profile
                namespace: bedrockbrowserprofile
              spec:
                configRef: ac2-cfg
                description: "My browser profile description"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: BrowserProfile
              metadata:
                name: bedrockbrowserprofile-ac2-profile
                namespace: bedrockbrowserprofile
              spec:
                description: "My browser profile description"

    # AC-3: tags merge — mandatory > spec > defaults.
    - name: ac3-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac3-cfg
                namespace: bedrockbrowserprofile
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: ai
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: ml
        - script:
            content: |
              kubectl patch bedrockconfig ac3-cfg -n bedrockbrowserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"cost-centre":"ai"},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{"team":"ml"},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac3-profile
                namespace: bedrockbrowserprofile
              spec:
                configRef: ac3-cfg
                tags:
                  app: agent
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: BrowserProfile
              metadata:
                name: bedrockbrowserprofile-ac3-profile
                namespace: bedrockbrowserprofile
        - script:
            content: |
              set -eu
              TAGS=$(kubectl get browserprofile bedrockbrowserprofile-ac3-profile -n bedrockbrowserprofile -o json \
                | jq -r '.spec.tags | to_entries | map(.key + "=" + .value) | sort | join(",")')
              echo "tags: $TAGS"
              echo "$TAGS" | grep -q "app=agent"
              echo "$TAGS" | grep -q "cost-centre=ai"
              echo "$TAGS" | grep -q "team=ml"

    # AC-4: standard K8s metadata.
    - name: ac4-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac4-cfg
                namespace: bedrockbrowserprofile
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac4-cfg -n bedrockbrowserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac4-profile
                namespace: bedrockbrowserprofile
              spec:
                configRef: ac4-cfg
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: BrowserProfile
              metadata:
                name: bedrockbrowserprofile-ac4-profile
                namespace: bedrockbrowserprofile
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac4-profile
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              set -eu
              OWNER_KIND=$(kubectl get browserprofile bedrockbrowserprofile-ac4-profile -n bedrockbrowserprofile -o json \
                | jq -r '.metadata.ownerReferences[0].kind')
              OWNER_NAME=$(kubectl get browserprofile bedrockbrowserprofile-ac4-profile -n bedrockbrowserprofile -o json \
                | jq -r '.metadata.ownerReferences[0].name')
              echo "owner kind: $OWNER_KIND, name: $OWNER_NAME"
              [ "$OWNER_KIND" = "BedrockBrowserProfile" ]
              [ "$OWNER_NAME" = "ac4-profile" ]

    # AC-5: deletionPolicy: delete.
    - name: ac5-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac5-cfg
                namespace: bedrockbrowserprofile
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac5-cfg -n bedrockbrowserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac5-profile
                namespace: bedrockbrowserprofile
              spec:
                configRef: ac5-cfg
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: BrowserProfile
              metadata:
                name: bedrockbrowserprofile-ac5-profile
                namespace: bedrockbrowserprofile
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-6: deletionPolicy: retain (default).
    - name: ac6-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac6-cfg
                namespace: bedrockbrowserprofile
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac6-cfg -n bedrockbrowserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac6-profile
                namespace: bedrockbrowserprofile
              spec:
                configRef: ac6-cfg
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: BrowserProfile
              metadata:
                name: bedrockbrowserprofile-ac6-profile
                namespace: bedrockbrowserprofile
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-7: default naming template {namespace}-{name}.
    - name: ac7-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac7-cfg
                namespace: bedrockbrowserprofile
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac7-cfg -n bedrockbrowserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac7-profile
                namespace: bedrockbrowserprofile
              spec:
                configRef: ac7-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac7-profile
                namespace: bedrockbrowserprofile
              status:
                resourceName: bedrockbrowserprofile-ac7-profile
                namingStatus: valid

    # AC-8: nameOverride bypasses the naming template.
    - name: ac8-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac8-cfg
                namespace: bedrockbrowserprofile
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac8-cfg -n bedrockbrowserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac8-profile
                namespace: bedrockbrowserprofile
              spec:
                configRef: ac8-cfg
                nameOverride: my-browser-profile
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac8-profile
                namespace: bedrockbrowserprofile
              status:
                resourceName: my-browser-profile
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: BrowserProfile
              metadata:
                name: my-browser-profile
                namespace: bedrockbrowserprofile
              spec:
                name: my-browser-profile

    # AC-9: description stored on ACK child.
    # ACK enforces immutability at the controller level; kro v0.9.2 discards x-kubernetes-validations.
    - name: ac9-immutable-description
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac9-cfg
                namespace: bedrockbrowserprofile
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac9-cfg -n bedrockbrowserprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowserProfile
              metadata:
                name: ac9-profile
                namespace: bedrockbrowserprofile
              spec:
                configRef: ac9-cfg
                description: "Immutable description"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: BrowserProfile
              metadata:
                name: bedrockbrowserprofile-ac9-profile
                namespace: bedrockbrowserprofile
              spec:
                description: "Immutable description"
