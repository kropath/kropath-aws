# BedrockHarnessEndpoint Chainsaw tests.
# Canonical pattern: skipDelete + unique resource name per step; no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockharnessendpoint
spec:
  skipDelete: true
  namespace: bedrockharnessendpoint
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: BedrockHarnessEndpoint with harnessID set directly creates ACK HarnessEndpoint
    # with spec.name = effectiveName and spec.harnessID = provided value.
    - name: ac1-basic-create-with-harnessid
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac1-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac1-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac1-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac1-cfg
                harnessID: "harness-abc123"
                targetVersion: "1"
                description: "Test endpoint"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac1-endpoint
                namespace: bedrockharnessendpoint
              status:
                resourceName: bedrockharnessendpoint-ac1-endpoint
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: HarnessEndpoint
              metadata:
                name: bedrockharnessendpoint-ac1-endpoint
                namespace: bedrockharnessendpoint
              spec:
                name: bedrockharnessendpoint-ac1-endpoint
                harnessID: "harness-abc123"
                targetVersion: "1"
                description: "Test endpoint"

    # AC-2: mutual exclusion ConfigMap created when both harnessID and harnessRef are set.
    - name: ac2-mutual-exclusion-harness-error
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac2-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac2-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac2-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac2-cfg
                harnessID: "harness-abc123"
                harnessRef: some-harness
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac2-endpoint-harness-exclusion-error
                namespace: bedrockharnessendpoint
              data:
                error: "harnessID and harnessRef are mutually exclusive — set exactly one"

    # AC-3: nameOverride sets the ACK HarnessEndpoint spec.name.
    - name: ac3-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac3-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac3-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac3-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac3-cfg
                nameOverride: my-custom-endpoint
                harnessID: "harness-xyz999"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac3-endpoint
                namespace: bedrockharnessendpoint
              status:
                resourceName: my-custom-endpoint
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: HarnessEndpoint
              metadata:
                name: my-custom-endpoint
                namespace: bedrockharnessendpoint
              spec:
                name: my-custom-endpoint
                harnessID: "harness-xyz999"

    # AC-4: tags merge (mandatory > spec > defaults).
    - name: ac4-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac4-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  tags:
                    env: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: platform
        - script:
            content: |
              kubectl patch bedrockconfig ac4-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"env":"production"},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{"team":"platform"},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac4-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac4-cfg
                harnessID: "harness-tag-test"
                tags:
                  owner: squad-ml
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: HarnessEndpoint
              metadata:
                name: bedrockharnessendpoint-ac4-endpoint
                namespace: bedrockharnessendpoint
        - script:
            content: |
              set -euo pipefail
              TAGS=$(kubectl get harnessendpoint bedrockharnessendpoint-ac4-endpoint -n bedrockharnessendpoint -o json \
                | jq -r '.spec.tags | to_entries | map(.key + "=" + .value) | sort | join(",")')
              echo "tags: $TAGS"
              echo "$TAGS" | grep -q "env=production"
              echo "$TAGS" | grep -q "owner=squad-ml"
              echo "$TAGS" | grep -q "team=platform"

    # AC-5: harnessRef cross-family resolution — resolvedHarnessId populated from ACK Harness.
    # Seed an ACK Harness directly (as if created by BedrockHarness RGD) then reference it.
    - name: ac5-harnessref-cross-family
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac5-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac5-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: ac5-parent-harness
                namespace: bedrockharnessendpoint
                labels:
                  app.kubernetes.io/instance: ac5-parent-harness
              spec:
                harnessName: ac5-parent-harness
                executionRoleARN: "arn:aws:iam::123456789012:role/harness-role"
        - script:
            content: |
              kubectl patch harness ac5-parent-harness -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"harnessID":"harness-resolved-001"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac5-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac5-cfg
                harnessRef: ac5-parent-harness
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: HarnessEndpoint
              metadata:
                name: bedrockharnessendpoint-ac5-endpoint
                namespace: bedrockharnessendpoint
              spec:
                harnessID: "harness-resolved-001"

    # AC-1 (spec, harnessRef path): BedrockHarnessEndpoint with harnessRef resolves harness ID
    # from ACK Harness child (seeded directly as if created by BedrockHarness RGD).
    - name: ac6-creation-with-harnessref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac6-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac6-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: ac6-parent-harness
                namespace: bedrockharnessendpoint
                labels:
                  app.kubernetes.io/instance: ac6-parent-harness
              spec:
                harnessName: ac6-parent-harness
                executionRoleARN: "arn:aws:iam::123456789012:role/harness-role"
        - script:
            content: |
              kubectl patch harness ac6-parent-harness -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"harnessID":"harness-ref-001"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac6-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac6-cfg
                harnessRef: ac6-parent-harness
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: HarnessEndpoint
              metadata:
                name: bedrockharnessendpoint-ac6-endpoint
                namespace: bedrockharnessendpoint
              spec:
                harnessID: "harness-ref-001"

    # AC-3 (spec): spec.targetVersion propagated to ACK HarnessEndpoint.
    - name: ac7-target-version
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac7-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac7-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: ac7-parent-harness
                namespace: bedrockharnessendpoint
                labels:
                  app.kubernetes.io/instance: ac7-parent-harness
              spec:
                harnessName: ac7-parent-harness
                executionRoleARN: "arn:aws:iam::123456789012:role/harness-role"
        - script:
            content: |
              kubectl patch harness ac7-parent-harness -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"harnessID":"harness-tv-001"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac7-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac7-cfg
                harnessRef: ac7-parent-harness
                targetVersion: "3"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: HarnessEndpoint
              metadata:
                name: bedrockharnessendpoint-ac7-endpoint
                namespace: bedrockharnessendpoint
              spec:
                targetVersion: "3"

    # AC-4 (spec): omitting spec.targetVersion routes endpoint to latest version.
    - name: ac8-latest-version-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac8-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac8-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: ac8-parent-harness
                namespace: bedrockharnessendpoint
                labels:
                  app.kubernetes.io/instance: ac8-parent-harness
              spec:
                harnessName: ac8-parent-harness
                executionRoleARN: "arn:aws:iam::123456789012:role/harness-role"
        - script:
            content: |
              kubectl patch harness ac8-parent-harness -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"harnessID":"harness-latest-001"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac8-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac8-cfg
                harnessRef: ac8-parent-harness
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: HarnessEndpoint
              metadata:
                name: bedrockharnessendpoint-ac8-endpoint
                namespace: bedrockharnessendpoint
              spec:
                harnessID: "harness-latest-001"
        - script:
            content: |
              set -euo pipefail
              TV=$(kubectl get harnessendpoint bedrockharnessendpoint-ac8-endpoint \
                -n bedrockharnessendpoint -o jsonpath='{.spec.targetVersion}')
              echo "targetVersion: '$TV'"
              # targetVersion should be empty or "DRAFT" when not explicitly set
              [ -z "$TV" ] || [ "$TV" = "DRAFT" ]

    # AC-6 (spec): syncedLabels propagated to ACK HarnessEndpoint metadata.labels with prefix.
    - name: ac9-syncedlabels-propagation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac9-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac9-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"environment":"production"},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac9-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac9-cfg
                harnessID: "harness-sl-001"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: HarnessEndpoint
              metadata:
                name: bedrockharnessendpoint-ac9-endpoint
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/environment: production

    # AC-7 (spec): Standard metadata labels, annotations, and ownerReferences on ACK HarnessEndpoint.
    - name: ac10-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac10-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac10-cfg -n bedrockharnessendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarnessEndpoint
              metadata:
                name: ac10-endpoint
                namespace: bedrockharnessendpoint
              spec:
                configRef: ac10-cfg
                harnessID: "harness-meta-001"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: HarnessEndpoint
              metadata:
                name: bedrockharnessendpoint-ac10-endpoint
                namespace: bedrockharnessendpoint
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac10-endpoint
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              set -euo pipefail
              OWNER=$(kubectl get harnessendpoint bedrockharnessendpoint-ac10-endpoint \
                -n bedrockharnessendpoint -o json \
                | jq -r '.metadata.ownerReferences[0].name')
              echo "ownerRef name: $OWNER"
              [ "$OWNER" = "ac10-endpoint" ]

    # AC-8 (spec): spec.deletionPolicy: "delete" propagated to ACK HarnessEndpoint annotation.
    - name: ac11-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac11-cfg
                namespace: bedrockharnessendpoint
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
