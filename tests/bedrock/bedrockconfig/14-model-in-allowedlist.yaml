---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: model-in-allowedlist
  namespace: bedrockconfig
  labels:
    aws.kropath.run/resource-name: model-in-allowedlist
spec:
  mandatory:
    foundationModel: "anthropic.claude-3-5-sonnet-20241022-v2:0"
    guardrailIdentifier: ""
    guardrailVersion: ""
    allowedModels:
      - "anthropic.claude-3-5-sonnet-20241022-v2:0"
      - "amazon.titan-text-premier-v1:0"
    maxIterations: 0
    maxTokens: 0
    timeoutSeconds: 0
    idleSessionTTLInSeconds: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    foundationModel: ""
    guardrailIdentifier: ""
    guardrailVersion: ""
    allowedModels: []
    maxIterations: 0
    maxTokens: 0
    timeoutSeconds: 0
    idleSessionTTLInSeconds: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
