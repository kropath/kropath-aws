---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: production
  namespace: bedrockconfig
  labels:
    aws.kropath.run/resource-name: production
spec:
  mandatory:
    guardrailIdentifier: "grail-production-001"
    guardrailVersion: "1"
    allowedModels:
      - "anthropic.claude-3-5-sonnet-20241022-v2:0"
      - "anthropic.claude-3-haiku-20240307-v1:0"
    maxIterations: 100
    maxTokens: 100000
    timeoutSeconds: 300
  defaults:
    namingTemplate: "{namespace}-{name}"
