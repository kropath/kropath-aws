metadata:
  name: model-not-in-allowedlist
  namespace: bedrockconfig
  labels:
    aws.kropath.run/resource-name: model-not-in-allowedlist
spec:
  mandatory:
    foundationModel: "anthropic.claude-v2"
    allowedModels:
      - "anthropic.claude-3-sonnet"
  defaults:
    namingTemplate: "{namespace}-{name}"
