---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: model-not-in-allowedlist
  namespace: bedrockconfig
  labels:
    aws.kropath.run/resource-name: model-not-in-allowedlist
spec:
  mandatory:
    foundationModel: "anthropic.claude-v2"
    guardrailIdentifier: ""
    guardrailVersion: ""
    allowedModels:
      - "anthropic.claude-3-sonnet"
    maxIterations: 0
    maxTokens: 0
    timeoutSeconds: 0
    idleSessionTTLInSeconds: 0
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    foundationModel: ""
    guardrailIdentifier: ""
    guardrailVersion: ""
    allowedModels: []
    maxIterations: 0
    maxTokens: 0
    timeoutSeconds: 0
    idleSessionTTLInSeconds: 0
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
