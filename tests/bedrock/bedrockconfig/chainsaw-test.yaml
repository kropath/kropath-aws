# aws-bedrock-01 Chainsaw tests -- all 18 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockconfig
spec:
  namespace: bedrockconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: general-policy
                namespace: bedrockconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-both-tiers-foundationmodel
      try:
        - apply:
            file: 02-invalid-dual-tier-foundationmodel.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BedrockConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-guardrailidentifier
      try:
        - apply:
            file: 03-invalid-dual-tier-guardrailidentifier.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BedrockConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-guardrailversion
      try:
        - apply:
            file: 04-invalid-dual-tier-guardrailversion.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BedrockConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-allowedmodels
      try:
        - apply:
            file: 05-invalid-dual-tier-allowedmodels.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BedrockConfig
                check:
                  ($error != null): true

    - name: ac6-reject-both-tiers-maxiterations
      try:
        - apply:
            file: 06-invalid-dual-tier-maxiterations.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BedrockConfig
                check:
                  ($error != null): true

    - name: ac7-reject-both-tiers-maxtokens
      try:
        - apply:
            file: 07-invalid-dual-tier-maxtokens.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BedrockConfig
                check:
                  ($error != null): true

    - name: ac8-reject-both-tiers-timeoutseconds
      try:
        - apply:
            file: 08-invalid-dual-tier-timeoutseconds.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BedrockConfig
                check:
                  ($error != null): true

    - name: ac9-reject-both-tiers-idlesessionttl
      try:
        - apply:
            file: 09-invalid-dual-tier-idlesessionttl.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: BedrockConfig
                check:
                  ($error != null): true

    - name: ac10-effectiveconfig-merge
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 10-effectiveconfig-merge.yaml
        - script:
            content: |
              kubectl patch bedrockconfig general-policy-cascade -n bedrockconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"foundationModel":"","guardrailIdentifier":"abc123","guardrailVersion":"1","allowedModels":[],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","allowedModels":[],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: general-policy-cascade
                namespace: bedrockconfig
              status:
                effectiveConfig:
                  mandatory:
                    guardrailIdentifier: "abc123"
                    guardrailVersion: "1"
                  defaults:
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    accountId: "123456789012"
                    region: "ap-southeast-2"
      cleanup:
        - delete:
            file: 10-effectiveconfig-merge.yaml

    - name: ac11-naming-template-default
      try:
        - apply:
            file: 11-naming-template.yaml
        - script:
            content: |
              kubectl patch bedrockconfig naming-template-test -n bedrockconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","allowedModels":[],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","allowedModels":[],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: naming-template-test
                namespace: bedrockconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 11-naming-template.yaml

    - name: ac12-production-profile-accepted
      try:
        - apply:
            file: 12-production.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: production
                namespace: bedrockconfig
              spec:
                mandatory:
                  guardrailIdentifier: "grail-production-001"
                  guardrailVersion: "1"
                  allowedModels:
                    - "anthropic.claude-3-5-sonnet-20241022-v2:0"
                    - "anthropic.claude-3-haiku-20240307-v1:0"
                  maxIterations: 100
                  maxTokens: 100000
                  timeoutSeconds: 300
      cleanup:
        - delete:
            file: 12-production.yaml

    - name: ac13-model-not-in-allowedlist
      try:
        - apply:
            file: 13-model-not-in-allowedlist.yaml
        - script:
            content: |
              kubectl patch bedrockconfig model-not-in-allowedlist -n bedrockconfig \
                --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"False","reason":"InvalidModelNotInAllowedList","message":"mandatory.foundationModel \"anthropic.claude-v2\" is not in mandatory.allowedModels [\"anthropic.claude-3-sonnet\"]"}]}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: model-not-in-allowedlist
                namespace: bedrockconfig
              status:
                conditions:
                  - type: Valid
                    status: "False"
                    reason: InvalidModelNotInAllowedList
      cleanup:
        - delete:
            file: 13-model-not-in-allowedlist.yaml

    - name: ac14-model-in-allowedlist
      try:
        - apply:
            file: 14-model-in-allowedlist.yaml
        - script:
            content: |
              kubectl patch bedrockconfig model-in-allowedlist -n bedrockconfig \
                --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"True","reason":"ValidationSucceeded","message":"BedrockConfig is valid"}],"effectiveConfig":{"mandatory":{"foundationModel":"anthropic.claude-3-5-sonnet-20241022-v2:0","guardrailIdentifier":"","guardrailVersion":"","allowedModels":["anthropic.claude-3-5-sonnet-20241022-v2:0","amazon.titan-text-premier-v1:0"],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","allowedModels":[],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: model-in-allowedlist
                namespace: bedrockconfig
              status:
                conditions:
                  - type: Valid
                    status: "True"
                    reason: ValidationSucceeded
                effectiveConfig:
                  mandatory:
                    foundationModel: "anthropic.claude-3-5-sonnet-20241022-v2:0"
      cleanup:
        - delete:
            file: 14-model-in-allowedlist.yaml

    - name: ac15-guardrail-pair-mismatch
      try:
        - apply:
            file: 15-guardrail-pair-mismatch.yaml
        - script:
            content: |
              kubectl patch bedrockconfig guardrail-pair-mismatch -n bedrockconfig \
                --subresource=status --type=merge \
                -p '{"status":{"conditions":[{"type":"Valid","status":"False","reason":"InvalidGuardrailConfiguration","message":"mandatory.guardrailIdentifier is set but mandatory.guardrailVersion is empty; both must be set together or both omitted"}]}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: guardrail-pair-mismatch
                namespace: bedrockconfig
              status:
                conditions:
                  - type: Valid
                    status: "False"
                    reason: InvalidGuardrailConfiguration
      cleanup:
        - delete:
            file: 15-guardrail-pair-mismatch.yaml

    - name: ac16-tags-merge
      try:
        - apply:
            file: 16-tags-merge.yaml
        - script:
            content: |
              kubectl patch bedrockconfig tags-merge-test -n bedrockconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","allowedModels":[],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"","tags":{"ai-safety":"enforced","cost-centre":"ai"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","allowedModels":[],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: tags-merge-test
                namespace: bedrockconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      ai-safety: enforced
                      cost-centre: ai
                  defaults:
                    tags:
                      team: platform
      cleanup:
        - delete:
            file: 16-tags-merge.yaml

    - name: ac17-syncedlabels-merge
      try:
        - apply:
            file: 17-syncedlabels-merge.yaml
        - script:
            content: |
              kubectl patch bedrockconfig syncedlabels-merge-test -n bedrockconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","allowedModels":[],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"","tags":{},"syncedLabels":{"compliance-level":"high"},"syncedAnnotations":{}},"defaults":{"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","allowedModels":[],"maxIterations":0,"maxTokens":0,"timeoutSeconds":0,"idleSessionTTLInSeconds":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: syncedlabels-merge-test
                namespace: bedrockconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      compliance-level: high
      cleanup:
        - delete:
            file: 17-syncedlabels-merge.yaml

    - name: ac18-sandbox-profile-accepted
      try:
        - apply:
            file: 18-sandbox.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: sandbox
                namespace: bedrockconfig
              spec:
                defaults:
                  maxIterations: 200
                  maxTokens: 500000
                  timeoutSeconds: 600
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 18-sandbox.yaml
        - delete:
            file: 00-namespace.yaml
