# BedrockMemory Chainsaw tests.
# Canonical pattern: skipDelete + unique resource name per step; no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockmemory
spec:
  skipDelete: true
  namespace: bedrockmemory
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1/AC-6/AC-8: create memory with defaults; standard K8s metadata; deletion-policy retain.
    - name: ac1-create-memory-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac1-cfg
                namespace: bedrockmemory
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac1-cfg -n bedrockmemory \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac1-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                eventExpiryDuration: 86400
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac1-memory
                namespace: bedrockmemory
              status:
                resourceName: bedrockmemory-ac1-memory
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Memory
              metadata:
                name: bedrockmemory-ac1-memory
                namespace: bedrockmemory
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-memory
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                eventExpiryDuration: 86400

    # AC-2: memory with strategies.
    - name: ac2-create-memory-with-strategies
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac2-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                eventExpiryDuration: 604800
                description: "Agent conversation memory"
                memoryStrategies:
                  - episodicMemoryStrategy:
                      name: "recent-conversations"
                      description: "Track recent agent conversations"
                      namespaces:
                        - "user-sessions"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Memory
              metadata:
                name: bedrockmemory-ac2-memory
                namespace: bedrockmemory
        - script:
            content: |
              set -e
              SPEC=$(kubectl get memory bedrockmemory-ac2-memory -n bedrockmemory -o json | jq '.spec')
              echo "$SPEC" | jq -e '.eventExpiryDuration == 604800'
              echo "$SPEC" | jq -e '.description == "Agent conversation memory"'
              echo "$SPEC" | jq -e '.memoryStrategies | length > 0'

    # AC-3: memory with encryption key and execution role.
    - name: ac3-create-memory-encrypted
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac3-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                eventExpiryDuration: 2592000
                encryptionKeyArn: "arn:aws:kms:us-east-1:123456789012:key/abc123"
                memoryExecutionRoleArn: "arn:aws:iam::123456789012:role/memory-role"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Memory
              metadata:
                name: bedrockmemory-ac3-memory
                namespace: bedrockmemory
        - script:
            content: |
              set -e
              SPEC=$(kubectl get memory bedrockmemory-ac3-memory -n bedrockmemory -o json | jq '.spec')
              echo "$SPEC" | jq -e '.encryptionKeyARN == "arn:aws:kms:us-east-1:123456789012:key/abc123"'
              echo "$SPEC" | jq -e '.memoryExecutionRoleARN == "arn:aws:iam::123456789012:role/memory-role"'

    # AC-4: three-tier tags merge.
    - name: ac4-tags-merge-three-tiers
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac4-cfg
                namespace: bedrockmemory
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac4-cfg -n bedrockmemory \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"cost-centre":"ai-platform","env":"prod"}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{"managed-by":"kropath","env":"dev"}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac4-memory
                namespace: bedrockmemory
              spec:
                configRef: ac4-cfg
                eventExpiryDuration: 86400
                tags:
                  app: agent-memory
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Memory
              metadata:
                name: bedrockmemory-ac4-memory
                namespace: bedrockmemory
        - script:
            content: |
              set -e
              TAGS=$(kubectl get memory bedrockmemory-ac4-memory -n bedrockmemory -o json | jq '.spec.tags')
              echo "$TAGS" | jq -e '.["cost-centre"] == "ai-platform"'
              echo "$TAGS" | jq -e '.app == "agent-memory"'
              echo "$TAGS" | jq -e '.["managed-by"] == "kropath"'
              echo "$TAGS" | jq -e '.env == "prod"'

    # AC-7: deletion-policy delete.
    - name: ac7-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac7-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                deletionPolicy: "delete"
                eventExpiryDuration: 86400
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Memory
              metadata:
                name: bedrockmemory-ac7-memory
                namespace: bedrockmemory
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-9/AC-10/AC-11: naming.
    - name: ac9-naming-template-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac9-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                eventExpiryDuration: 86400
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac9-memory
                namespace: bedrockmemory
              status:
                resourceName: bedrockmemory-ac9-memory
                namingStatus: valid

    - name: ac10-naming-template-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac10-cfg
                namespace: bedrockmemory
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  namingTemplate: "corp-{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac10-cfg -n bedrockmemory \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"corp-{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac10-memory
                namespace: bedrockmemory
              spec:
                configRef: ac10-cfg
                eventExpiryDuration: 86400
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac10-memory
                namespace: bedrockmemory
              status:
                resourceName: corp-bedrockmemory-ac10-memory
                namingStatus: valid

    - name: ac11-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac11-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                nameOverride: "shared-memory"
                eventExpiryDuration: 86400
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac11-memory
                namespace: bedrockmemory
              status:
                resourceName: shared-memory
                namingStatus: valid

    # AC-12: unresolved naming token.
    - name: ac12-naming-unresolved-tokens
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac12-cfg
                namespace: bedrockmemory
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.env}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac12-cfg -n bedrockmemory \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"namingTemplate":"{tag.env}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac12-memory
                namespace: bedrockmemory
              spec:
                configRef: ac12-cfg
                eventExpiryDuration: 86400
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac12-memory
                namespace: bedrockmemory
              status:
                namingStatus: invalid-unresolved-tokens

    # AC-16: encryptionKeyArn + encryptionKeyRef mutual exclusivity.
    - name: ac16-encryption-key-mutual-exclusivity
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac16-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                eventExpiryDuration: 86400
                encryptionKeyArn: "arn:aws:kms:us-east-1:123456789012:key/abc"
                encryptionKeyRef: "my-key"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac16-memory-encryption-exclusion-error
                namespace: bedrockmemory

    # AC-17: memoryExecutionRoleArn + memoryExecutionRoleRef mutual exclusivity.
    - name: ac17-execution-role-mutual-exclusivity
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac17-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                eventExpiryDuration: 86400
                memoryExecutionRoleArn: "arn:aws:iam::123456789012:role/role"
                memoryExecutionRoleRef: "my-role"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac17-memory-role-exclusion-error
                namespace: bedrockmemory

    # AC-20: optional fields absent.
    - name: ac20-optional-fields-absent
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac20-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                eventExpiryDuration: 86400
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Memory
              metadata:
                name: bedrockmemory-ac20-memory
                namespace: bedrockmemory
        - script:
            content: |
              set -e
              SPEC=$(kubectl get memory bedrockmemory-ac20-memory -n bedrockmemory -o json | jq '.spec')
              if echo "$SPEC" | jq -e '.description != null and .description != ""' > /dev/null 2>&1; then echo "FAIL: description present"; exit 1; fi
              if echo "$SPEC" | jq -e '.encryptionKeyARN != null and .encryptionKeyARN != ""' > /dev/null 2>&1; then echo "FAIL: encryptionKeyARN present"; exit 1; fi
              if echo "$SPEC" | jq -e '.memoryStrategies != null' > /dev/null 2>&1; then echo "FAIL: memoryStrategies present"; exit 1; fi
              echo "PASS: optional fields absent"

    # AC-21: optional fields present.
    - name: ac21-optional-fields-present
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac21-memory
                namespace: bedrockmemory
              spec:
                configRef: ac1-cfg
                eventExpiryDuration: 86400
                description: "Conversation memory"
                memoryStrategies:
                  - summaryMemoryStrategy:
                      name: "session-summary"
                      description: "Summarize sessions"
                streamDeliveryResources:
                  resources:
                    - kinesis:
                        dataStreamARN: "arn:aws:kinesis:us-east-1:123456789012:stream/my-stream"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Memory
              metadata:
                name: bedrockmemory-ac21-memory
                namespace: bedrockmemory
        - script:
            content: |
              set -e
              SPEC=$(kubectl get memory bedrockmemory-ac21-memory -n bedrockmemory -o json | jq '.spec')
              echo "$SPEC" | jq -e '.description == "Conversation memory"'
              echo "$SPEC" | jq -e '.memoryStrategies | length > 0'

    # AC-22: syncedLabels propagated.
    - name: ac22-synced-labels-propagated
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac22-cfg
                namespace: bedrockmemory
                labels:
                  aws.kropath.run/resource-name: ac22-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
        - script:
            content: |
              kubectl patch bedrockconfig ac22-cfg -n bedrockmemory \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"environment":"production"},"tags":{}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockMemory
              metadata:
                name: ac22-memory
                namespace: bedrockmemory
              spec:
                configRef: ac22-cfg
                eventExpiryDuration: 86400
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Memory
              metadata:
                name: bedrockmemory-ac22-memory
                namespace: bedrockmemory
        - script:
            content: |
              set -e
              kubectl get memory bedrockmemory-ac22-memory -n bedrockmemory -o json | jq -e '.metadata.labels["aws.kropath.run/environment"] == "production"'
              kubectl get memory bedrockmemory-ac22-memory -n bedrockmemory -o json | jq -e '.spec.tags.environment == "production"'
