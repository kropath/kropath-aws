# BedrockInferenceProfile Chainsaw tests.
# Canonical pattern: skipDelete + unique resource name per step; no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockinferenceprofile
spec:
  skipDelete: true
  namespace: bedrockinferenceprofile
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: BedrockInferenceProfile with modelSource.copyFrom creates ACK InferenceProfile;
    # status.resourceName follows {namespace}-{name} default template.
    - name: ac1-basic-create-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac1-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac1-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac1-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac1-cfg
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac1-profile
                namespace: bedrockinferenceprofile
              status:
                resourceName: bedrockinferenceprofile-ac1-profile
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrock.services.k8s.aws/v1alpha1
              kind: InferenceProfile
              metadata:
                name: bedrockinferenceprofile-ac1-profile
                namespace: bedrockinferenceprofile
              spec:
                inferenceProfileName: bedrockinferenceprofile-ac1-profile
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"

    # AC-2: nameOverride takes precedence over naming template.
    - name: ac2-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac2-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac2-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac2-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac2-cfg
                nameOverride: my-custom-profile
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac2-profile
                namespace: bedrockinferenceprofile
              status:
                resourceName: my-custom-profile
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrock.services.k8s.aws/v1alpha1
              kind: InferenceProfile
              metadata:
                name: my-custom-profile
                namespace: bedrockinferenceprofile
              spec:
                inferenceProfileName: my-custom-profile

    # AC-3: mandatory naming template overrides defaults.
    - name: ac3-mandatory-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac3-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  namingTemplate: "prod-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac3-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"prod-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac3-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac3-cfg
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac3-profile
                namespace: bedrockinferenceprofile
              status:
                resourceName: prod-ac3-profile
                namingStatus: valid

    # AC-4: tags merge — mandatory > spec > defaults.
    # Use script-based assertion for tag arrays (order not guaranteed).
    - name: ac4-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac4-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  tags:
                    env: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: platform
        - script:
            content: |
              kubectl patch bedrockconfig ac4-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"env":"production"},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{"team":"platform"},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac4-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac4-cfg
                tags:
                  owner: squad-ml
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
        - assert:
            resource:
              apiVersion: bedrock.services.k8s.aws/v1alpha1
              kind: InferenceProfile
              metadata:
                name: bedrockinferenceprofile-ac4-profile
                namespace: bedrockinferenceprofile
        - script:
            content: |
              set -eu
              TAGS=$(kubectl get inferenceprofile bedrockinferenceprofile-ac4-profile -n bedrockinferenceprofile -o json \
                | jq -r '.spec.tags | map(.key + "=" + .value) | sort | join(",")')
              echo "tags: $TAGS"
              echo "$TAGS" | grep -q "env=production"
              echo "$TAGS" | grep -q "owner=squad-ml"
              echo "$TAGS" | grep -q "team=platform"

    # AC-3 spec (syncedlabels-propagation): mandatory.syncedLabels flow to ACK InferenceProfile
    # metadata.labels (prefixed aws.kropath.run/) and spec.tags.
    - name: ac5-syncedlabels-propagation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac5-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac5-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"environment":"production"},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac5-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac5-cfg
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
        - assert:
            resource:
              apiVersion: bedrock.services.k8s.aws/v1alpha1
              kind: InferenceProfile
              metadata:
                name: bedrockinferenceprofile-ac5-profile
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/environment: production
        - script:
            content: |
              set -eu
              TAGS=$(kubectl get inferenceprofile bedrockinferenceprofile-ac5-profile -n bedrockinferenceprofile -o json \
                | jq -r '.spec.tags | map(.key + "=" + .value) | sort | join(",")')
              echo "tags: $TAGS"
              echo "$TAGS" | grep -q "environment=production"

    # AC-4 spec (standard-metadata): ACK InferenceProfile child has app.kubernetes.io/managed-by: kro,
    # app.kubernetes.io/instance: <cr-name>, deletion-policy annotation (default retain),
    # and ownerReferences back to the BedrockInferenceProfile CR.
    - name: ac6-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac6-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac6-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac6-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac6-cfg
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
        - assert:
            resource:
              apiVersion: bedrock.services.k8s.aws/v1alpha1
              kind: InferenceProfile
              metadata:
                name: bedrockinferenceprofile-ac6-profile
                namespace: bedrockinferenceprofile
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac6-profile
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              set -eu
              OWNER=$(kubectl get inferenceprofile bedrockinferenceprofile-ac6-profile -n bedrockinferenceprofile -o json \
                | jq -r '.metadata.ownerReferences // [] | map(select(.kind == "BedrockInferenceProfile" and .name == "ac6-profile")) | length')
              echo "ownerReferences pointing to BedrockInferenceProfile/ac6-profile: $OWNER"
              [ "$OWNER" -ge 1 ]

    # AC-5 spec (deletion-policy-delete): spec.deletionPolicy: "delete" propagates to ACK annotation.
    - name: ac7-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac7-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac7-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac7-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac7-cfg
                deletionPolicy: "delete"
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
        - assert:
            resource:
              apiVersion: bedrock.services.k8s.aws/v1alpha1
              kind: InferenceProfile
              metadata:
                name: bedrockinferenceprofile-ac7-profile
                namespace: bedrockinferenceprofile
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-6 spec (deletion-policy-retain): spec.deletionPolicy: "retain" propagates to ACK annotation.
    - name: ac8-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac8-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac8-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac8-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac8-cfg
                deletionPolicy: "retain"
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
        - assert:
            resource:
              apiVersion: bedrock.services.k8s.aws/v1alpha1
              kind: InferenceProfile
              metadata:
                name: bedrockinferenceprofile-ac8-profile
                namespace: bedrockinferenceprofile
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-9 spec (naming-unresolved-tokens): namingTemplate referencing an absent tag token
    # yields status.namingStatus: invalid-unresolved-tokens.
    - name: ac9-naming-unresolved-tokens
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac9-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory:
                  namingTemplate: "{tag.env}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac9-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{tag.env}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac9-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac9-cfg
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac9-profile
                namespace: bedrockinferenceprofile
              status:
                namingStatus: invalid-unresolved-tokens

    # AC-11 spec (immutable-modelsource): updating spec.modelSource.copyFrom must be rejected.
    # kro drops x-kubernetes-validations from RGDs, so immutability is enforced by the rendered CRD.
    # This test verifies the CRD's CEL immutability rule by attempting a patch and expecting failure.
    - name: ac11-immutable-modelsource
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac11-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac11-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac11-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac11-cfg
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac11-profile
                namespace: bedrockinferenceprofile
              status:
                namingStatus: valid
        - script:
            content: |
              set -eu
              # Attempt to change the immutable modelSource.copyFrom; expect the API server to reject it.
              kubectl patch bedrockinferenceprofile ac11-profile -n bedrockinferenceprofile \
                --type=merge \
                -p '{"spec":{"modelSource":{"copyFrom":"arn:aws:bedrock:ap-southeast-2::foundation-model/different-model-v1:0"}}}' \
                && { echo "FAIL: expected immutability rejection but patch succeeded"; exit 1; } \
                || echo "OK: patch was rejected as expected"

    # AC-12 spec (immutable-description): updating spec.description must be rejected.
    # Same immutability enforcement via CRD CEL rules as AC-11.
    - name: ac12-immutable-description
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac12-cfg
                namespace: bedrockinferenceprofile
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac12-cfg -n bedrockinferenceprofile \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac12-profile
                namespace: bedrockinferenceprofile
              spec:
                configRef: ac12-cfg
                description: "Initial description"
                modelSource:
                  copyFrom: "arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockInferenceProfile
              metadata:
                name: ac12-profile
                namespace: bedrockinferenceprofile
              status:
                namingStatus: valid
        - script:
            content: |
              set -eu
              # Attempt to change the immutable description field; expect the API server to reject it.
              kubectl patch bedrockinferenceprofile ac12-profile -n bedrockinferenceprofile \
                --type=merge \
                -p '{"spec":{"description":"Updated description — should be rejected"}}' \
                && { echo "FAIL: expected immutability rejection but patch succeeded"; exit 1; } \
                || echo "OK: patch was rejected as expected"
