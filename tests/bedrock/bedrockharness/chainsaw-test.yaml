# BedrockHarness Chainsaw tests.
# Canonical pattern: skipDelete + unique resource name per step; no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockharness
spec:
  skipDelete: true
  namespace: bedrockharness
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: BedrockHarness with executionRoleArn creates ACK Harness with harnessName = effectiveName.
    - name: ac1-basic-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac1-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac1-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac1-harness
                namespace: bedrockharness
              spec:
                configRef: ac1-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac1-harness
                namespace: bedrockharness
              status:
                resourceName: bedrockharness-ac1-harness
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac1-harness
                namespace: bedrockharness
              spec:
                harnessName: bedrockharness-ac1-harness
                executionRoleARN: "arn:aws:iam::123456789012:role/harness-role"

    # AC-2: maxIterations governance cascade — mandatory wins over spec.
    - name: ac2-maxiterations-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac2-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  maxIterations: 200
                  maxTokens: 50000
                  timeoutSeconds: 600
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac2-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":200,"maxTokens":50000,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":600},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac2-harness
                namespace: bedrockharness
              spec:
                configRef: ac2-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                maxIterations: 10
                maxTokens: 1000
                timeoutSeconds: 30
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac2-harness
                namespace: bedrockharness
              spec:
                maxIterations: 200
                maxTokens: 50000
                timeoutSeconds: 600

    # AC-3: spec values used when mandatory is 0 and defaults is 0.
    - name: ac3-spec-values-fallback
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac3-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac3-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac3-harness
                namespace: bedrockharness
              spec:
                configRef: ac3-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                maxIterations: 75
                maxTokens: 25000
                timeoutSeconds: 120
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac3-harness
                namespace: bedrockharness
              spec:
                maxIterations: 75
                maxTokens: 25000
                timeoutSeconds: 120

    # AC-4: mutual exclusion ConfigMap created when both executionRoleArn and executionRoleRef set.
    - name: ac4-mutual-exclusion-role-error
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac4-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac4-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac4-harness
                namespace: bedrockharness
              spec:
                configRef: ac4-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                executionRoleRef: some-iam-role
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac4-harness-role-exclusion-error
                namespace: bedrockharness
              data:
                error: "executionRoleArn and executionRoleRef are mutually exclusive — set exactly one"

    # AC-5: tags merge (mandatory > spec > defaults).
    - name: ac5-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac5-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  tags:
                    env: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: platform
        - script:
            content: |
              kubectl patch bedrockconfig ac5-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"env":"production"},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{"team":"platform"},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac5-harness
                namespace: bedrockharness
              spec:
                configRef: ac5-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                tags:
                  owner: squad-ml
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac5-harness
                namespace: bedrockharness
        - script:
            content: |
              set -euo pipefail
              TAGS=$(kubectl get harness bedrockharness-ac5-harness -n bedrockharness -o json \
                | jq -r '.spec.tags | to_entries | map(.key + "=" + .value) | sort | join(",")')
              echo "tags: $TAGS"
              echo "$TAGS" | grep -q "env=production"
              echo "$TAGS" | grep -q "owner=squad-ml"
              echo "$TAGS" | grep -q "team=platform"
