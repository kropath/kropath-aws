# BedrockHarness Chainsaw tests.
# Canonical pattern: skipDelete + unique resource name per step; no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockharness
spec:
  skipDelete: true
  namespace: bedrockharness
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: BedrockHarness with executionRoleArn creates ACK Harness with harnessName = effectiveName.
    - name: ac1-basic-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac1-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac1-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac1-harness
                namespace: bedrockharness
              spec:
                configRef: ac1-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac1-harness
                namespace: bedrockharness
              status:
                resourceName: bedrockharness-ac1-harness
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac1-harness
                namespace: bedrockharness
              spec:
                harnessName: bedrockharness-ac1-harness
                executionRoleARN: "arn:aws:iam::123456789012:role/harness-role"

    # AC-2: maxIterations governance cascade — mandatory wins over spec.
    - name: ac2-maxiterations-mandatory-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac2-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  maxIterations: 200
                  maxTokens: 50000
                  timeoutSeconds: 600
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac2-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":200,"maxTokens":50000,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":600},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac2-harness
                namespace: bedrockharness
              spec:
                configRef: ac2-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                maxIterations: 10
                maxTokens: 1000
                timeoutSeconds: 30
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac2-harness
                namespace: bedrockharness
              spec:
                maxIterations: 200
                maxTokens: 50000
                timeoutSeconds: 600

    # AC-3: spec values used when mandatory is 0 and defaults is 0.
    - name: ac3-spec-values-fallback
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac3-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac3-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac3-harness
                namespace: bedrockharness
              spec:
                configRef: ac3-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                maxIterations: 75
                maxTokens: 25000
                timeoutSeconds: 120
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac3-harness
                namespace: bedrockharness
              spec:
                maxIterations: 75
                maxTokens: 25000
                timeoutSeconds: 120

    # AC-4: mutual exclusion ConfigMap created when both executionRoleArn and executionRoleRef set.
    - name: ac4-mutual-exclusion-role-error
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac4-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac4-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac4-harness
                namespace: bedrockharness
              spec:
                configRef: ac4-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                executionRoleRef: some-iam-role
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac4-harness-role-exclusion-error
                namespace: bedrockharness
              data:
                error: "executionRoleArn and executionRoleRef are mutually exclusive — set exactly one"

    # AC-5: tags merge (mandatory > spec > defaults).
    - name: ac5-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac5-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory:
                  tags:
                    env: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: platform
        - script:
            content: |
              kubectl patch bedrockconfig ac5-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{"env":"production"},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{"team":"platform"},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac5-harness
                namespace: bedrockharness
              spec:
                configRef: ac5-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                tags:
                  owner: squad-ml
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac5-harness
                namespace: bedrockharness
        - script:
            content: |
              set -eu
              TAGS=$(kubectl get harness bedrockharness-ac5-harness -n bedrockharness -o json \
                | jq -r '.spec.tags | to_entries | map(.key + "=" + .value) | sort | join(",")')
              echo "tags: $TAGS"
              echo "$TAGS" | grep -q "env=production"
              echo "$TAGS" | grep -q "owner=squad-ml"
              echo "$TAGS" | grep -q "team=platform"

    # AC-4 (spec): mandatory.maxTokens wins over spec.maxTokens.
    - name: ac6-mandatory-maxtokens-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac6-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory:
                  maxTokens: 50000
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac6-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":50000,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac6-harness
                namespace: bedrockharness
              spec:
                configRef: ac6-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                maxTokens: 200000
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac6-harness
                namespace: bedrockharness
              spec:
                maxTokens: 50000

    # AC-5 (spec): defaults.maxTokens applied when spec.maxTokens is 0.
    - name: ac7-defaults-maxtokens-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac7-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  maxTokens: 100000
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac7-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":100000,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac7-harness
                namespace: bedrockharness
              spec:
                configRef: ac7-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac7-harness
                namespace: bedrockharness
              spec:
                maxTokens: 100000

    # AC-6 (spec): mandatory.timeoutSeconds wins over spec.timeoutSeconds.
    - name: ac8-mandatory-timeout-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac8-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory:
                  timeoutSeconds: 300
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac8-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":300},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac8-harness
                namespace: bedrockharness
              spec:
                configRef: ac8-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                timeoutSeconds: 600
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac8-harness
                namespace: bedrockharness
              spec:
                timeoutSeconds: 300

    # AC-7 (spec): defaults.timeoutSeconds applied when spec.timeoutSeconds is 0.
    - name: ac9-defaults-timeout-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac9-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  timeoutSeconds: 120
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac9-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":120},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac9-harness
                namespace: bedrockharness
              spec:
                configRef: ac9-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac9-harness
                namespace: bedrockharness
              spec:
                timeoutSeconds: 120

    # AC-9 (spec): syncedLabels propagated to ACK Harness metadata.labels (prefixed) and spec.tags.
    - name: ac10-syncedlabels-propagation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac10-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac10-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"environment":"production"},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac10-harness
                namespace: bedrockharness
              spec:
                configRef: ac10-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac10-harness
                namespace: bedrockharness
                labels:
                  aws.kropath.run/environment: production
        - script:
            content: |
              set -eu
              TAGS=$(kubectl get harness bedrockharness-ac10-harness -n bedrockharness -o json \
                | jq -r '.spec.tags | to_entries | map(.key + "=" + .value) | sort | join(",")')
              echo "tags: $TAGS"
              echo "$TAGS" | grep -q "environment=production"

    # AC-10 (spec): Standard metadata labels, annotations, and ownerReferences on ACK Harness.
    - name: ac11-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac11-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac11-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac11-harness
                namespace: bedrockharness
              spec:
                configRef: ac11-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac11-harness
                namespace: bedrockharness
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac11-harness
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              set -eu
              OWNER=$(kubectl get harness bedrockharness-ac11-harness -n bedrockharness -o json \
                | jq -r '.metadata.ownerReferences[0].name')
              echo "ownerRef name: $OWNER"
              [ "$OWNER" = "ac11-harness" ]

    # AC-11 (spec): spec.deletionPolicy: "delete" propagated to ACK Harness annotation.
    - name: ac12-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac12-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac12-cfg -n bedrockharness \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockHarness
              metadata:
                name: ac12-harness
                namespace: bedrockharness
              spec:
                configRef: ac12-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/harness-role"
                deletionPolicy: "delete"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Harness
              metadata:
                name: bedrockharness-ac12-harness
                namespace: bedrockharness
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-12 (spec): default deletionPolicy (retain) propagated to ACK Harness annotation.
    - name: ac13-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac13-cfg
                namespace: bedrockharness
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
