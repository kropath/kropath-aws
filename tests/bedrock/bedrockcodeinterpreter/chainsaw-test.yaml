# BedrockCodeInterpreter Chainsaw tests — spec: aws-bedrock-13.
# Canonical pattern: skipDelete + unique resource name per step; no inter-step deletes.
# Tags on ACK CodeInterpreter are map[string]string; use jq to_entries for order-independent assertion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockcodeinterpreter
spec:
  skipDelete: true
  namespace: bedrockcodeinterpreter
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: BedrockCodeInterpreter with PUBLIC networkMode creates ACK CodeInterpreter.
    - name: ac1-create-ci-public
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac1-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac1-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac1-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac1-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac1-ci
                namespace: bedrockcodeinterpreter
              status:
                resourceName: bedrockcodeinterpreter-ac1-ci
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: CodeInterpreter
              metadata:
                name: bedrockcodeinterpreter-ac1-ci
                namespace: bedrockcodeinterpreter
              spec:
                name: bedrockcodeinterpreter-ac1-ci
                networkConfiguration:
                  networkMode: PUBLIC

    # AC-2: VPC networkMode + executionRoleArn + description.
    - name: ac2-create-ci-vpc
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac2-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac2-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac2-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac2-cfg
                description: "VPC code interpreter"
                executionRoleArn: "arn:aws:iam::123456789012:role/ci-role"
                networkConfiguration:
                  networkMode: VPC
                  vpcConfig:
                    securityGroups:
                      - sg-12345678
                    subnets:
                      - subnet-87654321
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: CodeInterpreter
              metadata:
                name: bedrockcodeinterpreter-ac2-ci
                namespace: bedrockcodeinterpreter
              spec:
                networkConfiguration:
                  networkMode: VPC
                  vpcConfig:
                    securityGroups:
                      - sg-12345678
                    subnets:
                      - subnet-87654321
                executionRoleARN: "arn:aws:iam::123456789012:role/ci-role"
                description: "VPC code interpreter"

    # AC-3: certificates array populated and transformed to ACK nested format.
    - name: ac3-create-ci-with-certs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac3-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac3-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac3-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac3-cfg
                networkConfiguration:
                  networkMode: PUBLIC
                certificates:
                  - secretArn: "arn:aws:secretsmanager:ap-southeast-2:123456789012:secret:ci-cert-xyz"
        - script:
            content: |
              set -eu
              CERT=$(kubectl get codeinterpreter bedrockcodeinterpreter-ac3-ci -n bedrockcodeinterpreter -o json \
                | jq -r '.spec.certificates[0].location.secretsManager.secretARN')
              echo "cert: $CERT"
              [ "$CERT" = "arn:aws:secretsmanager:ap-southeast-2:123456789012:secret:ci-cert-xyz" ]

    # AC-4 + AC-5: tags merge (mandatory > spec > defaults) and syncedLabels propagation.
    - name: ac4-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac4-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: ai
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: ml
        - script:
            content: |
              kubectl patch bedrockconfig ac4-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"environment":"production"},"tags":{"cost-centre":"ai"},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{"team":"ml"},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac4-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac4-cfg
                tags:
                  app: agent
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: CodeInterpreter
              metadata:
                name: bedrockcodeinterpreter-ac4-ci
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/environment: production
        - script:
            content: |
              set -eu
              TAGS=$(kubectl get codeinterpreter bedrockcodeinterpreter-ac4-ci -n bedrockcodeinterpreter -o json \
                | jq -r '.spec.tags | to_entries | map(.key + "=" + .value) | sort | join(",")')
              echo "tags: $TAGS"
              echo "$TAGS" | grep -q "app=agent"
              echo "$TAGS" | grep -q "cost-centre=ai"
              echo "$TAGS" | grep -q "environment=production"
              echo "$TAGS" | grep -q "team=ml"

    # AC-6: standard K8s metadata.
    - name: ac6-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac6-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac6-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac6-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac6-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: CodeInterpreter
              metadata:
                name: bedrockcodeinterpreter-ac6-ci
                namespace: bedrockcodeinterpreter
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac6-ci
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              set -eu
              OWNER_KIND=$(kubectl get codeinterpreter bedrockcodeinterpreter-ac6-ci -n bedrockcodeinterpreter -o json \
                | jq -r '.metadata.ownerReferences[0].kind')
              OWNER_NAME=$(kubectl get codeinterpreter bedrockcodeinterpreter-ac6-ci -n bedrockcodeinterpreter -o json \
                | jq -r '.metadata.ownerReferences[0].name')
              echo "owner kind: $OWNER_KIND, name: $OWNER_NAME"
              [ "$OWNER_KIND" = "BedrockCodeInterpreter" ]
              [ "$OWNER_NAME" = "ac6-ci" ]

    # AC-7: deletionPolicy: delete.
    - name: ac7-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac7-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac7-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac7-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac7-cfg
                deletionPolicy: delete
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: CodeInterpreter
              metadata:
                name: bedrockcodeinterpreter-ac7-ci
                namespace: bedrockcodeinterpreter
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-8: deletionPolicy: retain (default).
    - name: ac8-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac8-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac8-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac8-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac8-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: CodeInterpreter
              metadata:
                name: bedrockcodeinterpreter-ac8-ci
                namespace: bedrockcodeinterpreter
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-9: default naming template {namespace}-{name}.
    - name: ac9-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac9-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac9-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac9-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac9-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac9-ci
                namespace: bedrockcodeinterpreter
              status:
                resourceName: bedrockcodeinterpreter-ac9-ci
                namingStatus: valid

    # AC-10: nameOverride bypasses the naming template.
    - name: ac10-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac10-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac10-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac10-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac10-cfg
                nameOverride: my-code-interpreter
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac10-ci
                namespace: bedrockcodeinterpreter
              status:
                resourceName: my-code-interpreter
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: CodeInterpreter
              metadata:
                name: my-code-interpreter
                namespace: bedrockcodeinterpreter
              spec:
                name: my-code-interpreter

    # AC-11: namingStatus invalid-unresolved-tokens when template references unknown tag.
    - name: ac11-naming-unresolved
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac11-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.env}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac11-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{tag.env}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac11-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac11-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac11-ci
                namespace: bedrockcodeinterpreter
              status:
                namingStatus: invalid-unresolved-tokens

    # AC-12: networkConfiguration stored on ACK child.
    # ACK enforces immutability at the controller level; kro v0.9.2 discards x-kubernetes-validations.
    - name: ac12-immutable-network
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac12-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac12-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac12-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac12-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: CodeInterpreter
              metadata:
                name: bedrockcodeinterpreter-ac12-ci
                namespace: bedrockcodeinterpreter
              spec:
                networkConfiguration:
                  networkMode: PUBLIC

    # AC-13: description stored on ACK child.
    # ACK enforces immutability at the controller level.
    - name: ac13-immutable-description
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac13-cfg
                namespace: bedrockcodeinterpreter
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac13-cfg -n bedrockcodeinterpreter \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockCodeInterpreter
              metadata:
                name: ac13-ci
                namespace: bedrockcodeinterpreter
              spec:
                configRef: ac13-cfg
                description: "Initial description"
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: CodeInterpreter
              metadata:
                name: bedrockcodeinterpreter-ac13-ci
                namespace: bedrockcodeinterpreter
              spec:
                description: "Initial description"

    # AC-14: executionRoleArn stored on ACK child.
    # ACK enforces immutability at the controller level.
    - name: ac14-immutable-role
      try:
        - apply:
            resource:
