# BedrockGatewayTarget Chainsaw tests.
# Canonical pattern: skipDelete + unique resource name per step; no inter-step deletes.
# NOTE: ACK GatewayTarget CRD has no spec.tags field — cloud tags not propagated.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockgatewaytarget
spec:
  skipDelete: true
  namespace: bedrockgatewaytarget
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: create lambda target.
    - name: ac1-create-target-lambda
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac1-cfg
                namespace: bedrockgatewaytarget
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac1-cfg -n bedrockgatewaytarget \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac1-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:my-tool"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac1-target
                namespace: bedrockgatewaytarget
              status:
                resourceName: bedrockgatewaytarget-ac1-target
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac1-target
                namespace: bedrockgatewaytarget
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac1-target
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                gatewayIdentifier: "gw-abc123"

    # AC-3: target with API Gateway config.
    - name: ac3-create-target-api-gateway
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac3-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    apiGateway:
                      restAPIID: "abc123def"
                      stage: "prod"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac3-target
                namespace: bedrockgatewaytarget
              status:
                resourceName: bedrockgatewaytarget-ac3-target

    # AC-4: target with OpenAPI schema config.
    - name: ac4-create-target-openapi
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac4-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    openAPISchema:
                      inlinePayload: '{"openapi":"3.0.0"}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac4-target
                namespace: bedrockgatewaytarget
              status:
                resourceName: bedrockgatewaytarget-ac4-target

    # AC-5: tags are K8s metadata only (no spec.tags on ACK GatewayTarget CRD).
    - name: ac5-tags-k8s-metadata-only
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac5-cfg
                namespace: bedrockgatewaytarget
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac5-cfg -n bedrockgatewaytarget \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"cost-centre":"ai-platform"},"tags":{"cost-centre":"ai-platform"}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac5-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac5-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac5-target
                namespace: bedrockgatewaytarget
        - script:
            content: |
              set -e
              GT=$(kubectl get gatewaytarget bedrockgatewaytarget-ac5-target -n bedrockgatewaytarget -o json)
              echo "$GT" | jq -e '.metadata.labels["aws.kropath.run/cost-centre"] == "ai-platform"'
              if echo "$GT" | jq -e '.spec.tags != null' > /dev/null 2>&1; then echo "FAIL: spec.tags present but CRD has no tags field"; exit 1; fi
              echo "PASS: no spec.tags on GatewayTarget"

    # AC-8: deletion-policy delete.
    - name: ac8-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac8-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                deletionPolicy: "delete"
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac8-target
                namespace: bedrockgatewaytarget
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-10/AC-11/AC-12: naming.
    - name: ac10-naming-template-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac10-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac10-target
                namespace: bedrockgatewaytarget
              status:
                resourceName: bedrockgatewaytarget-ac10-target
                namingStatus: valid

    - name: ac12-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac12-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                nameOverride: "custom-target"
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac12-target
                namespace: bedrockgatewaytarget
              status:
                resourceName: custom-target
                namingStatus: valid

    # AC-13: unresolved naming token.
    - name: ac13-naming-unresolved-tokens
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac13-cfg
                namespace: bedrockgatewaytarget
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.env}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac13-cfg -n bedrockgatewaytarget \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"namingTemplate":"{tag.env}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac13-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac13-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac13-target
                namespace: bedrockgatewaytarget
              status:
                namingStatus: invalid-unresolved-tokens

    # AC-15: gatewayIdentifier + gatewayIdentifierRef mutual exclusivity.
    - name: ac15-gateway-id-mutual-exclusivity
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac15-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                gatewayIdentifier: "gw-abc123"
                gatewayIdentifierRef: "my-gateway"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac15-target-gateway-exclusion-error
                namespace: bedrockgatewaytarget

    # AC-17: optional fields absent.
    - name: ac17-optional-fields-absent
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac17-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac17-target
                namespace: bedrockgatewaytarget
        - script:
            content: |
              set -e
              SPEC=$(kubectl get gatewaytarget bedrockgatewaytarget-ac17-target -n bedrockgatewaytarget -o json | jq '.spec')
              if echo "$SPEC" | jq -e '.description != null and .description != ""' > /dev/null 2>&1; then echo "FAIL: description present"; exit 1; fi
              if echo "$SPEC" | jq -e '.credentialProviderConfigurations != null and (.credentialProviderConfigurations | length) > 0' > /dev/null 2>&1; then echo "FAIL: credentialProviderConfigurations present"; exit 1; fi
              echo "PASS: optional fields absent"

    # AC-18: optional fields present.
    - name: ac18-optional-fields-present
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac18-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                gatewayIdentifier: "gw-abc123"
                description: "Lambda backend"
                metadataConfiguration:
                  allowedRequestHeaders:
                    - "Authorization"
                    - "Content-Type"
                credentialProviderConfigurations:
                  - credentialProviderType: API_KEY
                    credentialProvider:
                      apiKeyCredentialProvider:
                        credentialParameterName: "my-api-key"
                        providerARN: "arn:aws:secretsmanager:us-east-1:123456789012:secret:my-key"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac18-target
                namespace: bedrockgatewaytarget
        - script:
            content: |
              set -e
              SPEC=$(kubectl get gatewaytarget bedrockgatewaytarget-ac18-target -n bedrockgatewaytarget -o json | jq '.spec')
              echo "$SPEC" | jq -e '.description == "Lambda backend"'
              echo "$SPEC" | jq -e '.metadataConfiguration.allowedRequestHeaders | length > 0'

    # AC-19: syncedLabels propagated (no spec.tags).
    - name: ac19-synced-labels-propagated
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac19-cfg
                namespace: bedrockgatewaytarget
                labels:
                  aws.kropath.run/resource-name: ac19-cfg
              spec:
                mandatory:
                  syncedLabels:
                    environment: production
        - script:
            content: |
              kubectl patch bedrockconfig ac19-cfg -n bedrockgatewaytarget \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"environment":"production"},"tags":{}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac19-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac19-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac19-target
                namespace: bedrockgatewaytarget
        - script:
            content: |
              set -e
              GT=$(kubectl get gatewaytarget bedrockgatewaytarget-ac19-target -n bedrockgatewaytarget -o json)
              echo "$GT" | jq -e '.metadata.labels["aws.kropath.run/environment"] == "production"'
              if echo "$GT" | jq -e '.spec.tags != null' > /dev/null 2>&1; then echo "FAIL: spec.tags present — CRD has no tags field"; exit 1; fi
              echo "PASS"

    # AC-2: create-target-mcp-server — MCP server target with gatewayIdentifierRef resolved from ACK Gateway.
    - name: ac2-create-target-mcp-server
      try:
        - apply:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Gateway
              metadata:
                name: ac2-parent-gateway
                namespace: bedrockgatewaytarget
                labels:
                  app.kubernetes.io/instance: ac2-parent-gateway
              spec:
                name: ac2-parent-gateway
                authorizerType: NONE
                protocolType: MCP
        - script:
            content: |
              kubectl patch gateway ac2-parent-gateway -n bedrockgatewaytarget \
                --subresource=status --type=merge \
                -p '{"status":{"gatewayID":"gw-ac2-001"}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac2-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                gatewayIdentifierRef: ac2-parent-gateway
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:mcp-tool"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac2-target
                namespace: bedrockgatewaytarget
              spec:
                gatewayIdentifier: "gw-ac2-001"

    # AC-6: defaults-synced-labels-applied — defaults.syncedLabels applied to ACK child metadata.labels.
    - name: ac6-defaults-synced-labels-applied
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac6-cfg
                namespace: bedrockgatewaytarget
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac6-cfg -n bedrockgatewaytarget \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{"managed-by":"kropath"},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac6-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac6-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac6-target
                namespace: bedrockgatewaytarget
        - script:
            content: |
              set -e
              kubectl get gatewaytarget bedrockgatewaytarget-ac6-target -n bedrockgatewaytarget -o json | jq -e '.metadata.labels["aws.kropath.run/managed-by"] == "kropath"'

    # AC-7: standard-k8s-metadata — ACK GatewayTarget child has managed-by, instance, deletion-policy, ownerRefs.
    - name: ac7-standard-k8s-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac7-cfg
                namespace: bedrockgatewaytarget
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac7-cfg -n bedrockgatewaytarget \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac7-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac7-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac7-target
                namespace: bedrockgatewaytarget
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac7-target
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              set -eu
              OWNER=$(kubectl get gatewaytarget bedrockgatewaytarget-ac7-target -n bedrockgatewaytarget -o json \
                | jq -r '.metadata.ownerReferences // [] | map(select(.kind == "BedrockGatewayTarget" and .name == "ac7-target")) | length')
              echo "ownerReferences pointing to BedrockGatewayTarget/ac7-target: $OWNER"
              [ "$OWNER" -ge 1 ]

    # AC-9: deletion-policy-retain — spec.deletionPolicy: "retain" propagates to ACK annotation.
    - name: ac9-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac9-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac1-cfg
                deletionPolicy: "retain"
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: GatewayTarget
              metadata:
                name: bedrockgatewaytarget-ac9-target
                namespace: bedrockgatewaytarget
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-11: naming-template-mandatory — mandatory.namingTemplate overrides defaults.
    - name: ac11-naming-template-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac11-cfg
                namespace: bedrockgatewaytarget
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory:
                  namingTemplate: "corp-{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac11-cfg -n bedrockgatewaytarget \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"corp-{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"defaults":{"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac11-target
                namespace: bedrockgatewaytarget
              spec:
                configRef: ac11-cfg
                gatewayIdentifier: "gw-abc123"
                targetConfiguration:
                  mcp:
                    lambda:
                      lambdaARN: "arn:aws:lambda:us-east-1:123456789012:function:tool"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockGatewayTarget
              metadata:
                name: ac11-target
                namespace: bedrockgatewaytarget
              status:
                resourceName: corp-bedrockgatewaytarget-ac11-target
                namingStatus: valid

    # NOTE: AC-14 (missing-target-configuration) cannot be exercised via kubectl apply --dry-run=server.
    # kro v0.9.2 does not generate a required: array in the openAPIV3Schema for fields declared without
    # a default value — the apiserver accepts CRs missing targetConfiguration. Required-field validation
    # is enforced by the ACK Bedrock API at the AWS layer and cannot be tested locally without a live
    # ACK controller. See docs/frequent-rgd-errors.md §"x-kubernetes-validations Cannot Be Auto-Generated by kro".

    # AC-16: gateway-ref-resolved — gatewayIdentifierRef resolves to ACK GatewayTarget spec.gatewayIdentifier from ACK Gateway status.gatewayID.
    - name: ac16-gateway-ref-resolved
      try:
        - apply:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Gateway
              metadata:
                name: ac16-parent-gateway
                namespace: bedrockgatewaytarget
                labels:
                  app.kubernetes.io/instance: ac16-parent-gateway
              spec:
                name: ac16-parent-gateway
                authorizerType: NONE
                protocolType: MCP
        - script:
            content: |
              kubectl patch gateway ac16-parent-gateway -n bedrockgatewaytarget \
                --subresource=status --type=merge \
                -p '{"status":{"gatewayID":"gw-resolved-001"}}'
        - apply:
