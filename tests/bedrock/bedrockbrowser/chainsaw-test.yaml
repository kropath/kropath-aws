# BedrockBrowser Chainsaw tests — spec: aws-bedrock-11.
# Canonical pattern: skipDelete + unique resource name per step; no inter-step deletes.
# Tags on ACK Browser are map[string]string; use jq to_entries for order-independent assertion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bedrockbrowser
spec:
  skipDelete: true
  namespace: bedrockbrowser
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: BedrockBrowser with PUBLIC networkMode creates ACK Browser.
    # status.resourceName follows {namespace}-{name} default template.
    - name: ac1-create-browser-public
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac1-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac1-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac1-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac1-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac1-browser
                namespace: bedrockbrowser
              status:
                resourceName: bedrockbrowser-ac1-browser
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: bedrockbrowser-ac1-browser
                namespace: bedrockbrowser
              spec:
                name: bedrockbrowser-ac1-browser
                networkConfiguration:
                  networkMode: PUBLIC

    # AC-2: VPC networkMode with vpcConfig + executionRoleArn.
    - name: ac2-create-browser-vpc
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac2-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac2-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac2-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac2-cfg
                executionRoleArn: "arn:aws:iam::123456789012:role/browser-role"
                networkConfiguration:
                  networkMode: VPC
                  vpcConfig:
                    securityGroups:
                      - sg-12345678
                    subnets:
                      - subnet-87654321
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: bedrockbrowser-ac2-browser
                namespace: bedrockbrowser
              spec:
                networkConfiguration:
                  networkMode: VPC
                  vpcConfig:
                    securityGroups:
                      - sg-12345678
                    subnets:
                      - subnet-87654321
                executionRoleARN: "arn:aws:iam::123456789012:role/browser-role"

    # AC-3: full optional fields — browserSigning, certificates, enterprisePolicies, recording.
    - name: ac3-create-browser-full
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac3-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac3-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac3-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac3-cfg
                description: "Full browser test"
                networkConfiguration:
                  networkMode: PUBLIC
                browserSigning:
                  enabled: true
                certificates:
                  - secretArn: "arn:aws:secretsmanager:ap-southeast-2:123456789012:secret:cert-abc"
                enterprisePolicies:
                  - location:
                      s3:
                        bucket: my-policies
                        prefix: browser/
                    type: ""
                recording:
                  enabled: true
                  s3Location:
                    bucket: recordings
                    prefix: browser/
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: bedrockbrowser-ac3-browser
                namespace: bedrockbrowser
              spec:
                browserSigning:
                  enabled: true
                recording:
                  enabled: true
                  s3Location:
                    bucket: recordings
                    prefix: browser/
        - script:
            content: |
              set -eu
              CERT=$(kubectl get browser bedrockbrowser-ac3-browser -n bedrockbrowser -o json \
                | jq -r '.spec.certificates[0].location.secretsManager.secretARN')
              echo "cert: $CERT"
              [ "$CERT" = "arn:aws:secretsmanager:ap-southeast-2:123456789012:secret:cert-abc" ]

    # AC-4 + AC-5: tags merge (mandatory > spec > defaults) and syncedLabels propagation.
    - name: ac4-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac4-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  tags:
                    cost-centre: ai
                  syncedLabels:
                    environment: production
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    team: ml
        - script:
            content: |
              kubectl patch bedrockconfig ac4-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{"environment":"production"},"tags":{"cost-centre":"ai"},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{"team":"ml"},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac4-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac4-cfg
                tags:
                  app: agent
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: bedrockbrowser-ac4-browser
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/environment: production
        - script:
            content: |
              set -eu
              TAGS=$(kubectl get browser bedrockbrowser-ac4-browser -n bedrockbrowser -o json \
                | jq -r '.spec.tags | to_entries | map(.key + "=" + .value) | sort | join(",")')
              echo "tags: $TAGS"
              echo "$TAGS" | grep -q "app=agent"
              echo "$TAGS" | grep -q "cost-centre=ai"
              echo "$TAGS" | grep -q "environment=production"
              echo "$TAGS" | grep -q "team=ml"

    # AC-6: standard K8s metadata — managed-by, instance label, deletion-policy annotation, ownerRef.
    - name: ac6-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac6-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac6-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac6-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac6-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: bedrockbrowser-ac6-browser
                namespace: bedrockbrowser
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac6-browser
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              set -eu
              OWNER_KIND=$(kubectl get browser bedrockbrowser-ac6-browser -n bedrockbrowser -o json \
                | jq -r '.metadata.ownerReferences[0].kind')
              OWNER_NAME=$(kubectl get browser bedrockbrowser-ac6-browser -n bedrockbrowser -o json \
                | jq -r '.metadata.ownerReferences[0].name')
              echo "owner kind: $OWNER_KIND, name: $OWNER_NAME"
              [ "$OWNER_KIND" = "BedrockBrowser" ]
              [ "$OWNER_NAME" = "ac6-browser" ]

    # AC-7: deletionPolicy: delete propagates to ACK annotation.
    - name: ac7-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac7-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac7-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac7-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac7-cfg
                deletionPolicy: delete
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: bedrockbrowser-ac7-browser
                namespace: bedrockbrowser
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC-8: deletionPolicy: retain (default).
    - name: ac8-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac8-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac8-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac8-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac8-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: bedrockbrowser-ac8-browser
                namespace: bedrockbrowser
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-9: default naming template {namespace}-{name}.
    - name: ac9-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac9-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac9-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac9-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac9-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac9-browser
                namespace: bedrockbrowser
              status:
                resourceName: bedrockbrowser-ac9-browser
                namingStatus: valid

    # AC-10: nameOverride bypasses the naming template.
    - name: ac10-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac10-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac10-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac10-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac10-cfg
                nameOverride: my-browser
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac10-browser
                namespace: bedrockbrowser
              status:
                resourceName: my-browser
                namingStatus: valid
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: my-browser
                namespace: bedrockbrowser
              spec:
                name: my-browser

    # AC-11: namingStatus invalid-unresolved-tokens when template references unknown tag.
    - name: ac11-naming-unresolved
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac11-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{tag.env}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac11-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{tag.env}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac11-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac11-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac11-browser
                namespace: bedrockbrowser
              status:
                namingStatus: invalid-unresolved-tokens

    # AC-12: networkConfiguration stored on ACK child.
    # ACK enforces immutability at the controller level; kro v0.9.2 discards x-kubernetes-validations.
    - name: ac12-immutable-network
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac12-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac12-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac12-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac12-cfg
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: bedrockbrowser-ac12-browser
                namespace: bedrockbrowser
              spec:
                networkConfiguration:
                  networkMode: PUBLIC

    # AC-13: description stored on ACK child.
    # ACK enforces immutability at the controller level.
    - name: ac13-immutable-description
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac13-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch bedrockconfig ac13-cfg -n bedrockbrowser \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"defaults":{"allowedModels":[],"foundationModel":"","guardrailIdentifier":"","guardrailVersion":"","idleSessionTTLInSeconds":0,"maxIterations":0,"maxTokens":0,"namingTemplate":"{namespace}-{name}","syncedAnnotations":{},"syncedLabels":{},"tags":{},"timeoutSeconds":0},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockBrowser
              metadata:
                name: ac13-browser
                namespace: bedrockbrowser
              spec:
                configRef: ac13-cfg
                description: "Initial description"
                networkConfiguration:
                  networkMode: PUBLIC
        - assert:
            resource:
              apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
              kind: Browser
              metadata:
                name: bedrockbrowser-ac13-browser
                namespace: bedrockbrowser
              spec:
                description: "Initial description"

    # AC-14: executionRoleArn stored on ACK child.
    # ACK enforces immutability at the controller level.
    - name: ac14-immutable-role
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: BedrockConfig
              metadata:
                name: ac14-cfg
                namespace: bedrockbrowser
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                defaults:
