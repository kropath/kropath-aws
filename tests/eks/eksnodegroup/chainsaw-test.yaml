# aws-eks-05 Chainsaw tests — EKSNodegroup RGD (naming, no predictedArn).
# Canonical pattern: unique resource name per step, spec.skipDelete: true, no inter-step deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eksnodegroup
spec:
  skipDelete: true
  namespace: eksnodegroup
  steps:
    # Seed: namespace, governance config, patch effectiveConfig.
    - name: seed
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 00-eksconfig.yaml
        - script:
            content: |
              kubectl patch eksconfig general-policy -n eksnodegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"cost-centre":"platform"},"syncedLabels":{"environment":"production"},"syncedAnnotations":{"owner":"platform-team"},"namingTemplate":""},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'

    # AC-1/AC-5: basic nodegroup; naming ConfigMap effectiveName = eksnodegroup-core-nodes.
    - name: ac1-ac5-basic-nodegroup
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: core-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                  - subnet-4e5f6g7h
                scalingConfig:
                  minSize: 1
                  maxSize: 5
                  desiredSize: 3
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: core-nodes-naming
                namespace: eksnodegroup
              data:
                effectiveName: eksnodegroup-core-nodes
                namingStatus: valid
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: core-nodes
                namespace: eksnodegroup
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: core-nodes
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: eksnodegroup-core-nodes
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                  - subnet-4e5f6g7h
                scalingConfig:
                  minSize: 1
                  maxSize: 5
                  desiredSize: 3

    # AC-2: scaling config bounds — minSize=0, maxSize=10.
    - name: ac2-scaling-config
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: scaling-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 0
                  maxSize: 10
                  desiredSize: 2
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: scaling-nodes
                namespace: eksnodegroup
              spec:
                scalingConfig:
                  minSize: 0
                  maxSize: 10
                  desiredSize: 2

    # AC-3: diskSize passthrough.
    - name: ac3-disk-size
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: disk-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 3
                  desiredSize: 1
                diskSize: 100
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: disk-nodes
                namespace: eksnodegroup
              spec:
                diskSize: 100

    # AC-4: amiType passthrough.
    - name: ac4-ami-type
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: ami-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 3
                  desiredSize: 1
                amiType: AL2_ARM_64
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: ami-nodes
                namespace: eksnodegroup
              spec:
                amiType: AL2_ARM_64

    # AC-6: nameOverride bypasses template.
    - name: ac6-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: override-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                nameOverride: my-custom-nodegroup
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 3
                  desiredSize: 1
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: override-nodes-naming
                namespace: eksnodegroup
              data:
                effectiveName: my-custom-nodegroup
                namingStatus: valid
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: override-nodes
                namespace: eksnodegroup
              spec:
                name: my-custom-nodegroup

    # AC-7: unresolved naming token.
    - name: ac7-unresolved-token
      try:
        - script:
            content: |
              kubectl patch eksconfig general-policy -n eksnodegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"{tag.env}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: unresolved-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 3
                  desiredSize: 1
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: unresolved-nodes-naming
                namespace: eksnodegroup
              data:
                namingStatus: invalid-unresolved-tokens

    # AC-8: taints passthrough.
    - name: ac8-taints
      try:
        - script:
            content: |
              kubectl patch eksconfig general-policy -n eksnodegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: tainted-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 3
                  desiredSize: 1
                taints:
                  - key: workload
                    value: gpu
                    effect: NO_SCHEDULE
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: tainted-nodes
                namespace: eksnodegroup
              spec:
                taints:
                  - key: workload
                    value: gpu
                    effect: NO_SCHEDULE

    # AC-9: launchTemplate passthrough.
    - name: ac9-launch-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: lt-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 3
                  desiredSize: 1
                launchTemplate:
                  id: lt-0a1b2c3d4e5f6g7h8
                  version: "1"
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: lt-nodes
                namespace: eksnodegroup
              spec:
                launchTemplate:
                  id: lt-0a1b2c3d4e5f6g7h8
                  version: "1"

    # AC-10: remoteAccess passthrough.
    - name: ac10-remote-access
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: ssh-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 3
                  desiredSize: 1
                remoteAccess:
                  ec2SshKey: my-key-pair
                  sourceSecurityGroups:
                    - sg-0a1b2c3d
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: ssh-nodes
                namespace: eksnodegroup
              spec:
                remoteAccess:
                  ec2SshKey: my-key-pair
                  sourceSecurityGroups:
                    - sg-0a1b2c3d

    # AC-11: updateConfig passthrough.
    - name: ac11-update-config
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: update-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 5
                  desiredSize: 2
                updateConfig:
                  maxUnavailable: 1
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: update-nodes
                namespace: eksnodegroup
              spec:
                updateConfig:
                  maxUnavailable: 1

    # AC-13: tags merge — mandatory wins over spec over defaults.
    - name: ac13-tags-merge
      try:
        - script:
            content: |
              kubectl patch eksconfig general-policy -n eksnodegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{"cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{"team":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: tagged-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 3
                  desiredSize: 1
                tags:
                  service: nodegroup
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: tagged-nodes
                namespace: eksnodegroup
              spec:
                tags:
                  cost-centre: platform
                  service: nodegroup

    # AC-14: deletion-policy delete.
    - name: ac14-deletion-policy-delete
      try:
        - script:
            content: |
              kubectl patch eksconfig general-policy -n eksnodegroup \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EKSNodegroup
              metadata:
                name: delete-nodes
                namespace: eksnodegroup
              spec:
                clusterName: prod-cluster
                nodeRole: arn:aws:iam::123456789012:role/eks-node-role
                subnets:
                  - subnet-0a1b2c3d
                scalingConfig:
                  minSize: 1
                  maxSize: 3
                  desiredSize: 1
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: eks.services.k8s.aws/v1alpha1
              kind: Nodegroup
              metadata:
                name: delete-nodes
                namespace: eksnodegroup
                annotations:
                  services.k8s.aws/deletion-policy: delete
