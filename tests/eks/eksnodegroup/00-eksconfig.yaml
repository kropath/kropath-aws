apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: general-policy
  namespace: eksnodegroup
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: true
    endpointPrivateAccess: true
    supportType: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
