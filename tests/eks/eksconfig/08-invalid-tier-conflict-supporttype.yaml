# Should be rejected: supportType set in both mandatory and defaults.
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: invalid-tier-conflict-supporttype
  namespace: eksconfig
spec:
  mandatory:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: "EXTENDED"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: "STANDARD"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
