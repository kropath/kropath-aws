# AC-1 + AC-11: general-policy CR with zero mandatory fields and correct defaults.
# Also validates AC-11: mandatory.endpointPublicAccess: false is accepted as zero-value sentinel.
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: general-policy
  namespace: eksconfig
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    version: ""
    authenticationMode: "API"
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: true
    endpointPrivateAccess: true
    supportType: "STANDARD"
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
