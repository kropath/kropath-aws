# Should be rejected: loggingTypes set in both mandatory and defaults.
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: invalid-tier-conflict-logging
  namespace: eksconfig
spec:
  mandatory:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes:
      - api
      - audit
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes:
      - authenticator
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
