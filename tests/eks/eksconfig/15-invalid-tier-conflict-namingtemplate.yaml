# Should be rejected: namingTemplate set in both mandatory and defaults.
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: invalid-tier-conflict-namingtemplate
  namespace: eksconfig
spec:
  mandatory:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: "{namespace}-{name}-prod"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
