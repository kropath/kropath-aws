# Should be rejected: authenticationMode set in both mandatory and defaults.
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: invalid-tier-conflict-authmode
  namespace: eksconfig
spec:
  mandatory:
    version: ""
    authenticationMode: "API"
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    version: ""
    authenticationMode: "API_AND_CONFIG_MAP"
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
