# Assert AC-9: production CR enforces API auth mode, all 5 log types, extended support,
# production tag, and production syncedLabel; defaults private endpoint and naming template.
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: production
  namespace: eksconfig
spec:
  mandatory:
    authenticationMode: "API"
    loggingTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
    supportType: "EXTENDED"
    tags:
      environment: production
    syncedLabels:
      tier: production
  defaults:
    endpointPrivateAccess: true
    namingTemplate: "{namespace}-{name}"
