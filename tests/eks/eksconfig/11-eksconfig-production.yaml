# AC-9: production CR with enforced mandatory fields.
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: production
  namespace: eksconfig
  labels:
    aws.kropath.run/resource-name: production
spec:
  mandatory:
    version: ""
    authenticationMode: "API"
    encryptionKeyArn: ""
    loggingTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: "EXTENDED"
    namingTemplate: ""
    tags:
      environment: production
    syncedLabels:
      tier: production
    syncedAnnotations: {}
  defaults:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: true
    supportType: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
