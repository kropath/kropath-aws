    #             -p '{"status":{"effectiveConfig":{"mandatory":{"version":"","authenticationMode":"","encryptionKeyArn":"","loggingTypes":[],"endpointPublicAccess":false,"endpointPrivateAccess":false,"supportType":"","namingTemplate":"","tags":{"cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"version":"","authenticationMode":"API","encryptionKeyArn":"","loggingTypes":[],"endpointPublicAccess":true,"endpointPrivateAccess":true,"supportType":"STANDARD","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
    #     - assert:
    #         file: 13-assert-ac10-effectiveconfig-merge.yaml

    # # AC-12: controller merges tags from both KropathConfig and EKSConfig sources.
    # - name: ac12-tags-merge-across-sources
    #   try:
    #     - script:
    #         content: |
    #           kubectl patch eksconfig general-policy -n eksconfig \
    #             --subresource=status --type=merge \
    #             -p '{"status":{"effectiveConfig":{"mandatory":{"tags":{"service":"eks","cost-centre":"infra"}},"defaults":{"tags":{"team":"platform","region-tag":"ap-southeast-2"}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
    #     - assert:
    #         file: 14-assert-ac12-tags-merge.yaml

    # # AC-13: controller populates status.effectiveConfig.mandatory.syncedLabels.
    # - name: ac13-synced-labels-merge
    #   (commented — requires kropath-controller)

    # # AC-14: controller populates status.effectiveConfig.mandatory.syncedAnnotations.
    # - name: ac14-synced-annotations-merge
    #   (commented — requires kropath-controller)

