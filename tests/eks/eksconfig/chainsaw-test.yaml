# aws-eks-01 Chainsaw tests — all 16 acceptance criteria.
# AC-1 through AC-9, AC-11, AC-16: isolated tests (no controller required).
# AC-10, AC-12 through AC-15: integration tests (commented — require kropath-controller).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eksconfig
spec:
  # Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
  # skipDelete"): skipDelete stops chainsaw's end-of-test cascade delete; the ephemeral
  # kind cluster is discarded after the suite.
  skipDelete: true
  namespace: eksconfig
  steps:
    - name: prepare
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: CRD is present with correct field structure.
    - name: ac1-crd-present
      try:
        - assert:
            file: 01-assert-crd-present.yaml

    # AC-2: version in both tiers is rejected.
    - name: ac2-reject-tier-conflict-version
      try:
        - apply:
            file: 02-invalid-tier-conflict-version.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EKSConfig
                check:
                  ($error != null): true

    # AC-3: authenticationMode in both tiers is rejected.
    - name: ac3-reject-tier-conflict-authmode
      try:
        - apply:
            file: 03-invalid-tier-conflict-authmode.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EKSConfig
                check:
                  ($error != null): true

    # AC-4: encryptionKeyArn in both tiers is rejected.
    - name: ac4-reject-tier-conflict-encryption
      try:
        - apply:
            file: 04-invalid-tier-conflict-encryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EKSConfig
                check:
                  ($error != null): true

    # AC-5: loggingTypes in both tiers is rejected.
    - name: ac5-reject-tier-conflict-logging
      try:
        - apply:
            file: 05-invalid-tier-conflict-logging.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EKSConfig
                check:
                  ($error != null): true

    # AC-6: endpointPublicAccess=true in both tiers is rejected.
    - name: ac6-reject-tier-conflict-endpoint-public
      try:
        - apply:
            file: 06-invalid-tier-conflict-endpoint-public.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EKSConfig
                check:
                  ($error != null): true

    # AC-7: endpointPrivateAccess=true in both tiers is rejected.
    - name: ac7-reject-tier-conflict-endpoint-private
      try:
        - apply:
            file: 07-invalid-tier-conflict-endpoint-private.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EKSConfig
                check:
                  ($error != null): true

    # AC-8: supportType in both tiers is rejected.
    - name: ac8-reject-tier-conflict-supporttype
      try:
        - apply:
            file: 08-invalid-tier-conflict-supporttype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EKSConfig
                check:
                  ($error != null): true

    # AC-1 (happy path) + AC-11: general-policy CR accepted; mandatory fields at zero-values
    # (including endpointPublicAccess: false as zero-value boolean sentinel).
    - name: ac1-ac11-general-policy-cr
      try:
        - apply:
            file: 09-eksconfig-general-policy.yaml
        - assert:
            file: 10-assert-ac1-general-policy.yaml

    # AC-9: production CR accepted; mandatory fields enforce API auth, all 5 log types,
    # extended support, production tags and syncedLabels.
    - name: ac9-production-profile-cr
      try:
        - apply:
            file: 11-eksconfig-production.yaml
        - assert:
            file: 12-assert-ac9-production.yaml

    # AC-16: namingTemplate in both tiers is rejected.
    - name: ac16-reject-tier-conflict-namingtemplate
      try:
        - apply:
            file: 15-invalid-tier-conflict-namingtemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: EKSConfig
                check:
                  ($error != null): true

    # Comment out AC-10, AC-12 through AC-15 as they belong to kropath-controller test cases
    # (require kropath-operator with --enable-eks-cascade to write status.effectiveConfig).

    # # AC-10: controller writes status.effectiveConfig merging KropathConfig + EKSConfig.
