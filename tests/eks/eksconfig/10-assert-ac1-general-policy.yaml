# Assert AC-1: general-policy has zero mandatory fields and correct defaults.
# Also implicitly validates AC-11: false zero-value boolean is accepted and not enforced.
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: general-policy
  namespace: eksconfig
spec:
  mandatory:
    version: ""
    authenticationMode: ""
    encryptionKeyArn: ""
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
  defaults:
    authenticationMode: "API"
    endpointPublicAccess: true
    endpointPrivateAccess: true
    supportType: "STANDARD"
    namingTemplate: "{namespace}-{name}"
