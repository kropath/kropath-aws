metadata:
  name: invalid-tier-conflict-version
  namespace: eksconfig
spec:
  mandatory:
    version: "1.31"
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    version: "1.30"
    authenticationMode: ""
    encryptionKeyArn: ""
    loggingTypes: []
    endpointPublicAccess: false
    endpointPrivateAccess: false
    supportType: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
