# Full naming applies: effectiveName, nameOverride, resourceName, namingStatus.
# No predictedArn (workspaceId not available at admission).
# Tags: full merge chain including syncedLabels dual-sync.
# Nested status: status.status.statusCode (not flat status.statusCode).
# Canonical pattern: unique name per step, skipDelete: true, no inter-step ACK deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: managedprometheusrulegroupsnamespace
spec:
  skipDelete: true
  namespace: managedprometheusrulegroupsnamespace
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: Default namingTemplate "{namespace}-{name}" produces effectiveName.
    - name: ac1-default-naming-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac1-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch managedprometheusconfig ac1-cfg -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac1-ws
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac1-ws
              spec:
                configRef: ac1-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac1-ws -n managedprometheusrulegroupsnamespace 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac1-ws -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac1-rgntest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac1-ws -n managedprometheusrulegroupsnamespace \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac1-rgntest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusRuleGroupsNamespace
              metadata:
                name: ac1-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                configRef: ac1-cfg
                configuration: "groups:\n  - name: test\n    rules: []"
                workspaceRef: ac1-ws
        - assert:
            resource:
              apiVersion: prometheusservice.services.k8s.aws/v1alpha1
              kind: RuleGroupsNamespace
              metadata:
                name: ac1-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                name: managedprometheusrulegroupsnamespace-ac1-rgn

    # AC-2: nameOverride bypasses naming template when mandatory namingTemplate is absent.
    - name: ac2-name-override-bypasses-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac2-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch managedprometheusconfig ac2-cfg -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac2-ws
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac2-ws
              spec:
                configRef: ac2-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac2-ws -n managedprometheusrulegroupsnamespace 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac2-ws -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac2-rgntest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac2-ws -n managedprometheusrulegroupsnamespace \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac2-rgntest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusRuleGroupsNamespace
              metadata:
                name: ac2-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                configRef: ac2-cfg
                configuration: "groups:\n  - name: test\n    rules: []"
                workspaceRef: ac2-ws
                nameOverride: "custom-rule-ns"
        - assert:
            resource:
              apiVersion: prometheusservice.services.k8s.aws/v1alpha1
              kind: RuleGroupsNamespace
              metadata:
                name: ac2-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                name: "custom-rule-ns"

    # AC-3: mandatory.namingTemplate overrides nameOverride.
    - name: ac3-mandatory-naming-template-wins-over-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac3-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  namingTemplate: "org-{name}"
        - script:
            content: |
              kubectl patch managedprometheusconfig ac3-cfg -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"org-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac3-ws
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac3-ws
              spec:
                configRef: ac3-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac3-ws -n managedprometheusrulegroupsnamespace 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac3-ws -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac3-rgntest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac3-ws -n managedprometheusrulegroupsnamespace \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac3-rgntest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusRuleGroupsNamespace
              metadata:
                name: ac3-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                configRef: ac3-cfg
                configuration: "groups:\n  - name: test\n    rules: []"
                workspaceRef: ac3-ws
                nameOverride: "should-be-ignored"
        - assert:
            resource:
              apiVersion: prometheusservice.services.k8s.aws/v1alpha1
              kind: RuleGroupsNamespace
              metadata:
                name: ac3-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                name: "org-ac3-rgn"

    # AC-4: ACK RuleGroupsNamespace NOT created when configuration is empty.
    - name: ac4-no-cr-when-configuration-empty
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac4-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch managedprometheusconfig ac4-cfg -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac4-ws
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac4-ws
              spec:
                configRef: ac4-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac4-ws -n managedprometheusrulegroupsnamespace 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac4-ws -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac4-rgntest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac4-ws -n managedprometheusrulegroupsnamespace \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac4-rgntest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusRuleGroupsNamespace
              metadata:
                name: ac4-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                configRef: ac4-cfg
                workspaceRef: ac4-ws
                # configuration empty — ACK child must NOT be created
        - script:
            timeout: 15s
            content: |
              sleep 5
              COUNT=$(kubectl get rulegroupsnamespace ac4-rgn -n managedprometheusrulegroupsnamespace 2>/dev/null | wc -l)
              [ "$COUNT" -eq 0 ] && echo "PASS: ACK child not created" && exit 0
              echo "FAIL: ACK child was created unexpectedly"
              exit 1

    # AC-5: ACK RuleGroupsNamespace NOT created when workspaceRef is empty.
    - name: ac5-no-cr-when-workspaceref-empty
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac5-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch managedprometheusconfig ac5-cfg -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusRuleGroupsNamespace
              metadata:
                name: ac5-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                configRef: ac5-cfg
                configuration: "groups:\n  - name: test\n    rules: []"
                # workspaceRef empty — ACK child must NOT be created
        - script:
            timeout: 15s
            content: |
              sleep 5
              COUNT=$(kubectl get rulegroupsnamespace ac5-rgn -n managedprometheusrulegroupsnamespace 2>/dev/null | wc -l)
              [ "$COUNT" -eq 0 ] && echo "PASS: ACK child not created" && exit 0
              echo "FAIL: ACK child was created unexpectedly"
              exit 1

    # AC-6: Tags merge defaults → spec → mandatory (last-writer-wins).
    - name: ac6-tags-merge-defaults-spec-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac6-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    env: dev
                mandatory:
                  tags:
                    cost-center: "1234"
        - script:
            content: |
              kubectl patch managedprometheusconfig ac6-cfg -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{"cost-center":"1234"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"{namespace}-{name}","tags":{"env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac6-ws
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac6-ws
              spec:
                configRef: ac6-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac6-ws -n managedprometheusrulegroupsnamespace 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac6-ws -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac6-rgntest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac6-ws -n managedprometheusrulegroupsnamespace \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac6-rgntest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusRuleGroupsNamespace
              metadata:
                name: ac6-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                configRef: ac6-cfg
                configuration: "groups:\n  - name: test\n    rules: []"
                workspaceRef: ac6-ws
                tags:
                  env: prod
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 10); do
                kubectl get rulegroupsnamespace ac6-rgn -n managedprometheusrulegroupsnamespace -o json 2>/dev/null > /tmp/chainsaw-ac6-rgn.json
                ENV=$(jq -r '.spec.tags.env // empty' /tmp/chainsaw-ac6-rgn.json)
                CC=$(jq -r '.spec.tags["cost-center"] // empty' /tmp/chainsaw-ac6-rgn.json)
                [ "$ENV" = "prod" ] && [ "$CC" = "1234" ] && echo "PASS: tags merged correctly" && exit 0
                sleep 3
              done
              echo "FAIL: expected env=prod cost-center=1234"
              exit 1

    # AC-7: syncedLabels dual-sync — appear in K8s labels AND cloud tags.
    - name: ac7-synced-labels-dual-sync
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac7-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  syncedLabels:
                    team: rules-team
        - script:
            content: |
              kubectl patch managedprometheusconfig ac7-cfg -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{"team":"rules-team"},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac7-ws
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac7-ws
              spec:
                configRef: ac7-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac7-ws -n managedprometheusrulegroupsnamespace 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac7-ws -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac7-rgntest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac7-ws -n managedprometheusrulegroupsnamespace \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac7-rgntest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusRuleGroupsNamespace
              metadata:
                name: ac7-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                configRef: ac7-cfg
                configuration: "groups:\n  - name: test\n    rules: []"
                workspaceRef: ac7-ws
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 10); do
                kubectl get rulegroupsnamespace ac7-rgn -n managedprometheusrulegroupsnamespace -o json 2>/dev/null > /tmp/chainsaw-ac7-rgn.json
                LABEL=$(jq -r '.metadata.labels["aws.kropath.run/team"] // empty' /tmp/chainsaw-ac7-rgn.json)
                TAG=$(jq -r '.spec.tags.team // empty' /tmp/chainsaw-ac7-rgn.json)
                [ "$LABEL" = "rules-team" ] && [ "$TAG" = "rules-team" ] && echo "PASS: dual-sync" && exit 0
                sleep 3
              done
              echo "FAIL: dual-sync not working"
              exit 1

    # AC-8: syncedAnnotations propagated to ACK child K8s annotations.
    - name: ac8-synced-annotations-propagated
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac8-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
                  syncedAnnotations:
                    owner: "rules-team"
        - script:
            content: |
              kubectl patch managedprometheusconfig ac8-cfg -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{"owner":"rules-team"}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac8-ws
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac8-ws
              spec:
                configRef: ac8-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac8-ws -n managedprometheusrulegroupsnamespace 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac8-ws -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac8-rgntest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac8-ws -n managedprometheusrulegroupsnamespace \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac8-rgntest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusRuleGroupsNamespace
              metadata:
                name: ac8-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                configRef: ac8-cfg
                configuration: "groups:\n  - name: test\n    rules: []"
                workspaceRef: ac8-ws
        - assert:
            resource:
              apiVersion: prometheusservice.services.k8s.aws/v1alpha1
              kind: RuleGroupsNamespace
              metadata:
                name: ac8-rgn
                namespace: managedprometheusrulegroupsnamespace
                annotations:
                  aws.kropath.run/owner: "rules-team"

    # AC-9: deletionPolicy=retain annotation on ACK child.
    - name: ac9-deletion-policy-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac9-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch managedprometheusconfig ac9-cfg -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac9-ws
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac9-ws
              spec:
                configRef: ac9-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac9-ws -n managedprometheusrulegroupsnamespace 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac9-ws -n managedprometheusrulegroupsnamespace \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac9-rgntest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac9-ws -n managedprometheusrulegroupsnamespace \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac9-rgntest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusRuleGroupsNamespace
              metadata:
                name: ac9-rgn
                namespace: managedprometheusrulegroupsnamespace
              spec:
                configRef: ac9-cfg
                configuration: "groups:\n  - name: test\n    rules: []"
                workspaceRef: ac9-ws
                deletionPolicy: retain
        - assert:
            resource:
              apiVersion: prometheusservice.services.k8s.aws/v1alpha1
              kind: RuleGroupsNamespace
              metadata:
                name: ac9-rgn
                namespace: managedprometheusrulegroupsnamespace
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC-10: status.status.statusCode (nested) exposed in ManagedPrometheusRuleGroupsNamespace.
    - name: ac10-nested-status-code-exposed
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac10-cfg
                namespace: managedprometheusrulegroupsnamespace
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
