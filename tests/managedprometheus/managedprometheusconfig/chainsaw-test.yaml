# aws-amp-01 Chainsaw tests -- all 6 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: managedprometheusconfig
spec:
  namespace: managedprometheusconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-managedprometheusconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: general-policy
                namespace: managedprometheusconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  alias: "prod-amp"
                defaults:
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-dual-tier-alias
      try:
        - apply:
            file: 02-invalid-dual-tier-alias.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ManagedPrometheusConfig
                check:
                  ($error != null): true

    - name: ac3-reject-dual-tier-logGroupARN
      try:
        - apply:
            file: 03-invalid-dual-tier-logGroupARN.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ManagedPrometheusConfig
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-namingTemplate
      try:
        - apply:
            file: 04-invalid-dual-tier-namingTemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ManagedPrometheusConfig
                check:
                  ($error != null): true

    - name: ac5-tags-both-tiers-accepted
      try:
        - apply:
            file: 05-tags-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: tags-both-tiers
                namespace: managedprometheusconfig
              spec:
                mandatory:
                  tags:
                    cost-centre: "platform"
                    env: "production"
                defaults:
                  tags:
                    team: "infra"
      cleanup:
        - delete:
            file: 05-tags-both-tiers.yaml

    - name: ac6-multiple-profiles-coexist
      try:
        - apply:
            file: 06-profile-general.yaml
        - apply:
            file: 07-profile-production.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: general
                namespace: managedprometheusconfig
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: production
                namespace: managedprometheusconfig
              spec:
                mandatory:
                  alias: "prod-amp"
      cleanup:
        - delete:
            file: 07-profile-production.yaml
        - delete:
            file: 06-profile-general.yaml
        - delete:
            file: 00-managedprometheusconfig-namespace.yaml
