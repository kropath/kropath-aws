# aws-amp-01 Chainsaw tests -- all 6 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: managedprometheusconfig
spec:
  namespace: managedprometheusconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-managedprometheusconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: general-policy
                namespace: managedprometheusconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  alias: "prod-amp"
        # The fixture sets ONLY spec.mandatory.alias. Every other scalar field must come
        # back absent -- a scalar `default:` on a mandatory/defaults tier field would
        # materialise a value here and break the mutual-exclusion rules.
        - script:
            content: |
              # NOTE: chainsaw runs `- script:` under /usr/bin/sh, which is dash on the
              # CI runner -- `set -o pipefail` is a bashism and aborts the step there.
              # Capture kubectl output first so a kubectl failure still trips `set -e`.
              set -eu
              json=$(kubectl get managedprometheusconfig general-policy \
                -n managedprometheusconfig -o json)
              missing=$(printf '%s' "$json" | jq -r '
                  [ (.spec.mandatory.logGroupARN // empty | "mandatory.logGroupARN"),
                    (.spec.mandatory.namingTemplate // empty | "mandatory.namingTemplate"),
                    (.spec.defaults.alias // empty | "defaults.alias"),
                    (.spec.defaults.logGroupARN // empty | "defaults.logGroupARN"),
                    (.spec.defaults.namingTemplate // empty | "defaults.namingTemplate")
                  ] | join(",")')
              if [ -n "$missing" ]; then
                echo "unset fields were materialised by schema defaults: $missing" >&2
                exit 1
              fi
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-dual-tier-alias
      try:
        - apply:
            file: 02-invalid-dual-tier-alias.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ManagedPrometheusConfig
                check:
                  ($error != null): true

    - name: ac3-reject-dual-tier-logGroupARN
      try:
        - apply:
            file: 03-invalid-dual-tier-logGroupARN.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ManagedPrometheusConfig
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-namingTemplate
      try:
        - apply:
            file: 04-invalid-dual-tier-namingTemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: ManagedPrometheusConfig
                check:
                  ($error != null): true

    # Regression guard for the scalar-default bug: setting ONLY the mandatory tier's
    # namingTemplate must be accepted. With a schema default on
    # spec.defaults.namingTemplate this apply is rejected by the ac4 CEL rule.
    - name: mandatory-only-namingTemplate-accepted
      try:
        - apply:
            file: 08-mandatory-only-namingTemplate.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: mandatory-only-naming
                namespace: managedprometheusconfig
              spec:
                mandatory:
                  namingTemplate: "{namespace}-mandatory-{name}"
        - script:
            content: |
              # See the ac1 step: /usr/bin/sh on CI is dash, so no `set -o pipefail`.
              set -eu
              json=$(kubectl get managedprometheusconfig mandatory-only-naming \
                -n managedprometheusconfig -o json)
              got=$(printf '%s' "$json" | jq -r '.spec.defaults.namingTemplate // "<unset>"')
              if [ "$got" != "<unset>" ]; then
                echo "spec.defaults.namingTemplate materialised as '$got'; expected unset" >&2
                exit 1
              fi
      cleanup:
        - delete:
            file: 08-mandatory-only-namingTemplate.yaml

    - name: ac5-tags-both-tiers-accepted
      try:
        - apply:
            file: 05-tags-both-tiers.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: tags-both-tiers
                namespace: managedprometheusconfig
              spec:
                mandatory:
                  tags:
                    cost-centre: "platform"
                    env: "production"
                defaults:
                  tags:
                    team: "infra"
      cleanup:
        - delete:
            file: 05-tags-both-tiers.yaml

    - name: ac6-multiple-profiles-coexist
      try:
        - apply:
            file: 06-profile-general.yaml
        - apply:
            file: 07-profile-production.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: general
                namespace: managedprometheusconfig
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: production
                namespace: managedprometheusconfig
              spec:
                mandatory:
                  alias: "prod-amp"
      cleanup:
        - delete:
            file: 07-profile-production.yaml
        - delete:
            file: 06-profile-general.yaml
        - delete:
            file: 00-managedprometheusconfig-namespace.yaml
