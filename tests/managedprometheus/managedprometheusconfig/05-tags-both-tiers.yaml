# AC-5: tags may be set in BOTH tiers (map fields are additive, not mutually exclusive).
---
apiVersion: aws.kropath.run/v1alpha1
kind: ManagedPrometheusConfig
metadata:
  name: tags-both-tiers
  namespace: managedprometheusconfig
  labels:
    aws.kropath.run/resource-name: tags-both-tiers
spec:
  mandatory:
    tags:
      cost-centre: "platform"
      env: "production"
  defaults:
    tags:
      team: "infra"
