                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"arn:aws:logs:us-east-1:123456789012:log-group:mandatory-group","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
