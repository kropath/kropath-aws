              done
              kubectl patch workspace ac4-ws -n managedprometheusloggingconfiguration \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac4-lctest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac4-ws -n managedprometheusloggingconfiguration \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac4-lctest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusLoggingConfiguration
              metadata:
                name: ac4-lc
                namespace: managedprometheusloggingconfiguration
              spec:
                configRef: ac4-cfg
                workspaceRef: ac4-ws
                logGroupARN: "arn:aws:logs:us-east-1:123456789012:log-group:instance-group"
        - assert:
            resource:
              apiVersion: prometheusservice.services.k8s.aws/v1alpha1
