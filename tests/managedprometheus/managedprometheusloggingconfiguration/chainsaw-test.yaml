        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusLoggingConfiguration
              metadata:
                name: ac11-lc
                namespace: managedprometheusloggingconfiguration
              spec:
                configRef: ac11-cfg
                workspaceRef: ac11-ws
                logGroupARN: "arn:aws:logs:us-east-1:123456789012:log-group:test"
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get loggingconfiguration ac11-lc -n managedprometheusloggingconfiguration 2>/dev/null && break
                sleep 2
              done
              kubectl patch loggingconfiguration ac11-lc -n managedprometheusloggingconfiguration \
                --subresource=status --type=merge \
                -p '{"status":{"statusCode":"ACTIVE"}}'
        - script:
            timeout: 30s
            content: |
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusloggingconfiguration ac11-lc \
                  -n managedprometheusloggingconfiguration \
                  -o jsonpath='{.status.statusCode}' 2>/dev/null)
                [ "$VAL" = "ACTIVE" ] && echo "PASS: statusCode=ACTIVE propagated" && exit 0
                sleep 2
              done
              echo "FAIL: statusCode not propagated"
              exit 1
