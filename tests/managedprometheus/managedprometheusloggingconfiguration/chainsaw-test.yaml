        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac6-ws
                namespace: managedprometheusloggingconfiguration
                labels:
                  aws.kropath.run/resource-name: ac6-ws
              spec:
                configRef: ac6-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac6-ws -n managedprometheusloggingconfiguration 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac6-ws -n managedprometheusloggingconfiguration \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac6-lctest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac6-ws -n managedprometheusloggingconfiguration \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac6-lctest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusLoggingConfiguration
              metadata:
                name: ac6-lc
                namespace: managedprometheusloggingconfiguration
              spec:
                configRef: ac6-cfg
                workspaceRef: ac6-ws
                # No instance logGroupARN — falls back to defaults
        - assert:
            resource:
              apiVersion: prometheusservice.services.k8s.aws/v1alpha1
              kind: LoggingConfiguration
              metadata:
                name: ac6-lc
                namespace: managedprometheusloggingconfiguration
              spec:
                logGroupARN: "arn:aws:logs:us-east-1:123456789012:log-group:defaults-group"

    # AC-7: Tag exemption — no spec.tags field in ManagedPrometheusLoggingConfiguration schema.
    - name: ac7-tag-exemption-no-tags-field
      try:
        - script:
            content: |
              FIELD=$(kubectl get crd managedprometheusloggingconfigurations.aws.kropath.run \
                -o jsonpath='{.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.tags}' 2>/dev/null)
              [ -z "$FIELD" ] && echo "PASS: no tags field in schema" && exit 0
              echo "FAIL: tags field unexpectedly present"
              exit 1

    # AC-8: syncedLabels propagated to ACK child K8s labels with aws.kropath.run/ prefix.
    - name: ac8-synced-labels-propagated
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac8-cfg
