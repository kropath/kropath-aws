# Tag exemption: LoggingConfiguration has no spec.tags (upstream ACK CRD has no tags field).
# Naming exemption (KRO-236): no effectiveName/nameOverride (singleton per workspace).
# logGroupARN governance: mandatory > instance > defaults.
# Flat status: status.statusCode (not nested status.status.statusCode).
# Canonical pattern: unique name per step, skipDelete: true, no inter-step ACK deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: managedprometheusloggingconfiguration
spec:
  skipDelete: true
  namespace: managedprometheusloggingconfiguration
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: ACK LoggingConfiguration NOT created when workspaceRef is empty.
    - name: ac1-no-cr-when-workspaceref-empty
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac1-cfg
                namespace: managedprometheusloggingconfiguration
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec: {}
        - script:
            content: |
              kubectl patch managedprometheusconfig ac1-cfg -n managedprometheusloggingconfiguration \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusLoggingConfiguration
              metadata:
                name: ac1-lc
                namespace: managedprometheusloggingconfiguration
              spec:
                configRef: ac1-cfg
                logGroupARN: "arn:aws:logs:us-east-1:123456789012:log-group:test"
                # workspaceRef empty — ACK child must NOT be created
        - script:
            timeout: 15s
            content: |
              sleep 5
              COUNT=$(kubectl get loggingconfiguration ac1-lc -n managedprometheusloggingconfiguration 2>/dev/null | wc -l)
              [ "$COUNT" -eq 0 ] && echo "PASS: ACK child not created" && exit 0
              echo "FAIL: ACK child was created unexpectedly"
              exit 1

    # AC-2: ACK LoggingConfiguration NOT created when workspace has no workspaceID.
    - name: ac2-no-cr-when-workspace-has-no-id
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac2-cfg
                namespace: managedprometheusloggingconfiguration
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec: {}
        - script:
            content: |
              kubectl patch managedprometheusconfig ac2-cfg -n managedprometheusloggingconfiguration \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac2-ws
                namespace: managedprometheusloggingconfiguration
                labels:
                  aws.kropath.run/resource-name: ac2-ws
              spec:
                configRef: ac2-cfg
            # No status.workspaceID patched — workspace has no ID yet
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusLoggingConfiguration
              metadata:
                name: ac2-lc
                namespace: managedprometheusloggingconfiguration
              spec:
                configRef: ac2-cfg
                logGroupARN: "arn:aws:logs:us-east-1:123456789012:log-group:test"
                workspaceRef: ac2-ws
        - script:
            timeout: 15s
            content: |
              sleep 5
              COUNT=$(kubectl get loggingconfiguration ac2-lc -n managedprometheusloggingconfiguration 2>/dev/null | wc -l)
              [ "$COUNT" -eq 0 ] && echo "PASS: ACK child not created (no workspaceID)" && exit 0
              echo "FAIL: ACK child created despite no workspaceID"
              exit 1

    # AC-3: ACK LoggingConfiguration NOT created when logGroupARN absent in all tiers.
    - name: ac3-no-cr-when-log-group-arn-missing
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
              metadata:
                name: ac3-cfg
                namespace: managedprometheusloggingconfiguration
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec: {}
        - script:
            content: |
              kubectl patch managedprometheusconfig ac3-cfg -n managedprometheusloggingconfiguration \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"alias":"","logGroupARN":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusWorkspace
              metadata:
                name: ac3-ws
                namespace: managedprometheusloggingconfiguration
                labels:
                  aws.kropath.run/resource-name: ac3-ws
              spec:
                configRef: ac3-cfg
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get workspace ac3-ws -n managedprometheusloggingconfiguration 2>/dev/null && break
                sleep 2
              done
              kubectl patch workspace ac3-ws -n managedprometheusloggingconfiguration \
                --subresource=status --type=merge \
                -p '{"status":{"workspaceID":"ws-ac3-lctest"}}'
              for i in $(seq 1 15); do
                VAL=$(kubectl get managedprometheusworkspace ac3-ws -n managedprometheusloggingconfiguration \
                  -o jsonpath='{.status.workspaceID}' 2>/dev/null)
                [ "$VAL" = "ws-ac3-lctest" ] && break
                sleep 2
              done
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusLoggingConfiguration
              metadata:
                name: ac3-lc
                namespace: managedprometheusloggingconfiguration
              spec:
                configRef: ac3-cfg
                workspaceRef: ac3-ws
                # logGroupARN empty in spec, mandatory, and defaults — ACK child NOT created
        - script:
            timeout: 15s
            content: |
              sleep 5
              COUNT=$(kubectl get loggingconfiguration ac3-lc -n managedprometheusloggingconfiguration 2>/dev/null | wc -l)
              [ "$COUNT" -eq 0 ] && echo "PASS: ACK child not created (no logGroupARN)" && exit 0
              echo "FAIL: ACK child created despite no logGroupARN"
              exit 1

    # AC-4: logGroupARN governance — instance spec.logGroupARN used when mandatory absent.
    - name: ac4-instance-log-group-arn-used
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: ManagedPrometheusConfig
