                name: ac4-lc
                namespace: managedprometheusloggingconfiguration
              spec:
                logGroupARN: "arn:aws:logs:us-east-1:123456789012:log-group:instance-group"
                workspaceID: "ws-ac4-lctest"

    # AC-5: mandatory.logGroupARN overrides instance spec.logGroupARN.
    - name: ac5-mandatory-log-group-arn-wins
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
