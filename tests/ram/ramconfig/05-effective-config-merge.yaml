# AC-5 fixture: base CR for effective-config-merge test.
# Controller will simulate writing effectiveConfig with mandatory.allowExternalPrincipals: false
# (from KropathConfig.mandatory.ram) and defaults.allowExternalPrincipals: true (from this CR).
---
apiVersion: aws.kropath.run/v1alpha1
kind: RAMConfig
metadata:
  name: effective-config-merge-test
  namespace: ramconfig
  labels:
    aws.kropath.run/resource-name: effective-config-merge-test
    app.kubernetes.io/managed-by: kropath
spec:
  mandatory:
    allowedResourceTypes: []
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    allowExternalPrincipals: true
    allowedResourceTypes: []
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
