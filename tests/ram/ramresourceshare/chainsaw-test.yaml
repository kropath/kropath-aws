                --subresource=status --type=merge \
                -p '{"status":{"ackResourceMetadata":{"arn":"arn:aws:ram:ap-southeast-2:123456789012:resource-share/ac20-uuid-1","ownerAccountID":"123456789012","region":"ap-southeast-2"},"status":"ACTIVE"}}'
        - assert:
