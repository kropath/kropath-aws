# aws-ram-03 Chainsaw tests — one scenario per acceptance criterion (23 ACs).
#
# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named RAMConfig + RAMResourceShare and deletes
# nothing between steps.
#
# Two ACs deviate from the spec's wording, deliberately and identically:
#   AC-9  (permissionARNs/permissionRefs mutual exclusivity) and
#   AC-10 (allowedResourceTypes enforcement)
# are specified as `x-kubernetes-validations` rejections at admission time. kro v0.9.2
# regenerates the CRD from the RGD schema and discards hand-authored CEL rules
# (docs/frequent-rgd-errors.md §"x-kubernetes-validations Cannot Be Auto-Generated by kro
# v0.9.2"), so both are implemented with the in-graph advisory pattern instead. The CR is
# accepted, `status.validationError` carries the spec's message, and the ACK child — hence
# the cloud resource — is never created. The asserts below check that outcome rather than
# `($error != null)`.
#
# ACK spec.tags is a CEL .merge().transformList() product — asserted with jq scripts, never
# positionally (docs/frequent-rgd-errors.md §6 "Flaky List/Array Asserts").
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ramresourceshare
spec:
  skipDelete: true
  namespace: ramresourceshare
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ── AC-1: happy-path: defaults-create ──────────────────────────────────
    - name: ac1-defaults-create
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac1-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
                  allowExternalPrincipals: false
        - script:
            content: |
              kubectl patch ramconfig ac1-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowExternalPrincipals":false,"allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac1-vpc-share
                namespace: ramresourceshare
              spec:
                configRef: ac1-cfg
                resourceARNs:
                  - arn:aws:ec2:us-east-1:111122223333:subnet/subnet-abc
                principals:
                  - "222233334444"
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac1-vpc-share
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac1-vpc-share
                allowExternalPrincipals: false
                resourceARNs:
                  - arn:aws:ec2:us-east-1:111122223333:subnet/subnet-abc
                principals:
                  - "222233334444"
            timeout: 90s

    # ── AC-2: happy-path: name-override ────────────────────────────────────
    - name: ac2-name-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac2-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
                  allowExternalPrincipals: false
        - script:
            content: |
              kubectl patch ramconfig ac2-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowExternalPrincipals":false,"allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac2-override
                namespace: ramresourceshare
              spec:
                configRef: ac2-cfg
                nameOverride: custom-share
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac2-override
                namespace: ramresourceshare
              status:
                resourceName: custom-share
                namingStatus: valid
            timeout: 90s
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac2-override
                namespace: ramresourceshare
              spec:
                name: custom-share
            timeout: 90s

    # ── AC-3: happy-path: mandatory-external-principals ────────────────────
    # mandatory.allowExternalPrincipals=false beats an explicit instance true.
    - name: ac3-mandatory-external-principals
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac3-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  allowExternalPrincipals: false
                defaults:
                  namingTemplate: '{namespace}-{name}'
        - script:
            content: |
              kubectl patch ramconfig ac3-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowExternalPrincipals":false,"allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac3-mandatory-ext
                namespace: ramresourceshare
              spec:
                configRef: ac3-cfg
                allowExternalPrincipals: true
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac3-mandatory-ext
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac3-mandatory-ext
                allowExternalPrincipals: false
            timeout: 90s

    # ── AC-4: happy-path: instance-external-principals ─────────────────────
    # No mandatory value → the explicit instance true beats defaults false.
    - name: ac4-instance-external-principals
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac4-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
                  allowExternalPrincipals: false
        - script:
            content: |
              kubectl patch ramconfig ac4-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowExternalPrincipals":false,"allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac4-instance-ext
                namespace: ramresourceshare
              spec:
                configRef: ac4-cfg
                allowExternalPrincipals: true
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac4-instance-ext
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac4-instance-ext
                allowExternalPrincipals: true
            timeout: 90s

    # ── AC-5: happy-path: nil-external-principals-cascade ──────────────────
    # Instance leaves the pointer nil → defaults win.
    - name: ac5-nil-external-principals-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac5-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
                  allowExternalPrincipals: false
        - script:
            content: |
              kubectl patch ramconfig ac5-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowExternalPrincipals":false,"allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac5-nil-ext
                namespace: ramresourceshare
              spec:
                configRef: ac5-cfg
                # allowExternalPrincipals intentionally unset (nil pointer)
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac5-nil-ext
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac5-nil-ext
                allowExternalPrincipals: false
            timeout: 90s
        - script:
            content: |
              set -eu
              SET=$(kubectl get ramresourceshare ac5-nil-ext -n ramresourceshare -o json \
                | jq 'has("spec") and (.spec | has("allowExternalPrincipals"))')
              [ "$SET" = "false" ] || { echo "FAIL: instance must not materialise allowExternalPrincipals when unset"; exit 1; }

    # ── AC-6: happy-path: kropathconfig-mandatory-override ─────────────────
    # KropathConfig.mandatory.ram.allowExternalPrincipals=false reaches the RGD through
    # effectiveConfig.mandatory (the controller pre-merges org-wide into per-type), so it
    # outranks RAMConfig.defaults=true AND the instance's explicit true.
    - name: ac6-kropathconfig-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac6-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
                  allowExternalPrincipals: true
        - script:
            content: |
              kubectl patch ramconfig ac6-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowExternalPrincipals":false,"allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowExternalPrincipals":true,"allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac6-org-override
                namespace: ramresourceshare
              spec:
                configRef: ac6-cfg
                allowExternalPrincipals: true
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac6-org-override
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac6-org-override
                allowExternalPrincipals: false
            timeout: 90s

    # ── AC-7: happy-path: permission-arns ──────────────────────────────────
    - name: ac7-permission-arns
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac7-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
        - script:
            content: |
              kubectl patch ramconfig ac7-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac7-permission-arns
                namespace: ramresourceshare
              spec:
                configRef: ac7-cfg
                permissionARNs:
                  - arn:aws:ram::111122223333:permission/abc-123
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac7-permission-arns
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac7-permission-arns
                permissionARNs:
                  - arn:aws:ram::111122223333:permission/abc-123
            timeout: 90s

    # ── AC-8: happy-path: permission-refs ──────────────────────────────────
    # An in-cluster RAMPermission is referenced by name; the RGD passes the ACK reference
    # wrapper ({from: {name}}) straight through to the child ResourceShare.
    - name: ac8-permission-refs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac8-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
        - script:
            content: |
              kubectl patch ramconfig ac8-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMPermission
              metadata:
                name: ac8-subnet-readonly
                namespace: ramresourceshare
              spec:
                configRef: ac8-cfg
                policyTemplate: '{"Effect":"ALLOW","Action":["ec2:DescribeSubnets"]}'
                resourceType: 'ec2:Subnet'
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: Permission
              metadata:
                name: ac8-subnet-readonly
                namespace: ramresourceshare
            timeout: 90s
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac8-permission-refs
                namespace: ramresourceshare
              spec:
                configRef: ac8-cfg
                permissionRefs:
                  - from:
                      name: ac8-subnet-readonly
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac8-permission-refs
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac8-permission-refs
                permissionRefs:
                  - from:
                      name: ac8-subnet-readonly
            timeout: 90s

    # ── AC-9: negative: dual-permission-fields ─────────────────────────────
    # See the header note: advisory ConfigMap + gated child, not admission rejection.
    - name: ac9-dual-permission-fields
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac9-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: '{namespace}-{name}'
        - script:
            content: |
              kubectl patch ramconfig ac9-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac9-dual-permission
                namespace: ramresourceshare
              spec:
                configRef: ac9-cfg
                permissionARNs:
                  - arn:aws:ram::111122223333:permission/abc-123
                permissionRefs:
                  - from:
                      name: ac8-subnet-readonly
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac9-dual-permission
                namespace: ramresourceshare
              status:
                validationError: permissionARNs and permissionRefs are mutually exclusive
            timeout: 90s
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac9-dual-permission-validation-error
                namespace: ramresourceshare
              data:
                error: permissionARNs and permissionRefs are mutually exclusive
            timeout: 90s
        - script:
            content: |
              set -eu
              sleep 5
              COUNT=$(kubectl get resourceshares.ram.services.k8s.aws ac9-dual-permission -n ramresourceshare \
                --ignore-not-found --no-headers 2>/dev/null | wc -l | tr -d ' ')
              [ "$COUNT" = "0" ] || { echo "FAIL: child ResourceShare must not exist when both permission fields are set"; exit 1; }

    # ── AC-10: negative: disallowed-resource-type ──────────────────────────
    # allowlist is ec2:Subnet; the instance shares a transit-gateway ARN. The CamelCase
    # config token is matched against the hyphenated lower-case ARN segment after both are
    # lower-cased and stripped of "-" (spec OQ-1).
    - name: ac10-disallowed-resource-type
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac10-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  allowedResourceTypes:
                    - 'ec2:Subnet'
                defaults:
                  namingTemplate: '{namespace}-{name}'
        - script:
            content: |
              kubectl patch ramconfig ac10-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":["ec2:Subnet"],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac10-disallowed-type
                namespace: ramresourceshare
              spec:
                configRef: ac10-cfg
                resourceARNs:
                  - arn:aws:ec2:us-east-1:111122223333:transit-gateway/tgw-abc
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac10-disallowed-type
                namespace: ramresourceshare
              status:
                validationError: resourceARNs contains resource types not in the allowed list
            timeout: 90s
        - script:
            content: |
              set -eu
              sleep 5
              COUNT=$(kubectl get resourceshares.ram.services.k8s.aws ac10-disallowed-type -n ramresourceshare \
                --ignore-not-found --no-headers 2>/dev/null | wc -l | tr -d ' ')
              [ "$COUNT" = "0" ] || { echo "FAIL: child ResourceShare must not exist for a disallowed resource type"; exit 1; }

    # ── AC-11: happy-path: allowed-resource-type ───────────────────────────
    - name: ac11-allowed-resource-type
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac11-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory:
                  allowedResourceTypes:
                    - 'ec2:Subnet'
                    - 'ec2:TransitGateway'
                defaults:
                  namingTemplate: '{namespace}-{name}'
        - script:
            content: |
              kubectl patch ramconfig ac11-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":["ec2:Subnet","ec2:TransitGateway"],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac11-allowed-type
                namespace: ramresourceshare
              spec:
                configRef: ac11-cfg
                resourceARNs:
                  - arn:aws:ec2:us-east-1:111122223333:subnet/subnet-abc
                  - arn:aws:ec2:us-east-1:111122223333:transit-gateway/tgw-abc
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac11-allowed-type
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac11-allowed-type
            timeout: 90s
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac11-allowed-type
                namespace: ramresourceshare
              status:
                namingStatus: valid
            timeout: 90s

    # ── AC-12: happy-path: tag-merge ───────────────────────────────────────
    - name: ac12-tag-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac12-cfg
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                mandatory:
                  tags:
                    family: ram
                defaults:
                  namingTemplate: '{namespace}-{name}'
        - script:
            content: |
              kubectl patch ramconfig ac12-cfg -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":[],"tags":{"cost-centre":"shared-services","family":"ram"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"{namespace}-{name}","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac12-tag-merge
                namespace: ramresourceshare
              spec:
                configRef: ac12-cfg
                tags:
                  team: networking
                  cost-centre: instance-value-must-lose
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac12-tag-merge
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac12-tag-merge
            timeout: 90s
        - script:
            content: |
              set -eu
              TAGS=$(kubectl get resourceshares.ram.services.k8s.aws ac12-tag-merge -n ramresourceshare -o json | jq -c '.spec.tags')
              COUNT=$(echo "$TAGS" | jq 'length')
              [ "$COUNT" -eq 3 ] || { echo "FAIL: expected 3 tags, got $COUNT: $TAGS"; exit 1; }
              echo "$TAGS" | jq -e 'any(.key == "cost-centre" and .value == "shared-services")' >/dev/null || { echo "FAIL: mandatory cost-centre did not win: $TAGS"; exit 1; }
