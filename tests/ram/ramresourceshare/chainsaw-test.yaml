    # ── AC-22: happy-path: configref-fallthrough ───────────────────────────
    # Same deliberate deviation as rampermission AC-12: ADR-015 §3.4 profile fallthrough is
    # a kropath-controller behaviour. The RGD does ONE externalRef lookup (repo-wide
    # single-effCfg rule), so this step asserts what the RGD owns — (a) an omitted configRef
    # resolves the "general-policy"-labelled RAMConfig, and (b) an unknown configRef does not
    # stall the instance; it reconciles against the built-in "{namespace}-{name}" fallback.
    - name: ac22-configref-fallthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac22-general-policy
                namespace: ramresourceshare
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  namingTemplate: 'gp-{namespace}-{name}'
        - script:
            content: |
              kubectl patch ramconfig ac22-general-policy -n ramresourceshare \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"namingTemplate":"","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"namingTemplate":"gp-{namespace}-{name}","allowedResourceTypes":[],"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac22-default-ref
                namespace: ramresourceshare
              spec: {}
              # spec.configRef omitted → defaults to "general-policy"
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac22-default-ref
                namespace: ramresourceshare
              spec:
                name: gp-ramresourceshare-ac22-default-ref
            timeout: 90s
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMResourceShare
              metadata:
                name: ac22-unknown-ref
                namespace: ramresourceshare
              spec:
                configRef: nonexistent-profile
        - assert:
            resource:
              apiVersion: ram.services.k8s.aws/v1alpha1
              kind: ResourceShare
              metadata:
                name: ac22-unknown-ref
                namespace: ramresourceshare
              spec:
                name: ramresourceshare-ac22-unknown-ref
            timeout: 90s

