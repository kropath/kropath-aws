    # patched by hand (docs/frequent-rgd-errors.md §"Simulating ACK Status: Patch the ACK
    # CHILD"). All three ackResourceMetadata fields are required by the ACK CRD.
    - name: ac20-arn-status-exposure
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RAMConfig
              metadata:
                name: ac20-cfg
