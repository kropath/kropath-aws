# aws-eventbridge-02 Chainsaw tests -- 15 acceptance criteria for EventBridgeEventBus.
# Namespace: eventbridgeeventbus. Default naming: {namespace}-{name} => eventbridgeeventbus-<cr-name>.
#
# CANONICAL pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource name, and
# deletes NOTHING between steps (spec.skipDelete is the global default). The test cluster runs
# kro but no ACK controllers, so a shared config mutated across steps would re-reconcile every
# persisted instance and cross-contaminate later assertions; per-step configs avoid that.
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock kropath-controller.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eventbridgeeventbus
spec:
  namespace: eventbridgeeventbus
  steps:
    # ── AC-1/AC-2: basic creation + default naming template {namespace}-{name} ──
    - name: ac1-ac2-creation-and-default-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac1-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: create-default
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: EventBus
              metadata:
                name: create-default
              spec:
                name: eventbridgeeventbus-create-default
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: create-default
              status:
                resourceName: eventbridgeeventbus-create-default
                namingStatus: valid

    # ── AC-3: nameOverride takes precedence over naming template ────────────
    - name: ac3-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac3-cfg
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac3-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: override-test
              spec:
                configRef: ac3-cfg
                nameOverride: "my-custom-bus"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: EventBus
              metadata:
                name: override-test
              spec:
                name: my-custom-bus
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: override-test
              status:
                resourceName: my-custom-bus

    # ── AC-4: mandatory namingTemplate wins over defaults namingTemplate ────
    - name: ac4-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac4-cfg
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "corp-{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac4-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: naming-mandatory
              spec:
                configRef: ac4-cfg
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: EventBus
              metadata:
                name: naming-mandatory
              spec:
                name: corp-eventbridgeeventbus-naming-mandatory
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: naming-mandatory
              status:
                resourceName: corp-eventbridgeeventbus-naming-mandatory

    # ── AC-5: unresolved {tag.X} token → namingStatus=invalid, no ACK EventBus ─
    - name: ac5-naming-unresolved-tokens
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac5-cfg
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{tag.unknown}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac5-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{tag.unknown}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: naming-unresolved
              spec:
                configRef: ac5-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: naming-unresolved
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              # ACK EventBus must NOT be created when naming is invalid. Give kro a moment,
              # then confirm the child never appears.
              sleep 10
              if kubectl get eventbuses.eventbridge.services.k8s.aws naming-unresolved -n eventbridgeeventbus 2>/dev/null | grep -q "naming-unresolved"; then
                echo "FAIL: EventBus should not exist with invalid naming"
                exit 1
              fi
              echo "PASS: EventBus not created as expected"

    # ── AC-6: effectiveName == "default" → validationError, no ACK EventBus ─
    - name: ac6-naming-reserved-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac6-cfg
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac6-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: reserved-default
              spec:
                configRef: ac6-cfg
                nameOverride: "default"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: reserved-default
              status:
                resourceName: default
                (validationError != ""): true
        - script:
            content: |
              # ACK EventBus must NOT be created for reserved name "default".
              sleep 10
              if kubectl get eventbuses.eventbridge.services.k8s.aws reserved-default -n eventbridgeeventbus 2>/dev/null | grep -q "reserved-default"; then
                echo "FAIL: EventBus should not exist — 'default' is reserved"
                exit 1
              fi
              echo "PASS: EventBus not created as expected"

    # ── AC-7: predictedArn computed correctly ─────────────────────────────
    - name: ac7-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac7-cfg
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac7-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: predicted-arn-test
              spec:
                configRef: ac7-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: predicted-arn-test
              status:
                predictedArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/eventbridgeeventbus-predicted-arn-test"

    # ── AC-8..11: tags cascade (defaults < spec < mandatory) + [{key,value}] format ─
    - name: ac8-ac11-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac8-cfg
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {env: prod, cost-centre: platform}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {env: dev, team: infra}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac8-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{"env":"prod","cost-centre":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{"env":"dev","team":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: tags-cascade
              spec:
                configRef: ac8-cfg
                tags:
                  env: staging
                  service: payments
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: EventBus
              metadata:
                name: tags-cascade
        - script:
            content: |
              # Poll until kro has reconciled the child EventBus, then verify tags
              # (order-independent) via jq. mandatory wins: env=prod.
              for _ in $(seq 1 60); do
                kubectl get eventbuses.eventbridge.services.k8s.aws tags-cascade -n eventbridgeeventbus >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get eventbuses.eventbridge.services.k8s.aws tags-cascade -n eventbridgeeventbus -o json | jq -r '.spec.tags')
              echo "Tags: $TAGS"
              ENV=$(echo "$TAGS" | jq -r '.[] | select(.key == "env") | .value')
              [ "$ENV" = "prod" ] || { echo "FAIL: env=$ENV, expected prod (mandatory wins)"; exit 1; }
              TEAM=$(echo "$TAGS" | jq -r '.[] | select(.key == "team") | .value')
              [ "$TEAM" = "infra" ] || { echo "FAIL: team=$TEAM, expected infra (from defaults)"; exit 1; }
              COST=$(echo "$TAGS" | jq -r '.[] | select(.key == "cost-centre") | .value')
              [ "$COST" = "platform" ] || { echo "FAIL: cost-centre=$COST, expected platform (from mandatory)"; exit 1; }
              SVC=$(echo "$TAGS" | jq -r '.[] | select(.key == "service") | .value')
              [ "$SVC" = "payments" ] || { echo "FAIL: service=$SVC, expected payments (from instance spec)"; exit 1; }
              BAD_COUNT=$(echo "$TAGS" | jq '[.[] | select((has("key") and has("value")) | not)] | length')
              [ "$BAD_COUNT" = "0" ] || { echo "FAIL: $BAD_COUNT tags missing key or value field"; exit 1; }
              echo "PASS: all tags verified (cascade order and format)"

    # ── AC-12: syncedLabels dual-written to K8s labels AND to cloud tags ──
    - name: ac12-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac12-cfg
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac12-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: synced-labels
              spec:
                configRef: ac12-cfg
                syncedLabels:
                  app-owner: platform
                  tier: standard
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: EventBus
              metadata:
                name: synced-labels
                labels:
                  aws.kropath.run/app-owner: platform
                  aws.kropath.run/tier: standard
        - script:
            content: |
              for _ in $(seq 1 60); do
                kubectl get eventbuses.eventbridge.services.k8s.aws synced-labels -n eventbridgeeventbus >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get eventbuses.eventbridge.services.k8s.aws synced-labels -n eventbridgeeventbus -o json | jq -r '.spec.tags')
              OWNER=$(echo "$TAGS" | jq -r '.[] | select(.key == "app-owner") | .value')
              [ "$OWNER" = "platform" ] || { echo "FAIL: app-owner=$OWNER in cloud tags, expected platform"; exit 1; }
              TIER=$(echo "$TAGS" | jq -r '.[] | select(.key == "tier") | .value')
              [ "$TIER" = "standard" ] || { echo "FAIL: tier=$TIER in cloud tags, expected standard"; exit 1; }
              echo "PASS: syncedLabels dual-written to K8s labels and cloud tags"

    # ── AC-13: deletionPolicy annotation set correctly on ACK EventBus ────
    - name: ac13-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac13-cfg
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac13-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: deletion-policy-test
              spec:
                configRef: ac13-cfg
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: EventBus
              metadata:
                name: deletion-policy-test
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # ── AC-14: configRef selects correct EventBridgeConfig ──
    - name: ac14-config-profile-selection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: team-policy
                labels:
                  aws.kropath.run/resource-name: team-policy
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "team-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig team-policy -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"team-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: config-select
              spec:
                configRef: team-policy
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: EventBus
              metadata:
                name: config-select
              spec:
                name: team-config-select
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: config-select
              status:
                resourceName: team-config-select

    # ── AC-15: standard K8s metadata wiring (managed-by, instance, ownerRef) ─
    - name: ac15-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac15-cfg
                labels:
                  aws.kropath.run/resource-name: ac15-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac15-cfg -n eventbridgeeventbus --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: metadata-test
              spec:
                configRef: ac15-cfg
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: EventBus
              metadata:
                name: metadata-test
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: metadata-test
        - script:
            content: |
              for _ in $(seq 1 60); do
                kubectl get eventbuses.eventbridge.services.k8s.aws metadata-test -n eventbridgeeventbus >/dev/null 2>&1 && break
                sleep 1
              done
              OWNER_KIND=$(kubectl get eventbuses.eventbridge.services.k8s.aws metadata-test -n eventbridgeeventbus -o jsonpath='{.metadata.ownerReferences[0].kind}')
              [ "$OWNER_KIND" = "EventBridgeEventBus" ] || { echo "FAIL: ownerReference kind=$OWNER_KIND"; exit 1; }
              OWNER_NAME=$(kubectl get eventbuses.eventbridge.services.k8s.aws metadata-test -n eventbridgeeventbus -o jsonpath='{.metadata.ownerReferences[0].name}')
              [ "$OWNER_NAME" = "metadata-test" ] || { echo "FAIL: ownerReference name=$OWNER_NAME"; exit 1; }
              CONTROLLER=$(kubectl get eventbuses.eventbridge.services.k8s.aws metadata-test -n eventbridgeeventbus -o jsonpath='{.metadata.ownerReferences[0].controller}')
              [ "$CONTROLLER" = "true" ] || { echo "FAIL: ownerReference controller=$CONTROLLER"; exit 1; }
              echo "PASS: standard metadata wiring verified"
