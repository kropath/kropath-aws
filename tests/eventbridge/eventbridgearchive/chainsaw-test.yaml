# aws-eventbridge-04 Chainsaw tests -- 21 acceptance criteria for EventBridgeArchive.
# Namespace: eventbridgearchive. Default naming: {namespace}-{name} => eventbridgearchive-<cr-name>.
# eventBusRef tests create an EventBridgeEventBus in this namespace to supply status.predictedArn.
# No tags field on EventBridgeArchive (ACK Archive does not support tags).
#
# CANONICAL pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource name, and
# deletes NOTHING between steps (spec.skipDelete is the global default). The test cluster runs
# kro but no ACK controllers, so a shared config mutated across steps would re-reconcile every
# persisted instance and cross-contaminate later assertions; per-step configs avoid that.
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock kropath-controller.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eventbridgearchive
spec:
  namespace: eventbridgearchive
  steps:
    # ── AC-1: creation with eventBusArn direct ───────────────────────────
    # ── AC-3: default naming {namespace}-{name} ───────────────────────────
    # ── AC-11: ACK Archive spec.archiveName set from effectiveName ─────────
    - name: ac1-ac3-ac11-creation-event-bus-arn-default-naming
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac1-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: arn-archive
              spec:
                configRef: ac1-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: arn-archive
              spec:
                name: eventbridgearchive-arn-archive
                eventSourceARN: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: arn-archive
              status:
                resourceName: eventbridgearchive-arn-archive
                namingStatus: valid

    # ── AC-2: creation with eventBusRef cross-referencing EventBridgeEventBus ─
    # ── AC-12: eventBusRef resolves to EventBus.status.predictedArn ────────
    - name: ac2-ac12-eventbusref-cross-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac2-cfg
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac2-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: ref-bus
                labels:
                  aws.kropath.run/resource-name: ref-bus
              spec:
                configRef: ac2-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: ref-bus
              status:
                predictedArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/eventbridgearchive-ref-bus"
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: ref-archive
              spec:
                configRef: ac2-cfg
                eventBusRef: ref-bus
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: ref-archive
              spec:
                eventSourceARN: "arn:aws:events:ap-southeast-2:123456789012:event-bus/eventbridgearchive-ref-bus"

    # ── AC-4: eventBusRef + eventBusArn mutual exclusion → validationError ─
    - name: ac4-eventbus-mutual-exclusion-error
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac4-cfg
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac4-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: bus-exclusion
              spec:
                configRef: ac4-cfg
                eventBusRef: some-bus
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/another-bus"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: bus-exclusion
              status:
                (validationError != ""): true
        - script:
            content: |
              # ACK Archive must NOT be created with a mutual-exclusion error.
              sleep 10
              if kubectl get archives.eventbridge.services.k8s.aws bus-exclusion -n eventbridgearchive 2>/dev/null | grep -q "bus-exclusion"; then
                echo "FAIL: ACK Archive should not exist with mutual exclusion error"; exit 1
              fi
              echo "PASS"

    # ── AC-5: nameOverride takes precedence ────────────────────────────────
    - name: ac5-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac5-cfg
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac5-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: override-archive
              spec:
                configRef: ac5-cfg
                nameOverride: "my-custom-archive"
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: override-archive
              spec:
                name: my-custom-archive

    # ── AC-6: mandatory namingTemplate wins ───────────────────────────────
    - name: ac6-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac6-cfg
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "corp-{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac6-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: naming-mandatory
              spec:
                configRef: ac6-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: naming-mandatory
              spec:
                name: corp-eventbridgearchive-naming-mandatory

    # ── AC-7: unresolved tokens → namingStatus invalid, no ACK Archive ─────
    - name: ac7-naming-unresolved-tokens
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac7-cfg
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{tag.unknown}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac7-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{tag.unknown}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: naming-unresolved
              spec:
                configRef: ac7-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: naming-unresolved
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              # ACK Archive must NOT be created when naming is invalid.
              sleep 10
              if kubectl get archives.eventbridge.services.k8s.aws naming-unresolved -n eventbridgearchive 2>/dev/null | grep -q "naming-unresolved"; then
                echo "FAIL: ACK Archive should not exist with invalid naming"; exit 1
              fi
              echo "PASS"

    # ── AC-8: retentionDays=0 means keep forever (default) ─────────────────
    # ── AC-9: retentionDays floor governance (mandatory.archiveRetentionDays) ─
    - name: ac8-ac9-retention-days-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac8-cfg
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {archiveRetentionDays: 30, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac8-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":30,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: retention-floor
              spec:
                configRef: ac8-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
                retentionDays: 7
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: retention-floor
              spec:
                retentionDays: 30
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: retention-user-higher
              spec:
                configRef: ac8-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
                retentionDays: 90
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: retention-user-higher
              spec:
                retentionDays: 90
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: retention-zero
              spec:
                configRef: ac8-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
                retentionDays: 0
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: retention-zero
              spec:
                retentionDays: 0

    # ── AC-10: eventPattern passthrough ──────────────────────────────────
    - name: ac10-event-pattern-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac10-cfg
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac10-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: pattern-archive
              spec:
                configRef: ac10-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
                eventPattern: '{"source":["aws.ec2"],"detail-type":["EC2 Instance State-change Notification"]}'
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: pattern-archive
              spec:
                eventPattern: '{"source":["aws.ec2"],"detail-type":["EC2 Instance State-change Notification"]}'

    # ── AC-13: description passthrough ────────────────────────────────────
    - name: ac13-description-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac13-cfg
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac13-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: desc-archive
              spec:
                configRef: ac13-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
                description: "My archive for EC2 events"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: desc-archive
              spec:
                description: "My archive for EC2 events"

    # ── AC-14: predictedArn computed from effectiveName ──────────────────
    - name: ac14-predicted-arn
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac14-cfg
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac14-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: predicted-arn-test
              spec:
                configRef: ac14-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: predicted-arn-test
              status:
                predictedArn: "arn:aws:events:ap-southeast-2:123456789012:archive/eventbridgearchive-predicted-arn-test"

    # ── AC-15: syncedLabels dual-write to K8s labels (no cloud tags — Archive has none) ─
    - name: ac15-synced-labels-kubernetes-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac15-cfg
                labels:
                  aws.kropath.run/resource-name: ac15-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac15-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: synced-labels-archive
              spec:
                configRef: ac15-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
                syncedLabels:
                  app-owner: platform
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: synced-labels-archive
                labels:
                  aws.kropath.run/app-owner: platform

    # ── AC-16: deletionPolicy annotation ─────────────────────────────────
    - name: ac16-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac16-cfg
                labels:
                  aws.kropath.run/resource-name: ac16-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac16-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: del-policy-archive
              spec:
                configRef: ac16-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
                deletionPolicy: delete
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: del-policy-archive
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # ── AC-17-18: standard K8s metadata wiring ────────────────────────────
    - name: ac17-ac18-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac17-cfg
                labels:
                  aws.kropath.run/resource-name: ac17-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac17-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: meta-archive
              spec:
                configRef: ac17-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: meta-archive
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: meta-archive
        - script:
            content: |
              for _ in $(seq 1 60); do
                kubectl get archives.eventbridge.services.k8s.aws meta-archive -n eventbridgearchive >/dev/null 2>&1 && break
                sleep 1
              done
              OWNER_KIND=$(kubectl get archives.eventbridge.services.k8s.aws meta-archive -n eventbridgearchive -o jsonpath='{.metadata.ownerReferences[0].kind}')
              if [ "$OWNER_KIND" != "EventBridgeArchive" ]; then echo "FAIL: ownerRef kind=$OWNER_KIND"; exit 1; fi
              echo "PASS"

    # ── AC-19: no cloud tags field on ACK Archive ─────────────────────────
    - name: ac19-no-cloud-tags-field
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac19-cfg
                labels:
                  aws.kropath.run/resource-name: ac19-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac19-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: no-tags-archive
              spec:
                configRef: ac19-cfg
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
        - script:
            content: |
              for _ in $(seq 1 60); do
                kubectl get archives.eventbridge.services.k8s.aws no-tags-archive -n eventbridgearchive >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get archives.eventbridge.services.k8s.aws no-tags-archive -n eventbridgearchive -o jsonpath='{.spec.tags}' 2>/dev/null || echo "null")
              if [ "$TAGS" != "" ] && [ "$TAGS" != "null" ] && [ "$TAGS" != "{}" ]; then
                echo "FAIL: ACK Archive should have no tags field, got: $TAGS"; exit 1
              fi
              echo "PASS: No cloud tags field on ACK Archive"

    # ── AC-20: configRef selects correct EventBridgeConfig ────────────────
    - name: ac20-config-profile-selection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: team-archive-policy
                labels:
                  aws.kropath.run/resource-name: team-archive-policy
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "team-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig team-archive-policy -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"team-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: team-archive
              spec:
                configRef: team-archive-policy
                eventBusArn: "arn:aws:events:ap-southeast-2:123456789012:event-bus/my-bus"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Archive
              metadata:
                name: team-archive
              spec:
                name: team-team-archive

    # ── AC-21: eventBusRef not found → eventSourceARN falls back to empty, no ACK Archive ─
    - name: ac21-eventbusref-not-found-no-archive
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac21-cfg
                labels:
                  aws.kropath.run/resource-name: ac21-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac21-cfg -n eventbridgearchive --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeArchive
              metadata:
                name: missing-ref-archive
              spec:
                configRef: ac21-cfg
                eventBusRef: nonexistent-bus
        - script:
            content: |
              # ACK Archive must NOT be created when eventBusRef does not resolve.
              sleep 10
              if kubectl get archives.eventbridge.services.k8s.aws missing-ref-archive -n eventbridgearchive 2>/dev/null | grep -q "missing-ref-archive"; then
                echo "FAIL: ACK Archive should not exist when eventBusRef does not resolve"; exit 1
              fi
              echo "PASS"
