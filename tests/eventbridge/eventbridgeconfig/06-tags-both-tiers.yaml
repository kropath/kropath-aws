# AC-6: mandatory.tags and defaults.tags both set → admission succeeds (map fields are additive)
---
apiVersion: aws.kropath.run/v1alpha1
kind: EventBridgeConfig
metadata:
  name: ac6-tags-both-tiers
  namespace: eventbridgeconfig
spec:
  mandatory:
    archiveRetentionDays: 0
    namingTemplate: ""
    tags:
      cost-centre: platform
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    archiveRetentionDays: 0
    namingTemplate: ""
    tags:
      team: infra
    syncedLabels: {}
    syncedAnnotations: {}
