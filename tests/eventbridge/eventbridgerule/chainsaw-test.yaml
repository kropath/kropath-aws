# aws-eventbridge-03 Chainsaw tests -- 29 acceptance criteria for EventBridgeRule.
# Namespace: eventbridgerule. Default naming: {namespace}-{name} => eventbridgerule-<cr-name>.
# effectiveConfig patched via kubectl --subresource=status to mock kropath-controller.
# eventBusRef cross-reference tests create an EventBridgeEventBus in this namespace and
# rely on kro to set its status.resourceName before the Rule is created.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eventbridgerule
spec:
  namespace: eventbridgerule
  steps:
    # ── Seed: namespace + governance config ──────────────────────────────────
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              for kind in rule eventbridgerule eventbus eventbridgeeventbus; do
                for name in $(kubectl get "$kind" -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                  kubectl patch "$kind" "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
                done
                kubectl delete "$kind" --all -n eventbridgerule --ignore-not-found --wait=false
              done
              kubectl delete eventbridgeconfig --all -n eventbridgerule --ignore-not-found --wait=false
              kubectl delete namespace eventbridgerule --ignore-not-found
              sleep 3

    - name: seed-namespace-and-config
      try:
        - apply:
            file: 00-eventbridgerule-namespace.yaml
        - apply:
            file: 01-general-policy-eventbridgeconfig.yaml
        - script:
            content: |
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'

    # ── AC-1: creation with eventPattern on default bus ──────────────────
    # ── AC-3: default naming {namespace}-{name} ──────────────────────────
    # ── AC-7: state defaults to ENABLED ─────────────────────────────────
    - name: ac1-ac3-ac7-creation-event-pattern-default-naming-state
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: event-pattern-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                eventPattern: '{"source":["aws.ec2"]}'
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: event-pattern-rule
                namespace: eventbridgerule
              spec:
                name: eventbridgerule-event-pattern-rule
                eventPattern: '{"source":["aws.ec2"]}'
                state: ENABLED
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: event-pattern-rule
                namespace: eventbridgerule
              status:
                resourceName: eventbridgerule-event-pattern-rule
                namingStatus: valid
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-2: creation with scheduleExpression on default bus ─────────────
    - name: ac2-creation-schedule-expression
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: schedule-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(5 minutes)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: schedule-rule
                namespace: eventbridgerule
              spec:
                name: eventbridgerule-schedule-rule
                scheduleExpression: "rate(5 minutes)"
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-4: nameOverride takes precedence ───────────────────────────────
    - name: ac4-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: override-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                nameOverride: "my-custom-rule"
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: override-rule
                namespace: eventbridgerule
              spec:
                name: my-custom-rule
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-5: mandatory namingTemplate wins ──────────────────────────────
    - name: ac5-naming-mandatory-template
      try:
        - script:
            content: |
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: naming-mandatory
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: naming-mandatory
                namespace: eventbridgerule
              spec:
                name: corp-eventbridgerule-naming-mandatory
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}' || true
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}' || true

    # ── AC-6: unresolved tokens → namingStatus invalid, no ACK Rule ──────
    - name: ac6-naming-unresolved-tokens
      try:
        - script:
            content: |
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{tag.unknown}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: naming-unresolved
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: naming-unresolved
                namespace: eventbridgerule
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              if kubectl get rule naming-unresolved -n eventbridgerule 2>/dev/null | grep -q "naming-unresolved"; then
                echo "FAIL: ACK Rule should not exist with invalid naming"; exit 1
              fi
              echo "PASS"
      cleanup:
        - script:
            content: |
              kubectl delete eventbridgerule naming-unresolved -n eventbridgerule --ignore-not-found=true
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}' || true
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}' || true

    # ── AC-8: state can be set to DISABLED ───────────────────────────────
    - name: ac8-state-disabled
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: disabled-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
                state: DISABLED
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: disabled-rule
                namespace: eventbridgerule
              spec:
                state: DISABLED
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-9: predictedArn default bus format ─────────────────────────────
    - name: ac9-predicted-arn-default-bus
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: arn-default-bus
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: arn-default-bus
                namespace: eventbridgerule
              status:
                predictedArn: "arn:aws:events:ap-southeast-2:123456789012:rule/eventbridgerule-arn-default-bus"
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-10: predictedArn custom bus format (using eventBusName direct) ─
    # ── AC-12: eventBusName direct passed to ACK spec.eventBusName ────────
    # ── AC-24: eventBusName direct → predictedArn includes bus name ────────
    - name: ac10-ac12-ac24-event-bus-name-direct
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: custom-bus-name
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                eventBusName: "my-custom-bus"
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: custom-bus-name
                namespace: eventbridgerule
              spec:
                eventBusName: "my-custom-bus"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: custom-bus-name
                namespace: eventbridgerule
              status:
                predictedArn: "arn:aws:events:ap-southeast-2:123456789012:rule/my-custom-bus/eventbridgerule-custom-bus-name"
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-11: eventBusRef cross-references EventBridgeEventBus.status.resourceName ─
    # ── AC-22: eventBusRef resolution → ACK spec.eventBusName uses EventBus.status.resourceName ─
    # ── AC-23: eventBusRef resolution updates predictedArn to custom format ──
    # ── AC-26: eventBusRef → ACK spec.eventBusName set from EventBus resourceName ─
    - name: ac11-ac22-ac23-ac26-eventbusref-cross-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: test-bus
                namespace: eventbridgerule
                labels:
                  aws.kropath.run/resource-name: test-bus
              spec:
                configRef: general-policy
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: test-bus
                namespace: eventbridgerule
              status:
                resourceName: eventbridgerule-test-bus
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: ref-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                eventBusRef: test-bus
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ref-rule
                namespace: eventbridgerule
              spec:
                eventBusName: eventbridgerule-test-bus
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: ref-rule
                namespace: eventbridgerule
              status:
                predictedArn: "arn:aws:events:ap-southeast-2:123456789012:rule/eventbridgerule-test-bus/eventbridgerule-ref-rule"
      cleanup:
        - script:
            content: |
              for kind in rule eventbridgerule eventbus eventbridgeeventbus; do
                for name in $(kubectl get "$kind" -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                  kubectl patch "$kind" "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
                done
                kubectl delete "$kind" --all -n eventbridgerule --ignore-not-found=true --wait=false
              done

    # ── AC-13: eventBusRef + eventBusName mutual exclusion → validationError ─
    - name: ac13-eventbus-mutual-exclusion-error
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: bus-exclusion
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                eventBusRef: some-bus
                eventBusName: another-bus
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: bus-exclusion
                namespace: eventbridgerule
              status:
                (validationError != ""): true
        - script:
            content: |
              if kubectl get rule bus-exclusion -n eventbridgerule 2>/dev/null | grep -q "bus-exclusion"; then
                echo "FAIL: ACK Rule should not exist with mutual exclusion error"; exit 1
              fi
              echo "PASS"
      cleanup:
        - script:
            content: |
              kubectl delete eventbridgerule bus-exclusion -n eventbridgerule --ignore-not-found=true

    # ── AC-14: eventPattern + scheduleExpression mutual exclusion → validationError ─
    - name: ac14-schedule-mutual-exclusion-error
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: schedule-exclusion
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                eventPattern: '{"source":["aws.ec2"]}'
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: schedule-exclusion
                namespace: eventbridgerule
              status:
                (validationError != ""): true
        - script:
            content: |
              if kubectl get rule schedule-exclusion -n eventbridgerule 2>/dev/null | grep -q "schedule-exclusion"; then
                echo "FAIL: ACK Rule should not exist with mutual exclusion error"; exit 1
              fi
              echo "PASS"
      cleanup:
        - script:
            content: |
              kubectl delete eventbridgerule schedule-exclusion -n eventbridgerule --ignore-not-found=true

    # ── AC-15: roleArn passed to ACK spec.roleARN ─────────────────────────
    - name: ac15-role-arn-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: role-arn-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
                roleArn: "arn:aws:iam::123456789012:role/EventBridgeRole"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: role-arn-rule
                namespace: eventbridgerule
              spec:
                roleARN: "arn:aws:iam::123456789012:role/EventBridgeRole"
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-16: targets array passed through verbatim ──────────────────────
    - name: ac16-targets-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: targets-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
                targets:
                  - id: target1
                    arn: "arn:aws:lambda:ap-southeast-2:123456789012:function:MyFunction"
                  - id: target2
                    arn: "arn:aws:sqs:ap-southeast-2:123456789012:MyQueue"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: targets-rule
                namespace: eventbridgerule
              spec:
                targets:
                  - id: target1
                    arn: "arn:aws:lambda:ap-southeast-2:123456789012:function:MyFunction"
                  - id: target2
                    arn: "arn:aws:sqs:ap-southeast-2:123456789012:MyQueue"
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-17-20: tags cascade (defaults → spec → mandatory wins) ─────────
    - name: ac17-ac20-tags-cascade
      try:
        - script:
            content: |
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":null}}'
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{"env":"dev","team":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: tags-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
                tags:
                  env: staging
                  service: api
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: tags-rule
                namespace: eventbridgerule
        - script:
            content: |
              TAGS=$(kubectl get rule tags-rule -n eventbridgerule -o json | jq -r '.spec.tags')
              ENV=$(echo "$TAGS" | jq -r '.[] | select(.key == "env") | .value')
              if [ "$ENV" != "prod" ]; then echo "FAIL: env=$ENV, expected prod (mandatory wins)"; exit 1; fi
              TEAM=$(echo "$TAGS" | jq -r '.[] | select(.key == "team") | .value')
              if [ "$TEAM" != "infra" ]; then echo "FAIL: team=$TEAM, expected infra (from defaults)"; exit 1; fi
              SVC=$(echo "$TAGS" | jq -r '.[] | select(.key == "service") | .value')
              if [ "$SVC" != "api" ]; then echo "FAIL: service=$SVC, expected api (from spec)"; exit 1; fi
              BAD=$(echo "$TAGS" | jq '[.[] | select(has("key") and has("value"))] | length != length' 2>/dev/null || echo false)
              echo "PASS: tags cascade verified"
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}' || true
              kubectl patch eventbridgeconfig general-policy -n eventbridgerule --subresource=status --type=merge -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}' || true

    # ── AC-21: syncedLabels dual-write to K8s labels and cloud tags ────────
    - name: ac21-synced-labels-dual-write
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: synced-labels-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
                syncedLabels:
                  app-owner: platform
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: synced-labels-rule
                namespace: eventbridgerule
                labels:
                  aws.kropath.run/app-owner: platform
        - script:
            content: |
              TAGS=$(kubectl get rule synced-labels-rule -n eventbridgerule -o json | jq -r '.spec.tags')
              OWNER=$(echo "$TAGS" | jq -r '.[] | select(.key == "app-owner") | .value')
              if [ "$OWNER" != "platform" ]; then echo "FAIL: app-owner=$OWNER in cloud tags, expected platform"; exit 1; fi
              echo "PASS"
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-22: deletion policy annotation ────────────────────────────────
    - name: ac22-deletion-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: del-policy-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
