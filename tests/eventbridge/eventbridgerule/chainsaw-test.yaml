                  - id: target2
                    arn: "arn:aws:sqs:ap-southeast-2:123456789012:MyQueue"

    # ── AC-17-20: tags cascade (defaults → spec → mandatory wins) ─────────
    - name: ac17-ac20-tags-cascade
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac17-cfg
                labels:
                  aws.kropath.run/resource-name: ac17-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {env: prod}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {env: dev, team: infra}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac17-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{"env":"dev","team":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: tags-rule
              spec:
                configRef: ac17-cfg
                scheduleExpression: "rate(1 hour)"
                tags:
                  env: staging
                  service: api
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: tags-rule
        - script:
            content: |
              # Poll until kro has reconciled the child Rule, then verify tags
              # (order-independent) via jq. mandatory wins: env=prod.
              for _ in $(seq 1 60); do
                kubectl get rules.eventbridge.services.k8s.aws tags-rule -n eventbridgerule >/dev/null 2>&1 && break
                sleep 1
              done
              TAGS=$(kubectl get rules.eventbridge.services.k8s.aws tags-rule -n eventbridgerule -o json | jq -r '.spec.tags')
              echo "Tags: $TAGS"
              ENV=$(echo "$TAGS" | jq -r '.[] | select(.key == "env") | .value')
              [ "$ENV" = "prod" ] || { echo "FAIL: env=$ENV, expected prod (mandatory wins)"; exit 1; }
              TEAM=$(echo "$TAGS" | jq -r '.[] | select(.key == "team") | .value')
              [ "$TEAM" = "infra" ] || { echo "FAIL: team=$TEAM, expected infra (from defaults)"; exit 1; }
              SVC=$(echo "$TAGS" | jq -r '.[] | select(.key == "service") | .value')
              [ "$SVC" = "api" ] || { echo "FAIL: service=$SVC, expected api (from spec)"; exit 1; }
              BAD_COUNT=$(echo "$TAGS" | jq '[.[] | select((has("key") and has("value")) | not)] | length')
              [ "$BAD_COUNT" = "0" ] || { echo "FAIL: $BAD_COUNT tags missing key or value field"; exit 1; }
              echo "PASS: tags cascade verified"

