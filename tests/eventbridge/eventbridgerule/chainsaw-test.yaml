# aws-eventbridge-03 Chainsaw tests -- 29 acceptance criteria for EventBridgeRule.
# Namespace: eventbridgerule. Default naming: {namespace}-{name} => eventbridgerule-<cr-name>.
#
# CANONICAL pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step uses a UNIQUE config (acN-cfg) and a UNIQUE resource name, and
# deletes NOTHING between steps (spec.skipDelete is the global default). The test cluster runs
# kro but no ACK controllers, so a shared config mutated across steps would re-reconcile every
# persisted instance and cross-contaminate later assertions; per-step configs avoid that.
# effectiveConfig is injected via `kubectl patch --subresource=status` to mock kropath-controller.
# The EventBridgeConfig CRD forbids namingTemplate set in BOTH spec.mandatory and spec.defaults,
# so each CR spec sets it in ONE tier only; the status patch may seed both.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eventbridgerule
spec:
  namespace: eventbridgerule
  steps:
    # ── AC-1: creation with eventPattern on default bus ──────────────────
    # ── AC-3: default naming {namespace}-{name} ──────────────────────────
    # ── AC-7: state defaults to ENABLED ─────────────────────────────────
    - name: ac1-ac3-ac7-creation-event-pattern-default-naming-state
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac1-cfg
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac1-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: event-pattern-rule
              spec:
                configRef: ac1-cfg
                eventPattern: '{"source":["aws.ec2"]}'
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: event-pattern-rule
              spec:
                name: eventbridgerule-event-pattern-rule
                eventPattern: '{"source":["aws.ec2"]}'
                state: ENABLED
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: event-pattern-rule
              status:
                resourceName: eventbridgerule-event-pattern-rule
                namingStatus: valid

    # ── AC-2: creation with scheduleExpression on default bus ─────────────
    - name: ac2-creation-schedule-expression
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac2-cfg
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac2-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: schedule-rule
              spec:
                configRef: ac2-cfg
                scheduleExpression: "rate(5 minutes)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: schedule-rule
              spec:
                name: eventbridgerule-schedule-rule
                scheduleExpression: "rate(5 minutes)"

    # ── AC-4: nameOverride takes precedence ───────────────────────────────
    - name: ac4-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac4-cfg
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac4-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: override-rule
              spec:
                configRef: ac4-cfg
                nameOverride: "my-custom-rule"
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: override-rule
              spec:
                name: my-custom-rule

    # ── AC-5: mandatory namingTemplate wins ──────────────────────────────
    - name: ac5-naming-mandatory-template
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac5-cfg
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "corp-{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac5-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"corp-{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: naming-mandatory
              spec:
                configRef: ac5-cfg
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: naming-mandatory
              spec:
                name: corp-eventbridgerule-naming-mandatory

    # ── AC-6: unresolved tokens → namingStatus invalid, no ACK Rule ──────
    - name: ac6-naming-unresolved-tokens
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac6-cfg
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{tag.unknown}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac6-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{tag.unknown}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: naming-unresolved
              spec:
                configRef: ac6-cfg
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: naming-unresolved
              status:
                namingStatus: invalid-unresolved-tokens
        - script:
            content: |
              # ACK Rule must NOT be created when naming is invalid. Give kro a moment,
              # then confirm the child never appears.
              sleep 10
              if kubectl get rules.eventbridge.services.k8s.aws naming-unresolved -n eventbridgerule 2>/dev/null | grep -q "naming-unresolved"; then
                echo "FAIL: ACK Rule should not exist with invalid naming"; exit 1
              fi
              echo "PASS: ACK Rule not created as expected"

    # ── AC-8: state can be set to DISABLED ───────────────────────────────
    - name: ac8-state-disabled
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac8-cfg
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac8-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: disabled-rule
              spec:
                configRef: ac8-cfg
                scheduleExpression: "rate(1 hour)"
                state: DISABLED
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: disabled-rule
              spec:
                state: DISABLED

    # ── AC-9: predictedArn default bus format ─────────────────────────────
    - name: ac9-predicted-arn-default-bus
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac9-cfg
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac9-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: arn-default-bus
              spec:
                configRef: ac9-cfg
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: arn-default-bus
              status:
                predictedArn: "arn:aws:events:ap-southeast-2:123456789012:rule/eventbridgerule-arn-default-bus"

    # ── AC-10: predictedArn custom bus format (using eventBusName direct) ─
    # ── AC-12: eventBusName direct passed to ACK spec.eventBusName ────────
    # ── AC-24: eventBusName direct → predictedArn includes bus name ────────
    - name: ac10-ac12-ac24-event-bus-name-direct
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac10-cfg
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac10-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: custom-bus-name
              spec:
                configRef: ac10-cfg
                eventBusName: "my-custom-bus"
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: custom-bus-name
              spec:
                eventBusName: "my-custom-bus"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: custom-bus-name
              status:
                predictedArn: "arn:aws:events:ap-southeast-2:123456789012:rule/my-custom-bus/eventbridgerule-custom-bus-name"

    # ── AC-11: eventBusRef cross-references EventBridgeEventBus.status.resourceName ─
    # ── AC-22: eventBusRef resolution → ACK spec.eventBusName uses EventBus.status.resourceName ─
    # ── AC-23: eventBusRef resolution updates predictedArn to custom format ──
    # ── AC-26: eventBusRef → ACK spec.eventBusName set from EventBus resourceName ─
    - name: ac11-ac22-ac23-ac26-eventbusref-cross-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac11-cfg
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac11-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: ref-bus-11
                labels:
                  aws.kropath.run/resource-name: ref-bus-11
              spec:
                configRef: ac11-cfg
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeEventBus
              metadata:
                name: ref-bus-11
              status:
                resourceName: eventbridgerule-ref-bus-11
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: ref-rule-11
              spec:
                configRef: ac11-cfg
                eventBusRef: ref-bus-11
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ref-rule-11
              spec:
                eventBusName: eventbridgerule-ref-bus-11
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: ref-rule-11
              status:
                predictedArn: "arn:aws:events:ap-southeast-2:123456789012:rule/eventbridgerule-ref-bus-11/eventbridgerule-ref-rule-11"

    # ── AC-13: eventBusRef + eventBusName mutual exclusion → validationError ─
    - name: ac13-eventbus-mutual-exclusion-error
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac13-cfg
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac13-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: bus-exclusion
              spec:
                configRef: ac13-cfg
                eventBusRef: some-bus
                eventBusName: another-bus
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: bus-exclusion
              status:
                (validationError != ""): true
        - script:
            content: |
              # ACK Rule must NOT be created when mutual exclusion is violated.
              sleep 10
              if kubectl get rules.eventbridge.services.k8s.aws bus-exclusion -n eventbridgerule 2>/dev/null | grep -q "bus-exclusion"; then
                echo "FAIL: ACK Rule should not exist with mutual exclusion error"; exit 1
              fi
              echo "PASS: ACK Rule not created as expected"

    # ── AC-14: eventPattern + scheduleExpression mutual exclusion → validationError ─
    - name: ac14-schedule-mutual-exclusion-error
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac14-cfg
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac14-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: schedule-exclusion
              spec:
                configRef: ac14-cfg
                eventPattern: '{"source":["aws.ec2"]}'
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: schedule-exclusion
              status:
                (validationError != ""): true
        - script:
            content: |
              # ACK Rule must NOT be created when mutual exclusion is violated.
              sleep 10
              if kubectl get rules.eventbridge.services.k8s.aws schedule-exclusion -n eventbridgerule 2>/dev/null | grep -q "schedule-exclusion"; then
                echo "FAIL: ACK Rule should not exist with mutual exclusion error"; exit 1
              fi
              echo "PASS: ACK Rule not created as expected"

    # ── AC-15: roleArn passed to ACK spec.roleARN ─────────────────────────
    - name: ac15-role-arn-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac15-cfg
                labels:
                  aws.kropath.run/resource-name: ac15-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac15-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: role-arn-rule
              spec:
                configRef: ac15-cfg
                scheduleExpression: "rate(1 hour)"
                roleArn: "arn:aws:iam::123456789012:role/EventBridgeRole"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: role-arn-rule
              spec:
                roleARN: "arn:aws:iam::123456789012:role/EventBridgeRole"

    # ── AC-16: targets array passed through verbatim ──────────────────────
    - name: ac16-targets-passthrough
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: ac16-cfg
                labels:
                  aws.kropath.run/resource-name: ac16-cfg
              spec:
                mandatory: {archiveRetentionDays: 0, namingTemplate: "", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
                defaults: {archiveRetentionDays: 0, namingTemplate: "{namespace}-{name}", tags: {}, syncedLabels: {}, syncedAnnotations: {}}
        - script:
            content: |
              kubectl patch eventbridgeconfig ac16-cfg -n eventbridgerule --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: targets-rule
              spec:
                configRef: ac16-cfg
                scheduleExpression: "rate(1 hour)"
                targets:
                  - id: target1
                    arn: "arn:aws:lambda:ap-southeast-2:123456789012:function:MyFunction"
                  - id: target2
                    arn: "arn:aws:sqs:ap-southeast-2:123456789012:MyQueue"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: targets-rule
              spec:
                targets:
                  - id: target1
