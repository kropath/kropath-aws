        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: del-policy-rule
                namespace: eventbridgerule
                annotations:
                  services.k8s.aws/deletion-policy: delete
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-23: standard K8s metadata wiring ──────────────────────────────
    # ── AC-28: conditions propagated (empty array ok — no live AWS) ───────
    - name: ac23-ac28-standard-metadata-and-conditions
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeRule
              metadata:
                name: meta-rule
                namespace: eventbridgerule
              spec:
                configRef: general-policy
                scheduleExpression: "rate(1 hour)"
        - assert:
            resource:
              apiVersion: eventbridge.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: meta-rule
                namespace: eventbridgerule
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: meta-rule
        - script:
            content: |
              OWNER_KIND=$(kubectl get rule meta-rule -n eventbridgerule -o jsonpath='{.metadata.ownerReferences[0].kind}')
              if [ "$OWNER_KIND" != "EventBridgeRule" ]; then echo "FAIL: ownerRef kind=$OWNER_KIND"; exit 1; fi
              echo "PASS"
      cleanup:
        - script:
            content: |
              for name in $(kubectl get rule -n eventbridgerule -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch rule "$name" -n eventbridgerule --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete rule --all -n eventbridgerule --ignore-not-found=true --wait=false
              kubectl delete eventbridgerule --all -n eventbridgerule --ignore-not-found=true --wait=false

    # ── AC-25: configRef selects correct EventBridgeConfig ───────────────
    - name: ac25-config-profile-selection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: EventBridgeConfig
              metadata:
                name: team-rule-policy
                namespace: eventbridgerule
                labels:
                  aws.kropath.run/resource-name: team-rule-policy
              spec:
                mandatory:
                  archiveRetentionDays: 0
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  archiveRetentionDays: 0
                  namingTemplate: "team-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch eventbridgeconfig team-rule-policy -n eventbridgerule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"archiveRetentionDays":0,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"archiveRetentionDays":0,"namingTemplate":"team-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
