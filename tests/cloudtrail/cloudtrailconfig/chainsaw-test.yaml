# aws-ct-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudtrailconfig
spec:
  skipDelete: true
  namespace: cloudtrailconfig
  steps:
    - name: ac1-general-policy-accepted-tier-symmetry
      try:
        - apply:
            file: 00-cloudtrailconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailConfig
              metadata:
                name: general-policy
                namespace: cloudtrailconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  isMultiRegionTrail: false
                  enableLogFileValidation: false
                  includeGlobalServiceEvents: false
                  isOrganizationTrail: false
                  s3BucketName: ""
                  s3KeyPrefix: ""
                  kmsKeyID: ""
                  multiRegionEnabled: false
                  organizationEnabled: false
                  retentionPeriod: 0
                  terminationProtectionEnabled: false
                  namingTemplate: ""
                defaults:
                  isMultiRegionTrail: false
                  enableLogFileValidation: true
                  includeGlobalServiceEvents: true
                  isOrganizationTrail: false
                  s3BucketName: ""
                  s3KeyPrefix: ""
                  kmsKeyID: ""
                  multiRegionEnabled: false
                  organizationEnabled: false
                  retentionPeriod: 2557
                  terminationProtectionEnabled: true
                  namingTemplate: "{namespace}-{name}"

    - name: ac2-reject-both-tiers-boolean-ismultiregiontrail
      try:
        - apply:
            file: 02-invalid-both-tiers-boolean.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudTrailConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-enablelogfilevalidation
      try:
        - apply:
            file: 03-invalid-both-tiers-enablelogfilevalidation.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudTrailConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-string-s3bucketname
      try:
        - apply:
            file: 04-invalid-both-tiers-s3bucketname.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudTrailConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-kmskey
      try:
        - apply:
            file: 05-invalid-both-tiers-kmskey.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudTrailConfig
                check:
                  ($error != null): true

    - name: ac6-reject-both-tiers-integer-retentionperiod
      try:
        - apply:
            file: 06-invalid-both-tiers-retentionperiod.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudTrailConfig
                check:
                  ($error != null): true

    - name: ac7-single-tier-boolean-accepted
      try:
        - apply:
            file: 07-single-tier-boolean.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailConfig
              metadata:
                name: single-tier-boolean
                namespace: cloudtrailconfig
              spec:
                mandatory:
                  isMultiRegionTrail: true
                defaults:
                  isMultiRegionTrail: false

    - name: ac8-single-tier-string-accepted
      try:
        - apply:
            file: 08-single-tier-string.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailConfig
              metadata:
                name: single-tier-string
                namespace: cloudtrailconfig
              spec:
                mandatory:
                  s3BucketName: ""
                defaults:
                  s3BucketName: "default-logs"

    - name: ac9-label-selector-lookup
      try:
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailConfig
              metadata:
                name: general-policy
                namespace: cloudtrailconfig
                labels:
                  aws.kropath.run/resource-name: general-policy

    - name: ac10-effective-config-merge
      try:
        - apply:
            file: 09-global-kropathconfig.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory.cloudtrail.isMultiRegionTrail: true
              # wins; CloudTrailConfig defaults.enableLogFileValidation: true propagates.
              kubectl patch cloudtrailconfig general-policy -n cloudtrailconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"isMultiRegionTrail":true,"enableLogFileValidation":false,"includeGlobalServiceEvents":false,"isOrganizationTrail":false,"s3BucketName":"","s3KeyPrefix":"","kmsKeyID":"","multiRegionEnabled":false,"organizationEnabled":false,"retentionPeriod":0,"terminationProtectionEnabled":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"isMultiRegionTrail":false,"enableLogFileValidation":true,"includeGlobalServiceEvents":true,"isOrganizationTrail":false,"s3BucketName":"","s3KeyPrefix":"","kmsKeyID":"","multiRegionEnabled":false,"organizationEnabled":false,"retentionPeriod":2557,"terminationProtectionEnabled":true,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailConfig
              metadata:
                name: general-policy
                namespace: cloudtrailconfig
              status:
                effectiveConfig:
                  mandatory:
                    isMultiRegionTrail: true
                  defaults:
                    enableLogFileValidation: true
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: "us-east-1"
                    accountId: "123456789012"
            timeout: 60s

    - name: ac11-security-profile-accepted
      try:
        - apply:
            file: 10-security-profile.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailConfig
              metadata:
                name: security
                namespace: cloudtrailconfig
              spec:
                mandatory:
                  isMultiRegionTrail: true
                  enableLogFileValidation: true
                  s3BucketName: "audit-bucket"
                  kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/audit-key"
                defaults:
                  isMultiRegionTrail: false
                  enableLogFileValidation: false
