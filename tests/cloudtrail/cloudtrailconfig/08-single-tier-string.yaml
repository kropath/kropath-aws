# AC-8: single-tier-string — s3BucketName in defaults only; mandatory empty
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudTrailConfig
metadata:
  name: single-tier-string
  namespace: cloudtrailconfig
  labels:
    aws.kropath.run/resource-name: single-tier-string
spec:
  mandatory:
    isMultiRegionTrail: false
    enableLogFileValidation: false
    includeGlobalServiceEvents: false
    isOrganizationTrail: false
    s3BucketName: ""
    s3KeyPrefix: ""
    kmsKeyID: ""
    multiRegionEnabled: false
    organizationEnabled: false
    retentionPeriod: 0
    terminationProtectionEnabled: false
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: ""
  defaults:
    isMultiRegionTrail: false
    enableLogFileValidation: false
    includeGlobalServiceEvents: false
    isOrganizationTrail: false
    s3BucketName: "default-logs"
    s3KeyPrefix: ""
    kmsKeyID: ""
    multiRegionEnabled: false
    organizationEnabled: false
    retentionPeriod: 0
    terminationProtectionEnabled: false
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: ""
