# AC-11: profile-security — mandatory security controls; defaults zeroed where they conflict
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudTrailConfig
metadata:
  name: security
  namespace: cloudtrailconfig
  labels:
    aws.kropath.run/resource-name: security
spec:
  mandatory:
    isMultiRegionTrail: true
    enableLogFileValidation: true
    includeGlobalServiceEvents: false
    isOrganizationTrail: false
    s3BucketName: "audit-bucket"
    s3KeyPrefix: ""
    kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/audit-key"
    multiRegionEnabled: false
    organizationEnabled: false
    retentionPeriod: 0
    terminationProtectionEnabled: false
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: ""
  defaults:
    isMultiRegionTrail: false
    enableLogFileValidation: false
    includeGlobalServiceEvents: true
    isOrganizationTrail: false
    s3BucketName: ""
    s3KeyPrefix: ""
    kmsKeyID: ""
    multiRegionEnabled: false
    organizationEnabled: false
    retentionPeriod: 2557
    terminationProtectionEnabled: true
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
    namingTemplate: "{namespace}-{name}"
