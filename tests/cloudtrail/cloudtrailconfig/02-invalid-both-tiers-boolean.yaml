# AC-2: mutual-exclusion-boolean — isMultiRegionTrail true in both tiers
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudTrailConfig
metadata:
  name: invalid-both-tiers-boolean
  namespace: cloudtrailconfig
  labels:
    aws.kropath.run/resource-name: invalid-both-tiers-boolean
spec:
  mandatory:
    isMultiRegionTrail: true
  defaults:
    isMultiRegionTrail: true
