# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named CloudTrailConfig + CloudTrailTrail
# and deletes nothing between steps. skipDelete: true stops chainsaw's end-of-test
# cascade delete (the test cluster has kro but no ACK controllers, so ACK finalizers
# are never removed and any delete would hang).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudtrailtrail
spec:
  skipDelete: true
  namespace: cloudtrailtrail
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # ─── AC-1: s3BucketName direct ───────────────────────────────────────────
    - name: ac1-s3-bucket-direct
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailConfig
              metadata:
                name: ac1-cfg
                namespace: cloudtrailtrail
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudtrailconfig ac1-cfg -n cloudtrailtrail \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"isMultiRegionTrail":false,"isOrganizationTrail":false,"includeGlobalServiceEvents":false,"enableLogFileValidation":false,"s3BucketName":"","s3KeyPrefix":"","kmsKeyID":"","namingTemplate":"","multiRegionEnabled":false,"organizationEnabled":false,"terminationProtectionEnabled":false,"retentionPeriod":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"isMultiRegionTrail":false,"isOrganizationTrail":false,"includeGlobalServiceEvents":false,"enableLogFileValidation":false,"s3BucketName":"","s3KeyPrefix":"","kmsKeyID":"","namingTemplate":"{namespace}-{name}","multiRegionEnabled":false,"organizationEnabled":false,"terminationProtectionEnabled":false,"retentionPeriod":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailTrail
              metadata:
                name: ac1-trail
                namespace: cloudtrailtrail
              spec:
                configRef: ac1-cfg
                s3BucketName: "my-audit-logs"
        - assert:
            resource:
              apiVersion: cloudtrail.services.k8s.aws/v1alpha1
              kind: Trail
              metadata:
                name: ac1-trail
                namespace: cloudtrailtrail
              spec:
                s3BucketName: "my-audit-logs"

    # ─── AC-2: s3BucketRef cross-RGD lookup ──────────────────────────────────
