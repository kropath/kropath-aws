                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"isMultiRegionTrail":false,"isOrganizationTrail":false,"includeGlobalServiceEvents":false,"enableLogFileValidation":false,"s3BucketName":"","s3KeyPrefix":"","kmsKeyID":"","namingTemplate":"","multiRegionEnabled":false,"organizationEnabled":false,"terminationProtectionEnabled":false,"retentionPeriod":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"isMultiRegionTrail":false,"isOrganizationTrail":false,"includeGlobalServiceEvents":false,"enableLogFileValidation":false,"s3BucketName":"audit-logs","s3KeyPrefix":"","kmsKeyID":"","namingTemplate":"{namespace}-{name}","multiRegionEnabled":false,"organizationEnabled":false,"terminationProtectionEnabled":false,"retentionPeriod":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
