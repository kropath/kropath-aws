                namespace: cloudtrailtrail
              spec:
                configRef: ac20-cfg
                s3BucketName: "audit-logs"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailTrail
              metadata:
                name: ac20-trail
                namespace: cloudtrailtrail
              status:
                resourceName: "cloudtrailtrail-ac20-trail"
                namingStatus: "valid"
        # Wait for the ACK child itself before the script reads it — asserting the parent's
        # status is not sufficient, as the instance status is written before the child
        # becomes visible and a bare script step does not retry.
        - assert:
            resource:
              apiVersion: cloudtrail.services.k8s.aws/v1alpha1
              kind: Trail
              metadata:
                name: ac20-trail
                namespace: cloudtrailtrail
        # AC-20 proper: with no cloudWatchLogsLogGroupARN on the instance, the RGD must
        # omit BOTH CloudWatch Logs fields from the ACK Trail. ACK rejects a trail that
        # carries only one of the pair, so absence of both is the behaviour under test.
        # Uses a jq script rather than a declarative assert: chainsaw's assertion engine
        # is JMESPath-style and has no reliable "field is absent" construct.
        - script:
            content: |
              SPEC=$(kubectl get trail.cloudtrail.services.k8s.aws ac20-trail \
                -n cloudtrailtrail -o jsonpath='{.spec}')
              echo "spec: $SPEC"
              echo "$SPEC" | jq -e 'has("cloudWatchLogsLogGroupARN") | not' \
                || { echo "FAIL: cloudWatchLogsLogGroupARN must be omitted when unset"; exit 1; }
              echo "$SPEC" | jq -e 'has("cloudWatchLogsRoleARN") | not' \
                || { echo "FAIL: cloudWatchLogsRoleARN must be omitted when unset"; exit 1; }
              echo "PASS: CloudWatch Logs delivery fields omitted"

