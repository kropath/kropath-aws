# Canonical pattern (docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named CloudTrailConfig + CloudTrailEventDataStore
# and deletes nothing between steps. skipDelete: true stops chainsaw's end-of-test cascade
# delete (the test cluster has kro but no ACK controllers, so ACK finalizers are never removed
# and any delete would hang).
#
# KRO-236 naming exemption applies: CloudTrailEventDataStore has no effectiveName,
# status.resourceName, status.predictedArn, or status.namingStatus.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudtraileventdatastore
spec:
  skipDelete: true
  namespace: cloudtraileventdatastore
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # Helper: standard effectiveConfig patch with no tiers set (reused verbatim by several ACs).
    # Each AC's script section includes the full patch inline for clarity.

    # ─── AC-1: mandatory multiRegionEnabled wins ──────────────────────────────
    - name: ac1-multi-region-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailConfig
              metadata:
                name: ac1-cfg
                namespace: cloudtraileventdatastore
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  multiRegionEnabled: true
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch cloudtrailconfig ac1-cfg -n cloudtraileventdatastore \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"isMultiRegionTrail":false,"isOrganizationTrail":false,"includeGlobalServiceEvents":false,"enableLogFileValidation":false,"s3BucketName":"","s3KeyPrefix":"","kmsKeyID":"","namingTemplate":"","multiRegionEnabled":true,"organizationEnabled":false,"terminationProtectionEnabled":false,"retentionPeriod":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"isMultiRegionTrail":false,"isOrganizationTrail":false,"includeGlobalServiceEvents":false,"enableLogFileValidation":false,"s3BucketName":"","s3KeyPrefix":"","kmsKeyID":"","namingTemplate":"{namespace}-{name}","multiRegionEnabled":false,"organizationEnabled":false,"terminationProtectionEnabled":false,"retentionPeriod":0,"tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudTrailEventDataStore
              metadata:
                name: ac1-eds
                namespace: cloudtraileventdatastore
              spec:
                configRef: ac1-cfg
        - assert:
            resource:
              apiVersion: cloudtrail.services.k8s.aws/v1alpha1
              kind: EventDataStore
              metadata:
                name: ac1-eds
                namespace: cloudtraileventdatastore
              spec:
                multiRegionEnabled: true

