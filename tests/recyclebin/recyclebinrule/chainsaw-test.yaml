# Chainsaw test suite for RecycleBinRule (aws-ebsrb-02, KRO-1040).
# Pattern: unique-name-per-step + spec.skipDelete: true (canonical 2026-08-04).
# No ACK controllers in test cluster — ACK finalizers never removed, so inter-step ACK
# deletes are forbidden. Each step gets its own RecycleBinRule name.
# 22 scenarios covering AC-1 through AC-22 from the spec.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: recyclebinrule
spec:
  namespace: recyclebinrule
  steps:
    # ── SETUP ──────────────────────────────────────────────────────────────────
    - name: setup-namespace-and-configs
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - apply:
            file: 02-mandatory-lock-config.yaml
        # Seed general-policy with baseline effectiveConfig
        - script:
            content: |
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{
                  "status": {
                    "effectiveConfig": {
                      "mandatory": {
                        "lockRule": false,
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "defaults": {
                        "retentionPeriodValue": 0,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "unlockDelayValue": 30,
                        "unlockDelayUnit": "DAYS",
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "aws": {
                        "accountId": "123456789012",
                        "region": "us-east-1"
                      }
                    }
                  }
                }'
        # Seed mandatory-lock-policy with lockRule enforced via mandatory
        - script:
            content: |
              kubectl patch recyclebinconfig mandatory-lock-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch recyclebinconfig mandatory-lock-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{
                  "status": {
                    "effectiveConfig": {
                      "mandatory": {
                        "retentionPeriodValue": 14,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": true,
                        "unlockDelayValue": 7,
                        "unlockDelayUnit": "DAYS",
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "defaults": {
                        "retentionPeriodValue": 0,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "unlockDelayValue": 30,
                        "unlockDelayUnit": "DAYS",
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "aws": {
                        "accountId": "123456789012",
                        "region": "us-east-1"
                      }
                    }
                  }
                }'

    # ── AC-1: Region-level rule (no resourceTags), EBS_SNAPSHOT ───────────────
    - name: ac1-region-level-ebs-snapshot
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac1-region-ebs
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                retentionPeriodUnit: DAYS
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac1-region-ebs
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriod:
                  retentionPeriodValue: 7
                  retentionPeriodUnit: DAYS

    # ── AC-1: Region-level rule, EC2_IMAGE variant ────────────────────────────
    - name: ac1-region-level-ec2-image
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac1-region-ec2
                namespace: recyclebinrule
              spec:
                resourceType: EC2_IMAGE
                retentionPeriodValue: 30
                retentionPeriodUnit: DAYS
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac1-region-ec2
                namespace: recyclebinrule
              spec:
                resourceType: EC2_IMAGE
                retentionPeriod:
                  retentionPeriodValue: 30
                  retentionPeriodUnit: DAYS

    # ── AC-2: Tag-level rule (resourceTags present, max 5 pairs) ──────────────
    - name: ac2-tag-level-rule
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac2-tag-level
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 14
                resourceTags:
                  - resourceTagKey: Environment
                    resourceTagValue: production
                  - resourceTagKey: Team
                    resourceTagValue: platform
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac2-tag-level
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                resourceTags:
                  - resourceTagKey: Environment
                    resourceTagValue: production
                  - resourceTagKey: Team
                    resourceTagValue: platform

    # ── AC-6: tag-level rule with single resourceTags entry ──────────────────
    - name: ac6-tag-level-single-filter
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac6-single-tag
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 14
                resourceTags:
                  - resourceTagKey: Environment
                    resourceTagValue: production
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac6-single-tag
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                resourceTags:
                  - resourceTagKey: Environment
                    resourceTagValue: production

    # ── AC-3: retentionPeriodValue cascade — instance wins over defaults ───────
    - name: ac3-retention-instance-over-defaults
      try:
        # Update general-policy defaults to have retentionPeriodValue=3
        - script:
            content: |
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{
                  "status": {
                    "effectiveConfig": {
                      "mandatory": {
                        "lockRule": false,
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "defaults": {
                        "retentionPeriodValue": 3,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "unlockDelayValue": 30,
                        "unlockDelayUnit": "DAYS",
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "aws": {
                        "accountId": "123456789012",
                        "region": "us-east-1"
                      }
                    }
                  }
                }'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac3-retention-instance
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 21
                retentionPeriodUnit: DAYS
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac3-retention-instance
                namespace: recyclebinrule
              spec:
                retentionPeriod:
                  retentionPeriodValue: 21

    # ── AC-4: retentionPeriodValue cascade — defaults win when instance=0 ──────
    - name: ac4-retention-defaults-when-instance-unset
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac4-retention-defaults
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 0
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac4-retention-defaults
                namespace: recyclebinrule
              spec:
                retentionPeriod:
                  retentionPeriodValue: 3

    # ── AC-5: retentionPeriodUnit defaults to DAYS when not specified ──────────
    - name: ac5-retention-unit-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac5-unit-default
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 5
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac5-unit-default
                namespace: recyclebinrule
              spec:
                retentionPeriod:
                  retentionPeriodUnit: DAYS

    # ── AC-6: mandatory.retentionPeriodValue overrides instance ───────────────
    - name: ac6-mandatory-retention-override
      try:
        - script:
            content: |
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{
                  "status": {
                    "effectiveConfig": {
                      "mandatory": {
                        "retentionPeriodValue": 365,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "defaults": {
                        "retentionPeriodValue": 0,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "unlockDelayValue": 30,
                        "unlockDelayUnit": "DAYS",
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "aws": {
                        "accountId": "123456789012",
                        "region": "us-east-1"
                      }
                    }
                  }
                }'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac6-mandatory-retention
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac6-mandatory-retention
                namespace: recyclebinrule
              spec:
                retentionPeriod:
                  retentionPeriodValue: 365
        # Reset general-policy back to baseline
        - script:
            content: |
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{
                  "status": {
                    "effectiveConfig": {
                      "mandatory": {
                        "lockRule": false,
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "defaults": {
                        "retentionPeriodValue": 0,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "unlockDelayValue": 30,
                        "unlockDelayUnit": "DAYS",
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "aws": {
                        "accountId": "123456789012",
                        "region": "us-east-1"
                      }
                    }
                  }
                }'

    # ── AC-7: description appears in ACK Rule spec when set ───────────────────
    - name: ac7-description-present
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac7-description
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                description: "My production EBS snapshot retention rule"
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac7-description
                namespace: recyclebinrule
              spec:
                description: "My production EBS snapshot retention rule"

    # ── AC-8: description absent from ACK Rule when not set (kro strips "") ───
    - name: ac8-description-absent-when-empty
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac8-no-description
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac8-no-description
                namespace: recyclebinrule
              spec:
                (description): null

    # ── AC-9: lockRule=true → ackRbRuleLocked variant (lockConfiguration present) ──
    - name: ac9-lockrule-true-instance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac9-lock-instance
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                lockRule: true
                unlockDelayValue: 14
                unlockDelayUnit: DAYS
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac9-lock-instance
                namespace: recyclebinrule
              spec:
                lockConfiguration:
                  unlockDelay:
                    unlockDelayValue: 14
                    unlockDelayUnit: DAYS

    # ── AC-9: lockRule=false → ackRbRuleUnlocked variant (no lockConfiguration) ──
    - name: ac9-lockrule-false-no-lock-config
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac9-unlocked
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                lockRule: false
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac9-unlocked
                namespace: recyclebinrule
              spec:
                (lockConfiguration): null

    # ── AC-10: mandatory.lockRule=true overrides instance lockRule=false ───────
    - name: ac10-mandatory-lockrule-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac10-mandatory-lock
                namespace: recyclebinrule
              spec:
                configRef: mandatory-lock-policy
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                lockRule: false
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac10-mandatory-lock
                namespace: recyclebinrule
              spec:
                lockConfiguration:
                  unlockDelay:
                    unlockDelayValue: 7
                    unlockDelayUnit: DAYS

    # ── AC-11: unlockDelayValue/Unit cascade — instance wins over defaults ─────
    - name: ac11-unlock-delay-instance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac11-unlock-instance
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                lockRule: true
                unlockDelayValue: 45
                unlockDelayUnit: DAYS
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac11-unlock-instance
                namespace: recyclebinrule
              spec:
                lockConfiguration:
                  unlockDelay:
                    unlockDelayValue: 45
                    unlockDelayUnit: DAYS

    # ── AC-12: cloud tags from spec.tags appear on ACK Rule (jq for order-independence) ──
    - name: ac12-spec-tags-in-ack-rule
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac12-spec-tags
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                tags:
                  CostCenter: "cc-001"
                  Project: "kropath"
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac12-spec-tags
                namespace: recyclebinrule
        - script:
            content: |
              set -e
              TAGS=$(kubectl get rules.recyclebin.services.k8s.aws ac12-spec-tags \
                -n recyclebinrule -o json | jq -r '[.spec.tags[] | {(.key): .value}] | add')
              echo "$TAGS" | jq -e '."CostCenter" == "cc-001"'
              echo "$TAGS" | jq -e '."Project" == "kropath"'
              echo "PASS: spec.tags present in ACK Rule"

    # ── AC-13: mandatory.tags override instance tags (last-writer-wins) ────────
    - name: ac13-mandatory-tags-override
      try:
        - script:
            content: |
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{
                  "status": {
                    "effectiveConfig": {
                      "mandatory": {
                        "lockRule": false,
                        "tags": {"Environment": "production"},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "defaults": {
                        "retentionPeriodValue": 0,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "unlockDelayValue": 30,
                        "unlockDelayUnit": "DAYS",
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "aws": {
                        "accountId": "123456789012",
                        "region": "us-east-1"
                      }
                    }
                  }
                }'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac13-mandatory-tags
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                tags:
                  Environment: "staging"
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac13-mandatory-tags
                namespace: recyclebinrule
              spec:
                tags:
                  - key: Environment
                    value: production
        - script:
            content: |
              set -e
              TAGS=$(kubectl get rules.recyclebin.services.k8s.aws ac13-mandatory-tags \
                -n recyclebinrule -o json | jq -r '[.spec.tags[] | {(.key): .value}] | add')
              echo "$TAGS" | jq -e '."Environment" == "production"'
              echo "PASS: mandatory.tags.Environment overrides instance tag"
        - script:
            content: |
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{
                  "status": {
                    "effectiveConfig": {
                      "mandatory": {
                        "lockRule": false,
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "defaults": {
                        "retentionPeriodValue": 0,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "unlockDelayValue": 30,
                        "unlockDelayUnit": "DAYS",
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "aws": {
                        "accountId": "123456789012",
                        "region": "us-east-1"
                      }
                    }
                  }
                }'

    # ── AC-14: defaults.tags appear on ACK Rule ────────────────────────────────
    - name: ac14-defaults-tags
      try:
        - script:
            content: |
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{
                  "status": {
                    "effectiveConfig": {
                      "mandatory": {
                        "lockRule": false,
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "defaults": {
                        "retentionPeriodValue": 0,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "unlockDelayValue": 30,
                        "unlockDelayUnit": "DAYS",
                        "tags": {"ManagedBy": "kropath"},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "aws": {
                        "accountId": "123456789012",
                        "region": "us-east-1"
                      }
                    }
                  }
                }'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac14-defaults-tags
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac14-defaults-tags
                namespace: recyclebinrule
              spec:
                tags:
                  - key: ManagedBy
                    value: kropath
        - script:
            content: |
              set -e
              TAGS=$(kubectl get rules.recyclebin.services.k8s.aws ac14-defaults-tags \
                -n recyclebinrule -o json | jq -r '[.spec.tags[] | {(.key): .value}] | add')
              echo "$TAGS" | jq -e '."ManagedBy" == "kropath"'
              echo "PASS: defaults.tags present in ACK Rule"
        - script:
            content: |
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
              kubectl patch recyclebinconfig general-policy -n recyclebinrule \
                --subresource=status --type=merge -p '{
                  "status": {
                    "effectiveConfig": {
                      "mandatory": {
                        "lockRule": false,
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "defaults": {
                        "retentionPeriodValue": 0,
                        "retentionPeriodUnit": "DAYS",
                        "lockRule": false,
                        "unlockDelayValue": 30,
                        "unlockDelayUnit": "DAYS",
                        "tags": {},
                        "syncedLabels": {},
                        "syncedAnnotations": {}
                      },
                      "aws": {
                        "accountId": "123456789012",
                        "region": "us-east-1"
                      }
                    }
                  }
                }'

    # ── AC-15: syncedLabels from instance appear as aws.kropath.run/ K8s labels ──
    # ── AC-13: syncedLabels also appear in spec.tags (ADR-015 §6.1) ─────────────
    - name: ac15-synced-labels-on-ack-rule
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac15-synced-labels
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                syncedLabels:
                  app: myapp
        - assert:
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac15-synced-labels
                namespace: recyclebinrule
                labels:
                  app.kubernetes.io/instance: ac15-synced-labels
                  aws.kropath.run/app: myapp
        # AC-13: syncedLabels must also appear in spec.tags as {key, value} pairs (ADR-015 §6.1)
        - script:
            content: |
              set -e
              TAGS=$(kubectl get rules.recyclebin.services.k8s.aws ac15-synced-labels \
                -n recyclebinrule -o json | jq -r '[.spec.tags[] | {(.key): .value}] | add')
              echo "$TAGS" | jq -e '."app" == "myapp"'
              echo "PASS: syncedLabels appear in spec.tags as {key: app, value: myapp}"

    # ── AC-16: deletion-policy annotation from spec.deletionPolicy ────────────
    - name: ac16-deletion-policy-annotation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
