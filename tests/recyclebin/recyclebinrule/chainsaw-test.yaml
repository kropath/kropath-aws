                  app.kubernetes.io/instance: ac18-instance-label

    # ── AC-17 + AC-18: status fields and lockState propagation ───────────────
    # AC-17: ruleIdentifier, ruleArn, ruleStatus populated from ACK Rule status
    # AC-18: lockRule: true → status.lockState: "locked"
    # Simulates AWS reconciliation by patching ACK Rule status with kubectl.
    - name: ac17-ac18-status-fields-propagation
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac17-status-fields
                namespace: recyclebinrule
              spec:
                resourceType: EBS_SNAPSHOT
                retentionPeriodValue: 7
                lockRule: true
                unlockDelayValue: 14
        # Wait for kro to create the child ACK Rule before patching its status.
        - assert:
            timeout: 60s
            resource:
              apiVersion: recyclebin.services.k8s.aws/v1alpha1
              kind: Rule
              metadata:
                name: ac17-status-fields
                namespace: recyclebinrule
        - script:
            content: |
              set -eu
              # Simulate AWS reconciliation: patch ACK Rule status with identifier, arn, status, lockState
              kubectl patch rules.recyclebin.services.k8s.aws ac17-status-fields -n recyclebinrule \
                --subresource=status --type=merge \
                -p '{"status":{"identifier":"rhr-00abc123def456","status":"available","lockState":"locked","ackResourceMetadata":{"arn":"arn:aws:rbin:us-east-1:123456789012:rule/rhr-00abc123def456","ownerAccountID":"123456789012","region":"us-east-1"}}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac17-status-fields
                namespace: recyclebinrule
              status:
                ruleIdentifier: "rhr-00abc123def456"
                ruleStatus: "available"
                lockState: "locked"
                ruleArn: "arn:aws:rbin:us-east-1:123456789012:rule/rhr-00abc123def456"

    # ── AC-19: missing resourceType → validationError + no ACK Rule ──────────
    - name: ac19-missing-resource-type-validation-error
      try:
        - apply:
