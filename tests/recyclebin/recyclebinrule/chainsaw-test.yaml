        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinRule
              metadata:
                name: ac19-missing-type
                namespace: recyclebinrule
              status:
                (validationError != ""): true
        - script:
            content: |
              COUNT=$(kubectl get rules.recyclebin.services.k8s.aws ac19-missing-type \
                -n recyclebinrule --no-headers 2>/dev/null | wc -l)
              if [ "$COUNT" -ne 0 ]; then
                echo "FAIL: ACK Rule should not exist when resourceType is missing"
                exit 1
              fi
              echo "PASS: no ACK Rule created for missing resourceType"

