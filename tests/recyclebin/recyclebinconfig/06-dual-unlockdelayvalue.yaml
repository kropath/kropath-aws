# AC-6: unlockDelayValue set in BOTH mandatory and defaults is rejected.
---
apiVersion: aws.kropath.run/v1alpha1
kind: RecycleBinConfig
metadata:
  name: invalid-dual-unlockdelayvalue
  namespace: recyclebinconfig
spec:
  mandatory:
    retentionPeriodValue: 0
    retentionPeriodUnit: ""
    lockRule: false
    unlockDelayValue: 7
    unlockDelayUnit: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    retentionPeriodValue: 0
    retentionPeriodUnit: ""
    lockRule: false
    unlockDelayValue: 30
    unlockDelayUnit: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
