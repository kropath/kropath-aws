# aws-ebsrb-01 Chainsaw tests — 10 acceptance criteria for RecycleBinConfig CRD schema.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: recyclebinconfig
spec:
  skipDelete: true
  namespace: recyclebinconfig
  steps:
    - name: ac1-defaults-only-accepted
      try:
        - apply:
            file: 00-recyclebinconfig-namespace.yaml
        - apply:
            file: 01-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinConfig
              metadata:
                name: ac1-defaults-only
                namespace: recyclebinconfig
                labels:
                  aws.kropath.run/resource-name: ac1-defaults-only
              spec:
                defaults:
                  retentionPeriodValue: 7
                  retentionPeriodUnit: "DAYS"
                  lockRule: false

    - name: ac2-mandatory-only-accepted
      try:
        - apply:
            file: 02-mandatory-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinConfig
              metadata:
                name: ac2-mandatory-only
                namespace: recyclebinconfig
                labels:
                  aws.kropath.run/resource-name: ac2-mandatory-only
              spec:
                mandatory:
                  retentionPeriodValue: 90
                  retentionPeriodUnit: "DAYS"
                  lockRule: true
                  unlockDelayValue: 30
                  unlockDelayUnit: "DAYS"

    - name: ac3-reject-dual-tier-retentionperiodvalue
      try:
        - apply:
            file: 03-dual-retentionperiodvalue.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RecycleBinConfig
                check:
                  ($error != null): true

    - name: ac4-reject-dual-tier-retentionperiodunit
      try:
        - apply:
            file: 04-dual-retentionperiodunit.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RecycleBinConfig
                check:
                  ($error != null): true

    - name: ac5-reject-dual-tier-lockrule
      try:
        - apply:
            file: 05-dual-lockrule.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RecycleBinConfig
                check:
                  ($error != null): true

    - name: ac6-reject-dual-tier-unlockdelayvalue
      try:
        - apply:
            file: 06-dual-unlockdelayvalue.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RecycleBinConfig
                check:
                  ($error != null): true

    - name: ac7-reject-dual-tier-unlockdelayunit
      try:
        - apply:
            file: 07-dual-unlockdelayunit.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RecycleBinConfig
                check:
                  ($error != null): true

    - name: ac8-zero-value-sentinels-accepted
      try:
        - apply:
            file: 08-zero-value-sentinels.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: RecycleBinConfig
              metadata:
                name: ac8-zero-value-sentinels
                namespace: recyclebinconfig
                labels:
                  aws.kropath.run/resource-name: ac8-zero-value-sentinels
              spec:
                mandatory:
                  retentionPeriodValue: 0
                  lockRule: false
                defaults:
                  retentionPeriodValue: 7
                  retentionPeriodUnit: "DAYS"
                  lockRule: true

    - name: ac9-reject-retentionperiodvalue-above-max
      try:
        - apply:
            file: 09-retention-above-max.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RecycleBinConfig
                check:
                  ($error != null): true

    - name: ac10-reject-unlockdelayvalue-below-min
      try:
        - apply:
            file: 10-unlock-delay-below-min.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: RecycleBinConfig
                check:
                  ($error != null): true
