# AC-2: A mandatory-only RecycleBinConfig profile is accepted (defaults tier all zero-values).
---
apiVersion: aws.kropath.run/v1alpha1
kind: RecycleBinConfig
metadata:
  name: ac2-mandatory-only
  namespace: recyclebinconfig
  labels:
    aws.kropath.run/resource-name: ac2-mandatory-only
spec:
  mandatory:
    retentionPeriodValue: 90
    retentionPeriodUnit: "DAYS"
    lockRule: true
    unlockDelayValue: 30
    unlockDelayUnit: "DAYS"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    retentionPeriodValue: 0
    retentionPeriodUnit: ""
    lockRule: false
    unlockDelayValue: 0
    unlockDelayUnit: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
