# aws-secretsmanager-01 Chainsaw tests — one scenario per acceptance criterion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: secretsmanagerconfig
spec:
  namespace: secretsmanagerconfig
  steps:
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-namespace.yaml
        - script:
            content: |
              kubectl delete secretsmanagerconfig --all -n secretsmanagerconfig --ignore-not-found=true
              kubectl delete secretsmanagerconfig --all -n kro-system --ignore-not-found=true

    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SecretsManagerConfig
              metadata:
                name: general-policy
                namespace: secretsmanagerconfig
              spec:
                defaults:
                  kmsKeyID: ""
                  replicaRegions: []
                  forceOverwriteReplicaSecret: false
                  namingTemplate: "{namespace}-{name}"
      cleanup:
        - delete:
            file: 01-general-policy.yaml

    - name: ac2-reject-both-tiers-kmskeyid
      try:
        - apply:
            file: 02-invalid-kmskeyid-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SecretsManagerConfig
                check:
                  ($error != null): true

    - name: ac3-reject-both-tiers-replicaregions
      try:
        - apply:
            file: 03-invalid-replicaregions-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SecretsManagerConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-forceoverwrite
      try:
        - apply:
            file: 04-invalid-forceoverwrite-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SecretsManagerConfig
                check:
                  ($error != null): true

    - name: ac5-cascade-kc-mandatory
      try:
        - apply:
            file: 06-general-policy-cascade.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory.secretsManager.kmsKeyID
              # wins; merged into effectiveConfig.mandatory.kmsKeyID
              kubectl patch secretsmanagerconfig general-policy -n secretsmanagerconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyID":"arn:aws:kms:ap-southeast-2:123456789012:key/mrk-org","replicaRegions":[],"forceOverwriteReplicaSecret":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsKeyID":"","replicaRegions":[],"forceOverwriteReplicaSecret":false,"namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SecretsManagerConfig
              metadata:
                name: general-policy
                namespace: secretsmanagerconfig
              status:
                effectiveConfig:
                  mandatory:
                    kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-org"
                  defaults:
                    namingTemplate: "{namespace}-{name}"
                  aws:
                    region: "ap-southeast-2"
                    accountId: "123456789012"
            timeout: 60s

    - name: ac6-naming-defaults
      try:
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SecretsManagerConfig
              metadata:
                name: general-policy
                namespace: secretsmanagerconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
            timeout: 60s
      cleanup:
        - delete:
            file: 06-general-policy-cascade.yaml

    - name: ac7-pci-profile
      try:
        - apply:
            file: 07-pci.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SecretsManagerConfig
              metadata:
                name: pci
                namespace: secretsmanagerconfig
              spec:
                mandatory:
                  kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-pci"
                  replicaRegions:
                    - region: "us-west-2"
                      kmsKeyID: "arn:aws:kms:us-west-2:123456789012:key/mrk-dr"
                  tags:
                    classification: "pci"
      cleanup:
        - delete:
            file: 07-pci.yaml

    - name: ac8-dr-required-profile
      try:
        - apply:
            file: 08-dr-required.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SecretsManagerConfig
              metadata:
                name: dr-required
                namespace: secretsmanagerconfig
              spec:
                mandatory:
                  replicaRegions:
                    - region: "us-west-2"
                  forceOverwriteReplicaSecret: false
                defaults:
                  forceOverwriteReplicaSecret: false
      cleanup:
        - delete:
            file: 08-dr-required.yaml

    - name: ac9-tags-merge
      try:
        - apply:
            file: 09-tags-merge-config.yaml
        - script:
            content: |
              # Simulate controller cascade: KropathConfig mandatory.tags merged with
              # SecretsManagerConfig mandatory.tags; defaults.tags from SecretsManagerConfig
              kubectl patch secretsmanagerconfig general-policy -n secretsmanagerconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyID":"","replicaRegions":[],"forceOverwriteReplicaSecret":false,"namingTemplate":"","tags":{"resource-type":"secret","cost-centre":"security"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"kmsKeyID":"","replicaRegions":[],"forceOverwriteReplicaSecret":false,"namingTemplate":"","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SecretsManagerConfig
              metadata:
                name: general-policy
                namespace: secretsmanagerconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      resource-type: "secret"
                      cost-centre: "security"
                  defaults:
                    tags:
                      team: "platform"
            timeout: 60s
      cleanup:
        - delete:
            file: 09-tags-merge-config.yaml

    - name: ac10-synced-labels
      try:
        - apply:
            file: 10-synced-labels-config.yaml
        - script:
            content: |
              # Simulate controller writing effectiveConfig with mandatory.syncedLabels
              kubectl patch secretsmanagerconfig general-policy -n secretsmanagerconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"kmsKeyID":"","replicaRegions":[],"forceOverwriteReplicaSecret":false,"namingTemplate":"","tags":{},"syncedLabels":{"data-class":"confidential"},"syncedAnnotations":{}},"defaults":{"kmsKeyID":"","replicaRegions":[],"forceOverwriteReplicaSecret":false,"namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SecretsManagerConfig
              metadata:
                name: general-policy
                namespace: secretsmanagerconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: "confidential"
            timeout: 60s
      cleanup:
        - delete:
            file: 10-synced-labels-config.yaml

    - name: ac11-dev-profile
      try:
        - apply:
            file: 11-dev.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: SecretsManagerConfig
              metadata:
                name: dev
                namespace: secretsmanagerconfig
              spec:
                defaults:
                  kmsKeyID: ""
                  replicaRegions: []
                  forceOverwriteReplicaSecret: false
      cleanup:
        - delete:
            file: 11-dev.yaml

    - name: ac12-reject-both-tiers-namingtemplate
      try:
        - apply:
            file: 05-invalid-namingtemplate-both-tiers.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: SecretsManagerConfig
                check:
                  ($error != null): true
