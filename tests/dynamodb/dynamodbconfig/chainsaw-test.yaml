# aws-dynamodb-01 Chainsaw tests — all 15 acceptance criteria.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: dynamodbconfig
spec:
  skipDelete: true
  namespace: dynamodbconfig
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-dynamodbconfig-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: general-policy
                namespace: dynamodbconfig
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                defaults:
                  deletionProtectionEnabled: false
                  billingMode: ""
                  namingTemplate: "{namespace}-{name}"
    - name: ac2-production-profile-accepted
      try:
        - apply:
            file: 02-production-profile.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: production
                namespace: dynamodbconfig
                labels:
                  aws.kropath.run/resource-name: production
              spec:
                defaults:
                  deletionProtectionEnabled: true
                  pointInTimeRecoveryEnabled: true
    - name: ac3-reject-both-tiers-encryption
      try:
        - apply:
            file: 03-invalid-dual-tier-encryption.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DynamoDBConfig
                check:
                  ($error != null): true

    - name: ac4-reject-both-tiers-kms-key
      try:
        - apply:
            file: 04-invalid-dual-tier-kms-key.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DynamoDBConfig
                check:
                  ($error != null): true

    - name: ac5-reject-both-tiers-deletion-protection
      try:
        - apply:
            file: 05-invalid-dual-tier-deletion-protection.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DynamoDBConfig
                check:
                  ($error != null): true

    - name: ac6-reject-both-tiers-pitr
      try:
        - apply:
            file: 06-invalid-dual-tier-pitr.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DynamoDBConfig
                check:
                  ($error != null): true

    - name: ac7-reject-both-tiers-billing-mode
      try:
        - apply:
            file: 07-invalid-dual-tier-billing-mode.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DynamoDBConfig
                check:
                  ($error != null): true

    - name: ac8-reject-both-tiers-table-class
      try:
        - apply:
            file: 08-invalid-dual-tier-table-class.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DynamoDBConfig
                check:
                  ($error != null): true

    - name: ac9-reject-both-tiers-contributor-insights
      try:
        - apply:
            file: 09-invalid-dual-tier-contributor-insights.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DynamoDBConfig
                check:
                  ($error != null): true

    - name: ac10-reject-both-tiers-naming
      try:
        - apply:
            file: 10-invalid-dual-tier-naming.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: DynamoDBConfig
                check:
                  ($error != null): true

    - name: ac11-cascade-encryption-kc-mandatory
      try:
        - apply:
            file: 11-local-general-policy.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig general-policy -n dynamodbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":true,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: general-policy
                namespace: dynamodbconfig
              status:
                effectiveConfig:
                  mandatory:
                    encryptionEnabled: true
                  defaults:
                    encryptionEnabled: false
                    namingTemplate: "{namespace}-{name}"
    - name: ac12-cascade-naming-defaults
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig general-policy -n dynamodbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: general-policy
                namespace: dynamodbconfig
              status:
                effectiveConfig:
                  defaults:
                    namingTemplate: "{namespace}-{name}"
    - name: ac13-pci-profile-accepted
      try:
        - apply:
            file: 13-pci-profile.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: pci
                namespace: dynamodbconfig
                labels:
                  aws.kropath.run/resource-name: pci
              spec:
                mandatory:
                  encryptionEnabled: true
                  kmsMasterKeyId: "arn:aws:kms:ap-southeast-2:123456789012:key/pci-key"
                  deletionProtectionEnabled: true
                  pointInTimeRecoveryEnabled: true
    - name: ac14-cascade-tags-merge
      try:
        - apply:
            file: 14-tags-general-policy.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig general-policy -n dynamodbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{"resource-type":"database","cost-centre":"infra"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{"team":"platform"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: general-policy
                namespace: dynamodbconfig
              status:
                effectiveConfig:
                  mandatory:
                    tags:
                      resource-type: database
                      cost-centre: infra
                  defaults:
                    tags:
                      team: platform
    - name: ac15-cascade-synced-labels
      try:
        - apply:
            file: 15-synced-labels-general-policy.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig general-policy -n dynamodbconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{"data-class":"internal"},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: general-policy
                namespace: dynamodbconfig
              status:
                effectiveConfig:
                  mandatory:
                    syncedLabels:
                      data-class: internal
