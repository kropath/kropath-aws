              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac10-table
                namespace: dynamodbtable
              spec:
                deletionProtectionEnabled: true
    # AC-11: Instance deletionProtectionEnabled=true overrides defaults=false.
    #
    # NOTE ON SPEC DEVIATION: Spec AC11 describes the inverse direction
    # (defaults=true, instance=false explicit-disable → false). That scenario is
    # NOT achievable under kro v0.9.2: it strips zero-value booleans from the
    # instance spec, so an explicit `false` is indistinguishable from "unset".
    # The boolean cascade therefore uses OR-logic (mandatory || instance ||
    # defaults), which can only ADD/STRENGTHEN a flag, never disable a default
    # that is already true. This step verifies the achievable direction: an
    # instance can turn a boolean ON when defaults leave it off.
    # See docs/frequent-rgd-errors.md §"Boolean Cascade Cannot Disable a
    # Default-True Flag (kro v0.9.2 Zero-Value Stripping + OR-Logic)".
    - name: ac11-instance-deletion-protection-enable-over-default-off
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac11-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac11-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac11-table
                namespace: dynamodbtable
              spec:
                configRef: ac11-cfg
                deletionProtectionEnabled: true
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac11-table
                namespace: dynamodbtable
              spec:
                deletionProtectionEnabled: true
    # AC-12: mandatory.pointInTimeRecoveryEnabled=true → continuousBackups.pointInTimeRecoveryEnabled=true.
    - name: ac12-mandatory-pitr
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac12-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac12-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":true,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac12-table
                namespace: dynamodbtable
              spec:
                configRef: ac12-cfg
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac12-table
                namespace: dynamodbtable
              spec:
                continuousBackups:
                  pointInTimeRecoveryEnabled: true
    # AC-13: Instance spec.pointInTimeRecoveryEnabled=true.
    - name: ac13-instance-pitr-enable
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac13-cfg
