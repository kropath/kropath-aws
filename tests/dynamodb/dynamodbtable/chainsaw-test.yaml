        - apply:
            file: 28-policy-document.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig ac28-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac28-table
                namespace: dynamodbtable
              spec:
                configRef: ac28-cfg
                resourcePolicyRef: table-resource-policy
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - script:
            timeout: 30s
            content: |
              # resourcePolicyRef adds an extra externalRef hop (PolicyDocument lookup)
              # before kro's includeWhen gate on the child Table can resolve, so the
              # object may not exist yet on the very first check — unlike a value
              # mismatch, chainsaw's assert does not retry a missing resource, so poll
              # for existence first.
              for i in $(seq 1 15); do
                RESOURCE_POLICY=$(kubectl get table ac28-table -n dynamodbtable -o jsonpath='{.spec.resourcePolicy}' 2>/dev/null)
                if [ -n "$RESOURCE_POLICY" ]; then
                  echo "PASS: resourcePolicy is set (length ${#RESOURCE_POLICY})"
                  exit 0
                fi
                echo "Attempt $i: Table not found or resourcePolicy not yet set, waiting..."
                sleep 2
              done
              echo "FAIL: resourcePolicy still not set after 30 seconds"
              kubectl get table ac28-table -n dynamodbtable -o yaml
              exit 1
