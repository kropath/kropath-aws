              for i in $(seq 1 15); do
                TAGS=$(kubectl get table ac34-table -n dynamodbtable -o json 2>/dev/null | jq -c '.spec.tags')
                if [ -n "$TAGS" ] && [ "$TAGS" != "null" ]; then
                  if echo "$TAGS" | jq -e '
                    (map(select(.key == "env")) | length == 1 and .[0].value == "prod") and
                    (map(select(.key == "cost-centre")) | length == 1 and .[0].value == "infra") and
                    (map(select(.key == "team")) | length == 1 and .[0].value == "platform") and
                    (map(select(.key == "service")) | length == 1 and .[0].value == "orders")
                  ' >/dev/null; then
                    echo "PASS: all 4 cascade tags present"
                    exit 0
                  fi
                fi
                echo "Attempt $i: Table not found or tags not yet merged, waiting..."
                sleep 2
              done
              echo "FAIL: cascade tags not merged after 30 seconds"
              kubectl get table ac34-table -n dynamodbtable -o yaml
              exit 1
