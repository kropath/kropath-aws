        - script:
            content: |
              kubectl patch dynamodbconfig ac10-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":true,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac10-table
