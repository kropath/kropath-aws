              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac9-table
                namespace: dynamodbtable
              spec:
                deletionProtectionEnabled: true
    # AC-10: defaults.deletionProtectionEnabled=true when no mandatory/instance set.
    - name: ac10-default-deletion-protection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac10-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
