# Canonical pattern (docs/frequent-rgd-errors.md "CANONICAL: Unique-Name-Per-Step +
# skipDelete"): every step creates a uniquely-named DynamoDBConfig + DynamoDBTable and
# deletes nothing between steps, so no ACK finalizer ever blocks a delete and kro's
# per-object-key backoff never compounds. Test-level skipDelete: true stops chainsaw's
# end-of-test cascade delete; the ephemeral kind cluster is discarded after the suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: dynamodbtable
spec:
  # Canonical pattern (see docs/frequent-rgd-errors.md §"CANONICAL: Unique-Name-
  # Per-Step + skipDelete"): every step uses a unique config+table name and deletes
  # nothing between steps; skipDelete stops chainsaw's end-of-test cascade delete (the
  # cluster runs kro but no ACK controllers, so ACK finalizers are never removed and any
  # delete would hang). The ephemeral kind cluster is discarded after the suite.
  skipDelete: true
  namespace: dynamodbtable
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: When no billingMode is set anywhere, ACK Table defaults to PAY_PER_REQUEST.
    - name: ac1-default-billing-mode-ondemand
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac1-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac1-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac1-table
                namespace: dynamodbtable
              spec:
                configRef: ac1-cfg
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac1-table
                namespace: dynamodbtable
              spec:
                billingMode: PAY_PER_REQUEST
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac1-table
                namespace: dynamodbtable
              status:
                resourceName: dynamodbtable-ac1-table
                namingStatus: valid
    # AC-2: When mandatory.billingMode=PROVISIONED, ACK Table uses PROVISIONED.
    - name: ac2-mandatory-billing-mode-provisioned
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac2-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac2-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"PROVISIONED","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac2-table
                namespace: dynamodbtable
              spec:
                configRef: ac2-cfg
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
                provisionedThroughput:
                  readCapacityUnits: 5
                  writeCapacityUnits: 5
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac2-table
                namespace: dynamodbtable
              spec:
                billingMode: PROVISIONED
                provisionedThroughput:
                  readCapacityUnits: 5
                  writeCapacityUnits: 5
    # AC-3: When spec.billingMode=PROVISIONED (no mandatory), uses PROVISIONED.
    - name: ac3-instance-billing-mode-provisioned
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac3-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac3-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac3-table
                namespace: dynamodbtable
              spec:
                configRef: ac3-cfg
                billingMode: PROVISIONED
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
                provisionedThroughput:
                  readCapacityUnits: 10
                  writeCapacityUnits: 10
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac3-table
                namespace: dynamodbtable
              spec:
                billingMode: PROVISIONED
    # AC-4: Resolved billingMode=PAY_PER_REQUEST; instance onDemandThroughput caps
    # propagate to the ACK Table's spec.onDemandThroughput.
    - name: ac4-ondemand-throughput-caps
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac4-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac4-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac4-table
                namespace: dynamodbtable
              spec:
                configRef: ac4-cfg
                onDemandThroughput:
                  maxReadRequestUnits: 1000
                  maxWriteRequestUnits: 500
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac4-table
                namespace: dynamodbtable
              spec:
                billingMode: PAY_PER_REQUEST
                onDemandThroughput:
                  maxReadRequestUnits: 1000
                  maxWriteRequestUnits: 500
    # AC-5: Default encryption disabled — sseSpecification.enabled=false.
    - name: ac5-encryption-default-disabled
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac5-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac5-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac5-table
                namespace: dynamodbtable
              spec:
                configRef: ac5-cfg
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac5-table
                namespace: dynamodbtable
              spec:
                sseSpecification:
                  enabled: false
    # AC-6: mandatory.encryptionEnabled=true with KMS key → sseType=KMS.
    - name: ac6-mandatory-encryption-kms-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac6-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac6-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":true,"kmsMasterKeyId":"arn:aws:kms:ap-southeast-2:123456789012:key/mandatory-key","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac6-table
                namespace: dynamodbtable
              spec:
                configRef: ac6-cfg
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac6-table
                namespace: dynamodbtable
              spec:
                sseSpecification:
                  enabled: true
                  sseType: KMS
                  kmsMasterKeyID: arn:aws:kms:ap-southeast-2:123456789012:key/mandatory-key
    # AC-7: Instance spec.encryption.enabled=true with KMS key.
    - name: ac7-instance-encryption-kms
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac7-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac7-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac7-table
                namespace: dynamodbtable
              spec:
                configRef: ac7-cfg
                encryption:
                  enabled: true
                  kmsMasterKeyId: arn:aws:kms:ap-southeast-2:123456789012:key/instance-key
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac7-table
                namespace: dynamodbtable
              spec:
                sseSpecification:
                  enabled: true
                  sseType: KMS
                  kmsMasterKeyID: arn:aws:kms:ap-southeast-2:123456789012:key/instance-key
    # AC-8: mandatory.encryptionEnabled=true without explicit KMS key uses default KMS.
    - name: ac8-mandatory-encryption-no-key
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac8-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac8-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":true,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac8-table
                namespace: dynamodbtable
              spec:
                configRef: ac8-cfg
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: ac8-table
                namespace: dynamodbtable
              spec:
                sseSpecification:
                  enabled: true
                  sseType: KMS
    # AC-9: mandatory.deletionProtectionEnabled=true enforced regardless of instance.
    - name: ac9-mandatory-deletion-protection
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBConfig
              metadata:
                name: ac9-cfg
                namespace: dynamodbtable
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  namingTemplate: "{namespace}-{name}"
        - script:
            content: |
              kubectl patch dynamodbconfig ac9-cfg -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":true,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: ac9-table
                namespace: dynamodbtable
              spec:
                configRef: ac9-cfg
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
