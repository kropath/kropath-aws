#
# Each step has a cleanup: script that removes ACK Table CR finalizers and
# deletes Table and DynamoDBTable CRs. No ACK controllers run in the test
# cluster (only CRD definitions are installed), so ACK finalizers block
# deletion. Strip finalizers and use --wait=false so cleanup completes
# immediately and does not hang waiting for AWS confirmation.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: dynamodbtable
spec:
  namespace: dynamodbtable
  steps:
    - name: setup-namespace
      try:
        - apply:
            file: 00-namespace.yaml

    # AC-1: When no billingMode is set anywhere, ACK Table defaults to PAY_PER_REQUEST.
    - name: ac1-default-billing-mode-ondemand
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig general-policy -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                configRef: general-policy
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                billingMode: PAY_PER_REQUEST
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: test-table
                namespace: dynamodbtable
              status:
                resourceName: dynamodbtable-test-table
                namingStatus: valid
      cleanup:
        - script:
            content: |
              for name in $(kubectl get table -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch table "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete table --all -n dynamodbtable --ignore-not-found=true --wait=false
              for name in $(kubectl get dynamodbtable -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch dynamodbtable "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete dynamodbtable --all -n dynamodbtable --ignore-not-found=true
              kubectl delete dynamodbconfig general-policy -n dynamodbtable --ignore-not-found=true --wait=false

    # AC-2: When mandatory.billingMode=PROVISIONED, ACK Table uses PROVISIONED.
    - name: ac2-mandatory-billing-mode-provisioned
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig general-policy -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"PROVISIONED","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                configRef: general-policy
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
                provisionedThroughput:
                  readCapacityUnits: 5
                  writeCapacityUnits: 5
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                billingMode: PROVISIONED
                provisionedThroughput:
                  readCapacityUnits: 5
                  writeCapacityUnits: 5
      cleanup:
        - script:
            content: |
              for name in $(kubectl get table -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch table "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete table --all -n dynamodbtable --ignore-not-found=true --wait=false
              for name in $(kubectl get dynamodbtable -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch dynamodbtable "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete dynamodbtable --all -n dynamodbtable --ignore-not-found=true
              kubectl delete dynamodbconfig general-policy -n dynamodbtable --ignore-not-found=true --wait=false

    # AC-3: When spec.billingMode=PROVISIONED (no mandatory), uses PROVISIONED.
    - name: ac3-instance-billing-mode-provisioned
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig general-policy -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                configRef: general-policy
                billingMode: PROVISIONED
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
                provisionedThroughput:
                  readCapacityUnits: 10
                  writeCapacityUnits: 10
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                billingMode: PROVISIONED
      cleanup:
        - script:
            content: |
              for name in $(kubectl get table -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch table "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete table --all -n dynamodbtable --ignore-not-found=true --wait=false
              for name in $(kubectl get dynamodbtable -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch dynamodbtable "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete dynamodbtable --all -n dynamodbtable --ignore-not-found=true
              kubectl delete dynamodbconfig general-policy -n dynamodbtable --ignore-not-found=true --wait=false

    # AC-4: Mandatory wins over instance billing mode.
    - name: ac4-mandatory-billing-mode-wins-over-instance
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig general-policy -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"PAY_PER_REQUEST","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                configRef: general-policy
                billingMode: PROVISIONED
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                billingMode: PAY_PER_REQUEST
      cleanup:
        - script:
            content: |
              for name in $(kubectl get table -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch table "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete table --all -n dynamodbtable --ignore-not-found=true --wait=false
              for name in $(kubectl get dynamodbtable -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch dynamodbtable "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete dynamodbtable --all -n dynamodbtable --ignore-not-found=true
              kubectl delete dynamodbconfig general-policy -n dynamodbtable --ignore-not-found=true --wait=false

    # AC-5: Default encryption disabled — sseSpecification.enabled=false.
    - name: ac5-encryption-default-disabled
      try:
        - apply:
            file: 01-general-policy.yaml
        - script:
            content: |
              kubectl patch dynamodbconfig general-policy -n dynamodbtable \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"encryptionEnabled":false,"kmsMasterKeyId":"","deletionProtectionEnabled":false,"pointInTimeRecoveryEnabled":false,"billingMode":"","tableClass":"","contributorInsights":"","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: DynamoDBTable
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                configRef: general-policy
                attributeDefinitions:
                  - attributeName: pk
                    attributeType: S
                keySchema:
                  - attributeName: pk
                    keyType: HASH
        - assert:
            resource:
              apiVersion: dynamodb.services.k8s.aws/v1alpha1
              kind: Table
              metadata:
                name: test-table
                namespace: dynamodbtable
              spec:
                sseSpecification:
                  enabled: false
      cleanup:
        - script:
            content: |
              for name in $(kubectl get table -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch table "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete table --all -n dynamodbtable --ignore-not-found=true --wait=false
              for name in $(kubectl get dynamodbtable -n dynamodbtable -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl patch dynamodbtable "$name" -n dynamodbtable --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
              kubectl delete dynamodbtable --all -n dynamodbtable --ignore-not-found=true
              kubectl delete dynamodbconfig general-policy -n dynamodbtable --ignore-not-found=true --wait=false

    # AC-6: mandatory.encryptionEnabled=true with KMS key → sseType=KMS.
    - name: ac6-mandatory-encryption-kms-override
      try:
        - apply:
