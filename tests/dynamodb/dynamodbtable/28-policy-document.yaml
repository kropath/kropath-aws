apiVersion: aws.kropath.run/v1alpha1
kind: PolicyDocument
metadata:
  name: table-resource-policy
  namespace: dynamodbtable
  labels:
    aws.kropath.run/resource-name: table-resource-policy
spec:
  documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:root"},"Action":["dynamodb:GetItem","dynamodb:PutItem"],"Resource":"*"}]}'
