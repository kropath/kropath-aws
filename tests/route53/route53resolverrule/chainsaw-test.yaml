# Route53ResolverRule Chainsaw tests — canonical pattern. Naming: effectiveName.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53resolverrule
spec:
  skipDelete: true
  namespace: route53resolverrule
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53resolverrule

    # AC1 — naming: effectiveName = {namespace}-{name} when no nameOverride.
    - name: ac1-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac1-rule
                namespace: route53resolverrule
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: example.internal.
                targetIPs:
                  - ip: 10.0.0.1
                    port: 53
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac1-rule-naming
                namespace: route53resolverrule
              data:
                effectiveName: route53resolverrule-ac1-rule

    # AC2 — naming: effectiveName = nameOverride when provided.
    - name: ac2-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac2-rule
                namespace: route53resolverrule
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                nameOverride: custom-forward-rule
                ruleType: FORWARD
                domainName: custom.internal.
                targetIPs:
                  - ip: 10.0.0.2
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac2-rule-naming
                namespace: route53resolverrule
              data:
                effectiveName: custom-forward-rule

    # AC3 — ACK ResolverRule spec is wired: name = effectiveName, domainName, ruleType.
    - name: ac3-ack-spec-wired
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac3-rule
                namespace: route53resolverrule
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: wired.internal.
                targetIPs:
                  - ip: 10.0.0.3
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac3-rule
                namespace: route53resolverrule
              spec:
                name: route53resolverrule-ac3-rule
                domainName: wired.internal.
                ruleType: FORWARD

    # AC4 — tags governance: mandatory wins over instance.
    - name: ac4-tags-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{"env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac4-rule
                namespace: route53resolverrule
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: tags.internal.
                tags:
                  env: instance-env
                targetIPs:
                  - ip: 10.0.0.4
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac4-rule
                namespace: route53resolverrule
        - script:
            content: |
              for i in $(seq 1 15); do
                TAGS=$(kubectl get resolverrules.route53resolver.services.k8s.aws ac4-rule -n route53resolverrule -o json 2>/dev/null | jq -r '.spec.tags // [] | map("\(.key)=\(.value)") | sort | join(",")')
                echo "$TAGS" | grep -q "env=prod" && break
                sleep 2
              done
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || { echo "FAIL: env not mandatory prod"; exit 1; }
              echo "PASS: tags governance verified"

    # AC5 — ownerReference set on ACK ResolverRule.
    - name: ac5-owner-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac5-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac5-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac5-rule
                namespace: route53resolverrule
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                ruleType: SYSTEM
                domainName: owner.internal.
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac5-rule
                namespace: route53resolverrule
        - script:
            content: |
              for i in $(seq 1 15); do
                OWNER_KIND=$(kubectl get resolverrules.route53resolver.services.k8s.aws ac5-rule -n route53resolverrule -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null)
                [ -n "$OWNER_KIND" ] && break
                sleep 2
              done
              [ "$OWNER_KIND" = "Route53ResolverRule" ] || { echo "FAIL: expected Route53ResolverRule owner, got $OWNER_KIND"; exit 1; }
              echo "PASS: ownerReference verified"

    # AC6 — synced-labels: mandatory syncedLabels propagate to ACK child metadata.labels with aws.kropath.run/ prefix.
    - name: ac6-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac6-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac6-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{"env":"prod"},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac6-rule
                namespace: route53resolverrule
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                ruleType: SYSTEM
                domainName: synced-labels.internal.
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac6-rule
                namespace: route53resolverrule
        - script:
            content: |
              for i in $(seq 1 15); do
                LABEL=$(kubectl get resolverrules.route53resolver.services.k8s.aws ac6-rule -n route53resolverrule -o jsonpath='{.metadata.labels.aws\.kropath\.run/env}' 2>/dev/null)
                [ -n "$LABEL" ] && break
                sleep 2
              done
              [ "$LABEL" = "prod" ] || { echo "FAIL: expected aws.kropath.run/env=prod, got $LABEL"; exit 1; }
              echo "PASS: synced-labels propagated to ACK ResolverRule labels"

    # AC7 — standard metadata: managed-by, instance label, and deletion-policy retain on ACK child.
    - name: ac7-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac7-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac7-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac7-rule
                namespace: route53resolverrule
              spec:
                configRef: ac7-cfg
                deletionPolicy: retain
                ruleType: SYSTEM
                domainName: std-metadata.internal.
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac7-rule
                namespace: route53resolverrule
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac7-rule
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC8 — deletion-delete: deletion-policy=delete annotation wired on ACK ResolverRule.
    - name: ac8-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac8-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac8-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac8-rule
                namespace: route53resolverrule
              spec:
                configRef: ac8-cfg
                deletionPolicy: delete
                ruleType: SYSTEM
                domainName: deletion-delete.internal.
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac8-rule
                namespace: route53resolverrule
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC9 — config-selector: configRef="restricted" selects Route53Config by aws.kropath.run/resource-name label.
    - name: ac9-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: restricted
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: restricted
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config restricted -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac9-rule
                namespace: route53resolverrule
              spec:
                configRef: restricted
                deletionPolicy: retain
                ruleType: SYSTEM
                domainName: config-selector.internal.
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac9-rule
                namespace: route53resolverrule
        - script:
            content: |
              for i in $(seq 1 15); do
                NAME=$(kubectl get resolverrules.route53resolver.services.k8s.aws ac9-rule -n route53resolverrule -o jsonpath='{.spec.name}' 2>/dev/null)
                [ -n "$NAME" ] && break
                sleep 2
              done
              [ "$NAME" = "route53resolverrule-ac9-rule" ] || { echo "FAIL: expected route53resolverrule-ac9-rule, got $NAME"; exit 1; }
              echo "PASS: config-selector resolved via restricted configRef"

    # AC3 — IPv6 targets: targetIPs with ipv6 field wired through to ACK ResolverRule.
    - name: ac10-ipv6-targets
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac10-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac10-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac10-rule
                namespace: route53resolverrule
              spec:
                configRef: ac10-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: ipv6.internal.
                targetIPs:
                  - ipv6: "2001:db8::1"
                    port: 53
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac10-rule
                namespace: route53resolverrule
        - script:
            content: |
              for i in $(seq 1 15); do
                IPV6=$(kubectl get resolverrules.route53resolver.services.k8s.aws ac10-rule -n route53resolverrule -o json 2>/dev/null | jq -r '.spec.targetIPs[0].ipv6 // ""')
                [ -n "$IPV6" ] && break
                sleep 2
              done
              [ "$IPV6" = "2001:db8::1" ] || { echo "FAIL: expected ipv6 2001:db8::1, got $IPV6"; exit 1; }
              echo "PASS: IPv6 targetIP wired to ACK ResolverRule"

    # AC1 extension — resolverEndpointRef: FORWARD rule with resolverEndpointRef wired to ACK child spec.
    - name: ac11-resolver-endpoint-ref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac11-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac11-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac11-rule
                namespace: route53resolverrule
              spec:
                configRef: ac11-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: endpoint-ref.internal.
                resolverEndpointRef: prod-outbound
                targetIPs:
                  - ip: "10.1.1.1"
                    port: 53
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac11-rule
                namespace: route53resolverrule
        - script:
            content: |
              for i in $(seq 1 15); do
                EP_NAME=$(kubectl get resolverrules.route53resolver.services.k8s.aws ac11-rule -n route53resolverrule -o jsonpath='{.spec.resolverEndpointRef.from.name}' 2>/dev/null)
                [ -n "$EP_NAME" ] && break
                sleep 2
              done
              [ "$EP_NAME" = "prod-outbound" ] || { echo "FAIL: expected prod-outbound in resolverEndpointRef.from.name, got $EP_NAME"; exit 1; }
              echo "PASS: resolverEndpointRef wired to ACK ResolverRule"

    # AC11 (negative) — FORWARD without resolverEndpointRef: CR admitted; Route53 API error is
    # AWS-only and cannot be validated in a local cluster without ACK controllers.
    - name: ac12-negative-forward-no-endpoint
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac12-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac12-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac12-rule
                namespace: route53resolverrule
              spec:
                configRef: ac12-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: no-endpoint.internal.
                resolverEndpointRef: ""
                targetIPs:
                  - ip: "10.1.1.1"
                    port: 53
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac12-rule
                namespace: route53resolverrule
        - script:
            content: |
              for i in $(seq 1 15); do
                EXISTS=$(kubectl get resolverrules.route53resolver.services.k8s.aws ac12-rule -n route53resolverrule -o name 2>/dev/null)
                [ -n "$EXISTS" ] && break
                sleep 2
              done
              [ -n "$EXISTS" ] || { echo "FAIL: ACK child not created"; exit 1; }
              echo "PASS: CR with empty resolverEndpointRef admitted; Route53 API error (FORWARD requires endpoint) is AWS-only"

    # AC12 (negative) — mixed IPv4/IPv6 targetIPs: ACK child created with both entries;
    # Route53 API rejects mixed families in real AWS environment.
    - name: ac13-negative-mixed-ip-families
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac13-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac13-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac13-rule
                namespace: route53resolverrule
              spec:
                configRef: ac13-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: mixed-ip.internal.
                targetIPs:
                  - ip: "10.1.1.1"
                    port: 53
                  - ipv6: "2001:db8::1"
                    port: 53
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac13-rule
                namespace: route53resolverrule
        - script:
            content: |
              for i in $(seq 1 15); do
                COUNT=$(kubectl get resolverrules.route53resolver.services.k8s.aws ac13-rule -n route53resolverrule -o json 2>/dev/null | jq '.spec.targetIPs | length')
                [ "$COUNT" = "2" ] && break
                sleep 2
              done
              [ "$COUNT" = "2" ] || { echo "FAIL: expected 2 targetIPs, got $COUNT"; exit 1; }
              echo "PASS: mixed IPv4/IPv6 targetIPs passed to ACK child — Route53 API rejects mixed families in real AWS"
