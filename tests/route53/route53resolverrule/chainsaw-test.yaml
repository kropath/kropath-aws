# Route53ResolverRule Chainsaw tests — canonical pattern. Naming: effectiveName.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53resolverrule
spec:
  skipDelete: true
  namespace: route53resolverrule
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53resolverrule

    # AC1 — naming: effectiveName = {namespace}-{name} when no nameOverride.
    - name: ac1-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac1-rule
                namespace: route53resolverrule
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: example.internal.
                targetIPs:
                  - ip: 10.0.0.1
                    port: 53
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac1-rule-naming
                namespace: route53resolverrule
              data:
                effectiveName: route53resolverrule-ac1-rule

    # AC2 — naming: effectiveName = nameOverride when provided.
    - name: ac2-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac2-rule
                namespace: route53resolverrule
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                nameOverride: custom-forward-rule
                ruleType: FORWARD
                domainName: custom.internal.
                targetIPs:
                  - ip: 10.0.0.2
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac2-rule-naming
                namespace: route53resolverrule
              data:
                effectiveName: custom-forward-rule

    # AC3 — ACK ResolverRule spec is wired: name = effectiveName, domainName, ruleType.
    - name: ac3-ack-spec-wired
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac3-rule
                namespace: route53resolverrule
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: wired.internal.
                targetIPs:
                  - ip: 10.0.0.3
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRule
              metadata:
                name: ac3-rule
                namespace: route53resolverrule
              spec:
                name: route53resolverrule-ac3-rule
                domainName: wired.internal.
                ruleType: FORWARD

    # AC4 — tags governance: mandatory wins over instance.
    - name: ac4-tags-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{"env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac4-rule
                namespace: route53resolverrule
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                ruleType: FORWARD
                domainName: tags.internal.
                tags:
                  env: instance-env
                targetIPs:
                  - ip: 10.0.0.4
        - script:
            content: |
              TAGS=$(kubectl get resolverrule ac4-rule -n route53resolverrule -o json | jq -r '.spec.tags // [] | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || { echo "FAIL: env not mandatory prod"; exit 1; }
              echo "PASS: tags governance verified"

    # AC5 — ownerReference set on ACK ResolverRule.
    - name: ac5-owner-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac5-cfg
                namespace: route53resolverrule
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac5-cfg -n route53resolverrule \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRule
              metadata:
                name: ac5-rule
                namespace: route53resolverrule
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                ruleType: SYSTEM
                domainName: owner.internal.
        - script:
            content: |
              OWNER_KIND=$(kubectl get resolverrule ac5-rule -n route53resolverrule -o jsonpath='{.metadata.ownerReferences[0].kind}')
              [ "$OWNER_KIND" = "Route53ResolverRule" ] || { echo "FAIL: expected Route53ResolverRule owner, got $OWNER_KIND"; exit 1; }
              echo "PASS: ownerReference verified"
