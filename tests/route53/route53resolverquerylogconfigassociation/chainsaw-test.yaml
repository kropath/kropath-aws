# Route53ResolverQueryLogConfigAssociation Chainsaw tests — canonical pattern.
# No naming (resource has no cloud name field), no cloud tags (ACK limitation).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53resolverquerylogconfigassociation
spec:
  skipDelete: true
  namespace: route53resolverqlcassoc
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53resolverqlcassoc

    # AC1 — standard association is accepted and wired to ACK ResolverQueryLogConfigAssociation.
    - name: ac1-standard-association
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53resolverqlcassoc
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53resolverqlcassoc \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac1-assoc
                namespace: route53resolverqlcassoc
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                resolverQueryLogConfigRef: my-qlc
                resourceID: vpc-12345
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfigAssociation
              metadata:
                name: ac1-assoc
                namespace: route53resolverqlcassoc
              spec:
                resourceID: vpc-12345

    # AC2 — deletion-policy annotation wired correctly.
    - name: ac2-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53resolverqlcassoc
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53resolverqlcassoc \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac2-assoc
                namespace: route53resolverqlcassoc
              spec:
                configRef: ac2-cfg
                deletionPolicy: delete
                resolverQueryLogConfigRef: my-qlc
                resourceID: vpc-67890
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfigAssociation
              metadata:
                name: ac2-assoc
                namespace: route53resolverqlcassoc
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC3 — syncedLabels are propagated to K8s labels on ACK resource.
    - name: ac3-synced-labels-propagated
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53resolverqlcassoc
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53resolverqlcassoc \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{"team":"platform"},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac3-assoc
                namespace: route53resolverqlcassoc
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                resolverQueryLogConfigRef: my-qlc
                resourceID: vpc-abc123
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfigAssociation
              metadata:
                name: ac3-assoc
                namespace: route53resolverqlcassoc
                labels:
                  aws.kropath.run/team: platform

    # AC4 — ownerReference set on ACK ResolverQueryLogConfigAssociation.
    - name: ac4-owner-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53resolverqlcassoc
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53resolverqlcassoc \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac4-assoc
                namespace: route53resolverqlcassoc
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                resolverQueryLogConfigRef: my-qlc
                resourceID: vpc-def456
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfigAssociation
              metadata:
                name: ac4-assoc
                namespace: route53resolverqlcassoc
        - script:
            content: |
              for i in $(seq 1 15); do
                OWNER_KIND=$(kubectl get resolverquerylogconfigassociations.route53resolver.services.k8s.aws ac4-assoc -n route53resolverqlcassoc -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null)
                [ -n "$OWNER_KIND" ] && break
                sleep 2
              done
              [ "$OWNER_KIND" = "Route53ResolverQueryLogConfigAssociation" ] || { echo "FAIL: expected Route53ResolverQueryLogConfigAssociation owner, got $OWNER_KIND"; exit 1; }
              echo "PASS: ownerReference verified"

    # AC5 — standard metadata: managed-by, instance label, and deletion-policy annotation on ACK child.
    - name: ac5-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac5-cfg
                namespace: route53resolverqlcassoc
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac5-cfg -n route53resolverqlcassoc \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac5-assoc
                namespace: route53resolverqlcassoc
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                resolverQueryLogConfigRef: my-qlc
                resourceID: vpc-aa001
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfigAssociation
              metadata:
                name: ac5-assoc
                namespace: route53resolverqlcassoc
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac5-assoc
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC6 — deletion-policy retain (explicit default): annotation set to "retain" on ACK child.
    - name: ac6-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac6-cfg
                namespace: route53resolverqlcassoc
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac6-cfg -n route53resolverqlcassoc \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac6-assoc
                namespace: route53resolverqlcassoc
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                resolverQueryLogConfigRef: my-qlc
                resourceID: vpc-bb002
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfigAssociation
              metadata:
                name: ac6-assoc
                namespace: route53resolverqlcassoc
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC7 — config selector: spec.configRef selects Route53Config by label (Theme 28).
    - name: ac7-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: restricted-assoc
                namespace: route53resolverqlcassoc
                labels:
                  aws.kropath.run/resource-name: restricted-assoc
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config restricted-assoc -n route53resolverqlcassoc \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac7-assoc
                namespace: route53resolverqlcassoc
              spec:
                configRef: restricted-assoc
                deletionPolicy: retain
                resolverQueryLogConfigRef: my-qlc
                resourceID: vpc-cc003
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfigAssociation
              metadata:
                name: ac7-assoc
                namespace: route53resolverqlcassoc

    # AC8 — status outputs: ACK child exists (associationID/associationStatus require live AWS).
    - name: ac8-status-outputs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac8-cfg
                namespace: route53resolverqlcassoc
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac8-cfg -n route53resolverqlcassoc \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac8-assoc
                namespace: route53resolverqlcassoc
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
                resolverQueryLogConfigRef: my-qlc
                resourceID: vpc-dd004
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfigAssociation
              metadata:
                name: ac8-assoc
                namespace: route53resolverqlcassoc
              spec:
                resourceID: vpc-dd004

    # AC9 — negative: CR without resolverQueryLogConfigRef is rejected at admission (required field).
    - name: ac9-missing-config-ref
      try:
        - script:
            content: |
              kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac9-assoc-bad
                namespace: route53resolverqlcassoc
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                resourceID: vpc-ee005
              EOF
              EXIT=$?
              [ "$EXIT" -ne 0 ] && echo "PASS: CR correctly rejected (resolverQueryLogConfigRef required)" || { echo "FAIL: CR was accepted but resolverQueryLogConfigRef is required"; exit 1; }

    # AC10 — negative: CR without resourceID (vpcID) is rejected at admission (required field).
    - name: ac10-missing-vpc-id
      try:
        - script:
            content: |
              kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfigAssociation
              metadata:
                name: ac10-assoc-bad
                namespace: route53resolverqlcassoc
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                resolverQueryLogConfigRef: my-qlc
              EOF
              EXIT=$?
              [ "$EXIT" -ne 0 ] && echo "PASS: CR correctly rejected (resourceID required)" || { echo "FAIL: CR was accepted but resourceID is required"; exit 1; }
