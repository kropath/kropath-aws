# Route53ResolverRuleAssociation Chainsaw tests — canonical pattern. Naming: effectiveName.
# No cloud tags (ACK limitation).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53resolverruleassociation
spec:
  skipDelete: true
  namespace: route53resolverruleassociation
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53resolverruleassociation

    # AC1 — naming: effectiveName = {namespace}-{name} when no nameOverride.
    - name: ac1-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac1-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                resolverRuleRef: my-rule
                vpcID: vpc-12345
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac1-assoc-naming
                namespace: route53resolverruleassociation
              data:
                effectiveName: route53resolverruleassociation-ac1-assoc

    # AC2 — naming: effectiveName = nameOverride when provided.
    - name: ac2-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac2-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                nameOverride: custom-association
                resolverRuleRef: my-rule
                vpcID: vpc-67890
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac2-assoc-naming
                namespace: route53resolverruleassociation
              data:
                effectiveName: custom-association

    # AC3 — ACK ResolverRuleAssociation spec wired: name = effectiveName, vpcID.
    - name: ac3-ack-spec-wired
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac3-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                resolverRuleRef: target-rule
                vpcID: vpc-abc123
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRuleAssociation
              metadata:
                name: ac3-assoc
                namespace: route53resolverruleassociation
              spec:
                name: route53resolverruleassociation-ac3-assoc
                vpcID: vpc-abc123

    # AC4 — deletion-policy annotation wired on ACK resource.
    - name: ac4-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac4-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac4-cfg
                deletionPolicy: delete
                resolverRuleRef: my-rule
                vpcID: vpc-def456
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRuleAssociation
              metadata:
                name: ac4-assoc
                namespace: route53resolverruleassociation
                annotations:
                  services.k8s.aws/deletion-policy: delete
