# Route53ResolverRuleAssociation Chainsaw tests — canonical pattern. Naming: effectiveName.
# No cloud tags (ACK limitation).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53resolverruleassociation
spec:
  skipDelete: true
  namespace: route53resolverruleassociation
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53resolverruleassociation

    # AC1 — naming: effectiveName = {namespace}-{name} when no nameOverride.
    - name: ac1-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac1-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                resolverRuleRef: my-rule
                vpcID: vpc-12345
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac1-assoc-naming
                namespace: route53resolverruleassociation
              data:
                effectiveName: route53resolverruleassociation-ac1-assoc

    # AC2 — naming: effectiveName = nameOverride when provided.
    - name: ac2-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac2-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                nameOverride: custom-association
                resolverRuleRef: my-rule
                vpcID: vpc-67890
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac2-assoc-naming
                namespace: route53resolverruleassociation
              data:
                effectiveName: custom-association

    # AC3 — ACK ResolverRuleAssociation spec wired: name = effectiveName, vpcID.
    - name: ac3-ack-spec-wired
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac3-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                resolverRuleRef: target-rule
                vpcID: vpc-abc123
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRuleAssociation
              metadata:
                name: ac3-assoc
                namespace: route53resolverruleassociation
              spec:
                name: route53resolverruleassociation-ac3-assoc
                vpcID: vpc-abc123

    # AC4 — deletion-policy annotation wired on ACK resource.
    - name: ac4-deletion-policy-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac4-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac4-cfg
                deletionPolicy: delete
                resolverRuleRef: my-rule
                vpcID: vpc-def456
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRuleAssociation
              metadata:
                name: ac4-assoc
                namespace: route53resolverruleassociation
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC4 — standard metadata: managed-by, instance label, retain annotation, and ownerReference on ACK child.
    - name: ac5-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac5-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac5-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac5-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                resolverRuleRef: my-rule
                vpcID: vpc-11111
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRuleAssociation
              metadata:
                name: ac5-assoc
                namespace: route53resolverruleassociation
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac5-assoc
                annotations:
                  services.k8s.aws/deletion-policy: retain
        - script:
            content: |
              for i in $(seq 1 15); do
                OWNER_KIND=$(kubectl get resolverruleassociations.route53resolver.services.k8s.aws ac5-assoc -n route53resolverruleassociation -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null)
                [ -n "$OWNER_KIND" ] && break
                sleep 2
              done
              [ "$OWNER_KIND" = "Route53ResolverRuleAssociation" ] || { echo "FAIL: expected Route53ResolverRuleAssociation owner, got $OWNER_KIND"; exit 1; }
              echo "PASS: standard metadata (managed-by, instance, retain, ownerRef) verified"

    # synced-labels — mandatory syncedLabels propagate to ACK child metadata.labels with aws.kropath.run/ prefix.
    - name: ac6-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac6-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac6-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{"team":"networking"},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac6-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                resolverRuleRef: my-rule
                vpcID: vpc-22222
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRuleAssociation
              metadata:
                name: ac6-assoc
                namespace: route53resolverruleassociation
        - script:
            content: |
              for i in $(seq 1 15); do
                LABEL=$(kubectl get resolverruleassociations.route53resolver.services.k8s.aws ac6-assoc -n route53resolverruleassociation -o jsonpath='{.metadata.labels.aws\.kropath\.run/team}' 2>/dev/null)
                [ -n "$LABEL" ] && break
                sleep 2
              done
              [ "$LABEL" = "networking" ] || { echo "FAIL: expected aws.kropath.run/team=networking, got $LABEL"; exit 1; }
              echo "PASS: synced-labels propagated to ACK ResolverRuleAssociation labels"

    # AC6 — config-selector: configRef="restricted" selects Route53Config by aws.kropath.run/resource-name label.
    - name: ac7-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: restricted
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: restricted
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config restricted -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac7-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: restricted
                deletionPolicy: retain
                resolverRuleRef: my-rule
                vpcID: vpc-33333
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverRuleAssociation
              metadata:
                name: ac7-assoc
                namespace: route53resolverruleassociation
        - script:
            content: |
              for i in $(seq 1 15); do
                NAME=$(kubectl get resolverruleassociations.route53resolver.services.k8s.aws ac7-assoc -n route53resolverruleassociation -o jsonpath='{.spec.name}' 2>/dev/null)
                [ -n "$NAME" ] && break
                sleep 2
              done
              [ "$NAME" = "route53resolverruleassociation-ac7-assoc" ] || { echo "FAIL: expected route53resolverruleassociation-ac7-assoc, got $NAME"; exit 1; }
              echo "PASS: config-selector resolved via restricted configRef"

    # AC7 — status outputs: status.resourceName and status.namingStatus set from naming ConfigMap.
    - name: ac8-status-outputs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac8-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac8-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac8-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
                resolverRuleRef: my-rule
                vpcID: vpc-44444
        - script:
            content: |
              for i in $(seq 1 15); do
                RESNAME=$(kubectl get route53resolverruleassociation ac8-assoc -n route53resolverruleassociation -o jsonpath='{.status.resourceName}' 2>/dev/null)
                [ -n "$RESNAME" ] && break
                sleep 2
              done
              [ "$RESNAME" = "route53resolverruleassociation-ac8-assoc" ] || { echo "FAIL: expected route53resolverruleassociation-ac8-assoc, got $RESNAME"; exit 1; }
              NAMING_STATUS=$(kubectl get route53resolverruleassociation ac8-assoc -n route53resolverruleassociation -o jsonpath='{.status.namingStatus}' 2>/dev/null)
              [ "$NAMING_STATUS" = "valid" ] || { echo "FAIL: expected namingStatus=valid, got $NAMING_STATUS"; exit 1; }
              echo "PASS: status.resourceName and status.namingStatus set correctly"

    # AC8 (negative) — empty resolverRuleRef: CR admitted with default="" (schema default);
    # ACK child created with empty resolverRuleRef; Route53 API error surfaces in real AWS only.
    - name: ac9-negative-missing-rule-ref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac9-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac9-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac9-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac9-cfg
                deletionPolicy: retain
                resolverRuleRef: ""
                vpcID: vpc-55555
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac9-assoc
                namespace: route53resolverruleassociation
        - script:
            content: |
              echo "PASS: CR with empty resolverRuleRef admitted (schema default=''); Route53 API error expected in real AWS"

    # AC9 (negative) — empty vpcID: CR admitted with default="" (schema default);
    # ACK child created with empty vpcID; Route53 API error surfaces in real AWS only.
    - name: ac10-negative-missing-vpc-id
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac10-cfg
                namespace: route53resolverruleassociation
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac10-cfg -n route53resolverruleassociation \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac10-assoc
                namespace: route53resolverruleassociation
              spec:
                configRef: ac10-cfg
                deletionPolicy: retain
                resolverRuleRef: my-rule
                vpcID: ""
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverRuleAssociation
              metadata:
                name: ac10-assoc
                namespace: route53resolverruleassociation
        - script:
            content: |
              echo "PASS: CR with empty vpcID admitted (schema default=''); Route53 API error expected in real AWS"
