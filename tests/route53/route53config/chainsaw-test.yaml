# aws-r53-01 Chainsaw tests — one scenario per acceptance criterion.
# Pattern: unique resource name per step, spec.skipDelete: true (canonical pattern).
# AC-6 (effectiveConfig population) requires KRO-728 controller; that step is
# scaffolded here and will pass once KRO-728 is deployed.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53config
spec:
  skipDelete: true
  namespace: route53config
  steps:
    - name: ac1-general-policy-accepted
      try:
        - apply:
            file: 00-namespace.yaml
        - apply:
            file: 01-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: general-policy
                namespace: route53config
              spec:
                mandatory:
                  defaultTTL: 0
                  healthCheckRequestInterval: 0
                  healthCheckFailureThreshold: 0
                  resolverEndpointType: ""
                defaults:
                  defaultTTL: 300
                  healthCheckRequestInterval: 30
                  healthCheckFailureThreshold: 3
                  resolverEndpointType: ""

    - name: ac2a-reject-both-tiers-default-ttl
      try:
        - apply:
            file: 05-invalid-both-tiers-default-ttl.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: Route53Config
                check:
                  ($error != null): true

    - name: ac2b-reject-both-tiers-interval
      try:
        - apply:
            file: 06-invalid-both-tiers-interval.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: Route53Config
                check:
                  ($error != null): true

    - name: ac2c-reject-both-tiers-threshold
      try:
        - apply:
            file: 07-invalid-both-tiers-threshold.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: Route53Config
                check:
                  ($error != null): true

    - name: ac2d-reject-both-tiers-endpoint-type
      try:
        - apply:
            file: 08-invalid-both-tiers-endpoint-type.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: Route53Config
                check:
                  ($error != null): true

    - name: ac3-reject-invalid-interval
      try:
        - apply:
            file: 09-invalid-interval-value.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: Route53Config
                check:
                  ($error != null): true

    - name: ac4-reject-invalid-threshold
      try:
        - apply:
            file: 10-invalid-threshold-range.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: Route53Config
                check:
                  ($error != null): true

    - name: ac5b-restricted-accepted
      try:
        - apply:
            file: 02-restricted.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: restricted
                namespace: route53config
              spec:
                mandatory:
                  defaultTTL: 60
                  healthCheckRequestInterval: 10
                  healthCheckFailureThreshold: 2
                  resolverEndpointType: "DUALSTACK"

    - name: ac5c-mandatory-only-accepted
      try:
        - apply:
            file: 03-mandatory-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: mandatory-only
                namespace: route53config
              spec:
                mandatory:
                  defaultTTL: 300
                  healthCheckRequestInterval: 30
                  healthCheckFailureThreshold: 5
                  resolverEndpointType: "IPV4"
                defaults:
                  defaultTTL: 0
                  healthCheckRequestInterval: 0
                  healthCheckFailureThreshold: 0

    - name: ac5d-defaults-only-accepted
      try:
        - apply:
            file: 04-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: defaults-only
                namespace: route53config
              spec:
                mandatory:
                  defaultTTL: 0
                  healthCheckRequestInterval: 0
                  healthCheckFailureThreshold: 0
                  resolverEndpointType: ""
                defaults:
                  defaultTTL: 120
                  healthCheckRequestInterval: 10
                  healthCheckFailureThreshold: 5
                  resolverEndpointType: "IPV6"

    - name: ac11-label-selector-lookup
      try:
        - script:
            content: |
              set -eu
              count=$(kubectl get route53config -n route53config -l aws.kropath.run/resource-name=general-policy -o json | jq '.items | length')
              test "$count" -eq 1

    # AC-6: effectiveConfig populated by controller.
    # REQUIRES KRO-728 (kropath-controller Route53 cascade) to be deployed.
    # This step will fail until KRO-728 is merged and the controller is running.
    # Uncomment when KRO-728 is deployed.
    # - name: ac6-effective-config-populated
    #   try:
    #     - assert:
    #         resource:
    #           apiVersion: aws.kropath.run/v1alpha1
    #           kind: Route53Config
    #           metadata:
    #             name: general-policy
    #             namespace: route53config
    #           status:
    #             effectiveConfig:
    #               mandatory:
    #                 defaultTTL: 0
    #                 healthCheckRequestInterval: 0
    #                 healthCheckFailureThreshold: 0
    #                 resolverEndpointType: ""
    #               defaults:
    #                 defaultTTL: 300
    #                 healthCheckRequestInterval: 30
    #                 healthCheckFailureThreshold: 3
    #                 resolverEndpointType: ""
