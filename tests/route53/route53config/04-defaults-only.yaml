# Fixture: defaults tier only — no mandatory-tier values set beyond zero.
---
apiVersion: aws.kropath.run/v1alpha1
kind: Route53Config
metadata:
  name: defaults-only
  namespace: route53config
  labels:
    aws.kropath.run/resource-name: defaults-only
spec:
  mandatory:
    defaultTTL: 0
    healthCheckRequestInterval: 0
    healthCheckFailureThreshold: 0
    resolverEndpointType: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    defaultTTL: 120
    healthCheckRequestInterval: 10
    healthCheckFailureThreshold: 5
    resolverEndpointType: "IPV6"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
