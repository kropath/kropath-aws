# Route53ResolverQueryLogConfig Chainsaw tests — canonical pattern. Naming: effectiveName.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53resolverquerylogconfig
spec:
  skipDelete: true
  namespace: route53resolverquerylogconfig
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53resolverquerylogconfig

    # AC1 — naming: effectiveName = {namespace}-{name} when no nameOverride.
    - name: ac1-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac1-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::my-query-log-bucket
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac1-qlc-naming
                namespace: route53resolverquerylogconfig
              data:
                effectiveName: route53resolverquerylogconfig-ac1-qlc

    # AC2 — naming: effectiveName = nameOverride when provided.
    - name: ac2-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac2-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                nameOverride: my-custom-qlc
                destinationARN: arn:aws:logs:ap-southeast-2:123456789012:log-group:/dns/queries
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac2-qlc-naming
                namespace: route53resolverquerylogconfig
              data:
                effectiveName: my-custom-qlc

    # AC3 — ACK ResolverQueryLogConfig spec wired: name = effectiveName, destinationARN.
    - name: ac3-ack-spec-wired
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac3-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:kinesis:ap-southeast-2:123456789012:stream/dns-stream
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfig
              metadata:
                name: ac3-qlc
                namespace: route53resolverquerylogconfig
              spec:
                name: route53resolverquerylogconfig-ac3-qlc
                destinationARN: arn:aws:kinesis:ap-southeast-2:123456789012:stream/dns-stream

    # AC4 — tags governance: mandatory wins over instance.
    - name: ac4-tags-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{"env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac4-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::tags-bucket
                tags:
                  env: instance-env
        - script:
            content: |
              TAGS=$(kubectl get resolverquerylogconfig ac4-qlc -n route53resolverquerylogconfig -o json | jq -r '.spec.tags // [] | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || { echo "FAIL: env not mandatory prod"; exit 1; }
              echo "PASS: tags governance verified"

    # AC5 — ownerReference set on ACK ResolverQueryLogConfig.
    - name: ac5-owner-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac5-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac5-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac5-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::owner-bucket
        - script:
            content: |
              OWNER_KIND=$(kubectl get resolverquerylogconfig ac5-qlc -n route53resolverquerylogconfig -o jsonpath='{.metadata.ownerReferences[0].kind}')
              [ "$OWNER_KIND" = "Route53ResolverQueryLogConfig" ] || { echo "FAIL: expected Route53ResolverQueryLogConfig owner, got $OWNER_KIND"; exit 1; }
              echo "PASS: ownerReference verified"
