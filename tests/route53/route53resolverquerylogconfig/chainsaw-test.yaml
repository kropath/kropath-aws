# Route53ResolverQueryLogConfig Chainsaw tests — canonical pattern. Naming: effectiveName.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53resolverquerylogconfig
spec:
  skipDelete: true
  namespace: route53resolverquerylogconfig
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53resolverquerylogconfig

    # AC1 — naming: effectiveName = {namespace}-{name} when no nameOverride.
    - name: ac1-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac1-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::my-query-log-bucket
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac1-qlc-naming
                namespace: route53resolverquerylogconfig
              data:
                effectiveName: route53resolverquerylogconfig-ac1-qlc

    # AC2 — naming: effectiveName = nameOverride when provided.
    - name: ac2-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac2-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                nameOverride: my-custom-qlc
                destinationARN: arn:aws:logs:ap-southeast-2:123456789012:log-group:/dns/queries
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac2-qlc-naming
                namespace: route53resolverquerylogconfig
              data:
                effectiveName: my-custom-qlc

    # AC3 — ACK ResolverQueryLogConfig spec wired: name = effectiveName, destinationARN.
    - name: ac3-ack-spec-wired
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac3-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:kinesis:ap-southeast-2:123456789012:stream/dns-stream
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfig
              metadata:
                name: ac3-qlc
                namespace: route53resolverquerylogconfig
              spec:
                name: route53resolverquerylogconfig-ac3-qlc
                destinationARN: arn:aws:kinesis:ap-southeast-2:123456789012:stream/dns-stream

    # AC4 — tags governance: mandatory wins over instance.
    - name: ac4-tags-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{"env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac4-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::tags-bucket
                tags:
                  env: instance-env
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfig
              metadata:
                name: ac4-qlc
                namespace: route53resolverquerylogconfig
        - script:
            content: |
              for i in $(seq 1 15); do
                TAGS=$(kubectl get resolverquerylogconfigs.route53resolver.services.k8s.aws ac4-qlc -n route53resolverquerylogconfig -o json 2>/dev/null | jq -r '.spec.tags // [] | map("\(.key)=\(.value)") | sort | join(",")')
                echo "$TAGS" | grep -q "env=prod" && break
                sleep 2
              done
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || { echo "FAIL: env not mandatory prod"; exit 1; }
              echo "PASS: tags governance verified"

    # AC5 — ownerReference set on ACK ResolverQueryLogConfig.
    - name: ac5-owner-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac5-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac5-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac5-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::owner-bucket
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfig
              metadata:
                name: ac5-qlc
                namespace: route53resolverquerylogconfig
        - script:
            content: |
              for i in $(seq 1 15); do
                OWNER_KIND=$(kubectl get resolverquerylogconfigs.route53resolver.services.k8s.aws ac5-qlc -n route53resolverquerylogconfig -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null)
                [ -n "$OWNER_KIND" ] && break
                sleep 2
              done
              [ "$OWNER_KIND" = "Route53ResolverQueryLogConfig" ] || { echo "FAIL: expected Route53ResolverQueryLogConfig owner, got $OWNER_KIND"; exit 1; }
              echo "PASS: ownerReference verified"

    # AC6 — syncedLabels propagated to ACK ResolverQueryLogConfig labels with aws.kropath.run/ prefix.
    - name: ac6-synced-labels
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac6-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac6-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{"team":"security"},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac6-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::synced-labels-bucket
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfig
              metadata:
                name: ac6-qlc
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/team: security

    # AC7 — standard metadata: managed-by, instance label, and deletion-policy annotation on ACK child.
    - name: ac7-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac7-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac7-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac7-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac7-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::metadata-bucket
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfig
              metadata:
                name: ac7-qlc
                namespace: route53resolverquerylogconfig
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac7-qlc
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC8 — deletion-policy delete: annotation set to "delete" on ACK child.
    - name: ac8-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac8-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac8-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac8-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac8-cfg
                deletionPolicy: delete
                destinationARN: arn:aws:s3:::deletion-delete-bucket
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfig
              metadata:
                name: ac8-qlc
                namespace: route53resolverquerylogconfig
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC9 — deletion-policy retain (default): annotation set to "retain" on ACK child.
    - name: ac9-deletion-retain
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac9-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac9-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac9-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac9-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::deletion-retain-bucket
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfig
              metadata:
                name: ac9-qlc
                namespace: route53resolverquerylogconfig
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC10 — config selector: spec.configRef selects Route53Config by label (Theme 28).
    - name: ac10-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: restricted
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: restricted
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config restricted -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac10-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: restricted
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::config-selector-bucket
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverQueryLogConfig
              metadata:
                name: ac10-qlc
                namespace: route53resolverquerylogconfig

    # AC11 — status outputs: status.namingStatus=valid and status.resourceName=effectiveName.
    - name: ac11-status-outputs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac11-cfg
                namespace: route53resolverquerylogconfig
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac11-cfg -n route53resolverquerylogconfig \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac11-qlc
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac11-cfg
                deletionPolicy: retain
                destinationARN: arn:aws:s3:::status-outputs-bucket
        - script:
            content: |
              for i in $(seq 1 15); do
                NAMING_STATUS=$(kubectl get route53resolverquerylogconfig ac11-qlc -n route53resolverquerylogconfig -o jsonpath='{.status.namingStatus}' 2>/dev/null)
                [ -n "$NAMING_STATUS" ] && break
                sleep 2
              done
              [ "$NAMING_STATUS" = "valid" ] || { echo "FAIL: expected namingStatus=valid, got $NAMING_STATUS"; exit 1; }
              RESOURCE_NAME=$(kubectl get route53resolverquerylogconfig ac11-qlc -n route53resolverquerylogconfig -o jsonpath='{.status.resourceName}' 2>/dev/null)
              [ "$RESOURCE_NAME" = "route53resolverquerylogconfig-ac11-qlc" ] || { echo "FAIL: expected resourceName=route53resolverquerylogconfig-ac11-qlc, got $RESOURCE_NAME"; exit 1; }
              echo "PASS: status.namingStatus and status.resourceName verified"

    # AC12 — negative: CR without destinationARN is rejected at admission (required field).
    - name: ac12-missing-destination
      try:
        - script:
            content: |
              kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverQueryLogConfig
              metadata:
                name: ac12-qlc-bad
                namespace: route53resolverquerylogconfig
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
              EOF
              EXIT=$?
              [ "$EXIT" -ne 0 ] && echo "PASS: CR correctly rejected (destinationARN required)" || { echo "FAIL: CR was accepted but destinationARN is required"; exit 1; }
