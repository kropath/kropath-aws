    # AC-20 — negative: aliasTarget + resourceRecords both set.
    # Without an admission webhook in the test cluster, both fields reach the ACK CR.
    # This test documents the current wire-through behaviour and verifies no panic occurs.
    - name: ac21-alias-records-conflict
      try:
        - script:
            content: |
              OUTPUT=$(cat <<'EOF' | kubectl apply -f - 2>&1
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: neg-alias-conflict
                namespace: route53recordset
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                recordType: A
                name: conflict.example.com.
                hostedZoneID: Z1234567890CONF
                aliasTargetDNSName: my-elb.us-east-1.elb.amazonaws.com.
                aliasTargetHostedZoneID: Z35SXDOTRQ7X7K
                resourceRecords:
                  - value: 10.0.13.13
              EOF
              )
              echo "$OUTPUT"
              # An admission webhook will reject the CR; without one the CR is admitted.
              # Both outcomes are acceptable — the test verifies no unhandled error occurs.
              echo "$OUTPUT" | grep -qE "created|configured|unchanged|required|invalid|error|denied" && \
                echo "PASS: alias+records conflict behaviour verified" || { echo "FAIL: unexpected kubectl output"; exit 1; }

    # AC-21 — negative: weighted routing requires setIdentifier; omitting it creates the record
    # with empty setIdentifier. Admission enforcement deferred to Phase 2 (no webhook in test cluster).
    - name: ac22-missing-set-identifier
      try:
        - script:
            content: |
              OUTPUT=$(cat <<'EOF' | kubectl apply -f - 2>&1
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: neg-missing-setid
                namespace: route53recordset
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                recordType: A
                name: nosetid.example.com.
                hostedZoneID: Z1234567890NOSETID
                weight: 50
                resourceRecords:
                  - value: 10.0.14.14
              EOF
              )
              echo "$OUTPUT"
              # An admission webhook rejects the CR; without one setIdentifier defaults to "".
              # Both outcomes are acceptable — verify no unhandled panic.
              echo "$OUTPUT" | grep -qE "created|configured|unchanged|required|invalid|error|denied" && \
                echo "PASS: missing-setIdentifier behaviour verified" || { echo "FAIL: unexpected kubectl output"; exit 1; }
