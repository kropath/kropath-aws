# Route53RecordSet Chainsaw tests — canonical pattern. No cloud tags (G-3).
# TTL governance via Route53Config defaultTTL.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53recordset
spec:
  skipDelete: true
  namespace: route53recordset
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53recordset

    # AC1 — TTL falls through to defaults when mandatory=0 and instance=0.
    - name: ac1-ttl-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac1-a-record
                namespace: route53recordset
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                recordType: A
                name: www.example.com.
                hostedZoneID: Z1234567890
                resourceRecords:
                  - value: 1.2.3.4
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac1-a-record
                namespace: route53recordset
              spec:
                recordType: A
                ttl: 300

    # AC2 — mandatory TTL overrides instance and defaults.
    - name: ac2-ttl-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  defaultTTL: 60
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":60,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac2-mandatory-ttl
                namespace: route53recordset
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                recordType: CNAME
                name: api.example.com.
                hostedZoneID: Z1234567890
                ttl: 3600
                resourceRecords:
                  - value: backend.example.com.
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac2-mandatory-ttl
                namespace: route53recordset
              spec:
                ttl: 60

    # AC3 — instance TTL overrides defaults when mandatory=0.
    - name: ac3-ttl-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac3-instance-ttl
                namespace: route53recordset
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                recordType: TXT
                name: _verify.example.com.
                hostedZoneID: Z1234567890
                ttl: 120
                resourceRecords:
                  - value: '"google-site-verification=abc"'
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac3-instance-ttl
                namespace: route53recordset
              spec:
                ttl: 120

    # AC4 — no tags field on ACK RecordSet (G-3 gap).
    - name: ac4-no-cloud-tags
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac4-notags
                namespace: route53recordset
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                recordType: MX
                name: example.com.
                hostedZoneID: Z1234567890
                ttl: 3600
                resourceRecords:
                  - value: 10 mail.example.com.
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac4-notags
                namespace: route53recordset
        - script:
            content: |
              for i in $(seq 1 15); do
                kubectl get recordsets.route53.services.k8s.aws ac4-notags -n route53recordset -o json 2>/dev/null | jq -e '.' > /dev/null 2>&1 && break
                sleep 2
              done
              HAS_TAGS=$(kubectl get recordsets.route53.services.k8s.aws ac4-notags -n route53recordset -o json 2>/dev/null | jq 'has("tags")' || echo false)
              SPEC_TAGS=$(kubectl get recordsets.route53.services.k8s.aws ac4-notags -n route53recordset -o jsonpath='{.spec.tags}' 2>/dev/null || echo "")
              echo "Spec tags: '$SPEC_TAGS'"
              [ -z "$SPEC_TAGS" ] || { echo "FAIL: RecordSet should not have cloud tags in spec.tags"; exit 1; }
              echo "PASS: RecordSet has no cloud tags field (G-3 verified)"

    # AC5 — weighted routing: weight and setIdentifier wired.
    - name: ac5-weighted-routing
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac5-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac5-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac5-weighted
                namespace: route53recordset
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                recordType: A
                name: weighted.example.com.
                hostedZoneID: Z1234567890
                weight: 100
                setIdentifier: primary
                resourceRecords:
                  - value: 10.0.0.1
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac5-weighted
                namespace: route53recordset
              spec:
                weight: 100
                setIdentifier: primary

    # AC6 — ownerReference set on ACK RecordSet.
    - name: ac6-owner-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac6-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac6-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac6-owner
                namespace: route53recordset
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                recordType: A
                name: owner.example.com.
                hostedZoneID: Z1234567890
                resourceRecords:
                  - value: 192.168.1.1
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac6-owner
                namespace: route53recordset
        - script:
            content: |
              for i in $(seq 1 15); do
                OWNER_KIND=$(kubectl get recordsets.route53.services.k8s.aws ac6-owner -n route53recordset -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null)
                [ -n "$OWNER_KIND" ] && break
                sleep 2
              done
              [ "$OWNER_KIND" = "Route53RecordSet" ] || { echo "FAIL: expected Route53RecordSet owner, got $OWNER_KIND"; exit 1; }
              echo "PASS: ownerReference verified"

    # AC-1 — simple A record: name, hostedZoneID, and resourceRecords wired to ACK RecordSet.
    - name: ac7-simple-a-record
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac7-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac7-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac7-simple-a
                namespace: route53recordset
              spec:
                configRef: ac7-cfg
                deletionPolicy: retain
                recordType: A
                name: www.example.com.
                hostedZoneID: Z1234567890SIMPLE
                ttl: 300
                resourceRecords:
                  - value: 10.0.1.1
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac7-simple-a
                namespace: route53recordset
              spec:
                recordType: A
                name: www.example.com.
                hostedZoneID: Z1234567890SIMPLE
                ttl: 300
        - script:
            content: |
              for i in $(seq 1 15); do
                VAL=$(kubectl get recordsets.route53.services.k8s.aws ac7-simple-a -n route53recordset \
                  -o jsonpath='{.spec.resourceRecords[0].value}' 2>/dev/null)
                [ -n "$VAL" ] && break
                sleep 2
              done
              [ "$VAL" = "10.0.1.1" ] || { echo "FAIL: expected resourceRecords[0].value=10.0.1.1, got '$VAL'"; exit 1; }
              echo "PASS: simple A record wired correctly"

    # AC-2 — MX record: priority embedded in value as per Route53 convention.
    - name: ac8-mx-record
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac8-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac8-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac8-mx
                namespace: route53recordset
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
                recordType: MX
                name: mail.example.com.
                hostedZoneID: Z1234567890MX
                ttl: 3600
                resourceRecords:
                  - value: "10 smtp.example.com."
                  - value: "20 backup-smtp.example.com."
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac8-mx
                namespace: route53recordset
              spec:
                recordType: MX
                ttl: 3600
        - script:
            content: |
              for i in $(seq 1 15); do
                VAL=$(kubectl get recordsets.route53.services.k8s.aws ac8-mx -n route53recordset \
                  -o jsonpath='{.spec.resourceRecords[0].value}' 2>/dev/null)
                [ -n "$VAL" ] && break
                sleep 2
              done
              [ "$VAL" = "10 smtp.example.com." ] || { echo "FAIL: expected MX value '10 smtp.example.com.', got '$VAL'"; exit 1; }
              echo "PASS: MX record wired correctly"

    # AC-3 — alias record: aliasTarget wired to ACK spec.aliasTarget; ttl and resourceRecords absent.
    - name: ac9-alias-elb
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac9-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac9-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac9-alias
                namespace: route53recordset
              spec:
                configRef: ac9-cfg
                deletionPolicy: retain
                recordType: A
                name: example.com.
                hostedZoneID: Z1234567890ALIAS
                aliasTargetDNSName: my-elb.us-east-1.elb.amazonaws.com.
                aliasTargetHostedZoneID: Z35SXDOTRQ7X7K
                aliasTargetEvaluateTargetHealth: true
        - script:
            content: |
              for i in $(seq 1 15); do
                DNS=$(kubectl get recordsets.route53.services.k8s.aws ac9-alias -n route53recordset \
                  -o jsonpath='{.spec.aliasTarget.dnsName}' 2>/dev/null)
                [ -n "$DNS" ] && break
                sleep 2
              done
              echo "aliasTarget.dnsName: $DNS"
              [ "$DNS" = "my-elb.us-east-1.elb.amazonaws.com." ] || { echo "FAIL: expected aliasTarget.dnsName, got '$DNS'"; exit 1; }
              HZ=$(kubectl get recordsets.route53.services.k8s.aws ac9-alias -n route53recordset \
                -o jsonpath='{.spec.aliasTarget.hostedZoneID}' 2>/dev/null)
              [ "$HZ" = "Z35SXDOTRQ7X7K" ] || { echo "FAIL: expected aliasTarget.hostedZoneID Z35SXDOTRQ7X7K, got '$HZ'"; exit 1; }
              ETH=$(kubectl get recordsets.route53.services.k8s.aws ac9-alias -n route53recordset \
                -o jsonpath='{.spec.aliasTarget.evaluateTargetHealth}' 2>/dev/null)
              [ "$ETH" = "true" ] || { echo "FAIL: expected evaluateTargetHealth=true, got '$ETH'"; exit 1; }
              echo "PASS: alias record aliasTarget wired correctly"

    # AC-8 — weight: 0 is valid (never route here); distinct from sentinel -1 (not weighted).
    - name: ac10-weighted-zero
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac10-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac10-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac10-weight-zero
                namespace: route53recordset
              spec:
                configRef: ac10-cfg
                deletionPolicy: retain
                recordType: A
                name: canary.example.com.
                hostedZoneID: Z1234567890WZ
                weight: 0
                setIdentifier: canary
                resourceRecords:
                  - value: 10.0.2.2
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac10-weight-zero
                namespace: route53recordset
              spec:
                weight: 0
                setIdentifier: canary
        - script:
            content: |
              for i in $(seq 1 15); do
                W=$(kubectl get recordsets.route53.services.k8s.aws ac10-weight-zero -n route53recordset \
                  -o jsonpath='{.spec.weight}' 2>/dev/null)
                [ -n "$W" ] && break
                sleep 2
              done
              echo "weight: $W"
              [ "$W" = "0" ] || { echo "FAIL: expected weight=0, got '$W'"; exit 1; }
              echo "PASS: weight=0 (never-route sentinel) wired correctly"

    # AC-9 — latency routing: spec.region wired to ACK spec.region.
    - name: ac11-latency-routing
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac11-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac11-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac11-latency
                namespace: route53recordset
              spec:
                configRef: ac11-cfg
                deletionPolicy: retain
                recordType: A
                name: api.example.com.
                hostedZoneID: Z1234567890LAT
                setIdentifier: us-east-1
                region: us-east-1
                resourceRecords:
                  - value: 10.0.3.3
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac11-latency
                namespace: route53recordset
              spec:
                region: us-east-1
                setIdentifier: us-east-1

    # AC-10 — geolocation routing: countryCode wired to ACK spec.geoLocation.
    - name: ac12-geolocation-routing
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac12-cfg
                namespace: route53recordset
                labels:
                  aws.kropath.run/resource-name: ac12-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac12-cfg -n route53recordset \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53RecordSet
              metadata:
                name: ac12-geo-us
                namespace: route53recordset
              spec:
                configRef: ac12-cfg
                deletionPolicy: retain
                recordType: A
                name: geo.example.com.
                hostedZoneID: Z1234567890GEO
                setIdentifier: us-geo
                geoLocationCountryCode: US
                resourceRecords:
                  - value: 10.0.4.4
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: RecordSet
              metadata:
                name: ac12-geo-us
                namespace: route53recordset
              spec:
                setIdentifier: us-geo
        - script:
            content: |
              for i in $(seq 1 15); do
                CC=$(kubectl get recordsets.route53.services.k8s.aws ac12-geo-us -n route53recordset \
                  -o jsonpath='{.spec.geoLocation.countryCode}' 2>/dev/null)
                [ -n "$CC" ] && break
