# Route53ResolverEndpoint Chainsaw tests — canonical pattern. Naming: effectiveName.
# resolverEndpointType governance via Route53Config.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53resolverendpoint
spec:
  skipDelete: true
  namespace: route53resolverendpoint
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53resolverendpoint

    # AC1 — naming: effectiveName = {namespace}-{name} when no nameOverride.
    - name: ac1-naming-default
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac1-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                direction: INBOUND
                ipAddresses:
                  - subnetID: subnet-abc123
                securityGroupIDs:
                  - sg-abc123
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac1-endpoint-naming
                namespace: route53resolverendpoint
              data:
                effectiveName: route53resolverendpoint-ac1-endpoint

    # AC2 — naming: effectiveName = nameOverride when provided.
    - name: ac2-naming-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac2-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                nameOverride: my-custom-resolver
                direction: OUTBOUND
                ipAddresses:
                  - subnetID: subnet-def456
                securityGroupIDs:
                  - sg-def456
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ac2-endpoint-naming
                namespace: route53resolverendpoint
              data:
                effectiveName: my-custom-resolver

    # AC3 — resolverEndpointType: mandatory overrides instance and defaults.
    - name: ac3-resolver-endpoint-type-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                mandatory:
                  resolverEndpointType: DUALSTACK
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"DUALSTACK","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac3-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                direction: INBOUND
                resolverEndpointType: IPV4
                ipAddresses:
                  - subnetID: subnet-ghi789
                securityGroupIDs:
                  - sg-ghi789
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac3-endpoint
                namespace: route53resolverendpoint
              spec:
                resolverEndpointType: DUALSTACK

    # AC4 — resolverEndpointType: defaults apply when mandatory="" and instance="".
    - name: ac4-resolver-endpoint-type-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                defaults:
                  resolverEndpointType: IPV6
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV6","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac4-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                direction: OUTBOUND
                ipAddresses:
                  - subnetID: subnet-jkl012
                securityGroupIDs:
                  - sg-jkl012
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac4-endpoint
                namespace: route53resolverendpoint
              spec:
                resolverEndpointType: IPV6

    # AC5 — tags governance: mandatory wins. ACK ResolverEndpoint uses array tags.
    - name: ac5-tags-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac5-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac5-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{"env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac5-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                direction: INBOUND
                tags:
                  env: instance-env
                ipAddresses:
                  - subnetID: subnet-mno345
                securityGroupIDs:
                  - sg-mno345
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac5-endpoint
                namespace: route53resolverendpoint
        - script:
            content: |
              for i in $(seq 1 15); do
                TAGS=$(kubectl get resolverendpoints.route53resolver.services.k8s.aws ac5-endpoint -n route53resolverendpoint -o json 2>/dev/null | jq -r '.spec.tags // [] | map("\(.key)=\(.value)") | sort | join(",")')
                echo "$TAGS" | grep -q "env=prod" && break
                sleep 2
              done
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || { echo "FAIL: env not mandatory prod"; exit 1; }
              echo "PASS: tags governance verified"

    # AC6 — ownerReference set on ACK ResolverEndpoint.
    - name: ac6-owner-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac6-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac6-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac6-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                direction: INBOUND
                ipAddresses:
                  - subnetID: subnet-pqr678
                securityGroupIDs:
                  - sg-pqr678
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac6-endpoint
                namespace: route53resolverendpoint
        - script:
            content: |
              for i in $(seq 1 15); do
                OWNER_KIND=$(kubectl get resolverendpoints.route53resolver.services.k8s.aws ac6-endpoint -n route53resolverendpoint -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null)
                [ -n "$OWNER_KIND" ] && break
                sleep 2
              done
              [ "$OWNER_KIND" = "Route53ResolverEndpoint" ] || { echo "FAIL: expected Route53ResolverEndpoint owner, got $OWNER_KIND"; exit 1; }
              echo "PASS: ownerReference verified"

    # AC1 extended — ACK ResolverEndpoint spec: direction, ipAddresses, securityGroupIDs wired through.
    - name: ac7-inbound-spec
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac7-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac7-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac7-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac7-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac7-cfg
                deletionPolicy: retain
                direction: INBOUND
                ipAddresses:
                  - subnetID: subnet-aaa111
                  - subnetID: subnet-bbb222
                securityGroupIDs:
                  - sg-abc999
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac7-endpoint
                namespace: route53resolverendpoint
              spec:
                name: route53resolverendpoint-ac7-endpoint
                direction: INBOUND
                securityGroupIDs:
                  - sg-abc999
        - script:
            content: |
              for i in $(seq 1 15); do
                SUBNET0=$(kubectl get resolverendpoints.route53resolver.services.k8s.aws ac7-endpoint -n route53resolverendpoint -o jsonpath='{.spec.ipAddresses[0].subnetID}' 2>/dev/null)
                [ -n "$SUBNET0" ] && break
                sleep 2
              done
              SUBNET1=$(kubectl get resolverendpoints.route53resolver.services.k8s.aws ac7-endpoint -n route53resolverendpoint -o jsonpath='{.spec.ipAddresses[1].subnetID}' 2>/dev/null)
              [ "$SUBNET0" = "subnet-aaa111" ] || { echo "FAIL: expected subnet-aaa111 at index 0, got $SUBNET0"; exit 1; }
              [ "$SUBNET1" = "subnet-bbb222" ] || { echo "FAIL: expected subnet-bbb222 at index 1, got $SUBNET1"; exit 1; }
              echo "PASS: ipAddresses wired correctly"

    # AC2 extended — Outbound endpoint with specific IPs wired to ACK ResolverEndpoint.
    - name: ac8-outbound-specific-ips
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac8-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac8-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac8-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
                direction: OUTBOUND
                ipAddresses:
                  - subnetID: subnet-ccc333
                    ip: 10.0.1.10
                  - subnetID: subnet-ddd444
                    ip: 10.0.2.10
                securityGroupIDs:
                  - sg-def456
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac8-endpoint
                namespace: route53resolverendpoint
              spec:
                direction: OUTBOUND
        - script:
            content: |
              for i in $(seq 1 15); do
                IP0=$(kubectl get resolverendpoints.route53resolver.services.k8s.aws ac8-endpoint -n route53resolverendpoint -o jsonpath='{.spec.ipAddresses[0].ip}' 2>/dev/null)
                [ -n "$IP0" ] && break
                sleep 2
              done
              IP1=$(kubectl get resolverendpoints.route53resolver.services.k8s.aws ac8-endpoint -n route53resolverendpoint -o jsonpath='{.spec.ipAddresses[1].ip}' 2>/dev/null)
              [ "$IP0" = "10.0.1.10" ] || { echo "FAIL: expected 10.0.1.10 at index 0, got $IP0"; exit 1; }
              [ "$IP1" = "10.0.2.10" ] || { echo "FAIL: expected 10.0.2.10 at index 1, got $IP1"; exit 1; }
              echo "PASS: specific IPs wired correctly"

    # AC5 — resolverEndpointType: instance overrides defaults when mandatory is empty.
    - name: ac9-type-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac9-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  resolverEndpointType: DUALSTACK
        - script:
            content: |
              kubectl patch route53config ac9-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"DUALSTACK","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac9-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac9-cfg
                deletionPolicy: retain
                direction: INBOUND
                resolverEndpointType: IPV4
                ipAddresses:
                  - subnetID: subnet-eee555
                  - subnetID: subnet-fff666
                securityGroupIDs:
                  - sg-ghi789
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac9-endpoint
                namespace: route53resolverendpoint
              spec:
                resolverEndpointType: IPV4

    # AC9 — standard metadata: managed-by, instance labels and deletion-policy annotation on ACK ResolverEndpoint.
    - name: ac10-standard-metadata
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac10-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac10-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac10-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac10-cfg
                deletionPolicy: retain
                direction: INBOUND
                ipAddresses:
                  - subnetID: subnet-ggg777
                  - subnetID: subnet-hhh888
                securityGroupIDs:
                  - sg-jkl012
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac10-endpoint
                namespace: route53resolverendpoint
                labels:
                  app.kubernetes.io/managed-by: kro
                  app.kubernetes.io/instance: ac10-endpoint
                annotations:
                  services.k8s.aws/deletion-policy: retain

    # AC10 — deletion-policy: delete annotation on ACK ResolverEndpoint.
    - name: ac11-deletion-delete
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac11-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac11-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac11-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac11-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac11-cfg
                deletionPolicy: delete
                direction: OUTBOUND
                ipAddresses:
                  - subnetID: subnet-iii999
                  - subnetID: subnet-jjj000
                securityGroupIDs:
                  - sg-mno345
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac11-endpoint
                namespace: route53resolverendpoint
                annotations:
                  services.k8s.aws/deletion-policy: delete

    # AC11 — config lookup via labelSelector: configRef selects Route53Config by label.
    - name: ac12-config-selector
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: restricted
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: restricted
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config restricted -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac12-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: restricted
                deletionPolicy: retain
                direction: INBOUND
                ipAddresses:
                  - subnetID: subnet-kkk111
                  - subnetID: subnet-lll222
                securityGroupIDs:
                  - sg-pqr678
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac12-endpoint
                namespace: route53resolverendpoint
              spec:
                resolverEndpointType: IPV4

    # AC12 — status outputs: status fields present on Route53ResolverEndpoint CR.
    # Note: resolverEndpointID, hostVPCID require real AWS; empty in local test cluster.
    - name: ac13-status-outputs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac13-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac13-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac13-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac13-endpoint
                namespace: route53resolverendpoint
              spec:
                configRef: ac13-cfg
                deletionPolicy: retain
                direction: INBOUND
                ipAddresses:
                  - subnetID: subnet-mmm333
                  - subnetID: subnet-nnn444
                securityGroupIDs:
                  - sg-stu901
        - assert:
            resource:
              apiVersion: route53resolver.services.k8s.aws/v1alpha1
              kind: ResolverEndpoint
              metadata:
                name: ac13-endpoint
                namespace: route53resolverendpoint
        - script:
            content: |
              for i in $(seq 1 15); do
                STATUS=$(kubectl get route53resolverendpoint ac13-endpoint -n route53resolverendpoint -o jsonpath='{.status}' 2>/dev/null)
                [ -n "$STATUS" ] && break
                sleep 2
              done
              echo "Status: $STATUS"
              [ -n "$STATUS" ] || { echo "FAIL: status block missing on Route53ResolverEndpoint"; exit 1; }
              RESOURCE_NAME=$(kubectl get route53resolverendpoint ac13-endpoint -n route53resolverendpoint -o jsonpath='{.status.resourceName}' 2>/dev/null)
              [ "$RESOURCE_NAME" = "route53resolverendpoint-ac13-endpoint" ] || { echo "FAIL: expected status.resourceName=route53resolverendpoint-ac13-endpoint, got $RESOURCE_NAME"; exit 1; }
              echo "PASS: status.resourceName present; resolverEndpointID/hostVPCID populated by real AWS"

    # AC13 — negative: fewer than 2 IP addresses triggers advisory validationError.
    # kro cannot enforce min-items on arrays at admission; enforcement is at the Route53 API layer.
    # The RGD surfaces the constraint via an advisory ConfigMap (status.validationError pattern).
    - name: ac14-insufficient-ips
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac14-cfg
                namespace: route53resolverendpoint
                labels:
                  aws.kropath.run/resource-name: ac14-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac14-cfg -n route53resolverendpoint \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"IPV4","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - script:
            content: |
              # Apply with only 1 IP address — kro admits the CR (no admission rejection for arrays).
              # The RGD creates an advisory ConfigMap (ipAddressesMinError) that surfaces in
              # status.validationError. The spec says enforcement is at the Route53 API layer.
              OUTPUT=$(kubectl apply -f - 2>&1 <<'MANIFEST'
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53ResolverEndpoint
              metadata:
                name: ac14-badips
                namespace: route53resolverendpoint
              spec:
                configRef: ac14-cfg
                deletionPolicy: retain
                direction: INBOUND
                ipAddresses:
                  - subnetID: subnet-ooo555
                securityGroupIDs:
                  - sg-vwx234
              MANIFEST
              )
              echo "apply output: $OUTPUT"
              # CR is admitted by kro (no schema-level rejection for array min-items).
              # Advisory ConfigMap approach: check that status.validationError is populated.
              for i in $(seq 1 15); do
                VERR=$(kubectl get route53resolverendpoint ac14-badips -n route53resolverendpoint -o jsonpath='{.status.validationError}' 2>/dev/null)
                if echo "$VERR" | grep -qi "ipAddresses\|at least 2\|minimum"; then
                  echo "PASS: status.validationError set — '$VERR'"
                  exit 0
                fi
                # Also check for the advisory ConfigMap directly
                CM=$(kubectl get configmap ac14-badips-ipaddresses-min-error -n route53resolverendpoint 2>/dev/null)
                if [ -n "$CM" ]; then
                  echo "PASS: advisory ConfigMap ac14-badips-ipaddresses-min-error exists"
                  exit 0
                fi
                sleep 2
              done
              echo "FAIL: neither status.validationError nor advisory ConfigMap found after 30s for 1-IP endpoint"
              exit 1
