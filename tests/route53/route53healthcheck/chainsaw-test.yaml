# Route53HealthCheck Chainsaw tests — canonical pattern (unique name per step,
# spec.skipDelete: true). requestInterval and failureThreshold governance via Route53Config.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route53healthcheck
spec:
  skipDelete: true
  namespace: route53healthcheck
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: route53healthcheck

    # AC1 — requestInterval: defaults apply when mandatory=0 and instance=0.
    - name: ac1-request-interval-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac1-cfg
                namespace: route53healthcheck
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                defaults:
                  healthCheckRequestInterval: 30
        - script:
            content: |
              kubectl patch route53config ac1-cfg -n route53healthcheck \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              metadata:
                name: ac1-defaults
                namespace: route53healthcheck
              spec:
                configRef: ac1-cfg
                deletionPolicy: retain
                healthCheckType: HTTP
                ipAddress: 1.2.3.4
                fullyQualifiedDomainName: example.com
                resourcePath: /health
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: HealthCheck
              metadata:
                name: ac1-defaults
                namespace: route53healthcheck
              spec:
                healthCheckConfig:
                  type: HTTP
                  requestInterval: 30
                  failureThreshold: 3

    # AC2 — requestInterval: mandatory overrides instance and defaults.
    - name: ac2-request-interval-mandatory-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac2-cfg
                namespace: route53healthcheck
                labels:
                  aws.kropath.run/resource-name: ac2-cfg
              spec:
                mandatory:
                  healthCheckRequestInterval: 10
                defaults:
                  healthCheckRequestInterval: 30
        - script:
            content: |
              kubectl patch route53config ac2-cfg -n route53healthcheck \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":10,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              metadata:
                name: ac2-mandatory
                namespace: route53healthcheck
              spec:
                configRef: ac2-cfg
                deletionPolicy: retain
                healthCheckType: HTTPS
                ipAddress: 5.6.7.8
                requestInterval: 30
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: HealthCheck
              metadata:
                name: ac2-mandatory
                namespace: route53healthcheck
              spec:
                healthCheckConfig:
                  requestInterval: 10

    # AC3 — requestInterval: instance overrides defaults when mandatory=0.
    - name: ac3-request-interval-instance-override
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac3-cfg
                namespace: route53healthcheck
                labels:
                  aws.kropath.run/resource-name: ac3-cfg
              spec:
                defaults:
                  healthCheckRequestInterval: 30
        - script:
            content: |
              kubectl patch route53config ac3-cfg -n route53healthcheck \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              metadata:
                name: ac3-instance
                namespace: route53healthcheck
              spec:
                configRef: ac3-cfg
                deletionPolicy: retain
                healthCheckType: TCP
                ipAddress: 9.10.11.12
                port: 443
                requestInterval: 10
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: HealthCheck
              metadata:
                name: ac3-instance
                namespace: route53healthcheck
              spec:
                healthCheckConfig:
                  requestInterval: 10

    # AC4 — failureThreshold: mandatory overrides instance.
    - name: ac4-failure-threshold-mandatory
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac4-cfg
                namespace: route53healthcheck
                labels:
                  aws.kropath.run/resource-name: ac4-cfg
              spec:
                mandatory:
                  healthCheckFailureThreshold: 5
                defaults:
                  healthCheckFailureThreshold: 3
        - script:
            content: |
              kubectl patch route53config ac4-cfg -n route53healthcheck \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":5,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              metadata:
                name: ac4-threshold
                namespace: route53healthcheck
              spec:
                configRef: ac4-cfg
                deletionPolicy: retain
                healthCheckType: HTTP
                ipAddress: 13.14.15.16
                failureThreshold: 1
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: HealthCheck
              metadata:
                name: ac4-threshold
                namespace: route53healthcheck
              spec:
                healthCheckConfig:
                  failureThreshold: 5

    # AC5 — tags governance: mandatory wins.
    - name: ac5-tags-governance
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac5-cfg
                namespace: route53healthcheck
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac5-cfg -n route53healthcheck \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{"env":"prod"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{"env":"dev"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              metadata:
                name: ac5-tags
                namespace: route53healthcheck
              spec:
                configRef: ac5-cfg
                deletionPolicy: retain
                healthCheckType: HTTP
                ipAddress: 17.18.19.20
                tags:
                  env: instance-env
        - script:
            content: |
              TAGS=$(kubectl get healthcheck ac5-tags -n route53healthcheck -o json | jq -r '.spec.tags // [] | map("\(.key)=\(.value)") | sort | join(",")')
              echo "Tags: $TAGS"
              echo "$TAGS" | grep -q "env=prod" || { echo "FAIL: env not mandatory prod"; exit 1; }
              echo "PASS: tags governance verified"

    # AC6 — ownerReference is set on ACK HealthCheck.
    - name: ac6-owner-reference
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac6-cfg
                namespace: route53healthcheck
                labels:
                  aws.kropath.run/resource-name: ac6-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac6-cfg -n route53healthcheck \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              metadata:
                name: ac6-owner
                namespace: route53healthcheck
              spec:
                configRef: ac6-cfg
                deletionPolicy: retain
                healthCheckType: HTTP
                ipAddress: 21.22.23.24
        - script:
            content: |
              OWNER_KIND=$(kubectl get healthcheck ac6-owner -n route53healthcheck -o jsonpath='{.metadata.ownerReferences[0].kind}')
              [ "$OWNER_KIND" = "Route53HealthCheck" ] || { echo "FAIL: expected Route53HealthCheck owner, got $OWNER_KIND"; exit 1; }
              echo "PASS: ownerReference verified"
