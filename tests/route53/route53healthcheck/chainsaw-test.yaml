            content: |
              kubectl apply -f - 2>&1 <<'MANIFEST'
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              metadata:
                name: ac21-recovery-ctrl
                namespace: route53healthcheck
              spec:
                configRef: ac20-cfg
                deletionPolicy: retain
                healthCheckType: RECOVERY_CONTROL
