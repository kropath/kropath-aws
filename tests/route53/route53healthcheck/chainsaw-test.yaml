              metadata:
                name: ac8-cfg
                namespace: route53healthcheck
                labels:
                  aws.kropath.run/resource-name: ac8-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac8-cfg -n route53healthcheck \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              metadata:
                name: ac8-https
                namespace: route53healthcheck
              spec:
                configRef: ac8-cfg
                deletionPolicy: retain
                healthCheckType: HTTPS
                fullyQualifiedDomainName: api.example.com
                port: 443
                enableSNI: true
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: HealthCheck
              metadata:
                name: ac8-https
                namespace: route53healthcheck
              spec:
                healthCheckConfig:
                  type: HTTPS
                  fullyQualifiedDomainName: api.example.com
                  port: 443
                  enableSNI: true

    # AC3 — HTTPS_STR_MATCH with searchString wired to ACK healthCheckConfig.
    - name: ac9-https-str-match
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53Config
              metadata:
                name: ac9-cfg
                namespace: route53healthcheck
                labels:
                  aws.kropath.run/resource-name: ac9-cfg
              spec:
                defaults:
                  defaultTTL: 300
        - script:
            content: |
              kubectl patch route53config ac9-cfg -n route53healthcheck \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"defaultTTL":0,"healthCheckRequestInterval":0,"healthCheckFailureThreshold":0,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"defaultTTL":300,"healthCheckRequestInterval":30,"healthCheckFailureThreshold":3,"resolverEndpointType":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"ap-southeast-2"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: Route53HealthCheck
              metadata:
                name: ac9-strmatch
                namespace: route53healthcheck
              spec:
                configRef: ac9-cfg
