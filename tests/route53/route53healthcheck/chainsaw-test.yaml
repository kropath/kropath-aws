                  - hc-id-2
                  - hc-id-3
        - assert:
            resource:
              apiVersion: route53.services.k8s.aws/v1alpha1
              kind: HealthCheck
              metadata:
                name: ac11-calculated
                namespace: route53healthcheck
              spec:
                healthCheckConfig:
                  type: CALCULATED
                  healthThreshold: 2
