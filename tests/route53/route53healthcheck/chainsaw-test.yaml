        - script:
            content: |
              for i in $(seq 1 15); do
                ERR=$(kubectl get route53healthcheck ac21-recovery-ctrl -n route53healthcheck \
                  -o jsonpath='{.status.validationError}' 2>/dev/null)
                [ -n "$ERR" ] && { echo "PASS: status.validationError set: $ERR"; exit 0; }
                sleep 2
              done
              echo "FAIL: status.validationError not set after 30s — advisory ConfigMap pattern missing"
              exit 1
