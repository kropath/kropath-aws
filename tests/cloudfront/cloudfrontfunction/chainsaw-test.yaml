# aws-cloudfront-07 Chainsaw tests — CloudFrontFunction (12 ACs)
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step ACK deletes.
# Note: functionCode must be pre-encoded base64 by the caller (OD-4 option A; kro v0.9.2 lacks base64.encode()).
# The local cluster has no ACK controller so ACK CR fields are asserted directly.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontfunction
spec:
  skipDelete: true
  namespace: cloudfrontfunction
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: cloudfrontfunction

    # AC-1: default runtime cloudfront-js-2.0
    - name: ac1-default-runtime
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac1-cfg
                namespace: cloudfrontfunction
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch cloudfrontconfig ac1-cfg -n cloudfrontfunction \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"viewerProtocolPolicy":"","minimumProtocolVersion":"","httpVersion":"","sslSupportMethod":"","loggingEnabled":false,"loggingBucket":"","priceClass":"","webACLRequired":false,"geoRestrictionType":"","oacSigningBehavior":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"viewerProtocolPolicy":"redirect-to-https","minimumProtocolVersion":"TLSv1.2_2021","httpVersion":"http2","sslSupportMethod":"sni-only","loggingEnabled":false,"loggingBucket":"","priceClass":"PriceClass_All","webACLRequired":false,"geoRestrictionType":"none","oacSigningBehavior":"always","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontFunction
              metadata:
                name: ac1-fn
                namespace: cloudfrontfunction
              spec:
                configRef: ac1-cfg
                functionCode: "function handler(event) { return event.request; }"
                runtime: cloudfront-js-2.0
                comment: "Test function"
        - assert:
            resource:
              apiVersion: cloudfront.services.k8s.aws/v1alpha1
              kind: Function
              metadata:
                name: ac1-fn
                namespace: cloudfrontfunction
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                name: cloudfrontfunction-ac1-fn
                functionConfig:
                  runtime: cloudfront-js-2.0
                  comment: "Test function"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontFunction
              metadata:
                name: ac1-fn
                namespace: cloudfrontfunction
              status:
                resourceName: cloudfrontfunction-ac1-fn
                namingStatus: valid

    # AC-2: comment field forwarded to ACK
    - name: ac2-comment
