# aws-cloudfront-06 Chainsaw tests — CloudFrontResponseHeadersPolicy (16 ACs)
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step ACK deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontresponseheaderspolicy
spec:
  skipDelete: true
  namespace: cloudfrontresponseheaderspolicy
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: cloudfrontresponseheaderspolicy

    # AC-1: defaults — minimal policy with comment
    - name: ac1-minimal-policy
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac1-cfg
                namespace: cloudfrontresponseheaderspolicy
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch cloudfrontconfig ac1-cfg -n cloudfrontresponseheaderspolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"viewerProtocolPolicy":"","minimumProtocolVersion":"","httpVersion":"","sslSupportMethod":"","loggingEnabled":false,"loggingBucket":"","priceClass":"","webACLRequired":false,"geoRestrictionType":"","oacSigningBehavior":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"viewerProtocolPolicy":"redirect-to-https","minimumProtocolVersion":"TLSv1.2_2021","httpVersion":"http2","sslSupportMethod":"sni-only","loggingEnabled":false,"loggingBucket":"","priceClass":"PriceClass_All","webACLRequired":false,"geoRestrictionType":"none","oacSigningBehavior":"always","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontResponseHeadersPolicy
              metadata:
                name: ac1-policy
                namespace: cloudfrontresponseheaderspolicy
              spec:
                configRef: ac1-cfg
                comment: "Minimal policy"
                corsConfig:
                  accessControlAllowCredentials: false
                  accessControlMaxAgeSec: 0
                  originOverride: true
                  accessControlAllowHeaders: []
                  accessControlAllowMethods: []
                  accessControlAllowOrigins: []
                  accessControlExposeHeaders: []
                customHeadersConfig:
                  items: []
                removeHeadersConfig:
                  items: []
                securityHeadersConfig:
                  contentSecurityPolicy:
                    contentSecurityPolicy: ""
                    override: false
                  contentTypeOptions:
                    override: false
                  frameOptions:
                    frameOption: ""
                    override: false
                  referrerPolicy:
                    referrerPolicy: ""
                    override: false
                  strictTransportSecurity:
                    accessControlMaxAgeSec: 0
                    includeSubdomains: false
                    preload: false
                    override: false
                  xssProtection:
                    protection: false
                    modeBlock: false
                    reportURI: ""
                    override: false
                serverTimingHeadersConfig:
                  enabled: false
                  samplingRate: 0
        - assert:
            resource:
              apiVersion: cloudfront.services.k8s.aws/v1alpha1
              kind: ResponseHeadersPolicy
              metadata:
                name: ac1-policy
                namespace: cloudfrontresponseheaderspolicy
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                responseHeadersPolicyConfig:
                  name: cloudfrontresponseheaderspolicy-ac1-policy
                  comment: "Minimal policy"
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontResponseHeadersPolicy
              metadata:
                name: ac1-policy
                namespace: cloudfrontresponseheaderspolicy
              status:
                resourceName: cloudfrontresponseheaderspolicy-ac1-policy
                namingStatus: valid

