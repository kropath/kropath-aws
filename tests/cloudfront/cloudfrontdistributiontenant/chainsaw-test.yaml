  # AC-18: name is immutable on the ACK CRD (x-kubernetes-validations: self == oldSelf).
  # A genuine single-resource lifecycle test (mutates one config/resource pair across steps by
  # design) -- the accepted carve-out from the unique-name-per-step canon.
  - name: ac18-name-immutable-after-create
    try:
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontConfig
          metadata:
            name: ac18-cfg
            namespace: cloudfrontdistributiontenant
            labels:
              aws.kropath.run/resource-name: ac18-cfg
          spec:
            defaults:
              namingTemplate: '{namespace}-{name}'
    - script:
        content: |
          kubectl patch cloudfrontconfig ac18-cfg -n cloudfrontdistributiontenant \
            --subresource=status --type=merge \
            -p '{"status": {"effectiveConfig": {"mandatory": {"namingTemplate": "", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}, "geoRestrictionType": "", "webACLRequired": false}, "defaults": {"namingTemplate": "{namespace}-{name}", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}, "geoRestrictionType": ""}, "aws": {"accountId": "123456789012", "region": "us-east-1", "partition": "aws"}}}}'
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontDistributionTenant
          metadata:
            name: ac18-tenant
            namespace: cloudfrontdistributiontenant
          spec:
            configRef: ac18-cfg
            domains:
              - domain: immutable.example.com
            distributionID: E1U5RQF7T870K0
    - assert:
        resource:
          apiVersion: cloudfront.services.k8s.aws/v1alpha1
          kind: DistributionTenant
          metadata:
            name: ac18-tenant
            namespace: cloudfrontdistributiontenant
          spec:
            name: cloudfrontdistributiontenant-ac18-tenant
    # Change mandatory.namingTemplate after creation -- the recomputed effectiveName no longer
    # matches the existing (immutable) child spec.name.
    - script:
        content: |
          kubectl patch cloudfrontconfig ac18-cfg -n cloudfrontdistributiontenant \
            --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
          kubectl patch cloudfrontconfig ac18-cfg -n cloudfrontdistributiontenant \
            --subresource=status --type=merge \
            -p '{"status": {"effectiveConfig": {"mandatory": {"namingTemplate": "corp-{namespace}-{name}", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}, "geoRestrictionType": "", "webACLRequired": false}, "defaults": {"namingTemplate": "{namespace}-{name}", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}, "geoRestrictionType": ""}, "aws": {"accountId": "123456789012", "region": "us-east-1", "partition": "aws"}}}}'
    - script:
        content: |
          MSG=""
          for i in $(seq 1 30); do
            MSG=$(kubectl get cloudfrontdistributiontenant ac18-tenant -n cloudfrontdistributiontenant \
              -o jsonpath='{.status.conditions[?(@.type=="ResourcesReady")].message}' 2>/dev/null || true)
            echo "$MSG" | grep -qi "immutable" && break
            sleep 2
          done
          echo "$MSG" | grep -qi "immutable" || { echo "FAIL: ResourcesReady never reported an immutable-field rejection (last message: $MSG)"; exit 1; }
          echo "PASS: instance reports failed condition naming the immutable field: $MSG"
          CHILD_NAME=$(kubectl get distributiontenants.cloudfront.services.k8s.aws ac18-tenant -n cloudfrontdistributiontenant -o jsonpath='{.spec.name}')
          [ "$CHILD_NAME" = "cloudfrontdistributiontenant-ac18-tenant" ] || { echo "FAIL: child spec.name changed to '$CHILD_NAME' -- the existing tenant was recreated instead of being rejected"; exit 1; }
          echo "PASS: existing tenant spec.name unchanged at '$CHILD_NAME' -- not recreated"
        timeout: 90s

