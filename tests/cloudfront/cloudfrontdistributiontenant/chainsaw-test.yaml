          spec:
            configRef: ac4-cfg
            origins:
              - id: origin1
                domainName: example-origin.s3.amazonaws.com
    - script:
        content: |
          for i in $(seq 1 30); do
            kubectl get distribution.cloudfront.services.k8s.aws ac4-shared-cdn -n cloudfrontdistributiontenant >/dev/null 2>&1 && break
            sleep 1
          done
          kubectl patch distribution.cloudfront.services.k8s.aws ac4-shared-cdn -n cloudfrontdistributiontenant \
            --subresource=status --type=merge -p '{"status":{"id":"E1U5RQF7T870K0"}}'
        timeout: 60s
    - assert:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontDistribution
          metadata:
            name: ac4-shared-cdn
            namespace: cloudfrontdistributiontenant
          status:
