# aws-cloudfront-10 Chainsaw tests -- CloudFrontDistributionTenant (AC-1 through AC-29).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# effectiveConfig is simulated via kubectl patch --subresource=status (no kropath-controller
# running in the kind cluster -- kro reconciles child resources from patched status).
#
# Sibling ref resolution (AC-4/5/6/7): the kropath CloudFrontDistribution/CloudFrontConnectionGroup
# wrapper's OWN status (distributionId/id) is itself computed by kro from its ACK child's status --
# patching the wrapper's status directly is overwritten on the next reconcile. Patch the ACK CHILD
# (distribution.cloudfront.services.k8s.aws / connectiongroups.cloudfront.services.k8s.aws)
# instead, then the wrapper's status recomputes correctly on its own.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontdistributiontenant
spec:
  skipDelete: true
  namespace: cloudfrontdistributiontenant
  steps:
  - name: setup-namespace
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cloudfrontdistributiontenant

  - name: ac1-tenant-create-by-id
    try:
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontConfig
          metadata:
            name: ac1-cfg
            namespace: cloudfrontdistributiontenant
            labels:
              aws.kropath.run/resource-name: ac1-cfg
          spec:
            defaults:
              namingTemplate: '{namespace}-{name}'
    - script:
        content: |
          kubectl patch cloudfrontconfig ac1-cfg -n cloudfrontdistributiontenant \
            --subresource=status --type=merge \
            -p '{"status": {"effectiveConfig": {"mandatory": {"namingTemplate": "", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}, "geoRestrictionType": "", "webACLRequired": false}, "defaults": {"namingTemplate": "{namespace}-{name}", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}, "geoRestrictionType": ""}, "aws": {"accountId": "123456789012", "region": "us-east-1", "partition": "aws"}}}}'
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontDistributionTenant
          metadata:
            name: ac1-tenant
            namespace: cloudfrontdistributiontenant
          spec:
            configRef: ac1-cfg
            domains:
              - domain: acme.example.com
            distributionID: E1U5RQF7T870K0
    - assert:
        resource:
          apiVersion: cloudfront.services.k8s.aws/v1alpha1
          kind: DistributionTenant
          metadata:
            name: ac1-tenant
            namespace: cloudfrontdistributiontenant
          spec:
            domains:
              - domain: acme.example.com
            distributionID: E1U5RQF7T870K0

