# aws-cloudfront-03 Chainsaw tests — CloudFrontOriginAccessControl (16 ACs)
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step ACK deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontoriginaccesscontrol
spec:
  skipDelete: true
  namespace: cloudfrontoriginaccesscontrol
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: cloudfrontoriginaccesscontrol

    # AC-1: OAC with S3 origin type and signingBehavior from defaults.oacSigningBehavior
    # AC-13: deletion-policy retain (default)
    - name: ac1-oac-s3-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac1-cfg
                namespace: cloudfrontoriginaccesscontrol
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch cloudfrontconfig ac1-cfg -n cloudfrontoriginaccesscontrol \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"viewerProtocolPolicy":"","minimumProtocolVersion":"","httpVersion":"","sslSupportMethod":"","loggingEnabled":false,"loggingBucket":"","priceClass":"","webACLRequired":false,"geoRestrictionType":"","oacSigningBehavior":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"viewerProtocolPolicy":"redirect-to-https","minimumProtocolVersion":"TLSv1.2_2021","httpVersion":"http2","sslSupportMethod":"sni-only","loggingEnabled":false,"loggingBucket":"","priceClass":"PriceClass_All","webACLRequired":false,"geoRestrictionType":"none","oacSigningBehavior":"always","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontOriginAccessControl
              metadata:
                name: ac1-oac
                namespace: cloudfrontoriginaccesscontrol
              spec:
                configRef: ac1-cfg
                originAccessControlOriginType: s3
                signingProtocol: sigv4
        - assert:
            resource:
              apiVersion: cloudfront.services.k8s.aws/v1alpha1
              kind: OriginAccessControl
              metadata:
                name: ac1-oac
                namespace: cloudfrontoriginaccesscontrol
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                originAccessControlConfig:
                  name: cloudfrontoriginaccesscontrol-ac1-oac
                  originAccessControlOriginType: s3
                  signingBehavior: always
                  signingProtocol: sigv4
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontOriginAccessControl
              metadata:
                name: ac1-oac
                namespace: cloudfrontoriginaccesscontrol
              status:
                resourceName: cloudfrontoriginaccesscontrol-ac1-oac
                namingStatus: valid

