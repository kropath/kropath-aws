# aws-cloudfront-05 Chainsaw tests — CloudFrontOriginRequestPolicy (11 ACs)
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step ACK deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontoriginrequestpolicy
spec:
  skipDelete: true
  namespace: cloudfrontoriginrequestpolicy
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: cloudfrontoriginrequestpolicy

    # AC-1: defaults — none behaviors
    - name: ac1-defaults-none
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac1-cfg
                namespace: cloudfrontoriginrequestpolicy
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch cloudfrontconfig ac1-cfg -n cloudfrontoriginrequestpolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"viewerProtocolPolicy":"","minimumProtocolVersion":"","httpVersion":"","sslSupportMethod":"","loggingEnabled":false,"loggingBucket":"","priceClass":"","webACLRequired":false,"geoRestrictionType":"","oacSigningBehavior":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"viewerProtocolPolicy":"redirect-to-https","minimumProtocolVersion":"TLSv1.2_2021","httpVersion":"http2","sslSupportMethod":"sni-only","loggingEnabled":false,"loggingBucket":"","priceClass":"PriceClass_All","webACLRequired":false,"geoRestrictionType":"none","oacSigningBehavior":"always","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontOriginRequestPolicy
              metadata:
                name: ac1-policy
                namespace: cloudfrontoriginrequestpolicy
              spec:
                configRef: ac1-cfg
                cookiesConfig:
                  cookieBehavior: none
                  cookies: []
                headersConfig:
                  headerBehavior: none
                  headers: []
                queryStringsConfig:
                  queryStringBehavior: none
                  queryStrings: []
        - assert:
            resource:
              apiVersion: cloudfront.services.k8s.aws/v1alpha1
              kind: OriginRequestPolicy
              metadata:
                name: ac1-policy
                namespace: cloudfrontoriginrequestpolicy
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                originRequestPolicyConfig:
                  name: cloudfrontoriginrequestpolicy-ac1-policy
                  cookiesConfig:
                    cookieBehavior: none
                  headersConfig:
                    headerBehavior: none
                  queryStringsConfig:
                    queryStringBehavior: none
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontOriginRequestPolicy
              metadata:
                name: ac1-policy
                namespace: cloudfrontoriginrequestpolicy
              status:
                resourceName: cloudfrontoriginrequestpolicy-ac1-policy
                namingStatus: valid

