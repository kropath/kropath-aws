# aws-cloudfront-04 Chainsaw tests — CloudFrontCachePolicy (13 ACs)
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step ACK deletes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontcachepolicy
spec:
  skipDelete: true
  namespace: cloudfrontcachepolicy
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: cloudfrontcachepolicy

    # AC-1: cache policy with defaults — none behaviors, gzip+brotli normalization, standard TTLs
    - name: ac1-cache-policy-create-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac1-cfg
                namespace: cloudfrontcachepolicy
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch cloudfrontconfig ac1-cfg -n cloudfrontcachepolicy \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"viewerProtocolPolicy":"","minimumProtocolVersion":"","httpVersion":"","sslSupportMethod":"","loggingEnabled":false,"loggingBucket":"","priceClass":"","webACLRequired":false,"geoRestrictionType":"","oacSigningBehavior":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"viewerProtocolPolicy":"redirect-to-https","minimumProtocolVersion":"TLSv1.2_2021","httpVersion":"http2","sslSupportMethod":"sni-only","loggingEnabled":false,"loggingBucket":"","priceClass":"PriceClass_All","webACLRequired":false,"geoRestrictionType":"none","oacSigningBehavior":"always","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontCachePolicy
              metadata:
                name: ac1-policy
                namespace: cloudfrontcachepolicy
              spec:
                configRef: ac1-cfg
                defaultTTL: 86400
                minTTL: 0
                maxTTL: 31536000
                parametersInCacheKeyAndForwardedToOrigin:
                  enableAcceptEncodingGzip: true
                  enableAcceptEncodingBrotli: true
                  cookiesConfig:
                    cookieBehavior: none
                    cookies: []
                  headersConfig:
                    headerBehavior: none
                    headers: []
                  queryStringsConfig:
                    queryStringBehavior: none
                    queryStrings: []
        - assert:
            resource:
              apiVersion: cloudfront.services.k8s.aws/v1alpha1
              kind: CachePolicy
              metadata:
                name: ac1-policy
                namespace: cloudfrontcachepolicy
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                cachePolicyConfig:
                  name: cloudfrontcachepolicy-ac1-policy
                  defaultTTL: 86400
                  minTTL: 0
                  maxTTL: 31536000
                  parametersInCacheKeyAndForwardedToOrigin:
                    enableAcceptEncodingGzip: true
                    enableAcceptEncodingBrotli: true
                    cookiesConfig:
                      cookieBehavior: none
                    headersConfig:
                      headerBehavior: none
                    queryStringsConfig:
                      queryStringBehavior: none
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontCachePolicy
              metadata:
                name: ac1-policy
                namespace: cloudfrontcachepolicy
              status:
                resourceName: cloudfrontcachepolicy-ac1-policy
                namingStatus: valid

