# aws-cloudfront-08 Chainsaw tests -- CloudFrontVPCOrigin (AC-1 through AC-20).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# effectiveConfig is simulated via kubectl patch --subresource=status (no kropath-controller
# running in the kind cluster -- kro reconciles child resources from patched status).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontvpcorigin
spec:
  skipDelete: true
  namespace: cloudfrontvpcorigin
  steps:
  - name: setup-namespace
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cloudfrontvpcorigin
  - name: ac1-vpcorigin-create-alb
    try:
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontConfig
          metadata:
            name: ac1-cfg
            namespace: cloudfrontvpcorigin
            labels:
              aws.kropath.run/resource-name: ac1-cfg
          spec:
            defaults:
              namingTemplate: '{namespace}-{name}'
    - script:
        content: |
          kubectl patch cloudfrontconfig ac1-cfg -n cloudfrontvpcorigin \
            --subresource=status --type=merge \
            -p '{"status": {"effectiveConfig": {"mandatory": {"viewerProtocolPolicy": "", "minimumProtocolVersion": "", "httpVersion": "", "sslSupportMethod": "", "loggingEnabled": false, "loggingBucket": "", "priceClass": "", "webACLRequired": false, "geoRestrictionType": "", "oacSigningBehavior": "", "namingTemplate": "", "vpcOriginProtocolPolicy": "", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}, "defaults": {"viewerProtocolPolicy": "", "minimumProtocolVersion": "", "httpVersion": "", "sslSupportMethod": "", "loggingEnabled": false, "loggingBucket": "", "priceClass": "", "webACLRequired": false, "geoRestrictionType": "", "oacSigningBehavior": "", "namingTemplate": "{namespace}-{name}", "vpcOriginProtocolPolicy": "", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}, "aws": {"accountId": "123456789012", "region": "us-east-1", "partition": "aws"}}}}'
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontVPCOrigin
          metadata:
            name: ac1-origin
            namespace: cloudfrontvpcorigin
          spec:
            configRef: ac1-cfg
            arn: arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/app/my-alb/abc123
            httpPort: 80
            httpsPort: 443
    - assert:
        resource:
          apiVersion: cloudfront.services.k8s.aws/v1alpha1
          kind: VPCOrigin
          metadata:
            name: ac1-origin
            namespace: cloudfrontvpcorigin
          spec:
            vpcOriginEndpointConfig:
              arn: arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/app/my-alb/abc123
              httpPort: 80
              httpsPort: 443
  - name: ac2-vpcorigin-create-nlb-custom-port
