    - script:
        content: |
          TAGS=$(kubectl get connectiongroups.cloudfront.services.k8s.aws ac12-group -n cloudfrontconnectiongroup -o json | jq -r '.spec.tags // []')
          echo "Tags: $TAGS"
          echo "$TAGS" | jq -e 'map(select(.key == "cost-centre" and .value == "platform")) | length == 1' && \
          echo "$TAGS" | jq -e 'map(select(.key == "tier" and .value == "edge")) | length == 1' && \
