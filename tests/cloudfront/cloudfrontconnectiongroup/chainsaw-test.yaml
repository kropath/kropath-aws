  # AC-11: name is immutable on the ACK CRD (x-kubernetes-validations: self == oldSelf).
  # A genuine single-resource lifecycle test (mutates one config/resource pair across
  # steps by design) -- the accepted carve-out from the unique-name-per-step canon.
  - name: ac11-name-immutable-after-create
    try:
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontConfig
          metadata:
            name: ac11-cfg
            namespace: cloudfrontconnectiongroup
            labels:
              aws.kropath.run/resource-name: ac11-cfg
          spec:
            defaults:
              namingTemplate: '{namespace}-{name}'
    - script:
        content: |
          kubectl patch cloudfrontconfig ac11-cfg -n cloudfrontconnectiongroup \
            --subresource=status --type=merge \
            -p '{"status": {"effectiveConfig": {"mandatory": {"namingTemplate": "", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}, "defaults": {"namingTemplate": "{namespace}-{name}", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}, "aws": {"accountId": "123456789012", "region": "us-east-1", "partition": "aws"}}}}'
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontConnectionGroup
          metadata:
            name: ac11-group
            namespace: cloudfrontconnectiongroup
          spec:
            configRef: ac11-cfg
    - assert:
        resource:
          apiVersion: cloudfront.services.k8s.aws/v1alpha1
          kind: ConnectionGroup
          metadata:
            name: ac11-group
            namespace: cloudfrontconnectiongroup
          spec:
            name: cloudfrontconnectiongroup-ac11-group
    # Change mandatory.namingTemplate after creation -- the recomputed effectiveName no
    # longer matches the existing (immutable) child spec.name.
    - script:
        content: |
          kubectl patch cloudfrontconfig ac11-cfg -n cloudfrontconnectiongroup \
            --subresource=status --type=merge -p '{"status":{"effectiveConfig":null}}'
          kubectl patch cloudfrontconfig ac11-cfg -n cloudfrontconnectiongroup \
            --subresource=status --type=merge \
            -p '{"status": {"effectiveConfig": {"mandatory": {"namingTemplate": "corp-{namespace}-{name}", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}, "defaults": {"namingTemplate": "{namespace}-{name}", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}, "aws": {"accountId": "123456789012", "region": "us-east-1", "partition": "aws"}}}}'
    - script:
        content: |
          MSG=""
          for i in $(seq 1 30); do
            MSG=$(kubectl get cloudfrontconnectiongroup ac11-group -n cloudfrontconnectiongroup \
              -o jsonpath='{.status.conditions[?(@.type=="ResourcesReady")].message}' 2>/dev/null || true)
            echo "$MSG" | grep -qi "immutable" && break
            sleep 2
          done
          echo "$MSG" | grep -qi "immutable" || { echo "FAIL: ResourcesReady never reported an immutable-field rejection (last message: $MSG)"; exit 1; }
          echo "PASS: instance reports failed condition naming the immutable field: $MSG"
          CHILD_NAME=$(kubectl get connectiongroups.cloudfront.services.k8s.aws ac11-group -n cloudfrontconnectiongroup -o jsonpath='{.spec.name}')
          [ "$CHILD_NAME" = "cloudfrontconnectiongroup-ac11-group" ] || { echo "FAIL: child spec.name changed to '$CHILD_NAME' -- the existing connection group was recreated instead of being rejected"; exit 1; }
          echo "PASS: existing connection group spec.name unchanged at '$CHILD_NAME' -- not recreated"
        timeout: 90s

