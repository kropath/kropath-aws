# aws-cloudfront-09 Chainsaw tests -- CloudFrontConnectionGroup (AC-1 through AC-19).
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step deletes.
# effectiveConfig is simulated via kubectl patch --subresource=status (no kropath-controller
# running in the kind cluster -- kro reconciles child resources from patched status).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontconnectiongroup
spec:
  skipDelete: true
  namespace: cloudfrontconnectiongroup
  steps:
  - name: setup-namespace
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cloudfrontconnectiongroup

  - name: ac1-connectiongroup-create
    try:
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontConfig
          metadata:
            name: ac1-cfg
            namespace: cloudfrontconnectiongroup
            labels:
              aws.kropath.run/resource-name: ac1-cfg
          spec:
            defaults:
              namingTemplate: '{namespace}-{name}'
    - script:
        content: |
          kubectl patch cloudfrontconfig ac1-cfg -n cloudfrontconnectiongroup \
            --subresource=status --type=merge \
            -p '{"status": {"effectiveConfig": {"mandatory": {"namingTemplate": "", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}, "defaults": {"namingTemplate": "{namespace}-{name}", "tags": {}, "syncedLabels": {}, "syncedAnnotations": {}}, "aws": {"accountId": "123456789012", "region": "us-east-1", "partition": "aws"}}}}'
    - apply:
        resource:
          apiVersion: aws.kropath.run/v1alpha1
          kind: CloudFrontConnectionGroup
          metadata:
            name: tenant-routing
            namespace: cloudfrontconnectiongroup
          spec:
            configRef: ac1-cfg
    - assert:
        resource:
          apiVersion: cloudfront.services.k8s.aws/v1alpha1
          kind: ConnectionGroup
          metadata:
            name: tenant-routing
            namespace: cloudfrontconnectiongroup
          spec:
            name: cloudfrontconnectiongroup-tenant-routing

