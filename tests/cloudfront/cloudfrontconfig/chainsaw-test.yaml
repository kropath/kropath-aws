# aws-cloudfront-01 Chainsaw tests — one scenario per acceptance criterion.
# AC-15 requires kropath-controller label operator to be running.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontconfig
spec:
  skipDelete: true
  namespace: cloudfrontconfig
  steps:
    - name: purge-stale-leftovers
      try:
        - apply:
            file: 00-cloudfrontconfig-namespace.yaml

    - name: ac1-config-create-mandatory-only
      try:
        - apply:
            file: 01-mandatory-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac1-mandatory-only
                namespace: cloudfrontconfig
              spec:
                mandatory:
                  viewerProtocolPolicy: "https-only"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "whitelist"
                  oacSigningBehavior: "always"
                  namingTemplate: ""
                defaults:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""

    - name: ac2-config-create-defaults-only
      try:
        - apply:
            file: 02-defaults-only.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac2-defaults-only
                namespace: cloudfrontconfig
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"

    - name: ac3-config-mutual-exclusion-viewerprotocolpolicy
      try:
        - apply:
            file: 03-both-viewerprotocolpolicy.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac4-config-mutual-exclusion-minimumprotocolversion
      try:
        - apply:
            file: 04-both-minimumprotocolversion.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac5-config-mutual-exclusion-httpversion
      try:
        - apply:
            file: 05-both-httpversion.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac6-config-mutual-exclusion-sslsupportmethod
      try:
        - apply:
            file: 06-both-sslsupportmethod.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac7-config-mutual-exclusion-loggingenabled
      try:
        - apply:
            file: 07-both-loggingenabled.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac8-config-mutual-exclusion-loggingbucket
      try:
        - apply:
            file: 08-both-loggingbucket.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac9-config-mutual-exclusion-priceclass
      try:
        - apply:
            file: 09-both-priceclass.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac10-config-mutual-exclusion-waclrequired
      try:
        - apply:
            file: 10-both-waclrequired.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac11-config-mutual-exclusion-georestrictiontype
      try:
        - apply:
            file: 11-both-georestrictiontype.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac12-config-mutual-exclusion-oacsigningbehavior
      try:
        - apply:
            file: 12-both-oacsigningbehavior.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac13-config-mutual-exclusion-namingtemplate
      try:
        - apply:
            file: 13-both-namingtemplate.yaml
            expect:
              - match:
                  apiVersion: aws.kropath.run/v1alpha1
                  kind: CloudFrontConfig
                check:
                  ($error != null): true

    - name: ac14-general-policy-baseline
      try:
        - apply:
            file: 14-general-policy.yaml
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: general-policy
                namespace: kro-system
                labels:
                  aws.kropath.run/resource-name: general-policy
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"

    - name: ac15-config-label-injection
      try:
        - apply:
            file: 15-label-injection.yaml
        - script:
            content: |
              # Simulate controller label operator injecting aws.kropath.run/resource-name on CREATE
              kubectl label cloudfrontconfig ac15-label-injection -n cloudfrontconfig \
                aws.kropath.run/resource-name=ac15-label-injection --overwrite
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac15-label-injection
                namespace: cloudfrontconfig
                labels:
                  aws.kropath.run/resource-name: ac15-label-injection
            timeout: 30s
