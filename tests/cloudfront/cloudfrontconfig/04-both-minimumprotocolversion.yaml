# AC-4: minimumProtocolVersion set in both mandatory and defaults → rejected
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac4-both-minimumprotocolversion
  namespace: cloudfrontconfig
spec:
  mandatory:
    viewerProtocolPolicy: ""
    minimumProtocolVersion: "TLSv1.2_2021"
    httpVersion: ""
    sslSupportMethod: ""
    loggingEnabled: false
    loggingBucket: ""
    priceClass: ""
    webACLRequired: false
    geoRestrictionType: ""
    oacSigningBehavior: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    viewerProtocolPolicy: ""
    minimumProtocolVersion: "TLSv1.2_2019"
    httpVersion: ""
    sslSupportMethod: ""
    loggingEnabled: false
    loggingBucket: ""
    priceClass: ""
    webACLRequired: false
    geoRestrictionType: ""
    oacSigningBehavior: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
