# AC-1: fields only in spec.mandatory → admission succeeds
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac1-mandatory-only
  namespace: cloudfrontconfig
spec:
  mandatory:
    viewerProtocolPolicy: "https-only"
    minimumProtocolVersion: "TLSv1.2_2021"
    httpVersion: "http2"
    sslSupportMethod: "sni-only"
    loggingEnabled: false
    loggingBucket: ""
    priceClass: "PriceClass_All"
    webACLRequired: false
    geoRestrictionType: "whitelist"
    oacSigningBehavior: "always"
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    viewerProtocolPolicy: ""
    minimumProtocolVersion: ""
    httpVersion: ""
    sslSupportMethod: ""
    loggingEnabled: false
    loggingBucket: ""
    priceClass: ""
    webACLRequired: false
    geoRestrictionType: ""
    oacSigningBehavior: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
