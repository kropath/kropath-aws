# aws-cloudfront-01 Chainsaw tests — CloudFrontDistribution (33 ACs)
# Canonical pattern: unique resource name per step, skipDelete: true, no inter-step ACK deletes.
# Distribution has no cloud-side naming (KRO-236); no naming ConfigMap.
# Optional policy refs use sentinel externalRef pattern.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudfrontdistribution
spec:
  skipDelete: true
  namespace: cloudfrontdistribution
  steps:
    - name: setup-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: cloudfrontdistribution

    # AC-1–4: effectiveConfig cascade defaults — viewerProtocolPolicy, minimumProtocolVersion,
    #          httpVersion, sslSupportMethod derived from defaults tier when mandatory empty
    - name: ac1-4-viewer-protocol-defaults
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac1-cfg
                namespace: cloudfrontdistribution
                labels:
                  aws.kropath.run/resource-name: ac1-cfg
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch cloudfrontconfig ac1-cfg -n cloudfrontdistribution \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"viewerProtocolPolicy":"","minimumProtocolVersion":"","httpVersion":"","sslSupportMethod":"","loggingEnabled":false,"loggingBucket":"","priceClass":"","webACLRequired":false,"geoRestrictionType":"","oacSigningBehavior":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"viewerProtocolPolicy":"redirect-to-https","minimumProtocolVersion":"TLSv1.2_2021","httpVersion":"http2","sslSupportMethod":"sni-only","loggingEnabled":false,"loggingBucket":"","priceClass":"PriceClass_All","webACLRequired":false,"geoRestrictionType":"none","oacSigningBehavior":"always","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontDistribution
              metadata:
                name: ac1-dist
                namespace: cloudfrontdistribution
              spec:
                configRef: ac1-cfg
                origins:
                  - domainName: mybucket.s3.amazonaws.com
                    id: my-s3-origin
                    originType: s3
                defaultCacheBehavior:
                  targetOriginID: my-s3-origin
                  allowedMethods:
                    - GET
                    - HEAD
        - assert:
            resource:
              apiVersion: cloudfront.services.k8s.aws/v1alpha1
              kind: Distribution
              metadata:
                name: ac1-dist
                namespace: cloudfrontdistribution
                annotations:
                  services.k8s.aws/deletion-policy: retain
              spec:
                distributionConfig:
                  defaultCacheBehavior:
                    viewerProtocolPolicy: "redirect-to-https"
                    allowedMethods:
                      items:
                        - GET
                        - HEAD
                  httpVersion: http2
                  restrictions:
                    geoRestriction:
                      restrictionType: none

    # AC-1–4 mandatory override: mandatory.viewerProtocolPolicy overrides defaults
    - name: ac1-4-mandatory-overrides-viewer
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac1m-cfg
                namespace: cloudfrontdistribution
                labels:
                  aws.kropath.run/resource-name: ac1m-cfg
              spec:
                mandatory:
                  viewerProtocolPolicy: "https-only"
                  minimumProtocolVersion: "TLSv1.2_2019"
                  httpVersion: "http3"
                  sslSupportMethod: "vip"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch cloudfrontconfig ac1m-cfg -n cloudfrontdistribution \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"viewerProtocolPolicy":"https-only","minimumProtocolVersion":"TLSv1.2_2019","httpVersion":"http3","sslSupportMethod":"vip","loggingEnabled":false,"loggingBucket":"","priceClass":"","webACLRequired":false,"geoRestrictionType":"","oacSigningBehavior":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"viewerProtocolPolicy":"redirect-to-https","minimumProtocolVersion":"TLSv1.2_2021","httpVersion":"http2","sslSupportMethod":"sni-only","loggingEnabled":false,"loggingBucket":"","priceClass":"PriceClass_All","webACLRequired":false,"geoRestrictionType":"none","oacSigningBehavior":"always","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontDistribution
              metadata:
                name: ac1m-dist
                namespace: cloudfrontdistribution
              spec:
                configRef: ac1m-cfg
                origins:
                  - domainName: mybucket.s3.amazonaws.com
                    id: my-s3-origin
                    originType: s3
                defaultCacheBehavior:
                  targetOriginID: my-s3-origin
                  allowedMethods:
                    - GET
                    - HEAD
        - assert:
            resource:
              apiVersion: cloudfront.services.k8s.aws/v1alpha1
              kind: Distribution
              metadata:
                name: ac1m-dist
                namespace: cloudfrontdistribution
              spec:
                distributionConfig:
                  defaultCacheBehavior:
                    viewerProtocolPolicy: "https-only"
                  httpVersion: http3

    # AC-5–6: loggingEnabled and loggingBucket cascade
    - name: ac5-6-logging
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac5-cfg
                namespace: cloudfrontdistribution
                labels:
                  aws.kropath.run/resource-name: ac5-cfg
