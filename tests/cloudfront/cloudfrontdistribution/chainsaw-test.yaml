    # AC-15: cloud tags merge — mandatory > spec > defaults
    - name: ac15-cloud-tags-merge
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac15-cfg
                namespace: cloudfrontdistribution
                labels:
                  aws.kropath.run/resource-name: ac15-cfg
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                  tags:
                    env: mandatory-env
                    owner: mandatory-owner
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"
                  tags:
                    env: default-env
                    region: us-east-1
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch cloudfrontconfig ac15-cfg -n cloudfrontdistribution \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"viewerProtocolPolicy":"","minimumProtocolVersion":"","httpVersion":"","sslSupportMethod":"","loggingEnabled":false,"loggingBucket":"","priceClass":"","webACLRequired":false,"geoRestrictionType":"","oacSigningBehavior":"","namingTemplate":"","tags":{"env":"mandatory-env","owner":"mandatory-owner"},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"viewerProtocolPolicy":"redirect-to-https","minimumProtocolVersion":"TLSv1.2_2021","httpVersion":"http2","sslSupportMethod":"sni-only","loggingEnabled":false,"loggingBucket":"","priceClass":"PriceClass_All","webACLRequired":false,"geoRestrictionType":"none","oacSigningBehavior":"always","namingTemplate":"{namespace}-{name}","tags":{"env":"default-env","region":"us-east-1"},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontDistribution
              metadata:
                name: ac15-dist
                namespace: cloudfrontdistribution
              spec:
                configRef: ac15-cfg
                tags:
                  env: spec-env
                  app: my-app
                origins:
                  - domainName: mybucket.s3.amazonaws.com
                    id: s3-origin
                    originType: s3
        - assert:
            resource:
              apiVersion: cloudfront.services.k8s.aws/v1alpha1
              kind: Distribution
              metadata:
                name: ac15-dist
                namespace: cloudfrontdistribution
        - script:
            # Tags: mandatory wins on conflict; spec wins over defaults; all unique keys included
            # Expected: env=mandatory-env (from mandatory), owner=mandatory-owner (from mandatory),
            #           app=my-app (from spec), region=us-east-1 (from defaults)
            content: |
              TAGS=$(kubectl get distribution ac15-dist -n cloudfrontdistribution -o json | jq '.spec.tags | from_entries')
              ENV_VAL=$(echo "$TAGS" | jq -r '.env')
              if [ "$ENV_VAL" = "mandatory-env" ]; then
                echo "PASS: mandatory.tags.env wins over spec and defaults"
              else
                echo "FAIL: expected mandatory-env, got $ENV_VAL"
                exit 1
              fi
              OWNER_VAL=$(echo "$TAGS" | jq -r '.owner')
              if [ "$OWNER_VAL" = "mandatory-owner" ]; then
                echo "PASS: mandatory.tags.owner present"
              else
                echo "FAIL: expected mandatory-owner, got $OWNER_VAL"
                exit 1
              fi
              APP_VAL=$(echo "$TAGS" | jq -r '.app')
              if [ "$APP_VAL" = "my-app" ]; then
                echo "PASS: spec.tags.app present"
              else
                echo "FAIL: expected my-app, got $APP_VAL"
                exit 1
              fi

