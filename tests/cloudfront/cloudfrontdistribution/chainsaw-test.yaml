                namespace: cloudfrontdistribution

    # AC-10–12: CachePolicy, OriginRequestPolicy, ResponseHeadersPolicy ref binding via sentinel
    - name: ac10-12-policy-refs
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontConfig
              metadata:
                name: ac10-cfg
                namespace: cloudfrontdistribution
                labels:
                  aws.kropath.run/resource-name: ac10-cfg
              spec:
                mandatory:
                  viewerProtocolPolicy: ""
                  minimumProtocolVersion: ""
                  httpVersion: ""
                  sslSupportMethod: ""
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: ""
                  webACLRequired: false
                  geoRestrictionType: ""
                  oacSigningBehavior: ""
                  namingTemplate: ""
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
                defaults:
                  viewerProtocolPolicy: "redirect-to-https"
                  minimumProtocolVersion: "TLSv1.2_2021"
                  httpVersion: "http2"
                  sslSupportMethod: "sni-only"
                  loggingEnabled: false
                  loggingBucket: ""
                  priceClass: "PriceClass_All"
                  webACLRequired: false
                  geoRestrictionType: "none"
                  oacSigningBehavior: "always"
                  namingTemplate: "{namespace}-{name}"
                  tags: {}
                  syncedLabels: {}
                  syncedAnnotations: {}
        - script:
            content: |
              kubectl patch cloudfrontconfig ac10-cfg -n cloudfrontdistribution \
                --subresource=status --type=merge \
                -p '{"status":{"effectiveConfig":{"mandatory":{"viewerProtocolPolicy":"","minimumProtocolVersion":"","httpVersion":"","sslSupportMethod":"","loggingEnabled":false,"loggingBucket":"","priceClass":"","webACLRequired":false,"geoRestrictionType":"","oacSigningBehavior":"","namingTemplate":"","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"defaults":{"viewerProtocolPolicy":"redirect-to-https","minimumProtocolVersion":"TLSv1.2_2021","httpVersion":"http2","sslSupportMethod":"sni-only","loggingEnabled":false,"loggingBucket":"","priceClass":"PriceClass_All","webACLRequired":false,"geoRestrictionType":"none","oacSigningBehavior":"always","namingTemplate":"{namespace}-{name}","tags":{},"syncedLabels":{},"syncedAnnotations":{}},"aws":{"accountId":"123456789012","region":"us-east-1"}}}}'
        # Create sibling policy CRs with simulated status.id
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontCachePolicy
              metadata:
                name: ac10-cache-policy
                namespace: cloudfrontdistribution
                labels:
                  aws.kropath.run/resource-name: ac10-cache-policy
              spec:
                configRef: ac10-cfg
                parametersInCacheKeyAndForwardedToOrigin:
                  enableAcceptEncodingGzip: true
                  enableAcceptEncodingBrotli: true
                  cookiesConfig:
                    cookieBehavior: none
                    cookies: []
                  headersConfig:
                    headerBehavior: none
                    headers: []
                  queryStringsConfig:
                    queryStringBehavior: none
                    queryStrings: []
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontOriginRequestPolicy
              metadata:
                name: ac10-orp
                namespace: cloudfrontdistribution
                labels:
                  aws.kropath.run/resource-name: ac10-orp
              spec:
                configRef: ac10-cfg
                cookiesConfig:
                  cookieBehavior: none
                  cookies: []
                headersConfig:
                  headerBehavior: none
                  headers: []
                queryStringsConfig:
                  queryStringBehavior: none
                  queryStrings: []
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: CloudFrontResponseHeadersPolicy
              metadata:
                name: ac10-rhp
                namespace: cloudfrontdistribution
                labels:
                  aws.kropath.run/resource-name: ac10-rhp
              spec:
                configRef: ac10-cfg
                corsConfig:
                  accessControlAllowCredentials: false
                  accessControlMaxAgeSec: 0
                  originOverride: true
                  accessControlAllowHeaders: []
                  accessControlAllowMethods: []
                  accessControlAllowOrigins: []
                  accessControlExposeHeaders: []
                customHeadersConfig:
                  items: []
                removeHeadersConfig:
                  items: []
                securityHeadersConfig:
                  contentSecurityPolicy:
                    contentSecurityPolicy: ""
                    override: false
                  contentTypeOptions:
                    override: false
                  frameOptions:
                    frameOption: ""
                    override: false
                  referrerPolicy:
                    referrerPolicy: ""
                    override: false
                  strictTransportSecurity:
                    accessControlMaxAgeSec: 0
                    includeSubdomains: false
                    preload: false
                    override: false
                  xssProtection:
                    protection: false
                    modeBlock: false
                    reportURI: ""
                    override: false
                serverTimingHeadersConfig:
                  enabled: false
                  samplingRate: 0
        - script:
            # Simulate ACK populating status.id for policy resources
            content: |
              kubectl patch cloudfrontcachepolicy ac10-cache-policy -n cloudfrontdistribution \
