# Smoke test: verifies that kro and ACK CRDs are present and healthy
# before running any resource-level tests.
# Run: chainsaw test ./tests/chainsaw/smoke/
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke
spec:
  description: >
    Verifies the local Kind cluster has kro running and ACK CRDs installed.
    This test must pass before any kropath-aws resource tests are run.
  steps:
    - name: kro-controller-healthy
      description: Assert that the kro controller deployment is available.
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kro
                namespace: kro
              status:
                availableReplicas: 1

    - name: ack-s3-crd-exists
      description: Assert that the ACK S3 Bucket CRD is registered.
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: buckets.s3.services.k8s.aws

    - name: ack-iam-crd-exists
      description: Assert that the ACK IAM Role CRD is registered.
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: roles.iam.services.k8s.aws
