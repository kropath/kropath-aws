---
# general-policy — baseline ManagedPrometheusConfig with no mandatory enforcement.
# No mandatory fields are enforced; defaults provide a standard naming template for
# RuleGroupsNamespace resources. Resource instances select this profile by omitting
# spec.configRef (resolves to "general-policy" via .orValue) or setting it explicitly.
#
# Only the fields this profile actually governs are set. Fields left out are genuinely
# unset — the CRD carries no scalar defaults on the mandatory/defaults tiers, so an
# omitted field never materialises a value that would trip the mutual-exclusion rules.
apiVersion: aws.kropath.run/v1alpha1
kind: ManagedPrometheusConfig
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  defaults:
    namingTemplate: "{namespace}-{name}"
