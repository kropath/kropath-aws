---
# Basic AutoScalingGroup — a launch-template-backed fleet with scale-in protection,
# a target group attachment, and a termination hook. desiredCapacity is left unset so
# AWS defaults it to minSize; see docs/frequent-rgd-errors.md §"Omission Is Wrong for
# Fields the Provider Late-Initialises" for why this RGD omits the field rather than
# forwarding a literal 0.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingGroup
metadata:
  name: web-fleet
  namespace: default
spec:
  configRef: general-policy
  minSize: 2
  maxSize: 6
  launchTemplate:
    name: web-fleet-lt
  availabilityZones:
    - us-east-1a
    - us-east-1b
  healthCheckType: "ELB"
  healthCheckGracePeriod: 120
  targetGroupARNs:
    - "arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/web-fleet-tg/abc123"
  newInstancesProtectedFromScaleIn: true
  lifecycleHooks:
    - name: drain-connections
      transition: "autoscaling:EC2_INSTANCE_TERMINATING"
      defaultResult: CONTINUE
      heartbeatTimeout: 300
  tags:
    app: web-fleet
  deletionPolicy: retain
