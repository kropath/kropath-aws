---
# general-policy — baseline AthenaConfig with no mandatory enforcement.
# No mandatory fields are enforced; defaults permit CloudWatch metrics disabled,
# no scan limit, and Athena selects the engine version.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    enforceWorkGroupConfiguration: false
    publishCloudWatchMetricsEnabled: false
    bytesScannedCutoffPerQuery: 0
    enableMinimumEncryptionConfiguration: false
    requesterPaysEnabled: false
    resultEncryptionOption: ""
    resultOutputLocation: ""
    engineVersion: ""
    namingTemplate: ""
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    enforceWorkGroupConfiguration: false
    publishCloudWatchMetricsEnabled: false
    bytesScannedCutoffPerQuery: 0
    enableMinimumEncryptionConfiguration: false
    requesterPaysEnabled: false
    resultEncryptionOption: ""
    resultOutputLocation: ""
    engineVersion: ""
    namingTemplate: "{namespace}-{name}"
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
